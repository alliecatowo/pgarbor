[project]
name = "pgarbor-harness"
version = "0.1.0"
description = "PGArbor verification harness (PG18 oracle, differential runner, comparator) and RightShift factory"
requires-python = ">=3.12"
license = "Apache-2.0 OR MIT"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pgarbor-harness = "pgarbor_harness.cli:main"
pgarbor-factory = "pgarbor_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pgarbor_harness", "pgarbor_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "oracle: needs the pinned PG18 container (podman); skipped unless PGARBOR_ORACLE=1",
  "slow: long-running (regress/isolation suites)",
]
