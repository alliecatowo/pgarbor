# The payload must be a simple string literal; escape strings, dollar-quoted strings and U& strings are all literals and accepted.
id: cmd-notify.payload-literal-forms
title: NOTIFY accepts escape, dollar-quoted and Unicode-escape string literal payloads
family: cmd-notify
tier: core
feature_ids: [notify, notify-payload, string-literals]
required_capabilities: [listen-notify, select]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify (Parameters: payload must be specified as a simple string literal)"
sessions: [a]
steps:
  - sql: |
      NOTIFY lit_ch, E'line one\nline two'
    expect: ok
  - sql: |
      NOTIFY lit_ch, $$dollar 'quoted' payload$$
    expect: ok
  - sql: |
      NOTIFY lit_ch, U&'\0061\0062'
    expect: ok
  - sql: |
      NOTIFY lit_ch, 'it''s doubled'
    expect: ok
