# pg_notification_queue_usage returns a fraction between 0 and 1, and LISTEN/UNLISTEN do not change its type.
id: cmd-notify.queue-usage-fraction
title: pg_notification_queue_usage returns a fraction within zero to one
family: cmd-notify
tier: extended
feature_ids: [notify, pg-notification-queue-usage, listen-notify]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify (Notes: pg_notification_queue_usage)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_notification_queue_usage() >= 0 AND pg_notification_queue_usage() <= 1 AS in_range
    expect: rows
    comment: the queue is cluster-wide, so only the range is asserted
  - sql: |
      SELECT pg_typeof(pg_notification_queue_usage())::text AS result_type
    expect: rows
  - sql: |
      LISTEN queue_ch
    expect: ok
  - sql: |
      NOTIFY queue_ch, 'probe'
    expect: ok
  - sql: |
      SELECT pg_notification_queue_usage() < 1 AS below_full
    expect: rows
