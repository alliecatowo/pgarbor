# The channel is an identifier: a missing channel, a string-literal channel, a reserved keyword and an empty quoted identifier are syntax errors; a quoted keyword is fine.
id: cmd-notify.channel-syntax-errors
title: NOTIFY channel must be an identifier and reserved words need quoting
family: cmd-notify
tier: core
feature_ids: [notify, syntax-errors, identifier-quoting]
required_capabilities: [listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify (Parameters: channel, any identifier)"
sessions: [a]
steps:
  - sql: |
      NOTIFY
    expect: error
    sqlstate: "42601"
  - sql: |
      NOTIFY 'ch'
    expect: error
    sqlstate: "42601"
    comment: a string literal is not an identifier
  - sql: |
      NOTIFY select
    expect: error
    sqlstate: "42601"
    comment: reserved keyword as unquoted channel
  - sql: |
      NOTIFY ""
    expect: error
    sqlstate: "42601"
    comment: zero-length delimited identifier
  - sql: |
      NOTIFY "select"
    expect: ok
    comment: quoted keyword is a valid channel name
