# pg_notify takes exactly two text arguments and returns void; other arities and non-text arguments do not match.
id: cmd-notify.pg-notify-signature
title: pg_notify returns void and has no one-argument or integer-argument overload
family: cmd-notify
tier: core
feature_ids: [pg-notify-function, function-resolution, void-result]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#pg_notify (pg_notify(text, text))"
sessions: [a]
steps:
  - sql: |
      SELECT pg_notify('sig_ch', 'p') IS NULL AS is_null
    expect: rows
    comment: void is not SQL NULL
  - sql: |
      SELECT pg_notify('sig_ch', 'p')::text AS as_text
    expect: rows
  - sql: |
      SELECT pg_notify('sig_ch')
    expect: error
    sqlstate: "42883"
    comment: one argument does not match pg_notify(text, text)
  - sql: |
      SELECT pg_notify(1, 'x')
    expect: error
    sqlstate: "42883"
    comment: integer channel does not match text
  - sql: |
      SELECT pg_notify('sig_ch', 1)
    expect: error
    sqlstate: "42883"
    comment: integer payload does not match text
