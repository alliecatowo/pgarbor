# The payload limit is strictly less than 8000 bytes: 7999 bytes is accepted and 8000 bytes is rejected. Length is in bytes, not characters.
id: cmd-notify.payload-length-boundary
title: Payload limit is under 8000 bytes and counts bytes not characters
family: cmd-notify
tier: core
feature_ids: [notify, pg-notify-function, notify-payload-limit]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify (Parameters: payload; default configuration shorter than 8000 bytes)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_notify('len_ch', repeat('x', 7999))
    expect: rows
    comment: 7999 bytes is the largest accepted payload
  - sql: |
      SELECT pg_notify('len_ch', repeat('x', 8000))
    expect: error
    sqlstate: "22023"
    comment: 8000 bytes is rejected
  - sql: |
      SELECT pg_notify('len_ch', repeat('é', 3999))
    expect: rows
    comment: each e-acute is 2 bytes, so 3999 of them is 7998 bytes
  - sql: |
      SELECT pg_notify('len_ch', repeat('é', 4000))
    expect: error
    sqlstate: "22023"
    comment: 4000 e-acutes is exactly 8000 bytes
  - sql: |
      NOTIFY len_ch, 'short'
    expect: ok
    comment: a short literal payload still works after the rejected calls
