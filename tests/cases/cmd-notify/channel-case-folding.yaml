# Unquoted LISTEN channel names fold to lower case; quoted names keep case; duplicate LISTEN collapses to one channel.
id: cmd-notify.channel-case-folding
title: LISTEN folds unquoted channel names and keeps quoted ones distinct
family: cmd-notify
tier: core
feature_ids: [listen-notify, notify, identifier-folding, pg-listening-channels]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify (Parameters: channel is any identifier); ref/listen.sgml (channel as identifier)"
sessions: [a]
steps:
  - sql: |
      LISTEN Foo
    expect: ok
  - sql: |
      LISTEN "Foo"
    expect: ok
  - sql: |
      LISTEN foo
    expect: ok
    comment: same channel as the unquoted Foo, so no new entry
  - sql: |
      SELECT pg_listening_channels() AS channel ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      NOTIFY Foo, 'folded'
    expect: ok
    comment: unquoted NOTIFY folds to foo
  - sql: |
      NOTIFY "FOO"
    expect: ok
