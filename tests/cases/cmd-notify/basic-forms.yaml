# NOTIFY accepts a bare channel, a channel with a literal payload, an empty payload, and a quoted identifier channel.
id: cmd-notify.basic-forms
title: NOTIFY accepts channel only, channel with payload, empty payload, and quoted channel
family: cmd-notify
tier: core
feature_ids: [notify, listen-notify, notify-payload]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify (Synopsis; Parameters: channel, payload)"
sessions: [a]
steps:
  - sql: |
      LISTEN basic_ch
    expect: ok
  - sql: |
      NOTIFY basic_ch
    expect: ok
    comment: channel only, payload defaults to empty string
  - sql: |
      NOTIFY basic_ch, 'This is the payload'
    expect: ok
  - sql: |
      NOTIFY basic_ch, ''
    expect: ok
    comment: explicit empty payload is allowed
  - sql: |
      NOTIFY "Basic_Mixed"
    expect: ok
    comment: a double-quoted identifier keeps its case
  - sql: |
      SELECT pg_listening_channels() AS channel ORDER BY 1
    expect: rows
    order: ordered
