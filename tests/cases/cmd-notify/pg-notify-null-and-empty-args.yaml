# pg_notify is not strict: a NULL payload is accepted, but a NULL or empty channel name is rejected.
id: cmd-notify.pg-notify-null-and-empty-args
title: pg_notify accepts NULL payload but rejects NULL and empty channel names
family: cmd-notify
tier: core
feature_ids: [pg-notify-function, notify-payload, null-semantics]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#pg_notify (function takes channel as first and payload as second argument)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_notify('null_ch', NULL)
    expect: rows
    comment: NULL payload is passed through and returns void
  - sql: |
      SELECT pg_notify(NULL, 'x')
    expect: error
    sqlstate: "22023"
    comment: NULL channel name is treated as an empty channel name
  - sql: |
      SELECT pg_notify('', 'x')
    expect: error
    sqlstate: "22023"
    comment: empty channel name
  - sql: |
      SELECT pg_notify(NULL, NULL)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT pg_notify(NULLIF('', ''), 'x')
    expect: error
    sqlstate: "22023"
    comment: a channel expression that evaluates to NULL
