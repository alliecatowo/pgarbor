# Documented psql example: LISTEN, NOTIFY with and without payload, and pg_notify with computed names.
id: cmd-notify.doc-example-listen-notify
title: Documented LISTEN NOTIFY sequence including pg_notify with concatenated arguments
family: cmd-notify
tier: core
feature_ids: [notify, listen-notify, pg-notify-function, notify-payload]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify-examples; ref/notify.sgml#pg_notify"
sessions: [a]
steps:
  - sql: |
      LISTEN virtual
    expect: ok
  - sql: |
      NOTIFY virtual
    expect: ok
  - sql: |
      NOTIFY virtual, 'This is the payload'
    expect: ok
  - sql: |
      LISTEN foo
    expect: ok
  - sql: |
      SELECT pg_notify('fo' || 'o', 'pay' || 'load')
    expect: rows
    comment: pg_notify returns void, one row with an empty value
  - sql: |
      SELECT pg_listening_channels() AS channel ORDER BY 1
    expect: rows
    order: ordered
