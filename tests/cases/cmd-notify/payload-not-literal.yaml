# The payload must be a simple string literal: expressions, casts, typed literals, NULL and missing commas are syntax errors.
id: cmd-notify.payload-not-literal
title: NOTIFY rejects non-literal payloads with syntax errors
family: cmd-notify
tier: core
feature_ids: [notify, notify-payload, syntax-errors]
required_capabilities: [listen-notify]
provenance:
  source: pg-docs
  ref: "ref/notify.sgml#sql-notify (Parameters: payload must be specified as a simple string literal)"
sessions: [a]
steps:
  - sql: |
      NOTIFY ch, 'a' || 'b'
    expect: error
    sqlstate: "42601"
  - sql: |
      NOTIFY ch, NULL
    expect: error
    sqlstate: "42601"
  - sql: |
      NOTIFY ch, 'x'::text
    expect: error
    sqlstate: "42601"
  - sql: |
      NOTIFY ch, text 'x'
    expect: error
    sqlstate: "42601"
  - sql: |
      NOTIFY ch 'x'
    expect: error
    sqlstate: "42601"
    comment: missing comma between channel and payload
  - sql: |
      NOTIFY ch, 'p', 'q'
    expect: error
    sqlstate: "42601"
  - sql: |
      PREPARE pn_notify(text) AS NOTIFY $1
    expect: error
    sqlstate: "42601"
    comment: NOTIFY takes no parameter placeholders
