# NULL handling in UPDATE: arithmetic on NULL stays NULL, IS NULL predicates select rows, and = NULL matches nothing.
id: update.null-propagation
title: NULL propagates through SET expressions and NULL predicates select rows in UPDATE
family: update
tier: core
feature_ids: [update, null-semantics, expressions]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: hand
  ref: "PG18 docs functions-comparison.html (IS NULL, = NULL is unknown)"
sessions: [a]
setup: |
  CREATE TABLE nn (id INT PRIMARY KEY, v INT, t TEXT);
  INSERT INTO nn VALUES (1, 10, 'a'), (2, NULL, NULL), (3, NULL, 'c');
steps:
  - sql: |
      UPDATE nn SET v = v + 1, t = coalesce(t, 'filled') WHERE v = NULL
    expect: ok
  - sql: |
      UPDATE nn SET v = v + 1, t = coalesce(t, 'filled') WHERE v IS NULL
    expect: ok
  - sql: |
      SELECT id, v, t, v IS NULL AS v_null FROM nn ORDER BY id
    expect: rows
    order: ordered
