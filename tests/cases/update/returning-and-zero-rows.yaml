# UPDATE ... RETURNING returns the new values per row, and an UPDATE matching no rows returns nothing.
id: update.returning-and-zero-rows
title: UPDATE RETURNING yields new values; a non-matching UPDATE returns no rows and changes nothing
family: update
tier: core
feature_ids: [update, returning]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (RETURNING with UPDATE; zero-row update)"
sessions: [a]
setup: |
  CREATE TABLE r (id INT PRIMARY KEY, v INT);
  INSERT INTO r VALUES (1, 10), (2, 20), (3, 30);
steps:
  - sql: |
      UPDATE r SET v = v * 2 WHERE id >= 2 RETURNING id, v
    expect: rows
    order: multiset
  - sql: |
      UPDATE r SET v = -1 WHERE id = 999 RETURNING id, v
    expect: rows
    order: multiset
  - sql: |
      SELECT id, v FROM r ORDER BY id
    expect: rows
    order: ordered
