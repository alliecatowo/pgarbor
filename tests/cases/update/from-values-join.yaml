# UPDATE with a FROM clause over a VALUES list, joined on a column.
id: update.from-values-join
title: UPDATE ... FROM VALUES joins on a column and updates only matching rows
family: update
tier: core
feature_ids: [update, from-clause, values-list]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (Test VALUES in FROM)"
sessions: [a]
setup: |
  CREATE TABLE update_test (a INT, b INT, c TEXT);
  INSERT INTO update_test VALUES (5, 10, 'foo'), (15, 20, 'bar'), (25, 30, 'baz');
steps:
  - sql: |
      UPDATE update_test SET a = v.i FROM (VALUES (100, 20)) AS v(i, j)
        WHERE update_test.b = v.j
    expect: ok
  - sql: |
      SELECT a, b, c FROM update_test ORDER BY b
    expect: rows
    order: ordered
  - sql: |
      UPDATE update_test SET a = v.* FROM (VALUES (100, 20)) AS v(i, j)
        WHERE update_test.b = v.j
    expect: error
  - sql: |
      SELECT a, b, c FROM update_test ORDER BY b
    expect: rows
    order: ordered
