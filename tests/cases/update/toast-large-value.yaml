# Updating a column to a value large enough to be TOASTed, then reading its length.
id: update.toast-large-value
title: UPDATE to a 10000-character value round-trips through TOAST storage
family: update
tier: extended
feature_ids: [update, text, toast]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (Make sure that we can update to a TOASTed value)"
sessions: [a]
setup: |
  CREATE TABLE toast_upd (a INT, b INT, c TEXT);
  INSERT INTO toast_upd VALUES (1, 2, 'car'), (3, 4, 'foo');
steps:
  - sql: |
      UPDATE toast_upd SET c = repeat('x', 10000) WHERE c = 'car'
    expect: ok
  - sql: |
      SELECT a, b, char_length(c) AS len, left(c, 3) AS head FROM toast_upd ORDER BY a
    expect: rows
    order: ordered
