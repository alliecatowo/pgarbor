# UPDATE through a view with WITH CHECK OPTION: rows that leave the view predicate are rejected.
id: update.with-check-option-view
title: UPDATE through an updatable view enforces WITH CHECK OPTION
family: update
tier: core
feature_ids: [update, views, check-option]
required_capabilities: [create-table, create-view, insert, select, update, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (updatable view WITH CHECK OPTION)"
sessions: [a]
setup: |
  CREATE TABLE vbase (k INT PRIMARY KEY, v INT);
  INSERT INTO vbase VALUES (1, 5), (2, -3);
  CREATE VIEW vpos AS SELECT k, v FROM vbase WHERE v > 0 WITH CHECK OPTION;
steps:
  - sql: |
      UPDATE vpos SET v = 9 WHERE k = 1
    expect: ok
  - sql: |
      UPDATE vpos SET v = -9 WHERE k = 1
    expect: error
    sqlstate: "44000"
  - sql: |
      SELECT k, v FROM vbase ORDER BY k
    expect: rows
    order: ordered
