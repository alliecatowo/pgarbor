# INSERT ... ON CONFLICT DO UPDATE using EXCLUDED values, with RETURNING of both paths.
id: update.on-conflict-excluded
title: ON CONFLICT DO UPDATE merges EXCLUDED values into the existing row and returns the result
family: update
tier: core
feature_ids: [update, insert-conflict, returning]
required_capabilities: [create-table, insert, select, update, insert-conflict]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (Test ON CONFLICT DO UPDATE, EXCLUDED.* alias)"
sessions: [a]
setup: |
  CREATE TABLE upsert_t (a INT PRIMARY KEY, b TEXT);
  INSERT INTO upsert_t VALUES (1, 'Boo'), (3, 'Zoo');
steps:
  - sql: |
      INSERT INTO upsert_t VALUES (1, 'Bat'), (2, 'Beeble')
        ON CONFLICT (a) DO UPDATE SET b = upsert_t.b || ', ' || excluded.b
        RETURNING a, b
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b FROM upsert_t ORDER BY a
    expect: rows
    order: ordered
