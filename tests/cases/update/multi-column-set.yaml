# Row-style multiple assignment SET (c,b,a) = (...) with DEFAULT, column references and expressions.
id: update.multi-column-set
title: Multiple-column SET assignments with DEFAULT, column references and an error for duplicate targets
family: update
tier: core
feature_ids: [update, multi-column-assignment, column-default]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (Test multiple-set-clause syntax)"
sessions: [a]
setup: |
  CREATE TABLE update_test (a INT DEFAULT 10, b INT, c TEXT);
  INSERT INTO update_test VALUES (5, 10, 'foo'), (15, 10, 'foo');
steps:
  - sql: |
      UPDATE update_test SET (c, b, a) = ('bugle', b + 11, DEFAULT) WHERE c = 'foo'
    expect: ok
  - sql: |
      SELECT a, b, c FROM update_test ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      UPDATE update_test SET (c, b) = ('car', a + b), a = a + 1 WHERE a = 10
    expect: ok
  - sql: |
      SELECT a, b, c FROM update_test ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      UPDATE update_test SET (c, b) = ('car', a + b), b = a + 1 WHERE a = 10
    expect: error
    sqlstate: "42601"
