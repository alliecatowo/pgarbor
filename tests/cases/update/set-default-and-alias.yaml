# UPDATE ... SET col = DEFAULT, table aliases, and alias-qualified expressions on the right-hand side.
id: update.set-default-and-alias
title: UPDATE sets a column to DEFAULT and works with a target table alias
family: update
tier: core
feature_ids: [update, column-default, table-alias]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (UPDATE syntax tests: DEFAULT, AS t, t.b + 10)"
sessions: [a]
setup: |
  CREATE TABLE update_test (a INT DEFAULT 10, b INT, c TEXT);
  INSERT INTO update_test VALUES (5, 10, 'foo');
  INSERT INTO update_test(b, a) VALUES (15, 10);
steps:
  - sql: |
      UPDATE update_test SET a = DEFAULT, b = DEFAULT
    expect: ok
  - sql: |
      SELECT a, b, c FROM update_test ORDER BY a, b, c NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      UPDATE update_test AS t SET b = 10 WHERE t.a = 10
    expect: ok
  - sql: |
      UPDATE update_test t SET b = t.b + 10 WHERE t.a = 10
    expect: ok
  - sql: |
      SELECT a, b, c FROM update_test ORDER BY a, b, c NULLS LAST
    expect: rows
    order: ordered
