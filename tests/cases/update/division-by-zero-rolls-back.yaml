# A runtime error partway through a multi-row UPDATE leaves no rows changed (statement atomicity).
id: update.division-by-zero-rolls-back
title: Runtime error in an UPDATE expression aborts the whole statement
family: update
tier: core
feature_ids: [update, errors, expressions]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: hand
  ref: "PG18 docs sql-update.html; errcodes 22012 division_by_zero"
sessions: [a]
setup: |
  CREATE TABLE dz (id INT PRIMARY KEY, d INT, r INT);
  INSERT INTO dz VALUES (1, 2, 0), (2, 1, 0), (3, 0, 0);
steps:
  - sql: |
      UPDATE dz SET r = 100 / d
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT id, r FROM dz ORDER BY id
    expect: rows
    order: ordered
