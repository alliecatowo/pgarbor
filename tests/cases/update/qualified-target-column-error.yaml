# The SET target column must not be qualified with the table name or alias.
id: update.qualified-target-column-error
title: Qualifying the SET target column with the table alias is a syntax error
family: update
tier: core
feature_ids: [update, errors]
required_capabilities: [create-table, insert, update, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/update.sql (error, you're not supposed to qualify the target column)"
sessions: [a]
setup: |
  CREATE TABLE update_test (a INT, b INT);
  INSERT INTO update_test VALUES (10, 1);
steps:
  - sql: |
      UPDATE update_test t SET t.b = t.b + 10 WHERE t.a = 10
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT a, b FROM update_test
    expect: rows
    order: ordered
