# Two proposed rows that conflict with the same existing row in one command is a cardinality error.
id: update.on-conflict-second-time-error
title: ON CONFLICT DO UPDATE cannot affect the same row twice in one command
family: update
tier: core
feature_ids: [update, insert-conflict, errors]
required_capabilities: [create-table, insert, select, update, insert-conflict, errors]
provenance:
  source: pg-regress
  ref: "PG18 source nodeModifyTable.c: ON CONFLICT DO UPDATE command cannot affect row a second time"
sessions: [a]
setup: |
  CREATE TABLE upsert_dup (a INT PRIMARY KEY, b TEXT);
  INSERT INTO upsert_dup VALUES (1, 'Boo');
steps:
  - sql: |
      INSERT INTO upsert_dup VALUES (1, 'first'), (1, 'second')
        ON CONFLICT (a) DO UPDATE SET b = excluded.b
    expect: error
    sqlstate: "21000"
  - sql: |
      SELECT a, b FROM upsert_dup ORDER BY a
    expect: rows
    order: ordered
