# Constraint violations during UPDATE: NOT NULL and CHECK, each leaving the table unchanged.
id: update.not-null-and-check-errors
title: UPDATE violating NOT NULL or CHECK fails and leaves all rows unchanged
family: update
tier: core
feature_ids: [update, constraints, errors]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: hand
  ref: "PG18 docs ddl-constraints.html; errcodes 23502, 23514"
sessions: [a]
setup: |
  CREATE TABLE cons (id INT PRIMARY KEY, n INT NOT NULL, q INT CHECK (q >= 0));
  INSERT INTO cons VALUES (1, 5, 1), (2, 6, 2);
steps:
  - sql: |
      UPDATE cons SET n = NULL WHERE id = 1
    expect: error
    sqlstate: "23502"
  - sql: |
      UPDATE cons SET q = q - 5
    expect: error
    sqlstate: "23514"
  - sql: |
      SELECT id, n, q FROM cons ORDER BY id
    expect: rows
    order: ordered
