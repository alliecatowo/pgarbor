# setval rejects values outside the sequence MINVALUE..MAXVALUE with numeric_value_out_of_range.
id: sequence.setval-bounds
title: setval rejects out-of-range values (22003) and accepts the boundary values
family: sequence
tier: core
feature_ids: [sequences, setval, errors]
required_capabilities: [create-table, select, errors, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sequence.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE SEQUENCE sq_b INCREMENT BY 4 MINVALUE 5 MAXVALUE 36 START 32 CYCLE;
steps:
  - sql: |
      SELECT setval('sq_b', -100)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT setval('sq_b', 100)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT setval('sq_b', 36) AS v
    expect: rows
    comment: maximum bound is accepted
  - sql: |
      SELECT setval('sq_b', 5) AS v
    expect: rows
    comment: minimum bound is accepted
  - sql: |
      SELECT setval('sq_b', 37)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT nextval('sq_b') AS v
    expect: rows
    comment: after setval to 5 the next value is 9 (increment 4)
