# Descending sequence with negative START and NO CYCLE errors at MINVALUE with 2200H.
id: sequence.descending-no-cycle-limit
title: Descending sequence with negative bounds errors with 2200H at MINVALUE when NO CYCLE
family: sequence
tier: extended
feature_ids: [sequences, descending, errors]
required_capabilities: [create-table, select, errors, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sequence.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE SEQUENCE sq_d INCREMENT BY -4 MINVALUE -36 MAXVALUE -5 START -24 NO CYCLE;
steps:
  - sql: |
      SELECT nextval('sq_d') AS v
    expect: rows
    comment: -24
  - sql: |
      SELECT nextval('sq_d') AS v
    expect: rows
    comment: -28
  - sql: |
      SELECT nextval('sq_d') AS v
    expect: rows
    comment: -32
  - sql: |
      SELECT nextval('sq_d') AS v
    expect: rows
    comment: -36
  - sql: |
      SELECT nextval('sq_d')
    expect: error
    sqlstate: "2200H"
