# lastval tracks the most recent nextval or setval(is_called=true) in the session; DISCARD SEQUENCES clears it.
id: sequence.lastval-discard
title: lastval follows nextval and setval, and DISCARD SEQUENCES makes it undefined again
family: sequence
tier: core
feature_ids: [sequences, lastval, discard, setval]
required_capabilities: [create-table, select, errors, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sequence.sql (lastval section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE SEQUENCE sq_l;
  CREATE SEQUENCE sq_l2;
steps:
  - sql: |
      SELECT nextval('sq_l') AS v
    expect: rows
  - sql: |
      SELECT lastval() AS v
    expect: rows
    comment: 1
  - sql: |
      SELECT setval('sq_l', 99) AS v
    expect: rows
  - sql: |
      SELECT lastval() AS v
    expect: rows
    comment: 99
  - sql: |
      DISCARD SEQUENCES
    expect: ok
  - sql: |
      SELECT lastval()
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT nextval('sq_l2') AS v
    expect: rows
  - sql: |
      SELECT lastval() AS v
    expect: rows
