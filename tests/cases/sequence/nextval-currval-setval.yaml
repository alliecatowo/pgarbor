# Basic sequence functions: nextval, currval, setval with and without is_called, text and regclass refs.
id: sequence.nextval-currval-setval
title: nextval/currval/setval semantics including is_called=false and text vs regclass arguments
family: sequence
tier: core
feature_ids: [sequences, nextval, currval, setval]
required_capabilities: [create-table, select, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sequence.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE SEQUENCE sq1;
steps:
  - sql: |
      SELECT nextval('sq1'::text) AS v
    expect: rows
  - sql: |
      SELECT nextval('sq1'::regclass) AS v
    expect: rows
  - sql: |
      SELECT currval('sq1'::text) AS v
    expect: rows
    comment: currval repeats the last value returned by nextval in this session
  - sql: |
      SELECT setval('sq1'::text, 32) AS v
    expect: rows
    comment: setval with default is_called=true returns the set value
  - sql: |
      SELECT nextval('sq1'::regclass) AS v
    expect: rows
    comment: next value after 32 is 33
  - sql: |
      SELECT setval('sq1'::regclass, 99, false) AS v
    expect: rows
  - sql: |
      SELECT nextval('sq1'::text) AS v
    expect: rows
    comment: is_called=false makes 99 the next value returned
  - sql: |
      SELECT setval('sq1'::regclass, 32) AS v
    expect: rows
  - sql: |
      SELECT nextval('sq1'::text) AS v, currval('sq1'::regclass) AS cur
    expect: rows
