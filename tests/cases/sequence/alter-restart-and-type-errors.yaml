# ALTER SEQUENCE error paths: RESTART outside bounds (22023), CYCLE on a table (42809), DROP of a missing sequence (42P01).
id: sequence.alter-restart-and-type-errors
title: ALTER SEQUENCE RESTART bounds, wrong object type, and missing sequence errors
family: sequence
tier: core
feature_ids: [sequences, alter-sequence, errors, drop]
required_capabilities: [create-table, select, errors, sequences, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sequence.sql (ALTER SEQUENCE section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE SEQUENCE sq_r MINVALUE 1 MAXVALUE 10;
  CREATE TABLE not_seq (a int);
steps:
  - sql: |
      ALTER SEQUENCE sq_r RESTART WITH 0
    expect: error
    sqlstate: "22023"
    comment: below MINVALUE 1
  - sql: |
      ALTER SEQUENCE sq_r RESTART WITH 11
    expect: error
    sqlstate: "22023"
    comment: above MAXVALUE 10
  - sql: |
      ALTER SEQUENCE not_seq CYCLE
    expect: error
    sqlstate: "42809"
    comment: a table is not a sequence
  - sql: |
      DROP SEQUENCE sq_r
    expect: ok
  - sql: |
      DROP SEQUENCE sq_r
    expect: error
    sqlstate: "42P01"
