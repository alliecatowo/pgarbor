# CREATE SEQUENCE option validation: each invalid option combination is rejected with 22023.
id: sequence.create-option-errors
title: CREATE SEQUENCE rejects zero increment, bad MINVALUE/MAXVALUE/START and zero CACHE
family: sequence
tier: core
feature_ids: [sequences, create-sequence, errors]
required_capabilities: [create-table, select, errors, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sequence.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE sq_bad INCREMENT BY 0
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE SEQUENCE sq_bad INCREMENT BY -1 MINVALUE 20
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE SEQUENCE sq_bad INCREMENT BY 1 MAXVALUE -20
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE SEQUENCE sq_bad INCREMENT BY -1 START 10
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE SEQUENCE sq_bad INCREMENT BY 1 START -10
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE SEQUENCE sq_bad CACHE 0
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT count(*) AS leftover FROM pg_class WHERE relname = 'sq_bad'
    expect: rows
    comment: failed CREATE must leave no relation behind
