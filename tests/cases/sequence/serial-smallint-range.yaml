# smallserial and serial2 columns reject values outside smallint range with 22003 and accept the extremes.
id: sequence.serial-smallint-range
title: smallserial column accepts smallint extremes and rejects out-of-range values with 22003
family: sequence
tier: extended
feature_ids: [sequences, serial, smallint, errors, boundaries]
required_capabilities: [create-table, insert, select, errors, sequences, int2]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sequence.sql (serialTest2 smallserial cases)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE st2 (f1 text, f3 smallserial);
steps:
  - sql: |
      INSERT INTO st2 (f1) VALUES ('test_defaults')
    expect: ok
  - sql: |
      INSERT INTO st2 (f1, f3) VALUES ('test_max', 32767), ('test_min', -32768)
    expect: ok
  - sql: |
      INSERT INTO st2 (f1, f3) VALUES ('bogus_low', -32769)
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO st2 (f1, f3) VALUES ('bogus_high', 32768)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT f1, f3 FROM st2 ORDER BY f3
    expect: rows
    order: ordered
