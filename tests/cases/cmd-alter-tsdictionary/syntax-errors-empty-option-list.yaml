# Documented synopsis: at least one option is required inside the parentheses, and a bare ALTER needs an action.
id: cmd-alter-tsdictionary.syntax-errors-empty-option-list
title: "ALTER TEXT SEARCH DICTIONARY rejects an empty option list and a missing action"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, syntax, errors]
required_capabilities: [create-text-search-dictionary, alter-text-search-dictionary, text-search, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (Synopsis)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY o_dict (TEMPLATE = simple);
steps:
  - sql: |
      ALTER TEXT SEARCH DICTIONARY o_dict ()
    expect: error
    sqlstate: "42601"
  - sql: |
      ALTER TEXT SEARCH DICTIONARY o_dict
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'o_dict'
    expect: rows
    comment: nothing changed
