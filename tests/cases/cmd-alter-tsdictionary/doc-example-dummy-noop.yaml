# Documented example: ALTER TEXT SEARCH DICTIONARY my_dict ( dummy ) succeeds and changes nothing because removing a missing option is not an error.
id: cmd-alter-tsdictionary.doc-example-dummy-noop
title: "ALTER with a bare unknown option name is a no-op that succeeds"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, option-removal, no-op-reload]
required_capabilities: [create-text-search-dictionary, alter-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (Examples: 'dummy' updates the definition without changing anything)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY my_dict (TEMPLATE = snowball, language = english, stopwords = english);
steps:
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'my_dict'
    expect: rows
  - sql: |
      ALTER TEXT SEARCH DICTIONARY my_dict ( dummy )
    expect: ok
    comment: the option-removal code does not complain when the option does not exist
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'my_dict'
    expect: rows
    comment: stored options are identical to before the ALTER
  - sql: |
      SELECT ts_lexize('my_dict', 'the'), ts_lexize('my_dict', 'running')
    expect: rows
    comment: behavior unchanged
