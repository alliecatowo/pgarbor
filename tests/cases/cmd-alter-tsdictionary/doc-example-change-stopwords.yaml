# Documented example: ALTER TEXT SEARCH DICTIONARY my_dict ( StopWords = newrussian ) (doc uses a placeholder stopword file; 'russian' ships with PG).
id: cmd-alter-tsdictionary.doc-example-change-stopwords
title: "ALTER TEXT SEARCH DICTIONARY changes only the stopwords option of a Snowball dictionary"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, snowball-template, stopwords-option, template-option]
required_capabilities: [create-text-search-dictionary, alter-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (Examples: change the stopword list for a Snowball-based dictionary)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY my_dict (TEMPLATE = snowball, language = english, stopwords = english);
steps:
  - sql: |
      SELECT ts_lexize('my_dict', 'the'), ts_lexize('my_dict', 'running')
    expect: rows
    comment: english stopword list removes 'the'; english stemmer maps 'running' to 'run'
  - sql: |
      ALTER TEXT SEARCH DICTIONARY my_dict ( StopWords = russian )
    expect: ok
    comment: the doc's 'newrussian' is a placeholder; 'russian' is the shipped stopword file
  - sql: |
      SELECT ts_lexize('my_dict', 'the'), ts_lexize('my_dict', 'running')
    expect: rows
    comment: "'the' is no longer a stopword; the language option is unchanged so 'running' still stems to 'run'"
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'my_dict'
    expect: rows
    comment: language is kept and only stopwords changed
