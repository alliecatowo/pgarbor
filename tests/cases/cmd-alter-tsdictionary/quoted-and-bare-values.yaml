# Documented syntax: option values may be identifiers or string literals; both set the same value.
id: cmd-alter-tsdictionary.quoted-and-bare-values
title: "Quoted and bare option values set the same stored option"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, template-option, string-literal-values]
required_capabilities: [create-text-search-dictionary, alter-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (option [ = value ] syntax)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY my_dict (TEMPLATE = snowball, language = english);
steps:
  - sql: |
      ALTER TEXT SEARCH DICTIONARY my_dict ( stopwords = 'russian' )
    expect: ok
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'my_dict'
    expect: rows
  - sql: |
      ALTER TEXT SEARCH DICTIONARY my_dict ( stopwords = russian )
    expect: ok
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'my_dict'
    expect: rows
    comment: identical stored option text regardless of quoting
