# Documented: SET SCHEMA moves the dictionary; the old unqualified name stops resolving.
id: cmd-alter-tsdictionary.set-schema-moves-and-hides
title: "SET SCHEMA moves a dictionary, after which only the qualified name resolves"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, set-schema, namespace, search-path]
required_capabilities: [create-schema, create-text-search-dictionary, alter-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (SET SCHEMA new_schema)"
sessions: [a]
setup: |
  CREATE SCHEMA ad_cmd_s2;
  CREATE TEXT SEARCH DICTIONARY l_dict (TEMPLATE = simple);
steps:
  - sql: |
      ALTER TEXT SEARCH DICTIONARY l_dict SET SCHEMA ad_cmd_s2
    expect: ok
  - sql: |
      SELECT n.nspname, d.dictname FROM pg_ts_dict d JOIN pg_namespace n ON n.oid = d.dictnamespace WHERE d.dictname = 'l_dict'
    expect: rows
    order: ordered
  - sql: |
      SELECT ts_lexize('ad_cmd_s2.l_dict', 'Hello')
    expect: rows
    comment: qualified name resolves in the new schema
  - sql: |
      SELECT ts_lexize('l_dict', 'Hello')
    expect: error
    sqlstate: "42704"
    comment: unqualified name is not on the search path after the move
