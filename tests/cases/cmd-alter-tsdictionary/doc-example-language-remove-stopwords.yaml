# Documented example: ALTER TEXT SEARCH DICTIONARY my_dict ( language = dutch, StopWords ) changes language and removes the stopwords option.
id: cmd-alter-tsdictionary.doc-example-language-remove-stopwords
title: "ALTER with language = dutch and a bare StopWords removes the stopword option"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, snowball-template, stopwords-option, option-removal]
required_capabilities: [create-text-search-dictionary, alter-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (Examples: change language to dutch and remove the stopword option)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY my_dict (TEMPLATE = snowball, language = english, stopwords = dutch);
steps:
  - sql: |
      SELECT ts_lexize('my_dict', 'de'), ts_lexize('my_dict', 'katten')
    expect: rows
    comment: "'de' is in the dutch stopword list; english stemmer leaves 'katten' unchanged"
  - sql: |
      ALTER TEXT SEARCH DICTIONARY my_dict ( language = dutch, StopWords )
    expect: ok
  - sql: |
      SELECT ts_lexize('my_dict', 'de'), ts_lexize('my_dict', 'katten')
    expect: rows
    comment: no stopword list now, so 'de' is kept; dutch stemmer maps 'katten' to 'kat'
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'my_dict'
    expect: rows
    comment: only language remains in the stored options
