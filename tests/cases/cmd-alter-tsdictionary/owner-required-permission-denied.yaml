# Documented: you must be the owner of the dictionary to use ALTER TEXT SEARCH DICTIONARY.
id: cmd-alter-tsdictionary.owner-required-permission-denied
title: "A non-owner cannot ALTER a text search dictionary (options or rename)"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, owner, privileges, errors]
required_capabilities: [create-role, create-text-search-dictionary, alter-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (Description: you must be the owner of the dictionary)"
sessions: [a]
setup: |
  CREATE ROLE tsd_perm_r1;
  CREATE TEXT SEARCH DICTIONARY i_dict (TEMPLATE = simple, accept = true);
steps:
  - sql: |
      SET ROLE tsd_perm_r1
    expect: ok
  - sql: |
      ALTER TEXT SEARCH DICTIONARY i_dict (accept = false)
    expect: error
    sqlstate: "42501"
    comment: 'must be owner of text search dictionary'
  - sql: |
      ALTER TEXT SEARCH DICTIONARY i_dict RENAME TO i2
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'i_dict'
    expect: rows
    comment: the rejected ALTER changed nothing
  - sql: |
      DROP TEXT SEARCH DICTIONARY i_dict
    expect: ok
  - sql: |
      DROP ROLE tsd_perm_r1
    expect: ok
