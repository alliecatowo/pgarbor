# Documented: template-specific options can appear in any order.
id: cmd-alter-tsdictionary.options-any-order
title: "Template options may be given in any order and both orders take effect"
family: cmd-alter-tsdictionary
tier: core
feature_ids: [alter-text-search-dictionary, template-option, option-order]
required_capabilities: [create-text-search-dictionary, alter-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsdictionary.sgml#sql-altertsdictionary (Template-specific options can appear in any order)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY my_dict (TEMPLATE = snowball, language = english);
steps:
  - sql: |
      ALTER TEXT SEARCH DICTIONARY my_dict ( stopwords = russian, language = english )
    expect: ok
  - sql: |
      SELECT ts_lexize('my_dict', 'the'), ts_lexize('my_dict', 'running')
    expect: rows
    comment: stopwords from the first option applied; english stemmer applied
  - sql: |
      ALTER TEXT SEARCH DICTIONARY my_dict ( language = english, stopwords = english )
    expect: ok
  - sql: |
      SELECT ts_lexize('my_dict', 'the'), ts_lexize('my_dict', 'running')
    expect: rows
    comment: reversed order with english stopwords now removes 'the'
