# Fixed-length bit(n) storage: exact-length values, NULL, length() and ordering.
id: bit.fixed-length-store
title: bit(n) stores exact-length values and orders them as bit strings
family: bit
tier: core
feature_ids: [bit-string, create-table, insert, select]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (BIT_TABLE)"
  license: PostgreSQL
steps:
  - sql: |
      CREATE TABLE bit_t (b bit(11))
    expect: ok
  - sql: |
      INSERT INTO bit_t VALUES (B'00000000000'), (B'11011000000'), (B'01010101010'), (NULL)
    expect: ok
  - sql: |
      SELECT b, length(b) AS lb FROM bit_t ORDER BY b
    expect: rows
    order: ordered
    comment: NULL sorts last under the default NULLS LAST for ASC
  - sql: |
      SELECT count(*) AS n, count(b) AS nn FROM bit_t
    expect: rows
