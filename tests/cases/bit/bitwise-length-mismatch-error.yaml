# AND, OR and XOR of bit strings with different lengths fail with 22026; equal lengths succeed.
id: bit.bitwise-length-mismatch-error
title: Bitwise AND OR XOR of unequal-length bit strings fails with 22026
family: bit
tier: core
feature_ids: [bit-string, bitwise-operators, errors]
required_capabilities: [select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (should fail)"
  license: PostgreSQL
steps:
  - sql: |
      SELECT B'001' & B'10'
    expect: error
    sqlstate: "22026"
  - sql: |
      SELECT B'0111' | B'011'
    expect: error
    sqlstate: "22026"
  - sql: |
      SELECT B'0010' # B'011101'
    expect: error
    sqlstate: "22026"
  - sql: |
      SELECT B'0101' & B'0011' AS and_ok
    expect: rows
