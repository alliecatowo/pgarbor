# pg_input_is_valid and pg_input_error_info for bit and bit varying inputs, valid and invalid.
id: bit.input-validity-functions
title: pg_input_is_valid and pg_input_error_info report bit input errors without raising
family: bit
tier: extended
feature_ids: [bit-string, pg-input-functions, errors]
required_capabilities: [select, bit-string, pg-input-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (non-error-throwing API)"
  license: PostgreSQL
steps:
  - sql: |
      SELECT pg_input_is_valid('01010001', 'bit(10)') AS ok
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('01010001', 'bit(8)') AS ok
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('01010Z01', 'bit(8)') AS ok
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('x01010Z01', 'bit(32)') AS ok
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('01010Z01', 'varbit') AS ok
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('01010001', 'bit(10)')
    expect: rows
    comment: length mismatch for bit(10)
  - sql: |
      SELECT * FROM pg_input_error_info('01010Z01', 'bit(8)')
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('x01010Z01', 'varbit')
    expect: rows
