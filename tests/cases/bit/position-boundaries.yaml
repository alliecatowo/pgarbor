# POSITION(substring IN bits) boundary cases: empty needle, empty haystack, no match, and offsets.
id: bit.position-boundaries
title: POSITION of bit substrings at boundaries, empty and absent needles
family: bit
tier: core
feature_ids: [bit-string, position, select]
required_capabilities: [select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (More position tests)"
  license: PostgreSQL
steps:
  - sql: |
      SELECT POSITION(B'1010' IN B'0000101') AS p
    expect: rows
  - sql: |
      SELECT POSITION(B'1010' IN B'00001010') AS p
    expect: rows
  - sql: |
      SELECT POSITION(B'1010' IN B'00000101') AS p
    expect: rows
  - sql: |
      SELECT POSITION(B'' IN B'00001010') AS p
    expect: rows
    comment: empty needle
  - sql: |
      SELECT POSITION(B'0' IN B'') AS p
    expect: rows
    comment: non-empty needle in empty haystack
  - sql: |
      SELECT POSITION(B'' IN B'') AS p
    expect: rows
  - sql: |
      SELECT POSITION(B'101101' IN B'001011011011011000') AS p
    expect: rows
  - sql: |
      SELECT POSITION(B'1011011011011' IN B'00001011011011011') AS p
    expect: rows
  - sql: |
      SELECT POSITION(B'111010110' IN B'11101011') AS p
    expect: rows
    comment: needle longer than haystack
  - sql: |
      SELECT POSITION(B'111010110' IN B'000001110101111101011') AS p
    expect: rows
  - sql: |
      SELECT POSITION(B'111010110' IN B'00000011101011111010110') AS p
    expect: rows
