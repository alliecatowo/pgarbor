# Bit and hex-bit literals with embedded or trailing spaces are invalid input (22P02).
id: bit.literal-syntax-errors
title: Bit and hex bit literals with spaces are rejected with 22P02
family: bit
tier: core
feature_ids: [bit-string, literals, errors]
required_capabilities: [select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (literals with syntax errors)"
  license: PostgreSQL
steps:
  - sql: |
      SELECT b' 0'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT b'0 '
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT x' 0'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT x'0 '
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT B'0101' || B'1'
    expect: rows
    comment: a valid literal still works after the failures
