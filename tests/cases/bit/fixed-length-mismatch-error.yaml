# bit(n) rejects values whose length differs from n, in both directions, without partial insert.
id: bit.fixed-length-mismatch-error
title: bit(n) insert of too-short or too-long bit string fails with 22026
family: bit
tier: core
feature_ids: [bit-string, constraints, errors, insert]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (BIT_TABLE too short / too long)"
  license: PostgreSQL
setup: |
  CREATE TABLE bit_t (b bit(11));
steps:
  - sql: |
      INSERT INTO bit_t VALUES (B'10')
    expect: error
    sqlstate: "22026"
    comment: too short for bit(11)
  - sql: |
      INSERT INTO bit_t VALUES (B'101011111010')
    expect: error
    sqlstate: "22026"
    comment: too long for bit(11)
  - sql: |
      SELECT count(*) AS n FROM bit_t
    expect: rows
