# bit and bit varying column defaults from string and bit literals, plus a default-length violation.
id: bit.column-defaults
title: Column defaults of bit and bit varying type with DEFAULT VALUES insert
family: bit
tier: core
feature_ids: [bit-string, default-values, create-table, insert]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (bit_defaults)"
  license: PostgreSQL
setup: |
  CREATE TABLE bit_defaults (
    b1 bit(4) DEFAULT '1001',
    b2 bit(4) DEFAULT B'0101',
    b3 bit varying(5) DEFAULT '1001',
    b4 bit varying(5) DEFAULT B'0101'
  );
steps:
  - sql: |
      INSERT INTO bit_defaults DEFAULT VALUES
    expect: ok
  - sql: |
      SELECT b1, b2, b3, b4, length(b3) AS l3, length(b4) AS l4 FROM bit_defaults ORDER BY b1
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO bit_defaults (b1) VALUES (B'1')
    expect: error
    sqlstate: "22026"
    comment: one bit into bit(4)
