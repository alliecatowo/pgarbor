# overlay() with start positions inside, at, and past the end; bit_count() on fixed-length strings.
id: bit.overlay-and-bit-count
title: overlay() at inside and past-end positions, and bit_count() on wide bit strings
family: bit
tier: core
feature_ids: [bit-string, overlay, bit-count, select]
required_capabilities: [select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (Overlay, bit_count)"
  license: PostgreSQL
steps:
  - sql: |
      SELECT overlay(B'0101011100' placing '001' from 2 for 3) AS o
    expect: rows
  - sql: |
      SELECT overlay(B'0101011100' placing '101' from 6) AS o
    expect: rows
  - sql: |
      SELECT overlay(B'0101011100' placing '001' from 11) AS o
    expect: rows
    comment: start one past the end
  - sql: |
      SELECT overlay(B'0101011100' placing '001' from 20) AS o
    expect: rows
    comment: start far past the end
  - sql: |
      SELECT bit_count(B'0101011100'::bit(10)) AS c
    expect: rows
  - sql: |
      SELECT bit_count(B'1111111111'::bit(10)) AS c
    expect: rows
  - sql: |
      SELECT bit_count(repeat('0', 100)::bit(100)) AS c
    expect: rows
  - sql: |
      SELECT bit_count(repeat('1', 100)::bit(100)) AS c
    expect: rows
  - sql: |
      SELECT bit_count(repeat('01', 500)::bit(1000)) AS c
    expect: rows
  - sql: |
      SELECT bit_count(repeat('10101', 200)::bit(1000)) AS c
    expect: rows
