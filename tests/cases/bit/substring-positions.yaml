# SUBSTRING with FROM and FOR on fixed and varying bit strings, including FROM past the end.
id: bit.substring-positions
title: SUBSTRING from and for positions on bit and bit varying values
family: bit
tier: core
feature_ids: [bit-string, substring, select]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (Substring)"
  license: PostgreSQL
setup: |
  CREATE TABLE bit_t (b bit(11));
  CREATE TABLE vb (v bit varying(11));
  INSERT INTO bit_t VALUES (B'00000000000'), (B'11011000000'), (B'01010101010');
  INSERT INTO vb VALUES (B''), (B'0'), (B'010101'), (B'01010101010');
steps:
  - sql: |
      SELECT b,
             SUBSTRING(b FROM 2 FOR 4) AS sub_2_4,
             SUBSTRING(b FROM 7 FOR 13) AS sub_7_13,
             SUBSTRING(b FROM 6) AS sub_6
      FROM bit_t
      ORDER BY b
    expect: rows
    order: ordered
  - sql: |
      SELECT v,
             SUBSTRING(v FROM 2 FOR 4) AS sub_2_4,
             SUBSTRING(v FROM 7 FOR 13) AS sub_7_13,
             SUBSTRING(v FROM 6) AS sub_6
      FROM vb
      ORDER BY v
    expect: rows
    order: ordered
