# Concatenation of bit and varbit yields varbit; length() counts bits including empty operands.
id: bit.concat-and-length
title: Concatenation of bit and varbit values with length and ordering
family: bit
tier: core
feature_ids: [bit-string, select, joins, string-functions]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (Concatenation)"
  license: PostgreSQL
setup: |
  CREATE TABLE bv (v bit varying(11));
  CREATE TABLE bf (b bit(4));
  INSERT INTO bv VALUES (B''), (B'0'), (B'010101');
  INSERT INTO bf VALUES (B'1000'), (B'0101');
steps:
  - sql: |
      SELECT v, b, (v || b) AS concat, length(v || b) AS lc
      FROM bv CROSS JOIN bf
      ORDER BY v, b
    expect: rows
    order: ordered
  - sql: |
      SELECT B'10' || B'011' AS c, length(B'10' || B'011') AS lc
    expect: rows
