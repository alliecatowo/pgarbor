# get_bit and set_bit within range, and out-of-range index rejected with 2202E.
id: bit.get-set-bit
title: get_bit and set_bit with in-range and out-of-range bit indexes
family: bit
tier: core
feature_ids: [bit-string, get-bit, set-bit, errors]
required_capabilities: [select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (Get/Set bit)"
  license: PostgreSQL
steps:
  - sql: |
      SELECT get_bit(B'0101011000100', 10) AS g
    expect: rows
  - sql: |
      SELECT set_bit(B'0101011000100100', 15, 1) AS s
    expect: rows
  - sql: |
      SELECT set_bit(B'0101011000100100', 16, 1) AS s
    expect: error
    sqlstate: "2202E"
    comment: index one past the last bit
  - sql: |
      SELECT get_bit(B'0101', 4) AS g
    expect: error
    sqlstate: "2202E"
