# Bitwise NOT, AND, OR, XOR, comparisons and shifts on bit(16) columns, ordered by the key.
id: bit.bitwise-ops
title: Bitwise operators, comparisons and shifts on bit(16) values
family: bit
tier: core
feature_ids: [bit-string, bitwise-operators, comparison, shift-operators]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (Bit operations, bit_table)"
  license: PostgreSQL
setup: |
  CREATE TABLE bit_ops (a bit(16), b bit(16));
  INSERT INTO bit_ops VALUES
    (X'0F00', X'1000'),
    (X'1F00', X'1100'),
    (X'000F', X'0010'),
    (X'2468', X'2468'),
    (X'FA50', X'05AF'),
    (X'1234', X'FFF5');
steps:
  - sql: |
      SELECT a, b, ~a AS not_a, a & b AS and_ab, a | b AS or_ab, a # b AS xor_ab
      FROM bit_ops
      ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b, a < b AS lt, a <= b AS le, a = b AS eq, a >= b AS ge, a > b AS gt, a <> b AS ne
      FROM bit_ops
      ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, a << 4 AS shl4, b, b >> 2 AS shr2
      FROM bit_ops
      ORDER BY a, b
    expect: rows
    order: ordered
