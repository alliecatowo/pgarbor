# SUBSTRING with huge FOR values is clamped, but a negative FOR length is rejected with 22011.
id: bit.substring-overflow-and-errors
title: SUBSTRING with extreme FROM and FOR values for bit and varbit
family: bit
tier: extended
feature_ids: [bit-string, substring, errors, integer-limits]
required_capabilities: [select, bit-string]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/bit.sql (overflow cases)"
  license: PostgreSQL
steps:
  - sql: |
      SELECT SUBSTRING('01010101'::bit(8) FROM 2 FOR 2147483646) AS s
    expect: rows
  - sql: |
      SELECT SUBSTRING('01010101'::bit(8) FROM -10 FOR 2147483646) AS s
    expect: rows
  - sql: |
      SELECT SUBSTRING('01010101'::bit(8) FROM -10 FOR -2147483646) AS s
    expect: error
    sqlstate: "22011"
  - sql: |
      SELECT SUBSTRING('01010101'::varbit FROM 2 FOR 2147483646) AS s
    expect: rows
  - sql: |
      SELECT SUBSTRING('01010101'::varbit FROM -10 FOR 2147483646) AS s
    expect: rows
  - sql: |
      SELECT SUBSTRING('01010101'::varbit FROM -10 FOR -2147483646) AS s
    expect: error
    sqlstate: "22011"
