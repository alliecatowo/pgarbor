# Constant folding must not evaluate branches that are never reached.
id: case.unreachable-branch-not-evaluated
title: Division by zero in an unreachable CASE branch is not raised
family: case
tier: core
feature_ids: [case-expression, constant-folding, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: From case.sql lines 66-68 (constant-expression folding). Only the unreachable branches divide by zero.
sessions: [a]
steps:
  - sql: |
      SELECT CASE WHEN 1 = 0 THEN 1 / 0 WHEN 1 = 1 THEN 1 ELSE 2 / 0 END AS r
    expect: rows
  - sql: |
      SELECT CASE 1 WHEN 0 THEN 1 / 0 WHEN 1 THEN 1 ELSE 2 / 0 END AS r
    expect: rows
