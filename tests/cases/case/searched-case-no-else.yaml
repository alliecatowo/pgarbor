# Searched CASE: first true WHEN wins, no match without ELSE yields NULL.
id: case.searched-case-no-else
title: Searched CASE returns the first matching branch or NULL without ELSE
family: case
tier: core
feature_ids: [case-expression, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: Adapted from the 'Simplest examples without tables' section of case.sql (lines 28-60); rewritten, no regress tables.
sessions: [a]
steps:
  - sql: |
      SELECT CASE WHEN 1 < 2 THEN 3 END AS a,
             CASE WHEN 1 > 2 THEN 3 END AS b,
             CASE WHEN 1 > 2 THEN 3 ELSE 4 END AS c,
             CASE WHEN 1 > 2 THEN 3 WHEN 4 < 5 THEN 6 ELSE 7 END AS d
    expect: rows
  - sql: |
      SELECT CASE WHEN 1 < 2 THEN 'first' WHEN 1 < 3 THEN 'second' ELSE 'third' END AS r
    expect: rows
    comment: first true WHEN wins even when a later WHEN is also true
