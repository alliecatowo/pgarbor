# Simple CASE compares with '='; a NULL operand never matches a WHEN, so ELSE applies.
id: case.simple-case-null-operand
title: Simple CASE with NULL operand falls through to ELSE
family: case
tier: core
feature_ids: [case-expression, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: Rewritten from case.sql lines 75 and 81-100 (simple form); the NULL-operand edge is added here.
sessions: [a]
setup: |
  CREATE TABLE v (k int4, label text);
  INSERT INTO v VALUES (2, 'two'), (1, 'one'), (NULL, 'nil');
steps:
  - sql: |
      SELECT k,
             CASE k WHEN 1 THEN 'match-1' WHEN NULL THEN 'match-null' ELSE 'other' END AS r
        FROM v
       ORDER BY k
    expect: rows
    order: ordered
    comment: NULL = NULL is unknown, so the NULL row takes ELSE
  - sql: |
      SELECT label, CASE label WHEN 'two' THEN 2 WHEN 'one' THEN 1 END AS n
        FROM v
       ORDER BY label
    expect: rows
    order: ordered
    comment: nil label matches no WHEN and no ELSE, so NULL
  - sql: |
      SELECT CASE 'a' WHEN 'a' THEN 1 ELSE 2 END AS r
    expect: rows
    comment: untyped literal as the test expression
