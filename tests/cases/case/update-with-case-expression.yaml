# UPDATE with CASE in SET, applied twice, with reads after each statement.
id: case.update-with-case-expression
title: UPDATE SET with CASE expression applied twice
family: case
tier: core
feature_ids: [update, case-expression, select]
required_capabilities: [create-table, insert, update, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: From case.sql lines 155-165 (UPDATE with CASE). Reads are ordered; the NULL f column is untouched.
sessions: [a]
setup: |
  CREATE TABLE case_tbl (i int4, f float8);
  INSERT INTO case_tbl VALUES (1, 10.1), (2, 20.2), (3, -30.3), (4, NULL);
steps:
  - sql: |
      UPDATE case_tbl SET i = CASE WHEN i >= 3 THEN (- i) ELSE (2 * i) END
    expect: ok
  - sql: |
      SELECT i FROM case_tbl ORDER BY i
    expect: rows
    order: ordered
  - sql: |
      UPDATE case_tbl SET i = CASE WHEN i >= 2 THEN (2 * i) ELSE (3 * i) END
    expect: ok
  - sql: |
      SELECT i FROM case_tbl ORDER BY i
    expect: rows
    order: ordered
