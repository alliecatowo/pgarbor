# COALESCE and NULLIF shorthand semantics on a nullable column.
id: case.coalesce-nullif-semantics
title: COALESCE and NULLIF on a nullable column and in WHERE
family: case
tier: core
feature_ids: [coalesce, nullif, null-semantics, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: From case.sql lines 121-123 and 248 (COALESCE, NULLIF); rewritten with a small table.
sessions: [a]
setup: |
  CREATE TABLE ct (i int4, f float8);
  INSERT INTO ct VALUES (1, 10.1), (2, 20.2), (3, -30.3), (4, NULL);
steps:
  - sql: |
      SELECT i FROM ct WHERE COALESCE(f, i) = 4 ORDER BY i
    expect: rows
    order: ordered
    comment: only the NULL-f row, where COALESCE falls back to i=4
  - sql: |
      SELECT i, NULLIF(i, 2) AS n FROM ct ORDER BY i
    expect: rows
    order: ordered
  - sql: |
      SELECT i FROM ct WHERE NULLIF(f, i) IS NULL ORDER BY i
    expect: rows
    order: ordered
    comment: NULLIF is NULL when f is NULL; no row has f equal to i
  - sql: |
      SELECT COALESCE(NULL, 7, 8) AS s, COALESCE(NULL, NULL) AS t
    expect: rows
