# CASE over bind parameters through the extended protocol, including a NULL parameter.
id: case.case-extended-protocol-params
title: CASE over bind parameters via extended protocol with NULL parameter
family: case
tier: extended
feature_ids: [case-expression, extended-protocol, null-semantics, prepared-statements]
required_capabilities: [select, extended-protocol]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: Protocol-level variant of the searched CASE examples in case.sql; no table needed.
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT CASE WHEN $1::int4 > 2 THEN 'big' ELSE 'small' END AS r
      params: ["3"]
      param_types: [23]
    expect: rows
  - exec_params:
      sql: |
        SELECT CASE WHEN $1::int4 > 2 THEN 'big' ELSE 'small' END AS r
      params: [null]
      param_types: [23]
    expect: rows
    comment: NULL comparison is not true, so ELSE applies
