# NULLIF and simple CASE over array values use array equality.
id: case.nullif-and-array-equality
title: NULLIF and simple CASE compare array values by equality
family: case
tier: extended
feature_ids: [nullif, case-expression, arrays]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: From case.sql lines 239-248 and 257-261, without domains, plpgsql helpers or enums.
sessions: [a]
steps:
  - sql: |
      SELECT NULLIF(ARRAY[1, 2], ARRAY[1, 2]) IS NULL AS equal_is_null,
             NULLIF(ARRAY[1, 2], ARRAY[2, 3]) AS differ
    expect: rows
  - sql: |
      SELECT CASE ARRAY[1, 2]
               WHEN ARRAY[2, 4] THEN 'wrong'
               WHEN ARRAY[2, 5] THEN 'still wrong'
               WHEN ARRAY[1, 2] THEN 'right'
             END AS r
    expect: rows
  - sql: |
      SELECT CASE 'foo'::text
               WHEN 'foo' THEN ARRAY['a', 'b'] || ARRAY['c']
               ELSE ARRAY['x', 'y']
             END AS r
    expect: rows
