# Nested CASE: inner result feeds the outer test expression; NULL inner result matches no WHEN.
id: case.nested-case-null-branches
title: Nested CASE with inner result as outer test value, including NULL
family: case
tier: core
feature_ids: [case-expression, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: From case.sql lines 193-201 without the volatile plpgsql helper; the inner-NULL variant is added here.
sessions: [a]
steps:
  - sql: |
      SELECT CASE
               (CASE 'bar'
                  WHEN 'foo' THEN 'it was foo!'
                  WHEN 'bar' THEN 'it was bar!' END)
             WHEN 'it was foo!' THEN 'foo recognized'
             WHEN 'it was bar!' THEN 'bar recognized'
             ELSE 'unrecognized' END AS r
    expect: rows
  - sql: |
      SELECT CASE
               (CASE 'baz'
                  WHEN 'foo' THEN 'x' END)
             WHEN NULL THEN 'null-branch'
             WHEN 'x' THEN 'x'
             ELSE 'unrecognized' END AS r
    expect: rows
    comment: inner CASE yields NULL, which matches no WHEN, so ELSE applies
