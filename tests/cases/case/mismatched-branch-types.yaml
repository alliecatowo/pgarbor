# CASE and NULLIF result types must be resolvable; otherwise the statement is rejected.
id: case.mismatched-branch-types
title: CASE with incompatible branch types and an unparsable literal branch
family: case
tier: core
feature_ids: [case-expression, errors, type-resolution]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: Error-path companion to case.sql lines 257-261; the SQLSTATE values are the author's belief and are checked by the recording.
sessions: [a]
steps:
  - sql: |
      SELECT CASE WHEN true THEN 1 ELSE ARRAY[1] END AS r
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT CASE WHEN true THEN 1 ELSE 'x' END AS r
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 1 AS still_ok
    expect: rows
