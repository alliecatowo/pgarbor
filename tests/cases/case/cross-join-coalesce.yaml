# COALESCE across columns of a cross join, filtered on the coalesced value.
id: case.cross-join-coalesce
title: COALESCE over a cross join filtered on the coalesced value
family: case
tier: extended
feature_ids: [coalesce, joins, null-semantics, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/case.sql"
  license: PostgreSQL License
notes: From case.sql lines 125-138 (CASE_TBL x CASE2_TBL); rewritten with two small tables.
sessions: [a]
setup: |
  CREATE TABLE a_t (i int4, f float8);
  CREATE TABLE b_t (i int4, j int4);
  INSERT INTO a_t VALUES (1, 10.1), (2, 20.2), (3, -30.3), (4, NULL);
  INSERT INTO b_t VALUES (1, -1), (2, -2), (3, -3), (2, -4), (1, NULL), (NULL, -6);
steps:
  - sql: |
      SELECT a.i AS ai, b.i AS bi, b.j AS bj, COALESCE(a.f, b.i, b.j) AS c
        FROM a_t a, b_t b
       WHERE COALESCE(a.f, b.i, b.j) = 2
       ORDER BY a.i, b.i, b.j
    expect: rows
    order: ordered
    comment: matches only where a.f is NULL and b.i = 2
  - sql: |
      SELECT count(*) FROM a_t a, b_t b
    expect: rows
