title: Point subscript outside 0..1 raises an error
family: point
tier: extended
feature_ids: [point-type, point-subscript, errors]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 geo_ops.c point_subscript; errcode 2202E array_subscript_error (author belief, to be checked by recording)"
sessions: [a]
steps:
