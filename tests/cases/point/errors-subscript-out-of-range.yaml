# Point subscripts are only 0 (x) and 1 (y). Indexes outside that range yield NULL, not an error (verified on PG 18.6).
id: point.errors-subscript-out-of-range
title: Point subscript outside 0..1 returns NULL
family: point
tier: extended
feature_ids: [point-type, point-subscript, errors]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18.6 point_subscript (geo_ops.c): out-of-range index returns NULL; verified by recording"
sessions: [a]
steps:
  - sql: |
      SELECT ('(1,2)'::point)[2] AS hi, ('(1,2)'::point)[-1] AS lo, ('(1,2)'::point)[1] AS y
    expect: rows
    order: ordered
    comment: indexes 2 and -1 are out of range and yield NULL; index 1 yields y
