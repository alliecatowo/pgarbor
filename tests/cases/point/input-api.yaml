# Non-throwing input validation API for point.
id: point.input-api
title: pg_input_is_valid and pg_input_error_info classify point literals
family: point
tier: extended
feature_ids: [point-type, point-input, input-validity-api]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql (pg_input_is_valid / pg_input_error_info)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('(1,2)', 'point') AS good
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('1,y', 'point') AS bad
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('1,y', 'point')
    expect: rows
    comment: expected 22P02
