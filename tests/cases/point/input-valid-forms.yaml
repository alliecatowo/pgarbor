# Accepted point literal spellings and their canonical text output.
id: point.input-valid-forms
title: Valid point literal forms parse and print canonically
family: point
tier: core
feature_ids: [point-type, point-input, point-output]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql"
sessions: [a]
setup: |
  CREATE TABLE pt (id int4 PRIMARY KEY, f1 point);
steps:
  - sql: |
      INSERT INTO pt VALUES (1, '1,2'), (2, '(1,2)'), (3, ' ( 1 , 2 ) '), (4, '(1e2,-0.5)'), (5, NULL)
    expect: ok
  - sql: |
      SELECT id, f1::text AS txt, f1[0] AS x, f1[1] AS y FROM pt ORDER BY id
    expect: rows
    order: ordered
