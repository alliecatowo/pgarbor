# Point subscripts [0] and [1] return x and y; NULL point yields NULL components.
id: point.components-subscript
title: Point subscripts return coordinates and propagate NULL
family: point
tier: core
feature_ids: [point-type, point-subscript, null-handling]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql (p1.f1[0] usage)"
sessions: [a]
setup: |
  CREATE TABLE pts (id int4 PRIMARY KEY, p point);
  INSERT INTO pts VALUES (1, '(0,0)'), (2, '(-10,0)'), (3, '(-3,4)'), (4, '(5.1,34.5)'), (5, NULL);
steps:
  - sql: |
      SELECT id, p[0] AS x, p[1] AS y FROM pts ORDER BY id
    expect: rows
    order: ordered
