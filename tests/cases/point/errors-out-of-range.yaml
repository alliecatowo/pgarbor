# A coordinate that overflows float8 is rejected at input time.
id: point.errors-out-of-range
title: Point coordinate overflowing float8 is rejected with 22003
family: point
tier: extended
feature_ids: [point-type, point-input, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql"
sessions: [a]
setup: |
  CREATE TABLE pt (f1 point);
steps:
  - sql: |
      INSERT INTO pt(f1) VALUES ('(10.0, 1e+500)')
    expect: error
    sqlstate: "22003"
    comment: out of range for float8
  - sql: |
      SELECT count(*) FROM pt
    expect: rows
