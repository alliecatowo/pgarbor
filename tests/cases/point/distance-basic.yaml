# Euclidean distance operator <-> on literal points.
id: point.distance-basic
title: Point distance operator returns Euclidean distance including zero and NULL
family: point
tier: core
feature_ids: [point-type, point-distance]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql (<-> operator)"
sessions: [a]
steps:
  - sql: |
      SELECT '(0,0)'::point <-> '(3,4)'::point AS d_345
    expect: rows
  - sql: |
      SELECT '(1,1)'::point <-> '(1,1)'::point AS d_zero, (NULL::point <-> '(1,1)'::point) IS NULL AS d_null
    expect: rows
