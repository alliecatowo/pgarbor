# IEEE special values are accepted as point coordinates.
id: point.input-special-floats
title: NaN and Infinity coordinates are accepted and printed
family: point
tier: extended
feature_ids: [point-type, point-input, point-output, float-special-values]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql (POINT_TBL rows with Infinity and NaN)"
sessions: [a]
setup: |
  CREATE TABLE pt (id int4 PRIMARY KEY, f1 point);
steps:
  - sql: |
      INSERT INTO pt VALUES (1, '(NaN,NaN)'), (2, '(Infinity,-Infinity)'), (3, '(1e+300,Infinity)'), (4, '(-Infinity,+5)')
    expect: ok
  - sql: |
      SELECT id, f1::text AS txt FROM pt ORDER BY id
    expect: rows
    order: ordered
