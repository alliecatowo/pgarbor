# Positional operators on point: left, right, above, below, and point equality.
id: point.operators-positional
title: Positional and equality operators on points filter rows as documented
family: point
tier: core
feature_ids: [point-type, point-operators, point-positional]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql (<<, >>, |>>, <<|, ~=)"
sessions: [a]
setup: |
  CREATE TABLE pts (id int4 PRIMARY KEY, p point);
  INSERT INTO pts VALUES (1, '(0,0)'), (2, '(-10,0)'), (3, '(-3,4)'), (4, '(5.1,34.5)'), (5, '(-5,-12)'), (6, NULL);
steps:
  - sql: |
      SELECT id FROM pts WHERE p << '(0,0)' ORDER BY id
    expect: rows
    order: ordered
    comment: strictly left of origin
  - sql: |
      SELECT id FROM pts WHERE '(0,0)' >> p ORDER BY id
    expect: rows
    order: ordered
    comment: origin strictly right of point, same set as above
  - sql: |
      SELECT id FROM pts WHERE '(0,0)' |>> p ORDER BY id
    expect: rows
    order: ordered
    comment: origin strictly above point
  - sql: |
      SELECT id FROM pts WHERE p <<| '(0,0)' ORDER BY id
    expect: rows
    order: ordered
    comment: point strictly below origin
  - sql: |
      SELECT id FROM pts WHERE p ~= '(5.1,34.5)' ORDER BY id
    expect: rows
    order: ordered
