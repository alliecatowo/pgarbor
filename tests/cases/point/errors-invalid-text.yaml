# Malformed point literals: each rejected with 22P02; nothing is stored.
id: point.errors-invalid-text
title: Malformed point literals are rejected with 22P02 and store nothing
family: point
tier: core
feature_ids: [point-type, point-input, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql"
sessions: [a]
setup: |
  CREATE TABLE pt (f1 point);
steps:
  - sql: |
      INSERT INTO pt(f1) VALUES ('asdfasdf')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO pt(f1) VALUES ('(10.0 10.0)')
    expect: error
    sqlstate: "22P02"
    comment: space instead of comma between coordinates
  - sql: |
      INSERT INTO pt(f1) VALUES ('(10.0, 10.0) x')
    expect: error
    sqlstate: "22P02"
    comment: trailing garbage
  - sql: |
      INSERT INTO pt(f1) VALUES ('(10.0,10.0')
    expect: error
    sqlstate: "22P02"
    comment: missing closing parenthesis
  - sql: |
      SELECT count(*) FROM pt
    expect: rows
