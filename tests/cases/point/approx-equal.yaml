# ~= compares points with a tiny absolute tolerance per coordinate.
id: point.approx-equal
title: Point equality operator tolerates differences below 1e-6 per coordinate
family: point
tier: extended
feature_ids: [point-type, point-operators, float-tolerance]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql and point_gist_tbl test (~= tolerance)"
sessions: [a]
steps:
  - sql: |
      SELECT '(0.0000009,0.0000009)'::point ~= '(0,0)'::point AS near_zero, '(0.0000018,0.0000018)'::point ~= '(0,0)'::point AS far_zero, '(1,2)'::point ~= '(1,2)'::point AS same, '(1,2)'::point ~= '(1,3)'::point AS diff
    expect: rows
    comment: result values come from the recording, not from this file
