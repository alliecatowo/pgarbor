# Distance ordering against the origin and a pairwise self-join filtered and sorted by distance.
id: point.distance-order-join
title: Order by point distance and filter a self-join on distance
family: point
tier: extended
feature_ids: [point-type, point-distance, joins, order-by]
required_capabilities: [create-table, insert, select, joins]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/point.sql (ORDER BY dist, self join with <-> > 3)"
sessions: [a]
setup: |
  CREATE TABLE pts (id int4 PRIMARY KEY, p point);
  INSERT INTO pts VALUES (1, '(0,0)'), (2, '(-10,0)'), (3, '(-3,4)'), (4, '(5.1,34.5)'), (5, '(-5,-12)'), (6, NULL);
steps:
  - sql: |
      SELECT id, p <-> '(0,0)' AS dist FROM pts WHERE p IS NOT NULL ORDER BY dist, id
    expect: rows
    order: ordered
  - sql: |
      SELECT a.id AS id1, b.id AS id2, a.p <-> b.p AS dist FROM pts a JOIN pts b ON a.id < b.id WHERE (a.p <-> b.p) > 3 ORDER BY dist, a.id, b.id
    expect: rows
    order: ordered
