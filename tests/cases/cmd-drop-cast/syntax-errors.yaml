# DROP CAST requires the parenthesised (source AS target) form, IF EXISTS and CASCADE|RESTRICT are placed only as documented, and the target list cannot be omitted.
id: cmd-drop-cast.syntax-errors
title: "DROP CAST rejects forms outside its documented synopsis with syntax errors"
family: cmd-drop-cast
tier: core
feature_ids: [drop-cast, syntax]
required_capabilities: [errors]
provenance:
  source: pg-docs
  ref: "ref/drop_cast.sgml#sql-dropcast-synopsis"
sessions: [a]
steps:
  - sql: |
      DROP CAST text AS int4
    expect: error
    sqlstate: "42601"
    comment: the parentheses are required
  - sql: |
      DROP CAST (text int4)
    expect: error
    sqlstate: "42601"
    comment: AS is required between the two types
  - sql: |
      DROP CAST (text AS int4) IF EXISTS
    expect: error
    sqlstate: "42601"
    comment: IF EXISTS comes before the parenthesised types
  - sql: |
      DROP CAST (text AS int4) CASCADE RESTRICT
    expect: error
    sqlstate: "42601"
    comment: only one of CASCADE or RESTRICT may appear
  - sql: |
      DROP CAST
    expect: error
    sqlstate: "42601"
