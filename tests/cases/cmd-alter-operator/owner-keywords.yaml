# OWNER TO CURRENT_ROLE / CURRENT_USER follow SET ROLE; SESSION_USER does not. A non-owner current role
# cannot take ownership by SESSION_USER because it cannot SET ROLE to the login role.
id: cmd-alter-operator.owner-keywords
title: "ALTER OPERATOR OWNER TO CURRENT_ROLE, CURRENT_USER and SESSION_USER under SET ROLE"
family: cmd-alter-operator
tier: core
feature_ids: [alter-operator, owner, set-role, session-user]
required_capabilities: [alter-operator, create-operator, create-function-sql, create-role, set-role, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_operator.sgml#synopsis (OWNER TO { new_owner | CURRENT_ROLE | CURRENT_USER | SESSION_USER })"
sessions: [a]
setup: |
  CREATE ROLE cmd_ao_kw_owner;
  GRANT CREATE ON SCHEMA public TO cmd_ao_kw_owner;
  CREATE FUNCTION cmd_ao_kw_lt(int8, int8) RETURNS boolean LANGUAGE sql IMMUTABLE AS $$ SELECT $1 < $2 $$;
  CREATE OPERATOR <<< (LEFTARG = int8, RIGHTARG = int8, PROCEDURE = cmd_ao_kw_lt);
steps:
  - sql: |
      ALTER OPERATOR <<< (int8, int8) OWNER TO cmd_ao_kw_owner
    expect: ok
  - sql: |
      SET ROLE cmd_ao_kw_owner
    expect: ok
  - sql: |
      ALTER OPERATOR <<< (int8, int8) OWNER TO CURRENT_ROLE
    expect: ok
    comment: CURRENT_ROLE is cmd_ao_kw_owner here, and the operator is already owned by it
  - sql: |
      ALTER OPERATOR <<< (int8, int8) OWNER TO CURRENT_USER
    expect: ok
  - sql: |
      ALTER OPERATOR <<< (int8, int8) OWNER TO SESSION_USER
    expect: error
    sqlstate: "42501"
    compare_message: false
    comment: SESSION_USER is the login role; the current role may not SET ROLE to it. The message names the login role, so it is not compared
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      ALTER OPERATOR <<< (int8, int8) OWNER TO SESSION_USER
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(oprowner) = session_user AS owned_by_session_user
      FROM pg_operator WHERE oprname = '<<<' AND oprleft = 'int8'::regtype AND oprright = 'int8'::regtype
    expect: rows
    order: ordered
  - sql: |
      REVOKE CREATE ON SCHEMA public FROM cmd_ao_kw_owner;
      DROP OPERATOR <<< (int8, int8);
      DROP FUNCTION cmd_ao_kw_lt(int8, int8);
      DROP ROLE cmd_ao_kw_owner
    expect: ok
