# The documented int[] examples name _int_contsel and _int_contjoinsel, which ship with the intarray
# extension and are not in core. With no extension installed, the operator lookup on (int[], int[]) fails first.
id: cmd-alter-operator.doc-example-intarray-needs-extension
title: "Documented int[] examples fail on a plain database because the operator is an intarray extension signature"
family: cmd-alter-operator
tier: core
feature_ids: [alter-operator, restrict-selectivity, join-selectivity, commutator, errors]
required_capabilities: [alter-operator, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_operator.sgml#examples (&& (int[], int[]) SET RESTRICT/JOIN and COMMUTATOR)"
sessions: [a]
steps:
  - sql: |
      ALTER OPERATOR && (int[], int[]) SET (RESTRICT = _int_contsel, JOIN = _int_contjoinsel)
    expect: error
    sqlstate: "42883"
    comment: no operator && (integer[], integer[]) exists without intarray; the lookup fails before options are read
  - sql: |
      ALTER OPERATOR && (int[], int[]) SET (COMMUTATOR = &&)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT count(*) AS n FROM pg_operator WHERE oprname = '&&' AND oprleft = 'integer[]'::regtype
    expect: rows
    order: ordered
    comment: nothing was created or altered
