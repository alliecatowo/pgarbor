# A view may be defined by a VALUES command; unnamed columns are column1, column2, and so on.
id: cmd-create-view.values-query-view
title: View defined by VALUES exposes columns column1 and column2 unless a name list is given
family: cmd-create-view
tier: core
feature_ids: [create-view, values, column-list]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_view.sgml#sql-createview (query may be VALUES)"
sessions: [a]
steps:
  - sql: |
      CREATE VIEW vals AS VALUES (1, 'a'), (2, 'b')
    expect: ok
  - sql: |
      SELECT column1, column2 FROM vals ORDER BY column1
    expect: rows
    order: ordered
  - sql: |
      CREATE VIEW vals_named (n, s) AS VALUES (1, 'a'), (2, 'b')
    expect: ok
  - sql: |
      SELECT n, s FROM vals_named ORDER BY n
    expect: rows
    order: ordered
