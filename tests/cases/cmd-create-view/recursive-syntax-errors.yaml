# Documented rules for recursive views: a column name list is required and CHECK OPTION is not allowed.
id: cmd-create-view.recursive-syntax-errors
title: Recursive view without a column list or with CHECK OPTION is rejected
family: cmd-create-view
tier: extended
feature_ids: [create-view, recursive-view, check-option, errors]
required_capabilities: [errors, recursive-cte]
provenance:
  source: pg-docs
  ref: "ref/create_view.sgml#sql-createview (RECURSIVE parameter and CHECK OPTION notes)"
sessions: [a]
steps:
  - sql: |
      CREATE RECURSIVE VIEW rnocols AS VALUES (1) UNION ALL SELECT 2
    expect: error
    sqlstate: "42601"
    comment: a view column name list must be specified for a recursive view
  - sql: |
      CREATE RECURSIVE VIEW rco (n) AS VALUES (1) UNION ALL SELECT n+1 FROM rco WHERE n < 3 WITH CHECK OPTION
    expect: error
    sqlstate: "0A000"
    comment: CHECK OPTION may not be used with RECURSIVE views
