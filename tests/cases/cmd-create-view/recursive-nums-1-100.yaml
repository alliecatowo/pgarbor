# Documented example: a recursive view that generates the numbers 1 to 100.
id: cmd-create-view.recursive-nums-1-100
title: Recursive view generates the numbers 1 through 100 from a schema-qualified name
family: cmd-create-view
tier: extended
feature_ids: [create-view, recursive-view, union-all, values, recursive-cte]
required_capabilities: [select, values, recursive-cte, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_view.sgml#sql-createview-examples (Create a recursive view consisting of the numbers from 1 to 100)"
sessions: [a]
steps:
  - sql: |
      CREATE RECURSIVE VIEW public.nums_1_100 (n) AS
          VALUES (1)
      UNION ALL
          SELECT n+1 FROM nums_1_100 WHERE n < 100
    expect: ok
  - sql: |
      SELECT count(*) AS cnt, sum(n) AS total FROM public.nums_1_100
    expect: rows
  - sql: |
      SELECT n FROM nums_1_100 WHERE n IN (1, 50, 100) ORDER BY n
    expect: rows
    order: ordered
  - sql: |
      SELECT relkind FROM pg_class WHERE relname = 'nums_1_100' AND relnamespace = 'public'::regnamespace
    expect: rows
    comment: the recursive view is an ordinary view in the public schema
