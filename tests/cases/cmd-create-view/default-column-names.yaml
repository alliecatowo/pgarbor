# The documented pitfall: a bare string literal gets the column name ?column? and type text unless named.
id: cmd-create-view.default-column-names
title: Bare string literal view column defaults to ?column? of type text; aliased form is named
family: cmd-create-view
tier: core
feature_ids: [create-view, column-naming, text-literal]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_view.sgml#sql-createview (Notes, column names and types)"
sessions: [a]
steps:
  - sql: |
      CREATE VIEW vista AS SELECT 'Hello World'
    expect: ok
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_name = 'vista' ORDER BY ordinal_position
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM vista
    expect: rows
  - sql: |
      CREATE VIEW vista2 AS SELECT text 'Hello World' AS hello
    expect: ok
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_name = 'vista2' ORDER BY ordinal_position
    expect: rows
    order: ordered
