# SERIAL is shorthand for an integer column NOT NULL with DEFAULT nextval() on an implicit sequence.
# An explicit NULL is rejected because the column is NOT NULL, even though it has a default.
id: doc-ddl-default.serial-shorthand
title: SERIAL creates a NOT NULL integer column defaulting to nextval of an owned sequence
family: doc-ddl-default
tier: core
feature_ids: [default-values, serial, sequences, not-null, errors]
required_capabilities: [create-table, insert, select, sequences, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (product_no SERIAL shorthand); datatype-serial"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE sp (product_no SERIAL, name text)
    expect: ok
  - sql: |
      INSERT INTO sp (name) VALUES ('x'), ('y')
    expect: ok
  - sql: |
      SELECT product_no, name FROM sp ORDER BY product_no
    expect: rows
    order: ordered
  - sql: |
      SELECT column_name, is_nullable, data_type, column_default
      FROM information_schema.columns
      WHERE table_name = 'sp'
      ORDER BY ordinal_position
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO sp (product_no, name) VALUES (NULL, 'z')
    expect: error
    sqlstate: "23502"
