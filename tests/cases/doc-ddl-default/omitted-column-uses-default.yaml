# The ddl-default products example: omitted columns take their DEFAULT, an explicit DEFAULT keyword
# requests the default, and an explicit NULL overrides the default (it is not replaced).
id: doc-ddl-default.omitted-column-uses-default
title: Omitted and DEFAULT-keyword columns take the declared default; explicit NULL overrides it
family: doc-ddl-default
tier: core
feature_ids: [default-values, insert, select, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (CREATE TABLE products example)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE products (
          product_no integer,
          name text,
          price numeric DEFAULT 9.99
      )
    expect: ok
  - sql: |
      INSERT INTO products (product_no, name) VALUES (1, 'a')
    expect: ok
  - sql: |
      INSERT INTO products VALUES (2, 'b', DEFAULT)
    expect: ok
  - sql: |
      INSERT INTO products VALUES (3, 'c', NULL)
    expect: ok
    comment: explicit NULL is stored as NULL, not replaced by the default
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
