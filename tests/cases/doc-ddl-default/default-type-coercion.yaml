# The default expression is coerced to the column type when the table is created: a text literal
# becomes an integer, a numeric literal is rounded to the declared scale, and a date expression is evaluated.
id: doc-ddl-default.default-type-coercion
title: Default expressions are coerced to the column type and evaluated per insert
family: doc-ddl-default
tier: core
feature_ids: [default-values, numeric, date-type, text, type-resolution]
required_capabilities: [create-table, insert, select, numeric, date-type]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (default value can be an expression)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ty (
          a int DEFAULT '42',
          b numeric(5,2) DEFAULT 1.005,
          c text DEFAULT 'it''s',
          d date DEFAULT (date '2020-01-01' + 7)
      )
    expect: ok
  - sql: |
      INSERT INTO ty DEFAULT VALUES
    expect: ok
  - sql: |
      SELECT a, b, c, d FROM ty
    expect: rows
    order: ordered
