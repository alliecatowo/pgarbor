# DEFAULT is allowed per row inside a multi-row VALUES list, and INSERT ... DEFAULT VALUES fills
# every column with its default. Each row's sequence default is evaluated separately.
id: doc-ddl-default.default-keyword-multirow-values
title: DEFAULT keyword per row in multi-row VALUES and DEFAULT VALUES insert
family: doc-ddl-default
tier: core
feature_ids: [default-values, insert, sequences, values]
required_capabilities: [create-table, insert, select, sequences]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (DEFAULT keyword in place of a value)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE md (id int DEFAULT 7, v text DEFAULT 'dflt', w int DEFAULT (2 * 3 + 1))
    expect: ok
  - sql: |
      INSERT INTO md (id, v, w) VALUES (DEFAULT, 'p', 1), (8, DEFAULT, DEFAULT), (DEFAULT, 'r', DEFAULT)
    expect: ok
  - sql: |
      INSERT INTO md DEFAULT VALUES
    expect: ok
  - sql: |
      SELECT id, v, w FROM md ORDER BY id, v
    expect: rows
    order: ordered
