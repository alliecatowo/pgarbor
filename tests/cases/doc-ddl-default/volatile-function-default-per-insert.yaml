# A default may call a volatile user function; it runs once per inserted row, including for a
# DEFAULT keyword in an explicit VALUES list.
id: doc-ddl-default.volatile-function-default-per-insert
title: Volatile SQL function as default is called once per inserted row
family: doc-ddl-default
tier: extended
feature_ids: [default-values, create-function-sql, sequences, insert]
required_capabilities: [create-table, insert, select, sequences, create-function]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (default value can be an expression evaluated on insertion)"
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE cs_codes
    expect: ok
  - sql: |
      CREATE FUNCTION next_code() RETURNS text LANGUAGE sql AS $$ SELECT 'c' || nextval('cs_codes') $$
    expect: ok
  - sql: |
      CREATE TABLE codes (code text DEFAULT next_code(), v int)
    expect: ok
  - sql: |
      INSERT INTO codes (v) VALUES (10), (20)
    expect: ok
  - sql: |
      INSERT INTO codes VALUES (DEFAULT, 30)
    expect: ok
  - sql: |
      SELECT code, v FROM codes ORDER BY v
    expect: rows
    order: ordered
