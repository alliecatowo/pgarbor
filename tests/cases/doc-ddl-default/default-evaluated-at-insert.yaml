# The default expression is evaluated when a row is inserted, not when the table is created:
# a sequence advanced after CREATE TABLE is seen by the first insert that uses the default.
id: doc-ddl-default.default-evaluated-at-insert
title: Default expression is evaluated at insert time, not at CREATE TABLE
family: doc-ddl-default
tier: core
feature_ids: [default-values, sequences, insert]
required_capabilities: [create-table, insert, select, sequences]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (expression evaluated whenever the default value is inserted)"
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE s_insert_time
    expect: ok
  - sql: |
      CREATE TABLE d_insert_time (id int DEFAULT nextval('s_insert_time'))
    expect: ok
  - sql: |
      SELECT nextval('s_insert_time')
    expect: rows
  - sql: |
      INSERT INTO d_insert_time DEFAULT VALUES
    expect: ok
  - sql: |
      SELECT id FROM d_insert_time
    expect: rows
    order: ordered
    comment: expects 2, not 1; the default was evaluated at insert time
