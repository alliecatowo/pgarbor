# Without a declared default the default value is the null value; the DEFAULT keyword on such a column
# also yields NULL, while a column with its own default is filled when omitted.
id: doc-ddl-default.no-default-is-null
title: Columns without a declared default are NULL when omitted or given DEFAULT
family: doc-ddl-default
tier: core
feature_ids: [default-values, insert, select, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (null value default)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE nd (a int, b text, c int DEFAULT 0)
    expect: ok
  - sql: |
      INSERT INTO nd (a) VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO nd VALUES (2, DEFAULT, DEFAULT)
    expect: ok
  - sql: |
      SELECT a, b IS NULL AS b_is_null, c FROM nd ORDER BY a
    expect: rows
    order: ordered
