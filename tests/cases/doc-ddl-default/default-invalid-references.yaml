# A default may not refer to other columns of the table (0A000), and DEFAULT is only valid as a value
# in INSERT and UPDATE, so SELECT DEFAULT is a syntax error (42601). Failed CREATEs leave no table.
id: doc-ddl-default.default-invalid-references
title: Default referencing a column, and DEFAULT outside INSERT/UPDATE, are rejected
family: doc-ddl-default
tier: core
feature_ids: [default-values, errors, create-table]
required_capabilities: [create-table, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default; ddl.sgml#ddl-generated-columns (a column default may not refer to other columns)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE selfref (a int, b int DEFAULT a)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT DEFAULT
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM information_schema.tables WHERE table_name = 'selfref'
    expect: rows
    comment: 0 rows of table state; the failed CREATE left no table behind
