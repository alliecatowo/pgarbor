# A default expression is evaluated for each inserted row: nextval() on a sequence yields a
# successive value per row, and a direct nextval() call in between consumes one value too.
id: doc-ddl-default.nextval-default-per-row
title: Sequence-backed default evaluated per row and per statement
family: doc-ddl-default
tier: core
feature_ids: [default-values, sequences, insert, select]
required_capabilities: [create-table, insert, select, sequences]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (product_no DEFAULT nextval(...))"
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE products_product_no_seq
    expect: ok
  - sql: |
      CREATE TABLE products (
          product_no integer DEFAULT nextval('products_product_no_seq'),
          name text
      )
    expect: ok
  - sql: |
      SELECT nextval('products_product_no_seq')
    expect: rows
    comment: consumes value 1 outside the table
  - sql: |
      INSERT INTO products (name) VALUES ('a'), ('b'), ('c')
    expect: ok
  - sql: |
      SELECT product_no, name FROM products ORDER BY product_no
    expect: rows
    order: ordered
