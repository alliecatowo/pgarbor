# Constraints apply even when the value comes from the default: a default that fails a CHECK
# is rejected at insert time with check_violation (23514).
id: doc-ddl-default.default-violates-check
title: A default value that violates a CHECK constraint is rejected on insert
family: doc-ddl-default
tier: core
feature_ids: [default-values, constraints, check-constraints, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-constraints (constraints apply even if the value came from the default)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ck_default (a int DEFAULT -1 CHECK (a > 0))
    expect: ok
  - sql: |
      INSERT INTO ck_default DEFAULT VALUES
    expect: error
    sqlstate: "23514"
  - sql: |
      INSERT INTO ck_default (a) VALUES (5)
    expect: ok
  - sql: |
      SELECT a FROM ck_default ORDER BY a
    expect: rows
    order: ordered
