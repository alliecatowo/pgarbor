# UPDATE ... SET col = DEFAULT assigns the column's default; for a column with no declared default
# that is NULL. Other columns are untouched.
id: doc-ddl-default.default-keyword-in-update
title: UPDATE SET column = DEFAULT assigns the declared default or NULL
family: doc-ddl-default
tier: core
feature_ids: [default-values, update, null-semantics]
required_capabilities: [create-table, insert, update, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (DEFAULT may be used in UPDATE commands)"
sessions: [a]
setup: |
  CREATE TABLE dd (id int PRIMARY KEY, price numeric DEFAULT 9.99, note text DEFAULT 'n');
  INSERT INTO dd VALUES (1, 1.00, 'one'), (2, 2.00, 'two');
steps:
  - sql: |
      UPDATE dd SET price = DEFAULT WHERE id = 1
    expect: ok
  - sql: |
      UPDATE dd SET note = DEFAULT, price = DEFAULT WHERE id = 2
    expect: ok
  - sql: |
      SELECT id, price, note FROM dd ORDER BY id
    expect: rows
    order: ordered
