# Defaults are checked when the table is created: a default that cannot be coerced to the column type
# (22P02) or that names a missing sequence (42P01) makes CREATE TABLE fail and creates nothing.
id: doc-ddl-default.default-invalid-fails-create
title: Invalid default expression makes CREATE TABLE fail and leaves no table
family: doc-ddl-default
tier: core
feature_ids: [default-values, create-table, errors]
required_capabilities: [create-table, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (default value is an expression)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE badt (a int DEFAULT 'abc')
    expect: error
    sqlstate: "22P02"
  - sql: |
      CREATE TABLE badseq (a int DEFAULT nextval('no_such_seq_ddl_default'))
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT count(*) FROM information_schema.tables WHERE table_name IN ('badt', 'badseq')
    expect: rows
