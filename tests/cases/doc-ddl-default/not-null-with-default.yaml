# NOT NULL with a default: an omitted column takes the default, but an explicit NULL is not replaced
# and fails NOT NULL (23502). A NOT NULL column without any default that is omitted also fails.
id: doc-ddl-default.not-null-with-default
title: NOT NULL with default - omitted fills, explicit NULL fails; no-default omission fails
family: doc-ddl-default
tier: core
feature_ids: [default-values, not-null, errors, null-semantics]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default; ddl.sgml#ddl-constraints-not-null"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE nn1 (a int NOT NULL DEFAULT 1, b int)
    expect: ok
  - sql: |
      INSERT INTO nn1 (b) VALUES (5)
    expect: ok
  - sql: |
      INSERT INTO nn1 VALUES (NULL, 6)
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT a, b FROM nn1
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE nn2 (a int, b int NOT NULL)
    expect: ok
  - sql: |
      INSERT INTO nn2 (a) VALUES (1)
    expect: error
    sqlstate: "23502"
