# CURRENT_TIMESTAMP as a default is set when the row is inserted: within one transaction it equals
# now(), and an interval-arithmetic default on a fixed date is deterministic.
id: doc-ddl-default.default-current-timestamp
title: CURRENT_TIMESTAMP default is set at insert and equals now() within the transaction
family: doc-ddl-default
tier: core
feature_ids: [default-values, timestamp, transactions]
required_capabilities: [create-table, insert, select, transactions, timestamp]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-default (common example: timestamp column with CURRENT_TIMESTAMP default)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ts_default (
          id int,
          created timestamptz DEFAULT CURRENT_TIMESTAMP,
          due date DEFAULT (date '2020-02-28' + 2)
      )
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO ts_default (id) VALUES (1), (2)
    expect: ok
  - sql: |
      SELECT id, created = now() AS same_as_now, created IS NOT NULL AS set, due FROM ts_default ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
