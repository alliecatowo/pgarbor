# Error conditions for GREATEST and LEAST: incompatible argument types and an empty argument list.
id: doc-functions-conditional.greatest-least-type-errors
title: GREATEST and LEAST reject incompatible argument types and empty argument lists
family: doc-functions-conditional
tier: core
feature_ids: [greatest, least, type-resolution, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-greatest-least (expressions must all be convertible to a common data type)"
sessions: [a]
steps:
  - sql: |
      SELECT GREATEST(1, 'abc'::text)
    expect: error
    sqlstate: "42804"
    comment: integer and text have no common type
  - sql: |
      SELECT GREATEST(1, 'abc')
    expect: error
    sqlstate: "22P02"
    comment: unknown literal is coerced to integer and fails to parse
  - sql: |
      SELECT GREATEST()
    expect: error
    sqlstate: "42601"
    comment: at least one argument is required
  - sql: |
      SELECT LEAST()
    expect: error
    sqlstate: "42601"
    comment: same for LEAST
