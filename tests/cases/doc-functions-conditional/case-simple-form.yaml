# Simple CASE: the documented example, first matching WHEN wins, and NULL never equals NULL.
id: doc-functions-conditional.case-simple-form
title: Simple CASE expression compares its operand with each WHEN value
family: doc-functions-conditional
tier: core
feature_ids: [case-expression, simple-case, null-semantics]
required_capabilities: [select, create-table, insert]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-case (simple CASE syntax example)"
sessions: [a]
setup: |
  CREATE TABLE test (a int4);
  INSERT INTO test VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT a, CASE a WHEN 1 THEN 'one' WHEN 2 THEN 'two' ELSE 'other' END AS c FROM test ORDER BY a
    expect: rows
    order: ordered
    comment: documented simple-form example output
  - sql: |
      SELECT CASE NULL::int4 WHEN NULL THEN 'matched' ELSE 'else' END AS null_operand, CASE 1 WHEN NULL THEN 'matched' ELSE 'else' END AS null_value
    expect: rows
    order: multiset
    comment: operand = NULL is never true, so both fall through to ELSE
  - sql: |
      SELECT CASE 1 WHEN 1 THEN 'first' WHEN 1 THEN 'second' END AS c
    expect: rows
    order: multiset
    comment: the first matching WHEN is the one that is used
  - sql: |
      SELECT CASE 2 WHEN 1 THEN 'a' END AS no_match
    expect: rows
    order: multiset
    comment: no match and no ELSE yields NULL
