# Error conditions for CASE: branch types that cannot be matched, and an invalid simple-CASE comparison.
id: doc-functions-conditional.case-branch-type-errors
title: CASE rejects branch types that cannot be resolved to a common type
family: doc-functions-conditional
tier: core
feature_ids: [case-expression, type-resolution, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-case (data types of all result expressions must be convertible to a single output type)"
sessions: [a]
steps:
  - sql: |
      SELECT CASE WHEN true THEN 1 ELSE 'abc' END
    expect: error
    sqlstate: "22P02"
    comment: unknown literal is coerced to integer and fails to parse
  - sql: |
      SELECT CASE WHEN true THEN 'x' ELSE 1 END
    expect: error
    sqlstate: "22P02"
    comment: unknown literal 'x' is coerced to integer
  - sql: |
      SELECT CASE WHEN true THEN 1 ELSE ARRAY[1] END
    expect: error
    sqlstate: "42804"
    comment: integer and integer[] have no common type
  - sql: |
      SELECT CASE 'x' WHEN 1 THEN 'a' ELSE 'b' END
    expect: error
    sqlstate: "42883"
    comment: simple CASE needs operand = value to exist; text = integer does not
