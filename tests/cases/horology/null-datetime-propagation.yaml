# NULL inputs to datetime functions, operators and casts yield NULL without error.
id: horology.null-datetime-propagation
title: NULL date, time, timestamp and interval inputs propagate as SQL NULL
family: horology
tier: core
feature_ids: [date, timestamp, interval, null-handling, to-timestamp]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 functions-datetime: operators on NULL are NULL; derived from horology.sql null-free cases"
sessions: [a]
setup: |
  CREATE TABLE dt_null (id int4 PRIMARY KEY, d date, t time, ts timestamp, iv interval);
  INSERT INTO dt_null VALUES (1, NULL, NULL, NULL, NULL), (2, date '2001-12-27', time '04:05:06', timestamp '2001-12-27 04:05:06', interval '2 years');
steps:
  - sql: |
      SELECT id,
             d + interval '1 day' AS d_plus,
             t + interval '1 hour' AS t_plus,
             ts - interval '1 second' AS ts_minus,
             d + iv AS d_plus_iv,
             to_timestamp(NULL, 'YYYY') AS to_ts_null
      FROM dt_null ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, d IS NULL AS d_null, ts > '2000-01-01' AS ts_after
      FROM dt_null ORDER BY id
    expect: rows
    order: ordered
