# timestamptz plus interval across a DST change under a POSIX rule: calendar days vs 24 hours.
id: horology.dst-interval-arithmetic
title: timestamptz plus one day versus 24 hours across a daylight-saving change
family: horology
tier: extended
feature_ids: [timestamptz, interval, timezone-rules, dst]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'CST7CDT,M4.1.0,M10.5.0'
    expect: ok
  - sql: |
      SELECT timestamptz '2005-04-02 12:00-07' + interval '1 day' AS day_across_dst,
             timestamptz '2005-04-02 12:00-07' + interval '24 hours' AS hours_across_dst,
             timestamptz '2005-04-03 12:00-06' - interval '1 day' AS day_back,
             timestamptz '2005-04-03 12:00-06' - interval '24 hours' AS hours_back
    expect: rows
    order: ordered
    comment: provenance lines 199-203
  - sql: |
      RESET TIME ZONE
    expect: ok
