# Malformed date/time strings and conflicting fields must fail with invalid text representation.
id: horology.timestamptz-invalid-input
title: Malformed timestamptz literals and conflicting special-value fields are rejected
family: horology
tier: core
feature_ids: [timestamptz, datetime-input, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT timestamptz '2001-12-27 allballs'
    expect: error
    sqlstate: "22007"
    comment: provenance line 24
  - sql: |
      SELECT timestamptz 'epoch 01:01:01'
    expect: error
    sqlstate: "22007"
    comment: provenance line 126 conflicting fields
  - sql: |
      SELECT timestamptz '-infinity infinity'
    expect: error
    sqlstate: "22007"
    comment: provenance line 130
  - sql: |
      SELECT timestamptz '2001-12-27 04:05:06.789 MET DST' AS valid_zone_abbrev
    expect: rows
    order: ordered
