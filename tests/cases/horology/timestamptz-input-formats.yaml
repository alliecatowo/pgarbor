# timestamptz text input: compact and extended ISO forms, slash and US forms, with fractional seconds.
id: horology.timestamptz-input-formats
title: timestamptz accepts compact ISO, extended ISO, slash and US date input
family: horology
tier: core
feature_ids: [timestamptz, datetime-input, timezone-offset]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
setup: |
  CREATE TABLE ts_in (id int4 PRIMARY KEY, s text NOT NULL);
  INSERT INTO ts_in VALUES
    (1, '20011227 040506+08'),
    (2, '20011227T040506.789-08'),
    (3, '2001-12-27 04:05:06.789-08'),
    (4, '2001.12.27 04:05:06.789-08'),
    (5, '2001/12/27 04:05:06.789-08'),
    (6, '12/27/2001 04:05:06.789-08'),
    (7, '2001-12-27 04:05:06.789 MET DST');
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT id, s::timestamptz AS ts FROM ts_in ORDER BY id
    expect: rows
    order: ordered
    comment: provenance lines 11-23
