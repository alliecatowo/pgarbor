# Field values that parse syntactically but exceed calendar ranges are rejected with datetime_field_overflow.
id: horology.to-timestamp-out-of-range
title: to_timestamp rejects impossible calendar and clock fields
family: horology
tier: core
feature_ids: [to-timestamp, errors, datetime-range]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT to_timestamp('2016-02-30 15:50:55', 'YYYY-MM-DD HH24:MI:SS')
    expect: error
    sqlstate: "22008"
    comment: provenance line 652
  - sql: |
      SELECT to_timestamp('2016-06-13 25:00:00', 'YYYY-MM-DD HH24:MI:SS')
    expect: error
    sqlstate: "22008"
    comment: provenance line 646
  - sql: |
      SELECT to_timestamp('2016-02-29 15:50:55', 'YYYY-MM-DD HH24:MI:SS') IS NOT NULL AS leap_day_ok
    expect: rows
    order: ordered
    comment: provenance line 653, leap day is valid in 2016
