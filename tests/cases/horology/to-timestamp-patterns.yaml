# to_timestamp template patterns: month names, 12-hour clock with meridian, compact digit runs, and day-of-year.
id: horology.to-timestamp-patterns
title: to_timestamp parses month names, 12-hour clock, compact digits and ISO week forms
family: horology
tier: core
feature_ids: [to-timestamp, formatting, timestamptz]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT to_timestamp('1985 January 12', 'YYYY FMMonth DD') AS month_name,
             to_timestamp('2011-12-18 11:38 PM', 'YYYY-MM-DD HH12:MI PM') AS pm_clock,
             to_timestamp('2011-12-18 11:38 AM', 'YYYY-MM-DD HH12:MI PM') AS am_clock,
             to_timestamp('19971116', 'YYYYMMDD') AS compact,
             to_timestamp('05121445482000', 'MMDDHH24MISSYYYY') AS digit_run,
             to_timestamp('2005300', 'YYYYDDD') AS day_of_year,
             to_timestamp('2018-11-02 12:34:56.025', 'YYYY-MM-DD HH24:MI:SS.MS') AS millis
    expect: rows
    order: ordered
    comment: provenance lines 465-556
