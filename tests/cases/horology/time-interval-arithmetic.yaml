# time plus or minus interval wraps within the day; months are ignored for time values.
id: horology.time-interval-arithmetic
title: time values plus and minus intervals wrap around midnight and ignore months
family: horology
tier: core
feature_ids: [time, interval, time-arithmetic, casts]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT time '01:30' + interval '02:01' AS add_basic,
             time '01:30' - interval '02:01' AS sub_wraps,
             time '02:30' + interval '36:01' AS add_over_a_day,
             time '03:30' + interval '1 month 04:01' AS month_ignored
    expect: rows
    order: ordered
    comment: provenance lines 224-227
  - sql: |
      SELECT CAST(time '01:02' AS interval) AS time_as_interval,
             CAST(interval '02:03' AS time) AS interval_as_time,
             CAST(interval '-02:03' AS time) AS negative_interval_as_time
    expect: rows
    order: ordered
    comment: provenance lines 220-222
