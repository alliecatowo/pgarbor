# Special values combined with other date fields are errors; each statement runs in autocommit.
id: horology.date-special-values-errors
title: Conflicting special date and timestamp values raise input errors
family: horology
tier: core
feature_ids: [date, timestamp, infinity, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT date '1995-08-06 epoch'
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT date '1995-08-06 infinity'
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT date '-infinity infinity'
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT timestamp 'infinity 01:01:01'
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT timestamp 'now epoch'
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT timestamp '-infinity' AS neg_inf, timestamp 'infinity' AS pos_inf
    expect: rows
    order: ordered
    comment: valid bare special values for contrast
