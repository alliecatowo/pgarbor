# SQL OVERLAPS predicate over timestamps, intervals and times, including the SQL-spec time wrap case.
id: horology.overlaps-operator
title: OVERLAPS returns true for intersecting periods and false for adjacent or wrapped ones
family: horology
tier: core
feature_ids: [overlaps, timestamp, time, interval, predicates]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT
        (timestamp '2000-11-27', timestamp '2000-11-28')
          OVERLAPS (timestamp '2000-11-27 12:00', timestamp '2000-11-30') AS true_overlap,
        (timestamp '2000-11-26', timestamp '2000-11-27')
          OVERLAPS (timestamp '2000-11-27 12:00', timestamp '2000-11-30') AS false_before,
        (timestamp '2000-11-27', interval '12 hours')
          OVERLAPS (timestamp '2000-11-27 12:00', interval '12 hours') AS false_start_at_12,
        (timestamp '2000-11-27', interval '12 hours')
          OVERLAPS (timestamp '2000-11-27', interval '12 hours') AS true_identical,
        (time '00:00', time '01:00') OVERLAPS (time '00:30', time '01:30') AS time_true,
        (time '00:00', interval '1 hour') OVERLAPS (time '01:30', interval '1 hour') AS time_false,
        (time '00:00', interval '1 hour') OVERLAPS (time '01:30', interval '1 day') AS time_wrap_spec_false
    expect: rows
    order: ordered
    comment: provenance lines 263-314; SQL standard result for the last column is false
