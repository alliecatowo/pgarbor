# Interval arithmetic that leaves the supported timestamp range must fail with datetime_value_out_of_range.
id: horology.timestamp-out-of-range
title: Timestamp arithmetic past the representable range raises 22008
family: horology
tier: core
feature_ids: [timestamp, interval, errors, datetime-range]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT timestamp without time zone '2000-01-01' - interval '2483590 days'
    expect: error
    sqlstate: "22008"
    comment: provenance line 156 (before 4713 BC)
  - sql: |
      SELECT timestamp without time zone '294276-12-31 23:59:59' + interval '9223372036854775807 microseconds'
    expect: error
    sqlstate: "22008"
    comment: provenance line 157
  - sql: |
      SELECT timestamp without time zone 'Jan 1, 4713 BC' + interval '109203489 days' AS near_max
    expect: rows
    order: ordered
