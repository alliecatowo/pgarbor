# DateStyle decides how ambiguous day/month input is read; 27/12 is out of range in MDY.
id: horology.timestamptz-datestyle-dmy
title: Day-first input is rejected under MDY and accepted after SET DateStyle to DMY
family: horology
tier: extended
feature_ids: [timestamptz, datestyle, datetime-input, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SET DateStyle = 'Postgres, MDY'
    expect: ok
  - sql: |
      SELECT timestamptz '27/12/2001 04:05:06.789-08'
    expect: error
    sqlstate: "22008"
    comment: month 27 is out of range in MDY order
  - sql: |
      SET DateStyle = 'Postgres, DMY'
    expect: ok
  - sql: |
      SELECT timestamptz '27/12/2001 04:05:06.789-08' AS dmy_input
    expect: rows
    order: ordered
  - sql: |
      SET DateStyle = 'ISO, MDY'
    expect: ok
