# DDD day-of-year bounds: day 366 only in leap years, and day 367 is always out of range.
id: horology.day-of-year-limits
title: to_date DDD accepts 366 only in leap years and rejects 367
family: horology
tier: extended
feature_ids: [to-date, day-of-year, leap-year, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT to_date('2015 365', 'YYYY DDD') AS nonleap_last
    expect: rows
    order: ordered
    comment: provenance line 667
  - sql: |
      SELECT to_date('2015 366', 'YYYY DDD')
    expect: error
    sqlstate: "22008"
    comment: provenance line 668
  - sql: |
      SELECT to_date('2016 366', 'YYYY DDD') AS leap_last
    expect: rows
    order: ordered
    comment: provenance line 670
  - sql: |
      SELECT to_date('2016 367', 'YYYY DDD')
    expect: error
    sqlstate: "22008"
    comment: provenance line 671
