# Timestamp minus or plus interval across month and leap-year boundaries.
id: horology.timestamp-interval-month-end
title: Interval arithmetic across month ends and leap days
family: horology
tier: core
feature_ids: [timestamp, interval, date-arithmetic]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT timestamp without time zone '1996-03-01' - interval '1 second' AS feb29_1996,
             timestamp without time zone '1999-03-01' - interval '1 second' AS feb28_1999,
             timestamp without time zone '2000-03-01' - interval '1 second' AS feb29_2000,
             timestamp without time zone '1999-12-01' + interval '1 month - 1 second' AS dec31_1999
    expect: rows
    order: ordered
    comment: provenance lines 149-152
  - sql: |
      SELECT timestamp without time zone '2000-01-31 10:00' + interval '1 month' AS clamp_end_of_month
    expect: rows
    order: ordered
    comment: PostgreSQL clamps the day-of-month to the last day of the target month
