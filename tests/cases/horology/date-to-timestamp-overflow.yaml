# Dates outside the timestamp range fail on cast, while cross-type comparisons still succeed.
id: horology.date-to-timestamp-overflow
title: Casting far-future date to timestamp fails but comparing date to timestamp works
family: horology
tier: core
feature_ids: [date, timestamp, timestamptz, comparisons, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '2202020-10-05'::date::timestamp
    expect: error
    sqlstate: "22008"
    comment: provenance line 362
  - sql: |
      SELECT '2202020-10-05'::date::timestamptz
    expect: error
    sqlstate: "22008"
    comment: provenance line 366
  - sql: |
      SELECT '2202020-10-05'::date > '2020-10-05'::timestamp AS far_future_gt,
             '2020-10-05'::timestamp > '2202020-10-05'::date AS far_future_lt
    expect: rows
    order: ordered
    comment: provenance lines 363-364
