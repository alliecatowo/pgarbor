# Basic date/time/interval arithmetic with fixed UTC session time zone.
id: horology.date-arithmetic-basic
title: date plus time, date minus interval, and date plus timetz
family: horology
tier: slice
feature_ids: [date, time, timetz, interval, timestamp, date-arithmetic]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT date '1981-02-03' + time '04:05:06' AS dt_time,
             date '1991-02-03' + interval '2 years' AS add_two_years,
             date '2001-12-13' - interval '2 years' AS sub_two_years,
             date '1994-01-01' + timetz '11:00-5' AS date_plus_timetz
    expect: rows
    order: ordered
    comment: provenance lines 136, 139, 140, 179
