# Julian day input and BC dates through to_date and date literals.
id: horology.date-julian-and-bc
title: Julian-day literals and BC dates via to_date and date literals
family: horology
tier: extended
feature_ids: [date, to-date, julian-day, bc-dates]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/horology.sql"
sessions: [a]
steps:
  - sql: |
      SELECT to_date('44-02-01 BC', 'YYYY-MM-DD BC') AS bc_explicit,
             to_date('-44-02-01', 'YYYY-MM-DD') AS negative_year,
             to_date('0000-02-01', 'YYYY-MM-DD') AS year_zero,
             to_date('2458872', 'J') AS julian
    expect: rows
    order: ordered
    comment: provenance lines 570, 576-578, 672
  - sql: |
      SELECT date 'J0' AS julian_epoch
    expect: rows
    order: ordered
    comment: provenance line 94
