# scale, min_scale and trim_scale describe and reduce the fractional digits of numeric values.
id: doc-functions-math.numeric-scale-functions
title: scale, min_scale and trim_scale report and reduce numeric fractional digits
family: doc-functions-math
tier: core
feature_ids: [numeric-scale, min-scale, trim-scale]
required_capabilities: [select, numeric, create-table, insert]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (scale, min_scale, trim_scale)"
sessions: [a]
steps:
  - sql: |
      SELECT scale(8.4100) AS sc, min_scale(8.4100) AS msc, trim_scale(8.4100) AS tsc
    expect: rows
    order: multiset
    comment: documented examples 4, 2, 8.41
  - sql: |
      SELECT scale(0) AS sc0, min_scale(0) AS msc0, trim_scale(0.000) AS tsc0, scale(-1.50) AS scn
    expect: rows
    order: multiset
  - sql: |
      SELECT trim_scale(100.0) AS t_int_valued, scale(100.0) AS s_int_valued, min_scale(100.0) AS m_int_valued
    expect: rows
    order: multiset
    comment: trim_scale keeps the value even when all fractional digits are removed
  - sql: |
      SELECT scale(1.5::float8) AS sc_float
    expect: error
    sqlstate: "42883"
    comment: scale is defined only for numeric, not double precision
