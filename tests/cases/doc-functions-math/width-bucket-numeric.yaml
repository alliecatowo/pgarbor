# width_bucket(operand, low, high, count) for numeric and double precision: inclusive lower bounds, out-of-range buckets.
id: doc-functions-math.width-bucket-numeric
title: width_bucket places operands into equal-width buckets with documented boundary and mirror behavior
family: doc-functions-math
tier: core
feature_ids: [width-bucket, histogram-bucketing]
required_capabilities: [select, numeric, float8, int4, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (width_bucket, equal-width form)"
sessions: [a]
steps:
  - sql: |
      SELECT width_bucket(5.35, 0.024, 10.06, 5) AS doc_example, width_bucket(9, 10, 0, 10) AS mirrored
    expect: rows
    order: multiset
    comment: documented examples 3 and 2
  - sql: |
      SELECT width_bucket(0, 0, 10, 5) AS at_low, width_bucket(10, 0, 10, 5) AS at_high, width_bucket(-0.001, 0, 10, 5) AS below, width_bucket(10.5, 0, 10, 5) AS above
    expect: rows
    order: multiset
    comment: inclusive lower bound 0 is bucket 1; high itself is count+1; below range is 0
  - sql: |
      SELECT width_bucket(3.5::float8, 0::float8, 10::float8, 5) AS f_mid, width_bucket(NULL::numeric, 0, 10, 5) AS null_operand
    expect: rows
    order: multiset
  - sql: |
      SELECT width_bucket(1.0, 0, 10, 0)
    expect: error
    sqlstate: 2201G
    comment: count must be greater than zero
