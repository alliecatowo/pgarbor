# Exponential, logarithm, power and root functions with documented examples.
id: doc-functions-math.exp-log-sqrt-examples
title: exp, ln, log, log10, power, sqrt and cbrt match documented examples
family: doc-functions-math
tier: core
feature_ids: [exponential, logarithm, power-function, square-root, cube-root]
required_capabilities: [select, numeric, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (exp, ln, log, log10, power, sqrt, cbrt)"
sessions: [a]
steps:
  - sql: |
      SELECT exp(1.0) AS e_numeric, exp(1.0::float8) AS e_float, ln(2.0) AS ln_numeric, ln(2.0::float8) AS ln_float
    expect: rows
    order: multiset
    comment: documented exp(1.0) and ln(2.0) examples; numeric and double precision forms
  - sql: |
      SELECT log(100) AS log_base10, log10(1000) AS log10_1000, log(2.0, 64.0) AS log_base2_64, log10(100::numeric) AS log10_numeric
    expect: rows
    order: multiset
    comment: documented log(100)=2 log10(1000)=3 log(2.0,64.0)=6.0000000000000000
  - sql: |
      SELECT power(9, 3) AS pow_int, power(9.0::float8, 0.5::float8) AS pow_float, 2.0 ^ 3.0 AS pow_op_numeric
    expect: rows
    order: multiset
    comment: documented power(9,3)=729
  - sql: |
      SELECT sqrt(2) AS sqrt2_numeric, sqrt(2::float8) AS sqrt2_float, cbrt(64.0) AS cbrt64
    expect: rows
    order: multiset
    comment: documented sqrt(2) and cbrt(64.0)=4
  - sql: |
      SELECT exp(0) AS e0, ln(1) AS ln1, power(2, 0) AS pow0, sqrt(0) AS sqrt0
    expect: rows
    order: multiset
