# Documented domain errors of mathematical functions: each raises an error with the SQLSTATE the server reports.
id: doc-functions-math.domain-errors
title: Math domain errors raise the documented SQLSTATE codes for root, log and power inputs
family: doc-functions-math
tier: core
feature_ids: [math-errors, square-root, logarithm, power-function]
required_capabilities: [select, numeric, float8, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (sqrt, ln, log, power, acos domains)"
sessions: [a]
steps:
  - sql: |
      SELECT sqrt(-1)
    expect: error
    sqlstate: 2201F
    comment: cannot take square root of a negative number
  - sql: |
      SELECT sqrt(-1::float8)
    expect: error
    sqlstate: 2201F
  - sql: |
      SELECT ln(0)
    expect: error
    sqlstate: 2201E
    comment: cannot take logarithm of zero
  - sql: |
      SELECT ln(-1::float8)
    expect: error
    sqlstate: 2201E
  - sql: |
      SELECT log(0, 10)
    expect: error
    sqlstate: 2201E
  - sql: |
      SELECT power(0, -1)
    expect: error
    sqlstate: 2201F
    comment: zero raised to a negative power is undefined
  - sql: |
      SELECT power(-8, 1.0 / 3)
    expect: error
    sqlstate: 2201F
    comment: negative base with fractional exponent is undefined for numeric
  - sql: |
      SELECT width_bucket(1, 0, 10, -1)
    expect: error
    sqlstate: 2201G
