# erf, erfc, gamma and lgamma with documented examples and exact integer gamma values.
id: doc-functions-math.special-functions-erf-gamma
title: erf, erfc, gamma and lgamma match documented examples including exact factorial-valued gamma
family: doc-functions-math
tier: core
feature_ids: [error-function, gamma-function, log-gamma]
required_capabilities: [select, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (erf, erfc, gamma, lgamma)"
sessions: [a]
steps:
  - sql: |
      SELECT erf(1.0) AS erf1, erfc(1.0) AS erfc1, erf(0) AS erf0, erfc(0) AS erfc0
    expect: rows
    order: multiset
    comment: documented erf(1.0) and erfc(1.0); erf(0) is exact zero
  - sql: |
      SELECT gamma(0.5) AS gamma_half, gamma(6) AS gamma6, lgamma(1000) AS lgamma1000
    expect: rows
    order: multiset
    comment: documented gamma(0.5), gamma(6)=120 and lgamma(1000)
  - sql: |
      SELECT gamma(1) AS gamma1, gamma(2) AS gamma2, gamma(-0.5) AS gamma_neg_half
    expect: rows
    order: multiset
  - sql: |
      SELECT gamma(0) AS gamma_zero
    expect: error
    sqlstate: "22003"
    comment: gamma has poles at non-positive integers
