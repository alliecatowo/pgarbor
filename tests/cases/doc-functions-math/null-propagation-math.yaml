# NULL inputs to math functions and operators return NULL, except where documented otherwise.
id: doc-functions-math.null-propagation
title: Math functions and operators return NULL for NULL inputs and 1 for zero to the zero power
family: doc-functions-math
tier: core
feature_ids: [null-semantics, math-operators, math-functions]
required_capabilities: [select, numeric, int4, int8, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (strict functions; ^ on zero)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 + NULL::int4 AS add_null, NULL::numeric * 2 AS mul_null, NULL::int8 % 3 AS mod_null, NULL::int4 & 1 AS and_null, ~NULL::int2 AS not_null
    expect: rows
    order: multiset
  - sql: |
      SELECT abs(NULL::int4) AS abs_null, round(NULL::numeric, 2) AS round_null, trunc(NULL::float8) AS trunc_null, sqrt(NULL::float8) AS sqrt_null, sign(NULL::numeric) AS sign_null
    expect: rows
    order: multiset
  - sql: |
      SELECT power(NULL::numeric, 2) AS pow_null, NULL::numeric ^ 0 AS pow_null_zero_exp, gcd(NULL::int4, 4) AS gcd_null, factorial(NULL::int8) AS fact_null, width_bucket(NULL::numeric, 0, 10, 5) AS wb_null
    expect: rows
    order: multiset
  - sql: |
      SELECT 0 ^ 0 AS zero_pow_zero, 0::float8 ^ 0::float8 AS zero_pow_zero_float, 'NaN'::float8 ^ 0 AS nan_pow_zero
    expect: rows
    order: multiset
    comment: documented PostgreSQL behavior returns 1 for any base raised to 0 in the float form, including NaN
  - sql: |
      SELECT count(*) AS null_rows, count(x % 2) AS non_null_mod FROM (VALUES (5), (NULL::int4), (7)) AS t(x)
    expect: rows
    order: multiset
