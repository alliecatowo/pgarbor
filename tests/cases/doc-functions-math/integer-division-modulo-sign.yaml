# Integer division truncates toward zero; % and mod() take the sign of the dividend; div() is the integer quotient.
id: doc-functions-math.integer-division-modulo-sign
title: Integer division, modulo and div() truncate toward zero with dividend-signed remainders
family: doc-functions-math
tier: core
feature_ids: [integer-division, modulo, div-function, mod-function]
required_capabilities: [select, numeric, int2, int4, int8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (/, %, div, mod)"
sessions: [a]
steps:
  - sql: |
      SELECT div(9, 4) AS div_pos, mod(9, 4) AS mod_pos, 9 % 4 AS op_mod_pos
    expect: rows
    order: multiset
    comment: documented div(9,4)=2 and mod(9,4)=1
  - sql: |
      SELECT (-9) / 4 AS trunc_neg, div(-9, 4) AS div_neg, (-9) % 4 AS mod_neg_dividend, 9 % (-4) AS mod_neg_divisor, mod(-9, 4) AS mod_fn_neg
    expect: rows
    order: multiset
    comment: quotient truncates toward zero; remainder takes the sign of the dividend
  - sql: |
      SELECT (-7)::int8 / 2 AS i8_trunc, (-7)::int2 % 3::int2 AS i2_mod, mod(-7::int8, 3::int8) AS i8_mod
    expect: rows
    order: multiset
  - sql: |
      SELECT 7 / 2.0 AS half_numeric, div(7.5, 2) AS div_numeric
    expect: rows
    order: multiset
    comment: div on numeric returns the integer part of the quotient as numeric
