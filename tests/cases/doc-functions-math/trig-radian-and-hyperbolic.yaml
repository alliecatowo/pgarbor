# Radian-based trigonometric functions, pi, degrees/radians conversion and hyperbolic functions.
id: doc-functions-math.trig-radian-and-hyperbolic
title: Radian trigonometry, pi, unit conversion and hyperbolic functions match documented examples
family: doc-functions-math
tier: core
feature_ids: [trigonometry, radian-functions, hyperbolic-functions, pi, unit-conversion]
required_capabilities: [select, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (Trigonometric, Hyperbolic, degrees, radians, pi)"
sessions: [a]
steps:
  - sql: |
      SELECT pi() AS p, degrees(0.5) AS deg_of_half, radians(45.0) AS rad_of_45
    expect: rows
    order: multiset
    comment: documented pi() 3.141592653589793 degrees(0.5) 28.64788975654116 radians(45.0) 0.7853981633974483
  - sql: |
      SELECT cos(0) AS cos0, sin(1) AS sin1, tan(1) AS tan1, cot(0.5) AS cot_half, acos(1) AS acos1, asin(1) AS asin1, atan(1) AS atan1, atan2(1, 0) AS atan2_y
    expect: rows
    order: multiset
    comment: documented values for each radian function example
  - sql: |
      SELECT sinh(0) AS sinh0, cosh(0) AS cosh0, tanh(0) AS tanh0, asinh(0) AS asinh0, acosh(1) AS acosh1, atanh(0) AS atanh0
    expect: rows
    order: multiset
  - sql: |
      SELECT sinh(1) AS sinh1, cosh(1) AS cosh1, tanh(1) AS tanh1
    expect: rows
    order: multiset
    comment: double precision output is recorded from the oracle, never written by hand
  - sql: |
      SELECT acos(2) AS out_of_domain
    expect: error
    sqlstate: "22003"
    comment: acos is defined only on [-1, 1]
