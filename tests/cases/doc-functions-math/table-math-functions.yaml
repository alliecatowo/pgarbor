# Math functions applied per row to a numeric table column, with deterministic ordering and documented tie and sign rules.
id: doc-functions-math.table-math-functions
title: Row-wise rounding, sign and modulo over a numeric table column with ordered output
family: doc-functions-math
tier: core
feature_ids: [round, trunc, sign, abs, modulo, table-expressions]
required_capabilities: [create-table, insert, select, numeric, int4, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (round, trunc, sign, abs, mod)"
sessions: [a]
setup: |
  CREATE TABLE m (id int4 PRIMARY KEY, x numeric(10, 3) NOT NULL);
  INSERT INTO m VALUES (1, 2.500), (2, -2.500), (3, 0.000), (4, 7.125), (5, -7.125), (6, 42.4382);
steps:
  - sql: |
      SELECT id, round(x) AS r0, trunc(x, 1) AS t1, ceil(x) AS c, floor(x) AS f, sign(x) AS s, abs(x) AS a FROM m ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, mod(id, 3) AS m3, id % 4 AS m4, x % 2 AS xm2 FROM m ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT sum(abs(x)) AS total_abs, sum(sign(x)) AS total_sign, max(scale(x)) AS max_scale FROM m
    expect: rows
    order: multiset
