# Basic numeric operators from the Mathematical Operators table, with integer truncation and mixed-type resolution.
id: doc-functions-math.operators-arithmetic
title: Basic arithmetic operators follow the documented examples and mixed-type resolution
family: doc-functions-math
tier: core
feature_ids: [math-operators, arithmetic, integer-division, type-resolution]
required_capabilities: [select, numeric, int2, int8, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (Mathematical Operators table)"
sessions: [a]
steps:
  - sql: |
      SELECT 2 + 3 AS add_, + 3.5 AS uplus, 2 - 3 AS sub, - (-4) AS neg, 2 * 3 AS mul
    expect: rows
    order: multiset
    comment: documented examples 5, 3.5, -1, 4, 6
  - sql: |
      SELECT 5.0 / 2 AS numeric_div, 5 / 2 AS int_div, (-5) / 2 AS neg_int_div
    expect: rows
    order: multiset
    comment: integral division truncates toward zero; numeric division keeps scale
  - sql: |
      SELECT 5 % 4 AS modulo, 2 ^ 3 AS power_int
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_typeof(1 + 2.5) AS t_int_numeric, pg_typeof(1 + 2.5::real) AS t_int_real, pg_typeof(1::int2 + 1::int8) AS t_int2_int8, pg_typeof(5 / 2) AS t_int_div, pg_typeof(2 ^ 3) AS t_pow
    expect: rows
    order: multiset
    comment: cross-type calls resolve to the type appearing later in the operator lists
  - sql: |
      SELECT 1 + 2.5 AS mixed_sum, 7::int8 - 2::int2 AS mixed_diff
    expect: rows
    order: multiset
