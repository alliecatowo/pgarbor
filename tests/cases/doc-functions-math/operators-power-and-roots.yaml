# Exponentiation associates left to right; |/ square root, ||/ cube root, @ absolute value.
id: doc-functions-math.operators-power-and-roots
title: Power operator associates left to right; root and absolute-value prefix operators
family: doc-functions-math
tier: core
feature_ids: [math-operators, exponentiation, square-root, cube-root, absolute-value]
required_capabilities: [select, numeric, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (Mathematical Operators table, ^ associativity note)"
sessions: [a]
steps:
  - sql: |
      SELECT 2 ^ 3 ^ 3 AS left_assoc, 2 ^ (3 ^ 3) AS explicit_right
    expect: rows
    order: multiset
    comment: documented values 512 and 134217728
  - sql: |
      SELECT |/ 25.0 AS sqrt_op, ||/ 64.0 AS cbrt_op, @ -5.0 AS abs_numeric
    expect: rows
    order: multiset
  - sql: |
      SELECT @ -0.0 AS abs_zero, @ 7 AS abs_int, |/ 2.0 AS sqrt_two
    expect: rows
    order: multiset
  - sql: |
      SELECT 0 ^ 0 AS zero_pow_zero, 1 ^ 100 AS one_pow
    expect: rows
    order: multiset
    comment: 0 to the power 0 is defined as 1 in PostgreSQL
