# round, trunc, ceil, floor, sign and abs on numeric values, including tie-breaking and scale arguments.
id: doc-functions-math.round-trunc-ceil-floor
title: Rounding, truncation, ceiling, floor and sign follow documented tie and sign rules
family: doc-functions-math
tier: core
feature_ids: [round, trunc, ceil, floor, sign, abs]
required_capabilities: [select, numeric, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (round, trunc, ceil, floor, sign, abs)"
sessions: [a]
steps:
  - sql: |
      SELECT round(42.4382, 2) AS r_scale, round(1234.56, -1) AS r_neg_scale, trunc(42.4382, 2) AS t_scale, trunc(-42.8) AS t_neg
    expect: rows
    order: multiset
    comment: documented examples 42.44, 1230, 42.43, -42
  - sql: |
      SELECT round(2.5::numeric) AS r_tie_pos, round(-2.5::numeric) AS r_tie_neg, round(0.125::numeric, 2) AS r_tie_scale
    expect: rows
    order: multiset
    comment: numeric ties are rounded away from zero
  - sql: |
      SELECT ceil(42.2) AS c1, ceil(-42.8) AS c2, ceiling(95.3) AS c3, floor(42.8) AS f1, floor(-42.8) AS f2
    expect: rows
    order: multiset
    comment: documented examples 43, -42, 96, 42, -43
  - sql: |
      SELECT abs(-17.4) AS a1, sign(-8.4) AS s_neg, sign(0) AS s_zero, sign(3.0::float8) AS s_pos_float
    expect: rows
    order: multiset
  - sql: |
      SELECT trunc(42.8::float8) AS tf, round(42.4::float8) AS rf, ceil(-0.5::float8) AS cf
    expect: rows
    order: multiset
    comment: double precision ties are platform dependent, so none are used here
