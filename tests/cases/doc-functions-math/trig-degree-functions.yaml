# Degree-based trigonometric functions and their documented exact values.
id: doc-functions-math.trig-degree-functions
title: Degree-based trigonometric functions return documented values for special angles
family: doc-functions-math
tier: core
feature_ids: [trigonometry, degree-functions, inverse-trigonometry]
required_capabilities: [select, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (Trigonometric Functions, *d variants)"
sessions: [a]
steps:
  - sql: |
      SELECT sind(30) AS sind30, cosd(60) AS cosd60, tand(45) AS tand45, cotd(45) AS cotd45
    expect: rows
    order: multiset
    comment: documented sind(30)=0.5 cosd(60)=0.5 tand(45)=1 cotd(45)=1
  - sql: |
      SELECT acosd(0.5) AS acosd_half, asind(0.5) AS asind_half, atand(1) AS atand_one, atan2d(1, 0) AS atan2d_y_axis
    expect: rows
    order: multiset
    comment: documented acosd(0.5)=60 asind(0.5)=30 atand(1)=45 atan2d(1,0)=90
  - sql: |
      SELECT sind(0) AS sind0, cosd(0) AS cosd0, sind(90) AS sind90, cosd(90) AS cosd90
    expect: rows
    order: multiset
    comment: exact at multiples of 90 degrees, unlike radian-based trigonometry
  - sql: |
      SELECT sind(NULL::float8) AS null_in
    expect: rows
    order: multiset
