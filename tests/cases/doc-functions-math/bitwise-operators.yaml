# Bitwise operators on integral types from the Mathematical Operators table.
id: doc-functions-math.bitwise-operators
title: Bitwise AND, OR, XOR, NOT and shifts on smallint, integer and bigint
family: doc-functions-math
tier: core
feature_ids: [bitwise-operators, integral-types, shifts]
required_capabilities: [select, int2, int4, int8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (Mathematical Operators table, bitwise rows)"
sessions: [a]
steps:
  - sql: |
      SELECT 91 & 15 AS b_and, 32 | 3 AS b_or, 17 # 5 AS b_xor, ~1 AS b_not, 1 << 4 AS b_shl, 8 >> 2 AS b_shr
    expect: rows
    order: multiset
    comment: documented examples 11, 35, 20, -2, 16, 2
  - sql: |
      SELECT (-8) >> 1 AS arith_shr, (-1) & 255 AS neg_and, ~0 AS not_zero
    expect: rows
    order: multiset
    comment: right shift of negative integers is arithmetic
  - sql: |
      SELECT (5::int2 & 3::int2) AS int2_and, (5::int8 | 8::int8) AS int8_or, pg_typeof(5::int2 & 3::int2) AS t2, pg_typeof(5::int8 << 2) AS t8
    expect: rows
    order: multiset
  - sql: |
      SELECT 1::int8 << 62 AS big_shift, 1::int4 << 31 AS int4_shift_wraps
    expect: rows
    order: multiset
    comment: int4 shift past the sign bit yields a negative value without error
