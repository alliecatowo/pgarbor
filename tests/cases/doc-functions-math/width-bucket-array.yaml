# width_bucket(operand, thresholds) with a sorted array of inclusive lower bounds.
id: doc-functions-math.width-bucket-array
title: width_bucket with a threshold array returns the bucket index for sorted lower bounds
family: doc-functions-math
tier: core
feature_ids: [width-bucket, histogram-bucketing, arrays]
required_capabilities: [select, arrays, int4, errors, create-table, insert]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (width_bucket, thresholds array form)"
sessions: [a]
setup: |
  CREATE TABLE samples (id int4 PRIMARY KEY, v int4);
  INSERT INTO samples VALUES (1, -1), (2, 0), (3, 2.9), (4, 3), (5, 8), (6, 9), (7, 100);
steps:
  - sql: |
      SELECT width_bucket(5, array[0, 3, 6, 9]) AS mid_bucket, width_bucket(-1, array[0, 3]) AS below_first, width_bucket(0, array[0, 3]) AS at_first
    expect: rows
    order: multiset
    comment: below the first bound is 0; the bound itself starts its bucket
  - sql: |
      SELECT id, width_bucket(v, array[0, 3, 6, 9]) AS b FROM samples ORDER BY id
    expect: rows
    order: ordered
    comment: values at or above the last bound fall in bucket length(array)
  - sql: |
      SELECT width_bucket(date '2024-06-01', array['2024-01-01', '2024-03-01', '2024-09-01']::date[]) AS date_bucket
    expect: rows
    order: multiset
    comment: operand and thresholds may be any type with standard comparison operators
