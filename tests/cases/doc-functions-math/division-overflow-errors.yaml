# Division by zero and out-of-range results for integral and numeric operands.
id: doc-functions-math.division-overflow-errors
title: Division by zero and integer overflow raise the documented SQLSTATE codes
family: doc-functions-math
tier: core
feature_ids: [division, modulo, overflow, integer-range]
required_capabilities: [select, numeric, int2, int4, int8, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (/, %, div, mod, abs, factorial)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 / 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1.0 / 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::int2 / 0::int2
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 5 % 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT div(1, 0)
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT mod(5, 0)
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT abs(-2147483648::int4)
    expect: error
    sqlstate: "22003"
    comment: the most negative int4 has no positive counterpart
  - sql: |
      SELECT 2147483647::int4 + 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 9223372036854775807::int8 * 2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT factorial(-1)
    expect: error
    sqlstate: "22003"
