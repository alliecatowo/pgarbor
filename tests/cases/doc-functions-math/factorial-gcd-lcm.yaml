# factorial, gcd and lcm with documented examples, zero inputs and negative inputs.
id: doc-functions-math.factorial-gcd-lcm
title: factorial, gcd and lcm match documented examples and zero and sign edge cases
family: doc-functions-math
tier: core
feature_ids: [factorial, gcd, lcm, integer-number-theory]
required_capabilities: [select, numeric, int4, int8, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-math (factorial, gcd, lcm)"
sessions: [a]
steps:
  - sql: |
      SELECT factorial(5) AS f5, factorial(0) AS f0, factorial(20) AS f20
    expect: rows
    order: multiset
    comment: documented factorial(5)=120
  - sql: |
      SELECT gcd(1071, 462) AS g, lcm(1071, 462) AS l
    expect: rows
    order: multiset
    comment: documented examples 21 and 23562
  - sql: |
      SELECT gcd(0, 0) AS g00, lcm(0, 5) AS l05, gcd(-12, 18) AS gneg, lcm(-4, 6) AS lneg
    expect: rows
    order: multiset
    comment: gcd of two zeros is 0; lcm with a zero is 0; results are non-negative
  - sql: |
      SELECT gcd(12::int8, 18::int8) AS g8, lcm(4::int8, 6::int8) AS l8, gcd(NULL::numeric, 4) AS gnull
    expect: rows
    order: multiset
  - sql: |
      SELECT factorial(-1)
    expect: error
    sqlstate: "22003"
    comment: factorial of a negative number is undefined
