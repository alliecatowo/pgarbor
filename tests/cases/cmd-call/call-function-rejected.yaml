# Documented note: CALL invokes procedures only; to call a function use SELECT.
id: cmd-call.call-function-rejected
title: CALL on a function is rejected and directs the user to SELECT
family: cmd-call
tier: core
feature_ids: [call, functions, select]
required_capabilities: [select, create-function-sql, call]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/call.sgml#sql-call (Notes)"
sessions: [a]
setup: |
  CREATE FUNCTION f() RETURNS int LANGUAGE SQL AS $$ SELECT 1 $$;
steps:
  - sql: |
      CALL f()
    expect: error
    sqlstate: "42809"
    comment: f is a function, not a procedure
  - sql: |
      CALL nosuch()
    expect: error
    sqlstate: "42883"
    comment: unknown name
  - sql: |
      SELECT f() AS v
    expect: rows
    order: ordered
