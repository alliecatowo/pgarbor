# A SQL-language procedure whose body contains CALL statements; each nested call runs its own
# insert and the effects are visible to the outer caller.
id: cmd-call.nested-call-from-sql-body
title: SQL-language procedure body that invokes other procedures with CALL
family: cmd-call
tier: core
feature_ids: [call, procedures, nested-calls, insert]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/call.sgml#sql-call (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v text);
  CREATE PROCEDURE inner_p(x int) LANGUAGE SQL AS $$ INSERT INTO t VALUES (x, 'inner') $$;
  CREATE PROCEDURE outer_p(x int) LANGUAGE SQL AS $$ CALL inner_p(x + 1); CALL inner_p(x * 10); $$;
steps:
  - sql: |
      CALL outer_p(2)
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
