# A procedure with OUT or INOUT parameters returns one result row holding their values; OUT
# arguments are written as NULL by convention.
id: cmd-call.out-params-return-row
title: CALL returns a row of OUT and INOUT parameter values, positional and named
family: cmd-call
tier: core
feature_ids: [call, procedures, out-parameters, inout-parameters]
required_capabilities: [create-table, select, create-procedure, call, plpgsql]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/call.sgml#sql-call (Description; Parameters)"
sessions: [a]
setup: |
  CREATE PROCEDURE p_out(IN x int, OUT y int, OUT z text) LANGUAGE plpgsql AS $$
  BEGIN
    y := x * 2;
    z := 'v' || x;
  END $$;
  CREATE PROCEDURE p_inout(INOUT x int) LANGUAGE plpgsql AS $$
  BEGIN
    x := x + 100;
  END $$;
steps:
  - sql: |
      CALL p_out(3, NULL, NULL)
    expect: rows
    order: ordered
  - sql: |
      CALL p_out(x => 3, y => NULL, z => NULL)
    expect: rows
    order: ordered
    comment: same result with named notation
  - sql: |
      CALL p_inout(1)
    expect: rows
    order: ordered
  - sql: |
      CALL p_inout(x => 5)
    expect: rows
    order: ordered
