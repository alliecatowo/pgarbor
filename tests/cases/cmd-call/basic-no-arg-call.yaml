# The documented example CALL do_db_maintenance(); runs a no-argument procedure. Parentheses are
# required: CALL without an argument list is a syntax error.
id: cmd-call.basic-no-arg
title: CALL a no-argument procedure with parentheses; omitting parentheses is a syntax error
family: cmd-call
tier: core
feature_ids: [call, procedures, insert, select]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/call.sgml#sql-call (Examples)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v text);
  CREATE PROCEDURE do_db_maintenance() LANGUAGE SQL AS $$ INSERT INTO t VALUES (1, 'm') $$;
steps:
  - sql: |
      CALL do_db_maintenance()
    expect: ok
  - sql: |
      CALL do_db_maintenance
    expect: error
    sqlstate: "42601"
    comment: the argument list is mandatory
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
