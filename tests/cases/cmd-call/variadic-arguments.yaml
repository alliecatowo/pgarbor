# A VARIADIC procedure parameter takes the trailing arguments as an array, or an explicit array with
# the VARIADIC keyword; calling with no arguments fails because the parameter has no default.
id: cmd-call.variadic-arguments
title: CALL with trailing arguments and with an explicit VARIADIC array
family: cmd-call
tier: extended
feature_ids: [call, procedures, variadic-arguments, arrays]
required_capabilities: [create-table, insert, select, create-procedure, call, plpgsql, arrays]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/call.sgml#sql-call (Parameters: argument); doc/src/sgml/xfunc.sgml (VARIADIC)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v text);
  CREATE PROCEDURE p_var(VARIADIC xs int[]) LANGUAGE plpgsql AS $$
  BEGIN
    INSERT INTO t VALUES (array_length(xs, 1), 'var');
  END $$;
steps:
  - sql: |
      CALL p_var(1, 2, 3)
    expect: ok
  - sql: |
      CALL p_var(VARIADIC ARRAY[1, 2])
    expect: ok
  - sql: |
      CALL p_var()
    expect: error
    sqlstate: "42883"
    comment: the variadic parameter has no default, so zero arguments do not match
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
