# Positional and named notation (name => value) with DEFAULT parameters, as documented for CALL arguments.
id: cmd-call.positional-named-defaults
title: CALL with positional, named and mixed arguments, omitting parameters that have defaults
family: cmd-call
tier: core
feature_ids: [call, procedures, named-arguments, default-arguments, insert]
required_capabilities: [create-table, insert, select, create-procedure, call, plpgsql]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/call.sgml#sql-call (Parameters: argument)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v text);
  CREATE PROCEDURE p_def(a int, b int DEFAULT 10, c text DEFAULT 'x') LANGUAGE plpgsql AS $$
  BEGIN
    INSERT INTO t VALUES (a, format('%s/%s/%s', a, b, c));
  END $$;
steps:
  - sql: |
      CALL p_def(1)
    expect: ok
  - sql: |
      CALL p_def(2, 3)
    expect: ok
  - sql: |
      CALL p_def(a => 4, c => 'z')
    expect: ok
    comment: named notation skips b, which takes its default
  - sql: |
      CALL p_def(5, c => 'y', b => 6)
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
