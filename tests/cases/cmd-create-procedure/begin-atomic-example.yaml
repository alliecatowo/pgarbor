# Documented example: the same procedure written with the BEGIN ATOMIC sql_body form.
id: cmd-create-procedure.begin-atomic-example
title: CREATE PROCEDURE with a BEGIN ATOMIC body behaves like the string-body form
family: cmd-create-procedure
tier: core
feature_ids: [create-procedure, call, sql-language, begin-atomic, insert]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_procedure.sgml#sql-createprocedure-examples (BEGIN ATOMIC example)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE tbl (a int)
    expect: ok
  - sql: |
      CREATE PROCEDURE insert_data(a integer, b integer)
      LANGUAGE SQL
      BEGIN ATOMIC
        INSERT INTO tbl VALUES (a);
        INSERT INTO tbl VALUES (b);
      END;
    expect: ok
  - sql: |
      CALL insert_data(1, 2)
    expect: ok
  - sql: |
      CALL insert_data(3, 4)
    expect: ok
  - sql: |
      SELECT a FROM tbl ORDER BY a
    expect: rows
    order: ordered
