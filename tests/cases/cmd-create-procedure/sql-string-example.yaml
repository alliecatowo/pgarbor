# Documented example: CREATE PROCEDURE with a LANGUAGE SQL dollar-quoted body, then CALL.
id: cmd-create-procedure.sql-string-example
title: CREATE PROCEDURE with a dollar-quoted SQL body runs both statements on CALL
family: cmd-create-procedure
tier: core
feature_ids: [create-procedure, call, sql-language, dollar-quoting, insert]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_procedure.sgml#sql-createprocedure-examples (string-body example)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE tbl (a int)
    expect: ok
  - sql: |
      CREATE PROCEDURE insert_data(a integer, b integer)
      LANGUAGE SQL
      AS $$
      INSERT INTO tbl VALUES (a);
      INSERT INTO tbl VALUES (b);
      $$
    expect: ok
  - sql: |
      CALL insert_data(1, 2)
    expect: ok
  - sql: |
      SELECT a FROM tbl ORDER BY a
    expect: rows
    order: ordered
