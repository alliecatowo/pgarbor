# A SET clause applies while the procedure runs and the prior value is restored on exit.
id: cmd-create-procedure.set-clause-restores-on-exit
title: CREATE PROCEDURE SET clause is in effect inside the call and restored afterwards
family: cmd-create-procedure
tier: core
feature_ids: [create-procedure, set-clause, configuration-parameters, call, plpgsql]
required_capabilities: [create-table, select, create-procedure, call, plpgsql]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_procedure.sgml#sql-createprocedure (configuration_parameter, SET)"
sessions: [a]
steps:
  - sql: |
      SET work_mem = '2MB'
    expect: ok
  - sql: |
      CREATE PROCEDURE wm_show(INOUT v text) LANGUAGE plpgsql SET work_mem = '1MB' AS $$
      BEGIN
        v := current_setting('work_mem');
      END $$
    expect: ok
  - sql: |
      CALL wm_show('x')
    expect: rows
    comment: the procedure sees its SET value
  - sql: |
      SELECT current_setting('work_mem') AS wm
    expect: rows
    comment: the session value is restored on exit
