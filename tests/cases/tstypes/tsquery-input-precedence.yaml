# tsquery text input: operator precedence, negation, grouping and double negation.
id: tstypes.tsquery-input-precedence
title: tsquery parses operators, grouping and double negation
family: tstypes
tier: core
feature_ids: [tsquery, text-search, tsquery-io]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '1'::tsquery
    expect: rows
  - sql: |
      SELECT ' 1 '::tsquery
    expect: rows
  - sql: |
      SELECT '''1 2'''::tsquery
    expect: rows
    comment: quoted operand with a space
  - sql: |
      SELECT '!1|2&3'::tsquery
    expect: rows
    comment: AND binds tighter than OR, NOT binds tightest
  - sql: |
      SELECT '1|(2&3)'::tsquery
    expect: rows
  - sql: |
      SELECT '!(!1|2)'::tsquery
    expect: rows
  - sql: |
      SELECT '1&(2&(4&(5|!6)))'::tsquery
    expect: rows
  - sql: |
      SELECT 'a:* & nbb:*ac | doo:a* | goo'::tsquery
    expect: rows
    comment: prefix matching markers
  - sql: |
      SELECT '!!b'::tsquery
    expect: rows
  - sql: |
      SELECT '!!!b'::tsquery
    expect: rows
  - sql: |
      SELECT '!!a & !!b'::tsquery
    expect: rows
