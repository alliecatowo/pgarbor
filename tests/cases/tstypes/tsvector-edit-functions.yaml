# strip, ts_delete, setweight, and tsvector canonical ordering.
id: tstypes.tsvector-edit-functions
title: strip, ts_delete, and setweight edit tsvectors canonically
family: tstypes
tier: core
feature_ids: [tsvector, text-search, tsvector-editing, weights]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT strip('w:12B w:13* w:12,5,6 a:1,3* a:3 w asd:1dc asd'::tsvector)
    expect: rows
    comment: strip removes positions and weights, lexemes deduplicated and sorted
  - sql: |
      SELECT ts_delete('base:7 hidden:6 rebel:1 spaceship:2,33A,34B,35C,36D strike:3'::tsvector, 'spaceship')
    expect: rows
  - sql: |
      SELECT ts_delete('base:7 hidden:6 rebel:1 spaceship:2,33A,34B,35C,36D strike:3'::tsvector, 'bas')
    expect: rows
    comment: ts_delete matches whole lexemes only
  - sql: |
      SELECT ts_delete('base:7 hidden:6 rebel:1 spaceship:2,33A,34B,35C,36D strike:3'::tsvector, ARRAY['spaceship','leya','rebel'])
    expect: rows
  - sql: |
      SELECT ts_delete('base hidden rebel spaceship strike'::tsvector, ARRAY['spaceship','leya','rebel','rebel', '', NULL])
    expect: rows
    comment: empty and NULL array elements are ignored, not errors
  - sql: |
      SELECT setweight('a:1,3A asd:1C w:5,6,12B,13A zxc:81,222A,567'::tsvector, 'c')
    expect: rows
  - sql: |
      SELECT setweight('a:1,3A asd:1C w:5,6,12B,13A zxc:81,222A,567'::tsvector, 'c', '{a,zxc}')
    expect: rows
    comment: setweight restricted to listed lexemes
  - sql: |
      SELECT setweight('a asd w:5,6,12B,13A zxc'::tsvector, 'c', ARRAY['a', 'zxc', '', NULL])
    expect: rows
