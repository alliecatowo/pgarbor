# NULL propagation through tsvector and tsquery functions and operators, plus empty-document matching.
id: tstypes.tsvector-null-semantics
title: NULL tsvector and tsquery inputs propagate NULL through functions and operators
family: tstypes
tier: core
feature_ids: [tsvector, tsquery, text-search, nulls]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 functions-textsearch; NULL-strict function semantics"
sessions: [a]
steps:
  - sql: |
      SELECT NULL::tsvector @@ 'a'::tsquery AS result
    expect: rows
    comment: strict operator returns NULL
  - sql: |
      SELECT 'a:1'::tsvector @@ NULL::tsquery AS result
    expect: rows
  - sql: |
      SELECT strip(NULL::tsvector) AS result
    expect: rows
  - sql: |
      SELECT ts_delete(NULL::tsvector, 'a') AS result
    expect: rows
  - sql: |
      SELECT to_tsvector('simple', NULL) AS result
    expect: rows
  - sql: |
      SELECT to_tsvector('simple', '') @@ '!foo'::tsquery AS result
    expect: rows
    comment: empty document matches a pure negation
  - sql: |
      SELECT to_tsvector('simple', '') @@ 'foo'::tsquery AS result
    expect: rows
    comment: empty document does not match a positive term
  - sql: |
      SELECT array_to_tsvector(NULL::text[]) AS result
    expect: rows
