# tsquery ordering, node counting, and the && || !! and <-> constructors.
id: tstypes.tsquery-compare-concat
title: tsquery comparison, numnode, and combining operators
family: tstypes
tier: extended
feature_ids: [tsquery, text-search, tsquery-operators]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'a'::tsquery < 'b & c'::tsquery AS result
    expect: rows
  - sql: |
      SELECT 'a'::tsquery > 'b & c'::tsquery AS result
    expect: rows
  - sql: |
      SELECT 'a | f'::tsquery < 'b & c'::tsquery AS result
    expect: rows
  - sql: |
      SELECT numnode('new & york | qwery'::tsquery)
    expect: rows
  - sql: |
      SELECT numnode('new'::tsquery)
    expect: rows
  - sql: |
      SELECT 'foo & bar'::tsquery && 'asd'::tsquery AS q
    expect: rows
  - sql: |
      SELECT 'foo & bar'::tsquery || 'asd & fg'::tsquery AS q
    expect: rows
  - sql: |
      SELECT 'foo & bar'::tsquery || !!'asd & fg'::tsquery AS q
    expect: rows
  - sql: |
      SELECT 'foo & bar'::tsquery && 'asd | fg'::tsquery AS q
    expect: rows
  - sql: |
      SELECT 'a'::tsquery <-> 'b & d'::tsquery AS q
    expect: rows
  - sql: |
      SELECT 'a & g'::tsquery <-> 'b | d'::tsquery AS q
    expect: rows
