# Phrase search over a table: NULL documents never match, and WHERE filters NULL results out.
id: tstypes.phrase-search-table
title: Phrase search over a tsvector column with NULL documents
family: tstypes
tier: core
feature_ids: [tsvector, tsquery, text-search, phrase-search, create-table]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
setup: |
  CREATE TABLE docs (id int4 PRIMARY KEY, body tsvector);
  INSERT INTO docs VALUES
    (1, to_tsvector('simple', '1 2 3 1')),
    (2, to_tsvector('simple', '1 2 11 3')),
    (3, to_tsvector('simple', '1 2 3 4')),
    (4, to_tsvector('simple', '1 2 1 2 3 4')),
    (5, NULL);
steps:
  - sql: |
      SELECT id FROM docs WHERE body @@ '1 <-> 2' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM docs WHERE body @@ '1 <2> 3' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM docs WHERE body @@ '1 <-> 3' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM docs WHERE body @@ '(1 <-> 2) <-> 3' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, body @@ '1 <-> 3' AS matched FROM docs ORDER BY id
    expect: rows
    order: ordered
    comment: NULL body yields NULL result, not false
  - sql: |
      SELECT id FROM docs WHERE NOT (body @@ '1 <-> 3') ORDER BY id
    expect: rows
    order: ordered
    comment: NOT over a NULL predicate drops the NULL row
