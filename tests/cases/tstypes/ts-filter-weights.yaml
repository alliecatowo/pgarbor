# ts_filter keeps lexemes with the listed weights and rejects a NULL weight element.
id: tstypes.ts-filter-weights
title: ts_filter selects by weight and rejects NULL weights
family: tstypes
tier: extended
feature_ids: [tsvector, text-search, weights, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT ts_filter('base:7A empir:17 evil:15 first:11 galact:16 hidden:6A rebel:1A spaceship:2A strike:3A victori:12 won:9'::tsvector, '{a}')
    expect: rows
  - sql: |
      SELECT ts_filter('base hidden rebel spaceship strike'::tsvector, '{a}')
    expect: rows
    comment: unweighted lexemes carry no explicit weight; the recording decides the result
  - sql: |
      SELECT ts_filter('base hidden rebel spaceship strike'::tsvector, '{a,b,NULL}')
    expect: error
    sqlstate: "22004"
    comment: weight array may not contain nulls
