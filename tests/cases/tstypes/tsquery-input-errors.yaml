# Malformed tsquery text raises SQLSTATE 42601; out-of-range phrase distance raises 22023.
id: tstypes.tsquery-input-errors
title: tsquery syntax and phrase distance errors with SQLSTATE
family: tstypes
tier: core
feature_ids: [tsquery, text-search, errors, input-validation]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'foo!'::tsquery
    expect: error
    sqlstate: "42601"
    comment: operator missing between operand and trailing bang
  - sql: |
      SELECT 'a <100000> b'::tsquery
    expect: error
    sqlstate: "22023"
    comment: phrase distance above 16384
  - sql: |
      SELECT pg_input_is_valid('foo!', 'tsquery')
    expect: rows
    comment: false, no error raised
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('foo!', 'tsquery')
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('a <100000> b', 'tsquery')
    expect: rows
