# Empty lexeme is a syntax error; the non-throwing input API reports the same SQLSTATE.
id: tstypes.tsvector-syntax-errors
title: tsvector rejects empty lexemes and pg_input_* reports SQLSTATE 42601
family: tstypes
tier: core
feature_ids: [tsvector, text-search, errors, input-validation]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT $$'' '1' '2'$$::tsvector
    expect: error
    sqlstate: "42601"
    comment: empty lexeme is not allowed
  - sql: |
      SELECT pg_input_is_valid('foo', 'tsvector')
    expect: rows
  - sql: |
      SELECT pg_input_is_valid($$''$$, 'tsvector')
    expect: rows
    comment: returns false instead of raising
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info($$''$$, 'tsvector')
    expect: rows
    comment: sql_error_code is 42601
