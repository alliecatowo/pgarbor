# ts_rank and ts_rank_cd compared to zero, avoiding float text output.
id: tstypes.tsvector-ranking-bool
title: ts_rank and ts_rank_cd are positive exactly when the query matches
family: tstypes
tier: extended
feature_ids: [tsvector, tsquery, text-search, ranking]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tstypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT ts_rank(' a:1 s:2C d g'::tsvector, 'a | s') > 0 AS result
    expect: rows
  - sql: |
      SELECT ts_rank(' a:1 s:2 d g'::tsvector, 'a & s') > 0 AS result
    expect: rows
  - sql: |
      SELECT ts_rank_cd(' a:1 s:2C d g'::tsvector, 'a | s') > 0 AS result
    expect: rows
  - sql: |
      SELECT ts_rank_cd(' a:1 s:2 d g'::tsvector, 'a <-> s') > 0 AS result
    expect: rows
    comment: phrase with no adjacent positions still matches
  - sql: |
      SELECT ts_rank_cd(' a:1 s:2A d:2A g'::tsvector, 'a <-> s') > 0 AS result
    expect: rows
  - sql: |
      SELECT ts_rank(' a:1 s:2C d g'::tsvector, 'x') > 0 AS result
    expect: rows
    comment: no matching lexeme gives zero rank
