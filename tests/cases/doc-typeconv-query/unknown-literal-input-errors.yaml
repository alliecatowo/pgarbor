# PG docs typeconv-query: unknown-type literals go to the input routine; typed text has no assignment cast to int4.
id: doc-typeconv-query.unknown-literal-input-errors
title: Unknown literals fail in the int4 input routine, while typed text fails the assignment check
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, input-conversion, int4, errors, unknown-literal]
required_capabilities: [create-table, insert, select, int4, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (unknown-type literal fed to the input conversion routine)"
steps:
  - sql: |
      CREATE TABLE i4 (i int4)
    expect: ok
  - sql: |
      INSERT INTO i4 VALUES ('1.5')
    expect: error
    sqlstate: "22P02"
    comment: input routine for int4 rejects a fractional literal
  - sql: |
      INSERT INTO i4 VALUES ('abc')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO i4 VALUES ('2147483648')
    expect: error
    sqlstate: "22003"
    comment: input routine reports out of range for int4
  - sql: |
      INSERT INTO i4 VALUES ('text'::text)
    expect: error
    sqlstate: "42804"
    comment: typed text is not an unknown literal and no assignment cast text to int4 exists
  - sql: |
      SELECT count(*) FROM i4
    expect: rows
    order: multiset
