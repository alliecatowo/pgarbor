# PG docs typeconv-query: text -> bpchar assignment and blank-padded comparison semantics.
id: doc-typeconv-query.char-blank-padding-and-trim
title: char(4) storage pads short values and text assigned to char is padded by sizing cast
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, sizing-cast, char-type, assignment-cast]
required_capabilities: [create-table, insert, select, char-type]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (character Storage Type Conversion; text to bpchar)"
steps:
  - sql: |
      CREATE TABLE c4 (c char(4))
    expect: ok
  - sql: |
      INSERT INTO c4 VALUES ('ab')
    expect: ok
  - sql: |
      INSERT INTO c4 VALUES ('abcd'::text)
    expect: ok
  - sql: |
      SELECT c, octet_length(c), c = 'ab  ' AS eq, c::text AS back_to_text FROM c4 ORDER BY c
    expect: rows
    order: ordered
