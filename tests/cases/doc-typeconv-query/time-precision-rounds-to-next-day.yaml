# PG docs typeconv-query: sizing cast for time(p) rounds up and can produce 24:00:00 at the boundary.
id: doc-typeconv-query.time-precision-rounds-to-next-day
title: time(2) storage rounds 23:59:59.999 up to 24:00:00
family: doc-typeconv-query
tier: extended
feature_ids: [value-storage, sizing-cast, time, rounding, boundary-values]
required_capabilities: [create-table, insert, select, time]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage: sizing cast)"
steps:
  - sql: |
      CREATE TABLE tm (t time(2))
    expect: ok
  - sql: |
      INSERT INTO tm VALUES ('10:00:00.126'), ('23:59:59.999')
    expect: ok
  - sql: |
      SELECT t FROM tm ORDER BY t
    expect: rows
    order: ordered
