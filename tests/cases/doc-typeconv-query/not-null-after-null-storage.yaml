# PG docs typeconv-query: NULL values skip conversion but still hit NOT NULL on storage.
id: doc-typeconv-query.not-null-after-null-storage
title: NULL into a NOT NULL column fails, while a convertible non-null value stores
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, nulls, not-null, errors, assignment-cast]
required_capabilities: [create-table, insert, select, nulls, not-null, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage Type Conversion)"
steps:
  - sql: |
      CREATE TABLE nn (x int4 NOT NULL, y text)
    expect: ok
  - sql: |
      INSERT INTO nn VALUES (NULL, 'a')
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO nn VALUES (1, 5)
    expect: ok
    comment: integer 5 stores into text through the assignment cast
  - sql: |
      SELECT x, y, y IS NULL AS y_null FROM nn
    expect: rows
    order: multiset
