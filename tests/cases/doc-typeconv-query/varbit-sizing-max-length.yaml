# PG docs typeconv-query: sizing cast for bit varying(n) enforces a maximum length on storage.
id: doc-typeconv-query.varbit-sizing-max-length
title: varbit(3) storage rejects bit strings longer than three bits
family: doc-typeconv-query
tier: extended
feature_ids: [value-storage, sizing-cast, bit-type, errors, boundary-values]
required_capabilities: [create-table, insert, select, bit-type, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (sizing cast performs the required size checking)"
steps:
  - sql: |
      CREATE TABLE vb3 (b varbit(3))
    expect: ok
  - sql: |
      INSERT INTO vb3 VALUES (B'1010')
    expect: error
    sqlstate: "22001"
  - sql: |
      INSERT INTO vb3 VALUES (B'10')
    expect: ok
  - sql: |
      INSERT INTO vb3 VALUES (B'101')
    expect: ok
  - sql: |
      SELECT b, length(b) FROM vb3 ORDER BY b
    expect: rows
    order: ordered
