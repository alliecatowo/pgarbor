# PG docs typeconv-query: sizing cast for numeric(p,s) rounds to the declared scale on storage.
id: doc-typeconv-query.numeric-typmod-rounding-storage
title: numeric(5,2) storage rounds half away from zero to the declared scale
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, sizing-cast, numeric, rounding]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage: sizing cast applies length-dependent semantics)"
steps:
  - sql: |
      CREATE TABLE n52 (n numeric(5,2))
    expect: ok
  - sql: |
      INSERT INTO n52 VALUES (123.456), (-0.005), (999.994), ('12.345')
    expect: ok
  - sql: |
      SELECT n FROM n52 ORDER BY n
    expect: rows
    order: ordered
