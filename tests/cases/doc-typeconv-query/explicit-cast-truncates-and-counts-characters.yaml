# PG docs typeconv-query: explicit length casts truncate silently; length counts characters, not bytes.
id: doc-typeconv-query.explicit-cast-truncates-and-counts-characters
title: Explicit char(n) and varchar(n) casts truncate; varchar limits count characters
family: doc-typeconv-query
tier: core
feature_ids: [sizing-cast, explicit-cast, char-type, varchar-type, multibyte-text]
required_capabilities: [select, char-type, varchar-type]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (sizing cast third boolean parameter: explicit)"
steps:
  - sql: |
      SELECT 'abcdef'::char(3) AS a, 'abcdef'::varchar(3) AS b, 'héllo'::varchar(4) AS c, length('héllo'::varchar(4)) AS n
    expect: rows
    order: multiset
