# PG docs typeconv-query: sizing cast on storage raises an error; an explicit cast truncates first.
id: doc-typeconv-query.varchar-sizing-assignment-error
title: varchar(3) storage errors on overflow while an explicit varchar(3) cast truncates
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, sizing-cast, varchar-type, errors, explicit-cast]
required_capabilities: [create-table, insert, select, varchar-type, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage: sizing cast, implicit vs explicit)"
steps:
  - sql: |
      CREATE TABLE s3 (v varchar(3))
    expect: ok
  - sql: |
      INSERT INTO s3 VALUES ('abcdef')
    expect: error
    sqlstate: "22001"
    comment: sizing cast is applied with explicit = false during storage, so overflow is an error
  - sql: |
      INSERT INTO s3 VALUES ('abcdef'::varchar(3))
    expect: ok
    comment: explicit cast to varchar(3) truncates before storage, which then fits
  - sql: |
      SELECT v, length(v) FROM s3
    expect: rows
    order: multiset
