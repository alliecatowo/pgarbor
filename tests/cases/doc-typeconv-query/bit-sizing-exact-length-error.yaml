# PG docs typeconv-query: sizing cast for bit(n) requires exact length on storage.
id: doc-typeconv-query.bit-sizing-exact-length-error
title: bit(4) storage accepts only exactly four bits
family: doc-typeconv-query
tier: extended
feature_ids: [value-storage, sizing-cast, bit-type, errors, boundary-values]
required_capabilities: [create-table, insert, select, bit-type, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (sizing cast performs the required length check)"
steps:
  - sql: |
      CREATE TABLE b4 (b bit(4))
    expect: ok
  - sql: |
      INSERT INTO b4 VALUES (B'101')
    expect: error
    sqlstate: "22026"
    comment: too short; bit(n) sizing rejects a length mismatch on implicit storage
  - sql: |
      INSERT INTO b4 VALUES (B'1010')
    expect: ok
  - sql: |
      INSERT INTO b4 VALUES (B'10100')
    expect: error
    sqlstate: "22026"
  - sql: |
      SELECT b FROM b4
    expect: rows
    order: multiset
