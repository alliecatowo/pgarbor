# PG docs typeconv-query: invalid date literal fails input conversion; infinity values are storable.
id: doc-typeconv-query.date-invalid-literal-and-infinity
title: Date column rejects a non-existent calendar day and stores infinity values
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, input-conversion, date-type, errors, boundary-values]
required_capabilities: [create-table, insert, select, date-type, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (unknown-type literal fed to the input conversion routine)"
steps:
  - sql: |
      CREATE TABLE dd (d date)
    expect: ok
  - sql: |
      INSERT INTO dd VALUES ('2024-02-30')
    expect: error
    sqlstate: "22008"
    comment: 2024 is a leap year, so Feb 30 does not exist
  - sql: |
      INSERT INTO dd VALUES ('infinity'), ('-infinity'), ('2024-02-29')
    expect: ok
  - sql: |
      SELECT d FROM dd ORDER BY d
    expect: rows
    order: ordered
