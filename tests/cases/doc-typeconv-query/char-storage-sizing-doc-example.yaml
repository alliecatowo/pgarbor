# PG docs typeconv-query: character(n) storage conversion example (sizing cast pads to declared length).
id: doc-typeconv-query.char-storage-sizing-doc-example
title: character(20) column sized by bpchar sizing cast after text concatenation
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, sizing-cast, char-type, string-concatenation]
required_capabilities: [create-table, insert, select, char-type]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (character Storage Type Conversion example)"
steps:
  - sql: |
      CREATE TABLE vv (v character(20))
    expect: ok
  - sql: |
      INSERT INTO vv SELECT 'abc' || 'def'
    expect: ok
  - sql: |
      SELECT v, octet_length(v) FROM vv
    expect: rows
    order: multiset
    comment: doc shows octet_length 20; the sizing function pads the stored value
