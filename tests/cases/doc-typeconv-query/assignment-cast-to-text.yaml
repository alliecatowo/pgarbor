# PG docs typeconv-query: storage uses the assignment cast from non-text types into a text column.
id: doc-typeconv-query.assignment-cast-to-text
title: Integer, numeric, boolean and date values store into a text column through assignment casts
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, assignment-cast, text, casts]
required_capabilities: [create-table, insert, select, text, casts]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage: assignment cast registered in pg_cast)"
steps:
  - sql: |
      CREATE TABLE tx (x text)
    expect: ok
  - sql: |
      INSERT INTO tx VALUES (42), (1.50), (true), (DATE '2024-02-29')
    expect: ok
  - sql: |
      SELECT x FROM tx ORDER BY x
    expect: rows
    order: ordered
