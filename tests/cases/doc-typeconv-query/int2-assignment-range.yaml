# PG docs typeconv-query: integer assignment casts into int2 check the target range.
id: doc-typeconv-query.int2-assignment-range
title: int2 storage accepts the smallint range boundaries and rejects values one past them
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, assignment-cast, int2, boundary-values, errors]
required_capabilities: [create-table, insert, select, int2, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage: assignment cast registered in pg_cast)"
steps:
  - sql: |
      CREATE TABLE sm (x int2)
    expect: ok
  - sql: |
      INSERT INTO sm VALUES (32767), (-32768)
    expect: ok
  - sql: |
      INSERT INTO sm VALUES (32768)
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO sm VALUES (70000::int4)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT x FROM sm ORDER BY x
    expect: rows
    order: ordered
