# PG docs typeconv-query: numeric(p,s) sizing cast rejects values that do not fit after rounding.
id: doc-typeconv-query.numeric-field-overflow-error
title: numeric(5,2) storage rejects out-of-range values, including ones that round up past the limit
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, sizing-cast, numeric, errors, boundary-values]
required_capabilities: [create-table, insert, select, numeric, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (sizing cast performs the required size checking)"
steps:
  - sql: |
      CREATE TABLE n52 (n numeric(5,2))
    expect: ok
  - sql: |
      INSERT INTO n52 VALUES (1234.5)
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO n52 VALUES (999.995)
    expect: error
    sqlstate: "22003"
    comment: rounds to 1000.00 which needs precision 6
  - sql: |
      INSERT INTO n52 VALUES (999.9949)
    expect: ok
  - sql: |
      SELECT n FROM n52
    expect: rows
    order: multiset
