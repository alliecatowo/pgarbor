# PG docs typeconv-query: sizing cast length check on storage; trailing blanks are insignificant.
id: doc-typeconv-query.char-too-long-error
title: char(3) storage rejects a too-long value but accepts excess trailing blanks
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, sizing-cast, char-type, errors]
required_capabilities: [create-table, insert, select, char-type, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (sizing cast performs the required length check)"
steps:
  - sql: |
      CREATE TABLE c3 (c char(3))
    expect: ok
  - sql: |
      INSERT INTO c3 VALUES ('abcd')
    expect: error
    sqlstate: "22001"
    comment: sizing cast length check fails for implicit (assignment) storage
  - sql: |
      INSERT INTO c3 VALUES ('ab   ')
    expect: ok
    comment: trailing blanks beyond the declared length are not significant
  - sql: |
      SELECT c, octet_length(c), length(c), c::text AS t FROM c3
    expect: rows
    order: multiset
