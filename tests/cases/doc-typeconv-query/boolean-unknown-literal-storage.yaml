# PG docs typeconv-query: unknown literals reach boolean input; integer has no assignment cast to boolean.
id: doc-typeconv-query.boolean-unknown-literal-storage
title: Boolean column accepts boolean input spellings and NULL but rejects integers and bad spellings
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, input-conversion, boolean, nulls, errors, unknown-literal]
required_capabilities: [create-table, insert, select, boolean, nulls, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (unknown-type literal fed to the input conversion routine)"
steps:
  - sql: |
      CREATE TABLE b1 (b boolean)
    expect: ok
  - sql: |
      INSERT INTO b1 VALUES ('yes'), ('off'), ('t'), ('0'), (NULL)
    expect: ok
  - sql: |
      INSERT INTO b1 VALUES (1)
    expect: error
    sqlstate: "42804"
    comment: no assignment cast from integer to boolean
  - sql: |
      INSERT INTO b1 VALUES ('maybe')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT b FROM b1 ORDER BY b NULLS LAST
    expect: rows
    order: ordered
