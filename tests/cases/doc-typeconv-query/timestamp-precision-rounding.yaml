# PG docs typeconv-query: sizing cast for timestamp(p) rounds fractional seconds on storage.
id: doc-typeconv-query.timestamp-precision-rounding
title: timestamp(0) storage rounds fractional seconds to the nearest second
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, sizing-cast, timestamp, rounding]
required_capabilities: [create-table, insert, select, timestamp]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage: sizing cast)"
steps:
  - sql: |
      CREATE TABLE ts0 (t timestamp(0))
    expect: ok
  - sql: |
      INSERT INTO ts0 VALUES ('2020-01-01 10:00:00.6'), ('2020-01-01 10:00:00.4')
    expect: ok
  - sql: |
      SELECT t FROM ts0 ORDER BY t
    expect: rows
    order: ordered
