# PG docs typeconv-query: numeric to integer assignment cast rounds; int8 overflow is an error; NULL stores as NULL.
id: doc-typeconv-query.assignment-cast-numeric-to-int4-rounds
title: Numeric literals store into int4 with rounding, NULL passes through, out-of-range values fail
family: doc-typeconv-query
tier: core
feature_ids: [value-storage, assignment-cast, int4, numeric, nulls, errors]
required_capabilities: [create-table, insert, select, int4, numeric, nulls, errors]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-query (Value Storage: assignment cast registered in pg_cast)"
steps:
  - sql: |
      CREATE TABLE i4 (i int4)
    expect: ok
  - sql: |
      INSERT INTO i4 VALUES ('42'), (7.9), (-7.9), (NULL)
    expect: ok
  - sql: |
      SELECT i FROM i4 ORDER BY i NULLS LAST
    expect: rows
    order: ordered
    comment: 7.9 rounds to 8 and -7.9 to -8
  - sql: |
      INSERT INTO i4 VALUES (2147483648::int8)
    expect: error
    sqlstate: "22003"
