# INSERT into a partitioned table routes each row to the matching partition. A row that matches no partition
# fails; inserting directly into a partition checks that partition's bound.
id: cmd-insert.partition-routing
title: Row routing into range partitions, no-partition error, and direct partition bound check
family: cmd-insert
tier: core
feature_ids: [insert, partitioning, range-partitioning]
required_capabilities: [create-table, insert, select, partitioning]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/insert.sgml#sql-insert (Notes: partitioned table routing; partition constraint error)"
sessions: [a]
setup: |
  CREATE TABLE measures (k int, v text) PARTITION BY RANGE (k);
  CREATE TABLE measures_low PARTITION OF measures FOR VALUES FROM (1) TO (10);
  CREATE TABLE measures_high PARTITION OF measures FOR VALUES FROM (10) TO (20);
steps:
  - sql: |
      INSERT INTO measures VALUES (5, 'five'), (15, 'fifteen'), (10, 'ten')
    expect: ok
    comment: 10 belongs to the upper partition because bounds are inclusive below and exclusive above
  - sql: |
      INSERT INTO measures VALUES (25, 'out of range')
    expect: error
    sqlstate: "23514"
    comment: no partition accepts k = 25
  - sql: |
      INSERT INTO measures_low VALUES (25, 'wrong partition')
    expect: error
    sqlstate: "23514"
    comment: inserting directly into a partition still enforces its bound
  - sql: |
      INSERT INTO measures_low VALUES (9, 'nine')
    expect: ok
  - sql: |
      SELECT tableoid::regclass AS part, k, v FROM measures ORDER BY k
    expect: rows
    order: ordered
