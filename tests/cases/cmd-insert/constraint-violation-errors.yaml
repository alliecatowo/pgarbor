# Constraint violations abort the whole INSERT statement: no row from a failed multirow VALUES list is kept.
id: cmd-insert.constraint-violation-errors
title: Unique, NOT NULL and CHECK violations fail the whole statement atomically
family: cmd-insert
tier: core
feature_ids: [insert, constraints, not-null, check-constraints, unique-constraints]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/insert.sgml#sql-insert (Description: automatic type conversion; constraints)"
sessions: [a]
setup: |
  CREATE TABLE items (id int PRIMARY KEY, qty int CHECK (qty >= 0), label text NOT NULL);
  INSERT INTO items VALUES (1, 1, 'one');
steps:
  - sql: |
      INSERT INTO items VALUES (2, 2, 'two'), (1, 3, 'dup'), (3, 3, 'three')
    expect: error
    sqlstate: "23505"
    comment: the duplicate key in the second row aborts the statement; row 2 is not kept
  - sql: |
      INSERT INTO items (id, qty) VALUES (4, 4)
    expect: error
    sqlstate: "23502"
    comment: label has no default and is NOT NULL
  - sql: |
      INSERT INTO items VALUES (5, -1, 'neg')
    expect: error
    sqlstate: "23514"
    comment: CHECK (qty >= 0) fails
  - sql: |
      INSERT INTO items VALUES (6, NULL, 'nullqty')
    expect: ok
    comment: CHECK is satisfied when the expression is NULL
  - sql: |
      SELECT id, qty, label FROM items ORDER BY id
    expect: rows
    order: ordered
