# Identity columns: GENERATED ALWAYS rejects explicit values unless OVERRIDING SYSTEM VALUE is given;
# OVERRIDING USER VALUE discards supplied values; GENERATED BY DEFAULT accepts explicit values.
id: cmd-insert.identity-overriding
title: OVERRIDING SYSTEM/USER VALUE with GENERATED ALWAYS and GENERATED BY DEFAULT identity columns
family: cmd-insert
tier: core
feature_ids: [insert, identity-columns, overriding]
required_capabilities: [create-table, insert, select, identity]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/insert.sgml#sql-insert (Parameters: OVERRIDING SYSTEM VALUE / USER VALUE / DEFAULT VALUES)"
sessions: [a]
setup: |
  CREATE TABLE idalw (id int GENERATED ALWAYS AS IDENTITY PRIMARY KEY, v text);
  CREATE TABLE idbd (id int GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, v text);
steps:
  - sql: |
      INSERT INTO idalw (id, v) VALUES (5, 'explicit')
    expect: error
    sqlstate: "428C9"
    comment: an explicit non-DEFAULT value for GENERATED ALWAYS needs OVERRIDING
  - sql: |
      INSERT INTO idalw (id, v) OVERRIDING SYSTEM VALUE VALUES (5, 'explicit') RETURNING id, v
    expect: rows
  - sql: |
      INSERT INTO idalw (id, v) OVERRIDING USER VALUE VALUES (8, 'ignored') RETURNING id, v
    expect: rows
    comment: the supplied id is ignored and a sequence value is generated
  - sql: |
      INSERT INTO idalw (id, v) VALUES (DEFAULT, 'by default') RETURNING id, v
    expect: rows
  - sql: |
      INSERT INTO idbd (id, v) VALUES (9, 'explicit') RETURNING id, v
    expect: rows
    comment: GENERATED BY DEFAULT accepts an explicit value without any OVERRIDING clause
  - sql: |
      INSERT INTO idbd (id, v) OVERRIDING USER VALUE VALUES (9, 'ignored') RETURNING id, v
    expect: rows
    comment: sequence value 1 is generated, which does not collide with 9
  - sql: |
      INSERT INTO idalw OVERRIDING SYSTEM VALUE DEFAULT VALUES
    expect: error
    sqlstate: "42601"
    comment: the OVERRIDING clause is not permitted with DEFAULT VALUES
  - sql: |
      SELECT 'alw' AS tbl, id, v FROM idalw UNION ALL SELECT 'bd', id, v FROM idbd ORDER BY 1, 2
    expect: rows
    order: ordered
