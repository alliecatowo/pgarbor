# A generated column may be given DEFAULT, which computes it; supplying any other value is an error.
id: cmd-insert.generated-column-insert
title: DEFAULT computes a stored generated column, explicit value rejected
family: cmd-insert
tier: core
feature_ids: [insert, generated-columns, column-defaults]
required_capabilities: [create-table, insert, select, generated-columns]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/insert.sgml#sql-insert (Parameters: DEFAULT for a generated column)"
sessions: [a]
setup: |
  CREATE TABLE gc (a int, b int GENERATED ALWAYS AS (a * 2) STORED);
steps:
  - sql: |
      INSERT INTO gc VALUES (1, DEFAULT) RETURNING a, b
    expect: rows
    comment: DEFAULT means the normal computation from the generation expression
  - sql: |
      INSERT INTO gc (a, b) VALUES (2, DEFAULT), (3, DEFAULT) RETURNING a, b
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO gc VALUES (1, 5)
    expect: error
    sqlstate: "428C9"
    comment: a non-DEFAULT value for a generated column is not allowed
  - sql: |
      SELECT a, b FROM gc ORDER BY a
    expect: rows
    order: ordered
