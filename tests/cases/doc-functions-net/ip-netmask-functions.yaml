# Netmask functions: masklen, netmask, hostmask and network, including /0 and /32 boundaries.
id: doc-functions-net.ip-netmask-functions
title: masklen, netmask, hostmask and network including the /0 and /32 boundaries
family: doc-functions-net
tier: core
feature_ids: [inet-functions, masklen, netmask, hostmask, network]
required_capabilities: [select, inet, cidr]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-net (IP Address Functions table: masklen, netmask, hostmask, network)"
sessions: [a]
steps:
  - sql: |
      SELECT masklen(inet '192.168.1.5/24') AS ml, netmask(inet '192.168.1.5/24') AS nm, network(inet '192.168.1.5/24') AS nw
    expect: rows
    order: multiset
    comment: documented examples 24, 255.255.255.0, 192.168.1.0/24
  - sql: |
      SELECT hostmask(inet '192.168.23.20/30') AS hm, hostmask(inet '10.1.1.1/8') AS hm8
    expect: rows
    order: multiset
    comment: documented example 0.0.0.3; hostmask is the complement of netmask
  - sql: |
      SELECT netmask(inet '1.2.3.4/0') AS nm0, hostmask(inet '1.2.3.4/0') AS hm0, network(inet '1.2.3.4/0') AS nw0
    expect: rows
    order: multiset
    comment: a /0 mask has an all-zero netmask and an all-one hostmask
  - sql: |
      SELECT netmask(inet '1.2.3.4/32') AS nm32, hostmask(inet '1.2.3.4/32') AS hm32, network(inet '1.2.3.4/32') AS nw32, masklen(inet '1.2.3.4/32') AS ml32
    expect: rows
    order: multiset
    comment: a /32 mask is all ones for netmask and all zeros for hostmask
  - sql: |
      SELECT masklen(inet '::1') AS ml6, netmask(inet '2001:db8::1/64') AS nm6, network(inet '2001:db8::1/64') AS nw6
    expect: rows
    order: multiset
    comment: IPv6 netmasks follow the same rules with a 128-bit address
  - sql: |
      SELECT network(inet '10.1.1.1/8') AS net_from_inet, network(cidr '10.1.1.0/24') AS net_from_cidr, (inet '10.1.1.1/8')::cidr AS cast_zeroes
    expect: rows
    order: multiset
    comment: network() and an inet to cidr cast both zero the bits right of the netmask
