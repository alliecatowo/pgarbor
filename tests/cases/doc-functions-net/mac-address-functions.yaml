# MAC address functions and bitwise operators on macaddr and macaddr8, with the documented examples.
id: doc-functions-net.mac-address-functions
title: trunc, macaddr8_set7bit and bitwise NOT, AND, OR on macaddr and macaddr8
family: doc-functions-net
tier: core
feature_ids: [macaddr, macaddr8, mac-functions, bitwise-operators]
required_capabilities: [select, macaddr, macaddr8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-net (MAC Address Functions table; bitwise operators paragraph)"
sessions: [a]
steps:
  - sql: |
      SELECT trunc(macaddr '12:34:56:78:90:ab') AS trunc6, trunc(macaddr8 '12:34:56:78:90:ab:cd:ef') AS trunc8
    expect: rows
    order: multiset
    comment: documented examples 12:34:56:00:00:00 and 12:34:56:00:00:00:00:00
  - sql: |
      SELECT macaddr8_set7bit(macaddr8 '00:34:56:ab:cd:ef') AS eui64
    expect: rows
    order: multiset
    comment: documented example 02:34:56:ff:fe:ab:cd:ef; the 7th bit is set and FF:FE is inserted
  - sql: |
      SELECT ~ macaddr '12:34:56:78:90:ab' AS not6, macaddr '12:34:56:78:90:ab' & macaddr 'ff:ff:ff:00:00:00' AS and6, macaddr '12:34:56:78:90:ab' | macaddr '00:00:00:ff:ff:ff' AS or6
    expect: rows
    order: multiset
    comment: bitwise operators apply to each byte
  - sql: |
      SELECT ~ macaddr8 '12:34:56:78:90:ab:cd:ef' AS not8, macaddr8 '12:34:56:78:90:ab:cd:ef' & macaddr8 'ff:ff:ff:ff:00:00:00:00' AS and8
    expect: rows
    order: multiset
  - sql: |
      SELECT trunc(macaddr '00:00:00:00:00:00') AS zero6, trunc(macaddr 'ff:ff:ff:ff:ff:ff') AS ones6, macaddr8_set7bit(macaddr8 '00:00:00:00:00:00:00:00') AS zero8
    expect: rows
    order: multiset
    comment: trunc zeroes the last three bytes of a macaddr and the last five bytes of a macaddr8
  - sql: |
      SELECT macaddr '12:34:56:78:90:ab' = macaddr '12-34-56-78-90-AB' AS same_mac, macaddr8 '12:34:56:78:90:ab:cd:ef' < macaddr8 '12:34:56:78:90:ab:cd:f0' AS ordered
    expect: rows
    order: multiset
    comment: MAC input accepts the hyphen separator form and the comparison operators order by bytes
