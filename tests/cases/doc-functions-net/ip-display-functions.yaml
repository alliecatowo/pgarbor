# Display and extraction functions: abbrev, host, text, family and broadcast, with documented examples.
id: doc-functions-net.ip-display-functions
title: abbrev, host, text, family and broadcast on inet and cidr values
family: doc-functions-net
tier: core
feature_ids: [inet-functions, abbrev, host, text-cast, family, broadcast]
required_capabilities: [select, inet, cidr]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-net (IP Address Functions table: abbrev, broadcast, family, host, text)"
sessions: [a]
steps:
  - sql: |
      SELECT abbrev(inet '10.1.0.0/32') AS abbrev_inet, abbrev(cidr '10.1.0.0/16') AS abbrev_cidr
    expect: rows
    order: multiset
    comment: documented examples 10.1.0.0 and 10.1/16
  - sql: |
      SELECT abbrev(cidr '10.1.2.0/24') AS drop_one_octet, abbrev(cidr '10.0.0.0/8') AS drop_three_octets, abbrev(cidr '192.168.0.0/16') AS drop_two_octets
    expect: rows
    order: multiset
    comment: abbreviation drops all-zero octets to the right of the netmask
  - sql: |
      SELECT abbrev(inet '2001:db8::1/64') AS abbrev_v6, host(inet '2001:db8::1/64') AS host_v6
    expect: rows
    order: multiset
    comment: host ignores the netmask; abbrev on inet keeps the netmask suffix
  - sql: |
      SELECT host(inet '192.168.1.0/24') AS host_ignores_mask, text(inet '192.168.1.5') AS text_adds_full_mask, (inet '192.168.1.5')::text AS cast_text
    expect: rows
    order: multiset
    comment: documented examples 192.168.1.0 and 192.168.1.5/32; text() matches the explicit cast
  - sql: |
      SELECT family(inet '::1') AS fam6, family(inet '192.168.1.5') AS fam4, family(cidr '10.0.0.0/8') AS fam_cidr
    expect: rows
    order: multiset
    comment: family returns 6 or 4
  - sql: |
      SELECT broadcast(inet '192.168.1.5/24') AS bcast, broadcast(inet '10.0.0.1/32') AS bcast_host
    expect: rows
    order: multiset
    comment: documented example 192.168.1.255/24; a /32 broadcast is the address itself
