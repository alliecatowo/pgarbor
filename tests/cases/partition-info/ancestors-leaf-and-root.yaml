# pg_partition_ancestors walks from a table up to its root; the root lists only itself.
id: partition-info.ancestors-leaf-and-root
title: pg_partition_ancestors returns the leaf, its intermediate parents and the root, and the root returns only itself
family: partition-info
tier: core
feature_ids: [partitioning, partition-tree-functions]
required_capabilities: [create-table, select, catalog-introspection, partitioning]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/partition_info.sql
sessions: [a]
setup: |
  CREATE TABLE ptif_test (a int, b int) PARTITION BY RANGE (a);
  CREATE TABLE ptif_test0 PARTITION OF ptif_test FOR VALUES FROM (MINVALUE) TO (0) PARTITION BY LIST (b);
  CREATE TABLE ptif_test01 PARTITION OF ptif_test0 FOR VALUES IN (1);
steps:
  - sql: |
      SELECT relid::regclass::text AS ancestor FROM pg_partition_ancestors('ptif_test01')
    expect: rows
    order: multiset
    comment: multiset because pg_partition_ancestors gives no ordering guarantee
  - sql: |
      SELECT relid::regclass::text AS ancestor FROM pg_partition_ancestors('ptif_test')
    expect: rows
    order: multiset
