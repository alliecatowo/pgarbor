# Partition inspection functions with NULL and OID 0 inputs.
id: partition-info.tree-null-and-zero-inputs
title: Partition inspection functions return no rows or NULL for NULL and OID 0 inputs
family: partition-info
tier: core
feature_ids: [partitioning, partition-tree-functions, null-handling]
required_capabilities: [select, catalog-introspection, partitioning]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/partition_info.sql
sessions: [a]
steps:
  - sql: |
      SELECT * FROM pg_partition_tree(NULL)
    expect: rows
    comment: strict set-returning function, no rows for NULL input
  - sql: |
      SELECT * FROM pg_partition_tree(0)
    expect: rows
    comment: OID 0 names no relation, no rows
  - sql: |
      SELECT * FROM pg_partition_ancestors(NULL)
    expect: rows
  - sql: |
      SELECT * FROM pg_partition_ancestors(0)
    expect: rows
  - sql: |
      SELECT pg_partition_root(NULL) IS NULL AS null_input
    expect: rows
  - sql: |
      SELECT pg_partition_root(0) IS NULL AS zero_input
    expect: rows
