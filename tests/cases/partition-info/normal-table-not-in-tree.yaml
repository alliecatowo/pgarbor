# A regular table that is not a partition is not listed in any partition tree and has no root.
id: partition-info.normal-table-not-in-tree
title: A plain table outside any partition tree has no tree rows, no ancestors and a NULL root
family: partition-info
tier: core
feature_ids: [create-table, partition-tree-functions, null-handling]
required_capabilities: [create-table, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/partition_info.sql
sessions: [a]
setup: |
  CREATE TABLE ptif_normal_table (a int);
steps:
  - sql: |
      SELECT * FROM pg_partition_tree('ptif_normal_table')
    expect: rows
    comment: zero rows
  - sql: |
      SELECT * FROM pg_partition_ancestors('ptif_normal_table')
    expect: rows
    comment: zero rows
  - sql: |
      SELECT pg_partition_root('ptif_normal_table') IS NULL AS root_is_null
    expect: rows
    comment: one row with TRUE
