# Partition inspection functions take regclass; an unknown relation name raises undefined_table.
id: partition-info.error-unknown-relation
title: Partition inspection functions raise undefined_table for a relation name that does not exist
family: partition-info
tier: core
feature_ids: [partitioning, partition-tree-functions, errors]
required_capabilities: [select, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42P01 undefined_table; regclass input"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM pg_partition_tree('ptif_no_such_table')
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT * FROM pg_partition_ancestors('ptif_no_such_table')
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT pg_partition_root('ptif_no_such_table')
    expect: error
    sqlstate: "42P01"
