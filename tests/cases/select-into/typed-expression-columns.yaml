# Result column types of SELECT INTO come from the expressions in the select list.
id: select-into.typed-expression-columns
title: SELECT INTO derives column types from constant and computed expressions
family: select-into
tier: core
feature_ids: [select, select-into, numeric, boolean, types]
required_capabilities: [select, select-into, create-table, numeric]
provenance:
  source: hand
  ref: "PG18 docs sql-selectinto.html; type resolution of expressions in select list"
sessions: [a]
steps:
  - sql: |
      SELECT 1 + 1 AS two, 2::int8 * 3 AS big, 'abc'::varchar(5) AS v, 1.5 + 1 AS d, true AND NULL AS nb INTO TABLE typed_out
    expect: ok
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'typed_out' ORDER BY ordinal_position
    expect: rows
    order: ordered
  - sql: |
      SELECT two, big, v, d, nb IS NULL AS nb_null FROM typed_out
    expect: rows
