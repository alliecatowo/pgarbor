# NULL and empty string stay distinct through SELECT INTO; an untyped NULL literal becomes text.
id: select-into.nulls-and-empty-strings
title: SELECT INTO preserves NULL versus empty string and resolves untyped NULL to text
family: select-into
tier: core
feature_ids: [select, select-into, nulls, text]
required_capabilities: [select, select-into, create-table]
provenance:
  source: hand
  ref: "PG18 docs sql-selectinto.html; PG10+ unknown-type literal resolution"
sessions: [a]
steps:
  - sql: |
      SELECT NULL::int4 AS a, ''::text AS b, NULL AS c INTO TABLE nulls_out
    expect: ok
  - sql: |
      SELECT data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'nulls_out' ORDER BY ordinal_position
    expect: rows
    order: ordered
  - sql: |
      SELECT a IS NULL AS a_null, b = '' AS b_empty, b IS NULL AS b_null, c IS NULL AS c_null FROM nulls_out
    expect: rows
