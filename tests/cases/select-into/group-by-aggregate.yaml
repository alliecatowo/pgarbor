# SELECT INTO over GROUP BY stores one row per group, including a NULL group key and NULL sums.
id: select-into.group-by-aggregate
title: SELECT INTO with GROUP BY and aggregates, including NULL group key and NULL sum
family: select-into
tier: core
feature_ids: [select, select-into, aggregates, group-by, nulls]
required_capabilities: [select, select-into, create-table, insert, aggregates]
provenance:
  source: hand
  ref: "PG18 docs functions-aggregate.html; sql-selectinto.html"
sessions: [a]
setup: |
  CREATE TABLE src (id int4, qty int8, flag boolean);
  INSERT INTO src VALUES (1, 10, true), (2, NULL, false), (3, 30, NULL), (4, 40, true);
steps:
  - sql: |
      SELECT flag, count(*) AS n, sum(qty) AS total INTO TABLE agg FROM src GROUP BY flag
    expect: ok
  - sql: |
      SELECT flag, n, total FROM agg ORDER BY flag NULLS LAST
    expect: rows
    order: ordered
