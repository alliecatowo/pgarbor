# IF NOT EXISTS on an existing relation skips creation and does not run the query (no 1/0 error).
id: select-into.ctas-if-not-exists
title: CREATE TABLE IF NOT EXISTS AS skips an existing relation without evaluating the query
family: select-into
tier: extended
feature_ids: [create-table-as, create-table, if-not-exists, errors, notices]
required_capabilities: [create-table-as, create-table, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_into.sql (CREATE TABLE AS ... IF NOT EXISTS)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ctas_ine_tbl AS SELECT 1
    expect: ok
  - sql: |
      CREATE TABLE ctas_ine_tbl AS SELECT 1 / 0
    expect: error
    sqlstate: "42P07"
    comment: relation already exists, checked before the query runs
  - sql: |
      CREATE TABLE IF NOT EXISTS ctas_ine_tbl AS SELECT 1 / 0
    expect: notice
    comment: NOTICE relation already exists, skipping
  - sql: |
      CREATE TABLE IF NOT EXISTS ctas_ine_tbl AS SELECT 1 / 0 WITH NO DATA
    expect: notice
  - sql: |
      SELECT count(*) AS n FROM ctas_ine_tbl
    expect: rows
