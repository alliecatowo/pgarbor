# SELECT ... INTO TABLE creates a table from the query result; rows and column types are copied.
id: select-into.basic-into-table
title: SELECT INTO TABLE copies matching rows and column types into a new table
family: select-into
tier: core
feature_ids: [select, select-into, create-table, insert]
required_capabilities: [select, select-into, create-table, insert]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_into.sql (SELECT * INTO TABLE ... FROM onek WHERE unique1 < 2; rewritten on a small table)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE src (id int4, name text, qty int8, price numeric(8,2), flag boolean);
  INSERT INTO src VALUES (1, 'alpha', 10, 1.50, true), (2, 'beta', NULL, 2.25, false), (3, '', 30, NULL, NULL), (4, NULL, 40, 4.00, true);
steps:
  - sql: |
      SELECT id, name, qty, price, flag INTO TABLE sitmp1 FROM src WHERE id < 3
    expect: ok
  - sql: |
      SELECT id, name, qty, price, flag FROM sitmp1 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'sitmp1' ORDER BY ordinal_position
    expect: rows
    order: ordered
  - sql: |
      DROP TABLE sitmp1
    expect: ok
