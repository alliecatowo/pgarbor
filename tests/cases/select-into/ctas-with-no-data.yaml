# WITH NO DATA creates the table with the query's column types but no rows; WITH DATA fills it.
id: select-into.ctas-with-no-data
title: CREATE TABLE AS WITH NO DATA yields an empty table, WITH DATA yields the rows
family: select-into
tier: core
feature_ids: [create-table-as, create-table, select, generate-series]
required_capabilities: [create-table-as, create-table, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_into.sql (CREATE TABLE ... AS ... WITH NO DATA / WITH DATA)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE nd AS SELECT generate_series(1, 3) AS g WITH NO DATA
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM nd
    expect: rows
  - sql: |
      SELECT data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'nd'
    expect: rows
  - sql: |
      CREATE TABLE wd AS SELECT generate_series(1, 3) AS g WITH DATA
    expect: ok
  - sql: |
      SELECT g FROM wd ORDER BY g
    expect: rows
    order: ordered
