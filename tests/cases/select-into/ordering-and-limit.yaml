# ORDER BY with NULLS LAST and LIMIT apply before the rows are stored.
id: select-into.ordering-and-limit
title: SELECT INTO with ORDER BY, NULLS LAST and LIMIT stores only the selected top rows
family: select-into
tier: core
feature_ids: [select, select-into, order-by, limit, nulls]
required_capabilities: [select, select-into, create-table, insert, limit]
provenance:
  source: hand
  ref: "PG18 docs sql-selectinto.html; queries.html ORDER BY/LIMIT"
sessions: [a]
setup: |
  CREATE TABLE src (id int4, name text, qty int8);
  INSERT INTO src VALUES (1, 'alpha', 10), (2, 'beta', NULL), (3, 'gamma', 30), (4, 'delta', 40);
steps:
  - sql: |
      SELECT id, name INTO TABLE top2 FROM src ORDER BY qty DESC NULLS LAST LIMIT 2
    expect: ok
  - sql: |
      SELECT id, name FROM top2 ORDER BY id
    expect: rows
    order: ordered
