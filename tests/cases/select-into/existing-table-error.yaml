# SELECT INTO into an existing relation fails and leaves the existing table untouched.
id: select-into.existing-table-error
title: SELECT INTO into an existing table fails with duplicate_table and inserts nothing
family: select-into
tier: core
feature_ids: [select, select-into, create-table, errors]
required_capabilities: [select, select-into, create-table, insert, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42P07 duplicate_table; sql-selectinto.html"
sessions: [a]
setup: |
  CREATE TABLE taken (x int4);
  INSERT INTO taken VALUES (7);
steps:
  - sql: |
      SELECT 1 AS x INTO TABLE taken
    expect: error
    sqlstate: "42P07"
  - sql: |
      SELECT x FROM taken ORDER BY x
    expect: rows
    order: ordered
    comment: still only the original row 7
