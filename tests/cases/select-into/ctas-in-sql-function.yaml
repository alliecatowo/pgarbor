# CREATE TABLE AS as the last command of a SQL function body must work and persist its table.
id: select-into.ctas-in-sql-function
title: CREATE TABLE AS as the final statement of a LANGUAGE SQL function
family: select-into
tier: extended
feature_ids: [create-table-as, create-function-sql, select, functions]
required_capabilities: [create-table-as, create-function-sql, create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_into.sql (CREATE TABLE AS as last command in a SQL function)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE int8_tbl (q1 int8, q2 int8);
  INSERT INTO int8_tbl VALUES (123, 456), (4567890123456789, 123);
  CREATE FUNCTION make_table() RETURNS VOID AS $$
    CREATE TABLE created_table AS SELECT * FROM int8_tbl;
  $$ LANGUAGE SQL;
steps:
  - sql: |
      SELECT make_table()
    expect: rows
  - sql: |
      SELECT q1, q2 FROM created_table ORDER BY q1
    expect: rows
    order: ordered
