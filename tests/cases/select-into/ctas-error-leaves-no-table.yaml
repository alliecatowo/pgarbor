# A runtime error while filling CREATE TABLE AS rolls back the statement, so no table is left behind.
id: select-into.ctas-error-leaves-no-table
title: CREATE TABLE AS with division by zero fails and leaves no relation
family: select-into
tier: core
feature_ids: [create-table-as, create-table, errors, arithmetic]
required_capabilities: [create-table-as, create-table, select, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 22012 division_by_zero; sql-createtableas.html"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ctas_div AS SELECT 1 / 0 AS x
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT to_regclass('ctas_div') IS NULL AS absent
    expect: rows
