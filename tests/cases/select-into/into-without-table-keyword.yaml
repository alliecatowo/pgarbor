# INTO without the TABLE keyword is equivalent; SELECT * expands to every source column.
id: select-into.into-without-table-keyword
title: SELECT * INTO without TABLE keyword copies all columns and NULL values
family: select-into
tier: core
feature_ids: [select, select-into, create-table, select-star]
required_capabilities: [select, select-into, create-table, insert]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_into.sql (SELECT * INTO ... FROM onek2 ...)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE src (id int4, name text, qty int8, price numeric(8,2), flag boolean);
  INSERT INTO src VALUES (1, 'alpha', 10, 1.50, true), (2, 'beta', NULL, 2.25, false), (3, '', 30, NULL, NULL), (4, NULL, 40, 4.00, true);
steps:
  - sql: |
      SELECT * INTO sitmp2 FROM src WHERE id = 4
    expect: ok
  - sql: |
      SELECT id, name IS NULL AS name_null, qty, price IS NULL AS price_null, flag FROM sitmp2
    expect: rows
  - sql: |
      SELECT count(*) AS n FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'sitmp2'
    expect: rows
    comment: five columns copied from src
