# A SELECT INTO whose WHERE matches nothing still creates the table with the full column definition.
id: select-into.no-matching-rows
title: SELECT INTO with no matching rows creates an empty table with the same column types
family: select-into
tier: core
feature_ids: [select, select-into, create-table, where]
required_capabilities: [select, select-into, create-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_into.sql (WHERE clause selecting zero rows)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE src (id int4, name text, qty int8);
  INSERT INTO src VALUES (1, 'alpha', 10), (2, 'beta', NULL);
steps:
  - sql: |
      SELECT id, name, qty INTO TABLE sitmp_empty FROM src WHERE id > 100
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM sitmp_empty
    expect: rows
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'sitmp_empty' ORDER BY ordinal_position
    expect: rows
    order: ordered
