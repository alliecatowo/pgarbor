# CREATE TABLE AS EXECUTE of a prepared statement honours WITH DATA and WITH NO DATA.
id: select-into.ctas-execute-prepared
title: CREATE TABLE AS EXECUTE with WITH DATA and WITH NO DATA
family: select-into
tier: extended
feature_ids: [create-table-as, prepared-statements, select, generate-series]
required_capabilities: [create-table-as, prepared-statements, create-table, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_into.sql (EXECUTE and WITH DATA / WITH NO DATA)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      PREPARE data_sel AS SELECT generate_series(1, 3) AS g
    expect: ok
  - sql: |
      CREATE TABLE tbl_withdata3 AS EXECUTE data_sel WITH DATA
    expect: ok
  - sql: |
      SELECT g FROM tbl_withdata3 ORDER BY g
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE tbl_nodata3 AS EXECUTE data_sel WITH NO DATA
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM tbl_nodata3
    expect: rows
  - sql: |
      DEALLOCATE data_sel
    expect: ok
