# Two unaliased expressions both get the name ?column?; SELECT INTO cannot create duplicate columns.
id: select-into.duplicate-column-names-error
title: SELECT INTO with duplicate output column names fails and creates no table
family: select-into
tier: core
feature_ids: [select, select-into, errors, create-table]
required_capabilities: [select, select-into, create-table, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42701 duplicate_column; column naming rules in sql-select.html"
sessions: [a]
steps:
  - sql: |
      SELECT 1, 2 INTO TABLE dupcols
    expect: error
    sqlstate: "42701"
  - sql: |
      SELECT to_regclass('dupcols') IS NULL AS absent
    expect: rows
