# An INSERT trigger's WHEN clause may not reference OLD (there is no OLD row), rejected with 42P17.
id: triggers.err-when-old-on-insert
title: WHEN clause referencing OLD on an INSERT trigger is rejected
family: triggers
tier: extended
feature_ids: [triggers, plpgsql, errors]
required_capabilities: [create-table, select, plpgsql, triggers, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/triggers.sql (error_ins_when: WHEN (OLD.a <> NEW.a) on INSERT OR UPDATE); errcodes 42P17"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  CREATE FUNCTION noop4() RETURNS trigger AS $$
  BEGIN RETURN NEW; END
  $$ LANGUAGE plpgsql;
steps:
  - sql: |
      CREATE TRIGGER t_bad BEFORE INSERT OR UPDATE ON t FOR EACH ROW WHEN (OLD.a <> NEW.a) EXECUTE PROCEDURE noop4()
    expect: error
    sqlstate: "42P17"
