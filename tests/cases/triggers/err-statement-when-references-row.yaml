# A FOR EACH STATEMENT trigger cannot use a WHEN condition that references column values.
id: triggers.err-statement-when-references-row
title: Statement-level trigger WHEN referencing row values is rejected
family: triggers
tier: extended
feature_ids: [triggers, plpgsql, errors]
required_capabilities: [create-table, select, plpgsql, triggers, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/triggers.sql (error_stmt_when: FOR EACH STATEMENT WHEN (OLD.* IS DISTINCT FROM NEW.*)); errcodes 42P17"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  CREATE FUNCTION noop5() RETURNS trigger AS $$
  BEGIN RETURN NULL; END
  $$ LANGUAGE plpgsql;
steps:
  - sql: |
      CREATE TRIGGER t_stmt BEFORE UPDATE OF a ON t FOR EACH STATEMENT WHEN (OLD.* IS DISTINCT FROM NEW.*) EXECUTE PROCEDURE noop5()
    expect: error
    sqlstate: "42P17"
