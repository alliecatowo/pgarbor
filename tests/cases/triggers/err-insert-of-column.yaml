# OF column list is only grammatical for UPDATE triggers; BEFORE INSERT OF a is a syntax error.
id: triggers.err-insert-of-column
title: INSERT trigger with a column list is a syntax error
family: triggers
tier: extended
feature_ids: [triggers, plpgsql, errors]
required_capabilities: [create-table, select, plpgsql, triggers, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/triggers.sql (error_ins_a: BEFORE INSERT OF a); errcodes 42601"
sessions: [a]
setup: |
  CREATE TABLE t (a int);
  CREATE FUNCTION noop3() RETURNS trigger AS $$
  BEGIN RETURN NEW; END
  $$ LANGUAGE plpgsql;
steps:
  - sql: |
      CREATE TRIGGER t_ins_of BEFORE INSERT OF a ON t FOR EACH ROW EXECUTE PROCEDURE noop3()
    expect: error
    sqlstate: "42601"
