# Statement-level triggers fire once per statement, including an UPDATE that matches zero rows.
id: triggers.statement-level-zero-rows
title: Statement-level triggers fire even when UPDATE affects zero rows
family: triggers
tier: core
feature_ids: [triggers, plpgsql, insert, update, select]
required_capabilities: [create-table, insert, select, update, plpgsql, triggers]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/triggers.sql (per-statement triggers; zero-row UPDATE still calls per-statement trigger)"
sessions: [a]
setup: |
  CREATE TABLE t (a int UNIQUE, b int);
  CREATE TABLE trig_log (seq serial, lvl text, op text, tm text);
  CREATE FUNCTION log_stmt() RETURNS trigger AS $$
  BEGIN
    INSERT INTO trig_log (lvl, op, tm) VALUES (TG_LEVEL, TG_OP, TG_WHEN);
    RETURN NULL;
  END
  $$ LANGUAGE plpgsql;
  CREATE TRIGGER s_bi BEFORE INSERT ON t FOR EACH STATEMENT EXECUTE PROCEDURE log_stmt();
  CREATE TRIGGER s_ai AFTER INSERT ON t FOR EACH STATEMENT EXECUTE PROCEDURE log_stmt();
  CREATE TRIGGER s_au AFTER UPDATE ON t FOR EACH STATEMENT EXECUTE PROCEDURE log_stmt();
steps:
  - sql: |
      INSERT INTO t VALUES (1, 10), (2, 20)
    expect: ok
  - sql: |
      UPDATE t SET b = b + 1 WHERE a > 100
    expect: ok
  - sql: |
      UPDATE t SET b = b + 1 WHERE a = 1
    expect: ok
  - sql: |
      SELECT lvl, op, tm FROM trig_log ORDER BY seq
    expect: rows
    order: ordered
