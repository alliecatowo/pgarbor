# Multi-character names may end in + or - when they also contain one of ~ ! @ # % ^ & | ` ?. ~- and ~~+ are allowed; *- is not.
id: cmd-create-operator.name-multichar-allowed
title: "Multi-character operator names ending in - or + are accepted when they contain a special character"
family: cmd-create-operator
tier: core
feature_ids: [create-operator, operator-names, prefix-operators]
required_capabilities: [create-operator, create-function-sql, catalog-introspection, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_operator.sgml#description (operator name restrictions)"
sessions: [a]
setup: |
  CREATE FUNCTION cco_neg8(int8) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT -$1 $$;
steps:
  - sql: |
      CREATE OPERATOR ~- (RIGHTARG = int8, PROCEDURE = cco_neg8)
    expect: ok
  - sql: |
      CREATE OPERATOR ~~+ (RIGHTARG = int8, PROCEDURE = cco_neg8)
    expect: ok
  - sql: |
      SELECT oprname, oprkind FROM pg_operator
      WHERE oprname IN ('~-', '~~+') AND oprright = 'int8'::regtype
      ORDER BY oprname
    expect: rows
    order: ordered
  - sql: |
      SELECT ~- 5 AS a, ~~+ 7 AS b
    expect: rows
  - sql: |
      CREATE OPERATOR *- (RIGHTARG = int8, PROCEDURE = cco_neg8)
    expect: error
    sqlstate: "42601"
    comment: ends in - and has no special character, so it is not a legal name
