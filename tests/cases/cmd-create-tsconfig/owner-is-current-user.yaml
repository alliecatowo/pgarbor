# Documented: the user who defines a text search configuration becomes its owner.
id: cmd-create-tsconfig.owner-is-current-user
title: "The role that runs CREATE TEXT SEARCH CONFIGURATION becomes its owner"
family: cmd-create-tsconfig
tier: core
feature_ids: [create-text-search-configuration, ownership]
required_capabilities: [create-text-search-configuration, text-search, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsconfig.sgml#sql-createtsconfig (Description: The user who defines ... becomes its owner)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION tsc_owned (PARSER = default)
    expect: ok
  - sql: |
      SELECT r.rolname = current_user AS owner_is_current_user
        FROM pg_ts_config c JOIN pg_roles r ON r.oid = c.cfgowner
       WHERE c.cfgname = 'tsc_owned'
    expect: rows
    order: ordered
