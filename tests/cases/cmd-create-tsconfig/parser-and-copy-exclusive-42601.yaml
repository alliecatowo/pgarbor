# Documented: PARSER and COPY are mutually exclusive; the grammar also rejects an empty option list and unknown options.
id: cmd-create-tsconfig.parser-and-copy-exclusive-42601
title: "PARSER and COPY together, an empty option list and an unknown option are syntax errors"
family: cmd-create-tsconfig
tier: core
feature_ids: [create-text-search-configuration, parser-option, copy-option, option-validation]
required_capabilities: [create-text-search-configuration, text-search, errors, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsconfig.sgml#sql-createtsconfig (Notes: PARSER and COPY are mutually exclusive)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION tsc_both (PARSER = default, COPY = english)
    expect: error
    sqlstate: "42601"
    comment: documented as mutually exclusive
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION tsc_both (copy = simple, parser = default)
    expect: error
    sqlstate: "42601"
    comment: option names are case-insensitive, and the exclusion still applies
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION tsc_none ()
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION tsc_bogus (FOO = english)
    expect: error
    sqlstate: "42601"
    comment: text search configuration parameter "foo" not recognized
  - sql: |
      SELECT count(*) FROM pg_ts_config WHERE cfgname LIKE 'tsc\_%'
    expect: rows
    order: ordered
    comment: no failed statement left a configuration behind
