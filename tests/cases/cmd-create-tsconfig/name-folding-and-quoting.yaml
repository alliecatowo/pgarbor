# Documented: the name follows the usual identifier rules; unquoted names fold to lower case and quoted names are kept as written.
id: cmd-create-tsconfig.name-folding-and-quoting
title: "Unquoted configuration names fold to lower case, quoted names keep their case and are distinct"
family: cmd-create-tsconfig
tier: core
feature_ids: [create-text-search-configuration, identifier-folding, quoted-identifier]
required_capabilities: [create-text-search-configuration, text-search, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsconfig.sgml#sql-createtsconfig (Parameters: name)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION TSC_Fold (PARSER = default)
    expect: ok
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION "TSC_Fold" (PARSER = default)
    expect: ok
    comment: quoted name is a different configuration from the folded one
  - sql: |
      SELECT cfgname FROM pg_ts_config WHERE cfgname ILIKE 'tsc\_fold' ORDER BY cfgname
    expect: rows
    order: ordered
  - sql: |
      SELECT to_tsvector('tsc_fold', 'foxes') = ''::tsvector AS folded_is_empty
    expect: rows
    order: ordered
