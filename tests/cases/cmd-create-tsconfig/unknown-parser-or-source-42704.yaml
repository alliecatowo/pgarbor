# Documented: PARSER must name an existing parser and COPY must name an existing configuration; both fail with undefined_object.
id: cmd-create-tsconfig.unknown-parser-or-source-42704
title: "Unknown parser or unknown source configuration fails with undefined_object and creates nothing"
family: cmd-create-tsconfig
tier: core
feature_ids: [create-text-search-configuration, parser-option, copy-option, undefined-object]
required_capabilities: [create-text-search-configuration, text-search, errors, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsconfig.sgml#sql-createtsconfig (Parameters: parser_name, source_config)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION tsc_bad_parser (PARSER = tsc_no_such_parser)
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION tsc_bad_source (COPY = tsc_no_such_config)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) FROM pg_ts_config WHERE cfgname IN ('tsc_bad_parser', 'tsc_bad_source')
    expect: rows
    order: ordered
