# Extended protocol accepts exactly one statement per Parse; a multi-statement string is rejected.
id: slice-extended.exec-params-multi-statement-42601
title: Multiple statements in an extended-protocol query are rejected with 42601
family: slice-extended
tier: extended
feature_ids: [extended-protocol, errors]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html (Parse: one statement per message); errcodes 42601"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT 1; SELECT 2
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 3 AS after_error
    expect: rows
    order: ordered
