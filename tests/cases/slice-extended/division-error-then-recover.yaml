# A runtime error on one Execute does not poison the next Execute of the same named statement outside a transaction block.
id: slice-extended.division-error-then-recover
title: Division by zero on a named statement, then the same statement succeeds
family: slice-extended
tier: extended
feature_ids: [extended-protocol, prepared-statements, errors, numeric]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html (error recovery, Sync); errcodes 22012 division_by_zero"
sessions: [a]
steps:
  - parse:
      name: quot
      sql: |
        SELECT 10 / $1::int4 AS q
      param_types: [23]
    expect: ok
  - execute:
      statement: quot
      params: ["2"]
    expect: rows
    order: ordered
  - execute:
      statement: quot
      params: ["0"]
    expect: error
    sqlstate: "22012"
  - execute:
      statement: quot
      params: ["5"]
    expect: rows
    order: ordered
