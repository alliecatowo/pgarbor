# Unnamed-statement exec with no param_types: $1 must infer int4 from the int4 column comparison.
id: slice-extended.unnamed-int-param-inference
title: Unnamed exec_params infers int4 for $1 from an int column comparison
family: slice-extended
tier: core
feature_ids: [extended-protocol, param-inference, select]
required_capabilities: [extended-protocol, create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY; sql-expressions.html (parameters)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text, score numeric(6,2));
  INSERT INTO t VALUES (1, 'one', 1.5), (2, NULL, 2.25), (3, '', NULL);
steps:
  - exec_params:
      sql: |
        SELECT id, name, score FROM t WHERE id = $1 ORDER BY id
      params: ["2"]
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT id, name FROM t WHERE id > $1 ORDER BY id
      params: ["1"]
    expect: rows
    order: ordered
