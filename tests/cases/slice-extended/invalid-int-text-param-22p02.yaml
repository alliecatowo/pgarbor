# A text bind value that is not a valid int4 fails during Bind/Execute with 22P02.
id: slice-extended.invalid-int-text-param-22p02
title: Non-integer text value for an int4-inferred parameter fails with 22P02
family: slice-extended
tier: extended
feature_ids: [extended-protocol, param-inference, errors, int4]
required_capabilities: [extended-protocol, create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 datatype-numeric.html (integer input); errcodes 22P02 invalid_text_representation"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one');
steps:
  - exec_params:
      sql: |
        SELECT name FROM t WHERE id = $1
      params: ["abc"]
    expect: error
    sqlstate: "22P02"
  - exec_params:
      sql: |
        SELECT name FROM t WHERE id = $1
      params: [" 1 "]
    expect: rows
    order: ordered
