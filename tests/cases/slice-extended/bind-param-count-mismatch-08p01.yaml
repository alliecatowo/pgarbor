# Bind supplies fewer values than the statement declares: protocol violation 08P01.
id: slice-extended.bind-param-count-mismatch-08p01
title: Bind with fewer parameter values than the statement requires fails with 08P01
family: slice-extended
tier: extended
feature_ids: [extended-protocol, errors, param-inference]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html (Bind); errcodes 08P01 protocol_violation"
sessions: [a]
steps:
  - parse:
      name: two
      sql: |
        SELECT $1::int4 + $2::int4 AS s
    expect: ok
  - execute:
      statement: two
      params: ["1"]
    expect: error
    sqlstate: "08P01"
  - execute:
      statement: two
      params: ["1", "2"]
    expect: rows
    order: ordered
