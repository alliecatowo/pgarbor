# Binary parameter format for int4 and int8, plus binary result format.
id: slice-extended.binary-int-params-and-result
title: Binary-format int4 and int8 parameters with binary result columns
family: slice-extended
tier: extended
feature_ids: [extended-protocol, binary-format, int4, int8]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html (Bind, binary parameter formats); int4send/int8send"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT $1::int4 * 2 AS v, $2::int8 AS w
      params: ["0000002a", "00000000000000ff"]
      param_types: [23, 20]
      param_formats: [binary, binary]
      result_format: binary
    expect: rows
    order: ordered
