# Boolean bind values in text format accept the documented spellings.
id: slice-extended.bool-text-params
title: Text-format boolean parameters accept t, off and yes spellings
family: slice-extended
tier: extended
feature_ids: [extended-protocol, boolean, param-inference]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 datatype-boolean.html (boolean input forms)"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT $1::bool AS a, $2::bool AS b, $3::bool AS c
      params: ["t", "off", "yes"]
      param_types: [16, 16, 16]
    expect: rows
    order: ordered
