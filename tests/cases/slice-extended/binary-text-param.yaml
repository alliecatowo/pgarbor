# Binary parameter format for text: the bytes are used verbatim, not parsed as an escape.
id: slice-extended.binary-text-param
title: Binary-format text parameter is taken as raw bytes
family: slice-extended
tier: extended
feature_ids: [extended-protocol, binary-format, text]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html (Bind, parameter formats); textrecv"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT $1::text AS s, length($1::text) AS n
      params: ["6869"]
      param_types: [25]
      param_formats: [binary]
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT $1::text AS s
      params: ["5c6e"]
      param_types: [25]
      param_formats: [text]
    expect: rows
    order: ordered
