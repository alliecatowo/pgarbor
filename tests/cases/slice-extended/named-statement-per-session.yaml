# Prepared statement names are scoped to a session: the same name can mean different statements in two sessions.
id: slice-extended.named-statement-per-session
title: Same prepared statement name in two sessions refers to each session's own statement
family: slice-extended
tier: extended
feature_ids: [extended-protocol, prepared-statements, multi-session]
required_capabilities: [extended-protocol, multi-session]
provenance:
  source: hand
  ref: "PG18 sql-prepare.html (prepared statements are per session)"
sessions: [a, b]
steps:
  - session: a
    parse:
      name: who
      sql: |
        SELECT 'a'::text AS v
    expect: ok
  - session: b
    parse:
      name: who
      sql: |
        SELECT 'b'::text AS v
    expect: ok
  - session: a
    execute:
      statement: who
    expect: rows
    order: ordered
  - session: b
    execute:
      statement: who
    expect: rows
    order: ordered
