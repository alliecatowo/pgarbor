# NULL bind values: IS NULL tests succeed, and equality with a NULL parameter matches nothing.
id: slice-extended.null-params-three-valued
title: NULL bind parameters follow SQL three-valued logic
family: slice-extended
tier: extended
feature_ids: [extended-protocol, nulls, select]
required_capabilities: [extended-protocol, create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 functions-comparison.html (IS NULL, =); protocol-flow.html (NULL parameter value -1 length)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text, score numeric(6,2));
  INSERT INTO t VALUES (1, 'one', 1.5), (2, NULL, 2.25), (3, '', NULL);
steps:
  - exec_params:
      sql: |
        SELECT $1::int4 IS NULL AS a, $2::text IS NULL AS b, $3::text IS NULL AS c
      params: [null, "", null]
      param_types: [23, 25, 25]
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT count(*) AS n FROM t WHERE name = $1
      params: [null]
      param_types: [25]
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT id FROM t WHERE name IS NOT DISTINCT FROM $1 ORDER BY id
      params: [null]
      param_types: [25]
    expect: rows
    order: ordered
