# Parsing a second statement under a name that is still open is rejected with 42P05.
id: slice-extended.duplicate-named-statement-42p05
title: Re-parsing an open named statement fails with 42P05 and leaves the original usable
family: slice-extended
tier: extended
feature_ids: [extended-protocol, prepared-statements, errors]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 sql-prepare.html; errcodes 42P05 duplicate_prepared_statement"
sessions: [a]
steps:
  - parse:
      name: dup
      sql: |
        SELECT 'first'::text AS v
    expect: ok
  - parse:
      name: dup
      sql: |
        SELECT 'second'::text AS v
    expect: error
    sqlstate: "42P05"
  - execute:
      statement: dup
    expect: rows
    order: ordered
