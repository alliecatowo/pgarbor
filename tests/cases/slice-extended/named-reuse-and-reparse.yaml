# Named statement executed repeatedly with different bindings, closed, then the same name reused.
id: slice-extended.named-reuse-and-reparse
title: Named prepared statement reused with new bindings, closed, and re-parsed under the same name
family: slice-extended
tier: core
feature_ids: [extended-protocol, prepared-statements, param-inference]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 sql-prepare.html; protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
steps:
  - parse:
      name: add2
      sql: |
        SELECT $1::int4 + $2::int4 AS s
    expect: ok
  - execute:
      statement: add2
      params: ["1", "2"]
    expect: rows
  - execute:
      statement: add2
      params: ["10", "-5"]
    expect: rows
  - execute:
      statement: add2
      params: [null, "7"]
    expect: rows
  - close:
      statement: add2
  - parse:
      name: add2
      sql: |
        SELECT $1::text || '!' AS s
    expect: ok
  - execute:
      statement: add2
      params: ["hi"]
    expect: rows
