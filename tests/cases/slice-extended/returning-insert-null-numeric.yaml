# Unnamed INSERT ... RETURNING with a NULL text and a numeric bind value, then read back.
id: slice-extended.returning-insert-null-numeric
title: Unnamed INSERT with RETURNING binds NULL text and numeric values
family: slice-extended
tier: core
feature_ids: [extended-protocol, insert, returning, numeric, nulls]
required_capabilities: [extended-protocol, create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 sql-insert.html (RETURNING); datatype-numeric.html"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text, score numeric(6,2));
steps:
  - exec_params:
      sql: |
        INSERT INTO t (id, name, score) VALUES ($1, $2, $3) RETURNING id, name, score
      params: ["7", null, "1.50"]
      param_types: [23, 25, 1700]
    expect: rows
    order: ordered
  - sql: |
      SELECT id, name IS NULL AS name_null, score FROM t ORDER BY id
    expect: rows
    order: ordered
