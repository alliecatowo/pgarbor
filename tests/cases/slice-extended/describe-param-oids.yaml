# Describe a named statement: ParameterDescription reflects inferred or explicit parameter types.
id: slice-extended.describe-param-oids
title: Describe reports parameter OIDs for inferred and explicitly typed placeholders
family: slice-extended
tier: extended
feature_ids: [extended-protocol, describe, param-inference]
required_capabilities: [extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html (Describe, ParameterDescription); datatype OIDs in pg_type"
sessions: [a]
steps:
  - parse:
      name: typed
      sql: |
        SELECT $1::int4 AS a, $2::text AS b, $3::bool AS c
    expect: ok
  - describe:
      statement: typed
    expect: ok
  - parse:
      name: explicit
      sql: |
        SELECT $1 + 0 AS a, $2 || '' AS b
      param_types: [20, 25]
    expect: ok
  - describe:
      statement: explicit
    expect: ok
