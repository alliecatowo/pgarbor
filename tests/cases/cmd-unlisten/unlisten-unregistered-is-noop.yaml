# Notes: unlistening something you were not listening for gives no warning or error.
id: cmd-unlisten.unregistered-is-noop
title: UNLISTEN of a channel never listened to succeeds silently
family: cmd-unlisten
tier: core
feature_ids: [unlisten, unlisten-channel, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Notes: You can unlisten something you were not listening for; no warning or error)"
sessions: [a]
steps:
  - sql: |
      UNLISTEN never_listened
    expect: ok
    comment: no error and no warning
  - sql: |
      UNLISTEN "another channel"
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: nothing was registered and nothing changed
  - sql: |
      LISTEN real_ch
    expect: ok
  - sql: |
      UNLISTEN not_real_ch
    expect: ok
    comment: unrelated unlisten leaves an existing registration alone
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
