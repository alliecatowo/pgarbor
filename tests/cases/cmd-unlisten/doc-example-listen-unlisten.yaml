# Documented sequence: a NOTIFY after UNLISTEN is ignored by the session that unlistened.
id: cmd-unlisten.doc-example-listen-unlisten
title: Documented LISTEN virtual, UNLISTEN virtual, NOTIFY sequence leaves no registration
family: cmd-unlisten
tier: core
feature_ids: [unlisten, listen, notify, unlisten-channel]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Examples: LISTEN virtual; NOTIFY virtual; UNLISTEN virtual; NOTIFY virtual)"
sessions: [a]
steps:
  - sql: |
      LISTEN virtual
    expect: ok
  - sql: |
      NOTIFY virtual
    expect: ok
    comment: delivery to the listening session is not a recorded result
  - sql: |
      UNLISTEN virtual
    expect: ok
  - sql: |
      NOTIFY virtual
    expect: ok
    comment: the documented example expects no notification here
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: the registration is gone
