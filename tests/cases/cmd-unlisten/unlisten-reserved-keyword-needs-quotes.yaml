# A reserved keyword as channel name must be quoted for UNLISTEN too.
id: cmd-unlisten.reserved-keyword-needs-quotes
title: UNLISTEN with an unquoted reserved keyword is a syntax error and the quoted form works
family: cmd-unlisten
tier: core
feature_ids: [unlisten, reserved-keywords, quoted-identifiers]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 keyword rules applied to ref/unlisten.sgml#sql-unlisten (Parameters: any identifier)"
sessions: [a]
steps:
  - sql: |
      LISTEN "select"
    expect: ok
  - sql: |
      UNLISTEN select
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: the failed UNLISTEN removed nothing
  - sql: |
      UNLISTEN "select"
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
