# A quoted "*" is an ordinary channel name; only the bare * wildcard clears everything.
id: cmd-unlisten.quoted-star-is-channel-name
title: UNLISTEN "*" removes only a channel literally named * and not the other registrations
family: cmd-unlisten
tier: extended
feature_ids: [unlisten, unlisten-wildcard, quoted-identifiers, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 identifier rules applied to ref/unlisten.sgml#sql-unlisten (Parameters: * versus channel)"
sessions: [a]
steps:
  - sql: |
      LISTEN a1
    expect: ok
  - sql: |
      LISTEN "*"
    expect: ok
    comment: a quoted star is accepted as a channel name
  - sql: |
      UNLISTEN "*"
    expect: ok
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
    comment: only a1 remains
  - sql: |
      UNLISTEN *
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
