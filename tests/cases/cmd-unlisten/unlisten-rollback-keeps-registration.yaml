# UNLISTEN is discarded when its transaction rolls back, so the registration stays.
id: cmd-unlisten.rollback-keeps-registration
title: UNLISTEN inside a rolled-back transaction does not remove the registration
family: cmd-unlisten
tier: core
feature_ids: [unlisten, transactions, rollback, pg-listening-channels]
required_capabilities: [listen-notify, transactions, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 transaction semantics applied to ref/unlisten.sgml#sql-unlisten"
sessions: [a]
steps:
  - sql: |
      LISTEN keep1
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      UNLISTEN keep1
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
