# The argument is exactly one identifier or the bare *: no literal, no list, no missing or empty name.
id: cmd-unlisten.syntax-errors
title: UNLISTEN rejects missing, literal, list, combined-wildcard and zero-length arguments without removing anything
family: cmd-unlisten
tier: core
feature_ids: [unlisten, syntax-errors, identifier-rules]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Synopsis: UNLISTEN { channel | * })"
sessions: [a]
steps:
  - sql: |
      LISTEN keep_me
    expect: ok
  - sql: |
      UNLISTEN
    expect: error
    sqlstate: "42601"
  - sql: |
      UNLISTEN 'keep_me'
    expect: error
    sqlstate: "42601"
    comment: a string literal is not an identifier
  - sql: |
      UNLISTEN keep_me, other
    expect: error
    sqlstate: "42601"
    comment: only one channel or * per statement
  - sql: |
      UNLISTEN *, keep_me
    expect: error
    sqlstate: "42601"
  - sql: |
      UNLISTEN ""
    expect: error
    sqlstate: "42601"
    comment: zero-length delimited identifier
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
    comment: the rejected statements removed nothing
