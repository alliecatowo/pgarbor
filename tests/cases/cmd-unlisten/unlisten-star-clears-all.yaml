# UNLISTEN * cancels every listener registration of the current session; repeating it is harmless.
id: cmd-unlisten.star-clears-all
title: UNLISTEN * removes all registrations of the session and is idempotent
family: cmd-unlisten
tier: core
feature_ids: [unlisten, unlisten-wildcard, listen, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Description: the special wildcard * cancels all listener registrations)"
sessions: [a]
steps:
  - sql: |
      LISTEN ch_one; LISTEN ch_two; LISTEN ch_three
    expect: ok
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      UNLISTEN *
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
  - sql: |
      UNLISTEN *
    expect: ok
    comment: a second wildcard with nothing registered is not an error
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
