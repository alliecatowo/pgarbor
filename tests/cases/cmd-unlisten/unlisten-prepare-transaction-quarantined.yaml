# Documented rule: a transaction that executed UNLISTEN cannot be prepared for two-phase commit.
id: cmd-unlisten.prepare-transaction-after-unlisten
title: PREPARE TRANSACTION fails after UNLISTEN in the same transaction
family: cmd-unlisten
tier: extended
feature_ids: [unlisten, two-phase-commit, transactions]
required_capabilities: [listen-notify, two-phase-commit, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Notes: A transaction that has executed UNLISTEN cannot be prepared for two-phase commit)"
quarantine:
  reason: "oracle runs with max_prepared_transactions=0, so PREPARE TRANSACTION fails with 55000 'prepared transactions are disabled' before the UNLISTEN rule can be observed; needs a target with max_prepared_transactions>0"
sessions: [a]
steps:
  - sql: |
      LISTEN keep1
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      UNLISTEN keep1
    expect: ok
  - sql: |
      PREPARE TRANSACTION 'unlisten_gid'
    expect: error
    sqlstate: "0A000"
  - sql: |
      ROLLBACK
    expect: ok
