# The channel is an identifier: unquoted names fold to lower case on both LISTEN and UNLISTEN, quoted names keep case.
id: cmd-unlisten.identifier-folding
title: UNLISTEN folds unquoted channel names and matches quoted names exactly
family: cmd-unlisten
tier: core
feature_ids: [unlisten, identifier-folding, quoted-identifiers, unlisten-channel]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Parameters: channel is any identifier)"
sessions: [a]
steps:
  - sql: |
      LISTEN MixedCase
    expect: ok
  - sql: |
      UNLISTEN MIXEDCASE
    expect: ok
    comment: folds to mixedcase, which matches the LISTEN
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
  - sql: |
      LISTEN "MixedCase2"
    expect: ok
  - sql: |
      UNLISTEN MixedCase2
    expect: ok
    comment: folds to mixedcase2, which is not the quoted name, so nothing is removed
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      UNLISTEN "MixedCase2"
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
