# UNLISTEN * issued inside a transaction takes effect when the transaction commits.
id: cmd-unlisten.star-in-transaction-commits
title: UNLISTEN * inside a committed transaction clears every registration
family: cmd-unlisten
tier: core
feature_ids: [unlisten, unlisten-wildcard, transactions, pg-listening-channels]
required_capabilities: [listen-notify, transactions, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Description: UNLISTEN * cancels all listener registrations)"
sessions: [a]
steps:
  - sql: |
      LISTEN a1; LISTEN b1
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      UNLISTEN *
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
