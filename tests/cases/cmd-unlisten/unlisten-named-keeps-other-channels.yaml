# Naming one channel removes only that registration.
id: cmd-unlisten.named-keeps-other-channels
title: UNLISTEN of one channel leaves the session's other registrations intact
family: cmd-unlisten
tier: core
feature_ids: [unlisten, unlisten-channel, listen, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/unlisten.sgml#sql-unlisten (Parameters: channel is the name of a notification channel)"
sessions: [a]
steps:
  - sql: |
      LISTEN a1; LISTEN b1; LISTEN c1
    expect: ok
  - sql: |
      UNLISTEN a1
    expect: ok
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      UNLISTEN c1
    expect: ok
  - sql: |
      SELECT pg_listening_channels() AS ch ORDER BY 1
    expect: rows
    order: ordered
