# A line needs A and B not both zero, and two distinct points.
id: doc-datatype-geometric.line-invalid-input
title: Degenerate line specifications are rejected
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Lines)"
sessions: [a]
feature_ids: [line, text-input-forms, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '{0,0,1}'::line
    expect: error
    sqlstate: "22P02"
    comment: A and B cannot both be zero
  - sql: |
      SELECT '(1,1),(1,1)'::line
    expect: error
    sqlstate: "22P02"
    comment: the two points must be different
