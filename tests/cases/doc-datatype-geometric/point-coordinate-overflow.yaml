# A coordinate beyond the float8 range is rejected with numeric_value_out_of_range.
id: doc-datatype-geometric.point-coordinate-overflow
title: point coordinate outside float8 range fails with numeric_value_out_of_range
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Points)"
sessions: [a]
feature_ids: [point, float8-range, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '(1e400,0)'::point
    expect: error
    sqlstate: "22003"
