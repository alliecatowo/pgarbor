# Geometric parameters bound as text over the extended protocol use the same input rules.
id: doc-datatype-geometric.geometric-extended-protocol
title: geometric text parameters parse on bind and reject malformed values
family: doc-datatype-geometric
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Geometric Types)"
sessions: [a]
tier: extended
feature_ids: [point, box, circle, extended-protocol, bind-parameters, error-sqlstate]
required_capabilities: [select, errors, extended-protocol]
setup: |
  CREATE TABLE gp (id int4 PRIMARY KEY, c circle)
steps:
  - exec_params:
      sql: "SELECT $1::point AS p, $2::box AS b"
      params: ["1,2", "(0,0),(1,1)"]
    expect: rows
    comment: text parameters use the same forms as literals
  - exec_params:
      sql: "INSERT INTO gp VALUES ($1, $2)"
      params: ["1", "<(0,0),1>"]
    expect: ok
  - exec_params:
      sql: "SELECT $1::circle"
      params: ["<(0,0),-2>"]
    expect: error
    sqlstate: "22P02"
