# circle accepts center and radius in the documented forms and outputs <(x,y),r>.
id: doc-datatype-geometric.circle-input-forms
title: circle accepts all documented center-radius forms and outputs angle-bracket form
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Circles)"
sessions: [a]
feature_ids: [circle, text-input-forms, text-output]
required_capabilities: [select]
steps:
  - sql: |
      SELECT '<(1,2),3>'::circle AS a, '((1,2),3)'::circle AS b, '(1,2),3'::circle AS c, '1,2,3'::circle AS d
    expect: rows
    comment: all four documented forms give the same circle
  - sql: |
      SELECT '<(1,2),0>'::circle AS zero_radius, '<(1e3,-2.5),0.5>'::circle AS exp_center
    expect: rows
    comment: a zero radius is accepted; coordinates are float8
