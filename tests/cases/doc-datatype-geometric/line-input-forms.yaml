# line is stored as A,B,C of Ax + By + C = 0; the two-point forms all produce the same line.
id: doc-datatype-geometric.line-input-forms
title: line accepts {A,B,C} and two-point forms, normalized to coefficients
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Lines)"
sessions: [a]
feature_ids: [line, text-input-forms, text-output]
required_capabilities: [select]
steps:
  - sql: |
      SELECT '{1,2,3}'::line AS l, '{2,4,6}'::line AS l2
    expect: rows
    comment: coefficients are output as given
  - sql: |
      SELECT '[(0,0),(1,1)]'::line AS a, '((0,0),(1,1))'::line AS b, '(0,0),(1,1)'::line AS c, '0,0,1,1'::line AS d
    expect: rows
    comment: every documented two-point form describes the same line y = x
