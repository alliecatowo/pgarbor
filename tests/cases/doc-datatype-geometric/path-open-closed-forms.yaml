# Square brackets make a path open; parentheses or a bare list make it closed. Output mirrors that.
id: doc-datatype-geometric.path-open-closed-forms
title: path open and closed syntaxes are preserved on output
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Paths)"
sessions: [a]
feature_ids: [path, open-path, closed-path, text-input-forms, text-output]
required_capabilities: [select]
steps:
  - sql: |
      SELECT '[(0,0),(1,1),(2,0)]'::path AS open_p, '((0,0),(1,1),(2,0))'::path AS closed_p, '(0,0),(1,1),(2,0)'::path AS bare_p, '0,0,1,1,2,0'::path AS flat_p
    expect: rows
    comment: the bare and flat lists are closed paths; only the bracketed form is open
  - sql: |
      SELECT '[(0,0)]'::path AS one_open, '((0,0))'::path AS one_closed
    expect: rows
    comment: a single-point path is valid in both forms
