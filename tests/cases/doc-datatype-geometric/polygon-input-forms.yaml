# polygon takes its vertices in the parenthesized or bare forms and always outputs the parenthesized form.
id: doc-datatype-geometric.polygon-input-forms
title: polygon accepts parenthesized and bare vertex lists and outputs parentheses
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Polygons)"
sessions: [a]
feature_ids: [polygon, text-input-forms, text-output]
required_capabilities: [select]
steps:
  - sql: |
      SELECT '((0,0),(1,1),(2,0))'::polygon AS a, '(0,0),(1,1),(2,0)'::polygon AS b, '0,0,1,1,2,0'::polygon AS c
    expect: rows
    comment: all three documented syntaxes give the same polygon
  - sql: |
      SELECT '(1,2)'::polygon AS one_vertex, '(0,0),(1,1)'::polygon AS two_vertices
    expect: rows
    comment: the vertex count is not checked on input for polygons
