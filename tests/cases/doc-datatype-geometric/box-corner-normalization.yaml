# box accepts any two opposite corners and stores upper-right then lower-left.
id: doc-datatype-geometric.box-corner-normalization
title: box accepts any two opposite corners and stores them upper-right first
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Boxes)"
sessions: [a]
feature_ids: [box, text-input-forms, corner-normalization]
required_capabilities: [select]
steps:
  - sql: |
      SELECT '(0,0),(1,1)'::box AS a, '(2,0),(0,2)'::box AS b, '((1,2),(3,4))'::box AS c, '1,1,0,0'::box AS d
    expect: rows
    comment: each value is reordered so the output is (upper-right),(lower-left)
  - sql: |
      SELECT '((-1,-1),(-3,-5))'::box AS e
    expect: rows
    comment: negative corners are normalized the same way
