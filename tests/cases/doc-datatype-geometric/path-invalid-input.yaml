# Empty paths and unbalanced delimiters are rejected.
id: doc-datatype-geometric.path-invalid-input
title: empty or unbalanced path literals fail with invalid_text_representation
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Paths)"
sessions: [a]
feature_ids: [path, text-input-forms, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '[]'::path
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '()'::path
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '((0,0),(1,1)'::path
    expect: error
    sqlstate: "22P02"
    comment: the closing parenthesis is missing
