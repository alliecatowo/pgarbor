# Closed paths convert to polygons and back; open paths cannot become polygons.
id: doc-datatype-geometric.path-polygon-casts
title: closed path and polygon convert both ways, open path to polygon is rejected
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Paths and Polygons)"
sessions: [a]
feature_ids: [path, polygon, casts, open-path, closed-path, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '((0,0),(1,1),(2,0))'::path::polygon AS poly, '((0,0),(1,1),(2,0))'::polygon::path AS back
    expect: rows
    comment: a closed path converts to a polygon and a polygon converts to a closed path
  - sql: |
      SELECT '[(0,0),(1,1),(2,0)]'::path::polygon
    expect: error
    sqlstate: "22023"
    comment: only closed paths can become polygons
