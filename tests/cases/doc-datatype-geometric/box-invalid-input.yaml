# A box needs exactly two corner points.
id: doc-datatype-geometric.box-invalid-input
title: box input with one or three points fails with invalid_text_representation
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Boxes)"
sessions: [a]
feature_ids: [box, text-input-forms, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '(0,0)'::box
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(0,0),(1,1),(2,0)'::box
    expect: error
    sqlstate: "22P02"
