# A circle needs one center point and one non-negative radius.
id: doc-datatype-geometric.circle-invalid-input
title: circle with negative radius or wrong shape fails with invalid_text_representation
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Circles)"
sessions: [a]
feature_ids: [circle, text-input-forms, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '<(0,0),-1>'::circle
    expect: error
    sqlstate: "22P02"
    comment: negative radius is rejected
  - sql: |
      SELECT '<(1,2),3,4>'::circle
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(0,0),(1,1),(2,0)'::circle
    expect: error
    sqlstate: "22P02"
    comment: a list of three points is not a circle
