# A polygon stores its smallest bounding box; box() of a polygon returns that box.
id: doc-datatype-geometric.polygon-bounding-box
title: box of a polygon yields its smallest bounding box
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Polygons)"
sessions: [a]
feature_ids: [polygon, bounding-box, box, table-storage]
required_capabilities: [create-table, insert, select]
setup: |
  CREATE TABLE pg_bb (id int4 PRIMARY KEY, pg polygon NOT NULL);
  INSERT INTO pg_bb VALUES (1, '((0,0),(2,2),(0,2))'), (2, '((-1,-1),(3,0),(1,4))')
steps:
  - sql: |
      SELECT id, box(pg) AS bb FROM pg_bb ORDER BY id
    expect: rows
    order: ordered
    comment: the bounding box is the smallest axis-aligned box containing all vertices
  - sql: |
      SELECT box(polygon '((0,0),(2,2),(0,2))') AS bb
    expect: rows
