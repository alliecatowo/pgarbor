# point accepts (x,y) and bare x,y; surrounding whitespace is ignored; output uses the (x,y) form.
id: doc-datatype-geometric.point-input-forms
title: point accepts parenthesized and bare coordinate pairs and outputs (x,y)
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Points)"
sessions: [a]
feature_ids: [point, text-input-forms, text-output]
required_capabilities: [select]
steps:
  - sql: |
      SELECT '(1,2)'::point AS p1, '1,2'::point AS p2, ' ( 7 , -8 ) '::point AS p3
    expect: rows
    comment: both documented syntaxes give the same value, printed in the (x,y) form
  - sql: |
      SELECT point '(0.1,0.2)' AS p, point '(1e-3,2.5e2)' AS q
    expect: rows
    comment: coordinates are float8 and print in shortest round-trip form
