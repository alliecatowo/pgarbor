# Polygons do not accept the bracketed open-path syntax.
id: doc-datatype-geometric.polygon-invalid-input
title: polygon literal with square brackets fails with invalid_text_representation
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Polygons)"
sessions: [a]
feature_ids: [polygon, text-input-forms, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '[(0,0),(1,1),(2,0)]'::polygon
    expect: error
    sqlstate: "22P02"
    comment: square brackets are the open-path syntax and are not valid for polygon
