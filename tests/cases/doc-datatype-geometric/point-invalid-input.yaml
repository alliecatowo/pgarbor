# Malformed point text is rejected with invalid_text_representation.
id: doc-datatype-geometric.point-invalid-input
title: Malformed point literals fail with invalid_text_representation
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Points)"
sessions: [a]
feature_ids: [point, text-input-forms, error-sqlstate]
required_capabilities: [select, errors]
steps:
  - sql: |
      SELECT '(1,2'::point
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(1,)'::point
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'nan'::point
    expect: error
    sqlstate: "22P02"
    comment: a bare word without parentheses or a comma is not a point
