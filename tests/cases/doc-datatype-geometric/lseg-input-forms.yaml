# lseg accepts the four documented syntaxes for two endpoints and always outputs [(x1,y1),(x2,y2)].
id: doc-datatype-geometric.lseg-input-forms
title: lseg accepts all documented endpoint syntaxes and outputs bracketed endpoints
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Line Segments)"
sessions: [a]
feature_ids: [lseg, text-input-forms, text-output]
required_capabilities: [select]
steps:
  - sql: |
      SELECT '[(0,0),(1,1)]'::lseg AS a, '((0,0),(1,1))'::lseg AS b, '(0,0),(1,1)'::lseg AS c, '0,0,1,1'::lseg AS d
    expect: rows
    comment: all four syntaxes give the same segment; output uses the bracketed form
  - sql: |
      SELECT '[(1,1),(0,0)]'::lseg AS e, '(0,0),(0,0)'::lseg AS f
    expect: rows
    comment: endpoint order is kept; a zero-length segment is accepted
