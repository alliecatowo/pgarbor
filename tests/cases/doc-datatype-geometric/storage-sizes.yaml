# Stored sizes match the documented table: point 16, line 24, lseg 32, box 32, circle 24,
# path 16+16n, polygon 40+16n bytes.
id: doc-datatype-geometric.storage-sizes
title: pg_column_size matches documented fixed and per-vertex geometric sizes
family: doc-datatype-geometric
tier: core
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-geometric (Geometric Types)"
sessions: [a]
feature_ids: [point, line, lseg, box, path, polygon, circle, storage-size]
required_capabilities: [select]
steps:
  - sql: |
      SELECT pg_column_size('(1,2)'::point) AS point_sz,
             pg_column_size('{1,2,3}'::line) AS line_sz,
             pg_column_size('[(0,0),(1,1)]'::lseg) AS lseg_sz,
             pg_column_size('(0,0),(1,1)'::box) AS box_sz,
             pg_column_size('<(1,2),3>'::circle) AS circle_sz
    expect: rows
    comment: expected 16, 24, 32, 32, 24
  - sql: |
      SELECT pg_column_size('[(0,0)]'::path) AS path1_sz,
             pg_column_size('[(0,0),(1,1),(2,0)]'::path) AS path3_sz,
             pg_column_size('((0,0))'::polygon) AS poly1_sz,
             pg_column_size('((0,0),(1,1),(2,0))'::polygon) AS poly3_sz
    expect: rows
    comment: expected path 16+16n (32, 64) and polygon 40+16n (56, 88)
