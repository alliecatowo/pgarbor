# Defining a range type over float8 with subtype_diff, as in the 'Defining New Range Types' section.
id: doc-rangetypes.user-defined-float8-range
title: CREATE TYPE AS RANGE over float8 with subtype_diff accepts and prints range literals
family: doc-rangetypes
tier: core
feature_ids: [range-types, create-type, user-defined-range-types]
required_capabilities: [range-types, create-type, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-defining"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE floatrange AS RANGE (
          subtype = float8,
          subtype_diff = float8mi
      )
    expect: ok
  - sql: |
      SELECT '[1.234, 5.678]'::floatrange
    expect: rows
    comment: no canonicalization function, so the value is printed as written (float8 has no step)
  - sql: |
      SELECT '(1.5, 2.5)'::floatrange @> 2.0::float8, '(1.5, 2.5)'::floatrange @> 2.5::float8
    expect: rows
    comment: the exclusive upper bound 2.5 is not contained
