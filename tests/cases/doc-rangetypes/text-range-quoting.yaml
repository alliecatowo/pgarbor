# Range bound quoting: commas, quotes, backslash escapes, the quoted empty string, and
# whitespace inside the brackets, on a user-defined text range.
id: doc-rangetypes.text-range-quoting
title: Quoted and backslash-escaped range bounds parse and print as documented
family: doc-rangetypes
tier: core
feature_ids: [range-types, range-io, range-quoting, create-type]
required_capabilities: [range-types, create-type, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-io"
sessions: [a]
setup: |
  CREATE TYPE textrange AS RANGE (subtype = text);
steps:
  - sql: |
      SELECT '["a,b",c)'::textrange, '[a\,b,c)'::textrange, '["""",x)'::textrange
    expect: rows
    comment: quoted comma, backslash-escaped comma, and a doubled quote inside quotes
  - sql: |
      SELECT '[,""]'::textrange, '[""," b")'::textrange, '[ a , b)'::textrange
    expect: rows
    comment: 'the quoted empty string is an empty-string bound, not an unbounded side; whitespace inside brackets is part of the bound'
  - sql: |
      SELECT '[a,b)'::textrange @> 'ab'::text, '[a,b)'::textrange @> 'b'::text
    expect: rows
    comment: text ordering over the bounds; b is excluded by the upper bound
