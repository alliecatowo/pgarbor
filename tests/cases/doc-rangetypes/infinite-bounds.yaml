# Omitted bounds are infinite and beyond any element's infinity; an explicit inclusive omitted
# bound is converted to exclusive; timestamp 'infinity' is an ordinary bound value.
id: doc-rangetypes.infinite-bounds
title: Unbounded ranges, omitted-bound canonicalization, and timestamp infinity bounds
family: doc-rangetypes
tier: core
feature_ids: [range-types, unbounded-ranges, range-infinity]
required_capabilities: [range-types, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-infinite"
sessions: [a]
steps:
  - sql: |
      SELECT '(,3]'::int4range, '[,]'::int4range, '[1,)'::int4range, '[,)'::int4range
    expect: rows
    comment: "[,] is converted to (,); omitted bounds print as empty sides"
  - sql: |
      SELECT lower_inf('(,3]'::int4range), upper_inf('(,3]'::int4range), lower_inf('[1,)'::int4range), upper_inf('[1,)'::int4range)
    expect: rows
  - sql: |
      SELECT '(,3]'::int4range @> -2147483648, '[1,)'::int4range @> 2147483647
    expect: rows
    comment: unbounded ranges contain all values on their open side
  - sql: |
      SELECT '[2000-01-01, infinity)'::tsrange @> 'infinity'::timestamp, '[2000-01-01, infinity]'::tsrange @> 'infinity'::timestamp
    expect: rows
    comment: the exclusive upper bound infinity excludes the infinity value; the inclusive bound includes it
  - sql: |
      SELECT upper_inf('[2000-01-01, infinity]'::tsrange), upper_inf('[2000-01-01,)'::tsrange)
    expect: rows
    comment: an explicit infinity bound is a finite bound for upper_inf; an omitted bound is infinite
