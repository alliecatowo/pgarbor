# Range text input: inclusive/exclusive bounds, canonicalization of discrete ranges, and the
# 'empty' pattern. Mirrors the rangetypes-io examples.
id: doc-rangetypes.range-literal-input
title: Range literal input parses bounds and normalizes discrete ranges to canonical form
family: doc-rangetypes
tier: core
feature_ids: [range-types, range-io, range-canonical-form]
required_capabilities: [range-types, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-io"
sessions: [a]
steps:
  - sql: |
      SELECT '[3,7)'::int4range, '(3,7)'::int4range, '[4,4]'::int4range, '[4,4)'::int4range
    expect: rows
    comment: includes 3, excludes 7; (3,7) normalizes to [4,7); [4,4] is the single point 4; [4,4) is empty
  - sql: |
      SELECT '[3,7)'::numrange, '(3,7)'::numrange, '[4,4]'::numrange, '[4,4)'::numrange
    expect: rows
    comment: numeric is continuous, so exclusive bounds are kept as written; [4,4) is still empty
  - sql: |
      SELECT '[4,4)'::int4range = 'empty'::int4range AS same_as_empty
    expect: rows
    comment: a range with no points is normalized to empty
