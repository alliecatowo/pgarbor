# Multirange text input: curly braces, empty multirange, ordering, and normalization of
# adjacent ranges into one range.
id: doc-rangetypes.multirange-literal-input
title: Multirange literals normalize adjacent ranges and accept the empty multirange
family: doc-rangetypes
tier: core
feature_ids: [multirange-types, multirange-io]
required_capabilities: [range-types, multiranges, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-io"
sessions: [a]
steps:
  - sql: |
      SELECT '{}'::int4multirange, '{[3,7)}'::int4multirange, '{[3,7), [8,9)}'::int4multirange
    expect: rows
    comment: empty multirange, a single member, and two non-contiguous members
  - sql: |
      SELECT '{[1,3),[3,5)}'::int4multirange
    expect: rows
    comment: adjacent members merge into one range, so this displays as {[1,5)}
  - sql: |
      SELECT ' { [3,7) , [8,9) } '::int4multirange
    expect: rows
    comment: whitespace is permitted around braces and commas
