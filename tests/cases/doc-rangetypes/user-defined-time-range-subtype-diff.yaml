# The timerange example from 'Defining New Range Types': a SQL subtype_diff function over time.
id: doc-rangetypes.user-defined-time-range-subtype-diff
title: User-defined timerange with a SQL subtype_diff function over the time type
family: doc-rangetypes
tier: extended
feature_ids: [range-types, create-type, create-function-sql, user-defined-range-types]
required_capabilities: [range-types, create-type, create-function-sql, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-defining"
sessions: [a]
setup: |
  CREATE FUNCTION time_subtype_diff(x time, y time) RETURNS float8 AS
  'SELECT EXTRACT(EPOCH FROM (x - y))' LANGUAGE sql STRICT IMMUTABLE;
  CREATE TYPE timerange AS RANGE (
      subtype = time,
      subtype_diff = time_subtype_diff
  );
steps:
  - sql: |
      SELECT '[11:10, 23:00]'::timerange
    expect: rows
    comment: time values are printed in full form
  - sql: |
      SELECT time_subtype_diff('23:00'::time, '11:10'::time) AS diff_seconds
    expect: rows
    comment: EXTRACT(EPOCH ...) of 11h50m is 42600 seconds
