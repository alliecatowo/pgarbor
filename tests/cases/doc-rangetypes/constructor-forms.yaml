# Range and multirange constructor functions: two-argument standard form, three-argument
# bound specifier, NULL bounds meaning unbounded, and zero/one/two-argument multirange forms.
id: doc-rangetypes.constructor-forms
title: Range constructors honor bound specifiers and NULL bounds; multirange constructors accept zero or more ranges
family: doc-rangetypes
tier: core
feature_ids: [range-types, range-constructors, multirange-constructors]
required_capabilities: [range-types, multiranges, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-construct"
sessions: [a]
steps:
  - sql: |
      SELECT numrange(1.0, 14.0, '(]'), numrange(1.0, 14.0), int8range(1, 14, '(]'), numrange(NULL, 2.2)
    expect: rows
    comment: explicit (] kept for numeric; default is [); int8range (] canonicalizes to [2,15); NULL lower is unbounded
  - sql: |
      SELECT numrange(1.0, 14.0, '[]'), numrange(1.0, 14.0, '()'), numrange(1.0, 14.0, '[)')
    expect: rows
    comment: the three-argument form accepts all four bound specifiers
  - sql: |
      SELECT int4range(5, 5), int4range(5, 5, '[]'), int4range(NULL, NULL), int4range(NULL, NULL, '[]')
    expect: rows
    comment: "[5,5) is empty; [5,5] is the single point; NULL on both sides gives (,) and an inclusive marker on NULL bounds is still unbounded"
  - sql: |
      SELECT nummultirange(), nummultirange(numrange(1.0, 14.0)), nummultirange(numrange(1.0, 14.0), numrange(20.0, 25.0))
    expect: rows
    comment: zero, one and two range arguments
  - sql: |
      SELECT int4range(4, 8, '[]') = int4range(4, 9), int4range(4, 8, '[]') = int4range(3, 9, '()')
    expect: rows
    comment: canonical form makes [4,8] equal to [4,9) and (3,9) on the integer type
