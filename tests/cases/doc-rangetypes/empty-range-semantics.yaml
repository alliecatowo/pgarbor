# The empty range contains no points: membership, bounds, and isempty behave as documented.
id: doc-rangetypes.empty-range-semantics
title: The empty range has no points, NULL bounds, and is contained by every range
family: doc-rangetypes
tier: core
feature_ids: [range-types, empty-ranges, range-functions]
required_capabilities: [range-types, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-io"
sessions: [a]
steps:
  - sql: |
      SELECT 'empty'::int4range, isempty('empty'::int4range), isempty('[4,4)'::int4range), isempty('[4,4]'::int4range)
    expect: rows
    comment: the documented empty pattern; [4,4) is empty; [4,4] is not
  - sql: |
      SELECT lower('empty'::int4range) IS NULL, upper('empty'::int4range) IS NULL, lower_inc('empty'::int4range), upper_inc('empty'::int4range)
    expect: rows
    comment: empty ranges have no bounds, so bound accessors return NULL and inclusivity is false
  - sql: |
      SELECT 3 <@ 'empty'::int4range, 'empty'::int4range @> 3, 'empty'::int4range && int4range(1, 10), 'empty'::int4range <@ int4range(1, 10)
    expect: rows
    comment: nothing is contained in empty and empty overlaps nothing; empty is contained by any range
  - sql: |
      SELECT int4range(3, 3) = 'empty'::int4range, numrange(2.5, 2.5, '[]') = 'empty'::numrange
    expect: rows
    comment: "[3,3) is empty; [2.5,2.5] is not empty and is not equal to empty"
