# The documented EXCLUDE USING GIST (during WITH &&) constraint: overlapping rows are rejected
# with SQLSTATE 23P01, adjacent and disjoint rows are accepted.
id: doc-rangetypes.exclusion-constraint-overlap
title: EXCLUDE USING GIST with range overlap rejects overlapping reservations with 23P01
family: doc-rangetypes
tier: core
feature_ids: [range-types, exclusion-constraints, gist-index]
required_capabilities: [range-types, create-table, insert, gist-index, exclusion-constraints, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rangetypes.sgml#rangetypes-constraint"
sessions: [a]
setup: |
  CREATE TABLE reservation (
      during tsrange,
      EXCLUDE USING GIST (during WITH &&)
  );
steps:
  - sql: |
      INSERT INTO reservation VALUES ('[2010-01-01 11:30, 2010-01-01 15:00)')
    expect: ok
  - sql: |
      INSERT INTO reservation VALUES ('[2010-01-01 14:45, 2010-01-01 15:45)')
    expect: error
    sqlstate: "23P01"
    comment: documented conflict; the table name prefix of the constraint is reservation_during_excl
  - sql: |
      INSERT INTO reservation VALUES ('[2010-01-01 15:00, 2010-01-01 16:00)')
    expect: ok
    comment: the new range starts exactly where the first one ends, and [) bounds do not overlap
  - sql: |
      SELECT during FROM reservation ORDER BY during
    expect: rows
    order: ordered
