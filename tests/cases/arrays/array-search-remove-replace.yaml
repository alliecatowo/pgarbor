# array_position, array_positions, array_remove, array_replace with NULL search values and NULL arrays.
id: arrays.search-remove-replace
title: array_position, array_positions, array_remove and array_replace with NULL values
family: arrays
tier: core
feature_ids: [arrays, array-functions, nulls]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/arrays.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT array_position(ARRAY[1,2,3,4,5], 4) AS p1, array_position(ARRAY[5,3,4,2,1], 4) AS p2, array_position(ARRAY['sun','mon','tue'], 'mon') AS p3, array_position(ARRAY['sun','mon','tue'], 'sat') AS p4
    expect: rows
    comment: missing element yields NULL
  - sql: |
      SELECT array_position(ARRAY['sun','mon','tue','wed',NULL,'fri'], NULL) AS p_null, array_position(ARRAY['sun','mon','tue'], NULL) AS p_none
    expect: rows
    comment: NULL search value matches NULL elements
  - sql: |
      SELECT array_positions(ARRAY[1,2,3,NULL,5,6,1,2,3,NULL,5,6], NULL) AS nulls_at, array_positions(ARRAY[1,2,3,4,5,6,1,2,3,4,5,6], 4) AS fours_at, array_positions(NULL::int[], 10) IS NULL AS null_arr
    expect: rows
  - sql: |
      SELECT array_remove(ARRAY[1,2,2,3], 2) AS r1, array_remove(ARRAY[1,2,2,3], 5) AS r2, array_remove(ARRAY[1,NULL,NULL,3], NULL) AS r3, array_remove(ARRAY['X','X','X'], 'X') = '{}' AS r4
    expect: rows
  - sql: |
      SELECT array_replace(ARRAY[1,2,NULL,4,NULL], NULL, 5) AS r1, array_replace(ARRAY[1,2,5,4], 5, NULL) AS r2, array_replace(ARRAY[1,NULL,3], NULL, NULL) AS r3, array_replace(ARRAY['AB',NULL,'CDE'], NULL, '12') AS r4
    expect: rows
  - sql: |
      SELECT array_remove('{{1,2,2},{1,4,3}}'::int[], 2)
    expect: error
    sqlstate: "0A000"
    comment: array_remove does not support multidimensional arrays
