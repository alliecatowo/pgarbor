# cardinality and array_length over empty, NULL, lower-bounded and multidimensional arrays.
id: arrays.cardinality-and-length
title: cardinality and array_length with NULL, empty and nonstandard bounds
family: arrays
tier: core
feature_ids: [arrays, array-functions, nulls]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/arrays.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT cardinality(NULL::int[]) AS c_null, cardinality('{}'::int[]) AS c_empty, cardinality(ARRAY[1,2,3]) AS c3, cardinality('[2:4]={5,6,7}'::int[]) AS c_lb2, cardinality('{{1,2},{3,4},{5,6}}'::int[]) AS c_2d, cardinality('{{{1,9},{5,6}},{{2,3},{3,4}}}'::int[]) AS c_3d
    expect: rows
  - sql: |
      SELECT array_length(ARRAY[1,2,3], 1) AS l1, array_length(ARRAY[[1,2,3],[4,5,6]], 2) AS l2, array_length(ARRAY[[1,2,3],[4,5,6]], 3) AS l3, array_length('{}'::int[], 1) AS l_empty
    expect: rows
    comment: out-of-range dimension and empty arrays yield NULL
  - sql: |
      SELECT array_length(array_positions(ARRAY[1,2,3,4,5,6,1,2,3,4,5,6], 4), 1) AS n
    expect: rows
