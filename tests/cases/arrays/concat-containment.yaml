# Array concatenation operators and containment/overlap with NULL elements and empty arrays.
id: arrays.concat-containment
title: Array concatenation and @>, &&, <@, = operators with NULL elements and empty arrays
family: arrays
tier: core
feature_ids: [arrays, array-operators, array-concat, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/arrays.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE op (seqno int4 PRIMARY KEY, i int4[]);
  INSERT INTO op VALUES (1, '{17,32,38}'), (2, '{}'), (3, '{NULL,32}'), (4, NULL), (5, '{89}');
steps:
  - sql: |
      SELECT ARRAY[1,2] || 3 AS r1, 0 || ARRAY[1,2] AS r2, ARRAY[1,2] || ARRAY[3,4] AS r3,
             ARRAY[[1,2],[3,4]] || ARRAY[5,6] AS r4, ARRAY[1.1] || ARRAY[2,3,4] AS r5
    expect: rows
  - sql: |
      SELECT seqno FROM op WHERE i @> '{32}' ORDER BY seqno
    expect: rows
    order: ordered
  - sql: |
      SELECT seqno FROM op WHERE i && '{32}' ORDER BY seqno
    expect: rows
    order: ordered
  - sql: |
      SELECT seqno FROM op WHERE i @> '{}' ORDER BY seqno
    expect: rows
    order: ordered
    comment: NULL array rows never match
  - sql: |
      SELECT seqno FROM op WHERE i <@ '{}' ORDER BY seqno
    expect: rows
    order: ordered
  - sql: |
      SELECT seqno FROM op WHERE i = '{}' ORDER BY seqno
    expect: rows
    order: ordered
