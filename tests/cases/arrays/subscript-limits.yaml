# Subscript limits: more than MAXDIM (6) subscripts is an error; NULL subscript on read is NULL.
id: arrays.subscript-limits
title: Selecting with more than six subscripts fails with 54000
family: arrays
tier: extended
feature_ids: [arrays, array-subscripts, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/arrays.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT ('{}'::int[])[1][2][3][4][5][6][7]
    expect: error
    sqlstate: "54000"
    comment: MAXDIM is 6 (program_limit_exceeded)
  - sql: |
      SELECT ('{}'::int[])[1][2][3][4][5][6] IS NULL AS six_dims_ok
    expect: rows
    comment: exactly six subscripts is allowed and yields NULL for an empty array
