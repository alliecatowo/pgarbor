# trim_array bounds errors, array_reverse, and array_sort with NULL placement and collation.
id: arrays.trim-reverse-sort
title: trim_array, array_reverse and array_sort with NULL placement and bounds errors
family: arrays
tier: extended
feature_ids: [arrays, array-functions, nulls, collation]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/arrays.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT trim_array(ARRAY[1,2,3,4,5,6], 2) AS t1, trim_array(ARRAY[1,2], 0) AS t0
    expect: rows
  - sql: |
      SELECT trim_array(ARRAY[1, 2, 3], -1)
    expect: error
    sqlstate: "2202E"
  - sql: |
      SELECT trim_array(ARRAY[1, 2, 3], 10)
    expect: error
    sqlstate: "2202E"
  - sql: |
      SELECT array_reverse('{1,2,3,NULL,4,5,6}'::int[]) AS rev, array_reverse('{}'::int[]) AS empty_rev
    expect: rows
  - sql: |
      SELECT array_sort('{1.1,3.3,5.5,2.2,null,4.4,6.6}'::float8[]) AS asc_default, array_sort('{1.1,3.3,5.5,2.2,null,4.4,6.6}'::float8[], true) AS desc_default
    expect: rows
    comment: default places NULLs last for ascending sort
  - sql: |
      SELECT array_sort('{1.1,3.3,5.5,2.2,null,4.4,6.6}'::float8[], true, true) AS desc_nulls_first, array_sort('{foo,bar,CCC,Abc,bbc}'::text[] COLLATE "C") AS c_collation
    expect: rows
