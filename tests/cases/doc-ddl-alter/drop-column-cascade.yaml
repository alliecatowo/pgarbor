# DROP COLUMN removes data and table constraints on the column; a column referenced by a foreign key needs CASCADE; IF EXISTS only notices.
id: doc-ddl-alter.drop-column-cascade
title: DROP COLUMN drops its data and CHECKs; referenced column needs CASCADE to drop the foreign key
family: doc-ddl-alter
tier: core
feature_ids: [alter-table, drop-column, cascade, foreign-key, check-constraint, errors]
required_capabilities: [create-table, alter-table, insert, select, foreign-keys, constraints, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-alter (Removing a Column)"
sessions: [a]
setup: |
  CREATE TABLE groups (id integer PRIMARY KEY);
  CREATE TABLE products (product_no integer PRIMARY KEY, grp integer REFERENCES groups(id), price numeric CHECK (price > 0), label text);
  INSERT INTO groups VALUES (1);
  INSERT INTO products VALUES (1, 1, 5, 'x'), (2, NULL, NULL, 'y');
steps:
  - sql: |
      ALTER TABLE products DROP COLUMN price
    expect: ok
    comment: the column's data disappears and its CHECK constraint is dropped with it
  - sql: |
      SELECT conname FROM pg_constraint WHERE conrelid = 'products'::regclass AND contype = 'c'
    expect: rows
    order: multiset
  - sql: |
      SELECT product_no, label FROM products ORDER BY product_no
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE products DROP COLUMN price
    expect: error
    sqlstate: "42703"
  - sql: |
      ALTER TABLE products DROP COLUMN IF EXISTS price
    expect: notice
    comment: IF EXISTS suppresses the error and emits a NOTICE
  - sql: |
      ALTER TABLE groups DROP COLUMN id
    expect: error
    sqlstate: "2BP01"
    comment: products.grp references groups.id, so the drop is refused without CASCADE
  - sql: |
      ALTER TABLE groups DROP COLUMN id CASCADE
    expect: ok
    comment: CASCADE drops the dependent foreign key constraint too
  - sql: |
      SELECT conname FROM pg_constraint WHERE conrelid = 'products'::regclass AND contype = 'f'
    expect: rows
    order: multiset
  - sql: |
      SELECT product_no, grp, label FROM products ORDER BY product_no
    expect: rows
    order: ordered
