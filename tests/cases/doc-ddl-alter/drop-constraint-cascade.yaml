# A unique key referenced by a foreign key needs CASCADE to drop; dropping a missing constraint errors, IF EXISTS notices.
id: doc-ddl-alter.drop-constraint-cascade
title: DROP CONSTRAINT on a referenced unique key needs CASCADE; a missing name errors unless IF EXISTS
family: doc-ddl-alter
tier: core
feature_ids: [alter-table, drop-constraint, cascade, foreign-key, unique-constraint, errors]
required_capabilities: [create-table, alter-table, insert, select, foreign-keys, constraints, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-alter (Removing a Constraint)"
sessions: [a]
setup: |
  CREATE TABLE groups (id integer PRIMARY KEY, code integer CONSTRAINT groups_code_key UNIQUE);
  CREATE TABLE items (item_no integer PRIMARY KEY, ref_code integer);
  INSERT INTO groups VALUES (1, 10);
  INSERT INTO items VALUES (1, 10), (2, NULL);
steps:
  - sql: |
      ALTER TABLE items ADD FOREIGN KEY (ref_code) REFERENCES groups (code)
    expect: ok
    comment: unnamed FOREIGN KEY, so the generated name is items_ref_code_fkey
  - sql: |
      INSERT INTO items VALUES (3, 99)
    expect: error
    sqlstate: "23503"
  - sql: |
      ALTER TABLE groups DROP CONSTRAINT groups_code_key
    expect: error
    sqlstate: "2BP01"
    comment: the foreign key depends on the unique index behind groups_code_key
  - sql: |
      ALTER TABLE groups DROP CONSTRAINT groups_code_key CASCADE
    expect: ok
    comment: CASCADE drops the dependent foreign key as well
  - sql: |
      SELECT conname FROM pg_constraint WHERE conrelid = 'items'::regclass AND contype = 'f'
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO items VALUES (3, 99)
    expect: ok
    comment: with the foreign key gone, the value is accepted
  - sql: |
      ALTER TABLE groups DROP CONSTRAINT groups_code_key
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER TABLE groups DROP CONSTRAINT IF EXISTS groups_code_key
    expect: notice
  - sql: |
      SELECT item_no, ref_code FROM items ORDER BY item_no
    expect: rows
    order: ordered
