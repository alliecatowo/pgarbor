# RENAME COLUMN and RENAME TO change names only: data and CHECK enforcement carry over; the old names stop resolving.
id: doc-ddl-alter.rename-column-table
title: RENAME COLUMN and RENAME TO keep data and constraints; old names stop resolving
family: doc-ddl-alter
tier: core
feature_ids: [alter-table, rename-column, rename-table, check-constraint, errors]
required_capabilities: [create-table, alter-table, insert, select, constraints, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-alter (Renaming a Column; Renaming a Table)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no integer PRIMARY KEY, price numeric CHECK (price > 0));
  INSERT INTO products VALUES (1, 5), (2, 7.5);
steps:
  - sql: |
      ALTER TABLE products RENAME COLUMN product_no TO product_number
    expect: ok
  - sql: |
      SELECT product_number, price FROM products ORDER BY product_number
    expect: rows
    order: ordered
  - sql: |
      SELECT product_no FROM products
    expect: error
    sqlstate: "42703"
    comment: the old column name no longer resolves
  - sql: |
      ALTER TABLE products RENAME COLUMN nosuch TO z
    expect: error
    sqlstate: "42703"
  - sql: |
      INSERT INTO products VALUES (3, -1)
    expect: error
    sqlstate: "23514"
    comment: the CHECK on price still applies after the rename
  - sql: |
      ALTER TABLE products RENAME TO items
    expect: ok
  - sql: |
      SELECT count(*) FROM products
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT product_number, price FROM items ORDER BY product_number
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE items RENAME COLUMN product_number TO sku
    expect: ok
  - sql: |
      SELECT sku FROM items ORDER BY sku
    expect: rows
    order: ordered
