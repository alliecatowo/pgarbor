# SET DEFAULT affects only future INSERTs; DROP DEFAULT is repeatable and makes the default NULL.
id: doc-ddl-alter.set-drop-default
title: SET DEFAULT leaves existing rows alone; DROP DEFAULT is idempotent and yields NULL
family: doc-ddl-alter
tier: core
feature_ids: [alter-table, column-default, set-default, drop-default, null-semantics]
required_capabilities: [create-table, alter-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-alter (Changing a Column's Default Value)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no integer PRIMARY KEY, price numeric);
  INSERT INTO products VALUES (1, 10.00);
steps:
  - sql: |
      ALTER TABLE products ALTER COLUMN price SET DEFAULT 7.77
    expect: ok
  - sql: |
      SELECT product_no, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
    comment: the existing row is unchanged by SET DEFAULT
  - sql: |
      INSERT INTO products (product_no) VALUES (2)
    expect: ok
  - sql: |
      SELECT product_no, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
    comment: the new row takes the new default
  - sql: |
      ALTER TABLE products ALTER COLUMN price DROP DEFAULT
    expect: ok
  - sql: |
      ALTER TABLE products ALTER COLUMN price DROP DEFAULT
    expect: ok
    comment: dropping a default that is not defined is not an error
  - sql: |
      INSERT INTO products (product_no) VALUES (3)
    expect: ok
  - sql: |
      SELECT product_no, price IS NULL AS price_null FROM products ORDER BY product_no
    expect: rows
    order: ordered
