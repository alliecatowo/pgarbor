# NULL propagates through select-list arithmetic and IS NULL tests the computed column.
id: doc-queries-select-lists.null-propagation-in-select-list
title: NULL inputs propagate through select-list expressions and are testable with IS NULL
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, expressions, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (value expression evaluated per row)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4, c int4);
  INSERT INTO t VALUES (1, 2, 3), (2, NULL, 4), (3, 5, NULL);
steps:
  - sql: |
      SELECT a, b + c AS sum, b + c IS NULL AS sum_is_null, coalesce(b, 0) + c AS safe_sum FROM t ORDER BY a
    expect: rows
    order: ordered
    comment: any NULL operand makes the sum NULL; coalesce gives a non-null alternative
