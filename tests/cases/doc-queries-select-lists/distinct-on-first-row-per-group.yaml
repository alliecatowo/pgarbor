# DISTINCT ON keeps the first row of each group after ORDER BY sorting.
id: doc-queries-select-lists.distinct-on-first-row-per-group
title: DISTINCT ON keeps the first row of each group as ordered by ORDER BY
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, distinct-on, order-by]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (DISTINCT ON; DISTINCT ON processing occurs after ORDER BY)"
sessions: [a]
setup: |
  CREATE TABLE emp (dept text, name text, salary int4);
  INSERT INTO emp VALUES ('eng', 'ann', 120), ('eng', 'bob', 100), ('ops', 'cy', 90), ('ops', 'dee', 95), ('hr', 'eve', 70);
steps:
  - sql: |
      SELECT DISTINCT ON (dept) dept, name, salary FROM emp ORDER BY dept, salary DESC
    expect: rows
    order: ordered
    comment: highest salary per department is the first row of each group
  - sql: |
      SELECT DISTINCT ON (dept) dept, name, salary FROM emp ORDER BY dept, salary ASC
    expect: rows
    order: ordered
    comment: reversing the sort direction selects the lowest salary per group
