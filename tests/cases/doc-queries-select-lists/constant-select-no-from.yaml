# The select list may hold constant expressions with no FROM clause at all.
id: doc-queries-select-lists.constant-select-no-from
title: Constant value expressions in a select list without any FROM clause
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, expressions, constants]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (constant arithmetic expressions in select list)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 + 2 AS three, 'a' || 'b' AS ab, NULL::int4 AS nothing, 10 / 4 AS int_div, 10.0 / 4 AS num_div
    expect: rows
    order: ordered
    comment: integer division truncates; numeric division keeps the fraction
  - sql: |
      SELECT 2 * 3 + 4 AS v, (2 + 3) * 4 AS w
    expect: rows
    order: ordered
