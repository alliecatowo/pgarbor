# NULL keys in DISTINCT ON form a single group, like other NULL comparisons in DISTINCT.
id: doc-queries-select-lists.distinct-on-null-group
title: DISTINCT ON treats all NULL keys as one group
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, distinct-on, null-semantics, order-by]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (null value in DISTINCT)"
sessions: [a]
setup: |
  CREATE TABLE k (x int4, y int4);
  INSERT INTO k VALUES (1, 10), (NULL, 20), (1, 30), (NULL, 40), (2, 50);
steps:
  - sql: |
      SELECT DISTINCT ON (x) x, y FROM k ORDER BY x, y
    expect: rows
    order: ordered
    comment: NULL x values fall into one group whose first row sorts last under ASC NULLS LAST
