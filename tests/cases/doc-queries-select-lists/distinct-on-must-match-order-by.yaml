# DISTINCT ON expressions must match the leading ORDER BY expressions.
id: doc-queries-select-lists.distinct-on-must-match-order-by
title: DISTINCT ON keys that do not lead the ORDER BY raise invalid column reference
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, distinct-on, order-by, errors]
required_capabilities: [create-table, insert, select, order-by, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (DISTINCT ON processing occurs after ORDER BY); PG18 errcodes 42P10"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4);
  INSERT INTO t VALUES (1, 2), (1, 3), (2, 1);
steps:
  - sql: |
      SELECT DISTINCT ON (a) a, b FROM t ORDER BY b, a
    expect: error
    sqlstate: "42P10"
    comment: the ORDER BY must begin with the DISTINCT ON expression
  - sql: |
      SELECT DISTINCT ON (a) a, b FROM t ORDER BY a, b DESC
    expect: rows
    order: ordered
