# The name assigned in a select list is the name passed on to an enclosing query.
id: doc-queries-select-lists.subquery-renamed-column
title: Column renamed in a subquery's select list is visible outward only under the new name
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, column-labels, subqueries, errors]
required_capabilities: [create-table, insert, select, subqueries, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (the name assigned in the select list is the one passed on)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (7), (8);
steps:
  - sql: |
      SELECT w FROM (SELECT a AS w FROM t) AS sub ORDER BY w
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM (SELECT a AS w FROM t) AS sub
    expect: error
    sqlstate: "42703"
    comment: the original name a was replaced by the select-list label w
