# Select list: bare * and table_name.* expand to all columns of the named FROM items.
id: doc-queries-select-lists.star-expansion-qualified
title: Star and table.star expansion across a join, plus qualified duplicate column names
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, star-expansion, join, column-qualification]
required_capabilities: [create-table, insert, select, join]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (Select-List Items: *, tbl1.*, tbl1.a)"
sessions: [a]
setup: |
  CREATE TABLE tbl1 (a int4, b text);
  CREATE TABLE tbl2 (a int4, x text);
  INSERT INTO tbl1 VALUES (1, 'one'), (2, 'two');
  INSERT INTO tbl2 VALUES (1, 'x1'), (3, 'x3');
steps:
  - sql: |
      SELECT * FROM tbl1 ORDER BY a
    expect: rows
    order: ordered
    comment: bare star emits every column of tbl1
  - sql: |
      SELECT tbl1.*, tbl2.a FROM tbl1 JOIN tbl2 ON tbl1.a = tbl2.a
    expect: rows
    order: multiset
    comment: table.star plus a qualified reference to the other table's duplicate column
  - sql: |
      SELECT tbl2.*, tbl1.b FROM tbl1 JOIN tbl2 ON tbl1.a = tbl2.a
    expect: rows
    order: multiset
    comment: star of the right-hand table, then a column from the left
  - sql: |
      SELECT tbl1.a, tbl2.a, tbl1.b FROM tbl1 JOIN tbl2 ON tbl1.a = tbl2.a
    expect: rows
    order: multiset
    comment: documented form with both duplicate columns qualified
