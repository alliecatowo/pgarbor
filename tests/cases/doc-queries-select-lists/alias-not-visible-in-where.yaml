# Select-list aliases are not in the WHERE namespace but are usable in ORDER BY.
id: doc-queries-select-lists.alias-not-visible-in-where
title: Select-list alias is undefined in WHERE yet usable in ORDER BY
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, column-labels, order-by, errors]
required_capabilities: [create-table, insert, select, order-by, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (name space in select list is the same as WHERE; ORDER BY uses labels)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, s text);
  INSERT INTO t VALUES (1, 'p'), (2, 'q'), (3, 'r');
steps:
  - sql: |
      SELECT a AS v FROM t WHERE v > 1
    expect: error
    sqlstate: "42703"
    comment: the WHERE namespace does not include output labels
  - sql: |
      SELECT a AS v FROM t WHERE a > 1 ORDER BY v DESC
    expect: rows
    order: ordered
    comment: ORDER BY may refer to output column labels
  - sql: |
      SELECT a AS v, v + 1 FROM t
    expect: error
    sqlstate: "42703"
    comment: a label cannot be referenced by another item in the same select list
