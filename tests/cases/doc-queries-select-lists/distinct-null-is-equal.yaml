# DISTINCT treats NULLs as equal to each other; ALL keeps every row.
id: doc-queries-select-lists.distinct-null-is-equal
title: SELECT DISTINCT collapses duplicate rows with NULLs compared as equal; ALL retains all rows
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, distinct, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (DISTINCT, null value in DISTINCT)"
sessions: [a]
setup: |
  CREATE TABLE d (x int4, y int4);
  INSERT INTO d VALUES (1, NULL), (1, NULL), (NULL, NULL), (NULL, NULL), (1, 2);
steps:
  - sql: |
      SELECT DISTINCT x, y FROM d
    expect: rows
    order: multiset
    comment: two NULLs in one column compare as the same value; (1,NULL) appears once
  - sql: |
      SELECT ALL x, y FROM d
    expect: rows
    order: multiset
    comment: ALL is the default and keeps all five rows
  - sql: |
      SELECT count(*) FROM (SELECT DISTINCT x, y FROM d) AS s
    expect: rows
    order: ordered
