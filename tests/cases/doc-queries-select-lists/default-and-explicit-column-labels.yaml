# Output column names: simple refs keep their name, functions use the function name, expressions get ?column?, AS overrides.
id: doc-queries-select-lists.default-and-explicit-column-labels
title: Default output column names for column refs, function calls and expressions, and AS labels
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, column-labels, expressions]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (Column Labels)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4, c int4, s text);
  INSERT INTO t VALUES (1, 2, 3, 'x');
steps:
  - sql: |
      SELECT a, b + c, upper(s) FROM t
    expect: rows
    order: ordered
    comment: a is named a; the expression gets ?column?; the function call is named upper
  - sql: |
      SELECT a AS value, b + c AS sum FROM t
    expect: rows
    order: ordered
    comment: explicit AS labels replace the defaults
  - sql: |
      SELECT a "from", b + c "sum" FROM t
    expect: rows
    order: ordered
    comment: double-quoted labels are an alternative to AS
