# A key word used as a column label needs AS or double quotes; a bare FROM is a syntax error.
id: doc-queries-select-lists.keyword-label-requires-as
title: Keyword used as a bare column label is a syntax error; AS or double quotes make it legal
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, column-labels, keywords, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (keyword column labels: SELECT a from, b + c AS sum)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4, c int4);
  INSERT INTO t VALUES (1, 2, 3);
steps:
  - sql: |
      SELECT a from, b + c AS sum FROM t
    expect: error
    sqlstate: "42601"
    comment: FROM cannot be a bare label; the parser reads it as the start of the FROM clause
  - sql: |
      SELECT a AS from, b + c AS sum FROM t
    expect: rows
    order: ordered
  - sql: |
      SELECT a "from", b + c AS sum FROM t
    expect: rows
    order: ordered
