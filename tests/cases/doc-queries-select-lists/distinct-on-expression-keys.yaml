# DISTINCT ON accepts arbitrary expressions; the expressions must match the leading ORDER BY expressions.
id: doc-queries-select-lists.distinct-on-expression-keys
title: DISTINCT ON with an expression key keeps the first row of each length group
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, distinct-on, expressions, order-by]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (DISTINCT ON expression)"
sessions: [a]
setup: |
  CREATE TABLE words (w text);
  INSERT INTO words VALUES ('cat'), ('dog'), ('horse'), ('ox'), ('bee'), ('lion');
steps:
  - sql: |
      SELECT DISTINCT ON (length(w)) w FROM words ORDER BY length(w), w DESC
    expect: rows
    order: ordered
    comment: within each length the reverse-alphabetical first word is kept
  - sql: |
      SELECT DISTINCT ON (length(w)) w FROM words ORDER BY length(w), w
    expect: rows
    order: ordered
