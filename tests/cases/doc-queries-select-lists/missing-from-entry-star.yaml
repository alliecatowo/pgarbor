# table.* must name a relation present in the FROM clause.
id: doc-queries-select-lists.missing-from-entry-star
title: Qualified star naming a relation not in FROM raises missing FROM-clause entry
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, star-expansion, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (table_name.* notation)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      SELECT nosuch.* FROM t
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT t.* FROM t
    expect: rows
    order: ordered
