# Star may be followed by further select-list items; an expression adds a virtual column evaluated per row.
id: doc-queries-select-lists.star-with-expression
title: Star followed by an expression adds a computed virtual column per row
family: doc-queries-select-lists
tier: core
feature_ids: [select-list, star-expansion, expressions]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-select-lists (virtual column from value expression)"
sessions: [a]
setup: |
  CREATE TABLE nums (n int4, label text);
  INSERT INTO nums VALUES (1, 'a'), (2, 'b'), (5, 'c');
steps:
  - sql: |
      SELECT *, n * 2 AS doubled, n + 100 FROM nums ORDER BY n
    expect: rows
    order: ordered
    comment: the expression is evaluated once per row; its default name is ?column?
  - sql: |
      SELECT n, label, n * n AS squared FROM nums WHERE n > 1 ORDER BY squared DESC
    expect: rows
    order: ordered
