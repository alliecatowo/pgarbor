# SET changes a run-time parameter for the session; '=' and TO are equivalent; numeric values take the parameter's unit.
id: cmd-set.session-scope
title: SET sets session-level values with = and TO, SESSION keyword, and unit normalization
family: cmd-set
tier: core
feature_ids: [set, guc, session-scope]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Description, Parameters)"
sessions: [a]
steps:
  - sql: |
      SELECT current_setting('work_mem') AS before
    expect: rows
    comment: session default; recorded as the baseline for the DEFAULT step below
  - sql: |
      SET work_mem = '3MB'
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_equals
    expect: rows
    comment: equals form takes effect
  - sql: |
      SET SESSION work_mem TO '5MB'
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_session_to
    expect: rows
  - sql: |
      SET work_mem TO 1024
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_number
    expect: rows
    comment: a bare number is interpreted in the parameter's base unit (kB); 1024kB displays as 1MB
  - sql: |
      SET work_mem TO DEFAULT
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_default
    expect: rows
    comment: must equal the value recorded as 'before' in the first step
