# set_config() is documented as equivalent to SET; its is_local argument matches SET LOCAL.
id: cmd-set.set-config-equivalence
title: set_config(name, value, is_local) behaves like SET and SET LOCAL
family: cmd-set
tier: extended
feature_ids: [set, set-config, set-local, transactions]
required_capabilities: [select, guc, transactions]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Notes: set_config provides equivalent functionality)"
sessions: [a]
steps:
  - sql: |
      SET work_mem = '4MB'
    expect: ok
  - sql: |
      SELECT set_config('work_mem', '7MB', false) AS returned
    expect: rows
    comment: returns the new value
  - sql: |
      SELECT current_setting('work_mem') AS session_value
    expect: rows
  - sql: |
      BEGIN; SELECT set_config('work_mem', '2MB', true) AS returned_local; SELECT current_setting('work_mem') AS inside; COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_commit
    expect: rows
    comment: 7MB, the session value set earlier; the local change is gone
