# SET TIME ZONE accepts names, numeric hour offsets (positive east), and INTERVAL offsets; numeric forms are stored in POSIX syntax.
id: cmd-set.time-zone-variants
title: SET TIME ZONE with named zones, numeric offsets, and interval offsets
family: cmd-set
tier: core
feature_ids: [set, time-zone, timestamptz]
required_capabilities: [select, guc, timestamptz]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Parameters: SET TIME ZONE examples)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'America/Los_Angeles'
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') AS named_zone
    expect: rows
  - sql: |
      SELECT '2024-01-15 12:00:00+00'::timestamptz::text AS rendered
    expect: rows
    comment: 04:00 PST after conversion in America/Los_Angeles (January, standard time)
  - sql: |
      SET TIME ZONE -7
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') AS numeric_offset
    expect: rows
    comment: documented as <-07>+07
  - sql: |
      SELECT '2024-01-15 12:00:00+00'::timestamptz::text AS rendered
    expect: rows
    comment: 05:00 at UTC-7
  - sql: |
      SET TIME ZONE INTERVAL '-08:00' HOUR TO MINUTE
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') AS interval_offset
    expect: rows
    comment: 8 hours west of UTC
  - sql: |
      SET TIME ZONE 'Europe/Rome'
    expect: ok
  - sql: |
      SELECT '2024-07-01 12:00:00+00'::timestamptz::text AS rendered
    expect: rows
    comment: summer time, UTC+2
