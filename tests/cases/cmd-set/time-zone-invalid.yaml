# Unknown time zone names and time zone abbreviations are rejected by SET TIME ZONE and leave the setting unchanged.
id: cmd-set.time-zone-invalid
title: SET TIME ZONE rejects unknown zone names and abbreviations and keeps the previous zone
family: cmd-set
tier: core
feature_ids: [set, time-zone, errors]
required_capabilities: [select, guc, errors]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (SET TIME ZONE: abbreviations are not supported)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'Europe/Rome'
    expect: ok
  - sql: |
      SET TIME ZONE 'Mars/Olympus'
    expect: error
    sqlstate: "22023"
    comment: invalid value for parameter "TimeZone"
  - sql: |
      SET TIME ZONE 'PST'
    expect: error
    sqlstate: "22023"
    comment: abbreviations are not accepted by SET
  - sql: |
      SELECT current_setting('TimeZone') AS still_rome
    expect: rows
    comment: unchanged after both failures
