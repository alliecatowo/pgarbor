# A SET inside a transaction that is rolled back disappears; a committed SET persists until the end of the session.
id: cmd-set.rollback-discards
title: SET inside a rolled-back transaction is undone; committed SET persists until reconnect
family: cmd-set
tier: core
feature_ids: [set, transactions, rollback]
required_capabilities: [select, guc, transactions]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Description: SET inside aborted transaction)"
sessions: [a]
steps:
  - sql: |
      SET work_mem = '4MB'
    expect: ok
  - sql: |
      BEGIN; SET work_mem = '9MB'; ROLLBACK
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_rollback
    expect: rows
    comment: 4MB
  - sql: |
      BEGIN; SET work_mem = '9MB'; COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_commit
    expect: rows
    comment: 9MB, persists beyond the transaction
  - reconnect: true
  - sql: |
      SELECT current_setting('work_mem') AS after_reconnect
    expect: rows
    comment: a new session starts from the server default, not 9MB
