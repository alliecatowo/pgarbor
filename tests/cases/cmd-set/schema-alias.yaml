# SET SCHEMA is an alias for SET search_path TO one schema; a list of schemas is accepted by search_path.
id: cmd-set.schema-alias
title: SET SCHEMA aliases a single-schema search_path and search_path accepts a list
family: cmd-set
tier: core
feature_ids: [set, search-path, schema]
required_capabilities: [select, guc, create-schema]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Parameters: SCHEMA; Examples: search_path)"
sessions: [a]
setup: |
  CREATE SCHEMA cmd_set_s
steps:
  - sql: |
      SET SCHEMA 'cmd_set_s'
    expect: ok
  - sql: |
      SELECT current_schema() AS schema, current_setting('search_path') AS search_path
    expect: rows
  - sql: |
      SET search_path TO cmd_set_s, public
    expect: ok
  - sql: |
      SELECT current_schema() AS schema, current_setting('search_path') AS search_path
    expect: rows
    comment: current_schema is the first existing schema in search_path
  - sql: |
      CREATE TABLE cmd_set_s.t (id int4)
    expect: ok
  - sql: |
      SET search_path TO public
    expect: ok
  - sql: |
      SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 't'
    expect: rows
    comment: a table created in cmd_set_s is not visible through public
