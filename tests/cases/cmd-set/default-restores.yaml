# SET ... TO DEFAULT and SET ... TO LOCAL/DEFAULT for time zone restore the session default.
id: cmd-set.default-restores
title: SET TO DEFAULT restores the session default for a parameter and for TIME ZONE
family: cmd-set
tier: core
feature_ids: [set, guc, default-value, time-zone]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Parameters: value DEFAULT; TIME ZONE LOCAL/DEFAULT)"
sessions: [a]
steps:
  - sql: |
      SELECT current_setting('TimeZone') = (SELECT reset_val FROM pg_settings WHERE name = 'TimeZone') AS is_default
    expect: rows
    comment: true at session start
  - sql: |
      SET TIME ZONE 'Europe/Rome'
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') AS tz
    expect: rows
    order: ordered
  - sql: |
      SET TIME ZONE DEFAULT
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') = (SELECT reset_val FROM pg_settings WHERE name = 'TimeZone') AS is_default
    expect: rows
    comment: DEFAULT restores the server default; expected true
  - sql: |
      SET work_mem = '2MB'
    expect: ok
  - sql: |
      SET work_mem TO DEFAULT
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS work_mem_after_default
    expect: rows
    comment: the server default (reset_val); SET ... TO DEFAULT resets to it
