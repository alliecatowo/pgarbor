# Documented failures for SET: unknown parameter, invalid value, parameter that cannot change at run time, and missing value.
id: cmd-set.errors-invalid-settings
title: SET fails for unknown parameters, invalid values, restart-only parameters, and syntax errors without changing state
family: cmd-set
tier: core
feature_ids: [set, guc, errors]
required_capabilities: [select, guc, errors]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Description; Parameters)"
sessions: [a]
steps:
  - sql: |
      SET work_mem = '4MB'
    expect: ok
  - sql: |
      SET no_such_parameter = 'x'
    expect: error
    sqlstate: "42704"
    comment: unrecognized configuration parameter
  - sql: |
      SET work_mem = 'abc'
    expect: error
    sqlstate: "22023"
    comment: invalid value for parameter "work_mem"
  - sql: |
      SET data_directory = '/nonexistent'
    expect: error
    sqlstate: "55P02"
    comment: postmaster-level parameter cannot be changed in a session
  - sql: |
      SET work_mem
    expect: error
    sqlstate: "42601"
    comment: a value is required
  - sql: |
      SELECT current_setting('work_mem') AS still_4mb
    expect: rows
    comment: failed statements leave the value unchanged
