# A comma-separated list value for DateStyle changes input interpretation (DMY) and display of date/time types.
id: cmd-set.datestyle-list
title: SET DATESTYLE with a comma-separated list changes date input order and output style
family: cmd-set
tier: core
feature_ids: [set, datestyle, date-type]
required_capabilities: [select, guc, date-type]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Examples: datestyle postgres, dmy)"
sessions: [a]
steps:
  - sql: |
      SET datestyle TO postgres, dmy
    expect: ok
  - sql: |
      SELECT current_setting('DateStyle') AS style
    expect: rows
  - sql: |
      SELECT to_char('04/03/2024'::date, 'YYYY-MM-DD') AS day_first_input
    expect: rows
    comment: day-before-month input convention gives 4 March 2024
  - sql: |
      SELECT '2024-03-04'::date AS output_style
    expect: rows
    comment: Postgres output style, not ISO
