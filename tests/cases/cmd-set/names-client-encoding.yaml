# SET NAMES is an alias for SET client_encoding; SESSION is the default scope.
id: cmd-set.names-client-encoding
title: SET NAMES sets client_encoding for the session
family: cmd-set
tier: extended
feature_ids: [set, client-encoding, names]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Parameters: NAMES)"
sessions: [a]
steps:
  - sql: |
      SET NAMES 'UTF8'
    expect: ok
  - sql: |
      SELECT current_setting('client_encoding') AS enc
    expect: rows
  - sql: |
      SET SESSION NAMES 'LATIN1'
    expect: ok
  - sql: |
      SELECT current_setting('client_encoding') AS enc
    expect: rows
  - sql: |
      SET NAMES 'NO_SUCH_ENCODING'
    expect: error
    sqlstate: "22023"
    comment: invalid value for parameter "client_encoding"
  - sql: |
      SELECT current_setting('client_encoding') AS enc
    expect: rows
    comment: still LATIN1
