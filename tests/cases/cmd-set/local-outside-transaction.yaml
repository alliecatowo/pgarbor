# SET LOCAL outside a transaction block emits a warning and has no effect.
id: cmd-set.local-outside-transaction
title: SET LOCAL outside a transaction block warns and changes nothing
family: cmd-set
tier: core
feature_ids: [set, set-local, notices]
required_capabilities: [select, guc, notices]
provenance:
  source: pg-docs
  ref: "ref/set.sgml#sql-set (Parameters: LOCAL)"
sessions: [a]
steps:
  - sql: |
      SET work_mem = '4MB'
    expect: ok
  - sql: |
      SET LOCAL work_mem = '6MB'
    expect: notice
    comment: WARNING "SET LOCAL can only be used in transaction blocks"
  - sql: |
      SELECT current_setting('work_mem') AS value
    expect: rows
    comment: still 4MB
