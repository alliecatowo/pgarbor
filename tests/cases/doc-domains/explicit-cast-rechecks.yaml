# Casting a literal to a domain runs the domain constraints; valid values pass through the cast.
id: doc-domains.explicit-cast-rechecks
title: Explicit cast to posint accepts 7 and rejects 0 with check_violation
family: doc-domains
tier: core
feature_ids: [domains, create-domain, explicit-cast, check-constraint]
required_capabilities: [create-domain, select, constraints]
provenance:
  source: pg-docs
  ref: "datatype.sgml#domains"
sessions: [a]
setup: |
  CREATE DOMAIN posint AS integer CHECK (VALUE > 0)
steps:
  - sql: |
      SELECT '7'::posint AS v, pg_typeof('7'::posint)::text AS t
    expect: rows
    order: ordered
  - sql: |
      SELECT 0::posint
    expect: error
    sqlstate: "23514"
    comment: the cast result is checked against the domain
  - sql: |
      SELECT (-3)::posint
    expect: error
    sqlstate: "23514"
