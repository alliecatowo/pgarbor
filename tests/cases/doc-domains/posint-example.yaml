# The datatype.sgml#domains example verbatim: a positive-integer domain used as a column type.
id: doc-domains.posint-example
title: Documented posint domain accepts 1 and rejects -1 with check_violation
family: doc-domains
tier: core
feature_ids: [domains, create-domain, check-constraint]
required_capabilities: [create-domain, create-table, insert, select, constraints]
provenance:
  source: pg-docs
  ref: "datatype.sgml#domains"
sessions: [a]
setup: |
  CREATE DOMAIN posint AS integer CHECK (VALUE > 0);
  CREATE TABLE mytable (id posint)
steps:
  - sql: |
      INSERT INTO mytable VALUES(1)
    expect: ok
    comment: works
  - sql: |
      INSERT INTO mytable VALUES(-1)
    expect: error
    sqlstate: "23514"
    comment: fails the domain CHECK
  - sql: |
      SELECT id FROM mytable ORDER BY id
    expect: rows
    order: ordered
