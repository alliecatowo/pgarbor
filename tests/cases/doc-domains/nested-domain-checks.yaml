# A domain over a domain inherits the base domain's CHECK and adds its own.
id: doc-domains.nested-domain-checks
title: Domain over posint enforces both the inherited and its own CHECK constraint
family: doc-domains
tier: core
feature_ids: [domains, create-domain, check-constraint, nested-domain]
required_capabilities: [create-domain, select, constraints]
provenance:
  source: pg-docs
  ref: "datatype.sgml#domains"
sessions: [a]
setup: |
  CREATE DOMAIN posint AS integer CHECK (VALUE > 0);
  CREATE DOMAIN posint2 AS posint CHECK (VALUE < 100)
steps:
  - sql: |
      SELECT 42::posint2 AS v
    expect: rows
    order: ordered
  - sql: |
      SELECT 150::posint2
    expect: error
    sqlstate: "23514"
    comment: violates posint2_check
  - sql: |
      SELECT 0::posint2
    expect: error
    sqlstate: "23514"
    comment: violates the inherited posint_check
