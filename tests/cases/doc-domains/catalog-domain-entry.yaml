# pg_type describes a domain as typtype 'd' with its underlying base type in typbasetype.
id: doc-domains.catalog-domain-entry
title: pg_type shows a domain as typtype d over its base type, and the base type is not a domain
family: doc-domains
tier: extended
feature_ids: [domains, create-domain, catalog-pg-type]
required_capabilities: [create-domain, select, catalog]
provenance:
  source: pg-docs
  ref: "datatype.sgml#domains"
sessions: [a]
setup: |
  CREATE DOMAIN posint AS integer CHECK (VALUE > 0)
steps:
  - sql: |
      SELECT typname, typtype::text AS typtype, typbasetype::regtype::text AS base, typnotnull FROM pg_type WHERE typname IN ('posint', 'int4') ORDER BY typname
    expect: rows
    order: ordered
  - sql: |
      SELECT conname, contype::text AS contype, convalidated FROM pg_constraint WHERE contypid = 'posint'::regtype ORDER BY conname
    expect: rows
    order: ordered
    comment: the CHECK is stored as a domain constraint named posint_check
