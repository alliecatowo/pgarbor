# CREATE DOMAIN ... NOT NULL DEFAULT: the default fills DEFAULT VALUES, explicit NULL is rejected.
id: doc-domains.not-null-default
title: Domain NOT NULL rejects explicit NULL, and DEFAULT fills the column
family: doc-domains
tier: core
feature_ids: [domains, create-domain, not-null, default]
required_capabilities: [create-domain, create-table, insert, select, constraints]
provenance:
  source: pg-docs
  ref: "datatype.sgml#domains; sql-createdomain"
sessions: [a]
setup: |
  CREATE DOMAIN dnn AS int NOT NULL DEFAULT 5;
  CREATE TABLE tdnn (v dnn)
steps:
  - sql: |
      INSERT INTO tdnn DEFAULT VALUES
    expect: ok
    comment: the domain default is used
  - sql: |
      INSERT INTO tdnn VALUES (NULL)
    expect: error
    sqlstate: "23502"
    comment: the domain NOT NULL applies to every column of this type
  - sql: |
      INSERT INTO tdnn VALUES (NULL::dnn)
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT v FROM tdnn ORDER BY v
    expect: rows
    order: ordered
