# A NULL value passes a domain CHECK (the check is not false), but a NOT NULL domain rejects it.
id: doc-domains.null-passes-check
title: NULL passes a domain CHECK constraint, and a 0 value fails it
family: doc-domains
tier: core
feature_ids: [domains, create-domain, check-constraint, null-semantics]
required_capabilities: [create-domain, create-table, insert, select, constraints]
provenance:
  source: pg-docs
  ref: "datatype.sgml#domains"
sessions: [a]
setup: |
  CREATE DOMAIN posint AS integer CHECK (VALUE > 0);
  CREATE TABLE tnull (v posint)
steps:
  - sql: |
      INSERT INTO tnull VALUES (NULL), (3)
    expect: ok
    comment: a CHECK that evaluates to NULL is not a violation
  - sql: |
      INSERT INTO tnull VALUES (0)
    expect: error
    sqlstate: "23514"
  - sql: |
      SELECT v, v IS NULL AS is_null FROM tnull ORDER BY v NULLS LAST
    expect: rows
    order: ordered
