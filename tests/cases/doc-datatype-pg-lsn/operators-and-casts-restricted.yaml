# The pg_lsn operator set is limited: no pg_lsn + pg_lsn, no sum(), and no numeric/integer casts. Text casts work.
id: doc-datatype-pg-lsn.operators-and-casts-restricted
title: pg_lsn rejects addition of two LSNs, sum(), and numeric or integer casts, but casts to text and varchar work
family: doc-datatype-pg-lsn
tier: core
feature_ids: [pg-lsn, operators, casts, aggregates, errors]
required_capabilities: [select, aggregates, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-pg-lsn (operators listed: =, >, -, +, -(pg_lsn,numeric))"
sessions: [a]
steps:
  - sql: |
      SELECT '0/10'::pg_lsn + '0/10'::pg_lsn
    expect: error
    sqlstate: "42883"
    comment: only LSN +/- numeric is defined; LSN + LSN is not an operator
  - sql: |
      SELECT sum(x) FROM (VALUES ('0/1'::pg_lsn)) v(x)
    expect: error
    sqlstate: "42883"
    comment: no sum aggregate for pg_lsn
  - sql: |
      SELECT '0/10'::pg_lsn::numeric
    expect: error
    sqlstate: "42846"
  - sql: |
      SELECT '0/10'::pg_lsn::bigint
    expect: error
    sqlstate: "42846"
  - sql: |
      SELECT 1::int4::pg_lsn
    expect: error
    sqlstate: "42846"
  - sql: |
      SELECT '0/10'::pg_lsn::text AS as_text, '0/10'::pg_lsn::varchar AS as_varchar, pg_typeof('0/10'::pg_lsn)::text AS typ
    expect: rows
  - sql: |
      SELECT '0/10'::pg_lsn::pg_lsn AS same_type
    expect: rows
