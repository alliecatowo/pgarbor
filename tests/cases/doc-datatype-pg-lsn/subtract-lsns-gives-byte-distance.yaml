# Documented: subtracting two LSNs yields the number of bytes between them.
id: doc-datatype-pg-lsn.subtract-lsns-gives-byte-distance
title: Subtracting two pg_lsn values returns the byte distance as a signed numeric
family: doc-datatype-pg-lsn
tier: core
feature_ids: [pg-lsn, operators, subtraction, numeric-result]
required_capabilities: [select, numeric]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-pg-lsn"
sessions: [a]
steps:
  - sql: |
      SELECT '16/B374D848'::pg_lsn - '16/B374D000'::pg_lsn AS distance
    expect: rows
    comment: 0xD848 - 0xD000 = 2120 bytes
  - sql: |
      SELECT '0/10'::pg_lsn - '0/20'::pg_lsn AS negative_distance, '0/20'::pg_lsn - '0/10'::pg_lsn AS positive_distance
    expect: rows
    comment: the result is signed, so the reverse order is negative
  - sql: |
      SELECT '1/0'::pg_lsn - '0/1'::pg_lsn AS across_segments
    expect: rows
    comment: crossing the 4-billion-byte boundary of the low half
  - sql: |
      SELECT '0/FFFFFFFF'::pg_lsn - '0/FFFFFFFF'::pg_lsn AS same_point, '0/10'::pg_lsn - '0/10'::pg_lsn AS zero_distance
    expect: rows
  - sql: |
      SELECT pg_typeof('0/20'::pg_lsn - '0/10'::pg_lsn)::text AS result_type
    expect: rows
    comment: subtraction of two LSNs produces numeric, not pg_lsn
