# Malformed LSN text is rejected with invalid_text_representation (22P02).
id: doc-datatype-pg-lsn.malformed-input-rejected
title: pg_lsn input rejects missing parts, extra slashes, signs, spaces, and over-long digit groups
family: doc-datatype-pg-lsn
tier: core
feature_ids: [pg-lsn, text-io, input-validation, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-pg-lsn"
sessions: [a]
steps:
  - sql: |
      SELECT ''::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: empty string is not an LSN
  - sql: |
      SELECT '/'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: both halves missing
  - sql: |
      SELECT '0/'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: missing low half
  - sql: |
      SELECT 'G/0'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: non-hex digit
  - sql: |
      SELECT '0/100000000'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: nine hex digits in the low half exceed the documented 8-digit form
  - sql: |
      SELECT '0/1234567890'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: ten hex digits
  - sql: |
      SELECT '1/2/3'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: two slashes
  - sql: |
      SELECT '1/-2'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: signed low half
  - sql: |
      SELECT '+1/2'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: signed high half
  - sql: |
      SELECT '1/ 2'::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: embedded space is not allowed
  - sql: |
      SELECT '  16/b374d848  '::pg_lsn
    expect: error
    sqlstate: "22P02"
    comment: surrounding whitespace is not trimmed
  - sql: |
      SELECT 'x'::pg_lsn
    expect: error
    sqlstate: "22P02"
