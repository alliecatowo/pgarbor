# A WHEN clause after an unconditional WHEN MATCHED clause is rejected at parse time.
id: merge.unreachable-when-clause
title: WHEN clause after an unconditional WHEN MATCHED is a syntax error
family: merge
tier: extended
feature_ids: [merge, errors, parser]
required_capabilities: [create-table, merge]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/merge.sql (unreachable WHEN clause should ERROR)"
setup: |
  CREATE TABLE target (tid integer, balance integer);
  CREATE TABLE source (sid integer, delta integer);
steps:
  - sql: |
      MERGE INTO target t
      USING source s
      ON t.tid = s.sid
      WHEN MATCHED THEN
        DELETE
      WHEN MATCHED THEN
        UPDATE SET balance = t.balance - s.delta
    expect: error
    sqlstate: "42601"
