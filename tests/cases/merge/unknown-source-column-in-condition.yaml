# A NOT MATCHED BY SOURCE condition can only refer to target columns; the source relation is not in scope there.
id: merge.unknown-source-column-in-condition
title: NOT MATCHED BY SOURCE condition referring to the source relation raises undefined_table
family: merge
tier: extended
feature_ids: [merge, errors, column-resolution]
required_capabilities: [create-table, delete, merge]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/merge.sql (conditions in NOT MATCHED BY SOURCE clause can only refer to target columns)"
setup: |
  CREATE TABLE target (tid integer, balance integer);
  CREATE TABLE source (sid integer, delta integer);
steps:
  - sql: |
      MERGE INTO target t
      USING source s
      ON t.tid = s.sid
      WHEN NOT MATCHED BY SOURCE AND s.balance = 100 THEN
        DELETE
    expect: error
    sqlstate: "42P01"
