# INSERT is not a valid action for WHEN MATCHED; the grammar rejects it.
id: merge.insert-in-matched-clause
title: INSERT action inside WHEN MATCHED is a syntax error
family: merge
tier: extended
feature_ids: [merge, errors, parser]
required_capabilities: [create-table, merge]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/merge.sql (MATCHED/INSERT error)"
setup: |
  CREATE TABLE target (tid integer, balance integer);
  CREATE TABLE source (sid integer, delta integer);
steps:
  - sql: |
      MERGE INTO target t
      USING source s
      ON t.tid = s.sid
      WHEN MATCHED THEN
        INSERT DEFAULT VALUES
    expect: error
    sqlstate: "42601"
