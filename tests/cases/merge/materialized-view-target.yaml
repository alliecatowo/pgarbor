# MERGE cannot target a materialized view.
id: merge.materialized-view-target
title: MERGE into a materialized view raises feature_not_supported
family: merge
tier: extended
feature_ids: [merge, errors, materialized-view]
required_capabilities: [create-table, create-materialized-view, merge]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/merge.sql (unsupported relation types: materialized view)"
setup: |
  CREATE TABLE target (tid integer, balance integer);
  CREATE TABLE source (sid integer, delta integer);
  CREATE MATERIALIZED VIEW mv AS SELECT * FROM target;
steps:
  - sql: |
      MERGE INTO mv t
      USING source s
      ON t.tid = s.sid
      WHEN NOT MATCHED THEN
        INSERT DEFAULT VALUES
    expect: error
    sqlstate: "0A000"
