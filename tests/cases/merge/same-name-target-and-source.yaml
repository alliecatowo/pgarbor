# Using the same relation as target and source without distinct aliases is a duplicate alias error.
id: merge.same-name-target-and-source
title: Target and source naming the same table without aliases raises duplicate_alias
family: merge
tier: extended
feature_ids: [merge, errors, aliases]
required_capabilities: [create-table, merge]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/merge.sql (source and target names the same)"
setup: |
  CREATE TABLE target (tid integer, balance integer);
steps:
  - sql: |
      MERGE INTO target
      USING target
      ON tid = tid
      WHEN MATCHED THEN DO NOTHING
    expect: error
    sqlstate: "42712"
