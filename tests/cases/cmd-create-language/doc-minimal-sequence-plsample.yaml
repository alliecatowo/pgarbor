# The documented minimal sequence (Examples): a C call handler in $libdir/plsample, then CREATE LANGUAGE plsample HANDLER ...
id: cmd-create-language.doc-minimal-sequence-plsample
title: Documented minimal sequence with a C call handler from the plsample shared library
family: cmd-create-language
tier: extended
feature_ids: [create-language, handler, c-function, example]
required_capabilities: [create-language, create-function-sql, c-language-functions, shared-library-load]
provenance:
  source: pg-docs
  ref: "ref/create_language.sgml#sql-createlanguage (Examples: minimal sequence)"
sessions: [a]
quarantine:
  reason: "needs the $libdir/plsample shared object (not installed in the oracle image) and superuser-only server file access; covered by handler-reuse-plpgsql and handler-missing-42883"
  since: "2026-10-15"
steps:
  - sql: |
      CREATE FUNCTION plsample_call_handler() RETURNS language_handler AS '$libdir/plsample' LANGUAGE C
    expect: ok
  - sql: |
      CREATE LANGUAGE plsample HANDLER plsample_call_handler
    expect: ok
