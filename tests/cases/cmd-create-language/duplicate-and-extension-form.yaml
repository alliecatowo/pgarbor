# Names of built-in languages are taken (42710); the handler-less form is read as CREATE EXTENSION.
id: cmd-create-language.duplicate-and-extension-form
title: Built-in or existing language names fail with 42710 and the handler-less form falls back to CREATE EXTENSION
family: cmd-create-language
tier: core
feature_ids: [create-language, duplicate-object, extension-fallback, error-handling]
required_capabilities: [create-language, plpgsql, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_language.sgml#sql-createlanguage (Description: obsolete form interpreted as CREATE EXTENSION; Parameters: name)"
sessions: [a]
steps:
  - sql: |
      CREATE LANGUAGE plpgsql HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE LANGUAGE sql HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE LANGUAGE internal HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE LANGUAGE plpgsql
    expect: error
    sqlstate: "42710"
    comment: no HANDLER, so this is CREATE EXTENSION plpgsql, which is already installed
  - sql: |
      CREATE LANGUAGE cl_no_such_extension_zz
    expect: error
    sqlstate: "0A000"
    comment: no HANDLER, so this is CREATE EXTENSION, and no such extension is available
  - sql: |
      SELECT lanname, lanispl FROM pg_language WHERE lanname IN ('plpgsql', 'sql', 'internal') ORDER BY lanname
    expect: rows
    order: ordered
