# CREATE [PROCEDURAL] LANGUAGE with a HANDLER that is an already-registered function (plpgsql_call_handler).
id: cmd-create-language.handler-reuse-plpgsql
title: CREATE LANGUAGE HANDLER reuses the registered plpgsql call handler and the new language runs functions
family: cmd-create-language
tier: core
feature_ids: [create-language, handler, procedural-language]
required_capabilities: [create-language, create-function-sql, plpgsql, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_language.sgml#sql-createlanguage (Synopsis, Parameters: HANDLER, Examples)"
sessions: [a]
steps:
  - sql: |
      CREATE LANGUAGE cl_pl HANDLER plpgsql_call_handler
    expect: ok
  - sql: |
      CREATE PROCEDURAL LANGUAGE cl_pl2 HANDLER plpgsql_call_handler
    expect: ok
    comment: PROCEDURAL is a noise word
  - sql: |
      CREATE FUNCTION cl_pl_answer() RETURNS int LANGUAGE cl_pl AS $$ BEGIN RETURN 42; END $$
    expect: ok
  - sql: |
      SELECT cl_pl_answer() AS answer
    expect: rows
  - sql: |
      SELECT lanname, lanispl, lanpltrusted, lanplcallfoid::regproc AS call_handler, laninline = 0 AS no_inline, lanvalidator = 0 AS no_validator FROM pg_language WHERE lanname = 'cl_pl'
    expect: rows
    order: ordered
    comment: no INLINE or VALIDATOR given, so both are 0 in the catalog
  - sql: |
      SELECT lanname, lanispl FROM pg_language WHERE lanname IN ('cl_pl', 'cl_pl2') ORDER BY lanname
    expect: rows
    order: ordered
