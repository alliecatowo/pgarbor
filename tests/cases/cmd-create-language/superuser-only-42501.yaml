# Only superusers may create or replace a language; a non-superuser gets insufficient_privilege even with TRUSTED.
id: cmd-create-language.superuser-only-42501
title: Non-superusers get 42501 from CREATE LANGUAGE, TRUSTED CREATE LANGUAGE and CREATE OR REPLACE LANGUAGE
family: cmd-create-language
tier: core
feature_ids: [create-language, privileges, superuser, roles, set-role]
required_capabilities: [create-language, roles, set-role, plpgsql, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_language.sgml#sql-createlanguage (Description: superuser privilege to register a new language or change an existing language's parameters)"
sessions: [a]
setup: |
  DROP ROLE IF EXISTS cl_nonsuper;
  CREATE ROLE cl_nonsuper NOLOGIN;
  GRANT CREATE ON SCHEMA public TO cl_nonsuper;
  CREATE TRUSTED LANGUAGE cl_existing HANDLER plpgsql_call_handler;
steps:
  - sql: |
      SET ROLE cl_nonsuper
    expect: ok
  - sql: |
      CREATE LANGUAGE cl_by_user HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42501"
  - sql: |
      CREATE TRUSTED LANGUAGE cl_by_user_trusted HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42501"
    comment: TRUSTED does not lift the superuser requirement for CREATE LANGUAGE
  - sql: |
      CREATE OR REPLACE LANGUAGE cl_existing HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42501"
    comment: replacing parameters is also superuser-only
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT count(*) AS created FROM pg_language WHERE lanname LIKE 'cl_by_user%'
    expect: rows
    order: ordered
  - sql: |
      SELECT lanpltrusted FROM pg_language WHERE lanname = 'cl_existing'
    expect: rows
    order: ordered
