# Unquoted language names fold to lower case; quoted names keep their case and are distinct.
id: cmd-create-language.name-folding
title: Unquoted language names fold to lower case, quoted names keep case, and folded duplicates collide
family: cmd-create-language
tier: core
feature_ids: [create-language, identifiers, case-folding]
required_capabilities: [create-language, plpgsql, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_language.sgml#sql-createlanguage (Parameters: name, 'must be unique among the languages in the database')"
sessions: [a]
steps:
  - sql: |
      CREATE LANGUAGE Cl_Fold HANDLER plpgsql_call_handler
    expect: ok
  - sql: |
      CREATE LANGUAGE "Cl_Quoted" HANDLER plpgsql_call_handler
    expect: ok
  - sql: |
      SELECT (SELECT count(*) FROM pg_language WHERE lanname = 'cl_fold') AS folded, (SELECT count(*) FROM pg_language WHERE lanname = 'Cl_Quoted') AS quoted_kept, (SELECT count(*) FROM pg_language WHERE lanname = 'CL_FOLD') AS upper_absent
    expect: rows
    order: ordered
  - sql: |
      CREATE LANGUAGE CL_FOLD HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42710"
    comment: CL_FOLD folds to cl_fold, which already exists
  - sql: |
      CREATE LANGUAGE "cl_fold" HANDLER plpgsql_call_handler
    expect: error
    sqlstate: "42710"
    comment: quoted lower case is the same name as the folded one
  - sql: |
      CREATE LANGUAGE "CL_FOLD" HANDLER plpgsql_call_handler
    expect: ok
    comment: quoted upper case is a new name distinct from cl_fold
