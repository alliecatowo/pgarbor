# money.sql: documented minimum and maximum money values are accepted; one cent past them is rejected.
id: money.input-max-boundary
title: Money minimum and maximum boundaries and one-cent overflow
family: money
tier: extended
feature_ids: [money, input, boundaries, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '-92233720368547758.08'::money AS min_value, '92233720368547758.07'::money AS max_value
    expect: rows
    order: multiset
  - sql: |
      SELECT '92233720368547758.08'::money
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-92233720368547758.09'::money
    expect: error
    sqlstate: "22003"
