# money.sql: accepted money input forms: bare digits, leading minus, parentheses for negatives, currency symbol.
id: money.input-syntax-parens
title: Money input accepts parenthesised negatives and bare numbers
family: money
tier: core
feature_ids: [money, input]
required_capabilities: [select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '(1)'::money AS a, '($123,456.78)'::money AS b, '-12345'::money AS c,
             '1234567890'::money AS d, '$123.00'::money AS e
    expect: rows
    order: multiset
