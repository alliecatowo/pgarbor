# money.sql: fractional input digits beyond cents are rounded on input (half-up at the third digit boundary).
id: money.input-fractional-rounding
title: Money input rounds sub-cent fractional digits
family: money
tier: core
feature_ids: [money, input, rounding]
required_capabilities: [create-table, insert, select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE money_data (id int4 PRIMARY KEY, m money);
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      INSERT INTO money_data VALUES (1, '$123.45'), (2, '$123.451'), (3, '$123.454'),
                                    (4, '$123.455'), (5, '$123.456'), (6, '$123.459')
    expect: ok
  - sql: |
      SELECT id, m FROM money_data ORDER BY id
    expect: rows
    order: ordered
