# money.sql: casts from money to numeric, including the documented extreme values.
id: money.cast-to-numeric
title: Money cast to numeric keeps full precision at the extremes
family: money
tier: extended
feature_ids: [money, casts, numeric]
required_capabilities: [select, money, numeric, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '12345678901234567'::money::numeric AS a, '-12345678901234567'::money::numeric AS b,
             '92233720368547758.07'::money::numeric AS c, '-92233720368547758.08'::money::numeric AS d
    expect: rows
    order: multiset
