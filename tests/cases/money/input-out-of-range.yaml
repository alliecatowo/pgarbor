# money.sql: money input larger than the int64 cent range raises numeric_value_out_of_range.
id: money.input-out-of-range
title: Money literals beyond the int64 cent range raise 22003
family: money
tier: core
feature_ids: [money, input, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '123456789012345678'::money
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-123456789012345678'::money
    expect: error
    sqlstate: "22003"
