# money.sql: non-throwing input validation API (pg_input_is_valid, pg_input_error_info) for money.
id: money.input-validity-api
title: pg_input_is_valid and pg_input_error_info report money input problems without raising
family: money
tier: extended
feature_ids: [money, input-validation, errors]
required_capabilities: [select, money, input-validation, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT pg_input_is_valid('\x0001', 'money') AS bad_syntax,
             pg_input_is_valid('192233720368547758.07', 'money') AS out_of_range
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM pg_input_error_info('\x0001', 'money')
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM pg_input_error_info('192233720368547758.07', 'money')
    expect: rows
    order: multiset
