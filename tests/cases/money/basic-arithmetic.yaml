# money.sql: money +/- integer and decimal literals on a stored value.
id: money.basic-arithmetic
title: Money plus and minus integer and decimal literals
family: money
tier: core
feature_ids: [money, arithmetic]
required_capabilities: [create-table, insert, select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE money_data (id int4 PRIMARY KEY, m money);
  INSERT INTO money_data VALUES (1, '123');
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
    comment: the regress file assumes lc_monetary is C
  - sql: |
      SELECT m + '123' AS a, m + '123.45' AS b, m - '123.45' AS c FROM money_data
    expect: rows
    order: multiset
