# money.sql: money input that is not a number raises invalid_text_representation.
id: money.input-invalid-syntax
title: Invalid money literals raise 22P02
family: money
tier: core
feature_ids: [money, input, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT 'abc'::money
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '\x0001'::money
    expect: error
    sqlstate: "22P02"
