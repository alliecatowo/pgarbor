# money.sql: cash_words spells out a money amount; cashlarger and cashsmaller pick the larger or smaller operand.
id: money.cash-words-larger-smaller
title: cash_words spells out money and cashlarger/cashsmaller choose by value
family: money
tier: extended
feature_ids: [money, functions]
required_capabilities: [create-table, insert, select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE money_data (id int4 PRIMARY KEY, m money);
  INSERT INTO money_data VALUES (1, '123');
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT cash_words(m) AS w1, cash_words(m + '1.23') AS w2 FROM money_data
    expect: rows
    order: multiset
  - sql: |
      SELECT cashlarger(m, '$124.00') AS big, cashsmaller(m, '$124.00') AS small FROM money_data
    expect: rows
    order: multiset
