# money.sql: money addition and subtraction at the int64 cent limit raise out-of-range, one cent inside does not.
id: money.add-overflow
title: Money addition and subtraction overflow at the cent limit raise 22003
family: money
tier: core
feature_ids: [money, arithmetic, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '92233720368547758.06'::money + '0.01'::money
    expect: rows
  - sql: |
      SELECT '92233720368547758.07'::money + '0.01'::money
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-92233720368547758.08'::money - '0.01'::money
    expect: error
    sqlstate: "22003"
