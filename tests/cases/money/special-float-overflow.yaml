# money.sql: multiplying money by infinite or NaN floats raises out-of-range rather than producing a money value.
id: money.special-float-overflow
title: Money times infinity or NaN raises 22003
family: money
tier: extended
feature_ids: [money, arithmetic, errors, floats]
required_capabilities: [select, money, float8, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '42'::money * 'inf'::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '42'::money * '-inf'::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '42'::money * 'nan'::float4
    expect: error
    sqlstate: "22003"
