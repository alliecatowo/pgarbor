# money.sql: money times float or integer operands that leave the cent range raise out-of-range.
id: money.mul-overflow
title: Money multiplication and division overflow raise 22003
family: money
tier: core
feature_ids: [money, arithmetic, errors]
required_capabilities: [select, money, numeric, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '92233720368547758.07'::money * 2::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '92233720368547758.07'::money * 2::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-92233720368547758.08'::money * -1::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-92233720368547758.08'::money / -1::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-92233720368547758.08'::money / -1::int2
    expect: error
    sqlstate: "22003"
