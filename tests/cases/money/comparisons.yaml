# money.sql: comparison operators against money literals, with both true and false outcomes.
id: money.comparisons
title: Money equality, inequality and ordering against literals
family: money
tier: core
feature_ids: [money, comparisons, boolean]
required_capabilities: [create-table, insert, select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE money_data (id int4 PRIMARY KEY, m money);
  INSERT INTO money_data VALUES (1, '123');
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT m = '$123.00' AS t1, m != '$124.00' AS t2, m <= '$123.00' AS t3,
             m >= '$123.00' AS t4, m < '$124.00' AS t5, m > '$122.00' AS t6,
             m = '$123.01' AS f1, m != '$123.00' AS f2, m <= '$122.99' AS f3,
             m >= '$123.01' AS f4, m > '$124.00' AS f5, m < '$122.00' AS f6
      FROM money_data
    expect: rows
    order: multiset
