# money.sql: money multiplied and divided by int2, int4 and int8 operands, both operand orders.
id: money.mul-div-int-types
title: Money times and divided by smallint, integer and bigint
family: money
tier: core
feature_ids: [money, arithmetic, casts]
required_capabilities: [create-table, insert, select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE money_data (id int4 PRIMARY KEY, m money);
  INSERT INTO money_data VALUES (1, '123');
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT m * 2::int2 AS a, 2::int2 * m AS b, m / 2::int2 AS c,
             m * 2::int8 AS d, 2::int8 * m AS e, m / 2::int8 AS f,
             m * 2 AS g, 2 * m AS h, m / 2 AS i
      FROM money_data
    expect: rows
    order: multiset
