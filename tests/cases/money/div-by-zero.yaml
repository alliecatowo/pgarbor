# money.sql: dividing money by zero raises division_by_zero for integer and float divisors.
id: money.div-by-zero
title: Money divided by zero raises 22012
family: money
tier: core
feature_ids: [money, arithmetic, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '1'::money / 0::int2
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT '1'::money / 0::float8
    expect: error
    sqlstate: "22012"
