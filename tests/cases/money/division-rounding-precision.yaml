# money.sql: money divided by float and integer types rounds or truncates as documented, without losing precision on large values.
id: money.division-rounding-precision
title: Money division by float and integer types, including large-value precision
family: money
tier: extended
feature_ids: [money, arithmetic, rounding]
required_capabilities: [select, money, numeric, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '878.08'::money / 11::float8 AS f8, '878.08'::money / 11::float4 AS f4,
             '878.08'::money / 11::bigint AS i8, '878.08'::money / 11::int AS i4,
             '878.08'::money / 11::smallint AS i2
    expect: rows
    order: multiset
  - sql: |
      SELECT '90000000000000099.00'::money / 10::bigint AS i8,
             '90000000000000099.00'::money / 10::int AS i4,
             '90000000000000099.00'::money / 10::smallint AS i2
    expect: rows
    order: multiset
