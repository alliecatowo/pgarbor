# money.sql: casts from int4, int8 and numeric to money, including values beyond int4 range.
id: money.cast-from-integers
title: Integer and numeric values cast to money, including negatives beyond int4
family: money
tier: core
feature_ids: [money, casts]
required_capabilities: [select, money, numeric, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT 1234567890::money AS a, (-12345)::money AS b, (-1234567890)::int4::money AS c,
             12345678901234567::int8::money AS d, (-12345678901234567)::int8::money AS e,
             12345678901234567::numeric::money AS f, (-12345678901234567)::numeric::money AS g
    expect: rows
    order: multiset
