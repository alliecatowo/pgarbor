# money.sql: money times and divided by float8 and float4, and money divided by money.
id: money.mul-div-float-types
title: Money times and divided by float8 and float4, and money over money
family: money
tier: core
feature_ids: [money, arithmetic, casts]
required_capabilities: [create-table, insert, select, money, numeric, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/money.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE money_data (id int4 PRIMARY KEY, m money);
  INSERT INTO money_data VALUES (1, '123');
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT m * 2::float8 AS a, 2::float8 * m AS b, m / 2::float8 AS c,
             m * 2::float4 AS d, 2::float4 * m AS e, m / 2::float4 AS f,
             m / '2'::money AS ratio
      FROM money_data
    expect: rows
    order: multiset
