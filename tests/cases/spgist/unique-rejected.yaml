# SP-GiST does not support unique indexes.
id: spgist.unique-rejected
title: CREATE UNIQUE INDEX USING spgist is rejected with 0A000
family: spgist
tier: core
feature_ids: [spgist, create-index, unique-constraint, errors]
required_capabilities: [create-table, create-index, spgist, errors]
provenance:
  source: hand
  ref: "PG18 sql-createindex.html (UNIQUE requires an access method that supports it); errcode 0A000"
sessions: [a]
setup: |
  CREATE TABLE sp_uq (id int4, p point);
steps:
  - sql: |
      CREATE UNIQUE INDEX sp_uq_idx ON sp_uq USING spgist (p)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM pg_index WHERE indrelid = 'sp_uq'::regclass
    expect: rows
    comment: the failed create must leave no index behind
