# SP-GiST indexes are single-column only.
id: spgist.multicolumn-rejected
title: Multicolumn SP-GiST index is rejected with 0A000
family: spgist
tier: core
feature_ids: [spgist, create-index, errors]
required_capabilities: [create-table, create-index, spgist, errors]
provenance:
  source: hand
  ref: "PG18 indexes.html (access method capabilities: amcanmulticol); errcode 0A000"
sessions: [a]
setup: |
  CREATE TABLE sp_mc (a int4, p point);
steps:
  - sql: |
      CREATE INDEX sp_mc_idx ON sp_mc USING spgist (p, a)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE INDEX sp_mc_single ON sp_mc USING spgist (p)
    expect: ok
