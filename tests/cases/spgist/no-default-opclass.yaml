# SP-GiST has no default operator class for integer arrays; the create must fail with 42704.
id: spgist.no-default-opclass
title: SP-GiST index on a type with no default opclass fails with 42704
family: spgist
tier: core
feature_ids: [spgist, create-index, arrays, errors]
required_capabilities: [create-table, create-index, spgist, arrays, errors]
provenance:
  source: hand
  ref: "PG18 indexes-opclass.html; errcode 42704 (undefined_object) for missing default opclass"
sessions: [a]
setup: |
  CREATE TABLE sp_arr (id int4, a int4[]);
steps:
  - sql: |
      CREATE INDEX sp_arr_idx ON sp_arr USING spgist (a)
    expect: error
    sqlstate: "42704"
  - sql: |
      INSERT INTO sp_arr VALUES (1, '{1,2}')
    expect: ok
