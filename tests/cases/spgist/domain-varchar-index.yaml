# An SP-GiST index on a column whose type is a domain over varchar uses the base type's opclass.
id: spgist.domain-varchar-index
title: SP-GiST index over a varchar domain column answers equality
family: spgist
tier: extended
feature_ids: [spgist, create-index, create-domain, text, select]
required_capabilities: [create-table, create-index, create-domain, insert, select, spgist]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/spgist.sql (spgist_domain_tbl)"
sessions: [a]
setup: |
  CREATE DOMAIN sp_dom AS varchar;
  CREATE TABLE sp_dom_tbl (f1 sp_dom);
  CREATE INDEX sp_dom_idx ON sp_dom_tbl USING spgist (f1);
  INSERT INTO sp_dom_tbl VALUES ('fee'), ('fi'), ('fo'), ('fum');
steps:
  - sql: |
      SELECT f1 FROM sp_dom_tbl WHERE f1 = 'fo'
    expect: rows
    order: multiset
  - sql: |
      SELECT f1 FROM sp_dom_tbl ORDER BY f1
    expect: rows
    order: ordered
