# SP-GiST fillfactor reloption is bounded to 10..100; out-of-range values are rejected.
id: spgist.fillfactor-out-of-range
title: SP-GiST fillfactor below 10 or above 100 is rejected with 22023
family: spgist
tier: core
feature_ids: [spgist, create-index, reloptions, errors]
required_capabilities: [create-table, create-index, spgist, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/spgist.sql (fillfactor = 9, fillfactor = 101)"
sessions: [a]
setup: |
  CREATE TABLE sp_ffo (id int4, p point);
steps:
  - sql: |
      CREATE INDEX sp_ffo_low ON sp_ffo USING spgist (p) WITH (fillfactor = 9)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE INDEX sp_ffo_high ON sp_ffo USING spgist (p) WITH (fillfactor = 101)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE INDEX sp_ffo_ok ON sp_ffo USING spgist (p) WITH (fillfactor = 10)
    expect: ok
    comment: the boundary value 10 is accepted
