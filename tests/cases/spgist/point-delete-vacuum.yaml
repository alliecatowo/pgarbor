# Deletes and VACUUM on an SP-GiST index leave the remaining rows fully visible to index scans.
id: spgist.point-delete-vacuum
title: Delete rows from an SP-GiST point index, vacuum, and re-scan survivors
family: spgist
tier: core
feature_ids: [spgist, create-index, delete, vacuum, point]
required_capabilities: [create-table, create-index, insert, delete, select, spgist, vacuum, point]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/spgist.sql (vacuum-root and delete/vacuum sequence)"
sessions: [a]
setup: |
  CREATE TABLE sp_vac (id int4, p point);
  CREATE INDEX sp_vac_idx ON sp_vac USING spgist (p) WITH (fillfactor = 75);
  INSERT INTO sp_vac (id, p) SELECT g, point(g*10, g*10) FROM generate_series(1, 10) g;
steps:
  - sql: |
      DELETE FROM sp_vac WHERE id < 5
    expect: ok
  - sql: |
      VACUUM sp_vac
    expect: ok
  - sql: |
      SELECT id FROM sp_vac WHERE p <@ box '((0,0),(200,200))' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM sp_vac WHERE id % 2 = 1
    expect: ok
  - sql: |
      VACUUM sp_vac
    expect: ok
  - sql: |
      SELECT id FROM sp_vac ORDER BY p <-> point(0, 0)
    expect: rows
    order: ordered
