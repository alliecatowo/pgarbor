# SET TIME ZONE changes how timestamptz values are rendered and how AT TIME ZONE converts them; an unknown zone is rejected.
id: timestamptz.set-timezone-output
title: session time zone controls timestamptz rendering and AT TIME ZONE conversion
family: timestamptz
tier: core
feature_ids: [timestamptz, date-type, time-zones, guc, errors]
required_capabilities: [select, date-type, guc, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamptz.sql"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'Europe/London'
    expect: ok
  - sql: |
      SELECT timestamptz '2001-07-01 12:00:00+00' AS london_summer, timestamptz '2001-01-01 12:00:00+00' AS london_winter
    expect: rows
    order: multiset
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT timestamptz '2001-07-01 12:00:00+00' AS utc_value
    expect: rows
    order: multiset
  - sql: |
      SET TIME ZONE 'America/Los_Angeles'
    expect: ok
  - sql: |
      SELECT timestamptz '2001-07-01 12:00:00+00' AT TIME ZONE 'America/Los_Angeles' AS la_wall_clock
    expect: rows
    order: multiset
  - sql: |
      SELECT timestamp '2001-07-01 05:00:00' AT TIME ZONE 'America/Los_Angeles' AS utc_instant
    expect: rows
    order: multiset
  - sql: |
      SET TIME ZONE 'Nowhere/Nope'
    expect: error
    sqlstate: "22023"
