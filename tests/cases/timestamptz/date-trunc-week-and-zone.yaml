# date_trunc to week and day granularity, infinity passthrough, and the three-argument zone form.
id: timestamptz.date-trunc-week-and-zone
title: date_trunc on timestamptz including infinity and explicit zone argument
family: timestamptz
tier: core
feature_ids: [timestamptz, date-type, date-functions, time-zones]
required_capabilities: [select, date-type, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamptz.sql"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT
        date_trunc('week', timestamptz '2004-02-29 15:44:17.71393+00') AS week_trunc,
        date_trunc('day', timestamptz '2001-02-16 20:38:40+00') AS day_trunc,
        date_trunc('hour', timestamptz '2001-02-16 20:38:40+00') AS hour_trunc
    expect: rows
    order: multiset
  - sql: |
      SELECT
        date_trunc('week', timestamptz 'infinity') AS inf_trunc,
        date_trunc('week', timestamptz '-infinity') AS ninf_trunc
    expect: rows
    order: multiset
  - sql: |
      SELECT
        date_trunc('day', timestamptz '2001-02-16 20:38:40+00', 'Australia/Sydney') AS sydney_trunc,
        date_trunc('day', timestamptz '2001-02-16 20:38:40+00', 'GMT') AS gmt_trunc
    expect: rows
    order: multiset
