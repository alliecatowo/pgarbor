# Explicit offsets, abbreviations, and ISO T input all denote the same instant when the session zone is UTC.
id: timestamptz.input-explicit-offsets
title: timestamptz input with explicit offsets abbreviations and ISO T separator
family: timestamptz
tier: slice
feature_ids: [timestamptz, date-type, insert, select, time-zones]
required_capabilities: [create-table, insert, select, date-type, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamptz.sql"
sessions: [a]
setup: |
  CREATE TABLE tz_in (id int4, d timestamptz);
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      INSERT INTO tz_in VALUES
        (1, '1997-02-10 17:32:01-08'),
        (2, '1997-02-10 17:32:01 -08:00'),
        (3, '19970210 173201 -0800'),
        (4, '1997-02-10 17:32:01 PST'),
        (5, 'Feb 10 17:32:01 1997 -0800'),
        (6, '1997-06-10 17:32:01 -07:00'),
        (7, '2001-09-22T18:19:20'),
        (8, '1997-01-02')
    expect: ok
  - sql: |
      SELECT id, d::text AS d_utc FROM tz_in ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(DISTINCT d) AS instants, count(*) AS n_rows FROM tz_in WHERE id BETWEEN 1 AND 5
    expect: rows
    order: multiset
