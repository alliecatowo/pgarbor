# Non-positive strides and month-or-year strides are rejected by date_bin.
id: timestamptz.date-bin-invalid-stride
title: date_bin rejects zero negative and month-based strides
family: timestamptz
tier: extended
feature_ids: [timestamptz, date-type, date-functions, interval, errors]
required_capabilities: [select, date-type, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamptz.sql"
sessions: [a]
steps:
  - sql: |
      SELECT date_bin('0 days'::interval, timestamptz '1970-01-01 01:00:00+00', timestamptz '1970-01-01 00:00:00+00')
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT date_bin('-2 days'::interval, timestamptz '1970-01-01 01:00:00+00', timestamptz '1970-01-01 00:00:00+00')
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT date_bin('5 months'::interval, timestamptz '2020-02-01 01:01:01+00', timestamptz '2001-01-01+00')
    expect: error
    sqlstate: "0A000"
