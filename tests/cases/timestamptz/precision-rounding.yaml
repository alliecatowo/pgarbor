# A timestamp(2) with time zone column rounds fractional seconds to two digits on input.
id: timestamptz.precision-rounding
title: timestamp(2) with time zone rounds fractional seconds on input
family: timestamptz
tier: core
feature_ids: [timestamptz, date-type, insert, select, typmod]
required_capabilities: [create-table, insert, select, date-type, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamptz.sql"
sessions: [a]
setup: |
  CREATE TABLE tz_prec (d timestamp(2) with time zone);
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      INSERT INTO tz_prec VALUES
        ('1997-02-10 17:32:01.999999+00'),
        ('1997-02-10 17:32:01.4+00'),
        ('1997-02-10 17:32:01.5+00'),
        ('1997-02-10 17:32:01.6+00'),
        (NULL)
    expect: ok
  - sql: |
      SELECT d::text AS d_text FROM tz_prec ORDER BY d NULLS LAST
    expect: rows
    order: ordered
