# date_bin floors a timestamptz to a stride counted from an origin, including origins after the source.
id: timestamptz.date-bin-origin-alignment
title: date_bin aligns timestamptz to strides from an origin
family: timestamptz
tier: core
feature_ids: [timestamptz, date-type, date-functions, interval]
required_capabilities: [select, date-type, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamptz.sql"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT
        date_bin('15 minutes'::interval, timestamptz '2020-02-01 01:01:01+00', timestamptz '2020-02-01 00:02:30+00') AS bin_15m,
        date_bin('30 minutes'::interval, timestamptz '2024-02-01 15:00:00+00', timestamptz '2024-02-01 17:00:00+00') AS bin_origin_later,
        date_bin('1 day'::interval, timestamptz '2020-02-29 15:44:17+00', timestamptz '2001-01-01+00') AS bin_day,
        date_bin('2 days'::interval, timestamptz '1970-01-01 01:00:00+00', timestamptz '1970-01-01 00:00:00+00') AS bin_2d
    expect: rows
    order: multiset
  - sql: |
      SELECT date_bin('1 hour'::interval, NULL::timestamptz, timestamptz '2001-01-01+00') IS NULL AS null_in_null_out
    expect: rows
    order: multiset
