# Unknown and unsupported truncation units on a finite timestamptz raise errors.
id: timestamptz.date-trunc-invalid-units
title: date_trunc rejects unrecognized and unsupported units
family: timestamptz
tier: extended
feature_ids: [timestamptz, date-type, date-functions, errors]
required_capabilities: [select, date-type, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamptz.sql"
sessions: [a]
steps:
  - sql: |
      SELECT date_trunc('ago', timestamptz '2001-02-16 20:38:40+00') AS invalid_trunc
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT date_trunc('timezone', timestamptz '2001-02-16 20:38:40+00') AS notsupp_trunc
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT date_trunc('day', timestamptz '2001-02-16 20:38:40+00') AS still_works
    expect: rows
    order: multiset
