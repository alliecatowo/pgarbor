# System schemas cannot be dropped, and IF EXISTS does not turn that refusal into a notice.
id: cmd-drop-schema.pg-catalog-refused
title: DROP SCHEMA pg_catalog fails with 2BP01 even with IF EXISTS, and the catalog remains
family: cmd-drop-schema
tier: extended
feature_ids: [drop-schema, system-schemas, errors, if-exists]
required_capabilities: [select, errors, catalog-introspection]
provenance:
  source: hand
  ref: "ref/drop_schema.sgml#sql-dropschema (Description: a schema can only be dropped by its owner or a superuser); verified against PostgreSQL 18.6 oracle"
sessions: [a]
steps:
  - sql: |
      DROP SCHEMA pg_catalog
    expect: error
    sqlstate: "2BP01"
    comment: the system catalog schema is required by the database system
  - sql: |
      DROP SCHEMA IF EXISTS pg_catalog
    expect: error
    sqlstate: "2BP01"
    comment: IF EXISTS only skips names that do not exist, so the refusal is still an error
  - sql: |
      SELECT count(*) AS n FROM pg_namespace WHERE nspname = 'pg_catalog'
    expect: rows
    order: ordered
