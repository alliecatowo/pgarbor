# With only RESTRICTIVE policies and no PERMISSIVE policy, the default-deny rule hides every row.
id: rowsecurity.restrictive-only-denies-all
title: "Restrictive policies alone grant no rows"
family: rowsecurity
tier: core
feature_ids: [rls, policies, select, aggregates]
required_capabilities: [create-table, insert, select, rls]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowsecurity.sql"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2), (3);
  CREATE POLICY r_true ON t AS RESTRICTIVE FOR SELECT USING (true);
  ALTER TABLE t ENABLE ROW LEVEL SECURITY;
  ALTER TABLE t FORCE ROW LEVEL SECURITY;
steps:
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    comment: count is 0 because there is no permissive policy to grant access
