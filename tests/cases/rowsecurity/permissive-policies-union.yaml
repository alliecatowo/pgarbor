# Multiple permissive SELECT policies combine with OR; a NULL-valued USING predicate hides a row.
id: rowsecurity.permissive-policies-union
title: "Permissive SELECT policies are OR-combined per session setting"
family: rowsecurity
tier: core
feature_ids: [rls, policies, select, guc]
required_capabilities: [create-table, insert, select, rls, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowsecurity.sql"
sessions: [a]
setup: |
  CREATE TABLE document (did int4 PRIMARY KEY, dlevel int4 NOT NULL, dauthor text);
  INSERT INTO document VALUES (1, 1, 'alice'), (2, 2, 'bob'), (3, 1, 'alice'), (4, 4, 'bob'), (5, 5, 'carol'), (6, 1, 'carol');
  CREATE POLICY p_author ON document FOR SELECT USING (dauthor = current_setting('app.uid', true));
  CREATE POLICY p_level ON document FOR SELECT USING (dlevel >= 4);
  ALTER TABLE document ENABLE ROW LEVEL SECURITY;
  ALTER TABLE document FORCE ROW LEVEL SECURITY;
steps:
  - sql: |
      SET app.uid = 'alice'
    expect: ok
  - sql: |
      SELECT did FROM document ORDER BY did
    expect: rows
    order: ordered
    comment: author match (1, 3) OR level >= 4 (4, 5)
  - sql: |
      SET app.uid = 'dave'
    expect: ok
  - sql: |
      SELECT did FROM document ORDER BY did
    expect: rows
    order: ordered
    comment: only the level policy applies, so 4 and 5
  - sql: |
      SET app.uid = ''
    expect: ok
  - sql: |
      SELECT count(*) FROM document
    expect: rows
    comment: empty string matches no author, so count is 2
