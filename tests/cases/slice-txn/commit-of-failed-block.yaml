# COMMIT on an aborted transaction block does not error: it reports the tag ROLLBACK and discards the work.
id: slice-txn.commit-of-failed-block
title: COMMIT of a failed transaction block succeeds as ROLLBACK and discards earlier inserts
family: slice-txn
tier: core
feature_ids: [transactions, errors, insert, select]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: hand
  ref: "PG18 docs sql-commit.html: COMMIT of a failed transaction performs ROLLBACK"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      COMMIT
    expect: ok
    comment: command tag is ROLLBACK, not COMMIT
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: expect no rows
