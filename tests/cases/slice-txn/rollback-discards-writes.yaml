# ROLLBACK discards inserts, updates and deletes made in the block, including NULL-valued rows.
id: slice-txn.rollback-discards-writes
title: ROLLBACK undoes insert, update and delete, restoring NULL and non-NULL rows
family: slice-txn
tier: core
feature_ids: [transactions, insert, update, delete, select, null-handling]
required_capabilities: [create-table, insert, update, delete, select, transactions]
provenance:
  source: hand
  ref: "PG18 docs sql-rollback.html"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v text);
  INSERT INTO t VALUES (1, 'keep'), (2, NULL);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3, 'gone'), (4, NULL)
    expect: ok
  - sql: |
      UPDATE t SET v = 'changed' WHERE id = 1
    expect: ok
  - sql: |
      DELETE FROM t WHERE id = 2
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: inside the block the changes are visible to this session
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT id, v, v IS NULL AS v_null FROM t ORDER BY id
    expect: rows
    order: ordered
