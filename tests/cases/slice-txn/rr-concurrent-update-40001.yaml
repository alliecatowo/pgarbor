# REPEATABLE READ: updating a row that another session already committed a change to fails with 40001, not a wait.
id: slice-txn.rr-concurrent-update-40001
title: Repeatable read update of a row committed by another session fails with 40001
family: slice-txn
tier: core
feature_ids: [transactions, isolation-levels, repeatable-read, serialization-failure, multi-session, update]
required_capabilities: [create-table, insert, update, select, transactions, isolation-levels, multi-session]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/transaction-iso.html#XACT-REPEATABLE-READ; errcodes 40001"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, balance int4 NOT NULL);
  INSERT INTO acct VALUES (1, 100);
steps:
  - session: a
    sql: |
      BEGIN ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - session: a
    sql: |
      SELECT balance FROM acct WHERE id = 1
    expect: rows
  - session: b
    sql: |
      UPDATE acct SET balance = balance + 10 WHERE id = 1
    expect: ok
  - session: a
    sql: |
      UPDATE acct SET balance = balance + 5 WHERE id = 1
    expect: error
    sqlstate: "40001"
    comment: row was changed by a transaction committed after a's snapshot
  - session: a
    sql: |
      ROLLBACK
    expect: ok
  - session: a
    sql: |
      SELECT id, balance FROM acct ORDER BY id
    expect: rows
    order: ordered
    comment: expect 110 (only b's update)
