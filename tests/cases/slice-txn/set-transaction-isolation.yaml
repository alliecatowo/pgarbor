# SET TRANSACTION sets the isolation level for the current block; it is rejected (25001) after the first query.
id: slice-txn.set-transaction-isolation
title: SET TRANSACTION ISOLATION LEVEL applies inside the block and fails after the first query
family: slice-txn
tier: core
feature_ids: [transactions, isolation-levels, set-transaction, errors]
required_capabilities: [transactions, isolation-levels]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/sql-set-transaction.html"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS lvl
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS lvl
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1 AS one
    expect: rows
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: error
    sqlstate: "25001"
    comment: must be called before any query in the block
  - sql: |
      ROLLBACK
    expect: ok
