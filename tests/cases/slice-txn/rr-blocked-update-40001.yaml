# REPEATABLE READ: a waiter on a row locked by a session that then commits gets 40001 after the wait, and its change is not applied.
id: slice-txn.rr-blocked-update-40001
title: Repeatable read waiter gets 40001 after the holder commits, and its update is discarded
family: slice-txn
tier: extended
feature_ids: [transactions, isolation-levels, repeatable-read, row-locks, serialization-failure, multi-session, update]
required_capabilities: [create-table, insert, update, select, transactions, isolation-levels, multi-session, row-locks]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/transaction-iso.html#XACT-REPEATABLE-READ"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, balance int4 NOT NULL);
  INSERT INTO acct VALUES (1, 100);
steps:
  - session: a
    sql: |
      BEGIN ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - session: a
    sql: |
      UPDATE acct SET balance = balance + 5 WHERE id = 1
    expect: ok
  - session: b
    sql: |
      UPDATE acct SET balance = balance * 2 WHERE id = 1
    async: true
    expect_blocked: true
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: error
    sqlstate: "40001"
    comment: the waiter cannot update a row changed after its snapshot
  - session: b
    sql: |
      SELECT id, balance FROM acct ORDER BY id
    expect: rows
    order: ordered
    comment: expect 105 (only a's committed update)
