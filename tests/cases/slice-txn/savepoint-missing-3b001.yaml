# Releasing an unknown savepoint is an error (3B001) that aborts the block; ROLLBACK then ends it cleanly.
id: slice-txn.savepoint-missing-3b001
title: RELEASE of an unknown savepoint fails with 3B001 and aborts the block
family: slice-txn
tier: core
feature_ids: [transactions, savepoints, errors]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: hand
  ref: "PG18 errcodes 3B001 (savepoint_does_not_exist)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT s1
    expect: ok
  - sql: |
      RELEASE SAVEPOINT nope
    expect: error
    sqlstate: "3B001"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: expect no rows
