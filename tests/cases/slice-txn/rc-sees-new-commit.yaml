# READ COMMITTED: each statement takes a fresh snapshot, so a later statement sees another session's commit.
id: slice-txn.rc-sees-new-commit
title: Read committed picks up a concurrent commit on the next statement in the same block
family: slice-txn
tier: core
feature_ids: [transactions, isolation-levels, read-committed, multi-session, update, null-handling]
required_capabilities: [create-table, insert, update, select, transactions, isolation-levels, multi-session]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/transaction-iso.html#XACT-READ-COMMITTED"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, bal int4);
  INSERT INTO acct VALUES (1, 100), (2, NULL);
steps:
  - session: a
    sql: |
      BEGIN ISOLATION LEVEL READ COMMITTED
    expect: ok
  - session: a
    sql: |
      SELECT id, bal FROM acct ORDER BY id
    expect: rows
    order: ordered
  - session: b
    sql: |
      UPDATE acct SET bal = bal + 50 WHERE id = 1
    expect: ok
  - session: a
    sql: |
      SELECT id, bal FROM acct ORDER BY id
    expect: rows
    order: ordered
    comment: sees 150 for id 1
  - session: a
    sql: |
      SELECT count(*) FROM acct WHERE bal IS NULL
    expect: rows
    comment: the NULL row is still NULL
  - session: a
    sql: |
      COMMIT
    expect: ok
