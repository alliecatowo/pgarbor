id: matview.drop-base-dependency
title: Dropping a base table with a dependent materialized view requires CASCADE
family: matview
tier: core
feature_ids: [materialized-views, drop-table, dependency, errors]
required_capabilities: [create-table, insert, select, create-materialized-view, drop-table, dependency, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/matview.sql"
setup: |
  CREATE TABLE p10 (id int4 PRIMARY KEY, v int4);
  INSERT INTO p10 VALUES (1, 5);
steps:
  - sql: |
      CREATE MATERIALIZED VIEW mv10 AS SELECT id, v FROM p10
    expect: ok
  - sql: |
      DROP TABLE p10
    expect: error
    sqlstate: "2BP01"
  - sql: |
      SELECT id, v FROM mv10
    expect: rows
  - sql: |
      DROP TABLE p10 CASCADE
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'mv10'
    expect: rows
