id: matview.refresh-concurrently-duplicate-rows
title: Duplicate new rows fail concurrent refresh and leave the old contents in place
family: matview
tier: extended
feature_ids: [materialized-views, refresh-concurrently, unique-index, errors]
required_capabilities: [create-table, insert, select, create-index, unique-index, create-materialized-view, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/matview.sql"
setup: |
  CREATE TABLE d5 (a int4, b int4);
  INSERT INTO d5 VALUES (1, 10), (2, 20);
steps:
  - sql: |
      CREATE MATERIALIZED VIEW mv5 AS SELECT a, b FROM d5
    expect: ok
  - sql: |
      CREATE UNIQUE INDEX mv5_a ON mv5 (a)
    expect: ok
  - sql: |
      INSERT INTO d5 VALUES (1, 10)
    expect: ok
  - sql: |
      REFRESH MATERIALIZED VIEW CONCURRENTLY mv5
    expect: error
    sqlstate: "21000"
    comment: new data contains duplicate rows
  - sql: |
      SELECT a, b FROM mv5 ORDER BY a, b
    expect: rows
    order: ordered
    comment: failed refresh keeps the old snapshot
