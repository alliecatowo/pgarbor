id: matview.drop-if-exists-and-wrong-type
title: DROP MATERIALIZED VIEW IF EXISTS skips silently, plain DROP errors, and tables are rejected
family: matview
tier: core
feature_ids: [materialized-views, drop-table, drop-if-exists, errors]
required_capabilities: [create-table, select, drop-table, create-materialized-view, drop-if-exists, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/matview.sql"
setup: |
  CREATE TABLE plain (x int4);
steps:
  - sql: |
      DROP MATERIALIZED VIEW IF EXISTS no_such_mv
    expect: notice
  - sql: |
      DROP MATERIALIZED VIEW no_such_mv
    expect: error
    sqlstate: "42P01"
  - sql: |
      DROP MATERIALIZED VIEW plain
    expect: error
    sqlstate: "42809"
    comment: a table is not a materialized view
  - sql: |
      SELECT count(*) FROM plain
    expect: rows
