id: matview.select-for-share-rejected
title: Row locking clause on a materialized view is rejected
family: matview
tier: extended
feature_ids: [materialized-views, row-locks, errors]
required_capabilities: [create-table, insert, select, create-materialized-view, row-locks, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/matview.sql"
setup: |
  CREATE TABLE l13 (a int4);
  INSERT INTO l13 VALUES (1);
  CREATE MATERIALIZED VIEW mv13 AS SELECT a FROM l13;
steps:
  - sql: |
      SELECT * FROM mv13 FOR SHARE
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT a FROM mv13
    expect: rows
