id: matview.insert-rejected
title: INSERT into a materialized view is rejected with wrong object type
family: matview
tier: core
feature_ids: [materialized-views, insert, errors]
required_capabilities: [create-table, insert, select, create-materialized-view, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/matview.sql"
setup: |
  CREATE TABLE b9 (k int4);
  CREATE MATERIALIZED VIEW m9 AS SELECT k FROM b9;
steps:
  - sql: |
      INSERT INTO m9 VALUES (1)
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT count(*) FROM m9
    expect: rows
    comment: nothing was written
