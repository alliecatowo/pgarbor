id: matview.create-duplicate-name
title: Creating a materialized view over an existing relation name
family: matview
tier: core
feature_ids: [materialized-views, create-view, errors]
required_capabilities: [create-table, insert, select, create-view, create-materialized-view, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/matview.sql"
setup: |
  CREATE TABLE base6 (x int4);
  INSERT INTO base6 VALUES (1), (2);
steps:
  - sql: |
      CREATE MATERIALIZED VIEW mv6 AS SELECT x FROM base6
    expect: ok
  - sql: |
      CREATE MATERIALIZED VIEW mv6 AS SELECT x FROM base6
    expect: error
    sqlstate: "42P07"
  - sql: |
      CREATE MATERIALIZED VIEW IF NOT EXISTS mv6 AS SELECT x * 100 AS x FROM base6
    expect: notice
    comment: skipped, original definition kept
  - sql: |
      SELECT x FROM mv6 ORDER BY x
    expect: rows
    order: ordered
  - sql: |
      CREATE VIEW mv6 AS SELECT 1 AS one
    expect: error
    sqlstate: "42P07"
