id: matview.create-with-data-error
title: Failing population aborts CREATE but WITH NO DATA defers it to REFRESH
family: matview
tier: core
feature_ids: [materialized-views, errors, division]
required_capabilities: [create-table, insert, select, create-materialized-view, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/matview.sql"
setup: |
  CREATE TABLE z8 (a int4);
  INSERT INTO z8 VALUES (1), (2);
steps:
  - sql: |
      CREATE MATERIALIZED VIEW mv8 AS SELECT a, 1 / 0 AS x FROM z8
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'mv8'
    expect: rows
    comment: the failed CREATE leaves nothing behind
  - sql: |
      CREATE MATERIALIZED VIEW mv8 AS SELECT a, 1 / 0 AS x FROM z8 WITH NO DATA
    expect: ok
  - sql: |
      REFRESH MATERIALIZED VIEW mv8
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'mv8'
    expect: rows
  - sql: |
      DROP MATERIALIZED VIEW mv8
    expect: ok
