# A trigger function may run SQL that fires the same trigger again. Each level here inserts a row with n - 1
# until 0, so one outer INSERT produces a chain of cascaded rows. The command tag counts only the outer row.
id: doc-trigger-definition.cascading-trigger-recursion
title: Trigger that inserts into its own table cascades recursively to the base case
family: doc-trigger-definition
tier: core
feature_ids: [triggers, plpgsql, insert, recursion]
required_capabilities: [create-table, create-function, insert, select, plpgsql, triggers, identity]
provenance:
  source: pg-docs
  ref: "trigger.sgml#trigger-definition (cascading triggers: a trigger's SQL can fire triggers again)"
sessions: [a]
setup: |
  CREATE TABLE countdown (id int GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, n int);
  CREATE FUNCTION countdown_fn() RETURNS trigger AS $$
  BEGIN
    IF NEW.n > 0 THEN
      INSERT INTO countdown (n) VALUES (NEW.n - 1);
    END IF;
    RETURN NULL;
  END
  $$ LANGUAGE plpgsql;
  CREATE TRIGGER countdown_ins AFTER INSERT ON countdown
    FOR EACH ROW EXECUTE FUNCTION countdown_fn();
steps:
  - sql: |
      INSERT INTO countdown (n) VALUES (3)
    expect: ok
    comment: command tag is INSERT 0 1 even though four rows end up in the table
  - sql: |
      SELECT n FROM countdown ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM countdown
    expect: rows
