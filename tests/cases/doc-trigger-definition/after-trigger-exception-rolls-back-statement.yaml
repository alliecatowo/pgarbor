# An exception raised in a trigger aborts the statement and its trigger effects together. Inside a
# transaction, ROLLBACK TO SAVEPOINT removes the failed statement and the transaction continues.
id: doc-trigger-definition.after-trigger-exception-rolls-back-statement
title: Exception in AFTER row trigger rolls back the whole statement, including earlier rows
family: doc-trigger-definition
tier: core
feature_ids: [triggers, plpgsql, insert, transactions, savepoints, errors]
required_capabilities: [create-table, create-function, insert, select, plpgsql, triggers, transactions, savepoints, error-sqlstate]
provenance:
  source: pg-docs
  ref: "trigger.sgml#trigger-definition (trigger runs in the same transaction as the statement; errors roll back both)"
sessions: [a]
setup: |
  CREATE TABLE t (id int, v int);
  CREATE TABLE audit (v int);
  CREATE FUNCTION audit_fn() RETURNS trigger AS $$
  BEGIN
    IF NEW.v < 0 THEN
      RAISE EXCEPTION 'negative value %', NEW.v;
    END IF;
    INSERT INTO audit VALUES (NEW.v);
    RETURN NULL;
  END
  $$ LANGUAGE plpgsql;
  CREATE TRIGGER t_audit AFTER INSERT ON t FOR EACH ROW EXECUTE FUNCTION audit_fn();
steps:
  - sql: |
      INSERT INTO t VALUES (1, 5), (2, -1), (3, 7)
    expect: error
    sqlstate: "P0001"
    comment: the row with v = 5 was already processed by the trigger, but the whole statement is undone
  - sql: |
      SELECT count(*) FROM t
    expect: rows
  - sql: |
      SELECT count(*) FROM audit
    expect: rows
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT s1
    expect: ok
  - sql: |
      INSERT INTO t VALUES (4, -4)
    expect: error
    sqlstate: "P0001"
  - sql: |
      ROLLBACK TO SAVEPOINT s1
    expect: ok
  - sql: |
      INSERT INTO t VALUES (5, 50)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT v FROM audit ORDER BY v
    expect: rows
    order: ordered
