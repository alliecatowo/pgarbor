# A row-level INSTEAD OF trigger that returns NULL did not modify the base tables, so the row is not
# counted. Returning the OLD row for a DELETE signals a real modification and is counted.
id: doc-trigger-definition.instead-of-null-not-counted
title: INSTEAD OF DELETE returning NULL is not counted, returning OLD is counted
family: doc-trigger-definition
tier: core
feature_ids: [triggers, instead-of-triggers, views, plpgsql, delete]
required_capabilities: [create-table, create-view, create-function, insert, delete, select, plpgsql, triggers]
provenance:
  source: pg-docs
  ref: "trigger.sgml#trigger-definition (INSTEAD OF: return NULL means no modification; nonnull return increments the affected count)"
sessions: [a]
setup: |
  CREATE TABLE base (id int PRIMARY KEY, val text);
  INSERT INTO base VALUES (1, 'one'), (2, 'two'), (3, 'three'), (4, 'four');
  CREATE VIEW v AS SELECT id, val FROM base;
  CREATE FUNCTION v_del() RETURNS trigger AS $$
  BEGIN
    IF OLD.id IN (1, 2) THEN
      RETURN NULL;
    END IF;
    DELETE FROM base WHERE id = OLD.id;
    RETURN OLD;
  END
  $$ LANGUAGE plpgsql;
  CREATE TRIGGER v_del_trg INSTEAD OF DELETE ON v FOR EACH ROW EXECUTE FUNCTION v_del();
steps:
  - sql: |
      DELETE FROM v WHERE id <= 4
    expect: ok
    comment: command tag must report 2 (rows 3 and 4), not 4
  - sql: |
      SELECT id, val FROM base ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM v WHERE id = 99
    expect: ok
    comment: no matching view row fires no trigger, so the count is 0
