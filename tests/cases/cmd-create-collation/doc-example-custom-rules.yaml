# Documented example: CREATE COLLATION custom (provider = icu, locale = 'und', rules = '&V << w <<< W') changes ordering versus the root locale.
id: cmd-create-collation.doc-example-custom-rules
title: "CREATE COLLATION with ICU rules reorders w as a variant of v"
family: cmd-create-collation
tier: core
feature_ids: [create-collation, icu-provider, icu-rules, sort-order]
required_capabilities: [create-collation, icu-provider, collate-clause, icu-rules]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_collation.sgml#sql-createcollation-examples (custom rules); icu-tailoring-rules"
sessions: [a]
steps:
  - sql: |
      CREATE COLLATION cmd_cc_custom (provider = icu, locale = 'und', rules = '&V << w <<< W')
    expect: ok
  - sql: |
      CREATE COLLATION cmd_cc_plain (provider = icu, locale = 'und')
    expect: ok
  - sql: |
      SELECT w FROM (VALUES ('va'), ('w'), ('vb'), ('x'), ('v'), ('wz'), ('W')) AS v(w) ORDER BY w COLLATE cmd_cc_custom
    expect: rows
    order: ordered
    comment: with the rule w is primary-equal to v, so it sorts before va
  - sql: |
      SELECT w FROM (VALUES ('va'), ('w'), ('vb'), ('x'), ('v'), ('wz'), ('W')) AS v(w) ORDER BY w COLLATE cmd_cc_plain
    expect: rows
    order: ordered
    comment: the root locale sorts w after vb
