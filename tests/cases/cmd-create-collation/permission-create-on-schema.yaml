# Documented: creating a collation requires CREATE privilege on the destination schema.
id: cmd-create-collation.permission-create-on-schema
title: "CREATE COLLATION needs CREATE on the destination schema and the owner follows the creating role"
family: cmd-create-collation
tier: core
feature_ids: [create-collation, privileges, owner]
required_capabilities: [create-collation, create-role, set-role, grant, icu-provider, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_collation.sgml#sql-createcollation-description (CREATE privilege on the destination schema)"
sessions: [a]
setup: |
  CREATE ROLE cmd_cc_nobody;
steps:
  - sql: |
      SET ROLE cmd_cc_nobody
    expect: ok
  - sql: |
      CREATE COLLATION cmd_cc_denied (provider = icu, locale = 'und')
    expect: error
    sqlstate: "42501"
    comment: no CREATE privilege on public yet
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      GRANT CREATE ON SCHEMA public TO cmd_cc_nobody
    expect: ok
  - sql: |
      SET ROLE cmd_cc_nobody
    expect: ok
  - sql: |
      CREATE COLLATION cmd_cc_granted (provider = icu, locale = 'und')
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(collowner) FROM pg_collation WHERE collname = 'cmd_cc_granted'
    expect: rows
    order: ordered
    comment: the creating role becomes the owner
  - sql: |
      DROP COLLATION cmd_cc_granted
    expect: ok
  - sql: |
      REVOKE CREATE ON SCHEMA public FROM cmd_cc_nobody
    expect: ok
  - sql: |
      DROP ROLE cmd_cc_nobody
    expect: ok
