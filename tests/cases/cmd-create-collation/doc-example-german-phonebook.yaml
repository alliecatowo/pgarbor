# Documented example: CREATE COLLATION german_phonebook (provider = icu, locale = 'de-u-co-phonebk'), plus the standard German ICU locale for contrast.
id: cmd-create-collation.doc-example-german-phonebook
title: "CREATE COLLATION runs the documented german_phonebook ICU example"
family: cmd-create-collation
tier: core
feature_ids: [create-collation, icu-provider, locale, sort-order]
required_capabilities: [create-collation, icu-provider, collate-clause]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_collation.sgml#sql-createcollation-examples (german_phonebook)"
sessions: [a]
steps:
  - sql: |
      CREATE COLLATION cmd_cc_phonebook (provider = icu, locale = 'de-u-co-phonebk')
    expect: ok
  - sql: |
      CREATE COLLATION cmd_cc_german (provider = icu, locale = 'de-DE')
    expect: ok
  - sql: |
      SELECT w FROM (VALUES ('Äpfel'), ('Apfel'), ('Azur'), ('Ärger'), ('Aerger'), ('Zebra')) AS v(w) ORDER BY w COLLATE cmd_cc_phonebook
    expect: rows
    order: ordered
    comment: phonebook order sorts umlauts as their ae/oe/ue expansion
  - sql: |
      SELECT w FROM (VALUES ('Äpfel'), ('Apfel'), ('Azur'), ('Ärger'), ('Aerger'), ('Zebra')) AS v(w) ORDER BY w COLLATE cmd_cc_german
    expect: rows
    order: ordered
    comment: standard German order treats umlauts as accented a
