# Documented: a collation name must be unique within its schema; a repeat without IF NOT EXISTS is an error.
id: cmd-create-collation.duplicate-name-42710
title: "CREATE COLLATION with an existing name fails with duplicate_object"
family: cmd-create-collation
tier: core
feature_ids: [create-collation, unique-name]
required_capabilities: [create-collation, icu-provider, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_collation.sgml#sql-createcollation (Parameters: name must be unique within that schema)"
sessions: [a]
steps:
  - sql: |
      CREATE COLLATION cmd_cc_dupe (provider = icu, locale = 'und')
    expect: ok
  - sql: |
      CREATE COLLATION cmd_cc_dupe (provider = icu, locale = 'und')
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE COLLATION cmd_cc_dupe FROM "C"
    expect: error
    sqlstate: "42710"
    comment: copy form has the same uniqueness rule
  - sql: |
      SELECT count(*) FROM pg_collation WHERE collname = 'cmd_cc_dupe'
    expect: rows
    order: ordered
