# Documented grammar and errors: unknown attributes, unknown providers, and missing required options are rejected and create nothing.
id: cmd-create-collation.option-validation-errors
title: "CREATE COLLATION rejects unknown attributes, unknown providers and missing locale without creating anything"
family: cmd-create-collation
tier: core
feature_ids: [create-collation, provider, syntax-errors]
required_capabilities: [create-collation, icu-provider, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_collation.sgml#sql-createcollation (Synopsis; Parameters: provider, locale)"
sessions: [a]
steps:
  - sql: |
      CREATE COLLATION cmd_cc_opt1 (provider = icu, locale = 'und', colour = 'red')
    expect: error
    sqlstate: "42601"
    comment: unknown attribute name
  - sql: |
      CREATE COLLATION cmd_cc_opt2 (provider = bogus, locale = 'C')
    expect: error
    sqlstate: "42P17"
    comment: unknown provider name
  - sql: |
      CREATE COLLATION cmd_cc_opt3 (provider = icu)
    expect: error
    sqlstate: "42P17"
    comment: a locale is required
  - sql: |
      CREATE COLLATION cmd_cc_opt4 ()
    expect: error
    sqlstate: "42601"
    comment: an empty option list is a syntax error
  - sql: |
      CREATE COLLATION cmd_cc_opt5 (provider = icu, locale = 'und')
    expect: ok
  - sql: |
      SELECT collname FROM pg_collation WHERE collname LIKE 'cmd\_cc\_opt%' ORDER BY 1
    expect: rows
    order: ordered
    comment: only the valid definition exists
