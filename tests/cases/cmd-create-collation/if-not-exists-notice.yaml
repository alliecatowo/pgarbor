# Documented: IF NOT EXISTS does not raise an error when the name exists, issues a notice, and keeps the existing collation.
id: cmd-create-collation.if-not-exists-notice
title: "CREATE COLLATION IF NOT EXISTS emits a notice and keeps the existing definition"
family: cmd-create-collation
tier: core
feature_ids: [create-collation, if-not-exists, notices]
required_capabilities: [create-collation, icu-provider, builtin-provider, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_collation.sgml#sql-createcollation (Parameters: IF NOT EXISTS)"
sessions: [a]
steps:
  - sql: |
      CREATE COLLATION cmd_cc_ine (provider = icu, locale = 'und')
    expect: ok
  - sql: |
      CREATE COLLATION IF NOT EXISTS cmd_cc_ine (provider = builtin, locale = 'C')
    expect: notice
    comment: the notice says the collation already exists, skipping
  - sql: |
      CREATE COLLATION IF NOT EXISTS cmd_cc_ine FROM "C"
    expect: notice
  - sql: |
      SELECT collprovider FROM pg_collation WHERE collname = 'cmd_cc_ine'
    expect: rows
    order: ordered
    comment: the original ICU definition is still in place
