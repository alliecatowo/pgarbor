# Unquoted language names fold to lower case; quoted new names keep their case and must be quoted again to be used.
id: cmd-alter-language.rename-identifier-folding
title: Unquoted language names fold to lower case while quoted names keep their case
family: cmd-alter-language
tier: core
feature_ids: [alter-language, rename, identifiers, create-function]
required_capabilities: [alter-language, plpgsql, create-function, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Parameters: name, new_name)"
sessions: [a]
steps:
  - sql: |
      ALTER LANGUAGE PlPgSql RENAME TO PL_Folded
    expect: ok
    comment: unquoted PlPgSql and PL_Folded fold to plpgsql and pl_folded
  - sql: |
      SELECT lanname FROM pg_language WHERE lanname LIKE 'pl%' ORDER BY lanname
    expect: rows
    order: ordered
  - sql: |
      ALTER LANGUAGE pl_folded RENAME TO "MixedCase"
    expect: ok
  - sql: |
      SELECT lanname, lanname = 'MixedCase' AS exact_case FROM pg_language WHERE lanname = 'MixedCase'
    expect: rows
    order: ordered
  - sql: |
      CREATE FUNCTION g_quoted() RETURNS int LANGUAGE "MixedCase" AS $$ BEGIN RETURN 5; END $$
    expect: ok
  - sql: |
      CREATE FUNCTION h_unquoted() RETURNS int LANGUAGE mixedcase AS $$ BEGIN RETURN 6; END $$
    expect: error
    sqlstate: "42704"
    comment: unquoted mixedcase folds to a name that does not exist
  - sql: |
      SELECT g_quoted() AS v
    expect: rows
    order: ordered
