# The optional PROCEDURAL keyword is accepted in both the RENAME and OWNER forms.
id: cmd-alter-language.procedural-keyword
title: ALTER PROCEDURAL LANGUAGE is accepted as a synonym for ALTER LANGUAGE
family: cmd-alter-language
tier: core
feature_ids: [alter-language, procedural-keyword, rename]
required_capabilities: [alter-language, plpgsql, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Synopsis: ALTER [ PROCEDURAL ] LANGUAGE)"
sessions: [a]
steps:
  - sql: |
      ALTER PROCEDURAL LANGUAGE plpgsql RENAME TO pl_proc
    expect: ok
  - sql: |
      ALTER LANGUAGE pl_proc RENAME TO pl_plain
    expect: ok
    comment: the same statement without the keyword acts on the same language
  - sql: |
      SELECT lanname FROM pg_language WHERE lanname LIKE 'pl%' ORDER BY lanname
    expect: rows
    order: ordered
  - sql: |
      ALTER PROCEDURAL LANGUAGE pl_plain OWNER TO CURRENT_USER
    expect: ok
