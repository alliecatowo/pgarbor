# A new name that is already used by a language is rejected with duplicate_object; quoting makes "SQL" a different name.
id: cmd-alter-language.rename-to-existing-42710
title: Renaming a language to an existing language name fails with 42710
family: cmd-alter-language
tier: core
feature_ids: [alter-language, rename, error-handling]
required_capabilities: [alter-language, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Parameters: new_name)"
sessions: [a]
steps:
  - sql: |
      ALTER LANGUAGE plpgsql RENAME TO sql
    expect: error
    sqlstate: "42710"
    comment: sql is an existing language
  - sql: |
      ALTER LANGUAGE plpgsql RENAME TO plpgsql
    expect: error
    sqlstate: "42710"
    comment: renaming a language to its own name also conflicts with itself
  - sql: |
      SELECT lanname FROM pg_language ORDER BY lanname
    expect: rows
    order: ordered
  - sql: |
      ALTER LANGUAGE plpgsql RENAME TO "SQL"
    expect: ok
    comment: the quoted name SQL differs from sql because it is case-sensitive
  - sql: |
      SELECT lanname FROM pg_language ORDER BY lanname
    expect: rows
    order: ordered
