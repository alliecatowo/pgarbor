# ALTER LANGUAGE ... RENAME TO changes only the language name; the renamed language stays usable.
id: cmd-alter-language.rename-basic
title: ALTER LANGUAGE RENAME TO renames a procedural language and the new name can be used
family: cmd-alter-language
tier: core
feature_ids: [alter-language, rename, plpgsql, create-function]
required_capabilities: [alter-language, plpgsql, create-function, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Description; Parameters: name, new_name)"
sessions: [a]
steps:
  - sql: |
      ALTER LANGUAGE plpgsql RENAME TO pl_renamed
    expect: ok
  - sql: |
      SELECT lanname, lanpltrusted FROM pg_language WHERE lanname IN ('plpgsql', 'pl_renamed') ORDER BY lanname
    expect: rows
    order: ordered
    comment: only the new name is listed; lanpltrusted is unchanged
  - sql: |
      CREATE FUNCTION add_one(int) RETURNS int LANGUAGE pl_renamed AS $$ BEGIN RETURN $1 + 1; END $$
    expect: ok
  - sql: |
      SELECT add_one(41) AS v
    expect: rows
    order: ordered
