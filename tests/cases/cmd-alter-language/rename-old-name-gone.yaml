# After a rename the old language name no longer resolves for CREATE FUNCTION; the new name does.
id: cmd-alter-language.rename-old-name-gone
title: After renaming plpgsql, the old name is undefined and the new name works
family: cmd-alter-language
tier: core
feature_ids: [alter-language, rename, plpgsql, create-function]
required_capabilities: [alter-language, plpgsql, create-function, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Description: rename the language)"
sessions: [a]
steps:
  - sql: |
      ALTER LANGUAGE plpgsql RENAME TO pl_renamed
    expect: ok
  - sql: |
      CREATE FUNCTION f_old() RETURNS int LANGUAGE plpgsql AS $$ BEGIN RETURN 1; END $$
    expect: error
    sqlstate: "42704"
    comment: the language is no longer named plpgsql
  - sql: |
      SELECT count(*) AS n FROM pg_language WHERE lanname = 'plpgsql'
    expect: rows
    order: ordered
  - sql: |
      DO $$ BEGIN NULL; END $$ LANGUAGE pl_renamed
    expect: ok
    comment: an anonymous block runs in the renamed language
