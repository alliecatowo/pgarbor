# OWNER TO a role name that does not exist fails with undefined_object and leaves the owner unchanged.
id: cmd-alter-language.owner-nonexistent-role-42704
title: ALTER LANGUAGE OWNER TO an unknown role fails with 42704 and keeps the owner
family: cmd-alter-language
tier: core
feature_ids: [alter-language, owner, roles, error-handling]
required_capabilities: [alter-language, roles, plpgsql, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Parameters: new_owner)"
sessions: [a]
steps:
  - sql: |
      ALTER LANGUAGE plpgsql OWNER TO al_no_such_role_zz
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER LANGUAGE no_such_lang OWNER TO CURRENT_USER
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT lanowner = (SELECT oid FROM pg_roles WHERE rolname = CURRENT_USER) AS unchanged FROM pg_language WHERE lanname = 'plpgsql'
    expect: rows
    order: ordered
