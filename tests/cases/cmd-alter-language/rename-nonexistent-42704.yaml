# Renaming or changing the owner of a language that does not exist fails with undefined_object.
id: cmd-alter-language.rename-nonexistent-42704
title: ALTER LANGUAGE on a missing language name fails with 42704 and changes nothing
family: cmd-alter-language
tier: core
feature_ids: [alter-language, rename, error-handling]
required_capabilities: [alter-language, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Parameters: name)"
sessions: [a]
steps:
  - sql: |
      ALTER LANGUAGE no_such_lang RENAME TO whatever
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER LANGUAGE no_such_lang OWNER TO CURRENT_USER
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER LANGUAGE "PLPGSQL" RENAME TO pl_x
    expect: error
    sqlstate: "42704"
    comment: a quoted name is case-sensitive, so "PLPGSQL" does not match plpgsql
  - sql: |
      SELECT lanname FROM pg_language ORDER BY lanname
    expect: rows
    order: ordered
    comment: the catalog is unchanged after the failed statements
