# A superuser can transfer a language to another role, and OWNER TO CURRENT_USER transfers it back.
id: cmd-alter-language.owner-transfer-to-role
title: ALTER LANGUAGE OWNER TO a role changes the owner and can be reverted to the current user
family: cmd-alter-language
tier: core
feature_ids: [alter-language, owner, roles]
required_capabilities: [alter-language, roles, plpgsql, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Synopsis: OWNER TO new_owner; Parameters: new_owner)"
sessions: [a]
setup: |
  DROP ROLE IF EXISTS al_lo_owner1;
  CREATE ROLE al_lo_owner1 NOLOGIN;
steps:
  - sql: |
      ALTER LANGUAGE plpgsql OWNER TO al_lo_owner1
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(lanowner) = 'al_lo_owner1' AS new_owner FROM pg_language WHERE lanname = 'plpgsql'
    expect: rows
    order: ordered
  - sql: |
      ALTER LANGUAGE plpgsql OWNER TO CURRENT_USER
    expect: ok
  - sql: |
      SELECT lanowner = (SELECT oid FROM pg_roles WHERE rolname = CURRENT_USER) AS is_current_user FROM pg_language WHERE lanname = 'plpgsql'
    expect: rows
    order: ordered
