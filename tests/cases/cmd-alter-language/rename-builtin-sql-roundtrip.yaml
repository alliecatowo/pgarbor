# The built-in sql language can be renamed and renamed back; a function created under the alias keeps working.
id: cmd-alter-language.rename-builtin-sql-roundtrip
title: Renaming the built-in sql language and back keeps functions written in either name working
family: cmd-alter-language
tier: extended
feature_ids: [alter-language, rename, sql-functions, create-function]
required_capabilities: [alter-language, create-function, sql-functions, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Parameters: name, new_name)"
sessions: [a]
steps:
  - sql: |
      ALTER LANGUAGE sql RENAME TO sql_alias
    expect: ok
  - sql: |
      CREATE FUNCTION s1() RETURNS int LANGUAGE sql_alias AS 'SELECT 7'
    expect: ok
  - sql: |
      ALTER LANGUAGE sql_alias RENAME TO sql
    expect: ok
  - sql: |
      CREATE FUNCTION s2() RETURNS int LANGUAGE sql AS 'SELECT 8'
    expect: ok
  - sql: |
      SELECT s1() + s2() AS total
    expect: rows
    order: ordered
    comment: s1 was created under the alias and still runs after the rename back
