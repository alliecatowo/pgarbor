# ALTER LANGUAGE is transactional: a rename inside a rolled-back transaction is undone.
id: cmd-alter-language.rename-rollback
title: A language rename inside a transaction that is rolled back leaves the old name in place
family: cmd-alter-language
tier: core
feature_ids: [alter-language, rename, transactions, plpgsql]
required_capabilities: [alter-language, plpgsql, transactions, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_language.sgml#sql-alterlanguage (Description)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      ALTER LANGUAGE plpgsql RENAME TO pl_tmp
    expect: ok
  - sql: |
      SELECT lanname FROM pg_language WHERE lanname IN ('plpgsql', 'pl_tmp') ORDER BY lanname
    expect: rows
    order: ordered
    comment: the rename is visible inside its own transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT lanname FROM pg_language WHERE lanname IN ('plpgsql', 'pl_tmp') ORDER BY lanname
    expect: rows
    order: ordered
  - sql: |
      DO $$ BEGIN NULL; END $$
    expect: ok
    comment: the default plpgsql language is usable again
