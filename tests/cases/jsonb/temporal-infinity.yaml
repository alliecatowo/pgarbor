# to_jsonb of date and timestamp, including infinite values, produces JSON strings.
id: jsonb.temporal-infinity
title: to_jsonb renders dates and timestamps as strings, including infinity values
family: jsonb
tier: extended
feature_ids: [jsonb, jsonb-functions, date-time]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT to_jsonb(date '2014-05-28') AS plain_date, to_jsonb(timestamp '2014-05-28 12:22:35.614298') AS plain_ts
    expect: rows
    order: ordered
  - sql: |
      SELECT to_jsonb(date 'infinity') AS inf_date, to_jsonb(date '-infinity') AS ninf_date, to_jsonb(timestamp 'infinity') AS inf_ts, to_jsonb(timestamp '-infinity') AS ninf_ts
    expect: rows
    order: ordered
    comment: infinite values serialize as the strings infinity and -infinity
