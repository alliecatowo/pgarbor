# jsonb_build_object: NULL values are allowed, NULL keys are not (22023).
id: jsonb.build-object-null-key
title: jsonb_build_object accepts NULL values and rejects NULL keys with 22023
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-functions, nulls, errors]
required_capabilities: [select, jsonb, nulls, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_build_object('a', NULL) AS null_value
    expect: rows
    order: ordered
    comment: a NULL value becomes JSON null
  - sql: |
      SELECT jsonb_build_object(NULL, 'a')
    expect: error
    sqlstate: "22023"
    comment: a NULL key is an error
  - sql: |
      SELECT jsonb_build_object(VARIADIC ARRAY[NULL, 'a']::text[])
    expect: error
    sqlstate: "22023"
    comment: same rule through VARIADIC
