# Invalid JSON string literals are rejected with invalid_text_representation.
id: jsonb.string-input-errors
title: Malformed JSON string literals raise 22P02
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-input, errors]
required_capabilities: [select, jsonb, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT $$''$$::jsonb
    expect: error
    sqlstate: "22P02"
    comment: single quotes are not JSON string delimiters
  - sql: |
      SELECT '"abc'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: unterminated string
  - sql: |
      SELECT E'"abc\ndef"'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: raw newline inside a string literal is not legal JSON
  - sql: |
      SELECT '"\v"'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: \v is not a valid JSON escape
  - sql: |
      SELECT '"\n\"\\"'::jsonb
    expect: rows
    order: ordered
    comment: legal escapes are accepted
