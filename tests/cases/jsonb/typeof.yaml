# jsonb_typeof reports the JSON type, distinguishing numbers and strings that look alike.
id: jsonb.typeof
title: jsonb_typeof returns object, array, null, number, boolean and string
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-functions]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_typeof('{}') AS object_empty, jsonb_typeof('{"c":3,"p":"o"}') AS object_full, jsonb_typeof('[]') AS array_empty, jsonb_typeof('["a", 1]') AS array_mixed
    expect: rows
    order: ordered
  - sql: |
      SELECT jsonb_typeof('null') AS json_null, jsonb_typeof('1') AS int_num, jsonb_typeof('-1.0') AS neg_dec, jsonb_typeof('1e2') AS exp_num, jsonb_typeof('true') AS t, jsonb_typeof('false') AS f
    expect: rows
    order: ordered
  - sql: |
      SELECT jsonb_typeof('"hello"') AS str, jsonb_typeof('"true"') AS quoted_true, jsonb_typeof('"1.0"') AS quoted_num
    expect: rows
    order: ordered
    comment: quoted literals are strings, not booleans or numbers
