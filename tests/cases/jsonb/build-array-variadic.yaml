# jsonb_build_array with mixed-type arguments and VARIADIC arrays, including NULL array and empty array.
id: jsonb.build-array-variadic
title: jsonb_build_array mixes SQL types and expands VARIADIC arrays, NULL array yields empty
family: jsonb
tier: extended
feature_ids: [jsonb, jsonb-functions, nulls]
required_capabilities: [select, jsonb, nulls]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_build_array('a', 1, 'b', 1.2, 'c', true, 'd', null, 'e', json '{"x": 3, "y": [1,2,3]}') AS mixed
    expect: rows
    order: ordered
  - sql: |
      SELECT jsonb_build_array('a', NULL) AS with_null, jsonb_build_array(VARIADIC NULL::text[]) AS null_array, jsonb_build_array(VARIADIC '{}'::text[]) AS empty_array
    expect: rows
    order: ordered
  - sql: |
      SELECT jsonb_build_array(VARIADIC '{{1,4},{2,5},{3,6}}'::int[][]) AS multidim
    expect: rows
    order: ordered
    comment: a multidimensional array is flattened element by element
