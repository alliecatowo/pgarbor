# jsonb_each and jsonb_each_text expand top-level members; text form turns JSON null into SQL NULL.
id: jsonb.each-expansion
title: jsonb_each and jsonb_each_text expand top-level object members
family: jsonb
tier: extended
feature_ids: [jsonb, jsonb-functions, set-returning]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT key, value FROM jsonb_each('{"f1":[1,2,3],"f2":{"f3":1},"f4":null,"f5":99,"f6":"stringy"}') AS q ORDER BY key
    expect: rows
    order: ordered
  - sql: |
      SELECT key, value, value IS NULL AS value_is_sql_null FROM jsonb_each_text('{"f1":[1,2,3],"f2":{"f3":1},"f4":null,"f5":"null"}') AS q ORDER BY key
    expect: rows
    order: ordered
    comment: JSON null becomes SQL NULL in the text form, the string "null" stays a string
