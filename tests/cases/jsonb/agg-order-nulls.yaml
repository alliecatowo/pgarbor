# jsonb_agg with ORDER BY and NULLS FIRST over a table containing a NULL sort key.
id: jsonb.agg-order-nulls
title: jsonb_agg respects ORDER BY with NULLS FIRST over rows with a NULL key
family: jsonb
tier: extended
feature_ids: [jsonb, jsonb-aggregates, nulls, create-table, insert]
required_capabilities: [create-table, insert, select, jsonb, nulls]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE rws (x int4, y text);
  INSERT INTO rws VALUES (1, 'a'), (2, 'b'), (3, 'c');
  UPDATE rws SET x = NULL WHERE x = 1;
steps:
  - sql: |
      SELECT jsonb_agg(q ORDER BY x, y) AS default_order FROM rws q
    expect: rows
    order: ordered
    comment: default NULL ordering in ascending sort puts NULLs last
  - sql: |
      SELECT jsonb_agg(q ORDER BY x NULLS FIRST, y) AS nulls_first FROM rws q
    expect: rows
    order: ordered
