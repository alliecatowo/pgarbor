# jsonb_build_object needs key/value pairs; an odd argument count is 22023.
id: jsonb.build-object-odd-args
title: jsonb_build_object with odd argument count raises 22023, empty call yields an empty object
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-functions, errors]
required_capabilities: [select, jsonb, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_build_object('a', 'b', 'c')
    expect: error
    sqlstate: "22023"
    comment: three arguments, last key has no value
  - sql: |
      SELECT jsonb_build_object() AS empty_obj, jsonb_build_array() AS empty_arr
    expect: rows
    order: ordered
