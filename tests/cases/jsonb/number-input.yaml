# Legal JSON numbers are accepted; out-of-range magnitudes are stored, not rejected.
id: jsonb.number-input
title: JSON number literals accepted, including values beyond int8 range
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-input, numeric]
required_capabilities: [select, jsonb, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '1'::jsonb, '0'::jsonb, '0.1'::jsonb, '-1.0'::jsonb, '1e2'::jsonb
    expect: rows
    order: ordered
  - sql: |
      SELECT '9223372036854775808'::jsonb, '1.3e100'::jsonb
    expect: rows
    order: ordered
    comment: larger than int8 max, still a valid jsonb number
  - sql: |
      SELECT jsonb_typeof('1e2'::jsonb), jsonb_typeof('-1.0'::jsonb)
    expect: rows
    order: ordered
