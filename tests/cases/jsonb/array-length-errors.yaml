# jsonb_array_length accepts arrays only; scalars and objects raise 22023.
id: jsonb.array-length-errors
title: jsonb_array_length counts array elements and rejects non-arrays with 22023
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-functions, errors]
required_capabilities: [select, jsonb, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_array_length('[1,2,3,{"f1":1,"f2":[5,6]},4]') AS nested_len, jsonb_array_length('[]') AS empty_len
    expect: rows
    order: ordered
    comment: only top-level elements are counted
  - sql: |
      SELECT jsonb_array_length('{"f1":1,"f2":[5,6]}')
    expect: error
    sqlstate: "22023"
    comment: object is not an array
  - sql: |
      SELECT jsonb_array_length('4')
    expect: error
    sqlstate: "22023"
    comment: scalar is not an array
