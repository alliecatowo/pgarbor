# Scalar JSON literals parse and print; surrounding whitespace is allowed.
id: jsonb.scalar-literals
title: Scalar JSON literals (string, number, boolean, null) are accepted as jsonb
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-input, select]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '""'::jsonb, '"abc"'::jsonb, 'true'::jsonb, 'false'::jsonb, 'null'::jsonb, ' true '::jsonb
    expect: rows
    order: ordered
    comment: empty string, plain string, booleans, JSON null (not SQL NULL), whitespace-padded input
  - sql: |
      SELECT 'null'::jsonb IS NULL AS sql_null, ('null'::jsonb IS JSON SCALAR) AS json_scalar, jsonb_typeof('null'::jsonb) AS json_type
    expect: rows
    order: ordered
    comment: JSON null is a jsonb value, not an SQL NULL
