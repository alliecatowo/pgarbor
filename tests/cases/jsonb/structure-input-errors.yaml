# Malformed arrays, objects and empty input are rejected with 22P02.
id: jsonb.structure-input-errors
title: Malformed JSON arrays, objects and empty input raise 22P02
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-input, errors]
required_capabilities: [select, jsonb, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '[1,2,]'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: trailing comma
  - sql: |
      SELECT '[1,[2]'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: missing closing bracket
  - sql: |
      SELECT '{"abc"}'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: key without value
  - sql: |
      SELECT '{1:"abc"}'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: object keys must be strings
  - sql: |
      SELECT '{"abc":1:2}'::jsonb
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'true false'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: two top-level values
  - sql: |
      SELECT 'truf'::jsonb
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '    '::jsonb
    expect: error
    sqlstate: "22P02"
    comment: whitespace only is no value
  - sql: |
      SELECT ''::jsonb
    expect: error
    sqlstate: "22P02"
