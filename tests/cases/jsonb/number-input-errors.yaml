# Numbers that are not legal JSON are rejected with 22P02.
id: jsonb.number-input-errors
title: Illegal JSON number literals raise 22P02
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-input, errors]
required_capabilities: [select, jsonb, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '01'::jsonb
    expect: error
    sqlstate: "22P02"
    comment: leading zero
  - sql: |
      SELECT '1f2'::jsonb
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '0.x1'::jsonb
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '1.3ex100'::jsonb
    expect: error
    sqlstate: "22P02"
