# pg_input_is_valid reports validity as a boolean without raising an error.
id: jsonb.input-is-valid
title: pg_input_is_valid returns true or false for jsonb text without raising
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-input, errors]
required_capabilities: [select, jsonb, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('{"a":true}', 'jsonb') AS valid_obj, pg_input_is_valid('{"a":true', 'jsonb') AS unclosed_obj, pg_input_is_valid('01', 'jsonb') AS leading_zero
    expect: rows
    order: ordered
    comment: no error is raised for invalid input
