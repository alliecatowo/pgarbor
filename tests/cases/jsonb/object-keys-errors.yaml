# jsonb_object_keys returns keys of an object and raises 22023 for arrays and scalars.
id: jsonb.object-keys-errors
title: jsonb_object_keys lists top-level keys and rejects arrays and scalars with 22023
family: jsonb
tier: core
feature_ids: [jsonb, jsonb-functions, errors]
required_capabilities: [select, jsonb, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT k FROM jsonb_object_keys('{"field1":"val1","field2":"val2","field3":null,"field4":4,"field6":{"f1":9}}') AS k ORDER BY k
    expect: rows
    order: ordered
  - sql: |
      SELECT jsonb_object_keys('["zero","one"]')
    expect: error
    sqlstate: "22023"
    comment: array argument
  - sql: |
      SELECT jsonb_object_keys('"a scalar"')
    expect: error
    sqlstate: "22023"
    comment: scalar argument
