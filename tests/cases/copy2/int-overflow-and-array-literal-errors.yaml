# Input-conversion errors: out-of-range integer, malformed array element, and a valid array with NULL.
id: copy2.int-overflow-and-array-literal-errors
title: Integer out of range, malformed int array literal, and NULL array elements
family: copy2
tier: core
feature_ids: [types-int, arrays, errors, casts]
required_capabilities: [select, int4, arrays, errors]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/copy2.sql
  license: PostgreSQL
steps:
  - sql: |
      SELECT '{1}'::int4[] AS arr
    expect: rows
  - sql: |
      SELECT '2147483647'::int4 AS max_int
    expect: rows
  - sql: |
      SELECT '3333333333'::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '{a, 4}'::int4[]
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '{2,NULL,4}'::int4[] AS arr_with_null
    expect: rows
  - sql: |
      SELECT 2147483647::int4 + 1
    expect: error
    sqlstate: "22003"
