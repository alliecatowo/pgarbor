# NULL propagation versus empty string, and backslash handling in standard and escape string literals.
id: copy2.null-and-backslash-literals
title: NULL versus empty string and backslash-N literal handling
family: copy2
tier: core
feature_ids: [text, null-semantics, string-literals, operators]
required_capabilities: [select, text, null-semantics]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/copy2.sql
  license: PostgreSQL
steps:
  - sql: |
      SELECT NULL::text IS NULL AS null_is_null, ''::text IS NULL AS empty_is_null, '\N'::text AS backslash_n, length('\N') AS len_bs_n, E'\\N' = '\N' AS same_literal, length(E'\\h') AS len_bs_h, length(E'\t') AS len_tab
    expect: rows
  - sql: |
      SELECT NULL::text || 'x' AS concat_null, coalesce(NULL::text, '') = '' AS coalesce_empty, NULL = NULL AS eq_null
    expect: rows
  - sql: |
      SELECT '' = '' AS empty_eq, '\N' = 'N' AS bs_n_eq_n
    expect: rows
