# Grammar: a name is required, and CASCADE and RESTRICT are mutually exclusive.
id: cmd-drop-collation.syntax-errors
title: "DROP COLLATION rejects a missing name and both CASCADE and RESTRICT"
family: cmd-drop-collation
tier: core
feature_ids: [drop-collation, syntax]
required_capabilities: [drop-collation]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_collation.sgml#sql-dropcollation (Synopsis)"
sessions: [a]
steps:
  - sql: |
      DROP COLLATION
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP COLLATION IF EXISTS
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP COLLATION dc_syn CASCADE RESTRICT
    expect: error
    sqlstate: "42601"
    comment: CASCADE and RESTRICT cannot both be given
