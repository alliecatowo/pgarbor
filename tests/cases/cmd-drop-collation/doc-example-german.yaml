# Documented example: DROP COLLATION german removes a previously defined collation.
id: cmd-drop-collation.doc-example-german
title: "DROP COLLATION runs the documented german example and the name stops resolving"
family: cmd-drop-collation
tier: core
feature_ids: [drop-collation, icu-collation]
required_capabilities: [create-collation, drop-collation, icu-provider, collate-clause, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_collation.sgml#sql-dropcollation (Examples: drop german)"
sessions: [a]
setup: |
  CREATE COLLATION german (provider = icu, locale = 'de-DE');
steps:
  - sql: |
      SELECT count(*) FROM pg_collation WHERE collname = 'german'
    expect: rows
    order: ordered
  - sql: |
      DROP COLLATION german
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_collation WHERE collname = 'german'
    expect: rows
    order: ordered
  - sql: |
      SELECT 'a' COLLATE german
    expect: error
    sqlstate: "42704"
    comment: the dropped collation no longer resolves
