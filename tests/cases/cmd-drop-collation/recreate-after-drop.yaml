# After a drop the name is free: a new collation with the same name can be created and used.
id: cmd-drop-collation.recreate-after-drop
title: "A dropped collation name can be created again and used for ordering"
family: cmd-drop-collation
tier: core
feature_ids: [drop-collation, create-collation, icu-collation, collate-clause]
required_capabilities: [create-collation, drop-collation, icu-provider, collate-clause]
provenance:
  source: hand
  ref: "PG18 docs drop_collation.sgml#sql-dropcollation; sql-createcollation.html"
sessions: [a]
setup: |
  CREATE COLLATION dc_re (provider = icu, locale = 'de-DE');
steps:
  - sql: |
      DROP COLLATION dc_re
    expect: ok
  - sql: |
      CREATE COLLATION dc_re (provider = icu, locale = 'und-x-icu')
    expect: ok
  - sql: |
      SELECT x FROM (VALUES ('b' COLLATE dc_re), ('A' COLLATE dc_re), ('a' COLLATE dc_re)) AS v(x) ORDER BY x
    expect: rows
    order: ordered
    comment: root locale ordering, case before or after letters per ICU
  - sql: |
      DROP COLLATION dc_re
    expect: ok
