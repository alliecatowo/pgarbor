# The built-in C collation is required by the database system and cannot be dropped, even by a superuser.
id: cmd-drop-collation.pinned-system-collation
title: "DROP COLLATION refuses to drop the built-in C collation"
family: cmd-drop-collation
tier: core
feature_ids: [drop-collation, system-objects, restrict]
required_capabilities: [drop-collation, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 docs drop_collation.sgml#sql-dropcollation (collation must exist and be owned); pg_collation catalog"
sessions: [a]
steps:
  - sql: |
      DROP COLLATION "C"
    expect: error
    sqlstate: "2BP01"
    comment: cannot drop collation C because it is required by the database system
  - sql: |
      SELECT collname FROM pg_collation WHERE collname = 'C' AND collnamespace = 'pg_catalog'::regnamespace
    expect: rows
    order: ordered
