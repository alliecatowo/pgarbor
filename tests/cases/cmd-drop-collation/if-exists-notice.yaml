# IF EXISTS: dropping an existing collation is silent; a missing one (or one in a missing schema) only emits a NOTICE.
id: cmd-drop-collation.if-exists-notice
title: "DROP COLLATION IF EXISTS is silent for existing names and issues a notice for missing ones"
family: cmd-drop-collation
tier: core
feature_ids: [drop-collation, if-exists, icu-collation]
required_capabilities: [create-collation, drop-collation, icu-provider, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_collation.sgml#sql-dropcollation (IF EXISTS: notice issued if collation does not exist)"
sessions: [a]
setup: |
  CREATE COLLATION dc_ifx (provider = icu, locale = 'de-DE');
steps:
  - sql: |
      DROP COLLATION IF EXISTS dc_ifx
    expect: ok
    comment: existing collation is dropped without a notice
  - sql: |
      DROP COLLATION IF EXISTS dc_ifx
    expect: notice
    comment: second drop of the same name only notices
  - sql: |
      DROP COLLATION IF EXISTS no_such_collation
    expect: notice
  - sql: |
      SELECT count(*) FROM pg_collation WHERE collname = 'dc_ifx'
    expect: rows
    order: ordered
