# Bound cursor with one argument: OPEN with positional, := and => notation, reopened after CLOSE.
id: doc-plpgsql-cursors.bound-cursor-args-positional-named
title: Bound cursor arguments passed positionally and by name
family: doc-plpgsql-cursors
tier: core
feature_ids: [plpgsql-cursors, bound-cursor, cursor-arguments, open, named-notation]
required_capabilities: [plpgsql, cursors, create-function, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-cursors"
sessions: [a]
setup: |
  CREATE TABLE items (id int PRIMARY KEY, grp int NOT NULL, name text);
  INSERT INTO items VALUES (1, 1, 'a'), (2, 1, 'b'), (3, 1, 'c'), (4, 2, 'd');
  CREATE FUNCTION bound_by_notation() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE
    c CURSOR (k int) FOR SELECT name FROM items WHERE id = k;
    r text;
    out text := '';
  BEGIN
    OPEN c(3);
    FETCH c INTO r;
    out := out || r;
    CLOSE c;
    OPEN c(k := 4);
    FETCH c INTO r;
    out := out || r;
    CLOSE c;
    OPEN c(k => 1);
    FETCH c INTO r;
    out := out || r;
    CLOSE c;
    RETURN out;
  END $$;
steps:
  - sql: |
      SELECT bound_by_notation()
    expect: rows
    comment: positional, := and => forms are all accepted for a bound cursor argument
