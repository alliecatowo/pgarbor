# A function opens a cursor on the caller-supplied portal name and returns it; the caller fetches from it.
id: doc-plpgsql-cursors.return-refcursor-caller-fetch
title: Function returns a refcursor opened under a caller-chosen portal name
family: doc-plpgsql-cursors
tier: core
feature_ids: [plpgsql-cursors, refcursor-return, portal-name, fetch-all]
required_capabilities: [plpgsql, cursors, create-function, create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-cursors"
sessions: [a]
setup: |
  CREATE TABLE test (col text);
  INSERT INTO test VALUES ('123');
  CREATE FUNCTION reffunc(refcursor) RETURNS refcursor AS '
  BEGIN
      OPEN $1 FOR SELECT col FROM test;
      RETURN $1;
  END;
  ' LANGUAGE plpgsql;
steps:
  - sql: |
      BEGIN;
      SELECT reffunc('funccursor');
      FETCH ALL IN funccursor;
      COMMIT
    expect: ok
    comment: the returned refcursor value is the portal name the caller supplied
