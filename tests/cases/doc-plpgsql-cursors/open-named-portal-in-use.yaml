# A cursor variable with a non-null name uses that name as its portal; opening it again while open fails.
id: doc-plpgsql-cursors.open-named-portal-in-use
title: Reopening a cursor whose named portal is still open fails
family: doc-plpgsql-cursors
tier: core
feature_ids: [plpgsql-cursors, portal-name, open-for-query]
required_capabilities: [plpgsql, cursors, create-function, create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-cursors"
sessions: [a]
setup: |
  CREATE TABLE items (id int PRIMARY KEY, grp int NOT NULL, name text);
  INSERT INTO items VALUES (1, 1, 'a'), (2, 1, 'b'), (3, 1, 'c'), (4, 2, 'd');
  CREATE FUNCTION open_twice_named() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE c refcursor := 'dup_portal';
  BEGIN
    OPEN c FOR SELECT 1;
    OPEN c FOR SELECT 2;
    RETURN 'unreachable';
  END $$;
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT open_twice_named()
    expect: error
    sqlstate: "42P03"
  - sql: |
      ROLLBACK
    expect: ok
