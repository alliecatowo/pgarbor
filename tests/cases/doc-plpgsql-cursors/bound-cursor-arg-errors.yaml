# Compile-time errors for cursor arguments: OPEN must supply arguments iff the cursor declares them.
id: doc-plpgsql-cursors.bound-cursor-arg-errors
title: Opening a bound cursor with missing or unexpected arguments is rejected
family: doc-plpgsql-cursors
tier: core
feature_ids: [plpgsql-cursors, bound-cursor, cursor-arguments, open]
required_capabilities: [plpgsql, cursors, create-function, create-table, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-open-bound-cursor"
sessions: [a]
setup: |
  CREATE TABLE items (id int PRIMARY KEY, grp int NOT NULL, name text);
steps:
  - sql: |
      CREATE FUNCTION cursor_needs_arg_but_none_given() RETURNS text LANGUAGE plpgsql AS $$
      DECLARE c CURSOR (g int) FOR SELECT name FROM items WHERE grp = g; r text;
      BEGIN OPEN c; FETCH c INTO r; RETURN r; END $$
    expect: error
    sqlstate: "42601"
    comment: a cursor that declares arguments must be opened with them
  - sql: |
      CREATE FUNCTION cursor_has_no_args_but_given() RETURNS text LANGUAGE plpgsql AS $$
      DECLARE c CURSOR FOR SELECT name FROM items; r text;
      BEGIN OPEN c(1); FETCH c INTO r; RETURN r; END $$
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE FUNCTION cursor_too_few_args() RETURNS text LANGUAGE plpgsql AS $$
      DECLARE c CURSOR (g int, h int) FOR SELECT name FROM items WHERE grp = g AND id = h; r text;
      BEGIN OPEN c(1); RETURN 'x'; END $$
    expect: error
    sqlstate: "42601"
    comment: two declared arguments, one supplied
