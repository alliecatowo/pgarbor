# FOR over a bound cursor with arguments opens and closes it: a loop exited early leaves it closed, so it can be reopened.
id: doc-plpgsql-cursors.for-loop-bound-cursor-args-autoclose
title: FOR over a bound cursor with arguments closes on exit and handles empty results
family: doc-plpgsql-cursors
tier: core
feature_ids: [plpgsql-cursors, for-cursor-loop, bound-cursor, cursor-arguments, exit-when]
required_capabilities: [plpgsql, cursors, create-function, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-cursors"
sessions: [a]
setup: |
  CREATE TABLE items (id int PRIMARY KEY, grp int NOT NULL, name text);
  INSERT INTO items VALUES (1, 1, 'a'), (2, 1, 'b'), (3, 1, 'c'), (4, 2, 'd');
  CREATE FUNCTION for_bound_args_exit(p_grp int) RETURNS text LANGUAGE plpgsql AS $$
  DECLARE
    c CURSOR (g int) FOR SELECT name FROM items WHERE grp = g ORDER BY id;
    r record;
    out text := '';
    n int := 0;
  BEGIN
    FOR r IN c(p_grp) LOOP
      out := out || r.name;
      n := n + 1;
      EXIT WHEN r.name = 'a';
    END LOOP;
    OPEN c(2);
    FETCH c INTO r;
    out := out || '/' || coalesce(r.name, 'NULL');
    CLOSE c;
    FOR r IN c(g := 5) LOOP
      n := n + 100;
    END LOOP;
    RETURN n || ':' || out;
  END $$;
steps:
  - sql: |
      SELECT for_bound_args_exit(1)
    expect: rows
    comment: the loop over group 1 exits at 'a', then the cursor is opened again for group 2
