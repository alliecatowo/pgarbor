# SCROLL cursor: FETCH ABSOLUTE, PRIOR, RELATIVE and LAST, including the NULL result past either end.
id: doc-plpgsql-cursors.scroll-absolute-relative-prior
title: SCROLL cursor moves with ABSOLUTE, PRIOR, RELATIVE and LAST
family: doc-plpgsql-cursors
tier: core
feature_ids: [plpgsql-cursors, scroll, fetch, absolute, relative, prior, last]
required_capabilities: [plpgsql, cursors, create-function, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-cursors"
sessions: [a]
setup: |
  CREATE TABLE items (id int PRIMARY KEY, grp int NOT NULL, name text);
  INSERT INTO items VALUES (1, 1, 'a'), (2, 1, 'b'), (3, 1, 'c'), (4, 2, 'd');
  CREATE FUNCTION scroll_absolute_prior() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE
    c SCROLL CURSOR FOR SELECT name FROM items ORDER BY id;
    r text;
    f boolean;
    out text := '';
  BEGIN
    OPEN c;
    FETCH ABSOLUTE 3 FROM c INTO r;
    out := out || r;
    FETCH PRIOR FROM c INTO r;
    out := out || r;
    FETCH PRIOR FROM c INTO r;
    out := out || r;
    FETCH PRIOR FROM c INTO r;
    f := FOUND;
    out := out || coalesce(r, 'NULL') || f;
    FETCH ABSOLUTE 0 FROM c INTO r;
    RETURN out || ' ' || coalesce(r, 'NULL');
  END $$;
  CREATE FUNCTION scroll_relative_last() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE
    curs4 SCROLL CURSOR FOR SELECT name FROM items ORDER BY id;
    x text;
  BEGIN
    OPEN curs4;
    FETCH LAST FROM curs4 INTO x;
    FETCH RELATIVE -2 FROM curs4 INTO x;
    RETURN x;
  END $$;
steps:
  - sql: |
      SELECT scroll_absolute_prior()
    expect: rows
    comment: the final PRIOR steps before the first row and yields no row
  - sql: |
      SELECT scroll_relative_last()
    expect: rows
