# One function returns SETOF refcursor, opening a separate cursor for each and returning both names.
id: doc-plpgsql-cursors.return-setof-refcursor-two-cursors
title: Function returns two open cursors as SETOF refcursor
family: doc-plpgsql-cursors
tier: core
feature_ids: [plpgsql-cursors, refcursor-return, setof, return-next, fetch-all]
required_capabilities: [plpgsql, cursors, create-function, create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-cursors"
sessions: [a]
setup: |
  CREATE TABLE table_1 (x int);
  CREATE TABLE table_2 (y int);
  INSERT INTO table_1 VALUES (1), (2);
  INSERT INTO table_2 VALUES (10);
  CREATE FUNCTION myfunc(refcursor, refcursor) RETURNS SETOF refcursor AS $$
  BEGIN
      OPEN $1 FOR SELECT * FROM table_1;
      RETURN NEXT $1;
      OPEN $2 FOR SELECT * FROM table_2;
      RETURN NEXT $2;
  END;
  $$ LANGUAGE plpgsql;
steps:
  - sql: |
      BEGIN;
      SELECT * FROM myfunc('a', 'b');
      FETCH ALL FROM a;
      FETCH ALL FROM b;
      COMMIT
    expect: ok
    order: ordered
