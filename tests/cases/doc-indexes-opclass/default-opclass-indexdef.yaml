# Documented: the default operator class is omitted from the index definition; explicit classes and sort options are shown.
id: doc-indexes-opclass.default-opclass-indexdef
title: Default opclass is implicit; explicit pattern opclass, DESC and NULLS LAST are rendered in the index definition
family: doc-indexes-opclass
tier: core
feature_ids: [create-index, opclass, sort-options]
required_capabilities: [create-table, insert, create-index, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (CREATE INDEX synopsis; default operator class per column)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE t (v varchar, n int4)
    expect: ok
  - sql: |
      CREATE INDEX t_v_default ON t (v);
      CREATE INDEX t_v_pattern ON t (v varchar_pattern_ops);
      CREATE INDEX t_v_pattern_desc ON t (v varchar_pattern_ops DESC NULLS LAST);
      CREATE INDEX t_n_default ON t (n int4_ops ASC NULLS FIRST)
    expect: ok
  - sql: |
      SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 't' ORDER BY indexname
    expect: rows
    order: ordered
