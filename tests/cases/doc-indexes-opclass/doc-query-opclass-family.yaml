# Documented query (indexes-opclass): operator class to operator family mapping.
id: doc-indexes-opclass.doc-query-opclass-family
title: Documented query showing the operator family of each operator class
family: doc-indexes-opclass
tier: core
feature_ids: [opclass, operator-family, catalog-query]
required_capabilities: [catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (expanded query with pg_opfamily)"
sessions: [a]
steps:
  - sql: |
      SELECT am.amname AS index_method,
             opc.opcname AS opclass_name,
             opf.opfname AS opfamily_name,
             opc.opcintype::regtype AS indexed_type,
             opc.opcdefault AS is_default
          FROM pg_am am, pg_opclass opc, pg_opfamily opf
          WHERE opc.opcmethod = am.oid AND
                opc.opcfamily = opf.oid
          ORDER BY index_method, opclass_name
    expect: rows
    order: multiset
