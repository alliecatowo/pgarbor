# Documented: several indexes may exist on the same column with different operator classes.
id: doc-indexes-opclass.multiple-indexes-same-column
title: Two indexes on one column with different operator classes coexist
family: doc-indexes-opclass
tier: core
feature_ids: [create-index, opclass, multiple-indexes]
required_capabilities: [create-table, insert, create-index, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (It is possible to create multiple indexes on the same column with different operator classes)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE mt (v varchar)
    expect: ok
  - sql: |
      CREATE INDEX mt_default ON mt (v);
      CREATE INDEX mt_pattern ON mt (v varchar_pattern_ops)
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_indexes WHERE tablename = 'mt'
    expect: rows
    order: ordered
  - sql: |
      SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'mt' ORDER BY indexname
    expect: rows
    order: ordered
