# Documented sort options (COLLATE, ASC/DESC) can be combined with an opclass; the accepted order is COLLATE before the opclass.
id: doc-indexes-opclass.collate-before-opclass
title: COLLATE, opclass and DESC combined in one index column
family: doc-indexes-opclass
tier: core
feature_ids: [create-index, opclass, collate, sort-options]
required_capabilities: [create-table, create-index, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (sort options COLLATE, ASC/DESC, NULLS FIRST/LAST with opclass)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ct (x text)
    expect: ok
  - sql: |
      CREATE INDEX ct_x ON ct (x COLLATE "C" text_pattern_ops DESC)
    expect: ok
  - sql: |
      SELECT indexdef FROM pg_indexes WHERE tablename = 'ct'
    expect: rows
    order: ordered
