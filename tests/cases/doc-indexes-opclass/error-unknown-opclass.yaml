# Documented: naming an operator class that does not exist for the access method fails.
id: doc-indexes-opclass.error-unknown-opclass
title: Unknown operator class name is rejected with undefined_object
family: doc-indexes-opclass
tier: core
feature_ids: [create-index, opclass, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (opclass must name an existing operator class)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE u (i int4)
    expect: ok
  - sql: |
      CREATE INDEX u_i ON u (i no_such_ops)
    expect: error
    sqlstate: "42704"
