# Documented: text/varchar/bpchar pattern operator classes exist for btree and are not default operator classes.
id: doc-indexes-opclass.pattern-ops-catalog-flags
title: text, varchar and bpchar pattern operator classes exist for btree and are non-default
family: doc-indexes-opclass
tier: core
feature_ids: [opclass, text-pattern-ops, catalog-query]
required_capabilities: [catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (text_pattern_ops, varchar_pattern_ops, bpchar_pattern_ops for text, varchar, char)"
sessions: [a]
steps:
  - sql: |
      SELECT opc.opcname, opc.opcintype::regtype AS indexed_type, opc.opcdefault
        FROM pg_opclass opc
        JOIN pg_am am ON opc.opcmethod = am.oid
       WHERE am.amname = 'btree' AND opc.opcname LIKE '%pattern_ops'
       ORDER BY opc.opcname
    expect: rows
    order: ordered
