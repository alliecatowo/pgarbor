# Documented synopsis places sort options (including COLLATE) after the opclass, but the grammar rejects COLLATE after the opclass.
id: doc-indexes-opclass.error-collate-after-opclass
title: COLLATE written after the opclass is a syntax error
family: doc-indexes-opclass
tier: extended
feature_ids: [create-index, opclass, collate, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (CREATE INDEX synopsis: column opclass [ (opclass_options) ] sort options)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ec (x text)
    expect: ok
  - sql: |
      CREATE INDEX ec_x ON ec (x text_pattern_ops COLLATE "C")
    expect: error
    sqlstate: "42601"
    comment: documented synopsis suggests this order; PG grammar rejects it
