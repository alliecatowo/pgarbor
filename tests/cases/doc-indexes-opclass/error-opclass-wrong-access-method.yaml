# Documented: operator classes belong to one access method; text_pattern_ops is a B-tree class, not GiST.
id: doc-indexes-opclass.error-opclass-wrong-access-method
title: text_pattern_ops is not available for a GiST index
family: doc-indexes-opclass
tier: extended
feature_ids: [create-index, opclass, gist-index, errors]
required_capabilities: [create-table, create-index, gist-index, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (operator classes are per access method, pg_opclass.opcmethod)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE g (x text)
    expect: ok
  - sql: |
      CREATE INDEX g_x ON g USING gist (x text_pattern_ops)
    expect: error
    sqlstate: "42704"
