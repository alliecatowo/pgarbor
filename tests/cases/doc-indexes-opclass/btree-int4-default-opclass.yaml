# Documented: a B-tree index on int4 uses int4_ops, which is the default operator class for that type.
id: doc-indexes-opclass.btree-int4-default-opclass
title: int4_ops is the default btree operator class for int4
family: doc-indexes-opclass
tier: core
feature_ids: [opclass, btree-index, default-opclass]
required_capabilities: [catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (B-tree index on int4 uses int4_ops)"
sessions: [a]
steps:
  - sql: |
      SELECT opc.opcname, opc.opcdefault
        FROM pg_opclass opc
        JOIN pg_am am ON opc.opcmethod = am.oid
       WHERE am.amname = 'btree' AND opc.opcintype = 'int4'::regtype
       ORDER BY opc.opcname
    expect: rows
    order: multiset
