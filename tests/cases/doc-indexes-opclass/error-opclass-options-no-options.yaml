# Documented opclass_options syntax: built-in operator classes accept no options, so supplying any is an error.
id: doc-indexes-opclass.error-opclass-options-no-options
title: Options passed to a built-in operator class are rejected
family: doc-indexes-opclass
tier: extended
feature_ids: [create-index, opclass, opclass-options, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (CREATE INDEX synopsis: opclass [ ( opclass_options ) ])"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE o (i int4)
    expect: ok
  - sql: |
      CREATE INDEX o_i ON o (i int4_ops (foo = 1))
    expect: error
    sqlstate: "22023"
