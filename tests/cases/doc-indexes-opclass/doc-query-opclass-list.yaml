# Documented query (indexes-opclass): list all operator classes by access method and name.
id: doc-indexes-opclass.doc-query-opclass-list
title: Documented query listing all operator classes by index method
family: doc-indexes-opclass
tier: core
feature_ids: [opclass, catalog-query]
required_capabilities: [catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (first query: all defined operator classes)"
sessions: [a]
steps:
  - sql: |
      SELECT am.amname AS index_method,
             opc.opcname AS opclass_name,
             opc.opcintype::regtype AS indexed_type,
             opc.opcdefault AS is_default
          FROM pg_am am, pg_opclass opc
          WHERE opc.opcmethod = am.oid
          ORDER BY index_method, opclass_name
    expect: rows
    order: multiset
