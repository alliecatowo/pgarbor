# Documented: an operator class must accept the column's data type.
id: doc-indexes-opclass.error-opclass-type-mismatch
title: text_pattern_ops on an integer column is rejected
family: doc-indexes-opclass
tier: core
feature_ids: [create-index, opclass, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (operator class is chosen for the column's data type)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE n (i int4)
    expect: ok
  - sql: |
      CREATE INDEX n_i ON n (i text_pattern_ops)
    expect: error
    sqlstate: "42804"
