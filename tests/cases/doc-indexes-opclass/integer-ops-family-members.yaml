# Documented: operator classes for several types are grouped into one operator family (integer_ops for int2/int4/int8 in btree).
id: doc-indexes-opclass.integer-ops-family-members
title: The btree integer_ops family groups int2, int4 and int8 operator classes
family: doc-indexes-opclass
tier: core
feature_ids: [operator-family, btree-index, opclass]
required_capabilities: [catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (operator family groups classes for several data types)"
sessions: [a]
steps:
  - sql: |
      SELECT opc.opcname, opc.opcintype::regtype AS indexed_type, opc.opcdefault
        FROM pg_opclass opc
        JOIN pg_am am ON opc.opcmethod = am.oid
        JOIN pg_opfamily f ON opc.opcfamily = f.oid
       WHERE am.amname = 'btree' AND f.opfname = 'integer_ops'
       ORDER BY opc.opcname
    expect: rows
    order: ordered
