# Documented query (indexes-opclass): every operator family and the operators it contains.
id: doc-indexes-opclass.doc-query-opfamily-operators
title: Documented query listing every operator family and its operators
family: doc-indexes-opclass
tier: core
feature_ids: [operator-family, catalog-query]
required_capabilities: [catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-opclass (query listing operator families and member operators)"
sessions: [a]
steps:
  - sql: |
      SELECT am.amname AS index_method,
             opf.opfname AS opfamily_name,
             amop.amopopr::regoperator AS opfamily_operator
          FROM pg_am am, pg_opfamily opf, pg_amop amop
          WHERE opf.opfmethod = am.oid AND
                amop.amopfamily = opf.oid
          ORDER BY index_method, opfamily_name, opfamily_operator
    expect: rows
    order: multiset
