# time plus or minus interval wraps around the day and ignores the day and month parts; time minus time gives an interval.
id: time.interval-arithmetic
title: time plus interval wraps past midnight and time minus time yields an interval
family: time
tier: core
feature_ids: [time, interval, operators]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 docs functions-datetime.html, time plus interval wraps and ignores date parts"
sessions: [a]
steps:
  - sql: |
      SELECT time '23:30' + interval '1 hour' AS wrapped
    expect: rows
    comment: wraps past midnight to the next time of day
  - sql: |
      SELECT time '00:30' - interval '1 hour' AS wrapped_back
    expect: rows
  - sql: |
      SELECT interval '1 hour' + time '10:00' AS commuted
    expect: rows
  - sql: |
      SELECT time '10:00' + interval '1 day 2 hours' AS day_ignored
    expect: rows
    comment: the day part of the interval does not affect a time value
  - sql: |
      SELECT time '13:00' - time '12:30' AS diff
    expect: rows
    comment: time minus time is an interval
