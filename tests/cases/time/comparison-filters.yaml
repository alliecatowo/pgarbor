# Range predicates on a time(2) column with untyped string literals, including an empty result and BETWEEN.
id: time.comparison-filters
title: Time comparison filters with untyped literals select the expected rows
family: time
tier: core
feature_ids: [time, where, comparison-operators]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE time_tbl (f1 time(2));
  INSERT INTO time_tbl VALUES ('00:00'), ('01:00'), ('02:03 PST'), ('11:59 EDT'), ('12:00'), ('12:01'), ('23:59'), ('11:59:59.99 PM');
steps:
  - sql: |
      SELECT f1 FROM time_tbl WHERE f1 < '05:06:07' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM time_tbl WHERE f1 > '05:06:07' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM time_tbl WHERE f1 < '00:00' ORDER BY f1
    expect: rows
    order: ordered
    comment: nothing is before midnight
  - sql: |
      SELECT f1 FROM time_tbl WHERE f1 >= '00:00' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM time_tbl WHERE f1 BETWEEN '11:00' AND '12:00' ORDER BY f1
    expect: rows
    order: ordered
