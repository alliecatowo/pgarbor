# A bare time literal with a named zone has no known offset and must be rejected; the table stays empty.
id: time.timezone-literal-rejected
title: Time literal with a zone name and no date is rejected with a datetime format error
family: time
tier: core
feature_ids: [time, timezone, insert, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE time_tbl (f1 time);
steps:
  - sql: |
      INSERT INTO time_tbl VALUES ('15:36:39 America/New_York')
    expect: error
    sqlstate: "22007"
    comment: the zone offset is not known without a date
  - sql: |
      SELECT count(*) FROM time_tbl
    expect: rows
