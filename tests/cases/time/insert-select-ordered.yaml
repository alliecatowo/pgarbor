# Basic time(2) column: insert literals, read back ordered and as a multiset, count NULL-free values.
id: time.insert-select-ordered
title: Insert time literals into a time(2) column and read them back
family: time
tier: slice
feature_ids: [time, create-table, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE time_tbl (f1 time(2));
steps:
  - sql: |
      INSERT INTO time_tbl VALUES ('00:00'), ('01:00'), ('12:00'), ('12:01'), ('23:59'), ('11:59:59.99 PM')
    expect: ok
  - sql: |
      SELECT f1 FROM time_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM time_tbl
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*), count(f1) FROM time_tbl
    expect: rows
