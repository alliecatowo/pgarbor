# Hour, minute and fraction values beyond the 24:00:00 end-of-day rule are field overflow errors; the session stays usable afterwards.
id: time.out-of-range-error
title: Out-of-range time literals raise date/time field overflow and the session recovers
family: time
tier: core
feature_ids: [time, time-literal, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '24:00:00.01'::time
    expect: error
    sqlstate: "22008"
    comment: not allowed; only 24:00:00 exactly is permitted at hour 24
  - sql: |
      SELECT '24:01:00'::time
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '25:00:00'::time
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '23:59:60.01'::time
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '00:00'::time
    expect: rows
    comment: the session keeps working after the errors
