# Boundary literals: fractional seconds that round up to the 24:00:00 end of day, the leap-second form, and 24:00:00 itself.
id: time.literal-24h-boundary
title: Boundary time literals at the end of the day round to 24:00:00 where allowed
family: time
tier: core
feature_ids: [time, time-literal, time-rounding]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '23:59:59.999999'::time
    expect: rows
  - sql: |
      SELECT '23:59:59.9999999'::time
    expect: rows
    comment: rounds up to the end of the day
  - sql: |
      SELECT '23:59:60'::time
    expect: rows
    comment: leap-second form is accepted and rounds up
  - sql: |
      SELECT '24:00:00'::time
    expect: rows
    comment: allowed as the end-of-day value
  - sql: |
      SELECT '24:00:00'::time = '24:00:00'::time AS same, '24:00:00'::time > '23:59:59.999999'::time AS later
    expect: rows
