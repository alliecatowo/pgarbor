# Column precision rounds stored fractional seconds; a value just below midnight can round up to 24:00:00 in a time(0) column.
id: time.precision-rounding
title: Stored time values are rounded to the column precision
family: time
tier: extended
feature_ids: [time, typmod, time-rounding]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 docs datatype-datetime.html, time precision rounds on input"
sessions: [a]
setup: |
  CREATE TABLE tr (id int4, t0 time(0), t2 time(2));
steps:
  - sql: |
      INSERT INTO tr VALUES (1, '12:00:00.4', '12:00:00.004'), (2, '12:00:00.6', '12:00:00.006'), (3, '23:59:59.9', '23:59:59.996')
    expect: ok
  - sql: |
      SELECT id, t0, t2 FROM tr ORDER BY id
    expect: rows
    order: ordered
    comment: time(0) drops fractions and time(2) keeps two digits, both rounded
