# Malformed time text is a syntax error (22007) and an out-of-range minute is a field overflow (22008); neither inserts a row.
id: time.invalid-literal-syntax
title: Malformed and out-of-range time text raise the expected SQLSTATE
family: time
tier: core
feature_ids: [time, errors, insert]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 22007 invalid_datetime_format, 22008 datetime_field_overflow"
sessions: [a]
setup: |
  CREATE TABLE time_tbl (f1 time);
steps:
  - sql: |
      INSERT INTO time_tbl VALUES ('garbage')
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT ''::time
    expect: error
    sqlstate: "22007"
    comment: empty string is not a time
  - sql: |
      SELECT '12:61'::time
    expect: error
    sqlstate: "22008"
    comment: minute 61 is out of range
  - sql: |
      SELECT count(*) FROM time_tbl
    expect: rows
    comment: no row was inserted by the failed statement
