# EXTRACT units that do not apply to a time value, or are not known at all, raise invalid parameter errors.
id: time.extract-unsupported-units
title: EXTRACT rejects date, unknown and time-zone units for a time value
family: time
tier: extended
feature_ids: [time, extract, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT EXTRACT(DAY FROM TIME '2020-05-26 13:30:25.575401')
    expect: error
    sqlstate: "0A000"
    comment: day is a date field, not supported for a time value
  - sql: |
      SELECT EXTRACT(FORTNIGHT FROM TIME '2020-05-26 13:30:25.575401')
    expect: error
    sqlstate: "22023"
    comment: unknown unit
  - sql: |
      SELECT EXTRACT(TIMEZONE FROM TIME '2020-05-26 13:30:25.575401')
    expect: error
    sqlstate: "0A000"
    comment: timezone is a known unit but not supported for time without time zone
  - sql: |
      SELECT EXTRACT(HOUR FROM TIME '13:30:25')
    expect: rows
    comment: the session keeps working after the errors
