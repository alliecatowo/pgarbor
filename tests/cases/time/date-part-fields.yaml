# date_part on time values for the same fields as EXTRACT, returned side by side in one row.
id: time.date-part-fields
title: date_part returns the same time-of-day fields as EXTRACT
family: time
tier: extended
feature_ids: [time, date-part, date-time-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT date_part('microsecond', TIME '2020-05-26 13:30:25.575401') AS us,
             date_part('millisecond', TIME '2020-05-26 13:30:25.575401') AS ms,
             date_part('second', TIME '2020-05-26 13:30:25.575401') AS sec,
             date_part('epoch', TIME '2020-05-26 13:30:25.575401') AS epoch
    expect: rows
    comment: date_part follows the same rules as EXTRACT for time values
  - sql: |
      SELECT EXTRACT(MILLISECOND FROM TIME '2020-05-26 13:30:25.575401') AS ms,
             EXTRACT(EPOCH FROM TIME '2020-05-26 13:30:25.575401') AS epoch
    expect: rows
