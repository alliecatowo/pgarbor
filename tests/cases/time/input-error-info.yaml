# pg_input_error_info exposes message, detail, hint and SQLSTATE for rejected time input, and returns nulls for valid input.
id: time.input-error-info
title: pg_input_error_info describes why a time input is rejected
family: time
tier: extended
feature_ids: [time, input-validation-functions, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT * FROM pg_input_error_info('25:00:00', 'time')
    expect: rows
    comment: field overflow, expected sql_error_code 22008
  - sql: |
      SELECT * FROM pg_input_error_info('15:36:39 America/New_York', 'time')
    expect: rows
    comment: bad format, expected sql_error_code 22007
  - sql: |
      SELECT * FROM pg_input_error_info('12:00:00', 'time')
    expect: rows
    comment: valid input yields no error row values
