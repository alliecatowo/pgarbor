# A zone spec on a time literal is accepted and ignored for the time column, including a full timestamp-style literal.
id: time.timezone-literal-accepted
title: Time literals with a zone name or abbreviation are accepted and the zone is ignored
family: time
tier: core
feature_ids: [time, timezone, insert]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE time_tbl (f1 time(2));
steps:
  - sql: |
      INSERT INTO time_tbl VALUES ('02:03 PST')
    expect: ok
  - sql: |
      INSERT INTO time_tbl VALUES ('11:59 EDT')
    expect: ok
  - sql: |
      INSERT INTO time_tbl VALUES ('2003-03-07 15:36:39 America/New_York')
    expect: ok
    comment: a full timestamp-style literal keeps only the time of day for a time column
  - sql: |
      INSERT INTO time_tbl VALUES ('2003-07-07 15:36:39 America/New_York')
    expect: ok
  - sql: |
      SELECT f1 FROM time_tbl ORDER BY f1
    expect: rows
    order: ordered
