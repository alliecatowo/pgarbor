# Adding two time values has no operator, so it is rejected; time minus time is still defined and yields an interval.
id: time.add-two-times-rejected
title: Adding two time values is rejected while subtracting them is allowed
family: time
tier: core
feature_ids: [time, operators, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE time_tbl (f1 time(2));
  INSERT INTO time_tbl VALUES ('00:00'), ('01:00');
steps:
  - sql: |
      SELECT f1 + time '00:01' AS illegal FROM time_tbl ORDER BY f1
    expect: error
    sqlstate: "42725"
    comment: time + time is ambiguous (operator is not unique), not an undefined function
  - sql: |
      SELECT time '00:00' - time '00:01' AS diff
    expect: rows
    comment: time minus time is defined and yields an interval
