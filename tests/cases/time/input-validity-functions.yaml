# pg_input_is_valid returns a boolean instead of raising, for time inputs that are valid, out of range, or carry an unknown zone.
id: time.input-validity-functions
title: pg_input_is_valid reports time input validity without raising errors
family: time
tier: extended
feature_ids: [time, input-validation-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('12:00:00', 'time') AS valid
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('25:00:00', 'time') AS valid
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('15:36:39 America/New_York', 'time') AS valid
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('2003-03-07 15:36:39 America/New_York', 'time') AS valid
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('garbage', 'time') AS valid
    expect: rows
