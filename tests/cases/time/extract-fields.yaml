# EXTRACT for the time-of-day fields on a literal with fractional seconds.
id: time.extract-fields
title: EXTRACT returns microsecond, millisecond, second, minute, hour and epoch for a time literal
family: time
tier: core
feature_ids: [time, extract, date-time-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/time.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT EXTRACT(MICROSECOND FROM TIME '2020-05-26 13:30:25.575401') AS v
    expect: rows
  - sql: |
      SELECT EXTRACT(MILLISECOND FROM TIME '2020-05-26 13:30:25.575401') AS v
    expect: rows
  - sql: |
      SELECT EXTRACT(SECOND FROM TIME '2020-05-26 13:30:25.575401') AS v
    expect: rows
  - sql: |
      SELECT EXTRACT(MINUTE FROM TIME '2020-05-26 13:30:25.575401') AS v
    expect: rows
  - sql: |
      SELECT EXTRACT(HOUR FROM TIME '2020-05-26 13:30:25.575401') AS v
    expect: rows
  - sql: |
      SELECT EXTRACT(EPOCH FROM TIME '2020-05-26 13:30:25.575401') AS v
    expect: rows
    comment: seconds since midnight, including the fraction
