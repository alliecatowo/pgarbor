# Grouping checks run at analysis time, so they fail on an empty table too; a valid grouped query returns zero rows.
id: functional-deps.empty-table-still-validates
title: "Grouping validity is checked on an empty table; valid grouped query returns zero rows"
family: functional-deps
tier: core
feature_ids: [group-by, functional-dependencies, primary-key, errors]
required_capabilities: [create-table, select, group-by, primary-key]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/functional_deps.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE articles (
      id int CONSTRAINT articles_pkey PRIMARY KEY,
      keywords text,
      title text UNIQUE NOT NULL,
      body text UNIQUE,
      created date
  );
steps:
  - sql: |
      SELECT id, keywords, title, body, created
      FROM articles
      GROUP BY id
      ORDER BY id
    expect: rows
    order: ordered
    comment: "zero rows, no error"
  - sql: |
      SELECT id, keywords, title, body, created
      FROM articles
      GROUP BY title
    expect: error
    sqlstate: "42803"
    comment: "rejected even though the table has no rows"
