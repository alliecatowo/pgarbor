# A failed CREATE VIEW leaves no view behind; the corrected definition with the primary key succeeds.
id: functional-deps.create-view-bad-group-rejected
title: "CREATE VIEW with ungrouped column fails then succeeds with primary key grouping"
family: functional-deps
tier: extended
feature_ids: [group-by, functional-dependencies, views, errors]
required_capabilities: [create-table, insert, select, group-by, create-view, primary-key]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/functional_deps.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE articles (
      id int CONSTRAINT articles_pkey PRIMARY KEY,
      keywords text,
      title text UNIQUE NOT NULL,
      body text UNIQUE,
      created date
  );
  INSERT INTO articles VALUES
      (1, 'db pg', 'First', 'body one', '2024-01-01'),
      (2, NULL, 'Second', NULL, '2024-02-01'),
      (3, '', 'Third', 'body three', NULL);
steps:
  - sql: |
      CREATE VIEW fdv1 AS
      SELECT id, keywords, title, body, created
      FROM articles
      GROUP BY body
    expect: error
    sqlstate: "42803"
  - sql: |
      CREATE VIEW fdv1 AS
      SELECT id, keywords, title, body, created
      FROM articles
      GROUP BY id
    expect: ok
  - sql: |
      SELECT id, title FROM fdv1 ORDER BY id
    expect: rows
    order: ordered
    comment: "the view name is free after the failed create"
