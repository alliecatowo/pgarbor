# Grouping by the left table's primary key across a join allows that table's other columns.
id: functional-deps.join-left-pk-allows-columns
title: "GROUP BY left-side primary key across a join allows its other columns"
family: functional-deps
tier: core
feature_ids: [group-by, functional-dependencies, joins, primary-key]
required_capabilities: [create-table, insert, select, group-by, joins, primary-key]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/functional_deps.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE articles (
      id int CONSTRAINT articles_pkey PRIMARY KEY,
      keywords text,
      title text UNIQUE NOT NULL,
      body text UNIQUE,
      created date
  );
  CREATE TABLE articles_in_category (
      article_id int,
      category_id int,
      changed date,
      PRIMARY KEY (article_id, category_id)
  );
  INSERT INTO articles VALUES
      (1, 'db pg', 'First', 'body one', '2024-01-01'),
      (2, NULL, 'Second', NULL, '2024-02-01'),
      (3, '', 'Third', 'body three', NULL);
  INSERT INTO articles_in_category VALUES
      (1, 14, '2024-03-01'), (1, 62, '2024-03-02'), (2, 99, '2024-03-03'),
      (3, 14, '2024-03-04'), (3, 70, NULL);
steps:
  - sql: |
      SELECT a.id, a.keywords, a.title, a.body, a.created
      FROM articles AS a JOIN articles_in_category AS aic ON a.id = aic.article_id
      WHERE aic.category_id IN (14, 62, 70, 53, 138)
      GROUP BY a.id
      ORDER BY a.id
    expect: rows
    order: ordered
  - sql: |
      SELECT a.id, a.keywords, a.title, a.body, a.created
      FROM articles AS a, articles_in_category AS aic
      WHERE a.id = aic.article_id AND aic.category_id IN (14, 62, 70, 53, 138)
      GROUP BY a.id
      ORDER BY a.id
    expect: rows
    order: ordered
    comment: "comma join syntax behaves the same"
