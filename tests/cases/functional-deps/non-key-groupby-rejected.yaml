# Grouping by an ordinary column licenses nothing: the primary key column must itself be grouped.
id: functional-deps.non-key-groupby-rejected
title: "GROUP BY an ordinary column rejects ungrouped primary key reference"
family: functional-deps
tier: core
feature_ids: [group-by, functional-dependencies, errors]
required_capabilities: [create-table, insert, select, group-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/functional_deps.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE articles (
      id int CONSTRAINT articles_pkey PRIMARY KEY,
      keywords text,
      title text UNIQUE NOT NULL,
      body text UNIQUE,
      created date
  );
  INSERT INTO articles VALUES
      (1, 'db pg', 'First', 'body one', '2024-01-01'),
      (2, 'db pg', 'Second', NULL, '2024-02-01'),
      (3, '', 'Third', 'body three', NULL);
steps:
  - sql: |
      SELECT id, keywords, title, body, created
      FROM articles
      GROUP BY keywords
    expect: error
    sqlstate: "42803"
