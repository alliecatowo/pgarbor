# Grouping by only part of a composite primary key does not license the other column.
id: functional-deps.composite-pk-partial-rejected
title: "GROUP BY partial composite primary key rejects the non-grouped column"
family: functional-deps
tier: core
feature_ids: [group-by, functional-dependencies, joins, primary-key, errors]
required_capabilities: [create-table, insert, select, group-by, joins, primary-key]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/functional_deps.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE articles (
      id int CONSTRAINT articles_pkey PRIMARY KEY,
      keywords text,
      title text UNIQUE NOT NULL,
      body text UNIQUE,
      created date
  );
  CREATE TABLE articles_in_category (
      article_id int,
      category_id int,
      changed date,
      PRIMARY KEY (article_id, category_id)
  );
  INSERT INTO articles VALUES (1, 'db pg', 'First', 'body one', '2024-01-01');
  INSERT INTO articles_in_category VALUES (1, 14, '2024-03-01');
steps:
  - sql: |
      SELECT aic.changed
      FROM articles AS a JOIN articles_in_category AS aic ON a.id = aic.article_id
      WHERE aic.category_id IN (14, 62, 70, 53, 138)
      GROUP BY aic.article_id
    expect: error
    sqlstate: "42803"
    comment: "only half of the composite key is grouped"
