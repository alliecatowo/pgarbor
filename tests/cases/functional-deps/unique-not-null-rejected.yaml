# A UNIQUE NOT NULL column is not a functional-dependency source; only the primary key is.
id: functional-deps.unique-not-null-rejected
title: "GROUP BY a UNIQUE NOT NULL column does not license other columns"
family: functional-deps
tier: core
feature_ids: [group-by, functional-dependencies, unique-constraint, errors]
required_capabilities: [create-table, insert, select, group-by, unique-constraint]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/functional_deps.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE articles (
      id int CONSTRAINT articles_pkey PRIMARY KEY,
      keywords text,
      title text UNIQUE NOT NULL,
      body text UNIQUE,
      created date
  );
  INSERT INTO articles VALUES
      (1, 'db pg', 'First', 'body one', '2024-01-01'),
      (2, NULL, 'Second', NULL, '2024-02-01'),
      (3, '', 'Third', 'body three', NULL);
steps:
  - sql: |
      SELECT id, keywords, title, body, created
      FROM articles
      GROUP BY title
    expect: error
    sqlstate: "42803"
    comment: "id is not grouped and not functionally dependent on title"
