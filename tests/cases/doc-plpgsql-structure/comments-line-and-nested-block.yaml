# '--' ends at end of line; '/*' block comments nest.
id: doc-plpgsql-structure.comments-line-and-nested-block
title: Line comments hide the rest of a line and block comments nest inside PL/pgSQL bodies
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, comments, lexical]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (comments paragraph)"
sessions: [a]
setup: |
  CREATE FUNCTION fcmt() RETURNS int LANGUAGE plpgsql AS $$
  /* outer /* nested */ still comment */
  BEGIN RETURN 1; END $$;
  CREATE FUNCTION fcmt2() RETURNS int LANGUAGE plpgsql AS $$
  BEGIN RETURN 2; -- trailing comment RETURN 99;
  END $$;
steps:
  - sql: |
      SELECT fcmt() AS v
    expect: rows
    comment: the nested /* */ pair does not end the outer comment early
  - sql: |
      SELECT fcmt2() AS v
    expect: rows
    comment: text after -- on the same line is ignored
