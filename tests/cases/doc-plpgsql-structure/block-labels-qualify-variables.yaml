# Block labels qualify variables of the block they name, including across nested blocks.
id: doc-plpgsql-structure.block-labels-qualify-variables
title: Block labels qualify variables of an outer or inner block
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, block-labels, variable-scope]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (block label syntax)"
sessions: [a]
setup: |
  CREATE FUNCTION fsub() RETURNS int LANGUAGE plpgsql AS $$
  << ob >>
  DECLARE x int := 7;
  BEGIN
    << ib >> DECLARE x int := 9; BEGIN
      RETURN ib.x * 10 + ob.x;
    END;
  END $$;
  CREATE FUNCTION fvar() RETURNS text LANGUAGE plpgsql AS $$
  << blk >>
  DECLARE v text := 'it''s';
  BEGIN
    RETURN v || blk.v;
  END $$;
steps:
  - sql: |
      SELECT fsub() AS v
    expect: rows
    comment: inner x 9 via label, outer x 7 via label
  - sql: |
      SELECT fvar() AS v
    expect: rows
    comment: a block-qualified reference to a declared variable works in the same block
