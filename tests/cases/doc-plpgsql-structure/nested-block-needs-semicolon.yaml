# A block nested inside another block must be followed by a semicolon after END.
id: doc-plpgsql-structure.nested-block-needs-semicolon
title: Nested block END without a semicolon is rejected
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, block-structure, syntax-errors]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (each statement and subblock terminated by semicolon)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION fnosemi() RETURNS int LANGUAGE plpgsql AS $$
      BEGIN
        BEGIN
          RETURN 1;
        END
        RETURN 0;
      END $$
    expect: error
    sqlstate: "42601"
    comment: the parser reads RETURN as a label for the unlabeled inner block
  - sql: |
      CREATE FUNCTION fnosemi_ok() RETURNS int LANGUAGE plpgsql AS $$
      BEGIN
        BEGIN
          RETURN 1;
        END;
        RETURN 0;
      END $$
    expect: ok
    comment: the same body with the semicolon after the subblock END is accepted
