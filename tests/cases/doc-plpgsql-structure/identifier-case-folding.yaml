# Unquoted identifiers fold to lower case; double-quoted identifiers keep their case.
id: doc-plpgsql-structure.identifier-case-folding
title: Unquoted PL/pgSQL identifiers fold to lower case and quoted ones stay case-sensitive
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, identifiers, case-folding, keywords]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (identifiers folded to lower case)"
sessions: [a]
setup: |
  CREATE FUNCTION fcaseid() RETURNS int LANGUAGE plpgsql AS $$
  DECLARE MixedName int := 3;
  BEGIN RETURN mixedname + MIXEDNAME; END $$;
  CREATE FUNCTION fcaseq() RETURNS int LANGUAGE plpgsql AS $$
  DECLARE "MixedName" int := 3;
  BEGIN RETURN "MixedName"; END $$;
  CREATE FUNCTION fcaseq2() RETURNS int LANGUAGE plpgsql AS $$
  DECLARE "MixedName" int := 3;
  BEGIN RETURN mixedname; END $$;
steps:
  - sql: |
      SELECT fcaseid() AS v
    expect: rows
    comment: both spellings fold to the same variable, 3 + 3
  - sql: |
      SELECT fcaseq() AS v
    expect: rows
  - sql: |
      SELECT fcaseq2() AS v
    expect: error
    sqlstate: "42703"
    comment: mixedname folds to lower case and no longer matches the quoted variable
