# A label repeated after END must match the label at the start of the block.
id: doc-plpgsql-structure.end-label-mismatch-error
title: END label that differs from the block's opening label is a syntax error
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, block-labels, syntax-errors]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (label after END must match)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION fendlabel() RETURNS int LANGUAGE plpgsql AS $$
      << a >>
      BEGIN
        RETURN 1;
      END b $$
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE FUNCTION fendlabel_ok() RETURNS int LANGUAGE plpgsql AS $$
      << a >>
      BEGIN
        RETURN 1;
      END a $$
    expect: ok
    comment: a matching label after END is accepted
