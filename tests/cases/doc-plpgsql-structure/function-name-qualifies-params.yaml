# The hidden outer block carries the parameters, which may be qualified with the function name.
id: doc-plpgsql-structure.function-name-qualifies-params
title: Function parameters can be qualified with the function name
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, parameters, block-structure, outer-block]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (hidden outer block note)"
sessions: [a]
setup: |
  CREATE FUNCTION fparam(p int) RETURNS int LANGUAGE plpgsql AS $$
  DECLARE v int := 1;
  BEGIN
    RETURN fparam.p + v;
  END $$;
steps:
  - sql: |
      SELECT fparam(4) AS v
    expect: rows
  - sql: |
      SELECT fparam(NULL::int) AS v
    expect: rows
    comment: a NULL argument propagates through the qualified parameter; NULL + 1 is NULL
