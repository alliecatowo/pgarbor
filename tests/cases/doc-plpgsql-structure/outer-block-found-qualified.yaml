# The hidden outer block provides special variables such as FOUND; they are qualified by function name.
id: doc-plpgsql-structure.outer-block-found-qualified
title: FOUND is reachable from the function name as the outer block label
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, found, block-structure, outer-block]
required_capabilities: [plpgsql, create-function, create-table, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (hidden outer block note)"
sessions: [a]
setup: |
  CREATE TABLE t (id int);
  CREATE FUNCTION ffound() RETURNS text LANGUAGE plpgsql AS $$
  BEGIN
    PERFORM 1 FROM t WHERE false;
    RETURN CASE WHEN ffound.found THEN 'yes' ELSE 'no' END;
  END $$;
steps:
  - sql: |
      SELECT ffound() AS v
    expect: rows
    comment: no rows matched, so FOUND is false
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SELECT ffound() AS v
    expect: rows
    comment: the inserted row does not match WHERE false, so FOUND stays false
