# Without dollar quoting, single quotes in the body must be doubled; dollar quoting needs no escapes.
id: doc-plpgsql-structure.dollar-quote-vs-doubled-quotes
title: Function body written with doubled single quotes and with dollar quoting behave the same
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, dollar-quoting, quoting, create-function]
required_capabilities: [plpgsql, create-function, select, dollar-quoting]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (dollar quoting paragraph)"
sessions: [a]
setup: |
  CREATE FUNCTION fquote() RETURNS text AS 'DECLARE v text := ''x''; BEGIN RETURN v || ''y''; END' LANGUAGE plpgsql;
  CREATE FUNCTION fdollar() RETURNS text AS $$ DECLARE v text := 'x'; BEGIN RETURN v || 'y'; END $$ LANGUAGE plpgsql;
steps:
  - sql: |
      SELECT fquote() AS a, fdollar() AS b
    expect: rows
