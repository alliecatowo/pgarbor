# Doc example: after the subblock ends, the unqualified name refers to the outer variable again.
id: doc-plpgsql-structure.block-after-subblock-restores-outer
title: Outer variable is visible again after a subblock that masked it ends
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, block-structure, variable-scope, subblocks]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (subblock example)"
sessions: [a]
setup: |
  CREATE FUNCTION afterblock() RETURNS integer AS $$
  << outerblock >>
  DECLARE
      quantity integer := 30;
  BEGIN
      quantity := 50;
      DECLARE
          quantity integer := 80;
      BEGIN
          NULL;
      END;
      RETURN quantity;
  END;
  $$ LANGUAGE plpgsql;
steps:
  - sql: |
      SELECT afterblock() AS v
    expect: rows
    comment: prints 50 in the doc; the subblock's 80 does not leak out
