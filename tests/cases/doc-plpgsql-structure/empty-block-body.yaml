# An empty BEGIN ... END block is a valid body for a void function.
id: doc-plpgsql-structure.empty-block-body
title: An empty BEGIN END block is a valid function body
family: doc-plpgsql-structure
tier: extended
feature_ids: [plpgsql, block-structure, void-return]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (block syntax: statements section)"
sessions: [a]
setup: |
  CREATE FUNCTION fempty() RETURNS void LANGUAGE plpgsql AS $$
  BEGIN END $$;
steps:
  - sql: |
      SELECT fempty() IS NULL AS is_null
    expect: rows
    comment: probes whether the void result is SQL NULL; the value is taken from the oracle recording
