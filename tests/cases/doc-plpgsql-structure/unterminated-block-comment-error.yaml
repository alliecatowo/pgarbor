# Block comments nest, so an unmatched opener swallows the rest of the body and is a syntax error.
id: doc-plpgsql-structure.unterminated-block-comment-error
title: Unterminated nested block comment in a function body is a syntax error
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, comments, syntax-errors]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (block comments nest)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION fcmt_bad() RETURNS int LANGUAGE plpgsql AS $$
      /* unterminated /* nested */
      BEGIN RETURN 1; END $$
    expect: error
    sqlstate: "42601"
    comment: the inner */ closes only the nested comment
