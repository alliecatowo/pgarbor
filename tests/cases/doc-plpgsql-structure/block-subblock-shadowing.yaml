# Doc example: a subblock declares its own 'quantity'; the outer one is reached via its label.
id: doc-plpgsql-structure.block-subblock-shadowing
title: Subblock variable masks the outer variable and the outer one is reached by block label
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, block-structure, variable-scope, subblocks]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (outer block / subblock example)"
sessions: [a]
setup: |
  CREATE FUNCTION somefunc() RETURNS integer AS $$
  << outerblock >>
  DECLARE
      quantity integer := 30;
  BEGIN
      quantity := 50;
      DECLARE
          quantity integer := 80;
      BEGIN
          RETURN quantity * 1000 + outerblock.quantity;
      END;
  END;
  $$ LANGUAGE plpgsql;
steps:
  - sql: |
      SELECT somefunc() AS v
    expect: rows
    comment: inner quantity 80 and outer quantity 50 (documented as printed values)
