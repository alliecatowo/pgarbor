# A semicolon immediately after BEGIN is a syntax error; the function is not created.
id: doc-plpgsql-structure.begin-semicolon-syntax-error
title: A semicolon right after BEGIN is rejected at CREATE FUNCTION time
family: doc-plpgsql-structure
tier: core
feature_ids: [plpgsql, block-structure, syntax-errors]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-structure (tip: semicolon after BEGIN)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION fbeginsemi() RETURNS int LANGUAGE plpgsql AS $$
      BEGIN;
        RETURN 1;
      END $$
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT to_regprocedure('fbeginsemi()') IS NULL AS not_created
    expect: rows
