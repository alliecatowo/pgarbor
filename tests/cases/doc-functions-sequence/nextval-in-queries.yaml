# nextval is evaluated once per row in a query, in INSERT ... SELECT, and in a subquery with ORDER BY.
id: doc-functions-sequence.nextval-in-queries
title: nextval is evaluated per produced row in SELECT lists, INSERT ... SELECT, and subqueries
family: doc-functions-sequence
tier: core
feature_ids: [nextval, generate-series, insert, subquery, order-by]
required_capabilities: [sequences, create-table, insert, select, set-returning-functions]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-sequence (nextval as a per-row expression)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_q;
  CREATE TABLE t_q (id int8 PRIMARY KEY, v text);
steps:
  - sql: |
      SELECT n FROM (SELECT nextval('s_q') AS n FROM generate_series(1, 3)) x ORDER BY n
    expect: rows
    order: ordered
    comment: nextval runs once per generated row
  - sql: |
      INSERT INTO t_q (id, v) SELECT nextval('s_q'), 'row' FROM generate_series(1, 2)
    expect: ok
  - sql: |
      SELECT id, v FROM t_q ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT nextval('s_q') AS v
    expect: rows
    comment: the sequence continues after the rows used by the earlier statements
