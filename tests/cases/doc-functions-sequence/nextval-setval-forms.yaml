# nextval advances from 1 by default; the three setval forms and their documented effect on the next nextval.
id: doc-functions-sequence.nextval-setval-forms
title: nextval starts at 1 and the setval two- and three-argument forms set the next value as documented
family: doc-functions-sequence
tier: core
feature_ids: [nextval, setval, currval, is-called]
required_capabilities: [sequences, select, null-semantics]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-sequence (nextval, setval, currval; setval examples)"
sessions: [a]
setup: |
  CREATE SEQUENCE myseq;
steps:
  - sql: |
      SELECT nextval('myseq') AS a, nextval('myseq') AS b
    expect: rows
    order: ordered
    comment: default sequence returns successive values beginning with 1
  - sql: |
      SELECT setval('myseq', 42) AS v
    expect: rows
    comment: setval returns its second argument; the two-argument form makes the next nextval return 43
  - sql: |
      SELECT nextval('myseq') AS v
    expect: rows
  - sql: |
      SELECT setval('myseq', 42, true) AS v
    expect: rows
    comment: the three-argument form with true is the same as the two-argument form
  - sql: |
      SELECT nextval('myseq') AS v
    expect: rows
  - sql: |
      SELECT setval('myseq', 42, false) AS v
    expect: rows
    comment: with false the next nextval returns exactly 42
  - sql: |
      SELECT currval('myseq') AS v
    expect: rows
    comment: the three-argument false form leaves the value reported by currval unchanged
  - sql: |
      SELECT nextval('myseq') AS v
    expect: rows
  - sql: |
      SELECT nextval('myseq') AS v
    expect: rows
    comment: advancement resumes with the following nextval
