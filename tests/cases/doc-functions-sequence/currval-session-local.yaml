# currval is session-local: another session's nextval does not change what this session's currval reports.
id: doc-functions-sequence.currval-session-local
title: currval reports the calling session's own last nextval even after another session advances the sequence
family: doc-functions-sequence
tier: core
feature_ids: [currval, lastval, nextval, multi-session]
required_capabilities: [sequences, select, errors, multi-session]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-sequence (currval: returns a session-local value)"
sessions: [a, b]
setup: |
  CREATE SEQUENCE s_cl;
steps:
  - session: b
    sql: |
      SELECT currval('s_cl')
    expect: error
    sqlstate: "55000"
    comment: session b has not called nextval yet
  - session: a
    sql: |
      SELECT nextval('s_cl') AS v
    expect: rows
  - session: a
    sql: |
      SELECT nextval('s_cl') AS v
    expect: rows
  - session: b
    sql: |
      SELECT nextval('s_cl') AS v
    expect: rows
    comment: b receives the next distinct value
  - session: b
    sql: |
      SELECT currval('s_cl') AS v, lastval() AS l
    expect: rows
  - session: a
    sql: |
      SELECT currval('s_cl') AS v, lastval() AS l
    expect: rows
    comment: a still reports its own last value, not b's
