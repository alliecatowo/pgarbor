# SHOW reports the transaction-scoped isolation level and read-only mode of the current transaction.
id: cmd-show.transaction-isolation-and-read-only
title: SHOW reports transaction_isolation and transaction_read_only for the current transaction
family: cmd-show
tier: core
feature_ids: [show, begin, isolation-levels, read-only-transactions, transactions]
required_capabilities: [select, guc, transactions]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show; ref/begin.sgml#sql-begin (ISOLATION LEVEL, READ ONLY)"
sessions: [a]
steps:
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - sql: |
      SHOW transaction_isolation
    expect: rows
    order: ordered
  - sql: |
      SHOW transaction_read_only
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      BEGIN READ ONLY
    expect: ok
  - sql: |
      SHOW transaction_read_only
    expect: rows
    order: ordered
    comment: READ ONLY is reported as on
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SHOW transaction_isolation
    expect: rows
    order: ordered
    comment: outside a transaction block the session default applies
