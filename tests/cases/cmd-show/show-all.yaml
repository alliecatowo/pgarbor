# SHOW ALL lists every parameter with its description; its contents depend on the server installation, so it is not compared.
id: cmd-show.show-all
title: SHOW ALL lists all parameters with descriptions
family: cmd-show
tier: extended
feature_ids: [show, show-all, guc, pg-settings]
required_capabilities: [guc]
quarantine:
  reason: SHOW ALL output includes installation-specific values (config_file, data_directory, port, unix_socket_directories, and similar) and descriptions, so the recorded output is not portable across PGArbor and oracle deployments; the name and column shape is covered by catalog cases.
  since: "2026-10-15"
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show (Examples: Show all settings; Parameters: ALL)"
sessions: [a]
steps:
  - sql: |
      SHOW ALL
    expect: rows
    order: multiset
