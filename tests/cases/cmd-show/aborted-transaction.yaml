# Inside a failed transaction block SHOW is rejected with in_failed_sql_transaction until ROLLBACK.
id: cmd-show.rejected-in-aborted-transaction
title: SHOW inside an aborted transaction block fails with 25P02 until ROLLBACK
family: cmd-show
tier: core
feature_ids: [show, begin, rollback, transactions, errors]
required_capabilities: [select, guc, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show; ref/begin.sgml#sql-begin (failed transaction block)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SHOW DateStyle
    expect: error
    sqlstate: "25P02"
    comment: SHOW is a statement like any other here and is refused
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SHOW DateStyle
    expect: rows
    order: ordered
    comment: after ROLLBACK SHOW works again
