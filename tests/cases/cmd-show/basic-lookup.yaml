# SHOW displays the current value of a run-time parameter; names are matched case-insensitively, quoted or not.
id: cmd-show.basic-lookup
title: SHOW returns the current value of a parameter, matching names case-insensitively and matching current_setting
family: cmd-show
tier: core
feature_ids: [show, guc, case-insensitive-names, current-setting]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show (Examples: Show the current setting of the parameter DateStyle; Description)"
sessions: [a]
steps:
  - sql: |
      SHOW DateStyle
    expect: rows
    order: ordered
    comment: documented example; the column is named after the parameter
  - sql: |
      SHOW datestyle
    expect: rows
    order: ordered
    comment: lookup is case-insensitive
  - sql: |
      SHOW "DATESTYLE"
    expect: rows
    order: ordered
    comment: a quoted identifier names the same parameter; the result column uses the canonical name
  - sql: |
      SELECT current_setting('DateStyle') AS v
    expect: rows
    order: ordered
    comment: current_setting produces the same value as SHOW
