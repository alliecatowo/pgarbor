# SHOW of a name that is not a configuration parameter fails with undefined_object, and a bare SHOW is a syntax error.
id: cmd-show.unrecognized-parameter-errors
title: SHOW of an unknown parameter raises 42704; SHOW without a name is a syntax error
family: cmd-show
tier: core
feature_ids: [show, errors, guc]
required_capabilities: [select, guc, errors]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show (Parameters: name; synopsis SHOW name)"
sessions: [a]
steps:
  - sql: |
      SHOW nosuch_param
    expect: error
    sqlstate: "42704"
  - sql: |
      SHOW "no such"
    expect: error
    sqlstate: "42704"
    comment: a quoted name with a space is still an unknown parameter
  - sql: |
      SHOW
    expect: error
    sqlstate: "42601"
    comment: the name is required by the grammar, SHOW ALL is the only other form
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    order: ordered
    comment: the session remains usable after each error
