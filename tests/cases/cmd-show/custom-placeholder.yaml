# Dotted customized-option names (placeholders) are created by SET, looked up case-insensitively by SHOW, and hold text values.
id: cmd-show.custom-placeholder-lookup
title: SHOW reads back dotted custom parameters created by SET, case-insensitively
family: cmd-show
tier: extended
feature_ids: [show, set, custom-guc, dotted-names, case-insensitive-names]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show (Parameters: name); ref/set.sgml#sql-set; runtime-config-custom"
sessions: [a]
steps:
  - sql: |
      SET app.Foo = 'Bar'
    expect: ok
  - sql: |
      SHOW app.foo
    expect: rows
    order: ordered
    comment: the value is stored as written
  - sql: |
      SHOW APP.FOO
    expect: rows
    order: ordered
    comment: names are case-insensitive
  - sql: |
      SET app.x = 1
    expect: ok
  - sql: |
      SHOW app.x
    expect: rows
    order: ordered
    comment: a numeric literal is stored as its text form
  - sql: |
      SHOW app.missing
    expect: error
    sqlstate: "42704"
    comment: a dotted name that was never set is an unrecognized parameter
