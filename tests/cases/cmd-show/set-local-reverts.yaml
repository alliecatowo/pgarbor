# SET LOCAL is visible to SHOW inside its transaction and reverts when the transaction ends, whether it commits or rolls back.
id: cmd-show.set-local-reverts-at-transaction-end
title: SHOW reflects SET LOCAL inside the transaction and reverts after COMMIT or ROLLBACK
family: cmd-show
tier: core
feature_ids: [show, set-local, begin, commit, rollback, guc]
required_capabilities: [select, guc, transactions]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show; ref/set.sgml#sql-set (Description: SET LOCAL lasts until the end of the current transaction)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL work_mem = '64MB'
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    order: ordered
    comment: visible inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    order: ordered
    comment: reverted to the session default after ROLLBACK (4MB)
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL work_mem = '64MB'
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    order: ordered
    comment: reverted to the session default after COMMIT as well
