# RESET and SET ... TO DEFAULT restore the default value shown by SHOW; RESET ALL restores every parameter.
id: cmd-show.reset-and-default
title: RESET, SET TO DEFAULT and RESET ALL restore the value SHOW reports
family: cmd-show
tier: core
feature_ids: [show, reset, set-default, reset-all, guc]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show; ref/reset.sgml#sql-reset (Description)"
sessions: [a]
steps:
  - sql: |
      SET work_mem TO '1MB'
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    order: ordered
  - sql: |
      RESET work_mem
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    order: ordered
    comment: RESET restores the default (4MB)
  - sql: |
      SET work_mem TO '1MB'
    expect: ok
  - sql: |
      SET work_mem TO DEFAULT
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    order: ordered
    comment: SET ... TO DEFAULT has the same effect as RESET
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      RESET ALL
    expect: ok
  - sql: |
      SHOW DateStyle
    expect: rows
    order: ordered
    comment: RESET ALL restores every parameter to its default
