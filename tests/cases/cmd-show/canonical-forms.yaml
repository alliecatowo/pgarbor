# After SET, SHOW reports the canonical text form of the value: lists keep their separators, enum and boolean values are normalized.
id: cmd-show.set-then-show-canonical-forms
title: SHOW reports canonical text for values set with SET (lists, enums, booleans, time zone)
family: cmd-show
tier: core
feature_ids: [show, set, guc, time-zone, search-path, enum-guc, bool-guc]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/show.sgml#sql-show (Description: values set with SET); ref/set.sgml#sql-set (Examples)"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      SHOW DateStyle
    expect: rows
    order: ordered
  - sql: |
      SET search_path TO public, pg_catalog
    expect: ok
  - sql: |
      SHOW search_path
    expect: rows
    order: ordered
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SHOW TimeZone
    expect: rows
    order: ordered
  - sql: |
      SET client_min_messages TO WARNING
    expect: ok
  - sql: |
      SHOW client_min_messages
    expect: rows
    order: ordered
    comment: enum values are shown in lower case
  - sql: |
      SET standard_conforming_strings TO off
    expect: ok
  - sql: |
      SHOW standard_conforming_strings
    expect: rows
    order: ordered
    comment: boolean values are shown as on/off
  - sql: |
      SET IntervalStyle TO 'iso_8601'
    expect: ok
  - sql: |
      SHOW IntervalStyle
    expect: rows
    order: ordered
