# WORK and TRANSACTION are optional noise words; all three spellings end the block and discard its work.
id: cmd-rollback.keyword-variants
title: ROLLBACK, ROLLBACK WORK and ROLLBACK TRANSACTION each discard the block
family: cmd-rollback
tier: core
feature_ids: [rollback, transactions, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/rollback.sgml#sql-rollback-transaction (WORK and TRANSACTION are optional key words with no effect)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN WORK
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      ROLLBACK WORK
    expect: ok
  - sql: |
      START TRANSACTION
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3)
    expect: ok
  - sql: |
      ROLLBACK TRANSACTION
    expect: ok
    comment: PostgreSQL extension spelling
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
    comment: none of the three inserts survived
