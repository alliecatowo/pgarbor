# ROLLBACK outside a transaction block only warns and changes nothing.
id: cmd-rollback.outside-transaction-warning
title: ROLLBACK outside a transaction block emits a warning and has no effect
family: cmd-rollback
tier: core
feature_ids: [rollback, transactions, guc]
required_capabilities: [select, transactions, guc]
provenance:
  source: pg-docs
  ref: "ref/rollback.sgml#sql-rollback (Notes: outside of a transaction block emits a warning)"
sessions: [a]
steps:
  - sql: |
      ROLLBACK
    expect: notice
    comment: WARNING there is no transaction in progress
  - sql: |
      ROLLBACK WORK
    expect: notice
  - sql: |
      ROLLBACK TRANSACTION
    expect: notice
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
    comment: the session is still in autocommit with its defaults
