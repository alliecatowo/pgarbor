# ROLLBACK discards table updates but not sequence advances, since nextval is not transactional.
id: cmd-rollback.sequence-not-rolled-back
title: ROLLBACK does not return a sequence value consumed inside the transaction
family: cmd-rollback
tier: core
feature_ids: [rollback, sequences, nextval, transactions]
required_capabilities: [create-sequence, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/rollback.sgml#sql-rollback (Description: discards the updates; sequence state is outside the transaction)"
sessions: [a]
setup: |
  CREATE SEQUENCE s;
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT nextval('s') AS v
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT nextval('s') AS v
    expect: rows
    order: ordered
    comment: the next value is 2, the value 1 is not reused
notes: >
  The reference page says all updates are discarded; sequence advances are documented elsewhere (sequence functions) as non-transactional. The oracle recording decides.
