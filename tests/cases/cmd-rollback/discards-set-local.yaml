# SET LOCAL is scoped to the transaction, so ROLLBACK restores the setting that was in effect before it.
id: cmd-rollback.discards-set-local
title: ROLLBACK reverts a SET LOCAL made inside the transaction
family: cmd-rollback
tier: core
feature_ids: [rollback, set-local, guc, transactions]
required_capabilities: [select, transactions, guc]
provenance:
  source: pg-docs
  ref: "ref/rollback.sgml#sql-rollback (Description: all the updates made by the transaction are discarded)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL work_mem = '64MB'
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') = '64MB' AS is_local
    expect: rows
    order: ordered
    comment: true inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') <> '64MB' AS is_reverted
    expect: rows
    order: ordered
    comment: true after rollback, so the local setting is gone
