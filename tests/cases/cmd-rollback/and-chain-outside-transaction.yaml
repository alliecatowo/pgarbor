# AND CHAIN has no transaction to chain from when none is open, so it is an error and nothing starts.
id: cmd-rollback.and-chain-outside-transaction
title: ROLLBACK AND CHAIN outside a transaction block is an error and starts no block
family: cmd-rollback
tier: core
feature_ids: [rollback, and-chain, transactions]
required_capabilities: [select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/rollback.sgml#sql-rollback (Notes: ROLLBACK AND CHAIN outside a transaction block is an error)"
sessions: [a]
steps:
  - sql: |
      ROLLBACK AND CHAIN
    expect: error
    sqlstate: "25P01"
    comment: message is ROLLBACK AND CHAIN can only be used in transaction blocks
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
    comment: no block was started
  - sql: |
      ROLLBACK AND NO CHAIN
    expect: notice
    comment: without CHAIN the same statement only warns
