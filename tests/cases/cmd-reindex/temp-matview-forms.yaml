# Temporary tables and materialized views can be reindexed; the option is accepted but temporary tables are always non-concurrent.
id: cmd-reindex.temp-matview-forms
title: REINDEX works on temporary tables and materialized views but not on plain views
family: cmd-reindex
tier: extended
feature_ids: [reindex, reindex-table, reindex-index, reindex-concurrently, temp-tables, materialized-views]
required_capabilities: [create-table, create-index, create-view, create-materialized-view, insert, select, reindex, reindex-concurrently, temp-tables]
provenance:
  source: pg-docs
  ref: "ref/reindex.sgml#sql-reindex (Parameters: CONCURRENTLY: For temporary tables, REINDEX is always non-concurrent)"
sessions: [a]
setup: |
  CREATE TABLE base (id int4, k int4);
  INSERT INTO base VALUES (1, 10), (2, 20);
  CREATE MATERIALIZED VIEW mv AS SELECT id, k FROM base;
  CREATE INDEX mv_id ON mv (id);
  CREATE VIEW plain_v AS SELECT id, k FROM base;
steps:
  - sql: |
      REINDEX TABLE mv
    expect: ok
    comment: a materialized view is accepted by REINDEX TABLE
  - sql: |
      REINDEX INDEX mv_id
    expect: ok
  - sql: |
      SELECT id, k FROM mv ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      REINDEX TABLE plain_v
    expect: error
    sqlstate: "42809"
    comment: a plain view is not a table or materialized view
  - sql: |
      CREATE TEMP TABLE tmp (id int4 PRIMARY KEY, v int4);
      INSERT INTO tmp VALUES (1, 100), (2, 200);
      CREATE INDEX tmp_v ON tmp (v)
    expect: ok
    comment: temporary tables are session-local, so they are created in the same session that reindexes them
  - sql: |
      REINDEX TABLE CONCURRENTLY tmp
    expect: ok
  - sql: |
      REINDEX (CONCURRENTLY) INDEX tmp_v
    expect: ok
  - sql: |
      SELECT id, v FROM tmp WHERE v = 200
    expect: rows
    order: ordered
