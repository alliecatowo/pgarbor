# REINDEX of one table requires MAINTAIN on that table; a role without it is refused.
id: cmd-reindex.privilege-maintain
title: REINDEX TABLE by a role without MAINTAIN on the table is refused
family: cmd-reindex
tier: extended
feature_ids: [reindex, reindex-table, privileges, maintain]
required_capabilities: [create-table, create-index, create-role, privileges]
provenance:
  source: pg-docs
  ref: "ref/reindex.sgml#sql-reindex (Notes: Reindexing a single index or table requires having the MAINTAIN privilege on the table)"
quarantine:
  reason: "needs CREATE ROLE and SET ROLE; roles are cluster-global, so this cannot be isolated to one scratch database"
  since: "2026-10-15"
sessions: [a]
setup: |
  CREATE TABLE pm (id int4 PRIMARY KEY, v int4);
  CREATE INDEX pm_v ON pm (v);
steps:
  - sql: |
      REINDEX TABLE pm
    expect: ok
