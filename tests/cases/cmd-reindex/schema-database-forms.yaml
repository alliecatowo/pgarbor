# SCHEMA and DATABASE forms without a name, schema-qualified names, and the CONCURRENTLY placement.
id: cmd-reindex.schema-database-forms
title: REINDEX SCHEMA and REINDEX DATABASE rebuild every index in the current schema or database
family: cmd-reindex
tier: core
feature_ids: [reindex, reindex-schema, reindex-database, reindex-concurrently, schema-qualified-names]
required_capabilities: [create-table, create-index, insert, select, reindex, reindex-concurrently, schemas]
provenance:
  source: pg-docs
  ref: "ref/reindex.sgml#sql-reindex (Parameters: SCHEMA, DATABASE, name; Examples)"
sessions: [a]
setup: |
  CREATE TABLE sch_t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX sch_t_v ON sch_t (v);
  INSERT INTO sch_t VALUES (1, 1), (2, 2), (3, 2);
steps:
  - sql: |
      REINDEX SCHEMA public
    expect: ok
    compare_message: false
  - sql: |
      REINDEX SCHEMA CONCURRENTLY public
    expect: ok
    compare_message: false
  - sql: |
      REINDEX INDEX public.sch_t_v
    expect: ok
  - sql: |
      REINDEX TABLE public.sch_t
    expect: ok
  - sql: |
      REINDEX DATABASE
    expect: ok
  - sql: |
      REINDEX (TABLESPACE pg_default) SCHEMA public
    expect: ok
    compare_message: false
  - sql: |
      SELECT id, v FROM sch_t WHERE v = 2 ORDER BY id
    expect: rows
    order: ordered
