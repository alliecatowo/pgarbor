# Pre-9.0 text syntax: WITH DELIMITER AS and NULL AS on COPY TO, equivalent to the parenthesized options.
id: cmd-copy.legacy-text-syntax
title: "COPY TO legacy WITH DELIMITER AS and NULL AS spelling"
family: cmd-copy
tier: core
feature_ids: [copy, copy-to, copy-options, copy-null-string, copy-delimiter]
required_capabilities: [copy, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/copy.sgml#sql-copy Compatibility (WITH DELIMITER AS, NULL AS)"
sessions: [a]
steps:
  - sql: |
      COPY (SELECT 1 AS a, 'x|y' AS b, NULL::text AS c) TO STDOUT WITH DELIMITER AS '|' NULL AS 'NUL'
    expect: ok
    order: ordered
    comment: a data '|' is backslash-escaped in text format; NULL is written as NUL
  - sql: |
      COPY (SELECT 1 AS a, 'x|y' AS b, NULL::text AS c) TO STDOUT (DELIMITER '|', NULL 'NUL')
    expect: ok
    order: ordered
    comment: same output as the parenthesized spelling
