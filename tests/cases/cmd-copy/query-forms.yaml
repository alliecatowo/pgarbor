# COPY (query) TO STDOUT: the documented example that filters with a SELECT, a VALUES query, and a column list on a table.
id: cmd-copy.query-forms
title: "COPY (query) TO STDOUT with SELECT, VALUES, and a table column list"
family: cmd-copy
tier: core
feature_ids: [copy, copy-to, copy-query-form, select, values]
required_capabilities: [create-table, insert, select, copy]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/copy.sgml#sql-copy Examples: COPY (SELECT * FROM country WHERE country_name LIKE 'A%') TO"
sessions: [a]
setup: |
  CREATE TABLE country (country_code char(2), country_name text);
  INSERT INTO country VALUES ('AF','AFGHANISTAN'),('AL','ALBANIA'),('DZ','ALGERIA'),('ZM','ZAMBIA'),('ZW','ZIMBABWE');
steps:
  - sql: |
      COPY (SELECT * FROM country WHERE country_name LIKE 'A%') TO STDOUT
    expect: ok
    order: multiset
    comment: documented example; copies only countries whose names start with A
  - sql: |
      COPY (SELECT country_name, length(country_name) FROM country ORDER BY country_code DESC) TO STDOUT (FORMAT csv)
    expect: ok
    order: ordered
  - sql: |
      COPY (VALUES (1, 'x'), (2, 'y')) TO STDOUT (FORMAT csv, HEADER)
    expect: ok
    order: ordered
    comment: VALUES is an accepted query form
  - sql: |
      COPY (SELECT 1 + 1 AS two) TO STDOUT
    expect: ok
    order: ordered
  - sql: |
      COPY country (country_name) TO STDOUT
    expect: ok
    order: multiset
    comment: column list restricts the output columns
  - sql: |
      COPY (SELECT * FROM country WHERE country_name LIKE 'Z%') TO STDOUT (FORMAT csv, FORCE_QUOTE (country_name))
    expect: ok
    order: ordered
