# Documented example COPY country TO STDOUT (DELIMITER '|'), plus the legacy WITH and USING spellings of the same option.
id: cmd-copy.to-stdout-delimiter
title: "COPY TO STDOUT with a custom DELIMITER, including the legacy spellings"
family: cmd-copy
tier: core
feature_ids: [copy, copy-to, copy-options, copy-delimiter]
required_capabilities: [create-table, insert, copy]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/copy.sgml#sql-copy (Examples: COPY country TO STDOUT (DELIMITER '|'); Compatibility)"
sessions: [a]
setup: |
  CREATE TABLE country (country_code char(2), country_name text);
  INSERT INTO country VALUES ('AF','AFGHANISTAN'),('AL','ALBANIA'),('DZ','ALGERIA'),('ZM','ZAMBIA'),('ZW','ZIMBABWE');
steps:
  - sql: |
      COPY country TO STDOUT (DELIMITER '|')
    expect: ok
    order: multiset
    comment: table order is heap order, so compare as a multiset
  - sql: |
      COPY country TO STDOUT WITH DELIMITER AS '|'
    expect: ok
    order: multiset
    comment: pre-9.0 spelling, WITH DELIMITER AS
  - sql: |
      COPY country TO STDOUT USING DELIMITERS '|'
    expect: ok
    order: multiset
    comment: pre-7.3 spelling, USING DELIMITERS
  - sql: |
      SELECT country_code, country_name FROM country ORDER BY country_code
    expect: rows
    order: ordered
