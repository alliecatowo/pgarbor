# COPY (INSERT|UPDATE|DELETE ... RETURNING) TO STDOUT runs the DML and streams the RETURNING rows; a DML query without RETURNING is rejected.
id: cmd-copy.dml-query-returning
title: "COPY over INSERT, UPDATE and DELETE with RETURNING; DML without RETURNING is rejected"
family: cmd-copy
tier: core
feature_ids: [copy, copy-to, copy-query-form, dml, returning]
required_capabilities: [create-table, insert, update, delete, select, copy, returning, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/copy.sgml#sql-copy parameter query"
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY, v int4);
  INSERT INTO d VALUES (1, 10), (2, 20);
steps:
  - sql: |
      COPY (INSERT INTO d VALUES (3, 30) RETURNING id, v) TO STDOUT
    expect: ok
    comment: the INSERT is executed and its returned row is copied out
  - sql: |
      COPY (UPDATE d SET v = v + 1 WHERE id = 1 RETURNING id, v) TO STDOUT (FORMAT csv)
    expect: ok
  - sql: |
      COPY (DELETE FROM d WHERE id = 2 RETURNING id) TO STDOUT
    expect: ok
  - sql: |
      SELECT id, v FROM d ORDER BY id
    expect: rows
    order: ordered
    comment: rows reflect the three DML statements
  - sql: |
      COPY (INSERT INTO d VALUES (4, 40)) TO STDOUT
    expect: error
    sqlstate: "0A000"
    comment: a DML query must have RETURNING
  - sql: |
      SELECT count(*) FROM d
    expect: rows
    order: ordered
    comment: the rejected statement inserted nothing
