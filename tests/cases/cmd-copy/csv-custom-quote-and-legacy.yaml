# CSV with a custom QUOTE and ESCAPE character, and the legacy WITH CSV spelling including FORCE QUOTE.
id: cmd-copy.csv-custom-quote-and-legacy
title: "COPY CSV custom QUOTE and ESCAPE characters, with the legacy WITH CSV syntax"
family: cmd-copy
tier: core
feature_ids: [copy, copy-to, copy-csv-format, copy-quote, copy-escape, copy-force-quote]
required_capabilities: [copy, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/copy.sgml#sql-copy option QUOTE, ESCAPE; Compatibility (WITH CSV HEADER QUOTE AS ... FORCE QUOTE)"
sessions: [a]
steps:
  - sql: |
      COPY (SELECT 'a"b' AS v, '*x' AS w) TO STDOUT (FORMAT csv, QUOTE '*', ESCAPE '\')
    expect: ok
    order: ordered
    comment: a double quote is not special when QUOTE is '*'; a value containing '*' is wrapped in '*' and the '*' inside it is escaped with the backslash
  - sql: |
      COPY (SELECT 'say "hi"' AS v) TO STDOUT (FORMAT csv)
    expect: ok
    order: ordered
    comment: default ESCAPE equals QUOTE, so embedded double quotes are doubled
  - sql: |
      COPY (SELECT 1 AS a, 'x' AS b) TO STDOUT WITH CSV HEADER QUOTE AS '''' ESCAPE AS '\' FORCE QUOTE *
    expect: ok
    order: ordered
    comment: legacy syntax; QUOTE AS and ESCAPE AS spellings with FORCE QUOTE *
  - sql: |
      COPY (SELECT 'v' AS a) TO STDOUT WITH CSV HEADER FORCE QUOTE a
    expect: ok
    order: ordered
    comment: legacy FORCE QUOTE with a column name
