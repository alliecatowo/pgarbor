# Without a column list COPY TO omits generated columns; an explicit column list can reorder columns but cannot name a generated column.
id: cmd-copy.generated-and-column-list
title: "COPY TO omits generated columns by default and rejects them in an explicit list"
family: cmd-copy
tier: core
feature_ids: [copy, copy-to, column-list, generated-columns, errors]
required_capabilities: [create-table, insert, copy, generated-columns, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/copy.sgml#sql-copy parameter column_name"
sessions: [a]
setup: |
  CREATE TABLE gt (a int4, b int4, g int4 GENERATED ALWAYS AS (a * 10) STORED);
  INSERT INTO gt (a, b) VALUES (1, 2), (3, 4);
steps:
  - sql: |
      COPY gt TO STDOUT
    expect: ok
    order: multiset
    comment: generated column g is not copied when no list is given
  - sql: |
      COPY gt (b, a) TO STDOUT
    expect: ok
    order: multiset
    comment: explicit list controls column order
  - sql: |
      COPY gt (a) TO STDOUT (FORMAT csv, HEADER)
    expect: ok
    order: multiset
  - sql: |
      COPY gt (a, g) TO STDOUT (FORMAT csv)
    expect: error
    sqlstate: "42P10"
    comment: generated columns cannot be used in COPY
