# Provenance: pg-regress misc_functions.sql, "should fail, one or more arguments is required".
id: misc-functions.variadic-no-args
title: num_nonnulls() and num_nulls() with zero arguments fail with undefined function
family: misc-functions
tier: core
feature_ids: [num-nonnulls, num-nulls, variadic-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/misc_functions.sql"
sessions: [a]
steps:
  - sql: |
      SELECT num_nonnulls()
    expect: error
    sqlstate: "42883"
    comment: at least one argument is required, so no zero-argument signature exists
  - sql: |
      SELECT num_nulls()
    expect: error
    sqlstate: "42883"
