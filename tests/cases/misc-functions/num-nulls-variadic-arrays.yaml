# Provenance: pg-regress misc_functions.sql, num_nulls(VARIADIC ...) section.
id: misc-functions.num-nulls-variadic-arrays
title: num_nulls(VARIADIC array) counts NULL elements, distinguishing NULL arrays from empty arrays
family: misc-functions
tier: core
feature_ids: [num-nulls, variadic-functions, arrays, null-semantics]
required_capabilities: [select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/misc_functions.sql"
sessions: [a]
steps:
  - sql: |
      SELECT num_nulls(VARIADIC '{1,2,NULL,3}'::int[])
    expect: rows
  - sql: |
      SELECT num_nulls(VARIADIC '{"1","2","3","4"}'::text[])
    expect: rows
  - sql: |
      SELECT num_nulls(VARIADIC NULL::text[])
    expect: rows
    comment: a NULL array argument, not an array of NULLs
  - sql: |
      SELECT num_nulls(VARIADIC '{}'::int[])
    expect: rows
    comment: empty array
  - sql: |
      SELECT num_nulls(VARIADIC ARRAY(SELECT CASE WHEN i <> 40 THEN i END FROM generate_series(1, 100) i))
    expect: rows
    comment: array built by subquery with exactly one NULL element
