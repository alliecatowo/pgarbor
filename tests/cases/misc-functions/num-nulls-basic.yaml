# Provenance: pg-regress misc_functions.sql, num_nulls() section, rewritten as a compact case.
id: misc-functions.num-nulls-basic
title: num_nulls counts NULL arguments of mixed types, including empty string and zero
family: misc-functions
tier: core
feature_ids: [num-nulls, variadic-functions, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/misc_functions.sql"
sessions: [a]
steps:
  - sql: |
      SELECT num_nulls(NULL);
      SELECT num_nulls('1');
      SELECT num_nulls(NULL::text);
      SELECT num_nulls(NULL::text, NULL::int)
    expect: rows
    comment: single-NULL and all-NULL argument lists
  - sql: |
      SELECT num_nulls(1, 2, NULL::text, NULL::bool, '', int8 '9', 1.0 / NULL);
      SELECT num_nulls(0, NULL::int, ''::text)
    expect: rows
    comment: zero and empty string are not NULL; 1.0 / NULL is NULL
