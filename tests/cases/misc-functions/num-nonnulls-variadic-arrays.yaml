# Provenance: pg-regress misc_functions.sql, num_nonnulls(VARIADIC ...) section.
id: misc-functions.num-nonnulls-variadic-arrays
title: num_nonnulls(VARIADIC array) counts elements of int, text, empty, NULL and generated arrays
family: misc-functions
tier: core
feature_ids: [num-nonnulls, variadic-functions, arrays, null-semantics]
required_capabilities: [select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/misc_functions.sql"
sessions: [a]
steps:
  - sql: |
      SELECT num_nonnulls(VARIADIC '{1,2,NULL,3}'::int[])
    expect: rows
  - sql: |
      SELECT num_nonnulls(VARIADIC '{"1","2","3","4"}'::text[])
    expect: rows
  - sql: |
      SELECT num_nonnulls(VARIADIC NULL::text[])
    expect: rows
    comment: a NULL array argument, not an array of NULLs
  - sql: |
      SELECT num_nonnulls(VARIADIC '{}'::int[])
    expect: rows
    comment: empty array
  - sql: |
      SELECT num_nonnulls(VARIADIC ARRAY(SELECT CASE WHEN i <> 40 THEN i END FROM generate_series(1, 100) i))
    expect: rows
    comment: array built by subquery with exactly one NULL element
