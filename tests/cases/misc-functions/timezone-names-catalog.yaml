# Provenance: pg-regress misc_functions.sql, pg_timezone_names() section (UTC row only; the
# rest of the zone list depends on the tzdata build and is not compared).
id: misc-functions.timezone-names-catalog
title: pg_timezone_names exposes the UTC zone with zero offset and no DST
family: misc-functions
tier: extended
feature_ids: [pg-timezone-names, catalog-introspection, datetime]
required_capabilities: [catalog, datetime]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/misc_functions.sql"
sessions: [a]
steps:
  - sql: |
      SELECT name, is_dst, utc_offset FROM pg_timezone_names WHERE name = 'UTC'
    expect: rows
    comment: restricted to one row so the full zone list (tzdata-dependent) is not compared
  - sql: |
      SELECT count(*) FROM pg_timezone_names WHERE name = 'UTC'
    expect: rows
