# Provenance: pg-regress misc_functions.sql, generate_series_numeric row-estimate section
# (results and error paths only; the EXPLAIN row-estimate checks are not reproduced).
id: misc-functions.generate-series-numeric
title: generate_series over numeric with unit, custom, decreasing and empty ranges, plus step errors
family: misc-functions
tier: core
feature_ids: [generate-series, numeric, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/misc_functions.sql"
sessions: [a]
steps:
  - sql: |
      SELECT count(*), sum(s) FROM generate_series(1.0, 25.0) AS g(s)
    expect: rows
  - sql: |
      SELECT s FROM generate_series(1.0, 25.0, 2.0) AS g(s) ORDER BY s
    expect: rows
    order: ordered
  - sql: |
      SELECT s FROM generate_series(25.0, 1.0, -1.0) AS g(s) ORDER BY s
    expect: rows
    order: ordered
  - sql: |
      SELECT s FROM generate_series(25.0, 1.0, 1.0) AS g(s)
    expect: rows
    comment: empty range
  - sql: |
      SELECT s FROM generate_series(1.0, 25.0, 0.0) AS g(s)
    expect: error
    sqlstate: "22023"
    comment: zero step is rejected
  - sql: |
      SELECT s FROM generate_series(1.0, 25.0, 'NaN'::numeric) AS g(s)
    expect: error
    sqlstate: "22023"
    comment: NaN step is rejected
