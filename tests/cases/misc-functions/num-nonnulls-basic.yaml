# Provenance: pg-regress misc_functions.sql, num_nonnulls() section, rewritten as a compact case.
id: misc-functions.num-nonnulls-basic
title: num_nonnulls counts non-NULL arguments of mixed types, including empty string and zero
family: misc-functions
tier: core
feature_ids: [num-nonnulls, variadic-functions, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/misc_functions.sql"
sessions: [a]
steps:
  - sql: |
      SELECT num_nonnulls(NULL);
      SELECT num_nonnulls('1');
      SELECT num_nonnulls(NULL::text);
      SELECT num_nonnulls(NULL::text, NULL::int)
    expect: rows
    comment: single-NULL and all-NULL argument lists
  - sql: |
      SELECT num_nonnulls(1, 2, NULL::text, NULL::bool, '', int8 '9', 1.0 / NULL);
      SELECT num_nonnulls(0, NULL::int, ''::text)
    expect: rows
    comment: zero and empty string are non-NULL; 1.0 / NULL is NULL
