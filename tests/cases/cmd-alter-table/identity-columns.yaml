# ADD COLUMN ... GENERATED ALWAYS AS IDENTITY numbers existing rows; ALWAYS refuses explicit values until SET GENERATED BY DEFAULT; DROP IDENTITY errors.
id: cmd-alter-table.identity-columns
title: "Identity columns: existing rows get numbers, GENERATED ALWAYS refuses explicit values, DROP IDENTITY rules"
family: cmd-alter-table
tier: core
feature_ids: [alter-table, identity-columns, generated-always, generated-by-default, errors]
required_capabilities: [create-table, alter-table, insert, select, identity, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_table.sgml#sql-altertable (Parameters: ADD GENERATED ... AS IDENTITY, SET GENERATED, DROP IDENTITY [ IF EXISTS ])"
sessions: [a]
setup: |
  CREATE TABLE idt (k int4);
  INSERT INTO idt VALUES (10), (20), (30);
steps:
  - sql: |
      ALTER TABLE idt ADD COLUMN id int4 GENERATED ALWAYS AS IDENTITY
    expect: ok
  - sql: |
      SELECT count(*) AS n, count(DISTINCT id) AS distinct_ids, min(id) AS lo, max(id) AS hi FROM idt
    expect: rows
  - sql: |
      INSERT INTO idt (id, k) VALUES (99, 40)
    expect: error
    sqlstate: "428C9"
    comment: GENERATED ALWAYS refuses an explicit value
  - sql: |
      INSERT INTO idt (k) VALUES (40)
    expect: ok
  - sql: |
      ALTER TABLE idt ALTER COLUMN id SET GENERATED BY DEFAULT
    expect: ok
  - sql: |
      INSERT INTO idt (id, k) VALUES (99, 50)
    expect: ok
  - sql: |
      SELECT id FROM idt WHERE k = 50
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE idt ALTER COLUMN id DROP IDENTITY IF EXISTS
    expect: ok
  - sql: |
      ALTER TABLE idt ALTER COLUMN id DROP IDENTITY
    expect: error
    sqlstate: "55000"
    comment: the column is no longer an identity column
  - sql: |
      ALTER TABLE idt ADD COLUMN tx text GENERATED ALWAYS AS IDENTITY
    expect: error
    sqlstate: "22023"
    comment: identity columns must be smallint, integer or bigint
