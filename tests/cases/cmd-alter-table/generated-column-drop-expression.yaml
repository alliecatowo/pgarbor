# A STORED generated column rejects writes and DEFAULT (42601, 428C9); DROP EXPRESSION turns it into a plain column that keeps its values.
id: cmd-alter-table.generated-column-drop-expression
title: "Generated column rejects writes until DROP EXPRESSION makes it an ordinary column"
family: cmd-alter-table
tier: core
feature_ids: [alter-table, generated-columns, drop-expression, column-default, errors]
required_capabilities: [create-table, alter-table, insert, update, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_table.sgml#sql-altertable (Parameters: DROP EXPRESSION; Notes: generated columns)"
sessions: [a]
setup: |
  CREATE TABLE gx (a int4, d int4 GENERATED ALWAYS AS (a * 2) STORED);
  INSERT INTO gx (a) VALUES (4), (NULL);
steps:
  - sql: |
      SELECT a, d FROM gx ORDER BY a NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE gx ALTER COLUMN d SET DEFAULT 5
    expect: error
    sqlstate: "42601"
    comment: generated columns cannot take a DEFAULT
  - sql: |
      INSERT INTO gx (a, d) VALUES (5, 99)
    expect: error
    sqlstate: "428C9"
    comment: an explicit value for a generated column is refused
  - sql: |
      ALTER TABLE gx ALTER COLUMN d DROP EXPRESSION
    expect: ok
    comment: the stored values are kept
  - sql: |
      SELECT a, d FROM gx ORDER BY a NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO gx (a, d) VALUES (5, 99)
    expect: ok
  - sql: |
      UPDATE gx SET a = 8 WHERE a = 4
    expect: ok
    comment: d no longer follows a, so it keeps its value
  - sql: |
      ALTER TABLE gx ALTER COLUMN d SET DEFAULT 5
    expect: ok
  - sql: |
      INSERT INTO gx (a) VALUES (7)
    expect: ok
  - sql: |
      SELECT a, d FROM gx ORDER BY a NULLS LAST
    expect: rows
    order: ordered
