# SET NOT NULL fails while NULLs exist (23502) and the whole ALTER is rolled back; DROP NOT NULL allows NULLs again.
id: cmd-alter-table.set-drop-not-null
title: "SET NOT NULL rejects existing NULLs (23502) and DROP NOT NULL allows them again"
family: cmd-alter-table
tier: core
feature_ids: [alter-table, not-null, null-semantics, errors]
required_capabilities: [create-table, alter-table, insert, update, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_table.sgml#sql-altertable (Examples: SET NOT NULL / DROP NOT NULL)"
sessions: [a]
setup: |
  CREATE TABLE people (id int4 NOT NULL, nick text, age int4);
  INSERT INTO people VALUES (1, 'al', 30), (2, NULL, NULL);
steps:
  - sql: |
      ALTER TABLE people ALTER COLUMN nick SET NOT NULL
    expect: error
    sqlstate: "23502"
    comment: row 2 has a NULL nick
  - sql: |
      ALTER TABLE people ALTER COLUMN age DROP NOT NULL
    expect: ok
    comment: dropping NOT NULL from a nullable column is accepted
  - sql: |
      ALTER TABLE people ALTER COLUMN id DROP NOT NULL
    expect: ok
  - sql: |
      INSERT INTO people VALUES (NULL, 'bo', 50)
    expect: ok
    comment: id may now be NULL
  - sql: |
      UPDATE people SET nick = 'x' WHERE nick IS NULL
    expect: ok
  - sql: |
      ALTER TABLE people ALTER COLUMN nick SET NOT NULL
    expect: ok
  - sql: |
      SELECT count(*) AS age_nulls FROM people WHERE age IS NULL
    expect: rows
  - sql: |
      ALTER TABLE people ALTER COLUMN nick SET NOT NULL, ALTER COLUMN age SET NOT NULL
    expect: error
    sqlstate: "23502"
    comment: age still has a NULL, so the whole statement fails
  - sql: |
      ALTER TABLE people ALTER COLUMN id SET NOT NULL
    expect: error
    sqlstate: "23502"
