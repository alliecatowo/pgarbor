# Exception conditions by name (case-insensitive, OR lists), by SQLSTATE, and propagation from nested blocks and handlers.
id: doc-plpgsql-control-structures.exception-condition-names-nesting
title: "Condition names are case-insensitive, SQLSTATE and names are equivalent, unmatched errors propagate outward"
family: doc-plpgsql-control-structures
tier: core
feature_ids: [plpgsql, exceptions, condition-names, sqlstate, nested-blocks]
required_capabilities: [plpgsql, create-function, create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-control-structures (Trapping Errors: condition names and SQLSTATE)"
sessions: [a]
setup: |
  CREATE TABLE ut (a int PRIMARY KEY, b text);
  INSERT INTO ut VALUES (1, 'x');
  CREATE FUNCTION div_by_name(x int) RETURNS text LANGUAGE plpgsql AS $$
  BEGIN
    PERFORM 1 / x;
    RETURN 'ok';
  EXCEPTION
    WHEN DIVISION_BY_ZERO OR unique_violation THEN
      RETURN 'caught by name';
  END $$;
  CREATE FUNCTION div_by_state(x int) RETURNS text LANGUAGE plpgsql AS $$
  BEGIN
    PERFORM 1 / x;
    RETURN 'ok';
  EXCEPTION
    WHEN SQLSTATE '22012' THEN
      RETURN 'caught by sqlstate';
  END $$;
  CREATE FUNCTION nested_propagate() RETURNS text LANGUAGE plpgsql AS $$
  BEGIN
    BEGIN
      INSERT INTO ut VALUES (1, 'dup');
    EXCEPTION WHEN division_by_zero THEN
      RETURN 'wrong handler';
    END;
    RETURN 'no error';
  EXCEPTION WHEN unique_violation THEN
    RETURN 'outer caught unique_violation';
  END $$;
  CREATE FUNCTION handler_error() RETURNS text LANGUAGE plpgsql AS $$
  BEGIN
    BEGIN
      PERFORM 1 / 0;
    EXCEPTION WHEN division_by_zero THEN
      PERFORM 1 / 0;
    END;
    RETURN 'none';
  EXCEPTION WHEN OTHERS THEN
    RETURN 'outer ' || SQLSTATE;
  END $$;
steps:
  - sql: |
      SELECT div_by_name(0) AS zero, div_by_name(5) AS five
    expect: rows
    comment: the upper-case condition name matches, and the no-error path returns ok
  - sql: |
      SELECT div_by_state(0) AS zero
    expect: rows
    comment: SQLSTATE 22012 is the same condition as division_by_zero
  - sql: |
      SELECT nested_propagate() AS res
    expect: rows
    comment: the inner clause does not match 23505, so the error propagates to the outer block
  - sql: |
      SELECT handler_error() AS res
    expect: rows
    comment: an error raised inside a handler is not caught by that same EXCEPTION clause
