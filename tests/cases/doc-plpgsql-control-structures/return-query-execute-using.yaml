# RETURN QUERY EXECUTE with USING parameters, including boundary values that select zero or all rows.
id: doc-plpgsql-control-structures.return-query-execute-using
title: "RETURN QUERY EXECUTE passes USING parameters and returns rows or none at the boundary"
family: doc-plpgsql-control-structures
tier: core
feature_ids: [plpgsql, return-query, execute, using, set-returning-functions]
required_capabilities: [plpgsql, create-function, select, set-returning-functions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-control-structures (RETURN QUERY EXECUTE command-string USING expression)"
sessions: [a]
setup: |
  CREATE FUNCTION nums_above(lim int) RETURNS SETOF int LANGUAGE plpgsql AS $$
  BEGIN
    RETURN QUERY EXECUTE 'SELECT g FROM generate_series(1, 10) g WHERE g > $1 ORDER BY g' USING lim;
  END $$;
steps:
  - sql: |
      SELECT * FROM nums_above(7)
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM nums_above(0)
    expect: rows
    comment: every generated value is greater than 0
  - sql: |
      SELECT count(*) FROM nums_above(10)
    expect: rows
    comment: boundary, nothing is greater than the upper bound
