# SQL-standard year-month and day-time literals, restricted field sets and output under IntervalStyle sql_standard.
id: interval.sql-standard-literals
title: SQL-standard interval literals with restricted field sets and sql_standard output
family: interval
tier: extended
feature_ids: [interval, interval-style, sql-literals]
required_capabilities: [interval, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/interval.sql (SQL-spec syntaxes for restricted field sets; sql_standard output)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT interval '1-2' year to month AS ym,
             interval '1 2:03:04' day to second AS dts,
             interval '1 2' day to hour AS dh,
             interval '1 2:03' hour to minute AS hm
    expect: rows
    order: multiset
  - sql: |
      SET IntervalStyle TO sql_standard
    expect: ok
  - sql: |
      SELECT interval '0' AS zero,
             interval '1-2' year to month AS year_month,
             interval '1 2:03:04' day to second AS day_time,
             - interval '1-2' AS negative_year_month
    expect: rows
    order: multiset
  - sql: |
      SELECT interval '1 day -1 hours' AS mixed,
             interval '-23 hours 45 min 12.34 sec' AS sign_match
    expect: rows
    order: multiset
  - sql: |
      SELECT interval '123 11' day
    expect: error
    comment: day-only restriction cannot take a two-field literal
  - sql: |
      SELECT interval '123 11'
    expect: error
    comment: too ambiguous without a field restriction
