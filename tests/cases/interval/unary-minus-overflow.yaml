# Negating the most negative day or microsecond component overflows, while the next value is fine.
id: interval.unary-minus-overflow
title: Unary minus on interval at the int32 and int64 boundaries
family: interval
tier: extended
feature_ids: [interval, arithmetic, overflow-errors]
required_capabilities: [interval, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/interval.sql (test unary minus)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT -('-2147483647 days'::interval) AS ok_days
    expect: rows
    order: multiset
  - sql: |
      SELECT -('-2147483648 days'::interval)
    expect: error
    sqlstate: "22008"
    comment: int32 day component cannot be negated
  - sql: |
      SELECT -('-9223372036854775807 us'::interval) AS ok_us
    expect: rows
    order: multiset
  - sql: |
      SELECT -('-9223372036854775808 us'::interval)
    expect: error
    sqlstate: "22008"
    comment: int64 microsecond component cannot be negated
  - sql: |
      SELECT -('-2147483647 months -2147483647 days -9223372036854775807 us'::interval)
    expect: error
    sqlstate: "22008"
