# justify_hours, justify_days and justify_interval normalize fields without changing total duration.
id: interval.justify-functions
title: justify_hours, justify_days and justify_interval normalize interval fields
family: interval
tier: core
feature_ids: [interval, justify, functions]
required_capabilities: [interval, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/interval.sql (justify_hours, justify_days, justify_interval)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET IntervalStyle TO postgres
    expect: ok
  - sql: |
      SELECT justify_hours(interval '6 months 3 days 52 hours 3 minutes 2 seconds') AS hrs
    expect: rows
    order: multiset
  - sql: |
      SELECT justify_days(interval '6 months 36 days 5 hours 4 minutes 3 seconds') AS dys
    expect: rows
    order: multiset
  - sql: |
      SELECT justify_interval(interval '1 month -1 hour') AS mixed_sign
    expect: rows
    order: multiset
  - sql: |
      SELECT justify_interval(interval '-2147483648 months -30 days 24 hrs') AS neg
    expect: rows
    order: multiset
  - sql: |
      SELECT justify_hours(interval '2147483647 days 24 hrs')
    expect: error
    sqlstate: "22008"
    comment: day field would overflow int32 after normalization
