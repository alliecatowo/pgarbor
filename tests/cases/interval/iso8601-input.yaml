# ISO 8601 duration designators and alternative format accepted as interval input.
id: interval.iso8601-input
title: ISO 8601 designator and alternative-format interval input
family: interval
tier: extended
feature_ids: [interval, iso-8601, input-parsing]
required_capabilities: [interval, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/interval.sql (ISO 8601 4.4.2.1 and 4.4.2.2)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET IntervalStyle TO sql_standard
    expect: ok
  - sql: |
      SELECT interval 'P0Y' AS zero,
             interval 'P1Y2M' AS ym,
             interval 'P1W' AS week,
             interval 'P1DT2H3M4S' AS dt,
             interval 'P1Y2M3DT4H5M6.7S' AS all_fields,
             interval 'P-1Y-2M-3DT-4H-5M-6.7S' AS negative,
             interval 'PT-0.1S' AS frac
    expect: rows
    order: multiset
  - sql: |
      SET IntervalStyle TO postgres
    expect: ok
  - sql: |
      SELECT interval 'P00021015T103020' AS basic_format,
             interval 'P0002-10-15T10:30:20' AS extended_format,
             interval 'P0002' AS year_only,
             interval 'PT10:30' AS hour_minute
    expect: rows
    order: multiset
  - sql: |
      SELECT interval 'P.Y0M3DT4H5M6S'
    expect: error
    comment: a bare fraction with no digits is not a valid ISO 8601 field
