# Malformed interval input is rejected with SQLSTATE 22007; duplicate units and empty strings included.
id: interval.input-syntax-errors
title: Malformed, duplicate-unit and empty interval strings raise 22007
family: interval
tier: core
feature_ids: [interval, input-validation, errors]
required_capabilities: [interval, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/interval.sql (badly formatted, duplicate units)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT interval 'badly formatted interval'
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT interval ''
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT '1 second 2 seconds'::interval
    expect: error
    sqlstate: "22007"
    comment: duplicate unit
  - sql: |
      SELECT '1 day 1 day'::interval
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT '1:20:05 5 microseconds'::interval
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT '3 days 5 milliseconds'::interval AS ok
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_input_is_valid('1.5 weeks', 'interval') AS good,
             pg_input_is_valid('garbage', 'interval') AS bad
    expect: rows
    order: multiset
    comment: non-throwing validity check
