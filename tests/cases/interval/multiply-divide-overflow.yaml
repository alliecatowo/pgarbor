# Interval multiplication overflow and division by zero, with a normal scaling case.
id: interval.multiply-divide-overflow
title: Interval scaling by float factors, overflow and division by zero
family: interval
tier: core
feature_ids: [interval, arithmetic, overflow-errors, division]
required_capabilities: [interval, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/interval.sql (multiplication and division overflow test cases)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT interval '1 day' * 2 AS doubled, interval '1 day' / 4 AS quartered
    expect: rows
    order: multiset
  - sql: |
      SELECT '3000000 months'::interval * 1000
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '3000000 days'::interval * 1000
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT interval '1 day' / 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT interval '1 day' / 0.0
    expect: error
    sqlstate: "22012"
