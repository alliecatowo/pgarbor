# Interval addition and subtraction that overflow the int32 day field are rejected; adjacent safe sums succeed.
id: interval.add-overflow
title: Interval addition overflow on the day component raises 22008
family: interval
tier: extended
feature_ids: [interval, arithmetic, overflow-errors]
required_capabilities: [interval, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/interval.sql (overflow detection in comparisons and arithmetic)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT interval '2147483646 days' + interval '1 day' AS edge_ok
    expect: rows
    order: multiset
  - sql: |
      SELECT interval '2147483647 days' + interval '1 day'
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT interval '2147483647 days' - interval '-1 day'
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT interval '2147483647 days 2147483647 months' - interval '0 days'  AS ok_big
    expect: rows
    order: multiset
