# A positional parameter followed directly by identifier characters is a syntax error at PREPARE time.
id: numerology.prepare-param-trailing-junk
title: Parameter reference with trailing identifier characters fails in PREPARE
family: numerology
tier: extended
feature_ids: [prepared-statements, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      PREPARE p1 AS SELECT $1a
    expect: error
    sqlstate: "42601"
