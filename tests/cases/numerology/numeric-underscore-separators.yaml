# Digit separators underscore are allowed inside integer, radix, fraction and exponent literals.
id: numerology.numeric-underscore-separators
title: Underscore digit separators in decimal, radix and fractional literals
family: numerology
tier: core
feature_ids: [numeric-literals, select]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 1_000_000 AS a, 1_2_3 AS b, 0x1EEE_FFFF AS c, 0o2_73 AS d, 0b_10_0101 AS e
    expect: rows
  - sql: |
      SELECT 1_000.000_005 AS f, 1_000. AS g, .000_005 AS h, 1_000.5e0_1 AS i
    expect: rows
  - sql: |
      SELECT count(*) AS n, sum(i) AS total FROM generate_series(1_001, 1_003) AS i
    expect: rows
    order: multiset
