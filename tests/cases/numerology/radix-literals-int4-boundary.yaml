# Non-decimal literals around the int4 limit: values that fit int4 stay integer, larger ones widen to bigint.
id: numerology.radix-literals-int4-boundary
title: Radix literals near the int4 boundary and their result types
family: numerology
tier: core
feature_ids: [numeric-literals, select, integer-types]
required_capabilities: [select, numeric, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 0x7FFFFFFF AS a, 0x80000000 AS b, -0x80000000 AS c, -0x80000001 AS d,
             0o17777777777 AS e, 0o20000000000 AS f,
             0b1111111111111111111111111111111 AS g, 0b10000000000000000000000000000000 AS h
    expect: rows
  - sql: |
      SELECT pg_typeof(0x7FFFFFFF)::text AS t_max_int4, pg_typeof(0x80000000)::text AS t_first_int8
    expect: rows
    comment: the first value above int4 max should be typed as bigint
