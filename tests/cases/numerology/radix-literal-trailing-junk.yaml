# Radix prefixes with no digits, or digits followed by identifier characters, are syntax errors.
id: numerology.radix-literal-trailing-junk
title: Malformed radix literals raise syntax errors
family: numerology
tier: core
feature_ids: [numeric-literals, errors, select]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 123abc
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 0b
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1b
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 0b0x
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 0o
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1o
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 0x
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 0x0y
    expect: error
    sqlstate: "42601"
