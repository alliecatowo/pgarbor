# Insert float8 values into int2 and int4 columns through explicit casts with range filters, then read back in order.
id: numerology.int-cast-insert-select
title: INSERT SELECT with explicit float8 to int2 and int4 casts under range filters
family: numerology
tier: core
feature_ids: [casts, insert, select, integer-types, float-types]
required_capabilities: [create-table, insert, select, numeric, float]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
setup: |
  CREATE TABLE flt (f1 float8);
  INSERT INTO flt VALUES (0), (1.5), (-1.5), (32767), (32768.2), (-40000);
  CREATE TABLE i2 (f1 int2);
  CREATE TABLE i4 (f1 int4);
steps:
  - sql: |
      INSERT INTO i2 (f1) SELECT int2(f1) FROM flt WHERE f1 >= -32767 AND f1 <= 32767
    expect: ok
  - sql: |
      INSERT INTO i4 (f1) SELECT int4(f1) FROM flt WHERE f1 > -2147483647 AND f1 < 2147483647
    expect: ok
  - sql: |
      SELECT f1 FROM i2 ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM i4 ORDER BY f1
    expect: rows
    order: ordered
