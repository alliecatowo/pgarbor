# int8 arithmetic overflow raises 22003, and values exactly at the limits still compute.
id: numerology.int8-overflow-arithmetic
title: int8 arithmetic at the bigint limits and overflow errors
family: numerology
tier: core
feature_ids: [integer-types, arithmetic, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 9223372036854775807::int8 - 1 AS top_minus_one, (-9223372036854775808)::int8 + 1 AS bottom_plus_one
    expect: rows
  - sql: |
      SELECT 9223372036854775807::int8 + 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 4294967296::int8 * 4294967296::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-9223372036854775808)::int8 / -1
    expect: error
    sqlstate: "22003"
