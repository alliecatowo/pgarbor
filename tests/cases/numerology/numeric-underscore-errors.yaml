# Misplaced digit separators are not part of the literal and fail to parse or resolve.
id: numerology.numeric-underscore-errors
title: Misplaced underscores in numeric literals are rejected
family: numerology
tier: core
feature_ids: [numeric-literals, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 100_
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 100__000
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1_000.5_
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT _100
    expect: error
    sqlstate: "42703"
    comment: a leading underscore makes an identifier, which is not a column here
