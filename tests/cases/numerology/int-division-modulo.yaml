# Integer division truncates toward zero and the remainder takes the sign of the dividend.
id: numerology.int-division-modulo
title: Integer division truncation and modulo sign rules
family: numerology
tier: core
feature_ids: [arithmetic, integer-types, numeric]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 7/2 AS a, -7/2 AS b, 7 % (-2) AS c, -7 % 2 AS d, 7.0/2 AS e, 7::numeric/2 AS f
    expect: rows
  - sql: |
      SELECT 9223372036854775807::int8 / 2 AS big_half, (-9223372036854775807)::int8 % 10 AS neg_mod
    expect: rows
