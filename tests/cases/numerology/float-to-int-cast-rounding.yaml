# Float to integer casts round to nearest and propagate NULL; the ordering is fixed by an explicit ORDER BY.
id: numerology.float-to-int-cast-rounding
title: float8 and numeric to integer casts round and keep NULL
family: numerology
tier: core
feature_ids: [casts, numeric, float-types, select]
required_capabilities: [select, numeric, float]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT f1, int4(f1) AS i4, int2(f1) AS i2
      FROM (VALUES (1.4::float8), (1.5::float8), (2.5::float8), (-1.5::float8), (-2.6::float8), (NULL::float8)) AS v(f1)
      ORDER BY f1 NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT int4(2.5::numeric) AS a, int4(3.5::numeric) AS b, int4(-2.5::numeric) AS c
    expect: rows
