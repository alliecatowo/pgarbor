# int4 arithmetic that leaves the range raises numeric_value_out_of_range rather than wrapping.
id: numerology.int4-overflow-arithmetic
title: int4 addition, negation, division and abs overflow raise 22003
family: numerology
tier: core
feature_ids: [integer-types, arithmetic, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 2147483647::int4 - 1 AS edge_ok
    expect: rows
  - sql: |
      SELECT 2147483647::int4 + 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 - 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 65536::int4 * 65536::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 / -1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT abs((-2147483648)::int4)
    expect: error
    sqlstate: "22003"
