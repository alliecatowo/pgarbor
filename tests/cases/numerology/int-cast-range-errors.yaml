# Explicit narrowing casts that are in range succeed; out-of-range casts raise 22003.
id: numerology.int-cast-range-errors
title: Explicit int2 and int4 casts succeed in range and raise out of range
family: numerology
tier: core
feature_ids: [integer-types, casts, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT int2(32767::int4) AS in_range, int4(2147483647::int8) AS in_range_int4
    expect: rows
  - sql: |
      SELECT int2(40000::int4)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int2(9999999999::int8)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int4(1e10::float8)
    expect: error
    sqlstate: "22003"
