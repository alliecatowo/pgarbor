# Division or modulo by zero raises division_by_zero for every numeric family.
id: numerology.division-by-zero
title: Division and modulo by zero raise 22012 for integer float and numeric
family: numerology
tier: core
feature_ids: [arithmetic, errors]
required_capabilities: [select, numeric, float]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 5 % 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1.0::float8 / 0.0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::numeric / 0
    expect: error
    sqlstate: "22012"
