# GROUP BY may name an output column alias when no input column has that name; NULL groups are kept.
id: numerology.groupby-output-alias
title: GROUP BY on an output alias with max min and NULL group values
family: numerology
tier: core
feature_ids: [group-by, aggregates, select]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
setup: |
  CREATE TABLE tg (f1 int4, f2 int4, f3 float8);
  INSERT INTO tg VALUES (1, -10, 1.5), (1, -10, -2.5), (2, 3, 4.0), (2, 3, NULL), (NULL, 7, 0.5);
steps:
  - sql: |
      SELECT f1 AS two, max(f3) AS max_float, min(f3) AS min_float
      FROM tg
      GROUP BY two
      ORDER BY two NULLS LAST, max_float, min_float
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 AS two, max(f2) + min(f2) AS max_plus_min, min(f3) - 1 AS min_minus_1
      FROM tg
      GROUP BY f1
      ORDER BY two NULLS LAST, min_minus_1
    expect: rows
    order: ordered
