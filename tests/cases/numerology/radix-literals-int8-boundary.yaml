# Non-decimal literals near the int8 limit; values beyond bigint range become numeric.
id: numerology.radix-literals-int8-boundary
title: Radix literals near the int8 boundary including the overflow to numeric
family: numerology
tier: extended
feature_ids: [numeric-literals, select, integer-types, numeric]
required_capabilities: [select, numeric, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numerology.sql"
  license: "PostgreSQL License"
steps:
  - sql: |
      SELECT 0x7FFFFFFFFFFFFFFF AS a, 0x8000000000000000 AS b, -0x8000000000000000 AS c,
             -0x8000000000000001 AS d, 0b111111111111111111111111111111111111111111111111111111111111111 AS e
    expect: rows
  - sql: |
      SELECT pg_typeof(0x7FFFFFFFFFFFFFFF)::text AS t_max_int8, pg_typeof(0x8000000000000000)::text AS t_over_int8
    expect: rows
    comment: the value one past int8 max is expected to be numeric rather than an error
