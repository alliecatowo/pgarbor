# OFFSET combined with FETCH FIRST: ONLY returns the window, WITH TIES extends it past the last row.
id: limit.offset-then-fetch
title: OFFSET followed by FETCH FIRST ONLY and WITH TIES
family: limit
tier: core
feature_ids: [offset, fetch-first, with-ties, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql (test ruleutils and FETCH FIRST sections)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (k int4);
  INSERT INTO t VALUES (1),(2),(2),(3),(4),(4),(4),(5);
steps:
  - sql: |
      SELECT k FROM t ORDER BY k OFFSET 2 FETCH FIRST 2 ROWS ONLY
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM t ORDER BY k OFFSET 2 FETCH FIRST 2 ROWS WITH TIES
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM t ORDER BY k OFFSET 100 FETCH FIRST 2 ROWS WITH TIES
    expect: rows
    order: ordered
