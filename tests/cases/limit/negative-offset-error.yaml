# A negative OFFSET is rejected with SQLSTATE 2201X, distinct from the LIMIT error code.
id: limit.negative-offset-error
title: Negative OFFSET raises invalid_row_count_in_result_offset_clause
family: limit
tier: core
feature_ids: [offset, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql; errcodes 2201X"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1),(2);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET -1
    expect: error
    sqlstate: "2201X"
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET -1 LIMIT 1
    expect: error
    sqlstate: "2201X"
