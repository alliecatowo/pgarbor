# A negative LIMIT is rejected at execution time with SQLSTATE 2201W.
id: limit.negative-limit-error
title: Negative LIMIT raises invalid_row_count_in_limit_clause
family: limit
tier: core
feature_ids: [limit, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql; errcodes 2201W"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1),(2);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT -1
    expect: error
    sqlstate: "2201W"
  - sql: |
      SELECT 1
    expect: rows
    order: ordered
    comment: the session is not in a failed transaction after an autocommit error
