# Scrollable cursor over a LIMIT plan: forward, backward and re-forward fetches return the same window.
id: limit.cursor-backward-limit
title: Backward and forward fetch through a cursor over LIMIT
family: limit
tier: extended
feature_ids: [limit, cursors, transactions, fetch]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql (backwards fetch from a LIMIT plan node)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE q (q1 int8, q2 int8);
  INSERT INTO q VALUES (1,10),(2,20),(3,30),(4,40),(5,50);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c1 SCROLL CURSOR FOR SELECT q1 FROM q ORDER BY q1 LIMIT 3
    expect: ok
  - sql: |
      FETCH ALL IN c1
    expect: rows
    order: ordered
  - sql: |
      FETCH BACKWARD 1 IN c1
    expect: rows
    order: ordered
  - sql: |
      FETCH BACKWARD ALL IN c1
    expect: rows
    order: ordered
  - sql: |
      FETCH ALL IN c1
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
