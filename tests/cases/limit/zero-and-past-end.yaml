# LIMIT 0 returns no rows; an OFFSET past the end returns no rows; a LIMIT past the end returns all rows.
id: limit.zero-and-past-end
title: LIMIT 0, OFFSET beyond the row count, and LIMIT beyond the row count
family: limit
tier: core
feature_ids: [limit, offset, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (3),(1),(2);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 0
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 3 OFFSET 100
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 100
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM (SELECT n FROM t ORDER BY n LIMIT 0) AS s
    expect: rows
    order: ordered
