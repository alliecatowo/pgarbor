# A text-typed LIMIT argument has no assignment cast to bigint and fails with 42804.
id: limit.text-argument-error
title: LIMIT with a text-typed expression raises datatype_mismatch
family: limit
tier: extended
feature_ids: [limit, types, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 sql-select.html LIMIT; errcodes 42804"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      SELECT n FROM t LIMIT 'x'::text
    expect: error
    sqlstate: "42804"
