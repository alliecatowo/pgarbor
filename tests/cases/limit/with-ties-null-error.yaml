# A NULL row count is rejected for WITH TIES, while FETCH FIRST NULL ROWS ONLY means all rows.
id: limit.with-ties-null-error
title: FETCH FIRST NULL ROWS WITH TIES is rejected, NULL ROWS ONLY returns all rows
family: limit
tier: extended
feature_ids: [fetch-first, with-ties, nulls, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql (FETCH FIRST NULL ROWS ...)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (k int4);
  INSERT INTO t VALUES (2),(1),(3);
steps:
  - sql: |
      SELECT k FROM t ORDER BY k FETCH FIRST NULL ROWS WITH TIES
    expect: error
  - sql: |
      SELECT k FROM t ORDER BY k FETCH FIRST NULL ROWS ONLY
    expect: rows
    order: ordered
