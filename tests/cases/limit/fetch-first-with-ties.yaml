# FETCH FIRST n ROWS WITH TIES includes every row tied with the last returned row.
id: limit.fetch-first-with-ties
title: FETCH FIRST WITH TIES keeps rows tied on the ORDER BY key
family: limit
tier: core
feature_ids: [limit, fetch-first, with-ties, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql (FETCH FIRST section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (k int4, v text);
  INSERT INTO t VALUES (1,'a'),(1,'b'),(2,'c'),(3,'d'),(3,'e'),(3,'f'),(4,'g');
steps:
  - sql: |
      SELECT k FROM t ORDER BY k FETCH FIRST 2 ROWS WITH TIES
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM t ORDER BY k FETCH FIRST 1 ROW WITH TIES
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM t ORDER BY k FETCH FIRST 4 ROWS WITH TIES
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM t ORDER BY k FETCH FIRST 2 ROWS ONLY
    expect: rows
    order: ordered
