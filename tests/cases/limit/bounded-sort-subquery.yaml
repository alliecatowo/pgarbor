# Scalar subquery with a variable OFFSET over a small sorted generate_series, one result per outer row.
id: limit.bounded-sort-subquery
title: Correlated variable LIMIT/OFFSET inside a scalar subquery
family: limit
tier: extended
feature_ids: [limit, offset, subqueries, generate-series, order-by]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql (bounded-heap stress test)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT s, (SELECT n FROM generate_series(1,10) AS n ORDER BY n LIMIT 1 OFFSET s-1) AS z
      FROM generate_series(1,10) AS s
      ORDER BY s
    expect: rows
    order: ordered
