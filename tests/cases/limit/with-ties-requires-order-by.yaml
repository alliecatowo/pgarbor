# WITH TIES is only defined relative to an ORDER BY, so omitting it is a syntax error.
id: limit.with-ties-requires-order-by
title: WITH TIES without ORDER BY is a syntax error
family: limit
tier: core
feature_ids: [fetch-first, with-ties, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql; errcodes 42601"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (k int4);
  INSERT INTO t VALUES (1),(2);
steps:
  - sql: |
      SELECT k FROM t FETCH FIRST 2 ROW WITH TIES
    expect: error
    sqlstate: "42601"
