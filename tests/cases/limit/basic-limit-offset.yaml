# LIMIT and OFFSET over an ORDER BY, ascending and descending, with a window past the end.
id: limit.basic-limit-offset
title: LIMIT and OFFSET select the expected ordered window
family: limit
tier: core
feature_ids: [limit, offset, order-by, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1,'a'),(2,'b'),(3,'c'),(4,'d'),(5,'e'),(6,'f'),(7,'g'),(8,'h'),(9,'i'),(10,'j');
steps:
  - sql: |
      SELECT id FROM t WHERE id > 5 ORDER BY id LIMIT 2
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM t WHERE id < 50 ORDER BY id DESC LIMIT 3 OFFSET 2
    expect: rows
    order: ordered
  - sql: |
      SELECT id, name FROM t ORDER BY id OFFSET 8
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM t ORDER BY id OFFSET 8 LIMIT 5
    expect: rows
    order: ordered
