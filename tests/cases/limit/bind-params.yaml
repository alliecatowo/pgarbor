# LIMIT and OFFSET given as extended-protocol bind parameters, including a NULL parameter.
id: limit.bind-params
title: LIMIT and OFFSET from bind parameters, with NULL meaning no limit
family: limit
tier: extended
feature_ids: [limit, offset, extended-protocol, prepared-statements]
required_capabilities: [create-table, insert, select, extended-protocol]
provenance:
  source: hand
  ref: "PG18 sql-select.html LIMIT/OFFSET; protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
setup: |
  CREATE TABLE t (n int8 PRIMARY KEY);
  INSERT INTO t VALUES (1),(2),(3),(4),(5);
steps:
  - exec_params:
      sql: |
        SELECT n FROM t ORDER BY n LIMIT $1 OFFSET $2
      params: ["2", "1"]
      param_types: [20, 20]
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT n FROM t ORDER BY n LIMIT $1 OFFSET $2
      params: [null, "3"]
      param_types: [20, 20]
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT n FROM t ORDER BY n LIMIT $1
      params: ["-1"]
      param_types: [20]
    expect: error
    sqlstate: "2201W"
