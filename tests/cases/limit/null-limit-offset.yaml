# NULL LIMIT and NULL OFFSET mean no limit and no offset, as do LIMIT ALL and OFFSET 0.
id: limit.null-limit-offset
title: NULL and ALL in LIMIT and OFFSET behave as no limit
family: limit
tier: core
feature_ids: [limit, offset, select, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (10),(20),(30);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT NULL
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET NULL
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT ALL OFFSET 0
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT NULL OFFSET NULL
    expect: rows
    order: ordered
