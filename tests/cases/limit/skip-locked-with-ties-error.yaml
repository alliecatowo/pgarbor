# FOR UPDATE SKIP LOCKED cannot be combined with WITH TIES.
id: limit.skip-locked-with-ties-error
title: WITH TIES cannot be combined with FOR UPDATE SKIP LOCKED
family: limit
tier: extended
feature_ids: [fetch-first, with-ties, row-locks, errors]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/limit.sql (SKIP LOCKED and WITH TIES)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (k int4);
  INSERT INTO t VALUES (1),(2);
steps:
  - sql: |
      SELECT k FROM t ORDER BY k FETCH FIRST 1 ROW WITH TIES FOR UPDATE SKIP LOCKED
    expect: error
