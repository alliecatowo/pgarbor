# Bit string constants: B'...' is one bit per digit, X'...' is four bits per hex digit; both fit the stated column widths.
id: doc-datatype-bit.literal-forms-and-hex
title: Binary and hex bit string literals produce the documented widths
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, bit-string-literals, hex-literals, length]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (refer to sql-syntax-bit-strings for the syntax of bit string constants)"
sessions: [a]
setup: |
  CREATE TABLE lit4 (a bit(4));
steps:
  - sql: |
      SELECT X'1FF' AS hex12, length(X'1FF') AS hex12_len, bit_length(B'10') AS bin2_len, length(B'') AS empty_len
    expect: rows
    order: multiset
    comment: each hex digit is four bits, so X'1FF' is twelve bits
  - sql: |
      INSERT INTO lit4 VALUES (X'F'), (B'0011')
    expect: ok
  - sql: |
      SELECT a FROM lit4 ORDER BY a
    expect: rows
    order: ordered
