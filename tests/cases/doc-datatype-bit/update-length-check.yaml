# UPDATE applies the same length rules as INSERT: a wrong-width value fails and leaves the row unchanged.
id: doc-datatype-bit.update-length-check
title: UPDATE to a wrong-length bit value fails with 22026 and leaves the row unchanged
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, update, errors]
required_capabilities: [create-table, insert, update, select, errors, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (it is an error to attempt to store shorter or longer bit strings)"
sessions: [a]
setup: |
  CREATE TABLE upd (id int4 PRIMARY KEY, a bit(3));
  INSERT INTO upd VALUES (1, B'101');
steps:
  - sql: |
      UPDATE upd SET a = B'11' WHERE id = 1
    expect: error
    sqlstate: "22026"
  - sql: |
      SELECT id, a FROM upd ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      UPDATE upd SET a = B'110' WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, a FROM upd ORDER BY id
    expect: rows
    order: ordered
