# bit(n) stores exactly n bits: shorter, longer and hex-literal values of the wrong width are rejected with 22026.
id: doc-datatype-bit.bit-n-exact-length
title: bit(n) column rejects shorter, longer and hex-derived bit strings of the wrong length
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, bit-fixed-length, errors]
required_capabilities: [create-table, insert, select, errors, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (bit type data must match the length n exactly)"
sessions: [a]
setup: |
  CREATE TABLE fixed3 (a bit(3));
steps:
  - sql: |
      INSERT INTO fixed3 VALUES (B'111')
    expect: ok
  - sql: |
      INSERT INTO fixed3 VALUES (B'1')
    expect: error
    sqlstate: "22026"
    comment: shorter than n is an error for bit(n)
  - sql: |
      INSERT INTO fixed3 VALUES (B'1011')
    expect: error
    sqlstate: "22026"
    comment: longer than n is an error for bit(n)
  - sql: |
      INSERT INTO fixed3 VALUES (X'F')
    expect: error
    sqlstate: "22026"
    comment: hex literal X'F' is four bits
  - sql: |
      SELECT a FROM fixed3 ORDER BY a
    expect: rows
    order: ordered
