# The datatype-bit example: bit(3) and bit varying(5) columns, one row rejected on length, one fixed by an explicit cast.
id: doc-datatype-bit.documented-example-table
title: Documented bit(3) and bit varying(5) example table with length error and explicit cast fix
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, bit-varying, create-table, insert, select, errors]
required_capabilities: [create-table, insert, select, errors, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (Using the Bit String Types)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE test (a BIT(3), b BIT VARYING(5))
    expect: ok
  - sql: |
      INSERT INTO test VALUES (B'101', B'00')
    expect: ok
  - sql: |
      INSERT INTO test VALUES (B'10', B'101')
    expect: error
    sqlstate: "22026"
    comment: bit(3) column requires exactly three bits
  - sql: |
      INSERT INTO test VALUES (B'10'::bit(3), B'101')
    expect: ok
    comment: explicit cast pads on the right to three bits
  - sql: |
      SELECT a, b FROM test ORDER BY a
    expect: rows
    order: ordered
