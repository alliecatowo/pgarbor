# A bit column declared without a length behaves as bit(1).
id: doc-datatype-bit.bit-no-length-is-bit-1
title: bit with no length specifier is equivalent to bit(1)
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, bit-fixed-length, typmod, errors]
required_capabilities: [create-table, insert, select, errors, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (Writing bit without a length is equivalent to bit(1))"
sessions: [a]
setup: |
  CREATE TABLE onebit (x bit);
steps:
  - sql: |
      INSERT INTO onebit VALUES (B'0'), (B'1')
    expect: ok
  - sql: |
      INSERT INTO onebit VALUES (B'10')
    expect: error
    sqlstate: "22026"
    comment: two bits do not fit bit(1)
  - sql: |
      SELECT x FROM onebit ORDER BY x
    expect: rows
    order: ordered
