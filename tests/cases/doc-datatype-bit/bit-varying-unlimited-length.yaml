# bit varying without a length has unlimited length: a 40-bit value is stored unchanged.
id: doc-datatype-bit.bit-varying-unlimited-length
title: bit varying without a length stores values of any length
family: doc-datatype-bit
tier: core
feature_ids: [bit-varying, bit-string, typmod, length]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (bit varying without a length specification means unlimited length)"
sessions: [a]
setup: |
  CREATE TABLE vunl (v bit varying);
steps:
  - sql: |
      INSERT INTO vunl VALUES (B'1011001110001111000011110000111100001111'), (B'1'), (B'')
    expect: ok
  - sql: |
      SELECT v, length(v) AS len FROM vunl ORDER BY len
    expect: rows
    order: ordered
