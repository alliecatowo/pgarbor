# bit varying(n) accepts any length up to n, including empty and exactly n; longer values fail with 22001.
id: doc-datatype-bit.bit-varying-max-length
title: bit varying(n) accepts lengths up to n and rejects longer values with 22001
family: doc-datatype-bit
tier: core
feature_ids: [bit-varying, bit-string, errors, length]
required_capabilities: [create-table, insert, select, errors, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (bit varying data is of variable length up to the maximum length n)"
sessions: [a]
setup: |
  CREATE TABLE vmax (v bit varying(4));
steps:
  - sql: |
      INSERT INTO vmax VALUES (B''), (B'1'), (B'1010')
    expect: ok
  - sql: |
      INSERT INTO vmax VALUES (B'10101')
    expect: error
    sqlstate: "22001"
    comment: one bit over the maximum length
  - sql: |
      SELECT v, length(v) AS len FROM vmax ORDER BY len, v
    expect: rows
    order: ordered
