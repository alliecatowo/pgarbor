# The length in bit(n) and bit varying(n) must be positive; zero and negative lengths fail at type definition with 22023.
id: doc-datatype-bit.typmod-zero-negative-rejected
title: bit(0), bit varying(0) and bit(-1) are rejected with 22023
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, typmod, errors]
required_capabilities: [create-table, errors, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (n is a positive integer)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE bad_fixed (a bit(0))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE bad_varying (a bit varying(0))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE bad_neg (a bit(-1))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE good_min (a bit(1), b bit varying(1))
    expect: ok
    comment: the smallest allowed length succeeds
