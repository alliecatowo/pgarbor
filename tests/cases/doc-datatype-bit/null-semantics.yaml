# NULL in bit columns: comparisons with NULL yield NULL (filtered out), IS NULL works, and an empty bit varying is not NULL.
id: doc-datatype-bit.null-semantics
title: NULL bit values compare as unknown and are distinct from an empty bit varying value
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, bit-varying, nulls, comparison]
required_capabilities: [create-table, insert, select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (bit(n) and bit varying(n) columns accept NULL); comparison NULL rules per SQL"
sessions: [a]
setup: |
  CREATE TABLE nb (id int4 PRIMARY KEY, a bit(3), v bit varying(4));
  INSERT INTO nb VALUES (1, NULL, NULL), (2, B'101', B''), (3, B'100', B'1');
steps:
  - sql: |
      SELECT id, a IS NULL AS a_null, v IS NULL AS v_null, length(v) AS vlen FROM nb ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM nb WHERE a = B'101' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM nb WHERE a <> B'101' ORDER BY id
    expect: rows
    order: ordered
    comment: row 1 is NULL and so excluded from both = and <>
  - sql: |
      SELECT id, a = B'101' AS eq FROM nb WHERE id = 1
    expect: rows
    order: ordered
