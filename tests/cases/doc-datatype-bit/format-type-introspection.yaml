# Catalog view of the declared types: bit, bit(n), bit varying and bit varying(n) render exactly as declared.
id: doc-datatype-bit.format-type-introspection
title: format_type reports bit, bit(n), bit varying and bit varying(n) column types
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, bit-varying, catalog, typmod]
required_capabilities: [create-table, select, catalog-introspection, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (bit without a length, bit varying without a length)"
sessions: [a]
setup: |
  CREATE TABLE kinds (a bit, b bit(3), c bit varying, d bit varying(5));
steps:
  - sql: |
      SELECT attname, format_type(atttypid, atttypmod) AS declared
      FROM pg_attribute
      WHERE attrelid = 'kinds'::regclass AND attnum > 0 AND NOT attisdropped
      ORDER BY attnum
    expect: rows
    order: ordered
