# Explicit casts never raise: bit(n) pads or truncates on the right, bit varying(n) truncates on the right.
id: doc-datatype-bit.explicit-cast-truncate-pad
title: Explicit casts to bit(n) pad or truncate and casts to bit varying(n) truncate without error
family: doc-datatype-bit
tier: core
feature_ids: [bit-string, bit-varying, casts, typmod]
required_capabilities: [select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-bit (explicitly casts a bit-string value to bit(n) ... truncated or zero-padded)"
sessions: [a]
steps:
  - sql: |
      SELECT B'10'::bit(3) AS pad_right, B'1011'::bit(2) AS trunc_fixed, X'AB'::bit(4) AS hex_trunc
    expect: rows
    order: multiset
    comment: 10 -> 100, 1011 -> 10, hex AB is 1010 1011 truncated to 1010
  - sql: |
      SELECT B'101101'::bit varying(3) AS vtrunc, B'10'::bit varying(5) AS vshort, X'ff'::bit varying(3) AS vhex
    expect: rows
    order: multiset
    comment: bit varying cast truncates on the right and keeps shorter values as they are
  - sql: |
      SELECT B'1011'::bit(4)::bit varying(2) AS chain
    expect: rows
    order: multiset
    comment: fixed-length value cast down to bit varying(2)
