id: cmd-declare.holdable-commit-and-rollback
title: A WITH HOLD cursor survives COMMIT with its position, but vanishes if its creating transaction rolls back
family: cmd-declare
tier: core
feature_ids: [declare-cursor, holdable-cursor, fetch, pg-cursors, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/declare.sgml#sql-declare-notes (WITH HOLD; creating transaction aborted removes the cursor)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE h CURSOR WITH HOLD FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      FETCH 1 FROM h
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT name, is_holdable FROM pg_cursors ORDER BY name
    expect: rows
    order: ordered
  - sql: |
      FETCH 1 FROM h
    expect: rows
    order: ordered
    comment: continues from the saved position
  - sql: |
      CLOSE h
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE h2 CURSOR WITH HOLD FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      FETCH 1 FROM h2
    expect: error
    sqlstate: "34000"
    comment: the creating transaction was aborted, so the cursor is removed
