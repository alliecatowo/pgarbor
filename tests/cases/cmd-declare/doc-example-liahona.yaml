id: cmd-declare.doc-example-liahona
title: Documented DECLARE liahona example fails outside a transaction and works inside one
family: cmd-declare
tier: core
feature_ids: [declare-cursor, fetch, close, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/declare.sgml#sql-declare (Examples: To declare a cursor)"
sessions: [a]
setup: |
  CREATE TABLE films (code char(5) PRIMARY KEY, title varchar(40) NOT NULL, kind varchar(10));
  INSERT INTO films VALUES ('UA502', 'Bananas', 'Comedy'), ('TC101', 'Dark Night', 'Action'), ('BD001', 'Dr. Strangelove', 'Comedy');
steps:
  - sql: |
      DECLARE liahona CURSOR FOR SELECT * FROM films
    expect: error
    sqlstate: "25P01"
    comment: the documented example is a bare statement, so it is outside a transaction block
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE liahona CURSOR FOR SELECT * FROM films
    expect: ok
  - sql: |
      FETCH ALL FROM liahona
    expect: rows
    order: multiset
  - sql: |
      CLOSE liahona
    expect: ok
  - sql: |
      COMMIT
    expect: ok
