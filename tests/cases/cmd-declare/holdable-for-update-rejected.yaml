id: cmd-declare.holdable-for-update-rejected
title: WITH HOLD cannot be combined with FOR UPDATE or FOR SHARE
family: cmd-declare
tier: core
feature_ids: [declare-cursor, holdable-cursor, for-update, for-share, errors]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/declare.sgml#sql-declare-notes (WITH HOLD may not be specified when the query includes FOR UPDATE or FOR SHARE)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE h CURSOR WITH HOLD FOR SELECT id FROM t FOR SHARE
    expect: error
    sqlstate: "0A000"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE h CURSOR WITH HOLD FOR SELECT id FROM t FOR UPDATE
    expect: error
    sqlstate: "0A000"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE h CURSOR FOR SELECT id FROM t FOR UPDATE
    expect: ok
    comment: the same query is fine without WITH HOLD
  - sql: |
      ROLLBACK
    expect: ok
