id: cmd-declare.for-update-where-current-of
title: A FOR UPDATE cursor locks fetched rows and supports UPDATE and DELETE WHERE CURRENT OF
family: cmd-declare
tier: core
feature_ids: [declare-cursor, for-update, where-current-of, update, delete, no-scroll]
required_capabilities: [create-table, insert, select, update, delete, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/declare.sgml#sql-declare-notes (FOR UPDATE; WHERE CURRENT OF)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c NO SCROLL CURSOR FOR SELECT id, name FROM t ORDER BY id FOR UPDATE
    expect: ok
    comment: NO SCROLL is allowed with FOR UPDATE; SCROLL is not
  - sql: |
      FETCH 1 FROM c
    expect: rows
    order: ordered
  - sql: |
      UPDATE t SET name = 'uno' WHERE CURRENT OF c
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM t WHERE CURRENT OF c
    expect: ok
  - sql: |
      SELECT id, name FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
