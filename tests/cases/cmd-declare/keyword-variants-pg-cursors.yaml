id: cmd-declare.keyword-variants-pg-cursors
title: DECLARE keywords (BINARY, ASENSITIVE, SCROLL, HOLD) are order-free and reflected in pg_cursors
family: cmd-declare
tier: core
feature_ids: [declare-cursor, binary-cursor, scroll, holdable-cursor, pg-cursors, cursor-sensitivity]
required_capabilities: [create-table, insert, select, transactions, cursors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/declare.sgml#sql-declare (synopsis; 'The key words ASENSITIVE, BINARY, INSENSITIVE, and SCROLL can appear in any order')"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c1 BINARY INSENSITIVE SCROLL CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
    comment: keywords in an unusual order
  - sql: |
      DECLARE c2 SCROLL ASENSITIVE BINARY CURSOR WITH HOLD FOR SELECT id FROM t ORDER BY id
    expect: ok
    comment: ASENSITIVE is accepted and has no effect; WITH HOLD is accepted in any order
  - sql: |
      DECLARE c3 NO SCROLL CURSOR WITHOUT HOLD FOR SELECT name FROM t ORDER BY id
    expect: ok
  - sql: |
      SELECT name, is_holdable, is_binary, is_scrollable FROM pg_cursors WHERE name IN ('c1', 'c2', 'c3') ORDER BY name
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
