id: cmd-declare.scroll-backward-fetch
title: SCROLL cursor fetches backward, to absolute positions and to the last row
family: cmd-declare
tier: core
feature_ids: [declare-cursor, scroll, fetch, fetch-backward, fetch-absolute]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/declare.sgml#sql-declare (Parameters: SCROLL; Notes: SCROLL option)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c SCROLL CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      FETCH LAST FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH PRIOR FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH ABSOLUTE 1 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH BACKWARD FROM c
    expect: rows
    order: ordered
    comment: stepping backward from position 1 leaves the cursor before the first row
  - sql: |
      FETCH FIRST FROM c
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
