id: cmd-declare.values-cursor-and-close-all-interaction
title: Cursors over VALUES are readable, and a second DECLARE after CLOSE ALL can reuse names
family: cmd-declare
tier: core
feature_ids: [declare-cursor, values, close, close-all, fetch]
required_capabilities: [create-table, select, transactions, cursors, values]
provenance:
  source: pg-docs
  ref: "ref/declare.sgml#sql-declare (query may be VALUES; cursor is closed by CLOSE)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE v1 CURSOR FOR VALUES (1), (2), (3)
    expect: ok
  - sql: |
      DECLARE v2 CURSOR FOR SELECT 'x' || i FROM generate_series(1, 2) AS g(i) ORDER BY i
    expect: ok
  - sql: |
      FETCH 2 FROM v1
    expect: rows
    order: ordered
  - sql: |
      FETCH ALL FROM v2
    expect: rows
    order: ordered
  - sql: |
      CLOSE ALL
    expect: ok
  - sql: |
      DECLARE v1 CURSOR FOR VALUES ('again')
    expect: ok
    comment: the name is free after CLOSE ALL
  - sql: |
      FETCH ALL FROM v1
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
