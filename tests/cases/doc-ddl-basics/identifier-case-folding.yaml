# Names follow the identifier syntax: unquoted names fold to lower case, quoted names keep their case.
id: doc-ddl-basics.identifier-case-folding
title: Unquoted table and column names fold to lower case; quoted names keep case
family: doc-ddl-basics
tier: core
feature_ids: [create-table, identifiers, quoted-identifiers, errors]
required_capabilities: [create-table, insert, select, errors, order-by]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (table and column names follow the identifier syntax); sql-syntax-lexical identifiers"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE "MyTab" ("Col" integer, plain integer)
    expect: ok
  - sql: |
      INSERT INTO "MyTab" ("Col", plain) VALUES (1, 2)
    expect: ok
  - sql: |
      SELECT "Col", plain FROM "MyTab"
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM mytab
    expect: error
    sqlstate: "42P01"
    comment: unquoted mytab folds to mytab, which does not exist
  - sql: |
      SELECT col FROM "MyTab"
    expect: error
    sqlstate: "42703"
    comment: unquoted col folds to col, which does not match "Col"
  - sql: |
      CREATE TABLE Folded (UpperCase integer, lowerCase integer)
    expect: ok
  - sql: |
      SELECT UPPERCASE, LOWERCASE FROM folded ORDER BY 1
    expect: rows
    order: ordered
    comment: unquoted names are case-insensitive and fold to lower case
