# The documented column list is comma-separated and parenthesized; a missing comma is a syntax error.
id: doc-ddl-basics.column-list-syntax
title: Column list must be comma-separated inside parentheses
family: doc-ddl-basics
tier: core
feature_ids: [create-table, table-basics, errors]
required_capabilities: [create-table, errors, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (note that the column list is comma-separated and surrounded by parentheses)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE no_comma (a integer b integer)
    expect: error
    sqlstate: "42601"
    comment: columns need a comma between them
  - sql: |
      CREATE TABLE no_parens a integer, b integer
    expect: error
    sqlstate: "42601"
    comment: the column list must be inside parentheses
  - sql: |
      CREATE TABLE ok_list (a integer, b integer)
    expect: ok
  - sql: |
      SELECT a, b FROM ok_list
    expect: rows
    order: multiset
    comment: a well-formed list creates the table
