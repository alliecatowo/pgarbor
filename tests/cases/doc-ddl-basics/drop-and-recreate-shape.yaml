# A dropped table can be recreated under the same name with a different shape and no leftover data.
id: doc-ddl-basics.drop-and-recreate-shape
title: Recreating a dropped table under the same name starts empty with the new columns
family: doc-ddl-basics
tier: core
feature_ids: [drop-table, create-table, table-basics]
required_capabilities: [create-table, drop-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (removing a table: DROP TABLE; creating a table)"
sessions: [a]
setup: |
  CREATE TABLE cycle (id integer, v text);
  INSERT INTO cycle VALUES (1, 'a'), (2, 'b');
steps:
  - sql: |
      DROP TABLE cycle
    expect: ok
  - sql: |
      CREATE TABLE cycle (id integer, v integer, extra boolean)
    expect: ok
  - sql: |
      SELECT id, v, extra FROM cycle
    expect: rows
    order: multiset
    comment: no rows from the old table survive
  - sql: |
      SELECT v FROM cycle WHERE v > 0
    expect: rows
    order: multiset
    comment: the column type is the new integer type
  - sql: |
      INSERT INTO cycle VALUES (1, 5, NULL)
    expect: ok
  - sql: |
      SELECT id, v, extra IS NULL AS extra_null FROM cycle
    expect: rows
    order: multiset
