# Documented products example: numeric holds fractional amounts; NULL and empty text are distinct.
id: doc-ddl-basics.create-products-table
title: Documented products table holds fractional numerics, NULLs and empty strings
family: doc-ddl-basics
tier: core
feature_ids: [create-table, table-basics, numeric-type, text-type, null-semantics]
required_capabilities: [create-table, insert, select, order-by, numeric]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (creating a table: products example, numeric type can store fractional components)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE products (
          product_no integer,
          name text,
          price numeric
      )
    expect: ok
  - sql: |
      INSERT INTO products VALUES (1, 'Cheese', 9.99), (2, NULL, NULL), (3, '', 0.10)
    expect: ok
  - sql: |
      SELECT product_no, name, price, price * 2 AS double_price FROM products ORDER BY product_no
    expect: rows
    order: ordered
  - sql: |
      SELECT product_no, name IS NULL AS name_null, name = '' AS name_empty FROM products ORDER BY product_no
    expect: rows
    order: ordered
