# Documented CREATE TABLE error conditions: duplicate table, duplicate column, unknown type.
id: doc-ddl-basics.create-table-errors
title: CREATE TABLE rejects duplicate tables, duplicate columns and unknown types
family: doc-ddl-basics
tier: core
feature_ids: [create-table, table-basics, errors]
required_capabilities: [create-table, errors, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (creating a table; column names and type names must exist)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE my_first_table (first_column text, second_column integer)
    expect: ok
  - sql: |
      CREATE TABLE my_first_table (x integer)
    expect: error
    sqlstate: "42P07"
    comment: a table with that name already exists
  - sql: |
      CREATE TABLE dup_cols (a integer, a text)
    expect: error
    sqlstate: "42701"
    comment: column names within one table must be unique
  - sql: |
      CREATE TABLE bad_type (a no_such_type)
    expect: error
    sqlstate: "42704"
    comment: the type name must exist
  - sql: |
      SELECT first_column, second_column FROM my_first_table
    expect: rows
    order: multiset
    comment: the failed statements left the original table unchanged
