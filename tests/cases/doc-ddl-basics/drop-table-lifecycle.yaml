# DROP TABLE removes the table; dropping a missing table is an error, IF EXISTS only emits a notice.
id: doc-ddl-basics.drop-table-lifecycle
title: DROP TABLE removes a table; missing-table drop errors unless IF EXISTS
family: doc-ddl-basics
tier: core
feature_ids: [drop-table, table-basics, errors]
required_capabilities: [create-table, drop-table, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (removing a table: DROP TABLE, DROP TABLE IF EXISTS)"
sessions: [a]
setup: |
  CREATE TABLE my_first_table (first_column text, second_column integer);
steps:
  - sql: |
      DROP TABLE my_first_table
    expect: ok
  - sql: |
      SELECT * FROM my_first_table
    expect: error
    sqlstate: "42P01"
    comment: the table is gone after DROP TABLE
  - sql: |
      DROP TABLE nope_missing
    expect: error
    sqlstate: "42P01"
    comment: dropping a table that does not exist is an error
  - sql: |
      DROP TABLE IF EXISTS nope_missing
    expect: notice
    comment: IF EXISTS suppresses the error and only emits a NOTICE
