# A text column accepts almost any string, including the empty string, and supports concatenation; NULL propagates.
id: doc-ddl-basics.text-column-values
title: Text column stores empty strings distinctly from NULL and concatenates with NULL propagation
family: doc-ddl-basics
tier: core
feature_ids: [create-table, text-type, string-concatenation, null-semantics]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (a column of a character string type accepts almost any kind of data; string concatenation is available)"
sessions: [a]
setup: |
  CREATE TABLE notes (id integer, body text)
steps:
  - sql: |
      INSERT INTO notes VALUES (1, 'alpha'), (2, ''), (3, NULL), (4, 'o''brien; drop table x --')
    expect: ok
  - sql: |
      SELECT id, body, body IS NULL AS is_null, body = '' AS is_empty FROM notes ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, 'x' || body || 'y' AS wrapped FROM notes ORDER BY id
    expect: rows
    order: ordered
    comment: concatenating with NULL yields NULL
  - sql: |
      SELECT count(*) FROM notes
    expect: rows
    order: multiset
