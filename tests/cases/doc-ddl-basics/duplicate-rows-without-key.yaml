# SQL assigns no unique identifiers to rows: a table without constraints may hold identical rows.
id: doc-ddl-basics.duplicate-rows-without-key
title: Table without constraints keeps identical rows as distinct rows
family: doc-ddl-basics
tier: core
feature_ids: [create-table, insert, duplicate-rows, select]
required_capabilities: [create-table, insert, select, order-by, aggregates]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-basics (SQL does not assign unique identifiers to rows, so identical rows are possible)"
sessions: [a]
setup: |
  CREATE TABLE plain_rows (a integer, b text)
steps:
  - sql: |
      INSERT INTO plain_rows VALUES (1, 'same'), (1, 'same'), (1, 'same')
    expect: ok
  - sql: |
      SELECT a, b FROM plain_rows
    expect: rows
    order: multiset
    comment: all three identical rows are returned
  - sql: |
      SELECT count(*) AS total, count(DISTINCT (a, b)) AS distinct_rows FROM plain_rows
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b, count(*) AS copies FROM plain_rows GROUP BY a, b ORDER BY a
    expect: rows
    order: ordered
