# xmlconcat joins XML fragments, omits NULL arguments and merges XML declarations as the docs describe.
id: doc-functions-xml.xmlconcat-declarations
title: xmlconcat concatenates fragments, skips NULLs and merges XML declarations
family: doc-functions-xml
tier: core
feature_ids: [xml, xmlconcat, xml-declarations]
required_capabilities: [xml, select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-producing-xml-xmlconcat"
sessions: [a]
steps:
  - sql: |
      SELECT xmlconcat('<abc/>', '<bar>foo</bar>')
    expect: rows
    comment: doc example
  - sql: |
      SELECT xmlconcat('<?xml version="1.1"?><foo/>', '<?xml version="1.1" standalone="no"?><bar/>')
    expect: rows
    comment: doc example; same version kept, standalone no is kept because one argument says no
  - sql: |
      SELECT xmlconcat('<?xml version="1.1" standalone="yes"?><foo/>', '<?xml version="1.1" standalone="yes"?><bar/>')
    expect: rows
    comment: all arguments say standalone yes, so that value is kept
  - sql: |
      SELECT xmlconcat('<?xml version="1.1"?><foo/>', '<?xml version="1.0"?><bar/>')
    expect: rows
    comment: differing version declarations mean no version in the result
  - sql: |
      SELECT xmlconcat(NULL, '<a/>', NULL, '<b/>')
    expect: rows
    comment: NULL arguments are omitted
  - sql: |
      SELECT xmlconcat(NULL, NULL) IS NULL AS all_null, xmlconcat(NULL::xml) IS NULL AS one_null, xmlconcat('<a/>') AS single
    expect: rows
    comment: the result is null only when there are no nonnull arguments
