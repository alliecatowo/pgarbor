# IS DOCUMENT and IS NOT DOCUMENT distinguish well-formed documents from content fragments and return null for null input.
id: doc-functions-xml.xml-is-document-predicates
title: IS DOCUMENT and IS NOT DOCUMENT distinguish documents from fragments and propagate NULL
family: doc-functions-xml
tier: core
feature_ids: [xml, is-document, is-not-document, xml-predicates]
required_capabilities: [xml, select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-producing-xml-predicates (IS DOCUMENT, IS NOT DOCUMENT)"
sessions: [a]
steps:
  - sql: |
      SELECT '<a/>'::xml IS DOCUMENT AS single_root, '<a/><b/>'::xml IS DOCUMENT AS two_roots, 'x'::xml IS NOT DOCUMENT AS text_only
    expect: rows
    comment: one root element is a document; two roots and bare text are content fragments
  - sql: |
      SELECT xmlparse(document '<a/>') IS DOCUMENT AS doc_form, xmlparse(document '<a/>') IS NOT DOCUMENT AS not_doc_form
    expect: rows
    comment: a document-parsed value is a document, so IS NOT DOCUMENT is false
  - sql: |
      SELECT xmlparse(content 'abc') IS DOCUMENT AS content_form
    expect: rows
    comment: content-parsed text is not a document
  - sql: |
      SELECT NULL::xml IS DOCUMENT AS null_doc, NULL::xml IS NOT DOCUMENT AS null_not_doc
    expect: rows
    comment: null input gives null for both predicates
