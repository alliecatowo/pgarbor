# xmlroot replaces or removes the version and standalone declarations of the root node, per the docs example and the NO VALUE forms.
id: doc-functions-xml.xmlroot-version-standalone
title: xmlroot sets or removes version and standalone declarations on the root node
family: doc-functions-xml
tier: core
feature_ids: [xml, xmlroot, xmlparse, xml-declarations]
required_capabilities: [xml, select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-producing-xml-xmlroot"
sessions: [a]
steps:
  - sql: |
      SELECT xmlroot(xmlparse(document '<?xml version="1.1"?><content>abc</content>'), version '1.0', standalone yes)
    expect: rows
    compare_message: false
    comment: doc example; the parser emits a notice that version 1.1 is unsupported, which is not compared
  - sql: |
      SELECT xmlroot(xmlparse(document '<content>abc</content>'), version '1.0', standalone no)
    expect: rows
    comment: a declaration is added when none was present
  - sql: |
      SELECT xmlroot(xmlparse(document '<content>abc</content>'), version NO VALUE, standalone NO VALUE)
    expect: rows
    comment: NO VALUE on both removes the declaration entirely
  - sql: |
      SELECT xmlroot(xmlparse(document '<?xml version="1.0" standalone="yes"?><content>abc</content>'), version NO VALUE, standalone NO VALUE)
    expect: rows
    comment: NO VALUE on both removes an existing declaration
  - sql: |
      SELECT xmlroot(NULL::xml, version '1.0', standalone yes) IS NULL AS null_root
    expect: rows
    comment: a null xml argument gives a null result
