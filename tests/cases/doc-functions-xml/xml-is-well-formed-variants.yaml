# xml_is_well_formed follows the xmloption setting; the _document and _content variants and namespace matching follow the docs examples.
id: doc-functions-xml.xml-is-well-formed-variants
title: xml_is_well_formed honours xmloption and the document and content variants match the docs
family: doc-functions-xml
tier: core
feature_ids: [xml, xml-is-well-formed, xmloption, xml-namespaces]
required_capabilities: [xml, select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-producing-xml-predicates (xml_is_well_formed, xml_is_well_formed_document, xml_is_well_formed_content)"
sessions: [a]
steps:
  - sql: |
      SET xmloption TO DOCUMENT
    expect: ok
  - sql: |
      SELECT xml_is_well_formed('<>') AS malformed, xml_is_well_formed('<abc/>') AS simple_doc
    expect: rows
    comment: doc example under DOCUMENT setting
  - sql: |
      SELECT xml_is_well_formed('') AS empty_under_document
    expect: rows
    comment: an empty string is not a well-formed document
  - sql: |
      SET xmloption TO CONTENT
    expect: ok
  - sql: |
      SELECT xml_is_well_formed('abc') AS text_as_content
    expect: rows
    comment: doc example under CONTENT setting
  - sql: |
      SELECT xml_is_well_formed_document('<pg:foo xmlns:pg="http://postgresql.org/stuff">bar</pg:foo>') AS ns_ok, xml_is_well_formed_document('<pg:foo xmlns:pg="http://postgresql.org/stuff">bar</my:foo>') AS ns_mismatch
    expect: rows
    comment: doc examples; the second fails because the namespace prefixes do not match
  - sql: |
      SELECT xml_is_well_formed_content('<a/><b/>') AS two_roots_content, xml_is_well_formed_document('<a/><b/>') AS two_roots_document
    expect: rows
    comment: a forest is well-formed content but not a well-formed document
  - sql: |
      SELECT xml_is_well_formed('<a>') AS unclosed, xml_is_well_formed(NULL) IS NULL AS null_input
    expect: rows
    comment: an unclosed element is not well-formed, and null input gives null
  - sql: |
      RESET xmloption
    expect: ok
