# xmlelement examples from the docs: attributes, nested content, name escaping and content escaping.
id: doc-functions-xml.xmlelement-doc-examples
title: xmlelement produces documented elements, attributes, nested content and escaped names
family: doc-functions-xml
tier: core
feature_ids: [xml, xmlelement, xmlattributes, xml-name-escaping]
required_capabilities: [xml, select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-producing-xml-xmlelement"
sessions: [a]
steps:
  - sql: |
      SELECT xmlelement(name foo)
    expect: rows
    comment: doc example, empty element
  - sql: |
      SELECT xmlelement(name foo, xmlattributes('xyz' as bar))
    expect: rows
    comment: doc example, one attribute
  - sql: |
      SELECT xmlelement(name foo, xmlattributes('2007-01-26'::date as bar), 'cont', 'ent')
    expect: rows
    comment: doc example with a fixed date instead of current_date, and two content values concatenated
  - sql: |
      SELECT xmlelement(name foo, xmlattributes('xyz' as bar), xmlelement(name abc), xmlcomment('test'), xmlelement(name xyz))
    expect: rows
    comment: nested elements and a comment as content
  - sql: |
      SELECT xmlelement(name "foo$bar", xmlattributes('xyz' as "a&b"))
    expect: rows
    comment: doc example, invalid name characters become _xHHHH_ escapes
  - sql: |
      SELECT xmlelement(name foo, '<&>"', 'a&b', 3, false)
    expect: rows
    comment: non-xml content is escaped as character data and each value is formatted by its type
  - sql: |
      SELECT xmlelement(name foo, xmlattributes('<&>"' AS x))
    expect: rows
    comment: attribute values are escaped too
