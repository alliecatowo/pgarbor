# xmltext escapes predefined entities; xmlcomment builds comments and rejects text that would make an invalid comment.
id: doc-functions-xml.producing-xmltext-xmlcomment
title: xmltext escapes its argument and xmlcomment builds comments with documented error cases
family: doc-functions-xml
tier: core
feature_ids: [xml, xmltext, xmlcomment, xml-escaping]
required_capabilities: [xml, select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-producing-xml-xmltext and functions-producing-xml-xmlcomment"
sessions: [a]
steps:
  - sql: |
      SELECT xmltext('< foo & bar >')
    expect: rows
    comment: doc example, angle brackets and ampersand are escaped
  - sql: |
      SELECT xmltext(NULL) IS NULL AS null_in, xmltext('') AS empty_in
    expect: rows
    comment: NULL in gives NULL out; the empty string stays empty
  - sql: |
      SELECT xmlcomment('hello')
    expect: rows
    comment: doc example, <!--hello-->
  - sql: |
      SELECT xmlcomment(NULL) IS NULL AS null_comment
    expect: rows
    comment: null argument gives null result
  - sql: |
      SELECT xmlcomment('a- b')
    expect: rows
    comment: a single hyphen inside the text is allowed
  - sql: |
      SELECT xmlcomment('a--b')
    expect: error
    sqlstate: 2200S
    comment: the text cannot contain two consecutive hyphens
  - sql: |
      SELECT xmlcomment('a-')
    expect: error
    sqlstate: 2200S
    comment: the text cannot end with a hyphen
