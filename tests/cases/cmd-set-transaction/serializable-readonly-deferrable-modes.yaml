# SERIALIZABLE, READ ONLY and DEFERRABLE set together with SET TRANSACTION are reported by current_setting; NOT DEFERRABLE clears the flag.
id: cmd-set-transaction.serializable-readonly-deferrable-modes
title: SET TRANSACTION with SERIALIZABLE, READ ONLY and DEFERRABLE is reported and NOT DEFERRABLE clears it
family: cmd-set-transaction
tier: core
feature_ids: [set-transaction, isolation-level, serializable, read-only, deferrable, transaction-modes]
required_capabilities: [transactions, select, errors]
provenance:
  source: pg-docs
  ref: "ref/set_transaction.sgml#sql-set-transaction (synopsis: transaction_mode is ISOLATION LEVEL, READ WRITE | READ ONLY, [NOT] DEFERRABLE)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE, READ ONLY, DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_read_only') AS ro, current_setting('transaction_deferrable') AS def
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION READ WRITE, NOT DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro, current_setting('transaction_deferrable') AS def
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
