# Malformed SET TRANSACTION and SET SESSION CHARACTERISTICS forms are syntax errors; the session stays usable.
id: cmd-set-transaction.syntax-errors
title: Malformed SET TRANSACTION forms are syntax errors with 42601
family: cmd-set-transaction
tier: core
feature_ids: [set-transaction, session-characteristics, errors]
required_capabilities: [transactions, select, errors]
provenance:
  source: pg-docs
  ref: "ref/set_transaction.sgml#sql-set-transaction (synopsis: SET TRANSACTION transaction_mode [, ...]; SET SESSION CHARACTERISTICS AS TRANSACTION transaction_mode)"
sessions: [a]
steps:
  - sql: |
      SET TRANSACTION
    expect: error
    sqlstate: "42601"
    comment: at least one transaction mode or SNAPSHOT is required
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SNAPSHOT
    expect: error
    sqlstate: "42601"
    comment: SNAPSHOT is not an isolation level
  - sql: |
      SET TRANSACTION SNAPSHOT 1
    expect: error
    sqlstate: "42601"
    comment: the snapshot identifier must be a string literal
  - sql: |
      SET SESSION CHARACTERISTICS TRANSACTION READ ONLY
    expect: error
    sqlstate: "42601"
    comment: AS is required after SET SESSION CHARACTERISTICS
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL
    expect: error
    sqlstate: "42601"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
    comment: session is healthy and in autocommit mode
