# Each SET TRANSACTION ISOLATION LEVEL value is reflected by current_setting; the session default is unchanged.
id: cmd-set-transaction.isolation-levels-reported
title: Each isolation level set with SET TRANSACTION is reported inside its block only
family: cmd-set-transaction
tier: core
feature_ids: [set-transaction, isolation-level, read-committed, repeatable-read, serializable]
required_capabilities: [transactions, select, errors]
provenance:
  source: pg-docs
  ref: "ref/set_transaction.sgml#sql-set-transaction (synopsis: ISOLATION LEVEL { SERIALIZABLE | REPEATABLE READ | READ COMMITTED | READ UNCOMMITTED })"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL READ COMMITTED
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT current_setting('default_transaction_isolation') AS default_iso
    expect: rows
    order: ordered
    comment: the session default is still read committed
