# set_config changes DateStyle for the session and the change is visible to date input parsing.
id: doc-functions-admin.config-datestyle-set-config
title: set_config changes DateStyle used by date input, and invalid values are rejected
family: doc-functions-admin
tier: core
feature_ids: [set-config, datestyle, date-input]
required_capabilities: [select, guc, date-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-admin-set (set_config sets the parameter and returns that value)"
sessions: [a]
steps:
  - sql: |
      SELECT set_config('DateStyle', 'ISO, DMY', false) AS v
    expect: rows
  - sql: |
      SELECT '01/02/2020'::date AS d
    expect: rows
    comment: DMY reads the first field as the day
  - sql: |
      SELECT set_config('DateStyle', 'ISO, MDY', false) AS v
    expect: rows
  - sql: |
      SELECT '01/02/2020'::date AS d
    expect: rows
    comment: MDY reads the first field as the month
  - sql: |
      SELECT set_config('DateStyle', 'NOT_A_STYLE', false)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT current_setting('DateStyle') AS v
    expect: rows
    comment: a rejected value leaves the previous setting in place
