# pg_size_pretty uses powers of two and switches units at the 10 x unit thresholds.
id: doc-functions-admin.size-pretty-boundaries
title: pg_size_pretty unit selection at byte, kB and MB thresholds
family: doc-functions-admin
tier: core
feature_ids: [pg-size-pretty, size-units]
required_capabilities: [select, admin-functions]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-admin-dbsize (pg_size_pretty: units are powers of 2, 1kB is 1024 bytes)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_size_pretty(1024::bigint) AS a, pg_size_pretty(10239::bigint) AS b, pg_size_pretty(10240::bigint) AS c
    expect: rows
    comment: 1024 stays in bytes, 10239 stays in bytes, 10240 becomes kB
  - sql: |
      SELECT pg_size_pretty(10485247::bigint) AS a, pg_size_pretty(10485760::bigint) AS b
    expect: rows
    comment: the MB threshold is 10 * 1048576 bytes
  - sql: |
      SELECT pg_size_pretty(0::bigint) AS zero, pg_size_pretty(-10240::bigint) AS negative
    expect: rows
  - sql: |
      SELECT pg_size_pretty(1536::numeric) AS numeric_bytes, pg_size_pretty(1073741824000::numeric) AS numeric_gb
    expect: rows
    comment: the numeric overload uses the same thresholds
  - sql: |
      SELECT pg_size_pretty(NULL::bigint) IS NULL AS null_in_null_out
    expect: rows
