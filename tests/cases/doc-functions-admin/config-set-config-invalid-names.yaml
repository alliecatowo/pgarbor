# Custom placeholder setting names must be two or more identifiers joined by dots.
id: doc-functions-admin.config-set-config-invalid-names
title: set_config rejects malformed custom setting names
family: doc-functions-admin
tier: core
feature_ids: [set-config, custom-guc, error-paths]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-admin-set (set_config and current_setting setting_name)"
sessions: [a]
steps:
  - sql: |
      SELECT set_config('app.bad name', 'x', false)
    expect: error
    sqlstate: "42602"
    comment: a space is not allowed inside a custom name
  - sql: |
      SELECT set_config('nodot', 'x', false)
    expect: error
    sqlstate: "42704"
    comment: an unqualified name is treated as an unknown parameter
  - sql: |
      SELECT set_config('app.ok_name', 'fine', false) AS v
    expect: rows
  - sql: |
      SELECT current_setting('app.ok_name') AS v
    expect: rows
