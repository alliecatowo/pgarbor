# Size functions on OIDs and names that do not resolve. Docs say NULL for a non-existent OID;
# pg_database_size(oid) is documented the same way but raises an error on PG 18.
id: doc-functions-admin.size-invalid-oid
title: Size functions on non-existent OIDs return NULL or raise, as implemented
family: doc-functions-admin
tier: core
feature_ids: [pg-table-size, pg-database-size, pg-filenode-relation, error-paths]
required_capabilities: [select, admin-functions]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-admin-dbsize (if an OID that does not represent an existing object is passed, NULL is returned)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_table_size(0::oid) IS NULL AS table_null
    expect: rows
    comment: the documented NULL behavior for a non-existent relation OID
  - sql: |
      SELECT pg_filenode_relation(0::oid, 0::oid) IS NULL AS filenode_null
    expect: rows
  - sql: |
      SELECT pg_database_size(0::oid)
    expect: error
    sqlstate: "42704"
    comment: documentation says NULL but the server raises database does not exist
  - sql: |
      SELECT pg_database_size(current_database()) > 0 AS db_has_size
    expect: rows
    comment: avoid comparing the exact byte count, which depends on the template
