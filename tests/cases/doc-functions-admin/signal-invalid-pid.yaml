# Backend signal functions with a PID that is not a backend: they return false and emit a warning.
id: doc-functions-admin.signal-invalid-pid
title: pg_terminate_backend and pg_cancel_backend return false for a non-backend PID
family: doc-functions-admin
tier: core
feature_ids: [server-signaling, pg-terminate-backend, pg-cancel-backend]
required_capabilities: [select, admin-functions]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-admin-signal (signal functions return false when the signal could not be sent)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_cancel_backend(999999) AS cancel_result
    expect: rows
    comment: PID 999999 is assumed not to be a live backend in the fresh database
  - sql: |
      SELECT pg_terminate_backend(999999) AS terminate_result
    expect: rows
  - sql: |
      SELECT pg_terminate_backend(999999, 1) AS terminate_with_timeout
    expect: rows
    comment: the timeout argument does not change the result for a non-backend PID
