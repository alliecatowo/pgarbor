# Recovery control functions on a server that is not in recovery; the recovery information functions return NULL.
id: doc-functions-admin.recovery-functions-primary
title: Recovery control functions raise outside recovery while recovery information functions return NULL
family: doc-functions-admin
tier: core
feature_ids: [recovery-control, recovery-information, pg-promote, pg-wal-replay-pause]
required_capabilities: [select, admin-functions]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-recovery-control (recovery control functions can only be executed during recovery)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_is_in_recovery() AS in_recovery
    expect: rows
  - sql: |
      SELECT pg_last_wal_replay_lsn() IS NULL AS replay_lsn_null, pg_last_xact_replay_timestamp() IS NULL AS replay_ts_null
    expect: rows
    comment: outside recovery both recovery information functions return NULL
  - sql: |
      SELECT pg_wal_replay_pause()
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT pg_wal_replay_resume()
    expect: error
  - sql: |
      SELECT pg_is_wal_replay_paused()
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT pg_promote(false, 1)
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT pg_reload_conf() AS reloaded
    expect: rows
