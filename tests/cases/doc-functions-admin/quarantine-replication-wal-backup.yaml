# Documented functions that cannot run in a single isolated database: replication slots and origins,
# WAL LSN and file names, backup control, snapshot export, restore points and standby snapshots.
# Never executed; listed so the skip is visible in reports.
id: doc-functions-admin.quarantine-replication-wal-backup
title: Replication, WAL and backup control functions (skipped, not runnable in one database)
family: doc-functions-admin
tier: extended
feature_ids: [replication-slots, wal-control, backup-control, snapshot-export]
required_capabilities: [replication, server-restart]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-admin-backup, functions-recovery-control, functions-snapshot-synchronization, functions-replication"
sessions: [a]
steps:
  - sql: |
      SELECT pg_create_physical_replication_slot('doc_slot')
    expect: rows
quarantine:
  reason: "needs replication configuration and WAL/backup state; slots and WAL positions are server-global and not isolated per database"
  since: "2026-10-15"
