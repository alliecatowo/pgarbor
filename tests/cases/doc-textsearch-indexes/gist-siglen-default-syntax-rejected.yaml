# The documented bracket notation shows DEFAULT as an alternative to tsvector_ops; the server rejects the DEFAULT keyword form.
id: doc-textsearch-indexes.gist-siglen-default-syntax-rejected
title: GiST siglen with the DEFAULT keyword is a syntax error, tsvector_ops form is accepted
family: doc-textsearch-indexes
tier: core
feature_ids: [gist-index, siglen, syntax-variant]
required_capabilities: [create-table, create-index, gist-index, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-indexes (CREATE INDEX ... USING GIST syntax synopsis)"
notes: "The synopsis shows { DEFAULT | tsvector_ops } (siglen = number). The PostgreSQL 18.6 parser rejects DEFAULT here with 42601, while the tsvector_ops form works. Recorded behavior is the reference."
steps:
  - sql: |
      CREATE TABLE docs (id int4, tsv tsvector)
    expect: ok
  - sql: |
      CREATE INDEX docs_default_sig ON docs USING GIST (tsv DEFAULT (siglen = 100))
    expect: error
    sqlstate: "42601"
    comment: DEFAULT is not accepted as an opclass keyword before parenthesised options
  - sql: |
      CREATE INDEX docs_ops_sig ON docs USING GIST (tsv tsvector_ops (siglen = 100))
    expect: ok
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'docs' ORDER BY indexname
    expect: rows
    order: ordered
