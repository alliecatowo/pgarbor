# Malformed range literals are rejected with invalid_text_representation. Mirrors the
# negative input tests at rangetypes.sql lines 8-18 and 44-49, rewritten for int4range.
id: rangetypes.input-malformed-22p02
title: Malformed int4range literals fail with SQLSTATE 22P02
family: rangetypes
tier: core
feature_ids: [range-types, range-input, errors]
required_capabilities: [range-types, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT ''::int4range
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(1,4'::int4range
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(4,zed)'::int4range
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(1,4]x'::int4range
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(,,a)'::int4range
    expect: error
    sqlstate: "22P02"
