# Non-throwing input API: pg_input_is_valid and pg_input_error_info report range literal errors
# as data. Mirrors rangetypes.sql lines 43-54.
id: rangetypes.pg-input-error-info
title: pg_input_is_valid and pg_input_error_info report range input errors without raising
family: rangetypes
tier: extended
feature_ids: [range-types, range-input, errors, input-validation-functions]
required_capabilities: [range-types, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('(1,4)', 'int4range') AS ok_form,
             pg_input_is_valid('[1,2147483647]', 'int4range') AS max_int4_upper
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_input_is_valid('(1,4', 'int4range') AS missing_bracket
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM pg_input_error_info('(1,4', 'int4range')
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM pg_input_error_info('(4,zed)', 'int4range')
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM pg_input_error_info('[2000-01-01,5874897-12-31]', 'daterange')
    expect: rows
    order: multiset
