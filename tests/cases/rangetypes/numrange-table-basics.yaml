# Range column round-trip: unbounded, empty and point ranges stored in a table, read back with
# bound accessors. Derived from the first operator block of rangetypes.sql (lines 60-70).
id: rangetypes.numrange-table-basics
title: numrange column stores unbounded, empty and point ranges and reports bounds
family: rangetypes
tier: slice
feature_ids: [range-types, range-input, range-accessors]
required_capabilities: [create-table, insert, select, range-types]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
setup: |
  CREATE TABLE numrange_test (nr NUMRANGE);
steps:
  - sql: |
      INSERT INTO numrange_test VALUES ('[,)'), ('[3,]'), ('[, 5)'), (numrange(1.1, 2.2)), ('empty'), (numrange(1.7, 1.7, '[]'))
    expect: ok
  - sql: |
      SELECT nr, isempty(nr), lower(nr), upper(nr) FROM numrange_test ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr, lower_inc(nr), lower_inf(nr), upper_inc(nr), upper_inf(nr) FROM numrange_test ORDER BY nr
    expect: rows
    order: ordered
