# Range constructors reject lower bound greater than upper bound with data_exception (22000), but
# accept equal bounds, which normalize to empty when either bound is exclusive. Mirrors
# rangetypes.sql lines 92 and 200-216 (constructor cases).
id: rangetypes.constructor-bounds-22000
title: Range constructors reject crossed bounds with SQLSTATE 22000 and accept equal bounds
family: rangetypes
tier: core
feature_ids: [range-types, range-constructors, errors]
required_capabilities: [range-types, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT numrange(2.0, 1.0)
    expect: error
    sqlstate: "22000"
  - sql: |
      SELECT int4range(5, 1, '[]')
    expect: error
    sqlstate: "22000"
  - sql: |
      SELECT daterange('2000-01-20'::date, '2000-01-10'::date, '[)')
    expect: error
    sqlstate: "22000"
  - sql: |
      SELECT numrange(2.0, 2.0, '[)') AS equal_exclusive_upper,
             numrange(2.0, 2.0, '[]') AS equal_closed,
             isempty(numrange(2.0, 2.0, '[)')) AS exclusive_is_empty,
             isempty(numrange(2.0, 2.0, '[]')) AS closed_is_empty
    expect: rows
    order: multiset
