# Adjacency (-|-), strict position (<<, >>, &<, &>) and overlap (&&) operators, including how
# inclusive and exclusive bounds change the answer. Mirrors rangetypes.sql lines 94-115.
id: rangetypes.adjacency-and-position-ops
title: Adjacency, strict-position and overlap operators respect bound inclusivity
family: rangetypes
tier: core
feature_ids: [range-types, range-operators, range-adjacency, range-position]
required_capabilities: [range-types, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT numrange(2.0, 3.0) -|- numrange(3.0, 4.0) AS adj_half_open,
             range_adjacent(numrange(2.0, 3.0), numrange(3.1, 4.0)) AS gap_not_adjacent,
             range_adjacent(numrange(2.0, 3.0), numrange(3.1, NULL)) AS adj_to_unbounded,
             numrange(2.0, 3.0, '[]') -|- numrange(3.0, 4.0, '()') AS incl_then_open,
             numrange(1.0, 2.0) -|- numrange(2.0, 3.0, '[]') AS overlap_shared_point,
             range_adjacent(numrange(2.0, 3.0, '(]'), numrange(1.0, 2.0, '(]')) AS adj_reversed
    expect: rows
    order: multiset
  - sql: |
      SELECT numrange(1.0, 2.0) << numrange(3.0, 4.0) AS strict_left,
             numrange(1.0, 3.0, '[]') << numrange(3.0, 4.0, '[]') AS touching_closed_left,
             numrange(1.0, 3.0, '()') << numrange(3.0, 4.0, '()') AS touching_open_left,
             numrange(1.0, 2.0) >> numrange(3.0, 4.0) AS strict_right,
             numrange(3.0, 70.0) &< numrange(6.6, 100.0) AS not_extends_left,
             numrange(4.5, 5.5, '[]') && numrange(5.5, 6.5) AS overlap_closed_point
    expect: rows
    order: multiset
