# Discrete range types (int4range, daterange) are canonicalized to [lower, upper) form, and
# ranges whose canonical form has lower >= upper are empty. Mirrors rangetypes.sql lines 199-216.
id: rangetypes.canonical-discrete-form
title: Discrete ranges canonicalize to half-open form and empty when bounds cross
family: rangetypes
tier: core
feature_ids: [range-types, range-canonical-form, range-constructors]
required_capabilities: [range-types, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT int4range(1, 10, '[]') AS incl_both,
             int4range(1, 10, '[)') AS half_open,
             int4range(1, 10, '(]') AS open_incl,
             int4range(1, 10, '()') AS open_both,
             int4range(1, 2, '()') AS single_gap,
             isempty(int4range(1, 2, '()')) AS gap_is_empty
    expect: rows
    order: multiset
  - sql: |
      SELECT daterange('2000-01-10'::date, '2000-01-20'::date, '[]') AS d_incl,
             daterange('2000-01-10'::date, '2000-01-20'::date, '[)') AS d_half,
             daterange('2000-01-10'::date, '2000-01-20'::date, '(]') AS d_open_incl,
             daterange('2000-01-10'::date, '2000-01-20'::date, '()') AS d_open,
             daterange('2000-01-10'::date, '2000-01-11'::date, '()') AS d_empty_ish,
             daterange('2000-01-10'::date, '2000-01-11'::date, '(]') AS d_one_day
    expect: rows
    order: multiset
