# Polymorphic pseudo-types anyrange and anyarray in SQL functions: successful resolution, a
# mismatched-subtype call that fails to resolve (42883), and a definition whose result type cannot
# be determined from its inputs (42P13). Mirrors rangetypes.sql lines 498-530 and 545-546.
id: rangetypes.anyrange-polymorphic-functions
title: anyrange and anyarray arguments resolve for matching subtypes and fail for mismatches
family: rangetypes
tier: extended
feature_ids: [range-types, polymorphic-types, create-function, errors]
required_capabilities: [range-types, create-function, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
setup: |
  CREATE FUNCTION range_add_bounds(anyrange) RETURNS anyelement AS 'select lower($1) + upper($1)' LANGUAGE sql;
  CREATE FUNCTION rangetypes_sql(q anyrange, b anyarray, OUT c anyelement) AS $$ SELECT upper($1) + $2[1] $$ LANGUAGE sql;
  CREATE FUNCTION anyarray_anyrange_func(a anyarray, r anyrange) RETURNS anyelement AS 'select $1[1] + lower($2);' LANGUAGE sql;
steps:
  - sql: |
      SELECT range_add_bounds(int4range(1, 17)) AS int_bounds
    expect: rows
    order: multiset
  - sql: |
      SELECT range_add_bounds(numrange(1.0001, 123.123)) AS num_bounds
    expect: rows
    order: multiset
  - sql: |
      SELECT rangetypes_sql(int4range(1, 10), ARRAY[2, 20]) AS c
    expect: rows
    order: multiset
  - sql: |
      SELECT anyarray_anyrange_func(ARRAY[1, 2], int4range(10, 20)) AS matched
    expect: rows
    order: multiset
  - sql: |
      SELECT anyarray_anyrange_func(ARRAY[1, 2], numrange(10, 20))
    expect: error
    sqlstate: "42883"
    comment: subtype of anyarray (int4) conflicts with subtype of anyrange (numeric)
  - sql: |
      SELECT rangetypes_sql(numrange(1, 10), ARRAY[2, 20])
    expect: error
    sqlstate: "42883"
    comment: match failure, same shape as the regress case
  - sql: |
      CREATE FUNCTION bogus_func(anyelement) RETURNS anyrange AS 'select int4range(1,10)' LANGUAGE sql
    expect: error
    sqlstate: "42P13"
    comment: result type anyrange has no anyrange or anymultirange input
