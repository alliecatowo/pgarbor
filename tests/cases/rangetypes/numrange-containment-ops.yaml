# Containment, element membership and equality/ordering operators over a numrange column, including
# empty and unbounded rows. Mirrors rangetypes.sql lines 60-90 with a smaller data set.
id: rangetypes.numrange-containment-ops
title: Containment, element and ordering operators over a numrange column with empty and unbounded rows
family: rangetypes
tier: core
feature_ids: [range-types, range-operators, range-containment, range-ordering]
required_capabilities: [create-table, insert, select, range-types]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
setup: |
  CREATE TABLE numrange_test (nr NUMRANGE);
  INSERT INTO numrange_test VALUES ('[,)'), ('[3,]'), ('[, 5)'), (numrange(1.1, 2.2)), ('empty'), (numrange(1.7, 1.7, '[]'));
steps:
  - sql: |
      SELECT nr FROM numrange_test WHERE range_contains(nr, numrange(1.9, 1.91)) ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE nr @> numrange(1.0, 10000.1) ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE range_contained_by(numrange(-1e7, -10000.1), nr) ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE 1.9 <@ nr ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE nr = 'empty' ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE nr = '[1.1, 2.2)' ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE nr < numrange(0.0, 1.0, '[]') ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE nr > numrange(1000.0, 1000.0, '[]') ORDER BY nr
    expect: rows
    order: ordered
  - sql: |
      SELECT nr FROM numrange_test WHERE nr >= 'empty' ORDER BY nr
    expect: rows
    order: ordered
