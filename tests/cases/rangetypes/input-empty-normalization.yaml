# Ranges that contain no points normalize to the empty range, and unbounded literals stay unbounded.
# Mirrors rangetypes.sql lines 21-41 (inputs that normalize to empty), using int4range because the
# textrange type from the regress setup is not present in a fresh database.
id: rangetypes.input-empty-normalization
title: Degenerate and unbounded range literals normalize to empty or unbounded forms
family: rangetypes
tier: core
feature_ids: [range-types, range-input, range-empty]
required_capabilities: [range-types, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangetypes.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '[3,3)'::int4range AS a, '(3,3]'::int4range AS b, '(3,3)'::int4range AS c,
             '[3,3]'::int4range AS d, '  empty  '::int4range AS e
    expect: rows
    order: multiset
  - sql: |
      SELECT isempty('[3,3)'::int4range) AS a_empty, isempty('(3,3]'::int4range) AS b_empty,
             isempty('(3,3)'::int4range) AS c_empty, isempty('[3,3]'::int4range) AS d_empty,
             '[,]'::int4range AS unbounded_both, '(,)'::int4range AS unbounded_open
    expect: rows
    order: multiset
