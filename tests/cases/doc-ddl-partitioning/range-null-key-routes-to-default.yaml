# A NULL partition key matches no RANGE bound, so it goes to the DEFAULT partition. Without a DEFAULT
# partition the same NULL insert is rejected.
id: doc-ddl-partitioning.range-null-key-routes-to-default
title: NULL range key routes to the DEFAULT partition, or fails without one
family: doc-ddl-partitioning
tier: core
feature_ids: [partitioning, range-partitioning, default-partition, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 ddl-partitioning: DEFAULT partition; range bounds never contain NULL"
sessions: [a]
setup: |
  CREATE TABLE nk (id int, v int) PARTITION BY RANGE (v);
  CREATE TABLE nk_p1 PARTITION OF nk FOR VALUES FROM (0) TO (10);
  CREATE TABLE nk_def PARTITION OF nk DEFAULT;
  CREATE TABLE nk_strict (id int, v int) PARTITION BY RANGE (v);
  CREATE TABLE nk_strict_p1 PARTITION OF nk_strict FOR VALUES FROM (0) TO (10);
steps:
  - sql: |
      INSERT INTO nk VALUES (1, NULL), (2, 5), (3, 50)
    expect: ok
  - sql: |
      SELECT tableoid::regclass::text AS part, id, v FROM nk ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO nk_strict VALUES (4, NULL)
    expect: error
    sqlstate: "23514"
