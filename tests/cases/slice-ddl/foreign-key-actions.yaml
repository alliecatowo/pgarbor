# Referential actions: ON UPDATE/DELETE CASCADE, ON DELETE SET NULL, ON DELETE RESTRICT.
id: slice-ddl.foreign-key-actions
title: Foreign key ON UPDATE CASCADE, ON DELETE CASCADE, SET NULL and RESTRICT actions
family: slice-ddl
tier: core
feature_ids: [create-table, insert, update, delete, foreign-key, errors]
required_capabilities: [create-table, insert, select, update, delete, foreign-key, errors]
provenance:
  source: hand
  ref: "PG18 docs ddl-constraints.html#DDL-CONSTRAINTS-FK"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE p (id int4 PRIMARY KEY);
      CREATE TABLE c_cascade (id int4 PRIMARY KEY, pid int4 REFERENCES p (id) ON DELETE CASCADE ON UPDATE CASCADE);
      CREATE TABLE c_setnull (id int4 PRIMARY KEY, pid int4 REFERENCES p (id) ON DELETE SET NULL ON UPDATE CASCADE);
      CREATE TABLE c_restrict (id int4 PRIMARY KEY, pid int4 REFERENCES p (id) ON DELETE RESTRICT)
    expect: ok
  - sql: |
      INSERT INTO p VALUES (1), (2), (3)
    expect: ok
  - sql: |
      INSERT INTO c_cascade VALUES (1, 1), (2, 2);
      INSERT INTO c_setnull VALUES (1, 1), (2, 2);
      INSERT INTO c_restrict VALUES (1, 3)
    expect: ok
  - sql: |
      UPDATE p SET id = 20 WHERE id = 2
    expect: ok
    comment: ON UPDATE CASCADE moves c_cascade and c_setnull row 2 to pid 20
  - sql: |
      DELETE FROM p WHERE id = 1
    expect: ok
    comment: c_cascade row 1 is deleted, c_setnull row 1 gets pid NULL
  - sql: |
      DELETE FROM p WHERE id = 3
    expect: error
    sqlstate: "23001"
    comment: RESTRICT rejects the delete while c_restrict references it (restrict_violation, not foreign_key_violation)
  - sql: |
      SELECT 'cascade' AS t, id, pid FROM c_cascade
      UNION ALL SELECT 'setnull', id, pid FROM c_setnull
      UNION ALL SELECT 'restrict', id, pid FROM c_restrict
      ORDER BY 1, 2
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM p ORDER BY id
    expect: rows
    order: ordered
