# varchar(n) and char(n) length limits: assignment truncation is an error, explicit casts truncate, char blank-padding semantics.
id: slice-ddl.varchar-char-length
title: varchar(n) and char(n) reject over-long assignments and truncate on explicit cast
family: slice-ddl
tier: core
feature_ids: [create-table, insert, select, varchar, char, errors, casts]
required_capabilities: [create-table, insert, select, varchar, char, errors, casts]
provenance:
  source: hand
  ref: "PG18 docs datatype-character.html"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE lens (v varchar(3), c char(3), u varchar)
    expect: ok
  - sql: |
      INSERT INTO lens VALUES ('abc', 'ab', 'any length is fine'), ('ab', 'abc', ''), (NULL, NULL, NULL)
    expect: ok
  - sql: |
      INSERT INTO lens (v) VALUES ('abcd')
    expect: error
    sqlstate: "22001"
  - sql: |
      INSERT INTO lens (c) VALUES ('abcd')
    expect: error
    sqlstate: "22001"
  - sql: |
      SELECT 'abcd'::varchar(3) AS truncated
    expect: rows
    comment: explicit casts truncate silently
  - sql: |
      SELECT v, c, length(c) AS c_len, c = 'ab' AS c_eq FROM lens
    expect: rows
    order: multiset
    comment: char(3) values are blank-padded on storage; length and = ignore trailing blanks
  - sql: |
      SELECT count(*) FILTER (WHERE v IS NULL) AS null_v FROM lens
    expect: rows
