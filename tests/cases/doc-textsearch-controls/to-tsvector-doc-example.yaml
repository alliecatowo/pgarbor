# to_tsvector with the english config drops stop words and punctuation, stems plurals, and records positions.
id: doc-textsearch-controls.to-tsvector-doc-example
title: to_tsvector english example drops stop words and stems plurals
family: doc-textsearch-controls
tier: core
feature_ids: [to-tsvector, parsing-documents, stop-words, stemming, english-config, positions]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (Parsing Documents, to_tsvector example)"
sessions: [a]
steps:
  - sql: |
      SELECT to_tsvector('english', 'a fat  cat sat on a mat - it ate a fat rats')
    expect: rows
    comment: stop words a, on, it dropped; rats becomes rat; hyphen ignored; positions kept
  - sql: |
      SELECT to_tsvector('simple', 'a fat  cat sat on a mat - it ate a fat rats')::text AS v
    expect: rows
    comment: simple config keeps stop words and does not stem
  - sql: |
      SELECT to_tsvector('english', ''::text)::text AS empty_doc, to_tsvector('english', '- , ;')::text AS only_punct
    expect: rows
    comment: a document with no indexable tokens gives an empty tsvector, not NULL
  - sql: |
      SELECT to_tsvector('english', NULL::text) IS NULL AS null_doc
    expect: rows
    comment: to_tsvector of NULL is NULL
