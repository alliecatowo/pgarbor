# to_tsquery normalizes tokens, drops stop words, and accepts weights and prefix-match labels.
id: doc-textsearch-controls.to-tsquery-doc-examples
title: to_tsquery normalizes operands, applies weights and prefix labels
family: doc-textsearch-controls
tier: core
feature_ids: [to-tsquery, tsquery-operators, weights, prefix-match, stop-words, normalization]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (Parsing Queries, to_tsquery examples)"
sessions: [a]
steps:
  - sql: |
      SELECT to_tsquery('english', 'The & Fat & Rats')
    expect: rows
    comment: the stop word The is discarded and Fat and Rats are normalized
  - sql: |
      SELECT to_tsquery('english', 'Fat | Rats:AB')
    expect: rows
    comment: a weight label restricts the lexeme to A or B weighted entries
  - sql: |
      SELECT to_tsquery('supern:*A & star:A*B')
    expect: rows
    comment: the prefix-match marker may be placed before or after the weight label
  - sql: |
      SELECT to_tsquery('english', 'fat & !the')
    expect: rows
    comment: a stop word under NOT is removed, leaving only the positive operand
  - sql: |
      SELECT to_tsquery('english', 'the & a')::text AS q
    expect: rows
    comment: a query made only of stop words yields an empty tsquery with a notice
