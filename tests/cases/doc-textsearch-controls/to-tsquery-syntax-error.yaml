# Unquoted adjacent tokens with no operator, and unbalanced parentheses, are tsquery syntax errors; the session stays usable.
id: doc-textsearch-controls.to-tsquery-adjacent-tokens-error
title: Adjacent tokens without an operator raise syntax error 42601
family: doc-textsearch-controls
tier: core
feature_ids: [to-tsquery, tsquery-operators, errors]
required_capabilities: [select, text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (to_tsquery: syntax error without quotes or operators)"
sessions: [a]
steps:
  - sql: |
      SELECT to_tsquery('english', 'fat rat')
    expect: error
    sqlstate: "42601"
    comment: tokens not separated by AND, OR or FOLLOWED BY are a syntax error
  - sql: |
      SELECT to_tsquery('english', '(fat')
    expect: error
    sqlstate: "42601"
    comment: unbalanced parenthesis
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
