# websearch_to_tsquery maps quoted text to FOLLOWED BY, the word or to OR, and a dash to NOT.
id: doc-textsearch-controls.websearch-to-tsquery-doc-examples
title: websearch_to_tsquery maps quotes, or and dash to tsquery operators
family: doc-textsearch-controls
tier: core
feature_ids: [websearch-to-tsquery, phrase-quotes, or-operator, negation, stop-words]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (websearch_to_tsquery examples)"
sessions: [a]
steps:
  - sql: |
      SELECT websearch_to_tsquery('english', 'The fat rats')
    expect: rows
  - sql: |
      SELECT websearch_to_tsquery('english', '"supernovae stars" -crab')
    expect: rows
    comment: quoted text becomes FOLLOWED BY and the dash becomes NOT
  - sql: |
      SELECT websearch_to_tsquery('english', '"sad cat" or "fat rat"')
    expect: rows
    comment: the word or becomes OR
  - sql: |
      SELECT websearch_to_tsquery('english', 'signal -"segmentation fault"')
    expect: rows
    comment: a negated phrase is a NOT over a FOLLOWED BY group
  - sql: |
      SELECT websearch_to_tsquery('english', 'cat or') AS trailing_or, websearch_to_tsquery('english', '-cat') AS lone_negation
    expect: rows
    comment: a dangling OR is dropped and a lone negated term stays a NOT
