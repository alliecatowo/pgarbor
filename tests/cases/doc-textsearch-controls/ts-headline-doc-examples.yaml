# ts_headline returns document excerpts with query terms highlighted, in default and fragment-based modes.
id: doc-textsearch-controls.ts-headline-doc-examples
title: ts_headline default and fragment-based excerpts from the documentation
family: doc-textsearch-controls
tier: core
feature_ids: [ts-headline, highlighting, fragments, startsel, stopsel, maxfragments]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (Highlighting Results, ts_headline examples)"
sessions: [a]
steps:
  - sql: |
      SELECT ts_headline('english', E'The most common type of search\nis to find all documents containing given query terms\nand return them in order of their similarity to the\nquery.', to_tsquery('english', 'query & similarity'))
    expect: rows
    comment: default options use <b> and </b> and a MaxWords of 35
  - sql: |
      SELECT ts_headline('english', E'Search terms may occur\nmany times in a document,\nrequiring ranking of the search matches to decide which\noccurrences to display in the result.', to_tsquery('english', 'search & term'), 'MaxFragments=10, MaxWords=7, MinWords=3, StartSel=<<, StopSel=>>')
    expect: rows
    comment: fragment mode with custom StartSel and StopSel delimiters
