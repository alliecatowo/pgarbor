# ts_headline option names are case-insensitive, quoted values may hold spaces, and each option changes the excerpt.
id: doc-textsearch-controls.ts-headline-options
title: ts_headline options control highlight tags, excerpt size, and fragments
family: doc-textsearch-controls
tier: core
feature_ids: [ts-headline, highlighting, highlightall, shortword, fragment-delimiter, maxwords, minwords]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (ts_headline options: HighlightAll, ShortWord, MaxWords, MinWords, MaxFragments, StartSel, StopSel, FragmentDelimiter)"
sessions: [a]
steps:
  - sql: |
      SELECT ts_headline('english', 'Alpha beta gamma delta', to_tsquery('english', 'gamma'), 'HighlightAll=true')
    expect: rows
    comment: HighlightAll returns the whole document ignoring the size options
  - sql: |
      SELECT ts_headline('english', 'Alpha beta gamma delta', to_tsquery('english', 'gamma'), 'highlightall=TRUE, StartSel="[", StopSel="]"')
    expect: rows
    comment: option names are case-insensitive and quoted values may contain delimiters
  - sql: |
      SELECT ts_headline('english', 'Alpha beta gamma delta', to_tsquery('english', 'gamma'), 'MaxWords=2, MinWords=1, ShortWord=2')
    expect: rows
    comment: ShortWord=2 keeps three-letter words at the edges of the headline
  - sql: |
      SELECT ts_headline('english', 'The quick brown fox jumps over the lazy dog again and again', to_tsquery('english', 'fox & dog'), 'MaxFragments=2, MaxWords=4, MinWords=1, FragmentDelimiter=" ... "')
    expect: rows
    comment: two fragments are joined by the custom delimiter
  - sql: |
      SELECT ts_headline('english', 'The quick brown fox jumps over the lazy dog again and again', to_tsquery('english', 'fox & dog'), 'MaxFragments=0, MaxWords=4, MinWords=1')
    expect: rows
    comment: MaxFragments=0 selects the single-headline method
