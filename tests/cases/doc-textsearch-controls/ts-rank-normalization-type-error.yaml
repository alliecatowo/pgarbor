# The normalization argument is an integer, so an array literal is an invalid-input error.
id: doc-textsearch-controls.ts-rank-normalization-type-error
title: ts_rank_cd given an array as normalization raises invalid input 22P02
family: doc-textsearch-controls
tier: extended
feature_ids: [ts-rank-cd, normalization, errors, type-coercion]
required_capabilities: [select, text-search, errors]
provenance:
  source: hand
  ref: "textsearch.sgml#textsearch-ranking (normalization is an integer bit mask)"
sessions: [a]
steps:
  - sql: |
      SELECT ts_rank_cd(to_tsvector('english', 'cat dog'), to_tsquery('english', 'cat & dog'), '{0,0,0,0}')
    expect: error
    sqlstate: "22P02"
    comment: the weights array belongs in the first argument, not the normalization slot
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
