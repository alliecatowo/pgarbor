# websearch_to_tsquery never raises a syntax error, so raw user input can be passed straight in.
id: doc-textsearch-controls.websearch-never-raises
title: websearch_to_tsquery accepts hostile punctuation without raising errors
family: doc-textsearch-controls
tier: core
feature_ids: [websearch-to-tsquery, errors, robustness, raw-user-input]
required_capabilities: [select, text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (websearch_to_tsquery: will never raise syntax errors)"
sessions: [a]
steps:
  - sql: |
      SELECT websearch_to_tsquery('english', '""" )( dummy \\ query <->')
    expect: rows
    comment: the documented example; punctuation is ignored and the words are kept
  - sql: |
      SELECT websearch_to_tsquery('english', '((( ))) | & ! <->')::text AS q
    expect: rows
  - sql: |
      SELECT websearch_to_tsquery('english', '"" -"" or -')::text AS q
    expect: rows
  - sql: |
      SELECT websearch_to_tsquery('english', 'fat OR rat OR')::text AS q
    expect: rows
  - sql: |
      SELECT websearch_to_tsquery('english', '"fat rat" "the"')::text AS q
    expect: rows
  - sql: |
      SELECT websearch_to_tsquery('english', NULL::text) IS NULL AS null_input
    expect: rows
