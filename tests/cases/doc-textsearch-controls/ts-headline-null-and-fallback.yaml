# NULL inputs give NULL headlines; with no query match the headline falls back to the first MinWords words.
id: doc-textsearch-controls.ts-headline-null-and-fallback
title: ts_headline returns NULL for NULL inputs and falls back to leading words
family: doc-textsearch-controls
tier: core
feature_ids: [ts-headline, null-semantics, no-match-fallback, minwords]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (ts_headline: if no query matches, first MinWords words are displayed)"
sessions: [a]
steps:
  - sql: |
      SELECT ts_headline('english', NULL::text, to_tsquery('english', 'x')) IS NULL AS null_document
    expect: rows
  - sql: |
      SELECT ts_headline('english', 'a b c', NULL::tsquery) IS NULL AS null_query
    expect: rows
  - sql: |
      SELECT ts_headline('english', 'The quick brown fox', to_tsquery('english', 'fox'), NULL::text) IS NULL AS null_options
    expect: rows
  - sql: |
      SELECT ts_headline('english', 'The quick brown fox', to_tsquery('english', 'fox'), '') AS empty_options
    expect: rows
    comment: an empty option string means all defaults
  - sql: |
      SELECT ts_headline('english', 'one two three four five six seven eight nine ten eleven twelve', to_tsquery('english', 'zzz'), 'MinWords=3, MaxWords=5') AS fallback
    expect: rows
    comment: no match, so the first MinWords words are shown
  - sql: |
      SELECT ts_headline('english', 'one two three four five six seven eight nine ten eleven twelve', to_tsquery('english', 'zzz')) AS default_fallback
    expect: rows
    comment: with default MinWords of 15, the whole twelve-word document is shown
