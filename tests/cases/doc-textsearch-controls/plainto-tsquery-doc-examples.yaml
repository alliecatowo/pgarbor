# plainto_tsquery ANDs surviving words and treats operator and weight syntax as plain punctuation.
id: doc-textsearch-controls.plainto-tsquery-doc-examples
title: plainto_tsquery joins words with AND and discards operator syntax
family: doc-textsearch-controls
tier: core
feature_ids: [plainto-tsquery, stop-words, null-semantics, tsquery-operators]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (plainto_tsquery examples)"
sessions: [a]
steps:
  - sql: |
      SELECT plainto_tsquery('english', 'The Fat Rats')
    expect: rows
  - sql: |
      SELECT plainto_tsquery('english', 'The Fat & Rats:C')
    expect: rows
    comment: operators and weight labels are not recognized and all punctuation is discarded
  - sql: |
      SELECT plainto_tsquery('english', 'the a')::text AS q
    expect: rows
    comment: only stop words means an empty tsquery and a notice
  - sql: |
      SELECT plainto_tsquery('english', NULL::text) IS NULL AS null_input
    expect: rows
  - sql: |
      SELECT to_tsvector('english', 'The fat rats') @@ plainto_tsquery('english', 'fat & rat') AS matches
    expect: rows
    comment: the & in the query text is discarded, so the query is fat AND rat
