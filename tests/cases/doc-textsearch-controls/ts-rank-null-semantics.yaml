# Ranking functions return NULL for NULL arguments and zero for non-matching or empty queries.
id: doc-textsearch-controls.ts-rank-null-semantics
title: ts_rank and ts_rank_cd return NULL for NULL arguments and zero for no match
family: doc-textsearch-controls
tier: core
feature_ids: [ts-rank, ts-rank-cd, null-semantics, no-match, empty-query]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (ranking functions over tsvector and tsquery arguments)"
sessions: [a]
steps:
  - sql: |
      SELECT
        ts_rank(NULL::float4[], to_tsvector('english', 'cat'), to_tsquery('english', 'cat')) IS NULL AS null_weights,
        ts_rank(NULL::tsvector, to_tsquery('english', 'cat')) IS NULL AS null_vector,
        ts_rank(to_tsvector('english', 'cat'), NULL::tsquery) IS NULL AS null_query,
        ts_rank_cd(to_tsvector('english', 'cat'), NULL::tsquery) IS NULL AS null_query_cd
    expect: rows
  - sql: |
      SELECT
        ts_rank(to_tsvector('english', 'cat'), to_tsquery('english', 'dog')) AS no_match,
        ts_rank_cd(to_tsvector('english', 'cat'), to_tsquery('english', 'dog')) AS no_match_cd
    expect: rows
    comment: no matching lexeme gives zero rather than NULL
  - sql: |
      SELECT ts_rank(to_tsvector('english', 'cat'), ''::tsquery) AS empty_query
    expect: rows
    comment: an empty tsquery matches nothing and ranks zero
