# Invalid ts_headline options raise documented errors; the connection stays usable afterwards.
id: doc-textsearch-controls.ts-headline-option-errors
title: Invalid ts_headline options raise invalid-parameter errors
family: doc-textsearch-controls
tier: core
feature_ids: [ts-headline, errors, options-validation]
required_capabilities: [select, text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (ts_headline options)"
sessions: [a]
steps:
  - sql: |
      SELECT ts_headline('english', 'Alpha beta gamma delta', to_tsquery('english', 'gamma'), 'bogus=1')
    expect: error
    sqlstate: "22023"
    comment: unknown option name
  - sql: |
      SELECT ts_headline('english', 'Alpha beta gamma delta', to_tsquery('english', 'gamma'), 'MaxWords=abc')
    expect: error
    sqlstate: "22P02"
    comment: integer option with a non-integer value
  - sql: |
      SELECT ts_headline('english', 'The quick brown fox', to_tsquery('english', 'fox'), 'MaxWords=1, MinWords=2')
    expect: error
    sqlstate: "22023"
    comment: MinWords must be less than MaxWords
  - sql: |
      SELECT ts_headline('english', 'x', to_tsquery('english', 'zzz'), 'MinWords=0, MaxWords=2')
    expect: error
    sqlstate: "22023"
    comment: MinWords must be positive
  - sql: |
      SELECT ts_headline('english', 'x', to_tsquery('english', 'zzz'), 'MaxFragments=-1')
    expect: error
    sqlstate: "22023"
    comment: MaxFragments must not be negative
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
