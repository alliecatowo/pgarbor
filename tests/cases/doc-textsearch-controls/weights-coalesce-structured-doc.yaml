# The documented recipe for a structured document: setweight each field, merge with ||, coalesce NULL fields.
id: doc-textsearch-controls.weights-coalesce-structured-doc
title: Structured tsvector recipe with setweight and coalesce survives NULL fields
family: doc-textsearch-controls
tier: core
feature_ids: [setweight, tsvector-concatenation, coalesce, null-semantics, weights]
required_capabilities: [select, text-search, create-table, insert, update]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-controls (Parsing Documents, recommended method for structured documents)"
sessions: [a]
setup: |
  CREATE TABLE tt (id int4 PRIMARY KEY, title text, keyword text, abstract text, body text, ti tsvector);
  INSERT INTO tt (id, title, keyword, abstract, body) VALUES
    (1, 'Fat Cats', 'cat, rat', 'Rats sat', 'A fat cat sat on a mat'),
    (2, NULL, 'dog', NULL, 'Dogs bark'),
    (3, NULL, NULL, NULL, NULL);
steps:
  - sql: |
      UPDATE tt SET ti =
        setweight(to_tsvector(coalesce(title,'')), 'A')    ||
        setweight(to_tsvector(coalesce(keyword,'')), 'B')  ||
        setweight(to_tsvector(coalesce(abstract,'')), 'C') ||
        setweight(to_tsvector(coalesce(body,'')), 'D')
    expect: ok
  - sql: |
      SELECT id, ti::text AS v FROM tt ORDER BY id
    expect: rows
    order: ordered
    comment: every row keeps a non-NULL tsvector because each field is coalesced
  - sql: |
      SELECT id, (to_tsvector('english', title) || to_tsvector('english', body)) IS NULL AS lost
      FROM tt ORDER BY id
    expect: rows
    order: ordered
    comment: without coalesce, a NULL field makes the whole || concatenation NULL
  - sql: |
      SELECT (to_tsvector('english', 'x') || NULL::tsvector) IS NULL AS concat_null
    expect: rows
