# Documented example GRANT ALL PRIVILEGES ON kinds TO manuel on a view yields the view-applicable privilege set (no MAINTAIN).
id: cmd-grant.all-privileges-view-example
title: GRANT ALL PRIVILEGES on a view grants every view-applicable privilege to the grantee
family: cmd-grant
tier: core
feature_ids: [grant, all-privileges, views, privileges, select]
required_capabilities: [create-view, select, roles, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/grant.sgml#sql-grant-examples (GRANT ALL PRIVILEGES ON kinds TO manuel)"
sessions: [a]
notes: Documented view kinds and role manuel are renamed with a cgg_ prefix.
setup: |
  CREATE VIEW cgg_kinds AS SELECT 'comedy'::text AS kind;
  CREATE ROLE cgg_manuel;
steps:
  - sql: |
      GRANT ALL PRIVILEGES ON cgg_kinds TO cgg_manuel
    expect: ok
  - sql: |
      SELECT privilege_type FROM information_schema.role_table_grants
       WHERE grantee = 'cgg_manuel'
       ORDER BY privilege_type
    expect: rows
    order: ordered
    comment: views take DELETE INSERT REFERENCES SELECT TRIGGER TRUNCATE UPDATE but not MAINTAIN
  - sql: |
      SET ROLE cgg_manuel
    expect: ok
  - sql: |
      SELECT kind FROM cgg_kinds
    expect: rows
    order: ordered
  - sql: |
      RESET ROLE
    expect: ok
