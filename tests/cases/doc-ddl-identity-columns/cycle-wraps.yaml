# CYCLE wraps back to MINVALUE (default 1) after MAXVALUE, instead of erroring.
id: doc-ddl-identity-columns.cycle-wraps
title: CYCLE identity sequence wraps to MINVALUE after MAXVALUE
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, sequences]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE c1 (id int GENERATED BY DEFAULT AS IDENTITY (START WITH 10 INCREMENT BY 5 MAXVALUE 20 CYCLE), v int)
    expect: ok
  - sql: |
      INSERT INTO c1 (v) VALUES (1), (2), (3), (4), (5)
    expect: ok
    comment: values 10, 15, 20, then wrap to 1, then 6
  - sql: |
      SELECT id, v FROM c1 ORDER BY v
    expect: rows
    order: ordered
