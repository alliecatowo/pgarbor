# GENERATED BY DEFAULT with OVERRIDING USER VALUE ignores supplied values; UPDATE ... SET id = DEFAULT is allowed.
id: doc-ddl-identity-columns.overriding-user-value-and-update-default
title: OVERRIDING USER VALUE discards supplied values and UPDATE SET id = DEFAULT regenerates
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, insert, update]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ou (id int GENERATED BY DEFAULT AS IDENTITY, v text)
    expect: ok
  - sql: |
      INSERT INTO ou (id, v) OVERRIDING USER VALUE VALUES (50, 'ov'), (60, 'ov2')
    expect: ok
    comment: supplied ids 50 and 60 are ignored, sequence gives 1 and 2
  - sql: |
      UPDATE ou SET id = DEFAULT WHERE v = 'ov2'
    expect: ok
    comment: DEFAULT in UPDATE is allowed for BY DEFAULT identity
  - sql: |
      SELECT id, v FROM ou ORDER BY id
    expect: rows
    order: ordered
