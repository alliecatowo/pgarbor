# Descending identity sequences count down; exhausting MINVALUE without CYCLE errors. Exact boundary value is allowed.
id: doc-ddl-identity-columns.descending-and-minvalue
title: Descending identity sequences hit MINVALUE exactly, then error without CYCLE
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, sequences, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ds (id int GENERATED BY DEFAULT AS IDENTITY (START WITH 1 INCREMENT BY -1 MINVALUE -5 MAXVALUE 10), v int)
    expect: ok
  - sql: |
      INSERT INTO ds (v) VALUES (1), (2), (3), (4), (5), (6), (7)
    expect: ok
    comment: seven values 1, 0, -1 .. -5 land exactly on MINVALUE
  - sql: |
      SELECT id, v FROM ds ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE ds2 (id int GENERATED BY DEFAULT AS IDENTITY (START WITH 0 INCREMENT BY -1 MINVALUE -1 MAXVALUE 0 NO CYCLE), v int)
    expect: ok
  - sql: |
      INSERT INTO ds2 (v) VALUES (1), (2)
    expect: ok
  - sql: |
      INSERT INTO ds2 (v) VALUES (3)
    expect: error
    sqlstate: "2200H"
    comment: reached minimum value of the sequence
  - sql: |
      SELECT id, v FROM ds2 ORDER BY v
    expect: rows
    order: ordered
