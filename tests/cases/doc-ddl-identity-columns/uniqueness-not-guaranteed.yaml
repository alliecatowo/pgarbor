# Identity values are not unique by themselves; a sequence reset can repeat values unless PRIMARY KEY enforces uniqueness.
id: doc-ddl-identity-columns.uniqueness-not-guaranteed
title: Identity column allows duplicate values after a sequence reset without a key constraint
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, constraints, primary-key, alter-table]
required_capabilities: [create-table, insert, select, update, alter-table]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE nopk (id int GENERATED BY DEFAULT AS IDENTITY, v text)
    expect: ok
  - sql: |
      INSERT INTO nopk (v) VALUES ('a'), ('b')
    expect: ok
  - sql: |
      ALTER TABLE nopk ALTER COLUMN id RESTART WITH 1
    expect: ok
  - sql: |
      INSERT INTO nopk (v) VALUES ('c')
    expect: ok
    comment: no key constraint, so the repeated value 1 is accepted
  - sql: |
      SELECT id, v FROM nopk ORDER BY id, v
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE withpk (id int GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, v text)
    expect: ok
  - sql: |
      INSERT INTO withpk (v) VALUES ('a'), ('b')
    expect: ok
  - sql: |
      ALTER TABLE withpk ALTER COLUMN id RESTART WITH 1
    expect: ok
  - sql: |
      INSERT INTO withpk (v) VALUES ('c')
    expect: error
    sqlstate: "23505"
    comment: PRIMARY KEY enforces the uniqueness the identity does not
