# Without CYCLE, a sequence that reaches MAXVALUE raises an error on the next value (smallint and integer examples).
id: doc-ddl-identity-columns.max-value-exhaustion
title: Identity sequence without CYCLE errors once MAXVALUE is exhausted
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, sequences, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE c2 (id int GENERATED BY DEFAULT AS IDENTITY (MAXVALUE 2), v int)
    expect: ok
  - sql: |
      INSERT INTO c2 (v) VALUES (1), (2)
    expect: ok
  - sql: |
      INSERT INTO c2 (v) VALUES (3)
    expect: error
    sqlstate: "2200H"
  - sql: |
      SELECT id, v FROM c2 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE sm (id smallint GENERATED ALWAYS AS IDENTITY (START WITH 32767))
    expect: ok
  - sql: |
      INSERT INTO sm DEFAULT VALUES RETURNING id
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO sm DEFAULT VALUES
    expect: error
    sqlstate: "2200H"
