# ALTER COLUMN ... RESTART WITH and SET INCREMENT BY change the identity sequence going forward.
id: doc-ddl-identity-columns.alter-restart-increment
title: ALTER COLUMN RESTART WITH and SET INCREMENT BY reposition the identity sequence
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, alter-table, sequences]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE rs (id int GENERATED BY DEFAULT AS IDENTITY, v text)
    expect: ok
  - sql: |
      INSERT INTO rs (v) VALUES ('a'), ('b')
    expect: ok
  - sql: |
      ALTER TABLE rs ALTER COLUMN id RESTART WITH 100
    expect: ok
  - sql: |
      ALTER TABLE rs ALTER COLUMN id SET INCREMENT BY 10
    expect: ok
  - sql: |
      INSERT INTO rs (v) VALUES ('d'), ('e')
    expect: ok
  - sql: |
      SELECT id, v FROM rs ORDER BY id
    expect: rows
    order: ordered
