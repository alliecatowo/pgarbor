# OVERRIDING SYSTEM VALUE lets an explicit value through under ALWAYS; explicit values do not advance the sequence.
id: doc-ddl-identity-columns.overriding-system-value
title: OVERRIDING SYSTEM VALUE accepts explicit values under GENERATED ALWAYS without advancing the sequence
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, insert, sequences]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ov (id int GENERATED ALWAYS AS IDENTITY, v text)
    expect: ok
  - sql: |
      INSERT INTO ov (id, v) OVERRIDING SYSTEM VALUE VALUES (100, 'explicit')
    expect: ok
  - sql: |
      INSERT INTO ov (v) VALUES ('gen')
    expect: ok
    comment: the sequence has not moved yet, so this gets 1
  - sql: |
      INSERT INTO ov (id, v) OVERRIDING SYSTEM VALUE VALUES (DEFAULT, 'gen2')
    expect: ok
  - sql: |
      SELECT id, v FROM ov ORDER BY id
    expect: rows
    order: ordered
