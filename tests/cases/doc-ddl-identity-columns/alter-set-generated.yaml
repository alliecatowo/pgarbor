# ALTER COLUMN ... SET GENERATED ALWAYS / BY DEFAULT switches how explicit values are treated.
id: doc-ddl-identity-columns.alter-set-generated
title: ALTER COLUMN SET GENERATED switches between ALWAYS and BY DEFAULT
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, alter-table, errors]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE sg (id int GENERATED BY DEFAULT AS IDENTITY, v text)
    expect: ok
  - sql: |
      INSERT INTO sg (v) VALUES ('a')
    expect: ok
  - sql: |
      ALTER TABLE sg ALTER COLUMN id SET GENERATED ALWAYS
    expect: ok
  - sql: |
      INSERT INTO sg (id, v) VALUES (5, 'z')
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO sg (v) VALUES ('b')
    expect: ok
  - sql: |
      ALTER TABLE sg ALTER COLUMN id SET GENERATED BY DEFAULT
    expect: ok
  - sql: |
      INSERT INTO sg (id, v) VALUES (5, 'z')
    expect: ok
  - sql: |
      SELECT id, v FROM sg ORDER BY id
    expect: rows
    order: ordered
