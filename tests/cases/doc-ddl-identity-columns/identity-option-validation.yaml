# Identity column type and option restrictions: only smallint, integer, bigint; no DEFAULT alongside identity; sequence option sanity checks.
id: doc-ddl-identity-columns.identity-option-validation
title: Identity column rejects unsupported types, DEFAULT conflicts and invalid sequence options
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, errors, sequences]
required_capabilities: [create-table]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ok_smallint (id smallint GENERATED BY DEFAULT AS IDENTITY)
    expect: ok
    comment: smallint is a sequence-supported type
  - sql: |
      CREATE TABLE tx (id text GENERATED BY DEFAULT AS IDENTITY)
    expect: error
    sqlstate: "22023"
    comment: identity type must be smallint, integer or bigint
  - sql: |
      CREATE TABLE tn (id numeric GENERATED ALWAYS AS IDENTITY)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE td (id int GENERATED BY DEFAULT AS IDENTITY DEFAULT 3)
    expect: error
    sqlstate: "42601"
    comment: an identity column cannot also have a column default
  - sql: |
      CREATE TABLE tm (id bigint GENERATED ALWAYS AS IDENTITY (MAXVALUE 0))
    expect: error
    sqlstate: "22023"
    comment: default MINVALUE 1 exceeds MAXVALUE 0
  - sql: |
      CREATE TABLE ti (id int GENERATED BY DEFAULT AS IDENTITY (INCREMENT BY 0))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE tsv (id int GENERATED BY DEFAULT AS IDENTITY (START WITH 1 MINVALUE 2))
    expect: error
    sqlstate: "22023"
    comment: START value below MINVALUE
