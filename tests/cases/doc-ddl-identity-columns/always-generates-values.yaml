# Doc example: GENERATED ALWAYS AS IDENTITY fills id from the implicit sequence starting at 1; DEFAULT is accepted explicitly.
id: doc-ddl-identity-columns.always-generates-values
title: GENERATED ALWAYS identity column generates 1,2,3 and accepts the DEFAULT keyword
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, sequences, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE people (
          id bigint GENERATED ALWAYS AS IDENTITY,
          name text,
          address text
      )
    expect: ok
  - sql: |
      INSERT INTO people (name, address) VALUES ('A', 'foo')
    expect: ok
  - sql: |
      INSERT INTO people (name, address) VALUES ('B', 'bar')
    expect: ok
  - sql: |
      INSERT INTO people (id, name, address) VALUES (DEFAULT, 'C', 'baz')
    expect: ok
    comment: explicit DEFAULT requests the sequence value under ALWAYS
  - sql: |
      SELECT id, name, address FROM people ORDER BY id
    expect: rows
    order: ordered
