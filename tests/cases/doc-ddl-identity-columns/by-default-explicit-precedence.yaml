# GENERATED BY DEFAULT: explicit values win; the sequence is independent, so it can collide with a manual value.
id: doc-ddl-identity-columns.by-default-explicit-precedence
title: GENERATED BY DEFAULT lets explicit values take precedence and rejects NULL via NOT NULL
family: doc-ddl-identity-columns
tier: core
feature_ids: [identity-columns, errors, constraints, primary-key]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-identity-columns"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE b1 (id int GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, v text)
    expect: ok
  - sql: |
      INSERT INTO b1 (id, v) VALUES (1, 'explicit')
    expect: ok
  - sql: |
      INSERT INTO b1 (v) VALUES ('gen')
    expect: error
    sqlstate: "23505"
    comment: the sequence still yields 1, which collides with the explicit row
  - sql: |
      INSERT INTO b1 (v) VALUES ('g2')
    expect: ok
    comment: the failed insert already consumed sequence value 1
  - sql: |
      INSERT INTO b1 (id, v) VALUES (NULL, 'nul')
    expect: error
    sqlstate: "23502"
    comment: identity columns are implicitly NOT NULL
  - sql: |
      SELECT id, v FROM b1 ORDER BY id
    expect: rows
    order: ordered
