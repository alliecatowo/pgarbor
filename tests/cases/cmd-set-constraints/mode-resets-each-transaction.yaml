# The SET CONSTRAINTS mode lasts only for the transaction; the next transaction starts in the declared initial mode.
id: cmd-set-constraints.mode-resets-each-transaction
title: DEFERRED set in one transaction does not carry over; INITIALLY IMMEDIATE applies again in the next
family: cmd-set-constraints
tier: core
feature_ids: [set-constraints, deferrable, foreign-key, transactions, commit]
required_capabilities: [create-table, insert, select, transactions, constraints, foreign-keys, errors]
provenance:
  source: pg-docs
  ref: "ref/set_constraints.sgml#sql-set-constraints (Description: This command only alters the behavior of constraints within the current transaction; DEFERRABLE INITIALLY IMMEDIATE starts every transaction IMMEDIATE)"
sessions: [a]
setup: |
  CREATE TABLE p (id int4 PRIMARY KEY);
  CREATE TABLE c (id int4 PRIMARY KEY, pid int4 CONSTRAINT c_fk REFERENCES p (id) DEFERRABLE INITIALLY IMMEDIATE);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET CONSTRAINTS c_fk DEFERRED
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO c VALUES (3, 88)
    expect: error
    sqlstate: "23503"
    comment: a new transaction is IMMEDIATE again, so the orphan fails at the INSERT
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET CONSTRAINTS c_fk DEFERRED
    expect: ok
  - sql: |
      INSERT INTO c VALUES (3, 88)
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
    comment: the deferred orphan is discarded with the transaction
  - sql: |
      SELECT count(*) AS n FROM c
    expect: rows
    order: ordered
