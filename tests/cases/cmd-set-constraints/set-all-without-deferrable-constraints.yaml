# SET CONSTRAINTS ALL is valid even when no constraint is deferrable; it changes nothing and reports no error.
id: cmd-set-constraints.set-all-without-deferrable-constraints
title: SET CONSTRAINTS ALL with only non-deferrable constraints succeeds and is a no-op
family: cmd-set-constraints
tier: core
feature_ids: [set-constraints, deferrable, primary-key, transactions]
required_capabilities: [create-table, insert, select, transactions, constraints]
provenance:
  source: pg-docs
  ref: "ref/set_constraints.sgml#sql-set-constraints (Description: SET CONSTRAINTS ALL changes the mode of all deferrable constraints)"
sessions: [a]
setup: |
  CREATE TABLE plain (id int4 PRIMARY KEY, v int4 NOT NULL CHECK (v >= 0));
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET CONSTRAINTS ALL DEFERRED
    expect: ok
    comment: no deferrable constraint exists, so nothing is changed
  - sql: |
      SET CONSTRAINTS ALL IMMEDIATE
    expect: ok
  - sql: |
      INSERT INTO plain VALUES (1, 5)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id, v FROM plain ORDER BY id
    expect: rows
    order: ordered
