# Global defaults for large objects apply to objects created later; the statement has no schema form.
id: cmd-alter-default-privileges.large-object-defaults
title: Global GRANT SELECT ON LARGE OBJECTS applies to large objects created after it
family: cmd-alter-default-privileges
tier: extended
feature_ids: [alter-default-privileges, large-objects, grant, default-acl, privileges]
required_capabilities: [large-objects, roles, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/ref/alter_default_privileges.sgml#sql-alterdefaultprivileges-synopsis (GRANT ... ON LARGE OBJECTS TO role)"
sessions: [a]
setup: |
  DO $$ BEGIN
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'adp_webuser') THEN CREATE ROLE adp_webuser; END IF;
  END $$;
steps:
  - sql: |
      ALTER DEFAULT PRIVILEGES GRANT SELECT ON LARGE OBJECTS TO adp_webuser
    expect: ok
  - sql: |
      SELECT defaclobjtype, defaclacl::text FROM pg_default_acl ORDER BY 1
    expect: rows
    order: ordered
    comment: one global row with object type L
  - sql: |
      SELECT has_largeobject_privilege('adp_webuser', lo_create(0), 'SELECT') AS webuser_select
    expect: rows
    order: multiset
    comment: a large object created after the default receives the SELECT entry
  - sql: |
      SELECT count(*) FROM pg_largeobject_metadata WHERE lomacl IS NOT NULL
    expect: rows
    order: multiset
    comment: exactly the one new large object has an explicit ACL
