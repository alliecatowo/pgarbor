# Documented note: defaults come only from the current role, not from roles the current role is a member of.
id: cmd-alter-default-privileges.not-inherited-from-membership
title: Defaults set for a parent role do not apply to tables created by its member role
family: cmd-alter-default-privileges
tier: core
feature_ids: [alter-default-privileges, default-acl, role-membership, set-role, privileges]
required_capabilities: [create-schema, create-table, roles, set-role, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/ref/alter_default_privileges.sgml#sql-alterdefaultprivileges-description (new object permissions only affected by the default privileges of the current role)"
sessions: [a]
setup: |
  DO $$ BEGIN
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'adp_webuser') THEN CREATE ROLE adp_webuser; END IF;
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'adp_parent') THEN CREATE ROLE adp_parent; END IF;
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'adp_child') THEN CREATE ROLE adp_child IN ROLE adp_parent; END IF;
  END $$;
  CREATE SCHEMA adp_inh;
  GRANT USAGE, CREATE ON SCHEMA adp_inh TO adp_parent, adp_child;
steps:
  - sql: |
      ALTER DEFAULT PRIVILEGES FOR ROLE adp_parent IN SCHEMA adp_inh GRANT SELECT ON TABLES TO adp_webuser
    expect: ok
  - sql: |
      SET ROLE adp_parent
    expect: ok
  - sql: |
      CREATE TABLE adp_inh.parent_t (a int)
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SET ROLE adp_child
    expect: ok
  - sql: |
      CREATE TABLE adp_inh.child_t (a int)
    expect: ok
    comment: adp_child is a member of adp_parent but its own defaults are empty
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT c.relname, has_table_privilege('adp_webuser', c.oid, 'SELECT') AS webuser_select
      FROM pg_class c WHERE c.relname IN ('parent_t', 'child_t') ORDER BY 1
    expect: rows
    order: ordered
    comment: parent_t gets the default grant and child_t does not
