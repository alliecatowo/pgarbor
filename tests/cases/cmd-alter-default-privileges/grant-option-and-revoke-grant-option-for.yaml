# WITH GRANT OPTION in a default is copied into objects created later; REVOKE GRANT OPTION FOR keeps the privilege.
id: cmd-alter-default-privileges.grant-option-and-revoke-grant-option-for
title: Default WITH GRANT OPTION lets the grantee re-grant, and REVOKE GRANT OPTION FOR removes only that right
family: cmd-alter-default-privileges
tier: core
feature_ids: [alter-default-privileges, grant-option, revoke-grant-option-for, grant, default-acl]
required_capabilities: [create-schema, create-table, roles, set-role, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/ref/alter_default_privileges.sgml#sql-alterdefaultprivileges-synopsis (WITH GRANT OPTION and REVOKE [GRANT OPTION FOR])"
sessions: [a]
setup: |
  DO $$ BEGIN
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'adp_admin') THEN CREATE ROLE adp_admin; END IF;
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'adp_webuser') THEN CREATE ROLE adp_webuser; END IF;
  END $$;
  CREATE SCHEMA adp_go;
  GRANT USAGE ON SCHEMA adp_go TO adp_admin;
steps:
  - sql: |
      ALTER DEFAULT PRIVILEGES IN SCHEMA adp_go GRANT SELECT ON TABLES TO adp_admin WITH GRANT OPTION
    expect: ok
  - sql: |
      CREATE TABLE adp_go.gt (a int)
    expect: ok
  - sql: |
      SET ROLE adp_admin
    expect: ok
  - sql: |
      GRANT SELECT ON adp_go.gt TO adp_webuser
    expect: ok
    comment: admin holds the grant option copied from the default, so the re-grant succeeds
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT relacl::text FROM pg_class WHERE oid = 'adp_go.gt'::regclass
    expect: rows
    order: multiset
    comment: the webuser entry records admin as grantor
  - sql: |
      ALTER DEFAULT PRIVILEGES IN SCHEMA adp_go REVOKE GRANT OPTION FOR SELECT ON TABLES FROM adp_admin
    expect: ok
  - sql: |
      CREATE TABLE adp_go.gt2 (a int)
    expect: ok
  - sql: |
      SELECT c.relname, has_table_privilege('adp_admin', c.oid, 'SELECT') AS admin_select, c.relacl::text
      FROM pg_class c WHERE c.relname IN ('gt', 'gt2') ORDER BY 1
    expect: rows
    order: ordered
    comment: gt2 gets admin SELECT without a grant option, and gt keeps its existing grants
  - sql: |
      SELECT defaclacl::text FROM pg_default_acl WHERE defaclnamespace = 'adp_go'::regnamespace
    expect: rows
    order: multiset
    comment: the default entry no longer carries the grant option mark
