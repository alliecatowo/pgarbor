# Column-level privileges and clauses that belong to other statements are rejected by the parser or by ALTER DEFAULT PRIVILEGES.
id: cmd-alter-default-privileges.error-syntax-and-columns
title: Column privileges, singular TABLE, bare statement and CASCADE on GRANT are rejected
family: cmd-alter-default-privileges
tier: core
feature_ids: [alter-default-privileges, grant, revoke, column-privileges, syntax, errors]
required_capabilities: [roles, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/ref/alter_default_privileges.sgml#sql-alterdefaultprivileges-synopsis (ON TABLES, no column lists, CASCADE|RESTRICT only for REVOKE)"
sessions: [a]
steps:
  - sql: |
      ALTER DEFAULT PRIVILEGES
    expect: error
    sqlstate: "42601"
    comment: an abbreviated grant or revoke is required
  - sql: |
      ALTER DEFAULT PRIVILEGES GRANT SELECT (a) ON TABLES TO PUBLIC
    expect: error
    sqlstate: "0LP01"
    comment: default privileges cannot be set per column
  - sql: |
      ALTER DEFAULT PRIVILEGES GRANT SELECT ON TABLE TO PUBLIC
    expect: error
    sqlstate: "42601"
    comment: the object class keyword is TABLES
  - sql: |
      ALTER DEFAULT PRIVILEGES GRANT SELECT ON TABLES TO PUBLIC CASCADE
    expect: error
    sqlstate: "42601"
    comment: CASCADE and RESTRICT are REVOKE-only clauses
  - sql: |
      ALTER DEFAULT PRIVILEGES REVOKE SELECT ON TABLES FROM PUBLIC CASCADE RESTRICT
    expect: error
    sqlstate: "42601"
    comment: CASCADE and RESTRICT cannot both be given
  - sql: |
      SELECT count(*) FROM pg_default_acl
    expect: rows
    order: multiset
    comment: no default entry was written
