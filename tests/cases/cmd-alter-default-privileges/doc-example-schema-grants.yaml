# The documented schema-scoped example: GRANT SELECT to PUBLIC and INSERT to a role, then tables created in the schema inherit them.
id: cmd-alter-default-privileges.doc-example-schema-grants
title: Documented IN SCHEMA GRANT example applies to tables created later in that schema
family: cmd-alter-default-privileges
tier: core
feature_ids: [alter-default-privileges, grant, default-acl, schema-scope, privileges]
required_capabilities: [create-schema, create-table, roles, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/ref/alter_default_privileges.sgml#sql-alterdefaultprivileges-examples (ALTER DEFAULT PRIVILEGES IN SCHEMA myschema GRANT SELECT ON TABLES TO PUBLIC / GRANT INSERT ON TABLES TO webuser)"
sessions: [a]
setup: |
  DO $$ BEGIN
    IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'adp_webuser') THEN CREATE ROLE adp_webuser; END IF;
  END $$;
  CREATE SCHEMA adp_myschema;
steps:
  - sql: |
      ALTER DEFAULT PRIVILEGES IN SCHEMA adp_myschema GRANT SELECT ON TABLES TO PUBLIC;
      ALTER DEFAULT PRIVILEGES IN SCHEMA adp_myschema GRANT INSERT ON TABLES TO adp_webuser
    expect: ok
  - sql: |
      SELECT defaclnamespace::regnamespace::text, defaclrole::regrole::text, defaclobjtype, defaclacl::text
      FROM pg_default_acl WHERE defaclnamespace = 'adp_myschema'::regnamespace ORDER BY 1, 2, 3
    expect: rows
    order: ordered
    comment: one row for the object type r with the owner role and the two grants
  - sql: |
      CREATE TABLE adp_myschema.t1 (a int)
    expect: ok
  - sql: |
      SELECT relacl::text FROM pg_class WHERE oid = 'adp_myschema.t1'::regclass
    expect: rows
    order: multiset
    comment: the table ACL contains the owner entry plus the PUBLIC SELECT and the webuser INSERT from the defaults
  - sql: |
      SELECT has_table_privilege('public', 'adp_myschema.t1', 'SELECT') AS pub_select,
             has_table_privilege('adp_webuser', 'adp_myschema.t1', 'INSERT') AS webuser_insert,
             has_table_privilege('adp_webuser', 'adp_myschema.t1', 'UPDATE') AS webuser_update
    expect: rows
    order: multiset
    comment: webuser gets INSERT but not UPDATE
