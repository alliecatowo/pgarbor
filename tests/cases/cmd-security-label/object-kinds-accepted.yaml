# Every object kind in the synopsis is accepted by the grammar; with no provider loaded each one stops at the provider check with 22023.
id: cmd-security-label.object-kinds-accepted
title: Every synopsis object kind parses and stops at the provider check
family: cmd-security-label
tier: core
feature_ids: [security-label, security-label-object-kinds, security-label-provider]
required_capabilities: [security-label, create-table, create-view, create-sequence, create-type, create-schema, create-function, create-aggregate, create-materialized-view, create-domain, large-objects, errors]
provenance:
  source: pg-docs
  ref: "ref/security_label.sgml#sql-security-label-synopsis"
sessions: [a]
setup: |
  CREATE SCHEMA sl_kinds;
  CREATE TABLE sl_kinds.t (id int4, c text);
  CREATE VIEW sl_kinds.v AS SELECT id FROM sl_kinds.t;
  CREATE MATERIALIZED VIEW sl_kinds.mv AS SELECT id FROM sl_kinds.t;
  CREATE SEQUENCE sl_kinds.s;
  CREATE TYPE sl_kinds.kind AS (a int4, b text);
  CREATE DOMAIN sl_kinds.posint AS int4 CHECK (VALUE > 0);
  CREATE FUNCTION sl_kinds.f(a int, b text) RETURNS int LANGUAGE sql AS 'SELECT a';
  CREATE PROCEDURE sl_kinds.p(a int) LANGUAGE sql AS 'SELECT 1';
  CREATE AGGREGATE sl_kinds.agg(int4) (sfunc = int4pl, stype = int4);
  SELECT lo_create(987654);
steps:
  - sql: |
      SECURITY LABEL ON TABLE sl_kinds.t IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON COLUMN sl_kinds.t.c IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON AGGREGATE sl_kinds.agg(int4) IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON DOMAIN sl_kinds.posint IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON EVENT TRIGGER sl_kinds_no_et IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON FOREIGN TABLE sl_kinds_no_ft IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON FUNCTION sl_kinds.f(IN int, OUT text) IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON LARGE OBJECT 987654 IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON MATERIALIZED VIEW sl_kinds.mv IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON PROCEDURAL LANGUAGE sql IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON LANGUAGE sql IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON PROCEDURE sl_kinds.p(int) IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON PUBLICATION sl_kinds_no_pub IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON ROLE sl_kinds_no_role IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON ROUTINE sl_kinds.f(int, text) IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON SCHEMA sl_kinds IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON SEQUENCE sl_kinds.s IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON SUBSCRIPTION sl_kinds_no_sub IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON TABLESPACE pg_default IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON TYPE sl_kinds.kind IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON VIEW sl_kinds.v IS 'x'
    expect: error
    sqlstate: "22023"
  - sql: |
      SECURITY LABEL ON DATABASE sl_kinds_no_db IS 'x'
    expect: error
    sqlstate: "22023"
