# The two documented examples (set and remove a label with FOR selinux) fail with 22023 when the named provider is not loaded.
id: cmd-security-label.documented-examples
title: Documented SECURITY LABEL FOR selinux examples fail when selinux is not loaded
family: cmd-security-label
tier: core
feature_ids: [security-label, security-label-provider, security-label-examples]
required_capabilities: [security-label, create-table, errors]
provenance:
  source: pg-docs
  ref: "ref/security_label.sgml#sql-security-label-examples"
sessions: [a]
setup: |
  CREATE TABLE mytable (id int4, payload text)
steps:
  - sql: |
      SECURITY LABEL FOR selinux ON TABLE mytable IS 'system_u:object_r:sepgsql_table_t:s0'
    expect: error
    sqlstate: "22023"
    comment: documented set example; selinux provider is not loaded in the oracle
  - sql: |
      SECURITY LABEL FOR selinux ON TABLE mytable IS NULL
    expect: error
    sqlstate: "22023"
    comment: documented remove example
  - sql: |
      SELECT count(*) AS label_rows FROM pg_seclabels WHERE objoid = 'mytable'::regclass
    expect: rows
