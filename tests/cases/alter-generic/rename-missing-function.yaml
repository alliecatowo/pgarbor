# Altering a function signature that does not exist reports undefined_function.
id: alter-generic.rename-missing-function
title: "ALTER FUNCTION on an unknown signature fails with undefined_function"
family: alter-generic
tier: core
feature_ids: [alter-function, errors, rename]
required_capabilities: [alter-function, select, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 sql-alterfunction.html; errcode 42883 undefined_function"
sessions: [a]
steps:
  - sql: |
      ALTER FUNCTION no_such_fn(int) RENAME TO other_fn
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'other_fn'
    expect: rows
    comment: nothing was created or renamed
