# Text search dictionary rename: conflict raises duplicate_object, missing object raises undefined_object, success changes the name.
id: alter-generic.text-search-dictionary-rename
title: "ALTER TEXT SEARCH DICTIONARY RENAME covers conflict, missing object and success"
family: alter-generic
tier: core
feature_ids: [alter-text-search-dictionary, rename, text-search, errors]
required_capabilities: [create-text-search-dictionary, alter-text-search-dictionary, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_generic.sql (Text Search Dictionary: RENAME)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY d1 (template = simple);
  CREATE TEXT SEARCH DICTIONARY d2 (template = simple);
steps:
  - sql: |
      ALTER TEXT SEARCH DICTIONARY d1 RENAME TO d2
    expect: error
    sqlstate: "42710"
  - sql: |
      ALTER TEXT SEARCH DICTIONARY no_such_dict RENAME TO d9
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER TEXT SEARCH DICTIONARY d1 RENAME TO d3
    expect: ok
  - sql: |
      SELECT dictname FROM pg_ts_dict WHERE dictname IN ('d1', 'd2', 'd3') ORDER BY dictname
    expect: rows
    order: ordered
