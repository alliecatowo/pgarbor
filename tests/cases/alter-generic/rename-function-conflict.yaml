# Renaming a function onto an existing signature fails and leaves both functions untouched.
id: alter-generic.rename-function-conflict
title: "ALTER FUNCTION RENAME to an existing signature raises duplicate_function"
family: alter-generic
tier: core
feature_ids: [alter-function, rename, create-function, constraints]
required_capabilities: [create-function, alter-function, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_generic.sql (ALTER FUNCTION alt_func1 RENAME TO alt_func2 -- failed (name conflict))"
sessions: [a]
setup: |
  CREATE FUNCTION f1(int) RETURNS int LANGUAGE sql AS 'SELECT $1 + 1';
  CREATE FUNCTION f2(int) RETURNS int LANGUAGE sql AS 'SELECT $1 - 1';
steps:
  - sql: |
      ALTER FUNCTION f1(int) RENAME TO f2
    expect: error
    sqlstate: "42723"
  - sql: |
      SELECT proname, pg_get_function_identity_arguments(oid) AS args FROM pg_proc WHERE proname IN ('f1', 'f2') AND pronamespace = 'public'::regnamespace ORDER BY proname
    expect: rows
    order: ordered
    comment: the failed rename changed nothing
