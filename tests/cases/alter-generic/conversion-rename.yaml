# Conversion rename: conflict raises duplicate_object, success renames the conversion.
id: alter-generic.conversion-rename
title: "ALTER CONVERSION RENAME conflicts on existing name and otherwise renames"
family: alter-generic
tier: extended
feature_ids: [alter-conversion, rename, encodings, errors]
required_capabilities: [create-conversion, alter-conversion, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_generic.sql (Conversion: ALTER CONVERSION alt_conv1 RENAME TO alt_conv2)"
sessions: [a]
setup: |
  CREATE CONVERSION cv1 FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
  CREATE CONVERSION cv2 FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      ALTER CONVERSION cv1 RENAME TO cv2
    expect: error
    sqlstate: "42710"
  - sql: |
      ALTER CONVERSION cv1 RENAME TO cv3
    expect: ok
  - sql: |
      SELECT conname FROM pg_conversion WHERE conname IN ('cv1', 'cv2', 'cv3') ORDER BY conname
    expect: rows
    order: ordered
