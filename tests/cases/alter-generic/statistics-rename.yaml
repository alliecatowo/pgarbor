# Extended statistics rename: duplicate name conflicts, otherwise the rename takes effect.
id: alter-generic.statistics-rename
title: "ALTER STATISTICS RENAME conflicts with an existing statistics object and otherwise succeeds"
family: alter-generic
tier: extended
feature_ids: [alter-statistics, rename, extended-statistics, errors]
required_capabilities: [create-table, extended-statistics, alter-statistics, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_generic.sql (Statistics: ALTER STATISTICS ... RENAME)"
sessions: [a]
setup: |
  CREATE TABLE st_t (a integer, b integer);
  CREATE STATISTICS st1 ON a, b FROM st_t;
  CREATE STATISTICS st2 ON a, b FROM st_t;
steps:
  - sql: |
      ALTER STATISTICS st1 RENAME TO st2
    expect: error
    sqlstate: "42710"
  - sql: |
      ALTER STATISTICS st1 RENAME TO st3
    expect: ok
  - sql: |
      SELECT stxname FROM pg_statistic_ext WHERE stxname IN ('st1', 'st2', 'st3') ORDER BY stxname
    expect: rows
    order: ordered
