# Operator family rename: conflict raises duplicate_object, success renames.
id: alter-generic.opfamily-rename
title: "ALTER OPERATOR FAMILY RENAME conflicts on existing name and otherwise renames"
family: alter-generic
tier: extended
feature_ids: [alter-operator-family, rename, operator-families, errors]
required_capabilities: [create-operator-family, alter-operator-family, hash-index, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_generic.sql (OpFamily and OpClass: ALTER OPERATOR FAMILY ... RENAME)"
sessions: [a]
setup: |
  CREATE OPERATOR FAMILY f_a USING hash;
  CREATE OPERATOR FAMILY f_b USING hash;
steps:
  - sql: |
      ALTER OPERATOR FAMILY f_a USING hash RENAME TO f_b
    expect: error
    sqlstate: "42710"
  - sql: |
      ALTER OPERATOR FAMILY f_a USING hash RENAME TO f_c
    expect: ok
  - sql: |
      SELECT opfname FROM pg_opfamily WHERE opfname IN ('f_a', 'f_b', 'f_c') ORDER BY opfname
    expect: rows
    order: ordered
