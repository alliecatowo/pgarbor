# ALTER AGGREGATE on an ordinary function is rejected with wrong_object_type and changes nothing.
id: alter-generic.wrong-kind-aggregate
title: "ALTER AGGREGATE on a plain function fails with wrong_object_type"
family: alter-generic
tier: core
feature_ids: [alter-aggregate, alter-function, errors, rename]
required_capabilities: [create-function, alter-function, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_generic.sql (ALTER AGGREGATE alt_func1(int) RENAME TO alt_func3 -- failed (not aggregate))"
sessions: [a]
setup: |
  CREATE FUNCTION f1(int) RETURNS int LANGUAGE sql AS 'SELECT $1 + 1';
steps:
  - sql: |
      ALTER AGGREGATE f1(int) RENAME TO f3
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT f1(1)
    expect: rows
    comment: the function still exists under its original name
