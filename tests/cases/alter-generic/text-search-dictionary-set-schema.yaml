# Text search dictionary SET SCHEMA moves it; a second move to the same schema is a no-op success.
id: alter-generic.text-search-dictionary-set-schema
title: "ALTER TEXT SEARCH DICTIONARY SET SCHEMA moves the dictionary between schemas"
family: alter-generic
tier: extended
feature_ids: [alter-text-search-dictionary, set-schema, text-search, schemas]
required_capabilities: [create-schema, create-text-search-dictionary, alter-text-search-dictionary, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_generic.sql (Text Search Dictionary: SET SCHEMA alt_nsp2)"
sessions: [a]
setup: |
  CREATE SCHEMA s2;
  CREATE TEXT SEARCH DICTIONARY dict_mv (template = simple);
steps:
  - sql: |
      ALTER TEXT SEARCH DICTIONARY dict_mv SET SCHEMA s2
    expect: ok
  - sql: |
      SELECT n.nspname, t.dictname FROM pg_ts_dict t JOIN pg_namespace n ON n.oid = t.dictnamespace WHERE t.dictname = 'dict_mv'
    expect: rows
    order: ordered
  - sql: |
      ALTER TEXT SEARCH DICTIONARY s2.dict_mv SET SCHEMA s2
    expect: ok
    comment: already in s2, should be a no-op
