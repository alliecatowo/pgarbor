# MATERIALIZED / NOT MATERIALIZED change the plan, not the result of a side-effect-free WITH query.
id: doc-queries-with.materialized-hints-same-result
title: MATERIALIZED and NOT MATERIALIZED hints return the same rows as the default
family: doc-queries-with
tier: core
feature_ids: [with-clause, cte, materialization-hints]
required_capabilities: [create-table, insert, select, with, joins]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (Common Table Expression Materialization)"
sessions: [a]
setup: |
  CREATE TABLE bar (y int);
  INSERT INTO bar VALUES (1), (2), (3);
steps:
  - sql: |
      WITH w AS (SELECT * FROM bar)
      SELECT w1.y AS a, w2.y AS b FROM w AS w1 JOIN w AS w2 ON w1.y = w2.y
      WHERE w2.y = 2 ORDER BY a, b
    expect: rows
    order: ordered
    comment: default placement
  - sql: |
      WITH w AS MATERIALIZED (SELECT * FROM bar)
      SELECT w1.y AS a, w2.y AS b FROM w AS w1 JOIN w AS w2 ON w1.y = w2.y
      WHERE w2.y = 2 ORDER BY a, b
    expect: rows
    order: ordered
    comment: forced separate evaluation; result must match
  - sql: |
      WITH w AS NOT MATERIALIZED (SELECT * FROM bar)
      SELECT w1.y AS a, w2.y AS b FROM w AS w1 JOIN w AS w2 ON w1.y = w2.y
      WHERE w2.y = 2 ORDER BY a, b
    expect: rows
    order: ordered
    comment: forced inlining into the parent query; result must match
