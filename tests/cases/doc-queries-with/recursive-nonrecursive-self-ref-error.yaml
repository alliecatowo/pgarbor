# The recursive reference is only allowed in the recursive term, never in the non-recursive term.
id: doc-queries-with.recursive-nonrecursive-self-ref-error
title: Self-reference inside the non-recursive term of a recursive WITH raises 42P19
family: doc-queries-with
tier: core
feature_ids: [with-clause, recursive-cte, errors]
required_capabilities: [select, with, recursive-cte, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (The general form of a recursive WITH query is always a non-recursive term, then UNION, then a recursive term, where only the recursive term can contain a reference to the query's own output)"
sessions: [a]
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT n FROM t
        UNION ALL
          SELECT 1
      )
      SELECT * FROM t
    expect: error
    sqlstate: "42P19"
    comment: message is recursive reference to query "t" must not appear within its non-recursive term
