# A data-modifying WITH query without RETURNING cannot be read by the rest of the query.
id: doc-queries-with.dml-without-returning-not-referable-error
title: Selecting from a data-modifying WITH query that lacks RETURNING raises 0A000
family: doc-queries-with
tier: core
feature_ids: [with-clause, data-modifying-cte, errors]
required_capabilities: [create-table, insert, delete, select, with, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (It is the output of the RETURNING clause ... If a data-modifying statement in WITH lacks a RETURNING clause, then it forms no temporary table)"
sessions: [a]
setup: |
  CREATE TABLE foo (x int);
  INSERT INTO foo VALUES (1), (2);
steps:
  - sql: |
      WITH t AS (DELETE FROM foo)
      SELECT * FROM t
    expect: error
    sqlstate: "0A000"
    comment: message is WITH query "t" does not have a RETURNING clause
  - sql: |
      SELECT count(*) FROM foo
    expect: rows
    order: ordered
    comment: the failed statement did not delete anything
