# Documented example: DELETE in WITH with RETURNING feeds an INSERT attached to the same statement.
id: doc-queries-with.dml-move-rows-with-returning
title: Data-modifying WITH moves rows from one table to another via RETURNING
family: doc-queries-with
tier: core
feature_ids: [with-clause, data-modifying-cte, returning, delete, insert]
required_capabilities: [create-table, insert, delete, select, with, returning]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (Data-Modifying Statements in WITH, moved_rows / products_log)"
sessions: [a]
setup: |
  CREATE TABLE products (id int PRIMARY KEY, price numeric(10,2));
  CREATE TABLE products_log (id int PRIMARY KEY, price numeric(10,2));
  INSERT INTO products VALUES (1, 10), (2, 20), (3, 30);
steps:
  - sql: |
      WITH moved_rows AS (
          DELETE FROM products
          WHERE id >= 2
          RETURNING *
      )
      INSERT INTO products_log
      SELECT * FROM moved_rows
    expect: ok
    comment: command tag reports the inserted rows
  - sql: |
      SELECT id, price FROM products ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, price FROM products_log ORDER BY id
    expect: rows
    order: ordered
