# UNION (not UNION ALL) discards rows that duplicate previous output, so a cyclic recursion stops.
id: doc-queries-with.recursive-union-dedupe-terminates
title: Recursive WITH with UNION discards duplicate rows and terminates on a cycle
family: doc-queries-with
tier: core
feature_ids: [with-clause, recursive-cte, union]
required_capabilities: [select, with, recursive-cte, union]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (Recursive Query Evaluation: For UNION (but not UNION ALL), discard duplicate rows)"
sessions: [a]
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT 1
        UNION
          SELECT (n % 3) + 1 FROM t
      )
      SELECT n FROM t ORDER BY n
    expect: rows
    order: ordered
    comment: values cycle 1 -> 2 -> 3 -> 1; the repeated 1 is discarded so the query returns exactly three rows
