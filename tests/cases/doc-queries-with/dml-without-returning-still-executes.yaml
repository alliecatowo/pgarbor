# A data-modifying WITH without RETURNING forms no table but still runs to completion.
id: doc-queries-with.dml-without-returning-still-executes
title: Data-modifying WITH without RETURNING executes fully; the reported count covers only the primary statement
family: doc-queries-with
tier: core
feature_ids: [with-clause, data-modifying-cte, delete]
required_capabilities: [create-table, insert, delete, select, with]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (If a data-modifying statement in WITH lacks a RETURNING clause, then it forms no temporary table)"
sessions: [a]
setup: |
  CREATE TABLE foo (x int);
  CREATE TABLE bar (y int);
  INSERT INTO foo VALUES (1), (2);
  INSERT INTO bar VALUES (1), (2), (3);
steps:
  - sql: |
      WITH t AS (DELETE FROM foo)
      DELETE FROM bar
    expect: ok
    comment: tag is DELETE 3 (rows removed from bar only); foo is emptied too
  - sql: |
      SELECT (SELECT count(*) FROM foo) AS foo_n, (SELECT count(*) FROM bar) AS bar_n
    expect: rows
    order: ordered
