# Documented testing trick: LIMIT in the parent query stops an otherwise endless recursion.
id: doc-queries-with.recursive-limit-stops-infinite
title: LIMIT in the parent query bounds an otherwise unbounded recursive WITH
family: doc-queries-with
tier: core
feature_ids: [with-clause, recursive-cte, limit]
required_capabilities: [select, with, recursive-cte, limit]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (A helpful trick for testing queries when you are not certain if they might loop)"
sessions: [a]
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT 1
        UNION ALL
          SELECT n+1 FROM t
      )
      SELECT n FROM t LIMIT 5
    expect: rows
    order: ordered
    comment: only the first five rows are fetched, so evaluation stops early
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT 1
        UNION ALL
          SELECT n+1 FROM t
      )
      SELECT count(*) FROM (SELECT n FROM t LIMIT 100) s
    expect: rows
    order: ordered
    comment: 100 rows exactly
