# Without RECURSIVE a WITH query cannot refer to itself; the name is not visible inside its own definition.
id: doc-queries-with.without-recursive-forward-reference-error
title: Self-reference in a non-RECURSIVE WITH query fails with 42P01
family: doc-queries-with
tier: core
feature_ids: [with-clause, cte, errors]
required_capabilities: [select, with, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (RECURSIVE modifier changes WITH from a mere syntactic convenience)"
sessions: [a]
steps:
  - sql: |
      WITH t AS (SELECT * FROM t) SELECT 1
    expect: error
    sqlstate: "42P01"
    comment: the RECURSIVE modifier is required for a query to refer to its own output
