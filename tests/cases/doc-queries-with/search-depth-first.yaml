# SEARCH DEPTH FIRST BY ... SET: built-in ordering column for depth-first tree traversal.
id: doc-queries-with.search-depth-first
title: SEARCH DEPTH FIRST adds an ordering column that sorts the traversal depth-first
family: doc-queries-with
tier: extended
feature_ids: [with-clause, recursive-cte, search-clause]
required_capabilities: [create-table, insert, select, with, recursive-cte, search-clause]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (Search Order, built-in syntax; SEARCH DEPTH FIRST BY id SET ordercol)"
sessions: [a]
setup: |
  CREATE TABLE tree (id int, link int, data text);
  INSERT INTO tree VALUES (1, NULL, 'root'), (2, 1, 'a'), (3, 1, 'b'), (4, 2, 'c'), (5, 3, 'd');
steps:
  - sql: |
      WITH RECURSIVE search_tree(id, link, data) AS (
          SELECT t.id, t.link, t.data
          FROM tree t
        UNION ALL
          SELECT t.id, t.link, t.data
          FROM tree t, search_tree st
          WHERE t.id = st.link
      ) SEARCH DEPTH FIRST BY id SET ordercol
      SELECT id, data FROM search_tree ORDER BY ordercol
    expect: rows
    order: ordered
    comment: rows are emitted in the documented form; ordercol is internal and not in the output
