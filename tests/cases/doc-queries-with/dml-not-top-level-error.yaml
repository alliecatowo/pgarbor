# Data-modifying statements are allowed only in WITH clauses attached to the top-level statement.
id: doc-queries-with.dml-not-top-level-error
title: Data-modifying WITH nested in a subquery raises 0A000
family: doc-queries-with
tier: core
feature_ids: [with-clause, data-modifying-cte, subselect, errors]
required_capabilities: [create-table, insert, delete, select, with, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (data-modifying statements are only allowed in WITH clauses that are attached to the top-level statement)"
sessions: [a]
setup: |
  CREATE TABLE bar (y int);
  INSERT INTO bar VALUES (1), (2);
steps:
  - sql: |
      SELECT * FROM (WITH d AS (DELETE FROM bar RETURNING y) SELECT * FROM d) s
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM bar
    expect: rows
    order: ordered
    comment: nothing was deleted
