# The documented RECURSIVE example: VALUES non-recursive term, UNION ALL, self-reference.
id: doc-queries-with.recursive-sum-1-to-100
title: WITH RECURSIVE sums the integers 1 through 100 from a VALUES seed
family: doc-queries-with
tier: core
feature_ids: [with-clause, recursive-cte, values, aggregates]
required_capabilities: [select, with, recursive-cte, values]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (Recursive Queries)"
sessions: [a]
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          VALUES (1)
        UNION ALL
          SELECT n+1 FROM t WHERE n < 100
      )
      SELECT sum(n) FROM t
    expect: rows
    order: ordered
    comment: "sum of 1..100 is 5050"
  - sql: |
      WITH RECURSIVE t(n) AS (
          VALUES (1)
        UNION ALL
          SELECT n+1 FROM t WHERE n < 100
      )
      SELECT count(*), min(n), max(n) FROM t
    expect: rows
    order: ordered
    comment: boundary values of the working table; the 100th step produces no output
