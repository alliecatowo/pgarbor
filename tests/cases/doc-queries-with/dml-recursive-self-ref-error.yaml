# Recursive self-references inside data-modifying statements are not allowed.
id: doc-queries-with.dml-recursive-self-ref-error
title: Data-modifying statement inside a RECURSIVE WITH raises 42P19
family: doc-queries-with
tier: core
feature_ids: [with-clause, recursive-cte, data-modifying-cte, errors]
required_capabilities: [create-table, insert, select, with, recursive-cte, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (Recursive self-references in data-modifying statements are not allowed)"
sessions: [a]
setup: |
  CREATE TABLE foo (x int);
  INSERT INTO foo VALUES (1), (2);
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          INSERT INTO foo SELECT n FROM t RETURNING x
      )
      SELECT 1
    expect: error
    sqlstate: "42P19"
    comment: message is recursive query "t" must not contain data-modifying statements
  - sql: |
      SELECT count(*) FROM foo
    expect: rows
    order: ordered
