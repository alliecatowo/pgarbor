# Boundary: a recursive term whose seed produces no rows yields an empty result without error.
id: doc-queries-with.recursive-empty-seed
title: Recursive WITH with a false seed condition returns zero rows
family: doc-queries-with
tier: core
feature_ids: [with-clause, recursive-cte, boolean]
required_capabilities: [select, with, recursive-cte]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-with (Recursive Query Evaluation: repeat while the working table is not empty)"
sessions: [a]
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT 1 WHERE false
        UNION ALL
          SELECT n+1 FROM t WHERE n < 3
      )
      SELECT count(*) FROM t
    expect: rows
    order: ordered
    comment: the working table starts empty, so the recursive term is never evaluated
