# pg_input_is_valid and pg_input_error_info report float8 input validity without raising an error.
id: float8.pg-input-is-valid
title: pg_input_is_valid and pg_input_error_info classify float8 inputs without raising
family: float8
tier: extended
feature_ids: [float8, float8-input, catalog-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('34.5', 'float8') AS valid_num,
             pg_input_is_valid('xyz', 'float8') AS valid_text,
             pg_input_is_valid('1e4000', 'float8') AS valid_overflow
    expect: rows
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('1e4000', 'float8')
    expect: rows
    order: multiset
