# NaN and Infinity are accepted case-insensitively with surrounding whitespace; near-miss spellings are rejected with 22P02.
id: float8.special-values-parse
title: NaN and infinity literals parse case-insensitively; malformed specials raise 22P02
family: float8
tier: core
feature_ids: [float8, float8-input, special-values, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'NaN'::float8 AS a, 'nan'::float8 AS b, '   NAN  '::float8 AS c
    expect: rows
  - sql: |
      SELECT 'infinity'::float8 AS a, '          -INFINiTY   '::float8 AS b
    expect: rows
  - sql: |
      SELECT 'N A N'::float8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'NaN x'::float8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT ' INFINITY    x'::float8
    expect: error
    sqlstate: "22P02"
