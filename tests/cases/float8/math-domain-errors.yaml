# Domain violations in sqrt, ln and exp raise their specific SQLSTATEs; exp overflow and underflow raise 22003.
id: float8.math-domain-errors
title: sqrt, ln and exp domain and range errors raise specific SQLSTATEs
family: float8
tier: core
feature_ids: [float8, math-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT sqrt(float8 '-1')
    expect: error
    sqlstate: "2201F"
  - sql: |
      SELECT ln(float8 '0')
    expect: error
    sqlstate: "2201E"
  - sql: |
      SELECT ln(float8 '-1')
    expect: error
    sqlstate: "2201E"
  - sql: |
      SELECT exp(float8 '1000')
    expect: error
    sqlstate: "22003"
    comment: overflow
  - sql: |
      SELECT exp(float8 '-1e200')
    expect: error
    sqlstate: "22003"
    comment: underflow to zero is an error, not a silent zero
  - sql: |
      SELECT float8 '1e200' * float8 '1e200'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT exp(float8 '-infinity') AS exp_neg_inf, exp(float8 'nan') AS exp_nan
    expect: rows
