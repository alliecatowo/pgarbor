# Malformed float8 text input is rejected with 22P02 in literals and in INSERT.
id: float8.invalid-input-syntax
title: Malformed float8 text is rejected with 22P02 in casts and INSERT
family: float8
tier: core
feature_ids: [float8, float8-input, insert, errors]
required_capabilities: [select, create-table, insert]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
setup: |
  CREATE TABLE f8 (f1 float8);
steps:
  - sql: |
      INSERT INTO f8 (f1) VALUES ('')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO f8 (f1) VALUES ('     ')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO f8 (f1) VALUES ('xyz')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO f8 (f1) VALUES ('5.0.0')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO f8 (f1) VALUES ('5 . 0')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO f8 (f1) VALUES ('    - 3')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) FROM f8
    expect: rows
    comment: no partial rows survive the rejected inserts
