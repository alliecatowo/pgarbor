# IEEE special-value arithmetic: infinity propagates, Inf/Inf and NaN operands give NaN, finite/Inf gives zero, no error.
id: float8.nan-inf-arithmetic
title: Infinity and NaN propagate through float8 arithmetic without raising errors
family: float8
tier: core
feature_ids: [float8, arithmetic, special-values, nan-handling]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'Infinity'::float8 + 100.0 AS inf_plus, 'Infinity'::float8 * -2 AS inf_times_neg
    expect: rows
  - sql: |
      SELECT 'Infinity'::float8 / 'Infinity'::float8 AS inf_div_inf
    expect: rows
  - sql: |
      SELECT '42'::float8 / 'Infinity'::float8 AS finite_div_inf
    expect: rows
  - sql: |
      SELECT 'nan'::float8 / 'nan'::float8 AS nan_div_nan, 'nan'::float8 + 1 AS nan_plus_one
    expect: rows
  - sql: |
      SELECT 'nan'::float8 / '0'::float8 AS nan_div_zero
    expect: rows
    comment: a NaN dividend is exempt from the division-by-zero check
  - sql: |
      SELECT 'nan'::numeric::float8 AS numeric_nan_to_float8
    expect: rows
