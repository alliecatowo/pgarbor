# float8 to integer casts round half away from the nearest integer, then range-check; values rounding out of range raise 22003.
id: float8.float-to-int-cast-bounds
title: float8 to int2/int4/int8 casts round at the boundary and raise 22003 when out of range
family: float8
tier: core
feature_ids: [float8, casts, integer-types, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '32767.4'::float8::int2 AS ok_int2_max
    expect: rows
  - sql: |
      SELECT '32767.6'::float8::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-32768.4'::float8::int2 AS ok_int2_min
    expect: rows
  - sql: |
      SELECT '-32768.6'::float8::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '2147483647.4'::float8::int4 AS ok_int4_max
    expect: rows
  - sql: |
      SELECT '2147483647.6'::float8::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '9223372036854775807'::float8::int8
    expect: error
    sqlstate: "22003"
    comment: the float8 nearest to int8 max is 2^63, one past the int8 range
  - sql: |
      SELECT '-9223372036854780000'::float8::int8
    expect: error
    sqlstate: "22003"
