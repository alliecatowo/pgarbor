# power() with NaN and infinite operands follows the C99 table; zero to a negative power and negative base to a fractional power raise 2201F.
id: float8.power-special-cases
title: power() special-value table, plus 2201F for undefined real results
family: float8
tier: extended
feature_ids: [float8, math-functions, special-values, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT power(float8 '144', float8 '0.5') AS sqrt144, power(float8 '144', float8 'NaN') AS p_nan_exp, power(float8 'NaN', float8 '0') AS nan_pow0, power(float8 '1', float8 'NaN') AS one_pow_nan
    expect: rows
  - sql: |
      SELECT power(float8 'inf', float8 '0') AS inf_pow0, power(float8 '-1', float8 'inf') AS neg1_pow_inf, power(float8 '1.1', float8 '-inf') AS small_pow_negInf, power(float8 '0', float8 '-inf') AS zero_pow_negInf
    expect: rows
  - sql: |
      SELECT power(float8 'inf', float8 '-2') AS inf_pow_neg2, power(float8 '-inf', float8 '3') AS neginf_pow3, power(float8 '-inf', float8 'inf') AS neginf_pow_inf
    expect: rows
  - sql: |
      SELECT power(float8 '0', float8 '-1')
    expect: error
    sqlstate: "2201F"
    comment: zero raised to a negative power is undefined
  - sql: |
      SELECT power(float8 '-1', float8 '0.5')
    expect: error
    sqlstate: "2201F"
    comment: negative base with a non-integer exponent yields a complex result
