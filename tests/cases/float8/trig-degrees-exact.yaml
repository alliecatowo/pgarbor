# Degree-based trig returns exact results at multiples of 30 and 45 degrees, and atand handles infinities.
id: float8.trig-degrees-exact
title: sind, cosd, tand and atand give exact values at standard angles
family: float8
tier: extended
feature_ids: [float8, math-functions, trigonometry]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT x, sind(x), sind(x) IN (-1,-0.5,0,0.5,1) AS sind_exact
      FROM (VALUES (0), (30), (90), (150), (180), (210), (270), (330), (360)) AS t(x)
    expect: rows
    order: multiset
  - sql: |
      SELECT x, cosd(x), cosd(x) IN (-1,-0.5,0,0.5,1) AS cosd_exact
      FROM (VALUES (0), (60), (90), (120), (180), (240), (270), (300), (360)) AS t(x)
    expect: rows
    order: multiset
  - sql: |
      SELECT x, asind(x), acosd(x), atand(x)
      FROM (VALUES (-1), (-0.5), (0), (0.5), (1)) AS t(x)
    expect: rows
    order: multiset
  - sql: |
      SELECT atand(float8 '-infinity') AS neg_inf, atand(float8 'infinity') AS pos_inf
    expect: rows
