# Float8 literal input outside the double precision range raises 22003 for both overflow and underflow.
id: float8.input-range-errors
title: Out-of-range float8 literals raise 22003 in both directions
family: float8
tier: core
feature_ids: [float8, float8-input, errors, casts]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '10e400'::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-10e400'::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '10e-400'::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-10e-400'::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '2.2250738585072014E-308'::float8 > 0 AS smallest_normal_positive
    expect: rows
