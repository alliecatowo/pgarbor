# Hyperbolic functions propagate infinities and NaN; the inverse-hyperbolic domain errors raise without a fixed SQLSTATE.
id: float8.hyperbolic-inf-nan
title: Hyperbolic functions handle infinities and NaN; out-of-domain inverses raise errors
family: float8
tier: extended
feature_ids: [float8, math-functions, special-values, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT sinh(float8 'infinity') AS sinh_pinf, sinh(float8 '-infinity') AS sinh_ninf, sinh(float8 'nan') AS sinh_nan
    expect: rows
  - sql: |
      SELECT cosh(float8 'infinity') AS cosh_pinf, cosh(float8 '-infinity') AS cosh_ninf, cosh(float8 'nan') AS cosh_nan
    expect: rows
  - sql: |
      SELECT tanh(float8 'infinity') AS tanh_pinf, tanh(float8 '-infinity') AS tanh_ninf, tanh(float8 'nan') AS tanh_nan
    expect: rows
  - sql: |
      SELECT asinh(float8 'infinity') AS asinh_pinf, asinh(float8 '-infinity') AS asinh_ninf, asinh(float8 'nan') AS asinh_nan
    expect: rows
  - sql: |
      SELECT acosh(float8 '-infinity')
    expect: error
    comment: acosh is outside its domain for negative infinity
  - sql: |
      SELECT atanh(float8 'infinity')
    expect: error
    comment: atanh is outside its domain for infinity
  - sql: |
      SELECT atanh(float8 'nan') AS atanh_nan
    expect: rows
