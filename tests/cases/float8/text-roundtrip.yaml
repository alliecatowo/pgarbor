# float8 text output uses the shortest representation that round-trips; float8send exposes the IEEE bytes.
id: float8.text-roundtrip
title: float8 text output is shortest round-trip and float8send exposes big-endian IEEE bytes
family: float8
tier: extended
feature_ids: [float8, float8-output, binary-format, casts]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
steps:
  - sql: |
      SELECT (0.1::float8 + 0.2::float8)::text AS sum_text, (1e-5::float8)::text AS small_text, (1e16::float8)::text AS big_text
    expect: rows
  - sql: |
      SELECT 'NaN'::float8::text AS nan_text, 'Infinity'::float8::text AS inf_text, '-Infinity'::float8::text AS neg_inf_text
    expect: rows
  - sql: |
      SELECT float8send(float8 '1') AS one_bits, float8send(float8 '-0') AS neg_zero_bits
    expect: rows
  - sql: |
      SELECT float8send('2.2250738585072014E-308'::float8) AS smallest_normal_bits
    expect: rows
