# trunc, round, ceil, floor and sign on float8 values including negatives, fractions and zero.
id: float8.rounding-functions
title: trunc, round, ceil, floor and sign on float8 values across signs and fractions
family: float8
tier: core
feature_ids: [float8, math-functions, rounding]
required_capabilities: [select, create-table, insert]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float8.sql"
sessions: [a]
setup: |
  CREATE TABLE f8r (f1 float8);
  INSERT INTO f8r VALUES (0.0), (1004.3), (-34.84), (-0.4), (2.5), (-2.5);
steps:
  - sql: |
      SELECT f1, trunc(f1) AS t, ceil(f1) AS c, ceiling(f1) AS c2, floor(f1) AS fl, sign(f1) AS sg
      FROM f8r ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, round(f1) AS rnd, |/f1 AS sqrt_f1
      FROM f8r WHERE f1 > 0 ORDER BY f1
    expect: rows
    order: ordered
    comment: round uses round-half-to-even at exact halves; the recorder captures the exact result
