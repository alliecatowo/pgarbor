# Two-argument enum_range requires both arguments to be the same enum type; mixing enum types or text fails resolution.
id: doc-functions-enum.enum-range-mixed-types-error
title: enum_range with two different enum types, or with text, fails with 42883
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-range-two-argument, polymorphic-resolution, errors]
required_capabilities: [create-type, enum, errors, select]
provenance:
  source: hand
  ref: "src/sgml/func.sgml#functions-enum (\"The values must be from the same enum type\")"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple');
  CREATE TYPE other_e AS ENUM ('x', 'y')
steps:
  - sql: |
      SELECT enum_range('red'::rainbow, 'x'::other_e)
    expect: error
    sqlstate: "42883"
    comment: the two bounds must share one enum type
  - sql: |
      SELECT enum_range('red'::rainbow, 'orange'::text)
    expect: error
    sqlstate: "42883"
    comment: text is not the same enum type as the first argument
