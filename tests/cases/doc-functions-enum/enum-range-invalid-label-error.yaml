# A label that is not in the enum cannot be cast to the enum type in enum_range's argument (22P02).
id: doc-functions-enum.enum-range-invalid-label-error
title: enum_range with a label not in the enum fails with 22P02 invalid input value
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-input, errors]
required_capabilities: [create-type, enum, errors, select]
provenance:
  source: hand
  ref: "src/sgml/func.sgml#functions-enum (values must be from the enum type)"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT enum_range(NULL::rainbow, 'nope')
    expect: error
    sqlstate: "22P02"
    comment: the unknown literal is coerced to rainbow and rejected
  - sql: |
      SELECT enum_range('purple'::rainbow, 'bogus'::rainbow)
    expect: error
    sqlstate: "22P02"
    comment: a bogus second bound fails the same way
