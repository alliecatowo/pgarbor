# enum_range applied per row to a column: the row value is ignored for one-argument form and used as the start for two-argument form.
id: doc-functions-enum.enum-range-over-column
title: enum_range over a table column returns the same full range per row and a suffix range from each row's label
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-range-two-argument, enum-column-usage]
required_capabilities: [create-type, create-table, insert, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum (\"more common to apply these functions to a table column\")"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple');
  CREATE TABLE paint (id int4 PRIMARY KEY, shade rainbow);
  INSERT INTO paint VALUES (1, 'purple'), (2, 'red'), (3, 'green'), (4, NULL)
steps:
  - sql: |
      SELECT id, enum_range(shade) AS full_range FROM paint ORDER BY id
    expect: rows
    order: ordered
    comment: the one-argument form ignores the column value; a NULL shade still gives the full range
  - sql: |
      SELECT id, enum_range(shade, 'green'::rainbow) AS to_green FROM paint ORDER BY id
    expect: rows
    order: ordered
    comment: purple gives an empty array, red gives {red,orange,yellow,green}, green gives {green}, NULL start gives first label
