# The doc says these functions care only about the declared type, not the value passed in.
id: doc-functions-enum.enum-functions-ignore-value
title: enum_first, enum_last and one-sided enum_range ignore the value passed and depend only on the type
family: doc-functions-enum
tier: core
feature_ids: [enum-first, enum-last, enum-range, type-only-semantics]
required_capabilities: [create-type, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum (\"these functions disregard the specific value passed to them\")"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT enum_first('blue'::rainbow) AS f, enum_last('red'::rainbow) AS l, enum_first(null::rainbow) AS f0, enum_last(null::rainbow) AS l0
    expect: rows
    comment: a specific value and a null of the same type give identical results
  - sql: |
      SELECT enum_range(NULL::rainbow, 'orange'::rainbow) = enum_range('red'::rainbow, 'orange'::rainbow) AS same_as_explicit
    expect: rows
    comment: a NULL start gives the same array as an explicit first label
