# enum_range with one null of the enum type returns every label in declaration order (doc example enum_range(null::rainbow)).
id: doc-functions-enum.enum-range-null-argument
title: enum_range(null::rainbow) returns all labels as an array in declaration order
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-range-single-argument, enum-declaration-order]
required_capabilities: [create-type, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT enum_range(null::rainbow) AS r
    expect: rows
    comment: result is {red,orange,yellow,green,blue,purple}, declaration order rather than alphabetical
