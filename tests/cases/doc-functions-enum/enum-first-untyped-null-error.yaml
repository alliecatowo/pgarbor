# enum_first(NULL) with an untyped NULL has no enum type to resolve, so no function matches (42883).
id: doc-functions-enum.enum-first-untyped-null-error
title: enum_first and enum_range with an untyped NULL fail with 42883 because the enum type cannot be determined
family: doc-functions-enum
tier: core
feature_ids: [enum-first, enum-range, polymorphic-resolution, null-semantics]
required_capabilities: [enum, errors, select]
provenance:
  source: hand
  ref: "src/sgml/func.sgml#functions-enum (examples use null::rainbow for a reason)"
sessions: [a]
steps:
  - sql: |
      SELECT enum_first(NULL)
    expect: error
    sqlstate: "42883"
    comment: the untyped NULL is type unknown, so no polymorphic match exists
  - sql: |
      SELECT enum_range(NULL)
    expect: error
    sqlstate: "42883"
    comment: same resolution failure for the one-argument range form
