# Enum comparison follows declaration order, which is what enum_range uses; the first argument of the range may be any label.
id: doc-functions-enum.enum-label-ordering-comparison
title: Enum comparisons follow declaration order, matching the order enum_range returns
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-ordering, comparison-operators]
required_capabilities: [create-type, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum (enum_range order) and src/sgml/datatype.sgml#datatype-enum"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT 'red'::rainbow < 'purple'::rainbow AS red_before_purple, 'green'::rainbow < 'orange'::rainbow AS green_before_orange, 'blue'::rainbow >= 'blue'::rainbow AS blue_ge_blue
    expect: rows
    comment: comparisons are by position in the declaration, not by text (green is not before orange alphabetically)
  - sql: |
      SELECT v::text AS label FROM unnest(enum_range(NULL::rainbow)) AS v WHERE v::rainbow > 'yellow'::rainbow ORDER BY v::rainbow
    expect: rows
    order: ordered
    comment: labels after yellow in declaration order are green, blue, purple
