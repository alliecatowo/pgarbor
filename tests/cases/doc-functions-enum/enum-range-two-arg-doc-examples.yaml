# The documented two-argument enum_range examples: a bounded range, a NULL start, and a NULL end.
id: doc-functions-enum.enum-range-two-arg-doc-examples
title: Two-argument enum_range returns inclusive ranges, with NULL meaning unbounded on that side
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-range-two-argument, null-bounds]
required_capabilities: [create-type, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT enum_range('orange'::rainbow, 'green'::rainbow) AS r
    expect: rows
    comment: both bounds are included, giving {orange,yellow,green}
  - sql: |
      SELECT enum_range(NULL, 'green'::rainbow) AS r
    expect: rows
    comment: NULL start means start at the first label, giving {red,orange,yellow,green}
  - sql: |
      SELECT enum_range('orange'::rainbow, NULL) AS r
    expect: rows
    comment: NULL end means end at the last label, giving {orange,yellow,green,blue,purple}
