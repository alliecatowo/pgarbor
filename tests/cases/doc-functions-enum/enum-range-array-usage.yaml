# enum_range returns an array of the enum type, so subscripts, unnest and containment work on it.
id: doc-functions-enum.enum-range-array-usage
title: enum_range returns a rainbow[] that supports subscripting, unnest and ANY membership
family: doc-functions-enum
tier: core
feature_ids: [enum-range, arrays, enum-membership]
required_capabilities: [create-type, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum (enum_range returns anyarray)"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT pg_typeof(enum_range(null::rainbow))::text AS t, (enum_range(null::rainbow))[2]::text AS second, array_length(enum_range(null::rainbow), 1) AS len
    expect: rows
    comment: the array type is rainbow[]; subscripts start at 1
  - sql: |
      SELECT v::text AS label FROM unnest(enum_range('yellow'::rainbow, NULL)) AS v ORDER BY v
    expect: rows
    order: ordered
    comment: unnest gives the labels from yellow onward; ORDER BY v sorts by enum position
  - sql: |
      SELECT 'green'::rainbow = ANY(enum_range(NULL::rainbow, 'yellow'::rainbow)) AS in_range, 'blue'::rainbow = ANY(enum_range(NULL::rainbow, 'yellow'::rainbow)) AS not_in_range
    expect: rows
    comment: green is after yellow, so it is excluded; blue is excluded too
