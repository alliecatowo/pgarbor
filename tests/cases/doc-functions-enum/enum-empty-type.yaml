# An enum with no labels: enum_range returns an empty array, while enum_first and enum_last raise an error.
id: doc-functions-enum.enum-empty-type
title: "Empty enum: enum_range is {} and enum_first and enum_last fail with 55000"
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-first, enum-last, empty-enum]
required_capabilities: [create-type, enum, arrays, errors, select]
provenance:
  source: hand
  ref: "src/sgml/func.sgml#functions-enum (behavior verified on the PG 18.6 oracle)"
sessions: [a]
setup: |
  CREATE TYPE empty_e AS ENUM ()
steps:
  - sql: |
      SELECT enum_range(null::empty_e) AS r, cardinality(enum_range(null::empty_e)) AS n
    expect: rows
    comment: an empty enum has an empty array, not NULL
  - sql: |
      SELECT enum_first(null::empty_e)
    expect: error
    sqlstate: "55000"
    comment: no first value exists
  - sql: |
      SELECT enum_last(null::empty_e)
    expect: error
    sqlstate: "55000"
    comment: no last value exists
