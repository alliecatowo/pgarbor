# Bounds given in the wrong order yield an empty array; equal bounds yield a one-element array.
id: doc-functions-enum.enum-range-reversed-and-single
title: enum_range with reversed bounds is empty and with equal bounds is a single label
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-range-two-argument, empty-result]
required_capabilities: [create-type, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum (enum_range two-argument form: range between the two values)"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT enum_range('green'::rainbow, 'orange'::rainbow) AS r, cardinality(enum_range('green'::rainbow, 'orange'::rainbow)) AS n
    expect: rows
    comment: the first value comes after the second in declaration order, so the range is empty
  - sql: |
      SELECT enum_range('blue'::rainbow, 'blue'::rainbow) AS r
    expect: rows
    comment: equal bounds give a single-element array
  - sql: |
      SELECT enum_range('purple'::rainbow, NULL) AS r, enum_range(NULL, 'red'::rainbow) AS s
    expect: rows
    comment: the last label alone and the first label alone, as one-sided ranges
