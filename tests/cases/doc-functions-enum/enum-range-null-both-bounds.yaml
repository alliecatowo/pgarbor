# Two NULL bounds with a typed enum argument return the full label list, the same as the one-argument form.
id: doc-functions-enum.enum-range-null-both-bounds
title: enum_range with NULL bounds and a typed NULL returns the full range
family: doc-functions-enum
tier: core
feature_ids: [enum-range, enum-range-two-argument, null-bounds]
required_capabilities: [create-type, enum, arrays, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum (enum_range: null first or last value means start or end)"
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
steps:
  - sql: |
      SELECT enum_range(NULL::rainbow, NULL::rainbow) AS r, enum_range(NULL::rainbow) AS s
    expect: rows
    comment: both forms give {red,orange,yellow,green,blue,purple}
