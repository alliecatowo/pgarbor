# The enum functions accept only enum types; other types fail function resolution (42883).
id: doc-functions-enum.enum-functions-non-enum-argument-error
title: enum_first, enum_last and enum_range reject non-enum arguments with 42883
family: doc-functions-enum
tier: core
feature_ids: [enum-first, enum-last, enum-range, polymorphic-resolution, errors]
required_capabilities: [enum, errors, select]
provenance:
  source: hand
  ref: "src/sgml/func.sgml#functions-enum (signature is anyenum)"
sessions: [a]
steps:
  - sql: |
      SELECT enum_first(1)
    expect: error
    sqlstate: "42883"
    comment: integer is not an enum type
  - sql: |
      SELECT enum_last(null::int4)
    expect: error
    sqlstate: "42883"
    comment: a typed null of a non-enum type also fails resolution
  - sql: |
      SELECT enum_range(null::text)
    expect: error
    sqlstate: "42883"
    comment: text is not an enum type
