# The doc's enum_first and enum_last examples, run after the documented CREATE TYPE rainbow.
id: doc-functions-enum.create-type-first-last
title: enum_first and enum_last over null::rainbow return the first and last declared labels
family: doc-functions-enum
tier: core
feature_ids: [enum-first, enum-last, create-type-enum]
required_capabilities: [create-type, enum, select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-enum"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
    expect: ok
  - sql: |
      SELECT enum_first(null::rainbow) AS first_label, enum_last(null::rainbow) AS last_label
    expect: rows
    comment: doc examples enum_first(null::rainbow) = red and enum_last(null::rainbow) = purple
