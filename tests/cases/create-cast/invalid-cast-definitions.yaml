# PostgreSQL 18 regression create_cast.sql, rewritten as a self-contained case.
id: create-cast.invalid-cast-definitions
title: "Invalid CREATE CAST definitions fail and leave no pg_cast row"
family: create-cast
tier: core
feature_ids: [create-cast, errors, catalog-introspection]
required_capabilities: [create-type, create-cast, create-function-sql, create-function-internal, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_cast.sql"
  license: PostgreSQL
setup: |
  CREATE TYPE casttesttype;
  CREATE FUNCTION casttesttype_in(cstring)
     RETURNS casttesttype
     AS 'textin'
     LANGUAGE internal STRICT IMMUTABLE;
  CREATE FUNCTION casttesttype_out(casttesttype)
     RETURNS cstring
     AS 'textout'
     LANGUAGE internal STRICT IMMUTABLE;
  CREATE TYPE casttesttype (
     internallength = variable,
     input = casttesttype_in,
     output = casttesttype_out,
     alignment = int4
  );
  CREATE FUNCTION casttestfunc(casttesttype) RETURNS int4 LANGUAGE SQL AS
  $$ SELECT 1; $$;
steps:
  - sql: |
      CREATE CAST (casttesttype AS casttesttype) WITHOUT FUNCTION;
    expect: error
    sqlstate: "42P17"
    comment: "source and target types are the same"
  - sql: |
      CREATE CAST (int4 AS casttesttype) WITHOUT FUNCTION;
    expect: error
    sqlstate: "42P17"
    comment: "int4 and casttesttype are not binary-compatible"
  - sql: |
      CREATE CAST (int4 AS casttesttype) WITH FUNCTION casttestfunc(casttesttype);
    expect: error
    sqlstate: "42P17"
    comment: "function argument does not match source type"
  - sql: |
      SELECT count(*) AS n FROM pg_cast WHERE casttarget = 'casttesttype'::regtype;
    expect: rows
    order: multiset
