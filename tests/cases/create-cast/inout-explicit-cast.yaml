# PostgreSQL 18 regression create_cast.sql, rewritten as a self-contained case.
id: create-cast.inout-explicit-cast
title: "WITH INOUT cast is explicit-only and converts through text I/O"
family: create-cast
tier: core
feature_ids: [create-cast, io-conversion, casts]
required_capabilities: [create-type, create-cast, create-function-sql, create-function-internal, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_cast.sql"
  license: PostgreSQL
setup: |
  CREATE TYPE casttesttype;
  CREATE FUNCTION casttesttype_in(cstring)
     RETURNS casttesttype
     AS 'textin'
     LANGUAGE internal STRICT IMMUTABLE;
  CREATE FUNCTION casttesttype_out(casttesttype)
     RETURNS cstring
     AS 'textout'
     LANGUAGE internal STRICT IMMUTABLE;
  CREATE TYPE casttesttype (
     internallength = variable,
     input = casttesttype_in,
     output = casttesttype_out,
     alignment = int4
  );
  CREATE FUNCTION casttestfunc(casttesttype) RETURNS int4 LANGUAGE SQL AS
  $$ SELECT 1; $$;
steps:
  - sql: |
      CREATE CAST (int4 AS casttesttype) WITH INOUT;
    expect: ok
  - sql: |
      SELECT 1234::int4::casttesttype AS v;
    expect: rows
    order: ordered
  - sql: |
      SELECT casttestfunc(1234);
    expect: error
    sqlstate: "42883"
    comment: "I/O cast is not implicit"
  - sql: |
      DROP CAST (int4 AS casttesttype);
    expect: ok
  - sql: |
      SELECT 1234::int4::casttesttype;
    expect: error
    sqlstate: "42846"
