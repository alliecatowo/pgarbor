# PostgreSQL 18 regression create_cast.sql, rewritten as a self-contained case.
id: create-cast.binary-explicit-only
title: "Binary-coercion cast without a function applies only to explicit casts"
family: create-cast
tier: core
feature_ids: [create-cast, binary-coercion, casts]
required_capabilities: [create-type, create-cast, create-function-sql, create-function-internal, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_cast.sql"
  license: PostgreSQL
setup: |
  CREATE TYPE casttesttype;
  CREATE FUNCTION casttesttype_in(cstring)
     RETURNS casttesttype
     AS 'textin'
     LANGUAGE internal STRICT IMMUTABLE;
  CREATE FUNCTION casttesttype_out(casttesttype)
     RETURNS cstring
     AS 'textout'
     LANGUAGE internal STRICT IMMUTABLE;
  CREATE TYPE casttesttype (
     internallength = variable,
     input = casttesttype_in,
     output = casttesttype_out,
     alignment = int4
  );
  CREATE FUNCTION casttestfunc(casttesttype) RETURNS int4 LANGUAGE SQL AS
  $$ SELECT 1; $$;
steps:
  - sql: |
      CREATE CAST (text AS casttesttype) WITHOUT FUNCTION;
    expect: ok
  - sql: |
      SELECT casttestfunc('foo'::text);
    expect: error
    sqlstate: "42883"
    comment: "cast is not implicit, so function resolution fails"
  - sql: |
      SELECT casttestfunc('foo'::text::casttesttype) AS r;
    expect: rows
    order: ordered
    comment: "explicit cast works"
  - sql: |
      DROP CAST (text AS casttesttype);
    expect: ok
