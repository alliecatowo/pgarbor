# READ ONLY also rejects row locking (SELECT FOR UPDATE) and CREATE TEMP TABLE with SQLSTATE 25006.
id: cmd-start-transaction.read-only-blocks-locks-and-temp
title: READ ONLY transactions reject SELECT FOR UPDATE and CREATE TEMP TABLE with 25006
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, read-only-transactions, row-locks, temp-tables, errors]
required_capabilities: [create-table, insert, select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (synopsis: READ ONLY)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  INSERT INTO t VALUES (1, 10);
steps:
  - sql: |
      START TRANSACTION READ ONLY
    expect: ok
  - sql: |
      SELECT v FROM t WHERE id = 1 FOR UPDATE
    expect: error
    sqlstate: "25006"
    comment: row locks are a write in a read-only transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      START TRANSACTION READ ONLY
    expect: ok
  - sql: |
      CREATE TEMP TABLE tmp_ro (i int4)
    expect: error
    sqlstate: "25006"
    comment: even temporary objects cannot be created in a read-only transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT v FROM t WHERE id = 1 FOR UPDATE
    expect: rows
    order: ordered
    comment: outside the read-only block the same locking read succeeds
  - sql: |
      COMMIT
    expect: ok
