# DEFERRABLE and NOT DEFERRABLE are accepted with any level and are reported by transaction_deferrable.
id: cmd-start-transaction.deferrable-modes
title: DEFERRABLE and NOT DEFERRABLE modes are accepted and reported per transaction
family: cmd-start-transaction
tier: extended
feature_ids: [start-transaction, deferrable, transaction-modes, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (synopsis: [ NOT ] DEFERRABLE; Compatibility: DEFERRABLE is a PostgreSQL language extension)"
sessions: [a]
steps:
  - sql: |
      START TRANSACTION ISOLATION LEVEL SERIALIZABLE READ WRITE DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_deferrable') AS d
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL SERIALIZABLE READ ONLY DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_deferrable') AS d
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION READ ONLY NOT DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_deferrable') AS d
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL SERIALIZABLE READ WRITE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_deferrable') AS d
    expect: rows
    order: ordered
    comment: default is NOT DEFERRABLE
  - sql: |
      COMMIT
    expect: ok
