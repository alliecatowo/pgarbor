# Without an ISOLATION LEVEL option, START TRANSACTION uses the session default; an explicit level overrides it.
id: cmd-start-transaction.default-isolation-inherited
title: START TRANSACTION without a level uses default_transaction_isolation and an explicit level overrides it
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, default-transaction-isolation, isolation-level, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (Parameters: refer to SET TRANSACTION, which defaults to the session characteristics)"
sessions: [a]
steps:
  - sql: |
      SET default_transaction_isolation = 'serializable'
    expect: ok
  - sql: |
      START TRANSACTION
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL READ COMMITTED
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
    comment: the explicit mode wins over the session default
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      RESET default_transaction_isolation
    expect: ok
  - sql: |
      START TRANSACTION
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
