# Under REPEATABLE READ the block keeps the snapshot taken at its first query; a row committed by another session stays invisible until the block ends.
id: cmd-start-transaction.repeatable-read-snapshot
title: REPEATABLE READ block keeps its snapshot while another session commits
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, repeatable-read, isolation-level, mvcc, transactions]
required_capabilities: [create-table, insert, select, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (synopsis: ISOLATION LEVEL REPEATABLE READ)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one');
steps:
  - session: a
    sql: |
      START TRANSACTION ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - session: a
    sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
  - session: b
    sql: |
      INSERT INTO t VALUES (2, 'two')
    expect: ok
    comment: autocommit, committed immediately
  - session: a
    sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
    comment: still 1, the snapshot predates the insert
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: a
    sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
    comment: a new autocommit statement sees 2
