# READ ONLY lets the block read but rejects INSERT, UPDATE and DELETE with SQLSTATE 25006.
id: cmd-start-transaction.read-only-blocks-writes
title: START TRANSACTION READ ONLY permits reads and rejects data modification with 25006
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, read-only-transactions, update, delete, errors]
required_capabilities: [create-table, insert, select, update, delete, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (synopsis: READ WRITE | READ ONLY)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  INSERT INTO t VALUES (1, 10), (2, 20);
steps:
  - sql: |
      START TRANSACTION READ ONLY
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
  - sql: |
      UPDATE t SET v = 99 WHERE id = 1
    expect: error
    sqlstate: "25006"
    comment: cannot execute UPDATE in a read-only transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      START TRANSACTION READ ONLY
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3, 30)
    expect: error
    sqlstate: "25006"
    comment: cannot execute INSERT in a read-only transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      START TRANSACTION READ ONLY
    expect: ok
  - sql: |
      DELETE FROM t WHERE id = 2
    expect: error
    sqlstate: "25006"
    comment: cannot execute DELETE in a read-only transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: no write took effect
