# Each isolation level named in START TRANSACTION is in effect inside the block; READ UNCOMMITTED is reported as itself.
id: cmd-start-transaction.isolation-levels-show
title: Each ISOLATION LEVEL option is in effect inside its START TRANSACTION block
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, isolation-level, read-committed, repeatable-read, serializable, read-uncommitted, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (synopsis: ISOLATION LEVEL { SERIALIZABLE | REPEATABLE READ | READ COMMITTED | READ UNCOMMITTED })"
sessions: [a]
steps:
  - sql: |
      START TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL READ COMMITTED
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL READ UNCOMMITTED
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
    comment: PostgreSQL accepts READ UNCOMMITTED and reports it, although it behaves as READ COMMITTED
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
    comment: outside a block the session default applies again
