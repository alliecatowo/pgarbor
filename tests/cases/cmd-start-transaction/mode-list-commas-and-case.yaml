# Transaction modes may be separated by commas or by whitespace, and keywords are case-insensitive.
id: cmd-start-transaction.mode-list-commas-and-case
title: Transaction mode list accepts comma and space separators and lowercase keywords
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, transaction-modes, isolation-level, read-only-transactions, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (Compatibility: SQL requires commas; PostgreSQL allows them to be omitted)"
sessions: [a]
steps:
  - sql: |
      start transaction isolation level repeatable read read only deferrable
    expect: ok
    comment: lowercase keywords and no commas
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL READ COMMITTED, READ ONLY
    expect: ok
    comment: standard comma-separated form
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      START TRANSACTION ISOLATION LEVEL READ COMMITTED
      ,READ ONLY
    expect: ok
    comment: comma on the following line
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
