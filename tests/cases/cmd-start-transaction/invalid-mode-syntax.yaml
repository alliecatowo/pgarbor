# An unknown or malformed transaction mode is a syntax error, and no transaction block is started.
id: cmd-start-transaction.invalid-mode-syntax
title: Unknown or malformed transaction modes raise 42601 and leave no open block
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, isolation-level, errors, syntax-errors]
required_capabilities: [transactions, select, errors]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (synopsis: transaction_mode is one of ISOLATION LEVEL ..., READ WRITE | READ ONLY, [ NOT ] DEFERRABLE)"
sessions: [a]
steps:
  - sql: |
      START TRANSACTION ISOLATION LEVEL FOO
    expect: error
    sqlstate: "42601"
    comment: not a valid isolation level
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
    comment: no transaction was opened, so this is autocommit and succeeds
  - sql: |
      START TRANSACTION ISOLATION SERIALIZABLE
    expect: error
    sqlstate: "42601"
    comment: the LEVEL keyword is required after ISOLATION
  - sql: |
      SELECT 2 AS two
    expect: rows
    order: ordered
  - sql: |
      START TRANSACTION READ
    expect: error
    sqlstate: "42601"
    comment: READ must be followed by ONLY or WRITE
  - sql: |
      SELECT 3 AS three
    expect: rows
    order: ordered
