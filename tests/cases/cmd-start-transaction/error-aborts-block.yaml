# After a runtime error inside START TRANSACTION the block is aborted: further statements, including a nested START, fail with 25P02 until ROLLBACK.
id: cmd-start-transaction.error-aborts-block
title: A failed statement aborts the START TRANSACTION block until ROLLBACK
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, rollback, errors, aborted-transaction]
required_capabilities: [transactions, select, errors]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (Description: begins a new transaction block)"
sessions: [a]
steps:
  - sql: |
      START TRANSACTION
    expect: ok
  - sql: |
      SELECT 1/0 AS boom
    expect: error
    sqlstate: "22012"
    comment: division by zero aborts the block
  - sql: |
      START TRANSACTION
    expect: error
    sqlstate: "25P02"
    comment: current transaction is aborted, commands ignored until end of transaction block
  - sql: |
      SELECT 2 AS two
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT 3 AS three
    expect: rows
    order: ordered
    comment: ROLLBACK ends the aborted block and autocommit resumes
