# Once a block has run a statement, its isolation level and read/write mode can no longer be changed (SQLSTATE 25001).
id: cmd-start-transaction.mode-change-after-first-query
title: Changing isolation or read/write mode after the first statement of a block raises 25001
family: cmd-start-transaction
tier: core
feature_ids: [start-transaction, set-transaction, isolation-level, read-only-transactions, errors]
required_capabilities: [transactions, select, guc, errors]
provenance:
  source: pg-docs
  ref: "ref/start_transaction.sgml#sql-start-transaction (Description: as if SET TRANSACTION was executed; see sql-set-transaction)"
sessions: [a]
steps:
  - sql: |
      START TRANSACTION
    expect: ok
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: error
    sqlstate: "25001"
    comment: isolation level cannot change after the first query
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      START TRANSACTION READ ONLY
    expect: ok
  - sql: |
      SELECT 2 AS two
    expect: rows
    order: ordered
  - sql: |
      SET TRANSACTION READ WRITE
    expect: error
    sqlstate: "25001"
    comment: read/write mode cannot change after the first query
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      START TRANSACTION
    expect: ok
  - sql: |
      SELECT 3 AS three
    expect: rows
    order: ordered
  - sql: |
      START TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: error
    sqlstate: "25001"
    comment: a nested START TRANSACTION also warns 25001 and then fails to change the level
  - sql: |
      ROLLBACK
    expect: ok
