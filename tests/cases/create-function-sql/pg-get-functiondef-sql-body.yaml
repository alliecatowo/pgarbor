# pg_get_functiondef renders quoted and SQL-standard bodies as stored.
id: create-function-sql.pg-get-functiondef-sql-body
title: pg_get_functiondef output for a quoted body and a BEGIN ATOMIC body
family: create-function-sql
tier: extended
feature_ids: [create-function, catalog-introspection, sql-standard-function-body]
required_capabilities: [create-function, sql-functions, sql-standard-function-body, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_function_sql.sql"
setup: |
  CREATE FUNCTION functest_a_1(text, date) RETURNS bool LANGUAGE sql
         AS 'SELECT $1 = ''abcd'' AND $2 > ''2001-01-01''';
  CREATE FUNCTION functest_s_10(a text, b date) RETURNS boolean
      LANGUAGE SQL
      BEGIN ATOMIC
          SELECT a = 'abcd' AND b > '2001-01-01';
      END;
steps:
  - sql: |
      SELECT pg_get_functiondef('functest_a_1'::regproc)
    expect: rows
  - sql: |
      SELECT pg_get_functiondef('functest_s_10'::regproc)
    expect: rows
