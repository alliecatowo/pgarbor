# SQL-standard body with a scalar subquery over a view, and a void BEGIN ATOMIC body that inserts.
id: create-function-sql.sql-standard-body-subquery-and-void-insert
title: SQL-standard body with scalar subquery over a view and a void body performing an INSERT
family: create-function-sql
tier: core
feature_ids: [create-function, sql-standard-function-body, views, insert, aggregates]
required_capabilities: [create-function, sql-functions, sql-standard-function-body, create-table, create-view, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_function_sql.sql"
setup: |
  CREATE TABLE functest3 (a int);
  INSERT INTO functest3 VALUES (1), (2);
  CREATE VIEW functestv3 AS SELECT * FROM functest3;
  CREATE TABLE functest1 (i int);
steps:
  - sql: |
      CREATE FUNCTION functest_s_14() RETURNS bigint
          RETURN (SELECT count(*) FROM functestv3)
    expect: ok
  - sql: |
      SELECT functest_s_14() AS cnt
    expect: rows
  - sql: |
      CREATE FUNCTION functest_s_16(a int, b int) RETURNS void
          LANGUAGE SQL
          BEGIN ATOMIC
              INSERT INTO functest1 SELECT a + $2;
          END
    expect: ok
  - sql: |
      SELECT functest_s_16(3, 4)
    expect: rows
    comment: void result is one row with an empty value
  - sql: |
      SELECT i FROM functest1 ORDER BY i
    expect: rows
    order: ordered
