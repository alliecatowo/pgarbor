# CREATE OR REPLACE keeps a routine's kind: changing function to window/procedure is rejected.
id: create-function-sql.create-or-replace-kind-errors
title: CREATE OR REPLACE cannot change a function into a window function or a procedure
family: create-function-sql
tier: core
feature_ids: [create-function, create-or-replace, errors, procedures]
required_capabilities: [create-function, sql-functions, procedures, errors, drop-function]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_function_sql.sql"
steps:
  - sql: |
      CREATE FUNCTION functest1(a int) RETURNS int LANGUAGE SQL AS 'SELECT $1'
    expect: ok
  - sql: |
      CREATE OR REPLACE FUNCTION functest1(a int) RETURNS int LANGUAGE SQL AS 'SELECT $1 + 1'
    expect: ok
  - sql: |
      SELECT functest1(41) AS v
    expect: rows
  - sql: |
      CREATE OR REPLACE FUNCTION functest1(a int) RETURNS int LANGUAGE SQL WINDOW AS 'SELECT $1'
    expect: error
    sqlstate: "42809"
    comment: cannot change routine kind
  - sql: |
      CREATE OR REPLACE PROCEDURE functest1(a int) LANGUAGE SQL AS 'SELECT $1'
    expect: error
    sqlstate: "42809"
    comment: cannot change routine kind
  - sql: |
      DROP FUNCTION functest1(a int)
    expect: ok
