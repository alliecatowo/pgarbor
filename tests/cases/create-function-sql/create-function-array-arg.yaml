# SQL function over a text[] argument: subscripting in range, out of range and NULL array.
id: create-function-sql.create-function-array-arg
title: SQL function with array argument, out-of-range subscript yields NULL, bad element cast fails
family: create-function-sql
tier: core
feature_ids: [create-function, sql-language-functions, arrays, null-handling, errors]
required_capabilities: [create-function, sql-functions, select, arrays, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_function_sql.sql"
steps:
  - sql: |
      CREATE FUNCTION functest_a_2(text[]) RETURNS int LANGUAGE sql AS 'SELECT $1[1]::int'
    expect: ok
  - sql: |
      SELECT functest_a_2(ARRAY['1', '2', '3']) AS first,
             functest_a_2(ARRAY[]::text[]) AS empty_arr,
             functest_a_2(NULL::text[]) AS null_arr
    expect: rows
    order: ordered
  - sql: |
      SELECT functest_a_2(ARRAY['x'])
    expect: error
    sqlstate: "22P02"
