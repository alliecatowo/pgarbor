# Set-returning SQL function under LIMIT: only the first rows are produced; full count still 100.
id: create-function-sql.srf-early-shutdown-limit
title: Set-returning SQL function with generate_series under LIMIT returns the first rows
family: create-function-sql
tier: core
feature_ids: [create-function, set-returning-functions, limit, dollar-quoting]
required_capabilities: [create-function, sql-functions, set-returning-functions, limit, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_function_sql.sql"
setup: |
  CREATE FUNCTION functest_srf0() RETURNS SETOF int
  LANGUAGE SQL
  AS $$ SELECT i FROM generate_series(1, 100) i $$;
steps:
  - sql: |
      SELECT functest_srf0() LIMIT 5
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM functest_srf0()
    expect: rows
  - sql: |
      SELECT x FROM functest_srf0() AS f(x) ORDER BY x DESC LIMIT 2
    expect: rows
    order: ordered
