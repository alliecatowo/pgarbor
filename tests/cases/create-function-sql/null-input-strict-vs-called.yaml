# CALLED ON NULL INPUT vs RETURNS NULL ON NULL INPUT (STRICT): the body runs or is skipped on NULL.
id: create-function-sql.null-input-strict-vs-called
title: Default, CALLED ON NULL INPUT, RETURNS NULL ON NULL INPUT and STRICT behavior with NULL arguments
family: create-function-sql
tier: core
feature_ids: [create-function, null-handling, sql-language-functions]
required_capabilities: [create-function, sql-functions, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_function_sql.sql"
setup: |
  CREATE FUNCTION functest_f_1(int) RETURNS bool LANGUAGE sql AS 'SELECT $1 > 50';
  CREATE FUNCTION functest_f_2(int) RETURNS bool LANGUAGE sql CALLED ON NULL INPUT AS 'SELECT $1 IS NULL';
  CREATE FUNCTION functest_f_3(int) RETURNS bool LANGUAGE sql RETURNS NULL ON NULL INPUT AS 'SELECT $1 IS NULL';
  CREATE FUNCTION functest_f_4(int) RETURNS bool LANGUAGE sql STRICT AS 'SELECT $1 IS NULL';
steps:
  - sql: |
      SELECT functest_f_1(NULL::int) AS f1,
             functest_f_2(NULL::int) AS f2,
             functest_f_3(NULL::int) AS f3,
             functest_f_4(NULL::int) AS f4,
             functest_f_1(51) AS g1,
             functest_f_4(50) AS g4
    expect: rows
    order: ordered
    comment: f2 is called with NULL and returns true; f1, f3, f4 return NULL without a meaningful body result
