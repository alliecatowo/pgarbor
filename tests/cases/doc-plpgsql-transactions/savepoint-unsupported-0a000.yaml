# PL/pgSQL does not support SAVEPOINT; the statement is rejected as an unsupported transaction command.
id: doc-plpgsql-transactions.savepoint-unsupported-0a000
title: SAVEPOINT inside PL/pgSQL is rejected with 0A000
family: doc-plpgsql-transactions
tier: core
feature_ids: [plpgsql, savepoints, errors, transaction-management]
required_capabilities: [plpgsql, savepoints, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-transactions"
sessions: [a]
steps:
  - sql: |
      DO $$
      BEGIN
          SAVEPOINT s1;
      END;
      $$
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    order: ordered
