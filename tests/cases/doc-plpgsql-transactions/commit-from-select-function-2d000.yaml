# Transaction control is only allowed in CALL/DO invocations at the top level; a function called from SELECT cannot COMMIT.
id: doc-plpgsql-transactions.commit-from-select-function-2d000
title: COMMIT inside a function invoked from SELECT raises invalid transaction termination
family: doc-plpgsql-transactions
tier: core
feature_ids: [plpgsql, functions, commit, errors, transaction-management]
required_capabilities: [create-table, select, plpgsql, create-function, transactions, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-transactions"
sessions: [a]
setup: |
  CREATE FUNCTION fc() RETURNS int4 LANGUAGE plpgsql AS $$
  BEGIN
      COMMIT;
      RETURN 1;
  END
  $$;
steps:
  - sql: |
      SELECT fc()
    expect: error
    sqlstate: "2D000"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    order: ordered
    comment: the session remains usable after the error
