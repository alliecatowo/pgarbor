# An explicit BEGIN block cannot be ended by a COMMIT issued from inside a DO block.
id: doc-plpgsql-transactions.commit-inside-explicit-block-2d000
title: COMMIT inside DO within an explicit transaction block raises 2D000
family: doc-plpgsql-transactions
tier: core
feature_ids: [plpgsql, do-block, commit, errors, transaction-management]
required_capabilities: [create-table, insert, select, plpgsql, transactions, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-transactions"
sessions: [a]
setup: |
  CREATE TABLE test1 (a int4);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO test1 VALUES (1)
    expect: ok
  - sql: |
      DO $$ BEGIN COMMIT; END $$
    expect: error
    sqlstate: "2D000"
  - sql: |
      ROLLBACK
    expect: ok
    comment: the aborted block is rolled back; the earlier insert is gone
  - sql: |
      SELECT count(*) FROM test1
    expect: rows
    order: ordered
