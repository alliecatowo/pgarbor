# VALUES accepts ORDER BY (with DESC, USING operator), LIMIT/ALL, OFFSET with ROW/ROWS, and FETCH FIRST.
id: cmd-values.order-limit-offset-fetch
title: VALUES supports ORDER BY, LIMIT ALL, OFFSET ROW, FETCH FIRST ROWS ONLY and USING operators
family: cmd-values
tier: core
feature_ids: [values, order-by, limit, offset, fetch-first]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (synopsis; Description: ORDER BY, LIMIT, OFFSET, FETCH)"
sessions: [a]
steps:
  - sql: |
      VALUES (1, 'one'), (2, 'two'), (3, 'three') ORDER BY column1 DESC
    expect: rows
    order: ordered
    comment: sort_expression may refer to column1, column2
  - sql: |
      VALUES (1, 'one'), (2, 'two'), (3, 'three') ORDER BY 2
    expect: rows
    order: ordered
    comment: integer constant in ORDER BY refers to the second output column
  - sql: |
      VALUES (1), (2), (3) ORDER BY column1 USING >
    expect: rows
    order: ordered
    comment: USING operator form of ORDER BY
  - sql: |
      VALUES (1), (2), (3), (4) ORDER BY column1 LIMIT 2 OFFSET 1
    expect: rows
    order: ordered
  - sql: |
      VALUES (1), (2), (3), (4) ORDER BY column1 OFFSET 1 ROW
    expect: rows
    order: ordered
    comment: singular ROW is accepted with OFFSET
  - sql: |
      VALUES (1), (2), (3) FETCH FIRST 2 ROWS ONLY
    expect: rows
    order: ordered
  - sql: |
      VALUES (1), (2), (3) ORDER BY column1 LIMIT ALL OFFSET 0
    expect: rows
    order: ordered
  - sql: |
      VALUES (1), (2), (3) ORDER BY column1 OFFSET 5
    expect: rows
    order: ordered
    comment: offset beyond the row count yields zero rows
