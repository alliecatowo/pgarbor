# NULL handling in VALUES: NULL entries are ordinary values, count ignores them, and default ORDER BY
# places NULLs last in ascending order (NULLS FIRST / LAST overrides).
id: cmd-values.null-and-order-semantics
title: NULLs in VALUES lists sort last ascending by default and aggregate as ordinary NULLs
family: cmd-values
tier: core
feature_ids: [values, nulls, order-by, aggregates]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Description; ORDER BY per sql-select)"
sessions: [a]
steps:
  - sql: |
      SELECT count(*) AS total, count(column1) AS non_null FROM (VALUES (NULL::int), (NULL), (3)) v
    expect: rows
    order: ordered
  - sql: |
      SELECT column1 FROM (VALUES (2), (NULL), (1)) v ORDER BY column1
    expect: rows
    order: ordered
    comment: ascending default puts NULL last
  - sql: |
      SELECT column1 FROM (VALUES (2), (NULL), (1)) v ORDER BY column1 DESC
    expect: rows
    order: ordered
    comment: descending default puts NULL first
  - sql: |
      SELECT column1 FROM (VALUES (2), (NULL), (1)) v ORDER BY column1 NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT column1 IS NULL AS is_null FROM (VALUES (NULL), (1)) v ORDER BY 1
    expect: rows
    order: ordered
