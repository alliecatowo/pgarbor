# Documented error conditions for VALUES lists: unequal row lengths (syntax error),
# and rows whose column types cannot be matched (datatype mismatch).
id: cmd-values.type-and-arity-errors
title: VALUES rejects rows of unequal length and column types with no common type
family: cmd-values
tier: core
feature_ids: [values, errors, type-resolution]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Description: all rows must have the same number of elements; types combined like UNION)"
sessions: [a]
steps:
  - sql: |
      VALUES (1, 'a'), (2)
    expect: error
    sqlstate: "42601"
    comment: all rows must have the same number of elements
  - sql: |
      VALUES (1), (true)
    expect: error
    sqlstate: "42804"
    comment: integer and boolean have no common type under UNION rules
  - sql: |
      SELECT 'still usable' AS status
    expect: rows
    order: ordered
    comment: the session remains usable after the errors
