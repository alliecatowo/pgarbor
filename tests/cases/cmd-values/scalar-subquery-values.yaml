# A VALUES command used where a scalar subquery is expected: one row yields its value, more than one row is a cardinality error.
id: cmd-values.scalar-subquery-values
title: VALUES as a scalar subquery returns its single value or errors on multiple rows
family: cmd-values
tier: core
feature_ids: [values, scalar-subquery, errors]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Description: VALUES is syntactically allowed anywhere SELECT is)"
sessions: [a]
steps:
  - sql: |
      SELECT (VALUES (7)) AS v
    expect: rows
    order: ordered
    comment: VALUES is allowed wherever SELECT is, here as a scalar subquery
  - sql: |
      SELECT (VALUES (1), (2)) AS v
    expect: error
    sqlstate: "21000"
    comment: a scalar subquery returning more than one row
  - sql: |
      SELECT 1 + (VALUES (10)) AS v
    expect: rows
    order: ordered
