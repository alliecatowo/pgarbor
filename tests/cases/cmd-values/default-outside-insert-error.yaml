# DEFAULT is only permitted in a VALUES list at the top level of INSERT; elsewhere it is an error.
id: cmd-values.default-outside-insert-error
title: DEFAULT inside VALUES outside a top-level INSERT is rejected
family: cmd-values
tier: core
feature_ids: [values, column-defaults, errors]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Parameters: DEFAULT cannot be used when VALUES appears in other contexts)"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM (VALUES (DEFAULT, 1)) v
    expect: error
    sqlstate: "42601"
    comment: DEFAULT is not allowed in a FROM-clause VALUES
  - sql: |
      VALUES (DEFAULT)
    expect: error
    sqlstate: "42601"
    comment: bare VALUES command is not INSERT
