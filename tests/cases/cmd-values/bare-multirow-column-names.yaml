# A bare multi-row VALUES command returns a table with default column names column1, column2, ...
# Also equivalent use as a FROM-clause table with an explicit alias and column list.
id: cmd-values.bare-multirow-column-names
title: Bare multi-row VALUES yields default column names column1..N and an aliased column list
family: cmd-values
tier: core
feature_ids: [values, from-clause-subquery, column-aliases]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Description; Examples: bare VALUES command)"
sessions: [a]
steps:
  - sql: |
      VALUES (1, 'one'), (2, 'two'), (3, 'three')
    expect: rows
    order: ordered
    comment: the doc says this returns a table of two columns and three rows
  - sql: |
      SELECT column1, column2 FROM (VALUES (1, 'one'), (2, 'two'), (3, 'three')) ORDER BY column1
    expect: rows
    order: ordered
    comment: default names are column1 and column2 in PostgreSQL
  - sql: |
      SELECT n, s FROM (VALUES (1, 'one'), (2, 'two'), (3, 'three')) AS v (n, s) WHERE n >= 2 ORDER BY n
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS cnt, count(DISTINCT column2) AS distinct_s FROM (VALUES (1, 'x'), (1, 'x'), (2, 'y')) v
    expect: rows
    order: ordered
