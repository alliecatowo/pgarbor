# The documentation says an AS clause is required for VALUES in a FROM clause; PostgreSQL 18 accepts an
# unaliased VALUES subquery in FROM (as for subqueries generally). Aliasing with and without column names both work.
id: cmd-values.from-clause-alias-optional
title: VALUES in a FROM clause works with or without an alias and with partial column aliases
family: cmd-values
tier: core
feature_ids: [values, from-clause-subquery, column-aliases]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Examples: VALUES in FROM; note on AS clause)"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM (VALUES (1), (2)) ORDER BY column1
    expect: rows
    order: ordered
    comment: no alias at all; doc says AS is required, PG18 accepts it
  - sql: |
      SELECT * FROM (VALUES (1, 'x'), (2, 'y')) AS t ORDER BY 1
    expect: rows
    order: ordered
    comment: alias without column names keeps default column names
  - sql: |
      SELECT a, column2 FROM (VALUES (1, 'x'), (2, 'y')) AS t (a) ORDER BY a
    expect: rows
    order: ordered
    comment: a partial column alias list renames only the first column; the rest keep column2
