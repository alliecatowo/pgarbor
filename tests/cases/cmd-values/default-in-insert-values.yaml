# In a top-level VALUES list of an INSERT, an entry may be DEFAULT to use the destination column's default.
# Multiple rows may each use DEFAULT independently.
id: cmd-values.default-in-insert-values
title: DEFAULT entries in a multi-row INSERT VALUES list use each column's default
family: cmd-values
tier: core
feature_ids: [values, insert, column-defaults]
required_capabilities: [create-table, values, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Parameters: expression DEFAULT; Examples: INSERT with DEFAULT)"
sessions: [a]
setup: |
  CREATE TABLE films (code text, title text, did int DEFAULT 105, date_prod date, kind text DEFAULT 'Comedy', len interval DEFAULT '90 minutes');
steps:
  - sql: |
      INSERT INTO films VALUES ('UA502', 'Bananas', 105, DEFAULT, 'Comedy', '82 minutes'), ('T_601', 'Yojimbo', 106, DEFAULT, 'Drama', DEFAULT)
    expect: ok
    comment: the doc example; DEFAULT for date_prod (no default) yields NULL
  - sql: |
      INSERT INTO films (code, title, did) VALUES ('X1', 'Filler', DEFAULT), ('X2', 'Filler2', 7)
    expect: ok
    comment: DEFAULT for did takes its declared default 105
  - sql: |
      SELECT code, did, date_prod IS NULL AS no_date, kind, len FROM films ORDER BY code
    expect: rows
    order: ordered
