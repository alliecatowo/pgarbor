# In an INSERT, every VALUES entry is coerced to its destination column type (assignment cast),
# so quoted literals and numeric values become the column's type, with numeric-to-integer rounding.
id: cmd-values.insert-coerces-values
title: Multi-row INSERT VALUES coerces each entry to the destination column type
family: cmd-values
tier: core
feature_ids: [values, insert, type-coercion]
required_capabilities: [create-table, values, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/values.sgml#sql-values (Examples: coercion to destination column type in INSERT)"
sessions: [a]
setup: |
  CREATE TABLE coerce_t (a int4, b numeric(8,2), c text, d bool);
steps:
  - sql: |
      INSERT INTO coerce_t VALUES ('1', 2.7, 42, 'yes'), ('3', 4, 'x', 'f'), (5, 1.005, NULL, NULL)
    expect: ok
    comment: quoted int, numeric into int column rounds 2.7 to 3; 1.005 into numeric(8,2) rounds to 1.01
  - sql: |
      SELECT a, b, c, d FROM coerce_t ORDER BY a
    expect: rows
    order: ordered
