# Separators and blanks in to_timestamp/to_date match any single separator or are skipped, unless FX is given.
id: doc-functions-formatting.to-timestamp-separators-and-blanks
title: Non-FX templates skip extra blanks and matching separators in to_timestamp input
family: doc-functions-formatting
tier: core
feature_ids: [to-timestamp, to-date, separators, whitespace-handling, fx-option]
required_capabilities: [select, timestamptz-type, timezone-setting]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-datetime (usage notes on blank spaces and separators in to_timestamp and to_date)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT
        to_timestamp('   2000    JUN', 'YYYY MON') AS leading_and_extra_blanks,
        to_timestamp('2000 - JUN', 'YYYY-MON') AS separator_as_space,
        to_timestamp('2000JUN', 'YYYY///MON') AS many_template_separators,
        to_timestamp('2000/JUN', 'YYYY MON') AS slash_for_space,
        to_timestamp('2000/JUN', 'FXYYYY MON') AS fx_one_for_one,
        to_date('2000 jun 01', 'YYYY MON DD') AS case_insensitive_month
    expect: rows
    order: multiset
    comment: FX is absent in the first five, so separators are matched loosely; the FX case still works because exactly one character matches the one separator
