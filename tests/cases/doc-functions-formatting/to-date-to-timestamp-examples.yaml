# Documented to_date and to_timestamp examples, including the ISO 8601 week-date and year-with-separator forms.
id: doc-functions-formatting.to-date-to-timestamp-examples
title: Documented to_date and to_timestamp examples with ISO week dates and separators
family: doc-functions-formatting
tier: core
feature_ids: [to-date, to-timestamp, iso-week-date, time-zone-offset-output]
required_capabilities: [select, date-type, timestamptz-type, timezone-setting]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-datetime (to_date/to_timestamp examples and ISO 8601 week-numbering usage notes)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'America/New_York'
    expect: ok
  - sql: |
      SELECT
        to_date('05 Dec 2000', 'DD Mon YYYY') AS d_example,
        to_timestamp('05 Dec 2000', 'DD Mon YYYY') AS ts_example,
        to_date('2006-42-4', 'IYYY-IW-ID') AS iso_week_weekday,
        to_date('2006-42', 'IYYY-IW') AS iso_week_default_monday,
        to_date('2006-291', 'IYYY-IDDD') AS iso_day_of_year,
        to_date('20000-1130', 'YYYY-MMDD') AS five_digit_year,
        to_date('20000Nov30', 'YYYYMonDD') AS five_digit_year_mon
    expect: rows
    order: multiset
    comment: the timestamptz result uses the session zone America/New_York
