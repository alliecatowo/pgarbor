# Boundary behaviour: too-narrow templates print '#', fractional digits round, V shifts the implicit decimal point.
id: doc-functions-formatting.to-char-overflow-rounding-boundaries
title: Overflow shows hash marks, fractional digits round, and V shifts digits
family: doc-functions-formatting
tier: core
feature_ids: [to-char, numeric-formatting, overflow, rounding, shift-pattern]
required_capabilities: [select, numeric-type, float4]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-numeric (to_char rounds to the specified number of fractional digits; V usage; to_char examples)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(123, '9') AS overflow_hash,
        to_char(-1, '9') AS negative_fits,
        to_char(12.5, '99') AS round_half_up,
        to_char(13.5, '99') AS round_half_up_odd,
        to_char(12.45, '99V9') AS shift_one,
        to_char(12, '99V999') AS shift_three,
        to_char(12.4, '99V999') AS shift_fraction,
        to_char(1234567.89, '9,999,999.99') AS grouping_bigger
    expect: rows
    order: multiset
    comment: '123 does not fit one digit and renders as a single hash mark'
