# Template construction errors: EEEE must come last, V cannot combine with a decimal point, and RN rejects non-numerals.
id: doc-functions-formatting.to-char-template-syntax-errors
title: Misplaced EEEE and V-with-decimal-point templates are rejected with syntax errors
family: doc-functions-formatting
tier: core
feature_ids: [to-char, scientific-notation, shift-pattern, template-syntax]
required_capabilities: [select, numeric-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-numeric (EEEE placement and V usage notes)"
sessions: [a]
steps:
  - sql: |
      SELECT to_char(1, 'EEEE9')
    expect: error
    sqlstate: "42601"
    comment: EEEE must be the last pattern in the template
  - sql: |
      SELECT to_char(125, '99V9.9')
    expect: error
    sqlstate: "42601"
    comment: to_char does not support V combined with a decimal point
  - sql: |
      SELECT to_char(12, '99')
    expect: rows
    order: multiset
    comment: control case, a plain template works
