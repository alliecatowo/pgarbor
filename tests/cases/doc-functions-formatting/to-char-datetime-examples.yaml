# Documented to_char examples for timestamp, interval and timestamptz inputs (the current_timestamp examples are omitted: not deterministic).
id: doc-functions-formatting.to-char-datetime-examples
title: Documented to_char examples for timestamp, interval and timestamptz values
family: doc-functions-formatting
tier: core
feature_ids: [to-char, datetime-formatting, interval-formatting, timestamptz-formatting]
required_capabilities: [select, timestamp-type, interval-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-table (to_char examples for timestamp and interval)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(timestamp '2002-04-20 17:31:12.66', 'HH12:MI:SS') AS hms12,
        to_char(interval '15h 2m 12s', 'HH24:MI:SS') AS interval_hms,
        to_char(timestamp '2002-04-20 17:31:12.66', 'FMDay, FMDD  HH12:MI:SS') AS fm_day,
        to_char(timestamp '2002-04-20 17:31:12.66', 'Day, DD  HH12:MI:SS') AS padded_day,
        to_char(timestamptz '2022-12-06 05:39:18+00' AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS"Z"') AS iso_extended,
        to_char(timestamp '2002-04-20 17:31:12.66', 'HH12:MI:SS AM') AS meridiem
    expect: rows
    order: multiset
    comment: 'Day is blank-padded to 9 characters, so the padded form keeps its trailing blanks'
