# RN and rn produce Roman numerals (values 1..3999), TH/th add ordinal suffixes, EEEE gives scientific notation.
id: doc-functions-formatting.to-char-roman-ordinal-scientific
title: Roman numerals, ordinal suffixes and scientific notation in to_char
family: doc-functions-formatting
tier: core
feature_ids: [to-char, roman-numerals, ordinal-suffix, scientific-notation, fill-mode]
required_capabilities: [select, numeric-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-numeric (RN, TH, EEEE patterns and examples)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(485, 'FMRN') AS rn_fm,
        to_char(5.2, 'FMRN') AS rn_fraction,
        to_char(482, '999th') AS th_lower,
        to_char(1, 'FM999TH') AS th_upper_one,
        to_char(0.0004859, '9.99EEEE') AS sci_small,
        to_char(125, '9.99EEEE') AS sci_pos,
        to_char(-125.8, '999.9EEEE') AS sci_neg
    expect: rows
    order: multiset
    comment: TH does not convert fractional numbers; the RN value for 5.2 is the documented 'V'
