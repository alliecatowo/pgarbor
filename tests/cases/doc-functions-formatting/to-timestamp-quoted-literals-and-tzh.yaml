# Quoted or letter-based literal text skips input characters, and TZH reads a signed offset whose minus sign may be a separator.
id: doc-functions-formatting.to-timestamp-literals-and-tzh
title: Literal skipping in to_timestamp and the signed TZH ambiguity rule
family: doc-functions-formatting
tier: core
feature_ids: [to-timestamp, literal-text, tzh-pattern, sign-ambiguity]
required_capabilities: [select, timestamptz-type, timezone-setting]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-datetime (literal text skipping, letter-only skipping, TZH sign rule)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT
        to_timestamp('2000y6m1d', 'yyyy"y"MM"m"DD"d"') AS quoted_skip,
        to_timestamp('2000y6m1d', 'yyyytMMtDDt') AS letter_skip,
        to_timestamp('2000 -10', 'YYYY TZH') AS minus_is_tzh,
        to_timestamp('2000 -10', 'YYYY  TZH') AS minus_is_separator
    expect: rows
    order: multiset
    comment: the second TZH case has two spaces in the template, so the minus is a separator and 10 is the offset
