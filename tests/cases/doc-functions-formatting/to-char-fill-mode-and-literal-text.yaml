# FM, FX, TM and TH modifiers, quoted literal text, escaped double quotes, and year pattern variants.
id: doc-functions-formatting.to-char-fill-mode-and-literal-text
title: Fill mode, ordinal modifiers, quoted literal text and year pattern variants in to_char
family: doc-functions-formatting
tier: core
feature_ids: [to-char, fill-mode, ordinal-suffix, literal-text, year-patterns, datetime-formatting]
required_capabilities: [select, timestamp-type, date-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-datetime (modifiers, usage notes on literal text and quotes)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(timestamp '2020-01-05 13:04:05', 'FMHH12TH FMDDTH DDth') AS ordinals,
        to_char(timestamp '2020-01-05', 'FMDay FMDy FMMonth FMMon') AS fm_names,
        to_char(timestamp '2020-01-05', 'TMMonth') AS tm_month,
        to_char(timestamp '2020-01-05', '"Hello Year "YYYY') AS quoted_text,
        to_char(timestamp '2020-01-05', 'FM"Hello Year "YYYY') AS quoted_fm,
        to_char(timestamp '2020-01-05', '\"YYYY Month\"') AS escaped_quotes,
        to_char(timestamp '2020-01-05', 'Y,YYY YYYY YYY YY Y') AS year_forms,
        to_char(timestamp '2020-01-05', 'IYYY IYY IY I') AS iso_year_forms,
        to_char(timestamp '2020-01-05', 'CC') AS century
    expect: rows
    order: multiset
    comment: quoted text is copied verbatim, so the Y inside Year is not replaced
  - sql: |
      SELECT to_char(timestamp '2020-01-05 13:04:05', 'HH12:MI:SS AM PM am pm A.M. P.M.') AS meridiem
    expect: rows
    order: multiset
    comment: 13:04 is in the afternoon, so every meridiem spelling reports PM; the dotted forms keep their periods
