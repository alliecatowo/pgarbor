# HH and HH12 on an interval follow a 12-hour clock, while HH24 shows the full hour count.
id: doc-functions-formatting.to-char-interval-twelve-hour-clock
title: Interval hours above 23 use HH24 while HH and HH12 wrap to a 12-hour clock
family: doc-functions-formatting
tier: core
feature_ids: [to-char, interval-formatting, hour-patterns]
required_capabilities: [select, interval-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-datetime (usage note: to_char(interval) formats HH and HH12 on a 12-hour clock)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(interval '36 hours', 'HH12 HH24') AS hours_36,
        to_char(interval '0 hours', 'HH12 HH24') AS hours_0,
        to_char(interval '15h 2m 12s', 'HH24:MI:SS') AS hms,
        to_char(interval '23 hours 30 minutes', 'HH:MI') AS hh_default,
        to_char(interval '48 hours 1 minute', 'HH24:MI') AS two_days
    expect: rows
    order: multiset
    comment: HH12 of 36 hours reports 12, HH24 reports 36
