# Documented to_char numeric examples that do not depend on the locale (D, G, L are excluded).
id: doc-functions-formatting.to-char-numeric-examples
title: Documented to_char examples for integer, real and numeric inputs
family: doc-functions-formatting
tier: core
feature_ids: [to-char, numeric-formatting, digit-patterns, decimal-rounding]
required_capabilities: [select, numeric-type, float4]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-table (to_char numeric examples)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(125, '999') AS e1,
        to_char(125.8::real, '999.9') AS e2,
        to_char(-0.1, '99.99') AS e3,
        to_char(-0.1, 'FM9.99') AS e4,
        to_char(-0.1, 'FM90.99') AS e5,
        to_char(0.1, '0.9') AS e6,
        to_char(12, '9990999.9') AS e7,
        to_char(12, 'FM9990999.9') AS e8,
        to_char(485, '999') AS e9,
        to_char(-485, '999') AS e10,
        to_char(485, '9 9 9') AS e11,
        to_char(1485, '9,999') AS e12,
        to_char(148.5, '999.999') AS e13,
        to_char(148.5, 'FM999.999') AS e14,
        to_char(148.5, 'FM999.990') AS e15,
        to_char(3148.5, '9,999.999') AS e16,
        to_char(-125.8, '999.99S') AS e17
    expect: rows
    order: multiset
    comment: the doc table prints these with blank padding for positive values; the recorder captures the exact text
