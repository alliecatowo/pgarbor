# Two-digit and short year adjustment, negative years as BC, year zero as 1 BC, and CC handling.
id: doc-functions-formatting.to-date-year-and-era-rules
title: Short year adjustment, negative years and BC handling in to_date and to_timestamp
family: doc-functions-formatting
tier: core
feature_ids: [to-date, to-timestamp, year-patterns, bc-era, century-field]
required_capabilities: [select, date-type, timestamptz-type, timezone-setting]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-datetime (year adjustment, negative years, year zero, CC usage notes)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT
        to_date('95', 'YYY') AS short_year_95,
        to_date('-44-03-15 BC', 'YYYY-MM-DD BC') AS negative_plus_bc_is_ad,
        to_date('-44-03-15', 'YYYY-MM-DD') AS negative_is_bc,
        to_date('0000-01-01', 'YYYY-MM-DD') AS year_zero,
        to_date('2000-01-01 BC', 'YYYY-MM-DD BC') AS explicit_bc,
        to_date('21 00', 'CC YY') AS century_with_year
    expect: rows
    order: multiset
    comment: a year-with-BC that is negative flips back to AD; year 0 reads as 1 BC
