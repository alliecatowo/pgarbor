# to_number accepts Roman numerals in either case (RN and rn), and FM is ignored by to_number.
id: doc-functions-formatting.to-number-roman-and-fill
title: to_number parses Roman numerals case-insensitively and ignores FM
family: doc-functions-formatting
tier: core
feature_ids: [to-number, roman-numerals, fill-mode]
required_capabilities: [select, numeric-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-numeric (RN in to_number is case-insensitive; FM is ignored)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_number('XII', 'RN') AS upper_roman,
        to_number('xii', 'rn') AS lower_roman,
        to_number('MMXXV', 'RN') AS year_roman,
        to_number('12', 'FM99') AS fm_ignored,
        to_number('  12  ', '999') AS padded_input
    expect: rows
    order: multiset
    comment: the padded input works because to_number skips blanks in the input
