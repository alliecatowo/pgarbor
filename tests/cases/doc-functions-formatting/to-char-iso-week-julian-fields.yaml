# ISO 8601 week-numbering fields, day-of-year and week-of-month, Julian date and quarter, on fixed dates.
id: doc-functions-formatting.to-char-iso-week-julian-fields
title: ISO week, day-of-year, Julian date and quarter fields in to_char
family: doc-functions-formatting
tier: core
feature_ids: [to-char, iso-week, julian-date, quarter, day-of-year]
required_capabilities: [select, timestamp-type, date-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-datetime (ISO 8601 patterns and Julian date)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(date '2006-10-19', 'FMIYYY-IDDD ID FMIW FMWW W Q J DDD') AS iso_and_week_fields,
        to_char(date '2000-12-31', 'FMIYYY FMIW ID FMDDD FMIDDD') AS iso_year_boundary,
        to_char(date '2006-01-01', 'D Dy FMDay DDD FMIDDD') AS sunday_week_fields,
        to_char(date '2020-04-05', 'RM rm FMMONTH FMMonth FMmonth') AS roman_and_names,
        to_char(date '2000-01-01', 'CC') AS century_start,
        to_char(date '2000-12-31', 'CC') AS century_end
    expect: rows
    order: multiset
    comment: 2000-12-31 is ISO week 52 of ISO year 2000; the 'D' weekday numbers Sunday as 1
