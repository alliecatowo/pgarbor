# Sign placement: MI, PL, SG and S anchor or float differently; PR wraps negatives in angle brackets.
id: doc-functions-formatting.to-char-sign-patterns
title: Sign patterns MI, PL, SG, S and PR in to_char numeric output
family: doc-functions-formatting
tier: core
feature_ids: [to-char, numeric-formatting, sign-patterns, pr-pattern]
required_capabilities: [select, numeric-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting-numeric (sign pattern notes and examples)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(-485, '999S') AS s_trailing,
        to_char(-485, '999MI') AS mi_trailing_neg,
        to_char(485, '999MI') AS mi_trailing_pos,
        to_char(485, 'FM999MI') AS mi_fm_pos,
        to_char(485, 'PL999') AS pl_pos,
        to_char(485, 'SG999') AS sg_pos,
        to_char(-485, 'SG999') AS sg_neg,
        to_char(-485, '9SG99') AS sg_inside,
        to_char(-485, '999PR') AS pr_neg,
        to_char(-12, 'MI9999') AS mi_leading,
        to_char(-12, 'S9999') AS s_leading,
        to_char(-0.1, 'FM9.99') AS fm_neg_fraction
    expect: rows
    order: multiset
    comment: MI, SG and PL are not anchored to the number; S is anchored to it
