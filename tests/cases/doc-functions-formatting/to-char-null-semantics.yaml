# Any NULL argument to a formatting function returns NULL, whether it is the value or the template.
id: doc-functions-formatting.to-char-null-semantics
title: NULL value or NULL template gives NULL from the formatting functions
family: doc-functions-formatting
tier: core
feature_ids: [to-char, to-date, to-timestamp, to-number, null-semantics]
required_capabilities: [select, numeric-type, timestamp-type, date-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-formatting (common calling convention: value and template arguments)"
sessions: [a]
steps:
  - sql: |
      SELECT
        to_char(NULL::int, '999') IS NULL AS null_value_int,
        to_char(125, NULL::text) IS NULL AS null_template_int,
        to_char(NULL::timestamp, 'YYYY') IS NULL AS null_value_ts,
        to_char(NULL::interval, 'HH24') IS NULL AS null_value_interval,
        to_date(NULL::text, 'YYYY') IS NULL AS null_to_date,
        to_timestamp(NULL::text, 'YYYY') IS NULL AS null_to_timestamp,
        to_number(NULL::text, '99') IS NULL AS null_to_number,
        to_number('12', NULL::text) IS NULL AS null_to_number_template
    expect: rows
    order: multiset
    comment: each comparison should be true
