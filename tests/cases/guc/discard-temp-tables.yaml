# DISCARD TEMP drops this session's temporary tables; ON COMMIT DELETE ROWS alone keeps the table.
id: guc.discard-temp-tables
title: DISCARD TEMP removes temporary tables from the catalog
family: guc
tier: core
feature_ids: [guc, discard, temp-tables, catalog-introspection]
required_capabilities: [select, temp-tables, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      CREATE TEMP TABLE reset_test (data text) ON COMMIT DELETE ROWS
    expect: ok
  - sql: |
      SELECT count(*) AS before_discard FROM pg_class WHERE relname = 'reset_test'
    expect: rows
  - sql: |
      DISCARD TEMP
    expect: ok
  - sql: |
      SELECT count(*) AS after_discard FROM pg_class WHERE relname = 'reset_test'
    expect: rows
