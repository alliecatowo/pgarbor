# RESET, SET ... TO DEFAULT and RESET ALL all restore the boot value; values themselves are recorded from PG.
id: guc.reset-restores-default
title: RESET, SET TO DEFAULT and RESET ALL restore the default value
family: guc
tier: core
feature_ids: [guc, reset, set, show]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SELECT current_setting('work_mem') AS boot_value
    expect: rows
  - sql: |
      SET work_mem = '5MB'
    expect: ok
  - sql: |
      RESET work_mem
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_reset
    expect: rows
    comment: must equal boot_value from the first step
  - sql: |
      SET work_mem = '5MB'
    expect: ok
  - sql: |
      SET work_mem TO DEFAULT
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_default
    expect: rows
    comment: must equal boot_value
  - sql: |
      SET work_mem = '5MB'
    expect: ok
  - sql: |
      RESET ALL
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') AS after_reset_all
    expect: rows
    comment: RESET ALL also restores work_mem
