# current_setting() errors on unknown names unless missing_ok is true; after SET the name becomes known.
id: guc.current-setting-missing-ok
title: current_setting() missing_ok argument and NULL result for unknown names
family: guc
tier: core
feature_ids: [guc, current-setting, errors, null-handling]
required_capabilities: [select, errors, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SELECT current_setting('nosuch.setting')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT current_setting('nosuch.setting', false)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT current_setting('nosuch.setting', true) IS NULL AS is_null
    expect: rows
    comment: missing_ok true returns NULL
  - sql: |
      SET nosuch.setting = 'nada'
    expect: ok
  - sql: |
      SELECT current_setting('nosuch.setting') AS v1, current_setting('nosuch.setting', false) AS v2, current_setting('nosuch.setting', true) AS v3
    expect: rows
    comment: all three forms yield 'nada'
