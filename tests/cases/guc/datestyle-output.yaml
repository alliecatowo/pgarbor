# DateStyle changes date text output; RESET restores the boot style. Dates avoid TimeZone dependence.
id: guc.datestyle-output
title: DateStyle changes date output format and RESET restores it
family: guc
tier: core
feature_ids: [guc, datestyle, date, reset, show]
required_capabilities: [select, date, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'ISO, YMD'
    expect: ok
  - sql: |
      SELECT '2006-08-13'::date::text AS iso_ymd
    expect: rows
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      SELECT '2006-08-13'::date::text AS sql_dmy
    expect: rows
  - sql: |
      SET DateStyle = 'German'
    expect: ok
  - sql: |
      SELECT '2006-08-13'::date::text AS german
    expect: rows
  - sql: |
      SHOW DateStyle
    expect: rows
  - sql: |
      RESET DateStyle
    expect: ok
  - sql: |
      SELECT '2006-08-13'::date::text AS after_reset
    expect: rows
