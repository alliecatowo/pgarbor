# A session-level SET inside a transaction is undone by ROLLBACK.
id: guc.set-rollback-reverts
title: SET inside a transaction is reverted by ROLLBACK
family: guc
tier: core
feature_ids: [guc, set, transactions, show]
required_capabilities: [select, transactions, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SET work_mem = '3MB'
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET work_mem = '6MB'
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    comment: must be the pre-transaction 3MB value
