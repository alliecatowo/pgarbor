# Dotted custom placeholder parameters: unknown until first SET, empty (not unknown) after RESET.
id: guc.custom-placeholder
title: Custom dotted parameters are unknown until set and empty after RESET
family: guc
tier: core
feature_ids: [guc, custom-parameters, set, reset, errors]
required_capabilities: [select, errors, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SHOW custom.my_guc
    expect: error
    sqlstate: "42704"
    comment: not known yet
  - sql: |
      SET custom.my_guc = 42
    expect: ok
  - sql: |
      SHOW custom.my_guc
    expect: rows
  - sql: |
      RESET custom.my_guc
    expect: ok
  - sql: |
      SHOW custom.my_guc
    expect: rows
    comment: empty string, not an error, after RESET
  - sql: |
      SELECT current_setting('custom.my_guc', true) = '' AS is_empty
    expect: rows
  - sql: |
      SET custom.my.qualified.guc = 'foo'
    expect: ok
  - sql: |
      SELECT current_setting('custom.my.qualified.guc') AS qualified
    expect: rows
