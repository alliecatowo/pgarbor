# pg_settings.source follows SET and RESET; pg_settings_get_flags() returns NULL for NULL or unknown names.
id: guc.settings-source-flags
title: pg_settings reflects SET source and pg_settings_get_flags handles NULL and unknown names
family: guc
tier: extended
feature_ids: [guc, pg-settings, set, reset, catalog-introspection, null-handling]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SET work_mem = '5MB'
    expect: ok
  - sql: |
      SELECT name, setting, source FROM pg_settings WHERE name = 'work_mem'
    expect: rows
    comment: source should be 'session'
  - sql: |
      RESET work_mem
    expect: ok
  - sql: |
      SELECT name, source FROM pg_settings WHERE name = 'work_mem'
    expect: rows
    comment: source no longer 'session'
  - sql: |
      SELECT pg_settings_get_flags(NULL) IS NULL AS null_input
    expect: rows
  - sql: |
      SELECT pg_settings_get_flags('does_not_exist') IS NULL AS unknown_name
    expect: rows
