# SET LOCAL outside a transaction block only warns and has no lasting effect.
id: guc.set-local-outside-txn
title: SET LOCAL outside a transaction block is a no-op with a warning
family: guc
tier: core
feature_ids: [guc, set, set-local, show]
required_capabilities: [select, transactions, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SET work_mem = '3MB'
    expect: ok
  - sql: |
      SET LOCAL work_mem = '5MB'
    expect: ok
    comment: PG emits WARNING "SET LOCAL can only be used in transaction blocks"; not an error
  - sql: |
      SHOW work_mem
    expect: rows
    comment: must equal the value set by the plain SET above
