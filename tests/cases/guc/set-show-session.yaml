# SET changes a session parameter visible to SHOW and current_setting(); value is canonicalized by PG.
id: guc.set-show-session
title: SET then SHOW and current_setting() reflect the session value
family: guc
tier: slice
feature_ids: [guc, set, show, current-setting]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SET work_mem = '3MB'
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
  - sql: |
      SELECT current_setting('work_mem') = '3MB' AS same_as_show
    expect: rows
    comment: value canonicalization is recorded from PG, only the boolean is asserted here
