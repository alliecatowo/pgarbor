# SET LOCAL lasts until transaction end; after COMMIT the previous session value is back.
id: guc.set-local-commit-revert
title: SET LOCAL is visible inside the transaction and reverts at COMMIT
family: guc
tier: core
feature_ids: [guc, set-local, transactions, show]
required_capabilities: [select, transactions, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      SET work_mem = '3MB'
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL work_mem = '5MB'
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    comment: back to the 3MB session value
