# Within one transaction, SET followed by SET LOCAL: the SET LOCAL wins until commit, then the plain SET value remains.
id: guc.set-then-set-local
title: SET followed by SET LOCAL in one transaction keeps the SET value after COMMIT
family: guc
tier: core
feature_ids: [guc, set, set-local, transactions, show]
required_capabilities: [select, transactions, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET work_mem = '5MB'
    expect: ok
  - sql: |
      SET LOCAL work_mem = '6MB'
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    comment: SET LOCAL value visible in the transaction
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SHOW work_mem
    expect: rows
    comment: the plain SET value (5MB) survives commit
