# A failing SET inside a transaction block puts it in the aborted state (25P02) until ROLLBACK.
id: guc.invalid-value-aborts-txn
title: Failing SET aborts the transaction block; later statements fail with 25P02
family: guc
tier: core
feature_ids: [guc, set, errors, transactions]
required_capabilities: [select, errors, transactions]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/guc.sql
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET work_mem = 'abc'
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT 1 AS usable_again
    expect: rows
