# DROP ROUTINE foo(integer) works whether foo is a function, a procedure, or an aggregate.
id: cmd-drop-routine.docs-example-integer-any-kind
title: "DROP ROUTINE foo(integer) drops a function, a procedure, or an aggregate"
family: cmd-drop-routine
tier: core
feature_ids: [drop-routine, drop-function, drop-procedure, drop-aggregate]
required_capabilities: [create-function, create-procedure, create-aggregate, drop-aggregate, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_routine.sgml#sql-droproutine-examples (DROP ROUTINE foo(integer))"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION foo(integer) RETURNS int LANGUAGE sql AS 'SELECT $1'
    expect: ok
  - sql: |
      DROP ROUTINE foo(integer)
    expect: ok
    comment: the function is removed without knowing its kind
  - sql: |
      CREATE PROCEDURE foo(integer) LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      DROP ROUTINE foo(integer)
    expect: ok
  - sql: |
      CREATE AGGREGATE foo(integer) (SFUNC = int4pl, STYPE = int4)
    expect: ok
  - sql: |
      DROP ROUTINE foo(integer)
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_proc WHERE proname = 'foo'
    expect: rows
    order: multiset
