# A non-owner cannot drop a routine; this needs a second non-superuser role, which is cluster-global state.
id: cmd-drop-routine.owner-required-quarantined
title: "DROP ROUTINE by a non-owner role is rejected with insufficient privilege"
family: cmd-drop-routine
tier: core
feature_ids: [drop-routine, privileges, ownership]
required_capabilities: [create-function, create-role, privileges, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure-description (owner)"
sessions: [a]
quarantine:
  reason: "needs a non-superuser role; roles are cluster-global and this harness runs each case in an isolated database"
  since: "2026-10-15"
steps:
  - sql: |
      CREATE FUNCTION oq_f(integer) RETURNS int LANGUAGE sql AS 'SELECT $1'
    expect: ok
  - sql: |
      DROP ROUTINE oq_f(integer)
    expect: ok
