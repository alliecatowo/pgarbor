# ORDER BY position must refer to an existing output column of the set operation.
id: doc-queries-union.order-by-position-error
title: ORDER BY position beyond the UNION output columns is rejected
family: doc-queries-union
tier: core
feature_ids: [union, order-by, set-operations, errors]
required_capabilities: [select, union, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 UNION SELECT 2 ORDER BY 3
    expect: error
    sqlstate: "42P10"
