# Corresponding columns must have compatible types; integer and text cannot be combined.
id: doc-queries-union.type-mismatch-error
title: UNION of integer and text columns is rejected
family: doc-queries-union
tier: core
feature_ids: [union, set-operations, union-compatibility, errors]
required_capabilities: [select, union]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 UNION SELECT 'a'::text
    expect: error
    sqlstate: "42804"
