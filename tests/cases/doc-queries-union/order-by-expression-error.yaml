# ORDER BY on a set-operation result may only name output columns, not expressions.
id: doc-queries-union.order-by-expression-error
title: ORDER BY expression on a UNION result is rejected
family: doc-queries-union
tier: core
feature_ids: [union, order-by, set-operations, errors]
required_capabilities: [select, union, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS a UNION SELECT 2 ORDER BY a + 1
    expect: error
    sqlstate: "0A000"
    comment: "only result column names can be used, not expressions"
