# UNION appends query2 to query1 and eliminates duplicate rows, like DISTINCT (unless UNION ALL).
id: doc-queries-union.union-removes-duplicates
title: UNION eliminates duplicate rows like DISTINCT
family: doc-queries-union
tier: core
feature_ids: [union, set-operations, distinct]
required_capabilities: [select, union]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS n UNION SELECT 2 UNION SELECT 1 UNION SELECT 3 UNION SELECT 2
    expect: rows
    order: multiset
    comment: "each distinct value appears exactly once"
  - sql: |
      SELECT x FROM (VALUES ('a'), ('b'), ('a')) AS v(x) UNION SELECT x FROM (VALUES ('b'), ('c')) AS w(x)
    expect: rows
    order: multiset
