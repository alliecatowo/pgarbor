# Set-operation inputs must be union compatible: same number of columns.
id: doc-queries-union.column-count-error
title: UNION inputs with different column counts are rejected
family: doc-queries-union
tier: core
feature_ids: [union, set-operations, union-compatibility, errors]
required_capabilities: [select, union]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 UNION SELECT 1, 2
    expect: error
    sqlstate: "42601"
