# VALUES lists can be set-operation inputs; the result is sorted by the output column number.
id: doc-queries-union.values-union
title: VALUES lists combined with UNION and sorted by position
family: doc-queries-union
tier: core
feature_ids: [values, union, order-by, set-operations]
required_capabilities: [select, union, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      VALUES (1), (2) UNION VALUES (2), (3) ORDER BY 1
    expect: rows
    order: ordered
