# Set operations (other than UNION ALL) compare NULLs as not-distinct: two NULLs are duplicates.
id: doc-queries-union.null-equality-in-set-ops
title: NULLs are treated as equal by UNION, INTERSECT and EXCEPT
family: doc-queries-union
tier: core
feature_ids: [union, intersect, except, nulls, set-operations]
required_capabilities: [select, union, intersect, except]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT NULL::int AS n UNION SELECT NULL::int
    expect: rows
    order: multiset
    comment: "one NULL row"
  - sql: |
      SELECT NULL::int AS n UNION ALL SELECT NULL::int
    expect: rows
    order: multiset
    comment: "two NULL rows"
  - sql: |
      SELECT x FROM (VALUES (NULL::int), (1)) AS v(x) INTERSECT SELECT y FROM (VALUES (NULL::int), (2)) AS w(y)
    expect: rows
    order: multiset
    comment: "NULL matches NULL: {NULL}"
  - sql: |
      SELECT x FROM (VALUES (1), (NULL::int), (NULL::int)) AS v(x) EXCEPT SELECT y FROM (VALUES (NULL::int)) AS w(y)
    expect: rows
    order: multiset
    comment: "EXCEPT: {1}"
