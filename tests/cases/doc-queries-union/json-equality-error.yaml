# UNION needs equality to remove duplicates; json has no equality operator, so plain UNION fails
# while UNION ALL, which does not deduplicate, succeeds.
id: doc-queries-union.json-equality-error
title: UNION over json fails for lack of equality, UNION ALL succeeds
family: doc-queries-union
tier: extended
feature_ids: [union, union-all, json, set-operations, errors]
required_capabilities: [select, union, json]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT '{}'::json UNION SELECT '{}'::json
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT '{}'::json UNION ALL SELECT '{}'::json
    expect: rows
    order: multiset
