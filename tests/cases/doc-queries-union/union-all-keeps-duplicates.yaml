# UNION ALL skips duplicate elimination, so every input row is returned.
id: doc-queries-union.union-all-keeps-duplicates
title: UNION ALL keeps duplicate rows from both inputs
family: doc-queries-union
tier: core
feature_ids: [union-all, set-operations]
required_capabilities: [select, union]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS n UNION ALL SELECT 2 UNION ALL SELECT 1 UNION ALL SELECT 2
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) AS c FROM (SELECT 7 UNION ALL SELECT 7) AS s
    expect: rows
    order: multiset
    comment: "two identical rows survive"
