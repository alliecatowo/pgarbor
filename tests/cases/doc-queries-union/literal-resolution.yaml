# Set-operation result types follow the UNION type-resolution rules: 1 and 2.5 combine to numeric;
# an unknown-type literal takes the type of the other input, so 'x' fails to convert to integer.
id: doc-queries-union.literal-resolution
title: UNION type resolution for numeric and unknown-type literals
family: doc-queries-union
tier: extended
feature_ids: [union, type-resolution, set-operations]
required_capabilities: [select, union]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 UNION SELECT 2.5
    expect: rows
    order: multiset
    comment: "integer and numeric combine to numeric: values 1 and 2.5"
  - sql: |
      SELECT 'x' UNION SELECT 1
    expect: error
    sqlstate: "22P02"
    comment: "unknown literal resolves to integer from the other input"
