# EXCEPT returns rows of query1 not in query2 with duplicates eliminated; EXCEPT ALL subtracts
# multiplicities.
id: doc-queries-union.except-multiset
title: EXCEPT and EXCEPT ALL multiplicity semantics
family: doc-queries-union
tier: core
feature_ids: [except, except-all, set-operations]
required_capabilities: [select, except]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT x FROM (VALUES (1), (1), (1), (2), (3)) AS v(x) EXCEPT SELECT y FROM (VALUES (1), (3), (4)) AS w(y)
    expect: rows
    order: multiset
    comment: "EXCEPT: {2}"
  - sql: |
      SELECT x FROM (VALUES (1), (1), (1), (2), (3)) AS v(x) EXCEPT ALL SELECT y FROM (VALUES (1), (3), (4)) AS w(y)
    expect: rows
    order: multiset
    comment: "EXCEPT ALL: {1,1,2}"
