# INTERSECT returns rows present in both inputs with duplicates eliminated; INTERSECT ALL keeps
# the minimum multiplicity of each row.
id: doc-queries-union.intersect-multiset
title: INTERSECT and INTERSECT ALL multiplicity semantics
family: doc-queries-union
tier: core
feature_ids: [intersect, intersect-all, set-operations]
required_capabilities: [select, intersect]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT x FROM (VALUES (1), (1), (1), (2)) AS v(x) INTERSECT SELECT y FROM (VALUES (1), (1), (2), (2)) AS w(y)
    expect: rows
    order: multiset
    comment: "INTERSECT: {1,2}, duplicates eliminated"
  - sql: |
      SELECT x FROM (VALUES (1), (1), (1), (2)) AS v(x) INTERSECT ALL SELECT y FROM (VALUES (1), (1), (2), (2)) AS w(y)
    expect: rows
    order: multiset
    comment: "INTERSECT ALL: {1,1,2}, minimum multiplicity"
  - sql: |
      SELECT 1 INTERSECT SELECT 1 INTERSECT SELECT 2
    expect: rows
    order: multiset
    comment: "left-to-right chain; result is empty"
