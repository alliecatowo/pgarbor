# ORDER BY cannot appear inside an unparenthesized set-operation input; it would need parentheses.
id: doc-queries-union.order-by-before-union-syntax-error
title: ORDER BY before UNION without parentheses is a syntax error
family: doc-queries-union
tier: core
feature_ids: [union, order-by, set-operations, syntax-errors]
required_capabilities: [select, union, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT x FROM (VALUES (1), (2), (3)) AS v(x) ORDER BY x UNION SELECT 9
    expect: error
    sqlstate: "42601"
    comment: "the documented fix is to parenthesize the first input"
