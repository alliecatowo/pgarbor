# INTERSECT binds more tightly than UNION and EXCEPT, which associate left to right; parentheses
# override both.
id: doc-queries-union.set-op-precedence
title: INTERSECT binds tighter than UNION and EXCEPT, which associate left to right
family: doc-queries-union
tier: core
feature_ids: [union, intersect, except, set-operations, precedence]
required_capabilities: [select, union, intersect, except]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT 1 UNION SELECT 2 INTERSECT SELECT 2
    expect: rows
    order: multiset
    comment: "means 1 UNION (2 INTERSECT 2) = {1,2}"
  - sql: |
      (SELECT 1 UNION SELECT 2) INTERSECT SELECT 2
    expect: rows
    order: multiset
    comment: "parenthesized: {2}"
  - sql: |
      SELECT 1 EXCEPT SELECT 1 UNION SELECT 2
    expect: rows
    order: multiset
    comment: "left-to-right: (1 EXCEPT 1) UNION 2 = {2}"
