# ORDER BY on a set-operation result may name output columns by label or position; the label comes
# from the first query. NULLS FIRST/LAST apply per sort column.
id: doc-queries-union.order-by-output-columns
title: ORDER BY on a UNION result uses output column labels or positions
family: doc-queries-union
tier: core
feature_ids: [union, order-by, nulls-ordering, set-operations]
required_capabilities: [select, union, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/queries.sgml#queries-union"
sessions: [a]
steps:
  - sql: |
      SELECT x AS v, 'p' AS tag FROM (VALUES (3), (NULL::int), (1)) AS t(x) UNION SELECT 2, 'q' ORDER BY v NULLS LAST, tag
    expect: rows
    order: ordered
    comment: "sorted by output label v; NULL last"
  - sql: |
      SELECT x AS v, 'p' AS tag FROM (VALUES (3), (NULL::int), (1)) AS t(x) UNION SELECT 2, 'q' ORDER BY 1 DESC NULLS FIRST
    expect: rows
    order: ordered
    comment: "sorted by position 1 descending; NULL first"
