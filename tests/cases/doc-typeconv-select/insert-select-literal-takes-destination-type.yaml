# In INSERT ... SELECT, an unspecified-type literal takes its type from the destination column.
id: doc-typeconv-select.insert-select-literal-takes-destination-type
title: INSERT ... SELECT literal takes the destination column type
family: doc-typeconv-select
tier: core
feature_ids: [insert, insert-select, type-resolution]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (destination column in INSERT ... SELECT)"
sessions: [a]
setup: |
  CREATE TABLE t (i int4, v text)
steps:
  - sql: |
      INSERT INTO t SELECT '42', 'z'
    expect: ok
  - sql: |
      SELECT i, pg_typeof(i) AS ti, v FROM t
    expect: rows
    order: ordered
