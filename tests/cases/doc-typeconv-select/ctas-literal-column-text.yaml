# CREATE TABLE AS takes column types from the SELECT output list, so a literal column becomes text.
id: doc-typeconv-select.ctas-literal-column-text
title: CREATE TABLE AS with literal output column yields a text column
family: doc-typeconv-select
tier: core
feature_ids: [select, type-resolution, create-table-as]
required_capabilities: [create-table, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (simple output columns); sql-createtableas.html"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ct AS SELECT 'abc' AS c, NULL::int4 AS n
    expect: ok
  - sql: |
      SELECT pg_typeof(c) AS tc, c FROM ct
    expect: rows
    order: multiset
