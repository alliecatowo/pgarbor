# An unspecified-type literal as a simple output column of SELECT resolves to text.
id: doc-typeconv-select.literal-output-text
title: Unknown-type string literal in SELECT output list resolves to text
family: doc-typeconv-select
tier: core
feature_ids: [select, type-resolution, unknown-literal]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (SELECT Output Columns, 'Hello World' example)"
sessions: [a]
steps:
  - sql: |
      SELECT 'Hello World'
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_typeof(x) AS t, x FROM (SELECT 'Hello World' AS x) s
    expect: rows
    order: multiset
    comment: the literal is resolved to text in the subselect's output column
