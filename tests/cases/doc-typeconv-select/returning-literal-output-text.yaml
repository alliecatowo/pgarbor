# RETURNING lists are treated like SELECT output lists, so an unspecified-type literal there is text.
id: doc-typeconv-select.returning-literal-output-text
title: RETURNING literal output column resolves to text
family: doc-typeconv-select
tier: core
feature_ids: [returning, type-resolution, insert, update]
required_capabilities: [create-table, insert, update, returning, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (RETURNING lists treated as SELECT output lists)"
sessions: [a]
setup: |
  CREATE TABLE t (i int4, v text);
  INSERT INTO t VALUES (1, 'a')
steps:
  - sql: |
      WITH ins AS (INSERT INTO t VALUES (3, 'q') RETURNING 'x' AS r) SELECT pg_typeof(r) AS t, r FROM ins
    expect: rows
    order: multiset
  - sql: |
      UPDATE t SET i = i + 10 WHERE i = 1 RETURNING 'u' AS u, i
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO t VALUES (4, 'w') RETURNING 'u' AS u, i
    expect: rows
    order: multiset
