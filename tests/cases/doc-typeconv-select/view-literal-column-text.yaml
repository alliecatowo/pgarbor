# A view's column types come from its SELECT output list, so a literal column is text.
id: doc-typeconv-select.view-literal-column-text
title: View over a literal output column exposes a text column
family: doc-typeconv-select
tier: core
feature_ids: [select, type-resolution, views]
required_capabilities: [create-view, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (simple output columns)"
sessions: [a]
steps:
  - sql: |
      CREATE VIEW lit_v AS SELECT 'abc' AS c
    expect: ok
  - sql: |
      SELECT pg_typeof(c) AS t, c FROM lit_v
    expect: rows
    order: multiset
