# The text fallback applies only to simple output columns; a literal used as a function argument stays unknown.
id: doc-typeconv-select.literal-function-argument-unknown
title: Unknown-type literal as function argument is not resolved to text
family: doc-typeconv-select
tier: core
feature_ids: [select, type-resolution, unknown-literal]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (only simple output columns fall back to text)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_typeof('Hello World') AS t
    expect: rows
    order: multiset
    comment: the argument of pg_typeof is not an output column, so its type stays unknown
