# A destination-typed literal that cannot be parsed raises invalid_text_representation and inserts nothing.
id: doc-typeconv-select.insert-select-literal-unparseable-error
title: INSERT ... SELECT literal not valid for destination integer raises 22P02
family: doc-typeconv-select
tier: core
feature_ids: [insert, insert-select, type-resolution, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select; errcodes 22P02"
sessions: [a]
setup: |
  CREATE TABLE t (i int4, v text)
steps:
  - sql: |
      INSERT INTO t SELECT 'abc', 'z'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: multiset
    comment: the failed statement left no row behind
