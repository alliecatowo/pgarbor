# INTERSECT and EXCEPT follow the same UNION-arm rule for unspecified-type literals.
id: doc-typeconv-select.intersect-except-literal-arms
title: INTERSECT and EXCEPT apply UNION-arm type resolution to literals
family: doc-typeconv-select
tier: core
feature_ids: [union, intersect, except, type-resolution]
required_capabilities: [union, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (UNION, INTERSECT or EXCEPT arm)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a' INTERSECT SELECT 'a'
    expect: rows
    order: multiset
  - sql: |
      SELECT 'a' EXCEPT SELECT 'b'
    expect: rows
    order: multiset
  - sql: |
      SELECT 'x' INTERSECT SELECT 1
    expect: error
    sqlstate: "22P02"
