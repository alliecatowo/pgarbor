# When every arm of a UNION is an unspecified-type literal, the UNION-arm resolution gives text.
id: doc-typeconv-select.union-unknown-arms-text
title: UNION of unknown-type literals resolves to text
family: doc-typeconv-select
tier: core
feature_ids: [union, type-resolution, unknown-literal]
required_capabilities: [union, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (UNION arm exception)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a' UNION SELECT 'b'
    expect: rows
    order: multiset
  - sql: |
      SELECT NULL UNION SELECT 'x'
    expect: rows
    order: multiset
    comment: NULL and literal arms both unknown; NULL row is returned as SQL NULL
