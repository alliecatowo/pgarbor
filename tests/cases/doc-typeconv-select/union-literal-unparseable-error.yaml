# The literal arm is coerced to the other arm's type, so a non-integer string raises invalid_text_representation.
id: doc-typeconv-select.union-literal-unparseable-error
title: UNION literal that cannot parse as the other arm's type raises 22P02
family: doc-typeconv-select
tier: core
feature_ids: [union, type-resolution, errors]
required_capabilities: [union, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (type taken from the other UNION arm); errcodes 22P02"
sessions: [a]
steps:
  - sql: |
      SELECT 1 UNION SELECT 'x'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'a' UNION SELECT 1
    expect: error
    sqlstate: "22P02"
    comment: the literal on the left is the one that fails to parse as integer
  - sql: |
      SELECT 1 UNION SELECT '2'
    expect: rows
    order: multiset
    comment: a parseable literal coerces cleanly
