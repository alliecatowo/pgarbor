# NULL is an unspecified-type literal; as a simple output column of a SELECT it resolves to text.
id: doc-typeconv-select.null-output-text
title: NULL output column of a subselect resolves to text
family: doc-typeconv-select
tier: core
feature_ids: [select, type-resolution, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (unspecified-type literals in output columns)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_typeof(n) AS t, n IS NULL AS is_null FROM (SELECT NULL AS n) s
    expect: rows
    order: multiset
