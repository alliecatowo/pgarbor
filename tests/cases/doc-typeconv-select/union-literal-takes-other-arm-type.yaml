# The type of an unspecified-type literal in a UNION arm is taken from the other arm.
id: doc-typeconv-select.union-literal-takes-other-arm-type
title: UNION literal arm takes the integer type of the other arm
family: doc-typeconv-select
tier: core
feature_ids: [union, type-resolution, unknown-literal]
required_capabilities: [union, select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (type taken from the other UNION arm)"
sessions: [a]
steps:
  - sql: |
      SELECT '2' UNION SELECT 1 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(x) AS t FROM (SELECT 1 AS x UNION SELECT '2') u
    expect: rows
    order: multiset
    comment: the integer arm fixes the literal arm to integer
