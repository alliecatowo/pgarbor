# A string literal in a CTE select list is an output column of a SELECT, so it resolves to text.
id: doc-typeconv-select.cte-literal-column-text
title: String literal in a WITH clause output column resolves to text
family: doc-typeconv-select
tier: core
feature_ids: [select, type-resolution, cte]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "postgres-18 typeconv.sgml#typeconv-select (simple output columns)"
sessions: [a]
steps:
  - sql: |
      WITH c AS (SELECT 'q' AS v) SELECT pg_typeof(v) AS t, v FROM c
    expect: rows
    order: multiset
