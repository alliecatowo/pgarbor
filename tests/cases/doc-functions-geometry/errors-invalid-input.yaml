# Malformed or out-of-range geometric literals fail with invalid text representation or numeric range errors.
id: doc-functions-geometry.errors-invalid-input
title: Malformed geometric literals and out-of-range coordinates raise input errors
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, input-syntax, errors]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (geometric type input syntax, circle and box forms)"
sessions: [a]
steps:
  - sql: |
      SELECT circle '<(0,0),-1>'
    expect: error
    sqlstate: "22P02"
    comment: a circle radius must not be negative
  - sql: |
      SELECT box '(1,1)'
    expect: error
    sqlstate: "22P02"
    comment: a box needs two corner points
  - sql: |
      SELECT point '(1,2'
    expect: error
    sqlstate: "22P02"
    comment: unterminated point literal
  - sql: |
      SELECT path '((0,0),(1,1)'
    expect: error
    sqlstate: "22P02"
    comment: unbalanced path parentheses
  - sql: |
      SELECT lseg '[(0,0)]'
    expect: error
    sqlstate: "22P02"
    comment: a segment needs two endpoints
  - sql: |
      SELECT point '(1e400,0)'
    expect: error
    sqlstate: "22003"
    comment: coordinate out of range for double precision
