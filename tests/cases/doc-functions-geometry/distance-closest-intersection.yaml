# Distance between objects, closest point on an object, and intersection points or boxes.
id: doc-functions-geometry.distance-closest-intersection
title: Distance, closest point, and intersection operators between geometric objects
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, distance, closest-point, intersection]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Operators table, <->, ##, # rows)"
sessions: [a]
steps:
  - sql: |
      SELECT circle '<(0,0),1>' <-> circle '<(5,0),1>' AS circ_dist,
             point '(0,0)' <-> box '(1,1),(2,2)' AS pt_box_dist,
             lseg '[(0,0),(1,0)]' <-> lseg '[(0,1),(1,1)]' AS parallel_seg_dist
    expect: rows
    order: multiset
    comment: documented circle example is 3; parallel segments one unit apart are distance 1
  - sql: |
      SELECT point '(0,0)' <-> polygon '((1,0),(1,1),(2,0))' AS pt_poly_dist,
             polygon '((0,0),(1,0),(0,1))' <-> circle '<(5,0),1>' AS poly_circ_dist
    expect: rows
    order: multiset
    comment: distance from a point to a polygon edge is 1
  - sql: |
      SELECT point '(0,0)' ## lseg '[(2,0),(0,2)]' AS closest_on_seg,
             point '(0,0)' ## box '(1,1),(2,2)' AS closest_on_box
    expect: rows
    order: multiset
    comment: documented closest point (1,1); closest point on a box is its corner (1,1)
  - sql: |
      SELECT box '(2,2),(-1,-1)' # box '(1,1),(-2,-2)' AS box_overlap_region,
             box '(0,0),(1,1)' # box '(5,5),(6,6)' AS no_overlap
    expect: rows
    order: multiset
    comment: documented intersection (1,1),(-1,-1); disjoint boxes give NULL
  - sql: |
      SELECT lseg '[(0,0),(2,2)]' # lseg '[(0,2),(2,0)]' AS seg_cross_point,
             lseg '[(0,0),(2,2)]' # lseg '[(0,1),(2,3)]' AS parallel_point
    expect: rows
    order: multiset
    comment: crossing point (1,1); parallel segments give NULL
