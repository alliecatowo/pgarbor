# Operations that are well formed but undefined for their operands raise documented errors, and some return NULL.
id: doc-functions-geometry.errors-operation-failures
title: Geometric operations with undefined results raise documented errors
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, errors, polygon, line, path]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (conversion and operator rows, error conditions)"
sessions: [a]
steps:
  - sql: |
      SELECT polygon(1, circle '<(0,0),1>')
    expect: error
    sqlstate: "22023"
    comment: polygon conversion needs at least 2 points
  - sql: |
      SELECT polygon(4, circle '<(0,0),0>')
    expect: error
    sqlstate: "0A000"
    comment: a zero-radius circle cannot become a polygon
  - sql: |
      SELECT line(point '(1,1)', point '(1,1)')
    expect: error
    sqlstate: "22023"
    comment: a line needs two distinct points
  - sql: |
      SELECT point(1e308, 0) * point(1e308, 0)
    expect: error
    sqlstate: "22003"
    comment: complex multiplication overflows double precision
  - sql: |
      SELECT (path '[(0,0),(1,1)]')[0]
    expect: error
    sqlstate: "42804"
    comment: path values do not support subscripting
  - sql: |
      SELECT area(path '[(0,0),(1,1),(2,0)]') AS open_area
    expect: rows
    order: multiset
    comment: area of an open path is NULL and not an error
