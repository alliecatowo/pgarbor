# Open and closed path forms: predicates, conversions, and NULL area for open paths.
id: doc-functions-geometry.open-closed-path
title: Open and closed path predicates, form conversion, and area of open paths
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, path, open-path, closed-path]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Functions table, isclosed/isopen/pclose/popen/area rows)"
sessions: [a]
steps:
  - sql: |
      SELECT isclosed(path '((0,0),(1,1),(2,0))') AS closed_yes,
             isopen(path '[(0,0),(1,1),(2,0)]') AS open_yes,
             isopen(path '((0,0),(1,1),(2,0))') AS closed_not_open,
             isclosed(path '[(0,0),(1,1),(2,0)]') AS open_not_closed
    expect: rows
    order: multiset
    comment: documented examples are true; the opposite forms are false
  - sql: |
      SELECT pclose(path '[(0,0),(1,1),(2,0)]') AS closed_form,
             popen(path '((0,0),(1,1),(2,0))') AS open_form
    expect: rows
    order: multiset
    comment: pclose and popen change only the bracket form, not the points
  - sql: |
      SELECT area(path '[(0,0),(1,1),(2,0)]') IS NULL AS open_area_is_null,
             area(path '((0,0),(1,1),(2,0))') AS closed_area
    expect: rows
    order: multiset
    comment: documented rule that area of an open path is NULL, closed path area is 1
  - sql: |
      SELECT pclose(popen(path '((0,0),(1,1),(2,0))')) = path '((0,0),(1,1),(2,0))' AS roundtrip
    expect: rows
    order: multiset
    comment: converting to open and back yields the same closed path
