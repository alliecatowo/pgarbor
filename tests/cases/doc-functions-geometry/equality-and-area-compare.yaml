# The scalar = compares area for circles and boxes, while ~= tests the same object.
id: doc-functions-geometry.equality-and-area-compare
title: Scalar equality compares area while approximate same-object operator compares shape
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, equality, circle, box]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (paragraph after Geometric Operators table on = and ~=)"
sessions: [a]
steps:
  - sql: |
      SELECT circle '<(0,0),1>' = circle '<(5,5),1>' AS same_area,
             circle '<(0,0),1>' ~= circle '<(5,5),1>' AS same_object,
             circle '<(0,0),1>' ~= circle '<(0,0),1>' AS identical
    expect: rows
    order: multiset
    comment: documented = compares equal areas only; ~= is false for different centers
  - sql: |
      SELECT box '(1,1),(0,0)' = box '(0,1),(1,0)' AS box_same_area,
             box '(2,2),(0,0)' = box '(1,1),(0,0)' AS box_bigger,
             box '(1,1),(0,0)' ~= box '(0,1),(1,0)' AS box_same_obj
    expect: rows
    order: multiset
    comment: boxes with identical corner set in any order are equal by area and by value
  - sql: |
      SELECT polygon '((0,0),(1,1))' ~= polygon '((1,1),(0,0))' AS poly_same_obj
    expect: rows
    order: multiset
    comment: documented ~= example returns true for reordered polygon points
