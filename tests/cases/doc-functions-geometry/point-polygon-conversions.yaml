# Point construction and centers, polygon conversions from box, circle, path, and the n-point circle form.
id: doc-functions-geometry.point-polygon-conversions
title: Point constructors and centers, polygon and path conversions from circles and boxes
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, point, polygon, path, conversions]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Type Conversion Functions table, point, polygon and path rows)"
sessions: [a]
steps:
  - sql: |
      SELECT point(23.4, -44.5) AS pt_coords,
             point(box '(1,0),(-1,0)') AS center_box,
             point(circle '<(0,0),2>') AS center_circle,
             point(lseg '[(-1,0),(1,0)]') AS center_lseg,
             point(polygon '((0,0),(1,1),(2,0))') AS center_poly
    expect: rows
    order: multiset
    comment: documented (23.4,-44.5), (0,0), (0,0), (0,0), and mean of polygon points (1,0.3333333333333333)
  - sql: |
      SELECT polygon(box '(1,1),(0,0)') AS poly_from_box,
             path(polygon '((0,0),(1,1),(2,0))') AS path_from_poly,
             polygon(path '((0,0),(1,1),(2,0))') AS poly_from_path
    expect: rows
    order: multiset
    comment: documented polygon ((0,0),(0,1),(1,1),(1,0)) from box and identical point list for path/polygon round trip
  - sql: |
      SELECT npoints(polygon(circle '<(0,0),2>')) AS default_points,
             npoints(polygon(4, circle '<(3,0),1>')) AS four_points
    expect: rows
    order: multiset
    comment: circle to polygon defaults to 12 points, and the explicit n form gives the requested count
  - sql: |
      SELECT polygon(4, circle '<(3,0),1>') AS four_gon
    expect: rows
    order: multiset
    comment: documented four-point polygon around (3,0) radius 1, vertices may show float rounding
  - sql: |
      SELECT polygon(2, circle '<(0,0),1>') AS two_gon
    expect: rows
    order: multiset
    comment: the smallest allowed n is 2
