# Horizontal, vertical, perpendicular and parallel predicates on lines and segments, plus ?# intersection tests.
id: doc-functions-geometry.line-direction-predicates
title: Horizontal, vertical, parallel, perpendicular, and intersects predicates
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, lseg, line, orientation, parallel-predicate, intersects]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Operators table, ?-, ?|, ?-|, ?||, ~=, ?# rows)"
sessions: [a]
steps:
  - sql: |
      SELECT ?- lseg '[(-1,0),(1,0)]' AS seg_horizontal,
             ?| lseg '[(-1,0),(1,0)]' AS seg_vertical,
             point '(1,0)' ?- point '(0,0)' AS same_y,
             point '(0,1)' ?| point '(0,0)' AS same_x,
             point '(1,0)' ?| point '(0,0)' AS not_same_x
    expect: rows
    order: multiset
    comment: documented true, false, true, true, false
  - sql: |
      SELECT lseg '[(0,0),(0,1)]' ?-| lseg '[(0,0),(1,0)]' AS perpendicular,
             lseg '[(-1,0),(1,0)]' ?|| lseg '[(-1,2),(1,2)]' AS parallel,
             lseg '[(0,0),(2,2)]' ?|| lseg '[(0,1),(2,3)]' AS parallel_offset,
             lseg '[(0,0),(2,2)]' ?-| lseg '[(0,0),(2,-2)]' AS perp_diagonal
    expect: rows
    order: multiset
    comment: documented true for perpendicular and parallel examples; same-slope offset segments are parallel
  - sql: |
      SELECT lseg '[(-1,0),(1,0)]' ?# box '(2,2),(-2,-2)' AS seg_hits_box,
             lseg '[(0,0),(2,2)]' ?# lseg '[(0,2),(2,0)]' AS segs_cross,
             lseg '[(0,0),(2,2)]' ?# lseg '[(0,1),(2,3)]' AS parallel_segs_meet
    expect: rows
    order: multiset
    comment: documented true for the box case; parallel offset segments do not intersect
  - sql: |
      SELECT box '(2,2),(-1,-1)' ?# box '(1,1),(-2,-2)' AS boxes_meet,
             box '(0,0),(1,1)' ?# box '(5,5),(6,6)' AS boxes_apart
    expect: rows
    order: multiset
    comment: box-box intersects is true only when the boxes share a point
  - sql: |
      SELECT point '(1,1)' ?- point '(1,2)' AS horiz_no
    expect: rows
    order: multiset
    comment: points at different heights are not horizontally aligned
