# Translation with + and - on box, point and open path, and path concatenation that is NULL for closed paths.
id: doc-functions-geometry.translation-operators
title: Translate boxes and paths with plus and minus and concatenate open paths
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, translation, path-concatenation]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Operators table, + and - rows)"
sessions: [a]
steps:
  - sql: |
      SELECT box '(1,1),(0,0)' + point '(2,0)' AS plus_box,
             box '(1,1),(0,0)' - point '(2,0)' AS minus_box
    expect: rows
    order: multiset
    comment: documented examples (3,1),(2,0) and (-1,1),(-2,0)
  - sql: |
      SELECT path '[(0,0),(1,1)]' + path '[(2,2),(3,3),(4,4)]' AS concat_open
    expect: rows
    order: multiset
    comment: path + path concatenates two open paths
  - sql: |
      SELECT path '((0,0),(1,1))' + path '[(2,2)]' AS closed_left,
             path '[(0,0),(1,1)]' + path '((2,2),(3,3))' AS closed_right
    expect: rows
    order: multiset
    comment: documented NULL result when either path is closed
  - sql: |
      SELECT path '((0,0),(1,1),(2,0))' + point '(1,1)' AS moved_closed,
             path '[(0,0),(1,1)]' - point '(1,1)' AS moved_open
    expect: rows
    order: multiset
    comment: translation applies to every point of a path regardless of open or closed form
