# Measurement functions for area, center, diagonal, size, length, point count, slope and radius.
id: doc-functions-geometry.measure-functions
title: Area, center, diagonal, size, length, point count, slope and radius
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, area, center, length, slope, radius]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Functions table)"
sessions: [a]
steps:
  - sql: |
      SELECT area(box '(2,2),(0,0)') AS box_area,
             center(box '(1,2),(0,0)') AS box_center,
             diagonal(box '(1,2),(0,0)') AS box_diag,
             height(box '(1,2),(0,0)') AS box_h,
             width(box '(1,2),(0,0)') AS box_w
    expect: rows
    order: multiset
    comment: documented examples 4, (0.5,1), [(1,2),(0,0)], 2, 1
  - sql: |
      SELECT diameter(circle '<(0,0),2>') AS dia,
             radius(circle '<(0,0),2>') AS rad,
             area(circle '<(0,0),1>') AS circ_area
    expect: rows
    order: multiset
    comment: diameter and radius of circles; area of the unit circle is pi
  - sql: |
      SELECT length(path '((-1,0),(1,0))') AS closed_len,
             length(lseg '[(0,0),(3,4)]') AS seg_len,
             @-@ path '[(0,0),(1,0),(1,1)]' AS open_len,
             npoints(path '[(0,0),(1,1),(2,0)]') AS open_n,
             npoints(polygon '((0,0),(1,1),(2,0))') AS poly_n,
             # path '((1,0),(0,1),(-1,0))' AS hash_n
    expect: rows
    order: multiset
    comment: length of a closed path is its perimeter; npoints and # both count points
  - sql: |
      SELECT slope(point '(0,0)', point '(2,1)') AS slope_half,
             slope(point '(0,0)', point '(0,1)') AS vertical_slope
    expect: rows
    order: multiset
    comment: documented slope 0.5; vertical slope is not documented, recorder decides its value
  - sql: |
      SELECT @@ box '(2,2),(0,0)' AS box_center_op,
             @@ circle '<(1,1),3>' AS circle_center_op,
             @@ lseg '[(0,0),(2,4)]' AS lseg_center_op,
             @@ polygon '((0,0),(2,0),(2,2),(0,2))' AS poly_center_op
    expect: rows
    order: multiset
    comment: the @@ operator computes the center point for box, circle, lseg and polygon
