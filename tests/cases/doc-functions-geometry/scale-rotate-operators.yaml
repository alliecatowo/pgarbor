# Multiplication and division by a point treat points as complex numbers; division by the zero point fails.
id: doc-functions-geometry.scale-rotate-operators
title: Scale and rotate geometry with multiplication and division by a point
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, point-arithmetic, scaling, rotation]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Operators table, * and / rows)"
sessions: [a]
steps:
  - sql: |
      SELECT path '((0,0),(1,0),(1,1))' * point '(3.0,0)' AS scaled_by_3,
             path '((0,0),(1,0),(1,1))' / point '(2.0,0)' AS halved
    expect: rows
    order: multiset
    comment: documented examples ((0,0),(3,0),(3,3)) and ((0,0),(0.5,0),(0.5,0.5))
  - sql: |
      SELECT point '(1,2)' * point '(3,4)' AS complex_mul,
             point '(1,2)' / point '(3,4)' AS complex_div,
             point(2,0) * point(0,0) AS mul_zero
    expect: rows
    order: multiset
    comment: standard complex multiplication and division on points
  - sql: |
      SELECT box '(1,1),(0,0)' * point '(0,1)' AS rotated_box
    expect: rows
    order: multiset
    comment: a rotated box only moves its corner points, so sides stay axis parallel
  - sql: |
      SELECT box '(1,1),(0,0)' / point '(0,0)'
    expect: error
    sqlstate: "22012"
    comment: division by the zero point
  - sql: |
      SELECT point '(1,1)' / point '(0,0)'
    expect: error
    sqlstate: "22012"
