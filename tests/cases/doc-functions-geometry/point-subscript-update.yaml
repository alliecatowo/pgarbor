# Geometric values act as arrays: point, box and lseg subscripts read components, and point subscripts can be assigned.
id: doc-functions-geometry.point-subscript-update
title: Point, box and lseg subscripts read components and UPDATE assigns a point coordinate
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, subscripts, point, update]
required_capabilities: [create-table, insert, update, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (text after Geometric Type Conversion Functions table, subscripts)"
sessions: [a]
setup: |
  CREATE TABLE gpt (id int4 PRIMARY KEY, p point, b box, l lseg);
  INSERT INTO gpt VALUES (1, point '(1,2)', box '(4,4),(0,0)', lseg '[(1,2),(3,4)]'), (2, NULL, NULL, NULL);
steps:
  - sql: |
      SELECT id, p[0] AS px, p[1] AS py, b[0] AS b0, b[1] AS b1, l[0] AS l0, l[1] AS l1
      FROM gpt ORDER BY id
    expect: rows
    order: ordered
    comment: documented subscripts 0 and 1 on point, box and lseg; NULL inputs give NULL
  - sql: |
      UPDATE gpt SET p[1] = 9 WHERE id = 1
    expect: ok
    comment: documented way to change the Y coordinate of a point
  - sql: |
      SELECT id, p, p[0] AS px, p[1] AS py FROM gpt ORDER BY id
    expect: rows
    order: ordered
    comment: only the Y coordinate changed to 9
  - sql: |
      SELECT id FROM gpt WHERE p[0] = 1 AND p[1] > 5 ORDER BY id
    expect: rows
    order: ordered
