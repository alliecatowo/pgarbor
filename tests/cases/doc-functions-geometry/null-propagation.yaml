# Geometric operators and functions called with NULL operands return NULL.
id: doc-functions-geometry.null-propagation
title: Geometric operators and functions return NULL for NULL operands
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, null-semantics, operators]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Operators and Functions tables, strict behavior)"
sessions: [a]
steps:
  - sql: |
      SELECT NULL::box + point '(1,1)' AS null_plus,
             area(NULL::box) AS null_area,
             point '(1,1)' <-> NULL::circle AS null_dist,
             NULL::point ~= point '(0,0)' AS null_same,
             NULL::lseg ?|| lseg '[(0,0),(1,1)]' AS null_parallel
    expect: rows
    order: multiset
    comment: each result is NULL
  - sql: |
      SELECT box '(1,1),(0,0)' && NULL::box AS null_overlap,
             NULL::polygon @> point '(0,0)' AS null_contains,
             center(NULL::circle) AS null_center
    expect: rows
    order: multiset
    comment: each result is NULL
