# Box construction from points, polygons and circles, plus bounding box of two boxes.
id: doc-functions-geometry.box-constructors
title: Box constructors normalize corners and compute bounding boxes
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, box, constructors, bound-box]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Type Conversion Functions table, box and bound_box rows)"
sessions: [a]
steps:
  - sql: |
      SELECT box(point '(0,1)', point '(1,0)') AS from_corners,
             box(point '(1,0)') AS from_point
    expect: rows
    order: multiset
    comment: documented (1,1),(0,0) for corners and an empty box (1,0),(1,0) for one point
  - sql: |
      SELECT box(polygon '((0,0),(1,1),(2,0))') AS poly_bbox,
             bound_box(box '(1,1),(0,0)', box '(4,4),(3,3)') AS two_boxes
    expect: rows
    order: multiset
    comment: documented (2,1),(0,0) and (4,4),(0,0)
  - sql: |
      SELECT box(circle '<(0,0),2>') AS inscribed
    expect: rows
    order: multiset
    comment: box inscribed within the circle, coordinates are 2 over root 2
  - sql: |
      SELECT polygon(box '(1,1),(0,0)') AS box_poly,
             point(box '(1,0),(-1,0)') AS box_center,
             lseg(box '(1,0),(-1,0)') AS box_diag
    expect: rows
    order: multiset
    comment: box round trips to polygon and center point, and lseg takes the diagonal
