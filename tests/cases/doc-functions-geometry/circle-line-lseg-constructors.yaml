# Constructors for circle, line and lseg from boxes, points, polygons and radii.
id: doc-functions-geometry.circle-line-lseg-constructors
title: Circle, line and segment constructors from points, boxes and polygons
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, circle, line, lseg, constructors]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Type Conversion Functions table, circle, line and lseg rows)"
sessions: [a]
steps:
  - sql: |
      SELECT circle(box '(1,1),(0,0)') AS circ_from_box,
             circle(point '(0,0)', 2.0) AS circ_from_center
    expect: rows
    order: multiset
    comment: circle enclosing a box has center (0.5,0.5); documented circle(point, radius) gives <(0,0),2>
  - sql: |
      SELECT circle(polygon '((0,0),(1,3),(2,0))') AS circ_from_poly
    expect: rows
    order: multiset
    comment: documented center (1,1), radius is average distance of points from the mean center
  - sql: |
      SELECT line(point '(-1,0)', point '(1,0)') AS line_x_axis,
             lseg(point '(-1,0)', point '(1,0)') AS seg_from_pts,
             lseg(box '(1,0),(-1,0)') AS seg_from_box
    expect: rows
    order: multiset
    comment: documented line {0,-1,0}, segment [(-1,0),(1,0)] and box diagonal [(1,0),(-1,0)] as stored
  - sql: |
      SELECT line(point '(0,0)', point '(1,1)') = line(point '(1,1)', point '(0,0)') AS same_line
    expect: rows
    order: multiset
    comment: the same line through two points regardless of order
