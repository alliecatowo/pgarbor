# Containment, overlap, and strict or non-strict relative-position predicates from the Geometric Operators table.
id: doc-functions-geometry.containment-overlap-predicates
title: Containment, overlap, and relative-position predicates on geometric types
family: doc-functions-geometry
tier: core
feature_ids: [geometric-types, containment, overlap, relative-position]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-geometry (Geometric Operators table, @>, <@, &&, <<, >>, &<, &>, <<|, |>>, &<|, |&>, <^, >^ rows)"
sessions: [a]
steps:
  - sql: |
      SELECT circle '<(0,0),2>' @> point '(1,1)' AS circ_contains_pt,
             point '(1,1)' <@ circle '<(0,0),2>' AS pt_in_circ,
             circle '<(0,0),2>' @> circle '<(0,0),1>' AS circ_contains_circ,
             circle '<(0,0),1>' <@ circle '<(0,0),2>' AS circ_in_circ
    expect: rows
    order: multiset
    comment: documented examples are all true
  - sql: |
      SELECT box '(1,1),(0,0)' && box '(2,2),(0,0)' AS box_overlap,
             box '(1,1),(0,0)' && box '(1,1),(2,2)' AS box_touch,
             polygon '((0,0),(1,1),(2,0))' && polygon '((5,5),(6,6),(7,5))' AS poly_apart,
             circle '<(0,0),1>' && circle '<(1.5,0),1>' AS circ_overlap
    expect: rows
    order: multiset
    comment: one shared point counts as overlap; far-apart polygons do not overlap
  - sql: |
      SELECT circle '<(0,0),1>' << circle '<(5,0),1>' AS left_of,
             circle '<(5,0),1>' >> circle '<(0,0),1>' AS right_of,
             box '(1,1),(0,0)' &< box '(2,2),(0,0)' AS not_right_of,
             box '(3,3),(0,0)' &> box '(2,2),(0,0)' AS not_left_of
    expect: rows
    order: multiset
    comment: documented examples all true
  - sql: |
      SELECT box '(3,3),(0,0)' <<| box '(5,5),(3,4)' AS strictly_below,
             box '(5,5),(3,4)' |>> box '(3,3),(0,0)' AS strictly_above,
             box '(1,1),(0,0)' &<| box '(2,2),(0,0)' AS not_above,
             box '(3,3),(0,0)' |&> box '(2,2),(0,0)' AS not_below
    expect: rows
    order: multiset
    comment: documented examples all true
  - sql: |
      SELECT box '((1,1),(0,0))' <^ box '((2,2),(1,1))' AS below_touch,
             box '((2,2),(1,1))' >^ box '((1,1),(0,0))' AS above_touch,
             point '(1,2)' <<| point '(3,0)' AS pt_below
    expect: rows
    order: multiset
    comment: <^ and >^ allow edges to touch, so the shared edge at y=1 still counts; the point is not below
