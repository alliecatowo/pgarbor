# Range union (+), intersection (*) and difference (-) when the result is a single range.
id: doc-functions-range.union-intersect-difference
title: "Range union, intersection and difference operators with documented examples"
family: doc-functions-range
tier: core
feature_ids: [range-types, range-operators, union, intersection, difference]
required_capabilities: [select, range-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (Range Operators table: +, *, -)"
sessions: [a]
steps:
  - sql: |
      SELECT numrange(5,15) + numrange(10,20) AS union_overlap,
             int8range(5,15) * int8range(10,20) AS intersection,
             int8range(5,15) - int8range(10,20) AS difference
    expect: rows
    order: multiset
    comment: "documented results [5,20), [10,15) and [5,10)"
  - sql: |
      SELECT int4range(1,5) + int4range(5,9) AS union_adjacent,
             int4range(1,5) + int4range(2,3) AS union_contained,
             int4range(1,5) * int4range(7,9) AS intersection_disjoint,
             int4range(1,5) * int4range(3,9) AS intersection_partial
    expect: rows
    order: multiset
    comment: "adjacent ranges merge into one range; disjoint intersection is empty"
  - sql: |
      SELECT int4range(1,10) - int4range(1,3) AS difference_left_trim,
             int4range(1,10) - int4range(8,20) AS difference_right_trim,
             int4range(1,10) - int4range(0,20) AS difference_all
    expect: rows
    order: multiset
    comment: "differences that leave a single range; removing everything yields the empty range"
