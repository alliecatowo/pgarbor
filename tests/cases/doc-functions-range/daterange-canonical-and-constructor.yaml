# Discrete range canonicalization, explicit bound flags in constructors, and inverted bounds.
id: doc-functions-range.daterange-canonical-and-constructor
title: "Discrete ranges canonicalize to [lower, upper) and constructors reject inverted bounds"
family: doc-functions-range
tier: core
feature_ids: [range-types, daterange, canonicalization, constructors, errors]
required_capabilities: [select, range-types, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (range_merge and bound functions); doc/src/sgml/rangetypes.sgml (canonicalization)"
sessions: [a]
steps:
  - sql: |
      SELECT daterange('2000-01-01','2000-01-10','[]') AS inclusive_upper,
             int4range(1,3,'[]') AS int_inclusive_upper,
             '(1,3)'::int4range AS open_pair
    expect: rows
    order: multiset
    comment: "discrete types canonicalize to lower-inclusive, upper-exclusive; inclusive upper becomes exclusive plus one"
  - sql: |
      SELECT upper('[2000-01-01,2000-01-10]'::daterange) AS canonical_upper,
             upper_inc('[2000-01-01,2000-01-10]'::daterange) AS upper_inc_after_canon
    expect: rows
    order: multiset
    comment: "upper bound after canonicalization is 2000-01-11 exclusive"
  - sql: |
      SELECT int4range(3,1) AS inverted
    expect: error
    sqlstate: "22000"
    comment: "lower bound greater than upper bound is rejected"
  - sql: |
      SELECT '[1,)'::int4range @> 1000000000 AS large_element
    expect: rows
    order: multiset
    comment: "unbounded upper contains a large int4 element"
