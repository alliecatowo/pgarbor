# Multirange operators: containment, overlap, position, adjacency, with the documented examples.
id: doc-functions-range.multirange-operators
title: "Multirange containment, overlap and position operators, documented examples"
family: doc-functions-range
tier: core
feature_ids: [multirange-types, range-operators, containment, overlap, position, adjacency]
required_capabilities: [select, range-types, multirange-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (Multirange Operators table)"
sessions: [a]
steps:
  - sql: |
      SELECT '{[2,4)}'::int4multirange @> '{[2,3)}'::int4multirange AS a,
             '{[2,4)}'::int4multirange @> int4range(2,3) AS b,
             '{[2011-01-01,2011-03-01)}'::tsmultirange @> '2011-01-10'::timestamp AS c,
             '[2,4)'::int4range @> '{[2,3)}'::int4multirange AS d,
             '{[2,4)}'::int4multirange <@ '{[1,7)}'::int4multirange AS e,
             '{[2,4)}'::int4multirange <@ int4range(1,7) AS f,
             int4range(2,4) <@ '{[1,7)}'::int4multirange AS g,
             4 <@ '{[1,7)}'::int4multirange AS h
    expect: rows
    order: multiset
    comment: "documented containment examples, all true"
  - sql: |
      SELECT '{[3,7)}'::int8multirange && '{[4,12)}'::int8multirange AS a,
             '{[3,7)}'::int8multirange && int8range(4,12) AS b,
             int8range(3,7) && '{[4,12)}'::int8multirange AS c
    expect: rows
    order: multiset
    comment: "documented overlap examples, all true"
  - sql: |
      SELECT '{[1,10)}'::int8multirange << '{[100,110)}'::int8multirange AS a,
             '{[1,10)}'::int8multirange << int8range(100,110) AS b,
             int8range(1,10) << '{[100,110)}'::int8multirange AS c,
             '{[50,60)}'::int8multirange >> '{[20,30)}'::int8multirange AS d,
             '{[50,60)}'::int8multirange >> int8range(20,30) AS e,
             int8range(50,60) >> '{[20,30)}'::int8multirange AS f
    expect: rows
    order: multiset
    comment: "documented strictly-left/right examples, all true"
  - sql: |
      SELECT '{[1,20)}'::int8multirange &< '{[18,20)}'::int8multirange AS a,
             '{[1,20)}'::int8multirange &< int8range(18,20) AS b,
             int8range(1,20) &< '{[18,20)}'::int8multirange AS c,
             '{[7,20)}'::int8multirange &> '{[5,10)}'::int8multirange AS d,
             '{[7,20)}'::int8multirange &> int8range(5,10) AS e,
             int8range(7,20) &> '{[5,10)}'::int8multirange AS f
    expect: rows
    order: multiset
    comment: "documented does-not-extend examples, all true"
  - sql: |
      SELECT '{[1.1,2.2)}'::nummultirange -|- '{[2.2,3.3)}'::nummultirange AS a,
             '{[1.1,2.2)}'::nummultirange -|- numrange(2.2,3.3) AS b,
             numrange(1.1,2.2) -|- '{[2.2,3.3)}'::nummultirange AS c
    expect: rows
    order: multiset
    comment: "documented adjacency examples, all true"
