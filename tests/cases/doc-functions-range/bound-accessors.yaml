# Range bound accessor functions with the documented examples and bound inclusivity.
id: doc-functions-range.bound-accessors
title: "lower, upper, lower_inc, upper_inc, isempty on range values"
family: doc-functions-range
tier: core
feature_ids: [range-types, bound-accessors, lower, upper, isempty]
required_capabilities: [select, range-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (Range Functions table)"
sessions: [a]
steps:
  - sql: |
      SELECT lower(numrange(1.1,2.2)) AS lo,
             upper(numrange(1.1,2.2)) AS hi,
             isempty(numrange(1.1,2.2)) AS is_empty,
             lower_inc(numrange(1.1,2.2)) AS lo_inc,
             upper_inc(numrange(1.1,2.2)) AS hi_inc
    expect: rows
    order: multiset
    comment: "documented 1.1, 2.2, false, true, false"
  - sql: |
      SELECT lower('[2,7)'::int4range) AS lo_closed,
             upper('(2,7]'::int4range) AS hi_closed_canonical,
             lower_inc('(2,7)'::int4range) AS open_lower,
             upper_inc('[2,7]'::int4range) AS closed_upper
    expect: rows
    order: multiset
    comment: "discrete int4range canonicalizes exclusive lower bounds to inclusive, and inclusive upper bounds to exclusive"
  - sql: |
      SELECT lower('[2,7)'::int4range) AS lo,
             upper('[2,7)'::int4range) AS hi,
             lower_inc('(2,7)'::int4range) AS lo_inc,
             upper_inc('[2,7)'::int4range) AS hi_inc
    expect: rows
    order: multiset
    comment: "after canonicalization, '(2,7)' is '[3,7)'"
  - sql: |
      SELECT isempty(numrange(2,2)) AS equal_bounds_exclusive,
             isempty(numrange(2,2,'[]')) AS equal_bounds_inclusive,
             isempty('[3,3)'::int4range) AS half_open_point
    expect: rows
    order: multiset
    comment: "[2,2] is a single point, and [3,3) is empty"
