# Strictly left/right, does-not-extend, and adjacency range and multirange operators.
id: doc-functions-range.position-operators
title: "Range position operators (<<, >>, &<, &>, -|-) and multirange equivalents"
family: doc-functions-range
tier: core
feature_ids: [range-types, multirange-types, range-operators, position, adjacency]
required_capabilities: [select, range-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (Range Operators and Multirange Operators tables)"
sessions: [a]
steps:
  - sql: |
      SELECT int8range(1,10) << int8range(100,110) AS strictly_left,
             int8range(50,60) >> int8range(20,30) AS strictly_right,
             int8range(1,20) &< int8range(18,20) AS not_right_of,
             int8range(7,20) &> int8range(5,10) AS not_left_of,
             numrange(1.1,2.2) -|- numrange(2.2,3.3) AS adjacent
    expect: rows
    order: multiset
    comment: "all documented examples, all true"
  - sql: |
      SELECT int8range(100,110) << int8range(1,10) AS reversed_left,
             int8range(1,10) >> int8range(100,110) AS reversed_right,
             int8range(1,10) << int8range(10,20) AS touching_left,
             int8range(1,10) -|- int8range(5,20) AS overlapping_not_adjacent
    expect: rows
    order: multiset
    comment: "strictly left/right are false for reversed arguments; touching ranges are not strictly left; overlapping ranges are not adjacent"
  - sql: |
      SELECT '{[1,10)}'::int8multirange << '{[100,110)}'::int8multirange AS mr_left_mr,
             '{[1,10)}'::int8multirange << int8range(100,110) AS mr_left_r,
             int8range(1,10) << '{[100,110)}'::int8multirange AS r_left_mr,
             '{[50,60)}'::int8multirange >> '{[20,30)}'::int8multirange AS mr_right_mr,
             '{[50,60)}'::int8multirange >> int8range(20,30) AS mr_right_r,
             int8range(50,60) >> '{[20,30)}'::int8multirange AS r_right_mr
    expect: rows
    order: multiset
    comment: "documented multirange strictly-left/right examples, all true"
  - sql: |
      SELECT '{[1,20)}'::int8multirange &< '{[18,20)}'::int8multirange AS mr_not_right_mr,
             '{[1,20)}'::int8multirange &< int8range(18,20) AS mr_not_right_r,
             int8range(1,20) &< '{[18,20)}'::int8multirange AS r_not_right_mr,
             '{[7,20)}'::int8multirange &> '{[5,10)}'::int8multirange AS mr_not_left_mr,
             '{[7,20)}'::int8multirange &> int8range(5,10) AS mr_not_left_r,
             int8range(7,20) &> '{[5,10)}'::int8multirange AS r_not_left_mr
    expect: rows
    order: multiset
    comment: "documented does-not-extend examples, all true"
  - sql: |
      SELECT '{[1.1,2.2)}'::nummultirange -|- '{[2.2,3.3)}'::nummultirange AS mr_adj_mr,
             '{[1.1,2.2)}'::nummultirange -|- numrange(2.2,3.3) AS mr_adj_r,
             numrange(1.1,2.2) -|- '{[2.2,3.3)}'::nummultirange AS r_adj_mr
    expect: rows
    order: multiset
    comment: "documented adjacency examples, all true"
