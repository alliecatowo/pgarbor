# Empty ranges are the additive identity, contain only the empty range, and are never strictly left, right, or adjacent.
id: doc-functions-range.empty-range-semantics
title: "Empty range behaves as additive identity and never satisfies position operators"
family: doc-functions-range
tier: core
feature_ids: [range-types, empty-range, range-operators, union, difference]
required_capabilities: [select, range-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (paragraph on empty ranges and multiranges)"
sessions: [a]
steps:
  - sql: |
      SELECT '[1,3)'::int4range + 'empty'::int4range AS union_with_empty,
             '[1,3)'::int4range - 'empty'::int4range AS minus_empty,
             '[1,3)'::int4range * 'empty'::int4range AS intersect_empty,
             'empty'::int4range + 'empty'::int4range AS empty_plus_empty
    expect: rows
    order: multiset
    comment: "anything unioned with empty is itself; anything minus empty is itself"
  - sql: |
      SELECT 'empty'::int4range @> 'empty'::int4range AS empty_contains_empty,
             '[1,3)'::int4range @> 'empty'::int4range AS range_contains_empty,
             'empty'::int4range <@ '{[1,3)}'::int4multirange AS empty_in_multirange,
             '{[1,3)}'::int4multirange @> 'empty'::int4range AS multirange_contains_empty
    expect: rows
    order: multiset
    comment: "every range contains the empty range; empty is contained by any range or multirange"
  - sql: |
      SELECT 'empty'::int4range << '[1,3)'::int4range AS empty_left,
             '[1,3)'::int4range << 'empty'::int4range AS left_of_empty,
             'empty'::int4range >> '[1,3)'::int4range AS empty_right,
             'empty'::int4range -|- '[1,3)'::int4range AS empty_adjacent,
             'empty'::int4range && '[1,3)'::int4range AS empty_overlap
    expect: rows
    order: multiset
    comment: "left-of, right-of and adjacency always false when an empty range is involved"
  - sql: |
      SELECT lower('empty'::int4range) IS NULL AS lower_null,
             upper('empty'::int4range) IS NULL AS upper_null,
             isempty('empty'::int4range) AS is_empty,
             lower_inc('empty'::int4range) AS lower_inc_false,
             upper_inc('empty'::int4range) AS upper_inc_false,
             lower_inf('empty'::int4range) AS lower_inf_false,
             upper_inf('empty'::int4range) AS upper_inf_false
    expect: rows
    order: multiset
    comment: "documented: lower_inc, upper_inc, lower_inf and upper_inf all return false for an empty range"
  - sql: |
      SELECT '(2,2)'::int4range = 'empty'::int4range AS empty_spellings_equal,
             isempty('(2,2)'::int4range) AS open_pair_is_empty
    expect: rows
    order: multiset
    comment: "a range with equal exclusive bounds is the empty range"
