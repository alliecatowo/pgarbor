# Multirange accessors, multirange() constructor, and unnest() with documented examples.
id: doc-functions-range.multirange-functions
title: "Multirange lower, upper, bound flags, range_merge, multirange() and unnest()"
family: doc-functions-range
tier: core
feature_ids: [multirange-types, bound-accessors, range-merge, unnest, multirange-constructor]
required_capabilities: [select, range-types, multirange-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (Multirange Functions table)"
sessions: [a]
steps:
  - sql: |
      SELECT lower('{[1.1,2.2)}'::nummultirange) AS lo,
             upper('{[1.1,2.2)}'::nummultirange) AS hi,
             isempty('{[1.1,2.2)}'::nummultirange) AS is_empty,
             lower_inc('{[1.1,2.2)}'::nummultirange) AS lo_inc,
             upper_inc('{[1.1,2.2)}'::nummultirange) AS hi_inc
    expect: rows
    order: multiset
    comment: "documented 1.1, 2.2, false, true, false"
  - sql: |
      SELECT lower_inf('{(,)}'::datemultirange) AS lo_inf,
             upper_inf('{(,)}'::datemultirange) AS hi_inf
    expect: rows
    order: multiset
    comment: "documented examples, both true"
  - sql: |
      SELECT range_merge('{[1,2), [3,4)}'::int4multirange) AS merged
    expect: rows
    order: multiset
    comment: "documented [1,4)"
  - sql: |
      SELECT multirange('[1,2)'::int4range) AS single
    expect: rows
    order: multiset
    comment: "documented {[1,2)}"
  - sql: |
      SELECT * FROM unnest('{[1,2), [3,4)}'::int4multirange) WITH ORDINALITY AS u(r, n) ORDER BY n
    expect: rows
    order: ordered
    comment: "documented ascending expansion into [1,2) then [3,4)"
  - sql: |
      SELECT upper('{}'::int4multirange) AS empty_hi,
             lower_inc('{}'::int4multirange) AS empty_lo_inc,
             isempty(multirange('empty'::int4range)) AS from_empty_is_empty
    expect: rows
    order: multiset
    comment: "lower_inc returns false for an empty multirange; upper of empty is NULL"
  - sql: |
      SELECT * FROM unnest('{}'::int4multirange)
    expect: rows
    order: multiset
    comment: "unnest of an empty multirange yields no rows"
