# Range functions and operators are strict: a NULL operand yields NULL, not an error.
id: doc-functions-range.null-propagation
title: "Range operators and accessors return NULL for NULL operands"
family: doc-functions-range
tier: core
feature_ids: [range-types, null-handling, range-operators, bound-accessors]
required_capabilities: [select, range-types]
provenance:
  source: hand
  ref: "PG18 behavior for strict range functions; func.sgml#functions-range"
sessions: [a]
steps:
  - sql: |
      SELECT lower(NULL::int4range) AS lo,
             upper(NULL::int4range) AS hi,
             isempty(NULL::int4range) AS is_empty,
             lower_inc(NULL::int4range) AS lo_inc
    expect: rows
    order: multiset
    comment: "accessor functions return NULL for a NULL range"
  - sql: |
      SELECT NULL::int4range @> 3 AS a,
             int4range(1,5) @> NULL::int4 AS b,
             int4range(1,5) + NULL::int4range AS c,
             int4range(1,5) * NULL::int4range AS d,
             NULL::int4range << int4range(1,5) AS e
    expect: rows
    order: multiset
    comment: "binary operators yield NULL for any NULL operand"
  - sql: |
      SELECT range_merge(NULL::int4range, '[1,2)'::int4range) AS merge_null
    expect: rows
    order: multiset
    comment: "range_merge is strict"
  - sql: |
      SELECT upper(NULL::nummultirange) AS mr_hi, multirange(NULL::int4range) AS mr_from_null
    expect: rows
    order: multiset
    comment: "multirange functions are strict as well"
