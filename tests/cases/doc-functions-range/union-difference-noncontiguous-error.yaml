# Range union and difference that would need two disjoint sub-ranges must fail.
id: doc-functions-range.union-difference-noncontiguous-error
title: "Range union and difference that would not be contiguous raise 22000"
family: doc-functions-range
tier: core
feature_ids: [range-types, range-operators, union, difference, errors]
required_capabilities: [select, range-types, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (range union and difference paragraph)"
sessions: [a]
steps:
  - sql: |
      SELECT int4range(1,3) + int4range(5,7)
    expect: error
    sqlstate: "22000"
    comment: "a gap between the ranges means the union cannot be a single range"
  - sql: |
      SELECT int4range(1,10) - int4range(3,5)
    expect: error
    sqlstate: "22000"
    comment: "removing a middle slice would leave two pieces"
  - sql: |
      SELECT int4range(1,3) + int4range(4,5)
    expect: error
    sqlstate: "22000"
    comment: "even a one-element gap makes the union non-contiguous"
  - sql: |
      SELECT int4range(1,3) + int4range(3,5) AS adjacent_ok
    expect: rows
    order: multiset
    comment: "adjacent but not gapped ranges still union into a single range"
