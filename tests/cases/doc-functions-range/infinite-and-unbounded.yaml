# Unbounded ranges: lower_inf/upper_inf, documented examples, and NULL for missing bounds.
id: doc-functions-range.infinite-and-unbounded
title: "Unbounded range bounds report NULL bounds and lower_inf/upper_inf true"
family: doc-functions-range
tier: core
feature_ids: [range-types, infinite-bounds, lower-inf, upper-inf]
required_capabilities: [select, range-types, create-type]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (lower_inf and upper_inf rows)"
sessions: [a]
steps:
  - sql: |
      SELECT lower_inf('(,)'::daterange) AS lo_inf_example,
             upper_inf('(,)'::daterange) AS hi_inf_example
    expect: rows
    order: multiset
    comment: "documented examples, both true"
  - sql: |
      SELECT lower('(,5)'::int4range) IS NULL AS lo_null,
             lower_inf('(,5)'::int4range) AS lo_inf,
             upper_inf('(,5)'::int4range) AS hi_inf,
             upper('(,5)'::int4range) AS hi
    expect: rows
    order: multiset
    comment: "missing lower bound gives NULL and lower_inf true"
  - sql: |
      SELECT upper('[1,)'::int4range) IS NULL AS hi_null,
             upper_inf('[1,)'::int4range) AS hi_inf,
             lower_inf('[1,)'::int4range) AS lo_inf,
             upper_inc('[1,)'::int4range) AS hi_inc
    expect: rows
    order: multiset
    comment: "missing upper bound gives NULL and upper_inc false"
  - sql: |
      SELECT lower_inf('[-infinity,5)'::numrange) AS neg_inf_is_not_unbounded
    expect: rows
    order: multiset
    comment: "documented: a lower bound of -Infinity returns false for lower_inf"
  - sql: |
      SELECT upper_inf('[2020-01-01,infinity)'::tsrange) AS pos_inf_is_not_unbounded
    expect: rows
    order: multiset
    comment: "documented: an upper bound of Infinity returns false for upper_inf"
