# range_merge over two ranges and over a multirange: the smallest covering range.
id: doc-functions-range.range-merge
title: "range_merge covers gaps and ignores empty arguments"
family: doc-functions-range
tier: core
feature_ids: [range-types, multirange-types, range-merge]
required_capabilities: [select, range-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (range_merge rows, range and multirange)"
sessions: [a]
steps:
  - sql: |
      SELECT range_merge('[1,2)'::int4range, '[3,4)'::int4range) AS documented
    expect: rows
    order: multiset
    comment: "documented [1,4) even though there is a gap between the ranges"
  - sql: |
      SELECT range_merge('[1,2)'::int4range, '[10,12)'::int4range) AS wide_gap,
             range_merge('[1,2)'::int4range, 'empty'::int4range) AS empty_argument,
             range_merge('empty'::int4range, 'empty'::int4range) AS both_empty
    expect: rows
    order: multiset
    comment: "result spans the gap, and an empty argument does not widen the result"
  - sql: |
      SELECT range_merge('{[1,2), [3,4)}'::int4multirange) AS documented_multi
    expect: rows
    order: multiset
    comment: "documented [1,4) for a multirange"
  - sql: |
      SELECT range_merge('{}'::int4multirange) AS empty_multi
    expect: rows
    order: multiset
    comment: "merging an empty multirange gives the empty range"
