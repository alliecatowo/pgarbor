# Range comparison operators order by lower bound then upper bound; empty sorts first.
id: doc-functions-range.comparison-ordering
title: "Range and multirange comparison operators order by lower then upper bound"
family: doc-functions-range
tier: core
feature_ids: [range-types, multirange-types, comparison, ordering, btree-ordering]
required_capabilities: [select, range-types, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-range (paragraph on comparison operators for range and multirange types)"
sessions: [a]
steps:
  - sql: |
      SELECT '[1,3)'::int4range < '[1,5)'::int4range AS lower_equal_upper_less,
             '[1,5)'::int4range < '[2,3)'::int4range AS lower_less,
             '[2,3)'::int4range > '[1,5)'::int4range AS lower_greater,
             '[1,3)'::int4range = '[1,3)'::int4range AS equal,
             '[1,3)'::int4range <> '[1,4)'::int4range AS not_equal
    expect: rows
    order: multiset
    comment: "comparison orders first by lower bound, then by upper bound"
  - sql: |
      SELECT x
      FROM (VALUES ('[1,5)'::int4range), ('[1,3)'::int4range), ('[2,3)'::int4range), ('empty'::int4range)) AS v(x)
      ORDER BY x
    expect: rows
    order: ordered
    comment: "empty sorts before non-empty ranges with the same ordering rule"
  - sql: |
      SELECT x
      FROM (VALUES ('{[1,2)}'::int4multirange), ('{[1,3)}'::int4multirange), ('{[0,9)}'::int4multirange)) AS v(x)
      ORDER BY x
    expect: rows
    order: ordered
    comment: "multiranges compare range by range in the same lower-then-upper order"
  - sql: |
      SELECT '{[1,2)}'::int4multirange < '{[1,3)}'::int4multirange AS mr_less,
             '{[1,2)}'::int4multirange = '{[1,2)}'::int4multirange AS mr_equal
    expect: rows
    order: multiset
    comment: "multirange comparison operators are available and consistent"
