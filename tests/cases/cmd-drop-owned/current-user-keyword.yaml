# CURRENT_USER is the same role as CURRENT_ROLE: after SET ROLE it names the set role, and DROP OWNED drops its objects.
id: cmd-drop-owned.current-user-keyword
title: "DROP OWNED BY CURRENT_USER drops objects owned by the role set with SET ROLE"
family: cmd-drop-owned
tier: core
feature_ids: [drop-owned, current-user, set-role]
required_capabilities: [roles, drop-role, set-role, create-table, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_owned.sgml#sql-drop-owned-synopsis (CURRENT_USER)"
sessions: [a]
setup: |
  CREATE ROLE dcu_o;
  CREATE TABLE dcu_t1 (a int4);
  ALTER TABLE dcu_t1 OWNER TO dcu_o;
  CREATE TABLE dcu_t2 (a int4);
steps:
  - sql: |
      SET ROLE dcu_o
    expect: ok
  - sql: |
      SELECT current_user AS u
    expect: rows
    order: ordered
  - sql: |
      DROP OWNED BY CURRENT_USER
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT relname FROM pg_class WHERE relname LIKE 'dcu_t%' ORDER BY 1
    expect: rows
    order: ordered
