# SESSION_USER names the role the connection authenticated as, which SET SESSION AUTHORIZATION changes.
id: cmd-drop-owned.session-user-keyword
title: "DROP OWNED BY SESSION_USER drops objects owned by the role set with SET SESSION AUTHORIZATION"
family: cmd-drop-owned
tier: core
feature_ids: [drop-owned, session-user, set-session-authorization]
required_capabilities: [roles, drop-role, set-session-authorization, create-table, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_owned.sgml#sql-drop-owned-synopsis (SESSION_USER)"
sessions: [a]
setup: |
  DO $$ BEGIN IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dsu_o') THEN DROP OWNED BY dsu_o; DROP ROLE dsu_o; END IF; END $$;
  CREATE ROLE dsu_o;
  CREATE TABLE dsu_t1 (a int4);
  ALTER TABLE dsu_t1 OWNER TO dsu_o;
  CREATE TABLE dsu_t2 (a int4);
steps:
  - sql: |
      SET SESSION AUTHORIZATION dsu_o
    expect: ok
  - sql: |
      SELECT session_user AS u
    expect: rows
    order: ordered
  - sql: |
      DROP OWNED BY SESSION_USER
    expect: ok
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      SELECT relname FROM pg_class WHERE relname LIKE 'dsu_t%' ORDER BY 1
    expect: rows
    order: ordered
