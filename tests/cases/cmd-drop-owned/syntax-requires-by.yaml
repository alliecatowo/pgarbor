# The role list must follow BY: DROP OWNED without BY, or with no role, is a syntax error (42601).
id: cmd-drop-owned.syntax-requires-by
title: "DROP OWNED without BY or without a role name is a syntax error"
family: cmd-drop-owned
tier: core
feature_ids: [drop-owned, syntax, errors]
required_capabilities: [roles, drop-role, create-table, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_owned.sgml#sql-drop-owned-synopsis"
sessions: [a]
setup: |
  CREATE ROLE dsyn_r;
  CREATE TABLE dsyn_t (a int4);
  ALTER TABLE dsyn_t OWNER TO dsyn_r;
steps:
  - sql: |
      DROP OWNED dsyn_r
    expect: error
    sqlstate: "42601"
    comment: BY is required
  - sql: |
      DROP OWNED BY
    expect: error
    sqlstate: "42601"
    comment: a role is required
  - sql: |
      SELECT relname FROM pg_class WHERE relname = 'dsyn_t'
    expect: rows
    order: multiset
    comment: nothing was dropped
