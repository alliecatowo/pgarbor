# A role that owns nothing and holds no privileges can be passed to DROP OWNED without error, with or without CASCADE.
id: cmd-drop-owned.no-owned-objects-noop
title: "DROP OWNED for a role with no owned objects succeeds and leaves other objects alone"
family: cmd-drop-owned
tier: core
feature_ids: [drop-owned, no-op]
required_capabilities: [roles, drop-role, create-table, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_owned.sgml#sql-drop-owned-description"
sessions: [a]
setup: |
  DO $$ BEGIN IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dnoop_r') THEN DROP OWNED BY dnoop_r; DROP ROLE dnoop_r; END IF; END $$;
  CREATE ROLE dnoop_r;
  CREATE TABLE dnoop_other (a int4);
  INSERT INTO dnoop_other VALUES (1), (2);
steps:
  - sql: |
      DROP OWNED BY dnoop_r
    expect: ok
  - sql: |
      DROP OWNED BY dnoop_r CASCADE
    expect: ok
  - sql: |
      DROP OWNED BY dnoop_r RESTRICT
    expect: ok
  - sql: |
      SELECT a FROM dnoop_other ORDER BY a
    expect: rows
    order: ordered
    comment: objects owned by other roles are untouched
