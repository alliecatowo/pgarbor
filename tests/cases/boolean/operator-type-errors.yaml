# Booleans have no arithmetic operators and no sum aggregate; both fail with 42883.
id: boolean.operator-type-errors
title: Arithmetic on boolean and sum over boolean raise 42883
family: boolean
tier: core
feature_ids: [boolean-type, errors, operators]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 docs errcodes-appendix.html class 42 undefined_function (42883)"
steps:
  - sql: |
      SELECT bool 't' + 1 AS x
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT sum(bool 't') AS x
    expect: error
    sqlstate: "42883"
