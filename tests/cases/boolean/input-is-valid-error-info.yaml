# Non-throwing input validation API: pg_input_is_valid and pg_input_error_info.
id: boolean.input-is-valid-error-info
title: pg_input_is_valid and pg_input_error_info report boolean input problems without raising
family: boolean
tier: extended
feature_ids: [boolean-type, boolean-input, catalog-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT pg_input_is_valid('true', 'bool') AS good
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('asdf', 'bool') AS bad
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('junk', 'bool')
    expect: rows
