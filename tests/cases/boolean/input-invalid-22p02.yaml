# Unrecognized or malformed boolean input raises invalid_text_representation.
id: boolean.input-invalid-22p02
title: Malformed boolean input raises 22P02 for literals and casts
family: boolean
tier: core
feature_ids: [boolean-type, boolean-input, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT bool 'test' AS invalid
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT bool 'yeah' AS invalid
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT bool 'o' AS invalid
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT bool '11' AS invalid
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT bool '000' AS invalid
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT bool '' AS invalid
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '  tru e '::text::boolean AS invalid
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT ''::text::boolean AS invalid
    expect: error
    sqlstate: "22P02"
