# Accepted boolean literal spellings (regress boolean.sql input syntax block, positive cases).
id: boolean.literal-forms
title: Boolean literal spellings map to true and false
family: boolean
tier: slice
feature_ids: [boolean-type, boolean-input, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT bool 't' AS v1, bool 'true' AS v2, bool 'TRUE' AS v3, bool 'y' AS v4, bool 'yes' AS v5, bool 'on' AS v6, bool '1' AS v7
    expect: rows
  - sql: |
      SELECT bool 'f' AS v1, bool 'false' AS v2, bool 'FALSE' AS v3, bool 'n' AS v4, bool 'no' AS v5, bool 'off' AS v6, bool 'of' AS v7, bool '0' AS v8
    expect: rows
