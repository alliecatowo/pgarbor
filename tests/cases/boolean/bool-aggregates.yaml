# bool_and and bool_or ignore NULL inputs and return NULL over an empty set.
id: boolean.bool-aggregates
title: bool_and and bool_or ignore NULLs and return NULL for empty input
family: boolean
tier: extended
feature_ids: [boolean-type, aggregates, null-semantics]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql; PG18 docs functions-aggregate.html bool_and"
  license: PostgreSQL License
setup: |
  CREATE TABLE booltbl3 (d text, b bool, o int);
  INSERT INTO booltbl3 (d, b, o) VALUES ('true', true, 1), ('false', false, 2), ('null', null, 3);
steps:
  - sql: |
      SELECT bool_and(b) AS all_true, bool_or(b) AS any_true FROM booltbl3
    expect: rows
  - sql: |
      SELECT bool_and(b) AS all_true, bool_or(b) AS any_true FROM booltbl3 WHERE o = 3
    expect: rows
  - sql: |
      SELECT bool_and(b) AS all_true, bool_or(b) AS any_true FROM booltbl3 WHERE o > 100
    expect: rows
