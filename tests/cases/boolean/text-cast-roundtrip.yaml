# Explicit casts between boolean and text in both directions.
id: boolean.text-cast-roundtrip
title: Boolean to text and text to boolean casts round-trip
family: boolean
tier: core
feature_ids: [boolean-type, casts, text-type]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT true::boolean::text AS t, false::boolean::text AS f
    expect: rows
  - sql: |
      SELECT 'TrUe'::text::boolean AS t, 'fAlse'::text::boolean AS f
    expect: rows
