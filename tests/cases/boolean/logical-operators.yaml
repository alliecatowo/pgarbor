# AND, OR, NOT and equality on boolean values with no NULLs.
id: boolean.logical-operators
title: AND OR NOT and equality on non-null boolean values
family: boolean
tier: core
feature_ids: [boolean-type, boolean-operators]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT (bool 't' OR bool 'f') AS or_tf, (bool 't' AND bool 'f') AS and_tf, (NOT bool 'f') AS not_f, (bool 't' = bool 'f') AS eq_tf, (bool 't' <> bool 'f') AS ne_tf
    expect: rows
