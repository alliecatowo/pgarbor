# Boolean columns filtered with equality, inequality and the booleq function.
id: boolean.table-filter-equality
title: Boolean column filters with equality inequality and booleq
family: boolean
tier: core
feature_ids: [boolean-type, create-table, insert, where-clause]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
setup: |
  CREATE TABLE booltbl1 (f1 bool);
  INSERT INTO booltbl1 (f1) VALUES (bool 't'), (bool 'True'), (bool 'true');
steps:
  - sql: |
      SELECT f1 FROM booltbl1 WHERE f1 = bool 'true' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM booltbl1 WHERE f1 <> bool 'false' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO booltbl1 (f1) VALUES (bool 'f')
    expect: ok
  - sql: |
      SELECT f1 FROM booltbl1 WHERE booleq(bool 'false', f1) ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM booltbl1 WHERE f1 = bool 'false' ORDER BY f1
    expect: rows
    order: ordered
