# Boolean comparison operators treat false as less than true.
id: boolean.comparison-ordering
title: Boolean comparison operators and ORDER BY treat false below true
family: boolean
tier: core
feature_ids: [boolean-type, boolean-operators, order-by]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT (bool 't' > bool 'f') AS gt, (bool 't' >= bool 'f') AS ge, (bool 'f' < bool 't') AS lt, (bool 'f' <= bool 't') AS le, (bool 'f' <= bool 'f') AS le_eq, (bool 'f' < bool 'f') AS lt_eq
    expect: rows
  - sql: |
      SELECT v FROM (VALUES (true), (false), (true), (false)) AS x(v) ORDER BY v
    expect: rows
    order: ordered
