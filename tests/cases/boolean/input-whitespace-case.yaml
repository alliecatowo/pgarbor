# Surrounding whitespace and mixed case are accepted by boolean input.
id: boolean.input-whitespace-case
title: Boolean input trims surrounding whitespace and ignores case
family: boolean
tier: core
feature_ids: [boolean-type, boolean-input, casts]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT bool '   f           ' AS v
    expect: rows
  - sql: |
      SELECT '    true   '::text::boolean AS v1, '     FALSE'::text::boolean AS v2, 'TrUe'::text::boolean AS v3, 'fAlse'::text::boolean AS v4
    expect: rows
