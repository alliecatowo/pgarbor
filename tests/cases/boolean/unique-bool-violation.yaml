# UNIQUE on a boolean column: a second true violates it, while NULLs never conflict.
id: boolean.unique-bool-violation
title: UNIQUE boolean column rejects a duplicate true but allows repeated NULLs
family: boolean
tier: core
feature_ids: [boolean-type, unique-constraints, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 docs ddl-constraints.html#DDL-CONSTRAINTS-UNIQUE-CONSTRAINTS; errcodes 23505"
setup: |
  CREATE TABLE flag_unique (b bool UNIQUE);
  INSERT INTO flag_unique (b) VALUES (true);
steps:
  - sql: |
      INSERT INTO flag_unique (b) VALUES (true)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO flag_unique (b) VALUES (false)
    expect: ok
  - sql: |
      INSERT INTO flag_unique (b) VALUES (NULL), (NULL)
    expect: ok
  - sql: |
      SELECT b FROM flag_unique ORDER BY b
    expect: rows
    order: ordered
