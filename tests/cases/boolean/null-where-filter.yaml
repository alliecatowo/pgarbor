# A NULL boolean fails both WHERE b and WHERE NOT b; only IS NOT TRUE keeps it.
id: boolean.null-where-filter
title: NULL boolean rows are excluded from WHERE b and WHERE NOT b
family: boolean
tier: core
feature_ids: [boolean-type, null-semantics, where-clause]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 docs functions-logical.html; regress boolean.sql NULL handling"
setup: |
  CREATE TABLE flags (id int4 PRIMARY KEY, b bool);
  INSERT INTO flags (id, b) VALUES (1, true), (2, false), (3, NULL);
steps:
  - sql: |
      SELECT id FROM flags WHERE b ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM flags WHERE NOT b ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM flags WHERE b IS NOT TRUE ORDER BY id
    expect: rows
    order: ordered
