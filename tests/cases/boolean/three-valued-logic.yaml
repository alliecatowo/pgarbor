# AND and OR with NULL operands follow SQL three-valued logic.
id: boolean.three-valued-logic
title: AND and OR with NULL operands follow three-valued logic in any argument order
family: boolean
tier: core
feature_ids: [boolean-type, null-semantics, boolean-operators]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
setup: |
  CREATE TABLE booltbl4 (isfalse bool, istrue bool, isnul bool);
  INSERT INTO booltbl4 VALUES (false, true, null);
steps:
  - sql: |
      SELECT istrue AND isnul AND istrue AS a1, istrue AND istrue AND isnul AS a2, isnul AND istrue AND istrue AS a3, isfalse AND isnul AND istrue AS a4, istrue AND isfalse AND isnul AS a5, isnul AND istrue AND isfalse AS a6 FROM booltbl4
    expect: rows
  - sql: |
      SELECT isfalse OR isnul OR isfalse AS o1, isfalse OR isfalse OR isnul AS o2, isnul OR isfalse OR isfalse AS o3, isfalse OR isnul OR istrue AS o4, istrue OR isfalse OR isnul AS o5, isnul OR istrue OR isfalse AS o6 FROM booltbl4
    expect: rows
  - sql: |
      SELECT NOT isnul AS n, isnul IS NULL AS null_test FROM booltbl4
    expect: rows
