# NOT NULL on a boolean column rejects NULL with 23502 and accepts a real value.
id: boolean.not-null-violation
title: NOT NULL boolean column rejects NULL with 23502
family: boolean
tier: core
feature_ids: [boolean-type, not-null-constraints, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 docs ddl-constraints.html#DDL-CONSTRAINTS-NOT-NULL; errcodes 23502"
setup: |
  CREATE TABLE flag_req (id int4 PRIMARY KEY, b bool NOT NULL);
steps:
  - sql: |
      INSERT INTO flag_req (id, b) VALUES (1, NULL)
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO flag_req (id, b) VALUES (2, true)
    expect: ok
  - sql: |
      SELECT id, b FROM flag_req ORDER BY id
    expect: rows
    order: ordered
