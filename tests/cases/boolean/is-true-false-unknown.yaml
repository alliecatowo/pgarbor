# IS [NOT] TRUE, IS [NOT] FALSE and IS [NOT] UNKNOWN never return NULL, including for NULL input.
id: boolean.is-true-false-unknown
title: IS TRUE IS FALSE and IS UNKNOWN tests return non-null results for NULL input
family: boolean
tier: core
feature_ids: [boolean-type, null-semantics, is-tests]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
setup: |
  CREATE TABLE booltbl3 (d text, b bool, o int);
  INSERT INTO booltbl3 (d, b, o) VALUES ('true', true, 1), ('false', false, 2), ('null', null, 3);
steps:
  - sql: |
      SELECT d, b IS TRUE AS istrue, b IS NOT TRUE AS isnottrue, b IS FALSE AS isfalse, b IS NOT FALSE AS isnotfalse, b IS UNKNOWN AS isunknown, b IS NOT UNKNOWN AS isnotunknown FROM booltbl3 ORDER BY o
    expect: rows
    order: ordered
