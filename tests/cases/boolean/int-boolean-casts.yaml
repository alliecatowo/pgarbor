# Integer to boolean casts (zero is false, any nonzero is true) and boolean to integer.
id: boolean.int-boolean-casts
title: Integer to boolean casts treat any nonzero value as true
family: boolean
tier: core
feature_ids: [boolean-type, casts, integer-type]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/boolean.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT 0::boolean AS z, 1::boolean AS one, 2::boolean AS two, (-1)::boolean AS neg
    expect: rows
  - sql: |
      SELECT true::int4 AS ti, false::int4 AS fi
    expect: rows
