# A WITH HOLD cursor declared in a block is materialized at END and remains readable afterwards.
id: cmd-end.with-hold-cursor-survives
title: A WITH HOLD cursor declared inside a block survives END
family: cmd-end
tier: extended
feature_ids: [end, begin, cursors, with-hold, transactions, select]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Description: END is equivalent to COMMIT; ref/declare.sgml WITH HOLD)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR WITH HOLD FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      END
    expect: ok
  - sql: |
      FETCH ALL FROM c
    expect: rows
    order: ordered
    comment: the held cursor still yields both rows after the commit
  - sql: |
      CLOSE c
    expect: ok
