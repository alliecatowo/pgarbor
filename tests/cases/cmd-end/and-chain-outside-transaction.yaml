# END AND CHAIN has no transaction block to chain from, so it is an error and starts no block.
id: cmd-end.and-chain-outside-transaction
title: END AND CHAIN outside a transaction block is an error and starts no block
family: cmd-end
tier: core
feature_ids: [end, and-chain, transactions]
required_capabilities: [select, transactions, guc, errors]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Parameters: AND CHAIN; END is equivalent to COMMIT)"
sessions: [a]
steps:
  - sql: |
      END AND CHAIN
    expect: error
    sqlstate: "25P01"
    comment: the message text reads COMMIT AND CHAIN can only be used in transaction blocks
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
    comment: no block was started, so the session is still in autocommit
  - sql: |
      END AND NO CHAIN
    expect: notice
    comment: without CHAIN the same statement only warns
