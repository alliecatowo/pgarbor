# SET LOCAL lasts only until the transaction ends, so END restores the session value.
id: cmd-end.set-local-discarded
title: END discards a SET LOCAL setting and restores the session default
family: cmd-end
tier: extended
feature_ids: [end, begin, guc, set-local, transactions]
required_capabilities: [select, transactions, guc]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Description: END is equivalent to COMMIT, which ends the transaction and its SET LOCAL scope)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL statement_timeout = '5s'
    expect: ok
  - sql: |
      SELECT current_setting('statement_timeout') AS t
    expect: rows
    order: ordered
  - sql: |
      END
    expect: ok
  - sql: |
      SELECT current_setting('statement_timeout') AS t
    expect: rows
    order: ordered
    comment: the setting is back to its default of 0
