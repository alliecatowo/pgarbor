# Until END runs, another session sees only the committed state; after END it sees the committed update and inserted row.
id: cmd-end.visibility-other-session
title: END makes an update and an insert visible to other sessions
family: cmd-end
tier: core
feature_ids: [end, transactions, read-committed, update, insert, multi-session]
required_capabilities: [create-table, insert, update, select, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Description: All changes made by the transaction become visible to others)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v text NOT NULL);
  INSERT INTO t VALUES (1, 'start');
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      INSERT INTO t VALUES (2, 'b')
    expect: ok
  - session: a
    sql: |
      UPDATE t SET v = 'changed' WHERE id = 1
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: b sees only the committed state
  - session: a
    sql: |
      END
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: b now sees the update and the insert
