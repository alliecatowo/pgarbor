# WORK and TRANSACTION are optional noise words; END WORK, END TRANSACTION and END TRANSACTION AND NO CHAIN all commit.
id: cmd-end.keyword-variants
title: END accepts WORK and TRANSACTION noise words and commits in each form
family: cmd-end
tier: core
feature_ids: [end, begin, transactions, insert, select]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Synopsis: END [ WORK | TRANSACTION ] [ AND [ NO ] CHAIN ]; Parameters: WORK, TRANSACTION)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      END WORK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      end transaction
    expect: ok
    comment: keywords are case-insensitive
  - sql: |
      BEGIN TRANSACTION
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3)
    expect: ok
  - sql: |
      END TRANSACTION AND NO CHAIN
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
