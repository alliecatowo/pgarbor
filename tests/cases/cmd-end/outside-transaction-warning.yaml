# END outside a transaction block does no harm beyond a warning and leaves committed data untouched.
id: cmd-end.outside-transaction-warning
title: END outside a transaction block warns and changes no data
family: cmd-end
tier: core
feature_ids: [end, transactions, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Notes: Issuing END when not inside a transaction does no harm, but it will provoke a warning message)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      END
    expect: notice
    comment: WARNING 25P01 "there is no transaction in progress"
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      END WORK AND NO CHAIN
    expect: notice
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
