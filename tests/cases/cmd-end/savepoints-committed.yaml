# END with an open savepoint commits the savepoint's work too; the savepoint is not left behind.
id: cmd-end.savepoints-committed
title: END commits work done after an open savepoint along with the rest of the block
family: cmd-end
tier: core
feature_ids: [end, savepoints, begin, transactions, insert]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Description: END commits the current transaction, all changes made by the transaction)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SAVEPOINT s
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      END
    expect: ok
  - reconnect: true
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
