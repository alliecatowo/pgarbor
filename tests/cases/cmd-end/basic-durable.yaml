# END commits the transaction; its rows are visible inside the block, durable, and survive reconnect.
id: cmd-end.basic-durable
title: END commits a block so its rows persist across reconnect
family: cmd-end
tier: core
feature_ids: [end, begin, commit, transactions, insert, select]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Description: END commits the current transaction; Examples: To commit the current transaction and make all changes permanent)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1, 'one'), (2, 'two')
    expect: ok
  - sql: |
      SELECT id, name FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: rows are visible to the transaction that wrote them
  - sql: |
      END;
    expect: ok
  - reconnect: true
  - sql: |
      SELECT id, name FROM t ORDER BY id
    expect: rows
    order: ordered
