# DDL and DML in one block are committed together by END and persist across reconnect.
id: cmd-end.ddl-transactional
title: END commits CREATE TABLE and its insert together and both survive reconnect
family: cmd-end
tier: core
feature_ids: [end, begin, create-table, insert, transactions, select]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Description: All changes made by the transaction become visible to others and are durable)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE TABLE u (n int4 PRIMARY KEY)
    expect: ok
  - sql: |
      INSERT INTO u VALUES (7)
    expect: ok
  - sql: |
      END
    expect: ok
  - reconnect: true
  - sql: |
      SELECT n, to_regclass('u') IS NOT NULL AS exists FROM u ORDER BY n
    expect: rows
    order: ordered
