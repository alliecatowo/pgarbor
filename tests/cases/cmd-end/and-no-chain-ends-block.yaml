# END AND NO CHAIN commits and does not start a new block, so the session returns to autocommit defaults.
id: cmd-end.and-no-chain-ends-block
title: END AND NO CHAIN commits and leaves the session in autocommit with default characteristics
family: cmd-end
tier: core
feature_ids: [end, and-chain, isolation-level, read-only, transactions, guc, insert, select]
required_capabilities: [create-table, insert, select, transactions, guc]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Parameters: AND NO CHAIN; Otherwise, no new transaction is started)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE READ ONLY
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
  - sql: |
      END AND NO CHAIN
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
    comment: read committed and read write are the session defaults again
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
    comment: no read-only block remains, so the write succeeds
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
