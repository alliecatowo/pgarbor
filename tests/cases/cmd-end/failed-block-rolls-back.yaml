# After an error inside a block, END reports ROLLBACK and discards the block's earlier writes.
id: cmd-end.failed-block-rolls-back
title: END after an error in the block discards its writes and reports rollback
family: cmd-end
tier: core
feature_ids: [end, begin, transactions, errors, insert, constraints]
required_capabilities: [create-table, insert, select, transactions, errors, constraints]
provenance:
  source: pg-docs
  ref: "ref/end.sgml#sql-end (Description: END commits; Notes: failed transaction behaviour follows COMMIT)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: error
    sqlstate: "23505"
    comment: duplicate primary key aborts the block
  - sql: |
      END
    expect: ok
    comment: reports ROLLBACK; the earlier insert of 2 is discarded
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
