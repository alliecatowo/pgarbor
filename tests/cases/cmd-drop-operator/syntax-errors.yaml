# The operator must be named by an operator symbol with a parenthesised pair of operand types; anything else is a syntax error.
id: cmd-drop-operator.syntax-errors
title: DROP OPERATOR rejects identifier names, missing operand lists, postfix shapes and misplaced IF EXISTS
family: cmd-drop-operator
tier: core
feature_ids: [drop-operator, syntax, operator-names, postfix-operators]
required_capabilities: [drop-operator, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_operator.sgml#synopsis (name, left_type | NONE, right_type)"
sessions: [a]
steps:
  - sql: |
      DROP OPERATOR nosuch_op (integer, integer)
    expect: error
    sqlstate: "42601"
    comment: a plain identifier is not an operator name
  - sql: |
      DROP OPERATOR ^ integer
    expect: error
    sqlstate: "42601"
    comment: operand types must be parenthesised
  - sql: |
      DROP OPERATOR ~ (none)
    expect: error
    sqlstate: "42601"
    comment: a single operand type is not a valid signature
  - sql: |
      DROP OPERATOR ~ (bit, none)
    expect: error
    sqlstate: "42601"
    comment: NONE on the right means a postfix operator, which is not supported
  - sql: |
      DROP OPERATOR IF EXISTS (integer, integer)
    expect: error
    sqlstate: "42601"
    comment: IF EXISTS does not stand in for a missing operator name
  - sql: |
      DROP OPERATOR
    expect: error
    sqlstate: "42601"
