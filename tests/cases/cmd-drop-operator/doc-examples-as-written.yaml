# The three documented DROP OPERATOR examples run unmodified in a fresh database: the integer power operator
# does not exist, and the built-in bit-complement prefix operator is required by the system and cannot be dropped.
id: cmd-drop-operator.doc-examples-as-written
title: Documented DROP OPERATOR examples run unmodified in a fresh database
family: cmd-drop-operator
tier: core
feature_ids: [drop-operator, operator-resolution, system-operators, if-exists]
required_capabilities: [drop-operator, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_operator.sgml#examples (DROP OPERATOR ^ (integer, integer); DROP OPERATOR ~ (none, bit))"
sessions: [a]
steps:
  - sql: |
      DROP OPERATOR ^ (integer, integer)
    expect: error
    sqlstate: "42883"
    comment: no integer ^ integer operator exists in a fresh database
  - sql: |
      DROP OPERATOR IF EXISTS ^ (integer, integer)
    expect: notice
    comment: IF EXISTS turns the same miss into a notice
  - sql: |
      DROP OPERATOR ~ (none, bit)
    expect: error
    sqlstate: "2BP01"
    comment: the built-in bit-complement prefix operator is required by the database system
  - sql: |
      SELECT count(*) AS builtin_bitnot FROM pg_operator WHERE oprname = '~' AND oprnamespace = 'pg_catalog'::regnamespace AND oprleft = 0::oid AND oprright = 'bit'::regtype
    expect: rows
    comment: the built-in is still present after the refused drop
