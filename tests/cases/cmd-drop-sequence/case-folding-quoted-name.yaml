# Unquoted names fold to lower case, so a mixed-case sequence created with quotes needs quotes to drop it.
id: cmd-drop-sequence.case-folding-quoted-name
title: DROP SEQUENCE folds unquoted names, so a quoted mixed-case sequence needs its quoted name
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, identifiers, quoting, errors]
required_capabilities: [sequences, select, errors]
provenance:
  source: hand
  ref: "PG18 docs sql-syntax-lexical (identifiers and key words) applied to sql-dropsequence"
sessions: [a]
setup: |
  CREATE SEQUENCE "MixedSeq";
steps:
  - sql: |
      DROP SEQUENCE mixedseq
    expect: error
    sqlstate: "42P01"
    comment: mixedseq folds to lower case and does not exist
  - sql: |
      DROP SEQUENCE "MixedSeq"
    expect: ok
    comment: the quoted name matches exactly
