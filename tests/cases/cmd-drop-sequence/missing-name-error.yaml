# Without IF EXISTS, dropping a sequence that does not exist is an error and changes nothing.
id: cmd-drop-sequence.missing-name-error
title: DROP SEQUENCE on a missing name fails with 42P01 and leaves other sequences alone
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, errors, object-kinds]
required_capabilities: [sequences, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_sequence.sgml#sql-dropsequence (Parameters: IF EXISTS is the only way to suppress the error)"
sessions: [a]
setup: |
  CREATE SEQUENCE keep_seq;
steps:
  - sql: |
      DROP SEQUENCE no_such_seq
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT relname FROM pg_class WHERE relkind = 'S' AND relnamespace = 'public'::regnamespace ORDER BY relname
    expect: rows
    order: ordered
    comment: the unrelated sequence is untouched
