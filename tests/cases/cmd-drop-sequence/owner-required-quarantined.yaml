# Only the owner (or a superuser) may drop a sequence; testing that needs CREATE ROLE and SET ROLE, which are cluster-global.
id: cmd-drop-sequence.owner-required-quarantined
title: DROP SEQUENCE by a non-owner role is rejected (owner check)
family: cmd-drop-sequence
tier: extended
feature_ids: [drop-sequence, roles, privileges]
required_capabilities: [sequences, roles, privileges, errors]
provenance:
  source: pg-docs
  ref: "ref/drop_sequence.sgml#sql-dropsequence (Description: can only be dropped by its owner or a superuser)"
sessions: [a]
steps:
  - sql: |
      SELECT 1
    expect: rows
quarantine:
  reason: "Needs CREATE ROLE and SET ROLE, which are cluster-global side effects; not isolatable in one scratch database on the shared oracle."
  since: "2026-10-15"
