# IF EXISTS applies per name in a list: the missing name is skipped with a notice, the existing one is dropped.
id: cmd-drop-sequence.multi-name-if-exists-mix
title: DROP SEQUENCE IF EXISTS with a list drops existing names and notices missing ones
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, multiple-names, if-exists, notices]
required_capabilities: [sequences, select, notice, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_sequence.sgml#sql-dropsequence (synopsis: IF EXISTS name [, ...])"
sessions: [a]
setup: |
  CREATE SEQUENCE a1;
  CREATE SEQUENCE a2;
steps:
  - sql: |
      DROP SEQUENCE IF EXISTS a1, missing_seq
    expect: notice
    comment: a1 is dropped and the missing name produces the notice
  - sql: |
      SELECT relname FROM pg_class WHERE relkind = 'S' AND relnamespace = 'public'::regnamespace ORDER BY relname
    expect: rows
    order: ordered
    comment: only a2 remains
