# An identity column's sequence cannot be dropped on its own; the error hints at dropping the column instead.
id: cmd-drop-sequence.identity-column-refused
title: DROP SEQUENCE on an identity column's sequence fails with 2BP01 and IF EXISTS does not bypass it
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, identity-columns, dependencies, if-exists]
required_capabilities: [sequences, create-table, identity, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ref/drop_sequence.sgml#sql-dropsequence (Description; DROP SEQUENCE refuses sequences other objects need)"
sessions: [a]
setup: |
  CREATE TABLE t10 (id int4 GENERATED ALWAYS AS IDENTITY, v text);
  CREATE TABLE t16 (id int4 GENERATED BY DEFAULT AS IDENTITY, v text);
  INSERT INTO t10 (v) VALUES ('a');
steps:
  - sql: |
      DROP SEQUENCE t10_id_seq
    expect: error
    sqlstate: "2BP01"
    comment: GENERATED ALWAYS identity sequence is required by its column; the HINT says to drop the column
  - sql: |
      DROP SEQUENCE IF EXISTS t16_id_seq
    expect: error
    sqlstate: "2BP01"
    comment: IF EXISTS only skips missing sequences; this one exists and is still required
  - sql: |
      INSERT INTO t10 (v) VALUES ('b') RETURNING id, v
    expect: rows
    order: ordered
    comment: the identity column still generates values
