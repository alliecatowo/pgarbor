# Temporary sequences are dropped the same way; the session-local name stops resolving afterward.
id: cmd-drop-sequence.temp-sequence-drop
title: DROP SEQUENCE removes a temporary sequence and IF EXISTS then skips it with a notice
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, temp-objects, if-exists, notices]
required_capabilities: [sequences, temp-tables, select, errors, notice]
provenance:
  source: hand
  ref: "PG18 docs sql-dropsequence applied to CREATE TEMPORARY SEQUENCE"
sessions: [a]
steps:
  - sql: |
      CREATE TEMP SEQUENCE ts1 START 3
    expect: ok
  - sql: |
      SELECT nextval('ts1')
    expect: rows
    order: ordered
  - sql: |
      DROP SEQUENCE ts1
    expect: ok
  - sql: |
      SELECT nextval('ts1')
    expect: error
    sqlstate: "42P01"
  - sql: |
      DROP SEQUENCE IF EXISTS ts1
    expect: notice
