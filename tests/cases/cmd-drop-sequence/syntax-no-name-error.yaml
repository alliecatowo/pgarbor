# DROP SEQUENCE needs at least one name; an empty list or trailing comma is a syntax error (42601).
id: cmd-drop-sequence.syntax-no-name-error
title: DROP SEQUENCE with no name, or a trailing comma in the list, is a syntax error and drops nothing
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, syntax, errors]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/drop_sequence.sgml#sql-dropsequence (synopsis: name [, ...] requires at least one name)"
sessions: [a]
setup: |
  CREATE SEQUENCE keep_s;
steps:
  - sql: |
      DROP SEQUENCE
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP SEQUENCE keep_s, 
    expect: error
    sqlstate: "42601"
    comment: a trailing comma is not a valid name list
  - sql: |
      SELECT relname FROM pg_class WHERE relkind = 'S' AND relnamespace = 'public'::regnamespace ORDER BY relname
    expect: rows
    order: ordered
    comment: keep_s was not dropped by the failed statements
