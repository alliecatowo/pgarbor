# Documented example: DROP SEQUENCE serial removes the sequence; a re-created sequence of the same name starts over.
id: cmd-drop-sequence.doc-example-serial
title: DROP SEQUENCE serial (documented example) removes it and a re-created sequence restarts
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, sequences, create-sequence]
required_capabilities: [sequences, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_sequence.sgml#sql-dropsequence (Examples: To remove the sequence serial)"
sessions: [a]
setup: |
  CREATE SEQUENCE serial;
steps:
  - sql: |
      SELECT relname FROM pg_class WHERE relkind = 'S' AND relnamespace = 'public'::regnamespace ORDER BY relname
    expect: rows
    order: ordered
    comment: before the drop, serial exists
  - sql: |
      DROP SEQUENCE serial
    expect: ok
  - sql: |
      SELECT relname FROM pg_class WHERE relkind = 'S' AND relnamespace = 'public'::regnamespace ORDER BY relname
    expect: rows
    order: ordered
    comment: no sequences remain in public
  - sql: |
      SELECT nextval('serial')
    expect: error
    sqlstate: "42P01"
    comment: the dropped sequence no longer resolves
  - sql: |
      CREATE SEQUENCE serial START 1
    expect: ok
  - sql: |
      SELECT nextval('serial')
    expect: rows
    order: ordered
    comment: a new sequence with the same name starts from its own START value, not the dropped state
