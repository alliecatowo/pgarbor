# IF EXISTS turns a missing sequence into a NOTICE; the same statement without it is an error.
id: cmd-drop-sequence.if-exists-notice
title: DROP SEQUENCE IF EXISTS on a missing sequence issues a notice and drops an existing one silently
family: cmd-drop-sequence
tier: core
feature_ids: [drop-sequence, if-exists, notices, errors]
required_capabilities: [sequences, select, errors, notice, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_sequence.sgml#sql-dropsequence (Parameters: IF EXISTS: a notice is issued in this case)"
sessions: [a]
setup: |
  CREATE SEQUENCE present_seq;
steps:
  - sql: |
      DROP SEQUENCE IF EXISTS missing_seq
    expect: notice
    comment: skipped with a notice, not an error
  - sql: |
      SELECT relname FROM pg_class WHERE relkind = 'S' AND relnamespace = 'public'::regnamespace ORDER BY relname
    expect: rows
    order: ordered
    comment: the existing sequence is untouched by the no-op drop
  - sql: |
      DROP SEQUENCE IF EXISTS present_seq
    expect: ok
    comment: with an existing sequence IF EXISTS drops it silently
  - sql: |
      SELECT relname FROM pg_class WHERE relkind = 'S' AND relnamespace = 'public'::regnamespace ORDER BY relname
    expect: rows
    order: ordered
