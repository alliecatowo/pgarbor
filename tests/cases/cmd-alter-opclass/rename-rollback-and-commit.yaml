# ALTER OPERATOR CLASS is transactional: a rename inside a rolled-back transaction is undone and a committed one persists.
id: cmd-alter-opclass.rename-rollback-and-commit
title: "RENAME TO inside a transaction is undone by ROLLBACK and kept by COMMIT"
family: cmd-alter-opclass
tier: core
feature_ids: [alter-operator-class, rename, transactions]
required_capabilities: [create-operator-class, alter-operator-class, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_opclass.sgml#sql-alteropclass (RENAME TO new_name, run inside BEGIN/ROLLBACK and BEGIN/COMMIT)"
sessions: [a]
setup: |
  CREATE OPERATOR CLASS aoc_cmd_o13a FOR TYPE int4 USING btree AS OPERATOR 1 <, OPERATOR 3 =, OPERATOR 5 >, FUNCTION 1 btint4cmp(int4,int4);
  CREATE OPERATOR CLASS aoc_cmd_o13b FOR TYPE int4 USING btree AS OPERATOR 1 <, OPERATOR 3 =, OPERATOR 5 >, FUNCTION 1 btint4cmp(int4,int4);
steps:
  - sql: |
      BEGIN;
      ALTER OPERATOR CLASS aoc_cmd_o13a USING btree RENAME TO aoc_cmd_o13x;
      SELECT opcname FROM pg_opclass WHERE opcname LIKE 'aoc_cmd_o13%' ORDER BY opcname;
      ROLLBACK
    expect: ok
    comment: the rename is visible inside the transaction only
  - sql: |
      SELECT opcname FROM pg_opclass WHERE opcname LIKE 'aoc_cmd_o13%' ORDER BY opcname
    expect: rows
    order: ordered
    comment: rolled back, so the original name is back
  - sql: |
      BEGIN;
      ALTER OPERATOR CLASS aoc_cmd_o13b USING btree RENAME TO aoc_cmd_o13y;
      COMMIT
    expect: ok
  - sql: |
      SELECT opcname FROM pg_opclass WHERE opcname LIKE 'aoc_cmd_o13%' ORDER BY opcname
    expect: rows
    order: ordered
