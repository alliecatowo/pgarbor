# SET SCHEMA to a schema that does not exist fails with invalid_schema_name and leaves the opclass where it was.
id: cmd-alter-opclass.set-schema-missing-schema-3f000
title: "SET SCHEMA to a missing schema raises invalid_schema_name and the opclass does not move"
family: cmd-alter-opclass
tier: core
feature_ids: [alter-operator-class, set-schema, error-handling]
required_capabilities: [create-operator-class, alter-operator-class, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_opclass.sgml#sql-alteropclass (SET SCHEMA new_schema)"
sessions: [a]
setup: |
  CREATE OPERATOR CLASS aoc_cmd_o10 FOR TYPE int4 USING btree AS OPERATOR 1 <, OPERATOR 3 =, OPERATOR 5 >, FUNCTION 1 btint4cmp(int4,int4);
steps:
  - sql: |
      ALTER OPERATOR CLASS aoc_cmd_o10 USING btree SET SCHEMA aoc_cmd_no_such_schema
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT n.nspname FROM pg_opclass o JOIN pg_namespace n ON n.oid = o.opcnamespace WHERE o.opcname = 'aoc_cmd_o10'
    expect: rows
    order: ordered
    comment: still in public
