# An unknown opclass name, an opclass name that exists only for another access method, and an unknown access method each raise undefined_object.
id: cmd-alter-opclass.missing-opclass-and-method-42704
title: "ALTER OPERATOR CLASS on a missing name, wrong access method, or unknown method raises undefined_object"
family: cmd-alter-opclass
tier: core
feature_ids: [alter-operator-class, error-handling, access-method]
required_capabilities: [create-operator-class, alter-operator-class, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_opclass.sgml#sql-alteropclass (name, index_method)"
sessions: [a]
setup: |
  CREATE OPERATOR CLASS aoc_cmd_b4 FOR TYPE int4 USING btree AS OPERATOR 1 <, OPERATOR 3 =, OPERATOR 5 >, FUNCTION 1 btint4cmp(int4,int4);
steps:
  - sql: |
      ALTER OPERATOR CLASS aoc_cmd_nope USING btree RENAME TO aoc_cmd_x
    expect: error
    sqlstate: "42704"
    comment: no such opclass
  - sql: |
      ALTER OPERATOR CLASS aoc_cmd_b4 USING hash RENAME TO aoc_cmd_x
    expect: error
    sqlstate: "42704"
    comment: the opclass exists for btree only
  - sql: |
      ALTER OPERATOR CLASS aoc_cmd_b4 USING no_such_method_cmd RENAME TO aoc_cmd_x
    expect: error
    sqlstate: "42704"
    comment: unknown access method
  - sql: |
      SELECT opcname FROM pg_opclass WHERE opcname LIKE 'aoc_cmd_%' ORDER BY opcname
    expect: rows
    order: ordered
    comment: nothing was renamed
