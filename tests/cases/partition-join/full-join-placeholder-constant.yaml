# FULL JOIN where the join inputs carry constant placeholder columns referenced in the WHERE clause.
id: partition-join.full-join-placeholder-constant
title: FULL JOIN over subqueries with constant columns filtered on both sides
family: partition-join
tier: extended
feature_ids: [joins, outer-join, full-join, subqueries, partitioning, select]
required_capabilities: [create-table, insert, select, partitioning, joins]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (full outer join with placeholder vars section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (5, 0, 'a5'), (11, 1, 'a11'), (12, 0, 'a12');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (0, 0, 'b0'), (0, 5, 'b5'), (0, 12, 'b12');
steps:
  - sql: |
      SELECT t1.a, t1.c, t2.b, t2.c FROM (SELECT 50 phv, * FROM prt1 WHERE prt1.b = 0) t1 FULL JOIN (SELECT 75 phv, * FROM prt2 WHERE prt2.a = 0) t2 ON (t1.a = t2.b) WHERE t1.phv = t1.a OR t2.phv = t2.b ORDER BY t1.a, t2.b
    expect: rows
    order: ordered
    comment: the constant columns compare against the join keys, so the WHERE clause keeps only some NULL-extended rows
  - sql: |
      SELECT t1.phv IS NULL AS left_null, t2.phv IS NULL AS right_null, count(*) FROM (SELECT 50 phv, * FROM prt1 WHERE prt1.b = 0) t1 FULL JOIN (SELECT 75 phv, * FROM prt2 WHERE prt2.a = 0) t2 ON (t1.a = t2.b) GROUP BY 1, 2
    expect: rows
    order: multiset
