# IN (subquery) over partitioned tables acts as a semi-join: each outer row is emitted at most once.
id: partition-join.semi-join-in-subquery
title: IN subquery over partitioned tables emits each outer row at most once despite duplicate inner matches
family: partition-join
tier: core
feature_ids: [subqueries, semi-join, in-operator, partitioning, select]
required_capabilities: [create-table, insert, select, partitioning, subqueries]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (semi-join section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (2, 0, 'a2'), (11, 0, 'a11'), (12, 1, 'a12');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (0, 0, 'b0'), (0, 2, 'b2'), (0, 2, 'b2dup'), (1, 11, 'b11');
steps:
  - sql: |
      SELECT t1.* FROM prt1 t1 WHERE t1.a IN (SELECT t2.b FROM prt2 t2 WHERE t2.a = 0) AND t1.b = 0 ORDER BY t1.a
    expect: rows
    order: ordered
    comment: prt2 has two rows with b = 2; t1 row a = 2 must still appear once
  - sql: |
      SELECT count(*) FROM prt1 t1 WHERE t1.a IN (SELECT t2.b FROM prt2 t2)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM prt1 t1 WHERE t1.a NOT IN (SELECT t2.b FROM prt2 t2 WHERE t2.b IS NULL)
    expect: rows
    order: multiset
    comment: NOT IN with a NULL in the subquery result yields no rows
