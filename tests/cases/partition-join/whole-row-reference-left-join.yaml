# Whole-row references over a LEFT JOIN: an unmatched side is the NULL row, not a row of NULL fields.
id: partition-join.whole-row-reference-left-join
title: Whole-row references in LEFT JOIN output are NULL for unmatched partitioned-table rows
family: partition-join
tier: extended
feature_ids: [joins, outer-join, whole-row-reference, composite-types, partitioning, nulls, select]
required_capabilities: [create-table, insert, select, partitioning, joins]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (whole-row reference section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (2, 0, 'a2'), (11, 1, 'a11');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (0, 0, 'b0'), (3, 11, 'b11');
steps:
  - sql: |
      SELECT t1, t2 FROM prt1 t1 LEFT JOIN prt2 t2 ON t1.a = t2.b WHERE t1.b = 0 ORDER BY t1.a, t2.b
    expect: rows
    order: ordered
    comment: a NULL-extended t2 whole-row value is NULL, while t1 is a non-null record
  - sql: |
      SELECT t2 IS NULL AS whole_null, (t2).a AS t2a FROM prt1 t1 LEFT JOIN prt2 t2 ON t1.a = t2.b ORDER BY t1.a
    expect: rows
    order: ordered
    comment: IS NULL on a whole-row reference is true only when the NULL-extended row is the value
