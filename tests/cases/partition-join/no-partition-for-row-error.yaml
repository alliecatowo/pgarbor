# Inserting a row whose partition key maps to no partition fails with 23514 and writes nothing.
id: partition-join.no-partition-for-row-error
title: INSERT with a partition key outside every range raises 23514 and leaves the table unchanged
family: partition-join
tier: core
feature_ids: [partitioning, range-partitioning, insert, errors, nulls]
required_capabilities: [create-table, insert, select, partitioning]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (partitioned table setup); PG18 errcodes 23514 check_violation"
sessions: [a]
setup: |
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (1, 5, 'ok');
steps:
  - sql: |
      INSERT INTO prt2 VALUES (2, 20, 'above')
    expect: error
    sqlstate: "23514"
    comment: upper bound 20 is exclusive and no partition covers it
  - sql: |
      INSERT INTO prt2 VALUES (3, NULL, 'nullkey')
    expect: error
    sqlstate: "23514"
    comment: NULL partition key is not accepted by a range partition with no default partition
  - sql: |
      SELECT a, b, c FROM prt2 ORDER BY a
    expect: rows
    order: ordered
