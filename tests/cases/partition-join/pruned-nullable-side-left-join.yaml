# LEFT JOIN where the nullable side is a filtered subquery over partitioned tables; pruned partitions still yield NULL-extended rows.
id: partition-join.pruned-nullable-side-left-join
title: LEFT JOIN with a filtered nullable-side subquery over partitioned tables keeps all preserved rows
family: partition-join
tier: extended
feature_ids: [joins, outer-join, left-join, partition-pruning, partitioning, nulls, select]
required_capabilities: [create-table, insert, select, partitioning, joins]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (nullable-side partition pruning section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (4, 0, 'a4'), (12, 0, 'a12'), (13, 1, 'a13');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (1, 4, 'b4'), (2, 12, 'b12'), (3, 14, 'b14');
steps:
  - sql: |
      SELECT t1.a, t1.c, t2.b, t2.c FROM (SELECT * FROM prt1 WHERE a < 9) t1 LEFT JOIN (SELECT * FROM prt2 WHERE b > 9) t2 ON t1.a = t2.b WHERE t1.b = 0 ORDER BY t1.a, t2.b
    expect: rows
    order: ordered
    comment: prt1 rows a = 0 and a = 4 survive with NULL t2 columns because the nullable-side filter removes all matches
  - sql: |
      SELECT t1.a, t2.b FROM (SELECT * FROM prt1 WHERE a < 9) t1 FULL JOIN (SELECT * FROM prt2 WHERE b > 9) t2 ON t1.a = t2.b WHERE t1.b = 0 OR t2.a = 0 ORDER BY t1.a NULLS LAST, t2.b NULLS LAST
    expect: rows
    order: ordered
