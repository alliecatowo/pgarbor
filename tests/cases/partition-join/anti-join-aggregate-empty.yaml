# NOT EXISTS anti-join feeding aggregates; an empty input makes sum/avg NULL and count 0.
id: partition-join.anti-join-aggregate-empty
title: NOT EXISTS anti-join over partitioned tables feeds aggregates that return NULL on empty input
family: partition-join
tier: core
feature_ids: [subqueries, anti-join, aggregates, null-semantics, partitioning, select]
required_capabilities: [create-table, insert, select, partitioning, subqueries, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (anti-join with aggregates section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (2, 3, 'a2'), (11, 4, 'a11');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (0, 0, 'b0'), (0, 2, 'b2'), (0, 4, 'b4');
steps:
  - sql: |
      SELECT sum(t1.a), avg(t1.a), sum(t1.b), avg(t1.b) FROM prt1 t1 WHERE NOT EXISTS (SELECT 1 FROM prt2 t2 WHERE t1.a = t2.b)
    expect: rows
    order: multiset
    comment: rows a = 0 and a = 2 match b values and are excluded; only a = 11 survives
  - sql: |
      SELECT sum(t1.a), avg(t1.a), count(*) FROM prt1 t1 WHERE NOT EXISTS (SELECT 1 FROM prt2 t2 WHERE t1.a = t2.b AND t2.a = 0) AND t1.a > 1000
    expect: rows
    order: multiset
    comment: empty input, so sum and avg are NULL and count(*) is 0
