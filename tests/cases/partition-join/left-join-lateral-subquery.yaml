# LEFT JOIN LATERAL over partitioned tables: the lateral subquery references the outer row and its NULL-extended output.
id: partition-join.left-join-lateral-subquery
title: LEFT JOIN LATERAL with a correlated join subquery over partitioned tables
family: partition-join
tier: extended
feature_ids: [joins, outer-join, lateral, subqueries, partitioning, nulls, select]
required_capabilities: [create-table, insert, select, partitioning, joins, lateral]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (lateral reference section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (2, 0, 'a2'), (11, 1, 'a11');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (0, 0, 'b0'), (2, 5, 'b5'), (3, 11, 'b11');
steps:
  - sql: |
      SELECT * FROM prt1 t1 LEFT JOIN LATERAL (SELECT t2.a AS t2a, t3.a AS t3a, least(t1.a, t2.a, t3.b) AS m FROM prt1 t2 JOIN prt2 t3 ON (t2.a = t3.b)) ss ON t1.a = ss.t2a WHERE t1.b = 0 ORDER BY t1.a, ss.t3a
    expect: rows
    order: ordered
    comment: the lateral subquery is re-evaluated per t1 row, and least() sees the outer t1.a
  - sql: |
      SELECT t1.a, count(ss.t2a) AS matches FROM prt1 t1 LEFT JOIN LATERAL (SELECT t2.a AS t2a FROM prt2 t2 WHERE t2.b > t1.a) ss ON true GROUP BY t1.a ORDER BY t1.a
    expect: rows
    order: ordered
    comment: rows with no lateral matches still appear, with count(ss.t2a) equal to 0
