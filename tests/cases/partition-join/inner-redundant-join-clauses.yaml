# Partially redundant join clauses across partitioned tables: the extra equality must still filter.
id: partition-join.inner-redundant-join-clauses
title: Redundant equality join clauses across partitioned tables filter as written
family: partition-join
tier: extended
feature_ids: [joins, inner-join, partitioning, select]
required_capabilities: [create-table, insert, select, partitioning, joins]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (partially-redundant join clauses section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (2, 2, 'a2'), (4, 0, 'a4'), (11, 1, 'a11');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (0, 0, 'b0'), (2, 2, 'b2'), (4, 11, 'b11'), (11, 11, 'b11x');
steps:
  - sql: |
      SELECT t1.a, t1.c, t2.b, t2.c FROM prt1 t1, prt2 t2 WHERE t1.a = t2.a AND t1.a = t2.b ORDER BY t1.a, t2.b
    expect: rows
    order: ordered
    comment: t1.a = t2.a and t1.a = t2.b together imply t2.a = t2.b
  - sql: |
      SELECT count(*) FROM prt1 t1 JOIN prt2 t2 ON t1.a = t2.a AND t1.a = t2.b
    expect: rows
    order: multiset
