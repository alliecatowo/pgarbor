# RIGHT JOIN where a WHERE clause on the nullable (left) side must reject NULL-extended rows.
id: partition-join.right-join-nullable-side-filter
title: RIGHT JOIN between partitioned tables with WHERE filters on the preserved and nullable sides
family: partition-join
tier: core
feature_ids: [joins, outer-join, right-join, partitioning, nulls, select]
required_capabilities: [create-table, insert, select, partitioning, joins]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (right outer join section)"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt1_p2 PARTITION OF prt1 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (2, 2, 'a2'), (11, 1, 'a11');
  CREATE TABLE prt2 (a int, b int, c varchar) PARTITION BY RANGE(b);
  CREATE TABLE prt2_p1 PARTITION OF prt2 FOR VALUES FROM (0) TO (10);
  CREATE TABLE prt2_p2 PARTITION OF prt2 FOR VALUES FROM (10) TO (20);
  INSERT INTO prt2 VALUES (0, 0, 'b0'), (0, 2, 'b2'), (1, 11, 'b11'), (0, 15, 'b15');
steps:
  - sql: |
      SELECT t1.a, t1.c, t2.b, t2.c FROM prt1 t1 RIGHT JOIN prt2 t2 ON t1.a = t2.b WHERE t2.a = 0 ORDER BY t1.a, t2.b
    expect: rows
    order: ordered
    comment: preserved side is prt2; NULL-extended t1 columns must survive the filter on t2
  - sql: |
      SELECT t1.a, t2.b FROM prt1 t1 RIGHT JOIN prt2 t2 ON t1.a = t2.b WHERE t1.c = 'a2' ORDER BY t2.b
    expect: rows
    order: ordered
    comment: a filter on the nullable side removes the NULL-extended rows (acts as inner join)
