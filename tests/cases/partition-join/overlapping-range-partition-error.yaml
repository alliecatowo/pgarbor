# Creating a range partition that overlaps an existing one is rejected; the partitioned table keeps its prior partitions.
id: partition-join.overlapping-range-partition-error
title: Overlapping range partition on a join-target table raises 42P17 and leaves existing partitions intact
family: partition-join
tier: core
feature_ids: [partitioning, range-partitioning, create-table, errors, select]
required_capabilities: [create-table, insert, select, partitioning]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/partition_join.sql (table setup); PG18 errcodes 42P17 invalid_object_definition"
sessions: [a]
setup: |
  CREATE TABLE prt1 (a int, b int, c varchar) PARTITION BY RANGE(a);
  CREATE TABLE prt1_p1 PARTITION OF prt1 FOR VALUES FROM (0) TO (10);
  INSERT INTO prt1 VALUES (0, 0, 'a0'), (9, 0, 'a9');
steps:
  - sql: |
      CREATE TABLE prt1_bad PARTITION OF prt1 FOR VALUES FROM (5) TO (15)
    expect: error
    sqlstate: "42P17"
    comment: range [5, 15) overlaps existing partition [0, 10)
  - sql: |
      SELECT a, c FROM prt1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM prt1_p1
    expect: rows
    order: multiset
    comment: prt1_p1 is unchanged by the failed attach
