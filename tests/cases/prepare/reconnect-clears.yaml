# Prepared statements are session state: they do not survive a reconnect.
id: prepare.reconnect-clears
title: Prepared statements are gone after the session reconnects
family: prepare
tier: core
feature_ids: [prepared-statements, execute, sessions, errors]
required_capabilities: [select, prepared-statements, reconnect]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q1 AS SELECT 1 AS a
    expect: ok
  - reconnect: true
  - sql: |
      EXECUTE q1
    expect: error
    sqlstate: "26000"
