# Naming an unknown type in PREPARE fails with undefined_object (42704) and creates nothing.
id: prepare.invalid-type
title: PREPARE with an unknown parameter type fails with 42704
family: prepare
tier: core
feature_ids: [prepared-statements, errors, types]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q4(nonexistenttype) AS SELECT $1
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) FROM pg_prepared_statements WHERE name = 'q4'
    expect: rows
    comment: nothing was registered under q4
