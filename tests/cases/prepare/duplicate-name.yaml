# Preparing a second statement under a name already in use fails; the original survives.
id: prepare.duplicate-name
title: PREPARE with an existing name fails with duplicate_prepared_statement
family: prepare
tier: core
feature_ids: [prepared-statements, errors, execute]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q1 AS SELECT 1
    expect: ok
  - sql: |
      PREPARE q1 AS SELECT 2
    expect: error
    sqlstate: "42P05"
  - sql: |
      EXECUTE q1
    expect: rows
    comment: the original statement is still in place
