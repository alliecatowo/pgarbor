# Parameters declared without types take their types from context; visible in pg_prepared_statements.
id: prepare.infer-param-types
title: Untyped parameters are inferred from column context and reported in the view
family: prepare
tier: core
feature_ids: [prepared-statements, catalog-introspection, parameters, types]
required_capabilities: [create-table, select, prepared-statements, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE u (k text, v int8);
steps:
  - sql: |
      PREPARE q6 AS SELECT k FROM u WHERE k = $1 AND v = $2
    expect: ok
  - sql: |
      SELECT name, parameter_types::text, result_types::text FROM pg_prepared_statements ORDER BY name
    expect: rows
    order: ordered
