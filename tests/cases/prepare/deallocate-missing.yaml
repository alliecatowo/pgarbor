# DEALLOCATE and EXECUTE of an unknown prepared statement fail with invalid_sql_statement_name.
id: prepare.deallocate-missing
title: DEALLOCATE or EXECUTE of an unknown name fails with 26000
family: prepare
tier: core
feature_ids: [prepared-statements, deallocate, execute, errors]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      DEALLOCATE nosuch
    expect: error
    sqlstate: "26000"
  - sql: |
      EXECUTE nosuch
    expect: error
    sqlstate: "26000"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    comment: the session is not aborted by these autocommit errors
