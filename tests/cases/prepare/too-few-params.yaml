# EXECUTE with the wrong number of arguments is a protocol violation (08P01).
id: prepare.too-few-params
title: EXECUTE with too few or too many arguments fails with 08P01
family: prepare
tier: core
feature_ids: [prepared-statements, execute, parameters, errors]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q3(text, int, float, boolean, smallint) AS SELECT $1, $2, $3, $4, $5
    expect: ok
  - sql: |
      EXECUTE q3('x', 1, 1.5, false, 1)
    expect: rows
  - sql: |
      EXECUTE q3('bool')
    expect: error
    sqlstate: "08P01"
  - sql: |
      EXECUTE q3('a', 1, 1.5, false, 1, true)
    expect: error
    sqlstate: "08P01"
