# CREATE TABLE AS EXECUTE materializes the rows; WITH NO DATA creates an empty table.
id: prepare.ctas-execute
title: CREATE TABLE AS EXECUTE with and without data
family: prepare
tier: extended
feature_ids: [prepared-statements, execute, create-table-as, select]
required_capabilities: [create-table, insert, select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      PREPARE q5(int) AS SELECT id, name FROM t WHERE id > $1 ORDER BY id
    expect: ok
  - sql: |
      CREATE TABLE r1 AS EXECUTE q5(1)
    expect: ok
  - sql: |
      SELECT id, name FROM r1 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE r2 AS EXECUTE q5(1) WITH NO DATA
    expect: ok
  - sql: |
      SELECT count(*) FROM r2
    expect: rows
