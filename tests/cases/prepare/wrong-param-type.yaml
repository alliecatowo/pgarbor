# An EXECUTE argument that cannot be read as the declared parameter type fails with 22P02.
id: prepare.wrong-param-type
title: EXECUTE with a non-integer literal for an int parameter fails with 22P02
family: prepare
tier: extended
feature_ids: [prepared-statements, execute, parameters, types, errors]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q(int) AS SELECT $1 + 1 AS r
    expect: ok
  - sql: |
      EXECUTE q('abc')
    expect: error
    sqlstate: "22P02"
  - sql: |
      EXECUTE q(41)
    expect: rows
