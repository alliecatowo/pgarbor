# A prepared UPDATE with a NULL assignment, then the table state is read back.
id: prepare.dml-update
title: Prepared UPDATE with parameters, including assigning NULL
family: prepare
tier: core
feature_ids: [prepared-statements, execute, update, null-semantics]
required_capabilities: [create-table, insert, update, select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two');
steps:
  - sql: |
      PREPARE upd(int, text) AS UPDATE t SET name = $2 WHERE id = $1
    expect: ok
  - sql: |
      EXECUTE upd(1, 'uno')
    expect: ok
  - sql: |
      EXECUTE upd(2, NULL)
    expect: ok
  - sql: |
      SELECT id, name, name IS NULL AS name_null FROM t ORDER BY id
    expect: rows
    order: ordered
