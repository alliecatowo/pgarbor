# pg_prepared_statements lists the session's prepared statements with parameter and result types.
id: prepare.catalog-view
title: pg_prepared_statements reflects PREPARE with and without parameters
family: prepare
tier: core
feature_ids: [prepared-statements, catalog-introspection, execute]
required_capabilities: [select, prepared-statements, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT name, statement, parameter_types, result_types FROM pg_prepared_statements ORDER BY name
    expect: rows
    order: ordered
    comment: empty view at the start of a fresh session
  - sql: |
      PREPARE q1 AS SELECT 1 AS a
    expect: ok
  - sql: |
      PREPARE q2(text) AS SELECT $1::text || '!' AS b
    expect: ok
  - sql: |
      SELECT name, statement, parameter_types::text, result_types::text FROM pg_prepared_statements ORDER BY name
    expect: rows
    order: ordered
    normalize: []
