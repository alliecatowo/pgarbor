# Basic PREPARE / EXECUTE / DEALLOCATE of a constant query (SQL-level prepared statements).
id: prepare.execute-basic
title: PREPARE a constant query, EXECUTE it, then DEALLOCATE
family: prepare
tier: slice
feature_ids: [prepared-statements, execute, deallocate, select]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q1 AS SELECT 1 AS a;
    expect: ok
  - sql: |
      EXECUTE q1;
    expect: rows
  - sql: |
      DEALLOCATE q1;
    expect: ok
