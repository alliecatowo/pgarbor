# Parameterized SELECT over a small table; a NULL parameter matches nothing under equality.
id: prepare.parameterized-select
title: Parameterized SELECT with text parameter, including NULL and no-match
family: prepare
tier: core
feature_ids: [prepared-statements, execute, select, where, null-semantics]
required_capabilities: [create-table, insert, select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text, n int8);
  INSERT INTO t VALUES (1, 'a', 10), (2, 'b', NULL), (3, NULL, 30);
steps:
  - sql: |
      PREPARE q2(text) AS SELECT id, name, n FROM t WHERE name = $1 ORDER BY id
    expect: ok
  - sql: |
      EXECUTE q2('a')
    expect: rows
    order: ordered
  - sql: |
      EXECUTE q2(NULL)
    expect: rows
    order: ordered
    comment: name = NULL is never true, so zero rows
  - sql: |
      EXECUTE q2('zzz')
    expect: rows
    order: ordered
