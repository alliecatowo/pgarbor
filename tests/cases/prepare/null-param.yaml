# NULL as an EXECUTE argument: IS NULL is true, arithmetic propagates NULL.
id: prepare.null-param
title: NULL and non-NULL arguments through a prepared integer parameter
family: prepare
tier: core
feature_ids: [prepared-statements, execute, parameters, null-semantics]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q(int) AS SELECT $1 IS NULL AS isnull, $1 + 1 AS plus
    expect: ok
  - sql: |
      EXECUTE q(NULL)
    expect: rows
    comment: isnull true, plus NULL
  - sql: |
      EXECUTE q(41)
    expect: rows
    comment: isnull false, plus 42
