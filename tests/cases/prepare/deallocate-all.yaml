# DEALLOCATE ALL removes every prepared statement of the session.
id: prepare.deallocate-all
title: DEALLOCATE ALL empties pg_prepared_statements
family: prepare
tier: core
feature_ids: [prepared-statements, deallocate, catalog-introspection]
required_capabilities: [select, prepared-statements, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q1 AS SELECT 1
    expect: ok
  - sql: |
      PREPARE q2 AS SELECT 2
    expect: ok
  - sql: |
      SELECT name FROM pg_prepared_statements ORDER BY name
    expect: rows
    order: ordered
  - sql: |
      DEALLOCATE ALL
    expect: ok
  - sql: |
      SELECT name FROM pg_prepared_statements ORDER BY name
    expect: rows
    order: ordered
