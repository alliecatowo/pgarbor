# A name can be reused after DEALLOCATE; both DEALLOCATE spellings are accepted.
id: prepare.deallocate-reuse
title: DEALLOCATE frees the name for reuse; DEALLOCATE PREPARE spelling works
family: prepare
tier: core
feature_ids: [prepared-statements, deallocate, execute, catalog-introspection]
required_capabilities: [select, prepared-statements, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/prepare.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      PREPARE q1 AS SELECT 1 AS a
    expect: ok
  - sql: |
      DEALLOCATE q1
    expect: ok
  - sql: |
      PREPARE q1 AS SELECT 2 AS a
    expect: ok
  - sql: |
      EXECUTE q1
    expect: rows
  - sql: |
      DEALLOCATE PREPARE q1
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_prepared_statements
    expect: rows
