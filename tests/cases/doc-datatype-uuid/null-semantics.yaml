# NULL uuid values: comparisons yield NULL, NOT NULL and primary key reject NULL (23502), UNIQUE admits several NULLs.
id: doc-datatype-uuid.null-semantics
title: NULL uuid comparison, NOT NULL and primary key semantics
family: doc-datatype-uuid
tier: core
feature_ids: [uuid, null-semantics, constraints, primary-key]
required_capabilities: [create-table, insert, select, constraints, errors]
provenance:
  source: hand
  ref: "PG18 functions-comparison.html (NULL comparisons); ddl-constraints.html (NOT NULL, PRIMARY KEY); errcodes 23502"
sessions: [a]
setup: |
  CREATE TABLE u_null (pk uuid PRIMARY KEY, v uuid UNIQUE);
  INSERT INTO u_null VALUES ('11111111-1111-1111-1111-111111111111', NULL),
    ('22222222-2222-2222-2222-222222222222', NULL),
    ('33333333-3333-3333-3333-333333333333', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa');
steps:
  - sql: |
      SELECT NULL::uuid = NULL::uuid AS eq, NULL::uuid IS DISTINCT FROM NULL::uuid AS distinct_from,
             NULL::uuid IS NULL AS is_null, NULL::uuid IS NOT NULL AS is_not_null
    expect: rows
  - sql: |
      SELECT pk::text, v IS NULL AS v_null FROM u_null ORDER BY v NULLS LAST, pk
    expect: rows
    order: ordered
    comment: NULLS LAST is the ascending default; the two NULLs tie-break on pk
  - sql: |
      SELECT count(*) AS all_rows, count(v) AS non_null_v FROM u_null
    expect: rows
  - sql: |
      INSERT INTO u_null VALUES (NULL, 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb')
    expect: error
    sqlstate: "23502"
    comment: primary key columns are implicitly NOT NULL
  - sql: |
      INSERT INTO u_null VALUES ('44444444-4444-4444-4444-444444444444', NULL)
    expect: ok
    comment: UNIQUE admits multiple NULLs by default (NULLS DISTINCT)
  - sql: |
      SELECT count(*) FROM u_null WHERE v = NULL
    expect: rows
    comment: equality with NULL never matches
