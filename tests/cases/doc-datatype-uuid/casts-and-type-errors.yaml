# uuid casts to and from text; no implicit or explicit cast from integer; mismatched operators fail with the documented SQLSTATEs.
id: doc-datatype-uuid.casts-and-type-errors
title: uuid text casts round-trip, and integer or malformed-text uses fail
family: doc-datatype-uuid
tier: core
feature_ids: [uuid, casts, text, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-uuid; PG18 sql-createcast / type-conversion (no int4 -> uuid cast)"
sessions: [a]
steps:
  - sql: |
      SELECT 'A0EEBC99-9C0B-4EF8-BB6D-6BB9BD380A11'::uuid::text AS up_to_text,
             'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::text::uuid::varchar AS text_to_varchar,
             CAST('{a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11}' AS uuid)::text AS cast_fn
    expect: rows
  - sql: |
      SELECT 123::uuid
    expect: error
    sqlstate: "42846"
    comment: no cast from integer to uuid
  - sql: |
      SELECT 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid = 1
    expect: error
    sqlstate: "42883"
    comment: no uuid = integer operator
  - sql: |
      SELECT 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid + 1
    expect: error
    sqlstate: "42883"
    comment: uuid has no arithmetic operators
  - sql: |
      SELECT 'nope'::uuid
    expect: error
    sqlstate: "22P02"
    comment: a non-uuid literal cast to uuid fails
