# Native generators: gen_random_uuid()/uuidv4() yield version 4, uuidv7() yields version 7; checked only through deterministic properties.
id: doc-datatype-uuid.generation-versions
title: Native UUIDv4 and UUIDv7 generators produce the documented RFC 9562 versions
family: doc-datatype-uuid
tier: extended
feature_ids: [uuid, uuid-generation, uuidv4, uuidv7]
required_capabilities: [select, uuid-generation]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-uuid (native support for UUIDv4 and UUIDv7); functions-uuid"
sessions: [a]
steps:
  - sql: |
      SELECT uuid_extract_version(gen_random_uuid()) AS v4_from_gen,
             uuid_extract_version(uuidv4()) AS v4_from_uuidv4,
             uuid_extract_version(uuidv7()) AS v7_from_uuidv7,
             substr(uuidv7()::text, 15, 1) AS v7_nibble
    expect: rows
    comment: version values are deterministic; the generated values themselves are never printed
  - sql: |
      SELECT uuid_extract_version(NULL::uuid) AS null_in_null_out,
             uuid_extract_version('11111111-1111-1111-1111-111111111111'::uuid) AS non_rfc_variant
    expect: rows
    comment: non-RFC variant yields NULL
  - sql: |
      SELECT count(*) AS ok FROM (SELECT uuidv7() AS u FROM generate_series(1, 20)) AS s
      WHERE uuid_extract_version(u) = 7
    expect: rows
