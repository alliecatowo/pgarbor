# uuid is a fixed 128-bit (16-byte) type: catalog length is 16 and stored values occupy 16 bytes whatever the input spelling.
id: doc-datatype-uuid.storage-fixed-16-bytes
title: uuid is fixed-length 16 bytes in the catalog and on disk
family: doc-datatype-uuid
tier: core
feature_ids: [uuid, storage, catalog]
required_capabilities: [create-table, insert, select, catalog]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-uuid (a 128-bit quantity)"
setup: |
  CREATE TABLE u_sz (id uuid, label text);
  INSERT INTO u_sz VALUES
    ('a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11', 'x'),
    ('{A0EEBC99-9C0B-4EF8-BB6D-6BB9BD380A11}', 'y'),
    ('00000000000000000000000000000000', 'z');
steps:
  - sql: |
      SELECT typname, typlen, typbyval FROM pg_type WHERE typname = 'uuid'
    expect: rows
  - sql: |
      SELECT label, pg_column_size(id) AS stored_bytes FROM u_sz ORDER BY label
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_column_size('a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid) AS literal_bytes,
             sum(pg_column_size(id)) AS total_bytes
      FROM u_sz
    expect: rows
