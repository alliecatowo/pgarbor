# Every input spelling listed in the uuid section (upper case, braces, no hyphens, extra hyphens) denotes the same value.
id: doc-datatype-uuid.input-documented-forms
title: Documented uuid input forms all parse to the same standard-form value
family: doc-datatype-uuid
tier: core
feature_ids: [uuid, uuid-input, uuid-output]
required_capabilities: [select, comparison-operators]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-uuid (alternative input forms)"
sessions: [a]
steps:
  - sql: |
      SELECT n, v::text AS canon, v = 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid AS same_as_standard
      FROM (VALUES
        (1, 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid),
        (2, 'A0EEBC99-9C0B-4EF8-BB6D-6BB9BD380A11'::uuid),
        (3, '{a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11}'::uuid),
        (4, 'a0eebc999c0b4ef8bb6d6bb9bd380a11'::uuid),
        (5, 'a0ee-bc99-9c0b-4ef8-bb6d-6bb9-bd38-0a11'::uuid),
        (6, '{a0eebc99-9c0b4ef8-bb6d6bb9-bd380a11}'::uuid)
      ) AS t(n, v)
      ORDER BY n
    expect: rows
    order: ordered
    comment: output is always the standard lower-case hyphenated form
