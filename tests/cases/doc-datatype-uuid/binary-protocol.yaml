# Binary wire format for uuid: the 16 raw bytes travel as a 32-digit lowercase hex parameter and come back as 16 bytes.
id: doc-datatype-uuid.binary-protocol
title: uuid bound and returned in binary format round-trips the 16 raw bytes
family: doc-datatype-uuid
tier: extended
feature_ids: [uuid, extended-protocol, binary-format, prepared-statements]
required_capabilities: [create-table, insert, select, extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-message-formats.html (Bind binary parameter formats); datatype.sgml#datatype-uuid"
sessions: [a]
setup: |
  CREATE TABLE u_bin (id uuid PRIMARY KEY, label text);
  INSERT INTO u_bin VALUES ('a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11', 'target'), ('11111111-1111-1111-1111-111111111111', 'other');
steps:
  - exec_params:
      sql: |
        SELECT label FROM u_bin WHERE id = $1
      params: ["a0eebc999c0b4ef8bb6d6bb9bd380a11"]
      param_types: [2950]
      param_formats: [binary]
    expect: rows
    order: ordered
    comment: 16 bytes in binary; equals the text-format standard value
  - exec_params:
      sql: |
        SELECT id FROM u_bin ORDER BY id
      param_types: []
      result_format: binary
    expect: rows
    order: ordered
    comment: binary result is the raw 16 bytes per row
