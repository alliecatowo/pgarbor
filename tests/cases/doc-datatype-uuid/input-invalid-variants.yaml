# Malformed spellings outside the documented forms are rejected with 22P02 (invalid_text_representation).
id: doc-datatype-uuid.input-invalid-variants
title: Malformed uuid spellings (brace, length, hyphen, whitespace) raise 22P02
family: doc-datatype-uuid
tier: core
feature_ids: [uuid, uuid-input, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-uuid (accepted alternative forms; output always standard)"
sessions: [a]
steps:
  - sql: |
      SELECT '{a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid
    expect: error
    sqlstate: "22P02"
    comment: opening brace without closing brace
  - sql: |
      SELECT 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11}'::uuid
    expect: error
    sqlstate: "22P02"
    comment: closing brace without opening brace
  - sql: |
      SELECT 'a0eebc999c0b4ef8bb6d6bb9bd380a111'::uuid
    expect: error
    sqlstate: "22P02"
    comment: 33 hex digits
  - sql: |
      SELECT 'a0eebc999c0b4ef8bb6d6bb9bd380a1'::uuid
    expect: error
    sqlstate: "22P02"
    comment: 31 hex digits
  - sql: |
      SELECT 'a0-eebc99-9c0b4ef8bb6d6bb9bd380a11'::uuid
    expect: error
    sqlstate: "22P02"
    comment: hyphen after two digits is not a documented grouping
  - sql: |
      SELECT 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11-'::uuid
    expect: error
    sqlstate: "22P02"
    comment: trailing hyphen
  - sql: |
      SELECT 'a0eebc99 9c0b-4ef8-bb6d-6bb9bd380a11'::uuid
    expect: error
    sqlstate: "22P02"
    comment: embedded space
  - sql: |
      SELECT ''::uuid
    expect: error
    sqlstate: "22P02"
    comment: empty string
  - sql: |
      SELECT 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a1z'::uuid
    expect: error
    sqlstate: "22P02"
    comment: non-hex character at the end
