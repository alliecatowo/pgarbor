# The documented way to nest work inside a block is SAVEPOINT; rolling back to one discards only the work after it.
id: cmd-begin.savepoint-nesting
title: Work after a savepoint inside a BEGIN block is discarded by ROLLBACK TO while earlier work commits
family: cmd-begin
tier: core
feature_ids: [begin, savepoint, rollback-to, commit, transactions, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (Notes: to nest transactions within a transaction block, use savepoints)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SAVEPOINT s1
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      ROLLBACK TO SAVEPOINT s1
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
