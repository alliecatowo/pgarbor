# An unknown transaction mode is a syntax error and no transaction block is started.
id: cmd-begin.invalid-isolation-level
title: BEGIN with an unknown isolation level is a syntax error and starts no block
family: cmd-begin
tier: core
feature_ids: [begin, isolation-level, errors]
required_capabilities: [transactions, select, errors]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (synopsis: ISOLATION LEVEL { SERIALIZABLE | REPEATABLE READ | READ COMMITTED | READ UNCOMMITTED })"
sessions: [a]
steps:
  - sql: |
      BEGIN ISOLATION LEVEL SNAPSHOT
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
    comment: autocommit again, so this is not inside an aborted block
