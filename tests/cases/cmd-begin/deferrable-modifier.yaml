# NOT DEFERRABLE is the default; DEFERRABLE on a non-serializable transaction is accepted and has no effect on the level.
id: cmd-begin.deferrable-modifier
title: DEFERRABLE and NOT DEFERRABLE are accepted modes and are reported by transaction_deferrable
family: cmd-begin
tier: extended
feature_ids: [begin, deferrable, transaction-modes, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (synopsis: [ NOT ] DEFERRABLE; Compatibility: DEFERRABLE is a PostgreSQL extension)"
sessions: [a]
steps:
  - sql: |
      BEGIN NOT DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_deferrable') AS d
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN ISOLATION LEVEL READ COMMITTED DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_deferrable') AS d
    expect: rows
    order: ordered
    comment: no error is raised; the level stays read committed
  - sql: |
      COMMIT
    expect: ok
