# Inside a block that has already run a query, BEGIN with an isolation level warns and then fails: the level can no longer change.
id: cmd-begin.nested-begin-after-query
title: BEGIN ISOLATION LEVEL inside a block after a query fails with 25001
family: cmd-begin
tier: extended
feature_ids: [begin, isolation-level, transactions, errors]
required_capabilities: [select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (Notes: nested BEGIN warns); ref/set-transaction.sgml (isolation level must be set before any query)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE
    expect: error
    sqlstate: "25001"
    comment: WARNING already in progress then ERROR "SET TRANSACTION ISOLATION LEVEL must be called before any query"
  - sql: |
      ROLLBACK
    expect: ok
