# READ WRITE is the default access mode and must allow writes inside the block.
id: cmd-begin.read-write-explicit
title: BEGIN READ WRITE allows writes that commit normally
family: cmd-begin
tier: core
feature_ids: [begin, read-write, transaction-modes, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (synopsis: READ WRITE | READ ONLY)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN READ WRITE
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
