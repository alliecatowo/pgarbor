# BEGIN starts a transaction block; statements are grouped until COMMIT, and the committed rows persist.
id: cmd-begin.basic-commit
title: BEGIN groups statements until COMMIT and the committed rows persist
family: cmd-begin
tier: core
feature_ids: [begin, commit, transactions, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (Description; Examples: To begin a transaction block)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
steps:
  - sql: |
      BEGIN;
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1, 'one'), (2, 'two')
    expect: ok
  - sql: |
      SELECT id, name FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: rows are visible to the transaction that wrote them
  - sql: |
      COMMIT
    expect: ok
  - reconnect: true
  - sql: |
      SELECT id, name FROM t ORDER BY id
    expect: rows
    order: ordered
