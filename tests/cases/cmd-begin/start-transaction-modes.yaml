# START TRANSACTION accepts the same mode list as BEGIN, including READ ONLY and an isolation level, and the result is the same.
id: cmd-begin.start-transaction-modes
title: START TRANSACTION with READ ONLY and an isolation level gives the same block as BEGIN
family: cmd-begin
tier: extended
feature_ids: [start-transaction, begin, read-only, isolation-level, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (Notes: START TRANSACTION has the same functionality as BEGIN)"
sessions: [a]
steps:
  - sql: |
      START TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
