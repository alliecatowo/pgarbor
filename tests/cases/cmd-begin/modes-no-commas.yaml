# Transaction modes may be listed without commas; the new transaction gets those characteristics as if SET TRANSACTION had run.
id: cmd-begin.modes-no-commas
title: BEGIN accepts isolation, read-only and deferrable modes without separating commas
family: cmd-begin
tier: core
feature_ids: [begin, transaction-modes, isolation-level, read-only, deferrable, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (Notes: commas between transaction_modes can be omitted; Description)"
sessions: [a]
steps:
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE READ ONLY DEFERRABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso,
             current_setting('transaction_read_only') AS ro,
             current_setting('transaction_deferrable') AS deferrable
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
