# WORK and TRANSACTION are optional noise words; START TRANSACTION is the same command as BEGIN.
id: cmd-begin.keyword-variants
title: BEGIN WORK, BEGIN TRANSACTION and START TRANSACTION all open a transaction block
family: cmd-begin
tier: core
feature_ids: [begin, start-transaction, commit, transactions]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (Parameters; Notes: START TRANSACTION has the same functionality)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN WORK
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      COMMIT WORK
    expect: ok
  - sql: |
      BEGIN TRANSACTION
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      START TRANSACTION
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
