# Each ISOLATION LEVEL keyword sets the new transaction's level; READ UNCOMMITTED is accepted and reported as its own name.
id: cmd-begin.isolation-levels
title: BEGIN ISOLATION LEVEL sets the level reported for the new transaction
family: cmd-begin
tier: core
feature_ids: [begin, isolation-level, serializable, repeatable-read, read-committed, read-uncommitted, guc]
required_capabilities: [transactions, select, guc]
provenance:
  source: pg-docs
  ref: "ref/begin.sgml#sql-begin (synopsis: ISOLATION LEVEL; Description: as if SET TRANSACTION was executed)"
sessions: [a]
steps:
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN ISOLATION LEVEL READ COMMITTED
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN ISOLATION LEVEL READ UNCOMMITTED
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
    comment: outside any block the session default applies again
