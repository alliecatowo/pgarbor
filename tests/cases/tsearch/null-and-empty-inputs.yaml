# NULL and empty inputs to text search functions and operators.
id: tsearch.null-and-empty-inputs
title: NULL and empty inputs propagate or match nothing
family: tsearch
tier: core
feature_ids: [tsearch, null-handling, to-tsvector]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT to_tsvector('english', NULL) IS NULL AS null_doc,
             to_tsvector('english', '')::text AS empty_doc,
             to_tsvector('english', '') @@ to_tsquery('english', 'fox') AS empty_nomatch,
             NULL::tsvector @@ to_tsquery('english', 'fox') AS null_doc_match,
             to_tsvector('english', 'fox') @@ NULL::tsquery AS null_query_match
    expect: rows
    order: ordered
