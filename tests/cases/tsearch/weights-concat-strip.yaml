# setweight, tsvector concatenation (merging duplicate lexemes), strip and numnode.
id: tsearch.weights-concat-strip
title: setweight, tsvector concatenation, strip and numnode
family: tsearch
tier: core
feature_ids: [tsearch, setweight, tsvector-concat, strip]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT (setweight(to_tsvector('simple', 'cat'), 'A') || to_tsvector('simple', 'dog cat'))::text AS merged,
             strip(to_tsvector('simple', 'fox jumps'))::text AS stripped,
             numnode(to_tsquery('english', 'fox & dog')) AS nodes
    expect: rows
    order: ordered
