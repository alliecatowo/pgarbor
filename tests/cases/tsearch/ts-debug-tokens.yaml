# ts_debug splits text into tokens with an alias, a token and a lexeme array per token.
id: tsearch.ts-debug-tokens
title: ts_debug token aliases for simple text
family: tsearch
tier: extended
feature_ids: [tsearch, parser, ts-debug]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT alias, token, lexemes FROM ts_debug('simple', 'foo 42 bar')
    expect: rows
    order: multiset
