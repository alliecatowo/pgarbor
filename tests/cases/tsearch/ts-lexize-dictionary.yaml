# ts_lexize shows the english_stem dictionary output for a stemmable word, a stop word and a plain word.
id: tsearch.ts-lexize-dictionary
title: ts_lexize returns stems and empty arrays for stop words
family: tsearch
tier: core
feature_ids: [tsearch, dictionaries, stemming, stop-words]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT ts_lexize('english_stem', 'skies') AS stemmed,
             ts_lexize('english_stem', 'the') AS stop_word,
             ts_lexize('english_stem', 'foxes') AS plural
    expect: rows
    order: ordered
