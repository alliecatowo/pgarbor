# A query made only of stop words produces a NOTICE and an empty tsquery, not an error.
id: tsearch.stopword-only-notice
title: Stop-word-only tsquery emits notice and empty result
family: tsearch
tier: core
feature_ids: [tsearch, to-tsquery, stop-words, notices]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT to_tsquery('english', 'a & the')::text AS q
    expect: notice
