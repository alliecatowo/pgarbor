# Phrase operator <-> (adjacent) and <N> (distance N) against positional tsvectors.
id: tsearch.phrase-distance-operators
title: Phrase <-> and distance <N> operators respect positions
family: tsearch
tier: core
feature_ids: [tsearch, to-tsquery, phrase-search, positions]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH d AS (SELECT to_tsvector('simple', 'qe qt yh pl') AS v)
      SELECT v @@ 'qe <-> qt' AS adjacent_hit,
             v @@ 'qt <-> qe' AS reversed_miss,
             v @@ 'qe <2> yh' AS dist2_hit,
             v @@ 'qe <1> yh' AS dist1_miss,
             v @@ 'pl <-> yh' AS tail_miss
      FROM d
    expect: rows
    order: ordered
