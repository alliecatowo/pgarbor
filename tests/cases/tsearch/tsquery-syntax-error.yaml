# Malformed tsquery text is a syntax error; the connection stays usable afterwards.
id: tsearch.tsquery-syntax-error
title: Malformed tsquery raises syntax error 42601
family: tsearch
tier: core
feature_ids: [tsearch, to-tsquery, errors]
required_capabilities: [select, text-search, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT to_tsquery('english', 'a & | b')
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
