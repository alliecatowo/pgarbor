# to_tsvector lexeme normalization: stemming and stop words under english versus simple configs.
id: tsearch.normalize-english-simple
title: to_tsvector normalizes lexemes differently per configuration
family: tsearch
tier: core
feature_ids: [tsearch, to-tsvector, stemming, stop-words]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT to_tsvector('english', 'The quick brown foxes jumped over 2 lazy dogs')::text AS en,
             to_tsvector('simple', 'The quick brown foxes jumped over 2 lazy dogs')::text AS simp
    expect: rows
    order: ordered
