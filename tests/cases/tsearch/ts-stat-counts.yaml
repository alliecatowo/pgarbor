# ts_stat aggregates document and occurrence counts per lexeme over a tsvector column.
id: tsearch.ts-stat-counts
title: ts_stat counts documents and occurrences per lexeme
family: tsearch
tier: extended
feature_ids: [tsearch, ts-stat, aggregates]
required_capabilities: [create-table, insert, select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE stat_docs (tsv tsvector);
  INSERT INTO stat_docs VALUES
    (to_tsvector('simple', 'fox fox dog')),
    (to_tsvector('simple', 'dog cat')),
    (to_tsvector('simple', 'dog'));
steps:
  - sql: |
      SELECT * FROM ts_stat('SELECT tsv FROM stat_docs') ORDER BY ndoc DESC, nentry DESC, word
    expect: rows
    order: ordered
