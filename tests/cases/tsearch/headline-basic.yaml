# ts_headline highlights matched words; NULL document yields NULL.
id: tsearch.headline-basic
title: ts_headline highlights matches and propagates NULL
family: tsearch
tier: core
feature_ids: [tsearch, headline, to-tsquery]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT ts_headline('english', 'The quick brown fox jumps over the lazy dog', to_tsquery('english', 'fox & dog')) AS hl,
             ts_headline('english', NULL::text, to_tsquery('english', 'fox')) IS NULL AS null_doc
    expect: rows
    order: ordered
