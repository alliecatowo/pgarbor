# plainto_tsquery, phraseto_tsquery and websearch_to_tsquery build tsqueries from plain text.
id: tsearch.query-builders
title: plainto, phraseto and websearch query builders
family: tsearch
tier: core
feature_ids: [tsearch, plainto-tsquery, phraseto-tsquery, websearch-tsquery]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT plainto_tsquery('english', 'foo bar')::text AS plain,
             phraseto_tsquery('english', 'PostgreSQL can be extended')::text AS phrase,
             websearch_to_tsquery('english', '"fat rat" -cat or dog')::text AS websearch
    expect: rows
    order: ordered
