# Invalid tsvector literal text (weight letter where a position is expected) is a syntax error.
id: tsearch.tsvector-input-error
title: Invalid tsvector input raises syntax error 42601
family: tsearch
tier: core
feature_ids: [tsearch, tsvector-input, errors]
required_capabilities: [select, text-search, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT 'a:1 b:x'::tsvector
    expect: error
    sqlstate: "42601"
