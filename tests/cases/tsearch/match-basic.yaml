# Basic text search match operator @@ on literal tsvector/tsquery values.
id: tsearch.match-basic
title: Basic tsvector @@ tsquery match and miss
family: tsearch
tier: slice
feature_ids: [tsearch, match-operator, to-tsvector, to-tsquery]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT to_tsvector('english', 'The quick brown foxes') @@ to_tsquery('english', 'fox & quick') AS hit,
             to_tsvector('english', 'The quick brown foxes') @@ to_tsquery('english', 'cat') AS miss
    expect: rows
    order: ordered
