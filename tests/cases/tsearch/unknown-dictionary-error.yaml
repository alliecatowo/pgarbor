# ts_lexize against a dictionary that does not exist is undefined_object 42704.
id: tsearch.unknown-dictionary-error
title: Unknown text search dictionary raises 42704
family: tsearch
tier: extended
feature_ids: [tsearch, dictionaries, errors]
required_capabilities: [select, text-search, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT ts_lexize('no_such_dict_pgarbor', 'fox')
    expect: error
    sqlstate: "42704"
