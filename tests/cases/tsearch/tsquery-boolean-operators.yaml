# Boolean tsquery operators & | ! and grouping, evaluated against one document.
id: tsearch.tsquery-boolean-operators
title: tsquery AND OR NOT and grouping operators
family: tsearch
tier: core
feature_ids: [tsearch, to-tsquery, boolean-operators]
required_capabilities: [select, text-search]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH d AS (SELECT to_tsvector('simple', 'wr qh eq') AS v)
      SELECT v @@ 'wr | zz' AS or_hit,
             v @@ 'wr & zz' AS and_miss,
             v @@ '(eq & zz) | (wr & qh)' AS grouped_hit,
             v @@ '!zz' AS not_absent,
             v @@ '!wr' AS not_present,
             v @@ '(eq | zz) & (wr | yy)' AS cross_group
      FROM d
    expect: rows
    order: ordered
