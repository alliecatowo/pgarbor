# setweight with an unknown weight letter raises an error; the message is recorded, the SQLSTATE is not asserted.
id: tsearch.setweight-invalid-error
title: setweight with an invalid weight letter is rejected
family: tsearch
tier: extended
feature_ids: [tsearch, setweight, errors]
required_capabilities: [select, text-search, errors]
provenance:
  source: hand
  ref: "PG18 textsearch-controls.html setweight; src/test/regress/sql/tsearch.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT setweight(to_tsvector('simple', 'cat'), 'Z')
    expect: error
