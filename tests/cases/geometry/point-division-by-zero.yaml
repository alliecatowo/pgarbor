# Dividing a point by the zero point raises division_by_zero.
id: geometry.point-division-by-zero
title: Dividing a point by the zero point fails with division by zero
family: geometry
tier: core
feature_ids: [geometric-types, point, point-arithmetic, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT point '(1,2)' / point '(0,0)'
    expect: error
    sqlstate: "22012"
    comment: regress "Division by 0 error" for point / point
