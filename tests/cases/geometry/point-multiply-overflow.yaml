# Multiplying points whose product overflows float8 raises out-of-range overflow.
id: geometry.point-multiply-overflow
title: Point multiplication overflowing float8 raises value out of range
family: geometry
tier: extended
feature_ids: [geometric-types, point, point-arithmetic, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT point '(1e200,1e200)' * point '(1e200,1e200)'
    expect: error
    sqlstate: "22003"
    comment: regress "Overflow error" pattern for point * point
