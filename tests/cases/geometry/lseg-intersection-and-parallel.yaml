# Segment intersection point, NULL for parallel segments, and parallel/perpendicular predicates.
id: geometry.lseg-intersection-and-parallel
title: Segment intersection point, NULL for parallel segments, parallel and perpendicular tests
family: geometry
tier: core
feature_ids: [geometric-types, lseg, intersection, parallel-predicate]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT lseg '[(0,0),(2,2)]' # lseg '[(0,2),(2,0)]' AS crossing,
             lseg '[(0,0),(2,2)]' # lseg '[(0,1),(2,3)]' AS parallel_no_point
    expect: rows
    order: ordered
    comment: crossing is (1,1); parallel segments give NULL
  - sql: |
      SELECT lseg '[(0,0),(2,2)]' ?|| lseg '[(0,1),(2,3)]' AS is_parallel,
             lseg '[(0,0),(2,2)]' ?-| lseg '[(0,0),(2,-2)]' AS is_perp
    expect: rows
    order: ordered
  - sql: |
      SELECT lseg '[(0,0),(3,4)]' @-@ lseg '[(0,0),(3,4)]' AS len,
             lseg '[(0,0),(3,4)]' @@ lseg '[(0,0),(3,4)]' AS mid
    expect: rows
    order: ordered
    comment: 3-4-5 segment has length 5 and center (1.5,2)
