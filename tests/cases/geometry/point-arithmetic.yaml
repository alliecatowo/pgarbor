# Point arithmetic: add, subtract, complex-style multiply and divide on exact integer inputs.
id: geometry.point-arithmetic
title: Point addition, subtraction, multiplication and division on exact inputs
family: geometry
tier: core
feature_ids: [geometric-types, point, point-arithmetic]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT point '(1,2)' + point '(3,4)' AS sum,
             point '(5,7)' - point '(3,4)' AS diff,
             point '(1,2)' * point '(3,4)' AS prod,
             point '(4,2)' / point '(1,1)' AS quot
    expect: rows
    order: ordered
    comment: prod is (1*3-2*4, 1*4+2*3) = (-5,10); quot is (3,-1)
