# Circle divided by a zero point raises division_by_zero; circle divided by a nonzero point scales the center.
id: geometry.circle-division-by-zero
title: Circle division by the zero point fails and nonzero point divides the center
family: geometry
tier: core
feature_ids: [geometric-types, circle, point-arithmetic, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT circle '<(4,2),1>' / point '(2,1)' AS quotient
    expect: rows
    order: ordered
    comment: author expects a row; exact radius formatting left to the recorder
  - sql: |
      SELECT circle '<(1,1),1>' / point '(0,0)'
    expect: error
    sqlstate: "22012"
    comment: regress "Division by 0 error" for circle / point
