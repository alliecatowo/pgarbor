# Box normalization, center, bounding box and overlap including edge-touching boxes.
id: geometry.box-bound-and-overlap
title: Box corner normalization, center, bounding box, and touching-box overlap
family: geometry
tier: core
feature_ids: [geometric-types, box, bound-box, overlap-operator]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT center(box '(4,0),(0,2)') AS ctr,
             box '(0,2),(4,0)' = box '(4,0),(0,2)' AS same_box
    expect: rows
    order: ordered
    comment: corners may be given in any order; center is (2,1)
  - sql: |
      SELECT bound_box(box '(0,0),(1,1)', box '(2,2),(3,3)') AS bb
    expect: rows
    order: ordered
  - sql: |
      SELECT box '(0,0),(1,1)' && box '(1,1),(2,2)' AS touch,
             box '(0,0),(1,1)' && box '(2,2),(3,3)' AS apart
    expect: rows
    order: ordered
    comment: boxes sharing only a corner still overlap
  - sql: |
      SELECT box '(0,0),(2,2)' + point '(1,1)' AS moved
    expect: rows
    order: ordered
