# Using # between a segment and a point has no operator, so the query fails at parse/analysis time.
id: geometry.lseg-operator-undefined
title: Intersection operator is undefined between a segment and a point
family: geometry
tier: core
feature_ids: [geometric-types, lseg, operators, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT lseg '[(0,0),(2,2)]' # point '(1,1)'
    expect: error
    sqlstate: "42883"
    comment: regress "operator does not exist - lseg # point"
