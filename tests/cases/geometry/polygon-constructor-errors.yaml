# Polygon construction errors: an open path cannot become a polygon; polygon(n, circle) needs at least 2 points.
id: geometry.polygon-constructor-errors
title: Polygon constructor errors for open paths, too few points, and zero radius
family: geometry
tier: extended
feature_ids: [geometric-types, polygon, path, circle, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT path '[(0,0),(1,1),(2,0)]'::polygon
    expect: error
    comment: regress "Open path cannot be converted to polygon error"; SQLSTATE not pinned here, recorder will report the actual code
  - sql: |
      SELECT polygon(1, circle '<(0,0),1>')
    expect: error
    comment: regress "must request at least 2 points"
  - sql: |
      SELECT polygon(10, circle '<(0,0),0>')
    expect: error
    comment: regress "cannot convert circle with radius zero to polygon"
  - sql: |
      SELECT polygon(path '((0,0),(0,2),(2,2),(2,0))') ~= polygon '((0,0),(0,2),(2,2),(2,0))' AS same
    expect: rows
    order: ordered
    comment: closed (parenthesized) path converts to polygon; polygon equality is the ~= operator (no = operator exists for polygon)
