# Distance from points to a line and to a line segment, plus the closest point on a line.
id: geometry.point-distance-to-line
title: Point distance to a line and to a line segment
family: geometry
tier: core
feature_ids: [geometric-types, point, line, lseg, distance-operator]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/geometry.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT point '(0,0)' <-> line '{1,0,-3}' AS d_line,
             line '{1,0,-3}' <-> point '(0,0)' AS d_line_rev,
             point '(0,0)' <-> lseg '[(0,1),(0,5)]' AS d_seg,
             lseg '[(0,1),(0,5)]' <-> point '(0,0)' AS d_seg_rev
    expect: rows
    order: ordered
    comment: line x=3 is 3 away from origin; segment on the y axis from 1 to 5 is 1 away
  - sql: |
      SELECT point '(0,0)' ## lseg '[(-2,2),(2,2)]' AS closest
    expect: rows
    order: ordered
    comment: closest point of a horizontal segment to the origin is (0,2)
  - sql: |
      SELECT point '(0,0)' <-> lseg '[(0,0),(0,0)]' AS degenerate
    expect: rows
    order: ordered
    comment: zero-length segment behaves like a point
