# Documented json_array constructor, including ABSENT/NULL ON NULL, the query form, and RETURNING; json_build_array is covered in its own case.
id: doc-functions-json.json-array-constructors
title: json_array value-list and subquery forms with ABSENT and NULL ON NULL handling
family: doc-functions-json
tier: core
feature_ids: [json-array, sql-json-constructor, json-array-null-handling]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-json-creation (json_array row)"
sessions: [a]
steps:
  - sql: |
      SELECT json_array(1, true, json '{"a":null}') AS documented_mix,
             json_array() AS empty_arr
    expect: rows
  - sql: |
      SELECT json_array(SELECT * FROM (VALUES(1),(2)) t) AS from_query
    expect: rows
    comment: "documented query form: the subquery must return a single column"
  - sql: |
      SELECT json_array(1, NULL ABSENT ON NULL) AS absent_nulls,
             json_array(1, NULL NULL ON NULL) AS null_nulls,
             json_array(1, NULL) AS default_nulls
    expect: rows
    comment: "documented SQL-standard default for json_array is ABSENT ON NULL, so the default form drops NULLs"
  - sql: |
      SELECT json_array(1, 2 RETURNING text) AS returning_text,
             json_array('a' RETURNING jsonb) AS returning_jsonb
    expect: rows
