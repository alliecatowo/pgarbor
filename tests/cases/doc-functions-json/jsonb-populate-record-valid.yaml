# Documented jsonb_populate_record_valid: checks whether jsonb_populate_record would succeed, and the value-too-long error for char(2).
id: doc-functions-json.jsonb-populate-record-valid
title: jsonb_populate_record_valid reports whether population would fail on a char(2) column
family: doc-functions-json
tier: core
feature_ids: [jsonb-populate-record-valid, jsonb-populate-record, composite-types]
required_capabilities: [select, jsonb, create-type, composite-types, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-json-processing (jsonb_populate_record_valid)"
sessions: [a]
setup: |
  CREATE TYPE jsb_char2 AS (a char(2));
steps:
  - sql: |
      SELECT jsonb_populate_record_valid(NULL::jsb_char2, '{"a": "aaa"}') AS too_long_valid
    expect: rows
    comment: "documented: false for a value that is too long for char(2)"
  - sql: |
      SELECT jsonb_populate_record_valid(NULL::jsb_char2, '{"a": "aa"}') AS fits_valid
    expect: rows
  - sql: |
      SELECT * FROM jsonb_populate_record(NULL::jsb_char2, '{"a": "aaa"}') q
    expect: error
    sqlstate: "22001"
    comment: "documented: the same input raises string_data_right_truncation"
  - sql: |
      SELECT * FROM jsonb_populate_record(NULL::jsb_char2, '{"a": "aa"}') q
    expect: rows
    comment: "a value of exactly two characters fits the char(2) column"
