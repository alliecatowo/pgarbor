# Documented json[b]_strip_nulls with strip_in_arrays and jsonb_pretty output.
id: doc-functions-json.jsonb-strip-nulls-pretty
title: json and jsonb strip_nulls with strip_in_arrays, and jsonb_pretty indentation
family: doc-functions-json
tier: core
feature_ids: [json-strip-nulls, jsonb-strip-nulls, jsonb-pretty]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-json-processing (json_strip_nulls, jsonb_strip_nulls, jsonb_pretty)"
sessions: [a]
steps:
  - sql: |
      SELECT json_strip_nulls('[{"f1":1, "f2":null}, 2, null, 3]') AS strip_default,
             json_strip_nulls('[{"f1":1, "f2":null}, 2, null, 3]', true) AS strip_in_arrays
    expect: rows
    comment: "documented: object fields are removed; array nulls are kept unless strip_in_arrays is true"
  - sql: |
      SELECT jsonb_strip_nulls('[1,2,null,3,4]', true) AS documented_strip,
             jsonb_strip_nulls('[1,2,null,3,4]') AS default_keeps_nulls,
             jsonb_strip_nulls('null') AS bare_null_kept,
             jsonb_strip_nulls('{"a":{"b":null,"c":{"d":null}}}') AS recursive_objects
    expect: rows
    comment: "bare null values are never stripped; nested objects are processed recursively"
  - sql: |
      SELECT jsonb_pretty('[{"f1":1,"f2":null}, 2]') AS pretty_doc_example
    expect: rows
    comment: "documented example input; the indentation is whatever PostgreSQL emits"
  - sql: |
      SELECT jsonb_pretty('{"a":[]}'::jsonb) AS pretty_empty_array
    expect: rows
