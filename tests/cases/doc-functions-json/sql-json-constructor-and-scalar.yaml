# Documented json() constructor, json_scalar, and json_serialize functions, including WITH UNIQUE KEYS errors and RETURNING bytea.
id: doc-functions-json.sql-json-constructor-and-scalar
title: json constructor, json_scalar and json_serialize with unique-key checks and RETURNING
family: doc-functions-json
tier: core
feature_ids: [sql-json-constructor, json-scalar, json-serialize, json-unique-keys]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-json-creation (json constructor, json_scalar, json_serialize rows)"
sessions: [a]
steps:
  - sql: |
      SELECT json('{"a":123, "b":[true,"foo"], "a":"bar"}') AS keeps_duplicates
    expect: rows
    comment: "documented: json constructor keeps the text as given, duplicates included"
  - sql: |
      SELECT json(NULL) IS NULL AS null_in_null_out,
             json('{"a":1}') AS plain_object
    expect: rows
  - sql: |
      SELECT json('{"a":123, "a":"bar"}' WITH UNIQUE KEYS) AS unique_keys_dup
    expect: error
    sqlstate: "22030"
  - sql: |
      SELECT json_scalar(123.45) AS num_scalar,
             json_scalar(true) AS bool_scalar,
             json_scalar('abc'::text) AS text_scalar,
             json_scalar(NULL::int) IS NULL AS null_scalar
    expect: rows
    comment: "numbers and booleans stay JSON scalars; other values become JSON strings"
  - sql: |
      SELECT json_serialize('{ "a" : 1 } ' RETURNING bytea) AS serialized_bytea,
             json_serialize('{ "a" : 1 } ' RETURNING text) AS serialized_text
    expect: rows
    comment: "documented RETURNING bytea example; the text form returns the input as text"
