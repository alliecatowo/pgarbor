# Documented IS JSON predicate: type tests (VALUE, SCALAR, ARRAY, OBJECT), negation, and WITH/WITHOUT UNIQUE KEYS checks.
id: doc-functions-json.is-json-predicate
title: IS JSON predicate with type qualifiers, negation, and unique-key checks
family: doc-functions-json
tier: core
feature_ids: [is-json, sql-json-testing, json-unique-keys]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-json-testing (SQL/JSON Testing Functions, IS JSON)"
sessions: [a]
steps:
  - sql: |
      SELECT js,
             js IS JSON "json?",
             js IS JSON SCALAR "scalar?",
             js IS JSON OBJECT "object?",
             js IS JSON ARRAY "array?"
      FROM (VALUES ('123'), ('"abc"'), ('{"a": "b"}'), ('[1,2]'), ('abc')) foo(js)
      ORDER BY js
    expect: rows
    order: ordered
    comment: "documented example; 'abc' is not valid JSON so every test is false"
  - sql: |
      SELECT js,
             js IS NOT JSON AS not_json,
             js IS JSON VALUE AS value_test
      FROM (VALUES ('{"a": 1}'), ('abc'), ('null'), ('  [ ]  ')) foo(js)
      ORDER BY js
    expect: rows
    order: ordered
  - sql: |
      SELECT js,
             js IS JSON OBJECT WITH UNIQUE KEYS AS obj_unique,
             js IS JSON OBJECT WITHOUT UNIQUE KEYS AS obj_any,
             js IS JSON ARRAY WITH UNIQUE KEYS AS arr_unique
      FROM (VALUES ('{"a":1,"a":2}'), ('{"a":1}'), ('[1]'), ('[{"a":1,"a":2}]')) foo(js)
      ORDER BY js
    expect: rows
    order: ordered
    comment: "documented: WITH UNIQUE KEYS also inspects objects nested inside arrays"
  - sql: |
      SELECT NULL::text IS JSON AS null_text_is_json,
             NULL::text IS NOT JSON AS null_text_is_not_json
    expect: rows
