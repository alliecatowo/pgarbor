# interval text output under each IntervalStyle, plus an invalid style value.
id: slice-types-io.interval-output-styles
title: "interval text output under postgres, iso_8601 and sql_standard styles"
family: slice-types-io
tier: core
feature_ids: [interval, text-output, guc, select]
required_capabilities: [select, interval, guc]
provenance:
  source: hand
  ref: "PG18 docs datatype-datetime.html#DATATYPE-INTERVAL-OUTPUT"
sessions: [a]
steps:
  - sql: |
      SET intervalstyle = 'postgres'
    expect: ok
  - sql: |
      SELECT '1 day 02:03:04.5'::interval::text AS a, '-1 year -2 mons +3 days'::interval::text AS b, '0'::interval::text AS c, '90 minutes'::interval::text AS d
    expect: rows
    order: multiset
  - sql: |
      SET intervalstyle = 'iso_8601'
    expect: ok
  - sql: |
      SELECT '1 day 02:03:04.5'::interval::text AS a, '-1 year -2 mons +3 days'::interval::text AS b, '0'::interval::text AS c, '90 minutes'::interval::text AS d
    expect: rows
    order: multiset
  - sql: |
      SET intervalstyle = 'sql_standard'
    expect: ok
  - sql: |
      SELECT '1 day 02:03:04.5'::interval::text AS a, '-1 year -2 mons +3 days'::interval::text AS b, '0'::interval::text AS c, '90 minutes'::interval::text AS d
    expect: rows
    order: multiset
  - sql: |
      SET intervalstyle = 'bogus'
    expect: error
    sqlstate: "22023"
    comment: "unknown IntervalStyle value is invalid_parameter_value"
  - sql: |
      SET intervalstyle = 'postgres'
    expect: ok
  - sql: |
      SELECT NULL::interval::text IS NULL AS null_stays_null
    expect: rows
    order: multiset
