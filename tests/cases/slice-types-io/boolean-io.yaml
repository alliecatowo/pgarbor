# boolean text output as t/f, accepted input spellings, NULL handling, and invalid input.
id: slice-types-io.boolean-io
title: "boolean output as t and f with accepted input spellings and NULLs"
family: slice-types-io
tier: core
feature_ids: [boolean, text-output, create-table, insert, select, errors]
required_capabilities: [create-table, insert, select, boolean, errors]
provenance:
  source: hand
  ref: "PG18 docs datatype-boolean.html"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE b (id int4 PRIMARY KEY, v boolean)
    expect: ok
  - sql: |
      INSERT INTO b VALUES (1, true), (2, 'f'), (3, 'yes'), (4, 'off'), (5, '1'), (6, NULL)
    expect: ok
  - sql: |
      SELECT id, v::text AS txt, v IS NULL AS is_null, (NOT v)::text AS neg FROM b ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT true::text AS t, false::text AS f, (1 = 1)::text AS eq, (NULL::boolean)::text IS NULL AS null_text
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) AS n_true FROM b WHERE v
    expect: rows
    order: multiset
  - sql: |
      SELECT 'maybe'::boolean
    expect: error
    sqlstate: "22P02"
    comment: "unrecognized boolean literal is invalid_text_representation"
