# float8 text output for ordinary, extreme, signed-zero, NaN and infinite values.
id: slice-types-io.float8-edge-output
title: "float8 text output for 1.1, 1e300, -0, NaN, Infinity and NULL"
family: slice-types-io
tier: core
feature_ids: [float8, text-output, create-table, insert, select]
required_capabilities: [create-table, insert, select, float8]
provenance:
  source: hand
  ref: "PG18 docs datatype-numeric.html#DATATYPE-FLOAT"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE f8 (id int4 PRIMARY KEY, v float8)
    expect: ok
  - sql: |
      INSERT INTO f8 VALUES (1, '1.1'), (2, '1e300'), (3, '-0'), (4, 'NaN'), (5, 'Infinity'), (6, '-Infinity'), (7, NULL)
    expect: ok
  - sql: |
      SELECT id, v::text AS txt, v IS NULL AS is_null FROM f8 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT (0.1::float8 + 0.2::float8)::text AS sum_txt, (1.1::float8)::text AS one_point_one, (1e300::float8 * 10)::text AS big
    expect: rows
    order: multiset
  - sql: |
      SELECT 'NaN'::float8 = 'NaN'::float8 AS nan_eq, 'NaN'::float8 > 'Infinity'::float8 AS nan_gt_inf, '-0'::float8 = 0::float8 AS negzero_eq
    expect: rows
    order: multiset
    comment: "PG orders NaN above Infinity and treats NaN as equal to NaN"
