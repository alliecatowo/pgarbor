# array text output with NULL elements, quoting of special strings, dimension bounds and malformed input.
id: slice-types-io.array-null-quoting
title: "array text output with NULL elements, quoted strings and bounds"
family: slice-types-io
tier: core
feature_ids: [arrays, text-output, select, errors]
required_capabilities: [select, arrays, errors]
provenance:
  source: hand
  ref: "PG18 docs arrays.html#ARRAYS-IO"
sessions: [a]
steps:
  - sql: |
      SELECT ARRAY[1, NULL, 3]::int4[]::text AS with_null, ARRAY['a b', 'x,y', '', 'NULL', NULL]::text[]::text AS quoting, ARRAY[]::int4[]::text AS empty, '{}'::text[]::text AS empty_lit
    expect: rows
    order: multiset
    comment: "NULL element prints unquoted; the string NULL and empty string are quoted"
  - sql: |
      SELECT ('{a,"b c",NULL,"NULL"}'::text[])[3] IS NULL AS unquoted_null, ('{a,"b c",NULL,"NULL"}'::text[])[4] = 'NULL' AS quoted_null_str, cardinality('{a,"b c",NULL,"NULL"}'::text[]) AS card
    expect: rows
    order: multiset
  - sql: |
      SELECT '[2:3]={7,8}'::int4[]::text AS bounds, ('[2:3]={7,8}'::int4[])[2] AS second_element
    expect: rows
    order: multiset
    comment: "explicit lower bounds are printed in the output"
  - sql: |
      SELECT ARRAY[ARRAY[1,2],ARRAY[3,4]]::int4[]::text AS nested
    expect: rows
    order: multiset
  - sql: |
      SELECT '{1,2},{3,4}'::int4[]
    expect: error
    sqlstate: "22P02"
    comment: "malformed array literal"
