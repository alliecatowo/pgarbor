# Documented: listing columns explicitly makes the column order irrelevant, and omitted columns are filled with their defaults (NULL here, since price has no default).
id: doc-dml-insert.column-list-both-orders
title: Explicit column lists in either order produce the same row; omitted column defaults to NULL
family: doc-dml-insert
tier: core
feature_ids: [insert, insert-column-list, default-values]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (INSERT INTO products (product_no, name, price) VALUES ... and the reordered form; omitted columns)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE products (
          product_no integer,
          name text,
          price numeric
      )
    expect: ok
  - sql: |
      INSERT INTO products (product_no, name, price) VALUES (1, 'Cheese', 9.99)
    expect: ok
  - sql: |
      INSERT INTO products (name, price, product_no) VALUES ('Bread', 1.99, 2)
    expect: ok
  - sql: |
      INSERT INTO products (product_no, name) VALUES (3, 'Milk')
    expect: ok
  - sql: |
      SELECT product_no, name, price, price IS NULL AS price_is_null FROM products ORDER BY product_no
    expect: rows
    order: ordered
