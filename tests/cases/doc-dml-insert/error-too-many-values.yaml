# Documented: the positional (no column list) form fills columns from the left; supplying more values than the table has columns is an error and inserts nothing.
id: doc-dml-insert.error-too-many-values
title: Positional INSERT with more values than columns fails with 42601 and inserts nothing
family: doc-dml-insert
tier: core
feature_ids: [insert, insert-positional, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (positional form fills the columns from the left with as many values as are given)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no integer, name text, price numeric)
steps:
  - sql: |
      INSERT INTO products VALUES (1, 'a', 1, 2)
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) AS n FROM products
    expect: rows
