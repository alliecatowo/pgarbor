# Documented: a multi-row INSERT is one command; if any row violates a constraint the whole command fails, so none of its rows are inserted.
id: doc-dml-insert.error-multirow-duplicate-atomic
title: Multi-row INSERT with a duplicate key fails as a whole, inserting none of its rows
family: doc-dml-insert
tier: core
feature_ids: [insert, insert-multirow, primary-key, errors, atomicity]
required_capabilities: [create-table, insert, select, errors, primary-key]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (You can insert multiple rows in a single command)"
sessions: [a]
setup: |
  CREATE TABLE inv (sku int PRIMARY KEY, qty int NOT NULL, label text DEFAULT 'x');
  INSERT INTO inv (sku, qty) VALUES (1, 5)
steps:
  - sql: |
      INSERT INTO inv (sku, qty) VALUES (2, 1), (1, 2), (3, 3)
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT sku, qty FROM inv ORDER BY sku
    expect: rows
    order: ordered
