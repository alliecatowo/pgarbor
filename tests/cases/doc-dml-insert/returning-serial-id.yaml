# Documented: RETURNING yields the serial id assigned to each new row, for single-row and multi-row INSERT.
id: doc-dml-insert.returning-serial-id
title: RETURNING returns the serial-generated id of each inserted row
family: doc-dml-insert
tier: core
feature_ids: [insert, returning, serial]
required_capabilities: [create-table, insert, select, returning, serial]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (CREATE TABLE users (firstname text, lastname text, id serial primary key); INSERT ... RETURNING id)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE users (firstname text, lastname text, id serial primary key)
    expect: ok
  - sql: |
      INSERT INTO users (firstname, lastname) VALUES ('Joe', 'Cool') RETURNING id
    expect: rows
  - sql: |
      INSERT INTO users (firstname, lastname) VALUES ('Ann', 'Lee'), ('Bo', 'Ng') RETURNING id, firstname
    expect: rows
    order: ordered
  - sql: |
      SELECT id, firstname, lastname FROM users ORDER BY id
    expect: rows
    order: ordered
