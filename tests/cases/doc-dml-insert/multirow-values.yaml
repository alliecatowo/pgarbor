# Documented: several rows may be inserted in a single command with a comma-separated VALUES list; the command inserts all of them.
id: doc-dml-insert.multirow-values
title: Multi-row VALUES list inserts every row in one command
family: doc-dml-insert
tier: core
feature_ids: [insert, insert-multirow]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (INSERT INTO products ... VALUES (1,'Cheese',9.99), (2,'Bread',1.99), (3,'Milk',2.99))"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE products (
          product_no integer,
          name text,
          price numeric
      )
    expect: ok
  - sql: |
      INSERT INTO products (product_no, name, price) VALUES
          (1, 'Cheese', 9.99),
          (2, 'Bread', 1.99),
          (3, 'Milk', 2.99)
    expect: ok
  - sql: |
      SELECT count(*) AS n, sum(price) AS total FROM products
    expect: rows
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
