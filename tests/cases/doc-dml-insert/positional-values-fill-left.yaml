# Documented PostgreSQL extension: without a column list, VALUES fills columns from the left, and the remaining columns take their defaults.
id: doc-dml-insert.positional-values-fill-left
title: INSERT without a column list fills leftmost columns and defaults the rest
family: doc-dml-insert
tier: core
feature_ids: [insert, insert-positional, default-values]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (INSERT INTO products VALUES (1, 'Cheese'); second form is a PostgreSQL extension)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE products (
          product_no integer,
          name text,
          price numeric DEFAULT 4.50
      )
    expect: ok
  - sql: |
      INSERT INTO products VALUES (1, 'Cheese')
    expect: ok
  - sql: |
      INSERT INTO products VALUES (2)
    expect: ok
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
