# Documented: data values must match the column type; a value that cannot be parsed for an integer column is rejected with 22P02 and the row is not inserted.
id: doc-dml-insert.error-invalid-input-syntax
title: Value that is not valid for the column type fails with 22P02
family: doc-dml-insert
tier: core
feature_ids: [insert, data-types, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (data values listed in column order; scalar expressions must produce values for the column type)"
sessions: [a]
setup: |
  CREATE TABLE inv (sku int PRIMARY KEY, qty int NOT NULL, label text DEFAULT 'x')
steps:
  - sql: |
      INSERT INTO inv (sku, qty, label) VALUES ('abc', 1, 'z')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) AS n FROM inv
    expect: rows
