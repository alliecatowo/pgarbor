# Documented: the RETURNING list has the same form as a SELECT output list; RETURNING * returns all target columns in table order, and expressions and aliases are allowed.
id: doc-dml-insert.returning-star-and-expressions
title: RETURNING * returns all columns in order; RETURNING accepts expressions and aliases
family: doc-dml-insert
tier: core
feature_ids: [insert, returning, select-list]
required_capabilities: [create-table, insert, select, returning]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (The allowed contents of a RETURNING clause are the same as a SELECT command's output list; RETURNING *)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE products (product_no integer, name text, price numeric)
    expect: ok
  - sql: |
      INSERT INTO products (name, price, product_no) VALUES ('Cheese', 9.99, 1) RETURNING *
    expect: rows
  - sql: |
      INSERT INTO products VALUES (2, 'Bread', 1.99), (3, 'Milk', 2.99)
        RETURNING product_no * 10 AS key, upper(name) AS shout, price * 2 AS doubled
    expect: rows
    order: ordered
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
