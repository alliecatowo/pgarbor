# Documented: an INSERT ... SELECT that produces no rows is a successful command that inserts zero rows, and RETURNING on it returns no rows.
id: doc-dml-insert.insert-select-no-rows-tag
title: INSERT ... SELECT with no source rows succeeds with zero inserted and empty RETURNING
family: doc-dml-insert
tier: core
feature_ids: [insert, insert-select, returning]
required_capabilities: [create-table, insert, select, returning]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (INSERT ... SELECT which might be no rows) and dml.sgml#dml-returning"
sessions: [a]
setup: |
  CREATE TABLE src (k int, v text);
  CREATE TABLE dst (k int, v text)
steps:
  - sql: |
      INSERT INTO dst SELECT k, v FROM src
    expect: ok
    comment: command tag INSERT 0 0
  - sql: |
      INSERT INTO dst SELECT k, v FROM src RETURNING k
    expect: rows
    comment: empty result set
  - sql: |
      INSERT INTO src VALUES (1, 'one'), (2, 'two');
      INSERT INTO dst SELECT k, v FROM src WHERE k > 1 RETURNING k, v
    expect: ok
    comment: second statement inserts one row
  - sql: |
      SELECT k, v FROM dst ORDER BY k
    expect: rows
    order: ordered
