# Documented: a complete row must be created; an omitted column without a default is NULL, so omitting a NOT NULL column without a default is rejected with 23502.
id: doc-dml-insert.error-omitted-not-null-column
title: Omitting a NOT NULL column that has no default fails with 23502
family: doc-dml-insert
tier: core
feature_ids: [insert, default-values, not-null, errors]
required_capabilities: [create-table, insert, select, errors, not-null]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (a complete row must be created; omitted columns are filled with their default values)"
sessions: [a]
setup: |
  CREATE TABLE inv (sku int PRIMARY KEY, qty int NOT NULL, label text DEFAULT 'x')
steps:
  - sql: |
      INSERT INTO inv (sku, label) VALUES (2, 'b')
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO inv (sku, qty) VALUES (3, 1)
    expect: ok
  - sql: |
      SELECT sku, qty, label FROM inv ORDER BY sku
    expect: rows
    order: ordered
