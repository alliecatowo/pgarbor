# Documented: DEFAULT may be written for an individual column, and DEFAULT VALUES inserts a row made entirely of column defaults.
id: doc-dml-insert.explicit-default-keyword
title: DEFAULT keyword per column and DEFAULT VALUES for a whole row
family: doc-dml-insert
tier: core
feature_ids: [insert, default-values, default-keyword]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-insert (INSERT ... VALUES (1, 'Cheese', DEFAULT); INSERT INTO products DEFAULT VALUES)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE products (
          product_no integer DEFAULT 100,
          name text DEFAULT 'unnamed',
          price numeric DEFAULT 9.99
      )
    expect: ok
  - sql: |
      INSERT INTO products (product_no, name, price) VALUES (1, 'Cheese', DEFAULT)
    expect: ok
  - sql: |
      INSERT INTO products DEFAULT VALUES
    expect: ok
  - sql: |
      INSERT INTO products (name) VALUES (DEFAULT), (DEFAULT)
    expect: ok
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no, name
    expect: rows
    order: ordered
