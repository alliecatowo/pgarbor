# A generated column cannot also have a column default or an identity definition, and its
# generation status cannot be changed by SET DEFAULT.
id: doc-ddl-generated-columns.defaults-and-identity-conflicts
title: Generated columns reject column defaults, identity clauses, and SET DEFAULT
family: doc-ddl-generated-columns
tier: core
feature_ids: [generated-columns, column-defaults, identity-columns, alter-table]
required_capabilities: [create-table, alter-table, generated-columns, identity]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-generated-columns"
sessions: [a]
setup: |
  CREATE TABLE idb (x int, g int GENERATED ALWAYS AS (x + 1) STORED)
steps:
  - sql: |
      CREATE TABLE idg_default (x int, g int GENERATED ALWAYS AS (x + 1) STORED DEFAULT 5)
    expect: error
    sqlstate: "42601"
    comment: both default and generation expression specified
  - sql: |
      CREATE TABLE idg_always (x int, g int GENERATED ALWAYS AS (x + 1) STORED GENERATED ALWAYS AS IDENTITY)
    expect: error
    sqlstate: "42601"
    comment: both identity and generation expression specified
  - sql: |
      CREATE TABLE idg_by_default (x int, g int GENERATED BY DEFAULT AS IDENTITY GENERATED ALWAYS AS (x + 1) VIRTUAL)
    expect: error
    sqlstate: "42601"
    comment: the BY DEFAULT identity form is rejected the same way
  - sql: |
      ALTER TABLE idb ALTER COLUMN g SET DEFAULT 3
    expect: error
    sqlstate: "42601"
    comment: a generated column cannot take a default afterwards
  - sql: |
      CREATE TABLE idg_plain (x int, g int GENERATED ALWAYS AS (x + 1) STORED)
    expect: ok
    comment: "control: the plain generated column is valid"
