# tableoid is the one system column a generation expression may reference. Its value is the
# table's OID in both the stored and the virtual kind.
id: doc-ddl-generated-columns.tableoid-expression
title: A generation expression may reference tableoid in both stored and virtual kinds
family: doc-ddl-generated-columns
tier: extended
feature_ids: [generated-columns, system-columns, tableoid]
required_capabilities: [create-table, insert, select, generated-columns]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-generated-columns"
sessions: [a]
setup: |
  CREATE TABLE ts (x int, t oid GENERATED ALWAYS AS (tableoid) STORED, tv oid GENERATED ALWAYS AS (tableoid) VIRTUAL)
steps:
  - sql: |
      INSERT INTO ts (x) VALUES (1)
    expect: ok
  - sql: |
      SELECT x, t = 'ts'::regclass::oid AS t_is_self, tv = 'ts'::regclass::oid AS tv_is_self FROM ts
    expect: rows
    order: multiset
    comment: tableoid is allowed; the stored value is the table's OID at write time
