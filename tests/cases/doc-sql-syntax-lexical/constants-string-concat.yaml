# Adjacent string constants separated by a newline concatenate; same-line adjacency is a syntax error.
id: doc-sql-syntax-lexical.constants-string-concat
title: "Adjacent string constants concatenate only across a newline"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, string-constants, string-concatenation]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (String Constants)"
sessions: [a]
steps:
  - sql: |
      SELECT 'foo'
      'bar' AS joined
    expect: rows
    comment: "a newline between the constants makes them one constant 'foobar'"
  - sql: |
      SELECT 'foo'
      '' AS with_empty, 'it''s' AS quoted, length('it''s') AS len
    expect: rows
  - sql: |
      SELECT 'foo'      'bar'
    expect: error
    sqlstate: "42601"
    comment: "same-line adjacency is not valid syntax"
  - sql: |
      SELECT 'unterminated
    expect: error
    sqlstate: "42601"
