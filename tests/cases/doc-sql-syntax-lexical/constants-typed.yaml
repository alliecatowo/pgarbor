# Typed constants: type 'string', 'string'::type, CAST, and the restriction against array type-string syntax.
id: doc-sql-syntax-lexical.constants-typed
title: "Typed constants via type-string, :: and CAST forms, with the array restriction"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, typed-constants, type-casts, arrays]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (Constants of Other Types)"
sessions: [a]
steps:
  - sql: |
      SELECT REAL '1.23' AS a, 1.23::REAL AS b, CAST('1' AS int4) AS c, int4 ' 12 ' AS d, bool 't' AS e
    expect: rows
    comment: "the three equivalent forms, plus surrounding whitespace accepted by the input routine"
  - sql: |
      SELECT $$2024-01-02$$::date AS dollar_quoted_input, date '2024-01-02' AS typed_literal
    expect: rows
  - sql: |
      SELECT '{1,2}'::int4[] AS arr_cast, CAST('{1,2}' AS int4[]) AS arr_func
    expect: rows
    comment: "arrays need :: or CAST, not the type-string form"
  - sql: |
      SELECT int4[] '{1}'
    expect: error
    sqlstate: "42601"
    comment: "the type-string syntax does not work for array types"
  - sql: |
      SELECT int4 'abc'
    expect: error
    sqlstate: "22P02"
    comment: "a constant that the input routine rejects fails at parse time with invalid input syntax"
