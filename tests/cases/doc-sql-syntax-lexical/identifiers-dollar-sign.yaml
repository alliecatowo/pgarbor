# Dollar signs and digits are legal inside identifiers but not as the first character.
id: doc-sql-syntax-lexical.identifiers-dollar-sign
title: "Dollar signs allowed inside identifiers, not as the first character"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, identifiers, dollar-sign]
required_capabilities: [create-table, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (identifiers: letters, underscores, digits, dollar signs)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE a$b (x1_2 int4, _y int4)
    expect: ok
  - sql: |
      SELECT x1_2, _y FROM a$b
    expect: rows
  - sql: |
      SELECT count(*) FROM pg_catalog.pg_class WHERE relname = 'a$b'
    expect: rows
  - sql: |
      CREATE TABLE $x (a int4)
    expect: error
    sqlstate: "42601"
    comment: "an identifier must begin with a letter or underscore"
