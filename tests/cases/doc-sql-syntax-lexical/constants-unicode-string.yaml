# U&'...' Unicode escape string constants, UESCAPE, and the rejected-escape error.
id: doc-sql-syntax-lexical.constants-unicode-string
title: "Unicode escape string constants with 4-digit, 6-digit and UESCAPE forms"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, string-constants, unicode-escape, uescape]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (String Constants with Unicode Escapes)"
sessions: [a]
steps:
  - sql: |
      SELECT U&'d\0061t\+000061' AS four_and_six_digit
    expect: rows
  - sql: |
      SELECT encode(convert_to(U&'\0441\043B\043E\043D', 'UTF8'), 'hex') AS slon_utf8
    expect: rows
    comment: "the Cyrillic word slon, checked as UTF-8 bytes"
  - sql: |
      SELECT U&'d!0061t!+000061' UESCAPE '!' AS custom_escape
    expect: rows
  - sql: |
      SELECT U&'a!!b' UESCAPE '!' AS doubled_escape
    expect: rows
    comment: "an escape character written twice is a literal escape character"
  - sql: |
      SELECT U&'\0041\+01F600' AS surrogate_free_astral
    expect: rows
    comment: "a six-digit escape reaches code points above U+FFFF"
  - sql: |
      SELECT U&'x\zz'
    expect: error
    sqlstate: "42601"
    comment: "a malformed escape is rejected"
  - sql: |
      SELECT U&'x' UESCAPE '0'
    expect: error
    sqlstate: "42601"
    comment: "a hexadecimal digit cannot be the escape character"
