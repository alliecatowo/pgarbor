# Identifiers longer than NAMEDATALEN-1 (63 bytes) are accepted with a NOTICE and truncated.
id: doc-sql-syntax-lexical.identifiers-truncation
title: "Over-long identifiers are truncated to 63 bytes with a notice"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, identifiers, identifier-length]
required_capabilities: [create-table, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (identifierlength)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE trunc_t (aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaabbbbbbb int4)
    expect: notice
    comment: "a 70-byte name is accepted, with a NOTICE that it is truncated to 63 bytes"
  - sql: |
      SELECT length(column_name), column_name = repeat('a', 63) AS is_truncated_prefix
      FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name = 'trunc_t'
    expect: rows
  - sql: |
      SELECT repeat('a', 63) AS aaa
    expect: rows
  - sql: |
      SELECT count(*) FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name = 'trunc_t'
    expect: rows
