# Comments are whitespace: -- to end of line, and /* */ blocks that nest.
id: doc-sql-syntax-lexical.comments-nested
title: "Line comments and nested block comments are treated as whitespace"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, comments]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (Comments)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 -- a line comment that runs to the end of the line
      + 1 AS after_line_comment
    expect: rows
  - sql: |
      SELECT 1 /* a block comment */ + 1 AS after_block
    expect: rows
  - sql: |
      SELECT 1 /* a /* b */ c */ + 1 AS nested_block
    expect: rows
    comment: "block comments nest, so the inner */ does not close the outer comment"
  - sql: |
      SELECT 1 /* a /* b */ + 1
    expect: error
    sqlstate: "42601"
    comment: "the outer comment never closes"
  - sql: |
      SELECT 1 /* x */ -- y
    expect: rows
  - sql: |
      SELECT '-- not a comment' AS in_string, '/* nor this */' AS in_string2
    expect: rows
    comment: "comment markers inside string constants are data"
