# E'...' escape string constants: C-style backslash escapes, octal, hex, Unicode and literal fallbacks.
id: doc-sql-syntax-lexical.constants-escape-string
title: "Escape string constants interpret C-style backslash sequences"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, string-constants, escape-strings, backslash-escapes]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (String Constants with C-Style Escapes, Backslash Escape Sequences)"
sessions: [a]
steps:
  - sql: |
      SELECT encode(convert_to(E'\b\f\n\r\t\\\101\x41A\U00000041\''::text, 'UTF8'), 'hex') AS escapes
    expect: rows
    comment: "covers \\b \\f \\n \\r \\t \\\\ \\ooo \\xhh \\uxxxx \\Uxxxxxxxx and \\'"
  - sql: |
      SELECT length(E'a\\b') AS escaped_backslash, length('a\\b') AS plain_backslash, length('a\nb') AS plain_n
    expect: rows
    comment: "outside E'' a backslash is literal when standard_conforming_strings is on"
  - sql: |
      SELECT E'it\'s' AS quote_escape, E'a''b' AS doubled_quote
    expect: rows
  - sql: |
      SELECT encode(E'\\000'::bytea, 'hex') AS nul_via_bytea
    expect: rows
  - sql: |
      SELECT E'x\zz' AS unknown_escape
    expect: rows
    comment: "an unrecognised escape character after a backslash is taken literally, so the result is xzz"
