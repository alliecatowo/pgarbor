# Bit-string constants: B'...' binary form, X'...' hexadecimal form, and invalid digits.
id: doc-sql-syntax-lexical.constants-bit-string
title: "Binary and hexadecimal bit-string constants, with invalid digits rejected"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, bit-string-constants, bit-type]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (Bit-String Constants)"
sessions: [a]
steps:
  - sql: |
      SELECT B'1001' AS bin, b'0' AS lower_case_prefix, X'1FF' AS hex, x'ff' AS lower_hex
    expect: rows
    comment: "X'1FF' is 9 bits of hex, four binary digits per hex digit, giving 000111111111"
  - sql: |
      SELECT B'1001' || B'11' AS concatenated, length(X'1FF') AS hex_bits
    expect: rows
  - sql: |
      SELECT B'102'
    expect: error
    sqlstate: "22P02"
    comment: "only 0 and 1 are allowed in a binary bit-string constant"
  - sql: |
      SELECT B$x$1001$x$
    expect: error
    sqlstate: "42703"
    comment: "dollar quoting is not available for bit strings; B$x$... lexes as one identifier, which does not exist"
