# Operator precedence: unary minus vs exponent, IS vs NOT, AND vs OR, and OPERATOR(schema.op) default precedence.
id: doc-sql-syntax-lexical.operators-precedence
title: "Operator precedence and associativity from the documented table"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, operators, operator-precedence, expressions]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (Operator Precedence)"
sessions: [a]
steps:
  - sql: |
      SELECT 2 + 3 * 4 AS mul_first, (2 + 3) * 4 AS parens, 2 - 3 - 4 AS left_assoc
    expect: rows
  - sql: |
      SELECT -2 ^ 2 AS unary_binds_tighter, (-2) ^ 2 AS parens_square
    expect: rows
    comment: "unary minus has higher precedence than ^ in the documented table"
  - sql: |
      SELECT NOT NULL IS NULL AS not_binds_looser, NOT (NULL IS NULL) AS explicit
    expect: rows
  - sql: |
      SELECT TRUE OR FALSE AND FALSE AS and_before_or, NOT TRUE OR TRUE AS not_before_or
    expect: rows
  - sql: |
      SELECT 2 - -3 AS double_minus, 2 - - 3 AS spaced_minus, 5 % 3 * 2 AS mod_then_mul
    expect: rows
  - sql: |
      SELECT 3 OPERATOR(pg_catalog.+) 4 AS qualified_op, 3 OPERATOR(pg_catalog.*) 4 + 1 AS qualified_then_plus
    expect: rows
    comment: "an OPERATOR() construct takes the default precedence of other operators"
