# Operator names: characters allowed, multi-character names ending in + or -, and lexing of adjacent operators.
id: doc-sql-syntax-lexical.operators-names
title: "Operator name lexing, the trailing plus/minus rule, and spacing around prefix operators"
family: doc-sql-syntax-lexical
tier: extended
feature_ids: [lexical-structure, operators, user-defined-operators, operator-names]
required_capabilities: [create-operator, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (Operators)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 *- 2 AS split_tokens
    expect: rows
    comment: "*- is not one operator name, so it lexes as * followed by unary -"
  - sql: |
      CREATE OPERATOR *- (leftarg = int4, rightarg = int4, procedure = int4mi)
    expect: error
    sqlstate: "42601"
    comment: "a multi-character operator name may not end in + or - unless it also contains one of ~ ! @ # % ^ & | ` ?"
  - sql: |
      CREATE OPERATOR @- (rightarg = int4, procedure = int4abs)
    expect: ok
  - sql: |
      SELECT @- -5 AS prefix_spaced, @-(-5) AS prefix_tight
    expect: rows
    comment: "@- contains a special character, so the trailing minus is allowed in the name"
  - sql: |
      SELECT 2 @- 3
    expect: error
    sqlstate: "42883"
    comment: "the prefix operator defines no binary form"
