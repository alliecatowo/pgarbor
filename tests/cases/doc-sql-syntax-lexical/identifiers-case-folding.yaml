# Unquoted identifiers and key words are case-insensitive and fold to lower case.
id: doc-sql-syntax-lexical.identifiers-case-folding
title: "Unquoted identifiers and key words fold to lower case"
family: doc-sql-syntax-lexical
tier: core
feature_ids: [lexical-structure, identifiers, case-folding, create-table, update]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-lexical (Identifiers and Key Words, case sensitivity of SQL commands)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE MY_TABLE (A int4, B text)
    expect: ok
  - sql: |
      INSERT INTO my_table VALUES (5, 'x'), (6, 'y')
    expect: ok
  - sql: |
      uPDaTE my_TabLE SeT a = a + 10 WHERE B = 'x'
    expect: ok
  - sql: |
      SELECT A, b FROM My_Table ORDER BY A
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM "my_table" ORDER BY a
    expect: rows
    order: ordered
    comment: "quoted lower-case name refers to the same table"
  - sql: |
      SELECT 1 AS FOO, 2 AS foo
    expect: rows
    comment: "unquoted FOO and foo are the same identifier, so duplicate output names are allowed"
