# generate_series over int8 values near 2^52 with positive step, and a zero step that must fail.
id: int8.generate-series
title: generate_series over int8 ranges with step 1 and 2, and zero-step error
family: int8
tier: core
feature_ids: [int8, generate-series, set-returning-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (generate_series section)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT g FROM generate_series(4567890123456789::int8, 4567890123456799::int8) AS g ORDER BY g
    expect: rows
    order: ordered
  - sql: |
      SELECT g FROM generate_series(4567890123456789::int8, 4567890123456799::int8, 2) AS g ORDER BY g
    expect: rows
    order: ordered
    comment: step 2 from the lower bound yields six values
  - sql: |
      SELECT g FROM generate_series(10::int8, 1::int8, -4) AS g ORDER BY g DESC
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM generate_series(1::int8, 5::int8, 0)
    expect: error
    sqlstate: "22023"
    comment: step size cannot equal zero
