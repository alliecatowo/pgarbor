# Malformed int8 text is invalid input (22P02); pg_input_is_valid reports it without raising.
id: int8.invalid-input-errors
title: Malformed int8 text raises invalid_text_representation; pg_input_is_valid stays quiet
family: int8
tier: core
feature_ids: [int8, errors, input-validation]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (bad values, pg_input_is_valid, pg_input_error_info)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '      '::int8
    expect: error
    sqlstate: "22P02"
    comment: whitespace only
  - sql: |
      SELECT 'xxx'::int8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT ''::int8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '- 123'::int8
    expect: error
    sqlstate: "22P02"
    comment: embedded space after the sign
  - sql: |
      SELECT '  345     5'::int8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT pg_input_is_valid('34', 'int8') AS ok34,
             pg_input_is_valid('asdf', 'int8') AS bad_text,
             pg_input_is_valid('10000000000000000000', 'int8') AS too_big
    expect: rows
    comment: returns booleans instead of raising
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('10000000000000000000', 'int8')
    expect: rows
    comment: out-of-range input reports SQLSTATE 22003
