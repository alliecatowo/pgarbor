# int8 literals in binary, octal and hex form, with digit separators, plus malformed and overflowing forms.
id: int8.nondecimal-and-underscore-literals
title: int8 binary, octal, hex and underscore-separated literals, including malformed and overflow cases
family: int8
tier: extended
feature_ids: [int8, literals, non-decimal-literals, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (non-decimal literals, cases near overflow, underscores, error cases)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT int8 '0b100101' AS bin, int8 '0o273' AS oct, int8 '0x42F' AS hex
    expect: rows
  - sql: |
      SELECT int8 '1_000_000' AS u1, int8 '1_2_3' AS u2, int8 '0x1EEE_FFFF' AS u3,
             int8 '0o2_73' AS u4, int8 '0b_10_0101' AS u5
    expect: rows
  - sql: |
      SELECT int8 '0x7FFFFFFFFFFFFFFF' AS hexmax, int8 '-0x8000000000000000' AS hexmin
    expect: rows
  - sql: |
      SELECT int8 '0x8000000000000000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int8 '-0x8000000000000001'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int8 '0o1000000000000000000000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int8 '0b'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int8 '0x'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int8 '_100'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int8 '100_'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int8 '100__000'
    expect: error
    sqlstate: "22P02"
