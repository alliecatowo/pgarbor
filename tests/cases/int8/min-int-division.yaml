# INT64_MIN divided by -1 overflows, but modulo by -1 is defined as 0 rather than an error.
id: int8.min-int-division
title: INT64_MIN divided or multiplied by -1 overflows; modulo by -1 returns 0
family: int8
tier: core
feature_ids: [int8, arithmetic, errors, edge-cases]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (check sane handling of INT64_MIN overflow cases)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT (-9223372036854775808)::int8 / (-1)::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-9223372036854775808)::int8 * (-1)::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-9223372036854775808)::int8 % (-1)::int8 AS mod_int8
    expect: rows
    comment: modulo by -1 is special-cased to 0 and does not overflow
  - sql: |
      SELECT (-9223372036854775808)::int8 / (-1)::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-9223372036854775808)::int8 % (-1)::int4 AS mod_int4
    expect: rows
  - sql: |
      SELECT (-9223372036854775808)::int8 * (-1)::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-9223372036854775808)::int8 / (-1)::int2
    expect: error
    sqlstate: "22003"
