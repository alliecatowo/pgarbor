# Casting fractional float8 and numeric values to int8 at the .5 boundaries.
id: int8.cast-rounding
title: float8 and numeric to int8 casts round at halves as PostgreSQL defines
family: int8
tier: core
feature_ids: [int8, casts, float8, numeric]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (check rounding when casting from float / numeric)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT x, x::int8 AS int8_value
      FROM (VALUES (-2.5::float8), (-1.5::float8), (-0.5::float8), (0.0::float8),
                   (0.5::float8), (1.5::float8), (2.5::float8)) AS t(x)
      ORDER BY x
    expect: rows
    order: ordered
    comment: float8 to int8 uses round-half-to-even
  - sql: |
      SELECT x, x::int8 AS int8_value
      FROM (VALUES (-2.5::numeric), (-1.5::numeric), (-0.5::numeric), (0.0::numeric),
                   (0.5::numeric), (1.5::numeric), (2.5::numeric)) AS t(x)
      ORDER BY x
    expect: rows
    order: ordered
    comment: numeric to int8 uses round-half-away-from-zero
