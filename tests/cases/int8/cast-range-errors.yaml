# Narrowing int8 casts and float-to-int8 casts out of range raise 22003; in-range casts succeed.
id: int8.cast-range-errors
title: int8 casts to int2, int4 and from out-of-range float8 raise numeric_value_out_of_range
family: int8
tier: core
feature_ids: [int8, casts, errors, int2, int4]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (CAST to int4/int2, float8 to int8 overflow)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT CAST('4567890123456789'::int8 AS int2)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT CAST(2147483648::int8 AS int4)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT CAST('922337203685477580700.0'::float8 AS int8)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT CAST('42'::int2 AS int8) AS pos, CAST('-37'::int2 AS int8) AS neg
    expect: rows
  - sql: |
      SELECT CAST(2147483647::int8 AS int4) AS int4_max
    expect: rows
    comment: the largest int4 value fits and does not raise
