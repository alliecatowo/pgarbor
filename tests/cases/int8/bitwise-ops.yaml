# int8 bitwise AND, OR, XOR, NOT and shifts, including the sign bit and INT64_MIN.
id: int8.bitwise-ops
title: int8 bitwise and shift operators on positive, negative and sign-bit values
family: int8
tier: core
feature_ids: [int8, bitwise, shifts]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (bit operations; corner case shift to INT64_MIN)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE b (q1 int8, q2 int8);
  INSERT INTO b VALUES (5, 3), (-8, 1), (0, 0);
steps:
  - sql: |
      SELECT q1, q2, q1 & q2 AS and_v, q1 | q2 AS or_v, q1 # q2 AS xor_v, ~q1 AS not_v
      FROM b ORDER BY q1, q2
    expect: rows
    order: ordered
  - sql: |
      SELECT q1, q1 << 2 AS shl, q1 >> 1 AS shr FROM b ORDER BY q1
    expect: rows
    order: ordered
    comment: right shift of a negative value is arithmetic
  - sql: |
      SELECT (-1::int8 << 63)::text AS int64_min_text
    expect: rows
  - sql: |
      SELECT ((-1::int8 << 63) + 1)::text AS near_min_text
    expect: rows
