# Division and modulo by zero raise division_by_zero (22012) for int8 operands and mixed widths.
id: int8.division-by-zero
title: int8 division and modulo by zero raise 22012
family: int8
tier: core
feature_ids: [int8, arithmetic, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (divide-by-zero cases)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '9223372036854775800'::int8 / '0'::int8
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT '9223372036854775800'::int8 % '0'::int8
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::int8 / 0::int4
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::int8 / NULL::int8 AS null_divisor
    expect: rows
    comment: a NULL divisor yields NULL and does not raise
