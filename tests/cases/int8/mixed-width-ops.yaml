# int8 combined with int4 and int2 operands: result widening and overflow on the int8 side.
id: int8.mixed-width-ops
title: int8 operators with int4 and int2 operands widen correctly and detect overflow
family: int8
tier: core
feature_ids: [int8, int4, int2, arithmetic, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (int8 op int4, int4 op int8, int8 op int2, int2 op int8 sections)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 37::int8 + 5::int4 AS a, 37::int8 - 5::int2 AS b, 6::int2 * 7::int8 AS c,
             9::int8 / 2::int4 AS d, 9::int4 % 4::int8 AS e
    expect: rows
    comment: all operands widen to int8 so no int4 overflow applies
  - sql: |
      SELECT '9223372036854775800'::int8 + '100'::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-100'::int4 - '9223372036854775800'::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '100'::int4 * '9223372036854775800'::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '100'::int2 / '0'::int8
    expect: error
    sqlstate: "22012"
