# int8 arithmetic that overflows the 64-bit range raises numeric_value_out_of_range (22003).
id: int8.overflow-errors
title: int8 add, subtract, multiply, negate and abs raise 22003 on overflow
family: int8
tier: core
feature_ids: [int8, arithmetic, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (overflow behavior section)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '9223372036854775800'::int8 + '9223372036854775800'::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-9223372036854775800'::int8 + '-9223372036854775800'::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '9223372036854775800'::int8 - '-9223372036854775800'::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '9223372036854775800'::int8 * '9223372036854775800'::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT -('-9223372036854775808'::int8)
    expect: error
    sqlstate: "22003"
    comment: negating INT64_MIN has no int8 result
  - sql: |
      SELECT abs('-9223372036854775808'::int8)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT -('-9223372036854775807'::int8) AS negate_max
    expect: rows
    comment: the largest value that can be negated succeeds
