# int8 basic arithmetic with truncating division, NULL propagation and a negative operand.
id: int8.basic-arithmetic
title: int8 addition, subtraction, multiplication, truncating division and modulo
family: int8
tier: slice
feature_ids: [int8, arithmetic, create-table, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (plus/minus/multiply/divide queries, rewritten on a small table)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (a int8, b int8);
  INSERT INTO t VALUES (7, 2), (-7, 2), (0, 5), (NULL, 3);
steps:
  - sql: |
      SELECT a, b, a + b AS plus, a - b AS minus, a * b AS mul, a / b AS div, a % b AS modulo
      FROM t ORDER BY a NULLS LAST, b
    expect: rows
    order: ordered
    comment: integer division truncates toward zero, so -7 / 2 = -3 and -7 % 2 = -1
  - sql: |
      SELECT -a AS neg, abs(a) AS absval FROM t WHERE a IS NOT NULL ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT 0::int8 - '-9223372036854775807'::int8 AS maxval
    expect: rows
  - sql: |
      SELECT 37::int8 + 5 AS plus_lit, 37::int8 * 2 AS twice
    expect: rows
