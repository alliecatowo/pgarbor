# int8 compared with int4 and int2 literals and columns, in both operand orders.
id: int8.cross-type-comparison
title: int8 comparisons against int4 and int2 values in both operand orders
family: int8
tier: core
feature_ids: [int8, comparison, select, where]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (int8/int8, int8/int4, int4/int8, int8/int2, int2/int8 cmp sections)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE int8_tbl (q1 int8, q2 int8);
  INSERT INTO int8_tbl VALUES
    (123, 456),
    (123, 4567890123456789),
    (4567890123456789, 123),
    (4567890123456789, 4567890123456789),
    (4567890123456789, -4567890123456789);
steps:
  - sql: |
      SELECT q1, q2 FROM int8_tbl WHERE q2 = 4567890123456789 ORDER BY q1, q2
    expect: rows
    order: ordered
  - sql: |
      SELECT q1, q2 FROM int8_tbl WHERE q2 <> 4567890123456789 ORDER BY q1, q2
    expect: rows
    order: ordered
  - sql: |
      SELECT q1, q2 FROM int8_tbl WHERE q2 = 456 ORDER BY q1, q2
    expect: rows
    order: ordered
    comment: int4 literal compared with int8 column
  - sql: |
      SELECT q1, q2 FROM int8_tbl WHERE q2 >= 456 ORDER BY q1, q2
    expect: rows
    order: ordered
  - sql: |
      SELECT q1, q2 FROM int8_tbl WHERE 123 < q1 ORDER BY q1, q2
    expect: rows
    order: ordered
    comment: int4 literal on the left-hand side
  - sql: |
      SELECT q1, q2 FROM int8_tbl WHERE q2 = '456'::int2 ORDER BY q1, q2
    expect: rows
    order: ordered
  - sql: |
      SELECT q1, q2 FROM int8_tbl WHERE '123'::int2 <= q1 ORDER BY q1, q2
    expect: rows
    order: ordered
