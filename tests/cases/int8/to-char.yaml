# to_char on int8 with grouping, sign, and fill-mode templates.
id: int8.to-char
title: to_char formats int8 values with grouping separators, sign placement and FM fill mode
family: int8
tier: extended
feature_ids: [int8, to-char, formatting]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (TO_CHAR section, subset)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT to_char(1234::int8, '9,999,999,999,999,999') AS grouped,
             to_char(-1234::int8, '9999999999999999PR') AS angle_neg
    expect: rows
  - sql: |
      SELECT to_char(1234::int8, 'FM9999999999999999') AS fm,
             to_char(-1234::int8, 'S9999999999999999') AS sign_lead,
             to_char(1234::int8, 'MI9999999999999999') AS minus_tail
    expect: rows
  - sql: |
      SELECT to_char(1234::int8, 'FM0999999999999999') AS zero_fill
    expect: rows
