# int8 literal parsing at the bounds of the 64-bit range and out-of-range input.
id: int8.literal-input-bounds
title: int8 accepts INT64_MIN and INT64_MAX and rejects values one step outside
family: int8
tier: core
feature_ids: [int8, literals, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (min/max values and overflow behavior section)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '-9223372036854775808'::int8 AS int64_min
    expect: rows
  - sql: |
      SELECT '9223372036854775807'::int8 AS int64_max
    expect: rows
  - sql: |
      SELECT '-9223372036854775809'::int8
    expect: error
    sqlstate: "22003"
    comment: numeric value out of range
  - sql: |
      SELECT '9223372036854775808'::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int8 '0x8000000000000000'
    expect: error
    sqlstate: "22003"
    comment: hex literal one past INT64_MAX is out of range
