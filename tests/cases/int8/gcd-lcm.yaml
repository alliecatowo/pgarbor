# int8 gcd() and lcm() on ordinary and boundary values, with overflow when the result leaves int8.
id: int8.gcd-lcm
title: int8 gcd and lcm on simple, negative and boundary inputs, with overflow errors
family: int8
tier: extended
feature_ids: [int8, gcd, lcm, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int8.sql (test gcd(), test lcm())"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT gcd(12::int8, 18::int8) AS g, lcm(4::int8, 6::int8) AS l, gcd(0::int8, 0::int8) AS z
    expect: rows
  - sql: |
      SELECT a, b, gcd(a, b), gcd(a, -b), gcd(b, a), gcd(-b, a)
      FROM (VALUES (0::int8, 0::int8),
                   (288484263558::int8, 29893644334::int8),
                   (-288484263558::int8, 29893644334::int8),
                   ((-9223372036854775808)::int8, 1::int8),
                   ((-9223372036854775808)::int8, 4611686018427387904::int8)) AS v(a, b)
      ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      SELECT gcd((-9223372036854775808)::int8, 0::int8)
    expect: error
    sqlstate: "22003"
    comment: the result 2^63 does not fit in int8
  - sql: |
      SELECT gcd((-9223372036854775808)::int8, (-9223372036854775808)::int8)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT lcm((-9223372036854775808)::int8, 1::int8)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT lcm(9223372036854775807::int8, 9223372036854775806::int8)
    expect: error
    sqlstate: "22003"
