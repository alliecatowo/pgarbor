# Temp table with same name but different column type; the type seen is the temp one.
id: temp.shadow-type
title: Temp table with same name and a float column shadows the int permanent table
family: temp
tier: core
feature_ids: [temp-tables, create-table, numeric, name-resolution]
required_capabilities: [create-table, insert, select, temp-tables]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE temptest (col int);
  INSERT INTO temptest VALUES (1);
steps:
  - sql: |
      CREATE TEMP TABLE temptest (tcol float8)
    expect: ok
  - sql: |
      INSERT INTO temptest VALUES (2.1)
    expect: ok
  - sql: |
      SELECT tcol, pg_typeof(tcol)::text AS t FROM temptest
    expect: rows
    order: multiset
  - sql: |
      DROP TABLE temptest
    expect: ok
  - sql: |
      SELECT col, pg_typeof(col)::text AS t FROM temptest
    expect: rows
    order: multiset
