# Inheritance child of an ON COMMIT DROP parent: dropping the parent at commit removes the child too.
id: temp.inherit-on-commit-drop
title: ON COMMIT DROP on an inheritance parent removes the child at commit
family: temp
tier: extended
feature_ids: [temp-tables, on-commit, inheritance, catalog-introspection]
required_capabilities: [create-table, insert, select, transactions, temp-tables, inheritance, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE TEMP TABLE temp_inh_oncommit_test (a int) ON COMMIT DROP
    expect: ok
  - sql: |
      CREATE TEMP TABLE temp_inh_oncommit_test1 () INHERITS (temp_inh_oncommit_test) ON COMMIT DELETE ROWS
    expect: ok
  - sql: |
      INSERT INTO temp_inh_oncommit_test1 VALUES (1)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT relname FROM pg_class WHERE relname ~ '^temp_inh_oncommit_test' ORDER BY relname
    expect: rows
    order: ordered
    comment: no relations remain
