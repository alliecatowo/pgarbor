# A domain created in pg_temp is usable by qualified or search-path name and enforces its CHECK.
id: temp.domain-in-pg-temp
title: Domain created in pg_temp enforces its CHECK constraint on cast
family: temp
tier: extended
feature_ids: [temp-tables, domains, search-path, errors]
required_capabilities: [select, temp-tables, domains, search-path]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SET search_path = pg_temp, public
    expect: ok
  - sql: |
      CREATE DOMAIN pg_temp.nonempty AS text CHECK (VALUE <> '')
    expect: ok
  - sql: |
      SELECT 'x'::nonempty AS v
    expect: rows
    order: multiset
  - sql: |
      DO $$ BEGIN PERFORM ''::nonempty; RAISE NOTICE 'no violation'; EXCEPTION WHEN check_violation THEN RAISE NOTICE 'check_violation caught, sqlstate %', SQLSTATE; END $$;
    expect: notice
    comment: the domain CHECK rejects the empty string with check_violation; the DO block avoids recording the pg_temp_N schema name, which varies per backend slot
  - sql: |
      RESET search_path
    expect: ok
