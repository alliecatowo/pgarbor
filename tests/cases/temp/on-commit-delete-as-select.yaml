# CREATE TEMP TABLE ... AS SELECT with ON COMMIT DELETE ROWS: data present until commit, then empty.
id: temp.on-commit-delete-as-select
title: CREATE TEMP TABLE AS with ON COMMIT DELETE ROWS populates then empties at commit
family: temp
tier: extended
feature_ids: [temp-tables, on-commit, create-table-as, transactions]
required_capabilities: [create-table, select, transactions, temp-tables]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE TEMP TABLE temptest (col) ON COMMIT DELETE ROWS AS SELECT 1
    expect: ok
  - sql: |
      SELECT col FROM temptest
    expect: rows
    order: multiset
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT count(*) FROM temptest
    expect: rows
    order: multiset
