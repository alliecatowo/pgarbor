# Temp tables disappear when the connection ends.
id: temp.reconnect-drops-temp
title: Temp table and its rows are gone after the session reconnects
family: temp
tier: core
feature_ids: [temp-tables, reconnect, errors]
required_capabilities: [create-table, insert, select, temp-tables]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TEMP TABLE temptest (col int)
    expect: ok
  - sql: |
      INSERT INTO temptest VALUES (1)
    expect: ok
  - sql: |
      SELECT count(*) FROM temptest
    expect: rows
    order: multiset
  - reconnect: true
  - sql: |
      SELECT col FROM temptest
    expect: error
    sqlstate: "42P01"
