# ON COMMIT DELETE ROWS on a partitioned parent empties only partitions that do not preserve rows.
id: temp.partition-on-commit-preserve
title: Partition with ON COMMIT PRESERVE ROWS keeps its rows when the parent deletes rows
family: temp
tier: extended
feature_ids: [temp-tables, on-commit, partitioning, catalog-introspection]
required_capabilities: [create-table, insert, select, transactions, temp-tables, partitioning, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE TEMP TABLE temp_parted_oncommit_test (a int) PARTITION BY LIST (a) ON COMMIT DELETE ROWS
    expect: ok
  - sql: |
      CREATE TEMP TABLE temp_parted_oncommit_test1 PARTITION OF temp_parted_oncommit_test FOR VALUES IN (1) ON COMMIT PRESERVE ROWS
    expect: ok
  - sql: |
      CREATE TEMP TABLE temp_parted_oncommit_test2 PARTITION OF temp_parted_oncommit_test FOR VALUES IN (2) ON COMMIT DROP
    expect: ok
  - sql: |
      INSERT INTO temp_parted_oncommit_test VALUES (1), (2)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT a FROM temp_parted_oncommit_test ORDER BY a
    expect: rows
    order: ordered
    comment: the preserved partition still holds its row
  - sql: |
      SELECT relname FROM pg_class WHERE relname ~ '^temp_parted_oncommit_test' ORDER BY relname
    expect: rows
    order: ordered
    comment: parent and the preserving partition remain
  - sql: |
      DROP TABLE temp_parted_oncommit_test
    expect: ok
