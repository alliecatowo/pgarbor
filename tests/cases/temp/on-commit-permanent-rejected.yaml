# ON COMMIT is only permitted on temporary tables; a permanent table is rejected and not created.
id: temp.on-commit-permanent-rejected
title: ON COMMIT clause on a permanent table is rejected and creates nothing
family: temp
tier: core
feature_ids: [temp-tables, on-commit, create-table, errors]
required_capabilities: [create-table, select, temp-tables]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE temptest (col int) ON COMMIT DELETE ROWS
    expect: error
    sqlstate: "42P16"
    comment: ON COMMIT can only be used on temporary tables
  - sql: |
      SELECT count(*) FROM temptest
    expect: error
    sqlstate: "42P01"
