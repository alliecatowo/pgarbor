# Temp table shadows a permanent table of the same name for unqualified references.
id: temp.name-masking
title: Temp table with the same name shadows the permanent table until dropped
family: temp
tier: core
feature_ids: [temp-tables, create-table, name-resolution, errors]
required_capabilities: [create-table, insert, select, temp-tables]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE temptest (col int);
  INSERT INTO temptest VALUES (1);
steps:
  - sql: |
      CREATE TEMP TABLE temptest (tcol int)
    expect: ok
  - sql: |
      INSERT INTO temptest VALUES (2)
    expect: ok
  - sql: |
      SELECT tcol FROM temptest
    expect: rows
    order: multiset
    comment: unqualified name resolves to the temp table
  - sql: |
      SELECT col FROM temptest
    expect: error
    sqlstate: "42703"
    comment: the permanent column is hidden by the temp table
  - sql: |
      SELECT col FROM public.temptest
    expect: rows
    order: multiset
    comment: schema-qualified name still reaches the permanent table
  - sql: |
      DROP TABLE temptest
    expect: ok
    comment: drops the temp table, the search path finds it first
  - sql: |
      SELECT col FROM temptest
    expect: rows
    order: multiset
  - sql: |
      SELECT tcol FROM temptest
    expect: error
    sqlstate: "42703"
