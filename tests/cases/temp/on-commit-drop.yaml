# ON COMMIT DROP removes the temp table at commit.
id: temp.on-commit-drop
title: ON COMMIT DROP removes the temp table at commit
family: temp
tier: core
feature_ids: [temp-tables, on-commit, transactions, errors]
required_capabilities: [create-table, insert, select, transactions, temp-tables]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/temp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE TEMP TABLE temptest (col int) ON COMMIT DROP
    expect: ok
  - sql: |
      INSERT INTO temptest VALUES (1), (2)
    expect: ok
  - sql: |
      SELECT count(*) FROM temptest
    expect: rows
    order: multiset
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT col FROM temptest
    expect: error
    sqlstate: "42P01"
    comment: undefined_table after commit dropped it
