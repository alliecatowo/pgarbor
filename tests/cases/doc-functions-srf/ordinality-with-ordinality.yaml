# Documented WITH ORDINALITY behavior: appended bigint column starting at 1, on unnest, ROWS FROM and SRFs, with zero-row and default-alias cases. pg_ls_dir from the docs is omitted (needs superuser and a data directory).
id: doc-functions-srf.with-ordinality
title: WITH ORDINALITY appends a 1-based bigint column to set-returning functions
family: doc-functions-srf
tier: core
feature_ids: [with-ordinality, srf-from-clause, unnest, rows-from]
required_capabilities: [select, arrays]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf (ordinality)"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM unnest(ARRAY[10,20]) WITH ORDINALITY AS t(v,n)
    expect: rows
    comment: ordinality column is appended and numbered from 1
  - sql: |
      SELECT * FROM generate_series(1,3) WITH ORDINALITY
    expect: rows
    comment: default column names when no alias is given
  - sql: |
      SELECT * FROM ROWS FROM (generate_series(1,2), unnest(ARRAY['a','b','c']))
        WITH ORDINALITY AS t(g,v,n)
    expect: rows
    comment: shorter function output is NULL-padded; ordinality keeps counting to the longest
  - sql: |
      SELECT * FROM generate_series(1,0) WITH ORDINALITY AS t(g,n)
    expect: rows
    comment: zero-row function yields zero rows with the extra column still declared
