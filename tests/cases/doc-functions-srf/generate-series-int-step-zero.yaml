# Documented error: step must not be zero. Covers integer, bigint and numeric forms (SQLSTATE 22023 'step size cannot equal zero').
id: doc-functions-srf.generate-series-step-zero
title: generate_series rejects a zero step for integer, bigint, numeric and timestamp forms
family: doc-functions-srf
tier: core
feature_ids: [generate-series, error-reporting]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-series"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM generate_series(1,10,0)
    expect: error
    sqlstate: "22023"
    comment: documented; it is an error for step to be zero
  - sql: |
      SELECT * FROM generate_series(1::bigint,10::bigint,0::bigint)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT * FROM generate_series(1.0::numeric,3,0)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT * FROM generate_series('2008-03-01'::timestamp,'2008-03-03','0 hours'::interval)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    comment: the session stays usable after the failed statements (autocommit)
