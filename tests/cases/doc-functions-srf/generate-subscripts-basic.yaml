# Documented generate_subscripts examples, reverse flag, and zero-row rules for missing dimension, empty array and NULL inputs.
id: doc-functions-srf.generate-subscripts-basic
title: generate_subscripts basic, reverse, and zero-row cases
family: doc-functions-srf
tier: core
feature_ids: [generate-subscripts, arrays]
required_capabilities: [select, arrays]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-subscripts"
sessions: [a]
steps:
  - sql: |
      SELECT generate_subscripts('{NULL,1,NULL,2}'::int[], 1) AS s
    expect: rows
    comment: documented example; NULL elements still have subscripts
  - sql: |
      SELECT generate_subscripts('{NULL,1,NULL,2}'::int[], 1, true) AS s
    expect: rows
    comment: reverse order
  - sql: |
      SELECT generate_subscripts('{1,2}'::int[], 2) AS s
    expect: rows
    comment: a one-dimensional array has no dimension 2, zero rows
  - sql: |
      SELECT generate_subscripts('{}'::int[], 1) AS s
    expect: rows
    comment: empty array, zero rows
  - sql: |
      SELECT generate_subscripts(NULL::int[], 1) AS s
    expect: rows
    comment: NULL array input, zero rows
  - sql: |
      SELECT generate_subscripts('{1,2}'::int[], NULL::int) AS s
    expect: rows
    comment: NULL dimension, zero rows
