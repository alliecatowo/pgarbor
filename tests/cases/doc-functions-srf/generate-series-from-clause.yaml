# generate_series used as a FROM item with a table alias and column alias: filtering, aggregation, and a join against a table.
id: doc-functions-srf.generate-series-from-clause
title: generate_series as a FROM item with aliases, filtering, aggregation and joining
family: doc-functions-srf
tier: core
feature_ids: [generate-series, srf-from-clause, aggregates, joins]
required_capabilities: [create-table, insert, select, aggregates, join]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-series"
setup: |
  CREATE TABLE slots (k int4 PRIMARY KEY, label text);
  INSERT INTO slots VALUES (1, 'one'), (3, 'three'), (5, 'five');
sessions: [a]
steps:
  - sql: |
      SELECT g.x FROM generate_series(1,3) AS g(x) WHERE x > 1 ORDER BY x
    expect: rows
    order: ordered
  - sql: |
      SELECT sum(x) AS total, count(*) AS n FROM generate_series(1,10,3) AS g(x)
    expect: rows
    comment: values 1,4,7,10 -> sum 22, count 4
  - sql: |
      SELECT g.x, s.label FROM generate_series(1,5) AS g(x)
      LEFT JOIN slots s ON s.k = g.x
      ORDER BY g.x
    expect: rows
    order: ordered
    comment: left join keeps unmatched series values with NULL labels
