# Documented timestamptz generate_series example with an explicit time zone argument across a DST transition.
id: doc-functions-srf.generate-series-timestamptz-tz
title: generate_series over timestamptz with an explicit time zone across DST
family: doc-functions-srf
tier: core
feature_ids: [generate-series, timestamptz, time-zone]
required_capabilities: [select, timestamptz, time-zone]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-series"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
    comment: the documented example assumes TimeZone is UTC for output; pin it
  - sql: |
      SELECT * FROM generate_series('2001-10-22 00:00 -04:00'::timestamptz,
                                    '2001-11-01 00:00 -05:00'::timestamptz,
                                    '1 day'::interval, 'America/New_York')
    expect: rows
    comment: documented example; the local wall-clock time is kept across the 2001-10-28 DST change, so the UTC offset shifts
  - sql: |
      SELECT * FROM generate_series('2001-10-22 00:00 -04:00'::timestamptz,
                                    '2001-10-24 00:00 -04:00'::timestamptz,
                                    '1 day'::interval)
    expect: rows
    comment: without the timezone argument the session TimeZone (UTC) governs, so the series is fixed 24h steps
