# Documented numeric generate_series example with a non-integer step, plus bigint and NULL-step behavior.
id: doc-functions-srf.generate-series-numeric
title: generate_series over numeric with a fractional step and bigint with NULL step
family: doc-functions-srf
tier: core
feature_ids: [generate-series, numeric]
required_capabilities: [select, numeric]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-series"
sessions: [a]
steps:
  - sql: |
      SELECT generate_series(1.1, 4, 1.3)
    expect: rows
    comment: documented example; numeric results keep the input scale (1.1, 2.4, 3.7)
  - sql: |
      SELECT generate_series(4.5::numeric, 4.5::numeric, 0.25::numeric) AS x
    expect: rows
    comment: single-element series, fractional step
  - sql: |
      SELECT generate_series(1::bigint, 3, NULL::bigint) AS x
    expect: rows
    comment: NULL step with bigint input yields zero rows
  - sql: |
      SELECT generate_series(1::bigint, 3::bigint) AS x
    expect: rows
    comment: default step for bigint is 1
