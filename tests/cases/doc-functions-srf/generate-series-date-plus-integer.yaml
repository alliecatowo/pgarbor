# Documented example combining generate_series with the date + integer operator, using a fixed date for determinism.
id: doc-functions-srf.generate-series-date-plus-integer
title: generate_series integer offsets added to a date
family: doc-functions-srf
tier: core
feature_ids: [generate-series, date, date-arithmetic]
required_capabilities: [select, date]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-series"
sessions: [a]
steps:
  - sql: |
      SELECT DATE '2004-02-05' + s.a AS dates FROM generate_series(0,14,7) AS s(a)
    expect: rows
    comment: documented example, with current_date replaced by a literal so the output is deterministic
