# Documented generate_series(integer) examples, plus documented zero-row rules: start > stop with positive step, start < stop with negative step, NULL inputs.
id: doc-functions-srf.generate-series-int-examples
title: generate_series over integer with documented step direction and zero-row rules
family: doc-functions-srf
tier: core
feature_ids: [generate-series, srf-from-clause]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-series"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM generate_series(2,4)
    expect: rows
    comment: documented example, default step 1
  - sql: |
      SELECT * FROM generate_series(5,1,-2)
    expect: rows
    comment: documented example, negative step
  - sql: |
      SELECT * FROM generate_series(4,3)
    expect: rows
    comment: documented example, positive step with start > stop yields zero rows
  - sql: |
      SELECT * FROM generate_series(1,5,-1)
    expect: rows
    comment: negative step with start < stop yields zero rows
  - sql: |
      SELECT count(*) AS n_null_start FROM generate_series(NULL::int, 3, 1)
    expect: rows
  - sql: |
      SELECT count(*) AS n_null_stop FROM generate_series(1, NULL::int)
    expect: rows
  - sql: |
      SELECT count(*) AS n_null_step FROM generate_series(1, 3, NULL::int)
    expect: rows
    comment: a NULL input of any kind returns zero rows
