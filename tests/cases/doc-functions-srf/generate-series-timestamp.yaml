# Documented timestamp generate_series example with an interval step that crosses day boundaries.
id: doc-functions-srf.generate-series-timestamp
title: generate_series over timestamp with a 10 hour interval step
family: doc-functions-srf
tier: core
feature_ids: [generate-series, timestamp, interval]
required_capabilities: [select, timestamp, interval]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-srf-series"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM generate_series('2008-03-01 00:00'::timestamp,
                                    '2008-03-04 12:00', '10 hours')
    expect: rows
    comment: documented example; last value 2008-03-04 08:00 is the final value not exceeding stop
  - sql: |
      SELECT * FROM generate_series('2008-03-01 00:00'::timestamp,
                                    '2008-03-01 00:00'::timestamp, '1 day')
    expect: rows
    comment: start equal to stop yields one row
  - sql: |
      SELECT * FROM generate_series('2008-03-04 00:00'::timestamp,
                                    '2008-03-01 00:00'::timestamp, '-1 day')
    expect: rows
    comment: negative interval step, start > stop
