# An extension must be installed before a trigger can depend on it; the lookup fails for both DEPENDS and NO DEPENDS.
id: cmd-alter-trigger.depends-on-missing-extension-error
title: "DEPENDS ON EXTENSION naming an uninstalled extension is rejected"
family: cmd-alter-trigger
tier: core
feature_ids: [alter-trigger, extensions, depends-on-extension, errors]
required_capabilities: [create-table, select, triggers, plpgsql, create-function, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (Parameters: extension_name)"
sessions: [a]
setup: |
  CREATE TABLE emp (id int4, v text);
  CREATE FUNCTION ath_noop() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TRIGGER emp_stamp BEFORE INSERT ON emp FOR EACH ROW EXECUTE FUNCTION ath_noop();
steps:
  - sql: |
      ALTER TRIGGER emp_stamp ON emp DEPENDS ON EXTENSION hstore
    expect: error
    sqlstate: "42704"
    comment: hstore is not installed in this database
  - sql: |
      ALTER TRIGGER emp_stamp ON emp NO DEPENDS ON EXTENSION hstore
    expect: error
    sqlstate: "42704"
    comment: the extension name is resolved even when clearing the dependency
  - sql: |
      SELECT tgname FROM pg_trigger WHERE tgname = 'emp_stamp'
    expect: rows
    comment: trigger unchanged
