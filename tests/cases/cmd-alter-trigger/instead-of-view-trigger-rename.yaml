# ALTER TRIGGER also applies to INSTEAD OF triggers defined on a view; the renamed trigger still fires for view inserts.
id: cmd-alter-trigger.instead-of-view-trigger-rename
title: "RENAME works on an INSTEAD OF trigger on a view and it still fires"
family: cmd-alter-trigger
tier: extended
feature_ids: [alter-trigger, rename, views, instead-of-triggers]
required_capabilities: [create-table, insert, select, triggers, create-view, plpgsql, create-function, catalog-introspection]
provenance:
  source: research
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (ON table_name); verified against PG 18.6 oracle"
sessions: [a]
setup: |
  CREATE TABLE ct (id int4);
  CREATE VIEW v AS SELECT id FROM ct;
  CREATE FUNCTION ath_vins() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN INSERT INTO ct VALUES (NEW.id); RETURN NEW; END $$;
  CREATE TRIGGER v_ins INSTEAD OF INSERT ON v FOR EACH ROW EXECUTE FUNCTION ath_vins();
steps:
  - sql: |
      ALTER TRIGGER v_ins ON v RENAME TO v_ins2
    expect: ok
  - sql: |
      INSERT INTO v VALUES (7)
    expect: ok
  - sql: |
      SELECT id FROM ct ORDER BY id
    expect: rows
    order: ordered
