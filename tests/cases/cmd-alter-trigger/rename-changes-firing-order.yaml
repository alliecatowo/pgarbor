# Row triggers fire in alphabetical name order, so renaming a trigger changes the order in which it fires.
id: cmd-alter-trigger.rename-changes-firing-order
title: "Renaming a trigger changes its alphabetical firing position"
family: cmd-alter-trigger
tier: core
feature_ids: [alter-trigger, rename, triggers, trigger-firing-order]
required_capabilities: [create-table, insert, delete, select, triggers, plpgsql, create-function]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (Description); CREATE TRIGGER firing order"
sessions: [a]
setup: |
  CREATE TABLE ath_sink (seq int4 GENERATED ALWAYS AS IDENTITY, tag text);
  CREATE TABLE t (id int4);
  CREATE FUNCTION ath_fire() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN INSERT INTO ath_sink(tag) VALUES (TG_NAME); RETURN NEW; END $$;
  CREATE TRIGGER b_first BEFORE INSERT ON t FOR EACH ROW EXECUTE FUNCTION ath_fire();
  CREATE TRIGGER a_second BEFORE INSERT ON t FOR EACH ROW EXECUTE FUNCTION ath_fire();
steps:
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SELECT tag FROM ath_sink ORDER BY seq
    expect: rows
    order: ordered
    comment: a_second fires before b_first
  - sql: |
      ALTER TRIGGER b_first ON t RENAME TO zz_last
    expect: ok
  - sql: |
      DELETE FROM ath_sink
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      SELECT tag FROM ath_sink ORDER BY seq
    expect: rows
    order: ordered
    comment: zz_last now sorts last and fires last
