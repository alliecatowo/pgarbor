# RENAME changes only the trigger name; the trigger keeps its definition and still fires under the new name.
id: cmd-alter-trigger.rename-catalog-and-firing
title: "RENAME TO changes the catalog name and the trigger still fires"
family: cmd-alter-trigger
tier: core
feature_ids: [alter-trigger, rename, triggers]
required_capabilities: [create-table, insert, select, triggers, plpgsql, create-function, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (Description, RENAME; Examples)"
sessions: [a]
setup: |
  CREATE TABLE ath_sink (seq int4 GENERATED ALWAYS AS IDENTITY, tag text);
  CREATE TABLE emp (id int4, v text);
  CREATE FUNCTION ath_fire() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN INSERT INTO ath_sink(tag) VALUES (TG_NAME); RETURN NEW; END $$;
  CREATE TRIGGER emp_stamp BEFORE INSERT ON emp FOR EACH ROW EXECUTE FUNCTION ath_fire();
steps:
  - sql: |
      ALTER TRIGGER emp_stamp ON emp RENAME TO emp_track_chgs
    expect: ok
  - sql: |
      SELECT tgname FROM pg_trigger WHERE tgrelid = 'emp'::regclass AND NOT tgisinternal ORDER BY tgname
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO emp VALUES (1, 'a')
    expect: ok
  - sql: |
      SELECT tag FROM ath_sink ORDER BY seq
    expect: rows
    order: ordered
    comment: the renamed trigger fires and TG_NAME reports the new name
