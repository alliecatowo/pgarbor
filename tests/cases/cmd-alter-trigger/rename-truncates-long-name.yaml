# Trigger names longer than NAMEDATALEN-1 (63 bytes) are truncated with a NOTICE, not rejected.
id: cmd-alter-trigger.rename-truncates-long-name
title: "RENAME TO a 70-character name stores the first 63 characters with a NOTICE"
family: cmd-alter-trigger
tier: extended
feature_ids: [alter-trigger, rename, identifier-length]
required_capabilities: [create-table, select, triggers, plpgsql, create-function, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (Parameters: new_name)"
sessions: [a]
setup: |
  CREATE TABLE emp (id int4, v text);
  CREATE FUNCTION ath_noop() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TRIGGER emp_stamp BEFORE INSERT ON emp FOR EACH ROW EXECUTE FUNCTION ath_noop();
steps:
  - sql: |
      ALTER TRIGGER emp_stamp ON emp RENAME TO ath_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    expect: notice
    comment: 70 characters; truncated to 63 with NOTICE
  - sql: |
      SELECT length(tgname) AS n, left(tgname, 4) AS prefix FROM pg_trigger WHERE tgrelid = 'emp'::regclass AND NOT tgisinternal
    expect: rows
