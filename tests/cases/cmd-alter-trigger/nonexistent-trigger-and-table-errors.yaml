# Unknown trigger, a trigger that exists only on a different table, and an unknown table each raise a lookup error.
id: cmd-alter-trigger.nonexistent-trigger-and-table-errors
title: "ALTER TRIGGER on an unknown trigger, wrong table, or unknown table errors"
family: cmd-alter-trigger
tier: core
feature_ids: [alter-trigger, errors]
required_capabilities: [create-table, select, triggers, plpgsql, create-function, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (Parameters: name, table_name)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4);
  CREATE TABLE u (id int4);
  CREATE FUNCTION ath_noop() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TRIGGER trg_t BEFORE INSERT ON t FOR EACH ROW EXECUTE FUNCTION ath_noop();
steps:
  - sql: |
      ALTER TRIGGER missing ON t RENAME TO x
    expect: error
    sqlstate: "42704"
    comment: no trigger named missing on t
  - sql: |
      ALTER TRIGGER trg_t ON u RENAME TO x
    expect: error
    sqlstate: "42704"
    comment: trg_t exists on t, not on u
  - sql: |
      ALTER TRIGGER trg_t ON no_such_table RENAME TO x
    expect: error
    sqlstate: "42P01"
    comment: the table does not exist
  - sql: |
      SELECT tgrelid::regclass::text AS tbl, tgname FROM pg_trigger WHERE NOT tgisinternal ORDER BY 1, 2
    expect: rows
    order: ordered
    comment: trg_t is unchanged
