# Renaming a trigger on a partitioned table also renames the clone triggers on its partitions.
id: cmd-alter-trigger.partition-rename-propagates
title: "RENAME on a partitioned table renames the clone triggers on its partitions"
family: cmd-alter-trigger
tier: core
feature_ids: [alter-trigger, rename, partitioning, triggers]
required_capabilities: [create-table, insert, select, triggers, partitioning, plpgsql, create-function, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (Description, RENAME)"
sessions: [a]
setup: |
  CREATE TABLE ath_sink (seq int4 GENERATED ALWAYS AS IDENTITY, tag text);
  CREATE FUNCTION ath_fire() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN INSERT INTO ath_sink(tag) VALUES (TG_NAME); RETURN NEW; END $$;
  CREATE TABLE pt (id int4, v text) PARTITION BY RANGE (id);
  CREATE TABLE pt1 PARTITION OF pt FOR VALUES FROM (0) TO (10);
  CREATE TABLE pt2 PARTITION OF pt FOR VALUES FROM (10) TO (20);
  CREATE TRIGGER pt_row AFTER INSERT ON pt FOR EACH ROW EXECUTE FUNCTION ath_fire();
steps:
  - sql: |
      ALTER TRIGGER pt_row ON pt RENAME TO pt_renamed
    expect: ok
  - sql: |
      SELECT c.relname, t.tgname, t.tgparentid <> 0 AS is_clone FROM pg_trigger t JOIN pg_class c ON c.oid = t.tgrelid WHERE NOT t.tgisinternal ORDER BY 1, 2
    expect: rows
    order: ordered
    comment: pt, pt1 and pt2 all carry pt_renamed; the partitions hold clones
  - sql: |
      INSERT INTO pt VALUES (1, 'a')
    expect: ok
  - sql: |
      SELECT tag FROM ath_sink ORDER BY seq
    expect: rows
    order: ordered
    comment: the clone on pt1 fires once under the new name
