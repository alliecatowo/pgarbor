# Repeating DEPENDS ON EXTENSION on an already dependent trigger succeeds and does not add a second dependency.
id: cmd-alter-trigger.depends-on-extension-is-idempotent
title: "Repeated DEPENDS ON EXTENSION keeps a single extension dependency"
family: cmd-alter-trigger
tier: core
feature_ids: [alter-trigger, extensions, depends-on-extension]
required_capabilities: [create-table, select, triggers, create-extension, extensions, plpgsql, create-function, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (DEPENDS ON EXTENSION)"
sessions: [a]
setup: |
  CREATE TABLE emp (id int4, v text);
  CREATE FUNCTION ath_noop() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TRIGGER emp_stamp BEFORE INSERT ON emp FOR EACH ROW EXECUTE FUNCTION ath_noop();
steps:
  - sql: |
      CREATE EXTENSION hstore
    expect: ok
  - sql: |
      ALTER TRIGGER emp_stamp ON emp DEPENDS ON EXTENSION hstore
    expect: ok
  - sql: |
      ALTER TRIGGER emp_stamp ON emp DEPENDS ON EXTENSION hstore
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_depend d JOIN pg_trigger t ON d.classid = 'pg_trigger'::regclass AND d.objid = t.oid WHERE t.tgname = 'emp_stamp' AND d.refclassid = 'pg_extension'::regclass
    expect: rows
    comment: exactly one dependency row
  - sql: |
      DROP EXTENSION hstore
    expect: ok
