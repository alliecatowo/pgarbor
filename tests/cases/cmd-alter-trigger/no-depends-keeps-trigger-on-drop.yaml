# NO DEPENDS ON EXTENSION removes the dependency, so dropping the extension leaves the trigger in place; repeating it is harmless.
id: cmd-alter-trigger.no-depends-keeps-trigger-on-drop
title: "NO DEPENDS ON EXTENSION detaches the trigger so DROP EXTENSION keeps it"
family: cmd-alter-trigger
tier: core
feature_ids: [alter-trigger, extensions, depends-on-extension]
required_capabilities: [create-table, select, triggers, create-extension, extensions, plpgsql, create-function, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_trigger.sgml#sql-altertrigger (DEPENDS ON EXTENSION: NO)"
sessions: [a]
setup: |
  CREATE TABLE emp (id int4, v text);
  CREATE FUNCTION ath_noop() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TRIGGER emp_stamp BEFORE INSERT ON emp FOR EACH ROW EXECUTE FUNCTION ath_noop();
steps:
  - sql: |
      CREATE EXTENSION hstore
    expect: ok
  - sql: |
      ALTER TRIGGER emp_stamp ON emp DEPENDS ON EXTENSION hstore
    expect: ok
  - sql: |
      ALTER TRIGGER emp_stamp ON emp NO DEPENDS ON EXTENSION hstore
    expect: ok
  - sql: |
      ALTER TRIGGER emp_stamp ON emp NO DEPENDS ON EXTENSION hstore
    expect: ok
    comment: clearing a dependency that is already absent is not an error
  - sql: |
      DROP EXTENSION hstore
    expect: ok
  - sql: |
      SELECT tgname FROM pg_trigger WHERE tgname = 'emp_stamp'
    expect: rows
    comment: one row; the trigger survived the extension drop
