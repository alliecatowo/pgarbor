# DISABLE ROW LEVEL SECURITY keeps the policy definitions; they are simply ignored until RLS is enabled again.
id: doc-ddl-rowsecurity.disable-keeps-policies
title: "Disabling row security leaves policies defined but inactive"
family: doc-ddl-rowsecurity
tier: core
feature_ids: [rls, policies, alter-table, select]
required_capabilities: [create-table, insert, select, rls, roles, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-rowsecurity: Disabling row security does not remove any policies that are defined on the table"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_role_dr11_u;
  CREATE TABLE t (id int4, owner text);
  INSERT INTO t VALUES (1, 'x'), (2, 'y');
  GRANT SELECT ON t TO pgarbor_case_role_dr11_u;
  ALTER TABLE t ENABLE ROW LEVEL SECURITY;
  CREATE POLICY p ON t FOR SELECT USING (owner = 'x');
steps:
  - sql: |
      SET ROLE pgarbor_case_role_dr11_u
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: only row 1 is visible while RLS is enabled
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      ALTER TABLE t DISABLE ROW LEVEL SECURITY
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE schemaname = 'public' AND tablename = 't'
    expect: rows
    order: multiset
    comment: the policy is still defined
  - sql: |
      SET ROLE pgarbor_case_role_dr11_u
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the policy is ignored, so both rows are visible
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      ALTER TABLE t ENABLE ROW LEVEL SECURITY
    expect: ok
  - sql: |
      SET ROLE pgarbor_case_role_dr11_u
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the policy applies again after re-enabling
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP TABLE t
    expect: ok
  - sql: |
      DROP ROLE pgarbor_case_role_dr11_u
    expect: ok
