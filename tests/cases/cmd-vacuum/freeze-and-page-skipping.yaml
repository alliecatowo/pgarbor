# FREEZE and DISABLE_PAGE_SKIPPING are accepted in every spelling and leave row contents unchanged.
id: cmd-vacuum.freeze-and-page-skipping
title: "VACUUM FREEZE and DISABLE_PAGE_SKIPPING forms preserve data"
family: cmd-vacuum
tier: extended
feature_ids: [vacuum, freeze, disable-page-skipping, options]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/vacuum.sgml#sql-vacuum (Parameters: FREEZE, DISABLE_PAGE_SKIPPING)"
sessions: [a]
setup: |
  CREATE TABLE vfz (id int4 PRIMARY KEY, v text);
  INSERT INTO vfz SELECT g, 'v' || g FROM generate_series(1, 25) g;
steps:
  - sql: |
      VACUUM (FREEZE) vfz
    expect: ok
    comment: aggressive freezing, same as the zero-age GUCs
  - sql: |
      VACUUM FREEZE vfz
    expect: ok
    comment: legacy spelling
  - sql: |
      VACUUM (FREEZE false, DISABLE_PAGE_SKIPPING) vfz
    expect: ok
    comment: page skipping disabled, freezing turned off
  - sql: |
      VACUUM (DISABLE_PAGE_SKIPPING 0, FREEZE on, ANALYZE) vfz
    expect: ok
  - sql: |
      SELECT count(*), sum(id), min(v), max(v) FROM vfz
    expect: rows
    order: ordered
