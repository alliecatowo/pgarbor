# The documented example VACUUM (VERBOSE, ANALYZE) onek cleans a table and analyzes all of its columns.
id: cmd-vacuum.onek-docs-example
title: "VACUUM (VERBOSE, ANALYZE) onek from the reference examples"
family: cmd-vacuum
tier: core
feature_ids: [vacuum, analyze, verbose, examples]
required_capabilities: [create-table, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/vacuum.sgml#sql-vacuum (Examples)"
sessions: [a]
setup: |
  CREATE TABLE onek (unique1 int4, unique2 int4, two int4, four int4, ten int4);
  INSERT INTO onek SELECT g % 1000, g, g % 2, g % 4, g % 10 FROM generate_series(0, 999) g;
steps:
  - sql: |
      VACUUM (VERBOSE, ANALYZE) onek;
    expect: ok
    compare_message: false
    comment: the VERBOSE report contains timings, so only the status is compared
  - sql: |
      SELECT count(*) FROM pg_stats WHERE schemaname = 'public' AND tablename = 'onek'
    expect: rows
    order: ordered
    comment: one statistics row per column
  - sql: |
      SELECT count(*), sum(ten) FROM onek
    expect: rows
    order: ordered
