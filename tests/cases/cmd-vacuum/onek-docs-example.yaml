# The documented example VACUUM (ANALYZE) onek cleans a table and analyzes all of its columns; the docs' VERBOSE variant is omitted because its progress lines are not reproducible.
id: cmd-vacuum.onek-docs-example
title: "VACUUM (ANALYZE) onek from the reference examples"
family: cmd-vacuum
tier: core
feature_ids: [vacuum, analyze, examples]
required_capabilities: [create-table, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/vacuum.sgml#sql-vacuum (Examples)"
sessions: [a]
setup: |
  CREATE TABLE onek (unique1 int4, unique2 int4, two int4, four int4, ten int4);
  INSERT INTO onek SELECT g % 1000, g, g % 2, g % 4, g % 10 FROM generate_series(0, 999) g;
steps:
  - sql: |
      VACUUM (ANALYZE) onek;
    expect: ok
    comment: the docs example without VERBOSE; VERBOSE progress lines name the per-run database and vary in XID cutoffs and I/O rates
  - sql: |
      SELECT count(*) FROM pg_stats WHERE schemaname = 'public' AND tablename = 'onek'
    expect: rows
    order: ordered
    comment: one statistics row per column
  - sql: |
      SELECT count(*), sum(ten) FROM onek
    expect: rows
    order: ordered
