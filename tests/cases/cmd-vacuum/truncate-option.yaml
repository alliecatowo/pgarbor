# Plain VACUUM returns empty trailing pages to the OS; TRUNCATE FALSE keeps them. Table contents are the same either way.
id: cmd-vacuum.truncate-option
title: "VACUUM TRUNCATE controls whether empty trailing pages are released"
family: cmd-vacuum
tier: core
feature_ids: [vacuum, truncate, relation-size]
required_capabilities: [create-table, insert, delete, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/vacuum.sgml#sql-vacuum (Parameters: TRUNCATE)"
sessions: [a]
setup: |
  CREATE TABLE vtr (id int4 PRIMARY KEY, v int4, s text);
  INSERT INTO vtr SELECT g, g * 10, repeat('x', 100) FROM generate_series(1, 400) g;
  DELETE FROM vtr WHERE id > 10;
steps:
  - sql: |
      SELECT pg_relation_size('vtr') > 8192 AS multi_page
    expect: rows
    order: ordered
    comment: the deleted tuples still occupy pages before VACUUM
  - sql: |
      VACUUM (TRUNCATE false) vtr
    expect: ok
  - sql: |
      SELECT pg_relation_size('vtr') > 8192 AS multi_page_after_no_truncate
    expect: rows
    order: ordered
    comment: TRUNCATE false leaves the trailing empty pages in place
  - sql: |
      VACUUM (TRUNCATE true) vtr
    expect: ok
  - sql: |
      SELECT pg_relation_size('vtr') AS size_after_truncate
    expect: rows
    order: ordered
    comment: the empty trailing pages are returned, leaving one page
  - sql: |
      SELECT count(*), sum(v) FROM vtr
    expect: rows
    order: ordered
