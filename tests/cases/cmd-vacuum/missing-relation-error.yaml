# A name that does not resolve to a relation fails the whole command with undefined_table before any listed table is processed.
id: cmd-vacuum.missing-relation-error
title: "VACUUM on an undefined relation fails with undefined_table"
family: cmd-vacuum
tier: core
feature_ids: [vacuum, errors, table-list]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/vacuum.sgml#sql-vacuum (Parameters: table_name)"
sessions: [a]
setup: |
  CREATE TABLE vmr (id int4);
  INSERT INTO vmr VALUES (1);
steps:
  - sql: |
      VACUUM nosuch
    expect: error
    sqlstate: "42P01"
  - sql: |
      VACUUM ONLY nosuch
    expect: error
    sqlstate: "42P01"
  - sql: |
      VACUUM vmr, nosuch
    expect: error
    sqlstate: "42P01"
    comment: a single unknown name in the list rejects the list
  - sql: |
      VACUUM vmr
    expect: ok
