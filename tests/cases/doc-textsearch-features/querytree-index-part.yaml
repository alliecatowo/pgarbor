# querytree returns the part of a tsquery that can be used against an index: stemmed lexemes survive,
# purely negated queries reduce to T.
id: doc-textsearch-features.querytree-index-part
title: querytree shows the indexable portion of a tsquery
family: doc-textsearch-features
tier: extended
feature_ids: [querytree, tsquery-stemming, tsquery-negation]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-manipulate-tsquery"
steps:
  - sql: |
      SELECT querytree(to_tsquery('english', 'defined')) AS q_stemmed,
             querytree(to_tsquery('english', '!defined')) AS q_negated
    expect: rows
    order: ordered
    comment: documented examples; 'defin' is the stem, a bare negation has no indexable part
  - sql: |
      SELECT querytree(to_tsquery('english', 'fat & !rat')) AS q_mixed
    expect: rows
    order: ordered
  - sql: |
      SELECT querytree(plainto_tsquery('english', 'the and')) AS q_stopwords
    expect: rows
    order: ordered
    comment: only stop words, so nothing is indexable
