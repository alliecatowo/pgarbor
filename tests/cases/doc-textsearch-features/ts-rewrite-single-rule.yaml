# ts_rewrite(query, target, substitute) replaces every occurrence of target by substitute.
id: doc-textsearch-features.ts-rewrite-single-rule
title: ts_rewrite applies one target-to-substitute rule everywhere it occurs
family: doc-textsearch-features
tier: core
feature_ids: [ts-rewrite, tsquery-rewrite-rule]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-query-rewriting"
steps:
  - sql: |
      SELECT ts_rewrite('a & b'::tsquery, 'a'::tsquery, 'c'::tsquery)::text AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT ts_rewrite('a & (a | b)'::tsquery, 'a'::tsquery, 'c'::tsquery)::text AS r_all_occurrences
    expect: rows
    order: ordered
  - sql: |
      SELECT ts_rewrite('x & y'::tsquery, 'a'::tsquery, 'c'::tsquery)::text AS r_no_match
    expect: rows
    order: ordered
    comment: target absent, query returned unchanged
  - sql: |
      SELECT ts_rewrite('a & b'::tsquery, 'a & b'::tsquery, 'c'::tsquery)::text AS r_compound_target
    expect: rows
    order: ordered
  - sql: |
      SELECT ts_rewrite(NULL::tsquery, 'a'::tsquery, 'c'::tsquery) IS NULL AS null_query
    expect: rows
    order: ordered
