# length() counts lexemes; strip() keeps the lexemes and drops positions and weights.
id: doc-textsearch-features.length-and-strip
title: length counts lexemes and strip drops positions and weights
family: doc-textsearch-features
tier: core
feature_ids: [tsvector-length, strip, tsvector-positions]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-manipulate-tsvector"
steps:
  - sql: |
      SELECT length('a:1 b:2 c'::tsvector) AS n_plain,
             length(strip('a:1 b:2 c'::tsvector)) AS n_stripped
    expect: rows
    order: ordered
  - sql: |
      SELECT length(to_tsvector('english', 'The quick brown fox jumps over the lazy dog')) AS n
    expect: rows
    order: ordered
    comment: stop words are not stored, so only content lexemes are counted
  - sql: |
      SELECT strip(to_tsvector('english', 'fat cats running')) AS v
    expect: rows
    order: ordered
  - sql: |
      SELECT strip(setweight(to_tsvector('simple', 'fat cat'), 'A'))::text AS v
    expect: rows
    order: ordered
  - sql: |
      SELECT length(NULL::tsvector) IS NULL AS null_length,
             strip(NULL::tsvector) IS NULL AS null_strip
    expect: rows
    order: ordered
  - sql: |
      SELECT length(''::tsvector) AS empty_length
    expect: rows
    order: ordered
