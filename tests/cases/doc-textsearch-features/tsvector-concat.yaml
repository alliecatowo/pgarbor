# tsvector || tsvector: positions of the right operand are offset by the largest position of the left;
# weight labels survive; concatenating with an empty vector is the identity.
id: doc-textsearch-features.tsvector-concat
title: tsvector concatenation offsets right-hand positions and keeps weights
family: doc-textsearch-features
tier: core
feature_ids: [tsvector-concat, tsvector-positions, tsvector-weights]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-manipulate-tsvector"
steps:
  - sql: |
      SELECT ('a:1 b:2'::tsvector || 'c:1 d:1'::tsvector)::text AS v
    expect: rows
    order: ordered
    comment: right-hand positions offset by the largest left-hand position
  - sql: |
      SELECT ('a:1A b:2'::tsvector || 'c:1B'::tsvector)::text AS v
    expect: rows
    order: ordered
    comment: weight labels are retained through concatenation
  - sql: |
      SELECT (to_tsvector('simple', 'fat cats') || to_tsvector('english', 'fat rats'))::text AS v
    expect: rows
    order: ordered
    comment: vectors built with different configurations can be combined
  - sql: |
      SELECT ('a:1 b:2'::tsvector || ''::tsvector)::text AS left_identity,
             (''::tsvector || 'a:1 b:2'::tsvector)::text AS right_identity
    expect: rows
    order: ordered
  - sql: |
      SELECT (NULL::tsvector || 'a:1'::tsvector) IS NULL AS null_left,
             ('a:1'::tsvector || NULL::tsvector) IS NULL AS null_right
    expect: rows
    order: ordered
