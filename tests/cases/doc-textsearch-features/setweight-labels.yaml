# setweight labels every position with A, B, C or D; D is the default and is not displayed;
# setweight does nothing on a stripped vector; NULL in gives NULL out.
id: doc-textsearch-features.setweight-labels
title: setweight assigns A-D labels, default D is hidden, stripped vectors are unchanged
family: doc-textsearch-features
tier: core
feature_ids: [setweight, tsvector-weights, strip]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-manipulate-tsvector"
steps:
  - sql: |
      SELECT setweight(to_tsvector('simple', 'fat cat'), 'A')::text AS v
    expect: rows
    order: ordered
  - sql: |
      SELECT setweight(to_tsvector('simple', 'fat cat'), 'B')::text AS v
    expect: rows
    order: ordered
  - sql: |
      SELECT setweight(to_tsvector('simple', 'fat cat'), 'D')::text AS v,
             to_tsvector('simple', 'fat cat')::text AS default_weight
    expect: rows
    order: ordered
    comment: D is the default label and is not shown on output
  - sql: |
      SELECT setweight(strip(to_tsvector('simple', 'fat cat')), 'A')::text AS v
    expect: rows
    order: ordered
    comment: setweight on a stripped vector is a no-op
  - sql: |
      SELECT setweight(NULL::tsvector, 'A') IS NULL AS null_vector
    expect: rows
    order: ordered
  - sql: |
      SELECT setweight(to_tsvector('simple', 'fat'), 'A') || setweight(to_tsvector('simple', 'rat'), 'C') AS v
    expect: rows
    order: ordered
    comment: labels from different setweight calls are kept after concatenation
