# numnode counts lexemes plus operators; 0 means the query holds only stop words or no lexemes,
# which raises a NOTICE.
id: doc-textsearch-features.numnode-counts
title: numnode counts query nodes and reports stop-word-only queries with a notice
family: doc-textsearch-features
tier: extended
feature_ids: [numnode, tsquery-stopwords, notices]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-manipulate-tsquery"
steps:
  - sql: |
      SELECT numnode(plainto_tsquery('english', 'the any')) AS n
    expect: notice
    comment: documented example; NOTICE text is recorded from the oracle
  - sql: |
      SELECT numnode('foo & bar'::tsquery) AS n_and,
             numnode('foo | !bar'::tsquery) AS n_or_not,
             numnode('foo'::tsquery) AS n_single
    expect: rows
    order: ordered
  - sql: |
      SELECT numnode(NULL::tsquery) IS NULL AS null_input
    expect: rows
    order: ordered
