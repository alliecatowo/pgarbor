# Enum label limit is 63 bytes (NAMEDATALEN - 1): 63 bytes accepted, 64 bytes rejected.
id: cmd-create-type.enum-label-length-limit
title: "Enum label length limit: 63 bytes accepted, 64 bytes rejected"
family: cmd-create-type
tier: core
feature_ids: [create-type, enum-types, errors, catalog-introspection]
required_capabilities: [create-type, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_type.sgml#sql-createtype-enum (label less than NAMEDATALEN bytes)"
steps:
  - sql: |
      CREATE TYPE lbl63 AS ENUM ('ok', 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
    expect: ok
  - sql: |
      SELECT length(e.enumlabel) AS n
      FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid
      WHERE t.typname = 'lbl63'
      ORDER BY e.enumsortorder
    expect: rows
    order: ordered
  - sql: |
      CREATE TYPE lbl64 AS ENUM ('ok', 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb')
    expect: error
    sqlstate: "42602"
    comment: 64 bytes is one more than the limit
  - sql: |
      SELECT 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'::lbl63::text = repeat('a', 63) AS same
    expect: rows
