# Shell type as a placeholder: a shell is not defined, a second shell collides, and a full range definition replaces it.
id: cmd-create-type.range-shell-lifecycle
title: "Shell type placeholder lifecycle and canonical function requirement"
family: cmd-create-type
tier: extended
feature_ids: [create-type, shell-types, range-types, catalog-introspection, errors]
required_capabilities: [create-type, range-types, catalog-introspection, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_type.sgml#sql-createtype-range (shell types)"
steps:
  - sql: |
      CREATE TYPE shellx
    expect: ok
  - sql: |
      SELECT typisdefined, typtype FROM pg_type WHERE typname = 'shellx'
    expect: rows
    comment: a shell type has typisdefined false and typtype p
  - sql: |
      CREATE TYPE shellx
    expect: error
    sqlstate: "42710"
    comment: the name is already taken by the shell
  - sql: |
      CREATE TYPE shelly AS RANGE (subtype = int4, canonical = nosuchfn)
    expect: error
    sqlstate: "42P17"
    comment: a canonical function requires a pre-created shell type of the same name
  - sql: |
      CREATE TYPE shellx AS RANGE (subtype = int4)
    expect: ok
    comment: the full definition replaces the shell entry
  - sql: |
      SELECT typisdefined, typtype FROM pg_type WHERE typname = 'shellx'
    expect: rows
  - sql: |
      SELECT '[1,3)'::shellx @> 2 AS has_2, '[1,3)'::shellx @> 3 AS has_3
    expect: rows
