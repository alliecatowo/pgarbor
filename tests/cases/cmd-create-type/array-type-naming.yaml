# Implicit array types: name is the element name prefixed with an underscore, and collisions add more.
id: cmd-create-type.array-type-naming
title: "Implicit array type naming, collision handling and use with ARRAY constructor"
family: cmd-create-type
tier: core
feature_ids: [create-type, arrays, composite-types, catalog-introspection, select]
required_capabilities: [create-type, arrays, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_type.sgml#sql-createtype-array (Array Types, Notes)"
steps:
  - sql: |
      CREATE TYPE _tt AS (x int)
    expect: ok
  - sql: |
      CREATE TYPE tt AS (x int)
    expect: ok
  - sql: |
      SELECT t.typname FROM pg_type t WHERE t.oid = (SELECT typarray FROM pg_type WHERE typname = 'tt')
    expect: rows
    comment: the generated name '_tt' is taken, so a non-colliding variant is chosen; read it via typarray, not by name
  - sql: |
      CREATE TYPE arrn AS (x int)
    expect: ok
  - sql: |
      SELECT t.typname, t.typelem = (SELECT oid FROM pg_type WHERE typname = 'arrn') AS elem_ok
      FROM pg_type t WHERE t.oid = (SELECT typarray FROM pg_type WHERE typname = 'arrn')
    expect: rows
    comment: the array type is '_arrn' and its element is arrn
  - sql: |
      SELECT pg_typeof(ARRAY[ROW(1)::arrn]) AS ty
    expect: rows
    comment: ARRAY over the composite yields the array type
  - sql: |
      SELECT (ARRAY[ROW(7)::arrn, ROW(8)::arrn])[2].x AS second
    expect: rows
    comment: array subscripting starts at 1 for variable-length arrays
