# Enum labels: empty string and spaces are legal, order is declaration order (not collation), duplicates rejected.
id: cmd-create-type.enum-labels-order-duplicates
title: "Enum labels keep declaration order; empty and spaced labels; duplicate label rejected"
family: cmd-create-type
tier: core
feature_ids: [create-type, enum-types, select, errors]
required_capabilities: [create-type, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_type.sgml#sql-createtype-enum; datatype-enum.html"
steps:
  - sql: |
      CREATE TYPE lbls AS ENUM ('a', '', 'a b', 'B')
    expect: ok
  - sql: |
      SELECT v::text AS label, ord FROM unnest(enum_range(NULL::lbls)) WITH ORDINALITY AS t(v, ord) ORDER BY ord
    expect: rows
    order: ordered
  - sql: |
      SELECT 'a'::lbls < 'B'::lbls AS a_before_b, 'a'::lbls < ''::lbls AS a_before_empty, 'B'::lbls < ''::lbls AS b_before_empty
    expect: rows
    comment: declaration order is a < '' < 'a b' < B
  - sql: |
      SELECT 'C'::lbls
    expect: error
    sqlstate: "22P02"
  - sql: |
      CREATE TYPE lbls_dup AS ENUM ('x', 'x')
    expect: error
    sqlstate: "23505"
    compare_message: false
    comment: duplicate label is rejected by the unique index on pg_enum; the type is not created. DETAIL embeds the allocation-dependent pg_enum OID, so the message is not compared (sqlstate still is)
  - sql: |
      SELECT count(*) AS n FROM pg_type WHERE typname = 'lbls_dup'
    expect: rows
