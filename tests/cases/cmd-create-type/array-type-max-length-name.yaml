# Array type name for a maximum-length (63 byte) element name: '_' is prepended and the name is kept at 63 bytes.
id: cmd-create-type.array-type-max-length-name
title: "Array type name for a 63-byte element type name"
family: cmd-create-type
tier: core
feature_ids: [create-type, arrays, identifiers, catalog-introspection]
required_capabilities: [create-type, arrays, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_type.sgml#sql-createtype-array (maximum-length names, Notes)"
steps:
  - sql: |
      CREATE TYPE aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa AS (x int)
    expect: ok
  - sql: |
      SELECT length(t.typname) AS n, left(t.typname, 5) AS prefix, t.typname = '_' || repeat('a', 62) AS is_expected
      FROM pg_type t
      WHERE t.oid = (SELECT typarray FROM pg_type WHERE typname = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
    expect: rows
    comment: the array name is '_' plus the first 62 characters, staying within 63 bytes
