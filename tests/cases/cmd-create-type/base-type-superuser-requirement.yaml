# Documented: only a superuser may create a base type. Needs a non-superuser role to exercise, which is a cluster-global side effect.
id: cmd-create-type.base-type-superuser-requirement
title: "Base type creation by a non-superuser is rejected"
family: cmd-create-type
tier: extended
feature_ids: [create-type, base-types, privileges, errors]
required_capabilities: [create-type, roles, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_type.sgml#sql-createtype (Base Types)"
quarantine:
  reason: "requires a non-superuser role (CREATE ROLE is cluster-global and cannot be isolated to one per-case database)"
steps:
  - sql: |
      CREATE TYPE qbase (INPUT = int4in, OUTPUT = int4out, INTERNALLENGTH = 4)
    expect: error
    sqlstate: "42501"
