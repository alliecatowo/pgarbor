# CALL on a missing name and on functions/aggregates that are not procedures.
id: create-procedure.call-not-a-procedure
title: CALL of a missing procedure and of non-procedure routines raises routine-kind errors
family: create-procedure
tier: core
feature_ids: [procedures, call, errors]
required_capabilities: [create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CALL nonexistent()
    expect: error
    sqlstate: "42883"
  - sql: |
      CALL random()
    expect: error
    sqlstate: "42809"
  - sql: |
      CALL version()
    expect: error
    sqlstate: "42809"
  - sql: |
      CALL sum(1)
    expect: error
    sqlstate: "42809"
