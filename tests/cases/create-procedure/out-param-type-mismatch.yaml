# An OUT argument must match the parameter type; numeric does not match int.
id: create-procedure.out-param-type-mismatch
title: CALL with a numeric literal for an int OUT parameter fails to resolve the procedure
family: create-procedure
tier: core
feature_ids: [procedures, call, out-parameters, errors]
required_capabilities: [create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE ptest9(OUT a int)
      LANGUAGE SQL
      AS $$
      SELECT 1;
      $$
    expect: ok
  - sql: |
      CALL ptest9(1./0.)
    expect: error
    sqlstate: "42883"
