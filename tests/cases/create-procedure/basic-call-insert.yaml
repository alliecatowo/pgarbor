# CREATE PROCEDURE with a SQL body, CALL with literal and expression arguments.
id: create-procedure.basic-call-insert
title: CALL a SQL-language procedure that inserts, with expression arguments
family: create-procedure
tier: core
feature_ids: [procedures, call, insert, select]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE cp_test (a int, b text)
    expect: ok
  - sql: |
      CREATE PROCEDURE ptest1(x text)
      LANGUAGE SQL
      AS $$
      INSERT INTO cp_test VALUES (1, x);
      $$
    expect: ok
  - sql: |
      CALL ptest1('a')
    expect: ok
  - sql: |
      CALL ptest1('xy' || 'zzy')
    expect: ok
  - sql: |
      SELECT a, b FROM cp_test ORDER BY b
    expect: rows
    order: ordered
