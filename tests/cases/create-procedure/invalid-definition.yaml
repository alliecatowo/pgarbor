# Invalid procedure attributes and parameter orderings are rejected at CREATE time and create nothing.
id: create-procedure.invalid-definition
title: CREATE PROCEDURE rejects WINDOW, STRICT, VARIADIC-not-last and OUT-after-default definitions
family: create-procedure
tier: core
feature_ids: [procedures, create-procedure, errors]
required_capabilities: [create-procedure]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE ptestx() LANGUAGE SQL WINDOW AS $$ SELECT 1 $$
    expect: error
    sqlstate: "42P13"
  - sql: |
      CREATE PROCEDURE ptestx() LANGUAGE SQL STRICT AS $$ SELECT 1 $$
    expect: error
    sqlstate: "42P13"
  - sql: |
      CREATE PROCEDURE ptestx(a VARIADIC int[], b OUT int) LANGUAGE SQL AS $$ SELECT a[1] $$
    expect: error
    sqlstate: "42P13"
  - sql: |
      CREATE PROCEDURE ptestx(a int DEFAULT 42, b OUT int) LANGUAGE SQL AS $$ SELECT a $$
    expect: error
    sqlstate: "42P13"
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'ptestx'
    expect: rows
