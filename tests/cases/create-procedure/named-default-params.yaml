# Named and default parameters for a SQL procedure that inserts two rows per call.
id: create-procedure.named-default-params
title: CALL resolves named arguments and omitted defaulted parameters in any order
family: create-procedure
tier: core
feature_ids: [procedures, call, default-parameters, named-parameters, insert, select]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE cp_test (a int, b text)
    expect: ok
  - sql: |
      CREATE OR REPLACE PROCEDURE ptest5(a int, b text, c int default 100)
      LANGUAGE SQL
      AS $$
      INSERT INTO cp_test VALUES(a, b);
      INSERT INTO cp_test VALUES(c, b);
      $$
    expect: ok
  - sql: |
      CALL ptest5(10, 'Hello', 20)
    expect: ok
  - sql: |
      CALL ptest5(10, 'Hello')
    expect: ok
  - sql: |
      CALL ptest5(10, b => 'Hello')
    expect: ok
  - sql: |
      CALL ptest5(b => 'Hello', a => 10)
    expect: ok
  - sql: |
      SELECT a, b FROM cp_test ORDER BY a, b
    expect: rows
    order: ordered
