# SQL-standard BEGIN ATOMIC body for a procedure.
id: create-procedure.sql-standard-body
title: Procedure with a BEGIN ATOMIC body runs its single INSERT on CALL
family: create-procedure
tier: core
feature_ids: [procedures, call, insert, select, sql-standard-body]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE cp_test (a int, b text)
    expect: ok
  - sql: |
      CREATE PROCEDURE ptest1s(x text)
      LANGUAGE SQL
      BEGIN ATOMIC
        INSERT INTO cp_test VALUES (1, x);
      END
    expect: ok
  - sql: |
      CALL ptest1s('b')
    expect: ok
  - sql: |
      SELECT a, b FROM cp_test ORDER BY b
    expect: rows
    order: ordered
