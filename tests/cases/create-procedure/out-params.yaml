# INOUT and OUT parameters return the procedure's result row; OUT argument expressions are not evaluated.
id: create-procedure.out-params
title: CALL with INOUT and OUT parameters returns the output row and ignores OUT argument expressions
family: create-procedure
tier: core
feature_ids: [procedures, call, out-parameters, inout-parameters]
required_capabilities: [create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE ptest4a(INOUT a int, INOUT b int)
      LANGUAGE SQL
      AS $$
      SELECT 1, 2;
      $$
    expect: ok
  - sql: |
      CALL ptest4a(NULL, NULL)
    expect: rows
  - sql: |
      CREATE PROCEDURE ptest9(OUT a int)
      LANGUAGE SQL
      AS $$
      SELECT 1;
      $$
    expect: ok
  - sql: |
      CALL ptest9(NULL)
    expect: rows
  - sql: |
      CALL ptest9(1/0)
    expect: rows
    comment: the OUT argument expression is not evaluated, so no division-by-zero error
