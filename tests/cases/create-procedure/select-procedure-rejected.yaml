# A procedure cannot be invoked in an expression; it must be CALLed.
id: create-procedure.select-procedure-rejected
title: SELECT of a procedure is rejected and the procedure is only run by CALL
family: create-procedure
tier: core
feature_ids: [procedures, call, select, errors]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE cp_test (a int, b text)
    expect: ok
  - sql: |
      CREATE PROCEDURE ptest1(x text)
      LANGUAGE SQL
      AS $$
      INSERT INTO cp_test VALUES (1, x);
      $$
    expect: ok
  - sql: |
      SELECT ptest1('x')
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT count(*) FROM cp_test
    expect: rows
  - sql: |
      CALL ptest1('a')
    expect: ok
  - sql: |
      SELECT count(*) FROM cp_test
    expect: rows
