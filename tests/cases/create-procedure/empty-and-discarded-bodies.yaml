# Edge cases: an empty BEGIN ATOMIC body, NULL argument, and a SQL body whose final SELECT result is discarded.
id: create-procedure.empty-and-discarded-bodies
title: Empty atomic body and a SELECT-only body both CALL successfully with no result rows
family: create-procedure
tier: extended
feature_ids: [procedures, call, sql-standard-body, nulls]
required_capabilities: [create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE ptest8(x text)
      BEGIN ATOMIC
      END
    expect: ok
  - sql: |
      CALL ptest8('')
    expect: ok
  - sql: |
      CALL ptest8(NULL)
    expect: ok
  - sql: |
      CREATE PROCEDURE ptest2()
      LANGUAGE SQL
      AS $$
      SELECT 5;
      $$
    expect: ok
  - sql: |
      CALL ptest2()
    expect: ok
    comment: the final SELECT of a procedure body produces no result set
