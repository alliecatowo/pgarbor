# A SQL function is callable by SELECT but CALL rejects it as not a procedure.
id: create-procedure.function-procedure-coexist
title: A SQL function coexists with a procedure namespace and CALL rejects the function name
family: create-procedure
tier: core
feature_ids: [procedures, functions, call, errors]
required_capabilities: [create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION cp_testfunc1(a int) RETURNS int LANGUAGE SQL AS $$ SELECT a $$
    expect: ok
  - sql: |
      SELECT cp_testfunc1(3)
    expect: rows
  - sql: |
      CALL cp_testfunc1(3)
    expect: error
    sqlstate: "42809"
