# A SQL-language procedure body may not CALL a procedure that has output arguments.
id: create-procedure.out-args-in-sql-body
title: Nested CALL of a procedure with INOUT arguments from a SQL body is rejected
family: create-procedure
tier: extended
feature_ids: [procedures, call, inout-parameters, errors]
required_capabilities: [create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE ptest4a(INOUT a int, INOUT b int)
      LANGUAGE SQL
      AS $$
      SELECT 1, 2;
      $$
    expect: ok
  - sql: |
      CREATE PROCEDURE ptest4b(INOUT b int, INOUT a int)
      LANGUAGE SQL
      AS $$
      CALL ptest4a(a, b);
      $$
    expect: error
    sqlstate: "0A000"
    comment: CREATE validates the SQL body and rejects the output-argument nested CALL, so ptest4b is never created
  - sql: |
      CALL ptest4b(1, 2)
    expect: error
    sqlstate: "42883"
    comment: ptest4b does not exist because its CREATE failed
