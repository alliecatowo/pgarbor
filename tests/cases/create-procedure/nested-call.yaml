# A SQL procedure body that CALLs another procedure, using a named argument and a positional $1.
id: create-procedure.nested-call
title: Procedure body issues nested CALL statements using named and positional arguments
family: create-procedure
tier: core
feature_ids: [procedures, call, insert, select, truncate]
required_capabilities: [create-table, insert, select, truncate, create-procedure, call]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE TABLE cp_test (a int, b text)
    expect: ok
  - sql: |
      CREATE PROCEDURE ptest1(x text)
      LANGUAGE SQL
      AS $$
      INSERT INTO cp_test VALUES (1, x);
      $$
    expect: ok
  - sql: |
      CREATE PROCEDURE ptest3(y text)
      LANGUAGE SQL
      AS $$
      CALL ptest1(y);
      CALL ptest1($1);
      $$
    expect: ok
  - sql: |
      TRUNCATE cp_test
    expect: ok
  - sql: |
      CALL ptest3('b')
    expect: ok
  - sql: |
      SELECT a, b FROM cp_test ORDER BY a, b
    expect: rows
    order: ordered
