# Utility statements such as CREATE TABLE are not allowed in an unquoted SQL-standard body.
id: create-procedure.utility-in-atomic-body
title: CREATE TABLE inside a BEGIN ATOMIC procedure body is rejected at definition time
family: create-procedure
tier: core
feature_ids: [procedures, sql-standard-body, errors]
required_capabilities: [create-procedure]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_procedure.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE ptestx()
      LANGUAGE SQL
      BEGIN ATOMIC
        CREATE TABLE x (a int);
      END
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'ptestx'
    expect: rows
    comment: no procedure was created
