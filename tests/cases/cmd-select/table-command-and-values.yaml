# TABLE command as shorthand for SELECT *, its rejected WHERE form, and VALUES lists used as a query.
id: cmd-select.table-command-and-values
title: TABLE command as SELECT * shorthand, rejects WHERE, and VALUES as a query
family: cmd-select
tier: core
feature_ids: [select, table-command, values]
required_capabilities: [create-table, insert, select, values]
provenance:
  source: pg-docs
  ref: "ref/select.sgml#sql-table (TABLE command)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, name text);
  INSERT INTO t VALUES (2, 'two'), (1, 'one'), (3, NULL);
steps:
  - sql: |
      TABLE t
    expect: rows
    order: multiset
    comment: equivalent to SELECT * FROM t
  - sql: |
      TABLE t ORDER BY id LIMIT 2
    expect: rows
    order: ordered
    comment: ORDER BY and LIMIT are allowed after TABLE
  - sql: |
      TABLE t WHERE id = 1
    expect: error
    sqlstate: "42601"
    comment: the TABLE command has no WHERE clause
  - sql: |
      VALUES (1, 'a'), (2, 'b') ORDER BY 1 DESC LIMIT 1
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (VALUES (1, 'a'), (2, 'b')) AS v(n, s) WHERE s <> 'a'
    expect: rows
    order: multiset
