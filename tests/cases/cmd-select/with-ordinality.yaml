# WITH ORDINALITY appends a 1-based bigint row number to a set-returning function, with alias and empty input.
id: cmd-select.with-ordinality
title: WITH ORDINALITY numbers rows from a set-returning function starting at 1
family: cmd-select
tier: core
feature_ids: [select, from, with-ordinality, set-returning-functions, arrays]
required_capabilities: [select, set-returning-functions, arrays]
provenance:
  source: pg-docs
  ref: "ref/select.sgml#sql-from (WITH ORDINALITY example with unnest)"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM unnest(ARRAY['a', 'b', 'c', 'd', 'e', 'f']) WITH ORDINALITY ORDER BY ordinality
    expect: rows
    order: ordered
    comment: default column names are unnest and ordinality
  - sql: |
      SELECT u.val, u.n FROM unnest(ARRAY['x', 'y', 'z']) WITH ORDINALITY AS u(val, n) WHERE u.n > 1 ORDER BY u.n
    expect: rows
    order: ordered
    comment: aliased ordinality column is filterable
  - sql: |
      SELECT * FROM unnest(ARRAY[]::text[]) WITH ORDINALITY
    expect: rows
    order: multiset
    comment: an empty input produces zero rows
