# ORDER BY output-column ordinals, default NULL placement, explicit NULLS FIRST, and an out-of-range ordinal.
id: cmd-select.order-by-nulls-ordinal
title: ORDER BY ordinal and NULL placement, out-of-range ordinal is an error
family: cmd-select
tier: core
feature_ids: [select, order-by, nulls]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "ref/select.sgml#sql-orderby (ORDER BY 2 example and NULLS ordering)"
sessions: [a]
setup: |
  CREATE TABLE d (did int4, name text);
  INSERT INTO d VALUES (109, '20th Century Fox'), (110, 'Bavaria Atelier'), (101, 'British Lion'), (107, NULL), (102, 'Jean Luc Godard');
steps:
  - sql: |
      SELECT * FROM d ORDER BY name
    expect: rows
    order: ordered
    comment: ascending default puts NULL last
  - sql: |
      SELECT * FROM d ORDER BY 2
    expect: rows
    order: ordered
    comment: ordinal 2 is name, same order as ORDER BY name
  - sql: |
      SELECT * FROM d ORDER BY name DESC NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT did FROM d ORDER BY name
    expect: rows
    order: ordered
    comment: a non-output sort key is allowed for a plain SELECT
  - sql: |
      SELECT * FROM d ORDER BY 3
    expect: error
    sqlstate: "42P10"
    comment: ORDER BY position 3 is not in the select list
