# Queries without FROM, SELECT with an empty select list, and zero-row filters.
id: cmd-select.empty-select-list
title: SELECT without FROM, empty select list returns one row per input row, zero-row filters
family: cmd-select
tier: core
feature_ids: [select, empty-select-list, from-less-select, where]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ref/select.sgml#sql-select-list and ref/select.sgml#compatibility (Omitted FROM clauses, Empty SELECT lists)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT 1 + 1 AS two
    expect: rows
    order: multiset
    comment: no FROM clause, one row
  - sql: |
      SELECT FROM t
    expect: rows
    order: multiset
    comment: an empty select list yields one zero-column row per input row
  - sql: |
      SELECT count(*) FROM t WHERE false
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM t WHERE 1 = 0
    expect: rows
    order: multiset
  - sql: |
      SELECT 1 OFFSET 5
    expect: rows
    order: multiset
