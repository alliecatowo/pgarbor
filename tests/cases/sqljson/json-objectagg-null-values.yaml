# JSON_OBJECTAGG null value handling and RETURNING jsonb over a grouped VALUES relation.
id: sqljson.json-objectagg-null-values
title: JSON_OBJECTAGG NULL ON NULL versus ABSENT ON NULL with RETURNING
family: sqljson
tier: core
feature_ids: [json-objectagg, json-null-handling, json-returning, aggregates]
required_capabilities: [select, json, jsonb, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_OBJECTAGG(k: v), JSON_OBJECTAGG(k: v NULL ON NULL), JSON_OBJECTAGG(k: v ABSENT ON NULL)
      FROM (VALUES (1, 1), (1, NULL), (2, NULL), (3, 3)) foo(k, v)
    expect: rows
    comment: default is NULL ON NULL for OBJECTAGG
  - sql: |
      SELECT JSON_OBJECTAGG(k: v RETURNING jsonb), JSON_OBJECTAGG(k: v ABSENT ON NULL RETURNING jsonb)
      FROM (VALUES (1, 1), (1, NULL), (2, NULL), (3, 3)) foo(k, v)
    expect: rows
  - sql: |
      SELECT JSON_OBJECTAGG(i: i) FROM generate_series(1, 5) i
    expect: rows
    order: ordered
