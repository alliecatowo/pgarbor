# JSON_ARRAYAGG over empty input, ORDER BY inside the aggregate, FILTER, and NULL handling.
id: sqljson.json-arrayagg-basics
title: JSON_ARRAYAGG empty input ordering filter and null handling
family: sqljson
tier: core
feature_ids: [json-arrayagg, aggregates, filter, json-null-handling]
required_capabilities: [select, json, jsonb, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_ARRAYAGG(i) IS NULL, JSON_ARRAYAGG(i RETURNING jsonb) IS NULL FROM generate_series(1, 0) i
    expect: rows
    comment: aggregate over no rows is SQL NULL
  - sql: |
      SELECT JSON_ARRAYAGG(i), JSON_ARRAYAGG(i RETURNING jsonb) FROM generate_series(1, 5) i
    expect: rows
  - sql: |
      SELECT JSON_ARRAYAGG(i ORDER BY i DESC) FROM generate_series(1, 5) i
    expect: rows
  - sql: |
      SELECT JSON_ARRAYAGG(i ORDER BY i DESC) FILTER (WHERE i > 2) FROM generate_series(1, 5) i
    expect: rows
  - sql: |
      SELECT JSON_ARRAYAGG(NULL), JSON_ARRAYAGG(NULL RETURNING jsonb) FROM generate_series(1, 5)
    expect: rows
    comment: ARRAYAGG of only NULLs with default ABSENT ON NULL
  - sql: |
      SELECT JSON_ARRAYAGG(NULL NULL ON NULL), JSON_ARRAYAGG(NULL NULL ON NULL RETURNING jsonb) FROM generate_series(1, 5)
    expect: rows
    comment: NULL ON NULL keeps each null element
