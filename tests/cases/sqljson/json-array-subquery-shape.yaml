# JSON_ARRAY(subquery) requires exactly one output column and returns elements in subquery order.
id: sqljson.json-array-subquery-shape
title: JSON_ARRAY subquery must return exactly one column
family: sqljson
tier: core
feature_ids: [json-array, subquery, errors]
required_capabilities: [select, json, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_ARRAY(SELECT i FROM (VALUES (3), (1), (NULL), (2)) foo(i) ORDER BY i)
    expect: rows
    comment: subquery ORDER BY determines element order
  - sql: |
      SELECT JSON_ARRAY(SELECT i FROM (VALUES (1), (2), (NULL), (4)) foo(i) RETURNING jsonb)
    expect: rows
  - sql: |
      SELECT JSON_ARRAY(SELECT FROM (VALUES (1)) foo(i))
    expect: error
    comment: zero columns is rejected (sqlstate not asserted)
  - sql: |
      SELECT JSON_ARRAY(SELECT i, i FROM (VALUES (1)) foo(i))
    expect: error
    comment: two columns is rejected (sqlstate not asserted)
  - sql: |
      SELECT JSON_ARRAY(SELECT * FROM (VALUES (1, 2)) foo(i, j))
    expect: error
    comment: two-column relation is rejected (sqlstate not asserted)
