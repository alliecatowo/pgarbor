# IS JSON predicate on NULL, valid and invalid text, and json-typed inputs.
id: sqljson.is-json-predicate
title: IS JSON predicate on NULL, text, and json inputs
family: sqljson
tier: core
feature_ids: [is-json, json-type, null-handling]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE payloads (id int4 PRIMARY KEY, body text);
  INSERT INTO payloads VALUES (1, '{"a": 1}'), (2, '[1, 2'), (3, '  42  '), (4, NULL);
steps:
  - sql: |
      SELECT NULL IS JSON, NULL IS NOT JSON, NULL::json IS JSON, NULL::jsonb IS JSON, NULL::text IS JSON, NULL::bytea IS JSON
    expect: rows
    comment: NULL input results follow the SQL standard predicate rules
  - sql: |
      SELECT id, body IS JSON AS is_json, body IS JSON OBJECT AS is_obj FROM payloads ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM payloads WHERE body IS NOT JSON ORDER BY id
    expect: rows
    order: ordered
