# JSON_SCALAR() wraps SQL scalars as JSON scalars and maps NULL to SQL NULL.
id: sqljson.json-scalar-basic
title: JSON_SCALAR converts scalars and returns NULL for NULL input
family: sqljson
tier: core
feature_ids: [json-scalar, select, numeric, datetime]
required_capabilities: [select, json, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_SCALAR(NULL), JSON_SCALAR(NULL::int), JSON_SCALAR(123), JSON_SCALAR(123.45::numeric), JSON_SCALAR(true), JSON_SCALAR(false)
    expect: rows
    comment: NULL inputs yield SQL NULL and scalars yield JSON scalars
  - sql: |
      SELECT JSON_SCALAR(' 123.45'), JSON_SCALAR('2020-06-07'::date), JSON_SCALAR('2020-06-07 01:02:03'::timestamp)
    expect: rows
    comment: text with leading space is kept as a JSON string
  - sql: |
      SELECT JSON_SCALAR()
    expect: error
    comment: zero arguments is a syntax error
