# JSON() rejects malformed JSON text with 22P02 and rejects non-text input.
id: sqljson.json-constructor-invalid-input
title: JSON constructor rejects malformed JSON text
family: sqljson
tier: core
feature_ids: [json-constructor, errors]
required_capabilities: [select, json, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON('{"a" 1}')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT JSON('{"a": 1')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT JSON(123)
    expect: error
    comment: non-text argument is rejected at parse analysis
  - sql: |
      SELECT JSON('{"a": 1, "a": 2}')
    expect: rows
    comment: duplicate keys are accepted by default
