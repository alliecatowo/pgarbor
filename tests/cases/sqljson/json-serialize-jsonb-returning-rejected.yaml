# JSON_SERIALIZE accepts only string types or bytea in RETURNING, so jsonb is rejected.
id: sqljson.json-serialize-jsonb-returning-rejected
title: JSON_SERIALIZE rejects jsonb as RETURNING type
family: sqljson
tier: core
feature_ids: [json-serialize, errors]
required_capabilities: [select, json, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_SERIALIZE('{ "a" : 1 } ' RETURNING jsonb)
    expect: error
    comment: only string types or bytea are allowed in RETURNING (sqlstate not asserted)
  - sql: |
      SELECT JSON_SERIALIZE('{}' RETURNING text)
    expect: rows
    comment: a string RETURNING type is fine right after the rejected statement
