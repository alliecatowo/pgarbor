# JSON_SERIALIZE() converts json, jsonb and text input to text or bytea, NULL in gives NULL out.
id: sqljson.json-serialize-basic
title: JSON_SERIALIZE returns text or bytea and propagates NULL
family: sqljson
tier: core
feature_ids: [json-serialize, select]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE docs (id int4 PRIMARY KEY, body text);
  INSERT INTO docs VALUES (1, '{ "a" : 1 } '), (2, NULL);
steps:
  - sql: |
      SELECT JSON_SERIALIZE(NULL), JSON_SERIALIZE(JSON('{ "a" : 1 } ')), JSON_SERIALIZE('{ "a" : 1 } ')
    expect: rows
  - sql: |
      SELECT JSON_SERIALIZE('{ "a" : 1 } ' RETURNING bytea), JSON_SERIALIZE('{ "a" : 1 } ' RETURNING varchar)
    expect: rows
  - sql: |
      SELECT id, JSON_SERIALIZE(body) AS ser, JSON_SERIALIZE(body) IS NULL AS ser_null FROM docs ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(JSON_SERIALIZE(NULL))
    expect: rows
