# WITH UNIQUE KEYS rejects duplicate keys with 22030, including a duplicate whose value is NULL unless it is dropped by WITHOUT UNIQUE.
id: sqljson.json-object-unique-keys
title: JSON_OBJECT WITH UNIQUE KEYS duplicate detection
family: sqljson
tier: core
feature_ids: [json-object, unique-keys, errors]
required_capabilities: [select, json, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_OBJECT(1: 1, '1': NULL WITH UNIQUE)
    expect: error
    sqlstate: "22030"
    comment: keys 1 and '1' are the same text key
  - sql: |
      SELECT JSON_OBJECT(1: 1, '1': NULL ABSENT ON NULL WITH UNIQUE)
    expect: error
    sqlstate: "22030"
    comment: uniqueness is checked on the keys even when the duplicate value is NULL and ABSENT ON NULL is given
  - sql: |
      SELECT JSON_OBJECT(1: 1, '2': NULL, '1': 1 ABSENT ON NULL WITHOUT UNIQUE)
    expect: rows
    comment: WITHOUT UNIQUE allows duplicate keys
