# JSON_OBJECT rejects a NULL key with 22004 (22023 with RETURNING jsonb) even though NULL values are allowed.
id: sqljson.json-object-null-key
title: JSON_OBJECT rejects NULL keys
family: sqljson
tier: core
feature_ids: [json-object, errors, json-null-handling]
required_capabilities: [select, json, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_OBJECT(NULL: 1)
    expect: error
    sqlstate: "22004"
  - sql: |
      SELECT JSON_OBJECT(NULL::text: NULL RETURNING jsonb)
    expect: error
    sqlstate: "22023"
    comment: the RETURNING jsonb path reports the null key as an invalid argument (22023)
  - sql: |
      SELECT JSON_OBJECT('a': 2 + 3, 1.23: 123)
    expect: rows
    comment: non-null keys of other types are converted to text
