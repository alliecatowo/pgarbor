# JSON_ARRAY with explicit NULL ON NULL and ABSENT ON NULL, plus nested JSON and typed elements.
id: sqljson.json-array-null-handling
title: JSON_ARRAY NULL ON NULL and ABSENT ON NULL element handling
family: sqljson
tier: core
feature_ids: [json-array, json-null-handling, json-returning]
required_capabilities: [select, json, jsonb, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_ARRAY('aaa', 111, true, array[1,2,3], NULL, json '{"a": [1]}', jsonb '["a",3]')
    expect: rows
  - sql: |
      SELECT JSON_ARRAY('a', NULL, 'b' NULL ON NULL), JSON_ARRAY('a', NULL, 'b' ABSENT ON NULL)
    expect: rows
    comment: NULL element kept in the first, dropped in the second
  - sql: |
      SELECT JSON_ARRAY(NULL, NULL, 'b' ABSENT ON NULL RETURNING jsonb)
    expect: rows
  - sql: |
      SELECT JSON_ARRAY(JSON_ARRAY('{ "a" : 123 }' FORMAT JSON RETURNING text) FORMAT JSON)
    expect: rows
    comment: nested array text is embedded as JSON when FORMAT JSON is given
  - sql: |
      SELECT JSON_ARRAY(RETURNING text)
    expect: rows
    comment: empty array with text output
