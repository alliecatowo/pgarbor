# JSON_OBJECT null handling: default and NULL ON NULL keep null values, ABSENT ON NULL drops them.
id: sqljson.json-object-null-handling
title: JSON_OBJECT NULL ON NULL versus ABSENT ON NULL
family: sqljson
tier: core
feature_ids: [json-object, json-null-handling, json-returning]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_OBJECT('a': '1', 'b': NULL, 'c': 2)
    expect: rows
    comment: explicit default for JSON_OBJECT is NULL ON NULL
  - sql: |
      SELECT JSON_OBJECT('a': '1', 'b': NULL, 'c': 2 NULL ON NULL)
    expect: rows
  - sql: |
      SELECT JSON_OBJECT('a': '1', 'b': NULL, 'c': 2 ABSENT ON NULL)
    expect: rows
    comment: the NULL-valued member is omitted
  - sql: |
      SELECT JSON_OBJECT('a': '1', 'b': NULL, 'c': 2 ABSENT ON NULL RETURNING jsonb)
    expect: rows
  - sql: |
      SELECT JSON_OBJECT('a': '123', 'b': JSON_OBJECT('a': 111, 'b': 'aaa'))
    expect: rows
    comment: nested JSON_OBJECT result is embedded as JSON
