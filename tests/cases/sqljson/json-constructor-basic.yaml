# JSON() constructor: text, bytea and json inputs, FORMAT and ENCODING clauses, typed result.
id: sqljson.json-constructor-basic
title: JSON constructor accepts text and bytea input with FORMAT and ENCODING clauses
family: sqljson
tier: core
feature_ids: [json-constructor, json-type, select]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON('{ "a" : 1 } ');
      SELECT JSON('{ "a" : 1 } ' FORMAT JSON);
      SELECT JSON('{ "a" : 1 } '::bytea FORMAT JSON ENCODING UTF8)
    expect: rows
    comment: each statement yields one row
  - sql: |
      SELECT pg_typeof(JSON('{ "a" : 1 } ')), pg_typeof(JSON('123'))
    expect: rows
  - sql: |
      SELECT JSON('   1   '::json), JSON('   1   '::jsonb)
    expect: rows
    comment: scalar input is accepted for each source type
