# The conversion function is looked up by name with the fixed 6-argument conv_proc signature.
# A missing name or a name with the wrong signature gives undefined_function (42883). A schema that does
# not exist gives invalid_schema_name (3F000). A schema-qualified name that resolves is accepted.
id: cmd-create-conversion.function-lookup-errors
title: The conversion function must exist with the conv_proc signature
family: cmd-create-conversion
tier: core
feature_ids: [create-conversion, conv-proc-signature, function-lookup, errors]
required_capabilities: [create-conversion, drop-conversion, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_conversion.sgml#sql-createconversion (function_name: conv_proc signature)"
sessions: [a]
steps:
  - sql: |
      CREATE CONVERSION cc_fn_none FOR 'UTF8' TO 'LATIN1' FROM no_such_fn
    expect: error
    sqlstate: "42883"
    comment: no such function
  - sql: |
      CREATE CONVERSION cc_fn_wrong FOR 'UTF8' TO 'LATIN1' FROM lower
    expect: error
    sqlstate: "42883"
    comment: lower(text) does not match conv_proc(integer, integer, cstring, internal, integer, boolean)
  - sql: |
      CREATE CONVERSION cc_fn_noschema FOR 'UTF8' TO 'LATIN1' FROM nosch9.utf8_to_iso8859_1
    expect: error
    sqlstate: "3F000"
    comment: the schema qualifier does not exist
  - sql: |
      CREATE CONVERSION cc_fn_ok FOR 'UTF8' TO 'LATIN1' FROM pg_catalog.utf8_to_iso8859_1
    expect: ok
    comment: schema-qualified function name resolves through the catalog
  - sql: |
      SELECT conname, conproc::regproc FROM pg_conversion WHERE conname LIKE 'cc_fn%' ORDER BY conname
    expect: rows
    order: ordered
  - sql: |
      DROP CONVERSION cc_fn_ok
    expect: ok
