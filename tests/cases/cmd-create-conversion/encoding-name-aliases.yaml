# Encoding names are matched case-insensitively and accept the aliases known to pg_char_to_encoding
# ('UTF-8' is an alias of UTF8). The catalog stores the canonical names. Unknown names map to -1.
id: cmd-create-conversion.encoding-name-aliases
title: Encoding names in CREATE CONVERSION are case-insensitive and accept aliases
family: cmd-create-conversion
tier: core
feature_ids: [create-conversion, encoding-names, encoding-functions]
required_capabilities: [create-conversion, drop-conversion, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_conversion.sgml#sql-createconversion (source_encoding, dest_encoding)"
sessions: [a]
steps:
  - sql: |
      CREATE CONVERSION cc_alias FOR 'UTF-8' TO 'latin1' FROM utf8_to_iso8859_1
    expect: ok
  - sql: |
      SELECT pg_encoding_to_char(conforencoding) AS src, pg_encoding_to_char(contoencoding) AS dst
      FROM pg_conversion WHERE conname = 'cc_alias'
    expect: rows
  - sql: |
      SELECT pg_char_to_encoding('utf8') AS utf8_lower,
             pg_char_to_encoding('UTF-8') AS utf8_alias,
             pg_char_to_encoding('LATIN1') AS latin1,
             pg_char_to_encoding('nope') AS unknown
    expect: rows
  - sql: |
      DROP CONVERSION cc_alias
    expect: ok
