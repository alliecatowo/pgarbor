# Neither side of a conversion may be SQL_ASCII, because the server hard-wires its behavior (Notes).
# Both source and destination are rejected with feature_not_supported (42P17).
id: cmd-create-conversion.sql-ascii-not-supported
title: SQL_ASCII as source or destination encoding is rejected
family: cmd-create-conversion
tier: core
feature_ids: [create-conversion, encoding-names, sql-ascii, errors]
required_capabilities: [create-conversion, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_conversion.sgml#sql-createconversion-notes"
sessions: [a]
steps:
  - sql: |
      CREATE CONVERSION cc_ascii_src FOR 'SQL_ASCII' TO 'LATIN1' FROM utf8_to_iso8859_1
    expect: error
    sqlstate: "42P17"
  - sql: |
      CREATE CONVERSION cc_ascii_dst FOR 'UTF8' TO 'SQL_ASCII' FROM utf8_to_iso8859_1
    expect: error
    sqlstate: "42P17"
  - sql: |
      SELECT count(*) FROM pg_conversion WHERE conname LIKE 'cc_ascii%'
    expect: rows
