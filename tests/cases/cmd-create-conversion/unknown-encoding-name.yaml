# Unknown source or destination encoding names fail with undefined_object (42704) and nothing is created.
id: cmd-create-conversion.unknown-encoding-name
title: CREATE CONVERSION with an unknown source or destination encoding name fails with 42704
family: cmd-create-conversion
tier: core
feature_ids: [create-conversion, encoding-names, errors]
required_capabilities: [create-conversion, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_conversion.sgml#sql-createconversion (source_encoding, dest_encoding)"
sessions: [a]
steps:
  - sql: |
      CREATE CONVERSION cc_bad_src FOR 'NOPE' TO 'LATIN1' FROM utf8_to_iso8859_1
    expect: error
    sqlstate: "42704"
    comment: source encoding does not exist
  - sql: |
      CREATE CONVERSION cc_bad_dst FOR 'UTF8' TO 'NOPE' FROM utf8_to_iso8859_1
    expect: error
    sqlstate: "42704"
    comment: destination encoding does not exist
  - sql: |
      SELECT count(*) FROM pg_conversion WHERE conname LIKE 'cc_bad%'
    expect: rows
