# Column-list subscripts assign array elements; missing elements and unlisted columns stay NULL; DEFAULT on an element is rejected.
id: insert.indirection-array-subscript
title: INSERT column-list array subscripts for VALUES and SELECT sources
family: insert
tier: core
feature_ids: [insert, arrays, indirection]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE TABLE ind (f1 int4, f2 int4[]);
steps:
  - sql: |
      INSERT INTO ind (f2[1], f2[2]) VALUES (1, 2)
    expect: ok
  - sql: |
      INSERT INTO ind (f2[1], f2[2]) VALUES (3, 4), (5, 6)
    expect: ok
  - sql: |
      INSERT INTO ind (f2[1], f2[2]) SELECT 7, 8
    expect: ok
  - sql: |
      INSERT INTO ind (f2[1], f2[2]) VALUES (1, DEFAULT)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT f1, f2, f2[1] AS first_elem FROM ind
    expect: rows
    order: multiset
