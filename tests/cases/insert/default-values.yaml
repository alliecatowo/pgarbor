# DEFAULT in the INSERT target list and VALUES list; omitted columns take their defaults.
id: insert.default-values
title: DEFAULT keyword and omitted columns take column defaults
family: insert
tier: core
feature_ids: [insert, column-defaults, create-table]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE TABLE inserttest (col1 int4, col2 int4 NOT NULL DEFAULT 7, col3 text DEFAULT 'testing');
steps:
  - sql: |
      INSERT INTO inserttest (col1, col2, col3) VALUES (DEFAULT, DEFAULT, DEFAULT)
    expect: ok
  - sql: |
      INSERT INTO inserttest (col2, col3) VALUES (3, DEFAULT)
    expect: ok
  - sql: |
      INSERT INTO inserttest (col1, col2, col3) VALUES (DEFAULT, 5, DEFAULT)
    expect: ok
  - sql: |
      INSERT INTO inserttest VALUES (DEFAULT, 5, 'test')
    expect: ok
  - sql: |
      INSERT INTO inserttest VALUES (DEFAULT, 7)
    expect: ok
  - sql: |
      SELECT col1, col2, col3 FROM inserttest ORDER BY col2, col3, col1 NULLS FIRST
    expect: rows
    order: ordered
