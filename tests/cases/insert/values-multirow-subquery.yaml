# Multi-row VALUES mixing literals, DEFAULT, and scalar subqueries.
id: insert.values-multirow-subquery
title: Multi-row VALUES with DEFAULT and scalar subqueries
family: insert
tier: core
feature_ids: [insert, subqueries, column-defaults]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE TABLE vt (col1 int4, col2 int4 NOT NULL, col3 text DEFAULT 'testing');
steps:
  - sql: |
      INSERT INTO vt VALUES (10, 20, '40'), (-1, 2, DEFAULT), ((SELECT 2), (SELECT i FROM (VALUES (3)) AS foo (i)), 'values are fun!')
    expect: ok
  - sql: |
      SELECT col1, col2, col3 FROM vt ORDER BY col1
    expect: rows
    order: ordered
