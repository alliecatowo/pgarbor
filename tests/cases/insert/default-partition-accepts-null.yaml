# A default list partition accepts NULL and every other value when it is the only partition.
id: insert.default-partition-accepts-null
title: Default partition accepts NULL and unmatched values
family: insert
tier: core
feature_ids: [insert, partitioning, null-semantics]
required_capabilities: [create-table, insert, select, partitioning]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE TABLE lp (a int4) PARTITION BY LIST (a);
  CREATE TABLE lp_def PARTITION OF lp DEFAULT;
steps:
  - sql: |
      INSERT INTO lp VALUES (NULL), (1), (-1)
    expect: ok
  - sql: |
      SELECT tableoid::regclass::text AS part, a FROM lp ORDER BY a NULLS LAST
    expect: rows
    order: ordered
