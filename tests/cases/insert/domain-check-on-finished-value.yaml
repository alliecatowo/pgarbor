# Domain NOT NULL-style checks apply to the finished array only: a partial subscript insert fails, while a complete one succeeds.
id: insert.domain-check-on-finished-value
title: Domain check fires on finished value of subscript insert, not on each element
family: insert
tier: extended
feature_ids: [insert, domains, arrays, constraints]
required_capabilities: [create-table, insert, select, domains]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE DOMAIN ins_nnarray AS int4[] CHECK (VALUE[1] IS NOT NULL AND VALUE[2] IS NOT NULL);
  CREATE TABLE dfin (f1 ins_nnarray);
steps:
  - sql: |
      INSERT INTO dfin (f1[1]) VALUES (1)
    expect: error
    sqlstate: "23514"
  - sql: |
      INSERT INTO dfin (f1[1], f1[2]) VALUES (1, 2)
    expect: ok
  - sql: |
      SELECT f1 FROM dfin
    expect: rows
    order: multiset
