# Unknown target column is 42703; extra VALUES expressions without a column list are 42601.
id: insert.undefined-column-and-too-many-values
title: Unknown INSERT target column and too many VALUES expressions raise errors
family: insert
tier: extended
feature_ids: [insert, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 errcodes 42703 undefined_column, 42601 syntax_error; sql-insert.html"
sessions: [a]
setup: |
  CREATE TABLE uc (a int4);
steps:
  - sql: |
      INSERT INTO uc (b) VALUES (1)
    expect: error
    sqlstate: "42703"
  - sql: |
      INSERT INTO uc VALUES (1, 2)
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM uc
    expect: rows
    order: multiset
