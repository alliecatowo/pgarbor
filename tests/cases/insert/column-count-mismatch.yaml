# Mismatch between INSERT target column list and VALUES expression count is a syntax-class error (42601).
id: insert.column-count-mismatch
title: INSERT target column count versus expression count mismatches raise 42601
family: insert
tier: core
feature_ids: [insert, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE TABLE cm (col1 int4, col2 int4 NOT NULL, col3 text DEFAULT 'testing');
steps:
  - sql: |
      INSERT INTO cm (col1, col2, col3) VALUES (DEFAULT, DEFAULT)
    expect: error
    sqlstate: "42601"
  - sql: |
      INSERT INTO cm (col1, col2, col3) VALUES (1, 2)
    expect: error
    sqlstate: "42601"
  - sql: |
      INSERT INTO cm (col1) VALUES (1, 2)
    expect: error
    sqlstate: "42601"
  - sql: |
      INSERT INTO cm (col1) VALUES (DEFAULT, DEFAULT)
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM cm
    expect: rows
    order: multiset
