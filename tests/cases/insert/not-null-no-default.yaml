# NULL (explicit or via DEFAULT) into a NOT NULL column without a default raises 23502; nothing is stored.
id: insert.not-null-no-default
title: DEFAULT or explicit NULL into NOT NULL column without default is rejected
family: insert
tier: core
feature_ids: [insert, not-null, constraints, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE TABLE t2 (col1 int4, col2 int4 NOT NULL, col3 text DEFAULT 'testing');
steps:
  - sql: |
      INSERT INTO t2 (col1, col2, col3) VALUES (DEFAULT, DEFAULT, DEFAULT)
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO t2 (col1, col2) VALUES (1, NULL)
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT count(*) FROM t2
    expect: rows
    order: multiset
