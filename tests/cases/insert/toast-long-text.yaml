# A value far larger than a page is stored (TOAST) and reads back with the same length.
id: insert.toast-long-text
title: Insert of a 10000-character text value round-trips its length
family: insert
tier: extended
feature_ids: [insert, toast, text]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert.sql"
sessions: [a]
setup: |
  CREATE TABLE tt (col1 int4, col2 int4 NOT NULL, col3 text DEFAULT 'testing');
steps:
  - sql: |
      INSERT INTO tt VALUES (30, 50, repeat('x', 10000))
    expect: ok
  - sql: |
      SELECT col1, col2, char_length(col3) AS len, left(col3, 3) AS head FROM tt
    expect: rows
    order: multiset
