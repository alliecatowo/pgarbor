# PG18 docs example: ALTER ROUTINE foo(integer) RENAME TO foobar. Works the same for functions,
# aggregates and procedures; the function variant is here, the others are in rename-all-kinds.
id: cmd-alter-routine.rename-doc-example
title: ALTER ROUTINE with an argument list renames a function and the old name no longer resolves
family: cmd-alter-routine
tier: core
feature_ids: [alter-routine, rename, function-identity]
required_capabilities: [create-function, alter-function, sql-functions, select]
provenance:
  source: pg-docs
  ref: "ref/alter_routine.sgml#sql-alterroutine (Examples: rename foo(integer) to foobar)"
sessions: [a]
setup: |
  CREATE FUNCTION foo(integer) RETURNS integer LANGUAGE sql AS 'SELECT $1 * 2';
steps:
  - sql: |
      ALTER ROUTINE foo(integer) RENAME TO foobar
    expect: ok
  - sql: |
      SELECT foobar(21) AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT proname FROM pg_proc WHERE proname IN ('foo', 'foobar') AND pronamespace = 'public'::regnamespace ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      ALTER ROUTINE foo(integer) RENAME TO x
    expect: error
    sqlstate: "42883"
    comment: the old signature no longer names any routine
