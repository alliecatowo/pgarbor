# DROP AGGREGATE refuses a plain function and leaves it in place.
id: cmd-drop-aggregate.not-an-aggregate
title: DROP AGGREGATE on an ordinary function is wrong_object_type
family: cmd-drop-aggregate
tier: core
feature_ids: [drop-aggregate, create-function, errors]
required_capabilities: [create-function, drop-aggregate, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_aggregate.sgml#sql-dropaggregate (DROP AGGREGATE removes an aggregate function)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION plainf(integer) RETURNS integer LANGUAGE sql AS 'SELECT $1'
    expect: ok
  - sql: |
      DROP AGGREGATE plainf(integer)
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT plainf(7) AS v
    expect: rows
    order: multiset
