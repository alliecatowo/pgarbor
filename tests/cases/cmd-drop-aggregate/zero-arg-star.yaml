# A zero-argument aggregate is named with '*'; dropping it twice fails the second time.
id: cmd-drop-aggregate.zero-arg-star
title: DROP AGGREGATE name(*) for a zero-argument aggregate
family: cmd-drop-aggregate
tier: core
feature_ids: [drop-aggregate, create-aggregate, aggregates]
required_capabilities: [aggregates, create-aggregate, create-function, drop-aggregate, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_aggregate.sgml#sql-dropaggregate (argtype: '*' for zero-argument)"
sessions: [a]
steps:
  - sql: |
      CREATE AGGREGATE myzero(*) (SFUNC = int8inc, STYPE = int8, INITCOND = '0')
    expect: ok
  - sql: |
      DROP AGGREGATE myzero(*)
    expect: ok
  - sql: |
      DROP AGGREGATE myzero(*)
    expect: error
    sqlstate: "42883"
