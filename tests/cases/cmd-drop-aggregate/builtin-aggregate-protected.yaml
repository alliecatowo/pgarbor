# Built-in aggregates are required by the system and cannot be dropped, including the '*' and hypothetical-set forms.
id: cmd-drop-aggregate.builtin-aggregate-protected
title: DROP AGGREGATE on built-in aggregates fails with dependency_required_by_system
family: cmd-drop-aggregate
tier: extended
feature_ids: [drop-aggregate, aggregates, system-catalog, errors]
required_capabilities: [aggregates, drop-aggregate, errors, catalog-introspection]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_aggregate.sgml#sql-dropaggregate (aggregate_signature)"
sessions: [a]
steps:
  - sql: |
      DROP AGGREGATE sum(integer)
    expect: error
    sqlstate: "2BP01"
  - sql: |
      DROP AGGREGATE count(*)
    expect: error
    sqlstate: "2BP01"
  - sql: |
      DROP AGGREGATE rank(VARIADIC "any" ORDER BY VARIADIC "any")
    expect: error
    sqlstate: "2BP01"
