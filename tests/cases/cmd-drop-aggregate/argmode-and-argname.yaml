# argname is ignored and argmode IN or VARIADIC is accepted when identifying the aggregate.
id: cmd-drop-aggregate.argmode-and-argname
title: DROP AGGREGATE ignores argument names and accepts IN and VARIADIC modes
family: cmd-drop-aggregate
tier: core
feature_ids: [drop-aggregate, create-aggregate, aggregates]
required_capabilities: [aggregates, create-aggregate, create-function, drop-aggregate]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_aggregate.sgml#sql-dropaggregate (argmode, argname)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION my_add(int8, int4) RETURNS int8 LANGUAGE sql IMMUTABLE AS 'SELECT coalesce($1, 0) + $2'
    expect: ok
  - sql: |
      CREATE AGGREGATE myavg(x integer) (SFUNC = my_add, STYPE = int8, INITCOND = '0')
    expect: ok
  - sql: |
      DROP AGGREGATE myavg(different_name integer)
    expect: ok
    comment: argname is not part of the identity
  - sql: |
      CREATE AGGREGATE myavg(integer) (SFUNC = my_add, STYPE = int8, INITCOND = '0')
    expect: ok
  - sql: |
      DROP AGGREGATE myavg(IN integer)
    expect: ok
    comment: IN is the default argmode
  - sql: |
      CREATE AGGREGATE myavg(integer) (SFUNC = my_add, STYPE = int8, INITCOND = '0')
    expect: ok
  - sql: |
      DROP AGGREGATE myavg(VARIADIC integer)
    expect: ok
