# Only the owner may drop an aggregate; testing that needs a second role and SET ROLE, which the shared oracle cluster does not allow in isolation.
id: cmd-drop-aggregate.owner-required-quarantined
title: DROP AGGREGATE by a non-owner role is rejected (owner check)
family: cmd-drop-aggregate
tier: extended
feature_ids: [drop-aggregate, roles, privileges, aggregates]
required_capabilities: [aggregates, create-aggregate, drop-aggregate, roles, privileges, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_aggregate.sgml#sql-dropaggregate (Description: must be the owner)"
sessions: [a]
steps:
  - sql: |
      SELECT 1
    expect: rows
quarantine:
  reason: "Needs CREATE ROLE and SET ROLE, which are cluster-global side effects; not isolatable in one scratch database on the shared oracle."
  since: "2026-10-15"
