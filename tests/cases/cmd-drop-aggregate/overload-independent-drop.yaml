# Dropping one overload leaves other signatures of the same name callable.
id: cmd-drop-aggregate.overload-independent-drop
title: Dropping the integer overload keeps the bigint overload usable
family: cmd-drop-aggregate
tier: core
feature_ids: [drop-aggregate, create-aggregate, aggregates, overloading]
required_capabilities: [aggregates, create-aggregate, create-function, drop-aggregate]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_aggregate.sgml#sql-dropaggregate (aggregate_signature identifies the aggregate)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION my_add(int8, int4) RETURNS int8 LANGUAGE sql IMMUTABLE AS 'SELECT coalesce($1, 0) + $2'
    expect: ok
  - sql: |
      CREATE AGGREGATE myavg(integer) (SFUNC = my_add, STYPE = int8, INITCOND = '0');
      CREATE AGGREGATE myavg(bigint) (SFUNC = int8pl, STYPE = int8, INITCOND = '0')
    expect: ok
  - sql: |
      DROP AGGREGATE myavg(integer)
    expect: ok
  - sql: |
      SELECT myavg(x) AS total FROM (VALUES (1::int8), (2::int8)) AS v(x)
    expect: rows
    order: multiset
  - sql: |
      SELECT myavg(x) AS total FROM (VALUES (5::int4)) AS v(x)
    expect: rows
    order: multiset
    comment: int4 input is implicitly coerced to the remaining bigint overload
