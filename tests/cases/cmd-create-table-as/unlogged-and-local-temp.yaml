# UNLOGGED and LOCAL TEMPORARY are valid CREATE TABLE AS prefixes and produce usable tables.
id: cmd-create-table-as.unlogged-and-local-temp
title: UNLOGGED and LOCAL TEMPORARY forms of CREATE TABLE AS create usable tables with the query data
family: cmd-create-table-as
tier: extended
feature_ids: [create-table-as, unlogged-table, temp-table]
required_capabilities: [create-table-as, create-table, temp-table, unlogged-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_table_as.sgml#sql-createtableas (UNLOGGED, TEMPORARY, LOCAL)"
sessions: [a]
steps:
  - sql: |
      CREATE UNLOGGED TABLE ul AS SELECT g AS n FROM generate_series(1, 4) g
    expect: ok
  - sql: |
      SELECT sum(n) FROM ul
    expect: rows
  - sql: |
      CREATE LOCAL TEMP TABLE lt AS SELECT g AS n FROM generate_series(1, 2) g
    expect: ok
    compare_message: false
    comment: LOCAL is accepted for compatibility; warnings may vary by build, so the message is not compared
  - sql: |
      SELECT n FROM lt ORDER BY n
    expect: rows
    order: ordered
