# VALUES as the query: default column names column1..N, types resolved from the rows, NULLs preserved.
id: cmd-create-table-as.values-with-nulls
title: CREATE TABLE AS VALUES names columns column1..N and preserves NULLs
family: cmd-create-table-as
tier: core
feature_ids: [create-table-as, values-clause, null-semantics]
required_capabilities: [create-table-as, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_table_as.sgml#sql-createtableas (query may be VALUES)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE vals AS VALUES (1, 'x'), (2, NULL), (NULL, 'z')
    expect: ok
  - sql: |
      SELECT column1, column2 FROM vals ORDER BY column1 NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM vals WHERE column2 IS NULL
    expect: rows
  - sql: |
      SELECT attname FROM pg_attribute WHERE attrelid = 'vals'::regclass AND attnum > 0 ORDER BY attnum
    expect: rows
    order: ordered
