# IF NOT EXISTS downgrades an existing-name collision to a notice and leaves the table unmodified.
id: cmd-create-table-as.if-not-exists-and-collisions
title: IF NOT EXISTS skips an existing relation with a notice; without it the name collision is an error
family: cmd-create-table-as
tier: core
feature_ids: [create-table-as, if-not-exists, duplicate-relation]
required_capabilities: [create-table-as, create-table, insert, select, views]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_table_as.sgml#sql-createtableas (IF NOT EXISTS)"
sessions: [a]
setup: |
  CREATE TABLE keep AS SELECT g AS n FROM generate_series(1, 3) g;
  CREATE VIEW keep_view AS SELECT 1 AS one;
steps:
  - sql: |
      CREATE TABLE IF NOT EXISTS keep AS SELECT g * 100 AS n FROM generate_series(1, 5) g
    expect: notice
    comment: notice only; existing table is not replaced
  - sql: |
      SELECT n FROM keep ORDER BY n
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE keep AS SELECT 1 AS n
    expect: error
    sqlstate: "42P07"
  - sql: |
      CREATE TABLE IF NOT EXISTS keep_view AS SELECT 2 AS one
    expect: notice
    comment: IF NOT EXISTS also covers a view with the same name
  - sql: |
      CREATE TABLE keep_view AS SELECT 2 AS one
    expect: error
    sqlstate: "42P07"
  - sql: |
      SELECT count(*) FROM keep
    expect: rows
    comment: still the original three rows
