# ON COMMIT is only valid for temporary tables; a permanent CREATE TABLE AS with it is rejected.
id: cmd-create-table-as.on-commit-non-temp-error
title: ON COMMIT on a permanent CREATE TABLE AS is rejected and creates nothing
family: cmd-create-table-as
tier: core
feature_ids: [create-table-as, on-commit, errors]
required_capabilities: [create-table-as, create-table, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_table_as.sgml#sql-createtableas (ON COMMIT applies to temporary tables)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE perm_drop ON COMMIT DROP AS SELECT 1 AS one
    expect: error
    sqlstate: "42P16"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'perm_drop'
    expect: rows
    comment: no relation was created
