# CREATE TABLE AS TABLE name is the documented short form for a full copy.
id: cmd-create-table-as.table-shorthand-copy
title: CREATE TABLE AS TABLE copies every row and column of the source table
family: cmd-create-table-as
tier: core
feature_ids: [create-table-as, table-command]
required_capabilities: [create-table-as, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_table_as.sgml#sql-createtableas (Examples: films2 TABLE films)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4, title text, date_prod date);
  INSERT INTO films VALUES (1, 'alpha', '2001-05-01'), (2, NULL, NULL), (3, '', '2003-01-01');
steps:
  - sql: |
      CREATE TABLE films2 AS TABLE films
    expect: ok
  - sql: |
      SELECT id, title, date_prod FROM films2 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS typ
      FROM pg_attribute a WHERE a.attrelid = 'films2'::regclass AND a.attnum > 0 AND NOT a.attisdropped
      ORDER BY a.attnum
    expect: rows
    order: ordered
    comment: column names and types carry over from the source
