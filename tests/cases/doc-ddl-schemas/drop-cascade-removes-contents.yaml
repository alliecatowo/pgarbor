# DROP SCHEMA ... CASCADE drops the schema together with the objects it contains.
id: doc-ddl-schemas.drop-cascade-removes-contents
title: DROP SCHEMA CASCADE removes the schema, its table and its view
family: doc-ddl-schemas
tier: core
feature_ids: [drop-schema, cascade, create-schema, create-table, create-view]
required_capabilities: [create-schema, create-table, create-view, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-schemas-create (To drop a schema including all contained objects, use: DROP SCHEMA myschema CASCADE)"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA myschema
    expect: ok
  - sql: |
      CREATE TABLE myschema.mytable (id int4)
    expect: ok
  - sql: |
      CREATE VIEW myschema.v AS SELECT id FROM myschema.mytable
    expect: ok
  - sql: |
      DROP SCHEMA myschema CASCADE
    expect: ok
    compare_message: false
    comment: the cascade notice text is not part of the documented contract
  - sql: |
      SELECT to_regnamespace('myschema') IS NULL AS schema_gone, to_regclass('myschema.mytable') IS NULL AS table_gone, to_regclass('myschema.v') IS NULL AS view_gone
    expect: rows
