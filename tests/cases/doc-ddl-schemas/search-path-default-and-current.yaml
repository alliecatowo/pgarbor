# Default search path is "$user", public; with no user schema the first existing entry (public) is
# the current schema and the default location for new objects.
id: doc-ddl-schemas.search-path-default-and-current
title: Default search path resolves to public and new unqualified tables are created there
family: doc-ddl-schemas
tier: core
feature_ids: [search-path, current-schema, public-schema, create-table]
required_capabilities: [create-table, select, guc, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-schemas-path (SHOW search_path; in the default setup this returns \"$user\", public)"
sessions: [a]
steps:
  - sql: |
      SHOW search_path
    expect: rows
    comment: default setup returns "$user", public
  - sql: |
      SELECT current_schema(), current_schemas(false)
    expect: rows
    comment: no schema named after the user exists, so the entry is ignored
  - sql: |
      CREATE TABLE sp_default (id int4)
    expect: ok
  - sql: |
      SELECT schemaname FROM pg_tables WHERE tablename = 'sp_default'
    expect: rows
