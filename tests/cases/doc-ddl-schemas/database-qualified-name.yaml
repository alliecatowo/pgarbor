# The three-part name database.schema.table is accepted only when the database is the connected one;
# another database name is rejected as a cross-database reference.
id: doc-ddl-schemas.database-qualified-name
title: database.schema.table works for the current database and fails for any other
family: doc-ddl-schemas
tier: extended
feature_ids: [qualified-names, create-table, errors, public-schema]
required_capabilities: [create-table, insert, select, errors, plpgsql]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-schemas-create (database.schema.table; if you write a database name, it must be the same as the database you are connected to)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('CREATE TABLE %I.public.dbq (id int4)', current_database()); END $$
    expect: ok
    comment: the connected database name is accepted as the first part
  - sql: |
      SELECT count(*) AS n FROM public.dbq
    expect: rows
  - sql: |
      CREATE TABLE nosuchdb_xyz.public.dbq2 (id int4)
    expect: error
    sqlstate: "0A000"
    comment: a different database name is a cross-database reference, which is not implemented
