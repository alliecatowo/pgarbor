# Basic macaddr round trip: create, insert text literals, read back canonical text, reconnect.
id: macaddr.input-canonical-output
title: "macaddr stores 6-byte MAC addresses and prints them as lowercase colon-separated hex"
family: macaddr
tier: slice
feature_ids: [macaddr, input-output, create-table, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/macaddr.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE m (a int4 PRIMARY KEY, b macaddr)
    expect: ok
  - sql: |
      INSERT INTO m VALUES (1, '08:00:2b:01:02:03'), (2, 'AA:BB:CC:DD:EE:FF'), (3, NULL)
    expect: ok
  - sql: |
      SELECT a, b, b::text AS t FROM m ORDER BY a
    expect: rows
    order: ordered
  - reconnect: true
  - sql: |
      SELECT b FROM m WHERE b = '08:00:2b:01:02:03'
    expect: rows
    order: multiset
