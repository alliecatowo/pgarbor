# All accepted macaddr input spellings (colon, dash, dot, colon-grouped, bare hex, mixed case)
# normalize to the same 6-byte value and print identically.
id: macaddr.input-separators
title: "macaddr input accepts colon, dash, dot, 4-digit grouped and bare hex spellings"
family: macaddr
tier: core
feature_ids: [macaddr, input-output, casts]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/macaddr.sql"
sessions: [a]
steps:
  - sql: |
      SELECT x::macaddr AS m, x::macaddr::text AS t
      FROM (VALUES
        ('08:00:2b:01:02:03'),
        ('08-00-2b-01-02-03'),
        ('08002b:010203'),
        ('08002b-010203'),
        ('0800.2b01.0203'),
        ('0800-2b01-0203'),
        ('08002b010203'),
        ('08:00:2B:01:02:03'),
        ('08002B010203')
      ) AS v(x)
    expect: rows
    order: multiset
    comment: all nine spellings are the same address
  - sql: |
      SELECT '08-00-2b-01-02-03'::macaddr = '08002b010203'::macaddr AS same
    expect: rows
  - sql: |
      SELECT 'ff:ff:ff:ff:ff:ff'::macaddr::text AS upper_bound, '00:00:00:00:00:00'::macaddr::text AS lower_bound
    expect: rows
