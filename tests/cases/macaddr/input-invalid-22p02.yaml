# Malformed macaddr literals are rejected with 22P02; the session stays usable afterwards.
id: macaddr.input-invalid-22p02
title: "Malformed macaddr literals raise invalid_text_representation (22P02)"
family: macaddr
tier: core
feature_ids: [macaddr, input-output, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/macaddr.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '0800:2b01:0203'::macaddr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'not even close'::macaddr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT ''::macaddr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '08:00:2b:01:02:'::macaddr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '08:00:2b:01:02:ZZ'::macaddr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '08:00:2b:01:02:03:04'::macaddr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
