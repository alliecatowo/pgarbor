# macaddr bitwise NOT, AND and OR operators, including NULL propagation.
id: macaddr.bitwise-ops
title: "macaddr bitwise NOT, AND and OR operate per byte and propagate NULL"
family: macaddr
tier: core
feature_ids: [macaddr, bitwise-operators, null-semantics]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/macaddr.sql"
sessions: [a]
setup: |
  CREATE TABLE x (b macaddr);
  INSERT INTO x VALUES ('08:00:2b:01:02:03'), (NULL), ('ff:ff:ff:ff:ff:ff');
steps:
  - sql: |
      SELECT ~b AS inv FROM x ORDER BY b NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT b & '00:00:00:ff:ff:ff' AS masked FROM x ORDER BY b NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT b | '01:02:03:04:05:06' AS ored FROM x ORDER BY b NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT '08:00:2b:01:02:03'::macaddr & '00:00:00:00:00:00'::macaddr = '00:00:00:00:00:00'::macaddr AS zero_mask
    expect: rows
