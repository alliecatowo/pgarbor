# macaddr <-> macaddr8 casts: a 6-byte address widens to EUI-64 with ff:fe inserted; in-range values narrow back.
id: macaddr.macaddr8-cast-roundtrip
title: "macaddr widens to macaddr8 with ff:fe inserted and narrows back when bytes 4-5 are ff:fe"
family: macaddr
tier: extended
feature_ids: [macaddr, macaddr8, casts]
required_capabilities: [select]
provenance:
  source: pg-source
  ref: "src/backend/utils/adt/mac8.c; src/test/regress/sql/macaddr.sql (macaddr side)"
sessions: [a]
steps:
  - sql: |
      SELECT '08:00:2b:01:02:03'::macaddr::macaddr8 AS widened
    expect: rows
  - sql: |
      SELECT '08:00:2b:ff:fe:01:02:03'::macaddr8::macaddr AS narrowed
    expect: rows
  - sql: |
      SELECT ('08:00:2b:01:02:03'::macaddr::macaddr8)::macaddr = '08:00:2b:01:02:03'::macaddr AS roundtrip
    expect: rows
  - sql: |
      SELECT trunc('08:00:2b:ff:fe:01:02:03'::macaddr8) AS t
    expect: rows
  - sql: |
      SELECT NULL::macaddr::macaddr8 IS NULL AS is_null
    expect: rows
