# Non-throwing input validation: pg_input_is_valid and pg_input_error_info for macaddr.
id: macaddr.input-error-info
title: "pg_input_is_valid and pg_input_error_info report macaddr syntax errors without raising"
family: macaddr
tier: extended
feature_ids: [macaddr, input-output, errors, catalog-functions]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/macaddr.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('08:00:2b:01:02:03', 'macaddr') AS valid
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('08:00:2b:01:02:ZZ', 'macaddr') AS valid
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('08:00:2b:01:02:ZZ', 'macaddr')
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('08:00:2b:01:02:', 'macaddr') AS valid
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('0800:2b01:0203', 'macaddr')
    expect: rows
