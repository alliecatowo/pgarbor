# trunc(macaddr) zeroes the last three bytes (the vendor/OUI prefix is kept); NULL in, NULL out.
id: macaddr.trunc-function
title: "trunc(macaddr) keeps the first three bytes and zeroes the rest; NULL input yields NULL"
family: macaddr
tier: core
feature_ids: [macaddr, functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/macaddr.sql"
sessions: [a]
steps:
  - sql: |
      SELECT trunc('08:00:2b:01:02:03'::macaddr) AS t
    expect: rows
  - sql: |
      SELECT trunc('ff:ff:ff:ff:ff:ff'::macaddr) AS t
    expect: rows
  - sql: |
      SELECT trunc('08:00:2b:01:02:03'::macaddr) = '08:00:2b:00:00:00'::macaddr AS eq_prefix
    expect: rows
  - sql: |
      SELECT trunc(NULL::macaddr) IS NULL AS is_null
    expect: rows
