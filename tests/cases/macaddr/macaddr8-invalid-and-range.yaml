# macaddr8 -> macaddr narrowing fails with 22003 when bytes 4-5 are not ff:fe; malformed macaddr8 input is 22P02.
id: macaddr.macaddr8-invalid-and-range
title: "Narrowing macaddr8 outside the EUI-48 range raises 22003; short macaddr8 input raises 22P02"
family: macaddr
tier: extended
feature_ids: [macaddr, macaddr8, casts, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-source
  ref: "src/backend/utils/adt/mac8.c (macaddr8_macaddr out-of-range check; macaddr8_in); src/test/regress/sql/macaddr.sql (macaddr side)"
sessions: [a]
steps:
  - sql: |
      SELECT '08:00:2b:01:02:03:04:05'::macaddr8::macaddr
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '08:00:2b:ff:ff:01:02:03'::macaddr8::macaddr
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '08:00:2b:01:02'::macaddr8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'zz:00:2b:01:02:03'::macaddr8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '08:00:2b:ff:fe:01:02:03'::macaddr8::macaddr AS ok_range
    expect: rows
