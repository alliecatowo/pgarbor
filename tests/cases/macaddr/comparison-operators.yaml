# macaddr comparison operators (=, <>, <, <=, >, >=) on a column, including a NULL row.
id: macaddr.comparison-operators
title: "macaddr comparison operators order values byte-wise and return NULL for NULL operands"
family: macaddr
tier: core
feature_ids: [macaddr, comparison-operators, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/macaddr.sql"
sessions: [a]
setup: |
  CREATE TABLE c (a int4, b macaddr);
  INSERT INTO c VALUES (1, '08:00:2b:01:02:03'), (2, '08:00:2b:01:02:02'), (3, '08:00:2a:ff:ff:ff'), (4, NULL);
steps:
  - sql: |
      SELECT a,
             b < '08:00:2b:01:02:04' AS lt,
             b > '08:00:2b:01:02:04' AS gt,
             b = '08:00:2b:01:02:03' AS eq,
             b <> '08:00:2b:01:02:03' AS ne,
             b <= '08:00:2b:01:02:03' AS le,
             b >= '08:00:2b:01:02:03' AS ge
      FROM c ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM c WHERE b < '08:00:2b:01:02:03' ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM c WHERE b > '08:00:2b:01:02:03' ORDER BY a
    expect: rows
    order: ordered
