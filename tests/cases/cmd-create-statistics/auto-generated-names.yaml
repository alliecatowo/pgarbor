# Omitting the name makes PostgreSQL derive one from the table and columns or expressions.
id: cmd-create-statistics.auto-generated-names
title: Omitted statistics name is derived from the table and its columns or expressions
family: cmd-create-statistics
tier: core
feature_ids: [create-statistics, default-naming]
required_capabilities: [create-table, extended-statistics, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_statistics.sgml#sql-createstatistics (Parameters: statistics_name)"
sessions: [a]
setup: |
  CREATE TABLE cs_auto (a int, b int, d timestamp);
steps:
  - sql: |
      CREATE STATISTICS ON a, b FROM cs_auto
    expect: ok
  - sql: |
      CREATE STATISTICS ON (a * 2) FROM cs_auto
    expect: ok
  - sql: |
      CREATE STATISTICS ON date_trunc('day', d), date_trunc('month', d) FROM cs_auto
    expect: ok
  - sql: |
      SELECT stxname FROM pg_statistic_ext WHERE stxrelid = 'cs_auto'::regclass ORDER BY stxname
    expect: rows
    order: ordered
    comment: generated names are chosen by the server, so the exact spelling is recorded from the oracle
