# The order of columns in the list does not matter: both orderings describe the same column set, stored as sorted keys.
id: cmd-create-statistics.column-order-not-significant
title: Column order in the statistics definition is not significant
family: cmd-create-statistics
tier: core
feature_ids: [create-statistics, column-order]
required_capabilities: [create-table, insert, extended-statistics, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_statistics.sgml#sql-createstatistics (Parameters: column_name: order is not significant)"
sessions: [a]
setup: |
  CREATE TABLE cs_ord (a int, b int, c int);
  INSERT INTO cs_ord VALUES (1, 1, 1), (1, 1, 2), (2, 2, 3);
steps:
  - sql: |
      CREATE STATISTICS cs_ord_ab (ndistinct, dependencies) ON a, b FROM cs_ord
    expect: ok
  - sql: |
      CREATE STATISTICS cs_ord_ba (ndistinct, dependencies) ON b, a FROM cs_ord
    expect: ok
  - sql: |
      SELECT stxname, stxkeys::text, stxkind::text FROM pg_statistic_ext WHERE stxrelid = 'cs_ord'::regclass ORDER BY stxname
    expect: rows
    order: ordered
    comment: both objects store the same sorted key set
  - sql: |
      ANALYZE cs_ord
    expect: ok
  - sql: |
      SELECT statistics_name, dependencies::text FROM pg_stats_ext WHERE tablename = 'cs_ord' ORDER BY statistics_name
    expect: rows
    order: ordered
