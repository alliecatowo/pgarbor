# Foreign tables are a documented target, but creating one needs a foreign data wrapper and foreign server, which a single isolated database does not provide.
id: cmd-create-statistics.foreign-table-target
title: CREATE STATISTICS on a foreign table
family: cmd-create-statistics
tier: extended
feature_ids: [create-statistics, foreign-tables]
required_capabilities: [extended-statistics, foreign-data-wrappers]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_statistics.sgml#sql-createstatistics (Description: foreign table)"
sessions: [a]
steps:
  - sql: |
      CREATE STATISTICS cs_ft_s ON a, b FROM cs_ft
    expect: ok
quarantine:
  reason: needs a foreign data wrapper and foreign server in the isolated database; no such fixture exists in the single-database oracle path
  since: "2026-10-15"
