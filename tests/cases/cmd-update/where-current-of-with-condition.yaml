# WHERE CURRENT OF cannot be combined with a Boolean condition.
id: cmd-update.where-current-of-with-condition
title: WHERE CURRENT OF combined with an extra condition is a syntax error
family: cmd-update
tier: core
feature_ids: [update, where-current-of, errors]
required_capabilities: [create-table, insert, select, update, cursors, transactions, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/update.sgml#SQL-UPDATE (WHERE CURRENT OF cannot be specified together with a Boolean condition)"
sessions: [a]
setup: |
  CREATE TABLE films (code text PRIMARY KEY, kind text);
  INSERT INTO films VALUES ('A', 'Drama')
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c5 CURSOR FOR SELECT code FROM films
    expect: ok
  - sql: |
      FETCH c5
    expect: rows
  - sql: |
      UPDATE films SET kind = 'Y' WHERE code = 'A' AND CURRENT OF c5
    expect: error
    sqlstate: "42601"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT code, kind FROM films
    expect: rows
    order: multiset
