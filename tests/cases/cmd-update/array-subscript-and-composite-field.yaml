# SET column names may carry an array subscript or a composite subfield.
id: cmd-update.array-subscript-and-composite-field
title: UPDATE assigns one array element and one composite field in a single SET
family: cmd-update
tier: extended
feature_ids: [update, array-subscript, composite-field, set-subfield]
required_capabilities: [create-table, insert, select, update, arrays, composite-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/update.sgml#SQL-UPDATE (column_name may be qualified with a subfield name or array subscript)"
sessions: [a]
setup: |
  CREATE TYPE pt AS (x int, y int);
  CREATE TABLE arrt (id int, arr int[], comp pt);
  INSERT INTO arrt VALUES (1, '{1,2,3}', '(1,2)')
steps:
  - sql: |
      UPDATE arrt SET arr[2] = 20, comp.x = 9 WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, arr, comp FROM arrt
    expect: rows
    order: multiset
