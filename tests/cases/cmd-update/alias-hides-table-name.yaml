# Once an alias is given, the table name is hidden in the rest of the statement.
id: cmd-update.alias-hides-table-name
title: UPDATE with an alias rejects references through the original table name
family: cmd-update
tier: core
feature_ids: [update, table-alias, errors]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/update.sgml#SQL-UPDATE (alias: UPDATE foo AS f must refer to f, not foo)"
sessions: [a]
setup: |
  CREATE TABLE films (code text PRIMARY KEY, kind text);
  INSERT INTO films VALUES ('A', 'Drama')
steps:
  - sql: |
      UPDATE films AS f SET kind = 'Z' WHERE films.code = 'A'
    expect: error
    sqlstate: "42P01"
  - sql: |
      UPDATE films AS f SET kind = 'Z' WHERE f.code = 'A'
    expect: ok
  - sql: |
      SELECT code, kind FROM films
    expect: rows
    order: multiset
