# Documented example: rename one value across matching rows.
id: cmd-update.films-drama-example
title: UPDATE rewrites every matching row and leaves the rest untouched
family: cmd-update
tier: core
feature_ids: [update, where-clause]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/update.sgml#SQL-UPDATE (Examples: UPDATE films SET kind = 'Dramatic' WHERE kind = 'Drama')"
sessions: [a]
setup: |
  CREATE TABLE films (code text PRIMARY KEY, kind text);
  INSERT INTO films VALUES ('A', 'Drama'), ('B', 'Comedy'), ('C', 'Drama')
steps:
  - sql: |
      UPDATE films SET kind = 'Dramatic' WHERE kind = 'Drama'
    expect: ok
  - sql: |
      SELECT code, kind FROM films ORDER BY code
    expect: rows
    order: ordered
