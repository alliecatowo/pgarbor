# RETURNING WITH (OLD AS o, NEW AS n) names the pre- and post-update row versions.
id: cmd-update.returning-old-new-aliases
title: RETURNING WITH OLD/NEW aliases exposes both row versions
family: cmd-update
tier: extended
feature_ids: [update, returning, old-values, returning-aliases]
required_capabilities: [create-table, insert, select, update, returning]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/update.sgml#SQL-UPDATE (output_alias: RETURNING WITH (OLD AS o, NEW AS n) o.*, n.*)"
sessions: [a]
setup: |
  CREATE TABLE weather (city text, date date, temp_lo int, temp_hi int);
  INSERT INTO weather VALUES ('San Francisco', '2003-07-04', 11, 21), ('Oakland', '2003-07-04', 5, 9)
steps:
  - sql: |
      UPDATE weather AS w SET temp_lo = 99
        WHERE w.city = 'San Francisco'
        RETURNING WITH (OLD AS o, NEW AS n) o.temp_lo AS old_lo, n.temp_lo AS new_lo, n.city AS city
    expect: rows
  - sql: |
      SELECT city, temp_lo, temp_hi FROM weather ORDER BY city
    expect: rows
    order: ordered
