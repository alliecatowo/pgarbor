# Bit string operators: each documented example from the operator table, one row per operator.
id: doc-functions-bitstring.operators-doc-examples
title: Bit string operators || & | # ~ << >> match the documented examples
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-operators, bit-concat, bit-bitwise, bit-shift]
required_capabilities: [select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (Bit String Operators table)"
sessions: [a]
steps:
  - sql: |
      SELECT B'10001' || B'011' AS concat_ex,
             B'10001' & B'01101' AS and_ex,
             B'10001' | B'01101' AS or_ex,
             B'10001' # B'01101' AS xor_ex,
             ~ B'10001' AS not_ex,
             B'10001' << 3 AS shl_ex,
             B'10001' >> 2 AS shr_ex
    expect: rows
    order: ordered
    comment: documented results 10001011, 00001, 11101, 11100, 01110, 01000, 00100
