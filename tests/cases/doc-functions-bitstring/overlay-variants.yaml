# overlay replaces count bits starting at a 1-based bit position; the count defaults to the length of the replacement.
id: doc-functions-bitstring.overlay-variants
title: overlay with documented example, default count, zero count and FROM-only forms
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-overlay]
required_capabilities: [select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (overlay: If count is omitted, it defaults to the length of newsubstring)"
sessions: [a]
steps:
  - sql: |
      SELECT overlay(B'01010101010101010' placing B'11111' from 2 for 3) AS ov_ex
    expect: rows
    order: ordered
    comment: documented result 0111110101010101010
  - sql: |
      SELECT overlay(B'01010101010101010' placing B'11111' from 2) AS ov_default_count,
             overlay(B'0101' placing B'11' from 1 for 0) AS ov_zero_count,
             overlay(B'0101' placing B'' from 2 for 2) AS ov_empty_replacement
    expect: rows
    order: ordered
    comment: default count equals length of newsubstring (5); count 0 inserts without removing bits
  - sql: |
      SELECT overlay(B'1111' placing B'0' from 4 for 1) AS ov_last_bit,
             overlay(B'1111' placing B'0' from 1 for 4) AS ov_whole
    expect: rows
    order: ordered
