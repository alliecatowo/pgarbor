# Integer to bit and bit to integer casts: rightmost bits copied, sign extension when widening, and overflow on the way back.
id: doc-functions-bitstring.integer-casts
title: Integer and bit casts copy rightmost bits, sign-extend when widening and reject overflow
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-integer-cast, errors]
required_capabilities: [select, bit-string, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (casting integral values to and from bit)"
sessions: [a]
steps:
  - sql: |
      SELECT 44::bit(10) AS c_10, 44::bit(3) AS c_3, cast(-44 AS bit(12)) AS c_neg12, '1110'::bit(4)::integer AS back_14
    expect: rows
    order: ordered
    comment: documented results 0000101100, 100, 111111010100, 14
  - sql: |
      SELECT 44::bit AS c_default, 45::bit AS c_default_odd, cast(-1 AS bit) AS c_neg_default
    expect: rows
    order: ordered
    comment: casting to bare bit means bit(1), keeping only the least significant bit
  - sql: |
      SELECT B'11111111111111111111111111111111'::bit(32)::int4 AS top_bit_set,
             B'1111111111111111111111111111111111'::bit(34)::bigint AS wide_to_int8
    expect: rows
    order: ordered
    comment: a 32-bit string with its high bit set reads as a negative int4
  - sql: |
      SELECT B'100000000000000000000000000000000'::bit(33)::int4
    expect: error
    sqlstate: "22003"
    comment: 33 bits do not fit in int4
