# NULL inputs to bit string operators and functions produce NULL, and NULL indexes or values propagate too.
id: doc-functions-bitstring.null-propagation
title: NULL operands and arguments to bit string operators and functions yield NULL
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, null-semantics]
required_capabilities: [select, bit-string]
provenance:
  source: hand
  ref: "PG18 func.sgml#functions-bit; strict function NULL behaviour"
sessions: [a]
steps:
  - sql: |
      SELECT (B'10' || NULL::bit) IS NULL AS concat_null,
             (B'1' & NULL::bit) IS NULL AS and_null,
             (NULL::bit | B'1') IS NULL AS or_null,
             (B'1' # NULL::bit) IS NULL AS xor_null,
             (~ NULL::bit) IS NULL AS not_null,
             (NULL::bit << 1) IS NULL AS shl_null,
             (NULL::bit >> 1) IS NULL AS shr_null
    expect: rows
    order: ordered
  - sql: |
      SELECT bit_count(NULL::bit) IS NULL AS pc_null,
             bit_length(NULL::bit) IS NULL AS bl_null,
             length(NULL::bit) IS NULL AS len_null,
             octet_length(NULL::bit) IS NULL AS ol_null,
             (overlay(NULL::bit PLACING B'1' FROM 1)) IS NULL AS ov_null,
             (overlay(B'10' PLACING NULL::bit FROM 1)) IS NULL AS ov_repl_null,
             (substring(NULL::bit FROM 1 FOR 1)) IS NULL AS sub_null,
             (position(NULL::bit IN B'01')) IS NULL AS pos_null_needle,
             (position(B'1' IN NULL::bit)) IS NULL AS pos_null_hay
    expect: rows
    order: ordered
  - sql: |
      SELECT (get_bit(B'10', NULL)) IS NULL AS gb_null_idx,
             (set_bit(B'10', NULL, 1)) IS NULL AS sb_null_idx,
             (set_bit(B'10', 0, NULL)) IS NULL AS sb_null_val
    expect: rows
    order: ordered
