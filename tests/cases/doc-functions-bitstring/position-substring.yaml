# position and substring: documented examples, the "not present" zero result, and the rule that substring needs start or count.
id: doc-functions-bitstring.position-substring
title: position and substring match documented examples; substring needs FROM or FOR
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-position, bit-substring, errors]
required_capabilities: [select, bit-string, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (position, substring)"
sessions: [a]
steps:
  - sql: |
      SELECT position(B'010' IN B'000001101011') AS pos_ex,
             position(B'111' IN B'000') AS pos_absent,
             position(B'' IN B'101') AS pos_empty_needle,
             position(B'1' IN B'') AS pos_empty_haystack
    expect: rows
    order: ordered
    comment: documented result 8; absent substring gives 0
  - sql: |
      SELECT substring(B'110010111111' FROM 3 FOR 2) AS sub_ex,
             substring(B'110010111111' FROM 3) AS sub_from,
             substring(B'110010111111' FOR 2) AS sub_for,
             substring(B'110010111111' FROM 20) AS sub_past_end
    expect: rows
    order: ordered
    comment: documented result 00; FROM-only runs to the end; start past the end gives empty
  - sql: |
      SELECT substring(B'110010111111' FROM 0 FOR 3) AS sub_zero_start,
             substring(B'110010111111' FROM -2 FOR 5) AS sub_neg_start
    expect: rows
    order: ordered
    comment: positions before the first bit are outside the string; only bits 1..2 survive
  - sql: |
      SELECT substring(B'1011')
    expect: error
    sqlstate: "42883"
    comment: documented rule that at least one of start and count must be provided; no one-argument form exists
