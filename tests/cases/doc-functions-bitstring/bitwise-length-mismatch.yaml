# Bitwise AND, OR and XOR require equal-length operands; NOT and concatenation do not.
id: doc-functions-bitstring.bitwise-length-mismatch
title: Bitwise AND OR XOR reject unequal bit string lengths with 22026
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-bitwise, errors]
required_capabilities: [select, bit-string, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (bit & bit, bit | bit, bit # bit: inputs must be of equal length)"
sessions: [a]
steps:
  - sql: |
      SELECT B'10001' & B'011'
    expect: error
    sqlstate: "22026"
    comment: documented requirement of equal length for AND
  - sql: |
      SELECT B'10001' | B'0'
    expect: error
    sqlstate: "22026"
    comment: documented requirement of equal length for OR
  - sql: |
      SELECT B'10001' # B'01'
    expect: error
    sqlstate: "22026"
    comment: documented requirement of equal length for XOR
  - sql: |
      SELECT B'1010' & B'0011'::bit varying AS equal_len_mixed
    expect: rows
    order: ordered
    comment: equal lengths across bit and bit varying are accepted
  - sql: |
      SELECT B'10' || B'1' AS concat_unequal, ~ B'10001' AS not_any_len
    expect: rows
    order: ordered
    comment: concatenation and NOT have no equal-length requirement
