# bit_count, bit_length, length and octet_length: documented examples plus empty and byte-boundary inputs.
id: doc-functions-bitstring.length-functions
title: bit_count bit_length length octet_length match documented examples and byte boundaries
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-length, bit-count, octet-length]
required_capabilities: [select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (bit_count, bit_length, length, octet_length)"
sessions: [a]
steps:
  - sql: |
      SELECT bit_count(B'10111') AS popcount_ex,
             bit_length(B'10111') AS bitlen_ex,
             length(B'10111') AS len_ex,
             octet_length(B'1011111011') AS octets_ex
    expect: rows
    order: ordered
    comment: documented results 4, 5, 5, 2
  - sql: |
      SELECT bit_count(B'') AS pc_empty,
             bit_length(B'') AS bl_empty,
             octet_length(B'') AS ol_empty,
             octet_length(B'10000000') AS ol_8,
             octet_length(B'100000000') AS ol_9,
             octet_length(B'111111110000000011111111') AS ol_24
    expect: rows
    order: ordered
    comment: octet_length rounds a partial byte up
  - sql: |
      SELECT bit_count(B'101'::bit varying) AS pc_varying,
             bit_length(B'1'::bit varying) AS bl_varying,
             bit_count(B'11111111') AS pc_all_ones
    expect: rows
    order: ordered
