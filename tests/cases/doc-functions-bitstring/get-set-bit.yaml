# get_bit and set_bit: zero-based leftmost indexing, documented examples, index bounds and the new-bit check.
id: doc-functions-bitstring.get-set-bit
title: get_bit and set_bit use zero-based leftmost indexing and reject out-of-range indexes and bad values
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-get-set, errors]
required_capabilities: [select, bit-string, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (get_bit, set_bit: the first (leftmost) bit is bit 0)"
sessions: [a]
steps:
  - sql: |
      SELECT get_bit(B'101010101010101010', 6) AS get_ex,
             get_bit(B'101', 0) AS first_bit,
             get_bit(B'101', 2) AS last_bit
    expect: rows
    order: ordered
    comment: documented result 1; index 0 is the leftmost bit
  - sql: |
      SELECT set_bit(B'101010101010101010', 6, 0) AS set_ex,
             set_bit(B'1010', 0, 1) AS set_first,
             set_bit(B'1010', 3, 1) AS set_last
    expect: rows
    order: ordered
    comment: documented result 101010001010101010; length is unchanged
  - sql: |
      SELECT get_bit(B'101', 3)
    expect: error
    sqlstate: "2202E"
    comment: index equal to the length is out of range (valid 0..2)
  - sql: |
      SELECT get_bit(B'101', -1)
    expect: error
    sqlstate: "2202E"
    comment: negative index is out of range
  - sql: |
      SELECT set_bit(B'101', 3, 1)
    expect: error
    sqlstate: "2202E"
    comment: set_bit uses the same index bounds
  - sql: |
      SELECT set_bit(B'101', 0, 2)
    expect: error
    sqlstate: "22023"
    comment: newvalue must be 0 or 1
