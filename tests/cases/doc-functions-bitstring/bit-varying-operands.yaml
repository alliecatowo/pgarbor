# bit varying can be used interchangeably with bit in operators and functions; results carry the same values.
id: doc-functions-bitstring.bit-varying-operands
title: Operators and functions accept bit varying operands with the same results as bit
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-varying, bit-operators, bit-length]
required_capabilities: [select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (While only type bit is mentioned in these tables, values of type bit varying can be used interchangeably)"
sessions: [a]
steps:
  - sql: |
      SELECT B'10001'::bit varying || B'011'::bit varying AS v_concat,
             B'10001'::bit varying & B'01101'::bit varying AS v_and,
             B'10001'::bit varying | B'01101'::bit varying AS v_or,
             B'10001'::bit varying # B'01101'::bit varying AS v_xor,
             ~ B'10001'::bit varying AS v_not,
             B'10001'::bit varying << 3 AS v_shl,
             B'10001'::bit varying >> 2 AS v_shr
    expect: rows
    order: ordered
    comment: same documented values as the bit(n) operator examples
  - sql: |
      SELECT bit_count(B'10111'::bit varying) AS v_pc,
             bit_length(B'10111'::bit varying) AS v_bl,
             octet_length(B'1011111011'::bit varying) AS v_ol,
             get_bit(B'101010101010101010'::bit varying, 6) AS v_get,
             position(B'010'::bit varying IN B'000001101011'::bit varying) AS v_pos,
             substring(B'110010111111'::bit varying FROM 3 FOR 2) AS v_sub
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(B'101' || B'1'::bit varying)::text AS concat_type
    expect: rows
    order: ordered
    comment: concatenating bit with bit varying resolves to bit varying
