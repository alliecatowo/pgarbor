# Shifts keep the string length: bits shifted out are dropped and zeros enter at the other end.
id: doc-functions-bitstring.shift-preserves-length
title: Bit shifts preserve string length, including shifts by 0, by the full width and beyond
family: doc-functions-bitstring
tier: core
feature_ids: [bit-string, bit-shift, bit-length-preserving]
required_capabilities: [select, bit-string]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-bit (bit << integer / bit >> integer: string length is preserved)"
sessions: [a]
steps:
  - sql: |
      SELECT B'111' << 1 AS left1,
             B'111' >> 1 AS right1,
             B'111' << 0 AS left0,
             B'111' << 3 AS left_full,
             B'111' >> 3 AS right_full,
             B'111' << 10 AS left_beyond,
             B'111' >> 10 AS right_beyond,
             B'' << 3 AS empty_shift,
             bit_length(B'111' << 1) AS len_after_shift
    expect: rows
    order: ordered
  - sql: |
      SELECT B'10'::bit varying << 1 AS vleft,
             B'1011'::bit varying >> 2 AS vright
    expect: rows
    order: ordered
    comment: shifts also work on bit varying; the result keeps the operand width
