# A column may come from only one source: two LIKEs of the same table, or LIKE plus an explicit column of the same name, is an error.
id: create-table-like.duplicate-column-error
title: Duplicate column from repeated LIKE or explicit column name raises duplicate_column
family: create-table-like
tier: core
feature_ids: [create-table, create-table-like, errors, catalog-introspection]
required_capabilities: [create-table, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table_like.sql"
sessions: [a]
setup: |
  CREATE TABLE src (xx text DEFAULT 'text');
steps:
  - sql: |
      CREATE TABLE dup (LIKE src, LIKE src)
    expect: error
    sqlstate: "42701"
  - sql: |
      CREATE TABLE clash (xx int4, LIKE src)
    expect: error
    sqlstate: "42701"
  - sql: |
      SELECT to_regclass('dup') IS NULL AND to_regclass('clash') IS NULL AS neither_created
    expect: rows
