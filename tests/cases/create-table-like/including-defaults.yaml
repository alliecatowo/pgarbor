# INCLUDING DEFAULTS copies the default expression; an explicit NULL still overrides it.
id: create-table-like.including-defaults
title: LIKE INCLUDING DEFAULTS copies defaults, explicit NULL overrides them
family: create-table-like
tier: core
feature_ids: [create-table, create-table-like, defaults, insert, select, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table_like.sql"
sessions: [a]
setup: |
  CREATE TABLE src (a int4, b text DEFAULT 'dflt');
  CREATE TABLE dst (LIKE src INCLUDING DEFAULTS);
steps:
  - sql: |
      INSERT INTO dst (a) VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO dst (a, b) VALUES (2, NULL)
    expect: ok
  - sql: |
      SELECT a, b, b IS NULL AS b_null FROM dst ORDER BY a
    expect: rows
    order: ordered
