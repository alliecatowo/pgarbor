# LIKE of a relation that does not exist fails and leaves no table behind.
id: create-table-like.undefined-source-error
title: LIKE of a missing relation fails with undefined_table and creates nothing
family: create-table-like
tier: core
feature_ids: [create-table, create-table-like, errors, catalog-introspection]
required_capabilities: [create-table, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table_like.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE foo (LIKE nonexistent)
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT to_regclass('foo') IS NULL AS absent
    expect: rows
