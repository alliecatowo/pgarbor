# INCLUDING COMMENTS copies column comments; without it the copied columns carry none.
id: create-table-like.comments
title: LIKE INCLUDING COMMENTS copies column comments, plain LIKE does not
family: create-table-like
tier: extended
feature_ids: [create-table, create-table-like, comments, catalog-introspection]
required_capabilities: [create-table, select, comments]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table_like.sql"
sessions: [a]
setup: |
  CREATE TABLE src (a int4, b text);
  COMMENT ON COLUMN src.a IS 'A';
  COMMENT ON COLUMN src.b IS 'B';
  CREATE TABLE plain (LIKE src);
  CREATE TABLE cmt (LIKE src INCLUDING COMMENTS);
steps:
  - sql: |
      SELECT col_description('plain'::regclass, 1) IS NULL AS a_null, col_description('plain'::regclass, 2) IS NULL AS b_null
    expect: rows
  - sql: |
      SELECT col_description('cmt'::regclass, 1) AS a_comment, col_description('cmt'::regclass, 2) AS b_comment
    expect: rows
