# Two SERIALIZABLE transactions each read a global sum and write a different row; the second commit is rejected.
id: doc-applevel-consistency.serializable-write-skew-40001
title: SERIALIZABLE write skew is rejected with 40001 at the second commit
family: doc-applevel-consistency
tier: core
feature_ids: [serializable, read-write-conflict, serialization-failure]
required_capabilities: [create-table, insert, select, update, transactions, isolation-levels, multi-session, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#applevel-consistency"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, balance int4 NOT NULL);
  INSERT INTO acct VALUES (1, 100), (2, 200);
steps:
  - session: a
    sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - session: a
    sql: |
      SELECT sum(balance) AS total FROM acct
    expect: rows
    order: ordered
  - session: b
    sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - session: b
    sql: |
      SELECT sum(balance) AS total FROM acct
    expect: rows
    order: ordered
  - session: a
    sql: |
      UPDATE acct SET balance = balance + 10 WHERE id = 1
    expect: ok
  - session: b
    sql: |
      UPDATE acct SET balance = balance + 20 WHERE id = 2
    expect: ok
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    sql: |
      COMMIT
    expect: error
    sqlstate: "40001"
    comment: the pivot is canceled at commit; the transaction is rolled back
  - session: a
    sql: |
      SELECT id, balance FROM acct ORDER BY id
    expect: rows
    order: ordered
    comment: only the first transaction's write survives
