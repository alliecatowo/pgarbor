# LOCK TABLE ... IN SHARE MODE admits readers but makes a concurrent writer wait until commit.
id: doc-applevel-consistency.lock-table-share-blocks-writer
title: SHARE table lock admits readers and blocks an UPDATE until the lock holder commits
family: doc-applevel-consistency
tier: core
feature_ids: [lock-table, share-lock, read-committed]
required_capabilities: [create-table, insert, select, update, transactions, lock-table, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#applevel-consistency"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, balance int4 NOT NULL);
  INSERT INTO acct VALUES (1, 100), (2, 200);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE acct IN SHARE MODE
    expect: ok
  - session: b
    sql: |
      SELECT count(*) AS n FROM acct
    expect: rows
    order: ordered
    comment: readers are not blocked by SHARE
  - session: b
    sql: |
      UPDATE acct SET balance = 1 WHERE id = 1
    async: true
    expect_blocked: true
    comment: writers wait for the SHARE lock to be released
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: ok
  - session: b
    sql: |
      SELECT id, balance FROM acct ORDER BY id
    expect: rows
    order: ordered
