# SELECT FOR UPDATE only blocks concurrent updates while held; after commit the blocked UPDATE proceeds.
id: doc-applevel-consistency.for-update-does-not-prevent-update
title: Blocked UPDATE proceeds after a SELECT FOR UPDATE holder commits without updating the row
family: doc-applevel-consistency
tier: core
feature_ids: [select-for-update, row-locks, read-committed]
required_capabilities: [create-table, insert, select, update, transactions, row-locks, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#applevel-consistency"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, balance int4 NOT NULL);
  INSERT INTO acct VALUES (1, 100), (2, 200);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      SELECT id, balance FROM acct WHERE id = 1 FOR UPDATE
    expect: rows
    order: ordered
  - session: b
    sql: |
      UPDATE acct SET balance = balance + 5 WHERE id = 1
    async: true
    expect_blocked: true
  - session: a
    sql: |
      COMMIT
    expect: ok
    comment: a did not update the row, so the waiter is not prevented from updating it
  - session: b
    wait: true
    expect: ok
  - session: b
    sql: |
      SELECT id, balance FROM acct ORDER BY id
    expect: rows
    order: ordered
