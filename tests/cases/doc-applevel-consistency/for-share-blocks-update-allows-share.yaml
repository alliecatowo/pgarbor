# SELECT FOR SHARE: another FOR SHARE is compatible, but an UPDATE of the locked row waits.
id: doc-applevel-consistency.for-share-blocks-update-allows-share
title: SELECT FOR SHARE allows other share lockers and blocks an UPDATE of the row
family: doc-applevel-consistency
tier: core
feature_ids: [select-for-share, row-locks, read-committed]
required_capabilities: [create-table, insert, select, update, transactions, row-locks, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#applevel-consistency"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, balance int4 NOT NULL);
  INSERT INTO acct VALUES (1, 100), (2, 200);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      SELECT id, balance FROM acct WHERE id = 1 FOR SHARE
    expect: rows
    order: ordered
  - session: b
    sql: |
      SELECT id, balance FROM acct WHERE id = 1 FOR SHARE
    expect: rows
    order: ordered
    comment: FOR SHARE locks are compatible with each other
  - session: b
    sql: |
      UPDATE acct SET balance = 9 WHERE id = 1
    async: true
    expect_blocked: true
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: ok
  - session: b
    sql: |
      SELECT id, balance FROM acct ORDER BY id
    expect: rows
    order: ordered
