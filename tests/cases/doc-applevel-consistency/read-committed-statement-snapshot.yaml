# READ COMMITTED takes a new snapshot per statement: the view shifts between statements in one transaction.
id: doc-applevel-consistency.read-committed-statement-snapshot
title: READ COMMITTED sees another session's commit between two statements of one transaction
family: doc-applevel-consistency
tier: core
feature_ids: [read-committed, mvcc-snapshot, transactions]
required_capabilities: [create-table, insert, select, update, transactions, isolation-levels, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#applevel-consistency"
sessions: [a, b]
setup: |
  CREATE TABLE acct (id int4 PRIMARY KEY, balance int4 NOT NULL);
  INSERT INTO acct VALUES (1, 100), (2, 200);
steps:
  - session: a
    sql: |
      BEGIN ISOLATION LEVEL READ COMMITTED
    expect: ok
  - session: a
    sql: |
      SELECT balance FROM acct WHERE id = 1
    expect: rows
    order: ordered
  - session: b
    sql: |
      UPDATE acct SET balance = 300 WHERE id = 1
    expect: ok
  - session: a
    sql: |
      SELECT balance FROM acct WHERE id = 1
    expect: rows
    order: ordered
    comment: the second statement gets a fresh snapshot and sees the committed 300
  - session: a
    sql: |
      COMMIT
    expect: ok
