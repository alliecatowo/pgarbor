# uuid to text yields lowercase hyphenated canonical form for any accepted input spelling.
id: uuid.text-cast-canonical
title: uuid casts to text in lowercase hyphenated form regardless of input spelling
family: uuid
tier: core
feature_ids: [uuid, uuid-output, casts]
required_capabilities: [select, casts]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
steps:
  - sql: |
      SELECT 'A0EEBC99-9C0B-4EF8-BB6D-6BB9BD380A11'::uuid::text AS upper_hyphen,
             'a0eebc999c0b4ef8bb6d6bb9bd380a11'::uuid::text AS compact,
             '{A0EEBC99-9C0B-4EF8-BB6D-6BB9BD380A11}'::uuid::text AS braced
    expect: rows
  - sql: |
      SELECT length(x::text) AS len, x::text = 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11' AS same
      FROM (SELECT 'A0EEBC99-9C0B-4EF8-BB6D-6BB9BD380A11'::uuid AS x) s
    expect: rows
  - sql: |
      SELECT (NULL::uuid)::text IS NULL AS null_stays_null
    expect: rows
