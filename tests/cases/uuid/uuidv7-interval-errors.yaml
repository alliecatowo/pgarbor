# uuidv7 with an interval argument rejects infinite, pre-epoch and out-of-range shifts.
id: uuid.uuidv7-interval-errors
title: uuidv7 rejects infinite, pre-Unix-epoch and beyond-48-bit interval shifts
family: uuid
tier: extended
feature_ids: [uuid, uuidv7, errors, intervals]
required_capabilities: [select, errors, intervals]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
steps:
  - sql: |
      SELECT uuidv7('infinity'::interval)
    expect: error
    sqlstate: "22008"
    comment: infinite interval is rejected with datetime_field_overflow (22008) on PG 18.6
  - sql: |
      SELECT uuidv7('-infinity'::interval)
    expect: error
    sqlstate: "22008"
    comment: negative infinite interval is rejected with 22008 on PG 18.6
  - sql: |
      SELECT uuidv7('-1000 years'::interval)
    expect: error
    comment: timestamp before the Unix epoch is rejected; sqlstate not asserted
  - sql: |
      SELECT uuidv7('9000 years'::interval)
    expect: error
    comment: beyond the 48-bit millisecond field; sqlstate not asserted
  - sql: |
      SELECT uuid_extract_version(uuidv7(INTERVAL '1 day')) AS v
    expect: rows
