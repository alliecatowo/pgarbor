# uuidv7 values generated in one statement sort in generation order.
id: uuid.uuidv7-sortable
title: uuidv7 values generated in sequence sort in insertion order and carry version 7
family: uuid
tier: extended
feature_ids: [uuid, uuid-generation, uuidv7, ordering, aggregates]
required_capabilities: [create-table, insert, select, aggregates, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE guid3 (id int4 PRIMARY KEY, guid_field uuid NOT NULL);
steps:
  - sql: |
      INSERT INTO guid3 (id, guid_field) SELECT i, uuidv7() FROM generate_series(1, 10) AS i
    expect: ok
  - sql: |
      SELECT array_agg(id ORDER BY guid_field) FROM guid3
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FILTER (WHERE uuid_extract_version(guid_field) = 7), count(DISTINCT guid_field) FROM guid3
    expect: rows
