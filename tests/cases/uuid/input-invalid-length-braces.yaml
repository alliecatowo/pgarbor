# uuid input rejects overlong, overshort and unbalanced-brace literals with 22P02; nothing is stored.
id: uuid.input-invalid-length-braces
title: Reject too-long, too-short and unbalanced-brace uuid literals with invalid_text_representation
family: uuid
tier: core
feature_ids: [uuid, uuid-input, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE guid1 (guid_field uuid);
steps:
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('11111111-1111-1111-1111-111111111111F')
    expect: error
    sqlstate: "22P02"
    comment: too long
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('{11111111-1111-1111-1111-11111111111}')
    expect: error
    sqlstate: "22P02"
    comment: too short inside braces
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('{22222222-2222-2222-2222-222222222222 ')
    expect: error
    sqlstate: "22P02"
    comment: opening brace without closing brace
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('')
    expect: error
    sqlstate: "22P02"
    comment: empty string is not a uuid
  - sql: |
      SELECT count(*) FROM guid1
    expect: rows
