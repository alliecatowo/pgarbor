# ORDER BY on a uuid column: byte-wise ordering, and NULL placement under ASC and DESC.
id: uuid.order-by-nulls
title: ORDER BY uuid with NULLs under default, explicit NULLS FIRST and DESC orderings
family: uuid
tier: core
feature_ids: [uuid, uuid-ordering, order-by, nulls]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE o (id int4 PRIMARY KEY, g uuid);
  INSERT INTO o VALUES (1, '44444444-4444-4444-4444-444444444444'), (2, NULL), (3, '11111111-1111-1111-1111-111111111111'), (4, NULL), (5, '22222222-2222-2222-2222-222222222222');
steps:
  - sql: |
      SELECT id FROM o ORDER BY g ASC, id ASC
    expect: rows
    order: ordered
    comment: default ASC puts NULLs last
  - sql: |
      SELECT id FROM o ORDER BY g DESC, id ASC
    expect: rows
    order: ordered
    comment: default DESC puts NULLs first
  - sql: |
      SELECT id FROM o ORDER BY g ASC NULLS FIRST, id ASC
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM o ORDER BY g DESC NULLS LAST, id ASC
    expect: rows
    order: ordered
  - sql: |
      SELECT g::text FROM o ORDER BY g LIMIT 2
    expect: rows
    order: ordered
