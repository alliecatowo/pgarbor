# btree, hash and unique btree indexes on a uuid column; catalog visibility and unique enforcement.
id: uuid.index-btree-hash-unique
title: Create btree, hash and unique indexes on uuid and enforce uniqueness through them
family: uuid
tier: core
feature_ids: [uuid, indexes, btree, hash-index, unique, catalog-introspection]
required_capabilities: [create-table, insert, select, indexes, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE ix (g uuid);
  INSERT INTO ix VALUES ('11111111-1111-1111-1111-111111111111'), ('{22222222-2222-2222-2222-222222222222}'), ('3f3e3c3b3a3039383736353433a2313e');
steps:
  - sql: |
      CREATE INDEX ix_btree ON ix USING btree (g)
    expect: ok
  - sql: |
      CREATE INDEX ix_hash ON ix USING hash (g)
    expect: ok
  - sql: |
      CREATE UNIQUE INDEX ix_uniq ON ix USING btree (g)
    expect: ok
    comment: values are distinct, so the unique index builds
  - sql: |
      SELECT count(*) FROM pg_class WHERE relkind = 'i' AND relname LIKE 'ix%'
    expect: rows
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'ix' ORDER BY indexname
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO ix VALUES ('3F3E3C3B-3A30-3938-3736-353433A2313E')
    expect: error
    sqlstate: "23505"
    comment: uppercase spelling of an existing value violates the unique index
  - sql: |
      SELECT count(*) FROM ix WHERE g = '3f3e3c3b-3a30-3938-3736-353433a2313e'
    expect: rows
