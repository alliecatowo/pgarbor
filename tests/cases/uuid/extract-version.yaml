# uuid_extract_version over RFC-style version nibbles, non-RFC values, and NULL input.
id: uuid.extract-version
title: uuid_extract_version reads the version nibble and returns NULL for non-RFC values
family: uuid
tier: core
feature_ids: [uuid, uuid-functions, uuid-version]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
steps:
  - sql: |
      SELECT uuid_extract_version('11111111-1111-5111-8111-111111111111') AS v5
    expect: rows
  - sql: |
      SELECT uuid_extract_version('3f3e3c3b-3a30-4938-8736-353433a2313e') AS v4
    expect: rows
  - sql: |
      SELECT uuid_extract_version('C232AB00-9414-11EC-B3C8-9F6BDECED846') AS v1
    expect: rows
  - sql: |
      SELECT uuid_extract_version('017F22E2-79B0-7CC3-98C4-DC0C0C07398F') AS v7
    expect: rows
  - sql: |
      SELECT uuid_extract_version('11111111-1111-1111-1111-111111111111') AS non_rfc
    expect: rows
    comment: variant bits are not RFC, so the result is NULL
  - sql: |
      SELECT uuid_extract_version(NULL::uuid) AS null_in
    expect: rows
