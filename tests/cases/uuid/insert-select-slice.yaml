# Basic uuid column round trip: three input formats, canonical output, reconnect.
id: uuid.insert-select-slice
title: Insert uuid values in three input formats and read them back canonically
family: uuid
tier: slice
feature_ids: [uuid, uuid-input, uuid-output, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE guid1 (id int4 PRIMARY KEY, guid_field uuid);
steps:
  - sql: |
      INSERT INTO guid1 VALUES (1, '11111111-1111-1111-1111-111111111111'), (2, '{22222222-2222-2222-2222-222222222222}'), (3, '3f3e3c3b3a3039383736353433a2313e')
    expect: ok
  - sql: |
      SELECT id, guid_field FROM guid1 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT guid_field::text FROM guid1
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM guid1 WHERE guid_field = '3f3e3c3b-3a30-3938-3736-353433a2313e'
    expect: rows
  - reconnect: true
  - sql: |
      SELECT id, guid_field FROM guid1 ORDER BY id
    expect: rows
    order: ordered
