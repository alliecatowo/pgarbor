# Equality and ordering operators on uuid, including min/max via ORDER BY, over mixed input spellings.
id: uuid.comparison-operators
title: uuid equality and ordering operators select the expected row counts
family: uuid
tier: core
feature_ids: [uuid, comparison-operators, aggregates]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE guid1 (guid_field uuid);
  INSERT INTO guid1 VALUES ('11111111-1111-1111-1111-111111111111'), ('{22222222-2222-2222-2222-222222222222}'), ('3f3e3c3b3a3039383736353433a2313e'), ('44444444-4444-4444-4444-444444444444');
steps:
  - sql: |
      SELECT
        count(*) FILTER (WHERE guid_field = '3f3e3c3b-3a30-3938-3736-353433a2313e') AS eq,
        count(*) FILTER (WHERE guid_field <> '11111111111111111111111111111111') AS ne,
        count(*) FILTER (WHERE guid_field < '22222222-2222-2222-2222-222222222222') AS lt,
        count(*) FILTER (WHERE guid_field <= '22222222-2222-2222-2222-222222222222') AS le,
        count(*) FILTER (WHERE guid_field > '22222222-2222-2222-2222-222222222222') AS gt,
        count(*) FILTER (WHERE guid_field >= '22222222-2222-2222-2222-222222222222') AS ge
      FROM guid1
    expect: rows
  - sql: |
      SELECT
        (SELECT guid_field::text FROM guid1 ORDER BY guid_field ASC LIMIT 1) AS min_guid,
        (SELECT guid_field::text FROM guid1 ORDER BY guid_field DESC LIMIT 1) AS max_guid
    expect: rows
    comment: PG 18.6 has no min/max aggregate for uuid; extremes come from the ordering operators
  - sql: |
      SELECT guid_field::text FROM guid1 WHERE guid_field BETWEEN '22222222-2222-2222-2222-222222222222' AND '3f3e3c3b-3a30-3938-3736-353433a2313e' ORDER BY guid_field
    expect: rows
    order: ordered
