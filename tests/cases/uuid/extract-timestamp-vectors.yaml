# uuid_extract_timestamp on RFC 9562 v1 and v7 test vectors, and NULL results for untimed UUIDs.
id: uuid.extract-timestamp-vectors
title: uuid_extract_timestamp decodes RFC 9562 v1 and v7 vectors and returns NULL otherwise
family: uuid
tier: extended
feature_ids: [uuid, uuid-functions, uuid-timestamp, timestamptz]
required_capabilities: [select, timestamptz]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
steps:
  - sql: |
      SELECT uuid_extract_timestamp('C232AB00-9414-11EC-B3C8-9F6BDECED846') = '2022-02-22 14:22:22+05:00'::timestamptz AS v1_match
    expect: rows
    comment: RFC 9562 test vector for v1
  - sql: |
      SELECT uuid_extract_timestamp('017F22E2-79B0-7CC3-98C4-DC0C0C07398F') = '2022-02-22 14:22:22+05:00'::timestamptz AS v7_match
    expect: rows
    comment: RFC 9562 test vector for v7
  - sql: |
      SELECT uuid_extract_timestamp('11111111-1111-1111-1111-111111111111') IS NULL AS non_time_null
    expect: rows
  - sql: |
      SELECT uuid_extract_timestamp(gen_random_uuid()) IS NULL AS v4_null
    expect: rows
    comment: only a boolean is compared, so the random value is never output
  - sql: |
      SELECT uuid_extract_timestamp(NULL::uuid) IS NULL AS null_in
    expect: rows
