# Non-throwing input validation API: pg_input_is_valid and pg_input_error_info.
id: uuid.input-validity-api
title: pg_input_is_valid and pg_input_error_info report uuid input errors without raising
family: uuid
tier: extended
feature_ids: [uuid, uuid-input, input-validity-functions, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
steps:
  - sql: |
      SELECT pg_input_is_valid('11', 'uuid')
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('11111111-1111-1111-1111-111111111111', 'uuid')
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('{11111111-1111-1111-1111-111111111111}', 'uuid')
    expect: rows
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('11', 'uuid')
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('11111111-1111-1111-G111-111111111111', 'uuid')
    expect: rows
