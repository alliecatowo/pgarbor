# uuid bind parameters and results in binary format over the extended protocol, plus a NULL parameter.
id: uuid.extended-binary-param
title: uuid bound and returned in binary format through extended-protocol statements
family: uuid
tier: extended
feature_ids: [uuid, extended-protocol, binary-format, exec-params]
required_capabilities: [create-table, insert, select, extended-protocol]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE b (id int4, guid_field uuid);
steps:
  - exec_params:
      sql: |
        INSERT INTO b VALUES ($1, $2)
      params: ["1", "a0eebc999c0b4ef8bb6d6bb9bd380a11"]
      param_types: [23, 2950]
      param_formats: [text, binary]
    expect: ok
  - exec_params:
      sql: |
        SELECT id, guid_field FROM b WHERE guid_field = $1
      params: ["a0eebc999c0b4ef8bb6d6bb9bd380a11"]
      param_types: [2950]
      param_formats: [binary]
      result_format: binary
    expect: rows
  - exec_params:
      sql: |
        SELECT count(*) FROM b WHERE guid_field = $1
      params: [null]
      param_types: [2950]
    expect: rows
    comment: NULL bound parameter matches nothing
