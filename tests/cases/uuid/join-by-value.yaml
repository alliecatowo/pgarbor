# Joins and semi/anti joins on uuid keys across different input spellings, with NULL keys present.
id: uuid.join-by-value
title: Inner, left anti and IN-subquery joins match uuid keys by value
family: uuid
tier: core
feature_ids: [uuid, joins, subqueries, nulls]
required_capabilities: [create-table, insert, select, joins, subqueries]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE j1 (g uuid, v text);
  CREATE TABLE j2 (g uuid, w text);
  INSERT INTO j1 VALUES ('11111111-1111-1111-1111-111111111111', 'a'), ('{22222222-2222-2222-2222-222222222222}', 'b'), ('3f3e3c3b3a3039383736353433a2313e', 'c'), (NULL, 'd');
  INSERT INTO j2 VALUES ('11111111-1111-1111-1111-111111111111', 'x'), ('22222222-2222-2222-2222-222222222222', 'y'), (NULL, 'z');
steps:
  - sql: |
      SELECT j1.v, j2.w FROM j1 INNER JOIN j2 ON j1.g = j2.g ORDER BY j1.v
    expect: rows
    order: ordered
    comment: NULL keys never join
  - sql: |
      SELECT count(*) FROM j1 LEFT JOIN j2 ON j1.g = j2.g WHERE j2.g IS NULL
    expect: rows
  - sql: |
      SELECT v FROM j1 WHERE g IN (SELECT g FROM j2) ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v FROM j1 WHERE NOT EXISTS (SELECT 1 FROM j2 WHERE j2.g = j1.g) ORDER BY v
    expect: rows
    order: ordered
