# uuid input rejects bad hyphen grouping, non-hex digits and stray characters with 22P02.
id: uuid.input-invalid-format
title: Reject uuid literals with bad hyphen groups, non-hex digits or stray characters
family: uuid
tier: core
feature_ids: [uuid, uuid-input, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/uuid.sql"
setup: |
  CREATE TABLE guid1 (guid_field uuid);
steps:
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('111-11111-1111-1111-1111-111111111111')
    expect: error
    sqlstate: "22P02"
    comment: hyphens in wrong groups
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('11111111-1111-1111-G111-111111111111')
    expect: error
    sqlstate: "22P02"
    comment: non-hex digit G
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('11+11111-1111-1111-1111-111111111111')
    expect: error
    sqlstate: "22P02"
    comment: stray plus sign
  - sql: |
      INSERT INTO guid1(guid_field) VALUES ('11111111-1111-1111-1111-11111111111g')
    expect: error
    sqlstate: "22P02"
    comment: non-hex digit at the end
  - sql: |
      SELECT count(*) FROM guid1
    expect: rows
