# DROP and COMMENT on nonexistent operators: IF EXISTS gives a notice, plain forms give undefined_function.
id: create-operator.drop-missing-operator
title: DROP OPERATOR IF EXISTS notices on missing operator, plain DROP and COMMENT error
family: create-operator
tier: core
feature_ids: [drop-operator, comment-on, errors, notices]
required_capabilities: [create-operator, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_operator.sql (DROP and COMMENT on nonexistent operators)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      COMMENT ON OPERATOR ###### (int4, int8) IS 'bad infix'
    expect: error
    sqlstate: "42883"
  - sql: |
      DROP OPERATOR ###### (int4, int8)
    expect: error
    sqlstate: "42883"
  - sql: |
      DROP OPERATOR IF EXISTS ###### (int4, int8)
    expect: notice
    comment: NOTICE that the operator is skipped
  - sql: |
      DROP OPERATOR ###### (int4, NONE)
    expect: error
    comment: postfix form is not supported
