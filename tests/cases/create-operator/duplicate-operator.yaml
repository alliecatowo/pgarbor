# Creating the same operator signature twice fails with duplicate_function.
id: create-operator.duplicate-operator
title: Second CREATE OPERATOR with the same signature fails as already existing
family: create-operator
tier: core
feature_ids: [create-operator, errors]
required_capabilities: [create-function, create-operator, errors]
provenance:
  source: hand
  ref: "pgarbor source pg_operator.c: operator already exists (ERRCODE_DUPLICATE_FUNCTION)"
sessions: [a]
setup: |
  CREATE FUNCTION dbl(int8) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT $1 * 2 $$;
steps:
  - sql: |
      CREATE OPERATOR #@@# (rightarg = int8, procedure = dbl)
    expect: ok
  - sql: |
      CREATE OPERATOR #@@# (rightarg = int8, procedure = dbl)
    expect: error
    sqlstate: "42723"
  - sql: |
      SELECT #@@# 7 AS doubled
    expect: rows
