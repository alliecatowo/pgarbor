# An unrecognized CREATE OPERATOR attribute is a warning, not an error; the operator is still created.
id: create-operator.unknown-attribute-notice
title: Unknown CREATE OPERATOR attribute only warns and the operator is created
family: create-operator
tier: extended
feature_ids: [create-operator, notices]
required_capabilities: [create-function, create-operator, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_operator.sql (invalid_att case)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE FUNCTION dbl(int8) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT $1 * 2 $$;
steps:
  - sql: |
      CREATE OPERATOR #@%# (rightarg = int8, procedure = dbl, invalid_att = int8)
    expect: notice
    comment: operatorcmds.c emits WARNING operator attribute not recognized
  - sql: |
      SELECT #@%# 4 AS doubled
    expect: rows
