# Postfix operators are no longer supported: a CREATE with only leftarg fails.
id: create-operator.postfix-rejected
title: CREATE OPERATOR with only leftarg is rejected as unsupported postfix
family: create-operator
tier: core
feature_ids: [create-operator, postfix-operators, errors]
required_capabilities: [create-function, create-operator, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_operator.sql (leftarg = int8 postfix case)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE FUNCTION dbl(int8) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT $1 * 2 $$;
steps:
  - sql: |
      CREATE OPERATOR #%# (leftarg = int8, procedure = dbl)
    expect: error
    sqlstate: "42P13"
    comment: operatorcmds.c line 184, postfix operators are not supported
  - sql: |
      SELECT 1 AS still_fine
    expect: rows
