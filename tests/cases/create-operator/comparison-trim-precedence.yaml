# Comparison operators followed by minus or comments are split correctly, and BETWEEN binds above <> / <= / >=.
id: create-operator.comparison-trim-precedence
title: Comparison operator tokens followed by minus or comments keep correct precedence
family: create-operator
tier: extended
feature_ids: [create-operator, lexer, operator-precedence, between]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_operator.sql (<>-, <=-, >=- precedence cases)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT true<>-1 BETWEEN 1 AND 1 AS a,
             false<>/**/1 BETWEEN 1 AND 1 AS b,
             false<=-1 BETWEEN 1 AND 1 AS c,
             false>=-1 BETWEEN 1 AND 1 AS d
    expect: rows
    order: multiset
  - sql: |
      SELECT 2<=/**/3 AS a, 3>=/**/2 AS b, 2<>/**/3 AS c, 3<=/**/2 AS d, 2>=/**/3 AS e, 2<>/**/2 AS f
    expect: rows
    order: multiset
