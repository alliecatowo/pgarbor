# Prefix operator bound to a SQL function; covers call, NULL input, negative input, and a table column.
id: create-operator.prefix-basic
title: Prefix operator with rightarg calls its procedure, NULL in gives NULL out
family: create-operator
tier: core
feature_ids: [create-operator, prefix-operators, sql-functions]
required_capabilities: [create-function, create-operator, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_operator.sql (CREATE OPERATOR @#@ prefix case)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE FUNCTION dbl(int8) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT $1 * 2 $$;
  CREATE OPERATOR @# (rightarg = int8, procedure = dbl);
steps:
  - sql: |
      SELECT @# 24 AS doubled
    expect: rows
  - sql: |
      SELECT @# -5 AS doubled_negative, @# NULL::int8 AS doubled_null
    expect: rows
  - sql: |
      SELECT v, @# v AS d FROM (VALUES (1), (NULL), (3)) AS s(v) ORDER BY v NULLS LAST
    expect: rows
    order: ordered
