# CREATE OPERATOR naming a procedure that does not exist fails and creates nothing.
id: create-operator.undefined-procedure
title: CREATE OPERATOR with a missing procedure fails with undefined_function
family: create-operator
tier: core
feature_ids: [create-operator, errors]
required_capabilities: [create-operator, errors, select]
provenance:
  source: hand
  ref: "PG18 docs: CREATE OPERATOR procedure; SQLSTATE 42883"
sessions: [a]
steps:
  - sql: |
      CREATE OPERATOR ##@ (rightarg = int8, procedure = pga_no_such_fn)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT ##@ 1
    expect: error
    sqlstate: "42883"
