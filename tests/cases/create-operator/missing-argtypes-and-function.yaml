# Mandatory CREATE OPERATOR clauses: argument types and procedure.
id: create-operator.missing-argtypes-and-function
title: CREATE OPERATOR without argument types or without procedure is rejected
family: create-operator
tier: core
feature_ids: [create-operator, errors]
required_capabilities: [create-function, create-operator, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_operator.sql (missing rightarg / procedure cases)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE FUNCTION dbl(int8) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT $1 * 2 $$;
steps:
  - sql: |
      CREATE OPERATOR #@%# (procedure = dbl)
    expect: error
    sqlstate: "42P13"
    comment: operator argument types must be specified
  - sql: |
      CREATE OPERATOR #@%# (rightarg = int8)
    expect: error
    sqlstate: "42P13"
    comment: operator function must be specified
  - sql: |
      SELECT #@%# 1
    expect: error
    sqlstate: "42883"
    comment: the failed CREATEs must leave no operator behind
