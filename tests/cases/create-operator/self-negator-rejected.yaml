# An operator cannot be its own negator; the failed CREATE leaves no operator behind.
id: create-operator.self-negator-rejected
title: Operator naming itself as negator is rejected and not created
family: create-operator
tier: core
feature_ids: [create-operator, errors]
required_capabilities: [create-operator, errors, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_operator.sql (negator = self case)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE OPERATOR === (leftarg = integer, rightarg = integer, procedure = int4eq, negator = ===)
    expect: error
    sqlstate: "42P13"
    comment: operatorcmds.c line 632
  - sql: |
      SELECT 1 === 1
    expect: error
    sqlstate: "42883"
