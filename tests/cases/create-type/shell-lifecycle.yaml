# Shell type create/drop: duplicate and missing-type errors; no implicit shell for old-style CREATE TYPE.
id: create-type.shell-lifecycle
title: "Shell type create and drop: duplicate and missing-type errors"
family: create-type
tier: core
feature_ids: [create-type, shell-type, drop-type, errors]
required_capabilities: [create-type, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (shell create/drop section, rewritten)"
steps:
  - sql: |
      CREATE TYPE shell
    expect: ok
  - sql: |
      CREATE TYPE shell
    expect: error
    sqlstate: "42710"
    comment: type already exists
  - sql: |
      DROP TYPE shell
    expect: ok
  - sql: |
      DROP TYPE shell
    expect: error
    sqlstate: "42704"
    comment: type does not exist
  - sql: |
      CREATE TYPE bogus_type (INPUT = array_in, OUTPUT = array_out, ELEMENT = int, INTERNALLENGTH = 32)
    expect: error
    sqlstate: "42704"
    comment: CREATE TYPE no longer creates a shell implicitly; the named type must already exist
