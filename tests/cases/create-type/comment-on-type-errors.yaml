# COMMENT ON TYPE and COMMENT ON COLUMN for a composite type: missing object, missing column, set and clear.
id: create-type.comment-on-type-errors
title: "COMMENT ON type and composite column: missing object and missing column errors"
family: create-type
tier: core
feature_ids: [create-type, comments, catalog-introspection, errors]
required_capabilities: [create-type, comments, catalog-introspection, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (COMMENT ON type/column section, rewritten)"
setup: |
  CREATE TYPE pc AS (f1 int4);
steps:
  - sql: |
      COMMENT ON TYPE bad IS 'bad comment'
    expect: error
    sqlstate: "42704"
  - sql: |
      COMMENT ON TYPE pc IS 'good comment'
    expect: ok
  - sql: |
      SELECT obj_description('pc'::regtype, 'pg_type') AS c
    expect: rows
  - sql: |
      COMMENT ON COLUMN pc.nope IS 'bad comment'
    expect: error
    sqlstate: "42703"
  - sql: |
      COMMENT ON COLUMN pc.f1 IS 'column comment'
    expect: ok
  - sql: |
      COMMENT ON TYPE pc IS NULL
    expect: ok
  - sql: |
      SELECT obj_description('pc'::regtype, 'pg_type') IS NULL AS cleared
    expect: rows
