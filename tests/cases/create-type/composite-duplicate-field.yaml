# Composite definition errors: duplicate field names and an existing type name.
id: create-type.composite-duplicate-field
title: "Composite type definition rejects duplicate field names and existing names"
family: create-type
tier: core
feature_ids: [create-type, composite-types, errors]
required_capabilities: [create-type, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (CREATE TYPE ... AS composite error paths, rewritten)"
steps:
  - sql: |
      CREATE TYPE dup_fields AS (a int4, a text)
    expect: error
    sqlstate: "42701"
    comment: column specified more than once
  - sql: |
      CREATE TYPE dup_fields AS (a int4, b text)
    expect: ok
  - sql: |
      CREATE TYPE dup_fields AS (x int4)
    expect: error
    sqlstate: "42710"
    comment: type name already in use
