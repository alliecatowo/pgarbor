# format_type() with typmod values: positive typmod, NULL typmod, NULL type OID.
id: create-type.format-type-builtins
title: "format_type with typmod, NULL typmod and NULL type OID"
family: create-type
tier: extended
feature_ids: [create-type, catalog-introspection, regtype, select]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (format_type checks, rewritten)"
steps:
  - sql: |
      SELECT format_type('varchar'::regtype, 42) AS v42, format_type('int4'::regtype, NULL) AS i4_null_typmod
    expect: rows
  - sql: |
      SELECT format_type('bpchar'::regtype, -1) AS bp_neg
    expect: rows
    comment: typmod -1 means no modifier
  - sql: |
      SELECT format_type(NULL::oid, NULL) IS NULL AS null_oid
    expect: rows
