# SQL function returning SETOF a composite type; rows read via FROM, field access and ROW() construction.
id: create-type.composite-set-returning
title: "SETOF composite result from a SQL function"
family: create-type
tier: core
feature_ids: [create-type, composite-types, create-function, select]
required_capabilities: [create-type, create-table, insert, select, create-function]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (get_default_test SETOF composite, rewritten)"
setup: |
  CREATE TYPE row2 AS (f1 text, f2 int4);
  CREATE TABLE dt (f1 text, f2 int4);
  INSERT INTO dt VALUES ('b', NULL), ('a', 7);
  CREATE FUNCTION get_rows() RETURNS SETOF row2 AS 'SELECT * FROM dt' LANGUAGE sql;
steps:
  - sql: |
      SELECT r.f1, r.f2 FROM get_rows() AS r ORDER BY r.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT ROW(f1, f2)::row2::text AS rec FROM dt ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM get_rows() AS r WHERE r.f2 IS NULL
    expect: rows
