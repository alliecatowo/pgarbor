# NULL semantics of composite values: IS NULL requires every field NULL; IS DISTINCT FROM and equality on rows.
id: create-type.composite-null-semantics
title: "Composite IS NULL, IS DISTINCT FROM and equality on row values"
family: create-type
tier: core
feature_ids: [create-type, composite-types, null-semantics, select]
required_capabilities: [create-type, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (composite NULL handling, rewritten)"
setup: |
  CREATE TYPE pair AS (a int4, b text);
steps:
  - sql: |
      SELECT (NULL::pair) IS NULL AS a_null,
             ROW(NULL, NULL)::pair IS NULL AS all_fields_null,
             ROW(NULL, NULL)::pair IS NOT NULL AS not_null_row,
             ROW(1, NULL)::pair IS NULL AS partial_null
    expect: rows
    comment: IS NULL on a composite is true only when every field is NULL
  - sql: |
      SELECT ROW(NULL, NULL)::pair IS DISTINCT FROM NULL::pair AS distinct_from_null,
             ROW(1, 'x')::pair = ROW(1, 'x')::pair AS eq_same,
             ROW(1, 'x')::pair = ROW(1, 'y')::pair AS eq_diff
    expect: rows
