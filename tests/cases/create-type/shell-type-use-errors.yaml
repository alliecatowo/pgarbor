# A shell type cannot be used as a column type or altered; it can still be dropped.
id: create-type.shell-type-use-errors
title: "Shell type rejected as a column type and by ALTER TYPE"
family: create-type
tier: core
feature_ids: [create-type, shell-type, create-table, alter-type, errors]
required_capabilities: [create-type, create-table, alter-type, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (only-a-shell errors, rewritten)"
steps:
  - sql: |
      CREATE TYPE shellonly
    expect: ok
  - sql: |
      CREATE TABLE tshell (c shellonly)
    expect: error
    sqlstate: "42809"
    comment: type is only a shell
  - sql: |
      ALTER TYPE shellonly SET (storage = extended)
    expect: error
    sqlstate: "42809"
    comment: shell has no properties to alter yet
  - sql: |
      DROP TYPE shellonly
    expect: ok
