# Arrays of composite values: element NULLs, btree ordering of composites, array length.
id: create-type.composite-in-array
title: "Arrays of composite values: ordering and NULL elements"
family: create-type
tier: core
feature_ids: [create-type, composite-types, arrays, select, null-semantics]
required_capabilities: [create-type, select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_type.sql (composite arrays, rewritten)"
setup: |
  CREATE TYPE pair AS (a int4, b int4);
steps:
  - sql: |
      SELECT x::text AS txt, x IS NULL AS x_null
      FROM unnest(ARRAY[ROW(3, NULL)::pair, ROW(1, 2)::pair, NULL::pair]) AS x
      ORDER BY x
    expect: rows
    order: ordered
    comment: composites order by field values; the NULL element sorts last
  - sql: |
      SELECT array_length(ARRAY[ROW(1, 2)::pair, NULL::pair], 1) AS n
    expect: rows
