# Documented example: after SET SESSION AUTHORIZATION 'name', both session_user and current_user report that role.
id: cmd-set-session-auth.doc-example-literal-name
title: Documented example with a string literal SET SESSION AUTHORIZATION makes session_user and current_user the named role
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, session-user, current-user]
required_capabilities: [roles, session-authorization, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#examples"
sessions: [a]
notes: The documented peter/paul example is renamed to sa_doc_paul. The initial session user is compared, never printed, because it is cluster-specific.
steps:
  - sql: |
      CREATE ROLE sa_doc_paul
    expect: ok
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS same_before
    expect: rows
    order: ordered
  - sql: |
      SET SESSION AUTHORIZATION 'sa_doc_paul'
    expect: ok
  - sql: |
      SELECT SESSION_USER, CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      DROP ROLE sa_doc_paul
    expect: ok
