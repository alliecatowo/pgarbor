# The target role need not have LOGIN; SET SESSION AUTHORIZATION only changes identifiers and does not authenticate.
id: cmd-set-session-auth.nologin-role-accepted
title: A NOLOGIN role can be the session user after SET SESSION AUTHORIZATION
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, role-attributes, nologin]
required_capabilities: [roles, session-authorization, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#description (the user name identifies a role; no authentication happens)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE sa_nologin_user NOLOGIN
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION 'sa_nologin_user'
    expect: ok
  - sql: |
      SELECT SESSION_USER, CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname = 'sa_nologin_user'
    expect: rows
    order: ordered
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      DROP ROLE sa_nologin_user
    expect: ok
