# DEFAULT and RESET both restore the authenticated user, and either form works from any state, including when already default.
id: cmd-set-session-auth.reset-and-default-forms
title: SET SESSION AUTHORIZATION DEFAULT and RESET SESSION AUTHORIZATION both restore the authenticated user and are idempotent
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, reset-session-authorization, default-keyword]
required_capabilities: [roles, session-authorization, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#description (DEFAULT and RESET forms)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE sa_rd_user
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION DEFAULT
    expect: ok
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS same_after_default_noop
    expect: rows
    order: ordered
  - sql: |
      SET SESSION AUTHORIZATION 'sa_rd_user'
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION DEFAULT
    expect: ok
  - sql: |
      SELECT SESSION_USER <> 'sa_rd_user' AS not_switched, SESSION_USER = CURRENT_USER AS same
    expect: rows
    order: ordered
  - sql: |
      SET SESSION AUTHORIZATION 'sa_rd_user'
    expect: ok
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      SELECT SESSION_USER <> 'sa_rd_user' AS not_switched, SESSION_USER = CURRENT_USER AS same
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE sa_rd_user
    expect: ok
