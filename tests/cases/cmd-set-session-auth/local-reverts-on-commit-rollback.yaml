# SET LOCAL lasts only until the end of the transaction block, whether it commits or rolls back.
id: cmd-set-session-auth.local-reverts-on-commit-rollback
title: SET LOCAL SESSION AUTHORIZATION is reverted at COMMIT and at ROLLBACK
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, local-modifier, transactions, rollback]
required_capabilities: [roles, session-authorization, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#description (LOCAL acts the same as SET)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE sa_loc_user
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL SESSION AUTHORIZATION 'sa_loc_user'
    expect: ok
  - sql: |
      SELECT SESSION_USER, CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS reverted_at_commit
    expect: rows
    order: ordered
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL SESSION AUTHORIZATION 'sa_loc_user'
    expect: ok
  - sql: |
      SELECT CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS reverted_at_rollback
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE sa_loc_user
    expect: ok
