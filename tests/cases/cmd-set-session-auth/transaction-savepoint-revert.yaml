# A session-level SET SESSION AUTHORIZATION is transactional: ROLLBACK and ROLLBACK TO SAVEPOINT undo it.
id: cmd-set-session-auth.transaction-savepoint-revert
title: Session-level SET SESSION AUTHORIZATION is undone by ROLLBACK and by ROLLBACK TO SAVEPOINT
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, rollback, savepoints, transactions]
required_capabilities: [roles, session-authorization, savepoints, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#description (SESSION and LOCAL act the same as SET)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE sa_tx_a
    expect: ok
  - sql: |
      CREATE ROLE sa_tx_b
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION 'sa_tx_a'
    expect: ok
  - sql: |
      SAVEPOINT s1
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION 'sa_tx_b'
    expect: ok
  - sql: |
      SELECT CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK TO SAVEPOINT s1
    expect: ok
  - sql: |
      SELECT CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS reverted_by_rollback
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE sa_tx_a
    expect: ok
  - sql: |
      DROP ROLE sa_tx_b
    expect: ok
