# Inside a failed transaction block, SET SESSION AUTHORIZATION is rejected with 25P02 and ROLLBACK clears the failure.
id: cmd-set-session-auth.aborted-transaction-25p02
title: SET SESSION AUTHORIZATION inside an aborted transaction block fails with 25P02 until ROLLBACK
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, aborted-transaction, transactions, errors]
required_capabilities: [roles, session-authorization, transactions, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#description (command is a regular SET in a transaction block)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE sa_abort_user
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SET SESSION AUTHORIZATION 'sa_abort_user'
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS unchanged
    expect: rows
    order: ordered
  - sql: |
      SET SESSION AUTHORIZATION 'sa_abort_user'
    expect: ok
  - sql: |
      SELECT SESSION_USER, CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      DROP ROLE sa_abort_user
    expect: ok
