# A user name that does not exist is rejected and leaves the session user unchanged.
id: cmd-set-session-auth.unknown-role-error
title: SET SESSION AUTHORIZATION to a nonexistent role fails with 22023 and leaves the session unchanged
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, errors, unknown-role]
required_capabilities: [session-authorization, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#description"
sessions: [a]
steps:
  - sql: |
      SET SESSION AUTHORIZATION 'sa_nosuch_role'
    expect: error
    sqlstate: "22023"
    comment: the role check runs in the GUC check hook and reports invalid_parameter_value
  - sql: |
      SET SESSION AUTHORIZATION sa_nosuch_role
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS unchanged
    expect: rows
    order: ordered
