# The user name may be written as an identifier or as a string literal. Unquoted identifiers fold to lower case.
id: cmd-set-session-auth.identifier-and-literal-forms
title: Quoted identifier and string literal name the same mixed-case role; unquoted identifier folds to lower case and fails
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, identifier-syntax, string-literal-syntax, identifier-folding]
required_capabilities: [roles, session-authorization, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#description (user_name may be an identifier or a string literal)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE "Sa_Mixed"
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION "Sa_Mixed"
    expect: ok
  - sql: |
      SELECT SESSION_USER, CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION 'Sa_Mixed'
    expect: ok
  - sql: |
      SELECT CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION Sa_Mixed
    expect: error
    sqlstate: "22023"
    comment: the unquoted identifier is folded to sa_mixed, which does not exist
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS unchanged
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE "Sa_Mixed"
    expect: ok
