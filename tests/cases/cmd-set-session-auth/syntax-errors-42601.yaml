# The user name is exactly one identifier or string literal. Missing, repeated, numeric and NULL operands are syntax errors.
id: cmd-set-session-auth.syntax-errors-42601
title: Missing, multiple, numeric and NULL user names are syntax errors (42601) and change nothing
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, syntax, errors]
required_capabilities: [roles, session-authorization, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#synopsis"
sessions: [a]
steps:
  - sql: |
      SET SESSION AUTHORIZATION
    expect: error
    sqlstate: "42601"
  - sql: |
      SET SESSION AUTHORIZATION 'sa_syn_a', 'sa_syn_b'
    expect: error
    sqlstate: "42601"
  - sql: |
      SET SESSION AUTHORIZATION sa_syn_a sa_syn_b
    expect: error
    sqlstate: "42601"
  - sql: |
      SET SESSION AUTHORIZATION 42
    expect: error
    sqlstate: "42601"
  - sql: |
      SET SESSION AUTHORIZATION NULL
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS unchanged
    expect: rows
    order: ordered
