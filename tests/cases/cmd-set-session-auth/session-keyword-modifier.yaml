# SESSION and LOCAL are optional modifiers; SET SESSION SESSION AUTHORIZATION is accepted by the synopsis grammar.
id: cmd-set-session-auth.session-keyword-modifier
title: The SESSION modifier may be repeated (SET SESSION SESSION AUTHORIZATION) and LOCAL is accepted inside a transaction block
family: cmd-set-session-auth
tier: core
feature_ids: [set-session-authorization, session-modifier, local-modifier]
required_capabilities: [roles, session-authorization, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_session_auth.sgml#synopsis (SET [ SESSION | LOCAL ] SESSION AUTHORIZATION user_name)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE sa_kw_user
    expect: ok
  - sql: |
      SET SESSION SESSION AUTHORIZATION 'sa_kw_user'
    expect: ok
  - sql: |
      SELECT SESSION_USER, CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL SESSION AUTHORIZATION 'sa_kw_user'
    expect: ok
  - sql: |
      SELECT SESSION_USER, CURRENT_USER
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT SESSION_USER = CURRENT_USER AS reverted
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE sa_kw_user
    expect: ok
