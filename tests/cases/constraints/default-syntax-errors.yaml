# Parser rules for DEFAULT: a bare IN predicate is not a b_expr, so it must be parenthesized.
id: constraints.default-syntax-errors
title: DEFAULT expression grammar rejects stray commas and unparenthesized IN, accepts parenthesized IN
family: constraints
tier: extended
feature_ids: [create-table, default-values, errors, parser]
required_capabilities: [create-table, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/constraints.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE err_tbl (i int DEFAULT (100, ))
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TABLE err_tbl (b1 bool DEFAULT 1 IN (1, 2))
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TABLE err_tbl (b1 bool DEFAULT (1 IN (1, 2)))
    expect: ok
  - sql: |
      INSERT INTO err_tbl DEFAULT VALUES
    expect: ok
  - sql: |
      SELECT b1, b1 IS NOT NULL AS present FROM err_tbl
    expect: rows
