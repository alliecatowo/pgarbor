# Early binding (regclass constant) versus late binding (text constant resolved at run time) through to_regclass.
id: doc-datatype-oid.regclass-runtime-lookup-late-binding
title: "to_regclass resolves a name at run time and a text argument is looked up per call"
family: doc-datatype-oid
tier: core
feature_ids: [regclass, to-regclass, late-binding, sequences]
required_capabilities: [create-table, select, sequence, nextval]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (nextval('foo'::text) foo is looked up at runtime)"
sessions: [a]
steps:
  - sql: |
      SELECT to_regclass('doc_oid_late') IS NULL AS before_create
    expect: rows
  - sql: |
      CREATE TABLE doc_oid_late (id int)
    expect: ok
  - sql: |
      SELECT to_regclass('doc_oid_late')::text AS after_create
    expect: rows
    comment: the same name now resolves without any error
  - sql: |
      DROP TABLE doc_oid_late
    expect: ok
  - sql: |
      SELECT to_regclass('doc_oid_late') IS NULL AS after_drop
    expect: rows
