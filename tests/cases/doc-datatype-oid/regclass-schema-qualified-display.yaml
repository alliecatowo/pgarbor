# Schema-qualified names resolve regardless of search_path; output is qualified only when the object is not on the path.
id: doc-datatype-oid.regclass-schema-qualified-display
title: "regclass output drops the schema name only when the object is on the search path"
family: doc-datatype-oid
tier: core
feature_ids: [regclass, search-path, schema-qualification]
required_capabilities: [create-table, create-schema, select, search-path]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (schema-qualified names accepted and displayed if not found on the search path)"
sessions: [a]
setup: |
  CREATE SCHEMA doc_oid_sch;
  CREATE TABLE doc_oid_sch.doc_oid_tbl (x int)
steps:
  - sql: |
      SELECT 'doc_oid_sch.doc_oid_tbl'::regclass::text AS outside_path
    expect: rows
    comment: the schema is not on the default search path, so it is shown
  - sql: |
      SET search_path = doc_oid_sch, public
    expect: ok
  - sql: |
      SELECT 'doc_oid_sch.doc_oid_tbl'::regclass::text AS on_path, 'doc_oid_tbl'::regclass::text AS unqualified
    expect: rows
    comment: with the schema on the path the qualifier is dropped on output
  - sql: |
      SET search_path = "$user", public
    expect: ok
