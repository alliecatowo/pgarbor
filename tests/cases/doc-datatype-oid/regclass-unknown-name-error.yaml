# regclass input raises undefined_table for an unknown name, while to_regclass returns NULL instead.
id: doc-datatype-oid.regclass-unknown-name-error
title: "regclass input on an unknown name is undefined_table while to_regclass returns NULL"
family: doc-datatype-oid
tier: core
feature_ids: [regclass, to-regclass, errors, null-semantics]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (to_regclass() and its siblings perform run-time lookups)"
sessions: [a]
steps:
  - sql: |
      SELECT 'doc_oid_no_such_table'::regclass
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT to_regclass('doc_oid_no_such_table') IS NULL AS missing_is_null
    expect: rows
    comment: to_regclass swallows the lookup failure and returns NULL
  - sql: |
      SELECT 'doc_oid_no_such_table.x'::regclass
    expect: error
    sqlstate: "42P01"
    comment: a schema-qualified missing name is also undefined_table
