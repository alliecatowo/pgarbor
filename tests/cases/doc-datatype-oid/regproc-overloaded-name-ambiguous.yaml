# regproc accepts only unique names: an overloaded name such as sum is ambiguous, a unique name such as nextval is fine.
id: doc-datatype-oid.regproc-overloaded-name-ambiguous
title: "regproc rejects an overloaded function name as ambiguous and accepts a unique one"
family: doc-datatype-oid
tier: core
feature_ids: [regproc, regprocedure, overloading, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (The regproc and regoper alias types will only accept input names that are unique)"
sessions: [a]
steps:
  - sql: |
      SELECT 'sum'::regproc
    expect: error
    sqlstate: "42725"
    comment: sum has several overloads, so the name alone is ambiguous
  - sql: |
      SELECT 'nextval'::regproc AS uniq, 'nextval(regclass)'::regprocedure AS sig
    expect: rows
    comment: nextval has a single overload, so regproc resolves it
  - sql: |
      SELECT 'sum(int4)'::regprocedure AS int_sum, 'sum(int8)'::regprocedure AS bigint_sum
    expect: rows
    comment: regprocedure disambiguates with the argument types
