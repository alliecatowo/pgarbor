# Documented regclass example: attrelid of pg_attribute can be looked up by table name, and matches the pg_class oid.
id: doc-datatype-oid.regclass-catalog-lookup
title: "regclass resolves a table name to its oid for pg_attribute lookups and matches pg_class"
family: doc-datatype-oid
tier: core
feature_ids: [regclass, oid-alias, pg-attribute, catalog-lookup]
required_capabilities: [create-table, select, catalog]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (SELECT * FROM pg_attribute WHERE attrelid = 'mytable'::regclass)"
sessions: [a]
setup: |
  CREATE TABLE doc_oid_mytable (a int, b text)
steps:
  - sql: |
      SELECT attname, atttypid::regtype AS typ FROM pg_attribute WHERE attrelid = 'doc_oid_mytable'::regclass AND attnum > 0 ORDER BY attnum
    expect: rows
    order: ordered
    comment: the documented pattern, restricted to user columns
  - sql: |
      SELECT 'doc_oid_mytable'::regclass::oid = (SELECT oid FROM pg_class WHERE relname = 'doc_oid_mytable') AS same_oid, 'doc_oid_mytable'::regclass::text AS as_text
    expect: rows
    comment: the regclass lookup and the manual subselect give the same oid
  - sql: |
      SELECT attrelid::regclass::text AS owner_name FROM pg_attribute WHERE attrelid = 'doc_oid_mytable'::regclass AND attnum = 1
    expect: rows
    comment: casting a table oid back to regclass displays its name
