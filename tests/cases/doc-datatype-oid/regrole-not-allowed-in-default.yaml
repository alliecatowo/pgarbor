# regrole is the one OID alias type whose constants cannot appear in stored expressions, so a regrole column default is rejected.
id: doc-datatype-oid.regrole-not-allowed-in-default
title: "a regrole constant is rejected in a stored column default expression"
family: doc-datatype-oid
tier: core
feature_ids: [regrole, column-default, dependencies, errors]
required_capabilities: [create-table, errors, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (regrole is an exception to this property)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE doc_oid_role_default (r text DEFAULT 'pg_monitor'::regrole)
    expect: error
    sqlstate: "0A000"
    comment: constants of type regrole are not allowed in stored expressions
  - sql: |
      CREATE TABLE doc_oid_role_default (r text DEFAULT 'pg_monitor'::regrole::text)
    expect: error
    sqlstate: "0A000"
    comment: casting the constant to text does not lift the restriction, the regrole constant is still present
  - sql: |
      CREATE TABLE doc_oid_role_default (r text DEFAULT 'pg_monitor')
    expect: ok
    comment: a plain text literal default is allowed
