# The other OID alias types accept symbolic names for namespaces, text search objects, collations and roles.
id: doc-datatype-oid.regnamespace-regconfig-regdictionary-regcollation
title: "regnamespace regconfig regdictionary regcollation and regrole resolve documented built-in names"
family: doc-datatype-oid
tier: core
feature_ids: [regnamespace, regconfig, regdictionary, regcollation, regrole, text-search]
required_capabilities: [select, text-search, collate]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid-table (pg_catalog, english, simple, \"POSIX\", pg_monitor)"
sessions: [a]
steps:
  - sql: |
      SELECT 'pg_catalog'::regnamespace AS ns, 'english'::regconfig AS cfg, 'simple'::regdictionary AS dict, '"POSIX"'::regcollation AS coll
    expect: rows
    comment: documented example names; POSIX needs quotes to keep its case
  - sql: |
      SELECT 'pg_monitor'::regrole::text AS role_name, 'pg_catalog'::regnamespace::oid = 11 AS pg_catalog_is_11
    expect: rows
    comment: pg_catalog has OID 11 in every cluster, so this is deterministic
  - sql: |
      SELECT 'pg_no_such_schema'::regnamespace
    expect: error
    sqlstate: "3F000"
    comment: an unknown schema name is invalid_schema_name
