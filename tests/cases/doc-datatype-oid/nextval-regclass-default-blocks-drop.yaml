# A regclass constant in a column default records a dependency on the sequence; a text constant does not.
id: doc-datatype-oid.nextval-regclass-default-blocks-drop
title: "regclass default blocks dropping its sequence while text default does not create a dependency"
family: doc-datatype-oid
tier: core
feature_ids: [regclass, nextval, dependencies, column-default, drop-sequence]
required_capabilities: [create-table, create-sequence, nextval, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (nextval('my_seq'::regclass) creates a dependency; nextval('my_seq'::text) does not)"
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE doc_oid_dep_seq
    expect: ok
  - sql: |
      CREATE TABLE doc_oid_dep_t (id int DEFAULT nextval('doc_oid_dep_seq'::regclass))
    expect: ok
  - sql: |
      DROP SEQUENCE doc_oid_dep_seq
    expect: error
    sqlstate: "2BP01"
    comment: the regclass default makes the sequence a dependency
  - sql: |
      CREATE SEQUENCE doc_oid_free_seq
    expect: ok
  - sql: |
      CREATE TABLE doc_oid_free_t (id int DEFAULT nextval('doc_oid_free_seq'::text))
    expect: ok
  - sql: |
      DROP SEQUENCE doc_oid_free_seq
    expect: ok
    comment: the text constant recorded no dependency, so the drop succeeds
