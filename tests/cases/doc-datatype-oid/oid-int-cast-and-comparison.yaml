# oid is an unsigned 4-byte integer: literals round-trip, cast to integer arithmetic, and compare.
id: doc-datatype-oid.oid-int-cast-and-comparison
title: "oid values round-trip, cast to int8 for arithmetic, and order like unsigned integers"
family: doc-datatype-oid
tier: core
feature_ids: [oid, oid-cast, oid-comparison, integer-arithmetic]
required_capabilities: [select, int8, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (oid is an unsigned four-byte integer; can be cast to integer)"
sessions: [a]
steps:
  - sql: |
      SELECT '564182'::oid AS o, '564182'::oid::int8 + 1 AS plus_one, '4294967295'::oid::int8 AS max_value
    expect: rows
    comment: documented example value 564182 and the top of the unsigned range
  - sql: |
      SELECT '1'::oid < '2'::oid AS lt, '4000000000'::oid > '3000000000'::oid AS gt_unsigned, '7'::oid = 7::oid AS eq_int
    expect: rows
    comment: comparison follows unsigned order, so 4000000000 is greater than 3000000000
  - sql: |
      SELECT o::text AS txt, o::int8 - 2 AS minus_two FROM (VALUES ('10'::oid), ('2'::oid), ('4294967295'::oid)) AS v(o) ORDER BY o
    expect: rows
    order: ordered
