# Unquoted identifiers fold to lower case for regclass lookups; a quoted mixed-case name must be quoted as input and output.
id: doc-datatype-oid.regclass-quoting-and-case-folding
title: "regclass folds unquoted names to lower case and quotes mixed-case names on output"
family: doc-datatype-oid
tier: core
feature_ids: [regclass, identifier-quoting, case-folding]
required_capabilities: [create-table, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (input functions fold upper-case letters except within double quotes)"
sessions: [a]
setup: |
  CREATE TABLE "Doc_Oid_Mixed" (x int)
steps:
  - sql: |
      SELECT '"Doc_Oid_Mixed"'::regclass::text AS quoted_text
    expect: rows
    comment: quoted input keeps its case and output is double-quoted
  - sql: |
      SELECT 'Doc_Oid_Mixed'::regclass
    expect: error
    sqlstate: "42P01"
    comment: unquoted input folds to doc_oid_mixed, which does not exist
  - sql: |
      SELECT 'DOC_OID_MIXED'::regclass
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT ' "Doc_Oid_Mixed" '::regclass::text AS spaced_quoted
    expect: rows
    comment: whitespace between tokens is allowed around the quoted name
