# xid and xid8 are transaction identifiers with text input; cid is a command identifier that is not castable from integer; xid8 has no integer arithmetic.
id: doc-datatype-oid.xid-xid8-cid-types
title: "xid and xid8 accept literals, cid is not castable from integer, and xid8 has no integer arithmetic"
family: doc-datatype-oid
tier: extended
feature_ids: [xid, xid8, cid, transaction-identifiers, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (xid, xid8, cid identifier types)"
sessions: [a]
steps:
  - sql: |
      SELECT '42'::xid::text AS xid_text, '42'::xid8::text AS xid8_text, '42'::xid8 = '42'::xid8 AS xid8_eq
    expect: rows
  - sql: |
      SELECT '42'::xid8 + 1
    expect: error
    sqlstate: "42883"
    comment: xid8 has no operators beyond comparison and specialized functions
  - sql: |
      SELECT 4::cid
    expect: error
    sqlstate: "42846"
    comment: integer cannot be cast to cid
