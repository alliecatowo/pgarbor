# oid input accepts the full unsigned 32-bit range (a negative literal wraps), rejects values past it and non-numeric text.
id: doc-datatype-oid.oid-input-range-and-syntax-errors
title: "oid input wraps negative literals and rejects out-of-range or non-numeric text"
family: doc-datatype-oid
tier: core
feature_ids: [oid, oid-input, errors, boundaries]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid-table (oid, unsigned four-byte integer)"
sessions: [a]
steps:
  - sql: |
      SELECT '0'::oid AS zero, '4294967295'::oid AS top, '-1'::oid AS wrapped
    expect: rows
    comment: "-1 wraps to 4294967295 because oid is stored as an unsigned 4-byte integer"
  - sql: |
      SELECT '4294967296'::oid
    expect: error
    sqlstate: "22003"
    comment: one past the unsigned 32-bit range is numeric_value_out_of_range
  - sql: |
      SELECT 'abc'::oid
    expect: error
    sqlstate: "22P02"
    comment: non-numeric oid text is invalid_text_representation
