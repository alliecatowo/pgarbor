# regprocedure folds unquoted names, respects quotes, and displays an overloaded signature with quoted name and canonical type names.
id: doc-datatype-oid.regprocedure-quoted-function-signature
title: "regprocedure resolves a quoted function signature and displays canonical argument types"
family: doc-datatype-oid
tier: core
feature_ids: [regprocedure, identifier-quoting, function-signature, create-function]
required_capabilities: [create-function-sql, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (' \"Foo\" ( int, integer ) '::regprocedure displays \"Foo\"(integer,integer))"
sessions: [a]
setup: |
  CREATE FUNCTION "Doc_Oid_Foo"(int, integer) RETURNS int LANGUAGE sql AS 'SELECT 1'
steps:
  - sql: |
      SELECT ' "Doc_Oid_Foo" ( int, integer ) '::regprocedure::text AS sig
    expect: rows
    comment: whitespace between tokens is allowed; output uses canonical type names
  - sql: |
      SELECT 'doc_oid_foo(int,int)'::regprocedure
    expect: error
    sqlstate: "42883"
    comment: the unquoted name folds to lower case and does not match the quoted function
  - sql: |
      SELECT 'pg_catalog.sum(int4)'::regprocedure::text AS qualified_builtin
    expect: rows
    comment: schema-qualified signatures are accepted
