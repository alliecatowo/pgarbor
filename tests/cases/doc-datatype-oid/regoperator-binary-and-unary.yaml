# regoperator writes NONE for the unused operand of a unary operator; regoper is ambiguous when several operators share a name.
id: doc-datatype-oid.regoperator-binary-and-unary
title: "regoperator parses binary and prefix operators with NONE and rejects an overloaded regoper name"
family: doc-datatype-oid
tier: core
feature_ids: [regoperator, regoper, unary-operator, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (for regoperator, unary operators are identified by writing NONE)"
sessions: [a]
steps:
  - sql: |
      SELECT '*(integer,integer)'::regoperator::text AS binary_mul, '-(NONE,integer)'::regoperator::text AS prefix_minus
    expect: rows
    comment: the NONE placeholder marks the missing left operand
  - sql: |
      SELECT '+'::regoper
    expect: error
    sqlstate: "42725"
    comment: + is overloaded across many type pairs, so regoper is ambiguous
  - sql: |
      SELECT '*(integer,integer)'::regoperator = '*(int4,int4)'::regoperator AS same_operator
    expect: rows
    comment: type aliases resolve to the same operator
