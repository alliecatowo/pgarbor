# regtype accepts SQL and alias type names, drops type modifiers on output, and displays canonical names.
id: doc-datatype-oid.regtype-alias-names-and-typmods
title: "regtype maps SQL and alias type names to canonical names and drops modifiers"
family: doc-datatype-oid
tier: core
feature_ids: [regtype, type-aliases, typmod, canonical-names]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid-table (regtype, pg_type, data type name)"
sessions: [a]
steps:
  - sql: |
      SELECT 'integer'::regtype AS a, 'int4'::regtype AS b, 'int'::regtype AS c, 'bool'::regtype AS d, 'float8'::regtype AS e
    expect: rows
    comment: all of these alias names resolve to the same display names
  - sql: |
      SELECT 'varchar'::regtype::text AS vc, 'character varying(10)'::regtype::text AS vc_typmod, 'timestamp(3)'::regtype::text AS ts_typmod
    expect: rows
    comment: modifiers such as (10) and (3) are not shown by regtype output
  - sql: |
      SELECT 'integer'::regtype::oid = 'int4'::regtype::oid AS same_oid
    expect: rows
