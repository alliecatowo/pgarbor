# Quoted sequence names are case-sensitive in regclass input; the unquoted spelling of a mixed-case name is a different, missing relation.
id: doc-datatype-oid.nextval-quoted-sequence-name
title: "nextval resolves a quoted mixed-case sequence name and fails on its folded spelling"
family: doc-datatype-oid
tier: core
feature_ids: [nextval, regclass, identifier-quoting, sequences]
required_capabilities: [create-sequence, nextval, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-oid (nextval('\"Foo\"') operates on sequence Foo)"
sessions: [a]
setup: |
  CREATE SEQUENCE "Doc_Oid_Seq_Q"
steps:
  - sql: |
      SELECT nextval('"Doc_Oid_Seq_Q"') AS first_value
    expect: rows
    comment: the first value of a new sequence is 1
  - sql: |
      SELECT nextval('"Doc_Oid_Seq_Q"') AS second_value
    expect: rows
  - sql: |
      SELECT nextval('doc_oid_seq_q')
    expect: error
    sqlstate: "42P01"
    comment: unquoted input folds to a lower-case name that does not exist
  - sql: |
      SELECT nextval('doc_oid_seq_q'::text)
    expect: error
    sqlstate: "42P01"
    comment: late-bound text lookup fails the same way at run time
