# Documented RENAME example: after ALTER PROCEDURE ... RENAME TO, the old name and old signature are
# gone and the new name keeps the same body and arguments.
id: cmd-alter-procedure.rename-doc-example
title: ALTER PROCEDURE insert_data(integer, integer) RENAME TO insert_record moves the name only
family: cmd-alter-procedure
tier: core
feature_ids: [alter-procedure, rename, procedures, call]
required_capabilities: [create-table, insert, select, create-procedure, call]
provenance:
  source: pg-docs
  ref: "ref/alter_procedure.sgml#sql-alterprocedure (Examples: rename insert_data to insert_record)"
sessions: [a]
setup: |
  CREATE TABLE ins_log (a int, b int);
  CREATE PROCEDURE insert_data(integer, integer) LANGUAGE SQL AS $$ INSERT INTO ins_log VALUES ($1, $2) $$;
steps:
  - sql: |
      ALTER PROCEDURE insert_data(integer, integer) RENAME TO insert_record
    expect: ok
  - sql: |
      CALL insert_record(1, 2)
    expect: ok
  - sql: |
      CALL insert_data(3, 4)
    expect: error
    sqlstate: "42883"
    comment: the old name no longer exists
  - sql: |
      SELECT a, b FROM ins_log ORDER BY a
    expect: rows
    order: ordered
    comment: only the call through the new name inserted a row
