# Derived from pg-regress copyselect: serial columns start at 1 per table and accept explicit NULL text.
id: copyselect.serial-defaults
title: Each serial column numbers its own table from 1, and text may be NULL
family: copyselect
tier: core
feature_ids: [create-table, insert, serial, nulls]
required_capabilities: [create-table, insert, select, serial]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql (test1/test2 serial tables)"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  CREATE TABLE test2 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), (NULL);
  INSERT INTO test2 (t) VALUES ('A');
steps:
  - sql: |
      SELECT id, t, t IS NULL AS t_null FROM test1 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, t FROM test2 ORDER BY id
    expect: rows
    order: ordered
