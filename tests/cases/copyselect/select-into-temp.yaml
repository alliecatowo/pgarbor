# Derived from pg-regress copyselect: SELECT INTO TEMP creates a temp table in plain SQL.
id: copyselect.select-into-temp
title: SELECT INTO TEMP creates a session-local table readable in the same session
family: copyselect
tier: core
feature_ids: [select, select-into, temp-tables]
required_capabilities: [create-table, insert, select, temp-tables]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), ('b'), ('c'), ('d'), ('e');
steps:
  - sql: |
      SELECT t INTO TEMP test3 FROM test1 WHERE id = 3
    expect: ok
  - sql: |
      SELECT t FROM test3
    expect: rows
    order: multiset
  - sql: |
      DROP TABLE test3
    expect: ok
