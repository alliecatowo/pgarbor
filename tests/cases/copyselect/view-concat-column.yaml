# Derived from pg-regress copyselect: view whose column is an unaliased concatenation.
id: copyselect.view-concat-column
title: View over an unaliased concatenation exposes a computed text column
family: copyselect
tier: core
feature_ids: [create-view, select, expressions]
required_capabilities: [create-table, insert, select, create-view]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), ('b'), ('c');
  CREATE VIEW v_test1 AS SELECT 'v_' || t FROM test1;
steps:
  - sql: |
      SELECT * FROM v_test1 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM v_test1
    expect: rows
