# Derived from pg-regress copyselect: SELECT ... FOR UPDATE with a filter.
id: copyselect.select-for-update
title: SELECT FOR UPDATE returns the locked row inside an explicit transaction
family: copyselect
tier: core
feature_ids: [select, row-locks, transactions]
required_capabilities: [create-table, insert, select, transactions, row-locks]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), ('b'), ('c'), ('d'), ('e');
steps:
  - sql: |
      BEGIN;
      SELECT t FROM test1 WHERE id = 3 FOR UPDATE;
      COMMIT
    expect: ok
    comment: the SELECT returns one row 'c' and COMMIT completes the block
  - sql: |
      SELECT t FROM test1 ORDER BY id
    expect: rows
    order: ordered
