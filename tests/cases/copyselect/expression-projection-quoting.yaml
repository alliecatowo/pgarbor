# Derived from pg-regress copyselect: projection with quoted identifiers, doubled quotes and arithmetic.
id: copyselect.expression-projection-quoting
title: Projection mixes quoted identifiers, doubled-quote string literals and arithmetic
family: copyselect
tier: core
feature_ids: [select, expressions, quoted-identifiers]
required_capabilities: [create-table, insert, select, quoted-identifiers]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), ('b'), ('c'), ('d'), ('e');
steps:
  - sql: |
      SELECT "id", 'id', 'id""' || t, (id + 1) * id, t, "test1"."t" FROM test1 WHERE id = 3
    expect: rows
    order: multiset
