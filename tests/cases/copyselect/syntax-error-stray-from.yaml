# Derived from pg-regress copyselect: a second FROM clause is a syntax error.
id: copyselect.syntax-error-stray-from
title: Stray FROM after a complete SELECT raises a 42601 syntax error
family: copyselect
tier: core
feature_ids: [select, errors, parser]
required_capabilities: [create-table, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql ('copy (select * from test1) from stdin' should fail)"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
steps:
  - sql: |
      SELECT * FROM test1 FROM stdin
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM test1
    expect: rows
