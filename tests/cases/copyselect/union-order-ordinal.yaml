# Derived from pg-regress copyselect: UNION with ORDER BY ordinal across a view and a table.
id: copyselect.union-order-ordinal
title: UNION of a filtered table and a view, ordered by output ordinal
family: copyselect
tier: core
feature_ids: [select, union, create-view, order-by]
required_capabilities: [create-table, insert, select, create-view, union]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), ('b'), ('c'), ('d'), ('e');
  CREATE VIEW v_test1 AS SELECT 'v_' || t FROM test1;
steps:
  - sql: |
      SELECT t FROM test1 WHERE id = 1 UNION SELECT * FROM v_test1 ORDER BY 1
    expect: rows
    order: ordered
    comment: UNION removes duplicates and ORDER BY 1 sorts the single output column
