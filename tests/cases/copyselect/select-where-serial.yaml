# Derived from pg-regress copyselect: serial-keyed table, filtered single-row select.
id: copyselect.select-where-serial
title: Serial primary key and equality filter return the matching row only
family: copyselect
tier: core
feature_ids: [select, create-table, insert, serial]
required_capabilities: [create-table, insert, select, serial]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a');
  INSERT INTO test1 (t) VALUES ('b');
  INSERT INTO test1 (t) VALUES ('c');
  INSERT INTO test1 (t) VALUES ('d');
  INSERT INTO test1 (t) VALUES ('e');
steps:
  - sql: |
      SELECT t FROM test1 WHERE id = 1
    expect: rows
    order: multiset
  - sql: |
      SELECT id, t FROM test1 ORDER BY id
    expect: rows
    order: ordered
