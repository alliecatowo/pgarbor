# Derived from pg-regress copyselect: JOIN ... USING on a shared serial column.
id: copyselect.join-using
title: JOIN USING merges the join column and keeps both value columns
family: copyselect
tier: core
feature_ids: [select, join]
required_capabilities: [create-table, insert, select, join]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  CREATE TABLE test2 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), ('b'), ('c'), ('d'), ('e');
  INSERT INTO test2 (t) VALUES ('A'), ('B'), ('C'), ('D'), ('E');
steps:
  - sql: |
      SELECT * FROM test1 JOIN test2 USING (id)
    expect: rows
    order: multiset
  - sql: |
      SELECT id, test1.t AS lower, test2.t AS upper FROM test1 JOIN test2 USING (id) WHERE id > 3 ORDER BY id
    expect: rows
    order: ordered
