# Derived from pg-regress copyselect: multi-statement simple query stops at the first error.
id: copyselect.multi-statement-error-stops
title: Simple query with several statements stops at the failing statement
family: copyselect
tier: extended
feature_ids: [select, errors, multi-statement]
required_capabilities: [select, errors, multi-statement]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql (psql multi-command strings: 'select 1/0; ...')"
sessions: [a]
steps:
  - sql: |
      SELECT 1; SELECT 1/0; SELECT 3
    expect: error
    sqlstate: "22012"
    comment: the first statement returns a row, the second fails, the third never runs
  - sql: |
      SELECT 4
    expect: rows
    order: ordered
