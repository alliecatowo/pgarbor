# Derived from pg-regress copyselect: UNION with ORDER BY inside a FROM subquery.
id: copyselect.subselect-union-wrap
title: UNION with ORDER BY wrapped in a FROM subquery keeps its column
family: copyselect
tier: core
feature_ids: [select, union, subquery, order-by]
required_capabilities: [create-table, insert, select, create-view, union, subquery]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), ('b'), ('c'), ('d'), ('e');
  CREATE VIEW v_test1 AS SELECT 'v_' || t FROM test1;
steps:
  - sql: |
      SELECT t1.t FROM (SELECT t FROM test1 WHERE id = 1 UNION SELECT * FROM v_test1 ORDER BY 1) AS t1 ORDER BY t1.t
    expect: rows
    order: ordered
