family: copyselect
tier: core
feature_ids: [select, errors, expressions]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copyselect.sql; errcodes 22012 division_by_zero"
sessions: [a]
steps:
