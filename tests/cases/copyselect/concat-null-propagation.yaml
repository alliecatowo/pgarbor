# Derived from pg-regress copyselect: concatenation with a NULL text value yields NULL.
id: copyselect.concat-null-propagation
title: Text concatenation with NULL yields NULL, not an empty string
family: copyselect
tier: core
feature_ids: [select, expressions, nulls, create-view]
required_capabilities: [create-table, insert, select, create-view]
provenance:
  source: hand
  ref: "PG18 functions-string.html (|| operator is strict); derived from copyselect v_test1 view"
sessions: [a]
setup: |
  CREATE TABLE test1 (id serial, t text);
  INSERT INTO test1 (t) VALUES ('a'), (NULL), ('');
  CREATE VIEW v_test1 AS SELECT 'v_' || t FROM test1;
steps:
  - sql: |
      SELECT id, 'v_' || t AS c, ('v_' || t) IS NULL AS c_null FROM test1 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FILTER (WHERE "?column?" IS NULL) AS null_rows FROM v_test1
    expect: rows
