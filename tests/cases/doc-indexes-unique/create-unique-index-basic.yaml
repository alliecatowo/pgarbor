# CREATE UNIQUE INDEX on one column: equal non-null values are rejected; index is marked unique.
id: doc-indexes-unique.create-unique-index-basic
title: CREATE UNIQUE INDEX rejects a duplicate value and is recorded as unique
family: doc-indexes-unique
tier: core
feature_ids: [unique-index, create-index, errors, catalog]
required_capabilities: [create-table, insert, select, create-index, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-unique (CREATE UNIQUE INDEX synopsis; 'multiple table rows with equal indexed values are not allowed')"
sessions: [a]
setup: |
  CREATE TABLE users (id int4, email text);
  CREATE UNIQUE INDEX users_email_uq ON users (email);
steps:
  - sql: |
      INSERT INTO users VALUES (1, 'a@example.com'), (2, 'b@example.com')
    expect: ok
  - sql: |
      INSERT INTO users VALUES (3, 'a@example.com')
    expect: error
    sqlstate: "23505"
    comment: equal indexed value rejected
  - sql: |
      SELECT id, email FROM users ORDER BY id
    expect: rows
    order: ordered
    comment: the rejected row is absent
  - sql: |
      SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'users' ORDER BY indexname
    expect: rows
    order: ordered
