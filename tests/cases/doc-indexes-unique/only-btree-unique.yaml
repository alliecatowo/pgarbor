# Only B-tree indexes can be declared unique; other access methods are rejected.
id: doc-indexes-unique.only-btree-unique
title: Unique index on a non-btree access method is rejected with 0A000
family: doc-indexes-unique
tier: core
feature_ids: [unique-index, create-index, index-access-methods, errors]
required_capabilities: [create-table, create-index, hash-index, gin-index, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-unique ('Currently, only B-tree indexes can be declared unique')"
sessions: [a]
setup: |
  CREATE TABLE am (a int)
steps:
  - sql: |
      CREATE UNIQUE INDEX am_hash ON am USING hash (a)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE UNIQUE INDEX am_gin ON am USING gin (a)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE INDEX am_hash_ok ON am USING hash (a)
    expect: ok
    comment: non-unique hash index is fine
  - sql: |
      CREATE UNIQUE INDEX am_btree ON am USING btree (a)
    expect: ok
