# Inherited queries include descendant rows by default; cities* is the explicit (equivalent) form.
id: doc-ddl-inherit.query-includes-descendants
title: SELECT from a parent includes child rows by default and with explicit star
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, table-inheritance, select, create-table]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE cities (name text, population float, elevation int);
  CREATE TABLE capitals (state char(2)) INHERITS (cities);
  INSERT INTO cities VALUES ('Las Vegas', NULL, 2174), ('Mariposa', NULL, 1953);
  INSERT INTO capitals VALUES ('Madison', NULL, 845, 'WI');
steps:
  - sql: |
      SELECT name, elevation FROM cities WHERE elevation > 500 ORDER BY name
    expect: rows
    order: ordered
  - sql: |
      SELECT name, elevation FROM cities* WHERE elevation > 500 ORDER BY name
    expect: rows
    order: ordered
