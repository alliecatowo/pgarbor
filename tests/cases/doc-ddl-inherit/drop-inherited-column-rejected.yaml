# A column inherited from a parent cannot be dropped from the child.
id: doc-ddl-inherit.drop-inherited-column-rejected
title: ALTER TABLE child DROP COLUMN rejects a column inherited from a parent
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, alter-table, drop-column, errors]
required_capabilities: [create-table, alter-table, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE p (a int NOT NULL, y text);
  CREATE TABLE c () INHERITS (p);
steps:
  - sql: |
      ALTER TABLE c DROP COLUMN a
    expect: error
    sqlstate: "42P16"
  - sql: |
      ALTER TABLE c ALTER COLUMN y TYPE varchar(10)
    expect: error
    sqlstate: "42P16"
    comment: altering an inherited column type on the child is also refused
