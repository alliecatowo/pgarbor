# NOT NULL constraints on a parent are inherited by children.
id: doc-ddl-inherit.not-null-inherited
title: Parent NOT NULL column rejects NULL inserted into the child
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, table-inheritance, not-null, constraints, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE p (a int NOT NULL, y text);
  CREATE TABLE c () INHERITS (p);
steps:
  - sql: |
      INSERT INTO c VALUES (NULL, 'x')
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO c VALUES (1, 'x')
    expect: ok
  - sql: |
      SELECT a, y FROM p ORDER BY a
    expect: rows
    order: ordered
