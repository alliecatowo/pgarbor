# Check constraints with the same name and identical conditions merge; the child enforces them.
id: doc-ddl-inherit.multiple-parents-same-check-merged
title: Identical same-named CHECK constraints from two parents merge and are enforced
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, multiple-inheritance, check-constraint, errors]
required_capabilities: [create-table, insert, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE k3 (a int, CONSTRAINT ck CHECK (a > 0));
  CREATE TABLE k4 (a int, CONSTRAINT ck CHECK (a > 0));
  CREATE TABLE kc2 () INHERITS (k3, k4);
steps:
  - sql: |
      INSERT INTO kc2 VALUES (-1)
    expect: error
    sqlstate: "23514"
  - sql: |
      INSERT INTO kc2 VALUES (1)
    expect: ok
