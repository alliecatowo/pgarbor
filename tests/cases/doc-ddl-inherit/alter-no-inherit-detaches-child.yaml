# ALTER TABLE ... NO INHERIT removes the inheritance link: the child is no longer seen through the parent.
id: doc-ddl-inherit.alter-no-inherit-detaches-child
title: NO INHERIT detaches a child so parent queries stop returning its rows
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, alter-table-no-inherit, select]
required_capabilities: [create-table, alter-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE r1 (a int);
  CREATE TABLE r2 () INHERITS (r1);
  INSERT INTO r1 VALUES (1);
  INSERT INTO r2 VALUES (2);
steps:
  - sql: |
      SELECT count(*) FROM r1
    expect: rows
  - sql: |
      ALTER TABLE r2 NO INHERIT r1
    expect: ok
  - sql: |
      SELECT a FROM r1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM r2 ORDER BY a
    expect: rows
    order: ordered
    comment: the child keeps its own row after detaching
