# Same-named columns from different parents must have the same data type, else an error is raised.
id: doc-ddl-inherit.multiple-parents-type-conflict
title: Multiple inheritance rejects same-named columns with different types
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, multiple-inheritance, column-merge, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE t1 (x int);
  CREATE TABLE t2 (x text);
steps:
  - sql: |
      CREATE TABLE tc () INHERITS (t1, t2)
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'tc'
    expect: rows
    comment: failed CREATE leaves no table behind
