# tableoid reports which table in the hierarchy each row came from.
id: doc-ddl-inherit.tableoid-regclass-origin
title: tableoid::regclass shows the originating table of each inherited row
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, table-inheritance, system-columns, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE cities (name text, population float, elevation int);
  CREATE TABLE capitals (state char(2)) INHERITS (cities);
  INSERT INTO cities VALUES ('Las Vegas', NULL, 2174), ('Mariposa', NULL, 1953);
  INSERT INTO capitals VALUES ('Madison', NULL, 845, 'WI');
steps:
  - sql: |
      SELECT c.tableoid::regclass AS relname, c.name, c.elevation
      FROM cities c
      WHERE c.elevation > 500
      ORDER BY c.name
    expect: rows
    order: ordered
