# A parent cannot be dropped while children remain; DROP ... CASCADE removes the parent and its descendants.
id: doc-ddl-inherit.drop-parent-restrict-then-cascade
title: DROP of a parent with children is rejected, and CASCADE drops the whole hierarchy
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, drop-table, drop-cascade, errors]
required_capabilities: [create-table, drop-table, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE r1 (a int);
  CREATE TABLE r2 () INHERITS (r1);
steps:
  - sql: |
      DROP TABLE r1
    expect: error
    sqlstate: "2BP01"
  - sql: |
      DROP TABLE r1 CASCADE
    expect: ok
  - sql: |
      SELECT to_regclass('r2') IS NULL AS child_gone, to_regclass('r1') IS NULL AS parent_gone
    expect: rows
