# A child with several parents gets the union of their columns; a same-named column is merged into one
# and is NOT NULL if any source definition is NOT NULL.
id: doc-ddl-inherit.multiple-parents-merge-columns
title: Multiple inheritance merges same-named columns and unions the rest
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, multiple-inheritance, column-merge, not-null, information-schema]
required_capabilities: [create-table, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE m1 (x int NOT NULL, y text);
  CREATE TABLE m2 (x int, z text);
  CREATE TABLE mc () INHERITS (m1, m2);
steps:
  - sql: |
      SELECT column_name, data_type, is_nullable
      FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name = 'mc'
      ORDER BY ordinal_position
    expect: rows
    order: ordered
