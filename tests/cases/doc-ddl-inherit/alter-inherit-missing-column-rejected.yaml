# ALTER TABLE ... INHERIT requires the child to already have the parent's columns with matching types.
id: doc-ddl-inherit.alter-inherit-missing-column-rejected
title: ALTER TABLE INHERIT rejects a child missing a parent column and one with a different type
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, alter-table-inherit, errors]
required_capabilities: [create-table, alter-table, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE p (a int NOT NULL, y text);
  CREATE TABLE ai (a int);
  CREATE TABLE ai2 (a text, y text);
steps:
  - sql: |
      ALTER TABLE ai INHERIT p
    expect: error
    sqlstate: "42804"
    comment: column y missing in the child
  - sql: |
      ALTER TABLE ai2 INHERIT p
    expect: error
    sqlstate: "42804"
    comment: column a has a different type in the child
