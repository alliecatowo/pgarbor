# A compatible table built with LIKE ... INCLUDING CONSTRAINTS can be attached later with ALTER TABLE INHERIT.
id: doc-ddl-inherit.alter-inherit-like-including-constraints
title: ALTER TABLE INHERIT succeeds for a LIKE INCLUDING CONSTRAINTS table and enforces the parent check
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, alter-table-inherit, like-clause, check-constraint]
required_capabilities: [create-table, alter-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE p2 (a int CHECK (a > 0));
steps:
  - sql: |
      CREATE TABLE lk2 (LIKE p2 INCLUDING CONSTRAINTS)
    expect: ok
  - sql: |
      ALTER TABLE lk2 INHERIT p2
    expect: ok
  - sql: |
      INSERT INTO lk2 VALUES (-5)
    expect: error
    sqlstate: "23514"
  - sql: |
      INSERT INTO lk2 VALUES (3)
    expect: ok
  - sql: |
      SELECT a FROM p2 ORDER BY a
    expect: rows
    order: ordered
