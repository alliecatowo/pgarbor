# UPDATE and DELETE on a parent include child rows unless ONLY is given.
id: doc-ddl-inherit.update-delete-include-descendants
title: UPDATE and DELETE include child rows by default; ONLY restricts them to the parent
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, update, delete, only-keyword]
required_capabilities: [create-table, insert, update, delete, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE u1 (a int);
  CREATE TABLE u2 () INHERITS (u1);
  INSERT INTO u1 VALUES (1);
  INSERT INTO u2 VALUES (2);
steps:
  - sql: |
      UPDATE u1 SET a = a + 10 RETURNING tableoid::regclass AS origin, a
    expect: rows
    order: multiset
  - sql: |
      DELETE FROM ONLY u1 WHERE a = 11
    expect: ok
  - sql: |
      SELECT count(*) FROM u1
    expect: rows
  - sql: |
      DELETE FROM u1
    expect: ok
  - sql: |
      SELECT count(*) FROM u1
    expect: rows
