# A CHECK constraint declared NO INHERIT is not propagated to child tables.
id: doc-ddl-inherit.check-no-inherit-not-inherited
title: CHECK ... NO INHERIT on parent is not enforced on the child
family: doc-ddl-inherit
tier: extended
feature_ids: [inheritance, table-inheritance, check-constraint, no-inherit]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE p3 (a int, CONSTRAINT pos CHECK (a > 0) NO INHERIT);
  CREATE TABLE c3 () INHERITS (p3);
steps:
  - sql: |
      INSERT INTO c3 VALUES (-1)
    expect: ok
  - sql: |
      SELECT count(*) FROM p3 WHERE a < 0
    expect: rows
    comment: the child row is visible through the parent and violates only the non-inherited check
