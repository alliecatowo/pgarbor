# Check constraints with the same name but different conditions cannot be merged.
id: doc-ddl-inherit.multiple-parents-check-conflict
title: Same-named CHECK constraints with different conditions fail the merge
family: doc-ddl-inherit
tier: extended
feature_ids: [inheritance, multiple-inheritance, check-constraint, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE k1 (a int, CONSTRAINT ck CHECK (a > 0));
  CREATE TABLE k2 (a int, CONSTRAINT ck CHECK (a < 10));
steps:
  - sql: |
      CREATE TABLE kc () INHERITS (k1, k2)
    expect: error
    sqlstate: "42710"
