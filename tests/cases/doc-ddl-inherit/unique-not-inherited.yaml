# Unique and primary key constraints are not inherited: child rows may duplicate parent keys.
id: doc-ddl-inherit.unique-not-inherited
title: Primary key on parent does not prevent duplicate keys in the child
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, table-inheritance, primary-key, unique, constraints]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE p4 (a int PRIMARY KEY);
  CREATE TABLE c4 () INHERITS (p4);
steps:
  - sql: |
      INSERT INTO p4 VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO c4 VALUES (1)
    expect: ok
    comment: duplicate of the parent key is allowed, the child has no primary key
  - sql: |
      SELECT a FROM p4 ORDER BY a
    expect: rows
    order: ordered
