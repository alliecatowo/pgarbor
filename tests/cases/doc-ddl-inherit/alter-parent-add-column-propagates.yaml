# ALTER TABLE on a parent (ADD COLUMN) propagates the new column, with its default, to children.
id: doc-ddl-inherit.alter-parent-add-column-propagates
title: ADD COLUMN on the parent appears in the child with the parent's default
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, alter-table, add-column, default]
required_capabilities: [create-table, alter-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE r1 (a int);
  CREATE TABLE r2 () INHERITS (r1);
  INSERT INTO r2 VALUES (7);
steps:
  - sql: |
      ALTER TABLE r1 ADD COLUMN b text DEFAULT 'd'
    expect: ok
  - sql: |
      SELECT a, b FROM r2 ORDER BY a
    expect: rows
    order: ordered
