# Check constraints on a parent are inherited by children and enforced on child inserts.
id: doc-ddl-inherit.check-inherited
title: Parent CHECK constraint is enforced for child inserts
family: doc-ddl-inherit
tier: core
feature_ids: [inheritance, table-inheritance, check-constraint, constraints, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-inherit"
sessions: [a]
setup: |
  CREATE TABLE p2 (a int CHECK (a > 0));
  CREATE TABLE c2 () INHERITS (p2);
steps:
  - sql: |
      INSERT INTO c2 VALUES (-1)
    expect: error
    sqlstate: "23514"
  - sql: |
      INSERT INTO c2 VALUES (5)
    expect: ok
  - sql: |
      SELECT a FROM p2 ORDER BY a
    expect: rows
    order: ordered
