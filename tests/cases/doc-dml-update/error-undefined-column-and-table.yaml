# Referencing an unknown column in SET or an unknown target table is an error and changes nothing.
id: doc-dml-update.error-undefined-column-and-table
title: UPDATE with an unknown SET column or unknown table fails with undefined-object SQLSTATEs
family: doc-dml-update
tier: core
feature_ids: [update, errors, catalog-names]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (the table and column to update)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'a', 5)
steps:
  - sql: |
      UPDATE products SET nosuch = 1
    expect: error
    sqlstate: "42703"
  - sql: |
      UPDATE nosuchtable SET price = 1
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
