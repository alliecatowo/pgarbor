# UPDATE with a WHERE equality condition changes only matching rows; NULL never matches an equality test.
id: doc-dml-update.basic-where-equality
title: UPDATE with WHERE equality updates matching rows only, NULL does not match
family: doc-dml-update
tier: core
feature_ids: [update, where-clause, null-semantics]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (UPDATE products SET price = 10 WHERE price = 5)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'a', 5), (2, 'b', 10), (3, 'c', NULL), (4, 'd', 5)
steps:
  - sql: |
      UPDATE products SET price = 10 WHERE price = 5
    expect: ok
    comment: rows 1 and 4 match; row 3 (NULL) does not match price = 5
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
  - sql: |
      UPDATE products SET price = 20 WHERE price IS NULL
    expect: ok
    comment: IS NULL is the way to address the NULL row
  - sql: |
      SELECT product_no, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
