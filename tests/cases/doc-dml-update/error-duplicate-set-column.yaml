# Assigning the same column twice in one SET clause is a syntax error.
id: doc-dml-update.error-duplicate-set-column
title: UPDATE assigning one column twice in SET fails with 42601
family: doc-dml-update
tier: core
feature_ids: [update, multiple-assignment, errors]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (listing more than one assignment in the SET clause)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'a', 5)
steps:
  - sql: |
      UPDATE products SET price = 1, price = 2
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT price FROM products
    expect: rows
    order: multiset
