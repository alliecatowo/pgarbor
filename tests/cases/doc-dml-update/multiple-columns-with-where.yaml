# Several assignments in one SET clause, with a WHERE that is a comparison rather than equality.
id: doc-dml-update.multiple-columns-with-where
title: UPDATE sets several columns at once with an inequality WHERE
family: doc-dml-update
tier: core
feature_ids: [update, where-clause, multiple-assignment]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (UPDATE mytable SET a = 5, b = 3, c = 1 WHERE a > 0)"
sessions: [a]
setup: |
  CREATE TABLE mytable (a int, b int, c int);
  INSERT INTO mytable VALUES (1, 2, 3), (0, 0, 0), (-4, 8, 8), (2, 2, 2)
steps:
  - sql: |
      UPDATE mytable SET a = 5, b = 3, c = 1 WHERE a > 0
    expect: ok
  - sql: |
      SELECT a, b, c FROM mytable ORDER BY a, b, c
    expect: rows
    order: ordered
    comment: rows with a <= 0 are untouched
