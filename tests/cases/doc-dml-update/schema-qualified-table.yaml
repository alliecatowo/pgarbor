# The table name in UPDATE may be schema-qualified; an unqualified name is looked up on the search path.
id: doc-dml-update.schema-qualified-table
title: UPDATE accepts a schema-qualified table name
family: doc-dml-update
tier: core
feature_ids: [update, schemas, search-path]
required_capabilities: [create-table, create-schema, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (the table name can be schema-qualified, otherwise it is looked up in the path)"
sessions: [a]
setup: |
  CREATE SCHEMA inv;
  CREATE TABLE inv.products (product_no int, price numeric(10,2));
  INSERT INTO inv.products VALUES (1, 5), (2, 6)
steps:
  - sql: |
      UPDATE inv.products SET price = 10 WHERE product_no = 1
    expect: ok
  - sql: |
      SELECT product_no, price FROM inv.products ORDER BY product_no
    expect: rows
    order: ordered
  - sql: |
      UPDATE products SET price = 1
    expect: error
    sqlstate: "42P01"
    comment: no products in public schema; unqualified name resolves only on the search path
