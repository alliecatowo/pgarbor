# The WHERE condition may use any operator that yields boolean: BETWEEN, IN, LIKE, and boolean combinations.
id: doc-dml-update.where-operators
title: UPDATE WHERE clause accepts BETWEEN, IN, LIKE and boolean combinations
family: doc-dml-update
tier: core
feature_ids: [update, where-clause, between, in-list, like]
required_capabilities: [create-table, insert, select, update, pattern-matching]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (the WHERE condition does not have to be an equality test)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'apple', 5), (2, 'apricot', 15), (3, 'banana', 25), (4, 'cherry', 35), (5, NULL, 45)
steps:
  - sql: |
      UPDATE products SET price = price + 1 WHERE price BETWEEN 10 AND 30
    expect: ok
  - sql: |
      UPDATE products SET price = 0 WHERE name IN ('apple', 'cherry')
    expect: ok
  - sql: |
      UPDATE products SET name = upper(name) WHERE name LIKE 'ap%' AND price > 1
    expect: ok
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
    comment: row 5 has NULL name; NULL LIKE yields NULL, so it is not updated
