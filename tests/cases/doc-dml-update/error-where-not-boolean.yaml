# A WHERE expression must evaluate to boolean; a numeric column alone is rejected and no row changes.
id: doc-dml-update.error-where-not-boolean
title: UPDATE rejects a non-boolean WHERE expression with 42804
family: doc-dml-update
tier: core
feature_ids: [update, where-clause, errors]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (the expression needs to evaluate to a Boolean result)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'a', 5), (2, 'b', 0)
steps:
  - sql: |
      UPDATE products SET price = 1 WHERE price
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT product_no, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
