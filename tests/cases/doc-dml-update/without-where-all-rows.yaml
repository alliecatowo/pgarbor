# Without a WHERE clause every row is updated; the RHS is an expression over the existing row value.
id: doc-dml-update.without-where-all-rows
title: UPDATE without WHERE updates every row with an expression over the old value
family: doc-dml-update
tier: core
feature_ids: [update, expressions, null-semantics, numeric]
required_capabilities: [create-table, insert, select, update, numeric-arithmetic]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (UPDATE products SET price = price * 1.10)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'a', 5), (2, 'b', 10), (3, 'c', NULL), (4, 'd', 7.5)
steps:
  - sql: |
      UPDATE products SET price = price * 1.10
    expect: ok
    comment: every row, including the one with NULL price
  - sql: |
      SELECT product_no, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
    comment: NULL * 1.10 stays NULL; results are rounded to numeric(10,2) on assignment
