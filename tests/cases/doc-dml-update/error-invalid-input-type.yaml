# A value that cannot be converted to the column type is rejected with 22P02 and the row is unchanged.
id: doc-dml-update.error-invalid-input-type
title: UPDATE with a value of the wrong type fails with 22P02
family: doc-dml-update
tier: core
feature_ids: [update, data-types, errors]
required_capabilities: [create-table, insert, select, update, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (the new column value)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'a', 5)
steps:
  - sql: |
      UPDATE products SET product_no = 'abc' WHERE product_no = 1
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT product_no, name, price FROM products
    expect: rows
    order: multiset
