# The SET expression sees the row's existing values, so a swap works in one statement;
# the RHS may be any scalar expression, including a scalar subquery.
id: doc-dml-update.set-expression-uses-old-values
title: SET right-hand sides read pre-update values and accept any scalar expression
family: doc-dml-update
tier: core
feature_ids: [update, expressions, scalar-subquery]
required_capabilities: [create-table, insert, select, update, subqueries]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (the expression for the new value can refer to the existing value(s) in the row)"
sessions: [a]
setup: |
  CREATE TABLE pair (id int primary key, x int, y int);
  INSERT INTO pair VALUES (1, 10, 20), (2, 30, 40);
  CREATE TABLE other (v int);
  INSERT INTO other VALUES (100), (200), (300)
steps:
  - sql: |
      UPDATE pair SET x = y, y = x WHERE id = 1
    expect: ok
    comment: both assignments read the old row, so this is a swap
  - sql: |
      SELECT id, x, y FROM pair ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      UPDATE pair SET x = x + y WHERE id = 2
    expect: ok
  - sql: |
      UPDATE pair SET y = (SELECT max(v) FROM other) WHERE id = 2
    expect: ok
    comment: scalar subquery as the new value
  - sql: |
      SELECT id, x, y FROM pair ORDER BY id
    expect: rows
    order: ordered
