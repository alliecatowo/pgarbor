# The documentation states it is not an error for an UPDATE to match no rows; nothing changes.
id: doc-dml-update.no-match-is-not-error
title: UPDATE matching no rows succeeds and leaves the table unchanged
family: doc-dml-update
tier: core
feature_ids: [update, where-clause]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/dml.sgml#dml-update (This might cause zero, one, or many rows to be updated)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'a', 5), (2, 'b', 10)
steps:
  - sql: |
      UPDATE products SET price = 99 WHERE price = 1000
    expect: ok
    comment: zero rows matched, not an error
  - sql: |
      UPDATE products SET price = 99 WHERE product_no = 42
    expect: ok
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
