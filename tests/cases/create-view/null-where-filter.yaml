# Three-valued logic through a view: a NULL in the base column is excluded by a > filter,
# by NOT (a > 10) and by a plain comparison, but matched by IS NULL.
id: create-view.null-where-filter
title: NULL rows are filtered out of view predicates except IS NULL
family: create-view
tier: core
feature_ids: [create-view, select, nulls, where]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 functions-logical.html (three-valued logic); create_view.sql NULL handling"
sessions: [a]
setup: |
  CREATE TABLE nt (id int4 PRIMARY KEY, a int4);
  INSERT INTO nt VALUES (1, 5), (2, NULL), (3, 20);
  CREATE VIEW v_gt AS SELECT id, a FROM nt WHERE a > 10;
  CREATE VIEW v_not AS SELECT id FROM nt WHERE NOT (a > 10);
  CREATE VIEW v_isnull AS SELECT id FROM nt WHERE a IS NULL;
steps:
  - sql: |
      SELECT id, a FROM v_gt ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM v_not ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM v_isnull
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) AS total, count(a) AS non_null FROM v_gt
    expect: rows
