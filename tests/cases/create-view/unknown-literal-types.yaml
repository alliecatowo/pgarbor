# Untyped literals in a view definition are resolved to text or numeric, never left as unknown columns.
id: create-view.unknown-literal-types
title: Unknown literals in a view get concrete column types
family: create-view
tier: extended
feature_ids: [create-view, types, catalog-introspection]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_view.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      CREATE VIEW uspec AS SELECT 42 AS i, 42.5 AS num, 'foo' AS u, 'foo'::unknown AS u2, null AS n
    expect: ok
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_name = 'uspec' ORDER BY ordinal_position
    expect: rows
    order: ordered
  - sql: |
      SELECT i, num, u, u2, n FROM uspec
    expect: rows
    order: ordered
