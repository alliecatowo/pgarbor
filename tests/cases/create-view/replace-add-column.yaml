# CREATE OR REPLACE VIEW may append new columns; the replaced view reflects the new column list.
id: create-view.replace-add-column
title: CREATE OR REPLACE VIEW appends columns
family: create-view
tier: core
feature_ids: [create-view, create-or-replace, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_view.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE rt (a int, b text);
  INSERT INTO rt VALUES (1, 'one'), (2, NULL);
  CREATE VIEW rv AS SELECT a FROM rt;
steps:
  - sql: |
      CREATE OR REPLACE VIEW rv AS SELECT a, b FROM rt
    expect: ok
  - sql: |
      SELECT a, b FROM rv ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      CREATE OR REPLACE VIEW rv AS SELECT a, b, a * 2 AS twice FROM rt
    expect: ok
  - sql: |
      SELECT twice, b IS NULL AS b_null FROM rv ORDER BY twice
    expect: rows
    order: ordered
