# A view with a WHERE clause; outer ORDER BY decides row order, view-level ORDER BY is not relied on.
id: create-view.where-order-by
title: View with WHERE filter queried with an outer ORDER BY
family: create-view
tier: core
feature_ids: [create-view, select, where, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_view.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE viewtest_tbl (a int, b int, c numeric(10,1), d text COLLATE "C");
  INSERT INTO viewtest_tbl VALUES (5, 10, 1.1, 'xy'), (10, 15, 2.2, 'xyz'), (15, 20, 3.3, 'xyzz'), (20, 25, 4.4, 'xyzzy');
steps:
  - sql: |
      CREATE OR REPLACE VIEW viewtest AS SELECT * FROM viewtest_tbl WHERE a > 10
    expect: ok
  - sql: |
      SELECT a, b, c, d FROM viewtest ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      CREATE VIEW viewtest_ordered AS SELECT a, b FROM viewtest_tbl WHERE a > 5 ORDER BY b DESC
    expect: ok
  - sql: |
      SELECT a, b FROM viewtest_ordered ORDER BY b DESC, a
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM viewtest_ordered
    expect: rows
