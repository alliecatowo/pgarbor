# CREATE VIEW over a base table with an expression column, then reads through the view.
id: create-view.basic-select
title: Create a simple view with an expression column and read it back
family: create-view
tier: slice
feature_ids: [create-view, select, expressions]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_view.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE emp (name text, age int4, salary int4);
  INSERT INTO emp VALUES ('alice', 30, 1000), ('bob', 45, 2000), ('carol', NULL, 1500);
steps:
  - sql: |
      CREATE VIEW toyemp AS SELECT name, age, 12*salary AS annualsal FROM emp
    expect: ok
  - sql: |
      SELECT name, age, annualsal FROM toyemp ORDER BY name
    expect: rows
    order: ordered
  - sql: |
      SELECT annualsal FROM toyemp WHERE age IS NULL
    expect: rows
    order: multiset
