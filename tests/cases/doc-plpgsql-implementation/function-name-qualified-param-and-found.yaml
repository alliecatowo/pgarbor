# Parameters and the special variable FOUND are implicitly declared in an outer block labeled with the function
# name, so they can be qualified as fnfound.id and fnfound.found.
id: doc-plpgsql-implementation.function-name-qualified-param-and-found
title: Function name qualifies parameters and FOUND
family: doc-plpgsql-implementation
tier: core
feature_ids: [plpgsql, variable-conflict, found, block-labels]
required_capabilities: [create-table, insert, select, create-function, plpgsql]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-implementation (PL/pgSQL under the Hood: Variable Substitution)"
sessions: [a]
setup: |
  CREATE TABLE foo (foo int4);
  INSERT INTO foo VALUES (30);
  CREATE FUNCTION fnfound(id int) RETURNS text AS $$
  DECLARE r int;
  BEGIN
    PERFORM 1 FROM foo WHERE foo = id;
    RETURN CASE WHEN fnfound.found THEN 'found' ELSE 'none' END || ':' || fnfound.id;
  END;
  $$ LANGUAGE plpgsql;
steps:
  - sql: |
      SELECT fnfound(30)
    expect: rows
    order: ordered
    comment: a matching row sets FOUND true
  - sql: |
      SELECT fnfound(99)
    expect: rows
    order: ordered
    comment: no match leaves FOUND false
