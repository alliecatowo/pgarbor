# Unknown normalization form given as a string literal raises a run-time error; session stays usable.
# The bare normalize('abc', 'def') form is a syntax error (42601) in PG: normalize is a keyword and its
# form argument must be an NFC/NFD/NFKC/NFKD keyword. The schema-qualified function call reaches the
# run-time check (22023), so this case uses pg_catalog.normalize to test the run-time error.
id: unicode.normalize-invalid-form
title: normalize() with an unknown form raises a run-time error
family: unicode
tier: core
feature_ids: [unicode-normalize, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT pg_catalog.normalize('abc', 'def')
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT normalize('abc') = 'abc' AS still_usable
    expect: rows
