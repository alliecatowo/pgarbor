# Unknown normalization form given as a string literal raises a run-time error; session stays usable.
id: unicode.normalize-invalid-form
title: normalize() with an unknown form raises a run-time error
family: unicode
tier: core
feature_ids: [unicode-normalize, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT normalize('abc', 'def')
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT normalize('abc') = 'abc' AS still_usable
    expect: rows
