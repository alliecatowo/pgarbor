# IS [NFC|NFD|NFKC|NFKD] NORMALIZED predicate over a VALUES table, including the empty string.
id: unicode.is-normalized-predicate
title: IS NORMALIZED predicates for each form over composed, decomposed and compat inputs
family: unicode
tier: core
feature_ids: [unicode-normalize, is-normalized, select, values]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT U&'\00E4\24D1c' IS NORMALIZED AS test_default,
             U&'\00E4\24D1c' IS NFC NORMALIZED AS test_nfc
    expect: rows
    order: ordered
  - sql: |
      SELECT num, val,
          val IS NFC NORMALIZED AS nfc,
          val IS NFD NORMALIZED AS nfd,
          val IS NFKC NORMALIZED AS nfkc,
          val IS NFKD NORMALIZED AS nfkd
      FROM (VALUES (1, U&'\00E4bc'),
                   (2, U&'\0061\0308bc'),
                   (3, U&'\00E4\24D1c'),
                   (4, U&'\0061\0308\24D1c'),
                   (5, '')) vals (num, val)
      ORDER BY num
    expect: rows
    order: ordered
