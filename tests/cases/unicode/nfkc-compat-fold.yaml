# Compatibility forms: fullwidth letter and the fi ligature fold only under NFKC/NFKD, not NFC/NFD.
id: unicode.nfkc-compat-fold
title: NFKC and NFKD apply compatibility mappings; NFC and NFD do not
family: unicode
tier: extended
feature_ids: [unicode-normalize, is-normalized, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT
        encode(convert_to(normalize(U&'\FF21\FB01', NFC), 'UTF8'), 'hex') AS nfc,
        encode(convert_to(normalize(U&'\FF21\FB01', NFKC), 'UTF8'), 'hex') AS nfkc,
        encode(convert_to(normalize(U&'\FF21\FB01', NFKD), 'UTF8'), 'hex') AS nfkd,
        U&'\FF21\FB01' IS NFC NORMALIZED AS is_nfc,
        U&'\FF21\FB01' IS NFKC NORMALIZED AS is_nfkc
    expect: rows
    order: ordered
