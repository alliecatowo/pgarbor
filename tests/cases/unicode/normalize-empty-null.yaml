# normalize() on the empty string and on NULL (strict function: NULL in, NULL out).
id: unicode.normalize-empty-null
title: normalize() of empty string and NULL, with and without explicit form
family: unicode
tier: core
feature_ids: [unicode-normalize, select, null-handling]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT
        normalize('') = '' AS empty_default,
        normalize('', NFKD) = '' AS empty_nfkd,
        normalize(NULL::text) IS NULL AS null_default,
        normalize(NULL::text, NFC) IS NULL AS null_nfc
    expect: rows
    order: ordered
