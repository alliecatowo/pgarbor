# unicode_assigned() on assigned ASCII vs a noncharacter at U+10FFFF; unicode_version() is available.
id: unicode.assigned-codepoints
title: unicode_assigned() on assigned and unassigned code points, unicode_version() present
family: unicode
tier: core
feature_ids: [unicode-assigned, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT unicode_version() IS NOT NULL AS has_version
    expect: rows
    order: ordered
  - sql: |
      SELECT unicode_assigned(U&'abc') AS ascii_assigned,
             unicode_assigned(U&'abc\+10FFFF') AS with_noncharacter
    expect: rows
    order: ordered
