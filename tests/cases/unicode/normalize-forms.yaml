# Normalization forms NFC/NFD/NFKC/NFKD on one input with a combining mark and a circled letter.
id: unicode.normalize-forms
title: normalize() NFC, NFD, NFKC and NFKD over one decomposed/compat input
family: unicode
tier: core
feature_ids: [unicode-normalize, select, text]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT
        encode(convert_to(normalize(U&'\0061\0308\24D1c'), 'UTF8'), 'hex') AS default_form,
        encode(convert_to(normalize(U&'\0061\0308\24D1c', NFC), 'UTF8'), 'hex') AS nfc,
        encode(convert_to(normalize(U&'\0061\0308\24D1c', NFD), 'UTF8'), 'hex') AS nfd,
        encode(convert_to(normalize(U&'\0061\0308\24D1c', NFKC), 'UTF8'), 'hex') AS nfkc,
        encode(convert_to(normalize(U&'\0061\0308\24D1c', NFKD), 'UTF8'), 'hex') AS nfkd
    expect: rows
    order: ordered
