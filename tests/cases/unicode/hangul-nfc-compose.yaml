# Hangul jamo composition under NFC: L+V, LV+T, L+V+T, and the invalid TBASE cases that must stay decomposed.
id: unicode.hangul-nfc-compose
title: Hangul jamo composition to syllables under NFC, including invalid T-base sequences
family: unicode
tier: extended
feature_ids: [unicode-normalize, hangul, select, values]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT label,
             encode(convert_to(normalize(s, NFC), 'UTF8'), 'hex') AS nfc_hex
      FROM (VALUES
        ('lv_first',          U&'\1100\1161'),
        ('lv_last',           U&'\1112\1175'),
        ('lvt_first_t',       U&'\AC00\11A8'),
        ('lvt_last_t',        U&'\AC00\11C2'),
        ('lvt_last_lv',       U&'\D788\11A8'),
        ('full_lvt_first',    U&'\1100\1161\11A8'),
        ('full_lvt_last',     U&'\1112\1175\11C2'),
        ('tbase_not_combined', U&'\AC00\11A7'),
        ('lv_tbase_separate', U&'\1100\1161\11A7')
      ) v(label, s)
      ORDER BY label
    expect: rows
    order: ordered
