# NULL input to IS NORMALIZED predicates and is_normalized() yields NULL, not false.
id: unicode.is-normalized-null
title: NULL input to IS NORMALIZED and is_normalized() yields NULL
family: unicode
tier: extended
feature_ids: [is-normalized, null-handling]
required_capabilities: [select]
provenance:
  source: hand
  ref: "src/test/regress/sql/unicode.sql (NULL handling of normalize/is_normalized inferred from strict semantics)"
sessions: [a]
steps:
  - sql: |
      SELECT (NULL::text IS NFC NORMALIZED) IS NULL AS pred_null,
             is_normalized(NULL::text) IS NULL AS fn_null
    expect: rows
    order: ordered
