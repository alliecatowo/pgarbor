# Hangul syllables decompose into jamo under NFD.
id: unicode.hangul-nfd-decompose
title: Hangul syllables decompose to L/V/T jamo under NFD
family: unicode
tier: extended
feature_ids: [unicode-normalize, hangul, select, values]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/unicode.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT label,
             encode(convert_to(normalize(s, NFD), 'UTF8'), 'hex') AS nfd_hex
      FROM (VALUES
        ('lv',   U&'\AC00'),
        ('lvt',  U&'\AC01'),
        ('last', U&'\D7A3')
      ) v(label, s)
      ORDER BY label
    expect: rows
    order: ordered
