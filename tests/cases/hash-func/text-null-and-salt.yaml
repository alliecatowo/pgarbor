# Strict hash functions return NULL for NULL input; text salt-0 invariant holds.
id: hash-func.text-null-and-salt
title: "Text and bpchar hashes return NULL for NULL input and keep the salt-0 invariant"
family: hash-func
tier: core
feature_ids: [hash-functions, text, null-handling, hash-salt]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT hashtext(NULL::text) IS NULL AS text_null,
             hashtextextended(NULL::text, 0) IS NULL AS text_ext_null,
             hashbpchar(NULL::bpchar) IS NULL AS bpchar_null
    expect: rows
  - sql: |
      SELECT v,
             hashtext(v)::bit(32) = hashtextextended(v, 0)::bit(32) AS salt0_matches,
             hashtext(v)::bit(32) = hashtextextended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES ('PostgreSQL'::text), ('eIpUEtqmY89'), (''::text), ('muop28x03'), (NULL::text)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
