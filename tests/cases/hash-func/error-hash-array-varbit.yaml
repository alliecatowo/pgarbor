# Arrays whose element type has no hash function are rejected.
id: hash-func.error-hash-array-varbit
title: "hash_array over varbit[] fails: no hash function for element type"
family: hash-func
tier: core
feature_ids: [hash-functions, arrays, errors]
required_capabilities: [select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT hash_array('{101}'::varbit[])::bit(32)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT hash_array_extended('{101}'::varbit[], 0)::bit(32)
    expect: error
    sqlstate: "42883"
