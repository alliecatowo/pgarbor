# Records with a field whose type has no hash function cannot be hashed.
id: hash-func.error-hash-record-nonhashable
title: "hash_record over a composite with a varbit field fails: no hash function"
family: hash-func
tier: core
feature_ids: [hash-functions, composite-types, errors]
required_capabilities: [select, create-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
setup: |
  CREATE TYPE hash_test_t2 AS (a varbit, b text);
steps:
  - sql: |
      SELECT hash_record(row('10'::varbit, 'aaa')::hash_test_t2)::bit(32)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT hash_record_extended(row('11'::varbit, 'aaa')::hash_test_t2, 0)::bit(32)
    expect: error
    sqlstate: "42883"
