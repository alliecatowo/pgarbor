# bpchar comparison ignores trailing blanks, so its hashes must agree as well.
id: hash-func.bpchar-trailing-blanks
title: "bpchar hashes ignore trailing blanks like bpchar equality does"
family: hash-func
tier: extended
feature_ids: [hash-functions, bpchar, trailing-blanks]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT 'ab  '::bpchar = 'ab'::bpchar AS bpchar_eq,
             hashbpchar('ab  '::bpchar) = hashbpchar('ab'::bpchar) AS std_eq,
             hashbpcharextended('ab  '::bpchar, 0) = hashbpcharextended('ab'::bpchar, 0) AS ext0_eq,
             hashbpcharextended('ab  '::bpchar, 1) = hashbpcharextended('ab'::bpchar, 1) AS ext1_eq
    expect: rows
