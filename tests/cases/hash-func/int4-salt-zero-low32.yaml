# Salt 0 extended hash keeps the low 32 bits of the standard hash; salt 1 differs.
id: hash-func.int4-salt-zero-low32
title: "hashint4extended with salt 0 matches hashint4 in low 32 bits; salt 1 differs"
family: hash-func
tier: core
feature_ids: [hash-functions, int4, hash-salt]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT v,
             hashint4(v)::bit(32) = hashint4extended(v, 0)::bit(32) AS salt0_matches,
             hashint4(v)::bit(32) = hashint4extended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES (0), (1), (17), (42), (550273), (207112489), (-1)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
