# Negative zero and NaN hash identically to their positive/canonical forms.
id: hash-func.float-zero-nan-canonical
title: "Float hashes treat -0 like 0 and all NaN values alike"
family: hash-func
tier: core
feature_ids: [hash-functions, float4, float8, nan, negative-zero]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT hashfloat4('0'::float4) = hashfloat4('-0'::float4) AS zero4,
             hashfloat8('0'::float8) = hashfloat8('-0'::float8) AS zero8
    expect: rows
  - sql: |
      SELECT hashfloat4('NaN'::float4) = hashfloat4(-('NaN'::float4)) AS nan4,
             hashfloat8('NaN'::float8) = hashfloat8(-('NaN'::float8)) AS nan8,
             hashfloat4('NaN'::float4) = hashfloat8('NaN'::float8) AS nan_cross_width
    expect: rows
