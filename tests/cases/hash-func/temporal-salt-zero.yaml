# Temporal hash functions: salt-0 invariant for time, timetz, timestamp and interval, with NULLs.
id: hash-func.temporal-salt-zero
title: "time, timetz, timestamp and interval extended hashes keep the salt-0 invariant"
family: hash-func
tier: extended
feature_ids: [hash-functions, time-types, timestamp, interval, hash-salt, null-handling]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT v::text AS value,
             time_hash(v)::bit(32) = time_hash_extended(v, 0)::bit(32) AS salt0_matches
      FROM (VALUES ('11:09:59'::time), ('01:09:59'::time), ('11:59:59'::time), (NULL::time)) x(v)
      ORDER BY value
    expect: rows
    order: ordered
  - sql: |
      SELECT v::text AS value,
             timetz_hash(v)::bit(32) = timetz_hash_extended(v, 0)::bit(32) AS salt0_matches
      FROM (VALUES ('00:11:52.518762-07'::timetz), ('00:11:52.62+01'::timetz), ('11:59:59+04'::timetz), (NULL::timetz)) x(v)
      ORDER BY value
    expect: rows
    order: ordered
  - sql: |
      SELECT v::text AS value,
             timestamp_hash(v)::bit(32) = timestamp_hash_extended(v, 0)::bit(32) AS salt0_matches
      FROM (VALUES ('2017-08-22 00:09:59.518762'::timestamp), ('2013-08-22 11:59:59'::timestamp), (NULL::timestamp)) x(v)
      ORDER BY value
    expect: rows
    order: ordered
  - sql: |
      SELECT v::text AS value,
             interval_hash(v)::bit(32) = interval_hash_extended(v, 0)::bit(32) AS salt0_matches
      FROM (VALUES ('5 month 7 day 46 minutes'::interval), ('1 year 7 day 46 minutes'::interval),
                   ('17 year 11 month 7 day 9 hours 46 minutes 5 seconds'::interval), (NULL::interval)) x(v)
      ORDER BY value
    expect: rows
    order: ordered
