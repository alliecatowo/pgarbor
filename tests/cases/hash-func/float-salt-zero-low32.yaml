# Float4 and float8 extended hashes: salt 0 keeps the low 32 bits, salt 1 changes them.
id: hash-func.float-salt-zero-low32
title: "hashfloat4extended and hashfloat8extended with salt 0 match standard hash in low 32 bits"
family: hash-func
tier: extended
feature_ids: [hash-functions, float4, float8, hash-salt]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT v,
             hashfloat4(v)::bit(32) = hashfloat4extended(v, 0)::bit(32) AS salt0_matches,
             hashfloat4(v)::bit(32) = hashfloat4extended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES (0::float4), (1::float4), (17::float4), (42::float4), (550273::float4), (207112489::float4)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v,
             hashfloat8(v)::bit(32) = hashfloat8extended(v, 0)::bit(32) AS salt0_matches,
             hashfloat8(v)::bit(32) = hashfloat8extended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES (0::float8), (1::float8), (17::float8), (42::float8), (550273::float8), (207112489::float8)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
