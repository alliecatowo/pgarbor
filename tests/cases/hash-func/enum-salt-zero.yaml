# Enum hashing: salt-0 invariant over a small user-defined enum.
id: hash-func.enum-salt-zero
title: "Enum extended hash with salt 0 matches standard enum hash in low 32 bits"
family: hash-func
tier: extended
feature_ids: [hash-functions, enum, hash-salt]
required_capabilities: [select, values, create-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
steps:
  - sql: |
      SELECT v, hashenum(v)::bit(32) = hashenumextended(v, 0)::bit(32) AS salt0_matches,
             hashenum(v)::bit(32) = hashenumextended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES ('sad'::mood), ('ok'::mood), ('happy'::mood)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
