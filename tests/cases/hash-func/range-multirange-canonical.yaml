# Canonically equal ranges and multiranges hash equally; salt-0 invariant over ranges.
id: hash-func.range-multirange-canonical
title: "Canonically equal int4 ranges and multiranges hash equally"
family: hash-func
tier: extended
feature_ids: [hash-functions, range-types, multirange, hash-salt]
required_capabilities: [select, values, range-types]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT int4range(1, 4, '[]') = int4range(1, 5) AS range_eq,
             hash_range(int4range(1, 4, '[]'))::bit(32) = hash_range(int4range(1, 5))::bit(32) AS range_hash_eq,
             hash_multirange('{[1,3),[3,5)}'::int4multirange)::bit(32) = hash_multirange('{[1,5)}'::int4multirange)::bit(32) AS multirange_hash_eq
    expect: rows
  - sql: |
      SELECT lower(v) AS lo,
             hash_range(v)::bit(32) = hash_range_extended(v, 0)::bit(32) AS salt0_matches,
             hash_range(v)::bit(32) = hash_range_extended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES (int4range(10, 20)), (int4range(23, 43)), (int4range(5675, 550273))) x(v)
      ORDER BY lo
    expect: rows
    order: ordered
