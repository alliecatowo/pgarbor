# Same salt-0 invariant for int2 and int8 hash functions.
id: hash-func.int2-int8-salt-zero-low32
title: "hashint2extended and hashint8extended with salt 0 match standard hash in low 32 bits"
family: hash-func
tier: extended
feature_ids: [hash-functions, int2, int8, hash-salt]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT v,
             hashint2(v)::bit(32) = hashint2extended(v, 0)::bit(32) AS salt0_matches,
             hashint2(v)::bit(32) = hashint2extended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES (0::int2), (1::int2), (17::int2), (42::int2)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v,
             hashint8(v)::bit(32) = hashint8extended(v, 0)::bit(32) AS salt0_matches,
             hashint8(v)::bit(32) = hashint8extended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES (0::int8), (1::int8), (17::int8), (550273::int8), (207112489::int8)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
