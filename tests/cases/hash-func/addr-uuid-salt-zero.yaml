# Salt-0 invariant for macaddr, uuid and inet hash functions, including NULL rows.
id: hash-func.addr-uuid-salt-zero
title: "macaddr, uuid and inet extended hashes with salt 0 match standard hashes"
family: hash-func
tier: extended
feature_ids: [hash-functions, macaddr, uuid, inet, hash-salt, null-handling]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
steps:
  - sql: |
      SELECT v, hashmacaddr(v)::bit(32) = hashmacaddrextended(v, 0)::bit(32) AS salt0_matches
      FROM (VALUES ('08:00:2b:01:02:04'::macaddr), ('e2:7f:51:3e:70:49'::macaddr), (NULL::macaddr)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v, uuid_hash(v)::bit(32) = uuid_hash_extended(v, 0)::bit(32) AS salt0_matches
      FROM (VALUES ('a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11'::uuid), ('5a9ba4ac-8d6f-11e7-bb31-be2e44b06b34'::uuid), (NULL::uuid)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v, hashinet(v)::bit(32) = hashinetextended(v, 0)::bit(32) AS salt0_matches
      FROM (VALUES ('192.168.100.128/25'::inet), ('172.18.103.126/24'::inet), ('192.188.13.16/32'::inet), (NULL::inet)) x(v)
      ORDER BY v
    expect: rows
    order: ordered
