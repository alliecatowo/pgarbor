# Composite (record) hashing: salt-0 invariant and hash of a row with all-NULL fields.
id: hash-func.record-salt-zero
title: "Composite hash_record keeps the salt-0 invariant and hashes all-NULL rows"
family: hash-func
tier: core
feature_ids: [hash-functions, composite-types, hash-salt, null-handling]
required_capabilities: [select, values, create-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_func.sql"
setup: |
  CREATE TYPE hash_test_t1 AS (a int, b text);
steps:
  - sql: |
      SELECT v::text AS value,
             hash_record(v)::bit(32) = hash_record_extended(v, 0)::bit(32) AS salt0_matches,
             hash_record(v)::bit(32) = hash_record_extended(v, 1)::bit(32) AS salt1_matches
      FROM (VALUES (row(1, 'aaa')::hash_test_t1), (row(2, 'bbb')::hash_test_t1), (row(-1, 'ccc')::hash_test_t1)) x(v)
      ORDER BY value
    expect: rows
    order: ordered
  - sql: |
      SELECT hash_record(row(NULL::int, NULL::text)::hash_test_t1) IS NOT NULL AS all_null_hashed
    expect: rows
