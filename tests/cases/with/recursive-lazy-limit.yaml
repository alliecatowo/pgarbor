# An unbounded recursive CTE is only evaluated as far as the outer LIMIT requires.
id: with.recursive-lazy-limit
title: Outer LIMIT stops an otherwise infinite recursive CTE
family: with
tier: extended
feature_ids: [with-recursive, cte, limit, select]
required_capabilities: [with, select, limit]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          VALUES (1)
        UNION ALL
          SELECT n+1 FROM t
      )
      SELECT n FROM t LIMIT 10
    expect: rows
    order: multiset
    comment: no ORDER BY on purpose, since sorting would never finish
