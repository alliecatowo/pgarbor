# A recursive CTE may not reference itself inside its non-recursive term.
id: with.recursive-self-ref-in-anchor
title: Self-reference inside the non-recursive term is rejected
family: with
tier: core
feature_ids: [with-recursive, cte, errors]
required_capabilities: [with, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT n FROM t
        UNION ALL
          SELECT 1
      )
      SELECT * FROM t
    expect: error
    sqlstate: "42P19"
