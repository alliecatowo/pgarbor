# The recursive term must produce the same type as the non-recursive term.
id: with.recursive-union-type-mismatch
title: Recursive term producing text where the anchor is integer is rejected
family: with
tier: core
feature_ids: [with-recursive, cte, errors, type-checking]
required_capabilities: [with, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          VALUES (1)
        UNION ALL
          SELECT (n + 1)::text FROM t WHERE n < 3
      )
      SELECT n FROM t
    expect: error
    sqlstate: "42804"
    comment: anchor is int4, recursive term yields text
