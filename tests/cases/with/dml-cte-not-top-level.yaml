# Data-modifying statements inside WITH are only allowed at the top level of a query.
id: with.dml-cte-not-top-level
title: Data-modifying WITH inside a subquery is rejected
family: with
tier: extended
feature_ids: [with, data-modifying-cte, delete, subquery, errors]
required_capabilities: [with, create-table, delete, select, subqueries, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      SELECT * FROM (
        WITH d AS (DELETE FROM t RETURNING id)
        SELECT id FROM d
      ) s
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
