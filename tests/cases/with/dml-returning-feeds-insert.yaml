# Data-modifying WITH: DELETE ... RETURNING feeds an INSERT in the same statement.
id: with.dml-returning-feeds-insert
title: DELETE RETURNING inside WITH feeds an INSERT in one statement
family: with
tier: core
feature_ids: [with, data-modifying-cte, delete, insert, returning]
required_capabilities: [with, create-table, insert, delete, returning, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v text);
  INSERT INTO t VALUES (1, 'a'), (2, 'b'), (3, 'c');
steps:
  - sql: |
      WITH moved AS (
        DELETE FROM t WHERE id <= 2 RETURNING id, v
      )
      INSERT INTO t SELECT id + 10, v || '!' FROM moved RETURNING id, v
    expect: rows
    order: multiset
  - sql: |
      SELECT id, v, v IS NULL AS v_null FROM t ORDER BY id
    expect: rows
    order: ordered
