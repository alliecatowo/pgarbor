# A data-modifying CTE runs to completion even when the outer query never reads it.
id: with.dml-unreferenced-runs-to-completion
title: Unreferenced data-modifying WITH still performs its INSERT
family: with
tier: core
feature_ids: [with, data-modifying-cte, insert, primary-key]
required_capabilities: [with, create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      WITH x AS (
        INSERT INTO t VALUES (7) RETURNING id
      )
      SELECT 1 AS one
    expect: rows
    order: multiset
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the row 7 must be present even though x was never referenced
