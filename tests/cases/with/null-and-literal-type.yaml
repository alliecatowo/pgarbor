# NULL handling inside a CTE, and the type an unknown-typed literal resolves to in a CTE.
id: with.null-and-literal-type
title: NULLs inside a VALUES CTE and type resolution of a string literal
family: with
tier: core
feature_ids: [with, cte, nulls, aggregates, type-resolution]
required_capabilities: [with, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH q(x) AS (VALUES (NULL::int4), (1), (NULL::int4))
      SELECT count(x) AS non_null, count(*) AS total, sum(x) AS total_sum FROM q
    expect: rows
    order: multiset
    comment: count(x) ignores NULLs, count(*) does not
  - sql: |
      WITH q AS (SELECT 'foo' AS x)
      SELECT x, pg_typeof(x) FROM q
    expect: rows
    order: multiset
    comment: an unknown-typed literal is resolved when the CTE is built
