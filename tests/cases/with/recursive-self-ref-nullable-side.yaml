# A recursive reference may not sit on the nullable side of an outer join.
id: with.recursive-self-ref-nullable-side
title: Recursive reference on the nullable side of a LEFT JOIN is rejected
family: with
tier: extended
feature_ids: [with-recursive, cte, joins, errors]
required_capabilities: [with, select, join, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT 1
        UNION ALL
          SELECT s.n + 1
          FROM (SELECT 1 AS k) k
          LEFT JOIN t s ON true
          WHERE s.n < 3
      )
      SELECT n FROM t
    expect: error
    sqlstate: "42P19"
