# UNION (not UNION ALL) in a recursive CTE discards duplicate rows, so a cycle terminates.
id: with.recursive-union-dedup-terminates
title: Recursive UNION discards duplicates and terminates on a 2-cycle
family: with
tier: core
feature_ids: [with-recursive, cte, union, select]
required_capabilities: [with, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          SELECT 1
        UNION
          SELECT 10-n FROM t
      )
      SELECT n FROM t ORDER BY n
    expect: rows
    order: ordered
    comment: the values alternate between two numbers; UNION dedup stops the recursion
