# Recursive CTE generating 1..100 via UNION ALL, then aggregated.
id: with.recursive-series-sum
title: Recursive CTE with UNION ALL generates a 100-row series
family: with
tier: core
feature_ids: [with-recursive, cte, select, aggregates]
required_capabilities: [with, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH RECURSIVE t(n) AS (
          VALUES (1)
        UNION ALL
          SELECT n+1 FROM t WHERE n < 100
      )
      SELECT sum(n), count(*), min(n), max(n) FROM t
    expect: rows
    order: multiset
    comment: sum over 1..100 with the recursive term stopping at n = 100
