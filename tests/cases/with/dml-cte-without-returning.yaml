# A data-modifying WITH query must have RETURNING before its output can be referenced.
id: with.dml-cte-without-returning
title: Referencing a data-modifying WITH that has no RETURNING clause is rejected
family: with
tier: core
feature_ids: [with, data-modifying-cte, delete, errors]
required_capabilities: [with, create-table, delete, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      WITH d AS (
        DELETE FROM t
      )
      SELECT * FROM d
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    order: multiset
    comment: the failed statement must not have deleted the row
