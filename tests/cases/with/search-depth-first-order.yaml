# SEARCH DEPTH FIRST adds a sequence column that orders the recursive output depth-first.
id: with.search-depth-first-order
title: SEARCH DEPTH FIRST BY produces depth-first ordering in a sequence column
family: with
tier: extended
feature_ids: [with-recursive, search-clause, cte, order-by]
required_capabilities: [with, create-table, insert, select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE graph0 (f int4, t int4, label text);
  INSERT INTO graph0 VALUES
    (1, 2, 'arc 1 -> 2'),
    (1, 3, 'arc 1 -> 3'),
    (2, 3, 'arc 2 -> 3'),
    (1, 4, 'arc 1 -> 4'),
    (4, 5, 'arc 4 -> 5'),
    (5, 6, 'arc 5 -> 6');
steps:
  - sql: |
      WITH RECURSIVE search_graph(f, t, label) AS (
          SELECT g.f, g.t, g.label FROM graph0 g WHERE g.f = 1
        UNION ALL
          SELECT g.f, g.t, g.label FROM graph0 g, search_graph sg WHERE g.f = sg.t
      )
      SEARCH DEPTH FIRST BY f, t SET seq
      SELECT f, t, label, seq FROM search_graph ORDER BY seq
    expect: rows
    order: ordered
