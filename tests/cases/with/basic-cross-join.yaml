# Basic non-recursive WITH: a CTE referenced twice in the outer FROM list.
id: with.basic-cross-join
title: Non-recursive CTE referenced twice in the outer FROM clause
family: with
tier: core
feature_ids: [with, cte, select, cross-join]
required_capabilities: [with, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
steps:
  - sql: |
      WITH q1(x,y) AS (SELECT 1,2)
      SELECT * FROM q1, q1 AS q2
    expect: rows
    order: multiset
