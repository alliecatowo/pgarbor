# CYCLE clause marks the revisited edge and stops expansion along the cycle.
id: with.cycle-clause-terminates
title: CYCLE clause flags a back-edge and stops the recursion
family: with
tier: extended
feature_ids: [with-recursive, cycle-clause, cte, select]
required_capabilities: [with, create-table, insert, select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/with.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE graph1 (f int4, t int4);
  INSERT INTO graph1 VALUES (1, 2), (2, 3), (3, 1), (3, 4);
steps:
  - sql: |
      WITH RECURSIVE search_graph(f, t) AS (
          SELECT g.f, g.t FROM graph1 g WHERE g.f = 1
        UNION ALL
          SELECT g.f, g.t FROM graph1 g, search_graph sg WHERE g.f = sg.t
      )
      CYCLE f, t SET is_cycle USING path
      SELECT f, t, is_cycle FROM search_graph ORDER BY f, t
    expect: rows
    order: ordered
    comment: the 3 -> 1 edge closes the cycle and must be flagged rather than expanded
