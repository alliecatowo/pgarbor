# GENERATED BY DEFAULT identity: explicit values are accepted unless OVERRIDING USER VALUE discards them.
id: cmd-merge.identity-by-default-overriding-user
title: MERGE OVERRIDING USER VALUE discards explicit identity values for GENERATED BY DEFAULT columns
family: cmd-merge
tier: core
feature_ids: [merge, identity-columns, overriding-user-value, insert, returning]
required_capabilities: [create-table, insert, select, merge, identity, returning]
provenance:
  source: pg-docs
  ref: "ref/merge.sgml (merge_insert: OVERRIDING USER VALUE)"
setup: |
  CREATE TABLE bd (id integer GENERATED BY DEFAULT AS IDENTITY, v integer);
steps:
  - sql: |
      MERGE INTO bd t
      USING (VALUES (10, 1)) s(id, v)
      ON false
      WHEN NOT MATCHED THEN
        INSERT (id, v) VALUES (s.id, s.v)
      RETURNING t.id, t.v
    expect: rows
    order: multiset
    comment: expect (10, 1); explicit value accepted for BY DEFAULT
  - sql: |
      MERGE INTO bd t
      USING (VALUES (20, 2)) s(id, v)
      ON false
      WHEN NOT MATCHED THEN
        INSERT (id, v) OVERRIDING USER VALUE VALUES (s.id, s.v)
      RETURNING t.id, t.v
    expect: rows
    order: multiset
    comment: expect (1, 2); the supplied 20 is ignored and the sequence supplies 1
