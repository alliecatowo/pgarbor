# RETURNING WITH (OLD AS o, NEW AS n) exposes old and new target rows; NULL on the side that does not exist for that action.
id: cmd-merge.returning-old-new-aliases
title: MERGE RETURNING with OLD/NEW aliases yields NULL images for DELETE and INSERT actions
family: cmd-merge
tier: core
feature_ids: [merge, returning, old-new-alias, merge-action, delete, insert]
required_capabilities: [create-table, insert, select, delete, merge, returning]
provenance:
  source: pg-docs
  ref: "ref/merge.sgml (RETURNING WITH (OLD AS output_alias, NEW AS output_alias); merge_action())"
setup: |
  CREATE TABLE tgt (id integer PRIMARY KEY, a integer);
  CREATE TABLE src (id integer, v integer);
  INSERT INTO tgt VALUES (1, 10), (2, 20);
  INSERT INTO src VALUES (1, 100), (3, 300);
steps:
  - sql: |
      MERGE INTO tgt t
      USING src s
      ON t.id = s.id
      WHEN MATCHED THEN
        DELETE
      WHEN NOT MATCHED THEN
        INSERT (id, a) VALUES (s.id, s.v)
      RETURNING WITH (OLD AS o, NEW AS n) merge_action(), o.id AS old_id, o.a AS old_a, n.id AS new_id, n.a AS new_a
    expect: rows
    order: multiset
    comment: expect ('DELETE',1,10,NULL,NULL) and ('INSERT',NULL,NULL,3,300)
  - sql: |
      SELECT id, a FROM tgt ORDER BY id
    expect: rows
    order: ordered
    comment: expect (2,20), (3,300)
