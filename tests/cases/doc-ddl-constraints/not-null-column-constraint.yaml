# NOT NULL column constraints, including a named one, enforced on INSERT and UPDATE.
id: doc-ddl-constraints.not-null-column-constraint
title: NOT NULL and named NOT NULL constraints reject NULL on insert and update
family: doc-ddl-constraints
tier: core
feature_ids: [not-null-constraints, constraints, insert, update, select]
required_capabilities: [create-table, constraints, insert, update, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-constraints (Not-Null Constraints)"
sessions: [a]
setup: |
  CREATE TABLE products (
      product_no integer NOT NULL,
      name text CONSTRAINT products_name_not_null NOT NULL,
      price numeric
  )
steps:
  - sql: |
      INSERT INTO products VALUES (1, 'x', NULL)
    expect: ok
    comment: price is nullable
  - sql: |
      INSERT INTO products VALUES (NULL, 'y', 1)
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO products VALUES (2, NULL, 1)
    expect: error
    sqlstate: "23502"
    comment: violates the named constraint products_name_not_null
  - sql: |
      UPDATE products SET name = NULL WHERE product_no = 1
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO products VALUES (3, 'z', NULL)
    expect: ok
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
