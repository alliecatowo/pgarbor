# The NULL column constraint is the default; NOT NULL can be added and dropped with ALTER TABLE.
id: doc-ddl-constraints.null-keyword-toggle
title: Explicit NULL keyword is the default and NOT NULL can be toggled
family: doc-ddl-constraints
tier: core
feature_ids: [not-null-constraints, null-keyword, alter-table, insert, select]
required_capabilities: [create-table, constraints, alter-table, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-constraints (Not-Null Constraints, NULL constraint)"
sessions: [a]
setup: |
  CREATE TABLE products (
      product_no integer NULL,
      name text NULL,
      price numeric NULL
  )
steps:
  - sql: |
      INSERT INTO products VALUES (NULL, NULL, NULL)
    expect: ok
  - sql: |
      ALTER TABLE products ALTER COLUMN name SET NOT NULL
    expect: error
    sqlstate: "23502"
    comment: the existing row has a NULL name, so the table scan fails
  - sql: |
      DELETE FROM products
    expect: ok
  - sql: |
      ALTER TABLE products ALTER COLUMN name SET NOT NULL
    expect: ok
  - sql: |
      INSERT INTO products VALUES (1, NULL, NULL)
    expect: error
    sqlstate: "23502"
  - sql: |
      ALTER TABLE products ALTER COLUMN name DROP NOT NULL
    expect: ok
  - sql: |
      INSERT INTO products VALUES (1, NULL, NULL)
    expect: ok
  - sql: |
      SELECT product_no, name, price FROM products
    expect: rows
    order: multiset
