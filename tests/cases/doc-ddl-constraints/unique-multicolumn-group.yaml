# A multi-column UNIQUE constraint constrains the combination, not each column alone.
id: doc-ddl-constraints.unique-multicolumn-group
title: Multi-column UNIQUE constrains the tuple of values, not each column
family: doc-ddl-constraints
tier: core
feature_ids: [unique-constraints, insert, select]
required_capabilities: [create-table, constraints, unique-constraints, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-constraints (Unique Constraints, group of columns)"
sessions: [a]
setup: |
  CREATE TABLE example (a integer, b integer, c integer, UNIQUE (a, c))
steps:
  - sql: |
      INSERT INTO example VALUES (1, 1, 1)
    expect: ok
  - sql: |
      INSERT INTO example VALUES (1, 2, 2)
    expect: ok
    comment: a repeats but the pair (a, c) is new
  - sql: |
      INSERT INTO example VALUES (2, 9, 1)
    expect: ok
  - sql: |
      INSERT INTO example VALUES (1, 3, 1)
    expect: error
    sqlstate: "23505"
    comment: the pair (1, 1) already exists
  - sql: |
      INSERT INTO example VALUES (NULL, 5, 1), (NULL, 5, 1)
    expect: ok
    comment: a NULL in the group means the pair is not equal under NULLS DISTINCT
  - sql: |
      SELECT a, b, c FROM example
    expect: rows
    order: multiset
