# NULLS NOT DISTINCT (column and table forms) makes NULLs compare equal, so a second NULL violates UNIQUE.
id: doc-ddl-constraints.unique-nulls-not-distinct
title: UNIQUE NULLS NOT DISTINCT rejects a second NULL in both column and table forms
family: doc-ddl-constraints
tier: extended
feature_ids: [unique-constraints, null-semantics, nulls-not-distinct, insert, select]
required_capabilities: [create-table, constraints, unique-constraints, insert, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-constraints (Unique Constraints, NULLS NOT DISTINCT)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no integer UNIQUE NULLS NOT DISTINCT, name text, price numeric);
  CREATE TABLE products2 (product_no integer, name text, price numeric, UNIQUE NULLS NOT DISTINCT (product_no))
steps:
  - sql: |
      INSERT INTO products VALUES (NULL, 'a', 1)
    expect: ok
  - sql: |
      INSERT INTO products VALUES (NULL, 'b', 2)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO products VALUES (1, 'c', 3)
    expect: ok
  - sql: |
      INSERT INTO products VALUES (1, 'd', 4)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO products2 VALUES (NULL, 'e', 5)
    expect: ok
  - sql: |
      INSERT INTO products2 VALUES (NULL, 'f', 6)
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT product_no, name FROM products ORDER BY name
    expect: rows
    order: ordered
