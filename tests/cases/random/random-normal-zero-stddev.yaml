# random_normal(mean, 0) is constant and equal to the mean; named arguments bind by name.
id: random.normal-zero-stddev
title: random_normal with zero standard deviation returns the mean exactly
family: random
tier: core
feature_ids: [random-function, float8, aggregates]
required_capabilities: [random-function, float8, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT r, count(*) FROM (SELECT random_normal(10, 0) r FROM generate_series(1, 100)) ss GROUP BY r
    expect: rows
    order: multiset
  - sql: |
      SELECT r, count(*) FROM (SELECT random_normal(-10, 0) r FROM generate_series(1, 100)) ss GROUP BY r
    expect: rows
    order: multiset
  - sql: |
      SELECT random_normal(mean => 1, stddev => 0) AS r
    expect: rows
    order: ordered
