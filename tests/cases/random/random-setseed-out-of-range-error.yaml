# setseed() accepts only values in [-1, 1]; anything else is invalid_parameter_value.
id: random.setseed-out-of-range-error
title: setseed rejects seed values outside [-1, 1]
family: random
tier: core
feature_ids: [random-function, setseed, errors]
required_capabilities: [random-function, setseed, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT setseed(1.5)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT setseed(-1.0001)
    expect: error
    sqlstate: "22023"
