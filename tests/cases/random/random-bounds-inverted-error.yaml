# Inverted bounds for random(min, max) are rejected; every integer, bigint and numeric overload checks min <= max.
id: random.bounds-inverted-error
title: random(min, max) rejects lower bound greater than upper bound
family: random
tier: core
feature_ids: [random-function, errors]
required_capabilities: [random-function, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT random(1::int4, 0::int4)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT random(1000000000001::int8, 1000000000000::int8)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT random(-2.0::numeric, -3.0::numeric)
    expect: error
    sqlstate: "22023"
