# setseed() makes the random() sequence reproducible within a session; the same seed gives the same values.
id: random.setseed-reproducible
title: setseed makes random() output reproducible for the same seed
family: random
tier: extended
feature_ids: [random-function, setseed]
required_capabilities: [random-function, setseed]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT setseed(0.5)
    expect: rows
    order: ordered
  - sql: |
      SELECT random() AS r FROM generate_series(1, 10) ORDER BY r
    expect: rows
    order: ordered
    comment: first run after seed 0.5
  - sql: |
      SELECT setseed(0.5)
    expect: rows
    order: ordered
  - sql: |
      SELECT random() AS r FROM generate_series(1, 10) ORDER BY r
    expect: rows
    order: ordered
    comment: must equal the previous run exactly
