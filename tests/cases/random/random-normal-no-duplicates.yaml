# 1000 draws from random_normal() with a positive standard deviation contain no duplicate values.
id: random.normal-no-duplicates
title: random_normal() produces no duplicates in 1000 draws
family: random
tier: extended
feature_ids: [random-function, float8, aggregates]
required_capabilities: [random-function, float8, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT r, count(*) FROM (SELECT random_normal() r FROM generate_series(1, 1000)) ss
      GROUP BY r HAVING count(*) > 1
    expect: rows
    order: multiset
    comment: expects zero rows
