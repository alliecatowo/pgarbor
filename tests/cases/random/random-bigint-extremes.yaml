# random(int8, int8) accepts the full bigint range and produces values near both extremes.
id: random.bigint-extremes
title: random(int8, int8) over the full bigint range hits both tails
family: random
tier: extended
feature_ids: [random-function, int8]
required_capabilities: [random-function, int8]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT count(*) FILTER (WHERE r < '-9038904596117680292'::int8) > 0 AS has_small,
             count(*) FILTER (WHERE r > '9038904596117680291'::int8) > 0 AS has_large,
             count(*) FILTER (WHERE r < '-9223372036854775808'::int8
                              OR r > '9223372036854775807'::int8) AS out_of_range
      FROM (SELECT random('-9223372036854775808'::int8, '9223372036854775807'::int8) r
            FROM generate_series(1, 2000)) ss
    expect: rows
    order: ordered
