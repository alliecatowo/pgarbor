# When min equals max the only possible value is returned, for int4, int8 and numeric overloads.
id: random.empty-range
title: random(min, max) with min equal to max returns that value
family: random
tier: core
feature_ids: [random-function, numeric]
required_capabilities: [random-function, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT random(101::int4, 101::int4) AS i4,
             random(1000000000001::int8, 1000000000001::int8) AS i8,
             random(3.14::numeric, 3.14::numeric) AS n
    expect: rows
    order: ordered
