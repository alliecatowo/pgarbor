# NaN and infinite numeric bounds are rejected with a specific message; SQLSTATE is invalid_parameter_value.
id: random.bounds-nan-infinity-error
title: random(numeric, numeric) rejects NaN and infinite bounds
family: random
tier: core
feature_ids: [random-function, numeric, errors]
required_capabilities: [random-function, numeric, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT random('NaN'::numeric, 10::numeric)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT random('-Inf'::numeric, 0::numeric)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT random(0::numeric, 'NaN'::numeric)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT random(0::numeric, 'Inf'::numeric)
    expect: error
    sqlstate: "22023"
