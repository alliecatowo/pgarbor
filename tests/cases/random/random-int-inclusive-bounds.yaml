# random(min, max) for int4 is inclusive at both ends: 2500 draws from a 100-value range cover all 100 values.
id: random.int-inclusive-bounds
title: random(int4, int4) covers both inclusive endpoints and stays in range
family: random
tier: core
feature_ids: [random-function, select, aggregates]
required_capabilities: [random-function, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT min(r), max(r), count(*) FROM
        (SELECT DISTINCT random(-50::int4, 49::int4) r FROM generate_series(1, 2500)) ss
    expect: rows
    order: ordered
    comment: all 100 values occur with overwhelming probability; endpoints -50 and 49 both included
  - sql: |
      SELECT count(*) FILTER (WHERE r < -50 OR r > 49) AS out_of_range
      FROM (SELECT random(-50::int4, 49::int4) r FROM generate_series(1, 2000)) ss
    expect: rows
    order: ordered
