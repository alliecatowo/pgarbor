# random(numeric, numeric) returns values in the closed interval [min, max] including negative bounds.
id: random.numeric-range
title: random(numeric, numeric) stays within negative and fractional bounds
family: random
tier: core
feature_ids: [random-function, numeric]
required_capabilities: [random-function, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT count(*) FILTER (WHERE r < -0.4 OR r > 0.4) AS out_of_range,
             (count(*) FILTER (WHERE r < -0.39)) > 0 AS has_small,
             (count(*) FILTER (WHERE r > 0.39)) > 0 AS has_large
      FROM (SELECT random(-0.4::numeric, 0.4::numeric) r FROM generate_series(1, 2000)) ss
    expect: rows
    order: ordered
