# The integer and numeric random(min, max) overloads are strict: a NULL bound yields NULL, not an error.
id: random.null-bounds
title: random(min, max) returns NULL when either bound is NULL
family: random
tier: core
feature_ids: [random-function, nulls]
required_capabilities: [random-function, nulls]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/random.sql"
sessions: [a]
steps:
  - sql: |
      SELECT random(NULL::int4, 10::int4) IS NULL AS a,
             random(1::int8, NULL::int8) IS NULL AS b,
             random(NULL::numeric, 1::numeric) IS NULL AS c
    expect: rows
    order: ordered
