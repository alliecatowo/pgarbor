# The (query) form of COPY only exists for TO; COPY (SELECT ...) FROM is a syntax error.
id: copy.query-form-from-syntax
title: "COPY (query) FROM is a syntax error"
family: copy
tier: core
feature_ids: [copy, errors]
required_capabilities: [copy, errors]
provenance:
  source: hand
  ref: "PG18 sql-copy.html (synopsis: COPY { table_name | ( query ) } TO)"
sessions: [a]
steps:
  - sql: |
      COPY (SELECT 1 AS a) FROM STDIN
    expect: error
    sqlstate: "42601"
