# WHERE filtering is only accepted for COPY FROM; COPY TO with WHERE is a syntax error.
id: copy.where-on-to-syntax
title: "COPY TO with a WHERE clause is a syntax error"
family: copy
tier: core
feature_ids: [copy, errors]
required_capabilities: [create-table, copy, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copy.sql (COPY ... WHERE salary < 2000 used with FROM only)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE cp_t (a int4);
steps:
  - sql: |
      COPY cp_t TO STDOUT WHERE a > 0
    expect: error
    sqlstate: "42601"
