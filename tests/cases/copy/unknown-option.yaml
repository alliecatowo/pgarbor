# An option name COPY does not know is rejected before the copy starts.
id: copy.unknown-option
title: "COPY rejects an unknown option name"
family: copy
tier: core
feature_ids: [copy, copy-options, errors]
required_capabilities: [create-table, copy, errors]
provenance:
  source: hand
  ref: "PG18 sql-copy.html (COPY options)"
sessions: [a]
setup: |
  CREATE TABLE cp_t (a int4);
steps:
  - sql: |
      COPY cp_t FROM STDIN WITH (nosuch true)
    expect: error
    sqlstate: "42601"
    comment: sqlstate believed to be syntax_error; recorder pins it
