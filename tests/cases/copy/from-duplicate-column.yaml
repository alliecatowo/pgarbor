# A column list naming the same column twice is rejected.
id: copy.from-duplicate-column
title: "COPY FROM rejects a column list that names the same column twice"
family: copy
tier: core
feature_ids: [copy, errors, create-table]
required_capabilities: [create-table, select, copy, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copy.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE cp_t (a int4, b text);
steps:
  - sql: |
      COPY cp_t (a, a) FROM STDIN
    expect: error
    sqlstate: "42701"
    comment: sqlstate believed to be duplicate_column; recorder pins it
