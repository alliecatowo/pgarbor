# A generated column cannot be named in a COPY FROM column list.
id: copy.generated-column-rejected
title: "COPY FROM rejects a generated column in its column list"
family: copy
tier: core
feature_ids: [copy, generated-columns, errors]
required_capabilities: [create-table, copy, generated-columns, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copy.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE cp_g (a int4, g int4 GENERATED ALWAYS AS (a * 2) STORED);
steps:
  - sql: |
      COPY cp_g (a, g) FROM STDIN
    expect: error
    sqlstate: "42P10"
  - sql: |
      SELECT count(*) FROM cp_g
    expect: rows
    order: ordered
