# COPY FROM cannot target a view without an INSTEAD OF INSERT trigger.
id: copy.into-view-rejected
title: "COPY FROM into a view is rejected"
family: copy
tier: core
feature_ids: [copy, views, errors]
required_capabilities: [copy, views, errors]
provenance:
  source: hand
  ref: "PG18 sql-copy.html; errcode 42809 wrong_object_type"
sessions: [a]
setup: |
  CREATE VIEW cp_v AS SELECT 1 AS a;
steps:
  - sql: |
      COPY cp_v FROM STDIN
    expect: error
    sqlstate: "42809"
