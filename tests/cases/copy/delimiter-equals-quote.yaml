# CSV delimiter and quote characters must differ; the option check fails before any output.
id: copy.delimiter-equals-quote
title: "COPY CSV rejects a delimiter equal to the quote character"
family: copy
tier: core
feature_ids: [copy, copy-options, errors]
required_capabilities: [create-table, copy, errors]
provenance:
  source: hand
  ref: "PG18 sql-copy.html (CSV format: DELIMITER and QUOTE must differ)"
sessions: [a]
setup: |
  CREATE TABLE cp_t (a int4, b text);
steps:
  - sql: |
      COPY cp_t TO STDOUT (FORMAT csv, DELIMITER ',', QUOTE ',')
    expect: error
    comment: sqlstate not pinned; recorder records the actual one
