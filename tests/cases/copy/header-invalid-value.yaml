# HEADER takes a Boolean or the keyword match; any other value is a syntax-level option error.
id: copy.header-invalid-value
title: "COPY HEADER with an unrecognized value is rejected"
family: copy
tier: core
feature_ids: [copy, copy-options, errors]
required_capabilities: [create-table, copy, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copy.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE cp_t (a int4, b text);
steps:
  - sql: |
      COPY cp_t FROM STDIN WITH (header wrong_choice)
    expect: error
    sqlstate: "42601"
    comment: regress expects an error; sqlstate believed to be syntax_error
