# COPY TO refuses an unpopulated materialized view; after REFRESH the view is readable.
id: copy.matview-unpopulated
title: "COPY TO an unpopulated materialized view fails until it is refreshed"
family: copy
tier: core
feature_ids: [copy, materialized-views, errors]
required_capabilities: [create-table, insert, select, copy, materialized-views, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copy.sql (copytest_mv section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE cp_base (id int4);
  INSERT INTO cp_base VALUES (1);
  CREATE MATERIALIZED VIEW cp_mv AS SELECT id FROM cp_base WITH NO DATA;
steps:
  - sql: |
      COPY cp_mv (id) TO STDOUT WITH (header)
    expect: error
    sqlstate: "55000"
  - sql: |
      REFRESH MATERIALIZED VIEW cp_mv
    expect: ok
  - sql: |
      SELECT id FROM cp_mv ORDER BY id
    expect: rows
    order: ordered
