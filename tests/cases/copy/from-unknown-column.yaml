# COPY FROM STDIN with a column list naming a nonexistent column fails before any data is read.
id: copy.from-unknown-column
title: "COPY FROM rejects an unknown column in the column list and inserts nothing"
family: copy
tier: core
feature_ids: [copy, errors, create-table]
required_capabilities: [create-table, select, copy, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copy.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE cp_t (a int4, b text);
steps:
  - sql: |
      COPY cp_t (a, nosuch) FROM STDIN
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT count(*) FROM cp_t
    expect: rows
    order: ordered
