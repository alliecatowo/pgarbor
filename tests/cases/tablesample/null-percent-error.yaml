# A NULL sampling percentage is rejected for both methods.
id: tablesample.null-percent-error
title: NULL sampling percentage raises invalid_tablesample_argument
family: tablesample
tier: core
feature_ids: [tablesample, errors, null-handling]
required_capabilities: [create-table, insert, select, tablesample, storage-parameters]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text) WITH (fillfactor=10);
  INSERT INTO test_tablesample SELECT i, repeat(i::text, 200) FROM generate_series(0, 9) s(i);
steps:
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (NULL)
    expect: error
    sqlstate: "2202H"
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE BERNOULLI (NULL)
    expect: error
    sqlstate: "2202H"
