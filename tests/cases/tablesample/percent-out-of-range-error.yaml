# Percentages below 0 or above 100 are rejected for both methods; boundaries 0 and 100 are not.
id: tablesample.percent-out-of-range-error
title: Sampling percentage outside [0, 100] raises invalid_tablesample_argument
family: tablesample
tier: core
feature_ids: [tablesample, errors, boundaries]
required_capabilities: [create-table, insert, select, tablesample, storage-parameters]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text) WITH (fillfactor=10);
  INSERT INTO test_tablesample SELECT i, repeat(i::text, 200) FROM generate_series(0, 9) s(i);
steps:
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE BERNOULLI (-1)
    expect: error
    sqlstate: "2202H"
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE BERNOULLI (200)
    expect: error
    sqlstate: "2202H"
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (-1)
    expect: error
    sqlstate: "2202H"
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (200)
    expect: error
    sqlstate: "2202H"
  - sql: |
      SELECT count(*) FROM test_tablesample TABLESAMPLE BERNOULLI (100.0)
    expect: rows
    order: multiset
    comment: upper boundary 100 is accepted
