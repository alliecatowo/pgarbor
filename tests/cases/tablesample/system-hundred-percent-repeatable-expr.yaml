# REPEATABLE accepts expressions and numerics; 100 percent still yields every row.
id: tablesample.system-hundred-percent-repeatable-expr
title: REPEATABLE seed as an expression or numeric keeps 100 percent sampling complete
family: tablesample
tier: core
feature_ids: [tablesample, select, aggregates, expressions]
required_capabilities: [create-table, insert, select, tablesample, storage-parameters]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text) WITH (fillfactor=10);
  INSERT INTO test_tablesample SELECT i, repeat(i::text, 200) FROM generate_series(0, 9) s(i);
steps:
  - sql: |
      SELECT count(*) FROM test_tablesample TABLESAMPLE SYSTEM (100) REPEATABLE (1+2)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM test_tablesample TABLESAMPLE SYSTEM (100) REPEATABLE (0.4)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM test_tablesample TABLESAMPLE BERNOULLI (100) REPEATABLE (1 + 1 * 0)
    expect: rows
    order: multiset
