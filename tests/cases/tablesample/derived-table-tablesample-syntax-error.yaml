# TABLESAMPLE is only valid after a table reference, not after a parenthesized subquery.
id: tablesample.derived-table-syntax-error
title: TABLESAMPLE after a derived table is a syntax error
family: tablesample
tier: extended
feature_ids: [tablesample, subselect, errors]
required_capabilities: [create-table, insert, select, tablesample, subqueries]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text);
  INSERT INTO test_tablesample VALUES (1, 'a'), (2, 'b');
steps:
  - sql: |
      SELECT q.* FROM (SELECT * FROM test_tablesample) AS q TABLESAMPLE BERNOULLI (5)
    expect: error
    sqlstate: "42601"
