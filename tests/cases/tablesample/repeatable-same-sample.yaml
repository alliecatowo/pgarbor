# The same REPEATABLE seed and percentage must select the same rows when issued again.
id: tablesample.repeatable-same-sample
title: Identical REPEATABLE sample queries return identical row sets
family: tablesample
tier: core
feature_ids: [tablesample, select]
required_capabilities: [create-table, insert, select, tablesample, storage-parameters]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text) WITH (fillfactor=10);
  INSERT INTO test_tablesample SELECT i, repeat(i::text, 200) FROM generate_series(0, 9) s(i);
steps:
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (50) REPEATABLE (0) ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (50) REPEATABLE (0) ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE BERNOULLI (50) REPEATABLE (0) ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE BERNOULLI (50) REPEATABLE (0) ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (100.0/11) REPEATABLE (0) ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE BERNOULLI (5.5) REPEATABLE (0) ORDER BY id
    expect: rows
    order: ordered
