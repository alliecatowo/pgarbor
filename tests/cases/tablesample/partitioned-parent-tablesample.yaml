# TABLESAMPLE is accepted on a partitioned parent and at 100 percent returns rows from every partition.
id: tablesample.partitioned-parent-tablesample
title: TABLESAMPLE on a list-partitioned parent at 100 percent returns all partitions
family: tablesample
tier: extended
feature_ids: [tablesample, partitioning, aggregates]
required_capabilities: [create-table, insert, select, tablesample, partitioning]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE parted_sample (a int) PARTITION BY LIST (a);
  CREATE TABLE parted_sample_1 PARTITION OF parted_sample FOR VALUES IN (1);
  CREATE TABLE parted_sample_2 PARTITION OF parted_sample FOR VALUES IN (2);
  INSERT INTO parted_sample VALUES (1), (1), (2);
steps:
  - sql: |
      SELECT a FROM parted_sample TABLESAMPLE BERNOULLI (100) ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM parted_sample TABLESAMPLE SYSTEM (100)
    expect: rows
    order: multiset
