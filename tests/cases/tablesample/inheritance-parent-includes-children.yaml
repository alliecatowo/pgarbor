# Sampling a parent table with inheritance applies to child rows too, so 100 percent counts the whole hierarchy.
id: tablesample.inheritance-parent-includes-children
title: TABLESAMPLE on a parent table at 100 percent includes inherited child rows
family: tablesample
tier: extended
feature_ids: [tablesample, inheritance, aggregates]
required_capabilities: [create-table, insert, select, tablesample, inheritance]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE person (name text, age int4);
  CREATE TABLE student (gpa float8) INHERITS (person);
  INSERT INTO person VALUES ('p1', 30), ('p2', 40);
  INSERT INTO student VALUES ('s1', 20, 3.5), ('s2', 21, 3.9), ('s3', 22, 2.8);
steps:
  - sql: |
      SELECT count(*) FROM person TABLESAMPLE BERNOULLI (100)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM person
    expect: rows
    order: multiset
    comment: the unsampled count must match the sampled one
  - sql: |
      SELECT count(*) FROM person TABLESAMPLE SYSTEM (100)
    expect: rows
    order: multiset
