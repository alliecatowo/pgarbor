# Sampling an empty table yields zero rows at any valid percentage.
id: tablesample.sample-empty-table
title: Sampling an empty table returns no rows under both methods
family: tablesample
tier: extended
feature_ids: [tablesample, select, aggregates]
required_capabilities: [create-table, select, tablesample]
provenance:
  source: hand
  ref: "PG18 sql-select.html#SQL-FROM tablesample; regress tablesample.sql (sampling empty heap)"
sessions: [a]
setup: |
  CREATE TABLE empty_t (id int);
steps:
  - sql: |
      SELECT count(*) FROM empty_t TABLESAMPLE SYSTEM (100)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM empty_t TABLESAMPLE BERNOULLI (100) REPEATABLE (7)
    expect: rows
    order: multiset
