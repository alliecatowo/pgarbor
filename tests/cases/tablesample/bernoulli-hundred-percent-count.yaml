# 100 percent sampling returns every row, regardless of the sampling seed.
id: tablesample.bernoulli-hundred-percent-count
title: BERNOULLI and SYSTEM at 100 percent return all rows
family: tablesample
tier: core
feature_ids: [tablesample, select, aggregates]
required_capabilities: [create-table, insert, select, tablesample, storage-parameters]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text) WITH (fillfactor=10);
  INSERT INTO test_tablesample SELECT i, repeat(i::text, 200) FROM generate_series(0, 9) s(i);
steps:
  - sql: |
      SELECT count(*) FROM test_tablesample TABLESAMPLE SYSTEM (100)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM test_tablesample TABLESAMPLE BERNOULLI (100)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM test_tablesample TABLESAMPLE BERNOULLI (100) REPEATABLE (0)
    expect: rows
    order: multiset
