# A sampled query run inside a transaction does not disturb a scrollable cursor already open on another sampled query.
id: tablesample.cursor-unaffected-by-sample
title: Sampled query does not affect an open scrollable cursor
family: tablesample
tier: extended
feature_ids: [tablesample, cursors, transactions]
required_capabilities: [create-table, insert, select, tablesample, cursors, transactions, storage-parameters]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text) WITH (fillfactor=10);
  INSERT INTO test_tablesample SELECT i, repeat(i::text, 200) FROM generate_series(0, 9) s(i);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE tablesample_cur SCROLL CURSOR FOR
        SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (50) REPEATABLE (0)
    expect: ok
  - sql: |
      FETCH FIRST FROM tablesample_cur
    expect: rows
    order: ordered
  - sql: |
      FETCH NEXT FROM tablesample_cur
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (50) REPEATABLE (0) ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      FETCH NEXT FROM tablesample_cur
    expect: rows
    order: ordered
  - sql: |
      FETCH FIRST FROM tablesample_cur
    expect: rows
    order: ordered
  - sql: |
      FETCH NEXT FROM tablesample_cur
    expect: rows
    order: ordered
  - sql: |
      CLOSE tablesample_cur
    expect: ok
  - sql: |
      END
    expect: ok
