# An unknown sampling method name is an undefined-object error.
id: tablesample.unknown-method-error
title: Unknown TABLESAMPLE method name raises undefined_object
family: tablesample
tier: core
feature_ids: [tablesample, errors]
required_capabilities: [create-table, insert, select, tablesample]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text);
  INSERT INTO test_tablesample VALUES (1, 'a'), (2, 'b');
steps:
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE FOOBAR (1)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (100) ORDER BY id
    expect: rows
    order: ordered
    comment: the table and the valid method still work after the error
