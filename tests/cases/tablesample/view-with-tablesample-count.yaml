# A view that embeds TABLESAMPLE is selectable; at 100 percent it exposes every base row.
id: tablesample.view-with-tablesample-count
title: View defined with TABLESAMPLE SYSTEM at 100 percent returns all base rows
family: tablesample
tier: core
feature_ids: [tablesample, views, aggregates]
required_capabilities: [create-table, insert, select, tablesample, views, storage-parameters]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/tablesample.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE test_tablesample (id int, name text) WITH (fillfactor=10);
  INSERT INTO test_tablesample SELECT i, repeat(i::text, 200) FROM generate_series(0, 9) s(i);
  CREATE VIEW test_tablesample_v2 AS SELECT id FROM test_tablesample TABLESAMPLE SYSTEM (100);
steps:
  - sql: |
      SELECT count(*) FROM test_tablesample_v2
    expect: rows
    order: multiset
  - sql: |
      SELECT id FROM test_tablesample_v2 WHERE id > 6 ORDER BY id
    expect: rows
    order: ordered
