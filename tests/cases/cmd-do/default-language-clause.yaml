# LANGUAGE is optional (plpgsql is the default) and may be written before or after the code block; the code may be a string literal or a dollar-quoted literal.
id: cmd-do.default-language-clause
title: DO defaults to plpgsql and accepts LANGUAGE before or after the code
family: cmd-do
tier: core
feature_ids: [do, plpgsql, language-clause, dollar-quoting]
required_capabilities: [create-table, insert, select, plpgsql]
provenance:
  source: pg-docs
  ref: "ref/do.sgml#sql-do (Synopsis; Parameters: lang_name; Description: LANGUAGE clause before or after)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v text);
steps:
  - sql: |
      DO $$ BEGIN INSERT INTO t VALUES (1, 'default'); END $$
    expect: ok
    comment: no LANGUAGE clause means plpgsql
  - sql: |
      DO LANGUAGE plpgsql $$ BEGIN INSERT INTO t VALUES (2, 'before'); END $$
    expect: ok
    comment: LANGUAGE before the code block
  - sql: |
      DO $$ BEGIN INSERT INTO t VALUES (3, 'after'); END $$ LANGUAGE plpgsql
    expect: ok
    comment: LANGUAGE after the code block
  - sql: |
      DO 'BEGIN INSERT INTO t VALUES (4, ''single-quoted''); END'
    expect: ok
    comment: the code may be an ordinary string literal with doubled quotes
  - sql: |
      DO LANGUAGE plpgsql $q$BEGIN INSERT INTO t VALUES (5, $$tagged$$); END$q$
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
