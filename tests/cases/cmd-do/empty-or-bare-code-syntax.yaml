# The code must be a string literal (dollar-quoted recommended); an empty body, a bare block, a number or a missing argument is a syntax error.
id: cmd-do.empty-or-bare-code-syntax
title: DO requires its code as a string literal and rejects empty or unquoted bodies
family: cmd-do
tier: core
feature_ids: [do, syntax, errors]
required_capabilities: [errors]
provenance:
  source: pg-docs
  ref: "ref/do.sgml#sql-do (Parameters: code must be specified as a string literal, just as in CREATE FUNCTION)"
sessions: [a]
steps:
  - sql: |
      DO $$$$
    expect: error
    sqlstate: "42601"
    comment: empty dollar-quoted body is a syntax error at end of input
  - sql: |
      DO BEGIN END
    expect: error
    sqlstate: "42601"
    comment: an unquoted block is not a valid code argument
  - sql: |
      DO 42
    expect: error
    sqlstate: "42601"
  - sql: |
      DO
    expect: error
    sqlstate: "42601"
    comment: code is mandatory
