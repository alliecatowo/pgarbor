# RAISE NOTICE is delivered as a notice and does not abort the block; format placeholders take values and NULL formats as <NULL>.
id: cmd-do.raise-notice-message
title: RAISE NOTICE and WARNING inside DO emit messages and let the block finish
family: cmd-do
tier: core
feature_ids: [do, plpgsql, raise, notices]
required_capabilities: [plpgsql, select, errors]
provenance:
  source: pg-docs
  ref: "ref/do.sgml#sql-do (Description); PL/pgSQL RAISE levels (plpgsql-errors-and-messages)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'hello %', 42; END $$
    expect: notice
    comment: the DO command itself completes
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'one: %', NULL; END $$
    expect: notice
    comment: a NULL argument in a format placeholder is printed as <NULL>
  - sql: |
      DO $$ BEGIN RAISE WARNING 'careful'; END $$
    expect: ok
    comment: WARNING is a message, not an error; the block still succeeds
  - sql: |
      SELECT 'after' AS marker
    expect: rows
    order: ordered
