# A DO block behaves like a function returning void: a bare RETURN is fine, returning a value is an error, and DO yields no result rows.
id: cmd-do.return-value-void
title: DO block is a void function, so RETURN with a value is rejected and no rows come back
family: cmd-do
tier: core
feature_ids: [do, plpgsql, return, void]
required_capabilities: [plpgsql, errors, select]
provenance:
  source: pg-docs
  ref: "ref/do.sgml#sql-do (Description: treated as the body of a function with no parameters, returning void)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN RETURN; END $$
    expect: ok
    comment: bare RETURN is allowed in a void function
  - sql: |
      DO $$ BEGIN RETURN 1; END $$
    expect: error
    sqlstate: "42804"
    comment: RETURN cannot have a parameter in function returning void
  - sql: |
      SELECT 'no rows from DO' AS note
    expect: rows
    order: ordered
