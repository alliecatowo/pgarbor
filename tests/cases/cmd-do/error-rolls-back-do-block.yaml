# A DO block is one statement: an error inside it undoes all of its writes, and in a transaction block the error aborts the transaction until ROLLBACK.
id: cmd-do.error-rolls-back-do-block
title: An error inside DO undoes the whole block and aborts an enclosing transaction
family: cmd-do
tier: core
feature_ids: [do, transactions, errors, unique-constraints, plpgsql]
required_capabilities: [create-table, insert, select, transactions, plpgsql, errors]
provenance:
  source: pg-docs
  ref: "ref/do.sgml#sql-do (Description: executed as a single function body); PostgreSQL transaction abort semantics (tutorial/transactions)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v text);
steps:
  - sql: |
      DO $$ BEGIN INSERT INTO t VALUES (1, 'a'); INSERT INTO t VALUES (1, 'dup'); END $$
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
    comment: the first insert in the block was undone too
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DO $$ BEGIN INSERT INTO t VALUES (2, 'b'); PERFORM 1/0; END $$
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1 AS still_open
    expect: error
    sqlstate: "25P02"
    comment: the enclosing transaction is aborted until ROLLBACK
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
