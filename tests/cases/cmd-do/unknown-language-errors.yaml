# A LANGUAGE that is not installed in the database is rejected; plpgsql is always available.
id: cmd-do.unknown-language-errors
title: DO with a language that is not installed fails with undefined_object
family: cmd-do
tier: core
feature_ids: [do, language-clause, create-extension, errors]
required_capabilities: [plpgsql, errors]
provenance:
  source: pg-docs
  ref: "ref/do.sgml#sql-do (Notes: the procedural language must already have been installed; plpgsql is installed by default)"
sessions: [a]
steps:
  - sql: |
      DO LANGUAGE nosuchlang $$ BEGIN NULL; END $$
    expect: error
    sqlstate: "42704"
  - sql: |
      DO LANGUAGE plpython3u $$ pass $$
    expect: error
    sqlstate: "42704"
    comment: an untrusted language that was never CREATE EXTENSION'd is missing, not forbidden
  - sql: |
      DO LANGUAGE plpgsql $$ BEGIN NULL; END $$
    expect: ok
    comment: plpgsql named explicitly is installed by default
