# Untrusted languages (for example plpython3u) require superuser to create the function or run DO; the check needs a non-superuser role.
id: cmd-do.untrusted-language-privilege
title: DO in an untrusted language requires superuser privilege for a non-superuser role
family: cmd-do
tier: extended
feature_ids: [do, language-privileges, roles, untrusted-language]
required_capabilities: [roles, errors]
provenance:
  source: pg-docs
  ref: "ref/do.sgml#sql-do (Notes: the user must have USAGE privilege, or be a superuser if the language is untrusted)"
sessions: [a]
steps:
  - sql: |
      DO LANGUAGE plpython3u $$ pass $$
    expect: error
    sqlstate: "42704"
quarantine:
  reason: "needs CREATE ROLE (cluster-global, collides between concurrent cases) and an installed untrusted language; not runnable in an isolated single database"
  since: "2026-10-15"
