# Parameter defaults do not create shorter identities. A function declared with a defaulted second
# argument can only be dropped by listing every declared input type.
id: cmd-drop-function.default-args-identity
title: Defaulted parameters are part of the identity; the short form does not match
family: cmd-drop-function
tier: core
feature_ids: [drop-function, default-arguments, argument-identity]
required_capabilities: [create-function, drop-function, sql-functions, select]
provenance:
  source: pg-docs
  ref: "ref/drop_function.sgml#sql-dropfunction (argtype parameter; Description)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION dfa(a int, b int DEFAULT 1) RETURNS int LANGUAGE sql AS 'select a + b'
    expect: ok
  - sql: |
      SELECT dfa(1)
    expect: rows
    order: ordered
    comment: the default is used, so the result is 2
  - sql: |
      DROP FUNCTION dfa(int)
    expect: error
    sqlstate: "42883"
    comment: the one-argument form is not the identity of dfa
  - sql: |
      DROP FUNCTION dfa(int, int)
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'dfa'
    expect: rows
    order: multiset
    comment: 0 rows remain
