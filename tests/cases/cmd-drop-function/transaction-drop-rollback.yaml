# DROP FUNCTION is transactional: a rolled-back drop leaves the function in place, a committed drop
# removes it. Inside a failed transaction every later statement fails with 25P02 until ROLLBACK.
id: cmd-drop-function.transaction-drop-rollback
title: DROP FUNCTION inside a transaction rolls back cleanly and aborts the block on error
family: cmd-drop-function
tier: core
feature_ids: [drop-function, transactions, rollback, commit, failed-transaction-block]
required_capabilities: [create-function, drop-function, sql-functions, transactions, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "ref/drop_function.sgml#sql-dropfunction (Description); ref/begin.sgml"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION tx(int) RETURNS int LANGUAGE sql AS 'select $1'
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP FUNCTION tx(int)
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'tx'
    expect: rows
    order: multiset
    comment: 0 rows, visible inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT tx(5)
    expect: rows
    order: ordered
    comment: the rollback restored the function
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP FUNCTION nosuch(int)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
    comment: the block is aborted until ROLLBACK
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP FUNCTION tx(int)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'tx'
    expect: rows
    order: multiset
    comment: 0 rows after commit
