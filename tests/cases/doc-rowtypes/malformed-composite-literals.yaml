# Documented literal rules: the number of fields must match the type, and each field must be valid
# input for its type. Violations raise invalid_text_representation (22P02).
id: doc-rowtypes.malformed-composite-literals
title: Composite literals with too many, too few or badly typed fields are rejected with 22P02
family: doc-rowtypes
tier: core
feature_ids: [composite-types, composite-input, errors]
required_capabilities: [create-type, composite-types, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rowtypes.sgml#rowtypes-io-syntax"
sessions: [a]
setup: |
  CREATE TYPE pair2 AS (a integer, b text);
  CREATE TYPE complex AS (r double precision, i double precision);
steps:
  - sql: |
      SELECT '(1,1,1)'::pair2
    expect: error
    sqlstate: "22P02"
    comment: too many fields
  - sql: |
      SELECT '(1)'::pair2
    expect: error
    sqlstate: "22P02"
    comment: too few fields
  - sql: |
      SELECT '(1,2,3)'::complex
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '(a,x)'::pair2
    expect: error
    sqlstate: "22P02"
    comment: the first field is not a valid integer
  - sql: |
      SELECT '(1,x)'::pair2 AS still_valid
    expect: rows
    comment: a well-formed literal of the same type still works after the errors
