# Documented output rules: fields are double-quoted when empty, when containing parentheses,
# commas, quotes, backslashes or whitespace; embedded quotes and backslashes are doubled.
id: doc-rowtypes.composite-output-quoting
title: Composite text output quotes empty, special and whitespace fields and doubles embedded quotes and backslashes
family: doc-rowtypes
tier: core
feature_ids: [composite-types, composite-output, quoting]
required_capabilities: [create-type, composite-types, row-constructor, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rowtypes.sgml#rowtypes-io-syntax"
sessions: [a]
setup: |
  CREATE TYPE pair2 AS (a integer, b text);
steps:
  - sql: |
      SELECT ROW(4, 'a"b\c')::pair2 AS doubled, ROW(1, 'p(q)')::pair2 AS parens, ROW(2, 'x,y')::pair2 AS comma
    expect: rows
    order: ordered
  - sql: |
      SELECT ROW(1, ' sp ')::pair2 AS spaces, ROW(3, '')::pair2 AS empty_text, ROW(4, NULL)::pair2 AS null_text
    expect: rows
    order: ordered
    comment: empty string is written "" while NULL is written with nothing
  - sql: |
      SELECT ROW('a"b', 'x\y', 'p(q)', ' sp ', '')::text AS quoted_all_fields
    expect: rows
    order: ordered
