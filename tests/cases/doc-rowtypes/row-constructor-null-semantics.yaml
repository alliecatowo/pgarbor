# Documented ROW constructor forms and NULL behaviour of composite comparisons: a ROW with all
# fields NULL is IS NULL, a single NULL field makes equality unknown, and IS DISTINCT FROM treats
# composite values as comparable.
id: doc-rowtypes.row-constructor-null-semantics
title: ROW constructors with and without the keyword compare field by field and propagate NULL per field
family: doc-rowtypes
tier: core
feature_ids: [row-constructor, composite-comparison, null-semantics]
required_capabilities: [row-constructor, select, composite-types]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rowtypes.sgml#rowtypes-constructing"
sessions: [a]
steps:
  - sql: |
      SELECT ROW('fuzzy dice', 42, 1.99) AS with_keyword, ('fuzzy dice', 42, 1.99) AS without_keyword, ROW('', 42, NULL) AS null_third
    expect: rows
    order: ordered
  - sql: |
      SELECT ROW(NULL, NULL) IS NULL AS all_null, ROW(NULL, 1) IS NULL AS one_null, ROW(NULL, NULL) IS NOT DISTINCT FROM ROW(NULL, NULL) AS nd_equal
    expect: rows
    order: ordered
  - sql: |
      SELECT ROW(1, 'x') = ROW(1, 'x') AS eq_true, ROW(1, NULL) = ROW(1, 'x') AS eq_unknown, ROW(1, NULL) = ROW(2, NULL) AS eq_false_first_field
    expect: rows
    order: ordered
    comment: a NULL field makes equality unknown unless an earlier field already differs
  - sql: |
      SELECT ROW(1, NULL) < ROW(2, NULL) AS lt_decided_early, ROW(1, 2) < ROW(1, 3) AS lt_second_field
    expect: rows
    order: ordered
  - sql: |
      SELECT (ROW(1, 'a') IS DISTINCT FROM ROW(1, 'a')) AS not_distinct, ROW(1, NULL) IS DISTINCT FROM ROW(1, 'x') AS distinct_null
    expect: rows
    order: ordered
