# Documented input rule: whitespace outside the parentheses is ignored, whitespace inside is part
# of the field value and is significant only when the field type ignores it (integer vs text).
id: doc-rowtypes.composite-input-whitespace
title: Whitespace inside a composite literal is dropped for integer fields and kept for text fields
family: doc-rowtypes
tier: core
feature_ids: [composite-types, composite-input, whitespace]
required_capabilities: [create-type, composite-types, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rowtypes.sgml#rowtypes-io-syntax"
sessions: [a]
setup: |
  CREATE TYPE onei AS (i integer);
  CREATE TYPE onet AS (t text);
steps:
  - sql: |
      SELECT '(  42)'::onei AS int_field, '  (  42)  '::onei AS outer_ws
    expect: rows
    order: ordered
    comment: whitespace outside the parentheses is ignored
  - sql: |
      SELECT '(  42)'::onet AS text_field, length(('(  42)'::onet).t) AS len
    expect: rows
    order: ordered
    comment: the leading spaces are part of the text value
  - sql: |
      SELECT ('(   )'::onet).t IS NULL AS whitespace_is_not_null, length(('(   )'::onet).t) AS ws_len
    expect: rows
    order: ordered
