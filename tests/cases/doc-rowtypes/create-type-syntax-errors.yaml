# Documented restriction: composite type definitions take only field names and types (no
# constraints), the AS keyword is essential, and a failing definition leaves no type behind.
id: doc-rowtypes.create-type-syntax-errors
title: Composite type definitions reject column constraints and a missing AS keyword with syntax errors
family: doc-rowtypes
tier: core
feature_ids: [composite-types, create-type, errors]
required_capabilities: [create-type, composite-types, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rowtypes.sgml#rowtypes-declare"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE bad_nn AS (a integer NOT NULL)
    expect: error
    sqlstate: "42601"
    comment: no constraints (such as NOT NULL) may be written in a composite type
  - sql: |
      CREATE TYPE bad_check AS (a integer CHECK (a > 0))
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TYPE bad_noas (a integer, b text)
    expect: error
    sqlstate: "42601"
    comment: without AS the parser sees a different CREATE TYPE form
  - sql: |
      SELECT count(*) FROM pg_type WHERE typname IN ('bad_nn', 'bad_check', 'bad_noas')
    expect: rows
    comment: no partial type is left behind by the failed definitions
  - sql: |
      CREATE TYPE good_pair AS (a integer, b text)
    expect: ok
