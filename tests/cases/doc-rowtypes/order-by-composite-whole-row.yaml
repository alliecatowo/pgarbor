# Documented ORDER BY forms: ORDER BY c, c.*, and ROW(c.*) sort by the whole composite value and
# are equivalent to ORDER BY ROW(c.name, c.supplier_id, c.price); a column named c changes the
# meaning of the bare form.
id: doc-rowtypes.order-by-composite-whole-row
title: ORDER BY on a table alias sorts by the whole composite row, field by field
family: doc-rowtypes
tier: core
feature_ids: [composite-types, order-by, whole-row-reference]
required_capabilities: [create-table, insert, select, composite-types, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/rowtypes.sgml#rowtypes-usage"
sessions: [a]
setup: |
  CREATE TABLE inventory_item (name text, supplier_id integer, price numeric);
  INSERT INTO inventory_item VALUES ('b', 2, 10), ('a', 1, 20), ('c', 1, 5), (NULL, 9, 1);
steps:
  - sql: |
      SELECT * FROM inventory_item c ORDER BY c
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM inventory_item c ORDER BY c.*
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM inventory_item c ORDER BY ROW(c.*)
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM inventory_item c ORDER BY ROW(c.name, c.supplier_id, c.price)
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM inventory_item c ORDER BY (c.name, c.supplier_id, c.price)
    expect: rows
    order: ordered
