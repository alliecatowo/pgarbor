# DISCARD ALL resets session state but does not drop permanent tables, indexes or their rows.
id: cmd-discard.all-keeps-permanent-data
title: DISCARD ALL leaves permanent tables, indexes and committed rows intact
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, create-table, create-index, insert]
required_capabilities: [select, create-table, create-index, insert]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: ALL)"
sessions: [a]
setup: |
  CREATE TABLE keep (id int4 PRIMARY KEY, label text);
  CREATE INDEX keep_label ON keep (label);
  INSERT INTO keep VALUES (1, 'a'), (2, NULL);
steps:
  - sql: |
      CREATE TEMP TABLE scratch (id int4)
    expect: ok
  - sql: |
      DISCARD ALL
    expect: ok
  - sql: |
      SELECT id, label FROM keep ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'keep' ORDER BY indexname
    expect: rows
    order: ordered
  - sql: |
      SELECT to_regclass('scratch') IS NULL AS temp_gone
    expect: rows
