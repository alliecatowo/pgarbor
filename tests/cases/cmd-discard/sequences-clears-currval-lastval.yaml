# DISCARD SEQUENCES forgets the session's currval()/lastval() state.
id: cmd-discard.sequences-clears-currval-lastval
title: DISCARD SEQUENCES makes currval and lastval undefined in the session
family: cmd-discard
tier: core
feature_ids: [discard, discard-sequences, sequences, currval, lastval]
required_capabilities: [select, create-sequence, sequences]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: SEQUENCES)"
sessions: [a]
setup: |
  CREATE SEQUENCE s;
steps:
  - sql: |
      SELECT nextval('s') AS n
    expect: rows
  - sql: |
      SELECT currval('s') AS n
    expect: rows
  - sql: |
      DISCARD SEQUENCES
    expect: ok
  - sql: |
      SELECT currval('s')
    expect: error
    sqlstate: "55000"
    comment: currval state is gone after DISCARD SEQUENCES
  - sql: |
      SELECT lastval()
    expect: error
    sqlstate: "55000"
    comment: lastval state is gone as well
