# DISCARD ALL releases session-level advisory locks, which another session can then acquire.
id: cmd-discard.all-releases-advisory-locks
title: DISCARD ALL releases a session advisory lock so another session can take it
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, advisory-locks]
required_capabilities: [select, advisory-locks, multi-session]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: ALL; equivalent to SELECT pg_advisory_unlock_all())"
sessions: [a, b]
steps:
  - session: a
    sql: |
      SELECT pg_advisory_lock(42)
    expect: rows
  - session: b
    sql: |
      SELECT pg_try_advisory_lock(42) AS got
    expect: rows
    comment: a still holds the lock, so b cannot take it
  - session: a
    sql: |
      DISCARD ALL
    expect: ok
  - session: b
    sql: |
      SELECT pg_try_advisory_lock(42) AS got
    expect: rows
    comment: a's DISCARD ALL released the session lock
