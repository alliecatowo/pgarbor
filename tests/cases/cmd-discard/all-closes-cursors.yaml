# DISCARD ALL closes all open cursors, including WITH HOLD cursors that outlive their transaction.
id: cmd-discard.all-closes-cursors
title: DISCARD ALL closes held cursors so later FETCH fails with 34000
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, cursors, with-hold]
required_capabilities: [select, cursors]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: ALL; equivalent to CLOSE ALL)"
sessions: [a]
steps:
  - sql: |
      DECLARE c CURSOR WITH HOLD FOR SELECT 1 AS n
    expect: ok
  - sql: |
      FETCH c
    expect: rows
  - sql: |
      DISCARD ALL
    expect: ok
  - sql: |
      FETCH c
    expect: error
    sqlstate: "34000"
