# TEMP and TEMPORARY are synonyms, and keywords are case-insensitive.
id: cmd-discard.temporary-spelling-and-case
title: DISCARD TEMPORARY, DISCARD TEMP and lowercase subcommands all work and drop temp tables
family: cmd-discard
tier: core
feature_ids: [discard, discard-temp, temp-tables, keyword-case]
required_capabilities: [select, create-table, temp-tables]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: TEMPORARY or TEMP)"
sessions: [a]
steps:
  - sql: |
      CREATE TEMP TABLE x1 (id int4)
    expect: ok
  - sql: |
      discard temporary
    expect: ok
  - sql: |
      SELECT id FROM x1
    expect: error
    sqlstate: "42P01"
  - sql: |
      CREATE TEMP TABLE x2 (id int4)
    expect: ok
  - sql: |
      Discard Temp
    expect: ok
  - sql: |
      SELECT id FROM x2
    expect: error
    sqlstate: "42P01"
  - sql: |
      DISCARD PLANS; DISCARD SEQUENCES; DISCARD TEMP
    expect: ok
    comment: the three non-ALL subcommands may be combined in one simple-Query message
