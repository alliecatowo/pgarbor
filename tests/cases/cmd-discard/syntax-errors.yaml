# DISCARD takes exactly one subcommand from its grammar; anything else is a syntax error (42601).
id: cmd-discard.syntax-errors
title: DISCARD without a valid subcommand, or with a misspelled one, is a syntax error
family: cmd-discard
tier: core
feature_ids: [discard, syntax-errors]
required_capabilities: [select, errors, error-sqlstate]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Synopsis: DISCARD { ALL | PLANS | SEQUENCES | TEMPORARY | TEMP })"
sessions: [a]
steps:
  - sql: |
      DISCARD
    expect: error
    sqlstate: "42601"
  - sql: |
      DISCARD SEQUENCE
    expect: error
    sqlstate: "42601"
    comment: singular SEQUENCE is not a subcommand
  - sql: |
      DISCARD TEMP ALL
    expect: error
    sqlstate: "42601"
  - sql: |
      DISCARD ALL PLANS
    expect: error
    sqlstate: "42601"
  - sql: |
      DISCARD PLAN
    expect: error
    sqlstate: "42601"
