# DISCARD ALL deallocates every prepared statement of the session (DEALLOCATE ALL).
id: cmd-discard.all-deallocates-prepared
title: DISCARD ALL removes prepared statements so EXECUTE fails with 26000
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, prepare, execute, deallocate]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: ALL; equivalent to DEALLOCATE ALL)"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS SELECT 1 AS n
    expect: ok
  - sql: |
      EXECUTE p
    expect: rows
  - sql: |
      DISCARD ALL
    expect: ok
  - sql: |
      EXECUTE p
    expect: error
    sqlstate: "26000"
