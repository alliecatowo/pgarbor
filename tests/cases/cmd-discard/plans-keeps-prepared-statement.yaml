# DISCARD PLANS releases cached plans only; the prepared statement itself stays usable.
id: cmd-discard.plans-keeps-prepared-statement
title: DISCARD PLANS discards cached plans but keeps the prepared statement executable
family: cmd-discard
tier: core
feature_ids: [discard, discard-plans, prepare, execute]
required_capabilities: [select, create-table, insert, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: PLANS)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two');
steps:
  - sql: |
      PREPARE p (int4) AS SELECT v FROM t WHERE id = $1
    expect: ok
  - sql: |
      EXECUTE p (1)
    expect: rows
  - sql: |
      DISCARD PLANS
    expect: ok
  - sql: |
      EXECUTE p (2)
    expect: rows
    comment: the statement still exists; it is simply re-planned on next use
  - sql: |
      DEALLOCATE p
    expect: ok
