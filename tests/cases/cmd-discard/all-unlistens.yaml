# DISCARD ALL stops all LISTEN registrations (UNLISTEN *).
id: cmd-discard.all-unlistens
title: DISCARD ALL removes LISTEN registrations of the session
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, listen-notify]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: ALL; equivalent to UNLISTEN *)"
sessions: [a]
steps:
  - sql: |
      LISTEN ch_discard_a
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
  - sql: |
      DISCARD ALL
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
