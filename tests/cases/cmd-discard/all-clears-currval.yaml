# DISCARD ALL includes DISCARD SEQUENCES, so currval state is cleared too.
id: cmd-discard.all-clears-currval
title: DISCARD ALL makes currval undefined in the session, while the sequence keeps counting
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, sequences, currval]
required_capabilities: [select, create-sequence, sequences]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: ALL; equivalent to DISCARD SEQUENCES)"
sessions: [a]
setup: |
  CREATE SEQUENCE s;
steps:
  - sql: |
      SELECT nextval('s') AS n
    expect: rows
  - sql: |
      DISCARD ALL
    expect: ok
  - sql: |
      SELECT currval('s')
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT nextval('s') AS n
    expect: rows
    comment: next value is 2
