# DISCARD SEQUENCES drops session-cached sequence state but never the sequence itself or its position.
id: cmd-discard.sequences-nextval-continues
title: After DISCARD SEQUENCES, nextval continues from the sequence's committed position
family: cmd-discard
tier: core
feature_ids: [discard, discard-sequences, sequences, nextval]
required_capabilities: [select, create-sequence, sequences]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: SEQUENCES)"
sessions: [a]
setup: |
  CREATE SEQUENCE s START WITH 10 INCREMENT BY 5;
steps:
  - sql: |
      SELECT nextval('s') AS n
    expect: rows
  - sql: |
      DISCARD SEQUENCES
    expect: ok
  - sql: |
      SELECT nextval('s') AS n
    expect: rows
    comment: next value is 15, not 10; the sequence is not reset
  - sql: |
      DISCARD SEQUENCES
    expect: ok
    comment: discarding with no sequences in use is not an error
  - sql: |
      SELECT nextval('s') AS n
    expect: rows
