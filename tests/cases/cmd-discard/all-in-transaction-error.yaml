# DISCARD ALL is rejected inside a transaction block; the block must be ended before it can run.
id: cmd-discard.all-in-transaction-error
title: DISCARD ALL inside a transaction block fails with 25001 and can run after ROLLBACK
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, transactions]
required_capabilities: [select, transactions]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Notes: DISCARD ALL cannot be executed inside a transaction block)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DISCARD ALL
    expect: error
    sqlstate: "25001"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      DISCARD ALL
    expect: ok
  - sql: |
      SELECT 1 AS ok
    expect: rows
