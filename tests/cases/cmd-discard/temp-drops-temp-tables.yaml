# DISCARD TEMP drops this session's temporary tables and leaves permanent tables alone.
id: cmd-discard.temp-drops-temp-tables
title: DISCARD TEMP drops session temporary tables but not permanent ones
family: cmd-discard
tier: core
feature_ids: [discard, discard-temp, temp-tables]
required_capabilities: [select, create-table, insert, temp-tables]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: TEMPORARY)"
sessions: [a]
setup: |
  CREATE TABLE perm (id int4);
  INSERT INTO perm VALUES (1), (2);
steps:
  - sql: |
      CREATE TEMP TABLE tmp_scratch (id int4);
      INSERT INTO tmp_scratch VALUES (10), (20)
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM tmp_scratch
    expect: rows
  - sql: |
      DISCARD TEMP
    expect: ok
  - sql: |
      SELECT id FROM tmp_scratch
    expect: error
    sqlstate: "42P01"
    comment: the temporary table no longer exists
  - sql: |
      SELECT id FROM perm ORDER BY id
    expect: rows
    order: ordered
    comment: permanent table and its rows are untouched
