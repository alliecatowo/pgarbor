# Only DISCARD ALL is forbidden inside a transaction block; DISCARD PLANS is accepted there.
id: cmd-discard.plans-allowed-in-transaction
title: DISCARD PLANS runs inside an explicit transaction block and commits with it
family: cmd-discard
tier: core
feature_ids: [discard, discard-plans, transactions]
required_capabilities: [select, transactions, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Notes: DISCARD ALL cannot be executed inside a transaction block)"
sessions: [a]
steps:
  - sql: |
      PREPARE q AS SELECT 7 AS n
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DISCARD PLANS
    expect: ok
  - sql: |
      EXECUTE q
    expect: rows
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      EXECUTE q
    expect: rows
