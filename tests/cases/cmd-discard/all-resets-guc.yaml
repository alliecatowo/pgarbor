# DISCARD ALL resets session settings to their defaults (RESET ALL).
id: cmd-discard.all-resets-guc
title: DISCARD ALL resets SET parameters such as work_mem and search_path
family: cmd-discard
tier: core
feature_ids: [discard, discard-all, guc, set, search-path]
required_capabilities: [select, guc, set-search-path]
provenance:
  source: pg-docs
  ref: "ref/discard.sgml#sql-discard (Parameters: ALL; equivalent to RESET ALL)"
sessions: [a]
steps:
  - sql: |
      SET work_mem = '1MB'; SET search_path = pg_catalog
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') = '1MB' AS set_before, current_setting('search_path') = 'pg_catalog' AS path_before
    expect: rows
  - sql: |
      DISCARD ALL
    expect: ok
  - sql: |
      SELECT current_setting('work_mem') <> '1MB' AS work_mem_reset, current_setting('search_path') <> 'pg_catalog' AS path_reset
    expect: rows
