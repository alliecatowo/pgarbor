# Clause syntax: operand types are required in DROP and in ADD OPERATOR; USING and parentheses are mandatory.
id: cmd-alter-opfamily.syntax-errors
title: Missing operand types, missing USING clause and NONE in DROP are syntax errors
family: cmd-alter-opfamily
tier: core
feature_ids: [alter-operator-family, syntax, errors]
required_capabilities: [alter-operator-family, create-operator-family, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_opfamily.sgml#sql-alteropfamily (Synopsis; Parameters: op_type)"
sessions: [a]
setup: |
  CREATE OPERATOR FAMILY cmd_aof_syn USING btree;
  ALTER OPERATOR FAMILY cmd_aof_syn USING btree ADD OPERATOR 1 < (int4, int4);
steps:
  - sql: |
      ALTER OPERATOR FAMILY cmd_aof_syn USING btree ADD OPERATOR 2 <= (int4)
    expect: error
    sqlstate: "42601"
    comment: ADD OPERATOR always needs both operand types
  - sql: |
      ALTER OPERATOR FAMILY cmd_aof_syn USING btree DROP FUNCTION 1
    expect: error
    sqlstate: "42601"
    comment: DROP FUNCTION needs its operand types
  - sql: |
      ALTER OPERATOR FAMILY cmd_aof_syn USING btree DROP FUNCTION 1 btint4cmp
    expect: error
    sqlstate: "42601"
  - sql: |
      ALTER OPERATOR FAMILY cmd_aof_syn USING btree DROP OPERATOR 1 (NONE, int4)
    expect: error
    sqlstate: "42601"
    comment: NONE is valid only in ADD, not in DROP
  - sql: |
      ALTER OPERATOR FAMILY cmd_aof_syn ADD OPERATOR 2 <= (int4, int4)
    expect: error
    sqlstate: "42601"
    comment: the USING index method is required
  - sql: |
      SELECT count(*) FROM pg_amop o JOIN pg_opfamily f ON f.oid = o.amopfamily WHERE f.opfname = 'cmd_aof_syn'
    expect: rows
    comment: the one original member is untouched
