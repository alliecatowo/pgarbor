# NONE is accepted syntax for a prefix operator, but index operators must be binary.
id: cmd-alter-opfamily.unary-none-rejected
title: A prefix operator declared with NONE is rejected because index operators must be binary
family: cmd-alter-opfamily
tier: core
feature_ids: [alter-operator-family, add-members, prefix-operator, errors]
required_capabilities: [alter-operator-family, create-operator-family, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_opfamily.sgml#sql-alteropfamily (Parameters: op_type, NONE to signify a prefix operator)"
sessions: [a]
setup: |
  CREATE OPERATOR FAMILY cmd_aof_unary USING btree;
steps:
  - sql: |
      ALTER OPERATOR FAMILY cmd_aof_unary USING btree ADD OPERATOR 1 @ (NONE, int8)
    expect: error
    sqlstate: "42P17"
    comment: the parser accepts NONE; the index method rejects a unary operator
  - sql: |
      SELECT count(*) FROM pg_amop o JOIN pg_opfamily f ON f.oid = o.amopfamily WHERE f.opfname = 'cmd_aof_unary'
    expect: rows
