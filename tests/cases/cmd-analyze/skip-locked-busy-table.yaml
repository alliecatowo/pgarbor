# SKIP_LOCKED skips a table another session holds an exclusive lock on, with a WARNING; a later plain ANALYZE succeeds.
id: cmd-analyze.skip-locked-busy-table
title: "ANALYZE (SKIP_LOCKED) skips a table locked by another session"
family: cmd-analyze
tier: core
feature_ids: [analyze, skip-locked, lock-table, multi-session]
required_capabilities: [create-table, insert, select, lock-table, multi-session, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/analyze.sgml#sql-analyze (Parameters: SKIP_LOCKED)"
sessions: [a, b]
setup: |
  CREATE TABLE an_busy (id int4);
  INSERT INTO an_busy VALUES (1), (2), (3);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE an_busy IN ACCESS EXCLUSIVE MODE
    expect: ok
  - session: b
    sql: |
      ANALYZE (SKIP_LOCKED) an_busy
    expect: ok
    comment: WARNING skipping analyze of an_busy, lock not available; does not wait
  - session: b
    sql: |
      SELECT count(*) FROM pg_stats WHERE schemaname = 'public' AND tablename = 'an_busy'
    expect: rows
    order: ordered
    comment: nothing was analyzed while locked
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    sql: |
      ANALYZE an_busy
    expect: ok
  - session: b
    sql: |
      SELECT attname FROM pg_stats WHERE schemaname = 'public' AND tablename = 'an_busy' ORDER BY attname
    expect: rows
    order: ordered
    comment: after the lock is released the plain ANALYZE records statistics
