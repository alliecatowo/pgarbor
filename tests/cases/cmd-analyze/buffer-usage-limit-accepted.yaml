# BUFFER_USAGE_LIMIT accepts 0 (no buffer access strategy), the 128 kB minimum, the 16 GB maximum, and unit-less kilobytes.
id: cmd-analyze.buffer-usage-limit-accepted
title: "ANALYZE BUFFER_USAGE_LIMIT accepts 0, boundary sizes and unit forms"
family: cmd-analyze
tier: extended
feature_ids: [analyze, buffer-usage-limit, size-units]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/analyze.sgml#sql-analyze (Parameters: BUFFER_USAGE_LIMIT, size)"
sessions: [a]
setup: |
  CREATE TABLE an_b (id int4);
  INSERT INTO an_b SELECT g FROM generate_series(1, 10) g;
steps:
  - sql: |
      ANALYZE (BUFFER_USAGE_LIMIT '128 kB') an_b
    expect: ok
    comment: minimum value
  - sql: |
      ANALYZE (BUFFER_USAGE_LIMIT 0) an_b
    expect: ok
    comment: disables the buffer access strategy
  - sql: |
      ANALYZE (BUFFER_USAGE_LIMIT '128MB') an_b
    expect: ok
  - sql: |
      ANALYZE (BUFFER_USAGE_LIMIT '1024') an_b
    expect: ok
    comment: a bare number is in kilobytes
  - sql: |
      ANALYZE (BUFFER_USAGE_LIMIT '16777216 kB') an_b
    expect: ok
    comment: 16 GB maximum
  - sql: |
      ANALYZE (BUFFER_USAGE_LIMIT '16 GB') an_b
    expect: ok
    comment: same maximum in a unit form
