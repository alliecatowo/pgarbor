# A completely empty table gets no new statistics from ANALYZE.
id: cmd-analyze.empty-table-no-stats
title: "ANALYZE on a completely empty table records no statistics"
family: cmd-analyze
tier: core
feature_ids: [analyze, pg-stats, empty-table]
required_capabilities: [create-table, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/analyze.sgml#sql-analyze (Notes: If the table being analyzed is completely empty)"
sessions: [a]
setup: |
  CREATE TABLE an_e (x int4, y text);
steps:
  - sql: |
      ANALYZE an_e
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_stats WHERE schemaname = 'public' AND tablename = 'an_e'
    expect: rows
    order: ordered
    comment: expect zero statistics rows
