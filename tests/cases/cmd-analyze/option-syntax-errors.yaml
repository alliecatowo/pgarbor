# Unknown option names and non-boolean values for boolean options are syntax errors.
id: cmd-analyze.option-syntax-errors
title: "ANALYZE rejects unknown options and non-boolean option values"
family: cmd-analyze
tier: core
feature_ids: [analyze, options, syntax-errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/analyze.sgml#sql-analyze (Synopsis: option can be one of VERBOSE, SKIP_LOCKED, BUFFER_USAGE_LIMIT)"
sessions: [a]
setup: |
  CREATE TABLE an_o (id int4);
  INSERT INTO an_o VALUES (1), (2);
steps:
  - sql: |
      ANALYZE (FOO) an_o
    expect: error
    sqlstate: "42601"
    comment: not an ANALYZE option
  - sql: |
      ANALYZE (VERBOSE 'maybe') an_o
    expect: error
    sqlstate: "42601"
    comment: VERBOSE requires a boolean
  - sql: |
      SELECT count(*) FROM pg_stats WHERE schemaname = 'public' AND tablename = 'an_o'
    expect: rows
    order: ordered
    comment: neither statement analyzed the table
