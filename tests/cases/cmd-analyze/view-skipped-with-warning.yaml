# A view named explicitly cannot be analyzed; ANALYZE warns and does nothing for it.
id: cmd-analyze.view-skipped-with-warning
title: "ANALYZE on a named view warns and succeeds without statistics"
family: cmd-analyze
tier: core
feature_ids: [analyze, create-view, warnings]
required_capabilities: [create-table, insert, select, create-view, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/analyze.sgml#sql-analyze (Description: tables and materialized views only)"
sessions: [a]
setup: |
  CREATE TABLE an_vt (x int4);
  INSERT INTO an_vt VALUES (1), (2);
  CREATE VIEW an_v AS SELECT x FROM an_vt;
steps:
  - sql: |
      ANALYZE an_v
    expect: ok
    comment: emits a WARNING that the view is skipped
  - sql: |
      SELECT count(*) FROM pg_stats WHERE schemaname = 'public' AND tablename = 'an_v'
    expect: rows
    order: ordered
