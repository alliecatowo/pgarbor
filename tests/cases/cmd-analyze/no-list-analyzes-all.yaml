# Without a table list, ANALYZE processes every regular table in the database; views are not analyzed.
id: cmd-analyze.no-list-analyzes-all
title: "ANALYZE without a table list analyzes all tables and skips views"
family: cmd-analyze
tier: core
feature_ids: [analyze, create-view]
required_capabilities: [create-table, insert, select, create-view, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/analyze.sgml#sql-analyze (Description: without a list, processes every table)"
sessions: [a]
setup: |
  CREATE TABLE an_all1 (x int4);
  CREATE TABLE an_all2 (y text);
  CREATE VIEW an_allv AS SELECT x FROM an_all1;
  INSERT INTO an_all1 VALUES (1), (2), (3);
  INSERT INTO an_all2 VALUES ('a'), ('b');
steps:
  - sql: |
      ANALYZE
    expect: ok
  - sql: |
      SELECT DISTINCT tablename FROM pg_stats WHERE schemaname = 'public' AND tablename IN ('an_all1', 'an_all2', 'an_allv') ORDER BY 1
    expect: rows
    order: ordered
