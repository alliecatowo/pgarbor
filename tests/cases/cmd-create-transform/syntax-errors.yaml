# Grammar: at least one FROM SQL or TO SQL clause, and each clause at most once.
id: cmd-create-transform.syntax-errors
title: "CREATE TRANSFORM rejects an empty clause list and a repeated FROM SQL clause at parse time"
family: cmd-create-transform
tier: core
feature_ids: [create-transform, syntax-errors]
required_capabilities: [create-transform, create-function, select]
provenance:
  source: pg-docs
  ref: "ref/create_transform.sgml#sql-createtransform-synopsis"
sessions: [a]
setup: |
  CREATE FUNCTION ct_from(val internal) RETURNS internal LANGUAGE internal IMMUTABLE STRICT AS 'text_starts_with_support';
steps:
  - sql: |
      CREATE TRANSFORM FOR int4 LANGUAGE sql ()
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TRANSFORM FOR int4 LANGUAGE sql (FROM SQL WITH FUNCTION ct_from(internal), FROM SQL WITH FUNCTION ct_from(internal))
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) AS transform_rows FROM pg_transform
    expect: rows
