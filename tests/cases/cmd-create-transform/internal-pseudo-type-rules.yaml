# Documented note: an SQL-level function may not return internal unless at least one argument is internal.
id: cmd-create-transform.internal-pseudo-type-rules
title: "Functions returning internal must take an internal argument, and SQL-language functions cannot return internal"
family: cmd-create-transform
tier: core
feature_ids: [create-transform, pseudo-type-internal, function-signature-check]
required_capabilities: [create-function, internal-language-functions]
provenance:
  source: pg-docs
  ref: "ref/create_transform.sgml#sql-createtransform-parameters"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION ct_no_internal_arg() RETURNS internal LANGUAGE internal IMMUTABLE STRICT AS 'text_starts_with_support'
    expect: error
    sqlstate: "42P13"
    comment: the doc forbids an SQL-level function returning internal without an internal argument
  - sql: |
      CREATE FUNCTION ct_sql_internal(val internal) RETURNS internal LANGUAGE sql AS 'SELECT 1'
    expect: error
    sqlstate: "42P13"
    comment: SQL functions cannot return type internal
  - sql: |
      CREATE FUNCTION ct_ok(val internal) RETURNS internal LANGUAGE internal IMMUTABLE STRICT AS 'text_starts_with_support'
    expect: ok
