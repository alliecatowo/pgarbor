# The doc's exact plpython3u example. Quarantined: plpython3u is not installed on the oracle and the doc's functions are LANGUAGE C (no shared library in a single database).
id: cmd-create-transform.plpython-doc-example
title: "Documented PL/Python hstore transform (plpython3u and C functions)"
family: cmd-create-transform
tier: extended
feature_ids: [create-transform, pl-python, hstore-type]
required_capabilities: [create-transform, pl-python3u, c-language-functions]
provenance:
  source: pg-docs
  ref: "ref/create_transform.sgml#sql-createtransform-examples"
sessions: [a]
steps:
  - sql: |
      CREATE TRANSFORM FOR hstore LANGUAGE plpython3u (
          FROM SQL WITH FUNCTION hstore_to_plpython(internal),
          TO SQL WITH FUNCTION plpython_to_hstore(internal)
      )
    expect: ok
quarantine:
  reason: "needs the plpython3u extension and LANGUAGE C transform functions from a shared library; not available on the single-database oracle"
