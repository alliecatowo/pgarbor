# Documented: the creator must own the type and the functions, and have USAGE on the language. Quarantined: exercising it needs a second login role, and roles are cluster-global, so it cannot be isolated per case.
id: cmd-create-transform.owner-and-usage-privileges
title: "CREATE TRANSFORM requires type ownership, language USAGE and function EXECUTE for the creating role"
family: cmd-create-transform
tier: extended
feature_ids: [create-transform, privileges, ownership]
required_capabilities: [create-transform, create-role, set-role]
provenance:
  source: pg-docs
  ref: "ref/create_transform.sgml#sql-createtransform-description"
sessions: [a]
steps:
  - sql: |
      SET ROLE ct_nonowner
    expect: ok
quarantine:
  reason: "requires creating a non-owner role; roles are cluster-global and cannot be isolated in a per-case database"
