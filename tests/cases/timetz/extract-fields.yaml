# EXTRACT and date_part on timetz for the supported time fields and zone fields.
id: timetz.extract-fields
title: "EXTRACT and date_part on timetz for time and zone fields"
family: timetz
tier: core
feature_ids: [timetz, extract, date-part]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT EXTRACT(MICROSECOND FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS us,
             EXTRACT(MILLISECOND FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS ms,
             EXTRACT(SECOND FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS s,
             EXTRACT(MINUTE FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS mi,
             EXTRACT(HOUR FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS h
    expect: rows
  - sql: |
      SELECT EXTRACT(TIMEZONE FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04:30') AS tz,
             EXTRACT(TIMEZONE_HOUR FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04:30') AS tzh,
             EXTRACT(TIMEZONE_MINUTE FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04:30') AS tzm
    expect: rows
  - sql: |
      SELECT EXTRACT(EPOCH FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS epoch_val
    expect: rows
  - sql: |
      SELECT date_part('microsecond', TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS us,
             date_part('millisecond', TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS ms,
             date_part('second', TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS s,
             date_part('epoch', TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04') AS epoch_val
    expect: rows
