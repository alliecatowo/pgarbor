# Adding two timetz values has no operator; the planner reports 42883.
id: timetz.add-time-rejected
title: "timetz plus timetz is rejected with undefined_function 42883"
family: timetz
tier: core
feature_ids: [timetz, operators, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE TIMETZ_TBL (f1 time(2) with time zone);
  INSERT INTO TIMETZ_TBL VALUES ('00:01 PDT');
steps:
  - sql: |
      SELECT f1 + time with time zone '00:01' AS "Illegal" FROM TIMETZ_TBL
    expect: error
    sqlstate: "42883"
