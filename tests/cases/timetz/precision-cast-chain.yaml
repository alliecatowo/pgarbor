# Casting text to timetz and back to time, with and without an explicit zone, and a timetz to timetz typmod cast.
id: timetz.precision-cast-chain
title: "timetz casts between text, time, and timetz(n) typmods"
family: timetz
tier: core
feature_ids: [timetz, casts, typmod]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 datatype-datetime.html#DATATYPE-DATETIME-TIME-TABLE; PG18 sql-expressions.html#SQL-SYNTAX-TYPE-CASTS"
steps:
  - sql: |
      SELECT '12:34:56.789+05:30'::timetz(1) AS typmod_one, CAST('12:34:56.789+05:30' AS timetz(0)) AS typmod_zero
    expect: rows
  - sql: |
      SELECT '12:34:56.789+05:30'::timetz::time AS dropped_zone, '12:34:56.789+05:30'::timetz::time with time zone AS back_to_tz
    expect: rows
  - sql: |
      SELECT pg_typeof('12:00+00'::timetz)::text AS typ
    expect: rows
