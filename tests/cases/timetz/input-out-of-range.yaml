# Out-of-range timetz literals fail with a field-overflow error; each literal is its own step.
id: timetz.input-out-of-range
title: "timetz rejects 24:00:00.01, 23:59:60.01, 24:01 and 25:00 with 22008"
family: timetz
tier: extended
feature_ids: [timetz, input, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT '24:00:00.01 PDT'::timetz
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '23:59:60.01 PDT'::timetz
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '24:01:00 PDT'::timetz
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '25:00:00 PDT'::timetz
    expect: error
    sqlstate: "22008"
