# Boundary inputs that PG accepts: leap second 60, and 24:00:00 exactly.
id: timetz.input-boundary-valid
title: "timetz accepts 24:00:00 and leap-second 23:59:60 inputs"
family: timetz
tier: core
feature_ids: [timetz, input, boundaries]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT '23:59:60 PDT'::timetz AS leap_second
    expect: rows
  - sql: |
      SELECT '24:00:00 PDT'::timetz AS end_of_day
    expect: rows
  - sql: |
      SELECT '00:00:00+14'::timetz AS min_zone_offset_ok
    expect: rows
