# Basic timetz input, storage and output with a fixed-offset zone, read back in time order.
id: timetz.roundtrip-basic
title: "timetz column round-trip with fixed offsets, read back ordered"
family: timetz
tier: slice
feature_ids: [timetz, create-table, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE TIMETZ_TBL (f1 time(2) with time zone);
steps:
  - sql: |
      INSERT INTO TIMETZ_TBL VALUES ('00:01 PDT'), ('12:00 PDT'), ('23:59 PDT'), ('07:07 PST'), ('08:08 EDT')
    expect: ok
  - sql: |
      SELECT f1 AS "Time TZ" FROM TIMETZ_TBL ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM TIMETZ_TBL
    expect: rows
