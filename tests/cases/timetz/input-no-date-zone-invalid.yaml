# A timetz literal with a zone name that needs a date to resolve, or a bare alpha zone that is not an abbreviation, is invalid input (22007).
id: timetz.input-no-date-zone-invalid
title: "timetz rejects named zones without a date and unknown zone abbreviations with 22007"
family: timetz
tier: extended
feature_ids: [timetz, input, errors, time-zones]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT '15:36:39 America/New_York'::timetz
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT '15:36:39 m2'::timetz
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT '15:36:39 MSK m2'::timetz
    expect: error
    sqlstate: "22007"
