# AT TIME ZONE with a zone name, a POSIX-style zone string, and an interval offset on timetz values.
id: timetz.at-time-zone
title: "timetz AT TIME ZONE with zone names, POSIX zone strings and interval offsets"
family: timetz
tier: extended
feature_ids: [timetz, at-time-zone, time-zones]
required_capabilities: [create-table, insert, select, transactions, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE TIMETZ_TBL (f1 time(2) with time zone);
  INSERT INTO TIMETZ_TBL VALUES ('01:00 PDT'), ('12:00 PDT'), ('23:59 PDT');
steps:
  - sql: |
      SELECT f1 AS dat, f1 AT TIME ZONE 'UTC+10' AS dat_at_tz FROM TIMETZ_TBL ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 AS dat, f1 AT TIME ZONE INTERVAL '-10:00' AS dat_at_int FROM TIMETZ_TBL ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL TimeZone TO 'UTC'
    expect: ok
  - sql: |
      SELECT f1 AT LOCAL AS dat_at_local, f1 AT TIME ZONE current_setting('TimeZone') AS dat_at_tz FROM TIMETZ_TBL ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
