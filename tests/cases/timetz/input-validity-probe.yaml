# pg_input_is_valid returns a boolean without raising; pg_input_error_info reports the SQLSTATE of a bad input.
id: timetz.input-validity-probe
title: "pg_input_is_valid and pg_input_error_info on timetz literals"
family: timetz
tier: extended
feature_ids: [timetz, input-validation, catalog-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT pg_input_is_valid('12:00:00 PDT', 'timetz') AS ok_val, pg_input_is_valid('25:00:00 PDT', 'timetz') AS bad_val, pg_input_is_valid('15:36:39 America/New_York', 'timetz') AS unzoned
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('25:00:00 PDT', 'timetz')
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('15:36:39 America/New_York', 'timetz')
    expect: rows
