# With a date in the literal, a named zone resolves to the offset in effect on that date (DST-dependent).
id: timetz.dated-named-zone
title: "timetz with a date and a named zone resolves the DST offset of that date"
family: timetz
tier: extended
feature_ids: [timetz, time-zones, timezone-database]
required_capabilities: [create-table, insert, select, timezone-database]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE TIMETZ_TBL (f1 time(2) with time zone);
steps:
  - sql: |
      INSERT INTO TIMETZ_TBL VALUES ('2003-03-07 15:36:39 America/New_York'), ('2003-07-07 15:36:39 America/New_York')
    expect: ok
  - sql: |
      SELECT f1 FROM TIMETZ_TBL ORDER BY f1
    expect: rows
    order: ordered
    comment: winter (EST) and summer (EDT) offsets differ, so the two values differ
