# EXTRACT units that exist for timestamps but not timetz, and unknown units.
id: timetz.extract-unsupported-units
title: "EXTRACT DAY and unknown FORTNIGHT on timetz are rejected with 22023"
family: timetz
tier: extended
feature_ids: [timetz, extract, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT EXTRACT(DAY FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04')
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT EXTRACT(FORTNIGHT FROM TIME WITH TIME ZONE '2020-05-26 13:30:25.575401-04')
    expect: error
    sqlstate: "22023"
