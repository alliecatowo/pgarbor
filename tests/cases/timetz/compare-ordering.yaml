# timetz comparison operators compare the time normalized to UTC; ORDER BY and range filters follow that.
id: timetz.compare-ordering
title: "timetz ordering and range comparisons across different zone offsets"
family: timetz
tier: core
feature_ids: [timetz, comparison, order-by, where]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timetz.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE TIMETZ_TBL (f1 time(2) with time zone);
  INSERT INTO TIMETZ_TBL VALUES ('00:01 PDT'), ('01:00 PDT'), ('02:03 PDT'), ('07:07 PST'), ('08:08 EDT'), ('11:59 PDT'), ('12:00 PDT'), ('12:01 PDT'), ('23:59 PDT'), ('11:59:59.99 PM PDT');
steps:
  - sql: |
      SELECT f1 AS "Three" FROM TIMETZ_TBL WHERE f1 < '05:06:07-07' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 AS "Seven" FROM TIMETZ_TBL WHERE f1 > '05:06:07-07' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 AS "None" FROM TIMETZ_TBL WHERE f1 < '00:00-07' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 AS "Ten" FROM TIMETZ_TBL WHERE f1 >= '00:00-07' ORDER BY f1
    expect: rows
    order: ordered
    comment: all rows in UTC-normalized order; boundary at 00:00-07 is inclusive for >=
