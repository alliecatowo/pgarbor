# Documented example: ALTER COLLATION "de_DE" RENAME TO german, then the new name is usable.
id: cmd-alter-collation.doc-example-rename
title: "ALTER COLLATION RENAME runs the documented de_DE to german example"
family: cmd-alter-collation
tier: core
feature_ids: [alter-collation, rename-collation, icu-collation]
required_capabilities: [create-collation, alter-collation, icu-provider, collate-clause, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_collation.sgml#sql-altercollation (Examples: rename de_DE to german)"
sessions: [a]
setup: |
  CREATE COLLATION "de_DE" (provider = icu, locale = 'de-DE');
steps:
  - sql: |
      ALTER COLLATION "de_DE" RENAME TO german
    expect: ok
  - sql: |
      SELECT collname, collprovider FROM pg_collation WHERE collname IN ('de_DE', 'german') ORDER BY collname
    expect: rows
    order: ordered
  - sql: |
      SELECT 'Apfel' COLLATE german < 'apfelsaft' COLLATE german AS lt, 'a' COLLATE german < 'B' COLLATE german AS lt_case
    expect: rows
    order: ordered
    comment: ICU German ordering through the renamed collation
  - sql: |
      SELECT 'x' COLLATE "de_DE"
    expect: error
    sqlstate: "42704"
    comment: the old name no longer resolves
