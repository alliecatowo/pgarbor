# OWNER TO a role that does not exist fails and leaves ownership unchanged.
id: cmd-alter-collation.owner-missing-role
title: "ALTER COLLATION OWNER TO an unknown role fails and keeps the owner"
family: cmd-alter-collation
tier: core
feature_ids: [alter-collation, owner, errors]
required_capabilities: [create-collation, alter-collation, icu-provider, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 docs sql-altercollation.html (OWNER TO new_owner); error code from PG18 oracle"
sessions: [a]
setup: |
  CREATE COLLATION cmd_om (provider = icu, locale = 'und-x-icu');
steps:
  - sql: |
      ALTER COLLATION cmd_om OWNER TO cmd_om_no_such_role
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT pg_get_userbyid(collowner) = CURRENT_USER AS still_current_owner FROM pg_collation WHERE collname = 'cmd_om'
    expect: rows
    order: ordered
    comment: owner is still the creating (current) user
