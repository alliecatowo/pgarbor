# The default collation cannot be refreshed with ALTER COLLATION; the error points at ALTER DATABASE.
id: cmd-alter-collation.refresh-default-error
title: "ALTER COLLATION REFRESH VERSION rejects the default collation"
family: cmd-alter-collation
tier: extended
feature_ids: [alter-collation, refresh-version, default-collation, errors]
required_capabilities: [alter-collation, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_collation.sgml#sql-altercollation-notes (database default collation uses ALTER DATABASE)"
sessions: [a]
steps:
  - sql: |
      ALTER COLLATION "default" REFRESH VERSION
    expect: error
    sqlstate: "XX000"
    comment: message is "cannot refresh version of default collation"; the hint names ALTER DATABASE ... REFRESH COLLATION VERSION
  - sql: |
      SELECT collname, collprovider FROM pg_collation WHERE collname = 'default'
    expect: rows
    order: ordered
    comment: the default collation row is untouched by the failed statement
