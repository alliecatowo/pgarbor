# Documented example: ALTER COLLATION "en_US" OWNER TO joe (role renamed to ac_cmd_joe to avoid corpus-wide name clashes).
id: cmd-alter-collation.doc-example-owner
title: "ALTER COLLATION OWNER TO runs the documented en_US owner example"
family: cmd-alter-collation
tier: core
feature_ids: [alter-collation, owner, icu-collation]
required_capabilities: [create-role, create-collation, alter-collation, icu-provider, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_collation.sgml#sql-altercollation (Examples: change owner of en_US to joe)"
sessions: [a]
setup: |
  CREATE ROLE ac_cmd_joe;
  CREATE COLLATION "en_US" (provider = icu, locale = 'en-US');
steps:
  - sql: |
      ALTER COLLATION "en_US" OWNER TO ac_cmd_joe
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(collowner) FROM pg_collation WHERE collname = 'en_US'
    expect: rows
    order: ordered
  - sql: |
      ALTER COLLATION "en_US" OWNER TO CURRENT_USER
    expect: ok
    comment: cleanup so the role can be dropped
  - sql: |
      DROP ROLE ac_cmd_joe
    expect: ok
