# SET SCHEMA moves a collation; missing target schema and a name clash in the target both fail.
id: cmd-alter-collation.set-schema
title: "ALTER COLLATION SET SCHEMA moves collations and refuses clashes and missing schemas"
family: cmd-alter-collation
tier: core
feature_ids: [alter-collation, set-schema, name-conflicts, errors]
required_capabilities: [create-schema, create-collation, alter-collation, icu-provider, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_collation.sgml#sql-altercollation (SET SCHEMA new_schema)"
sessions: [a]
setup: |
  CREATE SCHEMA cmd_ss1;
  CREATE SCHEMA cmd_ss2;
  CREATE COLLATION cmd_mv (provider = icu, locale = 'und-x-icu');
  CREATE COLLATION cmd_ss1.cmd_clash (provider = icu, locale = 'und-x-icu');
  CREATE COLLATION cmd_ss2.cmd_clash (provider = icu, locale = 'und-x-icu');
steps:
  - sql: |
      ALTER COLLATION cmd_mv SET SCHEMA cmd_ss1
    expect: ok
  - sql: |
      ALTER COLLATION cmd_ss1.cmd_mv SET SCHEMA cmd_nosuch_schema
    expect: error
    sqlstate: "3F000"
  - sql: |
      ALTER COLLATION cmd_ss1.cmd_mv SET SCHEMA cmd_ss1
    expect: ok
    comment: moving to the schema it already lives in is a no-op
  - sql: |
      ALTER COLLATION cmd_ss1.cmd_clash SET SCHEMA cmd_ss2
    expect: error
    sqlstate: "42710"
    comment: cmd_ss2 already has a collation named cmd_clash
  - sql: |
      ALTER COLLATION cmd_ss1.cmd_mv SET SCHEMA cmd_ss2
    expect: ok
  - sql: |
      SELECT n.nspname, c.collname FROM pg_collation c JOIN pg_namespace n ON n.oid = c.collnamespace
        WHERE c.collname IN ('cmd_mv', 'cmd_clash') ORDER BY 1, 2
    expect: rows
    order: ordered
