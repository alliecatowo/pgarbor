# Missing collation and missing schema qualifier produce undefined_object and invalid_schema_name.
id: cmd-alter-collation.rename-missing
title: "ALTER COLLATION RENAME of a missing collation or schema fails without side effects"
family: cmd-alter-collation
tier: core
feature_ids: [alter-collation, rename-collation, errors]
required_capabilities: [create-collation, alter-collation, icu-provider, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 docs sql-altercollation.html (name must be an existing collation); error codes from PG18 oracle"
sessions: [a]
setup: |
  CREATE COLLATION cmd_rm_present (provider = icu, locale = 'und-x-icu');
steps:
  - sql: |
      ALTER COLLATION cmd_rm_absent RENAME TO cmd_rm_new
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER COLLATION cmd_rm_nosuch_schema.cmd_rm_present RENAME TO cmd_rm_new
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT collname FROM pg_collation WHERE collname LIKE 'cmd\_rm\_%' ORDER BY 1
    expect: rows
    order: ordered
    comment: nothing was renamed
