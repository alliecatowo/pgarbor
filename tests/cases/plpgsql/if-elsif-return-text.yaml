# IF / ELSIF / ELSE control flow with a NULL argument on a non-strict function.
id: plpgsql.if-elsif-return-text
title: plpgsql IF/ELSIF/ELSE chooses branches; NULL argument reaches the body (non-strict)
family: plpgsql
tier: core
feature_ids: [plpgsql, control-flow, null-handling]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/plpgsql.sql"
sessions: [a]
setup: |
  CREATE FUNCTION pl_grade(n int) RETURNS text LANGUAGE plpgsql AS $$
  BEGIN
    IF n IS NULL THEN RETURN 'unknown';
    ELSIF n >= 90 THEN RETURN 'A';
    ELSIF n >= 50 THEN RETURN 'pass';
    ELSE RETURN 'fail';
    END IF;
  END $$;
steps:
  - sql: |
      SELECT n, pl_grade(n) AS grade
      FROM (VALUES (95), (50), (49), (NULL::int)) AS v(n)
      ORDER BY n NULLS LAST
    expect: rows
    order: ordered
