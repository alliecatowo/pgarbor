# Non-strict SELECT INTO sets NULL on no rows and FOUND to false; GET DIAGNOSTICS ROW_COUNT counts UPDATE rows.
id: plpgsql.select-into-found-and-row-count
title: SELECT INTO without STRICT sets NULL and FOUND; GET DIAGNOSTICS ROW_COUNT after UPDATE
family: plpgsql
tier: core
feature_ids: [plpgsql, select-into, found, get-diagnostics, update]
required_capabilities: [plpgsql, create-function, create-table, insert, update, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/plpgsql.sql"
sessions: [a]
setup: |
  CREATE TABLE items (id int, name text);
  INSERT INTO items VALUES (1, 'a'), (2, 'b'), (3, 'c');
  CREATE FUNCTION pl_probe(p_id int) RETURNS text LANGUAGE plpgsql AS $$
  DECLARE v text; f int;
  BEGIN
    SELECT name INTO v FROM items WHERE id = p_id;
    IF FOUND THEN f := 1; ELSE f := 0; END IF;
    RETURN coalesce(v, '<null>') || ' found=' || f;
  END $$;
  CREATE FUNCTION pl_bump(p_min int) RETURNS int LANGUAGE plpgsql AS $$
  DECLARE n int;
  BEGIN
    UPDATE items SET id = id WHERE id >= p_min;
    GET DIAGNOSTICS n = ROW_COUNT;
    RETURN n;
  END $$;
steps:
  - sql: |
      SELECT pl_probe(2) AS hit
    expect: rows
  - sql: |
      SELECT pl_probe(42) AS miss
    expect: rows
  - sql: |
      SELECT pl_bump(2) AS updated_two
    expect: rows
  - sql: |
      SELECT pl_bump(10) AS updated_none
    expect: rows
