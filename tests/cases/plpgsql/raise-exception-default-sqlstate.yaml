# RAISE EXCEPTION without a USING ERRCODE clause raises raise_exception (P0001); NULL format args still raise.
id: plpgsql.raise-exception-default-p0001
title: RAISE EXCEPTION with format arguments defaults to SQLSTATE P0001, including NULL arguments
family: plpgsql
tier: core
feature_ids: [plpgsql, raise, errors]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/plpgsql.sql"
sessions: [a]
setup: |
  CREATE FUNCTION pl_fail(msg text) RETURNS void LANGUAGE plpgsql AS $$
  BEGIN RAISE EXCEPTION 'custom failure: %', msg; END $$;
steps:
  - sql: |
      SELECT pl_fail('disk')
    expect: error
    sqlstate: "P0001"
  - sql: |
      SELECT pl_fail(NULL::text)
    expect: error
    sqlstate: "P0001"
    comment: a NULL format argument renders as empty text and still raises
  - sql: |
      SELECT 'still usable' AS status
    expect: rows
