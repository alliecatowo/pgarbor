# SELECT INTO STRICT raises no_data_found (P0002) on zero rows and too_many_rows (P0003) on more than one row.
id: plpgsql.select-into-strict-no-data-and-too-many
title: SELECT INTO STRICT raises P0002 for no rows and P0003 for multiple rows
family: plpgsql
tier: core
feature_ids: [plpgsql, select-into, errors]
required_capabilities: [plpgsql, create-function, create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/plpgsql.sql"
sessions: [a]
setup: |
  CREATE TABLE items (id int, name text);
  INSERT INTO items VALUES (1, 'a'), (2, 'b');
  CREATE FUNCTION pl_strict_one(p_id int) RETURNS text LANGUAGE plpgsql AS $$
  DECLARE v text;
  BEGIN
    SELECT name INTO STRICT v FROM items WHERE id = p_id;
    RETURN v;
  END $$;
  CREATE FUNCTION pl_strict_all() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE v text;
  BEGIN
    SELECT name INTO STRICT v FROM items;
    RETURN v;
  END $$;
steps:
  - sql: |
      SELECT pl_strict_one(1) AS found
    expect: rows
  - sql: |
      SELECT pl_strict_one(9)
    expect: error
    sqlstate: "P0002"
  - sql: |
      SELECT pl_strict_all()
    expect: error
    sqlstate: "P0003"
