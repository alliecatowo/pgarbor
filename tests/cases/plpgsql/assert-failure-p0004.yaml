# ASSERT raises assert_failure (P0004) when the condition is false or NULL.
id: plpgsql.assert-failure-p0004
title: ASSERT passes on true and raises P0004 on false or NULL conditions
family: plpgsql
tier: core
feature_ids: [plpgsql, assert, errors, null-handling]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/plpgsql-statements.html#PLPGSQL-STATEMENTS-ASSERT"
sessions: [a]
setup: |
  CREATE FUNCTION pl_assert(v int) RETURNS int LANGUAGE plpgsql AS $$
  BEGIN
    ASSERT v > 0, 'v must be positive';
    RETURN v;
  END $$;
steps:
  - sql: |
      SELECT pl_assert(3) AS ok
    expect: rows
  - sql: |
      SELECT pl_assert(0)
    expect: error
    sqlstate: "P0004"
  - sql: |
      SELECT pl_assert(NULL::int)
    expect: error
    sqlstate: "P0004"
    comment: a NULL condition is treated as a failed assertion
