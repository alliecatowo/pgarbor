# EXPLAIN of CREATE TABLE AS without ANALYZE shows the query plan and does not create the table.
id: cmd-explain.plan-only-create-table-as
title: EXPLAIN without ANALYZE on CREATE TABLE AS creates nothing
family: cmd-explain
tier: core
feature_ids: [explain, create-table-as, select, filter]
required_capabilities: [create-table, insert, select, explain, create-table-as]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#description"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      EXPLAIN (COSTS OFF) CREATE TABLE t2 AS SELECT a FROM t WHERE a > 1
    expect: rows
    order: ordered
  - sql: |
      SELECT to_regclass('t2') IS NULL AS t2_absent
    expect: rows
    order: ordered
    comment: the explained statement was not executed, so t2 does not exist
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    order: ordered
