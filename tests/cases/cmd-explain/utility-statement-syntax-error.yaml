# EXPLAIN takes only the statement kinds listed in the docs; a DROP TABLE is a syntax error and nothing is dropped.
id: cmd-explain.utility-statement-syntax-error
title: EXPLAIN of a DROP TABLE is a syntax error and leaves the table intact
family: cmd-explain
tier: core
feature_ids: [explain, drop-table, errors, syntax]
required_capabilities: [create-table, insert, select, explain, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-statement"
sessions: [a]
setup: |
  CREATE TABLE foo (i int4);
  INSERT INTO foo VALUES (1), (2);
steps:
  - sql: |
      EXPLAIN DROP TABLE foo
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT i FROM foo ORDER BY i
    expect: rows
    order: ordered
    comment: the table still exists with its rows
