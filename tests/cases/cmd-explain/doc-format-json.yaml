# Documented JSON example: one text row holding a JSON array with the plan under Plan and Node Type Seq Scan.
id: cmd-explain.doc-format-json
title: EXPLAIN (FORMAT JSON) on a full scan returns the documented plan document
family: cmd-explain
tier: core
feature_ids: [explain, explain-format-json, seq-scan]
required_capabilities: [create-table, create-index, insert, select, explain]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#examples"
  license: "PostgreSQL documentation"
sessions: [a]
setup: |
  CREATE TABLE foo (i int4);
  CREATE INDEX fi ON foo (i);
  INSERT INTO foo SELECT g FROM generate_series(1, 10) g;
steps:
  - sql: |
      EXPLAIN (FORMAT JSON) SELECT * FROM foo
    expect: rows
    order: ordered
    comment: a single QUERY PLAN row; the docs' cost numbers depend on table size, so the recorder keeps whatever the oracle reports
