# EXPLAIN ANALYZE on a VALUES list reports a Values Scan with the number of rows it produced.
id: cmd-explain.analyze-values-scan
title: EXPLAIN ANALYZE of a VALUES list reports its actual row count
family: cmd-explain
tier: core
feature_ids: [explain, explain-analyze, values-list]
required_capabilities: [explain]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-analyze"
sessions: [a]
steps:
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF) VALUES (1), (2), (3)
    expect: rows
    order: ordered
    comment: actual rows is 3 with loops 1
