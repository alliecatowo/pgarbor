# SERIALIZE measures output conversion, so the docs require ANALYZE; without it the option is rejected with invalid_parameter_value.
id: cmd-explain.serialize-requires-analyze
title: EXPLAIN SERIALIZE without ANALYZE is rejected
family: cmd-explain
tier: extended
feature_ids: [explain, explain-serialize, errors]
required_capabilities: [explain, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-serialize"
sessions: [a]
steps:
  - sql: |
      EXPLAIN (SERIALIZE TEXT) SELECT 1
    expect: error
    sqlstate: "22023"
    comment: message is EXPLAIN option SERIALIZE requires ANALYZE
  - sql: |
      EXPLAIN (SERIALIZE) SELECT 1
    expect: error
    sqlstate: "22023"
    comment: bare SERIALIZE means TEXT, and the ANALYZE check still applies
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF, SERIALIZE TEXT) SELECT 1
    expect: rows
    order: ordered
    comment: with ANALYZE the same option is accepted
