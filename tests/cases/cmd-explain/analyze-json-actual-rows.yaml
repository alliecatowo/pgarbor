# EXPLAIN ANALYZE in JSON format carries Actual Rows and Actual Loops for each plan node.
id: cmd-explain.analyze-json-actual-rows
title: EXPLAIN (ANALYZE, FORMAT JSON) reports actual rows and loops
family: cmd-explain
tier: core
feature_ids: [explain, explain-analyze, explain-format-json, bitmap-scan]
required_capabilities: [create-table, create-index, insert, select, explain]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-analyze"
sessions: [a]
setup: |
  CREATE TABLE foo (i int4);
  CREATE INDEX fi ON foo (i);
  INSERT INTO foo SELECT g FROM generate_series(1, 10) g;
steps:
  - sql: |
      EXPLAIN (ANALYZE, FORMAT JSON, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF) SELECT i FROM foo WHERE i > 7
    expect: rows
    order: ordered
    comment: rows 8 through 10 qualify, so the top node reports Actual Rows 3
