# EXPLAIN boolean options accept TRUE/ON/1, FALSE/OFF/0 and a bare name meaning TRUE; the last of a repeated option wins.
id: cmd-explain.boolean-option-forms
title: EXPLAIN boolean option spellings and repeated option precedence
family: cmd-explain
tier: core
feature_ids: [explain, explain-options, explain-costs, explain-verbose, boolean-literals]
required_capabilities: [explain, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-boolean"
sessions: [a]
steps:
  - sql: |
      EXPLAIN (COSTS 0) SELECT 1 AS x
    expect: rows
    order: ordered
    comment: 0 is an accepted spelling of FALSE
  - sql: |
      EXPLAIN (COSTS FALSE) SELECT 1 AS x
    expect: rows
    order: ordered
  - sql: |
      EXPLAIN (COSTS 1) SELECT 1 AS x
    expect: rows
    order: ordered
    comment: 1 is an accepted spelling of TRUE
  - sql: |
      EXPLAIN (COSTS ON) SELECT 1 AS x
    expect: rows
    order: ordered
  - sql: |
      EXPLAIN (COSTS OFF, COSTS ON) SELECT 1 AS x
    expect: rows
    order: ordered
    comment: repeated option is accepted and the later value decides, so costs are shown
  - sql: |
      EXPLAIN (COSTS ON, COSTS OFF) SELECT 1 AS x
    expect: rows
    order: ordered
    comment: the later OFF decides, so costs are hidden
  - sql: |
      EXPLAIN (VERBOSE, COSTS OFF) SELECT 1 AS x
    expect: rows
    order: ordered
    comment: a bare option name means TRUE, so the output column list appears
