# SERIALIZE TEXT and SERIALIZE BINARY add a Serialization line with the output size and format, and the rows are not sent.
id: cmd-explain.analyze-serialize
title: EXPLAIN ANALYZE SERIALIZE reports output size and format without sending rows
family: cmd-explain
tier: extended
feature_ids: [explain, explain-analyze, explain-serialize, output-conversion]
required_capabilities: [create-table, create-index, insert, select, explain]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-serialize"
sessions: [a]
setup: |
  CREATE TABLE foo (i int4);
  CREATE INDEX fi ON foo (i);
  INSERT INTO foo SELECT g FROM generate_series(1, 10) g;
steps:
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF, SERIALIZE TEXT) SELECT i FROM foo WHERE i > 7
    expect: rows
    order: ordered
    comment: the final line reads Serialization with format=text
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF, SERIALIZE BINARY) SELECT i FROM foo WHERE i > 7
    expect: rows
    order: ordered
    comment: the same query with format=binary
