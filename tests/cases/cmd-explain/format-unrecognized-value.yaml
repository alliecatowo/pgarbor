# An unknown FORMAT value is rejected, while FORMAT text in any letter case is accepted.
id: cmd-explain.format-unrecognized-value
title: EXPLAIN FORMAT rejects unknown values and accepts text
family: cmd-explain
tier: core
feature_ids: [explain, explain-format, errors]
required_capabilities: [explain, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-format"
sessions: [a]
steps:
  - sql: |
      EXPLAIN (FORMAT PLAIN) SELECT 1
    expect: error
    sqlstate: "22023"
    comment: PLAIN is not a format; the documented values are TEXT, XML, JSON and YAML
  - sql: |
      EXPLAIN (FORMAT text, COSTS OFF) SELECT 1
    expect: rows
    order: ordered
    comment: the format name is case-insensitive
