# Documented YAML example: the plan is rendered as a YAML sequence with a Plan mapping and an index condition.
id: cmd-explain.doc-format-yaml
title: EXPLAIN (FORMAT YAML) on an indexable predicate
family: cmd-explain
tier: core
feature_ids: [explain, explain-format-yaml, index-scan]
required_capabilities: [create-table, create-index, insert, select, explain]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#examples"
  license: "PostgreSQL documentation"
sessions: [a]
setup: |
  CREATE TABLE foo (i int4);
  CREATE INDEX fi ON foo (i);
  INSERT INTO foo SELECT g FROM generate_series(1, 10) g;
steps:
  - sql: |
      EXPLAIN (FORMAT YAML, COSTS OFF) SELECT * FROM foo WHERE i = '4'
    expect: rows
    order: ordered
    comment: the literal '4' is coerced to int4 and the index condition is shown as an expression string
