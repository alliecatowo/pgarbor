# EXPLAIN ANALYZE executes CREATE TABLE AS, so the new table exists with the query's rows afterwards.
id: cmd-explain.analyze-create-table-as-executes
title: EXPLAIN ANALYZE of CREATE TABLE AS creates and populates the table
family: cmd-explain
tier: core
feature_ids: [explain, explain-analyze, create-table-as, filter]
required_capabilities: [create-table, insert, select, explain, create-table-as]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-statement"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF) CREATE TABLE t2 AS SELECT a FROM t WHERE a > 1
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM t2 ORDER BY a
    expect: rows
    order: ordered
    comment: ANALYZE really ran the statement, so t2 holds the rows matching a > 1
