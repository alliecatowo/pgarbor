# The docs say TIMING may only be used together with ANALYZE, but PG 18.6 accepts TIMING alone and plans normally.
id: cmd-explain.timing-without-analyze-accepted
title: EXPLAIN accepts TIMING without ANALYZE and returns a plain plan
family: cmd-explain
tier: extended
feature_ids: [explain, explain-timing, explain-options]
required_capabilities: [create-table, insert, explain, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-timing"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      EXPLAIN (TIMING OFF, COSTS OFF) SELECT a FROM t
    expect: rows
    order: ordered
    comment: documented as ANALYZE-only, but the oracle accepts it; plan has no actual-time lines
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    order: ordered
