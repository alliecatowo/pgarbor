# Documented aggregate example: an Aggregate node sits above an index-driven scan with the range condition.
id: cmd-explain.doc-aggregate-index
title: EXPLAIN of sum() over an indexed range predicate, plus its result
family: cmd-explain
tier: core
feature_ids: [explain, aggregates, sum, index-scan]
required_capabilities: [create-table, create-index, insert, select, explain, aggregates]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#examples"
  license: "PostgreSQL documentation"
sessions: [a]
setup: |
  CREATE TABLE foo (i int4);
  CREATE INDEX fi ON foo (i);
  INSERT INTO foo SELECT g FROM generate_series(1, 10) g;
steps:
  - sql: |
      EXPLAIN (COSTS OFF) SELECT sum(i) FROM foo WHERE i < 10
    expect: rows
    order: ordered
  - sql: |
      SELECT sum(i) FROM foo WHERE i < 10
    expect: rows
    order: multiset
    comment: the range is exclusive, so only rows 1 through 9 are summed
  - sql: |
      SELECT sum(i) FROM foo WHERE i < 1
    expect: rows
    order: multiset
    comment: no rows match, and sum over an empty input is NULL
