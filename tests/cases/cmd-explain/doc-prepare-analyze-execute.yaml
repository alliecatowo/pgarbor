# Documented EXPLAIN ANALYZE EXECUTE example: a prepared aggregate query is explained with actual row counts.
id: cmd-explain.doc-prepare-analyze-execute
title: EXPLAIN ANALYZE EXECUTE of a prepared grouped range query
family: cmd-explain
tier: core
feature_ids: [explain, explain-analyze, prepare, execute, group-by, hash-aggregate]
required_capabilities: [create-table, create-index, insert, select, explain, prepare, execute]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#examples"
  license: "PostgreSQL documentation"
sessions: [a]
setup: |
  CREATE TABLE test (id int4 PRIMARY KEY, foo int4, bar int4);
  INSERT INTO test SELECT g, g % 10, g FROM generate_series(1, 300) g;
  ANALYZE test;
steps:
  - sql: |
      PREPARE query(int, int) AS SELECT sum(bar) FROM test WHERE id > $1 AND id < $2 GROUP BY foo
    expect: ok
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF) EXECUTE query(100, 200)
    expect: rows
    order: ordered
    comment: actual rows are reported per node; the docs' example uses the same plan shape with costs and timing shown
