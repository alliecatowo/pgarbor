# Documented index example: with COSTS FALSE the plan keeps only the node structure and index condition.
id: cmd-explain.doc-costs-false-index
title: EXPLAIN (COSTS FALSE) on an indexable equality predicate
family: cmd-explain
tier: core
feature_ids: [explain, explain-costs, index-scan, btree-index]
required_capabilities: [create-table, create-index, insert, select, explain]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#examples"
  license: "PostgreSQL documentation"
sessions: [a]
setup: |
  CREATE TABLE foo (i int4);
  CREATE INDEX fi ON foo (i);
  INSERT INTO foo SELECT g FROM generate_series(1, 10) g;
steps:
  - sql: |
      EXPLAIN (COSTS FALSE) SELECT * FROM foo WHERE i = 4
    expect: rows
    order: ordered
    comment: the docs show an Index Scan for a 10000-row table; a 10-row table may pick a bitmap scan, and either is recorded
  - sql: |
      SELECT i FROM foo WHERE i = 4
    expect: rows
    order: multiset
