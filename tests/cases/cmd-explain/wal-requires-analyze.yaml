# WAL reports WAL generation, which exists only for executed statements, so the option requires ANALYZE.
id: cmd-explain.wal-requires-analyze
title: EXPLAIN WAL without ANALYZE is rejected
family: cmd-explain
tier: extended
feature_ids: [explain, explain-wal, errors]
required_capabilities: [explain, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/explain.sgml#parameters-wal"
sessions: [a]
steps:
  - sql: |
      EXPLAIN (WAL) SELECT 1
    expect: error
    sqlstate: "22023"
    comment: message is EXPLAIN option WAL requires ANALYZE
