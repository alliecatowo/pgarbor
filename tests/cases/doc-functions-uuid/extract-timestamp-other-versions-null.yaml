# uuid_extract_timestamp is defined only for versions 1 and 7; other RFC versions give null, while their version still extracts.
id: doc-functions-uuid.extract-timestamp-other-versions-null
title: uuid_extract_timestamp returns null for versions other than 1 and 7
family: doc-functions-uuid
tier: core
feature_ids: [uuid, uuid-extract-timestamp, uuid-extract-version, uuid-version]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-uuid (uuid_extract_timestamp: from a UUID of version 1 or 7; for other versions returns null)"
sessions: [a]
steps:
  - sql: |
      SELECT uuid_extract_timestamp(gen_random_uuid()) AS v4_ts,
             uuid_extract_timestamp(uuidv4()) AS v4b_ts
    expect: rows
    comment: random version 4 uuids have no timestamp
  - sql: |
      SELECT uuid_extract_timestamp('a0eebc99-9c0b-3ef8-bb6d-6bb9bd380a11'::uuid) AS v3_ts,
             uuid_extract_version('a0eebc99-9c0b-3ef8-bb6d-6bb9bd380a11'::uuid) AS v3_version
    expect: rows
    comment: version 3 has no timestamp, but its version still extracts as 3
  - sql: |
      SELECT uuid_extract_timestamp('a0eebc99-9c0b-5ef8-bb6d-6bb9bd380a11'::uuid) AS v5_ts,
             uuid_extract_version('a0eebc99-9c0b-5ef8-bb6d-6bb9bd380a11'::uuid) AS v5_version
    expect: rows
    comment: version 5 behaves like version 3
  - sql: |
      SELECT uuid_extract_timestamp('00000000-0000-0000-0000-000000000000'::uuid) AS nil_ts,
             uuid_extract_version('00000000-0000-0000-0000-000000000000'::uuid) AS nil_version
    expect: rows
    comment: the nil uuid is non-RFC, so both extractors return null
