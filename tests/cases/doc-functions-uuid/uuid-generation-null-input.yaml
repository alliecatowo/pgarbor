# NULL semantics for the uuid generators and extractors: a NULL shift gives NULL, and NULL input gives NULL.
id: doc-functions-uuid.null-input-semantics
title: NULL shift and NULL uuid arguments yield NULL from the uuid functions
family: doc-functions-uuid
tier: core
feature_ids: [uuid, uuidv7, uuid-extract-version, uuid-extract-timestamp, null-semantics]
required_capabilities: [select]
provenance:
  source: hand
  ref: "func.sgml#functions-uuid; NULL behavior of strict functions (not stated explicitly in the docs)"
sessions: [a]
steps:
  - sql: |
      SELECT uuidv7(NULL::interval) IS NULL AS shift_null_gives_null
    expect: rows
    comment: a NULL shift argument returns NULL rather than an error
  - sql: |
      SELECT uuid_extract_version(NULL::uuid) IS NULL AS v_null,
             uuid_extract_timestamp(NULL::uuid) IS NULL AS ts_null
    expect: rows
    comment: extraction functions return NULL for NULL input
  - sql: |
      SELECT uuid_extract_version(NULL::uuid) AS v_null_val, uuid_extract_timestamp(NULL::uuid) AS ts_null_val
    expect: rows
    comment: both extractors return a NULL value of their declared type
