# uuid_extract_timestamp of the documented version 7 example, and of a version 1 uuid, returns a timestamp with time zone.
id: doc-functions-uuid.extract-timestamp-doc-example
title: uuid_extract_timestamp reproduces the documented version 7 example and reads version 1
family: doc-functions-uuid
tier: core
feature_ids: [uuid, uuid-extract-timestamp, uuidv7, uuid-version-1, time-zone]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-uuid (UUID Extraction Functions: uuid_extract_timestamp example)"
sessions: [a]
steps:
  - sql: |
      SELECT to_char(uuid_extract_timestamp('019535d9-3df7-79fb-b466-fa907fa17f9e'::uuid)
                     AT TIME ZONE 'America/New_York', 'YYYY-MM-DD HH24:MI:SS.MS') AS ny_wall_clock
    expect: rows
    comment: doc example shows 2025-02-23 21:46:24.503-05 (New York, EST)
  - sql: |
      SELECT to_char(uuid_extract_timestamp('019535d9-3df7-79fb-b466-fa907fa17f9e'::uuid)
                     AT TIME ZONE 'UTC', 'YYYY-MM-DD HH24:MI:SS.MS') AS utc_wall_clock
    expect: rows
    comment: the same instant in UTC is 2025-02-24 02:46:24.503
  - sql: |
      SELECT uuid_extract_version('a0eebc99-9c0b-11ef-8bb6-6bb9bd380a11'::uuid) AS v,
             to_char(uuid_extract_timestamp('a0eebc99-9c0b-11ef-8bb6-6bb9bd380a11'::uuid) AT TIME ZONE 'UTC',
                     'YYYY-MM-DD HH24:MI:SS.US') AS v1_utc
    expect: rows
    comment: version 1 uuids carry a timestamp that is extracted the same way
