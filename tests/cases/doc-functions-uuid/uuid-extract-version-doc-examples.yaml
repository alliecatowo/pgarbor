# uuid_extract_version returns the RFC 9562 version of the documented examples, typed smallint.
id: doc-functions-uuid.extract-version-doc-examples
title: uuid_extract_version returns 4, 7 and 1 for the documented and sample uuids
family: doc-functions-uuid
tier: core
feature_ids: [uuid, uuid-extract-version, uuid-version, smallint]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-uuid (UUID Extraction Functions: uuid_extract_version examples)"
sessions: [a]
steps:
  - sql: |
      SELECT uuid_extract_version('41db1265-8bc1-4ab3-992f-885799a4af1d'::uuid) AS doc_v4,
             uuid_extract_version('019535d9-3df7-79fb-b466-fa907fa17f9e'::uuid) AS doc_v7
    expect: rows
    comment: doc examples give 4 and 7
  - sql: |
      SELECT uuid_extract_version('a0eebc99-9c0b-11ef-8bb6-6bb9bd380a11'::uuid) AS v1
    expect: rows
    comment: version nibble 1 with RFC variant
  - sql: |
      SELECT pg_typeof(uuid_extract_version(gen_random_uuid()))::text AS result_type
    expect: rows
    comment: the documented return type is smallint
  - sql: |
      SELECT uuid_extract_version(gen_random_uuid()) = 4 AS random_is_v4,
             uuid_extract_version(uuidv7()) = 7 AS v7_is_v7
    expect: rows
    comment: extraction agrees with the generator that produced the value
