# uuidv7() as a column default: rows inserted in separate statements sort by primary key in insertion order, and extract as version 7.
id: doc-functions-uuid.uuidv7-default-table-order
title: uuidv7 column default yields version 7 keys that sort in insertion order
family: doc-functions-uuid
tier: core
feature_ids: [uuid, uuidv7, column-default, primary-key, uuid-extract-version, order-by]
required_capabilities: [create-table, insert, select, constraints]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-uuid (uuidv7 time-ordered generation); doc-ddl-default usage pattern"
sessions: [a]
setup: |
  CREATE TABLE ev (id uuid PRIMARY KEY DEFAULT uuidv7(), label text NOT NULL)
steps:
  - sql: |
      INSERT INTO ev (label) VALUES ('first')
    expect: ok
  - sql: |
      INSERT INTO ev (label) VALUES ('second')
    expect: ok
  - sql: |
      INSERT INTO ev (label) VALUES ('third')
    expect: ok
  - sql: |
      SELECT label FROM ev ORDER BY id
    expect: rows
    order: ordered
    comment: time-ordered keys sort in insertion order
  - sql: |
      SELECT count(*) AS n, bool_and(uuid_extract_version(id) = 7) AS all_v7 FROM ev
    expect: rows
    comment: every default-generated key is version 7
