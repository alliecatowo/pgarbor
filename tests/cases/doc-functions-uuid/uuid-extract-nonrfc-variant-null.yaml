# For uuids outside the RFC 9562 variant, uuid_extract_version returns null, and so does the timestamp extractor.
id: doc-functions-uuid.extract-nonrfc-variant-null
title: Version and timestamp extraction return null for non-RFC variant uuids
family: doc-functions-uuid
tier: core
feature_ids: [uuid, uuid-extract-version, uuid-extract-timestamp, uuid-variant]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-uuid (uuid_extract_version: For other variants, this function returns null)"
sessions: [a]
steps:
  - sql: |
      SELECT uuid_extract_version('41db1265-8bc1-4ab3-092f-885799a4af1d'::uuid) AS ncs_variant,
             uuid_extract_version('41db1265-8bc1-4ab3-c92f-885799a4af1d'::uuid) AS microsoft_variant,
             uuid_extract_version('41db1265-8bc1-4ab3-e92f-885799a4af1d'::uuid) AS reserved_variant
    expect: rows
    comment: variant bits 0, 110 and 111 are not RFC 9562; each returns null
  - sql: |
      SELECT uuid_extract_timestamp('019535d9-3df7-79fb-0466-fa907fa17f9e'::uuid) AS v7_ncs_ts
    expect: rows
    comment: a version 7 shape with a non-RFC variant has no timestamp
  - sql: |
      SELECT uuid_extract_version('41db1265-8bc1-4ab3-192f-885799a4af1d'::uuid) AS rfc_ncs_edge
    expect: rows
    comment: variant nibble 1 is still NCS, so the version is null
