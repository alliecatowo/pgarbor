# Documented uuidv7 error conditions: infinite intervals and shifted timestamps outside the 48-bit millisecond range.
id: doc-functions-uuid.uuidv7-shift-out-of-range
title: uuidv7 rejects infinite shifts and timestamps outside 1970 to about year 10889
family: doc-functions-uuid
tier: core
feature_ids: [uuid, uuidv7, uuidv7-shift, errors, interval]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-uuid (uuidv7 (shift interval): infinite intervals; supported range)"
sessions: [a]
steps:
  - sql: |
      SELECT uuidv7(interval 'infinity')
    expect: error
    sqlstate: "22008"
    comment: doc says infinite intervals are not accepted
  - sql: |
      SELECT uuidv7(interval '-infinity')
    expect: error
    sqlstate: "22008"
    comment: negative infinity is also an infinite interval
  - sql: |
      SELECT uuidv7(interval '-60 years')
    expect: error
    sqlstate: "22008"
    comment: about 1966, before the 1970-01-01 lower bound of the 48-bit millisecond field
  - sql: |
      SELECT uuidv7(interval '9000 years')
    expect: error
    sqlstate: "22008"
    comment: about year 11026, beyond approximately year 10889
  - sql: |
      SELECT uuidv7(interval '-50 years') IS NOT NULL AS lower_ok, uuidv7(interval '8000 years') IS NOT NULL AS upper_ok
    expect: rows
    comment: shifts well inside the supported range still succeed
