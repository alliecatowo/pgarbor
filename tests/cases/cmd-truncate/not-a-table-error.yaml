# TRUNCATE only accepts ordinary tables (and partitioned tables); views and sequences are rejected.
id: cmd-truncate.not-a-table-error
title: "TRUNCATE rejects a view or a sequence with 'is not a table'"
family: cmd-truncate
tier: core
feature_ids: [truncate, view, sequence, errors]
required_capabilities: [create-table, insert, select, views, sequences, truncate]
provenance:
  source: hand
  ref: "ref/truncate.sgml#synopsis (name must be a table)"
sessions: [a]
setup: |
  CREATE TABLE base (id int4);
  CREATE VIEW base_v AS SELECT id FROM base;
  CREATE SEQUENCE base_seq;
  INSERT INTO base VALUES (1);
steps:
  - sql: |
      TRUNCATE base_v
    expect: error
    sqlstate: "42809"
  - sql: |
      TRUNCATE base_seq
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT count(*) AS n FROM base
    expect: rows
    order: ordered
