# If any named table does not exist the whole command fails and no table is truncated.
id: cmd-truncate.missing-table-atomic
title: "TRUNCATE with an unknown table name fails atomically and keeps the other tables' rows"
family: cmd-truncate
tier: core
feature_ids: [truncate, multi-table, errors, create-table, insert, select]
required_capabilities: [create-table, insert, select, truncate]
provenance:
  source: hand
  ref: "ref/truncate.sgml#description (behaves like one command across the listed tables)"
sessions: [a]
setup: |
  CREATE TABLE keep_me (id int4);
  INSERT INTO keep_me VALUES (1), (2);
steps:
  - sql: |
      TRUNCATE keep_me, no_such_table
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT count(*) AS n FROM keep_me
    expect: rows
    order: ordered
    comment: the listed existing table was not truncated
