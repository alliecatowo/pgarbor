# TRUNCATE of one partition empties only that partition; sibling partitions keep their rows.
id: cmd-truncate.partition-sibling-untouched
title: "TRUNCATE on one partition leaves the sibling partitions untouched"
family: cmd-truncate
tier: extended
feature_ids: [truncate, partitioning, insert, select]
required_capabilities: [create-table, insert, select, partitioning, truncate]
provenance:
  source: pg-docs
  ref: "ref/truncate.sgml#notes (when the table to be truncated is a partition, sibling partitions are left untouched)"
sessions: [a]
setup: |
  CREATE TABLE pt (id int4, k int4) PARTITION BY RANGE (k);
  CREATE TABLE pt1 PARTITION OF pt FOR VALUES FROM (0) TO (10);
  CREATE TABLE pt2 PARTITION OF pt FOR VALUES FROM (10) TO (20);
  INSERT INTO pt VALUES (1, 1), (2, 2), (3, 11);
steps:
  - sql: |
      TRUNCATE pt1
    expect: ok
  - sql: |
      SELECT id, k FROM pt ORDER BY id
    expect: rows
    order: ordered
    comment: rows of pt1 are gone and the row in pt2 remains
