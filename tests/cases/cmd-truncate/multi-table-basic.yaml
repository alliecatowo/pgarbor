# Doc example: TRUNCATE bigtable, fattable empties both tables in one command.
id: cmd-truncate.multi-table-basic
title: "TRUNCATE accepts a comma-separated list and empties every named table"
family: cmd-truncate
tier: core
feature_ids: [truncate, multi-table, create-table, insert, select]
required_capabilities: [create-table, insert, select, truncate]
provenance:
  source: pg-docs
  ref: "ref/truncate.sgml#examples (TRUNCATE bigtable, fattable)"
sessions: [a]
setup: |
  CREATE TABLE bigtable (id int4, payload text);
  CREATE TABLE fattable (id int4, payload text);
  CREATE TABLE untouched (id int4);
  INSERT INTO bigtable VALUES (1, 'x'), (2, 'y');
  INSERT INTO fattable VALUES (10, 'p');
  INSERT INTO untouched VALUES (99);
steps:
  - sql: |
      TRUNCATE bigtable, fattable
    expect: ok
  - sql: |
      SELECT 'bigtable' AS t, count(*) AS n FROM bigtable
      UNION ALL SELECT 'fattable', count(*) FROM fattable
      UNION ALL SELECT 'untouched', count(*) FROM untouched
      ORDER BY t
    expect: rows
    order: ordered
    comment: both named tables are empty; untouched keeps its row
