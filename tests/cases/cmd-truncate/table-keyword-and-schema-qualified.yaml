# TABLE is an optional noise word, a schema-qualified name works, and naming the same table twice is allowed.
id: cmd-truncate.table-keyword-and-schema-qualified
title: "TRUNCATE TABLE, schema-qualified names and a duplicated table name are all accepted"
family: cmd-truncate
tier: core
feature_ids: [truncate, schema, create-table, insert, select]
required_capabilities: [create-table, insert, select, schemas, truncate]
provenance:
  source: pg-docs
  ref: "ref/truncate.sgml#synopsis (TRUNCATE [ TABLE ] name)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
  CREATE TABLE s1.st (id int4);
  CREATE TABLE plain (id int4);
  INSERT INTO s1.st VALUES (1), (2);
  INSERT INTO plain VALUES (3);
steps:
  - sql: |
      TRUNCATE TABLE s1.st
    expect: ok
  - sql: |
      INSERT INTO s1.st VALUES (5)
    expect: ok
  - sql: |
      TRUNCATE s1.st, plain, s1.st
    expect: ok
    comment: the same table listed twice is truncated once without error
  - sql: |
      SELECT (SELECT count(*) FROM s1.st) AS st, (SELECT count(*) FROM plain) AS pl
    expect: rows
    order: ordered
