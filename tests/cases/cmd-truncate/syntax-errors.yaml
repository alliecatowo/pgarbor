# Malformed TRUNCATE statements are rejected by the parser with a syntax error.
id: cmd-truncate.syntax-errors
title: "TRUNCATE with no table name or a dangling option is a syntax error"
family: cmd-truncate
tier: core
feature_ids: [truncate, syntax, errors]
required_capabilities: [create-table, insert, select, truncate]
provenance:
  source: pg-docs
  ref: "ref/truncate.sgml#synopsis"
sessions: [a]
setup: |
  CREATE TABLE sx (id int4);
  INSERT INTO sx VALUES (1);
steps:
  - sql: |
      TRUNCATE
    expect: error
    sqlstate: "42601"
  - sql: |
      TRUNCATE sx RESTART
    expect: error
    sqlstate: "42601"
    comment: RESTART must be followed by IDENTITY
  - sql: |
      TRUNCATE ONLY sx *
    expect: error
    sqlstate: "42601"
    comment: ONLY and * are mutually exclusive
  - sql: |
      SELECT count(*) AS n FROM sx
    expect: rows
    order: ordered
