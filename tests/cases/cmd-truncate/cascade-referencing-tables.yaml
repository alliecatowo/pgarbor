# Doc example: TRUNCATE othertable CASCADE also truncates tables that reference it by foreign key.
id: cmd-truncate.cascade-referencing-tables
title: "TRUNCATE CASCADE truncates foreign-key referencing tables, including transitive ones"
family: cmd-truncate
tier: core
feature_ids: [truncate, cascade, foreign-key, create-table, insert, select]
required_capabilities: [create-table, insert, select, foreign-key, truncate]
provenance:
  source: pg-docs
  ref: "ref/truncate.sgml#examples (TRUNCATE othertable CASCADE)"
sessions: [a]
setup: |
  CREATE TABLE othertable (id int4 PRIMARY KEY);
  CREATE TABLE refa (id int4 PRIMARY KEY, oid_ref int4 REFERENCES othertable (id));
  CREATE TABLE refb (id int4 PRIMARY KEY, a_ref int4 REFERENCES refa (id));
  CREATE TABLE unrelated (id int4 PRIMARY KEY);
  INSERT INTO othertable VALUES (1), (2);
  INSERT INTO refa VALUES (10, 1);
  INSERT INTO refb VALUES (100, 10);
  INSERT INTO unrelated VALUES (7);
steps:
  - sql: |
      TRUNCATE othertable CASCADE
    expect: ok
  - sql: |
      SELECT 'othertable' AS t, count(*) AS n FROM othertable
      UNION ALL SELECT 'refa', count(*) FROM refa
      UNION ALL SELECT 'refb', count(*) FROM refb
      UNION ALL SELECT 'unrelated', count(*) FROM unrelated
      ORDER BY t
    expect: rows
    order: ordered
    comment: refa (direct) and refb (transitive) are emptied; unrelated keeps its row
