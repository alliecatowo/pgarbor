id: cmd-rollback-to.cursor-opened-in-savepoint-closed
title: "A cursor opened inside a savepoint is closed when that savepoint is rolled back"
family: cmd-rollback-to
tier: extended
feature_ids: [rollback-to-savepoint, savepoints, cursors]
required_capabilities: [transactions, savepoints, cursors, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Notes: Any cursor that is opened inside a savepoint will be closed when the savepoint is rolled back.)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT s
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT 1
    expect: ok
  - sql: |
      ROLLBACK TO SAVEPOINT s
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: error
    sqlstate: "34000"
  - sql: |
      ROLLBACK
    expect: ok
