id: cmd-rollback-to.savepoint-remains-valid
title: "A savepoint remains valid after ROLLBACK TO and can be rolled back to again"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, savepoints]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Description: The savepoint remains valid)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4)
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SAVEPOINT s
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      ROLLBACK TO s
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO t VALUES (3), (4)
    expect: ok
  - sql: |
      ROLLBACK TO s
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
