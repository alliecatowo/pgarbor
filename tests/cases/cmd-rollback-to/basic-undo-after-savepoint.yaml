id: cmd-rollback-to.basic-undo-after-savepoint
title: "ROLLBACK TO SAVEPOINT undoes commands executed after the savepoint"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, savepoints, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4)
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SAVEPOINT my_savepoint
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2), (3)
    expect: ok
  - sql: |
      ROLLBACK TO SAVEPOINT my_savepoint
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
