id: cmd-rollback-to.quoted-savepoint-names
title: "Unquoted savepoint names fold to lower case; quoted names are case-sensitive"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, savepoints, identifiers]
required_capabilities: [transactions, savepoints, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Synopsis: savepoint_name)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT MySP
    expect: ok
  - sql: |
      ROLLBACK TO "MySP"
    expect: error
    sqlstate: "3B001"
    comment: the savepoint is named mysp, so the quoted name does not match
  - sql: |
      ROLLBACK TO mysp
    expect: ok
  - sql: |
      ROLLBACK TO "mysp"
    expect: ok
    comment: the savepoint is still valid after the rollback
  - sql: |
      COMMIT
    expect: ok
