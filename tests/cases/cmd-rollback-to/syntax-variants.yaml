id: cmd-rollback-to.syntax-variants
title: "ROLLBACK with optional WORK/TRANSACTION and optional SAVEPOINT keyword"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, savepoints, syntax]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Synopsis; Compatibility)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4)
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT a
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      ROLLBACK TO a
    expect: ok
    comment: no WORK/TRANSACTION and no SAVEPOINT keyword
  - sql: |
      SELECT count(*) FROM t
    expect: rows
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      ROLLBACK TO SAVEPOINT a
    expect: ok
    comment: no WORK/TRANSACTION
  - sql: |
      SELECT count(*) FROM t
    expect: rows
  - sql: |
      INSERT INTO t VALUES (3)
    expect: ok
  - sql: |
      ROLLBACK WORK TO a
    expect: ok
  - sql: |
      SELECT count(*) FROM t
    expect: rows
  - sql: |
      INSERT INTO t VALUES (4)
    expect: ok
  - sql: |
      ROLLBACK TRANSACTION TO SAVEPOINT a
    expect: ok
  - sql: |
      SELECT count(*) FROM t
    expect: rows
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT count(*) FROM t
    expect: rows
