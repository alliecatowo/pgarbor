id: cmd-rollback-to.cursor-position-not-rolled-back
title: "Cursor FETCH motion survives ROLLBACK TO SAVEPOINT (documented cursor example)"
family: cmd-rollback-to
tier: extended
feature_ids: [rollback-to-savepoint, savepoints, cursors]
required_capabilities: [transactions, savepoints, cursors, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Examples: Cursor positions are not affected by savepoint rollback)"
sessions: [a]
notes: "Doc example with ORDER BY added to the cursor query so the two fetched rows are deterministic."
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE foo CURSOR FOR SELECT x FROM (VALUES (1), (2)) AS v(x) ORDER BY x
    expect: ok
  - sql: |
      SAVEPOINT foo
    expect: ok
  - sql: |
      FETCH 1 FROM foo
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK TO SAVEPOINT foo
    expect: ok
  - sql: |
      FETCH 1 FROM foo
    expect: rows
    order: ordered
    comment: returns 2, not 1, because cursor motion is not rolled back
  - sql: |
      COMMIT
    expect: ok
