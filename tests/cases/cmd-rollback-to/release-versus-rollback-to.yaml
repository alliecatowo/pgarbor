id: cmd-rollback-to.release-versus-rollback-to
title: "RELEASE SAVEPOINT keeps effects while ROLLBACK TO discards them"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, release-savepoint, savepoints]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Notes: Use RELEASE SAVEPOINT to destroy a savepoint without discarding the effects)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4)
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT a
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      RELEASE SAVEPOINT a
    expect: ok
  - sql: |
      SAVEPOINT b
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      ROLLBACK TO b
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
