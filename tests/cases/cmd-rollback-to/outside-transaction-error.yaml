id: cmd-rollback-to.outside-transaction-error
title: "ROLLBACK TO SAVEPOINT outside a transaction block is an error"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, savepoints, errors]
required_capabilities: [create-table, insert, select, transactions, savepoints, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4)
steps:
  - sql: |
      ROLLBACK TO SAVEPOINT my_savepoint
    expect: error
    sqlstate: "25P01"
  - sql: |
      ROLLBACK TO my_savepoint
    expect: error
    sqlstate: "25P01"
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    comment: session is still usable in autocommit mode
