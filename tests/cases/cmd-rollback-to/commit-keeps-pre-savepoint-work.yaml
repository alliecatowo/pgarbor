id: cmd-rollback-to.commit-keeps-pre-savepoint-work
title: "After ROLLBACK TO and COMMIT, only work outside the rolled-back span persists"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, savepoints, transactions, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4)
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      SAVEPOINT s
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      ROLLBACK TO s
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3)
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - reconnect: true
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
