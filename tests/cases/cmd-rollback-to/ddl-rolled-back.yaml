id: cmd-rollback-to.ddl-rolled-back
title: "ROLLBACK TO SAVEPOINT undoes DDL and DML executed after the savepoint"
family: cmd-rollback-to
tier: core
feature_ids: [rollback-to-savepoint, savepoints, create-table, insert]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/rollback_to.sgml#sql-rollback-to (Description)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE TABLE u (id int4)
    expect: ok
  - sql: |
      SAVEPOINT s
    expect: ok
  - sql: |
      CREATE TABLE v (id int4)
    expect: ok
  - sql: |
      INSERT INTO u VALUES (5)
    expect: ok
  - sql: |
      ROLLBACK TO s
    expect: ok
  - sql: |
      SELECT to_regclass('v') IS NULL AS v_gone, (SELECT count(*) FROM u) AS u_rows
    expect: rows
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT count(*) FROM u
    expect: rows
