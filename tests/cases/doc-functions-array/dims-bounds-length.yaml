# array_dims, array_ndims, array_lower, array_upper, array_length and cardinality: documented examples
# plus NULL results for missing or empty dimensions and nonstandard lower bounds.
id: doc-functions-array.dims-bounds-length
title: Array dimension, bound, length and cardinality functions with NULL for missing dimensions
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-dimensions, array-bounds, array-length, cardinality, nulls]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array-functions-table: array_dims, array_ndims, array_lower, array_upper, array_length, cardinality)"
sessions: [a]
steps:
  - sql: |
      SELECT array_dims(ARRAY[[1,2,3], [4,5,6]]) AS dims, array_ndims(ARRAY[[1,2,3], [4,5,6]]) AS ndims, array_lower('[0:2]={1,2,3}'::integer[], 1) AS lo, array_upper(ARRAY[1,8,3,7], 1) AS up
    expect: rows
    comment: documented examples; a lower bound of 0 is reported as is
  - sql: |
      SELECT array_length(array[1,2,3], 1) AS len1, array_length(array[]::int[], 1) IS NULL AS empty_is_null, array_length(array['text'], 2) IS NULL AS missing_dim_is_null, array_length(ARRAY[[1,2],[3,4],[5,6]], 2) AS len2, array_length(NULL::int[], 1) IS NULL AS null_arr_is_null
    expect: rows
    comment: array_length gives NULL instead of 0 for empty or missing dimensions
  - sql: |
      SELECT cardinality(ARRAY[[1,2],[3,4]]) AS card4, cardinality('{}'::int[]) AS card0, cardinality(NULL::int[]) IS NULL AS card_null, array_upper(ARRAY[1,2], 2) IS NULL AS no_dim2, array_lower(ARRAY[1,2], 0) IS NULL AS zero_dim, array_upper('{}'::int[], 1) IS NULL AS empty_upper, array_dims('{}'::int[]) IS NULL AS empty_dims, array_ndims('{}'::int[]) IS NULL AS empty_ndims
    expect: rows
    comment: cardinality counts all elements (0 for empty); bounds and dims of empty or nonexistent dimensions are NULL
