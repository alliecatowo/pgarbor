# unnest in FROM: single-array and multi-array forms, multidimensional input read in storage order,
# NULL padding of the shorter array, and zero rows for empty or NULL arrays.
id: doc-functions-array.unnest-sets
title: unnest single and multi-array forms with NULL padding and empty input
family: doc-functions-array
tier: core
feature_ids: [array-functions, unnest, set-returning-functions, nulls]
required_capabilities: [select, set-returning-functions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (unnest)"
sessions: [a]
steps:
  - sql: |
      SELECT v, n FROM unnest(ARRAY[1,2]) WITH ORDINALITY AS t(v, n) ORDER BY n
    expect: rows
    order: ordered
    comment: single-dimension unnest in element order
  - sql: |
      SELECT v, n FROM unnest(ARRAY[['foo','bar'],['baz','quux']]) WITH ORDINALITY AS t(v, n) ORDER BY n
    expect: rows
    order: ordered
    comment: multidimensional input is read out element by element in storage order
  - sql: |
      SELECT a, b FROM unnest(ARRAY[1,2], ARRAY['foo','bar','baz']) AS x(a,b) ORDER BY a NULLS LAST, b
    expect: rows
    order: ordered
    comment: documented example; the shorter array is padded with NULL
  - sql: |
      SELECT (SELECT count(*) FROM unnest(ARRAY[]::int[])) AS empty_rows, (SELECT count(*) FROM unnest(NULL::int[])) AS null_rows
    expect: rows
    comment: empty and NULL arrays produce zero rows
