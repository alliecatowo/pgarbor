# array_reverse and trim_array: documented examples, reversal of the first dimension only, NULL input,
# and the bounds on the number of elements that can be trimmed.
id: doc-functions-array.reverse-trim
title: array_reverse and trim_array documented examples with trim bounds errors
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-reverse, array-trim, nulls, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array_reverse, trim_array)"
sessions: [a]
steps:
  - sql: |
      SELECT array_reverse(ARRAY[[1,2],[3,4],[5,6]]) AS reversed_first_dim, array_reverse(ARRAY[1,2,3]) AS reversed_flat, array_reverse(NULL::int[]) IS NULL AS null_arr
    expect: rows
    comment: only the first dimension is reversed; the rows themselves keep their order
  - sql: |
      SELECT trim_array(ARRAY[1,2,3,4,5,6], 2) AS documented, trim_array(ARRAY[[1,2],[3,4],[5,6]], 1) AS first_dim_only, trim_array(ARRAY[1,2,3], 0) AS trim_none, trim_array(ARRAY[1,2,3], 3) AS trim_all
    expect: rows
    comment: trimming removes elements from the end; trimming all elements gives an empty array
  - sql: |
      SELECT trim_array(ARRAY[1,2], 3)
    expect: error
    sqlstate: "2202E"
    comment: cannot trim more elements than the array has
  - sql: |
      SELECT trim_array(ARRAY[1,2], -1)
    expect: error
    sqlstate: "2202E"
    comment: a negative count is rejected
