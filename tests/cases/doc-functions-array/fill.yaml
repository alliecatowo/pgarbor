# array_fill: documented examples with explicit lower bounds, NULL fill values, a zero-length dimension,
# and the documented-by-behavior error cases for mismatched or NULL dimension arguments.
id: doc-functions-array.fill
title: array_fill with default and explicit lower bounds and dimension argument errors
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-fill, array-bounds, nulls, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array_fill)"
sessions: [a]
steps:
  - sql: |
      SELECT array_fill(11, ARRAY[2,3]) AS two_by_three, array_fill(7, ARRAY[3], ARRAY[2]) AS lower_bound_two, array_fill('x'::text, ARRAY[2,2], ARRAY[0,1]) AS two_dim_bounds, array_fill(NULL::int, ARRAY[2]) AS null_fill
    expect: rows
    comment: documented examples plus explicit per-dimension lower bounds and a NULL fill value
  - sql: |
      SELECT array_dims(array_fill(0, ARRAY[0])) IS NULL AS zero_len_dims_null, cardinality(array_fill(0, ARRAY[0])) AS zero_len_card
    expect: rows
    comment: a zero-length dimension yields an empty array
  - sql: |
      SELECT array_fill(1, ARRAY[1,2], ARRAY[1])
    expect: error
    sqlstate: "2202E"
    comment: lower-bound array must match the dimension array in size
  - sql: |
      SELECT array_fill(1, NULL::int[])
    expect: error
    sqlstate: "22004"
    comment: NULL dimension array is rejected
