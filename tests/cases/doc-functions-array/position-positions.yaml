# array_position and array_positions: documented examples, optional start subscript, IS NOT DISTINCT FROM
# semantics for NULL search values, and the multidimensional restriction.
id: doc-functions-array.position-positions
title: array_position with start subscript and array_positions with NULL semantics
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-position, array-positions, nulls, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array_position, array_positions)"
sessions: [a]
steps:
  - sql: |
      SELECT array_position(ARRAY['sun','mon','tue','wed','thu','fri','sat'], 'mon') AS documented, array_position(ARRAY[1,4,3,2,4], 4, 3) AS from_subscript_3, array_position(ARRAY[1,2,3,2], 2, 3) AS second_match, array_position(ARRAY[1,2], 9) IS NULL AS not_found_is_null
    expect: rows
    comment: the third argument starts the search at that subscript
  - sql: |
      SELECT array_positions(ARRAY['A','A','B','A'], 'A') AS documented, array_positions(ARRAY['A','B'], 'Z') AS none_found, array_positions(NULL::text[], 'A') IS NULL AS null_arr, array_positions(ARRAY[1,1], NULL) AS null_search_none
    expect: rows
    comment: array_positions returns an empty array when not found and NULL only for a NULL array
  - sql: |
      SELECT array_position(ARRAY[1,NULL,3], NULL) AS null_pos, array_positions(ARRAY[1,NULL,NULL], NULL) AS null_positions
    expect: rows
    comment: IS NOT DISTINCT FROM semantics let NULL search values match NULL elements
  - sql: |
      SELECT array_position(ARRAY[1,2,3], 2, NULL)
    expect: error
    sqlstate: "22004"
    comment: a NULL start subscript is rejected
  - sql: |
      SELECT array_positions(ARRAY[[1,2],[3,4]], 3)
    expect: error
    sqlstate: "0A000"
    comment: searching multidimensional arrays is not supported
