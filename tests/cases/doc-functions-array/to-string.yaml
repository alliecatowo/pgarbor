# array_to_string: documented example with a NULL replacement string, omission of NULL entries when no
# null_string is given, and NULL or empty inputs.
id: doc-functions-array.to-string
title: array_to_string with and without null_string and with NULL or empty inputs
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-to-string, nulls]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array_to_string)"
sessions: [a]
steps:
  - sql: |
      SELECT array_to_string(ARRAY[1, 2, 3, NULL, 5], ',', '*') AS documented, array_to_string(ARRAY[1, 2, 3, NULL, 5], ',') AS nulls_omitted, array_to_string(ARRAY[1,NULL,3], ',', NULL) AS null_string_null, array_to_string(ARRAY['a',NULL,'c'], '-', 'NUL') AS named_null
    expect: rows
    comment: a NULL null_string keeps the default omission of NULL entries
  - sql: |
      SELECT array_to_string(ARRAY[]::int[], ',') AS empty_arr, array_to_string(NULL::int[], ',') IS NULL AS null_arr, array_to_string(ARRAY[1,2], NULL) IS NULL AS null_delim
    expect: rows
    comment: an empty array gives an empty string; a NULL array or NULL delimiter gives NULL
