# array_remove and array_replace: documented examples, NULL-matching under IS NOT DISTINCT FROM,
# NULL array inputs, and the one-dimensional restriction of array_remove.
id: doc-functions-array.remove-replace
title: array_remove and array_replace with documented examples and NULL matching
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-remove, array-replace, nulls, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array_remove, array_replace)"
sessions: [a]
steps:
  - sql: |
      SELECT array_remove(ARRAY[1,2,3,2], 2) AS documented, array_remove(ARRAY[1,2,2,3], 5) AS absent_value, array_remove(ARRAY[1,NULL,NULL,3], NULL) AS removes_nulls, array_remove(NULL::int[], 1) IS NULL AS null_arr
    expect: rows
    comment: removal compares with IS NOT DISTINCT FROM, so NULLs can be removed
  - sql: |
      SELECT array_replace(ARRAY[1,2,5,4], 5, 3) AS documented, array_replace(ARRAY[1,2,NULL,4,NULL], NULL, 5) AS replaces_nulls, array_replace(ARRAY[1,NULL,3], NULL, NULL) AS replace_null_with_null, array_replace(NULL::int[], 1, 2) IS NULL AS null_arr
    expect: rows
    comment: replacement also matches NULL elements and keeps a NULL array as NULL
  - sql: |
      SELECT array_remove('{{1,2,2},{1,4,3}}'::int[], 2)
    expect: error
    sqlstate: "0A000"
    comment: array_remove requires a one-dimensional array
