# Array comparison operators compare element-by-element, then by dimensionality when contents are equal.
id: doc-functions-array.comparison-ordering
title: Array comparison operators sort by element contents then by dimensionality
family: doc-functions-array
tier: core
feature_ids: [array-operators, array-comparison, btree-ordering]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (first paragraph, dimensionality rule)"
sessions: [a]
steps:
  - sql: |
      SELECT ARRAY[1,2,3] < ARRAY[1,2,4] AS first_diff_less, ARRAY[1,2] < ARRAY[1,2,0] AS prefix_less, ARRAY[1,2,3] = ARRAY[1,2,3] AS equal, ARRAY[1,2]::int[] > ARRAY[]::int[] AS nonempty_gt_empty, ARRAY[]::int[] = '{}'::int[] AS empty_equal
    expect: rows
    comment: comparison is element-wise and sorts on the first difference
  - sql: |
      SELECT ARRAY[1,2] < ARRAY[[1,2]] AS fewer_dims_first, ARRAY[[1,2]] > ARRAY[1,2,3] AS shorter_contents_less, ARRAY[[1,2],[3,4]] = ARRAY[1,2,3,4] AS same_flat_different_dims, array_dims(ARRAY[[1,2],[3,4]]) AS dims
    expect: rows
    comment: with equal contents, the dimensionality information decides the order; the same flat elements with different dimensions are not equal
