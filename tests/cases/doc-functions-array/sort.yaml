# array_sort: documented multidimensional example, the default ascending order with nulls last,
# explicit descending and nulls_first arguments, COLLATE on the array argument, and NULL input.
id: doc-functions-array.sort
title: array_sort default order, descending and nulls_first arguments, and COLLATE
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-sort, collation, nulls]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array_sort)"
sessions: [a]
steps:
  - sql: |
      SELECT array_sort(ARRAY[[2,4],[2,1],[6,5]]) AS documented, array_sort(ARRAY[3,1,NULL,2]) AS asc_default, array_sort(ARRAY[3,1,NULL,2], true) AS desc_nulls_follow, array_sort(ARRAY[3,1,NULL,2], false, true) AS asc_nulls_first, array_sort(ARRAY[3,1,NULL,2], true, false) AS desc_nulls_last
    expect: rows
    comment: nulls_first defaults to the value of descending; the documented example sorts the first dimension
  - sql: |
      SELECT array_sort(ARRAY['b','a','C'] COLLATE "C") AS c_asc, array_sort(ARRAY['b','a','C'] COLLATE "C", true) AS c_desc, array_sort(NULL::int[]) IS NULL AS null_arr
    expect: rows
    comment: byte-order collation puts uppercase before lowercase
