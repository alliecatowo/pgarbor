# array_append, array_prepend and array_cat: documented examples, NULL-array behavior, and equivalence
# with the corresponding operators.
id: doc-functions-array.append-prepend-cat
title: array_append array_prepend and array_cat documented examples with NULL inputs
family: doc-functions-array
tier: core
feature_ids: [array-functions, array-append, array-prepend, array-cat, nulls]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array-functions-table)"
sessions: [a]
steps:
  - sql: |
      SELECT array_append(ARRAY[1,2], 3) AS app, array_cat(ARRAY[1,2,3], ARRAY[4,5]) AS cat, array_prepend(1, ARRAY[2,3]) AS pre
    expect: rows
    comment: documented examples
  - sql: |
      SELECT array_append(NULL::int[], 3) AS app_null, array_prepend(1, NULL::int[]) AS pre_null, array_cat(NULL::int[], NULL::int[]) IS NULL AS cat_both_null, array_append(ARRAY['x'], NULL) AS app_null_elem
    expect: rows
    comment: a NULL array is treated as empty when appending or prepending; cat of two NULLs is NULL
  - sql: |
      SELECT array_append(ARRAY[1,2], 3) = (ARRAY[1,2] || 3) AS app_same_as_op, array_cat(ARRAY[1], ARRAY[2]) = (ARRAY[1] || ARRAY[2]) AS cat_same_as_op, array_prepend(0, ARRAY[1]) = (0 || ARRAY[1]) AS pre_same_as_op
    expect: rows
    comment: each function is documented as equivalent to its operator form
