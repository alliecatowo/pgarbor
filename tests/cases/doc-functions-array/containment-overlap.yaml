# Array containment and overlap operators (@>, <@, &&) with the documented examples,
# duplicate elements, and NULL operands.
id: doc-functions-array.containment-overlap
title: Array containment and overlap operators with duplicates and NULL operands
family: doc-functions-array
tier: core
feature_ids: [array-operators, array-containment, array-overlap, nulls]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-array (array-operators-table)"
sessions: [a]
steps:
  - sql: |
      SELECT ARRAY[1,4,3] @> ARRAY[3,1,3] AS contains_dups, ARRAY[2,2,7] <@ ARRAY[1,7,4,2,6] AS contained_by, ARRAY[1,4,3] && ARRAY[2,1] AS overlaps, ARRAY[1]::int[] @> ARRAY[1,1] AS one_contains_two, ARRAY[1,1] <@ ARRAY[1]::int[] AS two_contained, ARRAY[1,2] && ARRAY[3,4] AS disjoint
    expect: rows
    comment: documented examples plus duplicates-not-special and a disjoint pair
  - sql: |
      SELECT ARRAY[1] @> NULL::int[] AS null_right, NULL::int[] && ARRAY[1] AS null_left, ARRAY[1,2] <@ '{}'::int[] AS empty_right, '{}'::int[] @> '{}'::int[] AS both_empty, ARRAY[1,NULL] @> ARRAY[NULL]::int[] AS null_element
    expect: rows
    comment: a NULL array operand gives NULL; NULL elements do not match each other under equality
