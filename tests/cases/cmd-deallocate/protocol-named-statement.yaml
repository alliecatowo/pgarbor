# A statement created by an extended-protocol Parse with a name is removed by SQL-level DEALLOCATE.
id: cmd-deallocate.protocol-named-statement
title: SQL DEALLOCATE removes a statement that was parsed over the extended protocol
family: cmd-deallocate
tier: extended
feature_ids: [deallocate, extended-protocol, prepared-statements]
required_capabilities: [select, prepared-statements, extended-protocol, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate; protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
steps:
  - parse:
      name: sp
      sql: "SELECT 41 + 1 AS answer"
    expect: ok
  - execute:
      statement: sp
    expect: rows
  - sql: |
      DEALLOCATE sp
    expect: ok
  - execute:
      statement: sp
    expect: error
    sqlstate: "26000"
