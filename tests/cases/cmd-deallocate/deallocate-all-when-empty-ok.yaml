# DEALLOCATE ALL with no prepared statements is not an error, with or without the PREPARE key word.
id: cmd-deallocate.deallocate-all-when-empty-ok
title: DEALLOCATE ALL succeeds when the session has no prepared statements
family: cmd-deallocate
tier: core
feature_ids: [deallocate, deallocate-all, prepared-statements]
required_capabilities: [select, prepared-statements, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Parameters: ALL)"
sessions: [a]
steps:
  - sql: |
      DEALLOCATE ALL
    expect: ok
  - sql: |
      DEALLOCATE PREPARE ALL
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
    comment: still zero
