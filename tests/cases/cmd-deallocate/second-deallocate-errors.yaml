# Deallocating the same statement twice: the second attempt fails.
id: cmd-deallocate.second-deallocate-errors
title: A second DEALLOCATE of the same name fails with 26000
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, prepared-statements]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate; PG18 errcodes 26000"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS SELECT 3
    expect: ok
  - sql: |
      DEALLOCATE p
    expect: ok
  - sql: |
      DEALLOCATE p
    expect: error
    sqlstate: "26000"
