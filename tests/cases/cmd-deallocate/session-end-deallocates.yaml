# Statements not explicitly deallocated are dropped when the session ends.
id: cmd-deallocate.session-end-deallocates
title: Prepared statements disappear when the session ends (reconnect)
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, prepared-statements, sessions]
required_capabilities: [select, prepared-statements, catalog-introspection, reconnect, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Description: deallocated when the session ends)"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS SELECT 6 AS six
    expect: ok
  - sql: |
      EXECUTE p
    expect: rows
  - reconnect: true
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
    comment: the new session starts with no statements
  - sql: |
      EXECUTE p
    expect: error
    sqlstate: "26000"
