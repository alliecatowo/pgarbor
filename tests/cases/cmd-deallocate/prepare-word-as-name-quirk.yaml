# With no name after the optional PREPARE, the word PREPARE itself is taken as the statement name.
id: cmd-deallocate.prepare-word-as-name-quirk
title: DEALLOCATE PREPARE with no name treats PREPARE as the statement name
family: cmd-deallocate
tier: extended
feature_ids: [deallocate, prepare, syntax-edge-cases]
required_capabilities: [prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Synopsis: [ PREPARE ]); gram.y DEALLOCATE opt_prepare ColId"
sessions: [a]
notes: With no name after the optional PREPARE, the word PREPARE is parsed as the statement name.
steps:
  - sql: |
      DEALLOCATE PREPARE
    expect: error
    sqlstate: "26000"
