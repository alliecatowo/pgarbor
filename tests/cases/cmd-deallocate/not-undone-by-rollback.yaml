# DEALLOCATE is not transactional: rolling back the transaction does not bring the statement back.
id: cmd-deallocate.not-undone-by-rollback
title: A DEALLOCATE inside a rolled-back transaction stays in effect
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, transactions, prepared-statements]
required_capabilities: [select, prepared-statements, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate; ref/prepare.sgml (prepared statements are session state)"
sessions: [a]
steps:
  - sql: |
      PREPARE r AS SELECT 3 AS three
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DEALLOCATE r
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      EXECUTE r
    expect: error
    sqlstate: "26000"
    comment: still gone after ROLLBACK
