# DEALLOCATE removes a named prepared statement; EXECUTE of it afterwards fails.
id: cmd-deallocate.execute-after-deallocate-errors
title: EXECUTE works before DEALLOCATE and fails with 26000 after it
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, execute, prepared-statements]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Description)"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS SELECT 1 AS one
    expect: ok
  - sql: |
      EXECUTE p
    expect: rows
  - sql: |
      DEALLOCATE p
    expect: ok
  - sql: |
      EXECUTE p
    expect: error
    sqlstate: "26000"
