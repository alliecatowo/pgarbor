# In one multi-statement query, the second DEALLOCATE fails. The earlier non-transactional effects remain.
id: cmd-deallocate.multi-statement-error-keeps-deallocate
title: A failing DEALLOCATE in a multi-statement query leaves earlier deallocations in place
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, prepared-statements, simple-query]
required_capabilities: [select, prepared-statements, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate; PG18 errcodes 26000"
sessions: [a]
steps:
  - sql: |
      PREPARE a1 AS SELECT 7 AS seven; DEALLOCATE a1; DEALLOCATE a1; SELECT 99
    expect: error
    sqlstate: "26000"
    comment: one Query message, the error aborts the rest of the message
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
    comment: a1 was prepared and then deallocated before the failure, so none remain
