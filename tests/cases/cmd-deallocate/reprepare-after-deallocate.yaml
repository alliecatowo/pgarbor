# After DEALLOCATE the name is free: a new PREPARE under the same name replaces the old definition.
id: cmd-deallocate.reprepare-after-deallocate
title: PREPARE under a deallocated name creates a fresh statement with the new definition
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, execute, prepared-statements]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate; ref/prepare.sgml"
sessions: [a]
steps:
  - sql: |
      PREPARE u AS SELECT 6 AS v
    expect: ok
  - sql: |
      DEALLOCATE u
    expect: ok
  - sql: |
      PREPARE u AS SELECT 7 AS v
    expect: ok
  - sql: |
      EXECUTE u
    expect: rows
    comment: returns 7, not 6
