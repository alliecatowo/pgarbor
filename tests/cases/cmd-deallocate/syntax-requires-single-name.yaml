# DEALLOCATE takes exactly one name or ALL; a missing, extra or zero-length name is a syntax error.
id: cmd-deallocate.syntax-requires-single-name
title: DEALLOCATE without a name, with two names, or with an empty name is a syntax error
family: cmd-deallocate
tier: core
feature_ids: [deallocate, syntax-errors]
required_capabilities: [errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Synopsis)"
sessions: [a]
steps:
  - sql: |
      DEALLOCATE
    expect: error
    sqlstate: "42601"
  - sql: |
      DEALLOCATE a b
    expect: error
    sqlstate: "42601"
  - sql: |
      DEALLOCATE ""
    expect: error
    sqlstate: "42601"
    comment: zero-length delimited identifier
