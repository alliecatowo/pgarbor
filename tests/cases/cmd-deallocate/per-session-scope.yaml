# Prepared statements belong to the session that created them; another session cannot see or deallocate them.
id: cmd-deallocate.per-session-scope
title: DEALLOCATE in one session does not affect or reach another session's statements
family: cmd-deallocate
tier: core
feature_ids: [deallocate, deallocate-all, prepare, prepared-statements, multi-session]
required_capabilities: [select, prepared-statements, multi-session, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Description, Parameters: ALL)"
sessions: [a, b]
steps:
  - session: a
    sql: |
      PREPARE p AS SELECT 10 AS ten
    expect: ok
  - session: b
    sql: |
      EXECUTE p
    expect: error
    sqlstate: "26000"
    comment: session b never prepared p
  - session: b
    sql: |
      DEALLOCATE p
    expect: error
    sqlstate: "26000"
  - session: a
    sql: |
      EXECUTE p
    expect: rows
    comment: a's statement is untouched by b's failed DEALLOCATE
  - session: b
    sql: |
      DEALLOCATE ALL
    expect: ok
    comment: DEALLOCATE ALL in b only affects b's own statements (none)
  - session: a
    sql: |
      EXECUTE p
    expect: rows
  - session: a
    sql: |
      DEALLOCATE ALL
    expect: ok
