# The PREPARE key word in DEALLOCATE PREPARE name is ignored.
id: cmd-deallocate.prepare-keyword-is-optional
title: DEALLOCATE PREPARE name deallocates exactly like DEALLOCATE name
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, prepared-statements]
required_capabilities: [select, prepared-statements, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Parameters: PREPARE)"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS SELECT 2 AS two
    expect: ok
  - sql: |
      DEALLOCATE PREPARE p
    expect: ok
    comment: the optional PREPARE key word is accepted and ignored
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
    comment: no statements remain
  - sql: |
      EXECUTE p
    expect: error
    sqlstate: "26000"
