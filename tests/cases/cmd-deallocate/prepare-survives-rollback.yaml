# Complement of not-undone-by-rollback: PREPARE inside a rolled-back transaction also is not undone, so the statement stays usable until DEALLOCATE.
id: cmd-deallocate.prepare-survives-rollback
title: A PREPARE inside a rolled-back transaction remains until it is deallocated
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, transactions, prepared-statements]
required_capabilities: [select, prepared-statements, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate; ref/prepare.sgml (prepared statements are session state)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      PREPARE t AS SELECT 5 AS five
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      EXECUTE t
    expect: rows
  - sql: |
      DEALLOCATE t
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
