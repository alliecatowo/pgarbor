# The keyword ALL means every statement; a quoted "ALL" is an ordinary statement name.
id: cmd-deallocate.quoted-all-is-a-name
title: DEALLOCATE "ALL" drops a statement named ALL and leaves the keyword meaning unchanged
family: cmd-deallocate
tier: extended
feature_ids: [deallocate, deallocate-all, prepare, identifiers, prepared-statements]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Parameters: name, ALL)"
sessions: [a]
steps:
  - sql: |
      PREPARE "ALL" AS SELECT 5
    expect: ok
  - sql: |
      EXECUTE "ALL"
    expect: rows
  - sql: |
      DEALLOCATE "ALL"
    expect: ok
    comment: quoted, so this names the statement and does not mean DEALLOCATE ALL
  - sql: |
      EXECUTE "ALL"
    expect: error
    sqlstate: "26000"
