# DEALLOCATE ALL removes every prepared statement of the session.
id: cmd-deallocate.deallocate-all-removes-every-statement
title: DEALLOCATE ALL removes all prepared statements, and each EXECUTE then fails
family: cmd-deallocate
tier: core
feature_ids: [deallocate, deallocate-all, prepare, prepared-statements]
required_capabilities: [select, prepared-statements, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Parameters: ALL)"
sessions: [a]
steps:
  - sql: |
      PREPARE s1 AS SELECT 1
    expect: ok
  - sql: |
      PREPARE s2 AS SELECT 'two'
    expect: ok
  - sql: |
      PREPARE s3 AS SELECT true AS ok
    expect: ok
  - sql: |
      SELECT name FROM pg_prepared_statements ORDER BY name
    expect: rows
    order: ordered
    comment: three statements before DEALLOCATE ALL
  - sql: |
      DEALLOCATE ALL
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
    comment: none remain
  - sql: |
      EXECUTE s2
    expect: error
    sqlstate: "26000"
