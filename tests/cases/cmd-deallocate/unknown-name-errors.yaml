# DEALLOCATE of a name that was never prepared is an error (not a no-op).
id: cmd-deallocate.unknown-name-errors
title: DEALLOCATE of an unknown statement name fails with 26000
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepared-statements]
required_capabilities: [prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate; PG18 errcodes 26000 invalid_sql_statement_name"
sessions: [a]
steps:
  - sql: |
      DEALLOCATE nope
    expect: error
    sqlstate: "26000"
  - sql: |
      DEALLOCATE PREPARE nope
    expect: error
    sqlstate: "26000"
