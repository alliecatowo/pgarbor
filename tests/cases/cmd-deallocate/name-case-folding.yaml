# Unquoted names fold to lower case in PREPARE and DEALLOCATE alike; a quoted mixed-case name is a different name.
id: cmd-deallocate.name-case-folding
title: DEALLOCATE applies the same identifier folding as PREPARE
family: cmd-deallocate
tier: core
feature_ids: [deallocate, prepare, identifiers, prepared-statements]
required_capabilities: [select, prepared-statements, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/deallocate.sgml#sql-deallocate (Parameters: name); doc-sql-syntax-lexical identifiers"
sessions: [a]
steps:
  - sql: |
      PREPARE MixedCase AS SELECT 4
    expect: ok
  - sql: |
      SELECT name FROM pg_prepared_statements
    expect: rows
    comment: the stored name is folded to lower case
  - sql: |
      DEALLOCATE "MixedCase"
    expect: error
    sqlstate: "26000"
    comment: the quoted name is not the folded name, so nothing is dropped
  - sql: |
      DEALLOCATE MixedCase
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
