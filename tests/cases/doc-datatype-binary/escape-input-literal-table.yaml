# Escape-format input table: each documented escaped octet must decode to the listed byte value.
# Output uses the default hex format so the decoded bytes are visible.
id: doc-datatype-binary.escape-input-literal-table
title: bytea escape input decodes octal escapes, doubled quotes and doubled backslashes to the documented octets
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-escape-format, bytea-input, string-literals]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary-sqlesc (Literal Escaped Octets table)"
sessions: [a]
steps:
  - sql: |
      SELECT id, b FROM (VALUES
        (1, '\000'::bytea),
        (2, ''''::bytea),
        (3, '\047'::bytea),
        (4, '\\'::bytea),
        (5, '\134'::bytea),
        (6, '\001'::bytea),
        (7, '\176'::bytea),
        (8, '\177'::bytea),
        (9, '\377'::bytea)
      ) AS t(id, b) ORDER BY id
    expect: rows
    order: ordered
