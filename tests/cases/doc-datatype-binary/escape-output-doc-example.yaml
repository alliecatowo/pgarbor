# bytea_output = 'escape': printable octets print as characters, non-printable octets print as three-digit octal, backslash is doubled.
id: doc-datatype-binary.escape-output-doc-example
title: bytea escape output matches the manual's examples for octal, backslash and printable octets
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-escape-format, bytea-output, guc]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary-bytea-escape-format (SET bytea_output = 'escape'; output escaped octets table)"
sessions: [a]
steps:
  - sql: |
      SET bytea_output = 'escape'
    expect: ok
  - sql: |
      SELECT 'abc \153\154\155 \052\251\124'::bytea AS b
    expect: rows
    comment: 'documented output abc klm *\251T'
  - sql: |
      SELECT id, b FROM (VALUES
        (1, '\134'::bytea),
        (2, '\001'::bytea),
        (3, '\176'::bytea),
        (4, '\000'::bytea),
        (5, '\\'::bytea),
        (6, '\377'::bytea),
        (7, 'a'::bytea)
      ) AS t(id, b) ORDER BY id
    expect: rows
    order: ordered
    comment: backslash doubled; zero and high octets as octal; 126 printed as ~
