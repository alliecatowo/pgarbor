# Documented example: with bytea_output = 'hex', '\xDEADBEEF'::bytea displays as \xdeadbeef (lowercase, 2 digits per byte).
id: doc-datatype-binary.hex-input-documented-example
title: bytea hex input example from the manual renders as lowercase hex output
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-hex-format, bytea-output]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary-bytea-hex-format (SET bytea_output = 'hex'; SELECT '\\xDEADBEEF'::bytea)"
sessions: [a]
steps:
  - sql: |
      SET bytea_output = 'hex'
    expect: ok
  - sql: |
      SELECT '\xDEADBEEF'::bytea AS b, '\xdeadbeef'::bytea = '\xDEADBEEF'::bytea AS same_value
    expect: rows
