# Contrast: a zero octet is valid in bytea but rejected in text, per the manual's description of character strings.
id: doc-datatype-binary.text-rejects-zero-octet
title: A zero octet is rejected in text but accepted and counted in bytea
family: doc-datatype-binary
tier: core
feature_ids: [bytea, text, binary-strings, encoding, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary (character strings disallow zero octets)"
sessions: [a]
steps:
  - sql: |
      SELECT E'a\000b'::text
    expect: error
    sqlstate: "22021"
    comment: invalid byte sequence for encoding UTF8 0x00
  - sql: |
      SELECT '\x610062'::bytea AS b, length('\x610062'::bytea) AS n
    expect: rows
