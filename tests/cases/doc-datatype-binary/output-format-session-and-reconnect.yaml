# bytea_output defaults to hex, is session-scoped, and a reconnect restores the default.
id: doc-datatype-binary.output-format-session-and-reconnect
title: bytea_output defaults to hex, can be switched to escape per session, and reconnect restores hex
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-output, guc, session-state]
required_capabilities: [select, guc, reconnect]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary-bytea-hex-format (output format depends on bytea_output; default is hex)"
sessions: [a]
steps:
  - sql: |
      SELECT '\xDEADBEEF'::bytea AS b
    expect: rows
    comment: default output format is hex
  - sql: |
      SET bytea_output = 'escape'
    expect: ok
  - sql: |
      SELECT '\xDEADBEEF'::bytea AS b
    expect: rows
    comment: escape output prints non-printable octets as octal
  - reconnect: true
  - sql: |
      SELECT '\xDEADBEEF'::bytea AS b
    expect: rows
    comment: new connection starts again with the hex default
  - sql: |
      SET bytea_output = 'bogus'
    expect: error
    sqlstate: "22023"
    comment: only hex and escape are valid values
