# Escape-format input errors: an octal escape above 377 (or with too few digits) and a lone trailing backslash are invalid.
id: doc-datatype-binary.escape-input-invalid
title: Invalid bytea escape-format input is rejected with 22P02
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-escape-format, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary-bytea-escape-format (escaped octets must use octal notation)"
sessions: [a]
steps:
  - sql: |
      SELECT '\400'::bytea
    expect: error
    sqlstate: "22P02"
    comment: octal value out of byte range
  - sql: |
      SELECT '\12'::bytea
    expect: error
    sqlstate: "22P02"
    comment: octal escape with fewer than three digits
  - sql: |
      SELECT 'a\'::bytea
    expect: error
    sqlstate: "22P02"
    comment: trailing lone backslash
