# Malformed hex input is rejected. The oracle reports SQLSTATE 22023 for these hex-format errors (not 22P02).
id: doc-datatype-binary.hex-invalid-input-errors
title: Malformed bytea hex input raises errors, and the session recovers afterwards
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-hex-format, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary-bytea-hex-format (hexadecimal digits and whitespace rules)"
sessions: [a]
steps:
  - sql: |
      SELECT '\xG0'::bytea
    expect: error
    sqlstate: "22023"
    comment: non-hex digit
  - sql: |
      SELECT '\xABC'::bytea
    expect: error
    sqlstate: "22023"
    comment: odd number of hex digits
  - sql: |
      SELECT '\xA B'::bytea
    expect: error
    sqlstate: "22023"
    comment: whitespace inside a digit pair is not permitted
  - sql: |
      SELECT '\xAB'::bytea
    expect: rows
    comment: the session is still usable after the errors
