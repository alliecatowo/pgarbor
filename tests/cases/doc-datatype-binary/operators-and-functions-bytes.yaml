# Operations act on actual bytes: concatenation, length versus bit length, get/set byte, substring and position.
id: doc-datatype-binary.operators-and-functions-bytes
title: bytea concatenation, length, get_byte, set_byte, substring and position operate on bytes
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-operators, bytea-functions, binary-strings]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary (operations on binary strings process the actual bytes)"
sessions: [a]
steps:
  - sql: |
      SELECT '\xDEAD'::bytea || '\xBE'::bytea AS cat, length('\x00'::bytea) AS len, octet_length('\x'::bytea) AS olen, get_byte('\xdeadbeef'::bytea, 2) AS b2
    expect: rows
  - sql: |
      SELECT set_byte('\x000000'::bytea, 1, 255) AS sb, substring('\xdeadbeef'::bytea from 2 for 2) AS sub, position('\xbe'::bytea in '\xdeadbeef'::bytea) AS pos, bit_length('\xdead'::bytea) AS bl
    expect: rows
  - sql: |
      SELECT get_byte('\xdeadbeef'::bytea, 4)
    expect: error
    sqlstate: "2202E"
    comment: index past the end of the value
  - sql: |
      SELECT set_byte('\x00'::bytea, 1, 1)
    expect: error
    sqlstate: "2202E"
    comment: set_byte index past the end of the value
