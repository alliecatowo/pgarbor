# Empty binary strings are valid in hex format and print as a bare \x; a zero octet is a real byte, not a terminator.
id: doc-datatype-binary.hex-empty-and-zero-octets
title: Empty bytea prints as bare \x, and a zero octet is stored and counted as a byte
family: doc-datatype-binary
tier: core
feature_ids: [bytea, bytea-hex-format, binary-strings, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-binary (binary strings allow storing octets of value zero)"
sessions: [a]
steps:
  - sql: |
      SELECT '\x'::bytea AS empty_hex, ''::bytea AS empty_literal, '\x00'::bytea AS one_zero_octet,
             length('\x'::bytea) AS len_empty, length('\x00'::bytea) AS len_zero,
             octet_length('\x0000'::bytea) AS len_two_zeros
    expect: rows
    comment: zero octets are allowed in bytea, unlike text (see doc-datatype-binary.text-rejects-zero-octet)
