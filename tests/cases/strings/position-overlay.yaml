# POSITION and OVERLAY on text and bytea, including empty-needle and no-match cases.
id: strings.position-overlay
title: POSITION and OVERLAY on text and bytea with empty needles, misses, and length arguments
family: strings
tier: core
feature_ids: [position, overlay, bytea, string-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
steps:
  - sql: |
      SELECT POSITION('4' IN '1234567890') AS p4, POSITION('xy' IN 'abcdef') AS miss, POSITION('' IN 'abc') AS empty_needle, POSITION('a' IN '') AS in_empty
    expect: rows
  - sql: |
      SELECT POSITION('\x5678'::bytea IN '\x1234567890'::bytea) AS bp, POSITION(''::bytea IN '\x1122'::bytea) AS bempty, POSITION('\x33'::bytea IN '\x1122'::bytea) AS bmiss
    expect: rows
  - sql: |
      SELECT OVERLAY('abcdef' PLACING '45' FROM 4) AS o1, OVERLAY('yabadoo' PLACING 'daba' FROM 5) AS o2, OVERLAY('yabadoo' PLACING 'daba' FROM 5 FOR 0) AS o3, OVERLAY('babosa' PLACING 'ubb' FROM 2 FOR 4) AS o4
    expect: rows
  - sql: |
      SELECT encode(overlay('Th\000omas'::bytea placing '\002\003'::bytea from 5 for 3), 'escape') AS bo
    expect: rows
  - sql: |
      SELECT OVERLAY(NULL::text PLACING 'x' FROM 1) IS NULL AS null_overlay
    expect: rows
