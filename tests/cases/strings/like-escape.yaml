# LIKE and ILIKE wildcards, a custom ESCAPE character, and the invalid multi-character escape error.
id: strings.like-escape
title: LIKE and ILIKE with wildcards, custom ESCAPE, and invalid escape strings
family: strings
tier: core
feature_ids: [like, ilike, escape-clause, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
steps:
  - sql: |
      SELECT 'hawkeye' LIKE 'h%' AS a, 'hawkeye' LIKE 'H%' AS b, 'hawkeye' LIKE 'h%eye' AS c, 'indio' LIKE '_ndio' AS d, 'indio' LIKE 'in_o' AS e
    expect: rows
  - sql: |
      SELECT 'hawkeye' ILIKE 'H%Eye' AS a, 'Hawkeye' ILIKE 'h%' AS b, 'hawkeye' NOT ILIKE 'H%Eye' AS c
    expect: rows
  - sql: |
      SELECT 'h%' LIKE 'h#%' ESCAPE '#' AS a, 'h%wkeye' LIKE 'h#%' ESCAPE '#' AS b, 'h%wkeye' LIKE 'h#%%' ESCAPE '#' AS c, 'maca' LIKE 'm%aca' ESCAPE '%' AS d
    expect: rows
  - sql: |
      SELECT 'a_c'::bytea LIKE 'a$__'::bytea ESCAPE '$'::bytea AS bytea_like
    expect: rows
  - sql: |
      SELECT 'hawkeye' LIKE 'h%' ESCAPE 'ab' AS err
    expect: error
    sqlstate: "22025"
  - sql: |
      SELECT NULL::text LIKE 'a%' AS n1, 'abc' LIKE NULL::text AS n2, 'abc' LIKE 'a%' ESCAPE NULL AS n3
    expect: rows
    comment: NULL in any LIKE operand yields NULL
