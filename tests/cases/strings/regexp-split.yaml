# regexp_split_to_array and regexp_split_to_table: separators, empty pattern, no match, and invalid flags.
id: strings.regexp-split
title: regexp_split_to_array and regexp_split_to_table with separator, empty, and non-matching patterns
family: strings
tier: extended
feature_ids: [regexp, regexp-split, arrays, string-functions, errors]
required_capabilities: [select, arrays, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
steps:
  - sql: |
      SELECT regexp_split_to_array('the quick brown fox', '\s+') AS words
    expect: rows
  - sql: |
      SELECT w, length(w) AS len FROM regexp_split_to_table('the quick brown fox', '\s+') AS w
    expect: rows
    order: multiset
  - sql: |
      SELECT regexp_split_to_array('thE QUick bROWn', 'e', 'i') AS ci_split
    expect: rows
  - sql: |
      SELECT regexp_split_to_array('the quick brown fox', 'nomatch') AS no_match
    expect: rows
  - sql: |
      SELECT regexp_split_to_array('123456', '6') AS tail, regexp_split_to_array('123456', '1') AS head
    expect: rows
  - sql: |
      SELECT regexp_split_to_array('1', '') AS one_char
    expect: rows
  - sql: |
      SELECT regexp_split_to_array('thE QUick', 'e', 'iz') AS err
    expect: error
    sqlstate: "22023"
