# String literal continuation across lines, concatenation with unknown and typed operands, NULL propagation.
id: strings.continuation-concat
title: String literal continuation, concatenation of unknown and typed operands, NULL propagation
family: strings
tier: core
feature_ids: [select, string-literals, concatenation]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
steps:
  - sql: |
      SELECT 'first line'
      ' - next line'
          ' - third line'
      AS three_lines
    expect: rows
  - sql: |
      SELECT 'first line' ' - next line' /* this comment is not allowed here */
      ' - third line' AS illegal
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 'unknown' || ' and unknown' AS c1,
             text 'text' || ' and unknown' AS c2,
             text 'text' || varchar ' and varchar' AS c3
    expect: rows
  - sql: |
      SELECT 'a' || NULL::text AS n1,
             NULL::text || NULL::text AS n2,
             concat('a', NULL, 'b') AS n3,
             concat_ws(',', 'a', NULL, 'b') AS n4
    expect: rows
