# lpad/rpad with fill and truncation, translate with short targets, repeat with non-positive counts, ascii and chr.
id: strings.pad-translate-repeat
title: lpad, rpad, translate, repeat, ascii and chr boundary behavior
family: strings
tier: core
feature_ids: [string-functions, padding, translate, repeat, ascii]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
steps:
  - sql: |
      SELECT lpad('hi', 5, 'xy') AS l1, lpad('hi', 5) AS l2, lpad('hello', 2) AS l3, lpad('hi', 5, '') AS l4
    expect: rows
  - sql: |
      SELECT rpad('hi', 5, 'xy') AS r1, rpad('hi', 5) AS r2, rpad('hello', 2) AS r3, rpad('hi', 5, '') AS r4
    expect: rows
  - sql: |
      SELECT lpad('hi', -5, 'xy') AS neg_l, rpad('hi', -5, 'xy') AS neg_r
    expect: rows
    comment: negative target length yields the empty string
  - sql: |
      SELECT translate('', '14', 'ax') AS t0, translate('12345', '14', 'ax') AS t1, translate('12345', '134', 'a') AS t2
    expect: rows
    comment: characters in from-set with no counterpart in to-set are deleted
  - sql: |
      SELECT repeat('Pg', 4) AS r4, repeat('Pg', -4) AS rneg, repeat('Pg', 0) AS r0
    expect: rows
  - sql: |
      SELECT ascii('x') AS ax, ascii('') AS a_empty, chr(65) AS c65, ltrim('zzzytrim', 'xyz') AS lt
    expect: rows
  - sql: |
      SELECT chr(-1) AS err
    expect: error
