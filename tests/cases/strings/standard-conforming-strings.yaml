# Backslash handling in ordinary string literals depends on standard_conforming_strings.
id: strings.standard-conforming-strings
title: Backslashes in string literals under standard_conforming_strings on and off
family: strings
tier: core
feature_ids: [string-literals, session-settings, escape-strings]
required_capabilities: [select, guc]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
sessions: [a]
steps:
  - sql: |
      SET escape_string_warning = off
    expect: ok
  - sql: |
      SET standard_conforming_strings = on
    expect: ok
  - sql: |
      SELECT 'a\bcd' AS f1, 'a\b''cd' AS f2, 'abcd\' AS f3, '\\' AS f4
    expect: rows
  - sql: |
      SET standard_conforming_strings = off
    expect: ok
  - sql: |
      SELECT 'a\\bcd' AS f1, 'a\\b\'cd' AS f2, 'abcd\\' AS f3, '\\\\' AS f4
    expect: rows
  - sql: |
      SELECT E'a\\bcd' AS f1, E'a\bcd' AS f2, E'\\' AS f3
    expect: rows
    comment: E-strings interpret backslash escapes regardless of the setting
  - sql: |
      RESET standard_conforming_strings
    expect: ok
