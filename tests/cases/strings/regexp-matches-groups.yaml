# regexp_matches returns text[] per match: capture groups, unmatched optional groups become NULL, and the g flag yields several rows.
id: strings.regexp-matches-groups
title: regexp_matches capture groups, NULL entries for unmatched groups, and the g flag
family: strings
tier: extended
feature_ids: [regexp, regexp-matches, arrays, string-functions]
required_capabilities: [select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
steps:
  - sql: |
      SELECT m FROM regexp_matches('foobarbequebaz', '(bar)(beque)') AS m
    expect: rows
    order: multiset
  - sql: |
      SELECT m FROM regexp_matches('foObARbEqUEbAz', '(bar)(beque)', 'i') AS m
    expect: rows
    order: multiset
  - sql: |
      SELECT m FROM regexp_matches('foobarbequebazilbarfbonk', '(b[^b]+)(b[^b]+)', 'g') AS m
    expect: rows
    order: multiset
  - sql: |
      SELECT m, m[2] IS NULL AS second_is_null FROM regexp_matches('foobarbequebaz', '(bar)(.+)?(beque)') AS m
    expect: rows
    order: multiset
  - sql: |
      SELECT m FROM regexp_matches('foobarbequebaz', 'barbeque') AS m
    expect: rows
    order: multiset
  - sql: |
      SELECT m FROM regexp_matches('foobarbequebaz', '(bar)(.+)(beque)') AS m
    expect: rows
    order: multiset
    comment: no match yields zero rows
  - sql: |
      SELECT regexp_matches('foobarbequebaz', '(bar)(beque)', 'gz')
    expect: error
    sqlstate: "22023"
