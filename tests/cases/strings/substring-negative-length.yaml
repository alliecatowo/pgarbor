# A negative substring length is an error; a zero or positive length is not.
id: strings.substring-negative-length
title: SUBSTRING and substr reject negative lengths with SQLSTATE 22011
family: strings
tier: core
feature_ids: [substring, errors, string-functions]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/strings.sql"
steps:
  - sql: |
      SELECT SUBSTRING('string' FROM -10 FOR -2147483646) AS err
    expect: error
    sqlstate: "22011"
  - sql: |
      SELECT substr('string', 5, -1) AS err
    expect: error
    sqlstate: "22011"
  - sql: |
      SELECT substr('string', 5, 0) AS empty
    expect: rows
  - sql: |
      SELECT SUBSTRING('abc'::bytea FROM 2 FOR 1) AS bytea_ok
    expect: rows
  - sql: |
      SELECT SUBSTRING('abc'::bytea FROM 2 FOR -1) AS bytea_err
    expect: error
    sqlstate: "22011"
