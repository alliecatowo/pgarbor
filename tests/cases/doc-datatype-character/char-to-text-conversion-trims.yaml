# Converting character to varchar or text removes trailing spaces; concatenation with a character operand also trims.
id: doc-datatype-character.char-to-text-conversion-trims
title: Converting character values to other string types removes trailing spaces
family: doc-datatype-character
tier: core
feature_ids: [character-type, blank-padding, type-conversion, string-concatenation, char-length]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (Trailing spaces are removed when converting a character value to one of the other string types)"
sessions: [a]
steps:
  - sql: |
      SELECT 'ab   '::char(5)::varchar AS v, length('ab   '::char(5)::varchar) AS lv, length('ab   '::char(5)::text) AS lt
    expect: rows
    comment: trailing spaces removed in both conversions
  - sql: |
      SELECT 'ab'::char(4) || 'x' AS cat, length('ab'::char(4) || 'x') AS lc
    expect: rows
    comment: the character operand is converted to text first, giving 'abx'
  - sql: |
      SELECT 'ab   '::text AS tx, char_length('ab   '::text) AS tl
    expect: rows
    comment: text keeps trailing spaces, so length is 5
  - sql: |
      SELECT 'ab   '::varchar(2) AS vt, char_length('ab   '::varchar(2)) AS vl
    expect: rows
    comment: excess spaces removed by the explicit varchar(2) cast
