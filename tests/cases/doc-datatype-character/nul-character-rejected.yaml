# The character with code zero cannot be stored in any character type.
id: doc-datatype-character.nul-character-rejected
title: NUL characters are rejected for text, varchar and character values
family: doc-datatype-character
tier: core
feature_ids: [character-type, nul-character, encoding, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (the character with code zero (sometimes called NUL) cannot be stored)"
sessions: [a]
setup: |
  CREATE TABLE nul_t (a text, b varchar(10), c char(5))
steps:
  - sql: |
      INSERT INTO nul_t (a) VALUES (E'a\0b')
    expect: error
    sqlstate: "22021"
  - sql: |
      INSERT INTO nul_t (b) VALUES (E'a\0b')
    expect: error
    sqlstate: "22021"
  - sql: |
      INSERT INTO nul_t (c) VALUES (E'a\0b')
    expect: error
    sqlstate: "22021"
  - sql: |
      SELECT E'a\0b' AS lit
    expect: error
    sqlstate: "22021"
    comment: even a literal cannot carry NUL into the server
