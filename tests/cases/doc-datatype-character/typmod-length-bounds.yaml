# Declared lengths must be between 1 and 10485760 for both varchar(n) and character(n).
id: doc-datatype-character.typmod-length-bounds
title: varchar(n) and character(n) reject n below 1 or above 10485760 with 22023
family: doc-datatype-character
tier: core
feature_ids: [character-varying, character-type, type-modifiers, length-limit, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (the length n must be greater than zero and cannot exceed 10,485,760)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE lb0 (w varchar(0))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE lb1 (w varchar(10485761))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE lb2 (w char(0))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE lb3 (w char(10485761))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE lb4 (w varchar(10485760), x char(10485760))
    expect: ok
    comment: the maximum is accepted
