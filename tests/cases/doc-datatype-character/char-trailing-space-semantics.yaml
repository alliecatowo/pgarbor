# Trailing spaces are insignificant for character(n) comparison but significant for text and varchar; NULL comparisons yield NULL.
id: doc-datatype-character.char-trailing-space-semantics
title: Trailing spaces are ignored when comparing character(n) but count for text and varchar
family: doc-datatype-character
tier: core
feature_ids: [character-type, blank-padding, trailing-spaces, comparison, null-semantics]
required_capabilities: [select, null-semantics]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (trailing spaces semantically insignificant for character; significant for character varying and text)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a '::char(2) = 'a'::char(2) AS char_eq, 'a '::char(2) = 'a'::char(3) AS char_eq_diff_len
    expect: rows
    comment: both true; trailing spaces are semantically insignificant for character
  - sql: |
      SELECT 'a '::text = 'a'::text AS text_eq, 'a '::varchar = 'a'::varchar AS varchar_eq
    expect: rows
    comment: both false; trailing spaces are significant for text and varchar
  - sql: |
      SELECT 'a'::char(3) = 'a '::text AS mixed_char_text
    expect: rows
    comment: the character value is converted to text (trailing spaces removed) before comparing, giving 'a' vs 'a ' which is false
  - sql: |
      SELECT 'a'::char(3) = NULL::char(3) AS null_cmp, char_length(NULL::char(3)) AS null_len
    expect: rows
    comment: NULL propagates through comparison and length functions
