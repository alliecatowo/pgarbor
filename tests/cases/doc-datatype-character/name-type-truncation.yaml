# The name type holds 63 characters; longer input is truncated silently, not rejected.
id: doc-datatype-character.name-type-truncation
title: name values longer than 63 bytes are silently truncated
family: doc-datatype-character
tier: extended
feature_ids: [name-type, identifier, string-truncation]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character-special-table (name is 64 bytes, 63 usable characters plus terminator)"
sessions: [a]
steps:
  - sql: |
      SELECT length(repeat('a', 70)::name) AS nlen, length(repeat('a', 70)::name::text) AS nlen2
    expect: rows
    comment: both 63
  - sql: |
      SELECT repeat('a', 63) = repeat('a', 70)::name AS eq_truncated
    expect: rows
    comment: the truncated name equals the 63-character string
