# character without a length specifier is character(1).
id: doc-datatype-character.char-without-length
title: Bare character is equivalent to character(1); a longer value is an error
family: doc-datatype-character
tier: core
feature_ids: [character-type, char-default-length, string-data-truncation, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (If character lacks a specifier, it is equivalent to character(1))"
sessions: [a]
setup: |
  CREATE TABLE t3 (c character)
steps:
  - sql: |
      INSERT INTO t3 VALUES ('a')
    expect: ok
  - sql: |
      INSERT INTO t3 VALUES ('ab')
    expect: error
    sqlstate: "22001"
  - sql: |
      SELECT c, length(c) AS n, octet_length(c) AS ob FROM t3
    expect: rows
    comment: stored as one byte of character data
  - sql: |
      SELECT 'ab'::character AS cast_trunc
    expect: rows
    comment: explicit cast to character(1) truncates
