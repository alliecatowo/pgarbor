# The internal "char" type is a single byte and silently keeps only the first character; it differs from char(1).
id: doc-datatype-character.quoted-char-single-byte
title: The internal "char" type stores one byte and silently keeps the first character
family: doc-datatype-character
tier: extended
feature_ids: [internal-char, single-byte, string-truncation, character-type]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character-special-table (\"char\" uses one byte of storage and stores only a single ASCII character)"
sessions: [a]
setup: |
  CREATE TABLE qc (q "char")
steps:
  - sql: |
      INSERT INTO qc VALUES ('x'), ('yz')
    expect: ok
    comment: no error for the second value; it is truncated to its first character
  - sql: |
      SELECT q, octet_length(q) AS ob FROM qc ORDER BY q
    expect: rows
    order: ordered
