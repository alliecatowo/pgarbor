# bpchar without a length accepts strings of any length; trailing spaces are semantically insignificant.
id: doc-datatype-character.bpchar-no-length
title: bpchar without a length accepts long values and ignores trailing spaces
family: doc-datatype-character
tier: core
feature_ids: [bpchar, character-type, unlimited-length, blank-padding]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (If bpchar lacks a length specifier, it also accepts strings of any length)"
sessions: [a]
setup: |
  CREATE TABLE bp (x bpchar)
steps:
  - sql: |
      INSERT INTO bp VALUES (repeat('z', 500)), ('ab   ')
    expect: ok
  - sql: |
      SELECT length(x) AS n, x = 'ab' AS eq_ab FROM bp ORDER BY n
    expect: rows
    order: ordered
    comment: "'ab   ' has length 2 and equals 'ab'; the 500-character value is kept whole"
  - sql: |
      SELECT 'ab  '::bpchar AS bp, length('ab  '::bpchar) AS bpl
    expect: rows
