# LIKE on character values does not ignore trailing spaces as the comparison operators do; the documented COLLATE "C" anomaly.
id: doc-datatype-character.char-pattern-and-collation
title: LIKE on character and text values differs; COLLATE "C" exposes whitespace ordering
family: doc-datatype-character
tier: core
feature_ids: [character-type, pattern-matching, like, collation, trailing-spaces]
required_capabilities: [select, collation, pattern-matching]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (SELECT 'a '::CHAR(2) collate \"C\" < E'a\\n'::CHAR(2) returns true)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a '::char(2) LIKE 'a' AS like_char, 'a '::text LIKE 'a' AS like_text, 'a '::text LIKE 'a ' AS like_text_sp
    expect: rows
    comment: pattern matching treats trailing spaces as significant
  - sql: |
      SELECT 'a '::char(2) collate "C" < E'a\n'::char(2) AS docs_example
    expect: rows
    comment: docs say true; a space sorts above a newline in C collation
  - sql: |
      SELECT 'a '::char(2) = E'a\n'::char(2) AS not_equal, 'x'::char(2) = 'x '::char(2) AS equal_pad
    expect: rows
    comment: unequal values are not equal; 'x' and 'x ' compare equal
