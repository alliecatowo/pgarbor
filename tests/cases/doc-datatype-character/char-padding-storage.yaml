# character(n) pads stored values with spaces; char_length ignores the padding, octet_length does not; char->text trims.
id: doc-datatype-character.char-padding-storage
title: character(4) space-pads on storage; char_length ignores padding, octet_length counts it
family: doc-datatype-character
tier: core
feature_ids: [character-type, char-n, blank-padding, char-length, octet-length]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (Using the Character Types, test1 example)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE test1 (a character(4))
    expect: ok
  - sql: |
      INSERT INTO test1 VALUES ('ok')
    expect: ok
  - sql: |
      SELECT a, char_length(a) FROM test1
    expect: rows
    comment: docs example; char_length is 2 even though the value is stored padded to 4
  - sql: |
      SELECT octet_length(a) AS stored_bytes FROM test1
    expect: rows
    comment: storage includes the space padding, so 4
  - sql: |
      SELECT a::text AS as_text, length(a::text) AS n FROM test1
    expect: rows
    comment: converting character to text removes trailing spaces
