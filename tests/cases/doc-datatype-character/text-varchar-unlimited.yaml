# varchar without a length and text accept long values with no declared limit; spaces are kept.
id: doc-datatype-character.text-varchar-unlimited
title: text and bare varchar accept 10000 characters and keep trailing spaces
family: doc-datatype-character
tier: core
feature_ids: [text, character-varying, unlimited-length, blank-padding]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-character (text, and character varying without a length specifier)"
sessions: [a]
setup: |
  CREATE TABLE tv (y varchar, t text)
steps:
  - sql: |
      INSERT INTO tv VALUES (repeat('q', 10000), 'ok   ')
    expect: ok
  - sql: |
      SELECT length(y) AS ly, char_length(t) AS lt FROM tv
    expect: rows
    comment: text keeps trailing spaces (length 5), not trimmed
  - sql: |
      SELECT t = 'ok' AS t_eq_ok, t = 'ok   ' AS t_eq_padded FROM tv
    expect: rows
    comment: text trailing spaces are significant, so only the exact value matches
