# A scalar subquery returning more than one row is 21000 cardinality_violation.
id: select.error-scalar-subquery-cardinality
title: Scalar subquery returning several rows raises cardinality_violation
family: select
tier: core
feature_ids: [select, errors, subqueries]
required_capabilities: [create-table, insert, select, subqueries]
provenance:
  source: hand
  ref: "PG18 errcodes 21000 cardinality_violation"
sessions: [a]
setup: |
  CREATE TABLE t (id int4);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      SELECT (SELECT id FROM t) AS v
    expect: error
    sqlstate: "21000"
  - sql: |
      SELECT (SELECT id FROM t ORDER BY id LIMIT 1) AS v
    expect: rows
    order: ordered
    comment: LIMIT 1 makes the scalar subquery valid
