# VALUES as a standalone query and as a member of UNION ALL, with mixed int/numeric literals.
id: select.values-standalone-union
title: Standalone VALUES and VALUES combined with UNION ALL and a scalar SELECT
family: select
tier: core
feature_ids: [select, values, set-operations]
required_capabilities: [select, union]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (Test VALUES lists)"
sessions: [a]
steps:
  - sql: |
      VALUES (1,2), (3,4+4), (7,77.7)
    expect: rows
    order: multiset
    comment: column 2 resolves to numeric because of 77.7
  - sql: |
      VALUES (1,2), (3,4+4), (7,77.7)
      UNION ALL
      SELECT 2+2, 57
      UNION ALL
      SELECT 9::int8, 99
    expect: rows
    order: multiset
