# ORDER BY with explicit USING operators, mixed directions across two keys, no ties.
id: select.order-by-using-operators
title: ORDER BY with USING > and USING < on int and text keys
family: select
tier: core
feature_ids: [select, order-by, text]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (ORDER BY ... using >, string4 using <)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (1,'x'), (3,'b'), (3,'a'), (2,'z'), (2,'m');
steps:
  - sql: |
      SELECT a, b FROM t ORDER BY a USING >, b USING <
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM t ORDER BY a USING <, b USING >
    expect: rows
    order: ordered
