# X = X is not a no-op: the filter removes NULL rows, as if written X IS NOT NULL.
id: select.self-equality-filter
title: WHERE k = k filters out NULL rows
family: select
tier: core
feature_ids: [select, nulls, values, operators]
required_capabilities: [select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (X = X isn't a no-op, bug #5084)"
sessions: [a]
steps:
  - sql: |
      SELECT k FROM (VALUES (2), (NULL), (1)) AS v(k) WHERE k = k ORDER BY k
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM (VALUES (2), (NULL), (1)) AS v(k) WHERE k = k
    expect: rows
    order: multiset
    comment: exactly two rows, the NULL row is removed
