# Whole-row references to a subquery with an OFFSET 0 optimization fence, including NULL columns.
id: select.subquery-whole-row
title: Whole-row reference to single-column and multi-column subqueries including NULLs
family: select
tier: core
feature_ids: [select, subqueries, nulls]
required_capabilities: [select, subqueries]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (whole-row Var referencing a subquery)"
sessions: [a]
steps:
  - sql: |
      SELECT foo FROM (SELECT 1 OFFSET 0) AS foo
    expect: rows
    order: multiset
  - sql: |
      SELECT foo FROM (SELECT NULL OFFSET 0) AS foo
    expect: rows
    order: multiset
    comment: the single column is NULL, the whole-row value is not
  - sql: |
      SELECT foo FROM (SELECT 'xyzzy', 1, NULL OFFSET 0) AS foo
    expect: rows
    order: multiset
