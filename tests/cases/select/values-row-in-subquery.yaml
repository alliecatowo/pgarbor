# Row-constructor IN (VALUES ...) against a small table generated in setup.
id: select.values-row-in-subquery
title: Row comparison IN a VALUES list in a WHERE clause
family: select
tier: core
feature_ids: [select, values, row-comparison, subqueries]
required_capabilities: [create-table, insert, select, values]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (try VALUES in a subquery); onek replaced by a small generated table"
sessions: [a]
setup: |
  CREATE TABLE onek_mini AS
    SELECT g AS unique1, g % 10 AS ten FROM generate_series(0, 99) AS g;
steps:
  - sql: |
      SELECT unique1, ten FROM onek_mini
      WHERE (unique1, ten) IN (VALUES (1,1), (20,0), (99,9), (17,99))
      ORDER BY unique1
    expect: rows
    order: ordered
    comment: (17,7) does not match (17,99), so three rows
