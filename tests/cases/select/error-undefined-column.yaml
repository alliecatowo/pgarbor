# Unknown column in the select list is 42703; ORDER BY position beyond the select list is 42P10.
id: select.error-undefined-column
title: Undefined column and out-of-range ORDER BY position raise SQLSTATE errors, session recovers
family: select
tier: core
feature_ids: [select, errors, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 errcodes 42703 undefined_column, 42P10 invalid_column_reference"
sessions: [a]
setup: |
  CREATE TABLE t (id int4);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      SELECT nosuchcol FROM t
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT id FROM t ORDER BY 2
    expect: error
    sqlstate: "42P10"
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the session is not in an aborted transaction after autocommit errors
