# A column name present in two FROM items without qualification is 42702.
id: select.error-ambiguous-column
title: Unqualified column present in two joined tables raises ambiguous column error
family: select
tier: core
feature_ids: [select, errors, join]
required_capabilities: [create-table, insert, select, join]
provenance:
  source: hand
  ref: "PG18 errcodes 42702 ambiguous_column"
sessions: [a]
setup: |
  CREATE TABLE a1 (id int4, va text);
  CREATE TABLE b1 (id int4, vb text);
  INSERT INTO a1 VALUES (1, 'a');
  INSERT INTO b1 VALUES (1, 'b');
steps:
  - sql: |
      SELECT id FROM a1, b1
    expect: error
    sqlstate: "42702"
  - sql: |
      SELECT a1.id, vb FROM a1 JOIN b1 ON a1.id = b1.id
    expect: rows
    order: multiset
    comment: qualified reference resolves the ambiguity
