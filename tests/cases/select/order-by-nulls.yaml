# ORDER BY over a column with NULLs: default NULL placement, explicit NULLS FIRST/LAST, DESC.
id: select.order-by-nulls
title: ORDER BY default and explicit NULLS FIRST/LAST placement, ASC and DESC
family: select
tier: core
feature_ids: [select, order-by, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (ORDER BY options section)"
sessions: [a]
setup: |
  CREATE TABLE foo (f1 int4);
  INSERT INTO foo VALUES (42),(3),(10),(7),(null),(null),(1);
steps:
  - sql: |
      SELECT f1 FROM foo ORDER BY f1
    expect: rows
    order: ordered
    comment: ASC default puts NULLs last
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 ASC
    expect: rows
    order: ordered
    comment: same as the default
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 DESC
    expect: rows
    order: ordered
    comment: DESC default puts NULLs first
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 DESC NULLS LAST
    expect: rows
    order: ordered
