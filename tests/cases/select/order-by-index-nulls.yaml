# ORDER BY must return the same NULL placement whether or not a btree index provides the order.
id: select.order-by-index-nulls
title: ORDER BY NULL placement is unchanged by ascending and DESC NULLS LAST btree indexes
family: select
tier: core
feature_ids: [select, order-by, nulls, btree-index]
required_capabilities: [create-table, insert, select, create-index]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (check if indexscans do the right things)"
sessions: [a]
setup: |
  CREATE TABLE foo (f1 int4);
  INSERT INTO foo VALUES (42),(3),(10),(7),(null),(null),(1);
  CREATE INDEX fooi ON foo (f1);
steps:
  - sql: |
      SELECT f1 FROM foo ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 DESC
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 DESC NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      DROP INDEX fooi;
      CREATE INDEX fooi ON foo (f1 DESC NULLS LAST)
    expect: ok
  - sql: |
      SELECT f1 FROM foo ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 DESC
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM foo ORDER BY f1 DESC NULLS LAST
    expect: rows
    order: ordered
