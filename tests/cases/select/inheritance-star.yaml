# person* includes child tables; ONLY excludes them. Uses ORDER BY with mixed direction.
id: select.inheritance-star
title: SELECT from a parent table with and without inheritance expansion
family: select
tier: core
feature_ids: [select, inheritance, order-by]
required_capabilities: [create-table, insert, select, inheritance]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select.sql (SELECT p.name, p.age FROM person* p)"
sessions: [a]
setup: |
  CREATE TABLE person (name text, age int4);
  CREATE TABLE emp (salary int4) INHERITS (person);
  CREATE TABLE student (gpa numeric(3,2)) INHERITS (person);
  INSERT INTO person VALUES ('alice', 30);
  INSERT INTO emp VALUES ('bob', 45, 5000);
  INSERT INTO student VALUES ('carol', 20, 3.90);
steps:
  - sql: |
      SELECT p.name, p.age FROM person* p ORDER BY p.age DESC, p.name
    expect: rows
    order: ordered
    comment: all three rows, including child tables
  - sql: |
      SELECT p.name, p.age FROM ONLY person p ORDER BY p.name
    expect: rows
    order: ordered
    comment: only the parent row
