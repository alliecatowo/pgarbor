# Set-returning functions are not allowed in WHERE: 0A000 feature_not_supported.
id: select.error-set-returning-in-where
title: Set-returning function in WHERE raises feature_not_supported
family: select
tier: core
feature_ids: [select, errors, set-returning-functions]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 errcodes 0A000 feature_not_supported; select.sql set-returning context rules"
sessions: [a]
setup: |
  CREATE TABLE t (id int4);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      SELECT id FROM t WHERE generate_series(1, 2) > 0
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT id FROM t
    expect: rows
    order: multiset
