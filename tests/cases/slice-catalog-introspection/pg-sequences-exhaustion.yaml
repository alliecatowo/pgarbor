# pg_sequences attributes for ascending and descending sequences; NO CYCLE exhaustion raises 2200H; CYCLE wraps around.
id: slice-catalog-introspection.pg-sequences-exhaustion
title: pg_sequences attributes, nextval exhaustion without CYCLE and wrap-around with CYCLE
family: slice-catalog-introspection
tier: extended
feature_ids: [catalog-introspection, sequence, create-sequence, errors]
required_capabilities: [create-sequence, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/view-pg-sequences.html; https://www.postgresql.org/docs/18/functions-sequence.html"
sessions: [a]
setup: |
  CREATE SEQUENCE s_small AS int4 INCREMENT BY 2 MINVALUE 1 MAXVALUE 5 START WITH 1 NO CYCLE;
  CREATE SEQUENCE s_cyc INCREMENT BY -1 MINVALUE 1 MAXVALUE 3 START 3 CYCLE;
steps:
  - sql: |
      SELECT sequencename, data_type::text, start_value, min_value, max_value, increment_by, cycle FROM pg_sequences WHERE schemaname = 'public' ORDER BY sequencename
    expect: rows
    order: ordered
  - sql: |
      SELECT nextval('s_small') AS v
    expect: rows
  - sql: |
      SELECT nextval('s_small') AS v
    expect: rows
  - sql: |
      SELECT nextval('s_small') AS v
    expect: rows
    comment: third value is 5 (START 1 + INCREMENT 2 twice), exactly MAXVALUE
  - sql: |
      SELECT nextval('s_small') AS v
    expect: error
    sqlstate: "2200H"
    comment: sequence passed MAXVALUE without CYCLE
  - sql: |
      SELECT nextval('s_cyc') AS v
    expect: rows
  - sql: |
      SELECT nextval('s_cyc') AS v
    expect: rows
  - sql: |
      SELECT nextval('s_cyc') AS v
    expect: rows
  - sql: |
      SELECT nextval('s_cyc') AS v
    expect: rows
    comment: wraps back to MAXVALUE after reaching MINVALUE
