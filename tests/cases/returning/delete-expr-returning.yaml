# DELETE ... RETURNING with function expressions over NULL-containing columns, and an empty delete.
id: returning.delete-expr-returning
title: DELETE RETURNING with least() over a NULL column and zero-row delete
family: returning
tier: core
feature_ids: [returning, delete, nulls, scalar-functions]
required_capabilities: [create-table, insert, delete, select, returning]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/returning.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE foo (f1 int, f2 text, f3 int);
  INSERT INTO foo VALUES (1, 'a', 10), (2, 'b', -5), (3, 'c', NULL), (4, 'd', 7)
steps:
  - sql: |
      DELETE FROM foo WHERE f1 > 2 RETURNING f3, f2, f1, least(f1, f3)
    expect: rows
    order: multiset
    comment: least() ignores NULL arguments
  - sql: |
      SELECT f1, f2, f3 FROM foo ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM foo WHERE f1 = 999 RETURNING f1
    expect: rows
    order: multiset
