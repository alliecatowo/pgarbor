# RETURNING WITH (...) option list: unknown option kind is a syntax error; duplicate old alias is rejected.
id: returning.with-option-errors
title: RETURNING WITH option list rejects an unknown kind and a duplicate OLD alias
family: returning
tier: core
feature_ids: [returning, returning-old-new, errors]
required_capabilities: [create-table, insert, select, returning, returning-old-new]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/returning.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE foo (f1 int, f2 text)
steps:
  - sql: |
      INSERT INTO foo DEFAULT VALUES RETURNING WITH (nonsuch AS something) *
    expect: error
    sqlstate: "42601"
  - sql: |
      INSERT INTO foo DEFAULT VALUES RETURNING WITH (old AS o, new AS n, old AS o) *
    expect: error
    comment: duplicate alias for OLD; SQLSTATE deliberately unstated, recorder decides
  - sql: |
      SELECT count(*) FROM foo
    expect: rows
    comment: neither failed statement inserted a row
