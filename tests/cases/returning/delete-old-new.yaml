# DELETE RETURNING: old carries the deleted row, new is NULL; regclass from old.tableoid.
id: returning.delete-old-new
title: DELETE RETURNING old populated and new NULL, including a NULL column in the old row
family: returning
tier: core
feature_ids: [returning, delete, returning-old-new, nulls]
required_capabilities: [create-table, insert, delete, select, returning, returning-old-new, regclass]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/returning.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE foo (f1 int, f2 text, f3 int, f4 int8);
  INSERT INTO foo VALUES (5, 'five', 1, 10), (6, 'six', 2, NULL)
steps:
  - sql: |
      DELETE FROM foo WHERE f1 = 5
        RETURNING old.tableoid::regclass AS tbl, old.f2 AS old_f2, new.f2 IS NULL AS new_is_null
    expect: rows
    order: multiset
  - sql: |
      DELETE FROM foo WHERE f1 = 6
        RETURNING old.f4 IS NULL AS old_f4_null, new.f4 IS NULL AS new_f4_null
    expect: rows
    order: multiset
  - sql: |
      SELECT f1 FROM foo ORDER BY f1
    expect: rows
    order: ordered
