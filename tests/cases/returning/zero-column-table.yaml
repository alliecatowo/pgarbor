# INSERT and DELETE on a zero-column table: RETURNING old/new tableoid and ctid without any user columns.
id: returning.zero-column-table
title: INSERT and DELETE RETURNING on a table with no user columns
family: returning
tier: extended
feature_ids: [returning, insert, delete, returning-old-new, regclass]
required_capabilities: [create-table, insert, delete, select, returning, returning-old-new, regclass]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/returning.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE zerocol ()
steps:
  - sql: |
      INSERT INTO zerocol DEFAULT VALUES
        RETURNING old.tableoid::regclass AS old_rel, new.tableoid::regclass AS new_rel,
                  old.ctid IS NULL AS old_ctid_null, new.ctid IS NOT NULL AS new_ctid_set
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM zerocol
    expect: rows
  - sql: |
      DELETE FROM zerocol
        RETURNING old.tableoid::regclass AS old_rel, new.tableoid IS NULL AS new_null
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM zerocol
    expect: rows
