# INSERT RETURNING: the old pseudo-relation is all NULL, new carries the inserted row.
id: returning.insert-old-new-nulls
title: INSERT RETURNING sees NULL old row and the inserted new row, including NULL values
family: returning
tier: core
feature_ids: [returning, insert, returning-old-new, nulls]
required_capabilities: [create-table, insert, select, returning, returning-old-new]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/returning.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE foo (f1 int, f2 text)
steps:
  - sql: |
      INSERT INTO foo VALUES (1, 'one')
        RETURNING old.f1 IS NULL AS old_null, new.f1, new.f2
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO foo VALUES (NULL, NULL)
        RETURNING old.f1 IS NULL AS old_null, new.f1 IS NULL AS new_f1_null, new.f2 IS NULL AS new_f2_null
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM foo
    expect: rows
