# INSERT ... RETURNING with serial, column DEFAULT, expression list and a computed RETURNING column.
id: returning.insert-basic
title: INSERT RETURNING with serial default, DEFAULT keyword and computed column
family: returning
tier: slice
feature_ids: [returning, insert, serial, column-defaults]
required_capabilities: [create-table, insert, select, returning, serial]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/returning.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE foo (f1 serial, f2 text, f3 int DEFAULT 42)
steps:
  - sql: |
      INSERT INTO foo (f2, f3)
        VALUES ('test', DEFAULT), ('More', 11), (upper('more'), 7+9)
        RETURNING *, f1+f3 AS sum
    expect: rows
    order: multiset
  - sql: |
      SELECT f1, f2, f3 FROM foo ORDER BY f1
    expect: rows
    order: ordered
