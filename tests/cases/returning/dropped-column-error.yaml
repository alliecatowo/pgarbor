# RETURNING referencing a dropped column fails with undefined column; remaining columns still work.
id: returning.dropped-column-error
title: RETURNING old.<dropped column> is an undefined-column error after ALTER TABLE DROP COLUMN
family: returning
tier: core
feature_ids: [returning, update, alter-table, errors]
required_capabilities: [create-table, insert, update, select, returning, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/returning.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE foo (f1 int, f2 text, f3 int, f4 int8);
  INSERT INTO foo VALUES (1, 'a', 10, 20)
steps:
  - sql: |
      ALTER TABLE foo DROP COLUMN f3
    expect: ok
  - sql: |
      UPDATE foo SET f4 = f4 + 1 RETURNING old.f3
    expect: error
    sqlstate: "42703"
  - sql: |
      UPDATE foo SET f4 = f4 + 1 RETURNING old.f4, new.f4
    expect: rows
    order: multiset
