# Basic char(1) literal equality and inequality (pg-regress char.sql first statement).
id: char.literal-equality
title: char literal equality and inequality
family: char
tier: core
feature_ids: [char-type, equality]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/char.sql"
sessions: [a]
steps:
  - sql: |
      SELECT char 'c' = char 'c' AS eq
    expect: rows
  - sql: |
      SELECT char 'c' = char 'd' AS eq
    expect: rows
  - sql: |
      SELECT char 'c' <> char 'd' AS neq
    expect: rows
