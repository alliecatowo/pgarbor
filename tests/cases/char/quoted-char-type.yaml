# The internal one-byte "char" type (quoted). Only ASCII-safe values are checked here; the
# high-bit-set octal escape output is excluded because it depends on client encoding.
# Derived from char.sql "ad-hoc one-byte type" block.
id: char.quoted-char-type
title: "The one-byte char type with literals, octal escapes, text round trips and empty value"
family: char
tier: extended
feature_ids: [quoted-char-type, casts, char-type]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/char.sql; expected/char.out lines 140-200"
sessions: [a]
steps:
  - sql: |
      SELECT 'a'::"char" AS c
    expect: rows
  - sql: |
      SELECT '\101'::"char" AS c
    expect: rows
    comment: octal escape 101 is 'A'
  - sql: |
      SELECT 'a'::"char"::text AS t
    expect: rows
  - sql: |
      SELECT '\000'::"char"::text AS t, length('\000'::"char"::text) AS n
    expect: rows
    comment: the zero byte converts to an empty text value
  - sql: |
      SELECT 'a'::text::"char" AS c
    expect: rows
  - sql: |
      SELECT ''::text::"char"::text AS t, length(''::text::"char"::text) AS n
    expect: rows
