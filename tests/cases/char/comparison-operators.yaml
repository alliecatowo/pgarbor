# char(1) relational operators against a literal. Values chosen (letter 'a' and digits) so the
# result does not depend on locale collation. Derived from char.sql CHAR_TBL operator queries.
id: char.comparison-operators
title: char(1) <>, <, and >= comparisons against a literal
family: char
tier: core
feature_ids: [char-type, comparison-operators, where]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/char.sql (CHAR_TBL WHERE f1 <> / < / >= 'a')"
sessions: [a]
setup: |
  CREATE TABLE char_cmp (id int4 PRIMARY KEY, f1 char(1));
  INSERT INTO char_cmp VALUES (1, 'a'), (2, '1'), (3, '3'), (4, 'a');
steps:
  - sql: |
      SELECT id FROM char_cmp WHERE f1 <> 'a' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM char_cmp WHERE f1 = 'a' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM char_cmp WHERE f1 < 'a' ORDER BY id
    expect: rows
    order: ordered
    comment: digits sort before letters under any reasonable collation
  - sql: |
      SELECT id FROM char_cmp WHERE f1 >= '3' ORDER BY id
    expect: rows
    order: ordered
