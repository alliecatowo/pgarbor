# Integer values are assignment-converted to char through their text I/O form.
# Derived from char.sql "INSERT INTO CHAR_TBL (f1) VALUES (2)".
id: char.integer-assignment
title: Integer literal assigned to a char(1) column is stored as its text form
family: char
tier: core
feature_ids: [char-type, insert, assignment-casts]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/char.sql (INSERT ... VALUES (2))"
sessions: [a]
setup: |
  CREATE TABLE char_int (id int4 PRIMARY KEY, f1 char(1));
steps:
  - sql: |
      INSERT INTO char_int (id, f1) VALUES (1, '1'), (2, 2)
    expect: ok
  - sql: |
      SELECT id, f1 FROM char_int ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 = '2' AS is_two FROM char_int WHERE id = 2
    expect: rows
