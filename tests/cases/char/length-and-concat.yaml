# length() and char_length() ignore trailing padding, octet_length() counts stored bytes, and
# concatenation with text strips trailing blanks from the char operand.
id: char.length-and-concat
title: length ignores padding, octet_length counts it, concatenation strips it
family: char
tier: core
feature_ids: [char-type, string-functions, concatenation]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 docs datatype-character.html; functions-string.html (length, octet_length)"
sessions: [a]
steps:
  - sql: |
      SELECT length('ab   '::char(5)) AS len, char_length('ab   '::char(5)) AS clen
    expect: rows
  - sql: |
      SELECT octet_length('ab   '::char(5)) AS octets
    expect: rows
  - sql: |
      SELECT 'ab'::char(4) || 'x' AS cat
    expect: rows
    comment: bpchar is cast to text for || and the padding is dropped
  - sql: |
      SELECT 'ab'::char(4)::varchar AS v
    expect: rows
