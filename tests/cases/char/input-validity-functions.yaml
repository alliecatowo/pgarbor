# Non-throwing input validation: pg_input_is_valid and pg_input_error_info for char(4).
# Derived from char.sql "Also try it with non-error-throwing API".
id: char.input-validity-functions
title: pg_input_is_valid and pg_input_error_info report char(4) overflow without raising
family: char
tier: extended
feature_ids: [char-type, input-functions, error-reporting]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/char.sql; expected/char.out lines 129-138"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('abcd  ', 'char(4)') AS ok_valid
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('abcde', 'char(4)') AS ok_valid
    expect: rows
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('abcde', 'char(4)')
    expect: rows
