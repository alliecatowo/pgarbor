# char comparison is padding-insensitive, so 'ab' and 'ab ' collide under a PRIMARY KEY.
id: char.unique-ignores-padding
title: Primary key on char(3) treats 'ab' and 'ab ' as duplicates
family: char
tier: core
feature_ids: [char-type, constraints, unique, insert]
required_capabilities: [create-table, insert, select, constraints]
provenance:
  source: hand
  ref: "PG18 docs datatype-character.html (trailing spaces are insignificant for character(n))"
sessions: [a]
setup: |
  CREATE TABLE pad_key (k char(3) PRIMARY KEY, v int4);
steps:
  - sql: |
      INSERT INTO pad_key VALUES ('ab', 1)
    expect: ok
  - sql: |
      INSERT INTO pad_key VALUES ('ab ', 2)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO pad_key VALUES ('abc', 3)
    expect: ok
  - sql: |
      SELECT k, v FROM pad_key ORDER BY v
    expect: rows
    order: ordered
