# char(n) stores values blank-padded to n; trailing spaces in input are insignificant and
# casting back to text strips them. Derived from char.sql CHAR_TBL inserts.
id: char.insert-pads-and-trims
title: char(4) pads short values, trims trailing spaces, and reads back without padding as text
family: char
tier: core
feature_ids: [char-type, create-table, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/char.sql; sql/test_setup.sql CHAR_TBL"
sessions: [a]
setup: |
  CREATE TABLE char_tbl (id int4 PRIMARY KEY, f1 char(4));
steps:
  - sql: |
      INSERT INTO char_tbl (id, f1) VALUES (1, 'a'), (2, 'ab'), (3, 'c     '), (4, 'cd'), (5, '')
    expect: ok
  - sql: |
      SELECT id, f1, f1::text AS f1_text, length(f1) AS len FROM char_tbl ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM char_tbl WHERE f1 = 'c' ORDER BY id
    expect: rows
    order: ordered
    comment: "the value c followed by spaces is stored as c padded to 4 and equals 'c' under char semantics"
