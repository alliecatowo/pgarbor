# Assignment of a value longer than char(4) with non-space excess is an error (22001), and the
# failed statement leaves the table unchanged. Derived from char.sql "abcde" insert.
id: char.too-long-error
title: Inserting a too-long value into char(4) fails with string_data_right_truncation
family: char
tier: core
feature_ids: [char-type, insert, errors, length-constraint]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/char.sql; expected/char.out 'value too long for type character(4)'"
sessions: [a]
setup: |
  CREATE TABLE char_tbl (f1 char(4));
  INSERT INTO char_tbl (f1) VALUES ('a'), ('ab');
steps:
  - sql: |
      INSERT INTO char_tbl (f1) VALUES ('abcde')
    expect: error
    sqlstate: "22001"
  - sql: |
      SELECT f1 FROM char_tbl ORDER BY f1::text
    expect: rows
    order: ordered
    comment: table unchanged, two rows remain
