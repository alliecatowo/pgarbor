# An explicit cast to char(n) silently truncates excess characters, unlike assignment.
id: char.explicit-cast-truncates
title: Explicit cast to char(4) truncates instead of raising an error
family: char
tier: core
feature_ids: [char-type, casts, length-constraint]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 docs datatype-character.html (character(n) truncation rules)"
sessions: [a]
steps:
  - sql: |
      SELECT 'abcde'::char(4)::text AS t
    expect: rows
  - sql: |
      SELECT 'ab'::char(4)::text AS t, length('ab'::char(4)) AS n
    expect: rows
  - sql: |
      SELECT 'abcde'::char(4) = 'abcd'::char(4) AS eq
    expect: rows
