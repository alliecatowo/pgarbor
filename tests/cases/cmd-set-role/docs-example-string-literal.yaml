# Documented example: SET ROLE 'paul' switches CURRENT_USER while SESSION_USER stays the login user.
id: cmd-set-role.docs-example-string-literal
title: SET ROLE with a string literal changes current_user but leaves session_user unchanged
family: cmd-set-role
tier: core
feature_ids: [set-role, session-user, current-user, role-name-literal]
required_capabilities: [roles, set-role, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_role.sgml#examples (SET ROLE 'paul'; SESSION_USER vs CURRENT_USER)"
sessions: [a]
notes: Documented role name paul is renamed to sr_doc_paul to avoid cluster-wide collisions. Login-name comparisons are made as booleans so the output does not depend on the connecting user.
setup: |
  CREATE ROLE sr_doc_paul
steps:
  - sql: |
      SELECT session_user = current_user AS same_before
    expect: rows
    order: ordered
  - sql: |
      SET ROLE 'sr_doc_paul'
    expect: ok
  - sql: |
      SELECT current_user = 'sr_doc_paul' AS current_is_paul, session_user = current_user AS same_user
    expect: rows
    order: ordered
    comment: session_user is still the login user, current_user is now the named role
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP ROLE sr_doc_paul
    expect: ok
