# SET ROLE NONE and RESET ROLE both return current_user to session_user when no connection-time role is configured.
id: cmd-set-role.none-and-reset-restore-session-user
title: SET ROLE NONE and RESET ROLE restore current_user to session_user
family: cmd-set-role
tier: core
feature_ids: [set-role, set-role-none, reset-role, session-user]
required_capabilities: [roles, set-role, reset-role, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_role.sgml#description (SET ROLE NONE; RESET ROLE)"
sessions: [a]
setup: |
  CREATE ROLE sr_none_r
steps:
  - sql: |
      SET ROLE sr_none_r
    expect: ok
  - sql: |
      SELECT current_user = 'sr_none_r' AS is_role
    expect: rows
    order: ordered
  - sql: |
      SET ROLE NONE
    expect: ok
  - sql: |
      SELECT current_user = session_user AS none_restores
    expect: rows
    order: ordered
  - sql: |
      SET ROLE sr_none_r
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT current_user = session_user AS reset_restores
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE sr_none_r
    expect: ok
