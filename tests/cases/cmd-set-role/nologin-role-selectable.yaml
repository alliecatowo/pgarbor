# SET ROLE accepts a NOLOGIN role: the login attribute is irrelevant for becoming a current user.
id: cmd-set-role.nologin-role-selectable
title: SET ROLE to a NOLOGIN role succeeds and sets current_user to it
family: cmd-set-role
tier: extended
feature_ids: [set-role, role-attributes, nologin]
required_capabilities: [roles, set-role, catalog-introspection, select]
provenance:
  source: hand
  ref: "PG18 ref/set_role.sgml#description (current user identifier is set to role_name; no login requirement stated)"
sessions: [a]
setup: |
  CREATE ROLE sr_nol_r NOLOGIN
steps:
  - sql: |
      SET ROLE sr_nol_r
    expect: ok
  - sql: |
      SELECT current_user = 'sr_nol_r' AS is_nologin_role, session_user = current_user AS same_user
    expect: rows
    order: ordered
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP ROLE sr_nol_r
    expect: ok
