# SET LOCAL outside a transaction block only warns and has no lasting effect, so current_user is unchanged.
id: cmd-set-role.set-local-outside-transaction
title: SET LOCAL ROLE in autocommit mode emits a warning and does not change current_user
family: cmd-set-role
tier: extended
feature_ids: [set-role, set-local, transactions, warnings]
required_capabilities: [roles, set-role, transactions, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/set_role.sgml#description (SESSION and LOCAL modifiers act the same as SET)"
sessions: [a]
setup: |
  CREATE ROLE sr_sl_r
steps:
  - sql: |
      SET LOCAL ROLE sr_sl_r
    expect: any
    comment: WARNING 25P01 (SET LOCAL can only be used in transaction blocks); the statement itself is not an error
  - sql: |
      SELECT current_user = session_user AS unchanged
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE sr_sl_r
    expect: ok
