# OID boundaries: the maximum OID is accepted as a missing object; values above 2^32-1 are out of range; a negative literal wraps to the unsigned OID.
id: cmd-alter-large-object.oid-boundaries
title: ALTER LARGE OBJECT OID boundary values for missing objects and out-of-range input
family: cmd-alter-large-object
tier: extended
feature_ids: [alter-large-object, errors, oid-type, boundaries]
required_capabilities: [large-objects, roles, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_large_object.sgml#sql-alterlargeobject"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE cmd_alo_oid_role
    expect: ok
  - sql: |
      ALTER LARGE OBJECT 4294967295 OWNER TO cmd_alo_oid_role
    expect: error
    sqlstate: "42704"
    comment: 4294967295 is the largest oid and no large object has it
  - sql: |
      ALTER LARGE OBJECT 4294967296 OWNER TO cmd_alo_oid_role
    expect: error
    sqlstate: "22003"
    comment: outside the range of type oid
  - sql: |
      ALTER LARGE OBJECT -1 OWNER TO cmd_alo_oid_role
    expect: error
    sqlstate: "42704"
    comment: the oid input function wraps -1 to 4294967295, which does not exist
  - sql: |
      DROP ROLE cmd_alo_oid_role
    expect: ok
