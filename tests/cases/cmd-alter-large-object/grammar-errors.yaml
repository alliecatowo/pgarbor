# The only supported form is OWNER TO; other forms and a quoted OID are syntax errors (the OID must be a bare number).
id: cmd-alter-large-object.grammar-errors
title: ALTER LARGE OBJECT rejects forms outside OWNER TO with syntax_error
family: cmd-alter-large-object
tier: core
feature_ids: [alter-large-object, errors, syntax]
required_capabilities: [large-objects]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_large_object.sgml#sql-alterlargeobject"
sessions: [a]
steps:
  - sql: |
      ALTER LARGE OBJECT 930701
    expect: error
    sqlstate: "42601"
    comment: no action given
  - sql: |
      ALTER LARGE OBJECT 930701 OWNER postgres
    expect: error
    sqlstate: "42601"
    comment: OWNER without TO
  - sql: |
      ALTER LARGE OBJECT 930701 OWNER TO
    expect: error
    sqlstate: "42601"
    comment: OWNER TO with no role
  - sql: |
      ALTER LARGE OBJECT '930701' OWNER TO postgres
    expect: error
    sqlstate: "42601"
    comment: the OID must be a numeric literal, not a string
  - sql: |
      ALTER LARGE OBJECT 930701 RENAME TO other
    expect: error
    sqlstate: "42601"
    comment: RENAME is not an ALTER LARGE OBJECT action
