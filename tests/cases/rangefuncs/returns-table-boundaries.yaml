# RETURNS TABLE SQL function at boundary inputs: zero, negative, and NULL arguments to generate_series produce no rows.
id: rangefuncs.returns-table-boundaries
title: "RETURNS TABLE function with zero, negative and NULL inputs"
family: rangefuncs
tier: core
feature_ids: [returns-table, sql-functions, set-returning-functions, generate-series, null-handling]
required_capabilities: [create-function, sql-functions, set-returning-functions, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangefuncs.sql (table functions)"
setup: |
  CREATE FUNCTION rngfunc(int)
  RETURNS TABLE(a int, b int)
  AS $$ SELECT a, b
           FROM generate_series(1,$1) a(a),
                generate_series(1,$1) b(b) $$ LANGUAGE sql;
steps:
  - sql: |
      SELECT * FROM rngfunc(3) ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n, sum(a) AS total FROM rngfunc(0)
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM rngfunc(-1)
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) AS n FROM rngfunc(NULL::int)
    expect: rows
    order: ordered
    comment: "generate_series with a NULL bound returns no rows"
