# ROWS FROM with functions of unequal length pads the shorter one with NULL; empty function output yields no rows.
id: rangefuncs.rows-from-null-padding
title: "ROWS FROM pads shorter function output with NULL and ordinality counts the padded rows"
family: rangefuncs
tier: core
feature_ids: [rows-from, with-ordinality, set-returning-functions, generate-series]
required_capabilities: [set-returning-functions, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangefuncs.sql (multiple functions; selective rescan of multiple functions)"
steps:
  - sql: |
      SELECT * FROM ROWS FROM(generate_series(1,3), generate_series(10,11)) WITH ORDINALITY AS g(i,j,o) ORDER BY o
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n, count(j) AS non_null_j FROM ROWS FROM(generate_series(1,3), generate_series(10,11)) WITH ORDINALITY AS g(i,j,o)
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM generate_series(1,0) WITH ORDINALITY AS g(i,o)
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM ROWS FROM(generate_series(1,2), generate_series(5,4)) WITH ORDINALITY AS g(i,j,o) ORDER BY o
    expect: rows
    order: ordered
