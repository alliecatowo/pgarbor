# WITH ORDINALITY over a set-returning SQL function and over unnest(); ordinal counts function rows, not filtered rows.
id: rangefuncs.ordinality-setof-sql
title: "WITH ORDINALITY over a set-returning SQL function and over unnest()"
family: rangefuncs
tier: core
feature_ids: [with-ordinality, set-returning-functions, sql-functions, unnest]
required_capabilities: [create-table, insert, create-function, sql-functions, set-returning-functions, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangefuncs.sql (function with ORDINALITY; ordinality vs column names and types)"
setup: |
  CREATE TABLE rngfunc2(rngfuncid int, f2 int);
  INSERT INTO rngfunc2 VALUES (1, 11), (2, 22), (1, 111);
  CREATE FUNCTION rngfunct(int) RETURNS SETOF rngfunc2 AS 'SELECT * FROM rngfunc2 WHERE rngfuncid = $1 ORDER BY f2;' LANGUAGE sql;
steps:
  - sql: |
      SELECT * FROM rngfunct(1) WITH ORDINALITY AS z(a,b,ord) ORDER BY ord
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b, ord FROM rngfunct(1) WITH ORDINALITY AS z(a,b,ord) WHERE b > 100
    expect: rows
    order: ordered
    comment: "ordinal is 2, not 1: it numbers function rows before the outer filter"
  - sql: |
      SELECT a, ord FROM unnest(array['a','b']) WITH ORDINALITY AS z(a,ord) ORDER BY ord DESC
    expect: rows
    order: ordered
  - sql: |
      SELECT a, ord FROM unnest(array[1.0::float8]) WITH ORDINALITY AS z(a,ord)
    expect: rows
    order: multiset
