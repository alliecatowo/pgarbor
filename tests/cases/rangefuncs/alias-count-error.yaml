# Column alias lists on function calls: too many aliases for a scalar result is an error; fewer aliases are allowed.
id: rangefuncs.alias-count-error
title: "Column alias list longer than the function output is rejected; shorter lists are accepted"
family: rangefuncs
tier: extended
feature_ids: [column-aliases, set-returning-functions, unnest, with-ordinality, errors]
required_capabilities: [set-returning-functions, arrays, select, with-ordinality, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangefuncs.sql (column alias handling for scalar set-returning functions)"
steps:
  - sql: |
      SELECT * FROM unnest(array[1,2]) AS f(a,b,c)
    expect: error
    sqlstate: "42P10"
    comment: "table f has 1 column available but 3 columns specified"
  - sql: |
      SELECT * FROM unnest(array[1,2]) AS f(a) ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM generate_series(1,3) WITH ORDINALITY AS g(i) ORDER BY i
    expect: rows
    order: ordered
    comment: "a shorter alias list names only the leading columns"
