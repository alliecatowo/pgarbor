# Views over a join with WITH ORDINALITY and over ROWS FROM(...) WITH ORDINALITY; the view keeps the column list.
id: rangefuncs.ordinality-view-join
title: "Views defined over WITH ORDINALITY joins and ROWS FROM with ordinality"
family: rangefuncs
tier: extended
feature_ids: [with-ordinality, rows-from, create-view, set-returning-functions, joins]
required_capabilities: [create-table, insert, create-function, sql-functions, create-view, set-returning-functions, select, join]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangefuncs.sql (ordinality vs. views; multiple functions)"
setup: |
  CREATE TABLE rngfunc2(rngfuncid int, f2 int);
  INSERT INTO rngfunc2 VALUES (1, 11), (2, 22), (1, 111);
  CREATE FUNCTION rngfunct(int) RETURNS SETOF rngfunc2 AS 'SELECT * FROM rngfunc2 WHERE rngfuncid = $1 ORDER BY f2;' LANGUAGE sql;
steps:
  - sql: |
      CREATE VIEW vw_ord AS SELECT * FROM (VALUES (1)) v(n) JOIN rngfunct(1) WITH ORDINALITY AS z(a,b,ord) ON (n = ord)
    expect: ok
  - sql: |
      SELECT * FROM vw_ord ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      CREATE VIEW vw_rows AS SELECT * FROM ROWS FROM(rngfunct(1), rngfunct(2)) WITH ORDINALITY AS z(a,b,c,d,ord)
    expect: ok
  - sql: |
      SELECT * FROM vw_rows ORDER BY ord
    expect: rows
    order: ordered
  - sql: |
      DROP VIEW vw_ord; DROP VIEW vw_rows
    expect: ok
