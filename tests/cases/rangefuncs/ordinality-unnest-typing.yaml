# unnest() with several arrays of different lengths: NULL padding, column typing, ordinality column.
id: rangefuncs.ordinality-unnest-typing
title: "unnest() with several arrays pads shorter arrays with NULL, with and without ordinality"
family: rangefuncs
tier: core
feature_ids: [unnest, with-ordinality, set-returning-functions, rows-from, arrays]
required_capabilities: [arrays, set-returning-functions, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rangefuncs.sql (expansions of unnest())"
steps:
  - sql: |
      SELECT * FROM unnest(array[10,20],array['foo','bar'],array[1.0])
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM unnest(array[10,20],array['foo','bar'],array[1.0]) WITH ORDINALITY AS z(a,b,c,ord) ORDER BY ord
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM ROWS FROM(unnest(array[10,20],array['foo','bar']), generate_series(101,102)) WITH ORDINALITY AS z(a,b,c,ord) ORDER BY ord
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b, c IS NULL AS c_null FROM unnest(array[10,20],array['foo','bar'],array[1.0]) AS z(a,b,c) ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, ord FROM unnest(array[1.0::float8]) WITH ORDINALITY AS z(a,ord)
    expect: rows
    order: multiset
