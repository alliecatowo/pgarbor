# Locking a missing relation fails, and the failed block rejects further statements until ROLLBACK.
id: lock.missing-table-42p01
title: LOCK TABLE on a missing relation raises undefined_table and aborts the block
family: lock
tier: extended
feature_ids: [lock-table, transactions, errors]
required_capabilities: [lock-table, transactions, errors]
provenance:
  source: hand
  ref: "errcodes 42P01 undefined_table, 25P02 in_failed_sql_transaction"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      LOCK TABLE lock_no_such_tbl IN SHARE MODE
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT 1
    expect: rows
