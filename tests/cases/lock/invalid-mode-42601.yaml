# An unknown lock mode is a syntax error; the enclosing transaction block is then aborted.
id: lock.invalid-mode-42601
title: Unknown LOCK TABLE mode is a syntax error and aborts the transaction block
family: lock
tier: extended
feature_ids: [lock-table, transactions, errors]
required_capabilities: [create-table, lock-table, transactions, errors]
provenance:
  source: hand
  ref: "PG18 docs sql-lock.html (lockmode); errcodes 42601 syntax_error, 25P02"
sessions: [a]
setup: |
  CREATE TABLE lock_tbl1 (a BIGINT);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      LOCK TABLE lock_tbl1 IN NO SUCH MODE
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
