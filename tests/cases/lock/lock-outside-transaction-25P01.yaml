# LOCK TABLE outside a transaction block is rejected in autocommit mode.
id: lock.outside-transaction-25p01
title: LOCK TABLE outside a transaction block fails with no_active_sql_transaction
family: lock
tier: core
feature_ids: [lock-table, transactions, errors]
required_capabilities: [create-table, lock-table, transactions, errors]
provenance:
  source: pg-docs
  ref: "PG18 docs sql-lock.html (LOCK can only be used in transaction blocks); errcodes 25P01"
sessions: [a]
setup: |
  CREATE TABLE lock_tbl1 (a BIGINT);
steps:
  - sql: |
      LOCK TABLE lock_tbl1 IN ACCESS SHARE MODE
    expect: error
    sqlstate: "25P01"
  - sql: |
      SELECT count(*) FROM lock_tbl1
    expect: rows
