# LOCK ... NOWAIT with every mode succeeds when nothing conflicts.
id: lock.nowait-all-modes-uncontended
title: LOCK TABLE NOWAIT succeeds for every mode when there is no conflicting lock
family: lock
tier: core
feature_ids: [lock-table, lock-modes, nowait, transactions]
required_capabilities: [create-table, lock-table, transactions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/lock.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE lock_tbl1 (a BIGINT);
steps:
  - sql: |
      BEGIN TRANSACTION;
      LOCK TABLE lock_tbl1 IN ACCESS SHARE MODE NOWAIT;
      LOCK TABLE lock_tbl1 IN ROW SHARE MODE NOWAIT;
      LOCK TABLE lock_tbl1 IN ROW EXCLUSIVE MODE NOWAIT;
      LOCK TABLE lock_tbl1 IN SHARE UPDATE EXCLUSIVE MODE NOWAIT;
      LOCK TABLE lock_tbl1 IN SHARE MODE NOWAIT;
      LOCK TABLE lock_tbl1 IN SHARE ROW EXCLUSIVE MODE NOWAIT;
      LOCK TABLE lock_tbl1 IN EXCLUSIVE MODE NOWAIT;
      LOCK TABLE lock_tbl1 IN ACCESS EXCLUSIVE MODE NOWAIT;
      ROLLBACK
    expect: ok
