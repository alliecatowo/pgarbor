# Every LOCK TABLE mode accepted inside a transaction block (regress lock.sql, first block).
id: lock.modes-in-transaction
title: LOCK TABLE accepts all eight table-level lock modes inside a transaction
family: lock
tier: core
feature_ids: [lock-table, lock-modes, transactions]
required_capabilities: [create-table, lock-table, transactions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/lock.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE lock_tbl1 (a BIGINT);
steps:
  - sql: |
      BEGIN TRANSACTION;
      LOCK TABLE lock_tbl1 IN ACCESS SHARE MODE;
      LOCK lock_tbl1 IN ROW SHARE MODE;
      LOCK TABLE lock_tbl1 IN ROW EXCLUSIVE MODE;
      LOCK TABLE lock_tbl1 IN SHARE UPDATE EXCLUSIVE MODE;
      LOCK TABLE lock_tbl1 IN SHARE MODE;
      LOCK lock_tbl1 IN SHARE ROW EXCLUSIVE MODE;
      LOCK TABLE lock_tbl1 IN EXCLUSIVE MODE;
      LOCK TABLE lock_tbl1 IN ACCESS EXCLUSIVE MODE;
      ROLLBACK
    expect: ok
    comment: all eight modes succeed when uncontended; the table stays empty
  - sql: |
      SELECT count(*) FROM lock_tbl1
    expect: rows
