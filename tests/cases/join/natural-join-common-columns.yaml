# NATURAL JOIN equates all identically named columns, lists the shared column once, and degenerates to a cross join with no shared names.
id: join.natural-join-common-columns
title: NATURAL JOIN joins on all shared column names and becomes a cross join when none exist
family: join
tier: core
feature_ids: [joins, natural-join, inner-join, cross-join]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/join.sql (NATURAL JOIN section)"
sessions: [a]
setup: |
  CREATE TABLE n1 (a integer, b integer);
  CREATE TABLE n2 (b integer, c integer);
  CREATE TABLE n3 (x integer);
  INSERT INTO n1 VALUES (1, 10), (2, 20), (3, NULL);
  INSERT INTO n2 VALUES (10, 100), (20, 200), (NULL, 300), (20, 201);
  INSERT INTO n3 VALUES (7), (8);
steps:
  - sql: |
      SELECT * FROM n1 NATURAL JOIN n2 ORDER BY a, c
    expect: rows
    order: ordered
    comment: join on b only; b is output once, first
  - sql: |
      SELECT count(*) FROM n1 NATURAL JOIN n2 WHERE b IS NULL
    expect: rows
    order: multiset
    comment: NULL = NULL is not a match, so zero rows
  - sql: |
      SELECT count(*) FROM n3 NATURAL JOIN n1
    expect: rows
    order: multiset
    comment: no shared column names, so the result is the full cross product 2 x 3
