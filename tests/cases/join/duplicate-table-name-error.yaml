# The same relation name twice in one FROM clause needs distinct aliases.
id: join.duplicate-table-name-error
title: Joining a table to itself without aliases raises 42712 and aliases make it valid
family: join
tier: core
feature_ids: [joins, self-join, table-aliases, errors]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/join.sql (table name specified more than once)"
sessions: [a]
setup: |
  CREATE TABLE j1 (i integer, j integer, t text);
  INSERT INTO j1 VALUES (1, 4, 'one'), (2, 3, 'two'), (3, 2, 'three'), (NULL, NULL, 'null');
steps:
  - sql: |
      SELECT * FROM j1 JOIN j1 USING (i)
    expect: error
    sqlstate: "42712"
    comment: table name "j1" specified more than once
  - sql: |
      SELECT count(*) FROM j1 a JOIN j1 b USING (i)
    expect: rows
    order: multiset
    comment: distinct aliases make the self join valid; NULL key row does not match
