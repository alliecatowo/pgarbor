# Degenerate FULL JOIN conditions: ON TRUE is a cross product, ON FALSE null-extends every row on both sides.
id: join.full-join-on-true-false
title: FULL JOIN ON TRUE yields the cross product and ON FALSE null-extends every row
family: join
tier: extended
feature_ids: [joins, full-join, outer-join, cross-join, null-semantics]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/join.sql (FULL JOIN ON TRUE / ON FALSE corner cases)"
sessions: [a]
setup: |
  CREATE TABLE j1 (i integer, t text);
  CREATE TABLE j2 (i integer, k integer);
  INSERT INTO j1 VALUES (1, 'one'), (2, 'two'), (NULL, 'null');
  INSERT INTO j2 VALUES (1, -1), (2, 2), (NULL, NULL);
steps:
  - sql: |
      SELECT count(*) FROM j1 FULL JOIN j2 ON true
    expect: rows
    order: multiset
    comment: 3 x 3 = 9
  - sql: |
      SELECT count(*), count(j1.t), count(j2.k) FROM j1 FULL JOIN j2 ON false
    expect: rows
    order: multiset
    comment: 3 + 3 = 6 rows, each side null-extended in half of them
