# RIGHT JOIN USING: an unmatched right row supplies the merged column value.
id: join.right-join-using-merged-column
title: RIGHT JOIN USING takes the merged join column from the right side for unmatched rows
family: join
tier: core
feature_ids: [joins, outer-join, right-join, using-clause]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/join.sql (RIGHT JOIN USING)"
sessions: [a]
setup: |
  CREATE TABLE j1 (i integer, j integer, t text);
  CREATE TABLE j2 (i integer, k integer);
  INSERT INTO j1 VALUES (1, 4, 'one'), (2, 3, 'two'), (3, 2, 'three'), (NULL, NULL, 'null');
  INSERT INTO j2 VALUES (1, -1), (2, 2), (2, 4), (5, -5), (NULL, NULL);
steps:
  - sql: |
      SELECT * FROM j1 RIGHT JOIN j2 USING (i)
      ORDER BY i NULLS LAST, k NULLS LAST
    expect: rows
    order: ordered
    comment: the i=5 row has i taken from j2 and j, t NULL
  - sql: |
      SELECT count(*) FROM j1 RIGHT JOIN j2 USING (i) WHERE j1.t IS NULL
    expect: rows
    order: multiset
    comment: unmatched right rows are the i=5 row and the NULL-key row
