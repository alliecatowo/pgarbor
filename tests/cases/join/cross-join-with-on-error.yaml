# CROSS JOIN takes no join condition; qualifications belong in WHERE.
id: join.cross-join-with-on-error
title: CROSS JOIN with an ON clause is a syntax error while WHERE filtering is accepted
family: join
tier: core
feature_ids: [joins, cross-join, errors, where-clause, syntax]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/join.sql (CROSS JOIN: qualifications are not allowed)"
sessions: [a]
setup: |
  CREATE TABLE j1 (i integer, t text);
  CREATE TABLE j2 (i integer, k integer);
  INSERT INTO j1 VALUES (1, 'one'), (2, 'two'), (3, 'three');
  INSERT INTO j2 VALUES (1, -1), (2, 2), (2, 4);
steps:
  - sql: |
      SELECT * FROM j1 CROSS JOIN j2 ON j1.i = j2.i
    expect: error
    sqlstate: "42601"
    comment: syntax error at or near ON
  - sql: |
      SELECT count(*) FROM j1 CROSS JOIN j2 WHERE j1.i = j2.i
    expect: rows
    order: multiset
    comment: the same condition in WHERE is valid and gives 3 matches
