# JOIN USING: the join column appears once in SELECT * and both qualified forms stay valid.
id: join.inner-using-merged-columns
title: INNER JOIN USING merges the join column into one output column
family: join
tier: core
feature_ids: [joins, inner-join, using-clause, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/join.sql (INNER JOIN USING section)"
sessions: [a]
setup: |
  CREATE TABLE j1 (i integer, j integer, t text);
  CREATE TABLE j2 (i integer, k integer);
  INSERT INTO j1 VALUES (1, 4, 'one'), (2, 3, 'two'), (3, 2, 'three'), (NULL, NULL, 'null');
  INSERT INTO j2 VALUES (1, -1), (2, 2), (2, 4), (5, -5), (NULL, NULL);
steps:
  - sql: |
      SELECT * FROM j1 INNER JOIN j2 USING (i) ORDER BY i, k
    expect: rows
    order: ordered
    comment: i appears once, placed first; j and t follow, then k
  - sql: |
      SELECT j1.i, j2.i, t, k FROM j1 JOIN j2 USING (i) ORDER BY k
    expect: rows
    order: ordered
    comment: qualified references to a USING column are valid on both sides
  - sql: |
      SELECT count(*) FROM j1 JOIN j2 USING (i) WHERE i IS NULL
    expect: rows
    order: multiset
    comment: NULL join keys never match
