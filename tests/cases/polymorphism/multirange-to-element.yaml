# anymultirange input with anyelement result: lower() of a multirange, including empty and NULL inputs.
id: polymorphism.multirange-to-element
title: anymultirange input returns the subtype via lower(); empty multirange gives NULL
family: polymorphism
tier: core
feature_ids: [polymorphic-types, multiranges, sql-functions]
required_capabilities: [create-function, select, multiranges]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION mr_lower(anymultirange) RETURNS anyelement
  AS 'SELECT lower($1);' LANGUAGE sql;
steps:
  - sql: |
      SELECT mr_lower(int4multirange(int4range(1,10), int4range(20,30))) AS result
    expect: rows
  - sql: |
      SELECT pg_typeof(mr_lower(int4multirange(int4range(1,10)))) AS result_type
    expect: rows
  - sql: |
      SELECT mr_lower(int4multirange()) AS empty_result
    expect: rows
    comment: lower() of an empty multirange is NULL
  - sql: |
      SELECT mr_lower(NULL::int4multirange) AS null_result
    expect: rows
