# anyarray input, anyelement return: the result type is the array element type.
id: polymorphism.anyarray-to-anyelement
title: anyarray input with anyelement return yields the element type; NULL and empty arrays give NULL
family: polymorphism
tier: core
feature_ids: [polymorphic-types, sql-functions, arrays]
required_capabilities: [create-function, select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION polyf(x anyarray) RETURNS anyelement AS $$
    SELECT x[1]
  $$ LANGUAGE sql;
steps:
  - sql: |
      SELECT polyf(array[2,4]) AS int_result, polyf(array[4.5, 7.7]) AS num_result
    expect: rows
  - sql: |
      SELECT pg_typeof(polyf(array[2,4])) AS elem_type
    expect: rows
  - sql: |
      SELECT polyf(NULL::int[]) AS null_array
    expect: rows
  - sql: |
      SELECT polyf(array[]::int[]) AS empty_array
    expect: rows
    comment: subscript past the end of an empty array yields NULL, not an error
