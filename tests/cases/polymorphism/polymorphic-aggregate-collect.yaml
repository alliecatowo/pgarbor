# User aggregate with anyelement base type and anyarray state: collects values into an array.
id: polymorphism.polymorphic-aggregate-collect
title: Polymorphic aggregate with anyarray state collects grouped values; empty input returns INITCOND
family: polymorphism
tier: core
feature_ids: [polymorphic-types, aggregates, group-by, arrays]
required_capabilities: [create-function, create-aggregate, select, insert, create-table, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE TABLE t (f1 int, f3 text);
  INSERT INTO t VALUES (1,'a'), (1,'b'), (2,'a'), (2,'b'), (3,'a');
  CREATE AGGREGATE my_collect(anyelement) (SFUNC = array_append, STYPE = anyarray, INITCOND = '{}');
steps:
  - sql: |
      SELECT f3, my_collect(f1 ORDER BY f1) AS collected FROM t GROUP BY f3 ORDER BY f3
    expect: rows
    order: ordered
  - sql: |
      SELECT my_collect(f1) AS none FROM t WHERE false
    expect: rows
    comment: aggregate over zero rows returns INITCOND
  - sql: |
      SELECT my_collect(x ORDER BY x NULLS LAST) AS with_nulls FROM (VALUES (1), (NULL), (2)) AS v(x)
    expect: rows
    comment: array_append is not strict, so NULL inputs are kept as elements
