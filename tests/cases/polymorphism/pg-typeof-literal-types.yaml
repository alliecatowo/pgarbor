# pg_typeof reports the resolved type of literals, NULL, and expressions, including unknown.
id: polymorphism.pg-typeof-literal-types
title: pg_typeof reports unknown for bare NULL and untyped string literals and concrete types otherwise
family: polymorphism
tier: core
feature_ids: [polymorphic-types, type-resolution, catalog-introspection]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
steps:
  - sql: |
      SELECT pg_typeof(NULL) AS t_null, pg_typeof(0) AS t_int, pg_typeof(0.0) AS t_numeric,
             pg_typeof(1+1 = 2) AS t_bool, pg_typeof('x') AS t_literal, pg_typeof('' || '') AS t_concat,
             pg_typeof(array[1.2,55.5]) AS t_numeric_arr
    expect: rows
    comment: bare NULL and unquoted-typed literal 'x' stay unknown in a function argument
  - sql: |
      SELECT pg_typeof(pg_typeof(0)) AS t_regtype
    expect: rows
    comment: pg_typeof returns regtype
