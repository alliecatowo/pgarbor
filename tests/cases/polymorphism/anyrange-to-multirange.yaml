# anyrange argument with anymultirange result: multirange() wraps a single range.
id: polymorphism.anyrange-to-multirange
title: anyrange input returns the matching anymultirange type; NULL input yields NULL
family: polymorphism
tier: core
feature_ids: [polymorphic-types, ranges, multiranges, sql-functions]
required_capabilities: [create-function, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION range_to_mr(anyrange) RETURNS anymultirange
  AS 'SELECT multirange($1);' LANGUAGE sql;
steps:
  - sql: |
      SELECT range_to_mr(int4range(1,10)) AS result
    expect: rows
  - sql: |
      SELECT pg_typeof(range_to_mr(int4range(1,10))) AS result_type
    expect: rows
  - sql: |
      SELECT range_to_mr(NULL::int4range) AS null_result
    expect: rows
    comment: range_to_mr is not declared STRICT; NULL result is recorded from the oracle, not assumed
