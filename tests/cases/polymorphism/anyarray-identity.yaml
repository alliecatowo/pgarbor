# anyarray -> anyarray identity function across element types, including empty and NULL arrays.
id: polymorphism.anyarray-identity
title: anyarray to anyarray identity preserves the array and its concrete element type
family: polymorphism
tier: core
feature_ids: [polymorphic-types, sql-functions, arrays]
required_capabilities: [create-function, select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION polyf(x anyarray) RETURNS anyarray AS $$
    SELECT x
  $$ LANGUAGE sql;
steps:
  - sql: |
      SELECT polyf(array[2,4]) AS int_result, polyf(array[4.5, 7.7]) AS num_result
    expect: rows
  - sql: |
      SELECT polyf(array['a','b']) AS text_result, pg_typeof(polyf(array['a','b'])) AS result_type
    expect: rows
  - sql: |
      SELECT polyf('{}'::int[]) AS empty_result
    expect: rows
  - sql: |
      SELECT polyf(NULL::text[]) IS NULL AS null_result
    expect: rows
