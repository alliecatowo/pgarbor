# Two overloads whose parameters all have defaults make a zero-argument call ambiguous.
id: polymorphism.ambiguous-overload-defaults
title: Zero-argument call to two defaulted overloads fails with 42725; typed calls resolve
family: polymorphism
tier: core
feature_ids: [function-overloading, default-arguments, errors]
required_capabilities: [create-function, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION dfunc(a int DEFAULT 1) RETURNS text AS $$ SELECT 'int:' || $1 $$ LANGUAGE sql;
  CREATE FUNCTION dfunc(a text DEFAULT 'x') RETURNS text AS $$ SELECT 'text:' || $1 $$ LANGUAGE sql;
steps:
  - sql: |
      SELECT dfunc(0) AS int_call
    expect: rows
  - sql: |
      SELECT dfunc('Hi') AS text_call
    expect: rows
  - sql: |
      SELECT dfunc() AS ambiguous
    expect: error
    sqlstate: "42725"
    comment: int and text defaults both match; no preferred candidate
