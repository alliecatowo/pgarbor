# CREATE FUNCTION must reject polymorphic return types with no polymorphic input to bind them.
id: polymorphism.unresolvable-result-type
title: CREATE FUNCTION rejects anyelement or anyarray return types without a polymorphic argument
family: polymorphism
tier: core
feature_ids: [polymorphic-types, create-function, errors]
required_capabilities: [create-function, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
steps:
  - sql: |
      CREATE FUNCTION bad_elem(x int) RETURNS anyelement AS $$
        SELECT x + 1
      $$ LANGUAGE sql
    expect: error
    sqlstate: "42P13"
    comment: no anyelement/anyarray/anyrange input to resolve the result type
  - sql: |
      CREATE FUNCTION bad_arr(x int) RETURNS anyarray AS $$
        SELECT array[x]
      $$ LANGUAGE sql
    expect: error
    sqlstate: "42P13"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    comment: a failed CREATE FUNCTION in autocommit leaves the session usable
