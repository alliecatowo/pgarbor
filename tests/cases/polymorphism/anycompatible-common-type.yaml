# anycompatible arguments are coerced to a common supertype, which also types the array result.
id: polymorphism.anycompatible-common-type
title: anycompatible arguments unify to a common type for anycompatiblearray results
family: polymorphism
tier: core
feature_ids: [polymorphic-types, anycompatible, arrays]
required_capabilities: [create-function, select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION polyf(x anycompatible, y anycompatible) RETURNS anycompatiblearray AS $$
    SELECT array[x, y]
  $$ LANGUAGE sql;
steps:
  - sql: |
      SELECT polyf(2, 4) AS int_result, polyf(2, 4.5) AS num_result
    expect: rows
  - sql: |
      SELECT pg_typeof(polyf(2, 4.5)) AS result_type
    expect: rows
    comment: integer and numeric unify to numeric
  - sql: |
      SELECT polyf(2, NULL::int) AS with_null
    expect: rows
