# Multiple anyelement arguments must all have the same concrete type.
id: polymorphism.anyelement-mixed-types-error
title: Mixing integer and numeric arguments for one anyelement parameter finds no matching function (42883)
family: polymorphism
tier: core
feature_ids: [polymorphic-types, sql-functions, errors]
required_capabilities: [create-function, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION sum3(anyelement, anyelement, anyelement) RETURNS anyelement AS $$
    SELECT $1 + $2 + $3
  $$ LANGUAGE sql STRICT;
steps:
  - sql: |
      SELECT sum3(1, 2, 3) AS ok_sum
    expect: rows
  - sql: |
      SELECT sum3(1, 2.5, 3) AS mixed
    expect: error
    sqlstate: "42883"
    comment: all anyelement arguments must resolve to one type; integer and numeric do not, so no candidate function matches
  - sql: |
      SELECT sum3(1, NULL, 3) AS null_sum
    expect: rows
    comment: STRICT returns NULL when any argument is NULL
