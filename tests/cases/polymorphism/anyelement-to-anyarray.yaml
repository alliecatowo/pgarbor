# anyelement input, anyarray return type: the array element type follows the input type.
id: polymorphism.anyelement-to-anyarray
title: anyelement input with anyarray return builds arrays of the input's concrete type
family: polymorphism
tier: core
feature_ids: [polymorphic-types, sql-functions, arrays]
required_capabilities: [create-function, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/polymorphism.sql"
setup: |
  CREATE FUNCTION polyf(x anyelement) RETURNS anyarray AS $$
    SELECT array[x + 1, x + 2]
  $$ LANGUAGE sql;
steps:
  - sql: |
      SELECT polyf(42) AS int_result, polyf(4.5) AS num_result
    expect: rows
  - sql: |
      SELECT pg_typeof(polyf(42)) AS int_type, pg_typeof(polyf(4.5)) AS num_type
    expect: rows
  - sql: |
      SELECT polyf(NULL::numeric) AS null_elems
    expect: rows
    comment: NULL + 1 and NULL + 2 become a two-element array of NULLs
