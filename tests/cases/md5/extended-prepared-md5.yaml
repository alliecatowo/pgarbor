# Extended protocol: md5 over bind parameters, including a NULL parameter.
id: md5.extended-prepared-md5
title: Prepared md5 over text bind parameters, including a NULL bind
family: md5
tier: extended
feature_ids: [md5, extended-protocol, prepared-statements, nulls]
required_capabilities: [select, md5, extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
steps:
  - parse:
      name: chk
      sql: |
        SELECT md5($1) = $2 AS same, md5($1) IS NULL AS is_null
      param_types: [25, 25]
    expect: ok
  - execute:
      statement: chk
      params: ["abc", "900150983cd24fb0d6963f7d28e17f72"]
    expect: rows
    order: ordered
  - execute:
      statement: chk
      params: [null, null]
    expect: rows
    order: ordered
  - close:
      statement: chk
