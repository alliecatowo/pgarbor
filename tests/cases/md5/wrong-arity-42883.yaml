title: md5 called with two arguments fails with undefined_function
family: md5
tier: extended
feature_ids: [md5, errors]
required_capabilities: [select, md5, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42883 (undefined_function); PG18 functions-string.html (md5)"
sessions: [a]
steps:
  - sql: |
      SELECT md5('a', 'b')
