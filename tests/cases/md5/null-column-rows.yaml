# md5 applied per row to a nullable column: NULL rows stay NULL, empty and non-empty rows hash differently.
id: md5.null-column-rows
title: md5 over a nullable text column yields NULL for NULL rows and a digest for every other row
family: md5
tier: core
feature_ids: [md5, nulls, create-table, insert, select, text-functions]
required_capabilities: [create-table, insert, select, md5]
provenance:
  source: hand
  ref: "PG18 functions-string.html (md5); PG18 sql-createtable.html"
sessions: [a]
setup: |
  CREATE TABLE m (id int4 PRIMARY KEY, v text);
  INSERT INTO m VALUES (1, 'abc'), (2, ''), (3, NULL), (4, 'a');
steps:
  - sql: |
      SELECT id, md5(v) IS NULL AS digest_null, md5(v) = md5('abc') AS is_abc
      FROM m ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(md5(v)) AS non_null_digests, count(*) AS total_rows FROM m
    expect: rows
    order: ordered
