# No implicit integer-to-text conversion for md5 argument resolution: undefined_function.
id: md5.wrong-type-42883
title: md5 of an integer without a cast fails with undefined_function
family: md5
tier: core
feature_ids: [md5, errors, text-functions]
required_capabilities: [select, md5, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42883 (undefined_function); PG18 functions-string.html (md5)"
sessions: [a]
steps:
  - sql: |
      SELECT md5(1)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT md5(1::text) = md5('1') AS explicit_cast_ok
    expect: rows
    order: ordered
