# md5(bytea) and md5(text) must agree when the bytes are the same; hex-decoded bytes equal the text.
id: md5.bytea-matches-text
title: md5 over bytea inputs equals md5 over the same text bytes
family: md5
tier: core
feature_ids: [md5, bytea, text-functions]
required_capabilities: [select, md5, bytea]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/md5.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT md5(''::bytea) = md5('') AS empty_eq,
             md5('abc'::bytea) = md5('abc') AS abc_eq,
             md5(decode('616263', 'hex')) = md5('abc') AS hex_decoded_eq,
             md5('message digest'::bytea) = 'f96b697d7cb7938d525a2f31aaf161d0' AS rfc_eq
    expect: rows
    order: ordered
