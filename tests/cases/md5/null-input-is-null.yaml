# md5 is strict: NULL input yields NULL, while the empty string still yields a digest.
id: md5.null-input-is-null
title: md5 of NULL is NULL for text and bytea, md5 of empty text is not NULL
family: md5
tier: core
feature_ids: [md5, nulls, text-functions]
required_capabilities: [select, md5, bytea]
provenance:
  source: hand
  ref: "PG18 functions-string.html (md5); PG18 functions-binarystring.html; pg-regress md5.sql"
sessions: [a]
steps:
  - sql: |
      SELECT md5(NULL::text) IS NULL AS text_null,
             md5(NULL::bytea) IS NULL AS bytea_null,
             md5('') IS NULL AS empty_is_null,
             md5('') IS NOT NULL AS empty_not_null
    expect: rows
    order: ordered
