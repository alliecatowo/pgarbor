# Grouping by digest: equal inputs collapse to one digest, distinct inputs do not.
id: md5.distinct-digest-count
title: count of distinct md5 digests equals count of distinct inputs over duplicated values
family: md5
tier: core
feature_ids: [md5, aggregates, select, group-by]
required_capabilities: [create-table, insert, select, md5, aggregates]
provenance:
  source: hand
  ref: "PG18 functions-aggregate.html (count); functions-string.html (md5)"
sessions: [a]
setup: |
  CREATE TABLE w (v text);
  INSERT INTO w VALUES ('abc'), ('abc'), ('a'), ('a'), ('a'), ('message digest');
steps:
  - sql: |
      SELECT count(DISTINCT v) AS distinct_inputs, count(DISTINCT md5(v)) AS distinct_digests FROM w
    expect: rows
    order: ordered
  - sql: |
      SELECT md5(v) = md5('abc') AS is_abc, count(*) AS n FROM w GROUP BY 1 ORDER BY 1
    expect: rows
    order: ordered
