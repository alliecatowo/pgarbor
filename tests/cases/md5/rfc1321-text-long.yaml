# RFC 1321 test suite, longer text inputs (multi-block messages).
id: md5.rfc1321-text-long
title: md5 of the RFC 1321 alphabet, digit and 80-character inputs matches the reference digests
family: md5
tier: core
feature_ids: [md5, text-functions, select]
required_capabilities: [select, md5]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/md5.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT md5('message digest') = 'f96b697d7cb7938d525a2f31aaf161d0' AS msg_ok,
             md5('abcdefghijklmnopqrstuvwxyz') = 'c3fcd3d76192e4007dfb496cca67e13b' AS alpha_ok,
             md5('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789') = 'd174ab98d277d9f5a5611c2c9f419d9f' AS alnum_ok,
             md5('12345678901234567890123456789012345678901234567890123456789012345678901234567890') = '57edf4a22be3c955ac49da2e2107b67a' AS digits_ok
    expect: rows
    order: ordered
