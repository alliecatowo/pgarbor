# Use md5 as a predicate: rows whose body hashes to md5 of a concatenation are selected.
id: md5.concat-filter
title: WHERE clause filters rows by md5 of a column against md5 of a concatenation
family: md5
tier: core
feature_ids: [md5, select, where, text-functions]
required_capabilities: [create-table, insert, select, md5]
provenance:
  source: hand
  ref: "PG18 functions-string.html (md5, ||)"
sessions: [a]
setup: |
  CREATE TABLE docs (id int4 PRIMARY KEY, body text);
  INSERT INTO docs VALUES (1, 'x'), (2, 'ab'), (3, 'abc'), (4, '');
steps:
  - sql: |
      SELECT id FROM docs WHERE md5(body) = md5('a' || 'bc') ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM docs WHERE md5(body) = md5('') ORDER BY id
    expect: rows
    order: ordered
