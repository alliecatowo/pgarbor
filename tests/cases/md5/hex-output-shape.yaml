# md5 returns text: 32 lowercase hexadecimal characters.
id: md5.hex-output-shape
title: md5 returns a 32-character lowercase hex text value
family: md5
tier: core
feature_ids: [md5, text-functions, expressions]
required_capabilities: [select, md5]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/md5.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT length(md5('abc')) AS len,
             pg_typeof(md5('abc'))::text AS typ,
             md5('abc') ~ '^[0-9a-f]{32}$' AS lower_hex,
             md5('abc') = lower(md5('abc')) AS is_lower
    expect: rows
    order: ordered
