# RFC 1321 test suite, text inputs: empty, one byte, and "abc". Self-checking comparisons.
id: md5.rfc1321-text-short
title: md5 of empty, one-byte and three-byte text matches the RFC 1321 vectors
family: md5
tier: slice
feature_ids: [md5, text-functions, select]
required_capabilities: [select, md5]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/md5.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT md5('') = 'd41d8cd98f00b204e9800998ecf8427e' AS empty_ok,
             md5('a') = '0cc175b9c0f1b6a831c399e269772661' AS one_ok,
             md5('abc') = '900150983cd24fb0d6963f7d28e17f72' AS abc_ok
    expect: rows
    order: ordered
    comment: all three comparisons must be true
