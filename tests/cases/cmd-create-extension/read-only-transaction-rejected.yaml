# CREATE EXTENSION writes the catalog and is rejected in a read-only transaction.
id: cmd-create-extension.read-only-transaction-rejected
title: CREATE EXTENSION in a read-only transaction fails with read_only_sql_transaction
family: cmd-create-extension
tier: core
feature_ids: [create-extension, transactions, read-only, errors]
required_capabilities: [create-extension, transactions, select]
provenance:
  source: hand
  ref: "PostgreSQL CREATE EXTENSION is not allowed in read-only transactions"
sessions: [a]
steps:
  - sql: |
      BEGIN READ ONLY
    expect: ok
  - sql: |
      CREATE EXTENSION isn
    expect: error
    sqlstate: "25006"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_extension WHERE extname = 'isn'
    expect: rows
    order: ordered
