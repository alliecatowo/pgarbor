# Other options are not applied to automatically installed extensions: the VERSION given for earthdistance applies to it, while cube gets its default version.
id: cmd-create-extension.cascade-ignores-version-option
title: CASCADE installs dependencies at their default version, not the requested VERSION
family: cmd-create-extension
tier: core
feature_ids: [create-extension, cascade, version-clause, dependencies]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: CASCADE)"
sessions: [a]
steps:
  - sql: |
      CREATE EXTENSION earthdistance VERSION '1.1' CASCADE
    expect: ok
  - sql: |
      SELECT extname, extversion FROM pg_extension WHERE extname IN ('cube', 'earthdistance') ORDER BY extname
    expect: rows
    order: ordered
    comment: earthdistance 1.1, cube at default 1.5
