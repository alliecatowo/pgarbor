# Documented alternative: SET search_path = addons; CREATE EXTENSION hstore; installs into the first existing schema of the search_path.
id: cmd-create-extension.doc-example-search-path
title: Documented search_path example installs extension into the default creation schema
family: cmd-create-extension
tier: core
feature_ids: [create-extension, search-path, default-schema]
required_capabilities: [create-extension, create-schema, select, guc]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Examples: SET search_path = addons; CREATE EXTENSION hstore)"
sessions: [a]
setup: |
  CREATE SCHEMA addons;
steps:
  - sql: |
      SET search_path = addons
    expect: ok
  - sql: |
      CREATE EXTENSION hstore
    expect: ok
  - sql: |
      SELECT e.extname, n.nspname AS ext_schema FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'hstore'
    expect: rows
    order: ordered
    comment: no SCHEMA clause given so the search_path creation schema is used
