# CREATE EXTENSION records the creating user as owner and records its objects, so DROP EXTENSION removes them.
id: cmd-create-extension.owner-and-drop-removes-members
title: Creating user owns the extension and DROP EXTENSION removes its member objects
family: cmd-create-extension
tier: core
feature_ids: [create-extension, drop-extension, extension-owner, dependencies]
required_capabilities: [create-extension, drop-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Description: owner and recorded object identities)"
sessions: [a]
steps:
  - sql: |
      CREATE EXTENSION citext
    expect: ok
  - sql: |
      SELECT extowner = current_user::regrole AS owned_by_me, to_regtype('citext') IS NOT NULL AS type_present FROM pg_extension WHERE extname = 'citext'
    expect: rows
    order: ordered
  - sql: |
      DROP EXTENSION citext
    expect: ok
  - sql: |
      SELECT to_regtype('citext') IS NULL AS type_gone, (SELECT count(*) FROM pg_extension WHERE extname = 'citext') AS n
    expect: rows
    order: ordered
