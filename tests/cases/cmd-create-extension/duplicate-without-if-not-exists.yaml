# Creating an extension that is already loaded fails with duplicate_object; the existing installation is untouched.
id: cmd-create-extension.duplicate-without-if-not-exists
title: CREATE EXTENSION of an already loaded extension fails with duplicate_object
family: cmd-create-extension
tier: core
feature_ids: [create-extension, duplicate-extension, errors]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Description: There must not be an extension of the same name already loaded)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
steps:
  - sql: |
      CREATE EXTENSION hstore
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE EXTENSION plpgsql
    expect: error
    sqlstate: "42710"
    comment: plpgsql is preinstalled in a fresh database
  - sql: |
      SELECT extname, extversion FROM pg_extension ORDER BY extname
    expect: rows
    order: ordered
