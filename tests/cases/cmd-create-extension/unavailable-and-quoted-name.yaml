# An unknown extension name is not available (no control file). Quoting preserves case, so "HSTORE" looks for HSTORE.control and fails, while unquoted HSTORE folds to hstore.
id: cmd-create-extension.unavailable-and-quoted-name
title: Unknown extension name is not available and quoted names keep their case
family: cmd-create-extension
tier: core
feature_ids: [create-extension, control-file, name-folding, errors]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: extension_name)"
sessions: [a]
steps:
  - sql: |
      CREATE EXTENSION no_such_ext
    expect: error
    sqlstate: "0A000"
    comment: no no_such_ext.control in the extension control path
  - sql: |
      CREATE EXTENSION "HSTORE"
    expect: error
    sqlstate: "0A000"
    comment: quoted identifier is case sensitive so HSTORE.control is not found
  - sql: |
      CREATE EXTENSION HSTORE
    expect: ok
    comment: unquoted identifier folds to hstore
  - sql: |
      SELECT extname FROM pg_extension ORDER BY extname
    expect: rows
    order: ordered
