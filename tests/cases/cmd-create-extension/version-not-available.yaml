# A VERSION with no installation script or update path fails with invalid_parameter_value and records nothing.
id: cmd-create-extension.version-not-available
title: Unknown VERSION for a known extension fails and leaves no extension behind
family: cmd-create-extension
tier: core
feature_ids: [create-extension, version-clause, errors]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: version)"
sessions: [a]
steps:
  - sql: |
      CREATE EXTENSION citext VERSION '9.9'
    expect: error
    sqlstate: "22023"
    comment: no installation script nor update path for version 9.9
  - sql: |
      SELECT count(*) AS n FROM pg_extension WHERE extname = 'citext'
    expect: rows
    order: ordered
