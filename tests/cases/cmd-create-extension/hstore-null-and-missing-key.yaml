# Functions of an installed extension: looking up a key whose stored value is NULL, or a missing key, both yield SQL NULL.
id: cmd-create-extension.hstore-null-and-missing-key
title: hstore lookups return SQL NULL for stored NULL values and for missing keys
family: cmd-create-extension
tier: core
feature_ids: [create-extension, hstore, null-semantics]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Examples: CREATE EXTENSION hstore)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
steps:
  - sql: |
      SELECT ('a=>1, b=>NULL'::hstore -> 'b') IS NULL AS stored_null, ('a=>1'::hstore -> 'zz') IS NULL AS missing_key, hstore('k', 'v') -> 'k' AS v
    expect: rows
    order: ordered
