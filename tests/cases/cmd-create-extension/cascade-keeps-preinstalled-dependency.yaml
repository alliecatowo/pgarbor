# CASCADE only installs dependencies that are missing. An already installed cube keeps its schema; the SCHEMA clause applies only to the extension being installed here.
id: cmd-create-extension.cascade-keeps-preinstalled-dependency
title: CASCADE leaves an already installed dependency in its existing schema
family: cmd-create-extension
tier: core
feature_ids: [create-extension, cascade, dependencies, schema-clause]
required_capabilities: [create-extension, create-schema, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: CASCADE)"
sessions: [a]
setup: |
  CREATE SCHEMA addons;
  CREATE EXTENSION cube;
steps:
  - sql: |
      CREATE EXTENSION earthdistance SCHEMA addons CASCADE
    expect: ok
    comment: no cube notice because cube is already installed
  - sql: |
      SELECT e.extname, n.nspname AS ext_schema FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname IN ('cube', 'earthdistance') ORDER BY e.extname
    expect: rows
    order: ordered
    comment: cube remains in public
