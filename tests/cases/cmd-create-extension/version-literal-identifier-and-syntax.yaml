# VERSION accepts a string literal or an identifier (quoted). A bare numeric token is a syntax error, and a duplicated clause is rejected as conflicting options.
id: cmd-create-extension.version-literal-identifier-and-syntax
title: VERSION accepts string literal or quoted identifier, rejects bare numbers and duplicate clauses
family: cmd-create-extension
tier: core
feature_ids: [create-extension, version-clause, syntax, errors]
required_capabilities: [create-extension, create-schema, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: version)"
sessions: [a]
setup: |
  CREATE SCHEMA addons;
steps:
  - sql: |
      CREATE EXTENSION hstore VERSION '1.6'
    expect: ok
  - sql: |
      SELECT extversion FROM pg_extension WHERE extname = 'hstore'
    expect: rows
    order: ordered
  - sql: |
      DROP EXTENSION hstore
    expect: ok
  - sql: |
      CREATE EXTENSION citext VERSION "1.7" SCHEMA addons
    expect: ok
  - sql: |
      SELECT e.extversion, n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'citext'
    expect: rows
    order: ordered
  - sql: |
      CREATE EXTENSION hstore VERSION 1.6
    expect: error
    sqlstate: "42601"
    comment: bare numeric token is not an identifier or string literal
  - sql: |
      CREATE EXTENSION hstore SCHEMA public SCHEMA public
    expect: error
    sqlstate: "42601"
    comment: repeated option is conflicting or redundant
