# SCHEMA must name an existing schema; otherwise the statement fails and no extension is recorded.
id: cmd-create-extension.schema-clause-missing-schema
title: SCHEMA naming a nonexistent schema fails and creates nothing
family: cmd-create-extension
tier: core
feature_ids: [create-extension, schema-clause, errors]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: schema_name, The named schema must already exist)"
sessions: [a]
steps:
  - sql: |
      CREATE EXTENSION hstore SCHEMA nope
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT count(*) AS n FROM pg_extension WHERE extname = 'hstore'
    expect: rows
    order: ordered
    comment: zero rows, nothing was installed
