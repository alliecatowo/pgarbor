# IF NOT EXISTS on an installed extension only issues a notice; the existing version and schema are not changed, and the schema and version clauses are ignored.
id: cmd-create-extension.if-not-exists-existing-no-change
title: IF NOT EXISTS on an installed extension emits a notice and leaves it unchanged
family: cmd-create-extension
tier: core
feature_ids: [create-extension, if-not-exists, notice]
required_capabilities: [create-extension, create-schema, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: IF NOT EXISTS)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
  CREATE SCHEMA addons;
steps:
  - sql: |
      CREATE EXTENSION IF NOT EXISTS hstore
    expect: notice
    comment: notice extension "hstore" already exists, skipping
  - sql: |
      CREATE EXTENSION IF NOT EXISTS hstore SCHEMA addons VERSION '1.6'
    expect: notice
    comment: existing installation is not altered by the clauses
  - sql: |
      SELECT e.extname, n.nspname AS ext_schema, e.extversion FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'hstore'
    expect: rows
    order: ordered
    comment: still public and version 1.8
