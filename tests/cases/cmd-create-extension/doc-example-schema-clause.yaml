# Documented example: CREATE EXTENSION hstore SCHEMA addons installs the extension objects into the named schema; the extension itself is database-wide.
id: cmd-create-extension.doc-example-schema-clause
title: Documented SCHEMA example places hstore type and operator in the named schema
family: cmd-create-extension
tier: core
feature_ids: [create-extension, schema-clause, extension-objects, operators]
required_capabilities: [create-extension, create-schema, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Examples: CREATE EXTENSION hstore SCHEMA addons)"
sessions: [a]
setup: |
  CREATE SCHEMA addons;
steps:
  - sql: |
      CREATE EXTENSION hstore SCHEMA addons
    expect: ok
  - sql: |
      SELECT e.extname, n.nspname AS ext_schema, e.extversion FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'hstore'
    expect: rows
    order: ordered
    comment: the extension row itself is not in any schema but its namespace column reports addons
  - sql: |
      SELECT t.typname, n.nspname FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace WHERE t.typname = 'hstore'
    expect: rows
    order: ordered
    comment: the hstore type lives in addons
  - sql: |
      SELECT 'a=>1'::addons.hstore OPERATOR(addons.->) 'a' AS v
    expect: rows
    order: ordered
    comment: operator reached via explicit schema qualification
