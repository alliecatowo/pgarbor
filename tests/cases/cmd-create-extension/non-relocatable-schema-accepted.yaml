# xml2 is marked relocatable false in its control file but has no schema parameter, so a SCHEMA clause is accepted. Recorded as observed; the doc phrase about relocation is only a note.
id: cmd-create-extension.non-relocatable-schema-accepted
title: SCHEMA clause on a non-relocatable extension without a control schema is accepted
family: cmd-create-extension
tier: extended
feature_ids: [create-extension, schema-clause, relocatable, control-file]
required_capabilities: [create-extension, create-schema, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: schema_name, relocation)"
sessions: [a]
setup: |
  CREATE SCHEMA addons;
steps:
  - sql: |
      CREATE EXTENSION xml2 SCHEMA addons
    expect: ok
  - sql: |
      SELECT n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'xml2'
    expect: rows
    order: ordered
