# After CREATE EXTENSION citext, comparisons ignore ASCII case, and a NULL operand gives NULL rather than a boolean.
id: cmd-create-extension.citext-case-insensitive-compare
title: citext comparison ignores case and propagates NULL
family: cmd-create-extension
tier: core
feature_ids: [create-extension, citext, null-semantics]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension"
sessions: [a]
setup: |
  CREATE EXTENSION citext;
steps:
  - sql: |
      SELECT 'ABC'::citext = 'abc'::citext AS eq_case, 'ABC'::citext <> 'abd'::citext AS ne, NULL::citext = 'a'::citext AS null_eq
    expect: rows
    order: ordered
