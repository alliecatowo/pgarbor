# CREATE EXTENSION is transactional: visible inside the transaction, gone after ROLLBACK.
id: cmd-create-extension.rollback-discards-extension
title: CREATE EXTENSION inside a rolled back transaction leaves no extension behind
family: cmd-create-extension
tier: core
feature_ids: [create-extension, transactions, rollback]
required_capabilities: [create-extension, transactions, select]
provenance:
  source: hand
  ref: "PostgreSQL CREATE EXTENSION runs inside the surrounding transaction"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE EXTENSION ltree
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_extension WHERE extname = 'ltree'
    expect: rows
    order: ordered
    comment: visible to its own transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_extension WHERE extname = 'ltree'
    expect: rows
    order: ordered
