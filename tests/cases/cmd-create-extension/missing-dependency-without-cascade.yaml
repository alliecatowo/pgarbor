# earthdistance requires cube. Without CASCADE the statement fails with undefined_object and nothing is partially installed.
id: cmd-create-extension.missing-dependency-without-cascade
title: Missing required extension fails without CASCADE and installs nothing partially
family: cmd-create-extension
tier: core
feature_ids: [create-extension, dependencies, errors]
required_capabilities: [create-extension, select]
provenance:
  source: pg-docs
  ref: "ref/create_extension.sgml#sql-createextension (Parameters: CASCADE)"
sessions: [a]
steps:
  - sql: |
      CREATE EXTENSION earthdistance
    expect: error
    sqlstate: "42704"
    comment: required extension "cube" is not installed
  - sql: |
      SELECT count(*) AS n FROM pg_extension WHERE extname IN ('cube', 'earthdistance')
    expect: rows
    order: ordered
    comment: zero rows, the failed statement left no trace
