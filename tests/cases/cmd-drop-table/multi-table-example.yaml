# Documented example: DROP TABLE films, distributors destroys both tables and their rows.
id: cmd-drop-table.multi-table-example
title: DROP TABLE with two names removes both documented example tables
family: cmd-drop-table
tier: core
feature_ids: [drop-table, multi-object-drop]
required_capabilities: [create-table, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_table.sgml#sql-droptable (Examples: DROP TABLE films, distributors)"
sessions: [a]
setup: |
  CREATE TABLE films (code char(5) PRIMARY KEY, title varchar(40));
  CREATE TABLE distributors (did int4 PRIMARY KEY, name varchar(40));
  INSERT INTO films VALUES ('UA502', 'Bananas'), ('T_601', 'Yojimbo');
  INSERT INTO distributors VALUES (1, 'Westward'), (2, 'Walt Disney');
steps:
  - sql: |
      SELECT count(*) FROM films
    expect: rows
    comment: both tables hold rows before the drop
  - sql: |
      DROP TABLE films, distributors
    expect: ok
  - sql: |
      SELECT to_regclass('films') IS NULL AS films_gone, to_regclass('distributors') IS NULL AS distributors_gone
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM films
    expect: error
    sqlstate: "42P01"
    comment: referencing a dropped table is an undefined_table error
