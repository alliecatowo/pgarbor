# Without IF EXISTS a missing table is an error, and other tables are untouched.
id: cmd-drop-table.missing-table-error
title: DROP TABLE of a missing name raises undefined_table and leaves other tables intact
family: cmd-drop-table
tier: core
feature_ids: [drop-table, error-paths]
required_capabilities: [create-table, insert, select, drop-table]
provenance:
  source: hand
  ref: "ref/drop_table.sgml#sql-droptable (IF EXISTS semantics, by contrast)"
sessions: [a]
setup: |
  CREATE TABLE keep_me (id int4);
  INSERT INTO keep_me VALUES (1), (2);
steps:
  - sql: |
      DROP TABLE no_such_table
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT id FROM keep_me ORDER BY id
    expect: rows
    order: ordered
