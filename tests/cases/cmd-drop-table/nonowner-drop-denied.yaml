# Documented: only the table owner, the schema owner, or a superuser may drop a table.
id: cmd-drop-table.nonowner-drop-denied
title: A non owner cannot DROP TABLE and gets insufficient_privilege
family: cmd-drop-table
tier: extended
feature_ids: [drop-table, privileges, roles]
required_capabilities: [create-table, create-role, set-role, drop-table]
provenance:
  source: pg-docs
  ref: "ref/drop_table.sgml#sql-droptable (Description: only the table owner, the schema owner, and superuser)"
quarantine:
  reason: "CREATE ROLE is cluster scoped and the oracle reuses one cluster across per-case databases; needs an isolated cluster"
  since: "2026-10-15"
sessions: [a]
setup: |
  CREATE TABLE t (id int4);
steps:
  - sql: |
      CREATE ROLE dt_nonowner NOLOGIN
    expect: ok
  - sql: |
      SET ROLE dt_nonowner
    expect: ok
  - sql: |
      DROP TABLE t
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP ROLE dt_nonowner
    expect: ok
