# A list with a missing name fails as a whole, so an existing earlier name is not dropped.
id: cmd-drop-table.list-error-is-atomic
title: DROP TABLE with a missing name in the list errors and drops nothing
family: cmd-drop-table
tier: core
feature_ids: [drop-table, multi-object-drop, error-paths]
required_capabilities: [create-table, drop-table, catalog-introspection]
provenance:
  source: hand
  ref: "ref/drop_table.sgml#sql-droptable (name [, ...] without IF EXISTS)"
sessions: [a]
setup: |
  CREATE TABLE a (id int4);
steps:
  - sql: |
      DROP TABLE a, no_such_table
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT to_regclass('a') IS NOT NULL AS a_still_there
    expect: rows
    comment: a was not dropped because the whole command failed
