# Table names are case sensitive when quoted; DROP TABLE matches the exact name.
id: cmd-drop-table.quoted-identifier-case
title: DROP TABLE respects quoted mixed case identifiers
family: cmd-drop-table
tier: core
feature_ids: [drop-table, identifiers]
required_capabilities: [create-table, drop-table, catalog-introspection]
provenance:
  source: hand
  ref: "ref/drop_table.sgml#sql-droptable (name, identifier matching)"
sessions: [a]
setup: |
  CREATE TABLE "Films" (id int4);
steps:
  - sql: |
      DROP TABLE films
    expect: error
    sqlstate: "42P01"
    comment: unquoted films folds to lower case and does not match Films
  - sql: |
      SELECT to_regclass('"Films"') IS NOT NULL AS still_there
    expect: rows
    order: ordered
  - sql: |
      DROP TABLE "Films"
    expect: ok
  - sql: |
      SELECT to_regclass('"Films"') IS NULL AS gone
    expect: rows
    order: ordered
