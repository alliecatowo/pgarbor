# DROP TABLE on a view is refused with a wrong object type error; the view must be removed with DROP VIEW.
id: cmd-drop-table.wrong-object-type-view
title: DROP TABLE on a view raises wrong_object_type and leaves the view usable
family: cmd-drop-table
tier: core
feature_ids: [drop-table, error-paths, views]
required_capabilities: [create-table, create-view, insert, select, drop-table]
provenance:
  source: hand
  ref: "ref/drop_table.sgml#sql-droptable (name must be a table)"
sessions: [a]
setup: |
  CREATE TABLE base (id int4);
  INSERT INTO base VALUES (7);
  CREATE VIEW vw AS SELECT id FROM base;
steps:
  - sql: |
      DROP TABLE vw
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT id FROM vw
    expect: rows
    order: ordered
