# IF EXISTS on a missing table issues a notice and no error (documented in Parameters).
id: cmd-drop-table.if-exists-missing-notice
title: DROP TABLE IF EXISTS on a missing table issues a notice and succeeds
family: cmd-drop-table
tier: core
feature_ids: [drop-table, if-exists]
required_capabilities: [drop-table, select]
provenance:
  source: pg-docs
  ref: "ref/drop_table.sgml#sql-droptable (Parameters: IF EXISTS)"
sessions: [a]
steps:
  - sql: |
      DROP TABLE IF EXISTS no_such_table
    expect: notice
    comment: documented notice, not an error
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    comment: the session stays usable after the notice
