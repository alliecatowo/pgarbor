# Documented: DROP TABLE always removes indexes and constraints of the target table.
id: cmd-drop-table.drop-removes-indexes-constraints
title: DROP TABLE removes the table's indexes and constraint indexes so their names are reusable
family: cmd-drop-table
tier: core
feature_ids: [drop-table, indexes, constraints]
required_capabilities: [create-table, create-index, insert, select, drop-table, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_table.sgml#sql-droptable (Description: always removes any indexes, rules, triggers, and constraints)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4 UNIQUE, CHECK (v >= 0));
  CREATE INDEX t_v_idx ON t (v);
steps:
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 't' ORDER BY indexname
    expect: rows
    order: ordered
    comment: primary key, unique and explicit indexes exist before the drop
  - sql: |
      DROP TABLE t
    expect: ok
  - sql: |
      SELECT to_regclass('t_pkey') IS NULL AS pk_gone, to_regclass('t_v_key') IS NULL AS uq_gone, to_regclass('t_v_idx') IS NULL AS idx_gone
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE t (id int4 PRIMARY KEY, v int4)
    expect: ok
    comment: recreating the same names succeeds because the old index relations are gone
  - sql: |
      CREATE INDEX t_v_idx ON t (v)
    expect: ok
