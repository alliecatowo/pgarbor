# IF EXISTS applies per name: existing tables are dropped, missing ones only produce a notice.
id: cmd-drop-table.if-exists-mixed-list
title: DROP TABLE IF EXISTS with a list drops existing names and notices the missing one
family: cmd-drop-table
tier: core
feature_ids: [drop-table, if-exists, multi-object-drop]
required_capabilities: [create-table, drop-table, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_table.sgml#sql-droptable (Parameters: IF EXISTS, name [, ...])"
sessions: [a]
setup: |
  CREATE TABLE a (id int4);
  CREATE TABLE b (id int4);
steps:
  - sql: |
      DROP TABLE IF EXISTS a, no_such_table, b
    expect: notice
    comment: the missing name produces a notice and the command still succeeds
  - sql: |
      SELECT to_regclass('a') IS NULL AS a_gone, to_regclass('b') IS NULL AS b_gone
    expect: rows
    order: ordered
