# The table name may be schema qualified; a missing schema is an error unless IF EXISTS is given.
id: cmd-drop-table.schema-qualified-drop
title: DROP TABLE with schema-qualified names, including a missing schema
family: cmd-drop-table
tier: core
feature_ids: [drop-table, schemas, if-exists]
required_capabilities: [create-schema, create-table, drop-table, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_table.sgml#sql-droptable (Parameters: name, optionally schema-qualified)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
  CREATE TABLE s1.t (id int4);
  CREATE TABLE public.u (id int4);
steps:
  - sql: |
      DROP TABLE s1.t
    expect: ok
  - sql: |
      DROP TABLE s1.t
    expect: error
    sqlstate: "42P01"
    comment: the qualified table is already gone
  - sql: |
      DROP TABLE public.u
    expect: ok
  - sql: |
      DROP TABLE no_such_schema.x
    expect: error
    sqlstate: "3F000"
    comment: invalid_schema_name for a missing schema
  - sql: |
      DROP TABLE IF EXISTS no_such_schema.x
    expect: notice
    comment: IF EXISTS turns the missing schema into a notice
