# DROP TABLE removes a sequence owned by one of its serial columns.
id: cmd-drop-table.owned-sequence-removed
title: DROP TABLE also drops the sequence owned by a serial column
family: cmd-drop-table
tier: extended
feature_ids: [drop-table, sequences, serial]
required_capabilities: [create-table, sequence, insert, select, drop-table, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_table.sgml#sql-droptable; doc-ddl-depend"
sessions: [a]
setup: |
  CREATE TABLE ser (id serial PRIMARY KEY, v int4);
  INSERT INTO ser (v) VALUES (10), (20);
steps:
  - sql: |
      SELECT to_regclass('ser_id_seq') IS NOT NULL AS seq_exists
    expect: rows
    comment: the serial sequence exists before the drop
  - sql: |
      DROP TABLE ser
    expect: ok
  - sql: |
      SELECT to_regclass('ser_id_seq') IS NULL AS seq_gone
    expect: rows
    comment: the owned sequence is removed too
