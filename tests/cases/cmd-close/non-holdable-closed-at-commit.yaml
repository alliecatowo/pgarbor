id: cmd-close.non-holdable-closed-at-commit
title: A non-holdable cursor is implicitly closed by COMMIT
family: cmd-close
tier: core
feature_ids: [declare-cursor, transactions, fetch, errors]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: error
    sqlstate: "34000"
    comment: COMMIT implicitly closed the non-holdable cursor
