id: cmd-close.fetch-after-close-errors
title: FETCH on a cursor after CLOSE fails because the closed cursor no longer exists
family: cmd-close
tier: core
feature_ids: [close, fetch, declare-cursor, errors]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: rows
    order: ordered
  - sql: |
      CLOSE c
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: error
    sqlstate: "34000"
    comment: after CLOSE the cursor is gone, so no further operation is allowed on it
  - sql: |
      ROLLBACK
    expect: ok
