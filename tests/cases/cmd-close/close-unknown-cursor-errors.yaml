id: cmd-close.close-unknown-cursor-errors
title: CLOSE of a cursor that was never declared is an error
family: cmd-close
tier: core
feature_ids: [close, errors]
required_capabilities: [create-table, insert, select, errors, cursors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Parameters: name)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      CLOSE nosuch
    expect: error
    sqlstate: "34000"
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    comment: the session stays usable after the failed CLOSE
