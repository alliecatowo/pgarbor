id: cmd-close.close-all-closes-holdable
title: CLOSE ALL also closes a holdable cursor that survived COMMIT
family: cmd-close
tier: extended
feature_ids: [close, close-all, holdable-cursor, pg-cursors]
required_capabilities: [create-table, insert, select, transactions, cursors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description; Parameters: ALL)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE h CURSOR WITH HOLD FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT name, is_holdable FROM pg_cursors
    expect: rows
    comment: the holdable cursor survives COMMIT
  - sql: |
      CLOSE ALL
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_cursors
    expect: rows
  - sql: |
      FETCH 1 FROM h
    expect: error
    sqlstate: "34000"
