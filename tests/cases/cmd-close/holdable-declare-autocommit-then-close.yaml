id: cmd-close.holdable-declare-autocommit-then-close
title: A WITH HOLD cursor declared outside a transaction block can be fetched and closed
family: cmd-close
tier: extended
feature_ids: [holdable-cursor, declare-cursor, close, fetch, errors]
required_capabilities: [create-table, insert, select, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      DECLARE h CURSOR WITH HOLD FOR SELECT name FROM t ORDER BY id
    expect: ok
  - sql: |
      FETCH 1 FROM h
    expect: rows
    order: ordered
  - sql: |
      CLOSE h
    expect: ok
  - sql: |
      CLOSE h
    expect: error
    sqlstate: "34000"
