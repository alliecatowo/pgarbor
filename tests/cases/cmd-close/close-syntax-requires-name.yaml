id: cmd-close.close-syntax-requires-name
title: CLOSE without a cursor name or ALL is a syntax error
family: cmd-close
tier: core
feature_ids: [close, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Synopsis)"
sessions: [a]
steps:
  - sql: |
      CLOSE
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS one
    expect: rows
