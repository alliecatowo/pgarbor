id: cmd-close.close-all-without-cursors-is-noop
title: CLOSE ALL succeeds when no cursor is open, inside or outside a transaction
family: cmd-close
tier: core
feature_ids: [close, close-all]
required_capabilities: [create-table, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Parameters: ALL)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
steps:
  - sql: |
      CLOSE ALL
    expect: ok
  - sql: |
      CLOSE ALL
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CLOSE ALL
    expect: ok
  - sql: |
      COMMIT
    expect: ok
