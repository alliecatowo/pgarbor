id: cmd-close.close-name-case-folding
title: Unquoted CLOSE name folds to lower case and does not match a quoted mixed-case cursor
family: cmd-close
tier: core
feature_ids: [close, declare-cursor, quoted-identifiers, errors]
required_capabilities: [create-table, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Parameters: name); ref/declare.sgml"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE "Foo" CURSOR FOR SELECT 1
    expect: ok
  - sql: |
      CLOSE foo
    expect: error
    sqlstate: "34000"
    comment: unquoted foo is folded to foo, which does not match "Foo"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE "Foo" CURSOR FOR SELECT 1
    expect: ok
  - sql: |
      CLOSE "Foo"
    expect: ok
  - sql: |
      COMMIT
    expect: ok
