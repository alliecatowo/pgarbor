id: cmd-close.close-in-aborted-transaction-rejected
title: CLOSE inside a failed transaction is rejected until the transaction ends
family: cmd-close
tier: core
feature_ids: [close, errors, transactions]
required_capabilities: [create-table, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE a1 CURSOR FOR SELECT 1
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      CLOSE a1
    expect: error
    sqlstate: "25P02"
    comment: the transaction is aborted, so CLOSE is ignored with an error
  - sql: |
      ROLLBACK
    expect: ok
