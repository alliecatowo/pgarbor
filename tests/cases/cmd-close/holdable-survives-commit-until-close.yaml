id: cmd-close.holdable-survives-commit-until-close
title: A holdable cursor stays open after COMMIT until CLOSE
family: cmd-close
tier: extended
feature_ids: [holdable-cursor, close, fetch, declare-cursor, errors]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE h CURSOR WITH HOLD FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      FETCH 2 FROM h
    expect: rows
    order: ordered
    comment: first two rows, read outside the creating transaction
  - sql: |
      CLOSE h
    expect: ok
  - sql: |
      FETCH 1 FROM h
    expect: error
    sqlstate: "34000"
