id: cmd-close.close-twice-errors
title: A second CLOSE of the same cursor fails
family: cmd-close
tier: core
feature_ids: [close, errors, declare-cursor]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT id FROM t
    expect: ok
  - sql: |
      CLOSE c
    expect: ok
  - sql: |
      CLOSE c
    expect: error
    sqlstate: "34000"
  - sql: |
      ROLLBACK
    expect: ok
