id: cmd-close.holdable-closed-by-creator-rollback
title: A holdable cursor is closed when the transaction that created it rolls back
family: cmd-close
tier: extended
feature_ids: [holdable-cursor, close, rollback, errors]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE w CURSOR WITH HOLD FOR SELECT id FROM t
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      FETCH 1 FROM w
    expect: error
    sqlstate: "34000"
    comment: the creating transaction aborted via ROLLBACK, so the holdable cursor is closed
