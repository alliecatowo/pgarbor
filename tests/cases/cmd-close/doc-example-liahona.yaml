id: cmd-close.doc-example-liahona
title: CLOSE liahona from the reference page example closes an open cursor
family: cmd-close
tier: core
feature_ids: [close, declare-cursor, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Examples)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE liahona CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      CLOSE liahona;
    expect: ok
  - sql: |
      COMMIT
    expect: ok
