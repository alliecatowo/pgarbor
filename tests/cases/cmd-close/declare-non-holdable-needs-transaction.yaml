id: cmd-close.declare-non-holdable-needs-transaction
title: DECLARE of a non-holdable cursor outside a transaction block fails, so CLOSE finds nothing
family: cmd-close
tier: core
feature_ids: [declare-cursor, close, errors]
required_capabilities: [create-table, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Notes); ref/declare.sgml"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
steps:
  - sql: |
      DECLARE c CURSOR FOR SELECT id FROM t
    expect: error
    sqlstate: "25P01"
  - sql: |
      CLOSE c
    expect: error
    sqlstate: "34000"
