id: cmd-close.redeclare-after-close
title: A cursor name can be reused after CLOSE
family: cmd-close
tier: core
feature_ids: [close, declare-cursor, fetch]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/close.sgml#sql-close (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT name FROM t ORDER BY id
    expect: ok
  - sql: |
      CLOSE c
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT name FROM t WHERE id = 3
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: rows
  - sql: |
      COMMIT
    expect: ok
