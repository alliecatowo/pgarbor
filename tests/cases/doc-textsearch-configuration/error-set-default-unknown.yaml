# default_text_search_config must name an existing configuration; SET to a missing name is rejected.
id: doc-textsearch-configuration.error-set-default-unknown
title: SET default_text_search_config to a missing configuration fails and keeps the previous value
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, default-text-search-config, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (configuration parameter default_text_search_config)"
sessions: [a]
steps:
  - sql: |
      SET default_text_search_config = 'nosuch'
    expect: error
    sqlstate: "22023"
  - sql: |
      SHOW default_text_search_config
    expect: rows
    comment: the default is still the built-in value, not nosuch
