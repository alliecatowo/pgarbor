# Documented: ADD MAPPING FOR token types WITH dictionary re-enables a token type previously dropped from a configuration.
id: doc-textsearch-configuration.add-mapping-restores-email
title: ADD MAPPING re-adds a dropped email token type with a chosen dictionary
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, add-mapping, drop-mapping, email-token]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (ALTER TEXT SEARCH CONFIGURATION ... DROP MAPPING); ALTER TEXT SEARCH CONFIGURATION ... ADD MAPPING reference syntax"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english )
    expect: ok
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg DROP MAPPING FOR email
    expect: ok
  - sql: |
      SELECT to_tsvector('public.pg', 'bob@example.com') = ''::tsvector AS email_dropped
    expect: rows
    order: multiset
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg ADD MAPPING FOR email WITH simple
    expect: ok
  - sql: |
      SELECT to_tsvector('public.pg', 'bob@example.com') = to_tsvector('simple', 'bob@example.com') AS email_restored
    expect: rows
    order: multiset
