# DROP TEXT SEARCH CONFIGURATION removes the configuration; later use errors and IF EXISTS gives a notice.
id: doc-textsearch-configuration.drop-config-then-missing
title: DROP TEXT SEARCH CONFIGURATION removes it, after which use fails and IF EXISTS notices
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, drop-text-search-configuration, to-tsvector, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (DROP TEXT SEARCH CONFIGURATION)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english );
steps:
  - sql: |
      DROP TEXT SEARCH CONFIGURATION public.pg
    expect: ok
  - sql: |
      SELECT to_tsvector('public.pg', 'x')
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP TEXT SEARCH CONFIGURATION public.pg
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP TEXT SEARCH CONFIGURATION IF EXISTS public.pg
    expect: notice
