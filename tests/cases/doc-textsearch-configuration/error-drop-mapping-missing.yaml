# DROP MAPPING for a token type that has no mapping errors; IF EXISTS downgrades it to a notice.
id: doc-textsearch-configuration.error-drop-mapping-missing
title: DROP MAPPING of an unmapped token type errors, IF EXISTS gives a notice
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, drop-mapping, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (ALTER TEXT SEARCH CONFIGURATION ... DROP MAPPING [IF EXISTS] FOR token_type)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english );
  ALTER TEXT SEARCH CONFIGURATION public.pg DROP MAPPING FOR email;
steps:
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg DROP MAPPING FOR email
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg DROP MAPPING IF EXISTS FOR email
    expect: notice
