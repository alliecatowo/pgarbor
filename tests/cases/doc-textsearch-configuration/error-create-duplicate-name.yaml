# Documented: a configuration name is unique within its schema; re-creating public.pg fails.
id: doc-textsearch-configuration.error-create-duplicate-name
title: Creating a text search configuration whose name already exists fails with a unique violation
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, create-text-search-configuration, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (CREATE TEXT SEARCH CONFIGURATION public.pg)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english )
    expect: ok
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english )
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT count(*) FROM pg_ts_config WHERE cfgname = 'pg'
    expect: rows
    order: multiset
