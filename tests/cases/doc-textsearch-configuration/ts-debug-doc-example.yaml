# Documented test: ts_debug on the manual's sample sentence with the pg configuration, after the documented mapping changes.
id: doc-textsearch-configuration.ts-debug-doc-example
title: ts_debug output for the manual sample text under the customised pg configuration
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, ts-debug, alter-mapping, drop-mapping, parser]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (SELECT * FROM ts_debug('public.pg', ...))"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english )
    expect: ok
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION pg
          ALTER MAPPING FOR asciiword, asciihword, hword_asciipart, word, hword, hword_part
          WITH english_stem
    expect: ok
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION pg DROP MAPPING FOR email, url, url_path, sfloat, float
    expect: ok
  - sql: |
      SELECT alias, token, dictionaries, lexemes FROM ts_debug('public.pg', $doc$
      PostgreSQL, the highly scalable, SQL compliant, open source object-relational
      database management system, is now undergoing beta testing of the next
      version of our software.
      $doc$)
    expect: rows
    order: multiset
