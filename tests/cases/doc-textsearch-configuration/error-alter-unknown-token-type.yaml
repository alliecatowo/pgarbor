# A token type name that is not a known parser token type is rejected with invalid_parameter_value.
id: doc-textsearch-configuration.error-alter-unknown-token-type
title: ALTER MAPPING for an unknown token type name fails with 22023
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, alter-mapping, token-types, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (ALTER MAPPING FOR token_type)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english );
steps:
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg ALTER MAPPING FOR nosuchtype WITH simple
    expect: error
    sqlstate: "22023"
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg DROP MAPPING FOR nosuchtype
    expect: error
    sqlstate: "22023"
