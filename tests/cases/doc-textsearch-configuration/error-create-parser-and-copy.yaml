# CREATE TEXT SEARCH CONFIGURATION takes PARSER or COPY, not both.
id: doc-textsearch-configuration.error-create-parser-and-copy
title: CREATE TEXT SEARCH CONFIGURATION rejects PARSER and COPY together
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, create-text-search-configuration, parser-option, copy-option, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (CREATE TEXT SEARCH CONFIGURATION options PARSER and COPY)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION c3 ( PARSER = default, COPY = pg_catalog.english )
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM pg_ts_config WHERE cfgname = 'c3'
    expect: rows
    order: multiset
