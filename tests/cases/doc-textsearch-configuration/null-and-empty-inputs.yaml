# NULL and empty inputs: NULL regconfig and NULL text give NULL, empty and stopword-only text give an empty tsvector.
id: doc-textsearch-configuration.null-and-empty-inputs
title: NULL configuration or NULL text yields NULL while empty text yields an empty tsvector
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, to-tsvector, null-semantics, configuration-argument]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (every to_tsvector call needs a configuration)"
sessions: [a]
steps:
  - sql: |
      SELECT to_tsvector(NULL::regconfig, 'x') IS NULL AS null_config,
             to_tsvector('simple', NULL) IS NULL AS null_text,
             to_tsvector('simple', '') = ''::tsvector AS empty_text,
             to_tsvector('english', 'the and of') = ''::tsvector AS stopwords_only
    expect: rows
    order: multiset
