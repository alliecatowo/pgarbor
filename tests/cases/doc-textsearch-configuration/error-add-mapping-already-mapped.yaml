# ADD MAPPING for a token type that is already mapped violates the mapping key.
id: doc-textsearch-configuration.error-add-mapping-already-mapped
title: ADD MAPPING for an already mapped token type fails with a unique violation
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, add-mapping, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (ALTER TEXT SEARCH CONFIGURATION ... ADD MAPPING FOR token_type)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english );
steps:
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg ADD MAPPING FOR word WITH simple
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT to_tsvector('public.pg', 'Running dogs') = to_tsvector('english', 'Running dogs') AS still_english
    expect: rows
    order: multiset
