# A configuration created with only PARSER has no token mappings, so to_tsvector yields an empty tsvector.
id: doc-textsearch-configuration.parser-only-no-mappings
title: Configuration created with PARSER only maps no token types and gives an empty tsvector
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, create-text-search-configuration, parser-option, to-tsvector]
required_capabilities: [text-search, select]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (CREATE TEXT SEARCH CONFIGURATION ... PARSER; configuration is a parser plus token-to-dictionary mappings)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION c5 ( PARSER = default )
    expect: ok
  - sql: |
      SELECT to_tsvector('c5', 'Running dogs') = ''::tsvector AS no_mappings_empty
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) AS mapped_token_types FROM pg_ts_config_map m JOIN pg_ts_config c ON c.oid = m.mapcfg WHERE c.cfgname = 'c5'
    expect: rows
    order: multiset
