# COPY must name an existing configuration.
id: doc-textsearch-configuration.error-create-copy-unknown
title: CREATE TEXT SEARCH CONFIGURATION COPY from a missing configuration fails
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, create-text-search-configuration, copy-option, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (COPY = source configuration)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION c4 ( COPY = nosuch )
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION c6 ( PARSER = nosuchparser )
    expect: error
    sqlstate: "42704"
