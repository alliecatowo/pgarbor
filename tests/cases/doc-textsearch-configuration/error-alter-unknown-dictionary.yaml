# ALTER MAPPING ... WITH and ALTER MAPPING REPLACE require existing dictionaries.
id: doc-textsearch-configuration.error-alter-unknown-dictionary
title: ALTER MAPPING with a missing dictionary fails and leaves the mapping unchanged
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, alter-mapping, dictionary-replace, errors]
required_capabilities: [text-search, errors]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (ALTER MAPPING ... WITH dictionary_name)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english );
steps:
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg ALTER MAPPING FOR word WITH nosuchdict
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION public.pg ALTER MAPPING REPLACE nosuchdict WITH simple
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT to_tsvector('public.pg', 'Running dogs') = to_tsvector('english', 'Running dogs') AS still_english
    expect: rows
    order: multiset
