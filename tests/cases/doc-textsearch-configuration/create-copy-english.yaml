# Documented: CREATE TEXT SEARCH CONFIGURATION public.pg (COPY = pg_catalog.english) makes a copy that behaves like english; SET default_text_search_config selects it.
id: doc-textsearch-configuration.create-copy-english
title: Configuration created with COPY behaves like english and becomes the session default
family: doc-textsearch-configuration
tier: core
feature_ids: [tsearch, create-text-search-configuration, copy-option, default-text-search-config]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "textsearch.sgml#textsearch-configuration (CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english ))"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH CONFIGURATION public.pg ( COPY = pg_catalog.english )
    expect: ok
  - sql: |
      SELECT cfgname, cfgnamespace::regnamespace::text AS schema FROM pg_ts_config WHERE cfgname = 'pg'
    expect: rows
    order: multiset
  - sql: |
      SELECT to_tsvector('public.pg', txt) = to_tsvector('english', txt) AS same_as_english
      FROM (VALUES ('Running dogs are sleeping'), ('PostgreSQL, the highly scalable database'), ('the and of')) AS v(txt)
      ORDER BY txt
    expect: rows
    order: ordered
  - sql: |
      SET default_text_search_config = 'public.pg'
    expect: ok
  - sql: |
      SHOW default_text_search_config
    expect: rows
  - sql: |
      SELECT to_tsvector('Running dogs') = to_tsvector('public.pg', 'Running dogs') AS default_is_pg
    expect: rows
