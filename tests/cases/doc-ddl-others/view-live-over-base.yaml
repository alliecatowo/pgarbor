# Views are named queries over base tables: a view reflects later changes to its base table.
id: doc-ddl-others.view-live-over-base
title: View with WHERE reflects inserts into its base table
family: doc-ddl-others
tier: core
feature_ids: [views, create-view, where]
required_capabilities: [create-table, create-view, insert, select, views]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-others (Views); ref: sql-createview.html"
sessions: [a]
setup: |
  CREATE TABLE base (id int4 PRIMARY KEY, label text, qty int4);
  INSERT INTO base VALUES (1, 'a', 2), (2, 'b', NULL);
steps:
  - sql: |
      CREATE VIEW v AS SELECT id, label FROM base WHERE qty IS NOT NULL
    expect: ok
  - sql: |
      SELECT id, label FROM v ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO base VALUES (3, 'c', 5)
    expect: ok
  - sql: |
      SELECT id, label FROM v ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM v WHERE label = 'b'
    expect: rows
