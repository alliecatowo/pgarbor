# CREATE OPERATOR binds a symbol to a function; COMMUTATOR declares the operator's commuted form.
id: doc-ddl-others.operator-from-function
title: User-defined operator wraps a function and evaluates through it
family: doc-ddl-others
tier: extended
feature_ids: [operators, create-operator, functions]
required_capabilities: [create-function-sql, create-operator, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-others (Functions, procedures, and operators); ref: sql-createoperator.html"
sessions: [a]
setup: |
  CREATE FUNCTION mul2(a int4, b int4) RETURNS int4 LANGUAGE sql IMMUTABLE AS 'SELECT a * b';
  CREATE OPERATOR *** (LEFTARG = int4, RIGHTARG = int4, PROCEDURE = mul2, COMMUTATOR = ***);
steps:
  - sql: |
      SELECT 2 *** 5 AS forward, 5 *** 2 AS reversed
    expect: rows
    comment: the operator evaluates through mul2 in either operand order
  - sql: |
      SELECT (3 *** NULL::int4) IS NULL AS null_result
    expect: rows
