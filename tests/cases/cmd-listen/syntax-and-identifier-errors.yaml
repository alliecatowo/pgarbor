# The argument is exactly one identifier: no string literal, no list, no wildcard, no empty delimited name.
id: cmd-listen.syntax-and-identifier-errors
title: LISTEN rejects missing, literal, list, wildcard and zero-length channel arguments
family: cmd-listen
tier: core
feature_ids: [listen, syntax-errors, identifier-rules]
required_capabilities: [listen-notify, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Synopsis: LISTEN channel; Parameters: any identifier)"
sessions: [a]
steps:
  - sql: |
      LISTEN
    expect: error
    sqlstate: "42601"
  - sql: |
      LISTEN 'ch'
    expect: error
    sqlstate: "42601"
    comment: a string literal is not an identifier
  - sql: |
      LISTEN a, b
    expect: error
    sqlstate: "42601"
    comment: only one channel per statement
  - sql: |
      LISTEN *
    expect: error
    sqlstate: "42601"
  - sql: |
      LISTEN ""
    expect: error
    sqlstate: "42601"
    comment: zero-length delimited identifier
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: no registration was made by any rejected statement
