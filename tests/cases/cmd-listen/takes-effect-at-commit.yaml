# Documented in Notes: LISTEN takes effect at transaction commit, not when it executes.
id: cmd-listen.takes-effect-at-commit
title: LISTEN inside a transaction registers the channel only when the transaction commits
family: cmd-listen
tier: core
feature_ids: [listen, transactions, listen-at-commit, pg-listening-channels]
required_capabilities: [listen-notify, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Notes: LISTEN takes effect at transaction commit)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      LISTEN tx_ch
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: not yet registered inside the open transaction
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT * FROM pg_listening_channels() ORDER BY 1
    expect: rows
    order: ordered
    comment: registered after commit
