# Documented in Notes: if LISTEN or UNLISTEN is executed in a transaction that later rolls back, the registrations are unchanged.
id: cmd-listen.rollback-discards-listen
title: LISTEN and UNLISTEN inside a rolled-back transaction leave the registrations unchanged
family: cmd-listen
tier: core
feature_ids: [listen, unlisten, rollback, transactions, pg-listening-channels]
required_capabilities: [listen-notify, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Notes: rolls back, set of channels unchanged)"
sessions: [a]
steps:
  - sql: |
      LISTEN keep_ch
    expect: ok
  - sql: |
      BEGIN; LISTEN new_ch; ROLLBACK
    expect: ok
  - sql: |
      SELECT * FROM pg_listening_channels() ORDER BY 1
    expect: rows
    order: ordered
    comment: new_ch was not registered
  - sql: |
      BEGIN; UNLISTEN keep_ch; ROLLBACK
    expect: ok
  - sql: |
      SELECT * FROM pg_listening_channels() ORDER BY 1
    expect: rows
    order: ordered
    comment: keep_ch is still registered after the rolled-back UNLISTEN
