# A session may listen on several channels; each is an independent registration.
id: cmd-listen.multiple-channels-independent
title: One session can listen on several channels and each is counted separately
family: cmd-listen
tier: core
feature_ids: [listen, multiple-channels, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 docs ref/listen.sgml#sql-listen (channel parameter, per-channel registration)"
sessions: [a]
steps:
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: a fresh session listens on nothing
  - sql: |
      LISTEN alpha; LISTEN beta; LISTEN gamma
    expect: ok
  - sql: |
      SELECT * FROM pg_listening_channels() ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      NOTIFY beta
    expect: ok
    comment: notifying one channel does not change any registration
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
