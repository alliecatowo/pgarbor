# The channel is an identifier: unquoted names fold to lower case, quoted names keep case and may contain spaces.
id: cmd-listen.identifier-case-and-quoting
title: LISTEN folds unquoted channel names to lower case and preserves quoted names
family: cmd-listen
tier: core
feature_ids: [listen, identifier-folding, quoted-identifiers, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Parameters: channel is any identifier)"
sessions: [a]
steps:
  - sql: |
      LISTEN MixedCase
    expect: ok
  - sql: |
      LISTEN "MixedCase2"
    expect: ok
  - sql: |
      LISTEN "my channel"
    expect: ok
  - sql: |
      SELECT * FROM pg_listening_channels() ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      LISTEN MIXEDCASE
    expect: ok
    comment: folds to mixedcase, which is already registered
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
