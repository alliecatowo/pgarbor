# Documented LISTEN/NOTIFY sequence on channel "virtual" in one session.
id: cmd-listen.doc-example-virtual
title: Documented LISTEN virtual then NOTIFY virtual sequence runs in one session
family: cmd-listen
tier: core
feature_ids: [listen, notify, listen-notify-sequence]
required_capabilities: [listen-notify, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Examples: LISTEN virtual; NOTIFY virtual;)"
sessions: [a]
steps:
  - sql: |
      LISTEN virtual
    expect: ok
  - sql: |
      NOTIFY virtual
    expect: ok
    comment: the notification is delivered to the listening session after this statement commits; delivery is not a recorded result
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: the session is registered on exactly one channel
