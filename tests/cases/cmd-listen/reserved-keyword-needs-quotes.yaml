# A reserved keyword is not a valid unquoted identifier, but the quoted form is accepted as a channel name.
id: cmd-listen.reserved-keyword-needs-quotes
title: Reserved keyword channel name is a syntax error unquoted and valid when double-quoted
family: cmd-listen
tier: core
feature_ids: [listen, reserved-words, quoted-identifiers, pg-listening-channels]
required_capabilities: [listen-notify, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Parameters: any identifier; SQL key words, sql-keywords-appendix)"
sessions: [a]
steps:
  - sql: |
      LISTEN select
    expect: error
    sqlstate: "42601"
  - sql: |
      LISTEN "select"
    expect: ok
  - sql: |
      SELECT * FROM pg_listening_channels()
    expect: rows
    comment: the channel name is the lower-case keyword spelled inside the quotes
