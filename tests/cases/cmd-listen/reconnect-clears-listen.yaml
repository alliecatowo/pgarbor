# Documented: a session's LISTEN registrations are cleared when the session ends.
id: cmd-listen.reconnect-clears-listen
title: A new connection starts with no LISTEN registrations
family: cmd-listen
tier: core
feature_ids: [listen, session-end, reconnect, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection, reconnect]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Description: registrations automatically cleared when the session ends)"
sessions: [a]
steps:
  - sql: |
      LISTEN ended_ch
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: one registration before the session ends
  - reconnect: true
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: zero after the session ends and a new one starts
