# UNLISTEN inside a committed transaction removes the registration at commit, and it is still visible until then.
id: cmd-listen.unlisten-in-transaction-commits
title: UNLISTEN inside a transaction is visible to the session only after commit
family: cmd-listen
tier: core
feature_ids: [unlisten, listen, transactions, pg-listening-channels]
required_capabilities: [listen-notify, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Notes: takes effect at transaction commit, applies to UNLISTEN)"
sessions: [a]
steps:
  - sql: |
      LISTEN u_ch
    expect: ok
  - sql: |
      BEGIN; UNLISTEN u_ch; SELECT count(*) AS n FROM pg_listening_channels(); COMMIT
    expect: ok
    comment: the count inside the transaction is still 1 because UNLISTEN is applied at commit
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: zero after commit
