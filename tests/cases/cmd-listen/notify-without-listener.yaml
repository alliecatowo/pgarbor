# NOTIFY on a channel nobody listens to succeeds silently; the payload is only delivered to listeners.
id: cmd-listen.notify-without-listener
title: NOTIFY with no listeners succeeds and leaves no LISTEN state behind
family: cmd-listen
tier: core
feature_ids: [notify, listen, payload, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 docs ref/notify.sgml and ref/listen.sgml#sql-listen (channel with no listeners)"
sessions: [a]
steps:
  - sql: |
      NOTIFY nobody_listens, 'payload'
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_listening_channels()
    expect: rows
    comment: NOTIFY does not register the sending session as a listener
