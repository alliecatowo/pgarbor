# Documented: if the session already listens on the channel, LISTEN does nothing.
id: cmd-listen.repeated-listen-idempotent
title: Repeated LISTEN on the same channel leaves a single registration
family: cmd-listen
tier: core
feature_ids: [listen, listen-idempotent, pg-listening-channels]
required_capabilities: [listen-notify, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/listen.sgml#sql-listen (Description: already registered, nothing is done)"
sessions: [a]
steps:
  - sql: |
      LISTEN dup_ch
    expect: ok
  - sql: |
      LISTEN dup_ch
    expect: ok
    comment: second registration is a no-op
  - sql: |
      LISTEN dup_ch; LISTEN dup_ch
    expect: ok
  - sql: |
      SELECT * FROM pg_listening_channels() ORDER BY 1
    expect: rows
    order: ordered
