# A role that holds privileges on an object cannot be dropped until those privileges are revoked.
id: privileges.drop-role-dependency
title: DROP ROLE fails while the role holds a table privilege and succeeds after REVOKE
family: privileges
tier: core
feature_ids: [roles, drop-role, grant, revoke, errors]
required_capabilities: [create-table, roles, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/privileges.sql"
sessions: [a]
setup: |
  CREATE ROLE pv_drop_r;
  CREATE TABLE pv_drop_t (id int4);
  GRANT SELECT ON pv_drop_t TO pv_drop_r;
steps:
  - sql: |
      DROP ROLE pv_drop_r
    expect: error
    sqlstate: "2BP01"
  - sql: |
      REVOKE SELECT ON pv_drop_t FROM pv_drop_r
    expect: ok
  - sql: |
      DROP ROLE pv_drop_r
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_roles WHERE rolname = 'pv_drop_r'
    expect: rows
