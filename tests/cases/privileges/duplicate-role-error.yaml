# Creating a role whose name already exists fails with duplicate_object.
id: privileges.duplicate-role-error
title: CREATE ROLE with an existing name fails with SQLSTATE 42710
family: privileges
tier: core
feature_ids: [roles, create-role, errors]
required_capabilities: [roles, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/privileges.sql"
sessions: [a]
setup: |
  CREATE ROLE pv_dup_r;
steps:
  - sql: |
      CREATE ROLE pv_dup_r
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE USER pv_dup_r
    expect: error
    sqlstate: "42710"
    comment: CREATE USER is CREATE ROLE with LOGIN, same duplicate check
  - sql: |
      SELECT rolname FROM pg_roles WHERE rolname = 'pv_dup_r'
    expect: rows
