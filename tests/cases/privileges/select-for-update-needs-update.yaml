# Row-locking clauses (FOR SHARE, FOR UPDATE) need UPDATE privilege on the table; a plain SELECT needs only SELECT.
id: privileges.select-for-update-needs-update
title: SELECT FOR SHARE and FOR UPDATE require UPDATE privilege while plain SELECT needs only SELECT
family: privileges
tier: extended
feature_ids: [select, row-locks, grant, privileges, errors]
required_capabilities: [create-table, insert, select, roles, row-locks, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/privileges.sql"
sessions: [a]
setup: |
  CREATE ROLE pv_fu_r;
  CREATE TABLE pv_fu_t (id int4, v text);
  INSERT INTO pv_fu_t VALUES (1, 'a');
  GRANT SELECT ON pv_fu_t TO pv_fu_r;
steps:
  - sql: |
      SET ROLE pv_fu_r
    expect: ok
  - sql: |
      SELECT id FROM pv_fu_t
    expect: rows
  - sql: |
      SELECT id FROM pv_fu_t FOR SHARE
    expect: error
    sqlstate: "42501"
    comment: any row-locking clause needs UPDATE privilege, SELECT alone is not enough
  - sql: |
      SELECT id FROM pv_fu_t FOR UPDATE
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      GRANT UPDATE ON pv_fu_t TO pv_fu_r
    expect: ok
  - sql: |
      SET ROLE pv_fu_r
    expect: ok
  - sql: |
      SELECT id FROM pv_fu_t FOR SHARE
    expect: rows
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP OWNED BY pv_fu_r;
      DROP ROLE pv_fu_r
    expect: ok
    comment: drop the case role (cluster-global) so a second attempt can recreate it
