# has_table_privilege and has_column_privilege report grants; NULL role yields NULL.
id: privileges.has-privilege-introspection
title: has_table_privilege and has_column_privilege report table, column and NULL-argument results
family: privileges
tier: core
feature_ids: [catalog-introspection, privileges, grant, boolean]
required_capabilities: [create-table, insert, select, roles, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/privileges.sql"
sessions: [a]
setup: |
  CREATE ROLE pv_hp_r;
  CREATE TABLE pv_hp_t (a int4, b text);
  GRANT SELECT (a) ON pv_hp_t TO pv_hp_r;
  GRANT INSERT ON pv_hp_t TO pv_hp_r;
steps:
  - sql: |
      SELECT has_table_privilege('pv_hp_r', 'pv_hp_t', 'SELECT') AS tbl_sel,
             has_table_privilege('pv_hp_r', 'pv_hp_t', 'INSERT') AS tbl_ins,
             has_table_privilege('pv_hp_r', 'pv_hp_t', 'UPDATE') AS tbl_upd,
             has_column_privilege('pv_hp_r', 'pv_hp_t', 'a', 'SELECT') AS col_a_sel,
             has_column_privilege('pv_hp_r', 'pv_hp_t', 'b', 'SELECT') AS col_b_sel,
             has_table_privilege(NULL, 'pv_hp_t', 'SELECT') AS null_role
    expect: rows
    comment: table-level SELECT is false when only a column grant exists
