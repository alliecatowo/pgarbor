# Table privileges granted to PUBLIC reach every role; REVOKE from PUBLIC removes them again.
id: privileges.public-grant-revoke
title: GRANT and REVOKE of SELECT on PUBLIC apply to roles without direct grants
family: privileges
tier: core
feature_ids: [select, grant, revoke, roles, privileges]
required_capabilities: [create-table, insert, select, roles, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/privileges.sql"
sessions: [a]
setup: |
  CREATE ROLE pv_pub_r;
  CREATE TABLE pv_pub_t (x int4);
  INSERT INTO pv_pub_t VALUES (7);
steps:
  - sql: |
      SET ROLE pv_pub_r
    expect: ok
  - sql: |
      SELECT x FROM pv_pub_t
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      GRANT SELECT ON pv_pub_t TO PUBLIC
    expect: ok
  - sql: |
      SET ROLE pv_pub_r
    expect: ok
  - sql: |
      SELECT x FROM pv_pub_t
    expect: rows
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      REVOKE SELECT ON pv_pub_t FROM PUBLIC
    expect: ok
  - sql: |
      SET ROLE pv_pub_r
    expect: ok
  - sql: |
      SELECT x FROM pv_pub_t
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
