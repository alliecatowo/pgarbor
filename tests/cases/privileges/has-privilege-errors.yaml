# Privilege inquiry functions raise errors for unknown roles and unrecognized privilege names.
id: privileges.has-privilege-errors
title: has_table_privilege fails with 42704 for an unknown role and 22023 for a bad privilege name
family: privileges
tier: core
feature_ids: [catalog-introspection, privileges, errors]
required_capabilities: [create-table, roles, catalog-introspection, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/privileges.sql"
sessions: [a]
setup: |
  CREATE TABLE pv_hu_t (id int4);
steps:
  - sql: |
      SELECT has_table_privilege('pv_no_such_role', 'pv_hu_t', 'SELECT')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT has_table_privilege('pv_hu_t', 'FROBNICATE')
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT has_table_privilege(current_user, 'pv_hu_t', 'SELECT')
    expect: rows
