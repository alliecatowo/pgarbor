# A constant-false predicate becomes a One-Time Filter on a Result node, and the query returns no rows.
id: explain.constant-false-filter
title: EXPLAIN of a constant false WHERE clause and its empty result
family: explain
tier: extended
feature_ids: [explain, filter, empty-result, constant-folding]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (COSTS OFF) SELECT a FROM t WHERE false
    expect: rows
    order: ordered
    comment: the table is never scanned
  - sql: |
      SELECT a FROM t WHERE false ORDER BY a
    expect: rows
    order: multiset
    comment: zero rows expected
