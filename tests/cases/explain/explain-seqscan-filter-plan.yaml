# EXPLAIN without ANALYZE shows a Seq Scan with a Filter; the plan query itself returns NULL-aware rows.
id: explain.seqscan-filter-plan
title: EXPLAIN plan text for a filtered sequential scan, with COSTS OFF
family: explain
tier: core
feature_ids: [explain, seq-scan, filter, null-semantics]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (COSTS OFF) SELECT a, b FROM t WHERE a > 1
    expect: rows
    order: ordered
    comment: plan lines only; no costs so output is stable
  - sql: |
      SELECT a, b FROM t WHERE a > 1 ORDER BY a
    expect: rows
    order: ordered
    comment: b is NULL for a=2 and must be returned as NULL, not an empty string
