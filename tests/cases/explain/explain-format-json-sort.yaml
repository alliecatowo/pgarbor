# EXPLAIN (FORMAT JSON) returns one text row holding a JSON document whose plan is a Sort over a Seq Scan.
id: explain.format-json-sort
title: EXPLAIN FORMAT JSON for a sorted scan returns a parseable plan document
family: explain
tier: extended
feature_ids: [explain, explain-format-json, sort, order-by]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (FORMAT JSON, COSTS OFF) SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
    comment: the single QUERY PLAN column holds the JSON text; costs omitted for stability
