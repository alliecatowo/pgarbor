# VERBOSE EXPLAIN shows how named window definitions are expanded for each window function.
id: explain.verbose-window-expansion
title: EXPLAIN VERBOSE expands named window definitions per window function
family: explain
tier: extended
feature_ids: [explain, explain-verbose, window-functions, named-windows]
required_capabilities: [create-table, insert, select, explain, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (VERBOSE, COSTS OFF) SELECT sum(a) OVER w, sum(c) OVER (w ORDER BY a) FROM t WINDOW w AS (PARTITION BY b)
    expect: rows
    order: ordered
  - sql: |
      SELECT sum(a) OVER w, sum(c) OVER (w ORDER BY a) AS running FROM t WINDOW w AS (PARTITION BY b) ORDER BY a
    expect: rows
    order: ordered
    comment: each NULL b value forms its own partition; sum over NULL c is skipped
