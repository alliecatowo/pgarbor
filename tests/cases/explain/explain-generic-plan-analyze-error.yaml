# EXPLAIN ANALYZE cannot be combined with GENERIC_PLAN because a generic plan has no bound values to run.
id: explain.generic-plan-analyze-error
title: EXPLAIN ANALYZE with GENERIC_PLAN is rejected with a syntax error
family: explain
tier: core
feature_ids: [explain, explain-analyze, explain-generic-plan, errors]
required_capabilities: [create-table, insert, select, explain, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (ANALYZE, GENERIC_PLAN) SELECT a, b FROM t WHERE a = $1
    expect: error
    sqlstate: "42601"
    comment: sqlstate is the author's belief (ERRCODE_SYNTAX_ERROR); the recorder checks it
