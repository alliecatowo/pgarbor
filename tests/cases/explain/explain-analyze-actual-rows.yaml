# EXPLAIN ANALYZE with timing and summary suppressed reports actual rows and removed-by-filter counts.
id: explain.analyze-actual-rows
title: EXPLAIN ANALYZE reports actual row counts and rows removed by filter
family: explain
tier: core
feature_ids: [explain, explain-analyze, seq-scan, filter]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF) SELECT a, b FROM t WHERE a > 1
    expect: rows
    order: ordered
    comment: actual rows=2 and one row removed by the filter (a=1); timing and summary lines suppressed
