# EXPLAIN (GENERIC_PLAN) plans a statement with unbound parameter placeholders, shown as $1 in the plan.
id: explain.generic-plan-param
title: EXPLAIN GENERIC_PLAN shows the parameterized filter without binding values
family: explain
tier: extended
feature_ids: [explain, explain-generic-plan, filter, parameters]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (GENERIC_PLAN, COSTS OFF) SELECT a, b FROM t WHERE a = $1
    expect: rows
    order: ordered
    comment: the filter must reference $1, not a constant
