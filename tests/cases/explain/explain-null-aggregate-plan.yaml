# Plan for an aggregate over an IS NULL filter, plus the query result on the same NULL-bearing column.
id: explain.null-aggregate-plan
title: EXPLAIN plan for count(*) with an IS NULL filter, and matching result
family: explain
tier: core
feature_ids: [explain, aggregates, null-semantics, filter]
required_capabilities: [create-table, insert, select, explain, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (COSTS OFF) SELECT count(*) FROM t WHERE b IS NULL
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*), count(c) FROM t WHERE b IS NULL
    expect: rows
    order: ordered
    comment: one row matches b IS NULL; count(c) is 1 because c is 20 there
