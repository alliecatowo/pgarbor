# Plain EXPLAIN plans an INSERT but does not execute it.
id: explain.plain-dml-no-side-effects
title: Plain EXPLAIN of an INSERT plans without writing any row
family: explain
tier: core
feature_ids: [explain, insert, side-effects]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (COSTS OFF) INSERT INTO t VALUES (9, 'q', 9)
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    order: ordered
    comment: expect 3 rows; a plain EXPLAIN must not execute the insert
