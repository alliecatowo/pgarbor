# EXPLAIN ANALYZE on INSERT really executes the statement, so the row is persisted.
id: explain.analyze-dml-executes
title: EXPLAIN ANALYZE of an INSERT executes it and persists the row
family: explain
tier: extended
feature_ids: [explain, explain-analyze, insert, side-effects]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      EXPLAIN (ANALYZE, COSTS OFF, TIMING OFF, SUMMARY OFF, BUFFERS OFF) INSERT INTO t VALUES (4, 'w', 40)
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    order: ordered
    comment: expect 4 rows, because ANALYZE executed the insert
