# EXPLAIN resolves relations during parse analysis, so a missing table fails without producing a plan.
id: explain.missing-table-error
title: EXPLAIN on a missing relation fails with undefined_table
family: explain
tier: core
feature_ids: [explain, errors, catalog-lookup]
required_capabilities: [explain, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      EXPLAIN SELECT * FROM no_such_table
    expect: error
    sqlstate: "42P01"
