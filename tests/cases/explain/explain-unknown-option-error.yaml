# An unrecognized EXPLAIN option is rejected before any planning happens.
id: explain.unknown-option-error
title: EXPLAIN with an unrecognized option fails with a syntax error
family: explain
tier: core
feature_ids: [explain, errors]
required_capabilities: [explain, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      EXPLAIN (NO_SUCH_OPTION) SELECT 1
    expect: error
    sqlstate: "42601"
    comment: sqlstate is the author's belief (ERRCODE_SYNTAX_ERROR); the recorder checks it
  - sql: |
      EXPLAIN (COSTS OFF) SELECT 1
    expect: rows
    order: ordered
    comment: the session stays usable after the failed statement in autocommit mode
