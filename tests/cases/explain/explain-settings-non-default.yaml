# EXPLAIN (SETTINGS) lists only the non-default settings in effect for the session.
id: explain.settings-non-default
title: EXPLAIN SETTINGS lists a session-level non-default planner setting
family: explain
tier: extended
feature_ids: [explain, explain-settings, guc, seq-scan]
required_capabilities: [create-table, insert, select, explain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/explain.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text, c int4);
  INSERT INTO t VALUES (1, 'x', 10), (2, NULL, 20), (3, 'z', NULL);
steps:
  - sql: |
      SET enable_seqscan = off
    expect: ok
  - sql: |
      EXPLAIN (SETTINGS, COSTS OFF) SELECT a FROM t
    expect: rows
    order: ordered
    comment: no index exists, so the plan is still a Seq Scan; a Settings line names enable_seqscan
  - sql: |
      RESET enable_seqscan
    expect: ok
