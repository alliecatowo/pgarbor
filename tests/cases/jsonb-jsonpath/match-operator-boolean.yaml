# The @@ operator returns the boolean result of a predicate path and @? tests for any item.
id: jsonb-jsonpath.match-operator-boolean
title: jsonpath @@ predicate match and @? existence operators
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-match-operator, jsonpath-exists-operator]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb '{"a": 12}' @@ '$.a > 10' AS gt,
             jsonb '{"a": 12}' @@ '$.a > 20' AS not_gt,
             jsonb '{"a": 12}' @? '$.b' AS has_b
    expect: rows
  - sql: |
      SELECT jsonb '[]' @? '$[*]' AS empty_wild,
             jsonb '[1]' @? '$[*]' AS one_wild,
             jsonb '{}' @? '$.*' AS empty_obj_wild
    expect: rows
