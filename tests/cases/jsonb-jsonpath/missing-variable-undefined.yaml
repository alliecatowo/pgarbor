# Referencing a jsonpath variable that was not supplied is an error even in lax mode.
id: jsonb-jsonpath.missing-variable-undefined
title: Unsupplied jsonpath variable raises 42704
family: jsonb-jsonpath
tier: extended
feature_ids: [jsonpath, jsonb, jsonpath-variables, errors]
required_capabilities: [select, jsonb, jsonpath, errors]
provenance:
  source: hand
  ref: "PG18 functions-json.html (SQL/JSON path variables); errcodes 42704"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('[1, 2]', '$[*] ? (@ > $missing)') AS v
    expect: error
    sqlstate: "42704"
