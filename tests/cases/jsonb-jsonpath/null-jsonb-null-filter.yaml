# JSON null inside an array is an item; comparisons against it are unknown and filter it out.
id: jsonb-jsonpath.null-jsonb-null-filter
title: JSON null items and comparison unknown in filters
family: jsonb-jsonpath
tier: extended
feature_ids: [jsonpath, jsonb, jsonpath-filter, null-handling]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: hand
  ref: "PG18 functions-json.html (SQL/JSON path comparison semantics)"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('[null, 1, null]', '$[*] ? (@ == null)') AS v
    expect: rows
    order: multiset
    comment: "JSON null compares equal to null in jsonpath predicates"
  - sql: |
      SELECT jsonb_path_query('[null, 1]', '$[*] ? (@ > 0)') AS v
    expect: rows
    order: multiset
