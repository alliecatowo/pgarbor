# Named jsonpath variables passed as the vars jsonb argument are visible inside filter expressions.
id: jsonb-jsonpath.filter-with-variables
title: jsonpath filter referencing a passed variable
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-variables, jsonpath-filter]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('[1, 2, 3]', '$[*] ? (@ > $min)', '{"min": 1}') AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a": [1, 5, 9]}', '$.a[*] ? (@ < $hi && @ > $lo)', '{"lo": 1, "hi": 9}') AS v
    expect: rows
    order: multiset
