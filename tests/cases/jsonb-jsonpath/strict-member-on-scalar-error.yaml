# Strict mode: member accessor applied to a scalar is an error (SQL/JSON member not found).
id: jsonb-jsonpath.strict-member-on-scalar-error
title: Strict member accessor on a scalar raises 2203A
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-strict-mode, errors]
required_capabilities: [select, jsonb, jsonpath, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('1', 'strict $.a')
    expect: error
    sqlstate: "2203A"
  - sql: |
      SELECT jsonb_path_query('1', 'lax $.a') AS v
    expect: rows
    comment: "lax mode on the same input returns no items and no error"
