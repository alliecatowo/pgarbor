# Wildcard and index accessors on empty or scalar targets in lax mode produce zero items, not errors.
id: jsonb-jsonpath.lax-subscript-wildcard-empty
title: Lax wildcard and index accessors on empty and scalar targets
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-lax-mode, jsonpath-array-accessor]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('[]', 'lax $.a') AS v
    expect: rows
  - sql: |
      SELECT jsonb_path_query('1', 'lax $[*]') AS v
    expect: rows
    comment: "lax mode auto-wraps the scalar so the wildcard yields the scalar itself"
  - sql: |
      SELECT jsonb_path_query('[1, [2, 3]]', 'lax $[*][*]') AS v
    expect: rows
    order: multiset
