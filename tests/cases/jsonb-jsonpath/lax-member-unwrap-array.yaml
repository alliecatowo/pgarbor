# Lax mode auto-unwraps arrays for member access; non-object elements are skipped.
id: jsonb-jsonpath.lax-member-unwrap-array
title: Lax member accessor unwraps arrays and skips non-object elements
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-lax-mode, jsonpath-member-accessor]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('[{"a": 1}, {"a": 2}, 3]', 'lax $[*].a') AS v
    expect: rows
    order: multiset
    comment: "lax mode skips the scalar 3 without raising an error"
