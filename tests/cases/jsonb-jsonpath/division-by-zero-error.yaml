# Arithmetic on a jsonpath item that divides by zero raises a numeric error (22012).
id: jsonb-jsonpath.division-by-zero-error
title: jsonpath division by zero raises 22012
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-arithmetic, errors]
required_capabilities: [select, jsonb, jsonpath, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('0', '1 / $') AS v
    expect: error
    sqlstate: "22012"
