# The silent argument and the @? operator suppress structural errors, yielding empty results or false.
id: jsonb-jsonpath.silent-suppresses-error
title: silent => true and @? suppress strict-mode structural errors
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-silent, jsonpath-exists-operator]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('1', 'strict $.a', silent => true) AS v
    expect: rows
    comment: "silent returns zero rows instead of raising 2203A"
  - sql: |
      SELECT jsonb '1' @? 'strict $.a' AS matched
    expect: rows
    comment: "the @? operator uses silent mode, so the result is false, not an error"
  - sql: |
      SELECT jsonb_path_exists('[1]', 'strict $[*].a', silent => true) AS e
    expect: rows
