# A filter predicate that evaluates to unknown (type mismatch or null) excludes the item; it is not an error.
id: jsonb-jsonpath.filter-unknown-excluded
title: Filter items whose predicate is unknown are dropped, not errored
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, jsonpath-filter, jsonpath-null-semantics]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('[1, "x", null, 2, true]', '$[*] ? (@ > 0)') AS v
    expect: rows
    order: multiset
    comment: "expected items 1 and 2 only; string, null and boolean comparisons are unknown"
  - sql: |
      SELECT jsonb_path_query('[1, "x", null, 2]', '$[*] ? ((@ == "1") is unknown)') AS v
    expect: rows
    order: multiset
    comment: "the is unknown predicate selects the items whose comparison is unknown"
