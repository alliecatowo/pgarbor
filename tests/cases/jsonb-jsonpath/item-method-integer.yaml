# The .integer() and .string() item methods convert between JSON scalar types.
id: jsonb-jsonpath.item-method-integer
title: jsonpath .integer() and .string() item methods on scalars
family: jsonb-jsonpath
tier: extended
feature_ids: [jsonpath, jsonb, jsonpath-item-methods, numeric]
required_capabilities: [select, jsonb, jsonpath, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('"123"', '$.integer()') AS i,
             jsonb_path_query('42', '$.string()') AS s
    expect: rows
  - sql: |
      SELECT jsonb_path_query('[]', '$.integer()') AS v
    expect: rows
    comment: "lax mode: item method on an empty array yields no items"
