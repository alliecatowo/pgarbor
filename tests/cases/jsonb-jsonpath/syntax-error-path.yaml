# A malformed jsonpath string is rejected at parse time with a syntax error (42601).
id: jsonb-jsonpath.syntax-error-path
title: Malformed jsonpath text raises 42601
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, errors]
required_capabilities: [select, jsonb, jsonpath, errors]
provenance:
  source: hand
  ref: "PG18 functions-json.html (jsonpath); errcodes 42601"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('{}', '$ ? (') AS v
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT '$.a.'::jsonpath
    expect: error
    sqlstate: "42601"
