# NULL target and JSON null behave differently: SQL NULL is strict, JSON null is a value.
id: jsonb-jsonpath.null-inputs
title: SQL NULL versus JSON null as jsonpath target
family: jsonb-jsonpath
tier: core
feature_ids: [jsonpath, jsonb, null-handling]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT (SELECT count(*) FROM jsonb_path_query(NULL::jsonb, '$')) AS n,
             jsonb_path_exists(NULL::jsonb, '$') IS NULL AS exists_is_null,
             jsonb_path_query('null', '$')::text AS json_null_value
    expect: rows
  - sql: |
      SELECT jsonb_path_query('null', '$.a') AS v
    expect: rows
    comment: "lax mode: member access on JSON null yields no items"
