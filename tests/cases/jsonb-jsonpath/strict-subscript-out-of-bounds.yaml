# Strict array subscript out of range is an error; lax mode returns no items for the same subscript.
id: jsonb-jsonpath.strict-subscript-out-of-bounds
title: Strict versus lax array subscript out of range
family: jsonb-jsonpath
tier: extended
feature_ids: [jsonpath, jsonb, jsonpath-strict-mode, jsonpath-array-accessor, errors]
required_capabilities: [select, jsonb, jsonpath, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/jsonb_jsonpath.sql"
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('[1]', 'strict $[1]') AS v
    expect: error
    comment: "no sqlstate asserted; SQLSTATE for out-of-range strict subscript is left to the recording"
  - sql: |
      SELECT jsonb_path_query('[1]', 'lax $[1]') AS v
    expect: rows
    comment: "lax mode returns no items for the out-of-range subscript"
  - sql: |
      SELECT jsonb_path_query('[1]', 'strict $[1]', silent => true) AS v
    expect: rows
