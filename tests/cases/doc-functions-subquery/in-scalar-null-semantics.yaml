# expression IN (subquery) and NOT IN with NULL on either side of the comparison and empty subqueries.
id: doc-functions-subquery.in-scalar-null-semantics
title: IN and NOT IN return NULL when a NULL is involved and no equal row is found
family: doc-functions-subquery
tier: core
feature_ids: [in-subquery, not-in-subquery, null-semantics]
required_capabilities: [create-table, insert, select, subquery]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-subquery (IN, NOT IN)"
sessions: [a]
setup: |
  CREATE TABLE tab1 (col1 int4, col2 int4);
  CREATE TABLE tab2 (col2 int4);
  INSERT INTO tab1 VALUES (1, 10), (2, 20), (3, NULL), (4, 40);
  INSERT INTO tab2 VALUES (10), (10), (NULL);
steps:
  - sql: |
      SELECT 5 IN (SELECT col2 FROM tab2) AS a, NULL::int IN (SELECT col2 FROM tab2) AS b, 10 IN (SELECT col2 FROM tab2) AS c, 99 IN (SELECT col2 FROM tab2 WHERE false) AS d, 99 NOT IN (SELECT col2 FROM tab2) AS e
    expect: rows
    comment: no match with a NULL in the list gives NULL; empty subquery gives false; NOT IN follows
  - sql: |
      SELECT NULL::int NOT IN (SELECT col1 FROM tab1 WHERE col1 > 100) AS null_notin_empty, 1 IN (SELECT col1 FROM tab1 WHERE col1 > 100) AS none_in, 1 NOT IN (SELECT col1 FROM tab1 WHERE col1 > 100) AS none_notin
    expect: rows
    comment: NULL NOT IN an empty set is true because no row is equal
  - sql: |
      SELECT 1 NOT IN (SELECT NULL::int) AS notin_nullrow, 2 IN (SELECT NULL::int UNION ALL SELECT 2) AS in_found_with_null, 3 NOT IN (SELECT col2 FROM tab1) AS n3, 1 NOT IN (SELECT col2 FROM tab1) AS n1
    expect: rows
    comment: an equal row wins over NULLs for IN; an unequal row with a NULL in the list yields NULL
  - sql: |
      SELECT col1 FROM tab1 WHERE col2 NOT IN (SELECT col2 FROM tab1 WHERE col1 = 3) ORDER BY col1
    expect: rows
    order: ordered
    comment: the subquery yields NULL, so NOT IN filters out every row
