# Boundary of ABORT: sequence advances (nextval) are not part of the transaction's updates and are
# not discarded.
id: cmd-abort.sequence-not-rolled-back
title: nextval inside an aborted transaction is not rolled back
family: cmd-abort
tier: extended
feature_ids: [abort, sequences, nextval, transactions]
required_capabilities: [sequence, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort; func/functions-sequence (nextval non-transactional)"
sessions: [a]
setup: |
  CREATE SEQUENCE sq;
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT nextval('sq') AS v
    expect: rows
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT nextval('sq') AS v
    expect: rows
    comment: value 2, not 1
