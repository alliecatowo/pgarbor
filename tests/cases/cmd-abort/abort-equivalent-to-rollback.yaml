# ABORT is documented as identical in behavior to ROLLBACK; the same script run with either
# command leaves the same state.
id: cmd-abort.equivalent-to-rollback
title: ABORT and ROLLBACK leave identical state after the same work
family: cmd-abort
tier: core
feature_ids: [abort, rollback, transactions, insert, update]
required_capabilities: [create-table, insert, update, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Description: identical in behavior to ROLLBACK)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  INSERT INTO t VALUES (1, 1);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      UPDATE t SET v = 100 WHERE id = 1
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2, 2)
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      UPDATE t SET v = 100 WHERE id = 1
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2, 2)
    expect: ok
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: same result as after ROLLBACK
