# AND CHAIN has nothing to chain when no transaction is open, so ABORT AND CHAIN errors.
id: cmd-abort.and-chain-outside-transaction
title: ABORT AND CHAIN outside a transaction block is an error
family: cmd-abort
tier: core
feature_ids: [abort, and-chain, transactions]
required_capabilities: [select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Parameters: AND CHAIN; Notes: outside a transaction block)"
sessions: [a]
steps:
  - sql: |
      ABORT AND CHAIN
    expect: error
    sqlstate: "25P01"
    comment: oracle message says ROLLBACK AND CHAIN; no transaction is started
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro
    expect: rows
    comment: session is still in autocommit, not a chained transaction
