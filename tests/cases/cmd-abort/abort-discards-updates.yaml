# ABORT rolls back all updates made by the transaction (INSERT, UPDATE, DELETE), and the
# discard survives a reconnect.
id: cmd-abort.discards-updates
title: ABORT discards INSERT, UPDATE and DELETE made in the transaction
family: cmd-abort
tier: core
feature_ids: [abort, rollback, transactions, insert, update, delete]
required_capabilities: [create-table, insert, update, delete, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Description: rolls back the current transaction and discards all updates)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO t VALUES (1, 10), (2, 20);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3, 30)
    expect: ok
  - sql: |
      UPDATE t SET v = v + 1
    expect: ok
  - sql: |
      DELETE FROM t WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: uncommitted state visible inside the transaction
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
  - reconnect: true
  - sql: |
      SELECT count(*) AS n, sum(v) AS total FROM t
    expect: rows
