# ABORT outside a transaction block emits a warning and has no effect on data.
id: cmd-abort.outside-transaction-warning
title: ABORT outside a transaction block warns and leaves committed data untouched
family: cmd-abort
tier: core
feature_ids: [abort, transactions, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Notes: outside a transaction)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      ABORT
    expect: notice
    comment: WARNING 25P01 "there is no transaction in progress"
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      ABORT WORK
    expect: notice
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
