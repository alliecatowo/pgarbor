# After an error inside a transaction block, further commands are refused (25P02) until ABORT ends
# the block; then the session works again.
id: cmd-abort.after-error-required
title: Commands in a failed transaction are refused until ABORT ends it
family: cmd-abort
tier: core
feature_ids: [abort, transactions, errors, division]
required_capabilities: [select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Description: rolls back the current transaction)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1 / 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
    comment: transaction is aborted; commands ignored
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT 1 AS one
    expect: rows
