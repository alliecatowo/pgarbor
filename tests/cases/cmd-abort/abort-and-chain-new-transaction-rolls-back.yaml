# The transaction started by ABORT AND CHAIN is a real new transaction: its work is discarded by
# a later ABORT.
id: cmd-abort.and-chain-new-transaction
title: Work in the transaction started by ABORT AND CHAIN is rolled back by the next ABORT
family: cmd-abort
tier: core
feature_ids: [abort, and-chain, transactions, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Parameters: AND CHAIN)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      ABORT AND CHAIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: row 1 was rolled back by ABORT AND CHAIN; only row 2 is visible in the chained transaction
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
