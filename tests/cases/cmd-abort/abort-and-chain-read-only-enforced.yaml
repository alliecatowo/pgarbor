# A chained transaction keeps READ ONLY, so a write in it fails with 25006.
id: cmd-abort.and-chain-read-only
title: ABORT AND CHAIN keeps READ ONLY, so a write in the chained transaction is rejected
family: cmd-abort
tier: core
feature_ids: [abort, and-chain, read-only-transactions, insert]
required_capabilities: [create-table, insert, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Parameters: AND CHAIN); ref/set-transaction.sgml"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN READ ONLY
    expect: ok
  - sql: |
      ABORT AND CHAIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: error
    sqlstate: "25006"
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
