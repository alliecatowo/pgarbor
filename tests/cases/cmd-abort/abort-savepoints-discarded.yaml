# ABORT ends the whole transaction, including every savepoint, so all work since BEGIN is undone.
id: cmd-abort.savepoints-discarded
title: ABORT discards work under all savepoints of the transaction
family: cmd-abort
tier: core
feature_ids: [abort, savepoints, transactions, delete]
required_capabilities: [create-table, insert, delete, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Description); ref/savepoint.sgml"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT s1
    expect: ok
  - sql: |
      DELETE FROM t WHERE id = 1
    expect: ok
  - sql: |
      SAVEPOINT s2
    expect: ok
  - sql: |
      DELETE FROM t WHERE id = 2
    expect: ok
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
