# Each optional keyword form of ABORT (WORK, TRANSACTION, none, AND NO CHAIN) rolls back.
id: cmd-abort.keyword-variants
title: ABORT with WORK, TRANSACTION, bare and AND NO CHAIN forms all roll back
family: cmd-abort
tier: core
feature_ids: [abort, rollback, transactions, insert]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Synopsis; Parameters WORK, TRANSACTION)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN WORK
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1)
    expect: ok
  - sql: |
      ABORT WORK
    expect: ok
  - sql: |
      BEGIN TRANSACTION
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      ABORT TRANSACTION
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3)
    expect: ok
  - sql: |
      ABORT
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (4)
    expect: ok
  - sql: |
      ABORT AND NO CHAIN
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    comment: all four inserts were rolled back
