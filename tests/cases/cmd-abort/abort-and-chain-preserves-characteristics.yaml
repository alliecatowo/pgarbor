# ABORT AND CHAIN starts a new transaction with the same characteristics (isolation level,
# read-only). ABORT AND NO CHAIN starts none.
id: cmd-abort.and-chain-characteristics
title: ABORT AND CHAIN restarts a transaction with the same isolation and read-only mode
family: cmd-abort
tier: core
feature_ids: [abort, and-chain, transaction-isolation, read-only-transactions]
required_capabilities: [transactions, select]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Parameters: AND CHAIN)"
sessions: [a]
steps:
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE READ ONLY
    expect: ok
  - sql: |
      ABORT AND CHAIN
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_read_only') AS ro
    expect: rows
    comment: chained transaction keeps serializable and read-only
  - sql: |
      ABORT AND NO CHAIN
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    comment: no transaction is open after AND NO CHAIN; reports the session default
