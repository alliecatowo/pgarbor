# DDL is transactional: a CREATE TABLE inside a transaction disappears on ABORT.
id: cmd-abort.discards-ddl
title: ABORT discards CREATE TABLE made in the transaction
family: cmd-abort
tier: core
feature_ids: [abort, create-table, transactions, ddl]
required_capabilities: [create-table, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/abort.sgml#sql-abort (Description: all the updates made by the transaction)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CREATE TABLE gone (x int4)
    expect: ok
  - sql: |
      ABORT
    expect: ok
  - sql: |
      SELECT * FROM gone
    expect: error
    sqlstate: "42P01"
