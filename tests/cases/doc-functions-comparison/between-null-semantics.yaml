# Documented null semantics of BETWEEN: a NULL endpoint or input yields NULL unless the other comparison already decides the result.
id: doc-functions-comparison.between-null-semantics
title: BETWEEN with NULL operands yields NULL unless decided by the other bound
family: doc-functions-comparison
tier: core
feature_ids: [between-predicate, null-semantics, three-valued-logic]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-pred-table (BETWEEN) and null comparison rules"
steps:
  - sql: |
      SELECT 2 BETWEEN NULL AND 3 AS null_low, 4 BETWEEN 1 AND NULL AS null_high, 0 BETWEEN 1 AND NULL AS decided_false, NULL BETWEEN SYMMETRIC 1 AND 2 AS null_input
    expect: rows
