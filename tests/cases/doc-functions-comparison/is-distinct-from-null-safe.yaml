# Documented IS [NOT] DISTINCT FROM examples: NULL is treated as a comparable value and never yields NULL.
id: doc-functions-comparison.is-distinct-from-null-safe
title: IS DISTINCT FROM and IS NOT DISTINCT FROM treat NULL as a comparable value
family: doc-functions-comparison
tier: core
feature_ids: [is-distinct-from, is-not-distinct-from, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-pred-table (IS DISTINCT FROM)"
steps:
  - sql: |
      SELECT 1 IS DISTINCT FROM NULL AS a, NULL IS DISTINCT FROM NULL AS b, 1 IS NOT DISTINCT FROM NULL AS c, NULL::int IS NOT DISTINCT FROM NULL AS d, 1 IS DISTINCT FROM 1 AS e, 'x' IS DISTINCT FROM 'y' AS f, NULL::text IS NOT DISTINCT FROM NULL::text AS g
    expect: rows
