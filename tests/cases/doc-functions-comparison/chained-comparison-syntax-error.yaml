# Documented: 1 < 2 < 3 is not valid because comparison operators are binary and take boolean results. PG rejects it at parse time.
id: doc-functions-comparison.chained-comparison-syntax-error
title: Chained comparison such as 1 < 2 < 3 is rejected
family: doc-functions-comparison
tier: core
feature_ids: [comparison-operators, binary-operators, error-handling]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison (1 < 2 < 3 not valid)"
steps:
  - sql: |
      SELECT 1 < 2 < 3
    expect: error
    sqlstate: "42601"
