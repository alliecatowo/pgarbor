# BETWEEN as a WHERE filter: endpoints are included, NULL values never match BETWEEN or NOT BETWEEN.
id: doc-functions-comparison.between-table-filter
title: BETWEEN filters a table inclusively and excludes NULL values from both forms
family: doc-functions-comparison
tier: core
feature_ids: [between-predicate, where-clause, null-semantics]
required_capabilities: [select, create-table, insert]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-pred-table (BETWEEN)"
setup: |
  CREATE TABLE bt (id int4 PRIMARY KEY, v int4);
  INSERT INTO bt VALUES (1, 5), (2, 10), (3, 15), (4, 20), (5, NULL), (6, 25);
steps:
  - sql: |
      SELECT id FROM bt WHERE v BETWEEN 10 AND 20 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM bt WHERE v NOT BETWEEN 10 AND 20 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM bt WHERE v BETWEEN SYMMETRIC 20 AND 10 ORDER BY id
    expect: rows
    order: ordered
