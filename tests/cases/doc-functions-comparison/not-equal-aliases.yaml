# Documented note: != is an alias converted to <> early in parsing, so both forms behave identically.
id: doc-functions-comparison.not-equal-aliases
title: Operator != is an alias of <> and returns the same results
family: doc-functions-comparison
tier: core
feature_ids: [comparison-operators, not-equal-alias]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison (note on <> and !=)"
steps:
  - sql: |
      SELECT 1 != 2 AS bang_true, 1 <> 2 AS angle_true, 1 != 1 AS bang_false, 1 <> 1 AS angle_false, 'abc' <> 'abd' AS txt_ne
    expect: rows
