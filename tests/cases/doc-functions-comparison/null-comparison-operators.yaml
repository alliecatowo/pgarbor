# Documented null behavior of ordinary comparison operators: comparing with NULL yields NULL (shown here as IS NULL).
id: doc-functions-comparison.null-comparison-operators
title: Ordinary comparison operators with a NULL operand yield NULL
family: doc-functions-comparison
tier: core
feature_ids: [comparison-operators, null-semantics, three-valued-logic]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-op-table and IS DISTINCT FROM discussion"
steps:
  - sql: |
      SELECT (NULL = NULL) IS NULL AS eq_null, (1 < NULL) IS NULL AS lt_null, (NULL <> 1) IS NULL AS ne_null, (1 != NULL) IS NULL AS bang_null
    expect: rows
