# Documented num_nulls and num_nonnulls comparison-related functions, including VARIADIC array form and the no-argument error.
id: doc-functions-comparison.num-nulls-nonnulls-variadic
title: num_nulls and num_nonnulls count arguments, accept VARIADIC arrays, and reject zero arguments
family: doc-functions-comparison
tier: core
feature_ids: [num-nulls, num-nonnulls, variadic-functions]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-func-table (num_nonnulls, num_nulls)"
steps:
  - sql: |
      SELECT num_nulls(1, NULL, 2) AS nulls_doc, num_nonnulls(1, NULL, 2) AS nonnulls_doc, num_nulls(NULL::int, NULL::text) AS two_nulls, num_nulls(VARIADIC ARRAY[]::int[]) AS empty_array, num_nonnulls(VARIADIC ARRAY[NULL, 1, NULL]::int[]) AS one_nonnull, num_nulls(VARIADIC ARRAY[NULL, 1, NULL]::int[]) AS two_null
    expect: rows
  - sql: |
      SELECT num_nulls()
    expect: error
    sqlstate: "42883"
