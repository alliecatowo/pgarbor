# Documented: comparison operators table (Less than, Greater than, Less than or equal, Greater than or equal, Equal, Not equal).
id: doc-functions-comparison.basic-operators
title: Each binary comparison operator returns boolean for integers and text
family: doc-functions-comparison
tier: core
feature_ids: [comparison-operators, boolean-result]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-op-table"
steps:
  - sql: |
      SELECT 1 < 2 AS lt, 2 > 1 AS gt, 2 <= 2 AS le, 2 >= 3 AS ge, 2 = 2 AS eq, 2 <> 3 AS ne, 'a' < 'b' AS txt_lt, 1.5 > 1 AS num_gt
    expect: rows
