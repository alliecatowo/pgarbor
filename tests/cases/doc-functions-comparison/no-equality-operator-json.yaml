# Documented: comparison operators exist only for types with a natural ordering or equality; json has none, so the comparison fails.
id: doc-functions-comparison.no-equality-operator-json
title: Equality on json values fails because no operator is defined
family: doc-functions-comparison
tier: core
feature_ids: [comparison-operators, json-type, error-handling]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison (types without comparison operators)"
steps:
  - sql: |
      SELECT '{}'::json = '{}'::json
    expect: error
    sqlstate: "42883"
