# Documented row-valued IS NULL / IS NOT NULL semantics, including detecting all-null and at-least-one-null rows.
id: doc-functions-comparison.row-null-tests
title: Row IS NULL and IS NOT NULL test all fields, so mixed rows fail both tests
family: doc-functions-comparison
tier: core
feature_ids: [row-comparison, is-null, is-not-null, row-constructor]
required_capabilities: [select, create-table, insert]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison (row-valued IS NULL, ROW(table.*) examples)"
setup: |
  CREATE TABLE r (a int, b text);
  INSERT INTO r VALUES (NULL, NULL), (1, 'x'), (NULL, 'y');
steps:
  - sql: |
      SELECT b, ROW(r.*) IS NULL AS all_null, ROW(r.*) IS NOT NULL AS all_nonnull, NOT(ROW(r.*) IS NOT NULL) AS has_null FROM r ORDER BY b NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT ROW(1, NULL) IS NULL AS a, ROW(1, NULL) IS NOT NULL AS b, ROW(NULL, NULL) IS NULL AS c, ROW(NULL, NULL) IS NOT NULL AS d, ROW(1, 2.5, 'this is a test') = ROW(1, 3, 'not the same') AS e, ROW(1, NULL) IS DISTINCT FROM NULL AS f, ROW(NULL, NULL) IS NOT DISTINCT FROM NULL AS g
    expect: rows
