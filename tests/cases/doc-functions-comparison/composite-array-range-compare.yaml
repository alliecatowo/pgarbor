# Documented: arrays, composite (row) values and ranges can be compared when their component types are comparable.
id: doc-functions-comparison.composite-array-range-compare
title: Arrays, row values and ranges compare lexicographically when components are comparable
family: doc-functions-comparison
tier: core
feature_ids: [comparison-operators, array-comparison, row-comparison, range-comparison]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison (arrays, composite types, and ranges can be compared)"
steps:
  - sql: |
      SELECT '[1,5)'::int4range < '[2,3)'::int4range AS range_lt, ROW(1, 'a') < ROW(1, 'b') AS row_lt, '{1,2,3}'::int[] < '{1,2,4}'::int[] AS arr_lt, '{1,2}'::int[] < '{1,2,0}'::int[] AS arr_prefix_lt, ROW(2, 1) > ROW(1, 9) AS row_gt, ROW(1, 2) = ROW(1, 2) AS row_eq
    expect: rows
