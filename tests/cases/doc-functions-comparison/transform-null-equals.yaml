# Documented transform_null_equals GUC: when on, x = NULL is converted to x IS NULL (and NULL = x likewise). Off by default.
id: doc-functions-comparison.transform-null-equals
title: transform_null_equals turns equality with NULL into IS NULL when enabled
family: doc-functions-comparison
tier: extended
feature_ids: [comparison-operators, null-semantics, transform-null-equals]
required_capabilities: [select, create-table, insert, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison (transform_null_equals configuration variable)"
setup: |
  CREATE TABLE tn (x int);
  INSERT INTO tn VALUES (1), (NULL), (NULL);
steps:
  - sql: |
      SELECT count(*) AS matches FROM tn WHERE x = NULL
    expect: rows
  - sql: |
      SET transform_null_equals = on
    expect: ok
  - sql: |
      SELECT count(*) AS matches FROM tn WHERE x = NULL
    expect: rows
  - sql: |
      SELECT count(*) AS matches FROM tn WHERE NULL = x
    expect: rows
  - sql: |
      SET transform_null_equals = off
    expect: ok
  - sql: |
      SELECT count(*) AS matches FROM tn WHERE x = NULL
    expect: rows
