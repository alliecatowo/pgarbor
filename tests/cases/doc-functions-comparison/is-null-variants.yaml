# Documented IS NULL, IS NOT NULL, ISNULL and NOTNULL predicates; the string 'null' is not a NULL value.
id: doc-functions-comparison.is-null-variants
title: IS NULL, IS NOT NULL, ISNULL and NOTNULL test nullness, and the text null is not NULL
family: doc-functions-comparison
tier: core
feature_ids: [is-null, is-not-null, isnull-notnull-syntax]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-pred-table (IS NULL, ISNULL, NOTNULL)"
steps:
  - sql: |
      SELECT 1.5 IS NULL AS a, 'null' IS NOT NULL AS b, NULL::int IS NULL AS c, NULL::int ISNULL AS d, 1 NOTNULL AS e, NULL::int NOTNULL AS f
    expect: rows
