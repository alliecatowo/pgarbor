# Documented BETWEEN, NOT BETWEEN, BETWEEN SYMMETRIC and NOT BETWEEN SYMMETRIC examples.
id: doc-functions-comparison.between-inclusive-symmetric
title: BETWEEN is inclusive and SYMMETRIC sorts the endpoints first
family: doc-functions-comparison
tier: core
feature_ids: [between-predicate, between-symmetric]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-pred-table (BETWEEN rows)"
steps:
  - sql: |
      SELECT 2 BETWEEN 1 AND 3 AS a, 2 BETWEEN 3 AND 1 AS b, 2 NOT BETWEEN 1 AND 3 AS c, 2 BETWEEN SYMMETRIC 3 AND 1 AS d, 2 NOT BETWEEN SYMMETRIC 3 AND 1 AS e, 1 BETWEEN 1 AND 1 AS f_inclusive_low, 3 BETWEEN 1 AND 3 AS g_inclusive_high
    expect: rows
