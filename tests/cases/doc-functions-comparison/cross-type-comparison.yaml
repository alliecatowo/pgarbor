# Documented: related types compare via cross-type operators or by coercing to the more general type.
id: doc-functions-comparison.cross-type-comparison
title: Comparisons between related numeric types coerce to the more general type
family: doc-functions-comparison
tier: core
feature_ids: [comparison-operators, cross-type-comparison, implicit-coercion]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison (cross-type comparison paragraph)"
steps:
  - sql: |
      SELECT 1::int2 = 1.0 AS int2_eq_numeric, 2::int8 > 1::int4 AS int8_gt_int4, 1.5::numeric < 2::float8 AS numeric_lt_float8, 2::int4 >= 2.0::numeric AS int4_ge_numeric, 1::int2 <> 1::int8 AS int2_ne_int8
    expect: rows
