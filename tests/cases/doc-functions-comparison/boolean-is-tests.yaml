# Documented IS [NOT] TRUE / FALSE / UNKNOWN predicates: never return NULL, and NULL input counts as unknown.
id: doc-functions-comparison.boolean-is-tests
title: Boolean IS TRUE, FALSE and UNKNOWN predicates never return NULL
family: doc-functions-comparison
tier: core
feature_ids: [boolean-test-predicates, null-semantics, three-valued-logic]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparison-pred-table (boolean IS TRUE ... IS NOT UNKNOWN)"
steps:
  - sql: |
      SELECT true IS TRUE AS a, true IS NOT TRUE AS b, false IS TRUE AS c, NULL::boolean IS TRUE AS d, NULL::boolean IS NOT TRUE AS e, NULL::boolean IS FALSE AS f, NULL::boolean IS NOT FALSE AS g, NULL::boolean IS UNKNOWN AS h, NULL::boolean IS NOT UNKNOWN AS i, true IS UNKNOWN AS j, false IS NOT FALSE AS k
    expect: rows
