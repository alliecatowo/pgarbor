# NULL in a WHERE predicate and in SET; UPDATE ... RETURNING reports only rows that matched.
id: copydml.update-null-predicate-returning
title: "UPDATE with NULL predicates and NULL assignments returns exactly the matched rows"
family: copydml
tier: core
feature_ids: [update, returning, null-semantics, select]
required_capabilities: [create-table, insert, update, returning, select]
provenance:
  source: hand
  ref: "PG18 functions-comparison.html#FUNCTIONS-COMPARISON (NULL = NULL is NULL)"
  license: CC0
sessions: [a]
setup: |
  CREATE TABLE copydml_test (id int4 PRIMARY KEY, t text);
  INSERT INTO copydml_test VALUES (1, 'a'), (2, NULL), (3, 'c');
steps:
  - sql: |
      UPDATE copydml_test SET t = 'x' WHERE t = NULL RETURNING id
    expect: rows
    order: multiset
    comment: equality with NULL matches nothing
  - sql: |
      UPDATE copydml_test SET t = 'y' WHERE t IS NULL RETURNING id, t
    expect: rows
    order: multiset
  - sql: |
      UPDATE copydml_test SET t = NULL WHERE id = 3 RETURNING id, t IS NULL AS t_null
    expect: rows
    order: multiset
  - sql: |
      SELECT id, t, t IS NULL AS t_null FROM copydml_test ORDER BY id
    expect: rows
    order: ordered
