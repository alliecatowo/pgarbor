# An unconditional DO INSTEAD NOTHING rule cannot be combined with INSERT ... RETURNING: PG rejects it with 0A000.
id: copydml.insert-instead-nothing-rule-returns-nothing
title: "INSERT ... RETURNING under DO INSTEAD NOTHING is rejected with 0A000 and stores nothing"
family: copydml
tier: core
feature_ids: [insert, returning, rules]
required_capabilities: [create-table, insert, returning, rules, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copydml.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE copydml_test (id serial, t text);
  INSERT INTO copydml_test (t) VALUES ('a');
  CREATE RULE qqq AS ON INSERT TO copydml_test DO INSTEAD NOTHING;
steps:
  - sql: |
      INSERT INTO copydml_test (t) VALUES ('f') RETURNING id
    expect: error
    sqlstate: "0A000"
    comment: PG 18.6 rejects INSERT RETURNING under an INSTEAD NOTHING rule ("cannot perform INSERT RETURNING on relation"); no rows are returned
  - sql: |
      SELECT id, t FROM copydml_test ORDER BY id
    expect: rows
    order: ordered
    comment: only the pre-rule row 'a' exists; the rejected insert stored nothing
