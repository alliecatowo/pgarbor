# INSERT ... DEFAULT VALUES and INSERT ... SELECT with RETURNING, showing defaults and NULLs.
id: copydml.insert-default-values-returning
title: "INSERT DEFAULT VALUES and INSERT SELECT with RETURNING fill defaults and NULLs"
family: copydml
tier: core
feature_ids: [insert, returning, serial, select, null-semantics]
required_capabilities: [create-table, insert, returning, serial, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copydml.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE copydml_test (id serial, t text DEFAULT 'dflt', n int4);
steps:
  - sql: |
      INSERT INTO copydml_test DEFAULT VALUES RETURNING id, t, t IS NULL AS t_null, n IS NULL AS n_null
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO copydml_test (t, n) SELECT g::text, g * 10 FROM generate_series(1, 3) AS g RETURNING id, t, n
    expect: rows
    order: multiset
  - sql: |
      SELECT id, t, n FROM copydml_test ORDER BY id
    expect: rows
    order: ordered
