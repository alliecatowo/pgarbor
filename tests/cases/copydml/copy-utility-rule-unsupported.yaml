# A rule whose INSTEAD action is a utility command (NOTIFY) cannot be used under COPY (DML).
id: copydml.copy-utility-rule-unsupported
title: "COPY over INSERT is rejected when an INSTEAD rule turns it into NOTIFY"
family: copydml
tier: extended
feature_ids: [copy, rules, notify, insert, errors]
required_capabilities: [create-table, insert, copy, rules, notify]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copydml.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE copydml_test (id serial, t text);
steps:
  - sql: |
      CREATE RULE qqq AS ON INSERT TO copydml_test DO INSTEAD NOTIFY copydml_test
    expect: ok
  - sql: |
      COPY (INSERT INTO copydml_test DEFAULT VALUES RETURNING id) TO STDOUT
    expect: error
    sqlstate: "0A000"
  - sql: |
      DROP RULE qqq ON copydml_test
    expect: ok
