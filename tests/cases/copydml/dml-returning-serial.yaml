# The INSERT/UPDATE/DELETE ... RETURNING forms that COPY (DML) TO relies on, with a serial key.
id: copydml.dml-returning-serial
title: "INSERT, UPDATE and DELETE RETURNING a serial id, in sequence"
family: copydml
tier: core
feature_ids: [insert, update, delete, returning, serial, select]
required_capabilities: [create-table, insert, update, delete, returning, serial, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/copydml.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE copydml_test (id serial, t text);
  INSERT INTO copydml_test (t) VALUES ('a'), ('b'), ('c'), ('d'), ('e');
steps:
  - sql: |
      INSERT INTO copydml_test (t) VALUES ('f') RETURNING id
    expect: rows
    order: multiset
  - sql: |
      UPDATE copydml_test SET t = 'g' WHERE t = 'f' RETURNING id
    expect: rows
    order: multiset
  - sql: |
      DELETE FROM copydml_test WHERE t = 'g' RETURNING id
    expect: rows
    order: multiset
  - sql: |
      SELECT id, t FROM copydml_test ORDER BY id
    expect: rows
    order: ordered
