# Equality, inequality and ordering operators on oid; NULL rows never match a comparison.
id: oid.compare-operators
title: oid comparison operators filter rows and exclude NULL
family: oid
tier: core
feature_ids: [oid-type, select, comparison, null-semantics, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE oid_tbl (f1 oid);
  INSERT INTO oid_tbl (f1) VALUES ('1234'), ('1235'), ('987'), ('99999999'), ('5'), (NULL);
steps:
  - sql: |
      SELECT o.f1 FROM oid_tbl o WHERE o.f1 = 1234
    expect: rows
    order: multiset
  - sql: |
      SELECT o.f1 FROM oid_tbl o WHERE o.f1 <> '1234' ORDER BY o.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT o.f1 FROM oid_tbl o WHERE o.f1 <= '1234' ORDER BY o.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT o.f1 FROM oid_tbl o WHERE o.f1 < '1234' ORDER BY o.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT o.f1 FROM oid_tbl o WHERE o.f1 >= '1234' ORDER BY o.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT o.f1 FROM oid_tbl o WHERE o.f1 > '1234' ORDER BY o.f1
    expect: rows
    order: ordered
