# Empty and whitespace-only oid input is a syntax error (22P02), and no row is stored.
id: oid.input-empty-and-blank
title: Empty and blank oid literals raise invalid_text_representation
family: oid
tier: core
feature_ids: [oid-type, insert, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE oid_tbl (f1 oid);
steps:
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('    ')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) FROM oid_tbl
    expect: rows
    order: multiset
