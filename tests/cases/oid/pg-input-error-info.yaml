# pg_input_error_info() describes why oid input is invalid: syntax (22P02) versus range (22003).
id: oid.pg-input-error-info
title: pg_input_error_info reports SQLSTATE for oid syntax and range failures
family: oid
tier: extended
feature_ids: [oid-type, system-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT * FROM pg_input_error_info('01XYZ', 'oid')
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM pg_input_error_info('9999999999', 'oid')
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_input_is_valid('4294967295', 'oid') AS max_is_valid,
             (SELECT count(*) FROM pg_input_error_info('4294967295', 'oid')) AS no_error_rows
    expect: rows
    order: multiset
