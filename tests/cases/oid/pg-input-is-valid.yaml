# pg_input_is_valid() reports validity for oid input without raising errors.
id: oid.pg-input-is-valid
title: pg_input_is_valid returns true or false for oid literals without raising
family: oid
tier: core
feature_ids: [oid-type, system-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('1234', 'oid') AS valid_plain,
             pg_input_is_valid('01XYZ', 'oid') AS valid_junk,
             pg_input_is_valid('9999999999', 'oid') AS valid_range,
             pg_input_is_valid('', 'oid') AS valid_empty
    expect: rows
    order: multiset
