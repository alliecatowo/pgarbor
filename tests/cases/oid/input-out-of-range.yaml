# Integers too large for 32 bits, in either sign, are rejected with numeric_value_out_of_range (22003).
id: oid.input-out-of-range
title: Oversized oid literals raise numeric_value_out_of_range
family: oid
tier: core
feature_ids: [oid-type, insert, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE oid_tbl (f1 oid);
steps:
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('32958209582039852935')
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('-23582358720398502385')
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT count(*) FROM oid_tbl
    expect: rows
    order: multiset
