# Trailing garbage, embedded spaces, leading junk and a stray minus sign are all rejected with 22P02.
id: oid.input-malformed
title: Malformed oid literals are rejected as invalid input syntax
family: oid
tier: core
feature_ids: [oid-type, insert, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE oid_tbl (f1 oid);
steps:
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('asdfasd')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('99asdfasd')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('5    d')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('    5d')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('5    5')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES (' - 500')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) FROM oid_tbl
    expect: rows
    order: multiset
