# oid casts to and from int8 and text at the unsigned boundaries.
id: oid.cast-int8-roundtrip
title: oid to int8 and text casts preserve the unsigned value at the maximum
family: oid
tier: extended
feature_ids: [oid-type, casts, select]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 docs datatype-oid.html; sql-expressions type casts"
sessions: [a]
steps:
  - sql: |
      SELECT '4294967295'::oid::int8 AS max_as_int8, '0'::oid::int8 AS zero_as_int8, '4294967295'::oid::text AS max_as_text
    expect: rows
    order: multiset
  - sql: |
      SELECT 'abc'::oid
    expect: error
    sqlstate: "22P02"
