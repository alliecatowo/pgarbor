# oidvector input is a whitespace-separated list of oids; validity is checked per element.
id: oid.oidvector-input
title: oidvector literals are validated element by element
family: oid
tier: extended
feature_ids: [oidvector-type, system-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid(' 1 2  4 ', 'oidvector') AS list_ok,
             pg_input_is_valid('01 01XYZ', 'oidvector') AS list_bad_element,
             pg_input_is_valid('01 9999999999', 'oidvector') AS list_out_of_range
    expect: rows
    order: multiset
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('01 01XYZ', 'oidvector')
    expect: rows
    order: multiset
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('01 9999999999', 'oidvector')
    expect: rows
    order: multiset
