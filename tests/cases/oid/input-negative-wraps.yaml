# A negative decimal literal within int32 range is accepted and wraps modulo 2^32 (strtoul behavior).
id: oid.input-negative-wraps
title: Negative oid literal is accepted and wraps to an unsigned value
family: oid
tier: core
feature_ids: [oid-type, insert, select, comparison]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE oid_tbl (f1 oid);
steps:
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('-1040')
    expect: ok
  - sql: |
      SELECT f1 FROM oid_tbl ORDER BY f1
    expect: rows
    order: ordered
    comment: the stored value is the unsigned wrap of -1040, so it sorts as a large oid
  - sql: |
      SELECT f1 = '4294966256'::oid AS same_as_wrapped FROM oid_tbl
    expect: rows
    order: multiset
