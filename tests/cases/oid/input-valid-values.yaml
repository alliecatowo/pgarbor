# Valid oid literals: plain, leading/trailing spaces, leading/trailing tabs; read back ordered.
id: oid.input-valid-values
title: Valid oid literals with surrounding whitespace are accepted and read back in order
family: oid
tier: slice
feature_ids: [oid-type, insert, select, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/oid.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE oid_tbl (f1 oid);
steps:
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('1234'), ('1235'), ('987'), ('99999999')
    expect: ok
  - sql: |
      INSERT INTO oid_tbl (f1) VALUES ('5     '), ('   10  '), (E'\t  15 \t  ')
    expect: ok
  - sql: |
      SELECT f1 FROM oid_tbl ORDER BY f1
    expect: rows
    order: ordered
