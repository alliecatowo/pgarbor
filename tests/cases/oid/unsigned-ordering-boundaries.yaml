# oid is unsigned 32-bit: the maximum value sorts above 2^31, and min/max see the full range.
id: oid.unsigned-ordering-boundaries
title: oid values sort as unsigned 32-bit integers up to 4294967295
family: oid
tier: core
feature_ids: [oid-type, order-by, aggregates, comparison]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: hand
  ref: "PG18 docs datatype-oid.html (oid is an unsigned four-byte integer)"
sessions: [a]
setup: |
  CREATE TABLE oid_tbl (f1 oid);
  INSERT INTO oid_tbl (f1) VALUES ('0'), ('2147483647'), ('2147483648'), ('4294967295'), ('1');
steps:
  - sql: |
      SELECT f1 FROM oid_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT min(f1) AS lo, max(f1) AS hi FROM oid_tbl
    expect: rows
    order: multiset
  - sql: |
      SELECT f1 FROM oid_tbl WHERE f1 > '2147483647' ORDER BY f1
    expect: rows
    order: ordered
