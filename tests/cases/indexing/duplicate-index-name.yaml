# Creating an index with a name that already exists fails.
id: indexing.duplicate-index-name
title: CREATE INDEX with an existing relation name fails with 42P07
family: indexing
tier: core
feature_ids: [create-index, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42P07 duplicate_table"
setup: |
  CREATE TABLE t (k int, j int);
  CREATE INDEX t_k_idx ON t (k);
steps:
  - sql: |
      CREATE INDEX t_k_idx ON t (j)
    expect: error
    sqlstate: "42P07"
  - sql: |
      CREATE INDEX t_j_idx ON t (j)
    expect: ok
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 't' ORDER BY indexname COLLATE "C"
    expect: rows
    order: ordered
