# A LEFT JOIN against an indexed partitioned table with no partitions returns NULL-extended rows.
id: indexing.join-empty-partitioned-index
title: LEFT JOIN to an indexed partitioned table with no partitions yields NULLs
family: indexing
tier: extended
feature_ids: [create-index, partitioning, joins, nulls]
required_capabilities: [create-table, create-index, insert, select, partitioning, joins]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE idxpart (col1 INT) PARTITION BY RANGE (col1);
  CREATE INDEX ON idxpart (col1);
  CREATE TABLE idxpart_two (col2 INT);
  INSERT INTO idxpart_two VALUES (1), (2), (NULL);
steps:
  - sql: |
      SELECT t.col2, p.col1 FROM idxpart_two t LEFT JOIN idxpart p ON p.col1 = t.col2 ORDER BY t.col2 NULLS LAST
    expect: rows
    order: ordered
