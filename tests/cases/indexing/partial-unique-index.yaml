# Partial unique index: uniqueness applies only to rows matching the predicate.
id: indexing.partial-unique-index
title: Partial unique index enforces uniqueness only for rows matching the predicate
family: indexing
tier: core
feature_ids: [create-index, partial-index, unique-constraints, insert, errors]
required_capabilities: [create-table, create-index, insert, select, unique-constraints]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE p (k int, live bool);
  CREATE UNIQUE INDEX p_k_live_idx ON p (k) WHERE live;
steps:
  - sql: |
      INSERT INTO p VALUES (1, false), (1, false), (1, true)
    expect: ok
  - sql: |
      INSERT INTO p VALUES (1, true)
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT live, count(*) FROM p GROUP BY live ORDER BY live
    expect: rows
    order: ordered
