# UNIQUE ... NULLS NOT DISTINCT treats NULL keys as equal, so a second NULL is a violation.
id: indexing.unique-nulls-not-distinct
title: NULLS NOT DISTINCT unique index rejects a second NULL key
family: indexing
tier: extended
feature_ids: [create-index, unique-constraints, nulls, insert, errors]
required_capabilities: [create-table, create-index, insert, select, unique-constraints]
provenance:
  source: hand
  ref: "PG18 docs sql-createindex.html (NULLS [NOT] DISTINCT); SQLSTATE 23505"
setup: |
  CREATE TABLE n (k int);
  CREATE UNIQUE INDEX n_k_idx ON n (k) NULLS NOT DISTINCT;
steps:
  - sql: |
      INSERT INTO n VALUES (NULL)
    expect: ok
  - sql: |
      INSERT INTO n VALUES (NULL)
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT count(*) FROM n
    expect: rows
