# json has no default btree operator class, so a btree index on a json column is rejected.
id: indexing.no-default-opclass-error
title: Btree index on a json column fails with 42704 for missing operator class
family: indexing
tier: core
feature_ids: [create-index, json, errors]
required_capabilities: [create-table, create-index, json, errors]
provenance:
  source: hand
  ref: "PG18 docs indexes-opclass.html; SQLSTATE 42704 undefined_object"
setup: |
  CREATE TABLE j (doc json);
steps:
  - sql: |
      CREATE INDEX j_doc_idx ON j (doc)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) FROM j
    expect: rows
