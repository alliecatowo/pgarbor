# An index created on a partitioned parent before partitions exist is propagated to every
# partition, including sub-partitioned ones. relhassubclass is set on partitioned indexes.
id: indexing.partitioned-index-propagates
title: Index on partitioned parent propagates to nested partitions
family: indexing
tier: core
feature_ids: [create-index, partitioning, catalog-introspection]
required_capabilities: [create-table, create-index, partitioning, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE idxpart (a int, b int, c text) PARTITION BY RANGE (a);
  CREATE INDEX idxpart_idx ON idxpart (a);
  CREATE TABLE idxpart1 PARTITION OF idxpart FOR VALUES FROM (0) TO (10);
  CREATE TABLE idxpart2 PARTITION OF idxpart FOR VALUES FROM (10) TO (100) PARTITION BY RANGE (b);
  CREATE TABLE idxpart21 PARTITION OF idxpart2 FOR VALUES FROM (0) TO (100);
steps:
  - sql: |
      SELECT c.relname, c.relkind, c.relhassubclass
      FROM pg_class c
      WHERE c.relname LIKE 'idxpart%'
      ORDER BY c.relname COLLATE "C"
    expect: rows
    order: ordered
    comment: relkind p/r for tables, I/i for partitioned/leaf indexes
