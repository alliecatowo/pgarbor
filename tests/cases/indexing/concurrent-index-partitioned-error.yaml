# CREATE INDEX CONCURRENTLY is not supported on a partitioned table.
id: indexing.concurrent-index-partitioned-error
title: CREATE INDEX CONCURRENTLY on a partitioned table fails with 0A000
family: indexing
tier: extended
feature_ids: [create-index, partitioning, errors]
required_capabilities: [create-table, create-index, partitioning, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE idxpart (a int) PARTITION BY RANGE (a);
  CREATE TABLE idxpart1 PARTITION OF idxpart FOR VALUES FROM (0) TO (10);
steps:
  - sql: |
      CREATE INDEX CONCURRENTLY ON idxpart (a)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM pg_index WHERE indrelid = 'idxpart1'::regclass
    expect: rows
