# Basic btree index: create, then query through and around it. NULL keys and duplicates.
id: indexing.create-index-select
title: Create a btree index and query with equality, IS NULL and ordering
family: indexing
tier: slice
feature_ids: [create-index, select, insert, nulls, order-by]
required_capabilities: [create-table, create-index, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (1, 'x'), (2, 'y'), (2, 'z'), (NULL, 'n'), (3, NULL);
steps:
  - sql: |
      CREATE INDEX t_a_idx ON t (a)
    expect: ok
  - sql: |
      SELECT a, b FROM t WHERE a = 2 ORDER BY b
    expect: rows
    order: ordered
  - sql: |
      SELECT b FROM t WHERE a IS NULL
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b FROM t ORDER BY a NULLS LAST, b
    expect: rows
    order: ordered
  - reconnect: true
  - sql: |
      SELECT count(*) FROM t WHERE a > 1
    expect: rows
