# Dropping a partition removes the index that was on it, but the parent index remains.
id: indexing.drop-partition-removes-index
title: Dropping a partition drops its index and keeps the parent partitioned index
family: indexing
tier: core
feature_ids: [create-index, partitioning, drop-table, catalog-introspection]
required_capabilities: [create-table, create-index, partitioning, drop-table, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE idxpart (a int) PARTITION BY RANGE (a);
  CREATE INDEX ON idxpart (a);
  CREATE TABLE idxpart1 PARTITION OF idxpart FOR VALUES FROM (0) TO (10);
steps:
  - sql: |
      DROP TABLE idxpart1
    expect: ok
  - sql: |
      SELECT relname, relkind FROM pg_class
      WHERE relname LIKE 'idxpart%'
      ORDER BY relname COLLATE "C"
    expect: rows
    order: ordered
