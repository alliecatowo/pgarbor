# Partition indexes cannot be dropped alone; a concurrent drop of a partitioned index is rejected;
# dropping the parent index removes the partition indexes too.
id: indexing.drop-partition-index-error
title: Dropping a partition index alone fails with 2BP01 and dropping parent removes all
family: indexing
tier: core
feature_ids: [create-index, drop-index, partitioning, errors, catalog-introspection]
required_capabilities: [create-table, create-index, drop-index, partitioning, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE idxpart (a int) PARTITION BY RANGE (a);
  CREATE INDEX ON idxpart (a);
  CREATE TABLE idxpart1 PARTITION OF idxpart FOR VALUES FROM (0) TO (10);
steps:
  - sql: |
      DROP INDEX idxpart1_a_idx
    expect: error
    sqlstate: "2BP01"
  - sql: |
      DROP INDEX CONCURRENTLY idxpart_a_idx
    expect: error
    comment: concurrent drop of a partitioned index is not supported
  - sql: |
      DROP INDEX idxpart_a_idx
    expect: ok
  - sql: |
      SELECT relname, relkind FROM pg_class
      WHERE relname LIKE 'idxpart%'
      ORDER BY relname COLLATE "C"
    expect: rows
    order: ordered
