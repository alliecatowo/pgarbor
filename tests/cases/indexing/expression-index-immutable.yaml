# Index expressions must use IMMUTABLE functions; random() is volatile and is rejected.
id: indexing.expression-index-immutable
title: Expression index with a volatile function fails with 42P17
family: indexing
tier: core
feature_ids: [create-index, expressions, errors]
required_capabilities: [create-table, create-index, expressions, errors]
provenance:
  source: hand
  ref: "PG18 docs indexes-expressional.html; SQLSTATE 42P17 invalid_object_definition"
setup: |
  CREATE TABLE e (a int);
  INSERT INTO e VALUES (1), (2), (NULL);
steps:
  - sql: |
      CREATE INDEX e_plus_idx ON e ((a + 0))
    expect: ok
  - sql: |
      CREATE INDEX e_rand_idx ON e ((random()))
    expect: error
    sqlstate: "42P17"
  - sql: |
      SELECT a FROM e WHERE a + 0 = 2
    expect: rows
    order: multiset
