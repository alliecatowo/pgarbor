# CREATE INDEX ON ONLY on a partitioned table creates only the parent index; partitions get none.
id: indexing.create-index-only-no-propagation
title: CREATE INDEX ON ONLY leaves partitions without an index
family: indexing
tier: core
feature_ids: [create-index, partitioning, catalog-introspection]
required_capabilities: [create-table, create-index, partitioning, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/indexing.sql"
setup: |
  CREATE TABLE idxpart (a int) PARTITION BY RANGE (a);
  CREATE TABLE idxpart1 PARTITION OF idxpart FOR VALUES FROM (0) TO (10);
steps:
  - sql: |
      CREATE INDEX ON ONLY idxpart (a)
    expect: ok
  - sql: |
      SELECT relhassubclass FROM pg_class WHERE relname = 'idxpart_a_idx'
    expect: rows
  - sql: |
      SELECT count(*) FROM pg_index WHERE indrelid = 'idxpart1'::regclass
    expect: rows
    comment: expect 0, partition has no index
  - sql: |
      SELECT c.relname, c.relkind FROM pg_class c
      WHERE c.relname LIKE 'idxpart%'
      ORDER BY c.relname COLLATE "C"
    expect: rows
    order: ordered
