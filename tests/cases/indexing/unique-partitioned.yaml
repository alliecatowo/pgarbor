# Unique index on a partitioned table must include the partition key; once it does, duplicates
# across partitions are caught.
id: indexing.unique-partitioned
title: Unique index on partitioned table requires partition key and enforces uniqueness across partitions
family: indexing
tier: core
feature_ids: [create-index, unique-constraints, partitioning, insert, errors]
required_capabilities: [create-table, create-index, insert, select, partitioning, unique-constraints]
provenance:
  source: hand
  ref: "PG18 docs ddl-partitioning.html; SQLSTATE 23505, 0A000"
setup: |
  CREATE TABLE pu (a int, b int) PARTITION BY RANGE (a);
  CREATE TABLE pu1 PARTITION OF pu FOR VALUES FROM (0) TO (10);
  CREATE TABLE pu2 PARTITION OF pu FOR VALUES FROM (10) TO (20);
  CREATE UNIQUE INDEX pu_a_idx ON pu (a);
steps:
  - sql: |
      CREATE UNIQUE INDEX pu_b_idx ON pu (b)
    expect: error
    sqlstate: "0A000"
    comment: unique index must include all partitioning columns
  - sql: |
      INSERT INTO pu VALUES (1, 1), (11, 2)
    expect: ok
  - sql: |
      INSERT INTO pu VALUES (1, 3)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO pu VALUES (15, 4)
    expect: ok
  - sql: |
      SELECT a, b FROM pu ORDER BY a
    expect: rows
    order: ordered
