# Declaring a second cursor with an existing name in the same session fails with 42P03.
id: portals.duplicate-cursor-error
title: DECLARE with an already-open cursor name fails with 42P03
family: portals
tier: core
feature_ids: [cursors, errors, transactions]
required_capabilities: [transactions, cursors]
provenance:
  source: hand
  ref: "PG18 sql-declare.html; errcode 42P03 duplicate_cursor"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT 1
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT 2
    expect: error
    sqlstate: "42P03"
  - sql: |
      ROLLBACK
    expect: ok
