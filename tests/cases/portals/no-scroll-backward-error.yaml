# NO SCROLL cursor rejects backward fetching; the transaction block is then aborted and rolled back.
id: portals.no-scroll-backward-error
title: FETCH BACKWARD on a NO SCROLL cursor fails with 55000
family: portals
tier: core
feature_ids: [cursors, no-scroll, fetch, errors, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (NO SCROLL disallows backward fetching)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c NO SCROLL CURSOR FOR SELECT n FROM t ORDER BY n
    expect: ok
  - sql: |
      FETCH 1 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH BACKWARD 1 FROM c
    expect: error
    sqlstate: "55000"
    comment: cursor can only scan forward
  - sql: |
      ROLLBACK
    expect: ok
