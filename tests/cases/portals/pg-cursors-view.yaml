# pg_cursors lists open cursors with their holdable, binary and scrollable flags.
id: portals.pg-cursors-view
title: pg_cursors reports holdable, binary and scrollable flags of open cursors
family: portals
tier: extended
feature_ids: [cursors, pg-cursors, catalog-introspection, transactions]
required_capabilities: [transactions, cursors, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (SELECT ... FROM pg_cursors; BINARY CURSOR)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE a SCROLL CURSOR FOR SELECT 1 AS x
    expect: ok
  - sql: |
      DECLARE b CURSOR WITH HOLD FOR SELECT 2 AS x
    expect: ok
  - sql: |
      DECLARE bc BINARY CURSOR FOR SELECT 3 AS x
    expect: ok
  - sql: |
      SELECT name, is_holdable, is_binary, is_scrollable FROM pg_cursors ORDER BY name
    expect: rows
    order: ordered
    comment: do not query the statement or time columns
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT name FROM pg_cursors ORDER BY name
    expect: rows
    order: ordered
    comment: nothing is open after the rollback
