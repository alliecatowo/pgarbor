# CLOSE ALL removes every open cursor in the session, including WITH HOLD cursors.
id: portals.close-all-cursors
title: CLOSE ALL closes every open cursor in the session
family: portals
tier: extended
feature_ids: [cursors, close, hold-cursor, catalog-introspection, transactions]
required_capabilities: [transactions, cursors, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (test CLOSE ALL; CLOSE ALL)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE foo1 CURSOR WITH HOLD FOR SELECT 1 AS x
    expect: ok
  - sql: |
      DECLARE foo2 CURSOR FOR SELECT 1 AS x
    expect: ok
  - sql: |
      SELECT name FROM pg_cursors ORDER BY name
    expect: rows
    order: ordered
  - sql: |
      CLOSE ALL
    expect: ok
  - sql: |
      SELECT name FROM pg_cursors ORDER BY name
    expect: rows
    order: ordered
    comment: expected to return zero rows
  - sql: |
      COMMIT
    expect: ok
