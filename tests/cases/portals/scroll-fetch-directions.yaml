# Scrollable cursor: FETCH count / NEXT / BACKWARD / ABSOLUTE (incl. negative) / past-end.
id: portals.scroll-fetch-directions
title: SCROLL cursor fetch in forward, backward, absolute and negative-absolute directions
family: portals
tier: core
feature_ids: [cursors, scroll, fetch, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (DECLARE foo SCROLL CURSOR / FETCH n / FETCH backward n)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2), (3), (4), (5);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c SCROLL CURSOR FOR SELECT n FROM t ORDER BY n
    expect: ok
  - sql: |
      FETCH 2 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH NEXT FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH BACKWARD 2 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH ABSOLUTE 5 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH ABSOLUTE -1 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH FROM c
    expect: rows
    comment: past the end of the result set, zero rows
  - sql: |
      CLOSE c
    expect: ok
  - sql: |
      COMMIT
    expect: ok
