# DELETE WHERE CURRENT OF deletes the row the cursor is positioned on; the cursor does not move.
id: portals.delete-where-current-of
title: DELETE WHERE CURRENT OF removes the fetched row and leaves the cursor in place
family: portals
tier: core
feature_ids: [cursors, updatable-cursors, delete, transactions]
required_capabilities: [create-table, insert, select, delete, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (Check DELETE WHERE CURRENT)"
sessions: [a]
setup: |
  CREATE TABLE u (f1 int4, f2 text);
  INSERT INTO u VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c1 CURSOR FOR SELECT f1 FROM u
    expect: ok
  - sql: |
      FETCH 2 FROM c1
    expect: rows
    order: multiset
  - sql: |
      DELETE FROM u WHERE CURRENT OF c1
    expect: ok
  - sql: |
      SELECT f1 FROM u ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      FETCH ALL FROM c1
    expect: rows
    order: multiset
    comment: cursor stays on its position after the delete
  - sql: |
      COMMIT
    expect: ok
