# An INSENSITIVE cursor does not show rows inserted after it was declared.
id: portals.insensitive-cursor-ignores-insert
title: INSENSITIVE cursor does not see a row inserted after DECLARE
family: portals
tier: core
feature_ids: [cursors, insensitive-cursor, insert, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (Check insensitive cursor with INSERT)"
sessions: [a]
setup: |
  CREATE TABLE u (f1 int4, f2 text);
  INSERT INTO u VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c1 INSENSITIVE CURSOR FOR SELECT f1 FROM u ORDER BY f1
    expect: ok
  - sql: |
      INSERT INTO u VALUES (0, 'zero')
    expect: ok
  - sql: |
      FETCH ALL FROM c1
    expect: rows
    order: ordered
    comment: the inserted row 0 must not appear
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT f1 FROM u ORDER BY f1
    expect: rows
    order: ordered
