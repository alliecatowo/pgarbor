# FETCH 0 returns no rows and does not move the cursor; NULL column values come back as NULL.
id: portals.fetch-null-and-zero-count
title: FETCH 0 returns no rows, and NULL values are fetched as NULL
family: portals
tier: core
feature_ids: [cursors, fetch, nulls, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: hand
  ref: "PG18 sql-fetch.html (FETCH count 0); NULL handling"
sessions: [a]
setup: |
  CREATE TABLE t2 (n int4, s text);
  INSERT INTO t2 VALUES (1, 'a'), (2, NULL), (NULL, 'c');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT n, s, n IS NULL AS n_null FROM t2 ORDER BY n
    expect: ok
  - sql: |
      FETCH 0 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH FORWARD 2 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH FORWARD 1 FROM c
    expect: rows
    order: ordered
    comment: NULL sorts last under ORDER BY ASC
  - sql: |
      COMMIT
    expect: ok
