# MOVE positions the cursor without returning rows; FETCH RELATIVE, PRIOR, FIRST and LAST then read from there.
id: portals.move-and-fetch-relative
title: MOVE and FETCH with RELATIVE, PRIOR, FIRST and LAST on a SCROLL cursor
family: portals
tier: core
feature_ids: [cursors, scroll, move, fetch, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (MOVE BACKWARD ALL IN c1; FETCH RELATIVE 0)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2), (3), (4), (5);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c SCROLL CURSOR FOR SELECT n FROM t ORDER BY n
    expect: ok
  - sql: |
      MOVE FORWARD 3 IN c
    expect: ok
  - sql: |
      FETCH RELATIVE 0 FROM c
    expect: rows
    order: ordered
    comment: re-reads the current row
  - sql: |
      FETCH PRIOR FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH FIRST FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH LAST FROM c
    expect: rows
    order: ordered
  - sql: |
      CLOSE c
    expect: ok
  - sql: |
      COMMIT
    expect: ok
