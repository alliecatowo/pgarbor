# PG18 rejects DECLARE without HOLD outside a transaction block (25P01), so no cursor is ever created and the next FETCH fails with 34000.
id: portals.autocommit-cursor-gone
title: DECLARE CURSOR outside a transaction block fails with 25P01 and leaves no cursor
family: portals
tier: core
feature_ids: [cursors, errors, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (cursors outside transaction blocks)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      DECLARE c CURSOR FOR SELECT n FROM t
    expect: error
    sqlstate: "25P01"
    comment: DECLARE CURSOR can only be used in transaction blocks
  - sql: |
      FETCH FROM c
    expect: error
    sqlstate: "34000"
    comment: cursor "c" does not exist
