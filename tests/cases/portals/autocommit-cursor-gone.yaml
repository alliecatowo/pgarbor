# DECLARE without HOLD outside a transaction block is closed at the end of its implicit transaction.
id: portals.autocommit-cursor-gone
title: Cursor declared in autocommit mode without HOLD is gone on the next statement
family: portals
tier: core
feature_ids: [cursors, errors, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/portals.sql (cursors outside transaction blocks)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      DECLARE c CURSOR FOR SELECT n FROM t
    expect: ok
  - sql: |
      FETCH FROM c
    expect: error
    sqlstate: "34000"
