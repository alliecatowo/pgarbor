# The documented tsvector_update_trigger signature with a non-default configuration named by its
# schema-qualified name (pg_catalog.swedish), as the documentation recommends.
id: doc-functions-trigger.tsvector-trigger-swedish-config
title: tsvector_update_trigger honors a schema-qualified non-English configuration name
family: doc-functions-trigger
tier: extended
feature_ids: [triggers, text-search, tsvector, text-search-configuration]
required_capabilities: [create-table, create-function, insert, select, triggers, text-search]
provenance:
  source: pg-docs
  ref: "func.sgml#builtin-triggers-table (CREATE TRIGGER ... tsvector_update_trigger(tsvcol, 'pg_catalog.swedish', title, body)); textsearch.sgml#textsearch-update-triggers"
sessions: [a]
setup: |
  CREATE TABLE sw (tsv tsvector, title text, body text);
  CREATE TRIGGER sw_t BEFORE INSERT OR UPDATE ON sw FOR EACH ROW
    EXECUTE FUNCTION tsvector_update_trigger(tsv, 'pg_catalog.swedish', title, body);
steps:
  - sql: |
      INSERT INTO sw (title, body) VALUES ('Hus bilar', 'och hundar')
    expect: ok
  - sql: |
      SELECT tsv FROM sw
    expect: rows
    comment: swedish stems 'bilar' and 'hundar' and drops the stop word 'och'
