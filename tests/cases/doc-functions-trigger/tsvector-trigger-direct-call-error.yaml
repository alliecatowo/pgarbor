# The tsvector trigger functions can only be invoked by the trigger manager.
id: doc-functions-trigger.tsvector-trigger-direct-call-error
title: tsvector trigger functions raise an internal error when called outside a trigger
family: doc-functions-trigger
tier: core
feature_ids: [triggers, text-search, tsvector, errors]
required_capabilities: [create-function, select, triggers, text-search, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#builtin-triggers-table (tsvector_update_trigger, tsvector_update_trigger_column)"
sessions: [a]
steps:
  - sql: |
      SELECT tsvector_update_trigger()
    expect: error
    sqlstate: "XX000"
    comment: not fired by trigger manager
  - sql: |
      SELECT tsvector_update_trigger_column()
    expect: error
    sqlstate: "XX000"
    comment: not fired by trigger manager
