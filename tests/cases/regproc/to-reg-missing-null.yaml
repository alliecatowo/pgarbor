# to_reg* returns NULL, without error, for objects that do not exist (unqualified names).
id: regproc.to-reg-missing-null
title: to_reg* input returns NULL for missing objects instead of raising errors
family: regproc
tier: core
feature_ids: [reg-types, errors, null-handling, catalog-introspection]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT to_regproc('know') IS NULL AS p,
             to_regclass('pg_classes') IS NULL AS c,
             to_regtype('int3') IS NULL AS t,
             to_regoper('||//') IS NULL AS o,
             to_regoperator('++(int4,int4)') IS NULL AS opr,
             to_regprocedure('absinthe(numeric)') IS NULL AS fn,
             to_regcollation('notacollation') IS NULL AS coll,
             to_regrole('Nonexistent') IS NULL AS r,
             to_regnamespace('Nonexistent') IS NULL AS ns
    expect: rows
    order: multiset
    comment: every column must be true
