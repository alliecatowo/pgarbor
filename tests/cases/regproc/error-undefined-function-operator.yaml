# Strict reg* input raises undefined_function (42883) for missing functions and operators.
id: regproc.error-undefined-function-operator
title: Missing function or operator in strict reg* input raises 42883
family: regproc
tier: core
feature_ids: [reg-types, errors, functions, operators]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regproc('know')
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT regprocedure('absinthe(numeric)')
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT regoper('||//')
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT regoperator('++(int4,int4)')
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT regoper('ng_catalog.||/')
    expect: error
    sqlstate: "42883"
