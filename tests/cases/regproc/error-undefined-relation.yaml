# Strict regclass input: missing relation or unknown schema raises undefined_table (42P01);
# unquoted names fold to lower case while quoted names are case-sensitive.
id: regproc.error-undefined-relation
title: Strict regclass raises 42P01 for missing relations and case-sensitive quoted names
family: regproc
tier: core
feature_ids: [reg-types, errors, identifiers, catalog-introspection]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regclass('PG_CLASS')::text AS rel
    expect: rows
    order: multiset
    comment: unquoted PG_CLASS folds to pg_class
  - sql: |
      SELECT regclass('"PG_CLASS"')
    expect: error
    sqlstate: "42P01"
    comment: quoted upper-case name is a different identifier
  - sql: |
      SELECT regclass('pg_classes')
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT regclass('ng_catalog.pg_class')
    expect: error
    sqlstate: "42P01"
    comment: regclass reports a missing relation, not a missing schema, for an unknown qualifier
