# regrole and regnamespace accept plain and double-quoted names; the to_ variants agree.
id: regproc.roles-and-namespaces
title: regrole and regnamespace accept plain and quoted identifiers
family: regproc
tier: core
feature_ids: [reg-types, roles, namespaces, catalog-introspection]
required_capabilities: [create-role, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
setup: |
  CREATE ROLE regproc_role_a;
steps:
  - sql: |
      SELECT regrole('regproc_role_a')::text AS r1,
             regrole('"regproc_role_a"')::text AS r2,
             to_regrole('regproc_role_a')::text AS r3,
             to_regrole('"regproc_role_a"')::text AS r4
    expect: rows
    order: multiset
    comment: unquoted names are folded to lower case; quoted lower-case name matches too
  - sql: |
      SELECT regnamespace('pg_catalog')::text AS n1,
             regnamespace('"pg_catalog"')::text AS n2,
             to_regnamespace('pg_catalog')::text AS n3,
             to_regnamespace('"pg_catalog"')::text AS n4
    expect: rows
    order: multiset
    comment: schemaname is not applicable to role or namespace input
  - sql: |
      DROP ROLE regproc_role_a
    expect: ok
