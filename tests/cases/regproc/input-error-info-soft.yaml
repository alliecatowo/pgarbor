# pg_input_error_info reports soft input errors with message and SQLSTATE; valid input yields no error.
id: regproc.input-error-info-soft
title: pg_input_error_info reports SQLSTATE and message for invalid reg* input
family: regproc
tier: extended
feature_ids: [reg-types, errors, soft-errors, catalog-introspection]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('no_such_type', 'regtype')
    expect: rows
    order: multiset
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('Nonexistent', 'regnamespace')
    expect: rows
    order: multiset
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('no_such_config', 'regconfig')
    expect: rows
    order: multiset
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('ng_catalog.abs(numeric)', 'regprocedure')
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM pg_input_error_info('pg_class', 'regclass')
    expect: rows
    order: multiset
    comment: valid input produces an all-NULL row
