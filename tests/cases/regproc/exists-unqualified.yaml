# Unqualified regclass/regproc/regtype/regoper/regprocedure/regcollation input resolves existing objects.
id: regproc.exists-unqualified
title: Reg* input types resolve existing catalog objects without a schema name
family: regproc
tier: core
feature_ids: [reg-types, catalog-introspection, operators, functions]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regoper('||/')::text AS op,
             regoperator('+(int4,int4)')::text AS opr,
             regproc('now')::text AS fn,
             regprocedure('abs(numeric)')::text AS fnsig,
             regclass('pg_class')::text AS rel,
             regtype('int4')::text AS typ,
             regcollation('"POSIX"')::text AS coll
    expect: rows
    order: multiset
    comment: each reg* input resolves via the search path, no schema qualifier
