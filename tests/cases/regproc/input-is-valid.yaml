# pg_input_is_valid returns true or false for reg* input without raising errors.
id: regproc.input-is-valid
title: pg_input_is_valid reports validity of reg* input without raising
family: regproc
tier: extended
feature_ids: [reg-types, errors, soft-errors]
required_capabilities: [select, catalog-introspection, collate]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('pg_class', 'regclass') AS valid_rel,
             pg_input_is_valid('no_such_type', 'regtype') AS invalid_type,
             pg_input_is_valid('ng_catalog."POSIX"', 'regcollation') AS invalid_coll,
             pg_input_is_valid('ng_catalog.abs(numeric', 'regprocedure') AS malformed_sig,
             pg_input_is_valid('incorrect type name syntax', 'regtype') AS bad_syntax
    expect: rows
    order: multiset
    comment: only the first column is valid input
