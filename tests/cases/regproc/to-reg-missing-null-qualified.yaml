# to_reg* with a nonexistent schema qualifier returns NULL rather than erroring.
id: regproc.to-reg-missing-null-qualified
title: to_reg* with a nonexistent schema qualifier returns NULL
family: regproc
tier: extended
feature_ids: [reg-types, errors, null-handling, namespaces]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT to_regoper('ng_catalog.||/') IS NULL AS o,
             to_regoperator('ng_catalog.+(int4,int4)') IS NULL AS opr,
             to_regproc('ng_catalog.now') IS NULL AS p,
             to_regprocedure('ng_catalog.abs(numeric)') IS NULL AS fn,
             to_regclass('ng_catalog.pg_class') IS NULL AS c,
             to_regtype('ng_catalog.int4') IS NULL AS t,
             to_regcollation('ng_catalog."POSIX"') IS NULL AS coll
    expect: rows
    order: multiset
    comment: every column must be true
