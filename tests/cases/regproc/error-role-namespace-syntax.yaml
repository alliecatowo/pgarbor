# Missing role or namespace raises 42704 or 3F000; a dotted role or namespace name raises 42602.
id: regproc.error-role-namespace-syntax
title: Missing roles and namespaces raise errors; dotted names are invalid name syntax
family: regproc
tier: core
feature_ids: [reg-types, errors, roles, namespaces]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regrole('Nonexistent')
    expect: error
    sqlstate: "42704"
    comment: unquoted name is folded to lower case in the message
  - sql: |
      SELECT regrole('"Nonexistent"')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT regrole('foo.bar')
    expect: error
    sqlstate: "42602"
  - sql: |
      SELECT regnamespace('Nonexistent')
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT regnamespace('"Nonexistent"')
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT regnamespace('foo.bar')
    expect: error
    sqlstate: "42602"
