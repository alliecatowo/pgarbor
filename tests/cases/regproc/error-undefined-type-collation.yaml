# Strict regtype/regcollation: missing type or collation raises undefined_object (42704);
# a missing schema qualifier on a type raises invalid_schema_name (3F000).
id: regproc.error-undefined-type-collation
title: Missing type or collation raises 42704, missing schema qualifier raises 3F000
family: regproc
tier: core
feature_ids: [reg-types, errors, collations]
required_capabilities: [select, catalog-introspection, collate]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regtype('int3')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT regtype('"int4"')::text AS typ
    expect: rows
    order: multiset
    comment: quoted lower-case int4 names the same type
  - sql: |
      SELECT regtype('ng_catalog.int4')
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT regcollation('ng_catalog."POSIX"')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT regcollation('"NoSuchCollation"')
    expect: error
    sqlstate: "42704"
