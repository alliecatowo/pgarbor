# NULL input to reg* functions yields NULL for both strict and to_ variants, without error.
id: regproc.null-input-strict
title: NULL input to reg* and to_reg* functions returns NULL
family: regproc
tier: core
feature_ids: [reg-types, null-handling]
required_capabilities: [select, catalog-introspection]
provenance:
  source: hand
  ref: "src/test/regress/sql/regproc.sql (NULL semantics of strict input functions)"
sessions: [a]
steps:
  - sql: |
      SELECT regtype(NULL::text) IS NULL AS a,
             to_regtype(NULL::text) IS NULL AS b,
             regclass(NULL::text) IS NULL AS c,
             to_regclass(NULL::text) IS NULL AS d,
             regrole(NULL::text) IS NULL AS e,
             to_regnamespace(NULL::text) IS NULL AS f
    expect: rows
    order: multiset
    comment: every column must be true
  - sql: |
      SELECT to_regtypemod(NULL::text) IS NULL AS m
    expect: rows
    order: multiset
