# regproc with a name matching several overloads is ambiguous (42725); regprocedure with a signature is not.
id: regproc.ambiguous-overload
title: regproc on an overloaded name raises ambiguous_function; regprocedure with signature resolves
family: regproc
tier: core
feature_ids: [reg-types, functions, errors]
required_capabilities: [select, catalog-introspection]
provenance:
  source: hand
  ref: "src/test/regress/sql/regproc.sql (regproc vs regprocedure); PG18 errcodes 42725"
sessions: [a]
steps:
  - sql: |
      SELECT regproc('abs')
    expect: error
    sqlstate: "42725"
  - sql: |
      SELECT regproc('pg_catalog.abs')
    expect: error
    sqlstate: "42725"
  - sql: |
      SELECT regprocedure('abs(int4)')::text AS sig
    expect: rows
    order: multiset
