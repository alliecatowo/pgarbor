# to_regtypemod parses type modifiers; format_type combines it with to_regtype for display.
id: regproc.regtypemod-format-type
title: to_regtypemod and format_type round-trip type modifiers
family: regproc
tier: core
feature_ids: [reg-types, typmod, catalog-introspection]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT to_regtypemod('text') AS no_mod,
             to_regtypemod('timestamp(4)') AS prec,
             to_regtypemod('no_such_type(4)') AS missing
    expect: rows
    order: multiset
    comment: no modifier gives -1, a missing type gives NULL
  - sql: |
      SELECT format_type(to_regtype('varchar(32)'), to_regtypemod('varchar(32)')) AS varchar_mod,
             format_type(to_regtype('bit'), to_regtypemod('bit')) AS bit_plain,
             format_type(to_regtype('"bit"'), to_regtypemod('"bit"')) AS bit_quoted
    expect: rows
    order: multiset
