# Schema-qualified reg* input resolves the same catalog objects as the unqualified form.
id: regproc.exists-schema-qualified
title: Schema-qualified reg* input resolves to the same objects as unqualified input
family: regproc
tier: core
feature_ids: [reg-types, catalog-introspection, operators, functions]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regproc.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regoper('pg_catalog.||/')::text AS op,
             regoperator('pg_catalog.+(int4,int4)')::text AS opr,
             regproc('pg_catalog.now')::text AS fn,
             regprocedure('pg_catalog.abs(numeric)')::text AS fnsig,
             regclass('pg_catalog.pg_class')::text AS rel,
             regtype('pg_catalog.int4')::text AS typ,
             regcollation('pg_catalog."POSIX"')::text AS coll
    expect: rows
    order: multiset
  - sql: |
      SELECT regclass('pg_class') = regclass('pg_catalog.pg_class') AS same_rel,
             regtype('int4') = regtype('pg_catalog.int4') AS same_type
    expect: rows
    order: multiset
    comment: qualified and unqualified input must yield equal oids
