# Documented textual month-name input formats for date.
id: date.input-textual-formats
title: Textual month-name date inputs parse to the same calendar day
family: date
tier: core
feature_ids: [date-type, date-input, datestyle]
required_capabilities: [select, date-type, datestyle]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SET datestyle TO iso
    expect: ok
  - sql: |
      SELECT s, s::date AS d
      FROM (VALUES ('January 8, 1999'), ('1999-Jan-08'), ('08-Jan-1999'), ('Jan-08-1999'),
                   ('1999 Jan 08'), ('Jan 08 99'), ('08 Jan 99')) AS v(s)
      ORDER BY s
    expect: rows
    order: multiset
    comment: every row should decode to 1999-01-08
