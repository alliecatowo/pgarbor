# Non-throwing input validation API for date.
id: date.input-validity-api
title: pg_input_is_valid and pg_input_error_info report date input errors without raising
family: date
tier: extended
feature_ids: [date-type, date-input, input-validation-api]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('now', 'date') AS ok_now
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('garbage', 'date') AS ok_garbage
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('6874898-01-01', 'date') AS ok_too_big
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('garbage', 'date')
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('6874898-01-01', 'date')
    expect: rows
