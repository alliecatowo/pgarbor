# Lower and upper limits of the date range.
id: date.input-range-limits
title: Date range limits accept the documented bounds and reject one day beyond
family: date
tier: extended
feature_ids: [date-type, date-input, errors, date-range]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql; errcodes 22008"
sessions: [a]
steps:
  - sql: |
      SELECT date '4714-11-24 BC' AS lo
    expect: rows
  - sql: |
      SELECT date '4714-11-23 BC' AS below
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT date '5874897-12-31' AS hi
    expect: rows
  - sql: |
      SELECT date '5874898-01-01' AS above
    expect: error
    sqlstate: "22008"
