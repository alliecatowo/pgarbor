# EXTRACT and date_part over every calendar field that is meaningful for a plain date.
id: date.extract-fields-2020-08-11
title: EXTRACT returns calendar fields for a plain date, including ISO and day-of-week forms
family: date
tier: core
feature_ids: [date-type, extract, date-part, iso-calendar]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT
        EXTRACT(YEAR FROM DATE '2020-08-11') AS year,
        EXTRACT(MONTH FROM DATE '2020-08-11') AS month,
        EXTRACT(DAY FROM DATE '2020-08-11') AS day,
        EXTRACT(QUARTER FROM DATE '2020-08-11') AS quarter,
        EXTRACT(WEEK FROM DATE '2020-08-11') AS week,
        EXTRACT(DOY FROM DATE '2020-08-11') AS doy,
        EXTRACT(ISOYEAR FROM DATE '2020-08-11') AS isoyear,
        EXTRACT(JULIAN FROM DATE '2020-08-11') AS julian,
        EXTRACT(EPOCH FROM DATE '2020-08-11') AS epoch
    expect: rows
    comment: TIMEZONE and HOUR are not defined for type date (SQLSTATE 0A000); see date.extract-unsupported-field
  - sql: |
      SELECT date_part('dow', DATE '2020-08-11') AS dow_tue, date_part('dow', DATE '2020-08-16') AS dow_sun,
             date_part('isodow', DATE '2020-08-11') AS isodow_tue, date_part('isodow', DATE '2020-08-16') AS isodow_sun
    expect: rows
    comment: Sunday is dow 0 and isodow 7
