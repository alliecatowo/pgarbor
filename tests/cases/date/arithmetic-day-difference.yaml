# Date minus date yields an integer day count; date plus or minus integer yields a date.
id: date.arithmetic-day-difference
title: Date subtraction yields integer days; date +/- integer yields date
family: date
tier: core
feature_ids: [date-type, date-arithmetic]
required_capabilities: [create-table, insert, select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
setup: |
  CREATE TABLE DATE_TBL (f1 date);
  INSERT INTO DATE_TBL VALUES ('1957-04-09'), ('1996-02-29'), ('2000-01-01'), ('2040-04-10');
steps:
  - sql: |
      SELECT f1, f1 - date '2000-01-01' AS days_from_2k FROM DATE_TBL ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 - date 'epoch' AS days_from_epoch FROM DATE_TBL ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT date '2000-02-28' + 1 AS d1, date '2000-02-28' + 2 AS d2, date '2000-03-01' - 1 AS d3
    expect: rows
  - sql: |
      SELECT date '2000-03-01' - date '2000-02-28' AS diff, pg_typeof(date '2000-03-01' - date '2000-02-28') AS diff_type
    expect: rows
  - sql: |
      SELECT date 'epoch' AS e, date 'epoch' - date '1970-01-01' AS zero
    expect: rows
