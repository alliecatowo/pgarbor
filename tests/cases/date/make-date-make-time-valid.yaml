# Constructor functions with valid arguments, including a negative (BC) year.
id: date.make-date-make-time-valid
title: make_date and make_time build valid values, including BC years and leap days
family: date
tier: extended
feature_ids: [date-type, time-type, constructors, leap-years, bc-dates]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT make_date(2013, 7, 15) AS a, make_date(-44, 3, 15) AS bc_year, make_date(2000, 2, 29) AS leap
    expect: rows
  - sql: |
      SELECT make_time(8, 20, 0.0) AS t
    expect: rows
