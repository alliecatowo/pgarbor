# Constructor arguments outside their field ranges are rejected.
id: date.make-date-field-overflow
title: make_date and make_time reject out-of-range field values with datetime_field_overflow
family: date
tier: extended
feature_ids: [date-type, time-type, constructors, errors]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql; errcodes 22008"
sessions: [a]
steps:
  - sql: |
      SELECT make_date(0, 7, 15)
    expect: error
    sqlstate: "22008"
    comment: year 0 does not exist
  - sql: |
      SELECT make_date(2013, 2, 30)
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT make_date(2013, 13, 1)
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT make_date(2013, 11, -1)
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT make_time(10, 55, 100.1)
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT make_time(24, 0, 2.1)
    expect: error
    sqlstate: "22008"
