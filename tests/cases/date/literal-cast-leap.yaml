# Casts from text, date arithmetic across leap years and the 1900 century rule.
id: date.literal-cast-leap
title: Text-to-date casts and day arithmetic across leap years including the 1900 exception
family: date
tier: core
feature_ids: [date-type, cast, leap-years, date-arithmetic]
required_capabilities: [select, date-type]
provenance:
  source: hand
  ref: "PG18 docs datatype-datetime.html; sql-createtable and calendar leap-year rule (1900 not leap)"
sessions: [a]
steps:
  - sql: |
      SELECT '2000-02-29'::date + 1 AS after_leap_2000,
             '1900-02-28'::date + 1 AS after_1900_feb28,
             '1999-12-31'::date + 1 AS new_year,
             CAST('1999-01-08' AS date) = date '1999-01-08' AS cast_eq
    expect: rows
    comment: 1900 is not a leap year, so 1900-02-28 is followed by 1900-03-01
  - sql: |
      SELECT CAST(date '1999-01-08' AS text) AS as_text, pg_typeof('1999-01-08'::date) AS typ
    expect: rows
