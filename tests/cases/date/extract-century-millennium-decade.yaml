# Century, millennium and decade boundaries across the AD/BC divide.
id: date.extract-century-millennium-decade
title: EXTRACT century, millennium and decade at AD/BC boundaries, with no year zero
family: date
tier: extended
feature_ids: [date-type, extract, date-part, bc-dates]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT d,
             EXTRACT(CENTURY FROM d) AS century,
             EXTRACT(MILLENNIUM FROM d) AS millennium,
             EXTRACT(DECADE FROM d) AS decade
      FROM (VALUES
        (DATE '0101-12-31 BC'), (DATE '0100-12-31 BC'), (DATE '0001-12-31 BC'),
        (DATE '0001-01-01'), (DATE '0001-01-01 AD'),
        (DATE '0009-12-31'), (DATE '0010-01-01'),
        (DATE '0001-01-01 BC'), (DATE '0002-12-31 BC'), (DATE '0011-01-01 BC'), (DATE '0012-12-31 BC'),
        (DATE '1000-12-31'), (DATE '1001-01-01'),
        (DATE '1900-12-31'), (DATE '1901-01-01'), (DATE '1994-12-25'),
        (DATE '2000-12-31'), (DATE '2001-01-01')
      ) AS v(d)
      ORDER BY d
    expect: rows
    order: ordered
    comment: BC century and decade values are negative and there is no year zero
