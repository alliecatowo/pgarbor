# The DateStyle setting decides how an ambiguous slash-separated date is read.
id: date.input-ambiguous-datestyle
title: DateStyle decides how an ambiguous slash date is read
family: date
tier: core
feature_ids: [date-type, date-input, datestyle]
required_capabilities: [select, date-type, datestyle]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SET datestyle TO mdy
    expect: ok
  - sql: |
      SELECT date '01/02/03' AS d
    expect: rows
    comment: read as month/day/year
  - sql: |
      SET datestyle TO dmy
    expect: ok
  - sql: |
      SELECT date '01/02/03' AS d
    expect: rows
    comment: same literal, read as day/month/year
  - sql: |
      SELECT date '18/1/1999' AS d
    expect: rows
    comment: only day/month/year can hold day 18 first
  - sql: |
      SET datestyle TO ymd
    expect: ok
  - sql: |
      SELECT date '1999 01 08' AS d
    expect: rows
