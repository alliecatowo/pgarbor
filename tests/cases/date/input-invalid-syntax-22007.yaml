# Input that is not a date at all is a syntax error for type date.
id: date.input-invalid-syntax-22007
title: Non-date text input raises invalid_datetime_format
family: date
tier: core
feature_ids: [date-type, date-input, errors]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql; errcodes 22007"
sessions: [a]
steps:
  - sql: |
      SELECT date 'garbage'
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT date '1999-01-08'
    expect: rows
    comment: session remains usable after the error (autocommit)
