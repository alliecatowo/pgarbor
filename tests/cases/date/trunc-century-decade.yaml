# date_trunc on date input, including BC inputs.
id: date.trunc-century-decade
title: date_trunc to millennium, century and decade on date and timestamp inputs
family: date
tier: extended
feature_ids: [date-type, date-trunc, bc-dates]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT DATE_TRUNC('MILLENNIUM', DATE '1970-03-20') AS mil,
             DATE_TRUNC('CENTURY', DATE '1970-03-20') AS cen_1970,
             DATE_TRUNC('CENTURY', DATE '2004-08-10') AS cen_2004,
             DATE_TRUNC('CENTURY', DATE '0002-02-04') AS cen_0002,
             DATE_TRUNC('CENTURY', DATE '0055-08-10 BC') AS cen_0055bc,
             DATE_TRUNC('DECADE', DATE '1993-12-25') AS dec_1993,
             DATE_TRUNC('DECADE', DATE '0004-12-25') AS dec_0004,
             DATE_TRUNC('DECADE', DATE '0002-12-31 BC') AS dec_0002bc
    expect: rows
  - sql: |
      SELECT DATE_TRUNC('CENTURY', TIMESTAMP '1970-03-20 04:30:00.00000') AS ts_cen
    expect: rows
