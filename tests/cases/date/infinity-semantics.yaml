# Special values infinity and -infinity: ordering, isfinite, and EXTRACT results.
id: date.infinity-semantics
title: Infinite dates order around finite dates, and EXTRACT maps them to NULL or Infinity
family: date
tier: core
feature_ids: [date-type, infinity, extract, date-comparison]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'infinity'::date AS pos, '-infinity'::date AS neg
    expect: rows
  - sql: |
      SELECT 'infinity'::date > 'epoch'::date AS gt_epoch,
             '-infinity'::date < 'epoch'::date AS lt_epoch,
             'infinity'::date = '+infinity'::date AS pos_eq
    expect: rows
  - sql: |
      SELECT isfinite('infinity'::date) AS f_pos, isfinite('-infinity'::date) AS f_neg, isfinite('epoch'::date) AS f_epoch
    expect: rows
  - sql: |
      SELECT EXTRACT(DAY FROM DATE 'infinity') AS day_pos,
             EXTRACT(MONTH FROM DATE '-infinity') AS month_neg,
             EXTRACT(DOW FROM DATE 'infinity') AS dow_pos
    expect: rows
    comment: oscillating fields are NULL for infinite dates
  - sql: |
      SELECT EXTRACT(EPOCH FROM DATE 'infinity') AS ep_pos,
             EXTRACT(EPOCH FROM DATE '-infinity') AS ep_neg,
             EXTRACT(YEAR FROM DATE 'infinity') AS year_pos
    expect: rows
    comment: monotonic fields are Infinity or -Infinity
