# Fields that are not defined for date are errors: unknown units give 22023, defined-but-unsupported units give 0A000.
id: date.extract-unsupported-field
title: EXTRACT rejects sub-day units for date with SQLSTATE 22023 or 0A000
family: date
tier: extended
feature_ids: [date-type, extract, date-part, errors]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT EXTRACT(MICROSEC FROM DATE '2020-08-11')
    expect: error
    sqlstate: "22023"
    comment: microsecond is not a recognized unit at all (not just unsupported for date)
  - sql: |
      SELECT EXTRACT(HOUR FROM DATE '2020-08-11') AS h
    expect: error
    sqlstate: "0A000"
    comment: hour is a recognized unit but is not supported for type date
