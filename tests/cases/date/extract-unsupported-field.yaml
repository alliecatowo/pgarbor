# A field that is not defined for date is an error; a field that is defined yields zero.
id: date.extract-unsupported-field
title: EXTRACT rejects sub-day units for date but accepts HOUR as zero
family: date
tier: extended
feature_ids: [date-type, extract, date-part, errors]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
steps:
  - sql: |
      SELECT EXTRACT(MICROSEC FROM DATE '2020-08-11')
    expect: error
    comment: microsecond unit is not supported for type date; SQLSTATE left unspecified
  - sql: |
      SELECT EXTRACT(HOUR FROM DATE '2020-08-11') AS h
    expect: rows
