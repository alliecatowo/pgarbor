# Stored dates (leap days, BC) filtered with < and BETWEEN.
id: date.table-filter-between
title: Date column keeps leap days and BC values; comparison and BETWEEN filters
family: date
tier: core
feature_ids: [date-type, date-input, date-comparison, between]
required_capabilities: [create-table, insert, select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql"
sessions: [a]
setup: |
  CREATE TABLE DATE_TBL (f1 date);
  INSERT INTO DATE_TBL VALUES ('1957-04-09'), ('1996-02-28'), ('1996-02-29'), ('1996-03-01'), ('2000-04-01'), ('2000-04-02'), ('2038-04-08'), ('2040-04-10 BC');
steps:
  - sql: |
      SELECT f1 FROM DATE_TBL ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM DATE_TBL WHERE f1 < '2000-01-01' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM DATE_TBL WHERE f1 BETWEEN '2000-01-01' AND '2001-01-01' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM DATE_TBL WHERE f1 BETWEEN '1996-02-29' AND '1996-03-01' ORDER BY f1
    expect: rows
    order: ordered
