# Syntactically well-formed dates whose field values are out of range.
id: date.input-field-overflow-22008
title: Impossible day or month in a date literal raises datetime_field_overflow
family: date
tier: core
feature_ids: [date-type, date-input, errors, leap-years]
required_capabilities: [select, date-type]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/date.sql; errcodes 22008"
sessions: [a]
steps:
  - sql: |
      SELECT date '1999-02-29' AS d
    expect: error
    sqlstate: "22008"
    comment: 1999 is not a leap year
  - sql: |
      SELECT date '2000-02-29' AS d
    expect: rows
    comment: 2000 is a leap year
  - sql: |
      SELECT date '1999-13-01' AS d
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT date '1999-04-31' AS d
    expect: error
    sqlstate: "22008"
