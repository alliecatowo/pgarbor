# Derived from PostgreSQL 18 src/test/regress/sql/select_implicit.sql (ORDER BY / GROUP BY
# resjunk handling). Rewritten as a compact self-contained case; no expected values.
id: select-implicit.self-join-qualified-group-order
title: "Qualified grouping column across a self-join, grouped and ordered"
family: select-implicit
tier: core
feature_ids: [select, joins, group-by, aggregates, order-by]
required_capabilities: [create-table, insert, select, joins, group-by, aggregates, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_implicit.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE tm (a int, b int, c text, d text);
  INSERT INTO tm VALUES (0, 1, 'XXXX', 'A'), (1, 2, 'ABAB', 'b'), (2, 2, 'ABAB', 'c'), (3, 3, 'BBBB', 'D'), (4, 3, NULL, 'e'), (5, 3, 'bbbb', NULL);
steps:
  - sql: |
      SELECT x.b, count(*) FROM tm x, tm y WHERE x.a = y.a GROUP BY x.b ORDER BY x.b
    expect: rows
    order: ordered
