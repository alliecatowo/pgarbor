# Derived from PostgreSQL 18 src/test/regress/sql/select_implicit.sql (ORDER BY / GROUP BY
# resjunk handling). Rewritten as a compact self-contained case; no expected values.
id: select-implicit.ctas-group-order-self-join
title: "CREATE TABLE AS over a self-join with GROUP BY and ORDER BY, then read back"
family: select-implicit
tier: extended
feature_ids: [create-table-as, select, joins, group-by, aggregates, order-by]
required_capabilities: [create-table, create-table-as, insert, select, joins, group-by, aggregates, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_implicit.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE tm (a int, b int, c text, d text);
  INSERT INTO tm VALUES (0, 1, 'XXXX', 'A'), (1, 2, 'ABAB', 'b'), (2, 2, 'ABAB', 'c'), (3, 3, 'BBBB', 'D'), (4, 3, NULL, 'e'), (5, 3, 'bbbb', NULL);
steps:
  - sql: |
      CREATE TABLE tm_counts AS SELECT count(*) FROM tm x, tm y WHERE x.a = y.a GROUP BY x.b ORDER BY x.b
    expect: ok
  - sql: |
      SELECT count FROM tm_counts ORDER BY 1
    expect: rows
    order: ordered
