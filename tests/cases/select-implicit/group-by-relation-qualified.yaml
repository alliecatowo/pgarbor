# Derived from PostgreSQL 18 src/test/regress/sql/select_implicit.sql (ORDER BY / GROUP BY
# resjunk handling). Rewritten as a compact self-contained case; no expected values.
id: select-implicit.group-by-relation-qualified
title: "GROUP BY and ORDER BY using a relation-qualified grouping column"
family: select-implicit
tier: core
feature_ids: [select, group-by, aggregates, order-by]
required_capabilities: [create-table, insert, select, group-by, aggregates, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_implicit.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE tm (a int, b int, c text, d text);
  INSERT INTO tm VALUES (0, 1, 'XXXX', 'A'), (1, 2, 'ABAB', 'b'), (2, 2, 'ABAB', 'c'), (3, 3, 'BBBB', 'D'), (4, 3, NULL, 'e'), (5, 3, 'bbbb', NULL);
steps:
  - sql: |
      SELECT tm.b, count(*) FROM tm GROUP BY tm.b ORDER BY b
    expect: rows
    order: ordered
