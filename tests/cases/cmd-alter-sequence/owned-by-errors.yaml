# OWNED BY requires the table to be in the sequence's schema and the column to exist; a failed OWNED BY keeps the previous association.
id: cmd-alter-sequence.owned-by-errors
title: "ALTER SEQUENCE OWNED BY rejects a table in another schema or a missing column and keeps the prior owner link"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, owned-by, errors, drop-table]
required_capabilities: [sequences, create-table, create-schema, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (OWNED BY: same schema)"
sessions: [a]
setup: |
  CREATE SCHEMA oe_other;
  CREATE TABLE oe_t (id int);
  CREATE TABLE oe_other.oe_u (id int);
  CREATE SEQUENCE oe_seq;
  ALTER SEQUENCE oe_seq OWNED BY oe_t.id;
steps:
  - sql: |
      ALTER SEQUENCE oe_seq OWNED BY oe_other.oe_u.id
    expect: error
    sqlstate: "55000"
    comment: the table must be in the same schema as the sequence
  - sql: |
      ALTER SEQUENCE oe_seq OWNED BY oe_t.no_such_col
    expect: error
    sqlstate: "42703"
    comment: the named column does not exist
  - sql: |
      DROP TABLE oe_t
    expect: ok
    comment: the earlier valid OWNED BY association is still in place after both failures
  - sql: |
      SELECT to_regclass('oe_seq') IS NULL AS seq_gone
    expect: rows
    order: ordered
