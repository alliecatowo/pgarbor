# The documented Examples section: restart a sequence at 105, the next nextval returns 105.
id: cmd-alter-sequence.docs-example-restart-with
title: "ALTER SEQUENCE RESTART WITH sets the value returned by the next nextval"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, restart, nextval]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (Examples)"
sessions: [a]
setup: |
  CREATE SEQUENCE serial;
steps:
  - sql: |
      ALTER SEQUENCE serial RESTART WITH 105
    expect: ok
  - sql: |
      SELECT nextval('serial')
    expect: rows
    order: ordered
    comment: RESTART WITH makes 105 the next value handed out
