# NO MINVALUE on a descending sequence resolves to the data type minimum (bigint lower limit).
id: cmd-alter-sequence.descending-no-minvalue-type-minimum
title: "ALTER SEQUENCE NO MINVALUE on a descending sequence sets the minimum to the bigint lower limit"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, no-minvalue, increment, nextval, boundary]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (NO MINVALUE)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_desc INCREMENT BY -1 START WITH -1 MINVALUE -5;
steps:
  - sql: |
      SELECT min_value, max_value FROM pg_sequences WHERE sequencename = 's_desc'
    expect: rows
    order: ordered
    comment: explicit MINVALUE -5 is in force before the change
  - sql: |
      ALTER SEQUENCE s_desc NO MINVALUE
    expect: ok
  - sql: |
      SELECT min_value, max_value FROM pg_sequences WHERE sequencename = 's_desc'
    expect: rows
    order: ordered
    comment: a descending sequence's default minimum is the bigint lower limit
  - sql: |
      SELECT nextval('s_desc'), nextval('s_desc')
    expect: rows
    order: ordered
    comment: the sequence keeps counting down from its position
