# RESTART with no value uses the start value recorded by CREATE SEQUENCE or last set by ALTER ... START WITH.
id: cmd-alter-sequence.restart-without-value-uses-start
title: "Bare RESTART returns to the recorded START WITH value, including one changed by ALTER SEQUENCE"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, restart, start-with, nextval]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (RESTART, START WITH)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_restart START WITH 10;
steps:
  - sql: |
      SELECT nextval('s_restart'), nextval('s_restart')
    expect: rows
    order: ordered
    comment: the sequence has advanced to 11
  - sql: |
      ALTER SEQUENCE s_restart RESTART
    expect: ok
    comment: no value given, so the recorded start (10) is used
  - sql: |
      SELECT nextval('s_restart')
    expect: rows
    order: ordered
  - sql: |
      ALTER SEQUENCE s_restart START WITH 50
    expect: ok
  - sql: |
      ALTER SEQUENCE s_restart RESTART
    expect: ok
  - sql: |
      SELECT nextval('s_restart')
    expect: rows
    order: ordered
    comment: the recorded start is now 50
