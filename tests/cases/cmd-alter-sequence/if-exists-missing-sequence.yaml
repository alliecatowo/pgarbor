# IF EXISTS turns a missing sequence into a notice; without it the same command is an error.
id: cmd-alter-sequence.if-exists-missing-sequence
title: "ALTER SEQUENCE IF EXISTS on a missing sequence issues a notice; without IF EXISTS it fails"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, if-exists, errors, notice]
required_capabilities: [sequences, select, errors, notice]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (IF EXISTS)"
sessions: [a]
steps:
  - sql: |
      ALTER SEQUENCE IF EXISTS no_such_seq RESTART WITH 5
    expect: notice
    comment: a notice is issued and the command succeeds
  - sql: |
      ALTER SEQUENCE no_such_seq RESTART WITH 5
    expect: error
    sqlstate: "42P01"
    comment: without IF EXISTS a missing relation is an error
  - sql: |
      SELECT to_regclass('no_such_seq') IS NULL AS still_missing
    expect: rows
    order: ordered
    comment: IF EXISTS does not create anything
