# AS changes the type; default min/max follow the new type only when the old bounds were the old type's limits.
id: cmd-alter-sequence.as-datatype-default-bounds
title: "ALTER SEQUENCE AS moves default min and max to the new integer type limits"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, as-data-type, minvalue, maxvalue, sequence-data-type]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (AS data_type)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_type;
steps:
  - sql: |
      SELECT data_type, min_value, max_value FROM pg_sequences WHERE sequencename = 's_type'
    expect: rows
    order: ordered
    comment: default bigint sequence, bounds are the bigint limits
  - sql: |
      ALTER SEQUENCE s_type AS smallint
    expect: ok
  - sql: |
      SELECT data_type, min_value, max_value FROM pg_sequences WHERE sequencename = 's_type'
    expect: rows
    order: ordered
    comment: bounds were the bigint limits, so they become the smallint limits
  - sql: |
      ALTER SEQUENCE s_type AS integer
    expect: ok
  - sql: |
      SELECT data_type, min_value, max_value FROM pg_sequences WHERE sequencename = 's_type'
    expect: rows
    order: ordered
    comment: the previous bounds were the smallint limits, so they follow the change to integer
  - sql: |
      ALTER SEQUENCE s_type AS bigint
    expect: ok
  - sql: |
      SELECT data_type, min_value, max_value FROM pg_sequences WHERE sequencename = 's_type'
    expect: rows
    order: ordered
