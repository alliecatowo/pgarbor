# SET UNLOGGED and SET LOGGED toggle persistence on a permanent sequence; a temporary sequence cannot be changed.
id: cmd-alter-sequence.set-unlogged-logged-temp-rejected
title: "ALTER SEQUENCE SET UNLOGGED/LOGGED toggles persistence; a temporary sequence is rejected"
family: cmd-alter-sequence
tier: extended
feature_ids: [alter-sequence, set-unlogged, set-logged, temporary-sequence, errors]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (SET { LOGGED | UNLOGGED })"
sessions: [a]
setup: |
  CREATE SEQUENCE lg_seq;
steps:
  - sql: |
      ALTER SEQUENCE lg_seq SET UNLOGGED
    expect: ok
  - sql: |
      SELECT relpersistence FROM pg_class WHERE relname = 'lg_seq'
    expect: rows
    order: ordered
    comment: u means unlogged
  - sql: |
      ALTER SEQUENCE lg_seq SET LOGGED
    expect: ok
  - sql: |
      SELECT relpersistence FROM pg_class WHERE relname = 'lg_seq'
    expect: rows
    order: ordered
    comment: p means permanent (logged)
  - sql: |
      CREATE TEMP SEQUENCE tmp_lg_seq
    expect: ok
  - sql: |
      DO $$ BEGIN ALTER SEQUENCE tmp_lg_seq SET UNLOGGED; EXCEPTION WHEN others THEN RAISE NOTICE '% %', SQLSTATE, SQLERRM; END $$
    expect: notice
    comment: a temporary sequence cannot change its logged status; the error is caught in a DO block so the notice carries SQLSTATE 42P16 and the message without the per-session pg_temp_N schema name
