# A zero increment is invalid; the failed ALTER leaves the existing increment in place.
id: cmd-alter-sequence.increment-zero-rejected
title: "ALTER SEQUENCE INCREMENT 0 fails with invalid_parameter_value and keeps the old step"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, increment, errors]
required_capabilities: [sequences, select, errors]
provenance:
  source: hand
  ref: "ref/alter_sequence.sgml#sql-altersequence (INCREMENT BY; boundary value)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_zero INCREMENT BY 2;
steps:
  - sql: |
      ALTER SEQUENCE s_zero INCREMENT BY 0
    expect: error
    sqlstate: "22023"
    comment: INCREMENT must not be zero
  - sql: |
      ALTER SEQUENCE s_zero INCREMENT 0
    expect: error
    sqlstate: "22023"
    comment: same rule without the optional BY
  - sql: |
      SELECT increment_by FROM pg_sequences WHERE sequencename = 's_zero'
    expect: rows
    order: ordered
    comment: the increment of 2 is still in force
