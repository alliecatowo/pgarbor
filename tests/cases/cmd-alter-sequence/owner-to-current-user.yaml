# OWNER TO CURRENT_USER is accepted by the owner and leaves the sequence owned by the session user.
id: cmd-alter-sequence.owner-to-current-user
title: "ALTER SEQUENCE OWNER TO CURRENT_USER succeeds and the owner is the current user"
family: cmd-alter-sequence
tier: extended
feature_ids: [alter-sequence, owner-to]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (OWNER TO; Description)"
sessions: [a]
setup: |
  CREATE SEQUENCE ow_seq;
steps:
  - sql: |
      ALTER SEQUENCE ow_seq OWNER TO CURRENT_USER
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(c.relowner) = current_user AS owned_by_current
      FROM pg_class c WHERE c.relname = 'ow_seq'
    expect: rows
    order: ordered
  - sql: |
      SELECT nextval('ow_seq')
    expect: rows
    order: ordered
    comment: ownership change does not disturb the sequence
