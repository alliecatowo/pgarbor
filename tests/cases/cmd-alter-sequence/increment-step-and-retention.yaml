# INCREMENT changes the step for later nextval calls; options not named in the command keep their prior settings.
id: cmd-alter-sequence.increment-step-and-retention
title: "ALTER SEQUENCE INCREMENT changes the step size and retains unspecified options"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, increment, minvalue, maxvalue, cache, nextval]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (INCREMENT BY; Description: retain prior settings)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_inc START WITH 1 MINVALUE 1 MAXVALUE 1000 CACHE 4;
steps:
  - sql: |
      ALTER SEQUENCE s_inc INCREMENT 3
    expect: ok
    comment: BY is optional
  - sql: |
      SELECT nextval('s_inc') AS v ORDER BY 1
    expect: rows
    order: ordered
    comment: a single step of 3 is applied immediately in the current backend
  - sql: |
      SELECT nextval('s_inc'), nextval('s_inc'), nextval('s_inc')
    expect: rows
    order: ordered
  - sql: |
      ALTER SEQUENCE s_inc INCREMENT BY 10
    expect: ok
  - sql: |
      SELECT nextval('s_inc')
    expect: rows
    order: ordered
  - sql: |
      SELECT increment_by, min_value, max_value, cache_size, start_value
      FROM pg_sequences WHERE sequencename = 's_inc'
    expect: rows
    order: ordered
    comment: MINVALUE, MAXVALUE, CACHE and START are unchanged by the INCREMENT commands
