# ALTER SEQUENCE refuses a table, and ALTER TABLE refuses table-only actions on a sequence.
id: cmd-alter-sequence.table-not-sequence-error
title: "ALTER SEQUENCE on a table fails with wrong object type; table-only ALTER TABLE actions fail on a sequence"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, alter-table, errors]
required_capabilities: [sequences, create-table, alter-table, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (Notes: ALTER TABLE used with sequences)"
sessions: [a]
setup: |
  CREATE TABLE nt_tab (id int);
  CREATE SEQUENCE nt_seq;
steps:
  - sql: |
      ALTER SEQUENCE nt_tab RESTART WITH 5
    expect: error
    sqlstate: "42809"
    comment: nt_tab is a table, not a sequence
  - sql: |
      ALTER TABLE nt_seq ADD COLUMN extra int
    expect: error
    sqlstate: "42809"
    comment: ADD COLUMN is not an action allowed on a sequence
  - sql: |
      ALTER TABLE nt_seq RENAME TO nt_seq2
    expect: ok
    comment: RENAME is one of the ALTER TABLE forms that applies to sequences
  - sql: |
      SELECT to_regclass('nt_seq2') IS NOT NULL AS renamed
    expect: rows
    order: ordered
