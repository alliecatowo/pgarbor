# START WITH changes only the recorded start; current value and currval are untouched until RESTART.
id: cmd-alter-sequence.start-with-keeps-current-value
title: "ALTER SEQUENCE START WITH leaves currval and the next nextval alone, and only affects a later RESTART"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, start-with, currval, nextval, restart]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (START WITH; Notes: currval)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_start START 1;
steps:
  - sql: |
      SELECT nextval('s_start')
    expect: rows
    order: ordered
  - sql: |
      ALTER SEQUENCE s_start START WITH 100
    expect: ok
  - sql: |
      SELECT currval('s_start')
    expect: rows
    order: ordered
    comment: ALTER SEQUENCE does not affect currval
  - sql: |
      SELECT nextval('s_start')
    expect: rows
    order: ordered
    comment: the next value continues from the old sequence position, not from 100
  - sql: |
      ALTER SEQUENCE s_start RESTART
    expect: ok
  - sql: |
      SELECT nextval('s_start')
    expect: rows
    order: ordered
    comment: only the RESTART that follows moves the sequence to 100
