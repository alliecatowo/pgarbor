# OWNED BY ties the sequence's lifetime to a column; OWNED BY NONE makes it free-standing again.
id: cmd-alter-sequence.owned-by-drop-table-and-none
title: "OWNED BY makes DROP TABLE drop the sequence; OWNED BY NONE keeps it after the table is dropped"
family: cmd-alter-sequence
tier: core
feature_ids: [alter-sequence, owned-by, drop-table, drop-sequence]
required_capabilities: [sequences, create-table, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_sequence.sgml#sql-altersequence (OWNED BY)"
sessions: [a]
setup: |
  CREATE TABLE ob_a (id int);
  CREATE SEQUENCE ob_seq_a;
  CREATE TABLE ob_b (id int);
  CREATE SEQUENCE ob_seq_b;
steps:
  - sql: |
      ALTER SEQUENCE ob_seq_a OWNED BY ob_a.id
    expect: ok
  - sql: |
      DROP TABLE ob_a
    expect: ok
  - sql: |
      SELECT to_regclass('ob_seq_a') IS NULL AS seq_gone
    expect: rows
    order: ordered
    comment: the owned sequence was dropped with its table
  - sql: |
      ALTER SEQUENCE ob_seq_b OWNED BY ob_b.id
    expect: ok
  - sql: |
      ALTER SEQUENCE ob_seq_b OWNED BY NONE
    expect: ok
  - sql: |
      DROP TABLE ob_b
    expect: ok
  - sql: |
      SELECT to_regclass('ob_seq_b') IS NULL AS seq_gone
    expect: rows
    order: ordered
    comment: free-standing sequence survives the table drop
