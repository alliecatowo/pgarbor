# ALTER STATISTICS ... RENAME TO changes the name; the old name no longer resolves.
id: cmd-alter-statistics.rename-basic
title: "ALTER STATISTICS RENAME TO renames the object and retires the old name"
family: cmd-alter-statistics
tier: core
feature_ids: [alter-statistics, rename-statistics, extended-statistics]
required_capabilities: [create-table, alter-statistics, extended-statistics, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_statistics.sgml#sql-alterstatistics (RENAME TO new_name)"
sessions: [a]
setup: |
  CREATE TABLE ast_rb (a int, b int, c text);
  CREATE STATISTICS ast_rb_s1 (ndistinct) ON a, b FROM ast_rb;
steps:
  - sql: |
      ALTER STATISTICS ast_rb_s1 RENAME TO ast_rb_s2
    expect: ok
  - sql: |
      SELECT stxname, stxkind FROM pg_statistic_ext WHERE stxrelid = 'ast_rb'::regclass ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      ALTER STATISTICS ast_rb_s1 RENAME TO ast_rb_s3
    expect: error
    sqlstate: "42704"
    comment: the old name no longer exists
