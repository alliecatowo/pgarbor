# A target of 0 makes ANALYZE skip the object; restoring DEFAULT makes ANALYZE compute ndistinct again.
id: cmd-alter-statistics.set-statistics-zero-stops-ndistinct
title: "Statistics target 0 suppresses ANALYZE data and DEFAULT restores it"
family: cmd-alter-statistics
tier: core
feature_ids: [alter-statistics, statistics-target, analyze, ndistinct-statistics]
required_capabilities: [create-table, alter-table, insert, alter-statistics, extended-statistics, analyze, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_statistics.sgml#sql-alterstatistics (new_target applies to subsequent ANALYZE)"
sessions: [a]
setup: |
  CREATE TABLE ast_zt (a int, b int);
  ALTER TABLE ast_zt SET (autovacuum_enabled = false);
  INSERT INTO ast_zt SELECT i, i % 7 FROM generate_series(1, 1000) g(i);
  CREATE STATISTICS ast_zt_s1 (ndistinct) ON a, b FROM ast_zt;
steps:
  - sql: |
      ALTER STATISTICS ast_zt_s1 SET STATISTICS 0
    expect: ok
  - sql: |
      ANALYZE ast_zt
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_statistic_ext_data d JOIN pg_statistic_ext e ON e.oid = d.stxoid WHERE e.stxname = 'ast_zt_s1'
    expect: rows
    order: ordered
    comment: no data row is built for a zero target
  - sql: |
      ALTER STATISTICS ast_zt_s1 SET STATISTICS DEFAULT
    expect: ok
  - sql: |
      ANALYZE ast_zt
    expect: ok
  - sql: |
      SELECT count(*), bool_and(d.stxdndistinct IS NOT NULL) FROM pg_statistic_ext_data d JOIN pg_statistic_ext e ON e.oid = d.stxoid WHERE e.stxname = 'ast_zt_s1'
    expect: rows
    order: ordered
    comment: ndistinct is computed again under the default target
