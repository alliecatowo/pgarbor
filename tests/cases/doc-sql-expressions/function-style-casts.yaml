# Function-style type casts: only names that are valid function names work, and the quoting rules for interval and double precision.
id: doc-sql-expressions.function-style-casts
title: Function-style casts accept float8 and quoted interval but reject double precision and unquoted interval
family: doc-sql-expressions
tier: extended
feature_ids: [type-casts, cast-syntax, errors]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-expressions-type-casts"
sessions: [a]
steps:
  - sql: |
      SELECT float8('3.5') AS a
    expect: rows
    order: ordered
    comment: float8 is a valid function name, so the function-style spelling works
  - sql: |
      SELECT "interval"('1 day') AS i
    expect: rows
    order: ordered
    comment: quoting interval makes the function-style form parse
  - sql: |
      SELECT double precision('3.5')
    expect: error
    sqlstate: "42601"
    comment: double precision cannot be used as a function name
  - sql: |
      SELECT interval('1 day') AS i
    expect: error
    sqlstate: "42601"
    comment: unquoted interval is a syntax conflict in function-style position
