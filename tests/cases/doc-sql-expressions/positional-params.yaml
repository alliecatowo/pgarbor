# Positional parameters: $n in prepared statements and extended-protocol binds, including subscripting and slicing a parameter.
id: doc-sql-expressions.positional-params
title: Positional parameter references in prepared statements and bound queries
family: doc-sql-expressions
tier: core
feature_ids: [positional-parameters, prepared-statements, extended-protocol, subscripts]
required_capabilities: [select, prepared-statements, extended-protocol]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-expressions-parameters-positional"
sessions: [a]
steps:
  - sql: |
      PREPARE p(int4[]) AS SELECT $1[2] AS e
    expect: ok
  - sql: |
      EXECUTE p('{1,2,3}')
    expect: rows
    order: ordered
    comment: a parameter can be subscripted when its type is known
  - sql: |
      PREPARE q(text) AS SELECT $1 || 'x' AS s
    expect: ok
  - sql: |
      EXECUTE q('abc')
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT $1::int4 + $2::int4 AS s
      params: ["3", "4"]
      param_types: [23, 23]
    expect: rows
    order: ordered
    comment: unnamed-statement bind with explicit parameter types
  - exec_params:
      sql: |
        SELECT $1[2:3] AS s
      params: ["{1,2,3,4}"]
      param_types: [1007]
    expect: rows
    order: ordered
    comment: a slice of a bound int4[] parameter
