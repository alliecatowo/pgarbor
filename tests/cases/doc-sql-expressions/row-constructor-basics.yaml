# Row constructors: the ROW keyword is optional, comparison of rows, and .* expansion inside a row constructor.
id: doc-sql-expressions.row-constructor-basics
title: Row constructors with and without ROW, comparison, and .* expansion
family: doc-sql-expressions
tier: core
feature_ids: [row-constructors, row-comparison, field-selection]
required_capabilities: [select, create-table, insert]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-expressions-row-constructors"
sessions: [a]
setup: |
  CREATE TABLE rt (f1 int4, f2 float8);
  INSERT INTO rt VALUES (1, 2.5), (2, 3.5);
steps:
  - sql: |
      SELECT ROW(1,2.5,'this is a test') AS r
    expect: rows
    order: ordered
    comment: the documented row constructor example
  - sql: |
      SELECT (1,2) = ROW(1,2) AS eq1, ROW(1,2) = ROW(1,2) AS eq2
    expect: rows
    order: ordered
    comment: the ROW keyword is optional when there is more than one expression
  - sql: |
      SELECT ROW(1,NULL) = ROW(1,2) AS eq3
    expect: rows
    order: ordered
    comment: a NULL field makes the row comparison NULL
  - sql: |
      SELECT ROW(t.*, 42) = ROW(t.f1, t.f2, 42) AS same FROM rt t ORDER BY t.f1
    expect: rows
    order: ordered
    comment: rowvalue.* expands in the row constructor, so both spellings are equal
  - sql: |
      SELECT ROW(t.*, 42) AS r FROM rt t WHERE f1 = 1
    expect: rows
    order: ordered
    comment: the result is a flat four-field row
