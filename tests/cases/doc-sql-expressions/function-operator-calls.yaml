# Function calls with named and positional arguments, operator invocation including OPERATOR(schema.op), and operator precedence.
id: doc-sql-expressions.function-operator-calls
title: Function calls with named notation, operator invocation and operator precedence
family: doc-sql-expressions
tier: core
feature_ids: [function-calls, named-arguments, operator-invocation, operator-precedence, errors]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-expressions-function-calls"
sessions: [a]
steps:
  - sql: |
      SELECT sqrt(2) AS r
    expect: rows
    order: ordered
    comment: the documented square root example
  - sql: |
      SELECT round(2.5) AS a, round(-2.5) AS b, power(2, 10) AS c
    expect: rows
    order: ordered
    comment: numeric round rounds halves away from zero
  - sql: |
      SELECT make_date(year => 2024, month => 2, day => 29) AS d, make_date(2024, 2, day => 29) AS e
    expect: rows
    order: ordered
    comment: named arguments may follow positional ones
  - sql: |
      SELECT make_date(day => 29, 2024, 2) AS d
    expect: error
    sqlstate: "42601"
    comment: a positional argument cannot follow a named one
  - sql: |
      SELECT 1 OPERATOR(pg_catalog.+) 2 AS three, OPERATOR(pg_catalog.-) 5 AS neg
    expect: rows
    order: ordered
    comment: schema-qualified operator invocation, binary and prefix
  - sql: |
      SELECT 2 ^ 3 AS p, 7 % 3 AS m, -7 % 3 AS n, 1 + 2 * 3 - 4 / 2 AS q
    expect: rows
    order: ordered
    comment: exponentiation, modulo sign and multiplicative precedence
  - sql: |
      SELECT @ -5 AS absval, |/ 16 AS root
    expect: rows
    order: ordered
    comment: prefix operators
  - sql: |
      SELECT ARRAY[1,2] OPERATOR(pg_catalog.||) 3 AS a
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 <-> 2
    expect: error
    sqlstate: "42883"
    comment: an operator that is not defined for these argument types
  - sql: |
      SELECT 1 + 'x'
    expect: error
    sqlstate: "22P02"
    comment: an untyped literal is coerced to integer and fails
