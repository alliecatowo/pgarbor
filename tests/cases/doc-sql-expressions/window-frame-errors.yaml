# Documented restrictions on window frame bounds and on the offset requirements per frame mode.
id: doc-sql-expressions.window-frame-errors
title: Window frame restrictions and offset requirements raise documented errors
family: doc-sql-expressions
tier: core
feature_ids: [window-functions, window-frames, errors]
required_capabilities: [select, window-functions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-expressions-window-calls"
sessions: [a]
setup: |
  CREATE TABLE wf (x int4, y int4);
  INSERT INTO wf VALUES (1, 5), (1, 6), (2, 7), (3, 8);
steps:
  - sql: |
      SELECT sum(y) OVER (ORDER BY x ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) FROM wf ORDER BY x, y
    expect: rows
    order: ordered
    comment: positive control for the error cases below
  - sql: |
      SELECT sum(y) OVER (ORDER BY x ROWS BETWEEN -1 PRECEDING AND CURRENT ROW) FROM wf
    expect: error
    sqlstate: "22013"
    comment: ROWS offsets must be non-negative
  - sql: |
      SELECT sum(y) OVER (RANGE BETWEEN 1 PRECEDING AND CURRENT ROW) FROM wf
    expect: error
    sqlstate: "42P20"
    comment: RANGE with an offset needs exactly one ORDER BY column
  - sql: |
      SELECT sum(y) OVER (ORDER BY x, y RANGE BETWEEN 1 PRECEDING AND CURRENT ROW) FROM wf
    expect: error
    sqlstate: "42P20"
  - sql: |
      SELECT sum(y) OVER (GROUPS BETWEEN 1 PRECEDING AND CURRENT ROW) FROM wf
    expect: error
    sqlstate: "42P20"
    comment: GROUPS mode requires an ORDER BY clause
  - sql: |
      SELECT sum(y) OVER (ORDER BY x RANGE BETWEEN CURRENT ROW AND 1 PRECEDING) FROM wf
    expect: error
    sqlstate: "42P20"
    comment: a frame that starts at the current row cannot have preceding rows
  - sql: |
      SELECT sum(y) OVER (ORDER BY x ROWS BETWEEN UNBOUNDED FOLLOWING AND CURRENT ROW) FROM wf
    expect: error
    sqlstate: "42P20"
    comment: frame start cannot be UNBOUNDED FOLLOWING
  - sql: |
      SELECT sum(y) OVER (ORDER BY x ROWS BETWEEN CURRENT ROW AND UNBOUNDED PRECEDING) FROM wf
    expect: error
    sqlstate: "42P20"
    comment: frame end cannot be UNBOUNDED PRECEDING
  - sql: |
      SELECT sum(y) OVER (w) FROM wf WINDOW w AS (ORDER BY x ROWS UNBOUNDED PRECEDING)
    expect: error
    sqlstate: "42P20"
    comment: OVER (w) copies the window and is rejected when w has a frame clause
  - sql: |
      SELECT sum(y) OVER w FROM wf WINDOW w AS (ORDER BY x ROWS UNBOUNDED PRECEDING) ORDER BY x, y
    expect: rows
    order: ordered
    comment: OVER w (no parentheses) references the frame without copying it
