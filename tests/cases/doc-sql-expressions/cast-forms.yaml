# The three documented cast spellings (CAST, ::, function-style), string-literal initial typing, and run-time cast failures.
id: doc-sql-expressions.cast-forms
title: "CAST, :: and function-style casts, including run-time conversion failures"
family: doc-sql-expressions
tier: core
feature_ids: [type-casts, cast-syntax, errors]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-expressions-type-casts"
sessions: [a]
steps:
  - sql: |
      SELECT CAST('12' AS int4) AS a, '12'::int4 AS b, int4('12') AS c, CAST(' 7 ' AS int4) AS d
    expect: rows
    order: ordered
    comment: all three spellings invoke the same conversion; surrounding blanks are accepted for int4
  - sql: |
      SELECT float8 '3.5' AS a, CAST(2 AS float8) / 4 AS b
    expect: rows
    order: ordered
    comment: an unadorned string literal is typed directly by the cast
  - sql: |
      SELECT CAST('1 day' AS interval) AS a, '1 day'::interval AS b
    expect: rows
    order: ordered
  - sql: |
      SELECT CAST(1.5 AS int4) AS r
    expect: rows
    order: ordered
    comment: numeric to integer rounds half away from zero
  - sql: |
      SELECT 'abc'::int4
    expect: error
    sqlstate: "22P02"
    comment: a run-time cast of an invalid literal fails with invalid input syntax
  - sql: |
      SELECT CAST(point '(1,2)' AS int4)
    expect: error
    sqlstate: "42846"
    comment: no cast is defined between point and integer
