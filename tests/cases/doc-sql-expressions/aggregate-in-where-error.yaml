# Aggregate expressions are only allowed in the result list or HAVING clause, never in WHERE.
id: doc-sql-expressions.aggregate-in-where-error
title: Aggregate in WHERE is rejected while the same aggregate in HAVING is allowed
family: doc-sql-expressions
tier: core
feature_ids: [aggregate-expressions, having, errors]
required_capabilities: [select, aggregates]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-expressions-aggregates"
sessions: [a]
setup: |
  CREATE TABLE agg_w (x int4);
  INSERT INTO agg_w VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT count(*) AS n FROM agg_w HAVING count(*) > 1
    expect: rows
    order: ordered
    comment: HAVING may reference aggregates
  - sql: |
      SELECT count(x) FROM agg_w WHERE count(*) > 0
    expect: error
    sqlstate: "42803"
    comment: aggregate expressions are forbidden in WHERE
  - sql: |
      SELECT x FROM agg_w WHERE sum(x) > 1
    expect: error
    sqlstate: "42803"
