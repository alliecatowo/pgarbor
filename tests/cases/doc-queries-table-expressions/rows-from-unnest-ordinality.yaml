# ROWS FROM zips set-returning functions in parallel, padding the shorter with NULLs;
# WITH ORDINALITY adds a 1-based row number; UNNEST accepts several arrays.
id: doc-queries-table-expressions.rows-from-unnest-ordinality
title: ROWS FROM, WITH ORDINALITY and multi-argument UNNEST pad with NULLs and number rows
family: doc-queries-table-expressions
tier: core
feature_ids: [table-functions, rows-from, with-ordinality, unnest]
required_capabilities: [select, json]
provenance:
  source: pg-docs
  ref: "~/develop/reference/postgres-18/doc/src/sgml/queries.sgml#queries-tablefunctions (ROWS FROM, WITH ORDINALITY, UNNEST)"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM ROWS FROM (json_to_recordset('[{"a":40,"b":"foo"},{"a":"100","b":"bar"}]') AS (a INTEGER, b TEXT), generate_series(1, 3)) AS x (p, q, s) ORDER BY p
    expect: rows
    order: ordered
    comment: third row has NULL p and q; default NULL placement puts it last
  - sql: |
      SELECT * FROM generate_series(1, 3) WITH ORDINALITY AS g (v, i) ORDER BY i
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM unnest(ARRAY[1, 2, 3], ARRAY['a', 'b']) WITH ORDINALITY
    expect: rows
    order: multiset
    comment: columns are named unnest, unnest, ordinality; shorter array padded with NULL
  - sql: |
      SELECT * FROM unnest(ARRAY[1, 2], ARRAY['a', 'b']) AS t (n, s) ORDER BY n
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM generate_series(1, 3) WITH ORDINALITY
    expect: rows
    order: multiset
    comment: returns 3
