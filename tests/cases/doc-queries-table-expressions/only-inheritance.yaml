# A table name includes its inheritance children unless ONLY is used; the trailing * spells out the
# default. Selecting from the parent shows only the parent's columns.
id: doc-queries-table-expressions.only-inheritance
title: FROM includes inheritance children by default; ONLY and * control it
family: doc-queries-table-expressions
tier: core
feature_ids: [from-clause, only, table-inheritance]
required_capabilities: [create-table, insert, select, inherits]
provenance:
  source: pg-docs
  ref: "~/develop/reference/postgres-18/doc/src/sgml/queries.sgml#queries-from (ONLY)"
sessions: [a]
setup: |
  CREATE TABLE cities (name text, population int4);
  CREATE TABLE capitals (state char(2)) INHERITS (cities);
  INSERT INTO cities VALUES ('Las Vegas', 2583);
  INSERT INTO capitals VALUES ('Phoenix', 1200, 'AZ');
steps:
  - sql: |
      SELECT name, population FROM cities ORDER BY name
    expect: rows
    order: ordered
    comment: includes the capitals row
  - sql: |
      SELECT name, population FROM ONLY cities ORDER BY name
    expect: rows
    order: ordered
    comment: only the parent's own row
  - sql: |
      SELECT name, population FROM cities * ORDER BY name
    expect: rows
    order: ordered
    comment: explicit * is the same as the default
  - sql: |
      SELECT * FROM cities ORDER BY name
    expect: rows
    order: ordered
    comment: columns are only name and population; state is not shown
  - sql: |
      SELECT * FROM capitals ORDER BY name
    expect: rows
    order: ordered
    comment: the child exposes its extra column
  - sql: |
      SELECT count(*) FROM ONLY capitals
    expect: rows
    order: multiset
