# Column aliases rename the leading columns of a FROM item; fewer aliases than columns is allowed,
# more is an error. Parenthesized joins can be given an alias.
id: doc-queries-table-expressions.alias-column-renames
title: Table and column aliases rename leading columns; too many column aliases is an error
family: doc-queries-table-expressions
tier: core
feature_ids: [table-alias, column-alias, from-clause, errors]
required_capabilities: [create-table, insert, select, join]
provenance:
  source: pg-docs
  ref: "~/develop/reference/postgres-18/doc/src/sgml/queries.sgml#queries-tablefunctions (Table and Column Aliases)"
sessions: [a]
setup: |
  CREATE TABLE t1 (num int4, name text);
  INSERT INTO t1 VALUES (1, 'a'), (2, 'b'), (3, 'c');
steps:
  - sql: |
      SELECT * FROM t1 AS x (p) ORDER BY p
    expect: rows
    order: ordered
    comment: only num is renamed to p; name keeps its name
  - sql: |
      SELECT x.p, x.n FROM t1 AS x (p, n) WHERE x.p > 1
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM (t1 AS a CROSS JOIN t1) AS b
    expect: rows
    order: multiset
    comment: parentheses make the alias apply to the join; returns 9
  - sql: |
      SELECT * FROM t1 AS x (p, n, extra)
    expect: error
    sqlstate: "42P10"
    comment: more column aliases than columns
