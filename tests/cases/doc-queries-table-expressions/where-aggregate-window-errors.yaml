# Aggregates are not allowed in WHERE, and window functions are not allowed in WHERE or HAVING.
# Each error is an autocommit statement, so the session keeps working afterwards.
id: doc-queries-table-expressions.where-aggregate-window-errors
title: Aggregate and window functions in WHERE or HAVING raise SQLSTATE errors
family: doc-queries-table-expressions
tier: core
feature_ids: [where-clause, having-clause, aggregates, window-functions, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "~/develop/reference/postgres-18/doc/src/sgml/queries.sgml#queries-where and #queries-group"
sessions: [a]
setup: |
  CREATE TABLE test1 (x text, y int4);
  INSERT INTO test1 VALUES ('a', 3), ('c', 2), ('b', 5), ('a', 1);
steps:
  - sql: |
      SELECT x FROM test1 WHERE sum(y) > 1
    expect: error
    sqlstate: "42803"
    comment: aggregate functions are not allowed in WHERE
  - sql: |
      SELECT x FROM test1 WHERE y = count(*)
    expect: error
    sqlstate: "42803"
  - sql: |
      SELECT x FROM test1 WHERE row_number() OVER () > 1
    expect: error
    sqlstate: "42P20"
    comment: window functions are not allowed in WHERE
  - sql: |
      SELECT x, count(*) FROM test1 GROUP BY x HAVING row_number() OVER () > 1
    expect: error
    sqlstate: "42P20"
    comment: window functions are not allowed in HAVING
  - sql: |
      SELECT x, sum(y) FROM test1 GROUP BY x HAVING sum(y) > 2 ORDER BY x
    expect: rows
    order: ordered
    comment: aggregates belong in HAVING; session recovered after the errors
  - sql: |
      SELECT x, y, row_number() OVER (ORDER BY y) FROM test1 WHERE y > 1 ORDER BY y
    expect: rows
    order: ordered
    comment: window functions are fine in the select list
