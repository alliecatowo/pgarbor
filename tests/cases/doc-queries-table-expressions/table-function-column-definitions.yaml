# Table functions declared to return record need a column definition list in the query; scalar
# set-returning functions name their single column after the function or the alias.
id: doc-queries-table-expressions.table-function-column-definitions
title: Record-returning table functions require a column definition list
family: doc-queries-table-expressions
tier: extended
feature_ids: [table-functions, column-definition-list, errors]
required_capabilities: [select, json]
provenance:
  source: pg-docs
  ref: "~/develop/reference/postgres-18/doc/src/sgml/queries.sgml#queries-tablefunctions (pseudo-type record)"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM json_to_record('{"a":1,"b":"x"}') AS t (a int4, b text)
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM json_to_record('{"a":1,"b":"x"}')
    expect: error
    sqlstate: "42601"
    comment: a record result without a column definition list cannot be parsed
  - sql: |
      SELECT * FROM json_to_record('{"a":1,"b":"x"}') AS t (a int4, b int4)
    expect: error
    sqlstate: "22P02"
    comment: the text x is not a valid integer
  - sql: |
      SELECT g FROM generate_series(1, 3) g ORDER BY g
    expect: rows
    order: ordered
    comment: a single scalar column takes the alias name
  - sql: |
      SELECT * FROM generate_series(1, 3) AS g (n) ORDER BY n DESC
    expect: rows
    order: ordered
