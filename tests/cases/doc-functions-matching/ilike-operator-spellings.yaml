# ILIKE is case-insensitive; the ~~, ~~*, !~~, !~~* operators are the same as LIKE/ILIKE/NOT LIKE/NOT ILIKE.
id: doc-functions-matching.ilike-operator-spellings
title: ILIKE and the ~~ / ~~* / !~~ / !~~* operator spellings match their keyword forms
family: doc-functions-matching
tier: core
feature_ids: [ilike, like-operators, not-like, pattern-matching]
required_capabilities: [select, like]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-like (ILIKE and operator names ~~, ~~*, !~~, !~~*)"
sessions: [a]
steps:
  - sql: |
      SELECT 'AbC' ILIKE 'abc' AS ilike_ci,
             'AbC' LIKE 'abc' AS like_cs,
             'AbC' ILIKE 'a%' AS ilike_prefix,
             'AbC' ~~* 'abc' AS op_ilike,
             'AbC' ~~ 'abc' AS op_like,
             'abc' !~~ 'a%' AS op_not_like,
             'abc' !~~* 'A%' AS op_not_ilike
    expect: rows
    comment: LIKE is case-sensitive, ILIKE is not; the operator spellings must agree with the keyword forms
  - sql: |
      SELECT x.s, x.p,
             ((x.s ILIKE x.p) = (x.s ~~* x.p)) AS ilike_op_agrees,
             ((x.s NOT ILIKE x.p) = (x.s !~~* x.p)) AS not_ilike_op_agrees,
             ((x.s LIKE x.p) = (x.s ~~ x.p)) AS like_op_agrees
      FROM (VALUES ('AbC', 'abc'), ('AbC', 'a%'), ('xyz', '%Y%'), ('', '_')) AS x(s, p)
    expect: rows
    order: multiset
    comment: every row should report true in the three agreement columns
  - sql: |
      SELECT NULL::text ILIKE 'a' AS ilike_null, 'a' ILIKE NULL::text AS ilike_null_pattern
    expect: rows
    comment: NULL in either operand yields NULL
