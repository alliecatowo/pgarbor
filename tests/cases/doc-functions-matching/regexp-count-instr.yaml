# regexp_count and regexp_instr documented examples, including start, flags, endoption and subexpr parameters.
id: doc-functions-matching.regexp-count-instr
title: regexp_count and regexp_instr documented examples with start, flags, endoption and subexpr
family: doc-functions-matching
tier: core
feature_ids: [regexp-count, regexp-instr, posix-regex, regex-flags]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (regexp_count and regexp_instr examples)"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_count('ABCABCAXYaxy', 'A.') AS case_sensitive_count,
             regexp_count('ABCABCAXYaxy', 'A.', 1, 'i') AS case_insensitive_count
    expect: rows
    comment: documented examples; expected 3 and 4
  - sql: |
      SELECT regexp_instr('number of your street, town zip, FR', '[^,]+', 1, 2) AS second_match_start
    expect: rows
    comment: documented example; expected 23
  - sql: |
      SELECT regexp_instr(string=>'ABCDEFGHI', pattern=>'(c..)(...)', start=>1, "N"=>1, endoption=>0, flags=>'i', subexpr=>2) AS subexpr_start
    expect: rows
    comment: documented named-argument example; expected 6
  - sql: |
      SELECT regexp_instr('ABCDEFGHI', 'C..', 1, 1, 1) AS end_position_after_match,
             regexp_instr('ABCDEFGHI', 'zz') AS no_match_is_zero
    expect: rows
    comment: endoption 1 returns the position after the match; no match returns zero
