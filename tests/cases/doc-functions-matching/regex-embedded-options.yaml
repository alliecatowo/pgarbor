# Regex embedded options (?i), the ***= literal director, the (?x) expanded syntax, and (?#...) comments.
id: doc-functions-matching.regex-embedded-options
title: Embedded regex options, literal director, expanded syntax and comments
family: doc-functions-matching
tier: core
feature_ids: [posix-regex, embedded-options, literal-pattern, expanded-syntax]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (Regular Expression Metasyntax, ARE Embedded-Option Letters)"
sessions: [a]
steps:
  - sql: |
      SELECT 'ABC' ~ '(?i)abc' AS embedded_case_insensitive,
             'ABC' ~ 'abc' AS plain_case_sensitive,
             'ABC' ~* '(?c)abc' AS c_overrides_operator
    expect: rows
    comment: (?i) overrides the case-sensitivity implied by the operator; (?c) forces case-sensitive
  - sql: |
      SELECT 'a.c' ~ '***=a.c' AS literal_match,
             'abc' ~ '***=a.c' AS literal_no_wildcard_match
    expect: rows
    comment: "***= treats the rest of the pattern as a literal string, so the dot is not a wildcard"
  - sql: |
      SELECT 'abc' ~ ('(?x) a  b # comment' || E'\n' || ' c') AS expanded_syntax,
             'abc' ~ '(?#note)abc' AS comment_group
    expect: rows
    comment: expanded syntax ignores whitespace and #-comments; (?#...) is an ignored comment in AREs
