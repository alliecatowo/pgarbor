# Invalid regular expressions and option letters raise documented errors with the expected SQLSTATEs.
id: doc-functions-matching.regex-error-sqlstates
title: Malformed regular expressions and bad regex flags raise invalid-regex errors
family: doc-functions-matching
tier: core
feature_ids: [posix-regex, regex-flags, errors]
required_capabilities: [select, regex, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (Regular Expression Metasyntax and flags; invalid pattern rules)"
sessions: [a]
steps:
  - sql: |
      SELECT 'abc' ~ 'a\'
    expect: error
    sqlstate: "2201B"
    comment: an RE cannot end with a backslash
  - sql: |
      SELECT 'a' ~ '('
    expect: error
    sqlstate: "2201B"
    comment: unbalanced parentheses
  - sql: |
      SELECT 'a' ~ 'a**'
    expect: error
    sqlstate: "2201B"
    comment: a quantifier cannot immediately follow another quantifier
  - sql: |
      SELECT 'a' ~ 'a{2,1}'
    expect: error
    sqlstate: "2201B"
    comment: bound m cannot exceed n
  - sql: |
      SELECT regexp_like('a', 'a', 'z')
    expect: error
    sqlstate: "22023"
    comment: unknown option letter in the flags argument
  - sql: |
      SELECT regexp_replace('a', 'a', 'b', 'z')
    expect: error
    sqlstate: "22023"
    comment: unknown option letter in regexp_replace flags
