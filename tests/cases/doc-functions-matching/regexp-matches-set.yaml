# regexp_matches returns a set: no rows without a match, one row without g, and every match with g.
id: doc-functions-matching.regexp-matches-set
title: regexp_matches returns zero, one, or many rows depending on match count and the g flag
family: doc-functions-matching
tier: core
feature_ids: [regexp-matches, posix-regex, capture-groups, set-returning]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (regexp_matches examples)"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_matches('foo', 'not there') AS m
    expect: rows
    comment: documented example; no match means zero rows
  - sql: |
      SELECT regexp_matches('foobarbequebazilbarfbonk', '(b[^b]+)(b[^b]+)', 'g') AS m
    expect: rows
    order: multiset
    comment: documented example; two matches with the g flag give two rows of two-element arrays
  - sql: |
      SELECT regexp_matches('foobarbequebaz', '(b[^b]+)(b[^b]+)') AS m
    expect: rows
    order: multiset
    comment: without g only the first match is returned, as one row
  - sql: |
      SELECT count(*) AS n FROM regexp_matches('aaa', 'a', 'g') AS m
    expect: rows
    comment: three single-character matches
