# regexp_like and regexp_match: boolean test with flags, and the text[] of the first match with capture groups.
id: doc-functions-matching.regexp-like-and-match
title: regexp_like boolean test and regexp_match first-match text array semantics
family: doc-functions-matching
tier: core
feature_ids: [regexp-like, regexp-match, posix-regex, capture-groups, regex-flags]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (regexp_like and regexp_match examples)"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_like('Hello World', 'world') AS case_sensitive,
             regexp_like('Hello World', 'world', 'i') AS flag_i,
             regexp_like('Hello World', 'world', 'i') = ('Hello World' ~* 'world') AS same_as_operator
    expect: rows
    comment: documented examples; expected false, true, true
  - sql: |
      SELECT regexp_match('foobarbequebaz', 'bar.*que') AS whole_pattern,
             regexp_match('foobarbequebaz', '(bar)(beque)') AS two_groups,
             regexp_match('foo', 'zzz') AS no_match
    expect: rows
    comment: documented examples; expected {barbeque}, {bar,beque}, NULL
  - sql: |
      SELECT regexp_match('ab', '(a)(x)?b') AS unmatched_optional_group
    expect: rows
    comment: a group that does not participate in the match yields a NULL array element
  - sql: |
      SELECT (regexp_match('foobarbequebaz', 'bar.*que'))[1] AS first_element
    expect: rows
    comment: the documented pre-15 idiom for extracting the whole match
