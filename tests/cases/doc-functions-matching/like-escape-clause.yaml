# ESCAPE clause for LIKE: custom escape character, doubled escape, default backslash, and ESCAPE '' disabling escapes.
id: doc-functions-matching.like-escape-clause
title: LIKE ESCAPE clause selects escape character and ESCAPE '' disables it
family: doc-functions-matching
tier: core
feature_ids: [like, like-escape, pattern-matching]
required_capabilities: [select, like]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-like (escaping underscore and percent; ESCAPE '' paragraph)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a_c' LIKE 'a\_c' AS default_escape_underscore,
             'abc' LIKE 'a\_c' AS default_escape_no_literal_underscore,
             'a%c' LIKE 'a\%c' AS default_escape_percent,
             'abc' LIKE 'a\%c' AS default_escape_percent_no_match
    expect: rows
    comment: the default escape character is backslash; the escaped wildcard then matches only the literal character
  - sql: |
      SELECT 'a_c' LIKE 'a#_c' ESCAPE '#' AS custom_escape_underscore,
             'a#c' LIKE 'a##c' ESCAPE '#' AS doubled_custom_escape_matches_literal,
             'a_c' LIKE 'a#_c' AS no_escape_clause_hash_is_literal
    expect: rows
    comment: with ESCAPE '#' the hash escapes the underscore; without ESCAPE, hash is an ordinary character
  - sql: |
      SELECT 'a\c' LIKE 'a\\c' AS doubled_backslash_matches_one_backslash,
             'a\c' LIKE 'a\\c' ESCAPE '' AS escape_disabled_two_backslashes,
             'a\c' LIKE 'a\c' ESCAPE '' AS escape_disabled_literal_backslash
    expect: rows
    comment: ESCAPE '' turns the escape mechanism off, so doubled backslashes no longer collapse
