# substring(... SIMILAR TO ... ESCAPE ...) extracts the part between escape-double-quote separators; NULL when no full match.
id: doc-functions-matching.similar-to-substring-escape
title: Three-argument SIMILAR TO substring extracts the delimited portion or returns NULL
family: doc-functions-matching
tier: core
feature_ids: [similar-to, substring, sql-regex, escape-character]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-similarto-regexp (substring with SIMILAR escape examples)"
sessions: [a]
steps:
  - sql: |
      SELECT substring('foobar' SIMILAR '%#"o_b#"%' ESCAPE '#') AS standard_syntax
    expect: rows
    comment: documented example; expected oob
  - sql: |
      SELECT substring('foobar' SIMILAR '#"o_b#"%' ESCAPE '#') AS no_full_match
    expect: rows
    comment: documented example; pattern does not match the whole string, so NULL
  - sql: |
      SELECT substring('foobar' FROM '%#"o_b#"%' FOR '#') AS sql1999_syntax,
             substring('foobar', '%#"o_b#"%', '#') AS plain_function_syntax
    expect: rows
    comment: legacy and plain three-argument forms return the same result as the standard form
  - sql: |
      SELECT substring('foobar' SIMILAR '%#"o#"%' ESCAPE '#') AS single_separator_extension
    expect: rows
    comment: PostgreSQL allows one separator, leaving the third regex empty
