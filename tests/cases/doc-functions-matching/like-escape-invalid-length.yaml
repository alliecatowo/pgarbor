# ESCAPE must be empty or exactly one character; a longer escape string is an error for LIKE and SIMILAR TO.
id: doc-functions-matching.like-escape-invalid-length
title: LIKE and SIMILAR TO reject an escape string longer than one character
family: doc-functions-matching
tier: core
feature_ids: [like, like-escape, similar-to, errors]
required_capabilities: [select, like, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-like (ESCAPE clause); func.sgml#functions-similarto-regexp"
sessions: [a]
steps:
  - sql: |
      SELECT 'a' LIKE 'a' ESCAPE 'ab'
    expect: error
    sqlstate: "22025"
    comment: invalid escape string; escape must be empty or one character
  - sql: |
      SELECT 'a' SIMILAR TO 'a' ESCAPE 'ab'
    expect: error
    sqlstate: "22025"
    comment: same rule applies to SIMILAR TO
  - sql: |
      SELECT 'a' LIKE 'a' ESCAPE ''
    expect: rows
    comment: a zero-length escape string is accepted by PostgreSQL (nonstandard, as documented)
