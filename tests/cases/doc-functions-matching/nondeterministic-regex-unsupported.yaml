# SIMILAR TO and POSIX regex operators do not support nondeterministic collations; they raise an error.
id: doc-functions-matching.nondeterministic-regex-unsupported
title: SIMILAR TO and POSIX regex operators reject nondeterministic collations
family: doc-functions-matching
tier: extended
feature_ids: [similar-to, posix-regex, collation, nondeterministic-collation, errors]
required_capabilities: [select, regex, collation, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-matching (SIMILAR TO and POSIX do not support nondeterministic collations)"
sessions: [a]
setup: |
  CREATE COLLATION case_insensitive (provider = icu, locale = 'und-u-ks-level2', deterministic = false);
steps:
  - sql: |
      SELECT 'AbC' SIMILAR TO 'abc' COLLATE case_insensitive
    expect: error
    sqlstate: "0A000"
    comment: SIMILAR TO is not supported with a nondeterministic collation
  - sql: |
      SELECT 'AbC' ~ 'abc' COLLATE case_insensitive
    expect: error
    sqlstate: "0A000"
    comment: POSIX ~ is not supported with a nondeterministic collation
  - sql: |
      SELECT 'AbC' LIKE 'abc' COLLATE case_insensitive
    expect: rows
    comment: LIKE is the supported alternative the docs recommend
