# Class-shorthand escapes (\d \s \w), word-boundary constraints (\m \M \y \Y), lookaround, and non-greedy quantifiers.
id: doc-functions-matching.regex-class-constraint-escapes
title: Regex class shorthands, word-boundary constraints, lookaround and non-greedy quantifiers
family: doc-functions-matching
tier: core
feature_ids: [posix-regex, regex-escapes, word-boundaries, lookaround, non-greedy]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (Regular Expression Class-Shorthand/Constraint Escapes, lookaround, matching rules)"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_match('a1 b_2', '\d') AS digit,
             regexp_match('x y', '\s') AS space,
             regexp_match('-_ab', '\w+') AS word,
             regexp_match('a1 b_2', '\D+') AS non_digit_run
    expect: rows
    comment: \d and \s and \w match the class; \D is the complement
  - sql: |
      SELECT regexp_match('the cat', '\mcat\M') AS whole_word,
             regexp_match('concatenate', '\Mcat') AS inside_word,
             regexp_match('concatenate', 'cat\Y') AS not_word_edge
    expect: rows
    comment: \Mcat needs a word end before cat, which is absent inside concatenate, so the second match is NULL
  - sql: |
      SELECT regexp_match('foobar', 'foo(?=bar)') AS positive_lookahead,
             regexp_match('foobaz', 'foo(?!bar)') AS negative_lookahead,
             regexp_match('foobar', '(?<=foo)bar') AS positive_lookbehind
    expect: rows
    comment: lookaround constrains the match without consuming the lookahead text
  - sql: |
      SELECT regexp_match('<a><b>', '<.*?>') AS non_greedy,
             regexp_match('<a><b>', '<.*>') AS greedy
    expect: rows
    comment: the non-greedy form prefers the shortest match, the greedy form the longest
