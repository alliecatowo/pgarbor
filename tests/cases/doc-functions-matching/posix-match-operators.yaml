# POSIX regex match operators ~, ~*, !~, !~*: unanchored search semantics and case handling.
id: doc-functions-matching.posix-match-operators
title: POSIX regex match operators match anywhere unless anchored and respect case rules
family: doc-functions-matching
tier: core
feature_ids: [posix-regex, regex-match-operators, anchors, case-sensitivity]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (Regular Expression Match Operators and examples)"
sessions: [a]
steps:
  - sql: |
      SELECT 'abcd' ~ 'bc' AS e1,
             'abcd' ~ 'a.c' AS e2,
             'abcd' ~ 'a.*d' AS e3,
             'abcd' ~ '(b|x)' AS e4,
             'abcd' ~ '^a' AS e5,
             'abcd' ~ '^(b|c)' AS e6
    expect: rows
    comment: documented examples; expected true, true, true, true, true, false
  - sql: |
      SELECT 'thomas' ~ 't.*ma' AS case_sensitive_hit,
             'thomas' ~* 'T.*ma' AS case_insensitive_hit,
             'thomas' !~ 't.*max' AS not_match_case_sensitive,
             'thomas' !~* 'T.*ma' AS not_match_case_insensitive
    expect: rows
    comment: documented examples; expected true, true, true, false
  - sql: |
      SELECT 'Thomas' ~ 't.*ma' AS upper_t_no_match, 'Thomas' ~* 't.*ma' AS upper_t_ci_match
    expect: rows
    comment: the case-sensitive operator must not match a differently cased leading letter
