# LIKE supports nondeterministic collations: case-insensitive and punctuation-ignoring ICU collations, as in the docs.
id: doc-functions-matching.like-nondeterministic-collation
title: LIKE under nondeterministic ICU collations follows the documented partition semantics
family: doc-functions-matching
tier: extended
feature_ids: [like, collation, nondeterministic-collation, pattern-matching]
required_capabilities: [select, like, collation]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-like (nondeterministic collations paragraphs and examples)"
sessions: [a]
setup: |
  CREATE COLLATION case_insensitive (provider = icu, locale = 'und-u-ks-level2', deterministic = false);
  CREATE COLLATION ign_punct (provider = icu, locale = 'und-u-ka-shifted-ks-level1', deterministic = false);
steps:
  - sql: |
      SELECT 'AbC' LIKE 'abc' COLLATE case_insensitive AS ci_full,
             'AbC' LIKE 'a%' COLLATE case_insensitive AS ci_prefix,
             'abc' LIKE 'abc' COLLATE case_insensitive AS ci_same
    expect: rows
    comment: documented case-insensitive examples; expected true, true, true
  - sql: |
      SELECT '.foo.' LIKE 'foo' COLLATE ign_punct AS ip_foo,
             '.foo.' LIKE 'f_o' COLLATE ign_punct AS ip_f_o,
             '.foo.' LIKE '_oo' COLLATE ign_punct AS ip_underscore_oo
    expect: rows
    comment: documented ign_punct examples; the underscore matches exactly one character regardless of collation, so the third is false
