# substring(string FROM pattern) with POSIX regex: whole match when no parentheses, else first capture group; NULL on no match.
id: doc-functions-matching.posix-substring-two-arg
title: Two-argument substring returns the whole match or the first parenthesized group
family: doc-functions-matching
tier: core
feature_ids: [substring, posix-regex, capture-groups, null-semantics]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (substring(string from pattern) examples)"
sessions: [a]
steps:
  - sql: |
      SELECT substring('foobar' FROM 'o.b') AS whole_match,
             substring('foobar' FROM 'o(.)b') AS first_group
    expect: rows
    comment: documented examples; expected oob and o
  - sql: |
      SELECT substring('foobar' FROM 'x') IS NULL AS no_match_is_null,
             substring('foobar' FROM '(?:o)(.)b') AS non_capturing_skips_group
    expect: rows
    comment: no match yields NULL; the non-capturing group is not reported so the one capturing group is returned
  - sql: |
      SELECT substring(NULL::text FROM 'o') IS NULL AS null_string_is_null
    expect: rows
