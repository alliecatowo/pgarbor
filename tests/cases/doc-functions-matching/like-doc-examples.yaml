# Documented LIKE examples plus the NOT LIKE duality and the literal-pattern equivalence to equals.
id: doc-functions-matching.like-doc-examples
title: LIKE documented examples, wildcard semantics, and NOT LIKE duality
family: doc-functions-matching
tier: core
feature_ids: [like, like-wildcards, not-like, pattern-matching]
required_capabilities: [select, like]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-like (documented LIKE examples)"
sessions: [a]
steps:
  - sql: |
      SELECT 'abc' LIKE 'abc' AS r1, 'abc' LIKE 'a%' AS r2, 'abc' LIKE '_b_' AS r3, 'abc' LIKE 'c' AS r4
    expect: rows
    comment: documented examples; expected true, true, true, false
  - sql: |
      SELECT x.s, x.p, (x.s LIKE x.p) AS m, (x.s NOT LIKE x.p) AS nm
      FROM (VALUES ('abc', 'abc'), ('abc', 'a%'), ('abc', '_b_'), ('abc', 'c'), ('', '%'), ('', '_'), ('a%c', 'a\%c')) AS x(s, p)
    expect: rows
    order: multiset
    comment: NOT LIKE is the negation of LIKE on every row, including the empty string and an escaped percent
  - sql: |
      SELECT ('abc' LIKE 'ab') IS NOT DISTINCT FROM ('abc' = 'ab') AS no_wildcards_is_equality,
             ('abc' LIKE 'abc') IS NOT DISTINCT FROM ('abc' = 'abc') AS equal_is_equality
    expect: rows
    comment: a pattern with no percent or underscore behaves like the equals operator
  - sql: |
      SELECT 'abc' LIKE 'abc%' AS prefix_longer_pattern, 'abc' LIKE '%' AS lone_percent, 'abc' LIKE '%%%' AS many_percent
    expect: rows
    comment: LIKE matches the entire string, so a pattern longer than the string fails
