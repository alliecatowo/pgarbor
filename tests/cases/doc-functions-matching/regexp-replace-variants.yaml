# regexp_replace: first-match default, g flag, backreferences, \& whole match, start and N arguments, and flags.
id: doc-functions-matching.regexp-replace-variants
title: regexp_replace replaces the first or Nth match, supports backreferences and the g flag
family: doc-functions-matching
tier: core
feature_ids: [regexp-replace, posix-regex, backreferences, regex-flags]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (regexp_replace examples and argument rules)"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_replace('foobarbaz', 'b..', 'X') AS first_only,
             regexp_replace('foobarbaz', 'b..', 'X', 'g') AS global,
             regexp_replace('foobarbaz', 'b(..)', 'X\1Y', 'g') AS backref_global
    expect: rows
    comment: documented examples; expected fooXbaz, fooXX, fooXarYXazY
  - sql: |
      SELECT regexp_replace('A PostgreSQL function', 'a|e|i|o|u', 'X', 1, 0, 'i') AS all_matches_from_start,
             regexp_replace(string=>'A PostgreSQL function', pattern=>'a|e|i|o|u', replacement=>'X', start=>1, "N"=>3, flags=>'i') AS nth_match
    expect: rows
    comment: documented examples; N=0 replaces all matches at or after start, N=3 replaces only the third match
  - sql: |
      SELECT regexp_replace('abc', 'b', 'x', 1, 1, 'g') AS g_ignored_when_n_given,
             regexp_replace('abc', 'b', '[\&]') AS ampersand_is_whole_match,
             regexp_replace('abc', 'x', 'y') AS no_match_unchanged,
             regexp_replace(NULL::text, 'x', 'y') IS NULL AS null_input_is_null
    expect: rows
    comment: with N given the g flag is ignored; \& inserts the whole match; no match returns the source string
