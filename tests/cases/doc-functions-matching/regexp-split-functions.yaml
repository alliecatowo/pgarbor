# regexp_split_to_table and regexp_split_to_array: delimiter semantics including no match and empty input.
id: doc-functions-matching.regexp-split-functions
title: regexp_split_to_table and regexp_split_to_array split on regex matches
family: doc-functions-matching
tier: core
feature_ids: [regexp-split-to-table, regexp-split-to-array, posix-regex]
required_capabilities: [select, regex]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp (regexp_split_to_table and regexp_split_to_array examples)"
sessions: [a]
steps:
  - sql: |
      SELECT foo FROM regexp_split_to_table('the quick brown fox jumps over the lazy dog', '\s+') AS foo
    expect: rows
    order: multiset
    comment: documented example; nine rows, one word each
  - sql: |
      SELECT regexp_split_to_array('the quick brown fox jumps over the lazy dog', '\s+') AS words
    expect: rows
    comment: documented example as a single text array
  - sql: |
      SELECT regexp_split_to_array('abc', 'x') AS no_match,
             regexp_split_to_array('', 'x') AS empty_input
    expect: rows
    comment: no match returns the whole string as one element; empty input gives one empty-string element
  - sql: |
      SELECT regexp_split_to_array('a1b22c', '[0-9]+') AS digit_runs
    expect: rows
    comment: consecutive delimiter matches are treated as one run by the greedy quantifier
