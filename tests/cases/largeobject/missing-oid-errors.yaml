# Operations on a large object OID that does not exist fail with undefined_object; lo_create(0) allocates.
id: largeobject.missing-oid-errors
title: Nonexistent large object OID errors for unlink, get and open
family: largeobject
tier: core
feature_ids: [large-objects, errors, lo-unlink, lo-get, lo-open]
required_capabilities: [large-objects, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/largeobject.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT lo_unlink(999001)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT lo_get(999001)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT lo_open(999001, CAST(x'40000' AS integer))
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT lo_create(0) > 0
    expect: rows
    comment: lo_create(0) allocates a fresh OID
