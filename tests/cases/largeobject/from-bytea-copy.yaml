# Copy an object with lo_from_bytea(0, lo_get(...)) and round-trip a bytea literal.
id: largeobject.from-bytea-copy
title: lo_from_bytea creates a fresh object with identical contents
family: largeobject
tier: core
feature_ids: [large-objects, lo-from-bytea, lo-get, bytea]
required_capabilities: [large-objects, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/largeobject.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  SELECT lo_from_bytea(50, convert_to('copy me', 'UTF8'));
steps:
  - sql: |
      SELECT encode(lo_get(lo_from_bytea(0, lo_get(50))), 'escape')
    expect: rows
  - sql: |
      SELECT lo_get(50) = lo_get(lo_from_bytea(0, lo_get(50)))
    expect: rows
  - sql: |
      SELECT encode(lo_get(lo_from_bytea(0, '\xdeadbeef'::bytea)), 'hex')
    expect: rows
  - sql: |
      SELECT length(lo_get(lo_from_bytea(0, ''::bytea)))
    expect: rows
