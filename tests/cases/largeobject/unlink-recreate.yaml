# lo_unlink returns 1, the object disappears, and the same OID can be recreated empty.
id: largeobject.unlink-recreate
title: lo_unlink removes the object and lo_create can reuse its OID
family: largeobject
tier: core
feature_ids: [large-objects, lo-unlink, lo-create, lo-get]
required_capabilities: [large-objects, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/largeobject.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  SELECT lo_create(49);
steps:
  - sql: |
      SELECT lo_unlink(49)
    expect: rows
    comment: returns 1
  - sql: |
      SELECT lo_get(49)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT lo_create(49)
    expect: rows
  - sql: |
      SELECT length(lo_get(49))
    expect: rows
  - sql: |
      SELECT lo_unlink(49)
    expect: rows
