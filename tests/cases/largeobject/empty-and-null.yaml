# Empty large object, zero-length and past-EOF reads, and strict NULL handling of lo_get.
id: largeobject.empty-and-null
title: Empty large object reads and NULL argument handling
family: largeobject
tier: core
feature_ids: [large-objects, lo-get, null-handling]
required_capabilities: [large-objects, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/largeobject.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  SELECT lo_create(45);
steps:
  - sql: |
      SELECT length(lo_get(45)), lo_get(45) = ''::bytea
    expect: rows
  - sql: |
      SELECT encode(lo_get(45, 0, 10), 'hex'), encode(lo_get(45, 0, 0), 'hex')
    expect: rows
  - sql: |
      SELECT lo_get(NULL::oid) IS NULL
    expect: rows
    comment: lo_get is strict, so a NULL oid yields NULL
