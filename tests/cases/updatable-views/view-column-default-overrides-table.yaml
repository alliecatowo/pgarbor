# A default set on a view column takes precedence over the base table's default for INSERTs through the view.
id: updatable-views.view-column-default-overrides-table
title: ALTER VIEW SET DEFAULT overrides the table default for inserts through the view
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, alter-view, defaults, insert]
required_capabilities: [create-table, create-view, alter-view, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (view defaults, ALTER VIEW ... SET DEFAULT)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text DEFAULT 'table');
  CREATE VIEW v AS SELECT a, b FROM t;
  ALTER VIEW v ALTER COLUMN b SET DEFAULT 'view';
steps:
  - sql: |
      INSERT INTO v (a) VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO t (a) VALUES (2)
    expect: ok
    comment: a direct insert into the table still uses the table default
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
