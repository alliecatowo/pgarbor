# Inserting a value into a view column that is an expression (not a base column) is rejected.
id: updatable-views.expression-column-insert-rejected
title: Explicit INSERT into a computed view column fails with feature_not_supported
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, insert, expressions, errors]
required_capabilities: [create-table, create-view, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (rw_view15 with upper(b); non-updatable column)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text DEFAULT 'lower me');
  CREATE VIEW v AS SELECT a, upper(b) AS u FROM t;
steps:
  - sql: |
      INSERT INTO v (a, u) VALUES (1, 'X')
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM t
    expect: rows
