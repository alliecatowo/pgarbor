# information_schema reports which views and columns are auto-updatable and insertable.
id: updatable-views.information-schema-is-updatable
title: information_schema reports is_updatable for simple, DISTINCT and expression views
family: updatable-views
tier: core
feature_ids: [updatable-views, catalog-introspection, create-view]
required_capabilities: [create-table, create-view, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (information_schema.views / columns is_updatable)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text);
  CREATE VIEW v_auto AS SELECT a, b FROM t WHERE a > 0;
  CREATE VIEW v_distinct AS SELECT DISTINCT a, b FROM t;
  CREATE VIEW v_expr AS SELECT a, upper(b) AS u FROM t;
steps:
  - sql: |
      SELECT table_name, is_updatable, is_insertable_into
        FROM information_schema.views
       WHERE table_name IN ('v_auto', 'v_distinct', 'v_expr')
       ORDER BY table_name
    expect: rows
    order: ordered
  - sql: |
      SELECT table_name, column_name, is_updatable
        FROM information_schema.columns
       WHERE table_name = 'v_expr'
       ORDER BY ordinal_position
    expect: rows
    order: ordered
