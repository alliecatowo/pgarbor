# A view with DISTINCT is not automatically updatable; DELETE through it fails and the base table is untouched.
id: updatable-views.distinct-view-delete-not-updatable
title: DELETE through a DISTINCT view fails with feature_not_supported
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, delete, errors]
required_capabilities: [create-table, create-view, insert, delete, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (ro_view1: DISTINCT not supported)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text);
  INSERT INTO t VALUES (1, 'x');
  CREATE VIEW ro AS SELECT DISTINCT a, b FROM t;
steps:
  - sql: |
      DELETE FROM ro
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM t
    expect: rows
