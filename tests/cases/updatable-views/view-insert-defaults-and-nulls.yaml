# Inserts through an auto-updatable view: omitted columns take the table default, an explicit NULL stays NULL,
# and DEFAULT in the values list takes the table default.
id: updatable-views.view-insert-defaults-and-nulls
title: Insert through a view uses table defaults for omitted columns and keeps explicit NULLs
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, insert, defaults, null-semantics]
required_capabilities: [create-table, create-view, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (column defaults through views)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text DEFAULT 'table default');
  CREATE VIEW v AS SELECT a, b FROM t;
steps:
  - sql: |
      INSERT INTO v (a) VALUES (1), (2)
    expect: ok
  - sql: |
      INSERT INTO v VALUES (3, NULL)
    expect: ok
  - sql: |
      INSERT INTO v (a, b) VALUES (4, DEFAULT)
    expect: ok
  - sql: |
      SELECT a, b, b IS NULL AS b_null FROM v ORDER BY a
    expect: rows
    order: ordered
