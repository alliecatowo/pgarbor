# UPDATE that assigns to a computed view column is rejected and the base row keeps its values.
id: updatable-views.expression-column-update-rejected
title: UPDATE assigning a computed view column fails with feature_not_supported
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, update, expressions, errors]
required_capabilities: [create-table, create-view, insert, update, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (rw_view15: UPDATE SET upper=...)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text);
  INSERT INTO t VALUES (1, 'x');
  CREATE VIEW v AS SELECT a, upper(b) AS u FROM t;
steps:
  - sql: |
      UPDATE v SET u = 'Y' WHERE a = 1
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
