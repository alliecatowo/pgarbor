# Without WITH CHECK OPTION an UPDATE through a view may move a row out of the view's qualification;
# the row stays in the base table.
id: updatable-views.update-moves-row-out-of-view
title: UPDATE through a view may move a row outside the view without a check option
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, update, select]
required_capabilities: [create-table, create-view, insert, update, select]
provenance:
  source: hand
  ref: "PG18 sql-createview.html (WITH CHECK OPTION: absent by default)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text);
  INSERT INTO t VALUES (1, 'x'), (2, 'y'), (3, 'z');
  CREATE VIEW v AS SELECT a, b FROM t WHERE a < 3;
steps:
  - sql: |
      UPDATE v SET a = 10 WHERE a = 1
    expect: ok
  - sql: |
      SELECT a, b FROM v ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
