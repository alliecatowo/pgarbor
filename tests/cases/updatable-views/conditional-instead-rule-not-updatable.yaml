# A view with only a conditional INSTEAD rule is not automatically updatable: the INSERT is rejected
# and the base table is not written.
id: updatable-views.conditional-instead-rule-not-updatable
title: View with only a conditional INSTEAD rule rejects INSERT with object_not_in_prerequisite_state
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, rules, insert, errors]
required_capabilities: [create-table, create-view, create-rule, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (rw_view16 conditional INSTEAD rule)"
sessions: [a]
setup: |
  CREATE TABLE base_tbl (a int PRIMARY KEY, b text);
  CREATE VIEW rw AS SELECT a, b FROM base_tbl;
  CREATE RULE rw_ins_rule AS ON INSERT TO rw WHERE NEW.a > 0 DO INSTEAD INSERT INTO base_tbl VALUES (NEW.a, NEW.b);
steps:
  - sql: |
      INSERT INTO rw (a, b) VALUES (3, 'Row 3')
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT count(*) FROM base_tbl
    expect: rows
