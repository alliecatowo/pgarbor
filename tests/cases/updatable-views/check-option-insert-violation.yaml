# WITH CHECK OPTION rejects an INSERT through the view whose new row fails the view's qualification.
id: updatable-views.check-option-insert-violation
title: WITH CHECK OPTION rejects an INSERT outside the view qualification
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, check-option, insert, errors]
required_capabilities: [create-table, create-view, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (simple WITH CHECK OPTION)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text);
  CREATE VIEW v AS SELECT a, b FROM t WHERE a > 0 WITH CHECK OPTION;
steps:
  - sql: |
      INSERT INTO v VALUES (-1, 'neg')
    expect: error
    sqlstate: "44000"
  - sql: |
      INSERT INTO v VALUES (5, 'ok')
    expect: ok
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
