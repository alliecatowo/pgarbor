# NULL handling through a view: assigning NULL, filtering on a NULL comparison (matches nothing),
# and IS NULL tests on the view's columns.
id: updatable-views.null-values-through-view
title: NULL assignment and NULL predicates through a view behave as on the base table
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, update, delete, null-semantics]
required_capabilities: [create-table, create-view, insert, update, delete, select]
provenance:
  source: hand
  ref: "PG18 sql-select.html (NULL comparisons yield unknown); pg-regress updatable_views.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b int, c text);
  INSERT INTO t VALUES (1, NULL, 'x'), (2, 5, NULL);
  CREATE VIEW v AS SELECT a, b, c FROM t;
steps:
  - sql: |
      UPDATE v SET b = NULL WHERE b = 5
    expect: ok
  - sql: |
      DELETE FROM v WHERE b = NULL
    expect: ok
    comment: b = NULL is unknown for every row, so zero rows are deleted
  - sql: |
      SELECT a, b IS NULL AS b_null, c IS NULL AS c_null FROM v ORDER BY a
    expect: rows
    order: ordered
