# A view whose target list contains an aggregate is read-only; UPDATE through it is rejected.
id: updatable-views.aggregate-view-update-not-updatable
title: UPDATE through a view containing an aggregate fails with object_not_in_prerequisite_state
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, aggregates, update, errors]
required_capabilities: [create-table, create-view, insert, update, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (ro_view4: aggregate functions not supported)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
  CREATE VIEW ro AS SELECT count(*) AS n FROM t;
steps:
  - sql: |
      UPDATE ro SET n = 5
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT a FROM t ORDER BY a
    expect: rows
    order: ordered
