# WITH CHECK OPTION rejects an UPDATE that would move a row out of the view; a permitted update still applies.
id: updatable-views.check-option-update-violation
title: WITH CHECK OPTION rejects an UPDATE that leaves the view qualification
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, check-option, update, errors]
required_capabilities: [create-table, create-view, insert, update, select]
provenance:
  source: hand
  ref: "PG18 sql-createview.html (WITH CHECK OPTION); errcode 44000 WITH_CHECK_OPTION_VIOLATION"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text);
  INSERT INTO t VALUES (1, 'x'), (2, 'y');
  CREATE VIEW v AS SELECT a, b FROM t WHERE a > 0 WITH CHECK OPTION;
steps:
  - sql: |
      UPDATE v SET a = -2 WHERE a = 1
    expect: error
    sqlstate: "44000"
  - sql: |
      UPDATE v SET b = 'changed' WHERE a = 2
    expect: ok
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
