# An INSERT through a view that omits a NOT NULL base column fails the base table constraint.
id: updatable-views.not-null-column-omitted-insert
title: INSERT through a view omitting a NOT NULL base column fails with not_null_violation
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, insert, constraints, null-semantics, errors]
required_capabilities: [create-table, create-view, insert, select]
provenance:
  source: hand
  ref: "PG18 errcodes 23502 not_null_violation; pg-regress updatable_views.sql NOT NULL base columns"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text NOT NULL);
  CREATE VIEW v AS SELECT a, b FROM t;
steps:
  - sql: |
      INSERT INTO v (a) VALUES (1)
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO v VALUES (2, 'ok')
    expect: ok
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
