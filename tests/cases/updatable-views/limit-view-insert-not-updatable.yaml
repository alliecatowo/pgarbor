# A view with LIMIT is not automatically updatable; INSERT through it fails and writes nothing.
id: updatable-views.limit-view-insert-not-updatable
title: INSERT through a view with LIMIT fails with object_not_in_prerequisite_state
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, insert, limit, errors]
required_capabilities: [create-table, create-view, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (ro_view9: LIMIT not supported)"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text);
  CREATE VIEW ro AS SELECT a, b FROM t ORDER BY a LIMIT 1;
steps:
  - sql: |
      INSERT INTO ro VALUES (1, 'x')
    expect: error
    sqlstate: "55000"
  - sql: |
      SELECT count(*) FROM t
    expect: rows
