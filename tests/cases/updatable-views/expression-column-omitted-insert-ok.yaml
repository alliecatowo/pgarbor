# Omitting the computed view column from an INSERT is allowed; the base column takes its default and the
# view shows the expression evaluated on it.
id: updatable-views.expression-column-omitted-insert-ok
title: INSERT that omits a computed view column succeeds and the view evaluates the expression
family: updatable-views
tier: core
feature_ids: [updatable-views, create-view, insert, expressions, defaults]
required_capabilities: [create-table, create-view, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/updatable_views.sql (rw_view15: INSERT (a) VALUES (3))"
sessions: [a]
setup: |
  CREATE TABLE t (a int PRIMARY KEY, b text DEFAULT 'lower me');
  CREATE VIEW v AS SELECT a, upper(b) AS u FROM t;
steps:
  - sql: |
      INSERT INTO v (a) VALUES (1)
    expect: ok
  - sql: |
      SELECT a, u FROM v ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
