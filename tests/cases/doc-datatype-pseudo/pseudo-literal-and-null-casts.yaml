# Untyped literals take type unknown; NULL can be cast to record and void, which yield empty values (datatype.sgml#datatype-pseudo, unknown and record).
id: doc-datatype-pseudo.pseudo-literal-and-null-casts
title: Untyped literals report type unknown and NULL casts to void and record succeed
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, unknown-type, record-type, void-type]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
steps:
  - sql: |
      SELECT pg_typeof('abc')::text AS literal_typ, pg_typeof('abc'::text)::text AS text_typ
    expect: rows
    order: ordered
    comment: an untyped literal in a select list is reported as unknown
  - sql: |
      SELECT NULL::void AS v, NULL::record AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(NULL::record)::text AS typ
    expect: rows
    order: ordered
