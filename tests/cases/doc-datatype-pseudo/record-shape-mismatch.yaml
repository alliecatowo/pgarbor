# A record function whose final statement returns a different shape than the declared column list is an error at call time (datatype.sgml#datatype-pseudotypes-table, "record").
id: doc-datatype-pseudo.record-shape-mismatch
title: Column definition list must match the record function's result shape
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, record-return, set-returning-functions]
required_capabilities: [create-function-sql, set-returning-functions, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
setup: |
  CREATE FUNCTION recs() RETURNS SETOF record LANGUAGE sql AS $$ SELECT 1, 'a' UNION ALL SELECT 2, 'b' $$
steps:
  - sql: |
      SELECT * FROM recs() AS t(n int, s text, extra int)
    expect: error
    sqlstate: "42P13"
    comment: function returns two columns; the list declares three
  - sql: |
      SELECT * FROM recs() AS t(n int)
    expect: error
    sqlstate: "42P13"
    comment: function returns two columns; the list declares one
  - sql: |
      SELECT n, s FROM recs() AS t(n int, s text) ORDER BY n
    expect: rows
    order: ordered
