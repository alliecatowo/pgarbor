# Pseudo-types cannot be used as column data types (datatype.sgml#datatype-pseudo: "A pseudo-type cannot be used as a column data type").
id: doc-datatype-pseudo.pseudo-column-rejected
title: Pseudo-types are rejected as column types in CREATE TABLE and ALTER TABLE
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, create-table, alter-table]
required_capabilities: [create-table, alter-table, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudo"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE t_void (x void)
    expect: error
    sqlstate: "42P16"
  - sql: |
      CREATE TABLE t_record (x record)
    expect: error
    sqlstate: "42P16"
  - sql: |
      CREATE TABLE t_anyarray (x anyarray)
    expect: error
    sqlstate: "42P16"
  - sql: |
      CREATE TABLE t_anyelement (x anyelement)
    expect: error
    sqlstate: "42P16"
  - sql: |
      CREATE TABLE ok_t (id int4)
    expect: ok
  - sql: |
      ALTER TABLE ok_t ADD COLUMN y trigger
    expect: error
    sqlstate: "42P16"
  - sql: |
      SELECT count(*) FROM pg_attribute WHERE attrelid = 'ok_t'::regclass AND attnum > 0 AND NOT attisdropped
    expect: rows
    comment: the failed ALTER must leave ok_t with its single original column
