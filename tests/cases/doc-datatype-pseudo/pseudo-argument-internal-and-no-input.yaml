# SQL functions cannot take internal arguments, and an anyelement result needs a polymorphic input (datatype.sgml#datatype-pseudotypes-table, "internal").
id: doc-datatype-pseudo.pseudo-argument-internal-and-no-input
title: SQL function definitions with internal arguments or unbound anyelement results are rejected
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, internal-type, anyelement, create-function-sql]
required_capabilities: [create-function-sql, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION int_arg(internal) RETURNS int LANGUAGE sql AS 'SELECT 1'
    expect: error
    sqlstate: "42P13"
    comment: SQL functions cannot have arguments of type internal
  - sql: |
      CREATE FUNCTION noargs() RETURNS anyelement LANGUAGE sql AS 'SELECT 1'
    expect: error
    sqlstate: "42P13"
    comment: a polymorphic result needs an anyelement, anyarray, anynonarray, anyenum, anyrange or anymultirange input
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname IN ('int_arg', 'noargs')
    expect: rows
    order: ordered
    comment: neither failed definition leaves a function behind
