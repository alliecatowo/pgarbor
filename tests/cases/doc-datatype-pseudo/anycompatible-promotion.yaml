# anycompatible arguments are promoted to one common type; anycompatiblearray and anycompatiblenonarray follow the same rule (datatype.sgml#datatype-pseudotypes-table, extend-types-polymorphic).
id: doc-datatype-pseudo.anycompatible-promotion
title: anycompatible family promotes mixed arguments to a common type
family: doc-datatype-pseudo
tier: extended
feature_ids: [pseudo-types, anycompatible, anycompatiblearray, anycompatiblenonarray, polymorphic-functions]
required_capabilities: [create-function-sql, arrays, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
setup: |
  CREATE FUNCTION cc(anycompatible, anycompatible) RETURNS anycompatible LANGUAGE sql AS 'SELECT $1';
  CREATE FUNCTION cca(anycompatiblearray, anycompatible) RETURNS anycompatiblearray LANGUAGE sql AS 'SELECT $1 || $2';
  CREATE FUNCTION ncn(anycompatiblenonarray, anycompatiblenonarray) RETURNS text LANGUAGE sql AS $$ SELECT pg_typeof($1)::text || '/' || pg_typeof($2)::text $$
steps:
  - sql: |
      SELECT pg_typeof(cc(1, 2.5))::text AS typ
    expect: rows
    order: ordered
    comment: integer and numeric promote to numeric
  - sql: |
      SELECT pg_typeof(cca(ARRAY[1, 2], 2.5))::text AS typ, cca(ARRAY[1, 2], 2.5) AS val
    expect: rows
    order: ordered
  - sql: |
      SELECT ncn(1, 2.5) AS promoted
    expect: rows
    order: ordered
  - sql: |
      SELECT ncn(ARRAY[1], 2)
    expect: error
    sqlstate: "42883"
    comment: an array argument does not match anycompatiblenonarray
