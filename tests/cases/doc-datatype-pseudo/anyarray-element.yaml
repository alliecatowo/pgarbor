# anyarray accepts any array type; the element result type follows the array (datatype.sgml#datatype-pseudotypes-table, anyarray).
id: doc-datatype-pseudo.anyarray-element
title: anyarray function returns the element type of int, text and empty arrays
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, anyarray, polymorphic-functions, arrays]
required_capabilities: [create-function-sql, arrays, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
setup: |
  CREATE FUNCTION fa(anyarray) RETURNS anyelement LANGUAGE sql AS $$ SELECT $1[1] $$
steps:
  - sql: |
      SELECT fa(ARRAY[1, 2]) AS i, fa(ARRAY['a', 'b']) AS t
    expect: rows
    order: ordered
  - sql: |
      SELECT fa('{}'::int[]) AS empty_arr, fa(NULL::int[]) AS null_arr
    expect: rows
    order: ordered
    comment: subscripting an empty or NULL array yields SQL NULL
  - sql: |
      SELECT pg_typeof(fa(ARRAY[1.5, 2.5]))::text AS typ
    expect: rows
    order: ordered
