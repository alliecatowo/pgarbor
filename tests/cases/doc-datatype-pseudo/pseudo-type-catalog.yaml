# Every pseudo-type in the table is a real pg_type entry with typtype 'p'; each name resolves via regtype (datatype.sgml#datatype-pseudotypes-table).
id: doc-datatype-pseudo.pseudo-type-catalog
title: Documented pseudo-type names exist in pg_type with typtype p and resolve as regtype
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, catalog-pg-type, regtype]
required_capabilities: [catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
steps:
  - sql: |
      SELECT typname FROM pg_type
      WHERE typtype = 'p'
        AND typname IN ('any','anyelement','anyarray','anynonarray','anyenum','anyrange','anymultirange',
                        'anycompatible','anycompatiblearray','anycompatiblenonarray','anycompatiblerange',
                        'anycompatiblemultirange','cstring','internal','language_handler','fdw_handler',
                        'table_am_handler','index_am_handler','tsm_handler','record','trigger',
                        'event_trigger','pg_ddl_command','void','unknown')
      ORDER BY typname
    expect: rows
    order: ordered
    comment: all 25 documented pseudo-types must be present with typtype p
  - sql: |
      SELECT 'void'::regtype::text AS v, 'internal'::regtype::text AS i, 'anycompatiblemultirange'::regtype::text AS m
    expect: rows
    order: ordered
  - sql: |
      SELECT typname FROM pg_type WHERE typname = 'int4' AND typtype = 'p'
    expect: rows
    order: ordered
    comment: int4 is a base type, so no row
