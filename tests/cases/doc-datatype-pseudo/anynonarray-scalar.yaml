# anynonarray accepts scalar types only; an array argument does not match (datatype.sgml#datatype-pseudotypes-table, anynonarray).
id: doc-datatype-pseudo.anynonarray-scalar
title: anynonarray accepts scalars and rejects array arguments
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, anynonarray, polymorphic-functions]
required_capabilities: [create-function-sql, arrays, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
setup: |
  CREATE FUNCTION nna(anynonarray) RETURNS text LANGUAGE sql AS $$ SELECT pg_typeof($1)::text $$
steps:
  - sql: |
      SELECT nna(1) AS i, nna('x'::text) AS t, nna(NULL::numeric) AS n
    expect: rows
    order: ordered
  - sql: |
      SELECT nna(ARRAY[1, 2])
    expect: error
    sqlstate: "42883"
    comment: no matching function for an integer array argument
