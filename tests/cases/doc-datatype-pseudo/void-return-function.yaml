# RETURNS void: the function yields one value of type void whose text form is empty; it is not NULL (datatype.sgml#datatype-pseudo, "Indicates that a function returns no value").
id: doc-datatype-pseudo.void-return-function
title: RETURNS void functions yield an empty non-null value and no void operators exist
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, void-return, create-function-sql, plpgsql]
required_capabilities: [create-function-sql, plpgsql, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
setup: |
  CREATE FUNCTION vf() RETURNS void LANGUAGE sql AS $$ SELECT 1 $$;
  CREATE FUNCTION vp() RETURNS void LANGUAGE plpgsql AS $$ BEGIN NULL; END $$
steps:
  - sql: |
      SELECT vf()
    expect: rows
    comment: SQL body result is discarded; one row with an empty void value
  - sql: |
      SELECT vp() IS NULL AS is_null, pg_typeof(vp())::text AS typ
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM (SELECT vf()) AS s
    expect: rows
    order: ordered
  - sql: |
      SELECT vp() = ''
    expect: error
    sqlstate: "42883"
    comment: void has no comparison operators
