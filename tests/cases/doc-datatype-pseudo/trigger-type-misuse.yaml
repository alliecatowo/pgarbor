# The trigger pseudo-type is not usable as an ordinary value or in a SQL-language function (datatype.sgml#datatype-pseudotypes-table, "trigger").
id: doc-datatype-pseudo.trigger-type-misuse
title: trigger pseudo-type rejected in SQL functions, casts and direct calls
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, trigger-function, errors]
required_capabilities: [create-function-sql, plpgsql, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION bad_trg() RETURNS trigger LANGUAGE sql AS 'SELECT 1'
    expect: error
    sqlstate: "42P13"
    comment: SQL functions cannot return trigger
  - sql: |
      SELECT CAST(NULL AS trigger)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE FUNCTION tf() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NULL; END $$
    expect: ok
  - sql: |
      SELECT tf()
    expect: error
    sqlstate: "0A000"
    comment: plpgsql trigger function invoked outside a trigger
