# anyrange and anymultirange bind range and multirange types; lower/upper of an empty range are NULL (datatype.sgml#datatype-pseudotypes-table, rangetypes).
id: doc-datatype-pseudo.anyrange-multirange
title: anyrange and anymultirange functions bind range and multirange arguments
family: doc-datatype-pseudo
tier: core
feature_ids: [pseudo-types, anyrange, anymultirange, range-types, multirange-types]
required_capabilities: [create-function-sql, range-types, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-pseudotypes-table"
sessions: [a]
setup: |
  CREATE FUNCTION rlo(anyrange) RETURNS anyelement LANGUAGE sql AS 'SELECT lower($1)';
  CREATE FUNCTION mlo(anymultirange) RETURNS anyelement LANGUAGE sql AS 'SELECT lower($1)'
steps:
  - sql: |
      SELECT rlo(int4range(3, 9)) AS i, rlo(daterange('2024-01-01', '2024-02-01')) AS d
    expect: rows
    order: ordered
  - sql: |
      SELECT mlo(int8multirange(int8range(10, 20))) AS m
    expect: rows
    order: ordered
  - sql: |
      SELECT lower(int4multirange(int4range(1, 3), int4range(5, 8))) AS lo,
             upper(int4multirange(int4range(1, 3), int4range(5, 8))) AS hi
    expect: rows
    order: ordered
  - sql: |
      SELECT lower('empty'::int4range) IS NULL AS empty_lo_null, upper('empty'::int4range) IS NULL AS empty_hi_null
    expect: rows
    order: ordered
