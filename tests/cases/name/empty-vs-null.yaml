# The empty name is a real value, distinct from SQL NULL.
id: name.empty-vs-null
title: Empty name string is distinct from NULL
family: name
tier: core
feature_ids: [name-type, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
setup: |
  CREATE TABLE name_tbl (id int4 PRIMARY KEY, f1 name);
  INSERT INTO name_tbl (id, f1) VALUES (1, ''), (2, NULL), (3, 'x');
steps:
  - sql: |
      SELECT id, f1 IS NULL AS is_null, f1 = '' AS is_empty, length(f1) AS len FROM name_tbl ORDER BY id
    expect: rows
    order: ordered
