# Regular expression match operators work on name columns via implicit cast to text.
id: name.regex-operators
title: Regex match and non-match operators on name values
family: name
tier: core
feature_ids: [name-type, regex, pattern-matching]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
setup: |
  CREATE TABLE name_tbl (id int4 PRIMARY KEY, f1 name);
  INSERT INTO name_tbl (id, f1) VALUES (1, 'asdfghjkl;'), (2, '343f%2a'), (3, 'd34aaasdf'), (4, ''), (5, 'abc');
steps:
  - sql: |
      SELECT f1 FROM name_tbl WHERE f1 ~ '[0-9]'
    expect: rows
    order: multiset
  - sql: |
      SELECT f1 FROM name_tbl WHERE f1 ~ '.*asdf.*'
    expect: rows
    order: multiset
  - sql: |
      SELECT f1 FROM name_tbl WHERE f1 !~ '.*'
    expect: rows
    order: multiset
  - sql: |
      SELECT f1 FROM name_tbl WHERE f1 ~ '.*'
    expect: rows
    order: multiset
