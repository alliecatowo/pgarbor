# NULL name operands give NULL from =, while IS DISTINCT FROM treats them as distinct values.
id: name.null-comparison
title: NULL name operands in equality and IS DISTINCT FROM
family: name
tier: core
feature_ids: [name-type, null-semantics, comparison]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 docs functions-comparison.html (NULL handling)"
sessions: [a]
steps:
  - sql: |
      SELECT (NULL::name = 'a'::name) IS NULL AS eq_is_null, NULL::name IS DISTINCT FROM 'a'::name AS distinct_from, NULL::name IS NOT DISTINCT FROM NULL::name AS both_null_same
    expect: rows
