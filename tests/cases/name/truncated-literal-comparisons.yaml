# Comparison operators on name columns use the truncated 63-byte value, so an over-long literal
# compares against the stored truncated values.
id: name.truncated-literal-comparisons
title: Comparison operators against an over-long name literal use the truncated value
family: name
tier: extended
feature_ids: [name-type, comparison, truncation, aggregates]
required_capabilities: [create-table, insert, select, aggregate-filter]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
setup: |
  CREATE TABLE name_tbl (f1 name);
  INSERT INTO name_tbl (f1) VALUES ('1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR'), ('1234567890abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqr');
steps:
  - sql: |
      SELECT
        count(*) FILTER (WHERE f1 = '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR') AS eq,
        count(*) FILTER (WHERE f1 <> '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR') AS ne,
        count(*) FILTER (WHERE f1 < '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR') AS lt,
        count(*) FILTER (WHERE f1 <= '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR') AS le,
        count(*) FILTER (WHERE f1 > '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR') AS gt,
        count(*) FILTER (WHERE f1 >= '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR') AS ge
      FROM name_tbl
    expect: rows
