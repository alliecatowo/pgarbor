# parse_ident splits a qualified identifier into a text array and unquotes quoted parts.
id: name.parse-ident-basic
title: parse_ident splits qualified identifiers and unquotes quoted parts
family: name
tier: core
feature_ids: [parse-ident, identifiers, text-arrays]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
steps:
  - sql: |
      SELECT parse_ident('foo.boo') AS plain, parse_ident('"SchemaX"."TableY"') AS quoted
    expect: rows
  - sql: |
      SELECT (parse_ident('"SchemaX"."TableY"'))[2] AS second_part
    expect: rows
