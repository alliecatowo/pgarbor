# name equality is exact: a trailing space makes two name values different.
id: name.literal-trailing-space
title: name equality is exact including trailing spaces
family: name
tier: core
feature_ids: [name-type, comparison]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
steps:
  - sql: |
      SELECT name 'name string' = name 'name string' AS same, name 'name string' = name 'name string ' AS padded
    expect: rows
