# name uses the C collation, so ordering is by byte value: uppercase sorts before underscore and lowercase.
id: name.c-collation-order
title: ORDER BY on name uses C collation byte ordering
family: name
tier: core
feature_ids: [name-type, collation, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 docs datatype-character.html (name type uses C collation); pg-regress name.sql"
sessions: [a]
setup: |
  CREATE TABLE name_tbl (f1 name);
  INSERT INTO name_tbl (f1) VALUES ('beta'), ('alpha'), ('Zeta'), ('_x'), ('Alpha');
steps:
  - sql: |
      SELECT f1 FROM name_tbl ORDER BY f1
    expect: rows
    order: ordered
