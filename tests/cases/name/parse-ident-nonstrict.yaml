# With strict => false, the same bracketed input is accepted and the brackets are ignored.
id: name.parse-ident-nonstrict
title: parse_ident with strict false accepts bracketed input
family: name
tier: extended
feature_ids: [parse-ident, identifiers, named-arguments]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
steps:
  - sql: |
      SELECT parse_ident('foo.boo[]', strict => false) AS ident
    expect: rows
