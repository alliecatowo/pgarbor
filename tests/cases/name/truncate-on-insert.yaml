# Over-long name input is silently truncated to NAMEDATALEN-1 (63 bytes); no error is raised.
id: name.truncate-on-insert
title: Over-long name values are silently truncated to 63 characters on insert
family: name
tier: core
feature_ids: [name-type, insert, truncation]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
setup: |
  CREATE TABLE name_tbl (id int4 PRIMARY KEY, f1 name);
steps:
  - sql: |
      INSERT INTO name_tbl (id, f1) VALUES (1, '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQR'), (2, '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ')
    expect: ok
  - sql: |
      SELECT id, length(f1) AS len, f1 = '1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQ' AS is_prefix63, f1 FROM name_tbl ORDER BY id
    expect: rows
    order: ordered
