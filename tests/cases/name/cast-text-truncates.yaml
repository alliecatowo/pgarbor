# Explicit cast from text to name truncates silently instead of raising an error.
id: name.cast-text-truncates
title: Explicit text to name cast truncates to 63 bytes without error
family: name
tier: core
feature_ids: [name-type, casts, truncation]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/name.sql"
sessions: [a]
steps:
  - sql: |
      SELECT length(repeat('x', 70)::name) AS long_len, length(repeat('y', 63)::name) AS exact_len, length(repeat('z', 5)::name) AS short_len
    expect: rows
  - sql: |
      SELECT (repeat('x', 70)::name)::text = repeat('x', 63) AS prefix_match
    expect: rows
