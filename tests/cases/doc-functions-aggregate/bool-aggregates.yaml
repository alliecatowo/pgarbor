# bool_and, bool_or and their SQL-standard alias every ignore NULL inputs and return NULL when none remain.
id: doc-functions-aggregate.bool-aggregates
title: bool_and, bool_or and every skip NULL inputs and return NULL when no non-null input remains
family: doc-functions-aggregate
tier: core
feature_ids: [bool-and, bool-or, every, aggregate-null-skipping]
required_capabilities: [select, aggregates, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-aggregate (bool_and, bool_or, every; 'PostgreSQL supports every, but not any or some')"
sessions: [a]
steps:
  - sql: |
      SELECT bool_and(b) AS ba, bool_or(b) AS bo, every(b) AS ev
      FROM (VALUES (true), (NULL), (true)) v(b)
    expect: rows
    comment: NULL inputs are ignored, so all remaining inputs are true
  - sql: |
      SELECT bool_and(b) AS ba, bool_or(b) AS bo, every(b) AS ev
      FROM (VALUES (true), (false)) v(b)
    expect: rows
    comment: bool_and is false when any input is false; bool_or is true when any input is true
  - sql: |
      SELECT bool_or(b) AS bo FROM (VALUES (false), (NULL)) v(b)
    expect: rows
    comment: the only non-null input is false
  - sql: |
      SELECT bool_and(b) AS ba, bool_or(b) AS bo FROM (VALUES (NULL::bool)) v(b)
    expect: rows
    comment: no non-null input gives NULL
  - sql: |
      SELECT bool_and(b) AS ba, every(b) AS ev FROM (SELECT true AS b WHERE false) v
    expect: rows
    comment: zero rows gives NULL
