# count(*) counts rows, count(expr) skips nulls, count(DISTINCT expr) counts distinct non-null values.
id: doc-functions-aggregate.count-variants
title: count(*), count(expr), count(DISTINCT expr) and a FILTER clause over data with NULLs
family: doc-functions-aggregate
tier: core
feature_ids: [count, count-distinct, aggregate-filter, aggregate-null-skipping]
required_capabilities: [select, aggregates, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-aggregate (count(*) and count(\"any\") entries)"
sessions: [a]
steps:
  - sql: |
      SELECT count(*) AS n_rows, count(x) AS n_nonnull, count(DISTINCT x) AS n_distinct,
             count(x) FILTER (WHERE x > 1) AS n_big
      FROM (VALUES (1), (NULL), (1), (2)) v(x)
    expect: rows
    comment: count(*) includes the NULL row; count(x) does not; distinct non-null values are 1 and 2
  - sql: |
      SELECT count(*) AS n, count(x) AS nx FROM (VALUES (NULL::int), (NULL::int)) v(x)
    expect: rows
    comment: all-NULL input still counts rows for count(*)
  - sql: |
      SELECT pg_typeof(count(*)) AS t1, pg_typeof(count(x)) AS t2 FROM (VALUES (1)) v(x)
    expect: rows
    comment: count returns bigint
  - sql: |
      SELECT count(*) FILTER (WHERE false) AS none, count(*) AS all_rows FROM generate_series(1, 3) g
    expect: rows
    comment: FILTER restricts the input to rows where the condition is true
