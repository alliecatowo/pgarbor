# An IN list must contain at least one element.
id: expressions.in-empty-list-syntax-error
title: Empty IN list is a syntax error
family: expressions
tier: extended
feature_ids: [in-operator, errors, syntax]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 errcodes 42601; PG18 SQL grammar a_expr IN ( expr_list )"
sessions: [a]
steps:
  - sql: |
      SELECT 1 IN ()
    expect: error
    sqlstate: "42601"
