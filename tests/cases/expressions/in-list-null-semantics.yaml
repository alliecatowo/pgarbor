# IN with NULL in the list and NULL on the left: three-valued logic.
id: expressions.in-list-null-semantics
title: IN and NOT IN with NULL list elements and NULL operands follow three-valued logic
family: expressions
tier: core
feature_ids: [in-operator, null-semantics, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1), (NULL), (3);
steps:
  - sql: |
      SELECT a, a IN (1, NULL) AS in_with_null, a IN (1, 2) AS in_plain, a IN (NULL) AS only_null FROM t ORDER BY a
    expect: rows
    order: ordered
    comment: a match yields true even with NULL in list; a non-match with NULL yields NULL
  - sql: |
      SELECT 3 IN (1, 2, NULL) AS x, NULL::int4 IN (1, 2) AS y
    expect: rows
    order: ordered
    comment: NULL operand over a non-empty list yields NULL
