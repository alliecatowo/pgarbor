# No common supertype for the IN elements: PG falls back to x = v1 OR x = v2, which fails for
# lack of a point = box operator, not with a cast error.
id: expressions.in-no-common-type-error
title: IN with elements of unrelated types reports missing operator, not a cast failure
family: expressions
tier: extended
feature_ids: [in-operator, errors, geometric]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '(0,0)'::point IN ('(0,0,0,0)'::box, point(0,0))
    expect: error
    sqlstate: "42883"
    comment: "operator does not exist: point = box"
