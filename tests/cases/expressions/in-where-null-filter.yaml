# NULL-producing predicates in WHERE filter out rows, so NOT IN with a NULL element returns nothing.
id: expressions.in-where-null-filter
title: WHERE clause with NOT IN over a list containing NULL returns no rows
family: expressions
tier: core
feature_ids: [in-operator, null-semantics, select, where]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE f (a int4);
  INSERT INTO f VALUES (1), (2), (3), (NULL);
steps:
  - sql: |
      SELECT a FROM f WHERE a NOT IN (1, NULL) ORDER BY a
    expect: rows
    order: ordered
    comment: every non-NULL row yields NULL or FALSE, so the result is empty
  - sql: |
      SELECT a FROM f WHERE a IN (1, NULL) ORDER BY a
    expect: rows
    order: ordered
    comment: only a=1 passes
