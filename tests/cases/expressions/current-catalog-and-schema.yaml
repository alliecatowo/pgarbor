# current_catalog, current_schema and search_path interaction, including a nonexistent schema.
id: expressions.current-catalog-and-schema
title: current_catalog, current_schema and SET search_path interaction
family: expressions
tier: extended
feature_ids: [sqlvalue-functions, search-path, catalog-introspection]
required_capabilities: [select, set]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT current_catalog = current_database() AS same_db
    expect: rows
    order: ordered
  - sql: |
      SELECT current_schema AS s
    expect: rows
    order: ordered
    comment: default search path resolves to public
  - sql: |
      SET search_path = 'notme'
    expect: ok
  - sql: |
      SELECT current_schema AS s
    expect: rows
    order: ordered
    comment: nonexistent schema is skipped, so current_schema is NULL
  - sql: |
      SET search_path = 'pg_catalog'
    expect: ok
  - sql: |
      SELECT current_schema AS s
    expect: rows
    order: ordered
  - sql: |
      RESET search_path
    expect: ok
