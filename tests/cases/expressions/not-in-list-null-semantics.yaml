# NOT IN is the negation of IN under three-valued logic, so NULL elements can make it NULL.
id: expressions.not-in-list-null-semantics
title: NOT IN with NULL list elements and NULL operands
family: expressions
tier: core
feature_ids: [in-operator, null-semantics, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1), (NULL), (3);
steps:
  - sql: |
      SELECT a, a NOT IN (1, NULL) AS r1, a NOT IN (2, NULL) AS r2, a NOT IN (1, 2) AS r3 FROM t ORDER BY a
    expect: rows
    order: ordered
    comment: a=1 with NULL in list gives false; a=3 with NULL gives NULL
  - sql: |
      SELECT NULL::int4 NOT IN (1, 2) AS r4, 'x'::text NOT IN ('y', NULL) AS r5
    expect: rows
    order: ordered
