# Lists of 9+ constants can be planned as hashed ScalarArrayOp. Results must match the
# linear form (fewer elements) and the NULL semantics must be identical.
id: expressions.in-list-hashed-int
title: Large integer IN lists agree with small lists, including NULL handling
family: expressions
tier: core
feature_ids: [in-operator, null-semantics, int4]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE inttest (a int4);
  INSERT INTO inttest VALUES (NULL), (0), (1);
steps:
  - sql: |
      SELECT a,
             a IN (1, 2, 3, 4, 5, 6, 7, 8) AS lin,
             a IN (1, 2, 3, 4, 5, 6, 7, 8, 9) AS big,
             a IN (NULL, 1, 2, 3, 4, 5, 6, 7) AS lin_null,
             a IN (NULL, 1, 2, 3, 4, 5, 6, 7, 8) AS big_null
      FROM inttest ORDER BY a
    expect: rows
    order: ordered
    comment: columns lin and big must agree on every row; NULL row yields NULL
  - sql: |
      SELECT a,
             a NOT IN (1, 2, 3, 4, 5, 6, 7, 8) AS lin,
             a NOT IN (1, 2, 3, 4, 5, 6, 7, 8, 9) AS big,
             a NOT IN (NULL, 1, 2, 3, 4, 5, 6, 7) AS lin_null,
             a NOT IN (NULL, 1, 2, 3, 4, 5, 6, 7, 8) AS big_null
      FROM inttest ORDER BY a
    expect: rows
    order: ordered
