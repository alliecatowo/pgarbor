# A list made only of NULLs can never produce TRUE; the result is NULL.
id: expressions.in-list-all-null-elements
title: IN over a list of only NULL elements yields NULL, not false
family: expressions
tier: extended
feature_ids: [in-operator, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1 IN (NULL, NULL, NULL) AS a, 1 NOT IN (NULL, NULL) AS b, NULL IN (NULL) AS c
    expect: rows
    order: ordered
    comment: all three results are NULL
