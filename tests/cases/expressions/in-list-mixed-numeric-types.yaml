# Mixed integer and numeric IN elements resolve to a common numeric type; explicit casts agree.
id: expressions.in-list-mixed-numeric-types
title: IN list mixing int and numeric literals resolves to a common type
family: expressions
tier: core
feature_ids: [in-operator, numeric, int4]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE nums (a int4);
  INSERT INTO nums VALUES (1), (2), (8);
steps:
  - sql: |
      SELECT a, a IN (1, 4, 8.0) AS r, a::int4 IN (1, 4, 8.0) AS r2 FROM nums ORDER BY a
    expect: rows
    order: ordered
    comment: r and r2 must be identical on every row; 8 matches 8.0
