# An unknown-type literal that cannot be coerced to the left operand type fails at parse analysis.
id: expressions.in-literal-coercion-error
title: IN list literal that is not a valid integer raises invalid_text_representation
family: expressions
tier: extended
feature_ids: [in-operator, errors, int4]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 errcodes 22P02; expressions.sql IN-list coercion"
sessions: [a]
steps:
  - sql: |
      SELECT 1 IN ('x')
    expect: error
    sqlstate: "22P02"
