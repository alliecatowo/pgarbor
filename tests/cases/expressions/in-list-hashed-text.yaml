# Text IN list long enough to use the hashed path; empty string and NULL are distinct.
id: expressions.in-list-hashed-text
title: Long text IN list distinguishes empty string from NULL
family: expressions
tier: extended
feature_ids: [in-operator, null-semantics, text]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/expressions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE tt (s text);
  INSERT INTO tt VALUES ('a'), (''), (NULL), ('zz');
steps:
  - sql: |
      SELECT s,
             s IN ('a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j') AS hit,
             s IN ('a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', NULL) AS hit_null,
             s NOT IN ('a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j') AS miss
      FROM tt ORDER BY s
    expect: rows
    order: ordered
