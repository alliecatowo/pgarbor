# datatype.sgml datatype-money: cast to numeric before dividing, then cast back to money, for a rounded result.
id: doc-datatype-money.divide-via-numeric-cast
title: Divide in numeric and cast back to money for a rounded result
family: doc-datatype-money
tier: core
feature_ids: [money, arithmetic, division, casts, rounding]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (cast to numeric before dividing)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '2.00'::money::numeric / 3 AS q
    expect: rows
    comment: numeric division keeps full precision
  - sql: |
      SELECT ('2.00'::money::numeric / 3)::money AS r, ('10.00'::money::numeric / 3)::money AS s
    expect: rows
    comment: the documented preferred pattern rounds to 0.67 and 3.33
