# datatype.sgml datatype-money: input accepted in several currency formats; invalid syntax is rejected.
id: doc-datatype-money.input-formats-and-invalid
title: Money input accepts currency formatting and rejects exponent notation
family: doc-datatype-money
tier: core
feature_ids: [money, input, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (input formats such as '$1,000.00')"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '$1,000.00'::money AS a, '1000'::money AS b, '(1000.5)'::money AS c, '-$5.00'::money AS d, '1,000'::money AS e
    expect: rows
    comment: currency symbol, grouping, integer literal, parenthesized negative
  - sql: |
      SELECT '1e3'::money
    expect: error
    sqlstate: "22P02"
    comment: exponent notation is not accepted
