# datatype.sgml datatype-money: money operators take money or the listed numeric operands, not arbitrary integers on either side.
id: doc-datatype-money.operator-type-errors
title: Money plus integer and integer divided by money have no operator
family: doc-datatype-money
tier: core
feature_ids: [money, arithmetic, errors, operators]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (money operand types)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '1.00'::money + '1.00'::money AS ok
    expect: rows
  - sql: |
      SELECT '1.00'::money + 1
    expect: error
    sqlstate: "42883"
    comment: no money plus integer operator exists; the integer must be cast or the money side is wrong
  - sql: |
      SELECT 3 / '1.5'::money
    expect: error
    sqlstate: "42883"
    comment: dividing a plain integer by money has no operator
