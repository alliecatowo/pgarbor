# datatype.sgml datatype-money: money casts to numeric losslessly; other types need two stages.
id: doc-datatype-money.numeric-float8-two-stage-cast
title: Money casts to numeric losslessly and to float8 only in two stages
family: doc-datatype-money
tier: core
feature_ids: [money, casts, documented-examples]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (money to numeric to float8 example)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '52093.89'::money::numeric AS n, '52093.89'::money::numeric::float8 AS f
    expect: rows
    comment: the documented two-stage cast
  - sql: |
      SELECT '52093.89'::money::float8
    expect: error
    sqlstate: "42846"
    comment: direct money to float8 is not provided
  - sql: |
      SELECT '3.00'::money::int8
    expect: error
    sqlstate: "42846"
    comment: direct money to integer types is not provided
