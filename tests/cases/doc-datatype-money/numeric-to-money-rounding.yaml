# datatype.sgml datatype-money: numeric and text input are rounded to two fractional digits.
id: doc-datatype-money.numeric-to-money-rounding
title: Numeric and text input round to two fractional digits
family: doc-datatype-money
tier: core
feature_ids: [money, casts, rounding]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money-table (fractional precision of two digits)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '12.345'::numeric::money AS a, '12.355'::numeric::money AS b, '1.005'::money AS c
    expect: rows
    comment: half values round away from zero at the second fractional digit
