# datatype.sgml datatype-money: division of money by integer zero raises a division-by-zero error.
id: doc-datatype-money.divide-by-zero
title: Money divided by integer zero raises division by zero
family: doc-datatype-money
tier: core
feature_ids: [money, arithmetic, division, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (division by integer)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '10'::money / 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT '10.00'::money / 1 AS ok
    expect: rows
    comment: the same division by one succeeds
