# datatype.sgml datatype-money: money multiplied by integer, float and bigint values in either operand order.
id: doc-datatype-money.multiply-variants
title: Money multiplied by integer, bigint, smallint and fractional values
family: doc-datatype-money
tier: core
feature_ids: [money, arithmetic, multiplication]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (money arithmetic)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '1.5'::money * 2 AS a, 2 * '1.5'::money AS b, '1.5'::money * 2.5 AS c, 3::int8 * '1.5'::money AS d, '1.5'::money * 3::int8 AS e, 2::int2 * '1.5'::money AS f
    expect: rows
    comment: operand order does not matter for integer multipliers
