# datatype.sgml datatype-money-table: the documented range is -92233720368547758.08 to +92233720368547758.07.
id: doc-datatype-money.range-boundary
title: Money accepts the documented range endpoints and rejects values just outside
family: doc-datatype-money
tier: core
feature_ids: [money, types, range, errors]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money-table (range)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '92233720368547758.07'::money AS hi, '-92233720368547758.08'::money AS lo, 92233720368547758::money AS whole
    expect: rows
    comment: both documented endpoints are accepted
  - sql: |
      SELECT '92233720368547758.08'::money
    expect: error
    sqlstate: "22003"
    comment: one cent above the maximum is out of range
  - sql: |
      SELECT 92233720368547759::money
    expect: error
    sqlstate: "22003"
    comment: a bigint whose cent value overflows int8 is out of range
