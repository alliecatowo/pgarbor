# datatype.sgml datatype-money: money divided by an integer truncates the fraction toward zero.
id: doc-datatype-money.divide-by-integer-truncates
title: Money divided by an integer truncates toward zero
family: doc-datatype-money
tier: core
feature_ids: [money, arithmetic, division]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (division by integer truncates)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '10.00'::money / 3 AS a, '-10.00'::money / 3 AS b, '2.00'::money / 3 AS c
    expect: rows
    comment: 3.33, -3.33 (toward zero, not floor) and 0.66 (not 0.67)
