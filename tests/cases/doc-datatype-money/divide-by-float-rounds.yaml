# datatype.sgml datatype-money: dividing by a floating-point value gives a rounded result.
id: doc-datatype-money.divide-by-float-rounds
title: Money divided by a fractional value rounds the result
family: doc-datatype-money
tier: core
feature_ids: [money, arithmetic, division, rounding]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (rounded division by floating-point value)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '2.00'::money / 3.0 AS a, '-10.00'::money / 3.0 AS b, '10.00'::money / 4::numeric AS c
    expect: rows
    comment: 2.00 / 3.0 gives 0.67 where integer division gave 0.66
