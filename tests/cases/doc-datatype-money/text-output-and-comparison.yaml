# datatype.sgml datatype-money: output is formatted with the currency symbol; values compare by amount.
id: doc-datatype-money.text-output-and-comparison
title: Money text output uses currency formatting and comparison is by amount
family: doc-datatype-money
tier: core
feature_ids: [money, output, comparison]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (output formatting)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '-1000.00'::money::text AS t, '1000.50'::money AS m
    expect: rows
    comment: negative output carries the sign before the symbol and grouping separators
  - sql: |
      SELECT '1.00'::money = '1'::money AS eq, '1.00'::money < '1.01'::money AS lt
    expect: rows
