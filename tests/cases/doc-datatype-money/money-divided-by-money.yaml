# datatype.sgml datatype-money: money divided by money yields a double precision pure number.
id: doc-datatype-money.money-divided-by-money
title: Money divided by money yields a double precision number
family: doc-datatype-money
tier: core
feature_ids: [money, arithmetic, division, types]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (money divided by money)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT ('10.00'::money / '2.00'::money)::numeric AS q, pg_typeof('10.00'::money / '2.00'::money)::text AS t
    expect: rows
    comment: the currency units cancel, so the result is a pure number of type double precision
  - sql: |
      SELECT round(('10.00'::money / '3.00'::money)::numeric, 6) AS q
    expect: rows
    comment: rounded to avoid depending on float8 text output
