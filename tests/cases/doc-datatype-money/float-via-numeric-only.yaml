# datatype.sgml datatype-money: float to money goes through numeric; the direct cast is not provided.
id: doc-datatype-money.float-via-numeric-only
title: Float to money converts only through numeric
family: doc-datatype-money
tier: core
feature_ids: [money, casts, documented-examples]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (two-stage float cast example)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT '12.34'::float8::numeric::money AS m
    expect: rows
    comment: the documented two-stage conversion
  - sql: |
      SELECT '12.34'::float8::money
    expect: error
    sqlstate: "42846"
    comment: docs say floats are not recommended and must go via numeric; no direct float8 to money cast
