# datatype.sgml datatype-money: integer and bigint values can be cast to money.
id: doc-datatype-money.int-bigint-to-money
title: Integer and bigint values cast to money
family: doc-datatype-money
tier: core
feature_ids: [money, casts]
required_capabilities: [select, money, guc]
provenance:
  source: pg-docs
  ref: "src/sgml/datatype.sgml#datatype-money (int, bigint to money)"
sessions: [a]
steps:
  - sql: |
      SET lc_monetary TO 'C'
    expect: ok
  - sql: |
      SELECT 1000::int4::money AS a, 2::int8::money AS b, 0::int8::money AS c, (-7)::int8::money AS d
    expect: rows
