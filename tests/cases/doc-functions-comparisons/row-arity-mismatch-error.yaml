# Documented requirement that both row constructors have the same number of fields.
id: doc-functions-comparisons.row-arity-mismatch-error
title: Row comparison with different field counts is an error
family: doc-functions-comparisons
tier: core
feature_ids: [row-constructor, row-wise-comparison, error-reporting]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#row-wise-comparison"
steps:
  - sql: |
      SELECT ROW(1, 2) = ROW(1, 2, 3)
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT ROW(1, 2) IS DISTINCT FROM ROW(1)
    expect: error
    sqlstate: "42601"
