# Documented binary row comparison operators *= and *<> for composite types: compare internal binary representation.
id: doc-functions-comparisons.composite-binary-compare
title: Composite binary comparison operators compare row representation
family: doc-functions-comparisons
tier: extended
feature_ids: [composite-type-comparison, binary-row-compare, create-type]
required_capabilities: [select, create-table, create-type]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#composite-type-comparison"
setup: |
  CREATE TABLE bin_pair (x int, y int);
steps:
  - sql: |
      SELECT ROW(1, 2)::bin_pair *= ROW(1, 2)::bin_pair AS same_binary, ROW(1, 2)::bin_pair *<> ROW(1, 3)::bin_pair AS different_binary, ROW(1, NULL)::bin_pair *= ROW(1, NULL)::bin_pair AS null_same_binary
    expect: rows
