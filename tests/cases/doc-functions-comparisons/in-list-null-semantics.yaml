# Documented IN and NOT IN with a parenthesized list: a NULL on either side makes the result NULL unless a non-null match decides it.
id: doc-functions-comparisons.in-list-null-semantics
title: IN and NOT IN over a value list follow SQL null rules
family: doc-functions-comparisons
tier: core
feature_ids: [in-list, not-in-list, null-semantics, three-valued-logic]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparisons-in-scalar"
steps:
  - sql: |
      SELECT 2 IN (1, 2) AS match_found, 3 IN (1, NULL, 3) AS match_after_null, 3 IN (1, NULL) AS no_match_with_null, 1 IN (NULL) AS only_null, NULL::int IN (1, 2) AS null_lhs
    expect: rows
  - sql: |
      SELECT 4 NOT IN (1, NULL) AS unknown_not_in, 1 NOT IN (1, 2) AS false_not_in, NULL::int NOT IN (1, 2) AS null_lhs_not_in, 5 NOT IN (1, 2) AS true_not_in
    expect: rows
