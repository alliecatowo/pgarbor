# Documented ANY and SOME over an array: empty array gives false, NULL array gives NULL, a NULL element gives NULL unless another element matches. SOME is a synonym.
id: doc-functions-comparisons.any-some-array-null-semantics
title: ANY and SOME over arrays handle empty, NULL array and NULL element cases
family: doc-functions-comparisons
tier: core
feature_ids: [any-array, some-array, null-semantics, array-literal]
required_capabilities: [select, arrays]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparisons-any-some"
steps:
  - sql: |
      SELECT 2 = ANY(ARRAY[1, 2, 3]) AS any_hit, 2 = SOME(ARRAY[1, 2, 3]) AS some_hit, 5 = ANY(ARRAY[1, 2, 3]) AS any_miss, 5 = ANY('{}'::int[]) AS empty_array
    expect: rows
  - sql: |
      SELECT 5 = ANY(NULL::int[]) AS null_array, NULL::int = ANY('{1, 2}'::int[]) AS null_lhs, 5 = ANY('{NULL, 2}'::int[]) AS null_element_no_hit, 2 = ANY('{NULL, 2}'::int[]) AS null_element_hit
    expect: rows
  - sql: |
      SELECT 'a' = ANY(ARRAY['a', NULL]) AS text_hit, 'b' = ANY(ARRAY['a', NULL]) AS text_null, 3 < ANY('{1, 5}'::int[]) AS ordering_operator, 3 > ANY('{NULL, 5}'::int[]) AS ordering_null_element
    expect: rows
