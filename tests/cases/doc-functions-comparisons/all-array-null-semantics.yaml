# Documented ALL over an array: empty array gives true, NULL array gives NULL, and a NULL element gives NULL unless a false comparison decides it.
id: doc-functions-comparisons.all-array-null-semantics
title: ALL over arrays handles empty, NULL array and NULL element cases
family: doc-functions-comparisons
tier: core
feature_ids: [all-array, null-semantics, array-literal]
required_capabilities: [select, arrays]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparisons-all"
steps:
  - sql: |
      SELECT 5 <> ALL('{}'::int[]) AS empty_true, 5 > ALL(NULL::int[]) AS null_array, 5 > ALL('{1, 2}'::int[]) AS all_true, 2 < ALL('{1, 2}'::int[]) AS one_false
    expect: rows
  - sql: |
      SELECT 5 > ALL('{1, NULL}'::int[]) AS null_element_unknown, 0 > ALL('{1, NULL}'::int[]) AS false_decides, 'b' = ALL(ARRAY['b', NULL]) AS text_null_element
    expect: rows
