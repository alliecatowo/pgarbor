# Documented row-constructor ordering: elements are compared left to right and the first unequal or null pair decides, so later NULLs are never examined.
id: doc-functions-comparisons.row-constructor-ordering
title: Row constructor ordering stops at the first unequal or NULL pair
family: doc-functions-comparisons
tier: core
feature_ids: [row-constructor, row-wise-comparison, null-semantics, ordering-operators]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#row-wise-comparison"
steps:
  - sql: |
      SELECT ROW(1, 2, NULL) < ROW(1, 3, 0) AS decided_before_null, ROW(2, NULL) > ROW(1, 3) AS first_pair_decides, ROW(1, NULL) < ROW(1, 2) AS null_pair_unknown, ROW(1, 2) < ROW(1, 2) AS equal_not_less, ROW(1, 2) <= ROW(1, 2) AS equal_le, ROW(1, 2) >= ROW(1, 3) AS ge_false
    expect: rows
