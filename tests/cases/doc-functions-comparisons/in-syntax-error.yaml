# Documented IN list shape: the right-hand side must be a non-empty parenthesized list.
id: doc-functions-comparisons.in-syntax-error
title: IN with an empty list is a syntax error
family: doc-functions-comparisons
tier: core
feature_ids: [in-list, syntax-error]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparisons-in-scalar"
steps:
  - sql: |
      SELECT 1 IN ()
    expect: error
    sqlstate: "42601"
