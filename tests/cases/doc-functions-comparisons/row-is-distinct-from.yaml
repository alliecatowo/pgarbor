# Documented IS [NOT] DISTINCT FROM for row constructors: never NULL, and two NULLs in the same position are not distinct.
id: doc-functions-comparisons.row-is-distinct-from
title: Row constructor IS DISTINCT FROM treats NULL as a comparable value
family: doc-functions-comparisons
tier: core
feature_ids: [row-constructor, is-distinct-from, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#row-wise-comparison"
steps:
  - sql: |
      SELECT ROW(1, NULL) IS DISTINCT FROM ROW(1, NULL) AS same_nulls_distinct, ROW(1, NULL) IS NOT DISTINCT FROM ROW(1, NULL) AS same_nulls_not_distinct, ROW(1, NULL) IS DISTINCT FROM ROW(1, 2) AS null_vs_value, ROW(1, 2) IS NOT DISTINCT FROM ROW(1, 2) AS equal_values, ROW(1, 2) IS DISTINCT FROM ROW(1, 3) AS unequal_values
    expect: rows
