# Documented error conditions for ANY and ALL: the right-hand side must be an array, and the operator must exist for the element and array types.
id: doc-functions-comparisons.any-all-error-paths
title: ANY and ALL reject non-array right-hand sides and missing operators
family: doc-functions-comparisons
tier: core
feature_ids: [any-array, all-array, error-reporting]
required_capabilities: [select, arrays, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#functions-comparisons-any-some"
steps:
  - sql: |
      SELECT 1 = ANY(5)
    expect: error
    sqlstate: "42809"
    comment: right-hand side is a scalar, not an array
  - sql: |
      SELECT 1 = ALL(NULL::int)
    expect: error
    sqlstate: "42809"
    comment: a NULL scalar of a non-array type is still not an array
  - sql: |
      SELECT 1 = ANY('{1,2}'::text[])
    expect: error
    sqlstate: "42883"
    comment: no integer = text operator exists
