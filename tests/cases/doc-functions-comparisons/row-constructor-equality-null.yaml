# Documented row-constructor = and <> rules: unequal if any non-null pair differs, equal only if all pairs are non-null and equal, otherwise NULL.
id: doc-functions-comparisons.row-constructor-equality-null
title: Row constructor equality yields true, false or NULL by pairwise rules
family: doc-functions-comparisons
tier: core
feature_ids: [row-constructor, row-wise-comparison, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#row-wise-comparison"
steps:
  - sql: |
      SELECT ROW(1, 2, NULL) = ROW(1, 2, 3) AS undecided_eq, ROW(1, 2, NULL) = ROW(1, 3, NULL) AS unequal_eq, ROW(1, 2, NULL) <> ROW(1, 3, NULL) AS unequal_ne, ROW(1, 2, NULL) <> ROW(1, 2, 3) AS undecided_ne, ROW(1, NULL) = ROW(1, NULL) AS null_pair_eq, ROW(1, NULL) <> ROW(1, NULL) AS null_pair_ne, ROW(1, 2) = ROW(1, 2) AS all_equal
    expect: rows
