# Documented composite type comparison outside row constructors: NULL fields compare equal to each other and NULL sorts larger than any non-NULL.
id: doc-functions-comparisons.composite-null-compare
title: Composite values compare NULL fields as equal and larger than non-NULL
family: doc-functions-comparisons
tier: core
feature_ids: [composite-type-comparison, null-semantics, create-type]
required_capabilities: [select, create-table, create-type]
provenance:
  source: pg-docs
  ref: "src/sgml/func.sgml#composite-type-comparison"
setup: |
  CREATE TABLE cmp_pair (x int, y int);
steps:
  - sql: |
      SELECT ROW(1, NULL)::cmp_pair = ROW(1, NULL)::cmp_pair AS null_fields_equal, ROW(NULL, NULL)::cmp_pair <> ROW(NULL, NULL)::cmp_pair AS null_fields_not_unequal, ROW(1, 2)::cmp_pair = ROW(1, NULL)::cmp_pair AS value_vs_null_unequal
    expect: rows
  - sql: |
      SELECT ROW(1, NULL)::cmp_pair < ROW(1, 2)::cmp_pair AS null_not_less, ROW(1, NULL)::cmp_pair > ROW(1, 2)::cmp_pair AS null_is_larger, ROW(1, NULL)::cmp_pair IS DISTINCT FROM ROW(1, NULL)::cmp_pair AS same_composite_is_distinct
    expect: rows
    comment: IS DISTINCT FROM on composite operands uses the same record comparison, so identical rows with NULL fields are not distinct
