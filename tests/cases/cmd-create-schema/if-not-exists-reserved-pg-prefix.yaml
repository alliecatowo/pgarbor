# The pg_ prefix check runs even with IF NOT EXISTS: pg_catalog (which exists) and an unused pg_ name both fail
# with reserved_name 42939, and the unused name is not created.
id: cmd-create-schema.if-not-exists-reserved-pg-prefix
title: IF NOT EXISTS does not bypass the pg_ reserved-prefix check
family: cmd-create-schema
tier: core
feature_ids: [create-schema, if-not-exists, errors]
required_capabilities: [create-schema, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/create_schema.sgml#sql-createschema (Parameters: schema_name, pg_ prefix reserved)"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA IF NOT EXISTS pg_catalog
    expect: error
    sqlstate: "42939"
  - sql: |
      CREATE SCHEMA IF NOT EXISTS pg_newthing
    expect: error
    sqlstate: "42939"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 'pg_newthing'
    expect: rows
    comment: no schema was created
