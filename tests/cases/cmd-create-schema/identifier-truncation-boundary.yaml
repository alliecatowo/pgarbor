# A schema name longer than 63 bytes is truncated (NOTICE 42622) and the statement still succeeds.
# The truncation rule comes from the identifier rules (sql-syntax-lexical), applied to schema_name here.
id: cmd-create-schema.identifier-truncation-boundary
title: A 72-character schema name is truncated to 63 bytes with a notice
family: cmd-create-schema
tier: extended
feature_ids: [create-schema, identifiers, boundary-values]
required_capabilities: [create-schema, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_schema.sgml#sql-createschema (Parameters: schema_name); sql-syntax-lexical.sgml#SQL-SYNTAX-IDENTIFIERS"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_ABCDEFGH"
    expect: notice
    comment: notice 42622 identifier will be truncated
  - sql: |
      SELECT length(nspname), nspname = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_' AS is_truncated_form
      FROM pg_namespace WHERE nspname LIKE 'ABCDEF%'
    expect: rows
