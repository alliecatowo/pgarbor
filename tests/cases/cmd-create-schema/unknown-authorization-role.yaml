# AUTHORIZATION naming a role that does not exist fails with undefined_object 42704 and creates no schema,
# with or without schema elements.
id: cmd-create-schema.unknown-authorization-role
title: AUTHORIZATION with an unknown role fails 42704 and leaves no schema behind
family: cmd-create-schema
tier: core
feature_ids: [create-schema, authorization, errors]
required_capabilities: [create-schema, create-table, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 ref/create_schema.sgml (Parameters: user_name); errcodes 42704"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA AUTHORIZATION no_such_role_xyz_1
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE SCHEMA s_bad AUTHORIZATION no_such_role_xyz_1 CREATE TABLE t (a int)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's_bad'
    expect: rows
    comment: the failed statement is rolled back, so no schema exists
