# The documented equivalent form (separate CREATE SCHEMA, CREATE TABLE, CREATE VIEW statements) yields the same
# objects and the same view rows as the single CREATE SCHEMA with subcommands.
id: cmd-create-schema.equivalent-separate-commands
title: Separate DDL statements produce the same schema contents as CREATE SCHEMA subcommands
family: cmd-create-schema
tier: core
feature_ids: [create-schema, create-table, create-view, select]
required_capabilities: [create-schema, create-table, create-view, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_schema.sgml#sql-createschema (Examples: The following is an equivalent way of accomplishing the same result)"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA hollywood
    expect: ok
  - sql: |
      CREATE TABLE hollywood.films (title text, release date, awards text[])
    expect: ok
  - sql: |
      CREATE VIEW hollywood.winners AS
          SELECT title, release FROM hollywood.films WHERE awards IS NOT NULL
    expect: ok
  - sql: |
      INSERT INTO hollywood.films VALUES ('Casablanca', '1942-01-23', ARRAY['Best Picture']), ('Plan 9', '1957-07-07', NULL)
    expect: ok
  - sql: |
      SELECT n.nspname, c.relname, c.relkind FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE n.nspname = 'hollywood' ORDER BY c.relname
    expect: rows
    order: ordered
  - sql: |
      SELECT title, release FROM hollywood.winners ORDER BY title
    expect: rows
    order: ordered
