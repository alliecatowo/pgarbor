# The documented example: CREATE SCHEMA with CREATE TABLE and CREATE VIEW subcommands. The view sees only
# films with a non-null awards value.
id: cmd-create-schema.hollywood-doc-example
title: Documented hollywood example creates a table and a view that filters on awards
family: cmd-create-schema
tier: core
feature_ids: [create-schema, create-table, create-view, select, null-semantics]
required_capabilities: [create-schema, create-table, create-view, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_schema.sgml#sql-createschema (Examples: Create a schema and create a table and view within it)"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA hollywood
          CREATE TABLE films (title text, release date, awards text[])
          CREATE VIEW winners AS
              SELECT title, release FROM films WHERE awards IS NOT NULL
    expect: ok
  - sql: |
      INSERT INTO hollywood.films VALUES
        ('Casablanca', '1942-01-23', ARRAY['Best Picture']),
        ('Plan 9', '1957-07-07', NULL),
        ('Ben-Hur', '1959-11-18', ARRAY[]::text[])
    expect: ok
  - sql: |
      SELECT title, release FROM hollywood.winners ORDER BY title
    expect: rows
    order: ordered
    comment: NULL awards is excluded; an empty array is not NULL and is included
  - sql: |
      SELECT table_name, table_type FROM information_schema.tables WHERE table_schema = 'hollywood' ORDER BY table_name
    expect: rows
    order: ordered
