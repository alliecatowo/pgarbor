# Syntax rules: a name is required unless AUTHORIZATION is given; IF NOT EXISTS cannot carry schema elements
# (the server answers 0A000 feature_not_supported, not a syntax error); CURRENT_ROLE is only a role_specification.
id: cmd-create-schema.syntax-errors-no-name-and-elements-if-not-exists
title: Missing name, IF NOT EXISTS with schema elements, and bare CURRENT_ROLE are rejected without side effects
family: cmd-create-schema
tier: core
feature_ids: [create-schema, syntax-errors, if-not-exists]
required_capabilities: [create-schema, create-table, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "ref/create_schema.sgml#sql-createschema (Synopsis; Parameters: IF NOT EXISTS)"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE SCHEMA IF NOT EXISTS s9 CREATE TABLE x (a int)
    expect: error
    sqlstate: "0A000"
    comment: schema_element subcommands cannot be combined with IF NOT EXISTS
  - sql: |
      CREATE SCHEMA CURRENT_ROLE
    expect: error
    sqlstate: "42601"
    comment: CURRENT_ROLE is only accepted after AUTHORIZATION
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's9'
    expect: rows
    comment: the refused statement created nothing
