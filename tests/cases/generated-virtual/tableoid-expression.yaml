# tableoid is the one system column a virtual generated expression may reference.
id: generated-virtual.tableoid-expression
title: Virtual generated columns may reference tableoid, including when added later with ALTER TABLE
family: generated-virtual
tier: extended
feature_ids: [generated-columns, catalog-introspection, alter-table]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest_tableoid (a int PRIMARY KEY, b bool GENERATED ALWAYS AS (tableoid = 'gtest_tableoid'::regclass) VIRTUAL);
  INSERT INTO gtest_tableoid VALUES (1), (2);
steps:
  - sql: |
      SELECT a, b FROM gtest_tableoid ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE gtest_tableoid ADD COLUMN c regclass GENERATED ALWAYS AS (tableoid) VIRTUAL
    expect: ok
  - sql: |
      SELECT a, b, c FROM gtest_tableoid ORDER BY a
    expect: rows
    order: ordered
