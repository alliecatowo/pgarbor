# Explicit non-DEFAULT values for a virtual generated column are rejected on INSERT.
id: generated-virtual.insert-explicit-value-rejected
title: INSERT of an explicit value into a virtual generated column fails with 428C9
family: generated-virtual
tier: core
feature_ids: [generated-columns, insert, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) VIRTUAL);
steps:
  - sql: |
      INSERT INTO gtest1 VALUES (3, 33)
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO gtest1 VALUES (3, 33), (4, 44)
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO gtest1 VALUES (3, DEFAULT), (4, 44)
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO gtest1 VALUES (3, 33), (4, DEFAULT)
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO gtest1 VALUES (3, DEFAULT), (4, DEFAULT)
    expect: ok
  - sql: |
      SELECT a, b FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
    comment: rejected statements inserted nothing
