# A child table may override an inherited virtual generated column with its own expression.
id: generated-virtual.inheritance-override
title: Child table overriding an inherited virtual generated column uses its own expression
family: generated-virtual
tier: extended
feature_ids: [generated-columns, inheritance, create-table, insert, select]
required_capabilities: [create-table, insert, select, inheritance]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) VIRTUAL);
  CREATE TABLE gtestx (x int, b int GENERATED ALWAYS AS (a * 22) VIRTUAL) INHERITS (gtest1);
  INSERT INTO gtest1 (a) VALUES (1), (2);
steps:
  - sql: |
      INSERT INTO gtestx (a, x) VALUES (11, 22)
    expect: ok
  - sql: |
      SELECT a, b FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
    comment: row 11 comes from the child and uses 11 * 22
  - sql: |
      SELECT a, b, x FROM gtestx ORDER BY a
    expect: rows
    order: ordered
