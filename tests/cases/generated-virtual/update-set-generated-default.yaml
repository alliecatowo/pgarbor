# UPDATE of a virtual generated column: explicit value rejected, DEFAULT accepted and recomputed.
id: generated-virtual.update-set-generated-default
title: UPDATE SET of a virtual generated column rejects values and accepts DEFAULT
family: generated-virtual
tier: core
feature_ids: [generated-columns, update, errors]
required_capabilities: [create-table, insert, update, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) VIRTUAL);
  INSERT INTO gtest1 (a) VALUES (1), (2);
steps:
  - sql: |
      UPDATE gtest1 SET b = 11 WHERE a = 1
    expect: error
    sqlstate: "428C9"
  - sql: |
      UPDATE gtest1 SET b = DEFAULT WHERE a = 1
    expect: ok
  - sql: |
      SELECT a, b FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      UPDATE gtest1 SET a = 5 WHERE a = 2
    expect: ok
  - sql: |
      SELECT a, b FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
    comment: changing the base column changes the computed value on read
