# Catalog metadata for virtual generated columns: information_schema and pg_attribute.attgenerated.
id: generated-virtual.information-schema-metadata
title: information_schema.columns and pg_attribute report virtual generated columns
family: generated-virtual
tier: extended
feature_ids: [generated-columns, catalog-introspection]
required_capabilities: [create-table, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) VIRTUAL);
  CREATE TABLE gtest2 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (NULL) VIRTUAL);
steps:
  - sql: |
      SELECT table_name, column_name, column_default, is_nullable, is_generated, generation_expression FROM information_schema.columns WHERE table_schema = 'public' ORDER BY 1, 2
    expect: rows
    order: ordered
  - sql: |
      SELECT table_name, column_name, dependent_column FROM information_schema.column_column_usage WHERE table_schema = 'public' ORDER BY 1, 2, 3
    expect: rows
    order: ordered
  - sql: |
      SELECT attname, attgenerated FROM pg_attribute WHERE attrelid = 'gtest1'::regclass AND attnum > 0 ORDER BY attnum
    expect: rows
    order: ordered
