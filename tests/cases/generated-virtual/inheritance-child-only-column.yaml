# A virtual generated column that exists only in the child table is computed from inherited columns.
id: generated-virtual.inheritance-child-only-column
title: Child-only virtual generated column is computed and updates through the parent see it
family: generated-virtual
tier: extended
feature_ids: [generated-columns, inheritance, update, select]
required_capabilities: [create-table, insert, update, select, inheritance]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtestp (f1 int);
  CREATE TABLE gtestc (f2 int GENERATED ALWAYS AS (f1 + 1) VIRTUAL) INHERITS (gtestp);
  INSERT INTO gtestc VALUES (42);
steps:
  - sql: |
      TABLE gtestc
    expect: rows
    order: ordered
  - sql: |
      UPDATE gtestp SET f1 = f1 * 10
    expect: ok
  - sql: |
      TABLE gtestc
    expect: rows
    order: ordered
    comment: the update through the parent reaches the child and f2 follows f1
