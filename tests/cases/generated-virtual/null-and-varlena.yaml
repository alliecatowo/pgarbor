# A virtual generated column with a NULL expression, and a simple column reference over varlena with NULL input.
id: generated-virtual.null-and-varlena
title: NULL generation expression yields NULL; varlena pass-through reference handles NULL base values
family: generated-virtual
tier: core
feature_ids: [generated-columns, null-semantics, select, text]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest2 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (NULL) VIRTUAL);
  INSERT INTO gtest2 VALUES (1);
  CREATE TABLE gtest_varlena (a varchar, b varchar GENERATED ALWAYS AS (a) VIRTUAL);
  INSERT INTO gtest_varlena (a) VALUES ('01234567890123456789'), (NULL);
steps:
  - sql: |
      SELECT a, b, b IS NULL AS b_null FROM gtest2
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b, b IS NULL AS b_null FROM gtest_varlena ORDER BY a NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT length(b), b = a AS same FROM gtest_varlena ORDER BY a NULLS LAST
    expect: rows
    order: ordered
