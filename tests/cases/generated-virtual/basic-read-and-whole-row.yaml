# Virtual generated column is computed on read; DEFAULT insert; whole-row and sublink references.
id: generated-virtual.basic-read-and-whole-row
title: Virtual generated column computed on read, DEFAULT insert, whole-row and sublink reads
family: generated-virtual
tier: slice
feature_ids: [generated-columns, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) VIRTUAL);
steps:
  - sql: |
      INSERT INTO gtest1 VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO gtest1 VALUES (2, DEFAULT)
    expect: ok
  - sql: |
      SELECT a, b FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT gtest1 FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
    comment: whole-row reference includes the computed column
  - sql: |
      SELECT a, (SELECT gtest1.b) FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
    comment: sublink referencing the generated column
  - sql: |
      SELECT a, b, b * 2 AS b2 FROM gtest1 WHERE b = 4 ORDER BY a
    expect: rows
    order: ordered
