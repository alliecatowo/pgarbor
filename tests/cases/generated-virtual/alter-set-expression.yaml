# ALTER COLUMN SET EXPRESSION changes reads immediately; DROP EXPRESSION rules for virtual columns.
id: generated-virtual.alter-set-expression
title: SET EXPRESSION recomputes existing rows; invalid targets and DROP EXPRESSION IF EXISTS behave as specified
family: generated-virtual
tier: core
feature_ids: [generated-columns, alter-table, errors, notices]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest29 (a int, b int GENERATED ALWAYS AS (a * 2) VIRTUAL);
  INSERT INTO gtest29 (a) VALUES (3), (4);
steps:
  - sql: |
      SELECT a, b FROM gtest29 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE gtest29 ALTER COLUMN a SET EXPRESSION AS (a * 3)
    expect: error
    comment: a is not a generated column
  - sql: |
      ALTER TABLE gtest29 ALTER COLUMN a DROP EXPRESSION IF EXISTS
    expect: notice
    comment: IF EXISTS on a non-generated column only emits a notice
  - sql: |
      ALTER TABLE gtest29 ALTER COLUMN b SET EXPRESSION AS (a * 3)
    expect: ok
  - sql: |
      SELECT a, b FROM gtest29 ORDER BY a
    expect: rows
    order: ordered
    comment: existing rows are read with the new expression
  - sql: |
      ALTER TABLE gtest29 ALTER COLUMN b DROP EXPRESSION
    expect: error
    comment: not supported for virtual generated columns
  - sql: |
      INSERT INTO gtest29 (a) VALUES (5)
    expect: ok
  - sql: |
      SELECT a, b FROM gtest29 ORDER BY a
    expect: rows
    order: ordered
