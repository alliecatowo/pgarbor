# Invalid virtual generated column definitions are rejected at CREATE TABLE time.
id: generated-virtual.definition-errors
title: Self-reference, unknown column, non-immutable, aggregate and window expressions are rejected
family: generated-virtual
tier: core
feature_ids: [generated-columns, create-table, errors]
required_capabilities: [create-table, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
steps:
  - sql: |
      CREATE TABLE gtest_err_2a (a int PRIMARY KEY, b int GENERATED ALWAYS AS (b * 2) VIRTUAL)
    expect: error
    sqlstate: "42P17"
    comment: self-reference
  - sql: |
      CREATE TABLE gtest_err_3 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (c * 2) VIRTUAL)
    expect: error
    sqlstate: "42703"
    comment: unknown column
  - sql: |
      CREATE TABLE gtest_err_4 (a int PRIMARY KEY, b double precision GENERATED ALWAYS AS (random()) VIRTUAL)
    expect: error
    sqlstate: "42P17"
    comment: expression must be immutable
  - sql: |
      CREATE TABLE gtest_err_7a (a int PRIMARY KEY, b int GENERATED ALWAYS AS (avg(a)) VIRTUAL)
    expect: error
    sqlstate: "42803"
  - sql: |
      CREATE TABLE gtest_err_7b (a int PRIMARY KEY, b int GENERATED ALWAYS AS (row_number() OVER (ORDER BY a)) VIRTUAL)
    expect: error
    sqlstate: "42P20"
  - sql: |
      CREATE TABLE gtest_err_1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) VIRTUAL GENERATED ALWAYS AS (a * 3) VIRTUAL)
    expect: error
    comment: duplicate generation clause, sqlstate not asserted
  - sql: |
      CREATE TABLE gtest_err_8 (a int PRIMARY KEY, b int GENERATED BY DEFAULT AS (a * 2) VIRTUAL)
    expect: error
    comment: GENERATED BY DEFAULT is not allowed for generated columns
  - sql: |
      SELECT count(*) FROM information_schema.tables WHERE table_name LIKE 'gtest_err%'
    expect: rows
    order: multiset
    comment: no failed definition left a table behind
