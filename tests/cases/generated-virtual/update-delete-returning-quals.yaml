# UPDATE and DELETE qualified on a virtual generated column, with RETURNING old.* and new.*.
id: generated-virtual.update-delete-returning-quals
title: UPDATE and DELETE filtered on a virtual generated column with RETURNING old and new
family: generated-virtual
tier: core
feature_ids: [generated-columns, update, delete, returning]
required_capabilities: [create-table, insert, update, delete, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_virtual.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE gtest1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) VIRTUAL);
  INSERT INTO gtest1 (a) VALUES (1), (2), (3), (4);
steps:
  - sql: |
      UPDATE gtest1 SET a = 30 WHERE b = 4 RETURNING old.*, new.*
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM gtest1 WHERE b = 6 RETURNING a, b
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b FROM gtest1 ORDER BY a
    expect: rows
    order: ordered
