# Frame-bound validation: negative offsets, start after end, and RANGE offsets on a non-numeric ordering column.
id: doc-functions-window.frame-offset-errors
title: Window frame bound validation errors
family: doc-functions-window
tier: core
feature_ids: [window-functions, window-frames, range-frames, rows-frames]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-docs
  ref: "postgres-18/doc/src/sgml/func.sgml#functions-window (frame specifications)"
setup: |
  CREATE TABLE fr (id int4 PRIMARY KEY, v text);
  INSERT INTO fr VALUES (1,'a'), (2,'b'), (3,'c');
steps:
  - sql: |
      SELECT id, sum(id) OVER (ORDER BY id ROWS BETWEEN 1 FOLLOWING AND 0 PRECEDING) FROM fr
    expect: error
    sqlstate: "42P20"
    comment: a frame starting at a following row cannot end at a preceding row
  - sql: |
      SELECT id, sum(id) OVER (ORDER BY id ROWS -1 PRECEDING) FROM fr
    expect: error
    sqlstate: "22013"
    comment: frame offsets must not be negative
  - sql: |
      SELECT id, count(*) OVER (ORDER BY v RANGE BETWEEN 1 PRECEDING AND CURRENT ROW) FROM fr
    expect: error
    sqlstate: "0A000"
    comment: RANGE with an offset needs an ordering type that supports addition and subtraction
  - sql: |
      SELECT id, sum(id) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS s FROM fr ORDER BY id
    expect: rows
    order: ordered
    comment: a valid bounded ROWS frame succeeds
