# UNION/CASE/COALESCE type resolution with domain-typed inputs, checked via pg_typeof. Adapted
# from domain.sql "check that union/case/coalesce type resolution handles domains properly".
id: domain.coalesce-type-resolution
title: COALESCE over domain-typed arguments resolves to a type reported by pg_typeof
family: domain
tier: extended
feature_ids: [domains, create-domain, coalesce, catalog-introspection, cast]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/domain.sql"
sessions: [a]
setup: |
  CREATE DOMAIN domainint4 int4;
steps:
  - sql: |
      SELECT pg_typeof(COALESCE(4::domainint4, 7)) AS mixed_args
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(COALESCE(4::domainint4, 7::domainint4)) AS both_domain
    expect: rows
    order: ordered
  - sql: |
      SELECT COALESCE(NULL::domainint4, 7) AS fallback
    expect: rows
    order: ordered
    comment: NULL first argument falls through to the second
