# AND and OR are commutative, including when an operand is NULL.
id: doc-functions-logical.and-or-commutative
title: AND and OR give the same result with operands swapped
family: doc-functions-logical
tier: core
feature_ids: [logical-operators, boolean-and, boolean-or, commutativity, null-semantics]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (commutativity paragraph)"
sessions: [a]
steps:
  - sql: |
      SELECT a, b,
             (a AND b) IS NOT DISTINCT FROM (b AND a) AS and_commutes,
             (a OR b) IS NOT DISTINCT FROM (b OR a) AS or_commutes
      FROM (VALUES (true), (false), (NULL::boolean)) AS x(a)
      CROSS JOIN (VALUES (true), (false), (NULL::boolean)) AS y(b)
    expect: rows
    order: multiset
    comment: IS NOT DISTINCT FROM treats NULL = NULL as true, so every row should report true
