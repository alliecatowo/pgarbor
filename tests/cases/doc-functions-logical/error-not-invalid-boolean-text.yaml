# A string that is not a valid boolean literal fails when coerced to boolean for NOT.
id: doc-functions-logical.error-not-invalid-boolean-text
title: NOT of an invalid boolean literal raises 22P02
family: doc-functions-logical
tier: extended
feature_ids: [boolean-not, boolean-input, error-path]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (NOT operand must be boolean; datatype-boolean accepted literals)"
sessions: [a]
steps:
  - sql: |
      SELECT NOT 'abc'
    expect: error
    sqlstate: "22P02"
    comment: the unknown literal is read as boolean input and rejected
