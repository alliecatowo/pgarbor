# SQL three-valued AND: TRUE AND TRUE = TRUE, any FALSE operand gives FALSE, otherwise NULL.
id: doc-functions-logical.and-truth-table
title: AND truth table over TRUE, FALSE and NULL operands
family: doc-functions-logical
tier: core
feature_ids: [logical-operators, boolean-and, null-semantics, three-valued-logic]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (AND truth table)"
sessions: [a]
steps:
  - sql: |
      SELECT a, b, a AND b AS r
      FROM (VALUES (true), (false), (NULL::boolean)) AS x(a)
      CROSS JOIN (VALUES (true), (false), (NULL::boolean)) AS y(b)
    expect: rows
    order: multiset
    comment: all nine combinations; FALSE dominates NULL, TRUE AND NULL is NULL
