# A comparison with NULL yields NULL, which the logical operators propagate by the same tables.
id: doc-functions-logical.null-comparison-three-valued
title: Logical operators over comparisons that yield NULL
family: doc-functions-logical
tier: core
feature_ids: [logical-operators, null-semantics, three-valued-logic, comparison]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (truth tables with NULL operands)"
sessions: [a]
steps:
  - sql: |
      SELECT
        (1 = NULL) AS cmp_null,
        NOT (1 = NULL) AS not_cmp_null,
        ((1 = NULL) AND false) AS null_and_false,
        ((1 = NULL) OR true) AS null_or_true,
        ((1 = NULL) AND true) AS null_and_true,
        ((1 = NULL) OR false) AS null_or_false
    expect: rows
    order: multiset
