# NOT inverts TRUE and FALSE and leaves NULL unknown.
id: doc-functions-logical.not-truth-table
title: NOT truth table including NULL staying NULL
family: doc-functions-logical
tier: core
feature_ids: [logical-operators, boolean-not, null-semantics, three-valued-logic]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (NOT truth table)"
sessions: [a]
steps:
  - sql: |
      SELECT a, NOT a AS r
      FROM (VALUES (true), (false), (NULL::boolean)) AS x(a)
    expect: rows
    order: multiset
