# TRUE OR NULL is TRUE, so a row with a NULL flag still qualifies through the other branch.
id: doc-functions-logical.where-or-null-true-includes
title: WHERE with OR keeps NULL-flag rows when the other branch is TRUE
family: doc-functions-logical
tier: core
feature_ids: [where-filter, boolean-or, boolean-not, null-semantics]
required_capabilities: [create-table, insert, select, where-filter, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (OR truth table applied to WHERE)"
sessions: [a]
setup: |
  CREATE TABLE flags (id int4 PRIMARY KEY, flag boolean);
  INSERT INTO flags VALUES (1, true), (2, false), (3, NULL);
steps:
  - sql: |
      SELECT id FROM flags WHERE flag OR id = 3 ORDER BY id
    expect: rows
    order: ordered
    comment: row 3 qualifies because NULL OR TRUE is TRUE
  - sql: |
      SELECT id FROM flags WHERE NOT (flag OR id = 3) ORDER BY id
    expect: rows
    order: ordered
    comment: NOT (NULL OR TRUE) is FALSE, so row 3 is excluded and only row 2 remains
