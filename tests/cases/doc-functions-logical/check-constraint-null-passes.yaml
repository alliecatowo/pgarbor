# A CHECK constraint is violated only when its expression is FALSE; NULL passes.
id: doc-functions-logical.check-constraint-null-passes
title: CHECK constraint with a boolean expression accepts NULL results
family: doc-functions-logical
tier: core
feature_ids: [check-constraint, boolean-and, null-semantics, three-valued-logic]
required_capabilities: [create-table, insert, select, check-constraint, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (NULL result semantics); ddl-constraints check constraints"
sessions: [a]
setup: |
  CREATE TABLE c (id int4 PRIMARY KEY, x boolean CHECK (x AND true));
steps:
  - sql: |
      INSERT INTO c VALUES (1, NULL)
    expect: ok
    comment: NULL AND TRUE is NULL, which does not violate the CHECK
  - sql: |
      INSERT INTO c VALUES (2, true)
    expect: ok
  - sql: |
      INSERT INTO c VALUES (3, false)
    expect: error
    sqlstate: "23514"
    comment: FALSE AND TRUE is FALSE, which violates the CHECK
  - sql: |
      SELECT id, x FROM c ORDER BY id
    expect: rows
    order: ordered
