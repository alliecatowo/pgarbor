# Without parentheses NOT binds tightest, then AND, then OR.
id: doc-functions-logical.precedence-not-and-or
title: Operator precedence of NOT, AND and OR
family: doc-functions-logical
tier: core
feature_ids: [logical-operators, operator-precedence, boolean-and, boolean-or, boolean-not]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical; sql-syntax-lexical operator precedence table"
sessions: [a]
steps:
  - sql: |
      SELECT
        (true OR false AND false) AS or_of_and,
        ((true OR false) AND false) AS parenthesized_or_first,
        (NOT false AND false) AS not_then_and,
        (NOT true OR true) AS not_then_or
    expect: rows
    order: multiset
    comment: AND binds tighter than OR, so the first column is TRUE and the second FALSE
