# SQL three-valued OR: any TRUE operand gives TRUE, FALSE OR FALSE = FALSE, otherwise NULL.
id: doc-functions-logical.or-truth-table
title: OR truth table over TRUE, FALSE and NULL operands
family: doc-functions-logical
tier: core
feature_ids: [logical-operators, boolean-or, null-semantics, three-valued-logic]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (OR truth table)"
sessions: [a]
steps:
  - sql: |
      SELECT a, b, a OR b AS r
      FROM (VALUES (true), (false), (NULL::boolean)) AS x(a)
      CROSS JOIN (VALUES (true), (false), (NULL::boolean)) AS y(b)
    expect: rows
    order: multiset
    comment: all nine combinations; TRUE dominates NULL, FALSE OR NULL is NULL
