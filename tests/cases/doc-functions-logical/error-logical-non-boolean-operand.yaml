# AND, OR and NOT require boolean operands; an integer operand is a datatype mismatch.
id: doc-functions-logical.error-logical-non-boolean-operand
title: Integer operands to AND, OR and NOT raise 42804
family: doc-functions-logical
tier: core
feature_ids: [logical-operators, boolean-and, boolean-or, boolean-not, error-path]
required_capabilities: [select, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (operand type boolean)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AND true
    expect: error
    sqlstate: "42804"
    comment: argument of AND must be type boolean, not type integer
  - sql: |
      SELECT 1 OR true
    expect: error
    sqlstate: "42804"
    comment: argument of OR must be type boolean, not type integer
  - sql: |
      SELECT NOT 1
    expect: error
    sqlstate: "42804"
    comment: argument of NOT must be type boolean, not type integer
