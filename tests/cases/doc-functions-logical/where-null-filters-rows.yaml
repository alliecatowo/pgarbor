# A WHERE clause keeps only rows where the condition is TRUE; NULL conditions drop the row,
# and NOT NULL is still NULL.
id: doc-functions-logical.where-null-filters-rows
title: WHERE with AND and NOT drops rows whose condition is NULL
family: doc-functions-logical
tier: core
feature_ids: [where-filter, boolean-and, boolean-not, null-semantics]
required_capabilities: [create-table, insert, select, where-filter, boolean-type]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-logical (NULL truth tables applied to WHERE)"
sessions: [a]
setup: |
  CREATE TABLE flags (id int4 PRIMARY KEY, flag boolean);
  INSERT INTO flags VALUES (1, true), (2, false), (3, NULL);
steps:
  - sql: |
      SELECT id FROM flags WHERE flag ORDER BY id
    expect: rows
    order: ordered
    comment: row 3 has flag NULL and is excluded
  - sql: |
      SELECT id FROM flags WHERE NOT flag ORDER BY id
    expect: rows
    order: ordered
    comment: NOT NULL is NULL, so row 3 is still excluded
  - sql: |
      SELECT id FROM flags WHERE flag AND id = 3 ORDER BY id
    expect: rows
    order: ordered
    comment: NULL AND FALSE is FALSE, so no row qualifies
  - sql: |
      SELECT id FROM flags WHERE NOT (flag AND id > 0) ORDER BY id
    expect: rows
    order: ordered
    comment: only row 2 has flag FALSE; NOT (NULL AND TRUE) is NULL and row 3 is excluded
