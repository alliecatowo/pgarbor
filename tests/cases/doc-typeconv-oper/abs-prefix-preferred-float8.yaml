# Prefix @ has several candidates; an unknown literal resolves to float8 (preferred numeric type), so out-of-range float8 input errors.
id: doc-typeconv-oper.abs-prefix-preferred-float8
title: Prefix @ resolves unknown literals to float8 and rejects out-of-range input
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, unknown-literals, prefix-operators, float8, numeric]
required_capabilities: [select, operators, float8]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: Absolute-Value and Negation Operator Type Resolution)"
steps:
  - sql: |
      SELECT @ '-4.5' AS abs
    expect: rows
  - sql: |
      SELECT @ '-4.5e500' AS overflow
    expect: error
    sqlstate: "22003"
    comment: error proves the float8 candidate was chosen
  - sql: |
      SELECT @ NULL AS nul
    expect: rows
    comment: NULL unknown literal resolves to float8 and yields NULL
  - sql: |
      SELECT @ '-9223372036854775808' AS abs_min
    expect: rows
    comment: int8 minimum parsed as float8, output in exponent form
