# Bitwise negation on int8 boundaries: the minimum maps to the maximum (two's complement), and NULL stays NULL.
id: doc-typeconv-oper.bitnot-int8-boundary-null
title: Bitwise negation at int8 boundaries and on NULL
family: doc-typeconv-oper
tier: core
feature_ids: [prefix-operators, integer-types, boundaries, null-semantics]
required_capabilities: [select, operators, int8]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: Absolute-Value and Negation Operator Type Resolution)"
steps:
  - sql: |
      SELECT ~ CAST('-9223372036854775808' AS int8) AS neg_min, ~ CAST('9223372036854775807' AS int8) AS neg_max
    expect: rows
  - sql: |
      SELECT ~ NULL::int8 AS neg_null
    expect: rows
    comment: NULL input yields NULL
  - sql: |
      SELECT ~ CAST('-21' AS int8) AS back
    expect: rows
    comment: double negation identity; ~(-21) = 20
