# Two unknown literals and no preferred type: the "+" operator cannot be chosen, so the statement fails with 42725.
id: doc-typeconv-oper.unknown-unknown-ambiguous
title: Binary + with two unknown literals is not unique; one cast resolves it
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, unknown-literals, integer-types]
required_capabilities: [select, operators, int4]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#op-resol-exact-unknown (documented: two unknown inputs never match at the exact-match step)"
steps:
  - sql: |
      SELECT '1' + '2' AS twounk
    expect: error
    sqlstate: "42725"
  - sql: |
      SELECT CAST('1' AS int4) + '2' AS one_cast
    expect: rows
    comment: known int4 side makes the unknown literal int4
