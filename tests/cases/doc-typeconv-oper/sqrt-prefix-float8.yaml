# Square-root prefix operator |/ has exactly one candidate (float8), so an unknown literal and an integer are both converted to double precision.
id: doc-typeconv-oper.sqrt-prefix-float8
title: Prefix |/ resolves its single candidate and converts an integer operand to double precision
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, prefix-operators, float8]
required_capabilities: [select, operators, float8]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: Square Root Operator Type Resolution)"
steps:
  - sql: |
      SELECT |/ 40 AS "square root of 40"
    expect: rows
  - sql: |
      SELECT |/ CAST(40 AS double precision) AS x
    expect: rows
    comment: the documented equivalent form must produce the same value
  - sql: |
      SELECT |/ '40' AS sqrt_unknown
    expect: rows
    comment: unknown literal has one candidate, float8
