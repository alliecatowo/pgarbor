# With a known bit-string operand, the unknown literal is assumed bit; the bit || bit operator matches exactly.
id: doc-typeconv-oper.bit-string-concat-preference
title: Concatenation of a bit string with an unknown literal resolves to bit-string concatenation
family: doc-typeconv-oper
tier: extended
feature_ids: [operator-resolution, unknown-literals, bit-string, text-concat]
required_capabilities: [select, operators, bit]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: String Concatenation Operator Type Resolution)"
steps:
  - sql: |
      SELECT B'10' || '01' AS bitcat
    expect: rows
    comment: unknown literal becomes bit; result 1001 rather than text
  - sql: |
      SELECT pg_typeof(B'10' || '01')::text AS result_type
    expect: rows
