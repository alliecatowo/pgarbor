# The unknown literal in "<@" with an integer left operand is ambiguous between array and range inclusion; an explicit range cast removes the ambiguity.
id: doc-typeconv-oper.range-inclusion-explicit-cast
title: Range inclusion with an integer left operand needs an explicit range cast to avoid ambiguity
family: doc-typeconv-oper
tier: extended
feature_ids: [operator-resolution, unknown-literals, ranges]
required_capabilities: [select, operators, rangetypes]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: Array Inclusion Operator Type Resolution)"
steps:
  - sql: |
      SELECT 1 <@ '[1,3]' AS inrange
    expect: error
    sqlstate: "42725"
    comment: no preferred type; the unknown literal cannot be resolved from the integer alone
  - sql: |
      SELECT 1 <@ '[1,3]'::int4range AS inrange
    expect: rows
  - sql: |
      SELECT 5 <@ '[1,3]'::int4range AS notinrange
    expect: rows
