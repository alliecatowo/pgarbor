# An explicit numeric cast selects the numeric @ operator instead of the float8 one, so the value stays exact.
id: doc-typeconv-oper.numeric-abs-explicit-cast
title: Explicit numeric cast selects the numeric absolute-value operator
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, prefix-operators, numeric, exact-match]
required_capabilities: [select, operators, numeric]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#op-resol-exact-match (example: Absolute-Value and Negation Operator Type Resolution)"
steps:
  - sql: |
      SELECT @ CAST('-4.5' AS numeric) AS absnum
    expect: rows
  - sql: |
      SELECT @ CAST('-0.10' AS numeric) AS trailing
    expect: rows
    comment: numeric keeps the input scale, so the result prints as 0.10
