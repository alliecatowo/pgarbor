# Two unknown-type literals with || prefer the string category and then text; NULL propagates through ||.
id: doc-typeconv-oper.concat-unknown-text
title: String concatenation with unknown literals resolves to text and propagates NULL
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, unknown-literals, text-concat, null-semantics]
required_capabilities: [select, operators, text]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: String Concatenation Operator Type Resolution)"
steps:
  - sql: |
      SELECT text 'abc' || 'def' AS "text and unknown"
    expect: rows
  - sql: |
      SELECT 'abc' || 'def' AS unspecified
    expect: rows
  - sql: |
      SELECT pg_typeof('abc' || 'def')::text AS result_type
    expect: rows
    comment: unknown || unknown resolves to text
  - sql: |
      SELECT 'abc' || NULL AS a, NULL || 'x' AS b, NULL || NULL AS c
    expect: rows
    comment: NULL unknown literal takes type text; || is strict
