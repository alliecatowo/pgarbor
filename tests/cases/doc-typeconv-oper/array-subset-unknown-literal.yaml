# An unknown literal on the right of <@ takes the integer-array type from the left operand (rule op-resol-last-unknown); bad text is a parse error.
id: doc-typeconv-oper.array-subset-unknown-literal
title: Array inclusion operator with an unknown array literal, including membership failure and malformed input
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, unknown-literals, arrays]
required_capabilities: [select, operators, arrays]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: Array Inclusion Operator Type Resolution)"
steps:
  - sql: |
      SELECT array[1,2] <@ '{1,2,3}' AS "is subset"
    expect: rows
  - sql: |
      SELECT array[1,4] <@ '{1,2,3}' AS not_subset
    expect: rows
    comment: element 4 absent, so false
  - sql: |
      SELECT array[1,2] <@ '{1,a}' AS bad
    expect: error
    sqlstate: "22P02"
    comment: unknown literal is parsed as int[]; 'a' is invalid
