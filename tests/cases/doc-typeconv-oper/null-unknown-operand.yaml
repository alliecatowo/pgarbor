# A NULL with unknown type takes the type of the other operand (exact-unknown step), so NULL + 1 is int4 NULL.
id: doc-typeconv-oper.null-unknown-operand
title: Unknown NULL operand takes the type of the other operand and yields NULL
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, unknown-literals, null-semantics, integer-types]
required_capabilities: [select, operators, int4]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#op-resol-exact-unknown"
steps:
  - sql: |
      SELECT NULL + 1 AS nullplus
    expect: rows
  - sql: |
      SELECT pg_typeof(NULL + 1)::text AS plus_type
    expect: rows
    comment: result type is integer
  - sql: |
      SELECT NULL || NULL AS nullcat
    expect: rows
    comment: two unknown inputs have no exact match, but string-category preference picks text || text; NULL result
