# A schema-qualified operator name considers only operators in that schema; a schema without the operator gives 42883.
id: doc-typeconv-oper.qualified-operator-schema
title: Schema-qualified operator name restricts candidates to that schema
family: doc-typeconv-oper
tier: extended
feature_ids: [operator-resolution, schema-qualified-operators, prefix-operators]
required_capabilities: [select, operators, create-schema]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#op-resol-select"
steps:
  - sql: |
      SELECT OPERATOR(pg_catalog.@) '-4.5' AS qual
    expect: rows
  - sql: |
      SELECT OPERATOR(public.@) '-4.5' AS qual_public
    expect: error
    sqlstate: "42883"
    comment: public schema has no @ operator
