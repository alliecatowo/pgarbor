# Prefix ~ is defined for several integer types, so an unknown literal is ambiguous until an explicit cast picks int8.
id: doc-typeconv-oper.bitnot-ambiguous-unknown
title: Prefix ~ with an unknown literal is not unique; an explicit cast selects the int8 operator
family: doc-typeconv-oper
tier: core
feature_ids: [operator-resolution, unknown-literals, prefix-operators, integer-types]
required_capabilities: [select, operators, int8]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-oper (example: Absolute-Value and Negation Operator Type Resolution)"
steps:
  - sql: |
      SELECT ~ '20' AS negation
    expect: error
    sqlstate: "42725"
    comment: operator is not unique
  - sql: |
      SELECT ~ CAST('20' AS int8) AS negation
    expect: rows
    comment: documented fix; -21
