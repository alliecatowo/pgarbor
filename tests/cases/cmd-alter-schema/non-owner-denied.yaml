# Only the owner may ALTER SCHEMA: a non-owner's RENAME and OWNER TO fail with insufficient_privilege and nothing changes.
id: cmd-alter-schema.non-owner-denied
title: A non-owner cannot rename or re-own a schema
family: cmd-alter-schema
tier: core
feature_ids: [alter-schema, privileges, owner, errors]
required_capabilities: [create-schema, create-role, alter-schema, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_schema.sgml#sql-alterschema (Description: You must own the schema)"
sessions: [a]
setup: |
  CREATE ROLE cmd_as_nown NOLOGIN;
  CREATE SCHEMA cmd_as_nown_s;
steps:
  - sql: |
      SET ROLE cmd_as_nown
    expect: ok
  - sql: |
      ALTER SCHEMA cmd_as_nown_s RENAME TO cmd_as_nown_t
    expect: error
    sqlstate: "42501"
  - sql: |
      ALTER SCHEMA cmd_as_nown_s OWNER TO cmd_as_nown
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT nspname, pg_get_userbyid(nspowner) <> 'cmd_as_nown' AS not_reowned FROM pg_namespace WHERE nspname LIKE 'cmd_as_nown%' ORDER BY nspname
    expect: rows
    order: ordered
    comment: the schema keeps its name and owner
  - sql: |
      DROP SCHEMA cmd_as_nown_s; DROP ROLE cmd_as_nown
    expect: ok
