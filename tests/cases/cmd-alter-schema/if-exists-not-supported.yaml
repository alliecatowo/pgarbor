# The ALTER SCHEMA synopsis has no IF EXISTS clause, so the form is a syntax error (not a notice as in DROP SCHEMA IF EXISTS).
id: cmd-alter-schema.if-exists-not-supported
title: ALTER SCHEMA IF EXISTS is a syntax error for both RENAME and OWNER TO
family: cmd-alter-schema
tier: core
feature_ids: [alter-schema, syntax, errors]
required_capabilities: [alter-schema, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_schema.sgml#sql-alterschema (Synopsis)"
sessions: [a]
steps:
  - sql: |
      ALTER SCHEMA IF EXISTS cmd_as_nosuch RENAME TO cmd_as_other
    expect: error
    sqlstate: "42601"
    compare_message: false
  - sql: |
      ALTER SCHEMA IF EXISTS cmd_as_nosuch OWNER TO CURRENT_USER
    expect: error
    sqlstate: "42601"
    compare_message: false
