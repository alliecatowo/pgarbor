# Renaming onto an existing schema name fails with duplicate_schema, including renaming a schema to its own current name.
id: cmd-alter-schema.rename-to-existing-name
title: RENAME TO an existing schema name, including its own name, fails with duplicate_schema
family: cmd-alter-schema
tier: core
feature_ids: [alter-schema, rename, schema-name-uniqueness]
required_capabilities: [create-schema, alter-schema, select, errors]
provenance:
  source: hand
  ref: "ref/alter_schema.sgml#sql-alterschema (Parameters: new_name); ref/create_schema.sgml"
sessions: [a]
setup: |
  CREATE SCHEMA cmd_as_dup_a;
  CREATE SCHEMA cmd_as_dup_b;
steps:
  - sql: |
      ALTER SCHEMA cmd_as_dup_a RENAME TO cmd_as_dup_b
    expect: error
    sqlstate: "42P06"
  - sql: |
      ALTER SCHEMA cmd_as_dup_a RENAME TO cmd_as_dup_a
    expect: error
    sqlstate: "42P06"
    comment: the schema's own name is already taken
  - sql: |
      SELECT nspname FROM pg_namespace WHERE nspname LIKE 'cmd_as_dup_%' ORDER BY nspname
    expect: rows
    order: ordered
    comment: both schemas keep their names
  - sql: |
      DROP SCHEMA cmd_as_dup_a; DROP SCHEMA cmd_as_dup_b
    expect: ok
