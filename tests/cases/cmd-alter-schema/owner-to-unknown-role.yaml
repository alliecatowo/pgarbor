# OWNER TO a role that does not exist fails with undefined_object and leaves the schema owner unchanged.
id: cmd-alter-schema.owner-to-unknown-role
title: ALTER SCHEMA OWNER TO an undefined role fails and keeps the owner
family: cmd-alter-schema
tier: core
feature_ids: [alter-schema, owner, errors]
required_capabilities: [create-schema, alter-schema, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_schema.sgml#sql-alterschema (Synopsis: OWNER TO new_owner)"
sessions: [a]
setup: |
  CREATE SCHEMA cmd_as_noown;
steps:
  - sql: |
      ALTER SCHEMA cmd_as_noown OWNER TO cmd_as_no_such_role
    expect: error
    sqlstate: "42704"
    compare_message: false
  - sql: |
      SELECT pg_get_userbyid(nspowner) = current_user AS owner_unchanged FROM pg_namespace WHERE nspname = 'cmd_as_noown'
    expect: rows
  - sql: |
      DROP SCHEMA cmd_as_noown
    expect: ok
