# ALTER SCHEMA on a schema that does not exist fails with invalid_schema_name for RENAME and for OWNER TO; there is no IF EXISTS form.
id: cmd-alter-schema.rename-missing-schema
title: ALTER SCHEMA on a missing schema fails for both RENAME and OWNER TO
family: cmd-alter-schema
tier: core
feature_ids: [alter-schema, rename, owner, errors]
required_capabilities: [alter-schema, select, errors]
provenance:
  source: hand
  ref: "ref/alter_schema.sgml#sql-alterschema (Synopsis)"
sessions: [a]
steps:
  - sql: |
      ALTER SCHEMA cmd_as_nosuch RENAME TO cmd_as_other
    expect: error
    sqlstate: "3F000"
  - sql: |
      ALTER SCHEMA cmd_as_nosuch OWNER TO CURRENT_USER
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname IN ('cmd_as_nosuch', 'cmd_as_other')
    expect: rows
    comment: nothing was created or renamed
