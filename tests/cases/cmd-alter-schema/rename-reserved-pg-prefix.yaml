# The new name may not begin with pg_ (42939), but a quoted mixed-case name such as "PG_x" is not that prefix and is accepted.
id: cmd-alter-schema.rename-reserved-pg-prefix
title: RENAME TO rejects a pg_ prefix while a quoted PG_ name is accepted
family: cmd-alter-schema
tier: core
feature_ids: [alter-schema, rename, reserved-names, identifiers]
required_capabilities: [create-schema, alter-schema, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_schema.sgml#sql-alterschema (Parameters: new_name)"
sessions: [a]
setup: |
  CREATE SCHEMA cmd_as_plain;
steps:
  - sql: |
      ALTER SCHEMA cmd_as_plain RENAME TO pg_cmd_as
    expect: error
    sqlstate: "42939"
    comment: pg_ names are reserved for system schemas
  - sql: |
      SELECT nspname FROM pg_namespace WHERE nspname = 'cmd_as_plain'
    expect: rows
    comment: the failed rename leaves the schema under its original name
  - sql: |
      ALTER SCHEMA cmd_as_plain RENAME TO "PG_cmd_as"
    expect: ok
    comment: quoted identifier with upper-case letters does not start with the lower-case pg_ prefix
  - sql: |
      SELECT nspname FROM pg_namespace WHERE nspname = 'PG_cmd_as'
    expect: rows
    order: ordered
  - sql: |
      DROP SCHEMA "PG_cmd_as"
    expect: ok
