# Transaction id 0 is not a valid xmin or xip member of a snapshot.
id: txid.snapshot-zero-xid
title: txid_snapshot input rejects zero as xmin or as an xip member
family: txid
tier: core
feature_ids: [txid-snapshot, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '0:1:'::txid_snapshot
    expect: error
    sqlstate: "22P02"
    comment: zero xmin
  - sql: |
      SELECT '12:13:0'::txid_snapshot
    expect: error
    sqlstate: "22P02"
    comment: zero xip member
