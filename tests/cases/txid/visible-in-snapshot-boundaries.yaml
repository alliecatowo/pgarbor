# Visibility: xids below xmin are visible, xids at or above xmax are not, and listed xip members are not.
id: txid.visible-in-snapshot-boundaries
title: txid_visible_in_snapshot classifies xids around xmin, xmax and the xip list
family: txid
tier: core
feature_ids: [txid-snapshot, txid-visibility, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT id, txid_visible_in_snapshot(id, '12:20:13,15,18'::txid_snapshot) AS visible
      FROM generate_series(11, 21) AS id
      ORDER BY id
    expect: rows
    order: ordered
    comment: ids below xmin 12 and id 12 itself, plus unlisted ids 14 16 17 19, are visible; listed 13 15 18 and ids from xmax 20 upward are not
