# An xid beyond the next one to be assigned is rejected by txid_status with invalid_parameter_value.
id: txid.status-future-xid
title: txid_status rejects an xid in the future with 22023
family: txid
tier: core
feature_ids: [txid-status, errors, transactions]
required_capabilities: [select, errors, transactions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT txid_status(9223372036854775807)
    expect: error
    sqlstate: "22023"
    comment: argument is the largest int8, far past the newest assigned xid; a literal argument keeps the message ("transaction ID 9223372036854775807 is in the future") identical across runs, unlike txid_current() + N which embeds the allocation-dependent xid
  - sql: |
      ROLLBACK
    expect: ok
