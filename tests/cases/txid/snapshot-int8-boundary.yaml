# The largest int8 xid is accepted in a snapshot; one past it overflows and is rejected.
id: txid.snapshot-int8-boundary
title: txid_snapshot accepts the int8 maximum as xmax and rejects overflow
family: txid
tier: extended
feature_ids: [txid-snapshot, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '1:9223372036854775807:3'::txid_snapshot
    expect: rows
    comment: 2^63 minus 1 is the largest accepted xmax
  - sql: |
      SELECT '1:9223372036854775808:3'::txid_snapshot
    expect: error
    sqlstate: "22P02"
    comment: 2^63 overflows the int8 xid range
