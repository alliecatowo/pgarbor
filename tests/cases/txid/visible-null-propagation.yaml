# The txid snapshot functions are strict: a NULL argument produces NULL rather than an error.
id: txid.visible-null-propagation
title: txid snapshot functions return NULL for NULL arguments
family: txid
tier: core
feature_ids: [txid-snapshot, txid-visibility, null-handling]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT txid_visible_in_snapshot(NULL::bigint, '12:13:'::txid_snapshot) IS NULL AS null_xid
    expect: rows
  - sql: |
      SELECT txid_visible_in_snapshot(15::bigint, NULL::txid_snapshot) IS NULL AS null_snapshot
    expect: rows
  - sql: |
      SELECT txid_snapshot_xmax(NULL::txid_snapshot) IS NULL AS null_xmax
    expect: rows
