# A snapshot whose xmin exceeds xmax is malformed input.
id: txid.snapshot-xmin-gt-xmax
title: txid_snapshot input with xmin greater than xmax is rejected
family: txid
tier: core
feature_ids: [txid-snapshot, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '31:12:'::txid_snapshot
    expect: error
    sqlstate: "22P02"
    comment: xmin 31 is greater than xmax 12
