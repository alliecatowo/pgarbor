# Bootstrap (1) and frozen (2) xids are always reported as committed.
id: txid.status-bootstrap-frozen
title: txid_status reports the bootstrap and frozen xids as committed
family: txid
tier: extended
feature_ids: [txid-status]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT txid_status(1::bigint) AS bootstrap
    expect: rows
    comment: BootstrapTransactionId is always committed
  - sql: |
      SELECT txid_status(2::bigint) AS frozen
    expect: rows
    comment: FrozenTransactionId is always committed
