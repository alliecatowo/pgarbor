# Visibility checks work on xids above 2^32 as well as small xids.
id: txid.visible-in-snapshot-64bit
title: txid_visible_in_snapshot handles 64-bit xids inside and outside the snapshot
family: txid
tier: extended
feature_ids: [txid-snapshot, txid-visibility, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '1000100010001000:1000100010001100:1000100010001012,1000100010001013'::txid_snapshot
    expect: rows
  - sql: |
      SELECT txid_visible_in_snapshot(1000100010001012,
        '1000100010001000:1000100010001100:1000100010001012,1000100010001013'::txid_snapshot) AS in_progress
    expect: rows
    comment: listed xip member, so not visible
  - sql: |
      SELECT txid_visible_in_snapshot(1000100010001015,
        '1000100010001000:1000100010001100:1000100010001012,1000100010001013'::txid_snapshot) AS unlisted
    expect: rows
    comment: inside the xmin to xmax window and not listed
