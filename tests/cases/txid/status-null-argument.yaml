# txid_status is strict, so a NULL xid yields NULL.
id: txid.status-null-argument
title: txid_status returns NULL for a NULL xid
family: txid
tier: core
feature_ids: [txid-status, null-handling]
required_capabilities: [select]
provenance:
  source: hand
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT txid_status(NULL::bigint) IS NULL AS null_result
    expect: rows
