# txid_current_if_assigned returns NULL until the transaction has been assigned an xid, then returns it.
id: txid.current-if-assigned
title: txid_current_if_assigned is NULL before an xid is assigned and non-NULL after
family: txid
tier: core
feature_ids: [txid-current, transactions]
required_capabilities: [select, transactions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT txid_current_if_assigned() IS NULL AS unassigned
    expect: rows
    comment: no write yet, so no xid
  - sql: |
      SELECT txid_current() > 0 AS assigned
    expect: rows
    comment: this call assigns the xid
  - sql: |
      SELECT txid_current_if_assigned() IS NOT NULL AS now_assigned
    expect: rows
  - sql: |
      COMMIT
    expect: ok
