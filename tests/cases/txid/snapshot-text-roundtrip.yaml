# Valid txid_snapshot literals parse and print back; the xip list may be empty or hold repeated values.
id: txid.snapshot-text-roundtrip
title: txid_snapshot text input accepts valid xmin:xmax:xip literals
family: txid
tier: slice
feature_ids: [txid-snapshot, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '12:13:'::txid_snapshot
    expect: rows
    comment: empty xip list
  - sql: |
      SELECT '12:18:14,16'::txid_snapshot
    expect: rows
    comment: two in-progress xids between xmin and xmax
  - sql: |
      SELECT '12:16:14,14'::txid_snapshot
    expect: rows
    comment: duplicate xip entries are accepted as written
