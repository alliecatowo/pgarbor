# In autocommit mode the current xid is at least the xmin of the current snapshot.
id: txid.current-snapshot-contains-current
title: txid_current is at or above the xmin of txid_current_snapshot
family: txid
tier: core
feature_ids: [txid-snapshot, txid-current]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT txid_current() >= txid_snapshot_xmin(txid_current_snapshot()) AS ok
    expect: rows
    comment: value is true; the regress test checks only this inequality, not visibility of the current xid
