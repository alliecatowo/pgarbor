# An xip list that is not in ascending order makes the snapshot text invalid.
id: txid.snapshot-xip-below-xmin
title: txid_snapshot input with an out-of-order xip list is rejected
family: txid
tier: core
feature_ids: [txid-snapshot, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/txid.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '12:16:14,13'::txid_snapshot
    expect: error
    sqlstate: "22P02"
    comment: xip list 14 then 13 is not ascending
