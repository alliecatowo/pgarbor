# Derived from PG18 partition_prune.sql (range partitioning with MINVALUE/MAXVALUE and boundary values).
id: partition-prune.range-minvalue-maxvalue-boundaries
title: Range partitions with MINVALUE and MAXVALUE bounds, boundary rows and comparison operators
family: partition-prune
tier: core
feature_ids: [partitioning, range-partitioning, partition-pruning, select, comparison-operators]
required_capabilities: [create-table, insert, select, partitioning, order-by]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/partition_prune.sql
sessions: [a]
setup: |
  CREATE TABLE rlp (a int, b varchar) PARTITION BY RANGE (a);
  CREATE TABLE rlp1 PARTITION OF rlp FOR VALUES FROM (MINVALUE) TO (1);
  CREATE TABLE rlp2 PARTITION OF rlp FOR VALUES FROM (1) TO (10);
  CREATE TABLE rlp_default PARTITION OF rlp DEFAULT;
  CREATE TABLE rlp5 PARTITION OF rlp FOR VALUES FROM (31) TO (MAXVALUE);
  INSERT INTO rlp VALUES (-100, 'm'), (0, 'z'), (1, 'o'), (9, 'n'), (10, 't'), (30, 'd'), (31, 'u'), (1000, 'big');
steps:
  - sql: |
      SELECT a, b FROM rlp WHERE a < 1 ORDER BY a
    expect: rows
    order: ordered
    comment: upper bound is exclusive at the partition boundary
  - sql: |
      SELECT a FROM rlp WHERE 1 > a ORDER BY a
    expect: rows
    order: ordered
    comment: commuted comparison
  - sql: |
      SELECT a FROM rlp WHERE a <= 1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM rlp WHERE a = 1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM rlp WHERE a = 1::bigint ORDER BY a
    expect: rows
    order: ordered
    comment: cross-type int8 constant
  - sql: |
      SELECT a FROM rlp WHERE a = 1::numeric ORDER BY a
    expect: rows
    order: ordered
    comment: cross-type numeric constant, must still return the same rows
  - sql: |
      SELECT a FROM rlp WHERE a >= 10 AND a < 31 ORDER BY a
    expect: rows
    order: ordered
    comment: spans the gap covered only by the default partition
  - sql: |
      SELECT a, b FROM rlp WHERE a > 30 ORDER BY a
    expect: rows
    order: ordered
