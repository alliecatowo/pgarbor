# ORDER BY and LIMIT on a set operation apply to the combined result, not to a single arm.
id: union.order-by-limit-whole-set
title: "ORDER BY and LIMIT apply to the whole UNION ALL result"
family: union
tier: core
feature_ids: [union, order-by, limit, values]
required_capabilities: [select, order-by, limit, values]
provenance:
  source: hand
  ref: "PG18 queries-union.html; union.sql ORDER BY tests"
sessions: [a]
steps:
  - sql: |
      SELECT x FROM (VALUES (3), (1)) v(x)
      UNION ALL
      SELECT 2
      ORDER BY 1
      LIMIT 2
    expect: rows
    order: ordered
    comment: a bare ORDER BY/LIMIT after the last arm applies to the union
  - sql: |
      SELECT x FROM (VALUES (3), (1)) v(x)
      UNION ALL
      (SELECT 2 ORDER BY 1 LIMIT 1)
      ORDER BY 1 DESC
    expect: rows
    order: ordered
    comment: a parenthesized arm keeps its own ORDER BY and LIMIT
  - sql: |
      (SELECT 2 UNION ALL SELECT 3) ORDER BY 1 OFFSET 1
    expect: rows
    order: ordered
