# UNION resolves a common type across numeric literals and casts; equal values across types dedupe.
id: union.mixed-numeric-types
title: "UNION of integer, numeric and float8 literals resolves a common type"
family: union
tier: extended
feature_ids: [union, numeric, float8, type-resolution]
required_capabilities: [select, numeric, float8, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1.1 AS two UNION SELECT 2.2 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT 1.1 AS two UNION SELECT 2 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 AS one UNION SELECT 1.0::float8 ORDER BY 1
    expect: rows
    order: ordered
    comment: 1 and 1.0 are equal after resolution to float8, so one row
  - sql: |
      SELECT 1.0::float8 AS two UNION ALL SELECT 1 ORDER BY 1
    expect: rows
    order: ordered
