# Row locking clauses are not permitted on a set operation (message: FOR NO KEY UPDATE is not allowed with UNION/INTERSECT/EXCEPT).
id: union.error-for-update-not-allowed
title: "FOR NO KEY UPDATE on an EXCEPT ALL query is rejected with feature not supported"
family: union
tier: core
feature_ids: [union, row-locks, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql (EXCEPT ALL ... FOR NO KEY UPDATE); PG18 errcodes 0A000"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE lk (q1 int8);
  INSERT INTO lk VALUES (1), (2);
steps:
  - sql: |
      SELECT q1 FROM lk EXCEPT ALL SELECT q1 FROM lk FOR NO KEY UPDATE
    expect: error
    sqlstate: "0A000"
