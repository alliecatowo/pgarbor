# An invalid literal in one arm fails during execution, reporting invalid input for numeric.
id: union.error-numeric-invalid-input
title: "Invalid numeric literal in a UNION arm raises invalid text representation"
family: union
tier: core
feature_ids: [union, numeric, errors]
required_capabilities: [select, numeric, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql (This should fail, but it should produce an error cursor); PG18 errcodes 22P02"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '3.4'::numeric UNION SELECT 'foo'
    expect: error
    sqlstate: "22P02"
