# UNION ALL keeps every row, including duplicates, and does not sort.
id: union.union-all-keeps-duplicates
title: "UNION ALL keeps duplicate rows from both arms"
family: union
tier: core
feature_ids: [union, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS two UNION ALL SELECT 2
    expect: rows
    order: multiset
  - sql: |
      SELECT 1 AS two UNION ALL SELECT 1
    expect: rows
    order: multiset
  - sql: |
      SELECT 1 AS three UNION SELECT 2 UNION ALL SELECT 2 ORDER BY 1
    expect: rows
    order: ordered
