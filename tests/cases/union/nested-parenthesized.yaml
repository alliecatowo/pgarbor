# Parenthesized set operations nest and combine with outer set operations.
id: union.nested-parenthesized
title: "Parenthesized UNION nested under INTERSECT and EXCEPT"
family: union
tier: core
feature_ids: [union, intersect, except, parenthesized-query]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql (nested cases)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      (SELECT 1, 2, 3 UNION SELECT 4, 5, 6) INTERSECT SELECT 4, 5, 6
    expect: rows
    order: multiset
  - sql: |
      (SELECT 1, 2, 3 UNION SELECT 4, 5, 6) EXCEPT SELECT 4, 5, 6
    expect: rows
    order: multiset
  - sql: |
      SELECT 1 UNION ALL (((SELECT 2 EXCEPT SELECT 3 ORDER BY 1)))
    expect: rows
    order: multiset
