# ORDER BY over a set operation must reference an existing output column position.
id: union.error-order-by-position
title: "ORDER BY position beyond the UNION output columns is invalid"
family: union
tier: core
feature_ids: [union, order-by, errors]
required_capabilities: [select, order-by, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42P10 (ORDER BY position 3 is not in select list)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS a, 2 AS b UNION SELECT 3, 4 ORDER BY 3
    expect: error
    sqlstate: "42P10"
  - sql: |
      SELECT 1 AS a, 2 AS b UNION SELECT 3, 4 ORDER BY 2 DESC
    expect: rows
    order: ordered
