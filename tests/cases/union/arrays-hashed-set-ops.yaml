# Set operations on array values (hashable and comparable element types).
id: union.arrays-hashed-set-ops
title: "UNION, INTERSECT and EXCEPT over int4 array values"
family: union
tier: extended
feature_ids: [union, intersect, except, arrays, values]
required_capabilities: [select, values, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql (arrays section)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT x FROM (VALUES (ARRAY[1, 2]), (ARRAY[1, 3])) _(x)
      UNION
      SELECT x FROM (VALUES (ARRAY[1, 2]), (ARRAY[1, 4])) _(x)
      ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT x FROM (VALUES (ARRAY[1, 2]), (ARRAY[1, 3])) _(x)
      INTERSECT
      SELECT x FROM (VALUES (ARRAY[1, 2]), (ARRAY[1, 4])) _(x)
    expect: rows
    order: multiset
  - sql: |
      SELECT x FROM (VALUES (ARRAY[1, 2]), (ARRAY[1, 3])) _(x)
      EXCEPT
      SELECT x FROM (VALUES (ARRAY[1, 2]), (ARRAY[1, 4])) _(x)
    expect: rows
    order: multiset
