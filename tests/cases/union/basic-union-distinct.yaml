# UNION removes duplicates across arms; ORDER BY position applies to the whole set.
id: union.basic-union-distinct
title: "UNION deduplicates rows across two SELECT arms"
family: union
tier: slice
feature_ids: [union, select, order-by]
required_capabilities: [select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS two UNION SELECT 2 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 AS one UNION SELECT 1 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 AS three UNION SELECT 2 UNION SELECT 2 UNION SELECT 3 ORDER BY 1
    expect: rows
    order: ordered
