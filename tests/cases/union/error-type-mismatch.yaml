# Columns of set operation arms must have types that can be matched into one common type.
id: union.error-type-mismatch
title: "UNION of integer and date columns cannot resolve a common type"
family: union
tier: core
feature_ids: [union, errors, datetime]
required_capabilities: [select, errors, date-type]
provenance:
  source: hand
  ref: "PG18 errcodes 42804 (UNION types integer and date cannot be matched)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS v UNION SELECT DATE '2024-01-01'
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT 1 AS v UNION ALL SELECT 2
    expect: rows
    order: multiset
