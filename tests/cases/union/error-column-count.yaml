# Each arm of a set operation must have the same number of columns.
id: union.error-column-count
title: "UNION arms with different column counts raise a syntax error"
family: union
tier: core
feature_ids: [union, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql; PG18 errcodes 42601 (each UNION query must have the same number of columns)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1, 2 UNION SELECT 1
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 UNION SELECT 1, 2
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS one
    expect: rows
    comment: session still usable after error with no transaction block
