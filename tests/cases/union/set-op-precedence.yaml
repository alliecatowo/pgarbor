# INTERSECT binds tighter than UNION and EXCEPT; UNION, UNION ALL and EXCEPT associate left to right.
id: union.set-op-precedence
title: "INTERSECT precedence over UNION and left-associative EXCEPT"
family: union
tier: core
feature_ids: [union, intersect, except, parenthesized-query]
required_capabilities: [select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/union.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS x UNION SELECT 2 INTERSECT SELECT 2 ORDER BY 1
    expect: rows
    order: ordered
    comment: parsed as 1 UNION (2 INTERSECT 2), giving 1 and 2
  - sql: |
      SELECT 1 AS x INTERSECT SELECT 2 UNION SELECT 2 ORDER BY 1
    expect: rows
    order: ordered
    comment: parsed as (1 INTERSECT 2) UNION 2, giving only 2
  - sql: |
      SELECT 1 AS x UNION ALL SELECT 1 EXCEPT SELECT 1
    expect: rows
    order: multiset
    comment: left-associative, so (1 UNION ALL 1) EXCEPT 1 leaves no rows
  - sql: |
      SELECT 1 AS x UNION SELECT 2 EXCEPT SELECT 2
    expect: rows
    order: multiset
    comment: left-associative, so (1 UNION 2) EXCEPT 2 leaves only 1
