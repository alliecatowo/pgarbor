# ADD MAPPING naming an unknown dictionary is an error and leaves the configuration unchanged.
id: cmd-alter-tsconfig.add-mapping-missing-dictionary
title: "ADD MAPPING with a nonexistent dictionary fails and adds no rows"
family: cmd-alter-tsconfig
tier: core
feature_ids: [alter-text-search-configuration, add-mapping, errors]
required_capabilities: [create-text-search-dictionary, create-text-search-configuration, alter-text-search-configuration, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsconfig.sgml#sql-altertsconfig (dictionary_name must name an existing dictionary)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY english (template = snowball, language = english);
  CREATE TEXT SEARCH CONFIGURATION my_config (copy = simple);
  ALTER TEXT SEARCH CONFIGURATION my_config DROP MAPPING FOR asciiword;
steps:
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION my_config ADD MAPPING FOR asciiword WITH english, nosuch
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) AS asciiword_maps
        FROM pg_ts_config_map
       WHERE mapcfg = 'my_config'::regconfig AND maptokentype = 1
    expect: rows
    order: multiset
    comment: the failed ADD left no partial mapping behind
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION my_config ADD MAPPING FOR asciiword WITH english
    expect: ok
  - sql: |
      SELECT to_tsvector('my_config', 'Running Foxes')
    expect: rows
    order: ordered
