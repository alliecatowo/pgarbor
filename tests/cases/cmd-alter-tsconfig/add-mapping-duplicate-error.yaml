# ADD MAPPING for a token type that already has a mapping fails (documented as an error); after DROP MAPPING it succeeds.
id: cmd-alter-tsconfig.add-mapping-duplicate-error
title: "ADD MAPPING rejects a token type that already has a mapping and accepts it after DROP"
family: cmd-alter-tsconfig
tier: core
feature_ids: [alter-text-search-configuration, add-mapping, drop-mapping, unique-constraint]
required_capabilities: [create-text-search-dictionary, create-text-search-configuration, alter-text-search-configuration, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_tsconfig.sgml#sql-altertsconfig (ADD MAPPING FOR is an error if a mapping already exists)"
sessions: [a]
setup: |
  CREATE TEXT SEARCH DICTIONARY english (template = snowball, language = english);
  CREATE TEXT SEARCH DICTIONARY swedish (template = snowball, language = swedish);
  CREATE TEXT SEARCH CONFIGURATION my_config (copy = simple);
steps:
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION my_config ADD MAPPING FOR asciiword WITH simple
    expect: error
    sqlstate: "23505"
    comment: the copied configuration already maps asciiword; the oracle reports a unique violation on pg_ts_config_map
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION my_config DROP MAPPING FOR asciiword
    expect: ok
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION my_config ADD MAPPING FOR asciiword WITH english, swedish
    expect: ok
  - sql: |
      SELECT m.mapseqno, d.dictname
        FROM pg_ts_config_map m JOIN pg_ts_dict d ON d.oid = m.mapdict
       WHERE m.mapcfg = 'my_config'::regconfig AND m.maptokentype = 1
       ORDER BY m.mapseqno
    expect: rows
    order: ordered
  - sql: |
      ALTER TEXT SEARCH CONFIGURATION my_config ADD MAPPING FOR asciiword WITH english
    expect: error
    sqlstate: "23505"
