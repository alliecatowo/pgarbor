id: cmd-create-materialized-view.tablespace
title: TABLESPACE accepts pg_default and rejects unknown tablespace names
family: cmd-create-materialized-view
tier: extended
feature_ids: [create-materialized-view, tablespace]
required_capabilities: [create-materialized-view, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_materialized_view.sgml#sql-creatematerializedview (TABLESPACE)"
sessions: [a]
steps:
  - session: a
    sql: |
      CREATE MATERIALIZED VIEW mv_ts TABLESPACE pg_default AS SELECT 1 AS one
    expect: ok
  - session: a
    sql: |
      SELECT reltablespace FROM pg_class WHERE oid = 'mv_ts'::regclass
    expect: rows
    order: ordered
    comment: the default tablespace is stored as 0
  - session: a
    sql: |
      CREATE MATERIALIZED VIEW mv_bad_ts TABLESPACE no_such_tablespace AS SELECT 1 AS one
    expect: error
    sqlstate: "42704"
