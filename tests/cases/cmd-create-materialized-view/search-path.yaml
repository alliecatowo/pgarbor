id: cmd-create-materialized-view.search-path
title: The defining query runs with search_path temporarily set to pg_catalog, pg_temp
family: cmd-create-materialized-view
tier: core
feature_ids: [create-materialized-view, search-path, security-restricted-operation]
required_capabilities: [create-materialized-view, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_materialized_view.sgml#sql-creatematerializedview (query)"
sessions: [a]
steps:
  - session: a
    sql: |
      CREATE MATERIALIZED VIEW mv_sp AS SELECT current_setting('search_path') AS sp
    expect: ok
  - session: a
    sql: |
      SELECT sp FROM mv_sp
    expect: rows
    order: ordered
    comment: the search_path seen while the query ran
  - session: a
    sql: |
      SELECT current_setting('search_path') <> 'pg_catalog, pg_temp' AS restored
    expect: rows
    order: ordered
    comment: the session search_path is restored after creation
