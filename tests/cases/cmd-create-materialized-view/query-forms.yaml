id: cmd-create-materialized-view.query-forms
title: The defining query may be SELECT, TABLE, VALUES or a WITH query
family: cmd-create-materialized-view
tier: core
feature_ids: [create-materialized-view, values, table-command, with-query]
required_capabilities: [create-table, insert, select, create-materialized-view, values, with]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_materialized_view.sgml#sql-creatematerializedview (query)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v text);
  INSERT INTO t VALUES (2, 'b'), (1, 'a');
steps:
  - session: a
    sql: |
      CREATE MATERIALIZED VIEW mv_values AS VALUES (1, 'a'), (2, 'b')
    expect: ok
  - session: a
    sql: |
      SELECT column1, column2 FROM mv_values ORDER BY column1
    expect: rows
    order: ordered
  - session: a
    sql: |
      CREATE MATERIALIZED VIEW mv_table AS TABLE t
    expect: ok
  - session: a
    sql: |
      SELECT id, v FROM mv_table ORDER BY id
    expect: rows
    order: ordered
  - session: a
    sql: |
      CREATE MATERIALIZED VIEW mv_with AS WITH x AS (SELECT id FROM t) SELECT count(*) AS n FROM x
    expect: ok
  - session: a
    sql: |
      SELECT n FROM mv_with
    expect: rows
    order: ordered
