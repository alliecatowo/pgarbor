# CREATE INDEX on two columns is accepted and recorded with both key columns in order.
id: doc-indexes-multicolumn.create-index-catalog
title: Two-column index is created with keys in declared order and serves the documented query
family: doc-indexes-multicolumn
tier: core
feature_ids: [multicolumn-index, btree-index, create-index]
required_capabilities: [create-table, insert, select, create-index, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/indices.sgml#indexes-multicolumn (CREATE INDEX test2_mm_idx ON test2 (major, minor))"
sessions: [a]
setup: |
  CREATE TABLE test2 (major int, minor int, name varchar);
  CREATE INDEX test2_mm_idx ON test2 (major, minor);
  INSERT INTO test2 VALUES (1, 1, 'a'), (1, 2, 'b'), (2, 1, NULL), (2, 2, 'd'), (NULL, 1, 'e'), (1, NULL, 'f')
steps:
  - sql: |
      SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'test2' ORDER BY indexname
    expect: rows
    order: ordered
    comment: indexdef must list major before minor and use btree
  - sql: |
      SELECT name FROM test2 WHERE major = 1 AND minor = 2 ORDER BY name
    expect: rows
    order: ordered
