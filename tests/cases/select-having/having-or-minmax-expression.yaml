# HAVING with OR over aggregates, grouped by a function expression and by a plain column.
id: select-having.having-or-minmax-expression
title: HAVING with OR of aggregate conditions over expression and column groups
family: select-having
tier: core
feature_ids: [select, group-by, having, aggregates, expressions]
required_capabilities: [create-table, insert, select, group-by, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_having.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int, c text);
  INSERT INTO t VALUES (0,1,'XXXX'), (1,2,'AAAA'), (2,2,'AAAA'), (3,3,'BBBB'), (4,3,'BBBB'), (5,3,'bbbb'), (6,4,'cccc'), (7,4,'cccc'), (8,4,'CCCC'), (9,4,'CCCC');
steps:
  - sql: |
      SELECT lower(c), count(c) FROM t GROUP BY lower(c) HAVING count(*) > 2 OR min(a) = max(a) ORDER BY lower(c)
    expect: rows
    order: ordered
  - sql: |
      SELECT c, max(a) FROM t GROUP BY c HAVING count(*) > 2 OR min(a) = max(a) ORDER BY c
    expect: rows
    order: ordered
