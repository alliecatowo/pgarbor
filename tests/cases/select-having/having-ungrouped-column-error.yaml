# Ungrouped column references in an aggregate query with HAVING are grouping errors.
id: select-having.having-ungrouped-column-error
title: Ungrouped column referenced under HAVING raises grouping error
family: select-having
tier: core
feature_ids: [select, having, aggregates, errors]
required_capabilities: [create-table, insert, select, aggregates, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_having.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  INSERT INTO t VALUES (0, 1), (1, 2), (2, 2);
steps:
  - sql: |
      SELECT a FROM t HAVING min(a) < max(a)
    expect: error
    sqlstate: "42803"
  - sql: |
      SELECT 1 AS one FROM t HAVING a > 1
    expect: error
    sqlstate: "42803"
