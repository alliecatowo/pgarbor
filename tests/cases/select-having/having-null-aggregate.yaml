# Groups whose HAVING condition evaluates to NULL are excluded; count ignores NULLs.
id: select-having.having-null-aggregate
title: NULL aggregate results and NULL conditions exclude groups under HAVING
family: select-having
tier: core
feature_ids: [select, group-by, having, aggregates, nulls]
required_capabilities: [create-table, insert, select, group-by, aggregates]
provenance:
  source: hand
  ref: "PG18 functions-aggregate.html; sql-select.html HAVING clause"
sessions: [a]
setup: |
  CREATE TABLE t (g int, v int);
  INSERT INTO t VALUES (1, NULL), (1, NULL), (2, 5), (2, NULL), (3, NULL);
steps:
  - sql: |
      SELECT g, count(*), count(v), avg(v) FROM t GROUP BY g HAVING avg(v) > 1 ORDER BY g
    expect: rows
    order: ordered
    comment: avg over all-NULL groups is NULL, so groups 1 and 3 are dropped
  - sql: |
      SELECT g FROM t GROUP BY g HAVING NULL::boolean ORDER BY g
    expect: rows
    order: ordered
  - sql: |
      SELECT g FROM t GROUP BY g HAVING count(v) = 0 ORDER BY g
    expect: rows
    order: ordered
