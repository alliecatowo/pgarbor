# GROUP BY with HAVING count(*) = 1 keeps only single-row groups.
id: select-having.group-having-count-filter
title: HAVING count star filters single-row groups
family: select-having
tier: core
feature_ids: [select, group-by, having, aggregates]
required_capabilities: [create-table, insert, select, group-by, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_having.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int, c text);
  INSERT INTO t VALUES (0,1,'XXXX'), (1,2,'AAAA'), (2,2,'AAAA'), (3,3,'BBBB'), (4,3,'BBBB'), (5,3,'bbbb'), (6,4,'cccc'), (7,4,'cccc'), (8,4,'CCCC'), (9,4,'CCCC');
steps:
  - sql: |
      SELECT b, c FROM t GROUP BY b, c HAVING count(*) = 1 ORDER BY b, c
    expect: rows
    order: ordered
