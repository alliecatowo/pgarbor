# HAVING requires a boolean expression.
id: select-having.having-non-boolean-error
title: Non-boolean HAVING expression is a datatype mismatch
family: select-having
tier: core
feature_ids: [select, having, aggregates, errors]
required_capabilities: [create-table, insert, select, aggregates, errors]
provenance:
  source: hand
  ref: "PG18 sql-select.html HAVING clause; errcodes 42804"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  INSERT INTO t VALUES (0, 1), (1, 2);
steps:
  - sql: |
      SELECT count(*) FROM t HAVING 1
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT b FROM t GROUP BY b HAVING b
    expect: error
    sqlstate: "42804"
