# A HAVING predicate on a grouping key behaves like a WHERE filter.
id: select-having.having-on-group-key
title: HAVING on a grouping key matches the equivalent WHERE
family: select-having
tier: core
feature_ids: [select, group-by, having]
required_capabilities: [create-table, insert, select, group-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_having.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int, c text);
  INSERT INTO t VALUES (0,1,'XXXX'), (1,2,'AAAA'), (2,2,'AAAA'), (3,3,'BBBB'), (4,3,'BBBB'), (5,3,'bbbb'), (6,4,'cccc'), (7,4,'cccc'), (8,4,'CCCC'), (9,4,'CCCC');
steps:
  - sql: |
      SELECT b, c FROM t GROUP BY b, c HAVING b = 3 ORDER BY b, c
    expect: rows
    order: ordered
  - sql: |
      SELECT b, c FROM t WHERE b = 3 GROUP BY b, c ORDER BY b, c
    expect: rows
    order: ordered
