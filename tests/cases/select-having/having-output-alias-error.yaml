# Output column aliases are not visible in HAVING.
id: select-having.having-output-alias-error
title: Output alias is not visible in HAVING
family: select-having
tier: core
feature_ids: [select, having, aliases, errors]
required_capabilities: [create-table, insert, select, group-by, aggregates, errors]
provenance:
  source: hand
  ref: "PG18 sql-select.html HAVING clause; errcodes 42703"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  INSERT INTO t VALUES (0, 1), (1, 2), (2, 2);
steps:
  - sql: |
      SELECT b AS bb, count(*) AS n FROM t GROUP BY b HAVING bb > 1
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT b AS bb, count(*) AS n FROM t GROUP BY b HAVING n > 1
    expect: error
    sqlstate: "42703"
