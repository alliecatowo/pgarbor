# HAVING may use aggregates that do not appear in the select list, combined with DISTINCT.
id: select-having.having-aggregate-not-selected
title: HAVING on an aggregate absent from the select list, with DISTINCT
family: select-having
tier: core
feature_ids: [select, group-by, having, aggregates, distinct]
required_capabilities: [create-table, insert, select, group-by, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_having.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  INSERT INTO t VALUES (0,1), (1,2), (2,2), (3,3), (4,3), (5,3), (6,4), (7,4), (8,4), (9,4);
steps:
  - sql: |
      SELECT b FROM t GROUP BY b HAVING sum(a) > 5 ORDER BY b
    expect: rows
    order: ordered
  - sql: |
      SELECT DISTINCT b FROM t GROUP BY b HAVING count(*) > 1 ORDER BY b
    expect: rows
    order: ordered
