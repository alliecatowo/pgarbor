# Aggregates over an empty table produce one row; grouped aggregates over empty input produce none.
id: select-having.having-empty-input
title: HAVING over empty input with and without GROUP BY
family: select-having
tier: core
feature_ids: [select, group-by, having, aggregates, nulls]
required_capabilities: [create-table, select, group-by, aggregates]
provenance:
  source: hand
  ref: "src/test/regress/sql/select_having.sql (degenerate HAVING cases)"
sessions: [a]
setup: |
  CREATE TABLE t (a int);
steps:
  - sql: |
      SELECT count(*) FROM t HAVING count(*) = 0
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM t HAVING count(*) > 0
    expect: rows
    order: multiset
  - sql: |
      SELECT a, count(*) FROM t GROUP BY a HAVING count(*) = 0
    expect: rows
    order: multiset
