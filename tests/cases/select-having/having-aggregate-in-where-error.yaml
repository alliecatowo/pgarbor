# Aggregates are not allowed in WHERE; the same condition belongs in HAVING.
id: select-having.having-aggregate-in-where-error
title: Aggregate in WHERE is rejected while the same test in HAVING works
family: select-having
tier: core
feature_ids: [select, having, aggregates, errors]
required_capabilities: [create-table, insert, select, group-by, aggregates, errors]
provenance:
  source: hand
  ref: "PG18 sql-select.html WHERE and HAVING clauses; errcodes 42803"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  INSERT INTO t VALUES (0, 1), (1, 2), (2, 2), (3, 3);
steps:
  - sql: |
      SELECT b FROM t WHERE count(*) > 1 GROUP BY b
    expect: error
    sqlstate: "42803"
  - sql: |
      SELECT b FROM t GROUP BY b HAVING count(*) > 1 ORDER BY b
    expect: rows
    order: ordered
