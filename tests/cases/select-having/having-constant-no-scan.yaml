# Constant HAVING conditions: a false one returns nothing, a true one must not evaluate a WHERE that would fail on the data.
id: select-having.having-constant-no-scan
title: Constant HAVING conditions and WHERE that would fail if evaluated
family: select-having
tier: extended
feature_ids: [select, having, expressions, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_having.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int);
  INSERT INTO t VALUES (0), (1), (2);
steps:
  - sql: |
      SELECT 1 AS one FROM t HAVING 1 > 2
    expect: rows
    order: multiset
    comment: constant false HAVING returns zero rows
  - sql: |
      SELECT 1 AS one FROM t HAVING 1 < 2
    expect: rows
    order: multiset
  - sql: |
      SELECT 1 AS one FROM t WHERE 1/a = 1 HAVING 1 < 2
    expect: rows
    order: multiset
    comment: a=0 would raise division_by_zero if the table were scanned under WHERE
