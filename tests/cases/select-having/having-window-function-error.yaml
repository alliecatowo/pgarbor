# Window functions are not allowed in HAVING.
id: select-having.having-window-function-error
title: Window function in HAVING raises windowing error
family: select-having
tier: extended
feature_ids: [select, having, window-functions, errors]
required_capabilities: [create-table, insert, select, group-by, window-functions, errors]
provenance:
  source: hand
  ref: "PG18 sql-select.html HAVING clause; errcodes 42P20"
sessions: [a]
setup: |
  CREATE TABLE t (a int, b int);
  INSERT INTO t VALUES (0, 1), (1, 2), (2, 2);
steps:
  - sql: |
      SELECT b FROM t GROUP BY b HAVING row_number() OVER () > 1
    expect: error
    sqlstate: "42P20"
