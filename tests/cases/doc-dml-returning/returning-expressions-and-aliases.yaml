# RETURNING accepts the same output list as SELECT: quoted aliases, NULL tests, function calls, casts, and star plus extra columns.
id: doc-dml-returning.returning-expressions-and-aliases
title: RETURNING output list supports quoted aliases, expressions, NULL tests and star with extra columns
family: doc-dml-returning
tier: core
feature_ids: [returning, insert, select-list, aliases, expressions, null-semantics, returning-star]
required_capabilities: [create-table, insert, select, returning]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (allowed contents are the same as a SELECT output list; RETURNING *)"
sessions: [a]
setup: |
  CREATE TABLE inv (sku text PRIMARY KEY, qty int4 NOT NULL, note text);
steps:
  - sql: |
      INSERT INTO inv (sku, qty) VALUES ('e', 1)
        RETURNING "sku" AS "Key", note IS NULL AS note_null,
                  upper(sku) || '-' || qty::text AS label
    expect: rows
    order: ordered
    comment: quoted alias keeps its case; note has its default NULL
  - sql: |
      INSERT INTO inv (sku, qty, note) VALUES ('f', 2, 'hi')
        RETURNING *, qty + 1 AS qty_next
    expect: rows
    order: ordered
    comment: star returns table columns in order, followed by the extra expression
  - sql: |
      INSERT INTO inv (sku, qty) VALUES ('g', 3)
        RETURNING coalesce(note, 'none') AS n, length(sku) AS len
    expect: rows
    order: ordered
