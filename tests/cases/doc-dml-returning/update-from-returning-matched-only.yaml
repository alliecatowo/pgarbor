# UPDATE FROM with a VALUES source: RETURNING reports only rows that joined, and can project the source alias.
id: doc-dml-returning.update-from-returning-matched-only
title: UPDATE FROM RETURNING reports only joined target rows and source columns
family: doc-dml-returning
tier: core
feature_ids: [returning, update, update-from, values-list, joins]
required_capabilities: [create-table, insert, update, select, returning, update-from, values]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (RETURNING clause may reference target and other table columns)"
sessions: [a]
setup: |
  CREATE TABLE inv (sku text PRIMARY KEY, qty int4 NOT NULL);
  INSERT INTO inv VALUES ('a', 1), ('b', 2), ('c', 3);
steps:
  - sql: |
      UPDATE inv i SET qty = i.qty + 1
        FROM (VALUES ('a'), ('zz')) AS v(s)
        WHERE i.sku = v.s
        RETURNING i.sku, i.qty, v.s
    expect: rows
    order: multiset
    comment: zz has no target row, so only a is returned
  - sql: |
      SELECT sku, qty FROM inv ORDER BY sku
    expect: rows
    order: ordered
