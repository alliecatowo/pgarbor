# DELETE with a USING join returns columns of the target and of the joined table in one RETURNING list.
id: doc-dml-returning.delete-using-returning-join-columns
title: DELETE USING RETURNING can project both target and joined-table columns
family: doc-dml-returning
tier: core
feature_ids: [returning, delete, delete-using, joins, returning-star]
required_capabilities: [create-table, insert, delete, select, returning, delete-using, join]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (RETURNING clause contents are the same as a SELECT output list)"
sessions: [a]
setup: |
  CREATE TABLE inv (sku text PRIMARY KEY, qty int4 NOT NULL, note text);
  CREATE TABLE kill (sku text, qty int4);
  INSERT INTO inv VALUES ('a', 1, NULL), ('b', 2, 'keep'), ('c', 0, 'zero');
  INSERT INTO kill VALUES ('a', 0), ('b', 1), ('c', 0);
steps:
  - sql: |
      DELETE FROM inv USING kill
        WHERE inv.sku = kill.sku AND kill.qty = 0
        RETURNING inv.*, kill.qty AS killed_qty
    expect: rows
    order: multiset
  - sql: |
      SELECT sku, qty, note FROM inv ORDER BY sku
    expect: rows
    order: ordered
