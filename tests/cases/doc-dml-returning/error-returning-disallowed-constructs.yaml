# RETURNING rejects aggregate, window and set-returning functions with their documented-category SQLSTATEs.
id: doc-dml-returning.error-returning-disallowed-constructs
title: RETURNING rejects aggregates, window functions and set-returning functions
family: doc-dml-returning
tier: core
feature_ids: [returning, insert, update, aggregates, window-functions, set-returning-functions, errors]
required_capabilities: [create-table, insert, update, select, returning, window-functions]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (RETURNING output list is the same as a SELECT output list; aggregates and windows are not allowed in a RETURNING list)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (1, 'x'), (2, 'y');
steps:
  - sql: |
      UPDATE t SET a = a WHERE a = 2 RETURNING sum(a)
    expect: error
    sqlstate: "42803"
    comment: aggregate functions are not allowed in RETURNING
  - sql: |
      UPDATE t SET a = a WHERE a = 2 RETURNING row_number() OVER ()
    expect: error
    sqlstate: 42P20
    comment: window functions are not allowed in RETURNING
  - sql: |
      INSERT INTO t (a) VALUES (60) RETURNING generate_series(1, 2)
    expect: error
    sqlstate: 0A000
    comment: set-returning functions are not allowed in RETURNING
  - sql: |
      SELECT a, b FROM t ORDER BY a
    expect: rows
    order: ordered
    comment: rejected statements change nothing
