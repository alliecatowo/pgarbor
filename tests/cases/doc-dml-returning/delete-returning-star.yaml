# DELETE RETURNING * returns the full content of each deleted row, in table column order.
id: doc-dml-returning.delete-returning-star
title: DELETE RETURNING star returns every column of each deleted row
family: doc-dml-returning
tier: core
feature_ids: [returning, delete, returning-star, where-filter, null-semantics]
required_capabilities: [create-table, insert, delete, select, returning]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (DELETE FROM products WHERE obsoletion_date = 'today' RETURNING *)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int4 PRIMARY KEY, name text, price numeric(10,2), obsoletion_date text);
  INSERT INTO products VALUES
    (1, 'cheese', 9.99, NULL),
    (2, 'old stock', 5.00, 'today'),
    (3, 'legacy', 7.50, 'today'),
    (4, 'bread', 3.25, 'tomorrow');
steps:
  - sql: |
      DELETE FROM products WHERE obsoletion_date = 'today' RETURNING *
    expect: rows
    order: multiset
    comment: NULL obsoletion_date never satisfies the equality, so product 1 survives
  - sql: |
      DELETE FROM products WHERE obsoletion_date = 'today' RETURNING *
    expect: rows
    order: multiset
    comment: a second run matches nothing
  - sql: |
      SELECT product_no FROM products ORDER BY product_no
    expect: rows
    order: ordered
