# A volatile function in RETURNING is evaluated once per inserted row, in a multi-row VALUES list.
id: doc-dml-returning.insert-values-returning-per-row-nextval
title: RETURNING with nextval runs once per row of a multi-row VALUES insert
family: doc-dml-returning
tier: core
feature_ids: [returning, insert, sequences, volatile-functions, default-values]
required_capabilities: [create-table, insert, select, returning, sequence]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (RETURNING expressions over the inserted row)"
sessions: [a]
setup: |
  CREATE TABLE items (id int4 GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY, a int4, b text DEFAULT 'dflt');
  CREATE SEQUENCE audit_seq;
steps:
  - sql: |
      INSERT INTO items (a) VALUES (1), (2), (3)
        RETURNING id, b, a, nextval('audit_seq') AS seqv
    expect: rows
    order: multiset
    comment: DEFAULT b and identity id are computed server side and visible in RETURNING
  - sql: |
      SELECT currval('audit_seq') AS last_seq
    expect: rows
    order: ordered
  - sql: |
      SELECT id, a, b FROM items ORDER BY id
    expect: rows
    order: ordered
