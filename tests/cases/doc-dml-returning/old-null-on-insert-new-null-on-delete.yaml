# Plain INSERT yields NULL old values and plain DELETE yields NULL new values in RETURNING.
id: doc-dml-returning.old-null-on-insert-new-null-on-delete
title: INSERT RETURNING old and DELETE RETURNING new are NULL when no such row version exists
family: doc-dml-returning
tier: core
feature_ids: [returning, returning-old-new, insert, delete, null-semantics]
required_capabilities: [create-table, insert, delete, select, returning, returning-old-new]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (typically old values NULL for INSERT, new values NULL for DELETE)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int4 PRIMARY KEY, name text, price numeric(10,2));
steps:
  - sql: |
      INSERT INTO products VALUES (1, 'widget', 2.50)
        RETURNING old.product_no IS NULL AS old_pn_null, old.name IS NULL AS old_name_null,
                  new.name AS new_name, new.price AS new_price
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM products WHERE product_no = 1
        RETURNING old.name AS old_name, new.name IS NULL AS new_name_null, new.price AS new_price
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS remaining FROM products
    expect: rows
    order: ordered
