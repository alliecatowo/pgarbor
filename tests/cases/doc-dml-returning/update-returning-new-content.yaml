# UPDATE RETURNING reports the new content of each modified row, the documented products example.
id: doc-dml-returning.update-returning-new-content
title: UPDATE RETURNING returns the post-update values of only the matched rows
family: doc-dml-returning
tier: core
feature_ids: [returning, update, numeric, where-filter, aliases]
required_capabilities: [create-table, insert, update, select, returning]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (UPDATE products SET price = price * 1.10 ... RETURNING name, price AS new_price)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no int4 PRIMARY KEY, name text, price numeric(10,2));
  INSERT INTO products VALUES (1, 'cheese', 9.99), (2, 'bread', 99.99), (3, 'pricey', 100.00), (4, 'free', 0);
steps:
  - sql: |
      UPDATE products SET price = price * 1.10
        WHERE price <= 99.99
        RETURNING name, price AS new_price
    expect: rows
    order: multiset
    comment: the row priced 100.00 is not matched, so it is not returned
  - sql: |
      SELECT product_no, name, price FROM products ORDER BY product_no
    expect: rows
    order: ordered
  - sql: |
      UPDATE products SET price = price + 1 WHERE product_no = 999
        RETURNING product_no, price
    expect: rows
    order: multiset
    comment: no matching row, so RETURNING yields an empty result set
