# INSERT RETURNING exposes a serial default computed by the server, the documented users example.
id: doc-dml-returning.insert-returning-serial-default
title: INSERT RETURNING id returns the serial default assigned to the new row
family: doc-dml-returning
tier: core
feature_ids: [returning, insert, serial, default-values]
required_capabilities: [create-table, insert, select, returning, serial]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (users serial example)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE users (firstname text, lastname text, id serial primary key)
    expect: ok
  - sql: |
      INSERT INTO users (firstname, lastname) VALUES ('Joe', 'Cool') RETURNING id
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO users (firstname, lastname) VALUES ('Jane', 'Doe') RETURNING id, firstname
    expect: rows
    order: ordered
    comment: the serial sequence advances per inserted row, so the second id is 2
  - sql: |
      SELECT id, firstname, lastname FROM users ORDER BY id
    expect: rows
    order: ordered
