# Documented CREATE SEQUENCE examples: START 101, two nextval calls, nextval inside INSERT, and setval(max(id)) after loading rows.
id: cmd-create-sequence.docs-example-serial-start
title: CREATE SEQUENCE serial START 101 examples with nextval in INSERT and setval from max(id)
family: cmd-create-sequence
tier: core
feature_ids: [create-sequence, nextval, setval, start-with]
required_capabilities: [sequences, create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_sequence.sgml#examples"
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE serial START 101
    expect: ok
  - sql: |
      SELECT nextval('serial')
    expect: rows
    comment: documented result 101
  - sql: |
      SELECT nextval('serial')
    expect: rows
    comment: documented result 102
  - sql: |
      CREATE TABLE distributors (id int4 PRIMARY KEY, name text)
    expect: ok
  - sql: |
      INSERT INTO distributors VALUES (nextval('serial'), 'nothing')
    expect: ok
  - sql: |
      BEGIN;
      INSERT INTO distributors VALUES (500, 'loaded-a'), (510, 'loaded-b');
      SELECT setval('serial', max(id)) FROM distributors;
      COMMIT
    expect: ok
    comment: stands in for the documented COPY FROM followed by setval('serial', max(id))
  - sql: |
      SELECT nextval('serial')
    expect: rows
    comment: continues after the setval maximum
  - sql: |
      SELECT id, name FROM distributors ORDER BY id
    expect: rows
    order: ordered
