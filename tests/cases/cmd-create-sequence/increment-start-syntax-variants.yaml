# INCREMENT and START are accepted without BY and WITH; a descending sequence without START starts at its MAXVALUE.
id: cmd-create-sequence.increment-start-syntax-variants
title: INCREMENT without BY, START without WITH, and default descending start at MAXVALUE
family: cmd-create-sequence
tier: core
feature_ids: [create-sequence, increment-by, start-with, maxvalue, minvalue]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_sequence.sgml#parameters (INCREMENT [BY], START [WITH])"
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE inc5 INCREMENT 5 START 10
    expect: ok
    comment: BY and WITH are optional keywords
  - sql: |
      SELECT nextval('inc5'), nextval('inc5'), nextval('inc5')
    expect: rows
    order: ordered
    comment: 10, 15, 20
  - sql: |
      CREATE SEQUENCE dn INCREMENT BY -3 MINVALUE 1 MAXVALUE 20
    expect: ok
  - sql: |
      SELECT nextval('dn'), nextval('dn'), nextval('dn')
    expect: rows
    order: ordered
    comment: default start for a descending sequence is MAXVALUE, so 20, 17, 14
  - sql: |
      CREATE SEQUENCE sx INCREMENT 2 INCREMENT 3
    expect: error
    sqlstate: "42601"
    comment: duplicate INCREMENT clause is a syntax error
