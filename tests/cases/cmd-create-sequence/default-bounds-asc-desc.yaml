# Default MINVALUE/MAXVALUE/START for ascending and descending sequences, and NO MINVALUE / NO MAXVALUE equivalence.
id: cmd-create-sequence.default-bounds-asc-desc
title: Default bounds and start for ascending versus descending sequences, NO MINVALUE and NO MAXVALUE
family: cmd-create-sequence
tier: core
feature_ids: [create-sequence, minvalue, maxvalue, no-minvalue, no-maxvalue, increment-by]
required_capabilities: [sequences, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_sequence.sgml#parameters (MINVALUE, MAXVALUE, START)"
sessions: [a]
steps:
  - sql: |
      CREATE SEQUENCE asc_d
    expect: ok
  - sql: |
      CREATE SEQUENCE desc_d INCREMENT BY -1
    expect: ok
  - sql: |
      CREATE SEQUENCE asc_nm NO MINVALUE NO MAXVALUE
    expect: ok
  - sql: |
      SELECT sequencename, data_type, start_value, min_value, max_value, increment_by, cycle, cache_size
      FROM pg_sequences WHERE sequencename IN ('asc_d', 'desc_d', 'asc_nm') ORDER BY sequencename
    expect: rows
    order: ordered
    comment: ascending default min is 1 and max is the bigint maximum; descending default max is -1 and min is the bigint minimum
  - sql: |
      SELECT nextval('asc_d'), nextval('asc_d')
    expect: rows
    order: ordered
  - sql: |
      SELECT nextval('desc_d'), nextval('desc_d')
    expect: rows
    order: ordered
    comment: descending default start is the maximum, -1
