# VALUES lists as a row source: default column names, alias lists, the UNION ALL equivalence and type resolution.
id: doc-queries-limit.values-alias-column-names
title: VALUES default column names, alias column lists, and UNION ALL equivalence
family: doc-queries-limit
tier: core
feature_ids: [values, table-alias-column-list, union, column-naming]
required_capabilities: [select, values, union]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM (VALUES (1, 'one'), (2, 'two'), (3, 'three')) AS t (num,letter)
    expect: rows
    order: multiset
    comment: the documented alias list overrides the default names
  - sql: |
      VALUES (1, 'one'), (2, 'two'), (3, 'three')
    expect: rows
    order: multiset
    comment: unaliased VALUES columns are named column1 and column2
  - sql: |
      (VALUES (1, 'one'), (2, 'two'), (3, 'three'))
      EXCEPT ALL
      (SELECT 1 AS column1, 'one' AS column2 UNION ALL SELECT 2, 'two' UNION ALL SELECT 3, 'three')
    expect: rows
    order: multiset
    comment: documented equivalence, so no row differs in either direction
  - sql: |
      (SELECT 1 AS column1, 'one' AS column2 UNION ALL SELECT 2, 'two' UNION ALL SELECT 3, 'three')
      EXCEPT ALL
      (VALUES (1, 'one'), (2, 'two'), (3, 'three'))
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_typeof(column1)::text AS t FROM (VALUES (1), (2.5)) AS v (column1) LIMIT 1
    expect: rows
    order: ordered
    comment: the column type comes from the UNION resolution rules, so numeric wins over integer
  - sql: |
      VALUES (1, 'one'), (2)
    expect: error
    sqlstate: "42601"
    comment: every VALUES row must have the same number of expressions
