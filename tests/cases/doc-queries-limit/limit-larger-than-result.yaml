# A LIMIT larger than the result returns everything. An OFFSET at or past the end returns nothing.
id: doc-queries-limit.limit-larger-than-result
title: LIMIT above the row count, and OFFSET at or past the end, return the available rows
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, order-by, where]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit (possibly fewer, if the query itself yields fewer rows)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 100
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 3 OFFSET 3
    expect: rows
    order: ordered
    comment: the offset lands exactly on the end, so zero rows
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET 100
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 2 OFFSET 2
    expect: rows
    order: ordered
    comment: one row remains after the offset, so the limit does not fill
  - sql: |
      SELECT n FROM t WHERE false LIMIT 5
    expect: rows
    order: multiset
