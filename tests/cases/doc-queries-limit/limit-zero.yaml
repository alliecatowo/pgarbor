# LIMIT 0 returns no rows, regardless of ORDER BY, OFFSET or the number of source rows.
id: doc-queries-limit.limit-zero
title: LIMIT 0 returns zero rows with the full column list
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, order-by, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit (no more than that many rows will be returned)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 0
    expect: rows
    order: ordered
  - sql: |
      SELECT n, n * 2 AS dbl FROM t LIMIT 0 OFFSET 1
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 0 OFFSET 99
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS c FROM (SELECT n FROM t LIMIT 0) AS s
    expect: rows
    order: ordered
    comment: the subquery yields no rows, so the count is 0
