# LIMIT and OFFSET are bigint values. The largest bigint is a valid limit and a valid offset.
id: doc-queries-limit.limit-offset-int8-boundary
title: LIMIT and OFFSET at the bigint maximum and the most negative bigint OFFSET
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, int8, boundaries]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit; datatype-numeric (bigint range)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 9223372036854775807
    expect: rows
    order: ordered
    comment: the largest bigint is an allowed limit and behaves as no limit
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET 9223372036854775807
    expect: rows
    order: ordered
    comment: the largest bigint offset skips every row
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 1 OFFSET 9223372036854775807
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET -9223372036854775808
    expect: error
    sqlstate: "2201X"
    comment: a negative offset is rejected at execution time even at the bigint minimum
