# LIMIT and OFFSET take a bigint. A string literal coerces, while other types and out-of-range values are rejected.
id: doc-queries-limit.limit-argument-type-errors
title: LIMIT and OFFSET argument type coercion and rejection
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, type-coercion, errors]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit; sql-select.html (LIMIT count is bigint)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS one LIMIT '2'
    expect: rows
    order: ordered
    comment: an unknown-typed string literal is coerced to bigint
  - sql: |
      SELECT 1 AS one LIMIT 'abc'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 1 AS one OFFSET 'x'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 1 AS one LIMIT true
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT 1 AS one LIMIT NULL::text
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT 1 AS one LIMIT 9223372036854775808
    expect: error
    sqlstate: "22003"
    comment: one past the bigint maximum is out of range
