# Paging with a unique ORDER BY key: consecutive LIMIT/OFFSET windows partition the table, and a window past the end is empty.
id: doc-queries-limit.unique-order-pagination
title: Consecutive LIMIT/OFFSET pages over a unique sort key partition the rows
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, order-by, pagination]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit (ORDER BY that constrains the result rows into a unique order)"
sessions: [a]
setup: |
  CREATE TABLE item (id int4 PRIMARY KEY, name text NOT NULL);
  INSERT INTO item SELECT g, 'item' || lpad(g::text, 2, '0') FROM generate_series(1, 12) AS g;
steps:
  - sql: |
      SELECT id FROM item ORDER BY id LIMIT 5 OFFSET 0
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM item ORDER BY id LIMIT 5 OFFSET 5
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM item ORDER BY id LIMIT 5 OFFSET 10
    expect: rows
    order: ordered
    comment: the last page is short
  - sql: |
      SELECT id FROM item ORDER BY id LIMIT 5 OFFSET 15
    expect: rows
    order: ordered
    comment: a page past the end is empty
  - sql: |
      SELECT name FROM item ORDER BY name DESC, id LIMIT 2 OFFSET 1
    expect: rows
    order: ordered
