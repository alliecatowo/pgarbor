# A VALUES list accepts a sort specification (ORDER BY, LIMIT, OFFSET) and can sit inside a UNION.
id: doc-queries-limit.values-sort-limit-offset
title: ORDER BY, LIMIT and OFFSET attached to VALUES and to a UNION of VALUES
family: doc-queries-limit
tier: core
feature_ids: [values, order-by, limit, offset, union]
required_capabilities: [select, values, union, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (sort_specification attached to VALUES)"
sessions: [a]
steps:
  - sql: |
      VALUES (3, 'c'), (1, 'a'), (2, 'b') ORDER BY 1 LIMIT 2 OFFSET 1
    expect: rows
    order: ordered
  - sql: |
      VALUES (1), (2), (3), (4) ORDER BY 1 DESC OFFSET 1
    expect: rows
    order: ordered
  - sql: |
      VALUES (1), (2) UNION ALL VALUES (3) ORDER BY 1 LIMIT 2
    expect: rows
    order: ordered
    comment: the sort and limit apply to the whole UNION ALL result
  - sql: |
      VALUES (5), (4) ORDER BY 1 LIMIT 0
    expect: rows
    order: ordered
  - sql: |
      VALUES (1) LIMIT 1 OFFSET 1
    expect: rows
    order: ordered
    comment: a window past the end of a single-row VALUES list is empty
