# OFFSET rows are skipped before LIMIT rows are counted, in either clause order.
id: doc-queries-limit.offset-before-limit-window
title: OFFSET is skipped before LIMIT counts, in either clause order
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, order-by, where]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit (OFFSET and LIMIT both appear)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2), (3), (4), (5), (6);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET 2 LIMIT 2
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 2 OFFSET 2
    expect: rows
    order: ordered
    comment: same window as the reversed clause order
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET 5 LIMIT 3
    expect: rows
    order: ordered
    comment: only one row remains after skipping five
  - sql: |
      SELECT n FROM t WHERE n % 2 = 0 ORDER BY n DESC OFFSET 1 LIMIT 5
    expect: rows
    order: ordered
    comment: the filter applies before the offset is counted
