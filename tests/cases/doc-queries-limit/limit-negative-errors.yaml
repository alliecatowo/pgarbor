# A negative LIMIT or OFFSET is an execution-time error, even when the source is empty.
id: doc-queries-limit.limit-negative-errors
title: Negative LIMIT and negative OFFSET raise execution-time errors
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit; errcodes 2201W, 2201X"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT -1
    expect: error
    sqlstate: "2201W"
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET -1
    expect: error
    sqlstate: "2201X"
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT 1 OFFSET -1
    expect: error
    sqlstate: "2201X"
  - sql: |
      SELECT n FROM t WHERE false LIMIT -1
    expect: error
    sqlstate: "2201W"
    comment: the check does not depend on rows being produced
  - sql: |
      SELECT 'still ok' AS status
    expect: rows
    order: ordered
