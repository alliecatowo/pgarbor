# NULL and ALL are documented as no limit, and NULL OFFSET as no offset. Each combines with the other clause.
id: doc-queries-limit.limit-null-offset-window
title: LIMIT NULL, LIMIT ALL and OFFSET NULL combined with a live OFFSET or LIMIT
family: doc-queries-limit
tier: core
feature_ids: [limit, offset, nulls, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-limit (LIMIT ALL, LIMIT NULL, OFFSET NULL, OFFSET 0)"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (10), (20), (30), (40), (50);
steps:
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT NULL OFFSET 2
    expect: rows
    order: ordered
    comment: no limit, so the offset alone decides the window
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET NULL LIMIT 2
    expect: rows
    order: ordered
    comment: no offset, so the limit alone decides the window
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT ALL OFFSET 4
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n LIMIT NULL OFFSET NULL
    expect: rows
    order: ordered
  - sql: |
      SELECT n FROM t ORDER BY n OFFSET 0 LIMIT 3
    expect: rows
    order: ordered
