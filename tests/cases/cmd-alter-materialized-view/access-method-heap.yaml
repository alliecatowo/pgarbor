# SET ACCESS METHOD: switching to the built-in heap method is accepted; an unknown method is rejected.
id: cmd-alter-materialized-view.access-method-heap
title: "ALTER MATERIALIZED VIEW SET ACCESS METHOD accepts heap and rejects an unknown method"
family: cmd-alter-materialized-view
tier: core
feature_ids: [alter-materialized-view, access-method]
required_capabilities: [create-table, select, create-materialized-view, alter-materialized-view, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_materialized_view.sgml#sql-altermaterializedview (SET ACCESS METHOD new_access_method)"
sessions: [a]
setup: |
  CREATE TABLE amv_am_base (id int4);
  INSERT INTO amv_am_base VALUES (1), (2);
  CREATE MATERIALIZED VIEW amv_am_mv AS SELECT id FROM amv_am_base;
steps:
  - sql: |
      ALTER MATERIALIZED VIEW amv_am_mv SET ACCESS METHOD heap
    expect: ok
  - sql: |
      SELECT am.amname FROM pg_class c JOIN pg_am am ON am.oid = c.relam WHERE c.oid = 'amv_am_mv'::regclass
    expect: rows
    order: ordered
  - sql: |
      ALTER MATERIALIZED VIEW amv_am_mv SET ACCESS METHOD amv_am_nosuch
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT id FROM amv_am_mv ORDER BY id
    expect: rows
    order: ordered
    comment: data is unchanged by the access-method change
