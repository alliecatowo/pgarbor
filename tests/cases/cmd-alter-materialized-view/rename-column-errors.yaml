# Documented column-rename failures: missing source column and a clash with an existing column name.
id: cmd-alter-materialized-view.rename-column-errors
title: "RENAME COLUMN fails on a missing source column and on a duplicate target name"
family: cmd-alter-materialized-view
tier: core
feature_ids: [alter-materialized-view, rename-column, error-handling]
required_capabilities: [create-table, insert, select, create-materialized-view, alter-materialized-view]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/alter_materialized_view.sgml#sql-altermaterializedview (column_name must exist; new_column_name)"
sessions: [a]
setup: |
  CREATE TABLE amv_ce_base (id int4, a int4);
  INSERT INTO amv_ce_base VALUES (1, 10);
  CREATE MATERIALIZED VIEW amv_ce_mv AS SELECT id, a FROM amv_ce_base;
steps:
  - sql: |
      ALTER MATERIALIZED VIEW amv_ce_mv RENAME COLUMN zz TO yy
    expect: error
    sqlstate: "42703"
    comment: column_name must name an existing column
  - sql: |
      ALTER MATERIALIZED VIEW amv_ce_mv RENAME COLUMN a TO id
    expect: error
    sqlstate: "42701"
    comment: new_column_name collides with an existing column
  - sql: |
      SELECT id, a FROM amv_ce_mv ORDER BY id
    expect: rows
    order: ordered
    comment: both failed renames left the view unchanged
