# Documented example: ALTER MATERIALIZED VIEW foo RENAME TO bar; data survives and the old name disappears.
id: cmd-alter-materialized-view.doc-example-rename
title: "ALTER MATERIALIZED VIEW RENAME TO runs the documented foo-to-bar example"
family: cmd-alter-materialized-view
tier: core
feature_ids: [alter-materialized-view, rename]
required_capabilities: [create-table, insert, select, create-materialized-view, alter-materialized-view]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_materialized_view.sgml#sql-altermaterializedview (Examples: rename foo to bar)"
sessions: [a]
setup: |
  CREATE TABLE amv_base (id int4 PRIMARY KEY, val int4 NOT NULL);
  INSERT INTO amv_base VALUES (1, 10), (2, 20);
  CREATE MATERIALIZED VIEW foo AS SELECT id, val FROM amv_base;
steps:
  - sql: |
      ALTER MATERIALIZED VIEW foo RENAME TO bar
    expect: ok
  - sql: |
      SELECT matviewname FROM pg_matviews WHERE matviewname IN ('foo', 'bar') ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT id, val FROM bar ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM foo
    expect: error
    sqlstate: "42P01"
    comment: the old name no longer resolves
