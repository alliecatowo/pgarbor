# CREATE TEXT SEARCH DICTIONARY is transactional: a rolled-back definition is not visible afterwards.
id: cmd-create-tsdictionary.transaction-rollback-invisible
title: "CREATE TEXT SEARCH DICTIONARY inside a rolled-back transaction leaves no dictionary"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, transactions, rollback]
required_capabilities: [create-text-search-dictionary, text-search, transactions, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Description)"
sessions: [a]
steps:
  - sql: |
      BEGIN;
      CREATE TEXT SEARCH DICTIONARY txn_dict (TEMPLATE = simple);
      SELECT count(*) FROM pg_ts_dict WHERE dictname = 'txn_dict';
      ROLLBACK
    expect: ok
    comment: inside the transaction the dictionary is visible to its own session
  - sql: |
      SELECT count(*) FROM pg_ts_dict WHERE dictname = 'txn_dict'
    expect: rows
    comment: after ROLLBACK it is gone
