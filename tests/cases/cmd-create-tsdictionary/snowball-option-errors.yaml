# An unknown Snowball option is rejected; a stopword list that does not exist fails with a config-file error.
id: cmd-create-tsdictionary.snowball-option-errors
title: "Unknown Snowball option and missing stopword file are rejected"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, snowball-template, stopwords-option, template-option]
required_capabilities: [create-text-search-dictionary, text-search, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: option)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY bogus_opt (TEMPLATE = snowball, language = english, bogus = x)
    expect: error
    sqlstate: "22023"
    comment: options are validated by the template's init function
  - sql: |
      CREATE TEXT SEARCH DICTIONARY missing_stop (TEMPLATE = snowball, language = english, stopwords = nosuchfile)
    expect: error
    sqlstate: F0000
    compare_message: false
    comment: the stopword file must exist under tsearch_data; message contains the install path
  - sql: |
      SELECT count(*) FROM pg_ts_dict WHERE dictname IN ('bogus_opt', 'missing_stop')
    expect: rows
