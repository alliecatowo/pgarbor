# TEMPLATE is mandatory and must name an existing template.
id: cmd-create-tsdictionary.template-errors
title: "CREATE TEXT SEARCH DICTIONARY requires an existing TEMPLATE"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, template-option]
required_capabilities: [create-text-search-dictionary, text-search, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: template)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY no_template (language = english)
    expect: error
    sqlstate: 42P17
    comment: the template parameter is required
  - sql: |
      CREATE TEXT SEARCH DICTIONARY unknown_template (TEMPLATE = nosuch)
    expect: error
    sqlstate: "42704"
    comment: the template must be an existing text search template
