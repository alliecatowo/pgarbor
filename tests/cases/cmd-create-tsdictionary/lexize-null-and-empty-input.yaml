# Boundary inputs to ts_lexize: NULL input gives NULL, an empty string gives an empty array (no lexemes).
id: cmd-create-tsdictionary.lexize-null-and-empty-input
title: "ts_lexize returns NULL for NULL input and an empty array for an empty string"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, simple-template, null-semantics]
required_capabilities: [create-text-search-dictionary, text-search, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: template)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY nd_simple (TEMPLATE = simple, stopwords = english)
    expect: ok
  - sql: |
      SELECT ts_lexize('nd_simple', '') AS empty_input, ts_lexize('nd_simple', NULL) AS null_input
    expect: rows
    comment: empty string yields {} and SQL NULL yields NULL
