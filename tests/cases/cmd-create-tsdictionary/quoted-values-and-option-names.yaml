# Quoted values are always allowed; quoted option names are case-sensitive, so "Language" is an unknown option.
id: cmd-create-tsdictionary.quoted-values-and-option-names
title: "Quoted option name and value are accepted; a case-changed quoted option name is rejected"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, snowball-template, quoted-values, identifier-case-folding]
required_capabilities: [create-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: value 'must be quoted (but you can always quote it)')"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY quoted_lang (TEMPLATE = snowball, "language" = 'english')
    expect: ok
    comment: quoted option name in lower case and quoted value
  - sql: |
      SELECT ts_lexize('quoted_lang', 'Cats')
    expect: rows
    comment: behaves like an english stemmer
  - sql: |
      CREATE TEXT SEARCH DICTIONARY bad_quoted (TEMPLATE = snowball, "Language" = 'english')
    expect: error
    sqlstate: "22023"
    comment: quoted identifiers keep case, so "Language" is not a recognized Snowball parameter
