# Documented my_russian example, verbatim. Its stopword file (tsearch_data/myrussian.stop) is not shipped, so the documented command fails.
id: cmd-create-tsdictionary.doc-example-verbatim-missing-stopfile
title: "Documented my_russian example fails with a config-file error when myrussian.stop is absent"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, snowball-template, stopwords-option]
required_capabilities: [create-text-search-dictionary, text-search, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Examples: my_russian)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY my_russian (
          template = snowball,
          language = russian,
          stopwords = myrussian
      )
    expect: error
    sqlstate: F0000
    compare_message: false
    comment: the stopword file path depends on the install prefix, so only the SQLSTATE is compared
  - sql: |
      SELECT count(*) FROM pg_ts_dict WHERE dictname = 'my_russian'
    expect: rows
    comment: a failed CREATE leaves no dictionary behind
