# Identifiers longer than NAMEDATALEN-1 (63 bytes) are truncated with a NOTICE; the stored name is the truncated form.
id: cmd-create-tsdictionary.name-truncation-notice
title: "Over-long dictionary name is truncated to 63 bytes with a NOTICE"
family: cmd-create-tsdictionary
tier: extended
feature_ids: [create-text-search-dictionary, identifier-length, notice]
required_capabilities: [create-text-search-dictionary, text-search, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: name)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY "This_name_is_definitely_longer_than_sixty_three_characters_total_xx" (TEMPLATE = simple)
    expect: notice
    comment: NOTICE that the identifier will be truncated
  - sql: |
      SELECT length(dictname) AS stored_len FROM pg_ts_dict WHERE dictname LIKE 'This_name%'
    expect: rows
    comment: 63 bytes stored
