# A dictionary name is unique per schema; a second CREATE with the same name fails and the original is unchanged.
id: cmd-create-tsdictionary.duplicate-name-error
title: "Creating a dictionary with an existing name in the same schema fails"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, unique-name]
required_capabilities: [create-text-search-dictionary, text-search, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: name)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY dup_dict (TEMPLATE = simple, stopwords = english)
    expect: ok
  - sql: |
      CREATE TEXT SEARCH DICTIONARY dup_dict (TEMPLATE = simple)
    expect: error
    sqlstate: "23505"
    compare_message: false
    comment: a unique violation on pg_ts_dict (the engine does not report duplicate_object here)
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'dup_dict'
    expect: rows
    comment: the original stopword setting survives the failed CREATE
