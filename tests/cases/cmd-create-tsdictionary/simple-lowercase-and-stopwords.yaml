# The simple template lower-cases tokens and drops stopwords; an input that is already lower case behaves the same.
id: cmd-create-tsdictionary.simple-lowercase-and-stopwords
title: "Simple template folds case and removes stopwords"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, simple-template, stopwords-option]
required_capabilities: [create-text-search-dictionary, text-search, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: template, option)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY simple_stop (TEMPLATE = simple, stopwords = english)
    expect: ok
  - sql: |
      SELECT ts_lexize('simple_stop', 'The') AS stop_upper, ts_lexize('simple_stop', 'Cat') AS mixed, ts_lexize('simple_stop', 'CAT') AS upper
    expect: rows
    comment: stopword check and lower-casing both apply; no stemming happens in the simple template
