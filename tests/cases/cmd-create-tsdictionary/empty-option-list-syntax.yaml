# The parenthesized option list must contain at least the TEMPLATE option; an empty list is a syntax error.
id: cmd-create-tsdictionary.empty-option-list-syntax
title: "Empty parenthesized option list is a syntax error"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, syntax]
required_capabilities: [create-text-search-dictionary, text-search, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Synopsis)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY empty_list ()
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM pg_ts_dict WHERE dictname = 'empty_list'
    expect: rows
