# Options may appear in any order; unquoted option names, template names and values are case-folded to lower case.
id: cmd-create-tsdictionary.options-any-order-and-case-folding
title: "Options in any order and unquoted names/values are case-folded"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, snowball-template, template-option, identifier-case-folding]
required_capabilities: [create-text-search-dictionary, text-search, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: 'The options can appear in any order.')"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY ord_dict (stopwords = english, Language = English, TEMPLATE = snowball)
    expect: ok
    comment: stopwords first, template last, mixed-case keywords and values
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'ord_dict'
    expect: rows
    comment: stored options are lower-cased and listed in the order the template reads them
  - sql: |
      SELECT ts_lexize('ord_dict', 'The') AS stopword, ts_lexize('ord_dict', 'Cats') AS stemmed
    expect: rows
    comment: english stopwords remove 'the'; english stemmer maps 'Cats' to 'cat'
