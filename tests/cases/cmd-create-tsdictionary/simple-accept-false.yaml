# accept = false makes the simple template decline non-stopwords (NULL lets the next dictionary try), while stopwords still return {}.
id: cmd-create-tsdictionary.simple-accept-false
title: "Simple template with accept = false returns NULL for non-stopwords"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, simple-template, accept-option, stopwords-option]
required_capabilities: [create-text-search-dictionary, text-search, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: option)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY declining (TEMPLATE = simple, stopwords = english, accept = false)
    expect: ok
  - sql: |
      SELECT ts_lexize('declining', 'the') AS stopword, ts_lexize('declining', 'Cat') AS mixed, ts_lexize('declining', 'cat') AS lower
    expect: rows
    comment: a stopword still returns {}; any other word returns NULL so the text search config can fall through to a later dictionary
