# Documented my_russian example with the stopword file swapped for the shipped 'russian' list, so it runs on a stock install.
id: cmd-create-tsdictionary.doc-example-shipped-russian-stopwords
title: "Documented Snowball example with the shipped russian stopword list creates a working dictionary"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, snowball-template, stopwords-option, language-option]
required_capabilities: [create-text-search-dictionary, text-search, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Examples: my_russian; stopword file replaced by shipped russian)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY my_russian (
          template = snowball,
          language = russian,
          stopwords = russian
      )
    expect: ok
    comment: the doc's 'myrussian' stopword file is not shipped; 'russian' is
  - sql: |
      SELECT ts_lexize('my_russian', 'и') AS stopword_removed, ts_lexize('my_russian', 'running') AS latin_passthrough
    expect: rows
    comment: the Cyrillic conjunction is a stopword, so it returns {}; the Russian stemmer leaves Latin letters unchanged
  - sql: |
      SELECT dictinitoption FROM pg_ts_dict WHERE dictname = 'my_russian'
    expect: rows
