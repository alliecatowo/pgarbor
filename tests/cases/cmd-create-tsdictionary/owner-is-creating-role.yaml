# The user who defines a text search dictionary becomes its owner.
id: cmd-create-tsdictionary.owner-is-creating-role
title: "Creating role owns the new dictionary"
family: cmd-create-tsdictionary
tier: core
feature_ids: [create-text-search-dictionary, ownership]
required_capabilities: [create-text-search-dictionary, text-search, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Description: owner)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY own_check (TEMPLATE = simple)
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(dictowner) = current_user AS owned_by_creator FROM pg_ts_dict WHERE dictname = 'own_check'
    expect: rows
