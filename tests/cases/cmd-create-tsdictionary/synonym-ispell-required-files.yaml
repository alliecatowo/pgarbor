# Templates that depend on external files: synonym requires its synonyms option; ispell requires dictionary files that must exist.
id: cmd-create-tsdictionary.synonym-ispell-required-files
title: "Synonym and ispell templates reject missing required options and missing files"
family: cmd-create-tsdictionary
tier: extended
feature_ids: [create-text-search-dictionary, synonym-template, ispell-template, template-option]
required_capabilities: [create-text-search-dictionary, text-search, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_tsdictionary.sgml#sql-createtsdictionary (Parameters: template, option)"
sessions: [a]
steps:
  - sql: |
      CREATE TEXT SEARCH DICTIONARY syn_no_opt (TEMPLATE = synonym)
    expect: error
    sqlstate: "22023"
    comment: the synonym template requires a synonyms option
  - sql: |
      CREATE TEXT SEARCH DICTIONARY syn_missing (TEMPLATE = synonym, synonyms = nosuchfile)
    expect: error
    sqlstate: F0000
    compare_message: false
    comment: the synonym file must exist under tsearch_data
  - sql: |
      CREATE TEXT SEARCH DICTIONARY ispell_missing (TEMPLATE = ispell, dictfile = nosuch, afffile = nosuch)
    expect: error
    sqlstate: F0000
    compare_message: false
    comment: the ispell dictionary file must exist under tsearch_data
