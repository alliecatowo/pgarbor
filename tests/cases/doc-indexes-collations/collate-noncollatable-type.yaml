# Documented error path: a COLLATE clause on an index key of a type that does not support collations.
id: doc-indexes-collations.collate-noncollatable-type
title: CREATE INDEX with COLLATE on an integer column fails with 42804
family: doc-indexes-collations
tier: core
feature_ids: [indexes, collation, errors]
required_capabilities: [create-table, insert, select, create-index, collation, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-collations (Indexes and Collations)"
sessions: [a]
setup: |
  CREATE COLLATION "y" (provider = icu, locale = 'und');
  CREATE TABLE test1c (id integer, content varchar);
steps:
  - sql: |
      CREATE INDEX bad_int_collate ON test1c (id COLLATE "y")
    expect: error
    sqlstate: "42804"
    comment: integer is not collatable, so the index key is rejected
  - sql: |
      SELECT count(*) FROM pg_indexes WHERE indexname = 'bad_int_collate'
    expect: rows
    order: ordered
    comment: the failed CREATE INDEX leaves no index behind
