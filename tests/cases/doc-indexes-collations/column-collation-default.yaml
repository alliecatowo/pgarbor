# Doc example: an index automatically uses the collation of its column. The ordering seen by a
# plain comparison and ORDER BY is the column collation "x" (C), so 'B' and 'A' sort before 'a'.
id: doc-indexes-collations.column-collation-default
title: Index on a collated varchar column uses the column collation for comparison and ordering
family: doc-indexes-collations
tier: core
feature_ids: [indexes, collation, column-collation, comparison, order-by]
required_capabilities: [create-table, insert, select, create-index, collation]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-collations (Indexes and Collations)"
sessions: [a]
setup: |
  CREATE COLLATION "x" FROM "C";
  CREATE TABLE test1c (id integer, content varchar COLLATE "x");
  INSERT INTO test1c VALUES (1, 'b'), (2, 'B'), (3, 'a'), (4, 'A'), (5, 'c'), (6, NULL);
steps:
  - sql: |
      CREATE INDEX test1c_content_index ON test1c (content)
    expect: ok
    comment: the index takes the collation of the underlying column, no COLLATE clause needed
  - sql: |
      SELECT content FROM test1c WHERE content > 'a' ORDER BY content
    expect: rows
    order: ordered
    comment: under the column collation 'B' and 'A' are below 'a', so only b and c qualify
  - sql: |
      SELECT id FROM test1c ORDER BY content
    expect: rows
    order: ordered
    comment: ORDER BY without COLLATE uses the column collation; NULL sorts last by default
  - sql: |
      SELECT id FROM test1c WHERE content = 'a'
    expect: rows
    order: multiset
