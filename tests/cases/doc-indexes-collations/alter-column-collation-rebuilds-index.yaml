# Changing a column's collation rebuilds the index on it: the index then follows the new column
# collation, its definition no longer names COLLATE, and ordering reflects the new collation.
id: doc-indexes-collations.alter-column-collation-rebuilds-index
title: ALTER COLUMN TYPE ... COLLATE rebuilds existing indexes under the new column collation
family: doc-indexes-collations
tier: core
feature_ids: [indexes, collation, alter-table, column-collation, catalog-introspection]
required_capabilities: [create-table, insert, select, create-index, alter-table, collation, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-collations (Indexes and Collations)"
sessions: [a]
setup: |
  CREATE COLLATION "x" FROM "C";
  CREATE COLLATION "y" (provider = icu, locale = 'und');
  CREATE TABLE test1c (id integer, content varchar COLLATE "x");
  INSERT INTO test1c VALUES (1, 'b'), (2, 'B'), (3, 'a'), (4, 'A'), (5, 'c'), (6, NULL);
  CREATE INDEX test1c_content_index ON test1c (content);
  CREATE INDEX test1c_content_y_index ON test1c (content COLLATE "y");
steps:
  - sql: |
      SELECT content FROM test1c ORDER BY content
    expect: rows
    order: ordered
    comment: before the change, ordering is by the column collation x
  - sql: |
      ALTER TABLE test1c ALTER COLUMN content TYPE varchar COLLATE "y"
    expect: ok
  - sql: |
      SELECT content FROM test1c ORDER BY content
    expect: rows
    order: ordered
    comment: after the change, ordering follows ICU y
  - sql: |
      SELECT indexname, indexdef FROM pg_indexes WHERE tablename = 'test1c' ORDER BY indexname
    expect: rows
    order: ordered
    comment: both indexes now use the column collation, so neither definition names COLLATE
