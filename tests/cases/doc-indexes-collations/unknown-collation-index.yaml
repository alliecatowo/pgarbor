# Documented error path: an index key naming a collation that does not exist.
id: doc-indexes-collations.unknown-collation-index
title: CREATE INDEX naming a missing collation fails with 42704 and leaves no index
family: doc-indexes-collations
tier: core
feature_ids: [indexes, collation, errors]
required_capabilities: [create-table, insert, select, create-index, collation, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-collations (Indexes and Collations)"
sessions: [a]
setup: |
  CREATE TABLE test1c (id integer, content varchar COLLATE "C");
  INSERT INTO test1c VALUES (1, 'b');
steps:
  - sql: |
      CREATE INDEX bad_missing_collation ON test1c (content COLLATE "nope")
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE INDEX good_collation ON test1c (content COLLATE "C")
    expect: ok
    comment: the same index with an existing collation succeeds
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'test1c' ORDER BY indexname
    expect: rows
    order: ordered
