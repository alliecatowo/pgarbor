# INSERT ... DEFAULT VALUES fills every column from its default; a second call hits the PK default.
id: slice-dml.insert-default-values
title: INSERT DEFAULT VALUES with RETURNING and primary-key collision on the default
family: slice-dml
tier: core
feature_ids: [insert, default-values, returning, column-defaults, primary-key]
required_capabilities: [create-table, insert, select, returning, column-defaults, default-values]
provenance:
  source: hand
  ref: "https://www.postgresql.org/docs/18/sql-insert.html"
sessions: [a]
setup: |
  CREATE TABLE seq_t (id int4 PRIMARY KEY DEFAULT 7, note text DEFAULT 'none', n int4);
steps:
  - sql: |
      INSERT INTO seq_t DEFAULT VALUES RETURNING *
    expect: rows
  - sql: |
      SELECT id, note, n IS NULL AS n_null FROM seq_t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO seq_t DEFAULT VALUES
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT count(*) FROM seq_t
    expect: rows
