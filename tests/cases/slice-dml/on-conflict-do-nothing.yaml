# INSERT ... ON CONFLICT DO NOTHING: conflicting rows are skipped and absent from RETURNING.
id: slice-dml.on-conflict-do-nothing
title: ON CONFLICT DO NOTHING skips existing keys and omits them from RETURNING
family: slice-dml
tier: core
feature_ids: [insert, on-conflict, on-conflict-do-nothing, returning, primary-key]
required_capabilities: [create-table, insert, select, returning, on-conflict]
provenance:
  source: hand
  ref: "https://www.postgresql.org/docs/18/sql-insert.html#SQL-ON-CONFLICT"
sessions: [a]
setup: |
  CREATE TABLE tag (name text PRIMARY KEY, hits int4 NOT NULL DEFAULT 0);
  INSERT INTO tag (name, hits) VALUES ('red', 1);
steps:
  - sql: |
      INSERT INTO tag (name) VALUES ('red'), ('blue') ON CONFLICT DO NOTHING RETURNING name
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO tag (name, hits) VALUES ('red', 99) ON CONFLICT (name) DO NOTHING RETURNING *
    expect: rows
  - sql: |
      SELECT name, hits FROM tag ORDER BY name
    expect: rows
    order: ordered
