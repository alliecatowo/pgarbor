# North-star DML: multi-row VALUES with DEFAULT and NULL, RETURNING *, then ordered read-back.
id: slice-dml.insert-multirow-returning
title: Multi-row INSERT with DEFAULT and NULL values, RETURNING *
family: slice-dml
tier: slice
feature_ids: [insert, returning, multi-row-values, column-defaults]
required_capabilities: [create-table, insert, select, returning, column-defaults]
provenance:
  source: hand
  ref: "https://www.postgresql.org/docs/18/sql-insert.html"
sessions: [a]
setup: |
  CREATE TABLE item (id int4 PRIMARY KEY, label text, qty int4 NOT NULL DEFAULT 0);
steps:
  - sql: |
      INSERT INTO item (id, label, qty) VALUES (1, 'bolt', 5), (2, NULL, DEFAULT), (3, '', 10) RETURNING *
    expect: rows
    order: multiset
  - sql: |
      SELECT id, label IS NULL AS label_null, label = '' AS label_empty, qty FROM item ORDER BY id
    expect: rows
    order: ordered
