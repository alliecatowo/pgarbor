# NOT NULL violation in one row of a multi-row INSERT fails the whole statement; no rows persist.
id: slice-dml.not-null-multirow-atomic
title: NOT NULL violation rejects a multi-row INSERT atomically
family: slice-dml
tier: core
feature_ids: [insert, not-null-constraint, constraints, errors]
required_capabilities: [create-table, insert, select, not-null-constraint]
provenance:
  source: hand
  ref: "https://www.postgresql.org/docs/18/ddl-constraints.html#DDL-CONSTRAINTS-NOT-NULL"
sessions: [a]
setup: |
  CREATE TABLE person (id int4 PRIMARY KEY, email text NOT NULL);
steps:
  - sql: |
      INSERT INTO person VALUES (1, 'a@x.test'), (2, NULL)
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT count(*) FROM person
    expect: rows
  - sql: |
      INSERT INTO person VALUES (1, 'a@x.test') RETURNING id, email
    expect: rows
