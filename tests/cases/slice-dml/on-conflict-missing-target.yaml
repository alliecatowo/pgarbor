# ON CONFLICT DO UPDATE without a conflict target is a syntax error and changes nothing.
id: slice-dml.on-conflict-missing-target
title: ON CONFLICT DO UPDATE without an inference target is rejected with 42601
family: slice-dml
tier: extended
feature_ids: [insert, on-conflict, on-conflict-do-update, errors]
required_capabilities: [create-table, insert, select, on-conflict]
provenance:
  source: hand
  ref: "https://www.postgresql.org/docs/18/sql-insert.html#SQL-ON-CONFLICT"
sessions: [a]
setup: |
  CREATE TABLE kv2 (k text PRIMARY KEY, v int4 NOT NULL);
steps:
  - sql: |
      INSERT INTO kv2 (k, v) VALUES ('d', 1) ON CONFLICT DO UPDATE SET v = EXCLUDED.v
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM kv2
    expect: rows
