# DELETE accepts an alias for its target table; the alias is what WHERE must reference.
id: delete.alias-target
title: DELETE with a target alias filters on the alias
family: delete
tier: core
feature_ids: [delete, insert, select, create-table, table-alias]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/delete.sql
sessions: [a]
setup: |
  CREATE TABLE delete_test (id int4 PRIMARY KEY, a int4, b text);
  INSERT INTO delete_test VALUES (1, 10, NULL), (2, 50, 'x'), (3, 100, 'y');
steps:
  - sql: |
      DELETE FROM delete_test AS dt WHERE dt.a > 75
    expect: ok
  - sql: |
      SELECT id, a FROM delete_test ORDER BY id
    expect: rows
    order: ordered
