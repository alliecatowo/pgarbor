# DELETE ... USING joins another table; only target rows with a matching partner are removed.
id: delete.using-join
title: DELETE USING removes target rows matched by a join to a second table
family: delete
tier: extended
feature_ids: [delete, using-clause, joins, insert, select, create-table]
required_capabilities: [create-table, insert, select, delete, joins]
provenance:
  source: hand
  ref: "PG18 sql-delete.html USING clause"
sessions: [a]
setup: |
  CREATE TABLE items (id int4 PRIMARY KEY, name text);
  CREATE TABLE doomed (item_id int4);
  INSERT INTO items VALUES (1, 'keep'), (2, 'drop'), (3, 'drop-too'), (4, 'keep-too');
  INSERT INTO doomed VALUES (2), (3), (99);
steps:
  - sql: |
      DELETE FROM items i USING doomed d WHERE i.id = d.item_id
    expect: ok
    comment: deletes ids 2 and 3; id 99 has no matching item
  - sql: |
      SELECT id, name FROM items ORDER BY id
    expect: rows
    order: ordered
