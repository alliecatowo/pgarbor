# A DELETE predicate may use an uncorrelated subquery evaluated against the same table.
id: delete.subquery-predicate
title: DELETE with an IN subquery over another table
family: delete
tier: extended
feature_ids: [delete, subqueries, insert, select, create-table]
required_capabilities: [create-table, insert, select, delete, subqueries]
provenance:
  source: hand
  ref: "PG18 sql-delete.html WHERE clause"
sessions: [a]
setup: |
  CREATE TABLE users (id int4 PRIMARY KEY, active bool NOT NULL);
  CREATE TABLE events (id int4 PRIMARY KEY, user_id int4);
  INSERT INTO users VALUES (1, true), (2, false), (3, false);
  INSERT INTO events VALUES (10, 2), (11, 1), (12, 3);
steps:
  - sql: |
      DELETE FROM events WHERE user_id IN (SELECT id FROM users WHERE NOT active)
    expect: ok
    comment: removes events 10 and 12
  - sql: |
      SELECT id, user_id FROM events ORDER BY id
    expect: rows
    order: ordered
