# PostgreSQL DELETE has no LIMIT clause; the parser rejects it with syntax_error.
id: delete.limit-syntax-error
title: DELETE with LIMIT is rejected with syntax_error
family: delete
tier: core
feature_ids: [delete, errors, parser]
required_capabilities: [create-table, insert, select, delete, errors]
provenance:
  source: hand
  ref: "PG18 sql-delete.html synopsis (no LIMIT); errcodes 42601 syntax_error"
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY);
  INSERT INTO d VALUES (1), (2);
steps:
  - sql: |
      DELETE FROM d LIMIT 1
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) AS n FROM d
    expect: rows
