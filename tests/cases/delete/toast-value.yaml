# Deleting a row whose wide text value is stored out of line (TOAST) removes it cleanly.
id: delete.toast-value
title: DELETE removes a row holding a TOASTed 10000-byte text value
family: delete
tier: extended
feature_ids: [delete, toast, text, insert, select, create-table]
required_capabilities: [create-table, insert, select, delete, toast]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/delete.sql
sessions: [a]
setup: |
  CREATE TABLE delete_test (id int4 PRIMARY KEY, a int4, b text);
  INSERT INTO delete_test VALUES (1, 10, NULL), (2, 50, repeat('x', 10000)), (3, 100, 'small');
steps:
  - sql: |
      SELECT id, a, char_length(b) AS blen FROM delete_test ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM delete_test WHERE a > 25
    expect: ok
    comment: removes the TOASTed row and the row with id 3
  - sql: |
      SELECT id, a, char_length(b) AS blen FROM delete_test ORDER BY id
    expect: rows
    order: ordered
