# A WHERE predicate that evaluates to NULL does not delete the row; "= NULL" never matches.
id: delete.null-predicate
title: DELETE skips rows where the predicate is NULL, including comparisons to NULL
family: delete
tier: core
feature_ids: [delete, insert, select, create-table, nulls]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/delete.sql
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY, a int4);
  INSERT INTO d VALUES (1, NULL), (2, 5), (3, NULL), (4, 80);
steps:
  - sql: |
      DELETE FROM d WHERE a > 25
    expect: ok
    comment: NULL > 25 is NULL, so rows 1 and 3 survive
  - sql: |
      DELETE FROM d WHERE a = NULL
    expect: ok
    comment: deletes nothing
  - sql: |
      SELECT id, a, a IS NULL AS a_null FROM d ORDER BY id
    expect: rows
    order: ordered
