# Once DELETE names a target alias, the original table name is no longer a valid qualifier.
id: delete.alias-hides-table-name
title: DELETE with an alias rejects the original table name in WHERE
family: delete
tier: core
feature_ids: [delete, select, create-table, table-alias, errors]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/delete.sql
sessions: [a]
setup: |
  CREATE TABLE delete_test (id int4 PRIMARY KEY, a int4, b text);
  INSERT INTO delete_test VALUES (1, 10, NULL), (2, 50, 'x');
steps:
  - sql: |
      DELETE FROM delete_test dt WHERE delete_test.a > 25
    expect: error
    sqlstate: "42P01"
    comment: FROM-clause entry is named dt, so delete_test is not visible
  - sql: |
      SELECT id, a FROM delete_test ORDER BY id
    expect: rows
    order: ordered
    comment: the failed DELETE removed nothing
