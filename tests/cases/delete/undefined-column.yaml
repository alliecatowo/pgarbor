# DELETE whose WHERE references a missing column fails with undefined_column and removes nothing.
id: delete.undefined-column
title: DELETE with an unknown column in WHERE raises undefined_column
family: delete
tier: core
feature_ids: [delete, errors, create-table, insert, select]
required_capabilities: [create-table, insert, select, delete, errors]
provenance:
  source: hand
  ref: "PG18 errcodes-appendix.html class 42 (42703 undefined_column)"
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY, a int4);
  INSERT INTO d VALUES (1, 10);
steps:
  - sql: |
      DELETE FROM d WHERE nosuch > 1
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT id, a FROM d ORDER BY id
    expect: rows
    order: ordered
