# A parameterized DELETE over the unnamed-statement extended protocol binds its value and reports the count.
id: delete.prepared-parameter
title: DELETE with a bound text parameter via exec_params
family: delete
tier: extended
feature_ids: [delete, extended-protocol, prepared-statements, insert, select, create-table]
required_capabilities: [create-table, insert, select, delete, extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
setup: |
  CREATE TABLE kv (k text PRIMARY KEY, v int8);
  INSERT INTO kv VALUES ('a', 1), ('b', NULL), ('c', 3);
steps:
  - exec_params:
      sql: |
        DELETE FROM kv WHERE k = $1
      params: ["b"]
      param_types: [25]
    expect: ok
  - exec_params:
      sql: |
        DELETE FROM kv WHERE k = $1
      params: [null]
      param_types: [25]
    expect: ok
    comment: NULL parameter matches nothing
  - sql: |
      SELECT k, v FROM kv ORDER BY k
    expect: rows
    order: ordered
