# An aggregate is not allowed in a DELETE WHERE clause; the statement fails with grouping_error.
id: delete.aggregate-in-where
title: DELETE with an aggregate in WHERE raises grouping_error
family: delete
tier: core
feature_ids: [delete, aggregates, errors]
required_capabilities: [create-table, insert, select, delete, aggregates, errors]
provenance:
  source: hand
  ref: "PG18 sql-delete.html; errcodes 42803 grouping_error"
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY, a int4);
  INSERT INTO d VALUES (1, 10), (2, 20);
steps:
  - sql: |
      DELETE FROM d WHERE count(*) > 0
    expect: error
    sqlstate: "42803"
  - sql: |
      SELECT count(*) AS n FROM d
    expect: rows
