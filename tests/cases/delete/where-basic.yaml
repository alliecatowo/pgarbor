# DELETE with a WHERE predicate removes only matching rows; the command tag reports the count.
id: delete.where-basic
title: DELETE with WHERE removes only matching rows and reports the count
family: delete
tier: core
feature_ids: [delete, insert, select, create-table]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/delete.sql
sessions: [a]
setup: |
  CREATE TABLE delete_test (id int4 PRIMARY KEY, a int4, b text);
  INSERT INTO delete_test VALUES (1, 10, NULL), (2, 50, 'x'), (3, 100, 'y');
steps:
  - sql: |
      DELETE FROM delete_test WHERE a > 25
    expect: ok
    comment: command tag DELETE 2
  - sql: |
      SELECT id, a, b FROM delete_test ORDER BY id
    expect: rows
    order: ordered
