# DELETE without WHERE empties the table; deleting from an empty table succeeds with zero rows.
id: delete.all-rows-empty-table
title: DELETE without WHERE removes every row; a second DELETE affects zero rows
family: delete
tier: core
feature_ids: [delete, insert, select, create-table]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/delete.sql
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY, v text);
  INSERT INTO d VALUES (1, 'a'), (2, NULL), (3, '');
steps:
  - sql: |
      DELETE FROM d
    expect: ok
    comment: command tag DELETE 3
  - sql: |
      SELECT count(*) AS n FROM d
    expect: rows
  - sql: |
      DELETE FROM d
    expect: ok
    comment: command tag DELETE 0
