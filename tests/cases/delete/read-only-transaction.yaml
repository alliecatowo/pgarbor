# DELETE inside a READ ONLY transaction fails with read_only_sql_transaction; the rows survive.
id: delete.read-only-transaction
title: DELETE in a read-only transaction raises read_only_sql_transaction
family: delete
tier: core
feature_ids: [delete, transactions, errors]
required_capabilities: [create-table, insert, select, delete, transactions, errors]
provenance:
  source: hand
  ref: "PG18 sql-set-transaction.html READ ONLY; errcodes 25006"
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY);
  INSERT INTO d VALUES (1), (2);
steps:
  - sql: |
      BEGIN READ ONLY
    expect: ok
  - sql: |
      DELETE FROM d WHERE id = 1
    expect: error
    sqlstate: "25006"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT id FROM d ORDER BY id
    expect: rows
    order: ordered
