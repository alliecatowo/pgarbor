# DELETE ... RETURNING yields the deleted rows as they were before removal.
id: delete.returning-rows
title: DELETE RETURNING returns the removed rows
family: delete
tier: core
feature_ids: [delete, returning, insert, create-table]
required_capabilities: [create-table, insert, delete, returning]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/delete.sql
sessions: [a]
setup: |
  CREATE TABLE d (id int4 PRIMARY KEY, a int4, b text);
  INSERT INTO d VALUES (1, 10, 'low'), (2, 50, NULL), (3, 100, 'high');
steps:
  - sql: |
      DELETE FROM d WHERE a >= 50 RETURNING id, a, b
    expect: rows
    order: multiset
  - sql: |
      SELECT id, a FROM d ORDER BY id
    expect: rows
    order: ordered
