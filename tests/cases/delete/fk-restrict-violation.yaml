# Deleting a referenced parent row with the default NO ACTION fails with 23503 and removes nothing.
id: delete.fk-restrict-violation
title: DELETE of a referenced parent row fails with foreign_key_violation
family: delete
tier: core
feature_ids: [delete, foreign-keys, constraints, errors]
required_capabilities: [create-table, insert, select, delete, foreign-keys]
provenance:
  source: hand
  ref: "PG18 errcodes-appendix.html class 23 (23503 foreign_key_violation)"
sessions: [a]
setup: |
  CREATE TABLE parent (id int4 PRIMARY KEY);
  CREATE TABLE child (id int4 PRIMARY KEY, parent_id int4 REFERENCES parent (id));
  INSERT INTO parent VALUES (1), (2);
  INSERT INTO child VALUES (10, 1);
steps:
  - sql: |
      DELETE FROM parent WHERE id = 1
    expect: error
    sqlstate: "23503"
  - sql: |
      SELECT id FROM parent ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM parent WHERE id = 2
    expect: ok
    comment: unreferenced row deletes fine
