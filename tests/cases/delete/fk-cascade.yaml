# Deleting a parent row cascades to child rows referencing it under ON DELETE CASCADE.
id: delete.fk-cascade
title: DELETE on a parent row cascades to referencing child rows
family: delete
tier: extended
feature_ids: [delete, foreign-keys, cascade, insert, select, create-table]
required_capabilities: [create-table, insert, select, delete, foreign-keys]
provenance:
  source: hand
  ref: "PG18 ddl-constraints.html#DDL-CONSTRAINTS-FK"
sessions: [a]
setup: |
  CREATE TABLE parent (id int4 PRIMARY KEY);
  CREATE TABLE child (id int4 PRIMARY KEY, parent_id int4 REFERENCES parent (id) ON DELETE CASCADE);
  INSERT INTO parent VALUES (1), (2);
  INSERT INTO child VALUES (10, 1), (11, 1), (12, 2);
steps:
  - sql: |
      DELETE FROM parent WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, parent_id FROM child ORDER BY id
    expect: rows
    order: ordered
