# PG15+ NULLS NOT DISTINCT unique btree index: repeated NULLs are a violation.
id: btree-index.unique-nulls-not-distinct
title: NULLS NOT DISTINCT unique btree index rejects a second NULL key with 23505
family: btree-index
tier: extended
feature_ids: [unique-index, create-index, nulls, constraints, errors, nulls-not-distinct]
required_capabilities: [create-table, insert, select, create-index, errors, nulls-not-distinct]
provenance:
  source: hand
  ref: "PG18 sql-createindex.html (NULLS [NOT] DISTINCT); errcodes 23505"
setup: |
  CREATE TABLE uqn (a int, b int);
  CREATE UNIQUE INDEX uqn_a ON uqn (a) NULLS NOT DISTINCT;
steps:
  - sql: |
      INSERT INTO uqn VALUES (NULL, 1), (2, 2)
    expect: ok
  - sql: |
      INSERT INTO uqn VALUES (NULL, 3)
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT a, b FROM uqn ORDER BY b
    expect: rows
    order: ordered
