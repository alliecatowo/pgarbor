# Error path: dropping a btree index that does not exist, with and without IF EXISTS.
id: btree-index.drop-missing-index-error
title: DROP INDEX on a missing btree index fails with 42704 and IF EXISTS suppresses the error
family: btree-index
tier: core
feature_ids: [drop-index, errors, create-index]
required_capabilities: [create-table, select, create-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/btree_index.sql (DROP INDEX cleanup); PG18 errcodes 42704"
setup: |
  CREATE TABLE dr (a int);
  CREATE INDEX dr_a ON dr (a);
steps:
  - sql: |
      DROP INDEX dr_missing
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP INDEX IF EXISTS dr_missing
    expect: ok
    comment: notice only, not an error
  - sql: |
      DROP INDEX dr_a
    expect: ok
  - sql: |
      DROP INDEX dr_a
    expect: error
    sqlstate: "42704"
