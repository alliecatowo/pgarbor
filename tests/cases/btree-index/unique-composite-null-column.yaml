# Derived from PG18 btree_index.sql unique checking on multi-column keys: a NULL in any column makes the key distinct.
id: btree-index.unique-composite-null-column
title: Composite unique btree key treats rows with a NULL column as distinct and rejects an exact duplicate
family: btree-index
tier: core
feature_ids: [unique-index, create-index, insert, constraints, errors, nulls]
required_capabilities: [create-table, insert, select, create-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/btree_index.sql (unique checking); PG18 errcodes 23505"
setup: |
  CREATE TABLE uc (a int, b int);
  CREATE UNIQUE INDEX uc_ab ON uc (a, b);
steps:
  - sql: |
      INSERT INTO uc VALUES (1, NULL), (1, NULL), (1, 2)
    expect: ok
  - sql: |
      INSERT INTO uc VALUES (1, 2)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO uc VALUES (2, 2), (1, 3)
    expect: ok
  - sql: |
      SELECT a, b FROM uc ORDER BY a, b
    expect: rows
    order: ordered
