# Derived from PG18 btree_index.sql ALTER INDEX ... ALTER COLUMN ... SET (n_distinct=...) on a btree index.
id: btree-index.alter-index-n-distinct
title: ALTER INDEX ALTER COLUMN SET n_distinct succeeds on a btree index and the index still answers queries
family: btree-index
tier: extended
feature_ids: [alter-index, create-index, btree-index, select, statistics]
required_capabilities: [create-table, insert, select, create-index, alter-index]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/btree_index.sql (ALTER INDEX btree_tall_idx2 ALTER COLUMN id SET (n_distinct=100))"
setup: |
  CREATE TABLE ad (id int4, t text);
  INSERT INTO ad SELECT g, 'x' FROM generate_series(1, 200) g;
  CREATE INDEX ad_id ON ad (id);
steps:
  - sql: |
      ALTER INDEX ad_id ALTER COLUMN id SET (n_distinct = 100)
    expect: ok
  - sql: |
      DROP INDEX ad_id
    expect: ok
    comment: second index drop shows the index is still a normal object after the option change
  - sql: |
      SELECT count(*) FROM ad WHERE id = 150
    expect: rows
