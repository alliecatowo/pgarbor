# Derived from PG18 btree_index.sql: an opclass option that the btree int4 opclass does not accept must be rejected.
id: btree-index.opclass-option-unsupported
title: CREATE INDEX with an option on int4_ops, which takes no options, is rejected
family: btree-index
tier: extended
feature_ids: [create-index, opclass, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/btree_index.sql (create index on btree_tall_tbl (id int4_ops(foo=1)))"
setup: |
  CREATE TABLE opt (id int4, t text);
steps:
  - sql: |
      CREATE INDEX opt_bad ON opt (id int4_ops(foo=1))
    expect: error
    comment: sqlstate intentionally omitted; the recording determines the exact code
  - sql: |
      CREATE INDEX opt_ok ON opt (id int4_ops)
    expect: ok
    comment: the same index without the bogus option must succeed
