# COMMENT ON RULE naming a rule the view does not have fails with 42704; a real rule accepts comment and NULL removal.
id: rules.error-comment-missing-rule
title: COMMENT ON RULE on an unknown rule fails with undefined_object, and NULL removes a comment
family: rules
tier: extended
feature_ids: [rules, comments, errors]
required_capabilities: [create-table, create-view, create-rule, comments, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rules.sql (COMMENT ON RULE rtest_v1_bad, comment NULL)"
sessions: [a]
setup: |
  CREATE TABLE cr (a int4);
  CREATE VIEW cv AS SELECT * FROM cr;
  CREATE RULE cv_r AS ON INSERT TO cv DO INSTEAD NOTHING;
steps:
  - sql: |
      COMMENT ON RULE cv_bad ON cv IS 'bad rule'
    expect: error
    sqlstate: "42704"
  - sql: |
      COMMENT ON RULE cv_r ON cv IS 'insert is ignored'
    expect: ok
  - sql: |
      COMMENT ON RULE cv_r ON cv IS NULL
    expect: ok
