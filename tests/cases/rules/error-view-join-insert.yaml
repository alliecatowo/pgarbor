# INSERT into a join view with no INSERT rule or trigger is rejected as not automatically updatable.
id: rules.error-view-join-insert
title: INSERT into a join view without an INSTEAD rule fails with 0A000
family: rules
tier: core
feature_ids: [rules, views, insert, errors]
required_capabilities: [create-table, create-view, insert, select, errors]
provenance:
  source: hand
  ref: "PG18 sql-createrule.html; PG18 rules-privileges / views-updatable; errcodes 0A000"
sessions: [a]
setup: |
  CREATE TABLE vl (x int4, y text);
  CREATE TABLE vr (x int4, z text);
  CREATE VIEW vj AS SELECT l.x, l.y, r.z FROM vl l JOIN vr r ON l.x = r.x;
steps:
  - sql: |
      INSERT INTO vj (x, y, z) VALUES (1, 'a', 'b')
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM vl
    expect: rows
    comment: the failed insert left no rows behind
