# CREATE RULE on a relation that does not exist fails with 42P01.
id: rules.error-rule-missing-table
title: CREATE RULE on a missing table fails with undefined_table
family: rules
tier: core
feature_ids: [rules, errors]
required_capabilities: [create-rule, errors, select]
provenance:
  source: hand
  ref: "PG18 sql-createrule.html; errcodes 42P01"
sessions: [a]
steps:
  - sql: |
      CREATE RULE nr_missing AS ON INSERT TO no_such_table DO INSTEAD NOTHING
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT 1
    expect: rows
