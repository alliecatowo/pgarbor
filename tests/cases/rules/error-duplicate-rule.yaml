# A second rule with the same name on the same table fails with 42710; the first rule still applies.
id: rules.error-duplicate-rule
title: Duplicate rule name on one table fails with duplicate_object and the original rule stays in effect
family: rules
tier: core
feature_ids: [rules, errors, insert]
required_capabilities: [create-table, create-rule, insert, select, errors]
provenance:
  source: hand
  ref: "PG18 sql-createrule.html; errcodes 42710"
sessions: [a]
setup: |
  CREATE TABLE dr (a int4);
  CREATE RULE dr_r AS ON INSERT TO dr DO INSTEAD NOTHING;
steps:
  - sql: |
      CREATE RULE dr_r AS ON INSERT TO dr DO INSTEAD NOTHING
    expect: error
    sqlstate: "42710"
  - sql: |
      INSERT INTO dr VALUES (1)
    expect: ok
  - sql: |
      SELECT count(*) FROM dr
    expect: rows
    comment: the rule from setup is still in effect, so the insert wrote nothing
