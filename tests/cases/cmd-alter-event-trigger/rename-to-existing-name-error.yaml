# RENAME TO fails with duplicate_object when the target name is already an event trigger.
id: cmd-alter-event-trigger.rename-to-existing-name-error
title: RENAME TO an existing event trigger name fails and leaves both triggers unchanged
family: cmd-alter-event-trigger
tier: core
feature_ids: [alter-event-trigger, event-triggers]
required_capabilities: [event-triggers, plpgsql, create-function, create-table, guc]
provenance:
  source: pg-docs
  ref: "ref/alter_event_trigger.sgml#sql-altereventtrigger"
setup: |
  CREATE FUNCTION aet_block() RETURNS event_trigger LANGUAGE plpgsql AS $$ BEGIN RAISE EXCEPTION 'blocked by aet_guard' USING ERRCODE = 'P0001'; END $$;
  CREATE EVENT TRIGGER aet_guard ON ddl_command_start WHEN TAG IN ('CREATE TABLE') EXECUTE FUNCTION aet_block();
  CREATE EVENT TRIGGER aet_other ON ddl_command_start WHEN TAG IN ('DROP TABLE') EXECUTE FUNCTION aet_block();
steps:
  - sql: |
      ALTER EVENT TRIGGER aet_guard RENAME TO aet_other
    expect: error
    sqlstate: '42710'
  - sql: |
      SELECT evtname FROM pg_event_trigger ORDER BY evtname
    expect: rows
    order: ordered
