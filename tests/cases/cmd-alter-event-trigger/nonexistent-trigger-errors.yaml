# Every ALTER EVENT TRIGGER form on an unknown name fails with undefined_object.
id: cmd-alter-event-trigger.nonexistent-trigger-errors
title: ALTER EVENT TRIGGER on an unknown name fails with undefined_object for every form
family: cmd-alter-event-trigger
tier: core
feature_ids: [alter-event-trigger, event-triggers]
required_capabilities: [event-triggers, plpgsql, create-function, create-table, guc]
provenance:
  source: pg-docs
  ref: "ref/alter_event_trigger.sgml#sql-altereventtrigger"
setup: |
  CREATE FUNCTION aet_block() RETURNS event_trigger LANGUAGE plpgsql AS $$ BEGIN RAISE EXCEPTION 'blocked by aet_guard' USING ERRCODE = 'P0001'; END $$;
  CREATE EVENT TRIGGER aet_guard ON ddl_command_start WHEN TAG IN ('CREATE TABLE') EXECUTE FUNCTION aet_block();
steps:
  - sql: |
      ALTER EVENT TRIGGER aet_missing DISABLE
    expect: error
    sqlstate: '42704'
  - sql: |
      ALTER EVENT TRIGGER aet_missing ENABLE
    expect: error
    sqlstate: '42704'
  - sql: |
      ALTER EVENT TRIGGER aet_missing ENABLE REPLICA
    expect: error
    sqlstate: '42704'
  - sql: |
      ALTER EVENT TRIGGER aet_missing ENABLE ALWAYS
    expect: error
    sqlstate: '42704'
  - sql: |
      ALTER EVENT TRIGGER aet_missing RENAME TO aet_new
    expect: error
    sqlstate: '42704'
  - sql: |
      ALTER EVENT TRIGGER aet_missing OWNER TO CURRENT_USER
    expect: error
    sqlstate: '42704'
  - sql: |
      SELECT evtname, CASE evtenabled WHEN 'O' THEN 'origin' WHEN 'D' THEN 'disabled' WHEN 'R' THEN 'replica' WHEN 'A' THEN 'always' END AS mode FROM pg_event_trigger ORDER BY evtname
    expect: rows
    order: ordered
    comment: the existing trigger is untouched
