# OWNER TO a role that does not exist fails with undefined_object and leaves the owner unchanged.
id: cmd-alter-event-trigger.owner-to-nonexistent-role-error
title: OWNER TO an unknown role fails and leaves the owner unchanged
family: cmd-alter-event-trigger
tier: core
feature_ids: [alter-event-trigger, event-triggers]
required_capabilities: [event-triggers, plpgsql, create-function, create-table, guc]
provenance:
  source: pg-docs
  ref: "ref/alter_event_trigger.sgml#sql-altereventtrigger"
setup: |
  CREATE FUNCTION aet_block() RETURNS event_trigger LANGUAGE plpgsql AS $$ BEGIN RAISE EXCEPTION 'blocked by aet_guard' USING ERRCODE = 'P0001'; END $$;
  CREATE EVENT TRIGGER aet_guard ON ddl_command_start WHEN TAG IN ('CREATE TABLE') EXECUTE FUNCTION aet_block();
steps:
  - sql: |
      ALTER EVENT TRIGGER aet_guard OWNER TO aet_no_such_role
    expect: error
    sqlstate: '42704'
  - sql: |
      SELECT evtname, pg_get_userbyid(evtowner) AS owner FROM pg_event_trigger
    expect: rows
