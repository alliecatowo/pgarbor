# Unknown index method and unknown schema fail with their own SQLSTATEs; USING is required by the synopsis.
id: cmd-create-opfamily.undefined-and-syntax-errors
title: Unknown index method, unknown schema and missing USING clause each fail and create nothing
family: cmd-create-opfamily
tier: core
feature_ids: [create-operator-family, errors, index-method, schema-qualified-name, syntax]
required_capabilities: [create-operator-family, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_opfamily.sgml#sql-createopfamily (Synopsis: CREATE OPERATOR FAMILY name USING index_method; Parameters: index_method)"
sessions: [a]
steps:
  - sql: |
      CREATE OPERATOR FAMILY cof_bad USING nosuchmethod
    expect: error
    sqlstate: "42704"
    comment: index_method must name an existing access method
  - sql: |
      CREATE OPERATOR FAMILY nosuch_schema_cof.cof_bad USING btree
    expect: error
    sqlstate: "3F000"
    comment: the schema qualifier must exist
  - sql: |
      CREATE OPERATOR FAMILY cof_bad
    expect: error
    sqlstate: "42601"
    comment: USING index_method is part of the required syntax
  - sql: |
      SELECT count(*) FROM pg_opfamily WHERE opfname = 'cof_bad'
    expect: rows
    comment: none of the failed statements created a family
