# A superuser that creates an operator family becomes its owner.
id: cmd-create-opfamily.superuser-owner
title: Family created by a superuser role is owned by that role
family: cmd-create-opfamily
tier: core
feature_ids: [create-operator-family, owner, superuser-only]
required_capabilities: [create-operator-family, roles, set-role, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_opfamily.sgml#sql-createopfamily (Description: The user who defines an operator family becomes its owner)"
sessions: [a]
setup: |
  CREATE ROLE cof_owner SUPERUSER
steps:
  - sql: |
      SET ROLE cof_owner
    expect: ok
  - sql: |
      CREATE OPERATOR FAMILY cof_owned USING gist
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(opfowner) AS owner, opfname FROM pg_opfamily WHERE opfname = 'cof_owned'
    expect: rows
    order: ordered
    comment: owner is the creating role, not the session role
  - sql: |
      DROP OPERATOR FAMILY cof_owned USING gist;
      DROP ROLE cof_owner
    expect: ok
