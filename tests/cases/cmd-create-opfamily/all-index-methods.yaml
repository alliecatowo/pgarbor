# The same family name is accepted once for each index method, including every built-in access method.
id: cmd-create-opfamily.all-index-methods
title: One family name can be created for each built-in index method
family: cmd-create-opfamily
tier: core
feature_ids: [create-operator-family, index-method, name-reuse-across-methods]
required_capabilities: [create-operator-family, catalog-introspection, gist-index, gin, hash-index, brin, spgist]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_opfamily.sgml#sql-createopfamily (Description: two families in the same schema can share a name only for different index methods)"
sessions: [a]
steps:
  - sql: |
      CREATE OPERATOR FAMILY cof_m USING btree;
      CREATE OPERATOR FAMILY cof_m USING hash;
      CREATE OPERATOR FAMILY cof_m USING gist;
      CREATE OPERATOR FAMILY cof_m USING gin;
      CREATE OPERATOR FAMILY cof_m USING spgist;
      CREATE OPERATOR FAMILY cof_m USING brin
    expect: ok
  - sql: |
      SELECT am.amname
      FROM pg_opfamily f
      JOIN pg_am am ON am.oid = f.opfmethod
      WHERE f.opfname = 'cof_m'
    expect: rows
    order: ordered
    comment: six families, one per access method
  - sql: |
      DROP OPERATOR FAMILY cof_m USING btree;
      DROP OPERATOR FAMILY cof_m USING hash;
      DROP OPERATOR FAMILY cof_m USING gist;
      DROP OPERATOR FAMILY cof_m USING gin;
      DROP OPERATOR FAMILY cof_m USING spgist;
      DROP OPERATOR FAMILY cof_m USING brin
    expect: ok
