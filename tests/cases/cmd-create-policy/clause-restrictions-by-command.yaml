# WITH CHECK is only allowed for ALL, INSERT and UPDATE policies, and an INSERT policy cannot take USING.
id: cmd-create-policy.clause-restrictions-by-command
title: "WITH CHECK is refused for SELECT and DELETE policies; USING is refused for INSERT"
family: cmd-create-policy
tier: core
feature_ids: [create-policy, policies, errors, syntax]
required_capabilities: [create-table, rls, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_policy.sgml#sql-createpolicy-select (and -insert, -delete)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v int4);
steps:
  - sql: |
      CREATE POLICY c1 ON t FOR SELECT USING (true) WITH CHECK (true)
    expect: error
    sqlstate: "42601"
    comment: a SELECT policy cannot have a WITH CHECK expression
  - sql: |
      CREATE POLICY c2 ON t FOR DELETE USING (true) WITH CHECK (true)
    expect: error
    sqlstate: "42601"
    comment: a DELETE policy cannot have a WITH CHECK expression
  - sql: |
      CREATE POLICY c3 ON t FOR INSERT USING (true)
    expect: error
    sqlstate: "42601"
    comment: an INSERT policy cannot have a USING expression
  - sql: |
      SELECT count(*) AS policies FROM pg_policies
    expect: rows
    order: multiset
