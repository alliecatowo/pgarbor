# The policy target may be schema-qualified; the catalog records the table's schema.
id: cmd-create-policy.schema-qualified-table
title: "Policy on a schema-qualified table is recorded against that schema"
family: cmd-create-policy
tier: core
feature_ids: [create-policy, policies, schemas, catalog-introspection]
required_capabilities: [create-table, create-schema, rls, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_policy.sgml#sql-createpolicy (Parameters: table_name)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
  CREATE TABLE s1.t (id int4, v int4);
steps:
  - sql: |
      CREATE POLICY sq ON s1.t AS PERMISSIVE FOR ALL TO PUBLIC USING (v > 0)
    expect: ok
  - sql: |
      SELECT schemaname, tablename, policyname, permissive, cmd, roles FROM pg_policies ORDER BY schemaname, tablename, policyname
    expect: rows
    order: ordered
  - sql: |
      DROP SCHEMA s1 CASCADE
    expect: ok
