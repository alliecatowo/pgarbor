# Row locking reads apply UPDATE policy USING expressions, not SELECT policies, so FOR UPDATE can see fewer rows than a plain SELECT.
id: cmd-create-policy.select-for-update-uses-update-policy
title: "SELECT FOR UPDATE filters rows through the UPDATE policy while plain SELECT uses the SELECT policy"
family: cmd-create-policy
tier: core
feature_ids: [create-policy, policies, select-for-update, row-locks]
required_capabilities: [create-table, insert, select, update, rls, roles, row-locks]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_policy.sgml#sql-createpolicy-update and the Policies Applied by Command Type table"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_cp_fu;
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (1, 5), (2, -1), (3, 0);
  GRANT SELECT, UPDATE ON t TO pgarbor_case_cp_fu;
  ALTER TABLE t ENABLE ROW LEVEL SECURITY;
  CREATE POLICY p_upd ON t FOR UPDATE TO pgarbor_case_cp_fu USING (v > 0);
  CREATE POLICY p_sel ON t FOR SELECT TO pgarbor_case_cp_fu USING (true);
steps:
  - sql: |
      SET ROLE pgarbor_case_cp_fu
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id FOR UPDATE
    expect: rows
    order: ordered
    comment: only the row passing the UPDATE USING expression is returned and locked
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: a plain SELECT is governed by the SELECT policy, so every row is visible
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP TABLE t; DROP ROLE pgarbor_case_cp_fu
    expect: ok
