# Omitted AS / FOR / TO clauses default to PERMISSIVE, ALL and PUBLIC; the explicit spelling stores the same catalog values.
id: cmd-create-policy.defaults-and-explicit-permissive
title: "Omitted AS, FOR and TO clauses default to PERMISSIVE, ALL and PUBLIC"
family: cmd-create-policy
tier: core
feature_ids: [create-policy, policies, defaults, catalog-introspection]
required_capabilities: [create-table, rls, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_policy.sgml#sql-createpolicy (Parameters: PERMISSIVE, command, role_name)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v int4);
  CREATE POLICY p_default ON t USING (v > 0);
  CREATE POLICY p_explicit ON t AS PERMISSIVE FOR ALL TO PUBLIC USING (v > 0);
steps:
  - sql: |
      SELECT policyname, permissive, cmd, roles, qual, with_check FROM pg_policies WHERE tablename = 't' ORDER BY policyname
    expect: rows
    order: ordered
    comment: both policies store PERMISSIVE, ALL, {public}, the same USING and no WITH CHECK
