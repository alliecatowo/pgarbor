# TO accepts CURRENT_USER and CURRENT_ROLE (resolved to the creating role at creation time) mixed with explicit role names.
id: cmd-create-policy.to-role-list-and-current-user
title: "TO clause resolves CURRENT_USER and CURRENT_ROLE and keeps the role list order"
family: cmd-create-policy
tier: core
feature_ids: [create-policy, policies, roles, catalog-introspection]
required_capabilities: [create-table, rls, roles, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_policy.sgml#sql-createpolicy (Parameters: role_name)"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_cp_own;
  CREATE ROLE pgarbor_case_cp_other;
  CREATE TABLE t (id int4, v int4);
  ALTER TABLE t OWNER TO pgarbor_case_cp_own;
steps:
  - sql: |
      SET ROLE pgarbor_case_cp_own
    expect: ok
  - sql: |
      CREATE POLICY p_cur ON t TO CURRENT_USER USING (true)
    expect: ok
  - sql: |
      CREATE POLICY p_list ON t AS PERMISSIVE TO CURRENT_ROLE, pgarbor_case_cp_other USING (v >= 0)
    expect: ok
    comment: the owner may create policies, so SET ROLE to the owner first
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT policyname, roles FROM pg_policies WHERE tablename = 't' ORDER BY policyname
    expect: rows
    order: ordered
    comment: CURRENT_USER and CURRENT_ROLE store the owner name, explicit names keep their listed order
  - sql: |
      DROP TABLE t; DROP ROLE pgarbor_case_cp_other, pgarbor_case_cp_own
    expect: ok
