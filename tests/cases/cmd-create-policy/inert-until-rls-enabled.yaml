# A policy has no effect until row-level security is enabled on the table.
id: cmd-create-policy.inert-until-rls-enabled
title: "Created policy is ignored until ALTER TABLE ENABLE ROW LEVEL SECURITY"
family: cmd-create-policy
tier: core
feature_ids: [create-policy, policies, rls, select]
required_capabilities: [create-table, insert, select, rls, roles]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_policy.sgml#sql-createpolicy (Description)"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_cp_inert;
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (1, 5), (2, -1);
  GRANT SELECT ON t TO pgarbor_case_cp_inert;
  CREATE POLICY p ON t TO pgarbor_case_cp_inert USING (v > 0);
steps:
  - sql: |
      SET ROLE pgarbor_case_cp_inert
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: row-level security is off, so the policy is not applied and both rows are returned
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      ALTER TABLE t ENABLE ROW LEVEL SECURITY
    expect: ok
  - sql: |
      SET ROLE pgarbor_case_cp_inert
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: now only the row passing USING is visible
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP TABLE t; DROP ROLE pgarbor_case_cp_inert
    expect: ok
