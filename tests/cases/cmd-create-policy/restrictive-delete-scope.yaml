# A RESTRICTIVE policy narrows the rows a DELETE may remove on top of the permissive policies.
id: cmd-create-policy.restrictive-delete-scope
title: "RESTRICTIVE DELETE policy keeps rows the permissive policy would allow to be deleted"
family: cmd-create-policy
tier: core
feature_ids: [create-policy, policies, delete, restrictive-policies]
required_capabilities: [create-table, insert, select, delete, rls, roles]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_policy.sgml#sql-createpolicy (Parameters: RESTRICTIVE; Per-Command Policies: DELETE)"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_cp_rd;
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (1, 5), (2, 0), (3, -5);
  GRANT ALL ON t TO pgarbor_case_cp_rd;
  ALTER TABLE t ENABLE ROW LEVEL SECURITY;
  CREATE POLICY p_all ON t FOR ALL TO pgarbor_case_cp_rd USING (true) WITH CHECK (true);
  CREATE POLICY r_del ON t AS RESTRICTIVE FOR DELETE TO pgarbor_case_cp_rd USING (v <> 0);
steps:
  - sql: |
      SET ROLE pgarbor_case_cp_rd
    expect: ok
  - sql: |
      DELETE FROM t WHERE true
    expect: ok
    comment: rows 1 and 3 pass both the permissive and restrictive expressions, row 2 fails the restrictive one
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      DROP TABLE t; DROP ROLE pgarbor_case_cp_rd
    expect: ok
