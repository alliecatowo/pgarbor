# Read Committed MERGE: after a concurrent update, the WHEN conditions are re-evaluated from the first action, so a later action can fire.
id: doc-transaction-iso.rc-merge-requalifies-action-conditions
title: MERGE re-evaluates WHEN MATCHED conditions on the updated row and chooses a later action
family: doc-transaction-iso
tier: extended
feature_ids: [transactions, read-committed, merge, update, delete]
required_capabilities: [create-table, insert, select, update, delete, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#xact-read-committed"
sessions: [a, b]
setup: |
  CREATE TABLE doc_mq (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO doc_mq VALUES (1, 5);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      UPDATE doc_mq SET v = 20 WHERE id = 1
    expect: ok
  - session: b
    sql: |
      MERGE INTO doc_mq t USING (VALUES (1, 0)) AS s (id, v) ON t.id = s.id WHEN MATCHED AND t.v < 10 THEN UPDATE SET v = t.v + 1 WHEN MATCHED THEN DELETE
    async: true
    expect_blocked: true
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: ok
    comment: the first action no longer matches (v is 20), so the DELETE action runs
  - session: b
    sql: |
      SELECT id, v FROM doc_mq ORDER BY id
    expect: rows
    order: ordered
