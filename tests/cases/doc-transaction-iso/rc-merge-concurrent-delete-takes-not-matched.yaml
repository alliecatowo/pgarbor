# Read Committed MERGE: when the matched target row is concurrently deleted, MERGE evaluates NOT MATCHED BY TARGET actions.
id: doc-transaction-iso.rc-merge-concurrent-delete-takes-not-matched
title: MERGE falls back to NOT MATCHED insert when the target row was concurrently deleted
family: doc-transaction-iso
tier: extended
feature_ids: [transactions, read-committed, merge, insert, delete]
required_capabilities: [create-table, insert, select, delete, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#xact-read-committed"
sessions: [a, b]
setup: |
  CREATE TABLE doc_mt (id int4 PRIMARY KEY, v int4 NOT NULL);
  CREATE TABLE doc_ms (id int4 NOT NULL, v int4 NOT NULL);
  INSERT INTO doc_mt VALUES (1, 5), (2, 6);
  INSERT INTO doc_ms VALUES (1, 50), (3, 70);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      DELETE FROM doc_mt WHERE id = 1
    expect: ok
  - session: b
    sql: |
      MERGE INTO doc_mt t USING doc_ms s ON t.id = s.id WHEN MATCHED THEN UPDATE SET v = s.v WHEN NOT MATCHED THEN INSERT (id, v) VALUES (s.id, s.v)
    async: true
    expect_blocked: true
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM doc_mt ORDER BY id
    expect: rows
    order: ordered
    comment: id 1 is re-inserted from the source with v 50
