# Read Committed: a transaction sees its own uncommitted writes; a concurrent session does not.
id: doc-transaction-iso.rc-own-writes-visible-only-to-self
title: Uncommitted writes are visible to their own transaction and invisible to others
family: doc-transaction-iso
tier: core
feature_ids: [transactions, read-committed, insert, update]
required_capabilities: [create-table, insert, select, update, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#xact-read-committed"
sessions: [a, b]
setup: |
  CREATE TABLE doc_own (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO doc_own VALUES (1, 10);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      UPDATE doc_own SET v = v + 5 WHERE id = 1; INSERT INTO doc_own VALUES (2, 99)
    expect: ok
  - session: a
    sql: |
      SELECT id, v FROM doc_own ORDER BY id
    expect: rows
    order: ordered
    comment: a sees its own update and insert
  - session: b
    sql: |
      SELECT id, v FROM doc_own ORDER BY id
    expect: rows
    order: ordered
    comment: b sees neither uncommitted change
  - session: a
    sql: |
      ROLLBACK
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM doc_own ORDER BY id
    expect: rows
    order: ordered
    comment: rollback discards both changes
