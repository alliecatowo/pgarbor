# Repeatable Read: if the first updater rolls back, the waiting repeatable read transaction proceeds with the originally found row.
id: doc-transaction-iso.rr-first-updater-rollback-lets-waiter-proceed
title: REPEATABLE READ waiter updates the original row after the first updater rolls back
family: doc-transaction-iso
tier: core
feature_ids: [transactions, repeatable-read, update, row-locks]
required_capabilities: [create-table, insert, select, update, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#xact-repeatable-read"
sessions: [a, b]
setup: |
  CREATE TABLE doc_rrr (k int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO doc_rrr VALUES (1, 100);
steps:
  - session: a
    sql: |
      BEGIN ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - session: a
    sql: |
      SELECT v FROM doc_rrr WHERE k = 1
    expect: rows
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      UPDATE doc_rrr SET v = v + 1 WHERE k = 1
    expect: ok
  - session: a
    sql: |
      UPDATE doc_rrr SET v = v + 10 WHERE k = 1
    async: true
    expect_blocked: true
  - session: b
    sql: |
      ROLLBACK
    expect: ok
  - session: a
    wait: true
    expect: ok
    comment: the originally found row (100) is updated to 110
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: a
    sql: |
      SELECT k, v FROM doc_rrr ORDER BY k
    expect: rows
    order: ordered
