# The default level is READ COMMITTED; SET TRANSACTION ISOLATION LEVEL is refused after the first query of a transaction.
id: doc-transaction-iso.set-transaction-isolation-timing-and-default
title: Default isolation is READ COMMITTED and SET TRANSACTION must precede the first query
family: doc-transaction-iso
tier: core
feature_ids: [transactions, read-committed, repeatable-read, guc, errors]
required_capabilities: [transactions, select, catalog, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#transaction-iso"
sessions: [a]
steps:
  - sql: |
      SHOW default_transaction_isolation
    expect: rows
    comment: read committed
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1
    expect: rows
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: error
    sqlstate: "25001"
    comment: must be called before any query
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - sql: |
      SHOW transaction_isolation
    expect: rows
    comment: repeatable read
  - sql: |
      COMMIT
    expect: ok
