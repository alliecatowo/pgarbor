# Repeatable Read: the snapshot is fixed at the first statement, so later SELECTs ignore concurrent commits.
id: doc-transaction-iso.rr-snapshot-stable-across-statements
title: REPEATABLE READ keeps the same snapshot for every SELECT in the transaction
family: doc-transaction-iso
tier: core
feature_ids: [transactions, repeatable-read, select, update, insert]
required_capabilities: [create-table, insert, select, update, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#xact-repeatable-read"
sessions: [a, b]
setup: |
  CREATE TABLE doc_rr (id int4 PRIMARY KEY, v text NOT NULL);
  INSERT INTO doc_rr VALUES (1, 'a');
steps:
  - session: b
    sql: |
      BEGIN ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM doc_rr ORDER BY id
    expect: rows
    order: ordered
  - session: a
    sql: |
      UPDATE doc_rr SET v = 'b' WHERE id = 1; INSERT INTO doc_rr VALUES (2, 'new')
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM doc_rr ORDER BY id
    expect: rows
    order: ordered
    comment: same rows as the first SELECT, no phantom row 2
  - session: b
    sql: |
      SELECT count(*) FROM doc_rr
    expect: rows
  - session: b
    sql: |
      COMMIT
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM doc_rr ORDER BY id
    expect: rows
    order: ordered
    comment: a new transaction sees the committed changes
