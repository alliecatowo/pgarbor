# Repeatable Read: updating a row changed by a concurrent transaction that committed after this transaction began raises 40001.
id: doc-transaction-iso.rr-concurrent-committed-update-raises-40001
title: REPEATABLE READ waiting UPDATE fails with serialization failure when the first updater commits
family: doc-transaction-iso
tier: core
feature_ids: [transactions, repeatable-read, update, errors]
required_capabilities: [create-table, insert, select, update, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#xact-repeatable-read"
sessions: [a, b]
setup: |
  CREATE TABLE doc_rrc (k int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO doc_rrc VALUES (1, 100);
steps:
  - session: a
    sql: |
      BEGIN ISOLATION LEVEL REPEATABLE READ
    expect: ok
  - session: a
    sql: |
      SELECT v FROM doc_rrc WHERE k = 1
    expect: rows
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      UPDATE doc_rrc SET v = v + 1 WHERE k = 1
    expect: ok
  - session: a
    sql: |
      UPDATE doc_rrc SET v = v + 10 WHERE k = 1
    async: true
    expect_blocked: true
  - session: b
    sql: |
      COMMIT
    expect: ok
  - session: a
    wait: true
    expect: error
    sqlstate: "40001"
    comment: could not serialize access due to concurrent update
  - session: a
    sql: |
      ROLLBACK
    expect: ok
  - session: a
    sql: |
      SELECT k, v FROM doc_rrc ORDER BY k
    expect: rows
    order: ordered
    comment: only b's update survives
