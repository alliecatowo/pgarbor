# Documented example: a view column default is substituted for INSERT into the view; the base table default is not used for that column.
id: cmd-alter-view.doc-example-set-default
title: "ALTER VIEW SET DEFAULT on an updatable view supplies the default for inserts through the view"
family: cmd-alter-view
tier: core
feature_ids: [alter-view, default-values, updatable-views]
required_capabilities: [create-table, insert, select, create-view, alter-view]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_view.sgml#sql-alterview (SET/DROP DEFAULT; Examples: attach a default column value to an updatable view)"
sessions: [a]
setup: |
  CREATE TABLE av_base_table (id int, ts timestamptz);
  CREATE VIEW av_a_view AS SELECT * FROM av_base_table;
steps:
  - sql: |
      ALTER VIEW av_a_view ALTER COLUMN ts SET DEFAULT now()
    expect: ok
  - sql: |
      INSERT INTO av_base_table(id) VALUES(1)
    expect: ok
    comment: a direct insert into the base table gets no value for ts
  - sql: |
      INSERT INTO av_a_view(id) VALUES(2)
    expect: ok
    comment: the view default fills ts
  - sql: |
      SELECT id, ts IS NULL AS ts_null FROM av_base_table ORDER BY id
    expect: rows
    order: ordered
    comment: row 1 has NULL ts; row 2 has a non-NULL timestamp (its value is not projected, so the result is deterministic)
