# RENAME TO an existing relation name fails with duplicate_table and leaves both views unchanged.
id: cmd-alter-view.rename-to-existing-view
title: "ALTER VIEW RENAME TO an existing view name fails with duplicate table"
family: cmd-alter-view
tier: core
feature_ids: [alter-view, rename, error-handling]
required_capabilities: [create-table, select, create-view, alter-view, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_view.sgml#sql-alterview (RENAME TO new_name)"
sessions: [a]
setup: |
  CREATE TABLE av_rn (id int4);
  CREATE VIEW av_rn_a AS SELECT id FROM av_rn;
  CREATE VIEW av_rn_b AS SELECT id FROM av_rn;
steps:
  - sql: |
      ALTER VIEW av_rn_a RENAME TO av_rn_b
    expect: error
    sqlstate: "42P07"
  - sql: |
      SELECT viewname FROM pg_views WHERE viewname LIKE 'av_rn_%' ORDER BY 1
    expect: rows
    order: ordered
