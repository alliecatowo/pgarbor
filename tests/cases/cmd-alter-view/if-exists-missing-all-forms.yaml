# IF EXISTS applies to every ALTER VIEW form: each form on a missing view is a notice and a no-op.
id: cmd-alter-view.if-exists-missing-all-forms
title: "ALTER VIEW IF EXISTS on a missing view is a no-op for every synopsis form"
family: cmd-alter-view
tier: core
feature_ids: [alter-view, if-exists, error-handling]
required_capabilities: [create-table, select, create-view, alter-view, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_view.sgml#sql-alterview (IF EXISTS: a notice is issued instead of an error)"
sessions: [a]
setup: |
  CREATE TABLE av_ie (id int4, a int4, c int4);
steps:
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing ALTER COLUMN c SET DEFAULT 1
    expect: ok
    comment: NOTICE view does not exist, skipping
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing ALTER c DROP DEFAULT
    expect: ok
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing OWNER TO CURRENT_USER
    expect: ok
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing RENAME COLUMN a TO b
    expect: ok
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing RENAME TO av_ie_other
    expect: ok
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing SET SCHEMA public
    expect: ok
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing SET (check_option = local)
    expect: ok
  - sql: |
      ALTER VIEW IF EXISTS av_ie_missing RESET (check_option)
    expect: ok
  - sql: |
      SELECT viewname FROM pg_views WHERE viewname LIKE 'av_ie%' ORDER BY 1
    expect: rows
    order: ordered
    comment: no view was created or renamed
