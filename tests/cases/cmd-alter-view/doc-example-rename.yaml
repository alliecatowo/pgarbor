# Documented example: ALTER VIEW foo RENAME TO bar; data is served under the new name and the old name is gone.
id: cmd-alter-view.doc-example-rename
title: "ALTER VIEW RENAME TO runs the documented foo-to-bar example"
family: cmd-alter-view
tier: core
feature_ids: [alter-view, rename]
required_capabilities: [create-table, insert, select, create-view, alter-view, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_view.sgml#sql-alterview (Examples: rename foo to bar)"
sessions: [a]
setup: |
  CREATE TABLE av_foo_base (id int4 PRIMARY KEY, val int4 NOT NULL);
  INSERT INTO av_foo_base VALUES (1, 10), (2, 20);
  CREATE VIEW av_foo AS SELECT id, val FROM av_foo_base;
steps:
  - sql: |
      ALTER VIEW av_foo RENAME TO av_bar
    expect: ok
  - sql: |
      SELECT viewname FROM pg_views WHERE viewname IN ('av_foo', 'av_bar') ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT id, val FROM av_bar ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM av_foo
    expect: error
    sqlstate: "42P01"
    comment: the old name no longer resolves
