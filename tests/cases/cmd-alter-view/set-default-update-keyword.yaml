# UPDATE ... SET c = DEFAULT through a view uses the view's default, like INSERT does.
id: cmd-alter-view.set-default-update-keyword
title: "UPDATE SET col = DEFAULT through a view uses the view column default"
family: cmd-alter-view
tier: core
feature_ids: [alter-view, default-values, update]
required_capabilities: [create-table, insert, update, select, create-view, alter-view]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_view.sgml#sql-alterview (SET DEFAULT: substituted into any INSERT or UPDATE command whose target is the view)"
sessions: [a]
setup: |
  CREATE TABLE av_ud (id int4, c int4 DEFAULT 1);
  INSERT INTO av_ud VALUES (1, 5), (2, 6);
  CREATE VIEW av_udv AS SELECT id, c FROM av_ud;
steps:
  - sql: |
      ALTER VIEW av_udv ALTER COLUMN c SET DEFAULT 30
    expect: ok
  - sql: |
      UPDATE av_udv SET c = DEFAULT WHERE id = 1
    expect: ok
    comment: UPDATE through the view substitutes the view default 30
  - sql: |
      SELECT id, c FROM av_ud ORDER BY id
    expect: rows
    order: ordered
