# ALTER VIEW only targets views: pointing it at a table is wrong_object_type (42809) and the table is untouched.
id: cmd-alter-view.alter-view-on-table
title: "ALTER VIEW on a table fails with wrong object type and leaves the table unchanged"
family: cmd-alter-view
tier: core
feature_ids: [alter-view, error-handling]
required_capabilities: [create-table, insert, select, alter-view]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_view.sgml#sql-alterview (synopsis: ALTER VIEW name ...)"
sessions: [a]
setup: |
  CREATE TABLE av_tt (id int4, c int4 DEFAULT 1);
  INSERT INTO av_tt VALUES (1, 1);
steps:
  - sql: |
      ALTER VIEW av_tt RENAME TO av_tt2
    expect: error
    sqlstate: "42809"
  - sql: |
      ALTER VIEW av_tt SET (security_barrier = true)
    expect: error
    sqlstate: "42809"
  - sql: |
      SELECT id, c FROM av_tt ORDER BY id
    expect: rows
    order: ordered
