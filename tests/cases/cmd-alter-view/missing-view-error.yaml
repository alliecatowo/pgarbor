# Without IF EXISTS, ALTER VIEW on a missing name is undefined_table (42P01) for each form.
id: cmd-alter-view.missing-view-error
title: "ALTER VIEW on a missing view without IF EXISTS fails with undefined table"
family: cmd-alter-view
tier: core
feature_ids: [alter-view, error-handling]
required_capabilities: [select, alter-view]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_view.sgml#sql-alterview (IF EXISTS: do not throw an error if the view does not exist)"
sessions: [a]
steps:
  - sql: |
      ALTER VIEW av_mv_missing RENAME TO av_mv_x
    expect: error
    sqlstate: "42P01"
  - sql: |
      ALTER VIEW av_mv_missing ALTER COLUMN c SET DEFAULT 1
    expect: error
    sqlstate: "42P01"
  - sql: |
      ALTER VIEW av_mv_missing SET (check_option = local)
    expect: error
    sqlstate: "42P01"
