# Nested GROUPING SETS flatten to their leaf sets; empty sets inside nests still produce one row each.
id: groupingsets.nested-empty-sets
title: Nested grouping sets flatten and each empty set yields one total row
family: groupingsets
tier: extended
feature_ids: [grouping-sets, aggregates, nested-grouping-sets]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (nesting with grouping sets)"
sessions: [a]
setup: |
  CREATE TABLE gs2 (a integer, b integer, c integer);
  INSERT INTO gs2 VALUES (1,1,1),(1,1,2),(1,2,4),(2,2,8);
steps:
  - sql: |
      SELECT sum(c) FROM gs2 GROUP BY GROUPING SETS ((), GROUPING SETS ((), GROUPING SETS (())))
      ORDER BY 1 DESC
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b, sum(c) FROM gs2 GROUP BY GROUPING SETS (GROUPING SETS ((a, b)))
      ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, sum(c) FROM gs2 GROUP BY GROUPING SETS (a, GROUPING SETS (a, CUBE (b)))
      ORDER BY a, 2
    expect: rows
    order: ordered
