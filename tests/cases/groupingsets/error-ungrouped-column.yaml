# A select-list column that is neither grouped nor aggregated is rejected at parse analysis.
id: groupingsets.error-ungrouped-column
title: Ungrouped column under ROLLUP is rejected with grouping error
family: groupingsets
tier: core
feature_ids: [grouping-sets, rollup, errors, aggregates]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, aggregates]
provenance:
  source: hand
  ref: "PG18 errcodes 42803 grouping_error; regress groupingsets.sql error-path style"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
  INSERT INTO gstest1 VALUES (1,1,10),(1,2,12);
steps:
  - sql: |
      SELECT a, b, sum(v) FROM gstest1 GROUP BY ROLLUP (a)
    expect: error
    sqlstate: "42803"
  - sql: |
      SELECT 1
    expect: rows
    comment: the session stays usable after the error
