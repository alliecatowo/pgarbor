# CUBE over two columns produces every combination of the columns including the grand total.
id: groupingsets.cube-row-count
title: CUBE produces all column subsets including the grand total
family: groupingsets
tier: core
feature_ids: [grouping-sets, cube, grouping-function, aggregates]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (cube(a,b) over gstest1)"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
  INSERT INTO gstest1 VALUES (1,1,10),(1,1,11),(1,2,12),(1,2,13),(1,3,14),(2,3,15),(3,3,16),(3,4,17),(4,1,18),(4,1,19);
steps:
  - sql: |
      SELECT a, b, grouping(a,b) AS g, sum(v), count(*)
        FROM gstest1 GROUP BY CUBE (a,b)
    expect: rows
    order: multiset
  - sql: |
      SELECT grouping(a) AS ga, grouping(b) AS gb, count(*)
        FROM gstest1 GROUP BY CUBE (a,b)
    expect: rows
    order: multiset
