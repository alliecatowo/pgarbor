# ROLLUP with grouping() bitmask and plain aggregates; ordered and unordered reads.
id: groupingsets.rollup-basic
title: ROLLUP over two columns with grouping bitmask and plain aggregates
family: groupingsets
tier: slice
feature_ids: [grouping-sets, rollup, grouping-function, aggregates, group-by]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (simple rollup with multiple plain aggregates)"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
  INSERT INTO gstest1 VALUES (1,1,10),(1,1,11),(1,2,12),(1,2,13),(1,3,14),(2,3,15),(3,3,16),(3,4,17),(4,1,18),(4,1,19);
steps:
  - sql: |
      SELECT a, b, grouping(a,b), sum(v), count(*), max(v)
        FROM gstest1 GROUP BY ROLLUP (a,b)
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b, grouping(a,b), sum(v), count(*), max(v)
        FROM gstest1 GROUP BY ROLLUP (a,b) ORDER BY a, b
    expect: rows
    order: ordered
