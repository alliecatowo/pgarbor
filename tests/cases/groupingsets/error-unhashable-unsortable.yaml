# GROUP BY needs a hash or sort strategy for every key; a bit key that is sort-only plus an xid key that is hash-only cannot be implemented.
id: groupingsets.error-unhashable-unsortable
title: ROLLUP with keys that are neither all hashable nor all sortable is rejected
family: groupingsets
tier: extended
feature_ids: [grouping-sets, rollup, errors, group-by, hashing]
required_capabilities: [create-table, insert, select, group-by, grouping-sets]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql line 1274 could not implement GROUP BY"
sessions: [a]
setup: |
  CREATE TABLE gs4 (id integer, v integer, unhashable_col bit(4), unsortable_col xid);
  INSERT INTO gs4 VALUES (1,1,B'0000','1'),(2,2,B'0001','1');
steps:
  - sql: |
      SELECT count(*) FROM gs4 GROUP BY ROLLUP (unhashable_col, unsortable_col)
    expect: error
    sqlstate: "0A000"
