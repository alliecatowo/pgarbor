# Repeated grouping sets are not merged: each copy emits its own rows.
id: groupingsets.duplicate-grouping-sets
title: Duplicate grouping sets emit duplicate groups
family: groupingsets
tier: extended
feature_ids: [grouping-sets, aggregates, duplicates]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (grouping sets with repeated and nested sets)"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
  INSERT INTO gstest1 VALUES (1,1,10),(1,1,11),(1,2,12),(1,2,13),(1,3,14),(2,3,15),(3,3,16),(3,4,17),(4,1,18),(4,1,19);
steps:
  - sql: |
      SELECT a, count(*) FROM gstest1 GROUP BY GROUPING SETS ((a), (a))
    expect: rows
    order: multiset
  - sql: |
      SELECT a, count(*) FROM gstest1 GROUP BY GROUPING SETS (a, GROUPING SETS (a))
    expect: rows
    order: multiset
