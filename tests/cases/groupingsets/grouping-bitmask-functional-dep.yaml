# Columns functionally dependent on a primary key in the group are not nulled; grouping() gives the bitmask per set.
id: groupingsets.grouping-bitmask-functional-dep
title: GROUPING bitmask with a column functionally dependent on the primary key
family: groupingsets
tier: extended
feature_ids: [grouping-sets, grouping-function, primary-key, functional-dependency]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, primary-key]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (check that functionally dependent cols are not nulled)"
sessions: [a]
setup: |
  CREATE TABLE gs3 (a integer PRIMARY KEY, b integer, c integer, d integer);
  INSERT INTO gs3 VALUES (1,1,1,1),(2,2,2,2);
steps:
  - sql: |
      SELECT a, d, grouping(a,b,c) AS g
        FROM gs3 GROUP BY GROUPING SETS ((a,b), (a,c))
        ORDER BY a, g
    expect: rows
    order: ordered
