# Empty input: only the empty grouping set yields a row, so the number of result rows depends on the sets.
id: groupingsets.empty-input-grouping-sets
title: Empty input yields rows only for the empty grouping set
family: groupingsets
tier: core
feature_ids: [grouping-sets, aggregates, empty-input]
required_capabilities: [create-table, select, group-by, grouping-sets, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (empty input: first is 0 rows, second 1)"
sessions: [a]
setup: |
  CREATE TABLE gstest_empty (a integer, b integer, v integer);
steps:
  - sql: |
      SELECT a, b, sum(v), count(*) FROM gstest_empty GROUP BY GROUPING SETS ((a,b), a)
    expect: rows
    order: multiset
    comment: no empty grouping set, so no rows at all
  - sql: |
      SELECT a, b, sum(v), count(*) FROM gstest_empty GROUP BY GROUPING SETS ((a,b), ())
    expect: rows
    order: multiset
    comment: the empty set produces exactly one row
  - sql: |
      SELECT sum(v), count(*) FROM gstest_empty GROUP BY GROUPING SETS ((), (), ())
    expect: rows
    order: multiset
    comment: three identical empty sets produce three rows
