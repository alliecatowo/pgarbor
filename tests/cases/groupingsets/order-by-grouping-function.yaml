# ORDER BY may use the GROUPING() bitmask to put subtotal rows before or after detail rows.
id: groupingsets.order-by-grouping-function
title: ORDER BY on GROUPING bitmask orders rollup levels
family: groupingsets
tier: core
feature_ids: [grouping-sets, rollup, grouping-function, order-by]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, order-by, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (ordering differing from grouping, order by b desc, a)"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
  INSERT INTO gstest1 VALUES (1,1,10),(1,1,11),(1,2,12),(2,3,15),(4,1,18);
steps:
  - sql: |
      SELECT a, b, grouping(a,b) AS g, sum(v)
        FROM gstest1 GROUP BY ROLLUP (a,b)
        ORDER BY grouping(a,b) DESC, a, b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b, grouping(a,b) AS g, sum(v)
        FROM gstest1 GROUP BY ROLLUP (a,b)
        ORDER BY b DESC, a
    expect: rows
    order: ordered
