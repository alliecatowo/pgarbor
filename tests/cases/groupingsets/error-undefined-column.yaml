# Unknown column inside a grouping set is an undefined-column error.
id: groupingsets.error-undefined-column
title: Unknown column in GROUPING SETS is rejected with undefined column
family: groupingsets
tier: core
feature_ids: [grouping-sets, errors, catalog-names]
required_capabilities: [create-table, select, group-by, grouping-sets]
provenance:
  source: hand
  ref: "PG18 errcodes 42703 undefined_column"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
steps:
  - sql: |
      SELECT a, sum(v) FROM gstest1 GROUP BY GROUPING SETS ((a), (nosuch))
    expect: error
    sqlstate: "42703"
