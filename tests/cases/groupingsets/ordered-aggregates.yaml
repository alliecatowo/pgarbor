# Ordered-set and ordered aggregates evaluate per grouping set with their own ORDER BY.
id: groupingsets.ordered-aggregates
title: Ordered aggregates and percentile inside ROLLUP
family: groupingsets
tier: extended
feature_ids: [grouping-sets, rollup, aggregates, order-by-aggregate, ordered-set-aggregate]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (various types of ordered aggs)"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
  INSERT INTO gstest1 VALUES (1,1,10),(1,1,11),(1,2,12),(1,2,13),(1,3,14),(2,3,15),(3,3,16),(3,4,17),(4,1,18),(4,1,19);
steps:
  - sql: |
      SELECT a, b, grouping(a,b),
             array_agg(v ORDER BY v),
             string_agg(v::text, ':' ORDER BY v DESC),
             percentile_disc(0.5) WITHIN GROUP (ORDER BY v)
        FROM gstest1 GROUP BY ROLLUP (a,b) ORDER BY a, b
    expect: rows
    order: ordered
