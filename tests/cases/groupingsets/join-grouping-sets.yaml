# Grouping sets over a join: grouping() applies to join output columns from both inputs.
id: groupingsets.join-grouping-sets
title: Grouping sets over an inner join with GROUPING on joined columns
family: groupingsets
tier: core
feature_ids: [grouping-sets, joins, grouping-function, aggregates]
required_capabilities: [create-table, insert, select, group-by, grouping-sets, joins, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql (simple joins, var resolution, GROUPING on join vars)"
sessions: [a]
setup: |
  CREATE TABLE gstest1 (a integer, b integer, v integer);
  INSERT INTO gstest1 VALUES (1,1,10),(1,2,12),(2,3,15),(4,1,18);
  CREATE TABLE gs2 (a integer, b integer);
  INSERT INTO gs2 VALUES (1,1),(1,2),(2,3),(5,5);
steps:
  - sql: |
      SELECT t1.a, t2.b, grouping(t1.a, t2.b) AS g, sum(t1.v), max(t2.a)
        FROM gstest1 t1 JOIN gs2 t2 ON (t1.a = t2.a)
        GROUP BY GROUPING SETS ((t1.a, t2.b), ())
    expect: rows
    order: multiset
