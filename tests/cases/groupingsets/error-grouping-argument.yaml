# GROUPING arguments must be grouping expressions of the same query level.
id: groupingsets.error-grouping-argument
title: GROUPING argument that is not a grouping expression is rejected
family: groupingsets
tier: core
feature_ids: [grouping-sets, grouping-function, errors]
required_capabilities: [create-table, insert, select, group-by, grouping-sets]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/groupingsets.sql line 880 arguments to GROUPING must be grouping expressions"
sessions: [a]
setup: |
  CREATE TABLE gstest2 (a integer, b integer, c integer);
  INSERT INTO gstest2 VALUES (1,1,1),(1,2,2);
steps:
  - sql: |
      SELECT a, grouping(a, c) FROM gstest2 GROUP BY ROLLUP (a, b)
    expect: error
    sqlstate: "42803"
