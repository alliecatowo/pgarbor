# Default B-tree ordering is ASC NULLS LAST; DESC defaults to NULLS FIRST. Index on x, ties broken by id.
id: doc-indexes-ordering.asc-default-nulls-last
title: B-tree index default order is ascending with nulls last, descending with nulls first
family: doc-indexes-ordering
tier: core
feature_ids: [btree-index, order-by, nulls-ordering, create-index]
required_capabilities: [create-table, insert, select, order-by, create-index, btree-index, nulls]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (B-tree entries stored ascending with nulls last)"
sessions: [a]
setup: |
  CREATE TABLE t1 (id int4 PRIMARY KEY, x int4);
  CREATE INDEX t1_x ON t1 (x);
  INSERT INTO t1 VALUES (1, 30), (2, NULL), (3, 10), (4, 20), (5, NULL);
steps:
  - sql: |
      SELECT id, x FROM t1 ORDER BY x, id
    expect: rows
    order: ordered
    comment: the forward index scan result, ORDER BY x ASC NULLS LAST
  - sql: |
      SELECT id, x FROM t1 ORDER BY x ASC NULLS LAST, id
    expect: rows
    order: ordered
    comment: spelling out the default must give the same rows
  - sql: |
      SELECT id, x FROM t1 ORDER BY x DESC, id
    expect: rows
    order: ordered
    comment: DESC defaults to NULLS FIRST, the backward index scan
  - sql: |
      SELECT id, x FROM t1 ORDER BY x DESC NULLS LAST, id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, x FROM t1 ORDER BY x ASC NULLS FIRST, id
    expect: rows
    order: ordered
