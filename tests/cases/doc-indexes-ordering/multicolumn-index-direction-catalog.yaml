# Per-column direction in a multicolumn index is stored per key column in pg_index.indoption.
id: doc-indexes-ordering.multicolumn-index-direction-catalog
title: Per-column sort direction of a multicolumn index is recorded per key column
family: doc-indexes-ordering
tier: core
feature_ids: [btree-index, multicolumn-index, create-index, catalog]
required_capabilities: [create-table, create-index, btree-index, multi-column-index, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (options may differ per column of a multicolumn index)"
sessions: [a]
setup: |
  CREATE TABLE m3 (x int4, y int4);
  CREATE INDEX m3_a ON m3 (x ASC, y DESC);
  CREATE INDEX m3_b ON m3 (x DESC, y ASC);
  CREATE INDEX m3_c ON m3 (x, y);
steps:
  - sql: |
      SELECT c.relname, x.indnkeyatts, x.indoption::text AS indoption
      FROM pg_index x JOIN pg_class c ON c.oid = x.indexrelid
      WHERE x.indrelid = 'm3'::regclass
      ORDER BY c.relname
    expect: rows
    order: ordered
    comment: one indoption entry per key column
