# In a multicolumn unique index, a row conflicts only when all indexed columns are equal.
id: doc-indexes-ordering.unique-nulls-not-distinct-multicolumn
title: Multicolumn NULLS NOT DISTINCT unique index rejects only fully equal key tuples
family: doc-indexes-ordering
tier: core
feature_ids: [unique-index, nulls-not-distinct, multicolumn-index, create-index]
required_capabilities: [create-table, insert, select, order-by, create-index, unique-index, multi-column-index, nulls-not-distinct]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (a multicolumn unique index only rejects cases where all indexed columns are equal)"
sessions: [a]
setup: |
  CREATE TABLE tu (a int4, b int4);
  CREATE UNIQUE INDEX tu_nnd ON tu (a, b) NULLS NOT DISTINCT;
steps:
  - sql: |
      INSERT INTO tu VALUES (NULL, 1), (NULL, 2)
    expect: ok
    comment: the first column is NULL in both rows but the second differs, so no conflict
  - sql: |
      INSERT INTO tu VALUES (NULL, 1)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO tu VALUES (1, NULL)
    expect: ok
  - sql: |
      INSERT INTO tu VALUES (1, NULL)
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT a, b FROM tu ORDER BY a NULLS LAST, b NULLS LAST
    expect: rows
    order: ordered
