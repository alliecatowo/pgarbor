# Each ordering option is stored in pg_index.indoption. Plain index is the default; options are only visible via the catalog.
id: doc-indexes-ordering.indoption-catalog-flags
title: ASC, DESC and NULLS FIRST/LAST index options are recorded in pg_index.indoption
family: doc-indexes-ordering
tier: core
feature_ids: [btree-index, create-index, index-ordering-options, catalog]
required_capabilities: [create-table, create-index, btree-index, catalog-introspection, select, order-by]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (options ASC, DESC, NULLS FIRST, NULLS LAST at CREATE INDEX)"
sessions: [a]
setup: |
  CREATE TABLE t2 (id int4, info int4, x int4, y int4);
  CREATE INDEX t2_plain ON t2 (info);
  CREATE INDEX t2_asc_nl ON t2 (x ASC NULLS LAST);
  CREATE INDEX t2_asc_nf ON t2 (x ASC NULLS FIRST);
  CREATE INDEX t2_desc_nl ON t2 (y DESC NULLS LAST);
  CREATE INDEX t2_desc_nf ON t2 (y DESC NULLS FIRST);
  CREATE INDEX t2_desc_default ON t2 (id DESC);
steps:
  - sql: |
      SELECT c.relname, x.indoption::text AS indoption
      FROM pg_index x JOIN pg_class c ON c.oid = x.indexrelid
      WHERE c.relname LIKE 't2%'
      ORDER BY c.relname
    expect: rows
    order: ordered
    comment: the flags are the only observable record of the options; the same index scanned in either direction satisfies both orders
