# Only B-tree indexes can be unique or take NULLS FIRST/LAST options; hash indexes reject both.
id: doc-indexes-ordering.hash-index-rejects-unique-and-ordering-options
title: Hash index rejects UNIQUE and NULLS FIRST/LAST options but accepts a plain definition
family: doc-indexes-ordering
tier: extended
feature_ids: [hash-index, unique-index, nulls-ordering, create-index]
required_capabilities: [create-table, create-index, hash-index, unique-index, nulls]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (currently, only B-tree indexes can be declared unique)"
sessions: [a]
setup: |
  CREATE TABLE hu (a int4);
steps:
  - sql: |
      CREATE UNIQUE INDEX hu_a_unique ON hu USING hash (a)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE INDEX hu_a_nf ON hu USING hash (a NULLS FIRST)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE INDEX hu_a ON hu USING hash (a)
    expect: ok
