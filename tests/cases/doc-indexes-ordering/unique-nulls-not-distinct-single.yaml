# NULLS NOT DISTINCT makes NULLs equal for uniqueness, so a second NULL is rejected.
id: doc-indexes-ordering.unique-nulls-not-distinct-single
title: NULLS NOT DISTINCT unique index rejects a second NULL
family: doc-indexes-ordering
tier: core
feature_ids: [unique-index, nulls-not-distinct, create-index]
required_capabilities: [create-table, insert, select, create-index, unique-index, nulls-not-distinct]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (CREATE UNIQUE INDEX ... NULLS NOT DISTINCT)"
sessions: [a]
setup: |
  CREATE TABLE u2 (a int4);
  CREATE UNIQUE INDEX u2_a ON u2 (a) NULLS NOT DISTINCT;
steps:
  - sql: |
      INSERT INTO u2 VALUES (NULL)
    expect: ok
  - sql: |
      INSERT INTO u2 VALUES (NULL)
    expect: error
    sqlstate: "23505"
  - sql: |
      INSERT INTO u2 VALUES (7)
    expect: ok
  - sql: |
      SELECT a FROM u2 ORDER BY a NULLS FIRST
    expect: rows
    order: ordered
