# Index types other than B-tree return matching rows in an unspecified order, so only the multiset of rows is compared.
id: doc-indexes-ordering.unordered-hash-index-multiset
title: Hash index lookups return the matching rows without a defined order
family: doc-indexes-ordering
tier: core
feature_ids: [hash-index, select, create-index]
required_capabilities: [create-table, insert, select, create-index, hash-index]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (only B-tree can produce sorted output; other index types are unordered)"
sessions: [a]
setup: |
  CREATE TABLE hs (k int4, v text);
  CREATE INDEX hs_k ON hs USING hash (k);
  INSERT INTO hs VALUES (1, 'a'), (2, 'b'), (3, 'c'), (2, 'd'), (4, 'e');
steps:
  - sql: |
      SELECT k, v FROM hs WHERE k IN (1, 2, 3)
    expect: rows
    order: multiset
    comment: no ORDER BY, so only the set of rows is defined
  - sql: |
      SELECT v FROM hs WHERE k = 2
    expect: rows
    order: multiset
