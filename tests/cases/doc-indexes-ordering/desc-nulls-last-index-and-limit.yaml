# Index (x DESC NULLS LAST) serves ORDER BY x DESC NULLS LAST directly; LIMIT n returns the first n rows of that order.
id: doc-indexes-ordering.desc-nulls-last-index-and-limit
title: DESC NULLS LAST index with ORDER BY and LIMIT returns the top-n rows in documented order
family: doc-indexes-ordering
tier: core
feature_ids: [btree-index, order-by, limit, nulls-ordering, create-index]
required_capabilities: [create-table, insert, select, order-by, limit, create-index, btree-index, nulls]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (test3_desc_index; ORDER BY with LIMIT n)"
sessions: [a]
setup: |
  CREATE TABLE test3 (id int4 PRIMARY KEY, x int4);
  CREATE INDEX test3_desc_index ON test3 (x DESC NULLS LAST);
  INSERT INTO test3 VALUES (1, 4), (2, NULL), (3, 9), (4, 4), (5, NULL), (6, 1), (7, 7);
steps:
  - sql: |
      SELECT id, x FROM test3 ORDER BY x DESC NULLS LAST, id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, x FROM test3 ORDER BY x DESC NULLS LAST, id LIMIT 3
    expect: rows
    order: ordered
    comment: first n rows come from the index without scanning the rest
  - sql: |
      SELECT id, x FROM test3 ORDER BY x, id LIMIT 3
    expect: rows
    order: ordered
    comment: the same index read backward for ascending nulls last
  - sql: |
      SELECT id, x FROM test3 ORDER BY x DESC NULLS LAST, id LIMIT 2 OFFSET 4
    expect: rows
    order: ordered
