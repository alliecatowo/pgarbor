# By default NULLs are not equal in a unique index, so several NULL rows are allowed; equal non-null values are rejected.
id: doc-indexes-ordering.unique-nulls-distinct-default
title: Default unique index accepts repeated NULLs and rejects duplicate non-null values
family: doc-indexes-ordering
tier: core
feature_ids: [unique-index, nulls-distinct, create-index]
required_capabilities: [create-table, insert, select, create-index, unique-index]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-ordering (Unique Indexes; null values are not considered equal by default)"
sessions: [a]
setup: |
  CREATE TABLE u1 (a int4);
  CREATE UNIQUE INDEX u1_a ON u1 (a);
steps:
  - sql: |
      INSERT INTO u1 VALUES (NULL), (NULL), (NULL)
    expect: ok
  - sql: |
      INSERT INTO u1 VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO u1 VALUES (1)
    expect: error
    sqlstate: "23505"
  - sql: |
      SELECT count(*) FROM u1 WHERE a IS NULL
    expect: rows
