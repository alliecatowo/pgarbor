# A VALUES list can be an operand of UNION, INTERSECT and EXCEPT, as the documentation describes.
id: doc-queries-values.set-operations
title: VALUES lists combine with UNION ALL, UNION, INTERSECT and EXCEPT
family: doc-queries-values
tier: core
feature_ids: [values, union, intersect, except]
required_capabilities: [values, select, union]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (VALUES as part of a UNION)"
sessions: [a]
steps:
  - sql: |
      VALUES (1), (2) UNION ALL VALUES (1)
    expect: rows
    order: multiset
    comment: duplicates kept
  - sql: |
      VALUES (1), (2), (1) UNION VALUES (3)
    expect: rows
    order: multiset
    comment: duplicates removed
  - sql: |
      VALUES (1), (2), (3) INTERSECT VALUES (2), (3), (4)
    expect: rows
    order: multiset
  - sql: |
      VALUES (1), (2), (3) EXCEPT VALUES (2)
    expect: rows
    order: multiset
