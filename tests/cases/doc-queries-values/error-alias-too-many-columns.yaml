# A VALUES table alias list may not name more columns than the VALUES expression produces.
id: doc-queries-values.error-alias-too-many-columns
title: Alias list naming more columns than a VALUES table has raises an invalid column reference
family: doc-queries-values
tier: core
feature_ids: [values, column-alias, errors]
required_capabilities: [values, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (table alias list overrides default column names)"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM (VALUES (1, 2)) AS t (a, b, c)
    expect: error
    sqlstate: "42P10"
  - sql: |
      SELECT * FROM (VALUES (1, 2)) AS t (a, b)
    expect: rows
    order: ordered
    comment: a shorter alias list renames the leading columns only
