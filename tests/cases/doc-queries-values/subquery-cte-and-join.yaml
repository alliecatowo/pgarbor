# VALUES can be used as a subquery, in a WITH clause, in an IN predicate and as a join input.
id: doc-queries-values.subquery-cte-and-join
title: VALUES works as a FROM subquery, a WITH common table expression, an IN subquery and a join input
family: doc-queries-values
tier: core
feature_ids: [values, subquery, with, joins, in-subquery]
required_capabilities: [values, select, with, joins]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (VALUES as a subquery; can appear anywhere a SELECT can)"
sessions: [a]
steps:
  - sql: |
      WITH v (a, b) AS (VALUES (1, 'x'), (2, 'y')) SELECT b FROM v WHERE a > 1
    expect: rows
    order: multiset
  - sql: |
      SELECT x FROM (VALUES (1), (2), (3)) AS t (x) WHERE x IN (VALUES (2), (3)) ORDER BY x
    expect: rows
    order: ordered
  - sql: |
      SELECT a.num, a.letter, b.y FROM (VALUES (1, 'one'), (2, 'two')) AS a (num, letter) JOIN (VALUES (2, 'x')) AS b (num, y) USING (num)
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (VALUES (1, 'one')) AS a (num, letter) LEFT JOIN (VALUES (9, 'nine')) AS b (num, word) USING (num)
    expect: rows
    order: ordered
    comment: no matching row on the right, so the right columns are NULL
