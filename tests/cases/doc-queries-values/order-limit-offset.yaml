# A VALUES expression can carry ORDER BY, LIMIT and OFFSET, as the documentation states.
id: doc-queries-values.order-limit-offset
title: VALUES accepts ORDER BY, LIMIT, OFFSET and ORDER BY on its generated column names
family: doc-queries-values
tier: core
feature_ids: [values, order-by, limit, offset]
required_capabilities: [values, select, order-by, limit]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (sort_specification ORDER BY, LIMIT, OFFSET on VALUES)"
sessions: [a]
steps:
  - sql: |
      VALUES (3, 'c'), (1, 'a'), (2, 'b') ORDER BY 1 LIMIT 2 OFFSET 1
    expect: rows
    order: ordered
    comment: sorted by column position 1, skip first row, return two rows
  - sql: |
      VALUES (3, 'c'), (1, 'a'), (2, 'b') ORDER BY column1 DESC LIMIT 1
    expect: rows
    order: ordered
  - sql: |
      VALUES (1, 'one'), (2, 'two') ORDER BY 2 DESC
    expect: rows
    order: ordered
  - sql: |
      VALUES (1, 'one'), (2, 'two') LIMIT 0
    expect: rows
    order: multiset
    comment: LIMIT 0 yields zero rows with the VALUES column shape
