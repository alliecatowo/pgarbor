# The documented VALUES example and its column-alias override: a 3x2 constant table, aliased as t (num, letter).
id: doc-queries-values.documented-three-row-example
title: Documented VALUES table with alias list returns three rows of (num, letter)
family: doc-queries-values
tier: core
feature_ids: [values, table-alias, column-alias]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (VALUES example and table alias list)"
sessions: [a]
steps:
  - sql: |
      VALUES (1, 'one'), (2, 'two'), (3, 'three')
    expect: rows
    order: multiset
    comment: the bare VALUES form documented as a two-column, three-row table
  - sql: |
      SELECT * FROM (VALUES (1, 'one'), (2, 'two'), (3, 'three')) AS t (num, letter) ORDER BY num
    expect: rows
    order: ordered
    comment: the alias list renames column1/column2 to num/letter
