# All VALUES rows must have the same number of elements.
id: doc-queries-values.error-unequal-row-lengths
title: VALUES rows with different element counts raise a syntax error
family: doc-queries-values
tier: core
feature_ids: [values, errors]
required_capabilities: [values, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (lists must all have the same number of elements)"
sessions: [a]
steps:
  - sql: |
      VALUES (1, 2), (3)
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1
    expect: rows
    order: ordered
    comment: session remains usable after the error
