# Default VALUES column names are column1..columnN; other names are not defined.
id: doc-queries-values.error-unknown-column-on-values
title: Referencing a non-existent VALUES column name raises undefined column
family: doc-queries-values
tier: core
feature_ids: [values, errors, column-naming]
required_capabilities: [values, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (default names column1, column2)"
sessions: [a]
steps:
  - sql: |
      SELECT nosuch FROM (VALUES (1)) AS t
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT column2 FROM (VALUES (1)) AS t
    expect: error
    sqlstate: "42703"
    comment: a one-column VALUES has no column2
