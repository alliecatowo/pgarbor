# An unknown-typed literal in a VALUES column is resolved to the other rows' type, so a non-integer string fails input conversion.
id: doc-queries-values.error-invalid-literal-in-column
title: Non-integer string literal in an integer VALUES column raises invalid input syntax
family: doc-queries-values
tier: core
feature_ids: [values, type-resolution, errors]
required_capabilities: [values, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (column type determined by UNION rules)"
sessions: [a]
steps:
  - sql: |
      VALUES (1), ('two')
    expect: error
    sqlstate: "22P02"
