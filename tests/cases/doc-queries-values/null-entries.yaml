# NULL entries in a VALUES list take the column type from the other rows and are ordinary NULLs for aggregates.
id: doc-queries-values.null-entries
title: NULL entries in VALUES are typed from other rows, sort as NULL, and are skipped by count(column)
family: doc-queries-values
tier: core
feature_ids: [values, null-semantics, aggregates]
required_capabilities: [values, select, aggregates, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (VALUES rows of compatible types); NULL semantics per queries.sgml"
sessions: [a]
steps:
  - sql: |
      SELECT column1 FROM (VALUES (1), (NULL), (3)) AS t ORDER BY column1 NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS all_rows, count(column1) AS non_null FROM (VALUES (1), (NULL), (3)) AS t(column1)
    expect: rows
    order: ordered
  - sql: |
      SELECT column1 IS NULL AS is_null FROM (VALUES (NULL::int4), (5)) AS t ORDER BY column1 NULLS LAST
    expect: rows
    order: ordered
