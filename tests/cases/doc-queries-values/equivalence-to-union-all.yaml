# The documented equivalence: VALUES (1,'one'),(2,'two'),(3,'three') returns the same rows as the UNION ALL of SELECTs.
id: doc-queries-values.equivalence-to-union-all
title: VALUES list returns the same rows as the documented UNION ALL of single-row SELECTs
family: doc-queries-values
tier: core
feature_ids: [values, union, union-all]
required_capabilities: [values, select, union]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (equivalent SELECT ... UNION ALL form)"
sessions: [a]
steps:
  - sql: |
      VALUES (1, 'one'), (2, 'two'), (3, 'three')
    expect: rows
    order: multiset
  - sql: |
      SELECT 1 AS column1, 'one' AS column2
      UNION ALL
      SELECT 2, 'two'
      UNION ALL
      SELECT 3, 'three'
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_typeof(column1), pg_typeof(column2) FROM (VALUES (1, 'one')) AS t
    expect: rows
    order: ordered
    comment: integer and text, the same types the UNION ALL form resolves to
