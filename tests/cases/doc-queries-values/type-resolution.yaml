# VALUES column types follow the UNION resolution rules: numeric promotion, unknown literals adopt the other types, all-NULL defaults to text.
id: doc-queries-values.type-resolution
title: VALUES column types are resolved with UNION rules across rows
family: doc-queries-values
tier: core
feature_ids: [values, type-resolution, union-type-rules]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (data type determined by UNION rules, typeconv-union-case)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_typeof(column1) FROM (VALUES (1.5), (2)) AS t ORDER BY column1
    expect: rows
    order: ordered
    comment: integer and numeric promote to numeric
  - sql: |
      SELECT pg_typeof(column1) FROM (VALUES ('1'), (2)) AS t
    expect: rows
    order: multiset
    comment: unknown-typed literal '1' adopts integer from the other row
  - sql: |
      SELECT pg_typeof(column1) FROM (VALUES (NULL), (NULL)) AS t
    expect: rows
    order: multiset
    comment: all-NULL column defaults to text
  - sql: |
      SELECT pg_typeof(column1) FROM (VALUES (1::int2), (2::int8)) AS t
    expect: rows
    order: multiset
    comment: int2 and int8 resolve to bigint
  - sql: |
      SELECT pg_typeof(column1), pg_typeof(column2) FROM (VALUES (1 + 1, 'a' || 'b')) AS t
    expect: rows
    order: ordered
