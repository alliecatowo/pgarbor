# Without an alias list, VALUES columns are named column1, column2, ... and are addressable by those names.
id: doc-queries-values.default-column-names
title: Unaliased VALUES columns are named column1 and column2 and are referenceable by those names
family: doc-queries-values
tier: core
feature_ids: [values, column-naming]
required_capabilities: [values, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-values (default column names column1, column2)"
sessions: [a]
steps:
  - sql: |
      SELECT column1, column2 FROM (VALUES (1, 'one')) AS t
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (VALUES (2, 'two'), (1, 'one')) AS t ORDER BY column1
    expect: rows
    order: ordered
  - sql: |
      SELECT t.column2 FROM (VALUES (1, 'one'), (2, 'two')) AS t WHERE t.column1 = 2
    expect: rows
    order: ordered
