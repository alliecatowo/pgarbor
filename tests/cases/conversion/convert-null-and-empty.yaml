# convert functions are strict: NULL input gives NULL output, and an empty bytea converts to empty text.
id: conversion.convert-null-and-empty
title: NULL and empty inputs to convert, convert_from and convert_to
family: conversion
tier: core
feature_ids: [encoding-conversion, convert-function, null-semantics, bytea]
required_capabilities: [select, bytea]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      SELECT convert(NULL::bytea, 'UTF8', 'LATIN1') IS NULL AS a,
             convert_from(NULL::bytea, 'UTF8') IS NULL AS b,
             convert_to(NULL::text, 'UTF8') IS NULL AS c
    expect: rows
  - sql: |
      SELECT convert_from(''::bytea, 'UTF8') = '' AS empty_text,
             octet_length(convert_to('', 'LATIN1')) AS empty_octets
    expect: rows
