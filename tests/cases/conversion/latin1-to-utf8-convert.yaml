# Single-byte LATIN1 input converts to UTF-8 through the built-in convert(bytea, src, dst) function.
id: conversion.latin1-to-utf8-convert
title: LATIN1 bytes convert to UTF8 via convert(bytea, src, dst)
family: conversion
tier: core
feature_ids: [encoding-conversion, convert-function, bytea, latin1]
required_capabilities: [select, bytea]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      SELECT encode(convert('\x41e9'::bytea, 'LATIN1', 'UTF8'), 'hex') AS h
    expect: rows
  - sql: |
      SELECT encode(convert('\x666f6f'::bytea, 'LATIN1', 'UTF8'), 'hex') AS h_ascii
    expect: rows
    comment: pure ASCII is unchanged by the conversion
  - sql: |
      SELECT encode(convert('\xc3a4'::bytea, 'UTF8', 'LATIN1'), 'hex') AS back
    expect: rows
    comment: UTF8 to LATIN1 for a character that exists in LATIN1
