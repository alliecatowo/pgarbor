# Unknown encoding names in convert() are rejected before any bytes are touched.
id: conversion.unknown-encoding-name
title: convert() with an unknown source or destination encoding name raises 42704
family: conversion
tier: extended
feature_ids: [encoding-conversion, convert-function, error-sqlstate]
required_capabilities: [select, bytea, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      SELECT convert('a'::bytea, 'no_such_encoding', 'UTF8')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT convert('a'::bytea, 'UTF8', 'no_such_encoding')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT convert('a'::bytea, 'UTF8', 'UTF8') AS same_encoding
    expect: rows
