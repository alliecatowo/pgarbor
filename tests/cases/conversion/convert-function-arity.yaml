# convert(bytea, name, name) takes exactly three arguments; calling it with two is an undefined-function error.
id: conversion.convert-function-arity
title: convert with two arguments is not a function signature
family: conversion
tier: extended
feature_ids: [encoding-conversion, convert-function, error-sqlstate]
required_capabilities: [select, bytea, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      SELECT convert('\x41'::bytea, 'UTF8')
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT convert('\x41'::bytea, 'UTF8', 'LATIN1') AS ok_three_args
    expect: rows
