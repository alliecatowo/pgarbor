# Only one default conversion may exist for a given source and destination encoding pair.
id: conversion.default-conversion-duplicate
title: CREATE DEFAULT CONVERSION rejects a second default for the same encoding pair
family: conversion
tier: extended
feature_ids: [create-conversion, default-conversion, encoding-conversion, error-sqlstate]
required_capabilities: [create-conversion, drop-conversion, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      CREATE DEFAULT CONVERSION public.mydef FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8
    expect: ok
  - sql: |
      CREATE DEFAULT CONVERSION public.mydef2 FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8
    expect: error
    sqlstate: "42710"
    comment: a different name still conflicts on the encoding pair
  - sql: |
      DROP CONVERSION public.mydef
    expect: ok
  - sql: |
      CREATE DEFAULT CONVERSION public.mydef2 FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8
    expect: ok
    comment: after the drop the pair is free again
  - sql: |
      DROP CONVERSION public.mydef2
    expect: ok
