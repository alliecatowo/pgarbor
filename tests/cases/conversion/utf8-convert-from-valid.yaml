# Valid UTF-8 bytea decodes to text and text encodes back to bytea via convert_from/convert_to.
id: conversion.utf8-convert-from-valid
title: convert_from and convert_to accept valid UTF-8 multibyte sequences
family: conversion
tier: core
feature_ids: [encoding-conversion, convert-function, bytea, utf8]
required_capabilities: [select, bytea]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      SELECT convert_from('\xc3a4c3b6'::bytea, 'UTF8') AS s,
             char_length(convert_from('\xc3a4c3b6'::bytea, 'UTF8')) AS n
    expect: rows
    comment: valid two-byte characters, pure round trip
  - sql: |
      SELECT convert_from('\x666f6fe8b1a1'::bytea, 'UTF8') AS s,
             octet_length(convert_from('\x666f6fe8b1a1'::bytea, 'UTF8')) AS octets
    expect: rows
    comment: valid three-byte character mixed with ASCII
  - sql: |
      SELECT encode(convert_to('ä ö'::text, 'UTF8'), 'hex') AS h
    expect: rows
