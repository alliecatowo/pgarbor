# A user-defined conversion can be created once per schema; duplicates raise 42710 and DROP removes it.
id: conversion.create-conversion-duplicate
title: CREATE CONVERSION rejects a duplicate name in the same schema
family: conversion
tier: extended
feature_ids: [create-conversion, drop-conversion, encoding-conversion, error-sqlstate]
required_capabilities: [create-conversion, drop-conversion, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      CREATE CONVERSION myconv FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8
    expect: ok
  - sql: |
      CREATE CONVERSION myconv FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8
    expect: error
    sqlstate: "42710"
    comment: same name in the same schema
  - sql: |
      DROP CONVERSION myconv
    expect: ok
  - sql: |
      SELECT count(*) AS remaining FROM pg_conversion WHERE conname = 'myconv'
    expect: rows
