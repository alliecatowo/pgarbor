# A UTF-8 character with no LATIN1 equivalent fails with the untranslatable-character error.
id: conversion.utf8-to-latin1-untranslatable
title: UTF8 to LATIN1 conversion of a character outside LATIN1 raises 22P05
family: conversion
tier: core
feature_ids: [encoding-conversion, convert-function, error-sqlstate]
required_capabilities: [select, bytea, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      SELECT convert('\xe282ac'::bytea, 'UTF8', 'LATIN1')
    expect: error
    sqlstate: "22P05"
    comment: euro sign U+20AC has no LATIN1 mapping
  - sql: |
      SELECT convert('\xd184d0bed0be'::bytea, 'UTF8', 'LATIN1')
    expect: error
    sqlstate: "22P05"
    comment: Cyrillic text has no LATIN1 mapping
  - sql: |
      SELECT convert('\xd184d0bed0be'::bytea, 'UTF8', 'KOI8R') IS NOT NULL AS koi8r_ok
    expect: rows
    comment: the same Cyrillic text is representable in KOI8R
