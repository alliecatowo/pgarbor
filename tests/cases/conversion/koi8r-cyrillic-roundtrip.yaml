# Cyrillic text round-trips through KOI8R using convert_to and convert_from on the same database.
id: conversion.koi8r-cyrillic-roundtrip
title: Cyrillic text round trip through KOI8R and back to UTF8
family: conversion
tier: core
feature_ids: [encoding-conversion, convert-function, text, utf8]
required_capabilities: [select, bytea]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/conversion.sql"
steps:
  - sql: |
      SELECT convert_from(convert_to('привет'::text, 'KOI8R'), 'KOI8R') = 'привет' AS roundtrip,
             octet_length(convert_to('привет'::text, 'KOI8R')) AS koi8r_octets
    expect: rows
  - sql: |
      SELECT convert_from(convert_to('привет'::text, 'KOI8R'), 'UTF8') AS as_utf8
    expect: error
    sqlstate: "22021"
    comment: KOI8R bytes are not valid UTF8, so decoding them as UTF8 must fail
