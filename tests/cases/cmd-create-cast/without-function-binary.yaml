# WITHOUT FUNCTION needs a binary-coercible pair; pairs that are already binary coercible or have different representations are rejected.
id: cmd-create-cast.without-function-binary
title: "WITHOUT FUNCTION is rejected for pairs that are already binary coercible or not binary compatible"
family: cmd-create-cast
tier: core
feature_ids: [create-cast, binary-coercible, text, varchar]
required_capabilities: [create-cast, select]
provenance:
  source: pg-docs
  ref: "ref/create_cast.sgml#sql-createcast-description (binary coercible); ref/create_cast.sgml#sql-createcast-parameters (WITHOUT FUNCTION)"
sessions: [a]
steps:
  - sql: |
      CREATE CAST (text AS varchar) WITHOUT FUNCTION
    expect: error
    sqlstate: "42710"
    comment: text and varchar are already binary coercible through a predefined pg_cast entry
  - sql: |
      CREATE CAST (int4 AS int4) WITHOUT FUNCTION
    expect: error
    sqlstate: "42P17"
    comment: source and target are the same type
  - sql: |
      CREATE CAST (int8 AS int4) WITHOUT FUNCTION
    expect: error
    sqlstate: "42P17"
    comment: int8 and int4 have different internal representations
  - sql: |
      SELECT castcontext, castmethod FROM pg_cast WHERE castsource = 'text'::regtype AND casttarget = 'varchar'::regtype
    expect: rows
    comment: the predefined entry is binary (method b) and implicit (context i)
