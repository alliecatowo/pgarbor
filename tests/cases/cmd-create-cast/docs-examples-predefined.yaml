# CREATE CAST Description/Examples: explicit casts, numeric promotion via implicit int4->numeric, and the predefined bigint->int4 cast.
id: cmd-create-cast.docs-examples-predefined
title: "Documented CAST examples work and redeclaring the predefined bigint to int4 cast fails"
family: cmd-create-cast
tier: core
feature_ids: [create-cast, explicit-cast, implicit-cast, numeric-promotion]
required_capabilities: [create-cast, select]
provenance:
  source: pg-docs
  ref: "ref/create_cast.sgml#sql-createcast-description; ref/create_cast.sgml#sql-createcast-examples"
sessions: [a]
steps:
  - sql: |
      SELECT CAST(42 AS float8) AS a, 42::float8 AS b
    expect: rows
    comment: explicit cast invokes float8(int4); both spellings agree
  - sql: |
      SELECT 2 + 4.0 AS v, pg_typeof(2 + 4.0)::text AS t
    expect: rows
    comment: the integer constant is implicitly cast to numeric so numeric + numeric applies
  - sql: |
      SELECT CAST ( 2 AS numeric ) + 4.0 AS v
    expect: rows
  - sql: |
      CREATE CAST (bigint AS int4) WITH FUNCTION int4(bigint) AS ASSIGNMENT
    expect: error
    sqlstate: "42710"
    comment: the cast is predefined in the system, so declaring it again is a duplicate
  - sql: |
      SELECT count(*) AS n FROM pg_cast WHERE castsource = 'int8'::regtype AND casttarget = 'int4'::regtype
    expect: rows
    comment: exactly one catalog entry still exists
