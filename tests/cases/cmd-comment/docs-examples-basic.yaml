# The core COMMENT examples from the reference page (table, column, index, view, materialized view, sequence, type, domain, constraint, trigger, rule, function, procedure, routine, schema) run in one fresh database and produce the documented comments.
id: cmd-comment.docs-examples-basic
title: PostgreSQL reference-page COMMENT examples for tables, columns, indexes, views, sequences, types and routines
family: cmd-comment
tier: core
feature_ids: [comment, comment-table, comment-column, comment-index, comment-view, comment-materialized-view, comment-sequence, comment-type, comment-domain, comment-constraint, comment-trigger, comment-rule, comment-function, comment-procedure, comment-routine, comment-schema]
required_capabilities: [comment, create-table, create-view, create-materialized-view, create-index, create-sequence, create-type, create-domain, create-function, create-procedure, create-rule, create-schema, constraints, triggers, plpgsql, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "ref/comment.sgml#sql-comment-examples (Attach a comment to the table mytable; Remove it again; Some more examples)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE mytable (id int4, c1 int4)
    expect: ok
  - sql: |
      COMMENT ON TABLE mytable IS 'This is my table.'
    expect: ok
  - sql: |
      COMMENT ON TABLE mytable IS NULL
    expect: ok
  - sql: |
      SELECT obj_description('mytable'::regclass, 'pg_class') IS NULL AS removed
    expect: rows
  - sql: |
      CREATE SCHEMA my_schema
    expect: ok
  - sql: |
      CREATE TABLE my_schema.my_table (id int4)
    expect: ok
  - sql: |
      COMMENT ON TABLE my_schema.my_table IS 'Employee Information'
    expect: ok
  - sql: |
      COMMENT ON SCHEMA my_schema IS 'Departmental data'
    expect: ok
  - sql: |
      CREATE TABLE my_table (id int4, my_column int4)
    expect: ok
  - sql: |
      COMMENT ON COLUMN my_table.my_column IS 'Employee ID number'
    expect: ok
  - sql: |
      CREATE INDEX my_index ON my_table (my_column)
    expect: ok
  - sql: |
      COMMENT ON INDEX my_index IS 'Enforces uniqueness on employee ID'
    expect: ok
  - sql: |
      CREATE SEQUENCE my_sequence
    expect: ok
  - sql: |
      COMMENT ON SEQUENCE my_sequence IS 'Used to generate primary keys'
    expect: ok
  - sql: |
      CREATE VIEW my_view AS SELECT my_column FROM my_table
    expect: ok
  - sql: |
      COMMENT ON VIEW my_view IS 'View of departmental costs'
    expect: ok
  - sql: |
      COMMENT ON VIEW my_view IS NULL
    expect: ok
  - sql: |
      CREATE MATERIALIZED VIEW my_matview AS SELECT my_column FROM my_table
    expect: ok
  - sql: |
      COMMENT ON MATERIALIZED VIEW my_matview IS 'Summary of order history'
    expect: ok
  - sql: |
      CREATE DOMAIN my_domain AS text CHECK (VALUE LIKE '%@%')
    expect: ok
  - sql: |
      COMMENT ON DOMAIN my_domain IS 'Email Address Domain'
    expect: ok
  - sql: |
      CREATE DOMAIN dom AS int4 CONSTRAINT dom_col_constr CHECK (VALUE > 0)
    expect: ok
  - sql: |
      COMMENT ON CONSTRAINT dom_col_constr ON DOMAIN dom IS 'Constrains col of domain'
    expect: ok
  - sql: |
      CREATE TABLE bar (col int4 CONSTRAINT bar_col_cons CHECK (col > 0))
    expect: ok
  - sql: |
      COMMENT ON CONSTRAINT bar_col_cons ON bar IS 'Constrains column col'
    expect: ok
  - sql: |
      CREATE TYPE complex AS (r float8, i float8)
    expect: ok
  - sql: |
      COMMENT ON TYPE complex IS 'Complex number data type'
    expect: ok
  - sql: |
      CREATE FUNCTION my_trig() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$
    expect: ok
  - sql: |
      CREATE TRIGGER my_trigger AFTER INSERT ON my_table FOR EACH ROW EXECUTE FUNCTION my_trig()
    expect: ok
  - sql: |
      COMMENT ON TRIGGER my_trigger ON my_table IS 'Used for RI'
    expect: ok
  - sql: |
      CREATE RULE my_rule AS ON UPDATE TO my_table DO ALSO NOTHING
    expect: ok
  - sql: |
      COMMENT ON RULE my_rule ON my_table IS 'Logs updates of employee records'
    expect: ok
  - sql: |
      CREATE FUNCTION my_function(timestamp) RETURNS int4 LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      COMMENT ON FUNCTION my_function (timestamp) IS 'Returns Roman Numeral'
    expect: ok
  - sql: |
      CREATE FUNCTION my_routine(int4, int4) RETURNS int4 LANGUAGE sql AS 'SELECT $1 + $2'
    expect: ok
  - sql: |
      COMMENT ON ROUTINE my_routine (integer, integer) IS 'Runs a routine (which is a function or procedure)'
    expect: ok
  - sql: |
      CREATE PROCEDURE my_proc (integer, integer) LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      COMMENT ON PROCEDURE my_proc (integer, integer) IS 'Runs a report'
    expect: ok
  - sql: |
      SELECT
        obj_description('my_schema.my_table'::regclass, 'pg_class') AS schema_table_descr,
        col_description('my_table'::regclass, 2) AS column_descr,
        obj_description('my_index'::regclass, 'pg_class') AS index_descr,
        obj_description('my_sequence'::regclass, 'pg_class') AS seq_descr,
        obj_description('my_view'::regclass, 'pg_class') IS NULL AS view_removed,
        obj_description('my_matview'::regclass, 'pg_class') AS matview_descr,
        obj_description('my_domain'::regtype, 'pg_type') AS domain_descr,
        obj_description('complex'::regtype, 'pg_type') AS type_descr,
        obj_description('my_schema'::regnamespace, 'pg_namespace') AS schema_descr,
        obj_description('my_function(timestamp)'::regprocedure, 'pg_proc') AS function_descr,
        obj_description('my_routine(int4,int4)'::regprocedure, 'pg_proc') AS routine_descr,
        obj_description('my_proc(int4,int4)'::regprocedure, 'pg_proc') AS procedure_descr,
        (SELECT obj_description(oid, 'pg_trigger') FROM pg_trigger WHERE tgname = 'my_trigger') AS trigger_descr,
        (SELECT obj_description(oid, 'pg_rewrite') FROM pg_rewrite WHERE rulename = 'my_rule') AS rule_descr,
        (SELECT obj_description(oid, 'pg_constraint') FROM pg_constraint WHERE conname = 'bar_col_cons') AS constraint_descr,
        (SELECT obj_description(oid, 'pg_constraint') FROM pg_constraint WHERE conname = 'dom_col_constr') AS domain_constraint_descr
    expect: rows
