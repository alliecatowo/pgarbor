# \d on an unknown relation: regclass input raises undefined_table (42P01), including for a schema-qualified name whose schema does not exist; unknown function name for regproc raises undefined_function (42883).
id: psql-describe.describe-missing-relation
title: Describing a nonexistent table or schema-qualified name fails with the PG error codes
family: psql-describe
tier: core
feature_ids: [catalog-introspection, errors, psql-describe]
required_capabilities: [catalog-introspection, errors]
provenance:
  source: pg-source
  ref: "src/bin/psql/describe.c describeOneTableDetails(); regclassin ERRCODE_UNDEFINED_TABLE"
sessions: [a]
steps:
  - sql: |
      SELECT 'no_such_table'::regclass
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT 'no_such_schema.t'::regclass
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT 'no_such_fn'::regproc
    expect: error
    sqlstate: "42883"
