# \dn: user schemas excluding pg_* and information_schema, ACL and owner columns omitted for determinism.
id: psql-describe.list-schemas
title: \dn-style listing shows user schemas without system namespaces
family: psql-describe
tier: core
feature_ids: [catalog-introspection, create-schema, psql-describe]
required_capabilities: [create-schema, catalog-introspection]
provenance:
  source: pg-source
  ref: "src/bin/psql/describe.c listSchemas() (PG 18), filter 'nspname !~ ^pg_' and information_schema"
sessions: [a]
setup: |
  CREATE SCHEMA app;
  CREATE SCHEMA reporting;
  CREATE SCHEMA zeta;
steps:
  - sql: |
      SELECT n.nspname
      FROM pg_catalog.pg_namespace n
      WHERE n.nspname !~ '^pg_' AND n.nspname <> 'information_schema'
      ORDER BY 1
    expect: rows
    order: ordered
    comment: public is present by default and sorts before app alphabetically
