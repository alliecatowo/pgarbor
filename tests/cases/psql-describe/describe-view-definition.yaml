# \d on a view: pg_get_viewdef with pretty flag, plus relkind of the view.
id: psql-describe.describe-view
title: \d view shows pg_get_viewdef text and relkind v
family: psql-describe
tier: core
feature_ids: [catalog-introspection, create-view, select, psql-describe]
required_capabilities: [create-table, create-view, select, catalog-introspection]
provenance:
  source: pg-source
  ref: "src/bin/psql/describe.c describeOneTableDetails() view definition path"
sessions: [a]
setup: |
  CREATE TABLE nums (n int4, label text);
  INSERT INTO nums VALUES (1, 'one'), (2, NULL);
  CREATE VIEW big_nums AS SELECT n, label FROM nums WHERE n > 1;
steps:
  - sql: |
      SELECT c.relkind, pg_catalog.pg_get_viewdef(c.oid, true) AS definition
      FROM pg_catalog.pg_class c
      WHERE c.oid = 'big_nums'::regclass
    expect: rows
  - sql: |
      SELECT n, label FROM big_nums ORDER BY n
    expect: rows
    order: ordered
