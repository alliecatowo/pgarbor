# \dt in a database with no user tables returns zero rows, not an error.
id: psql-describe.list-tables-empty
title: \dt-style query on a fresh database returns an empty result set
family: psql-describe
tier: core
feature_ids: [catalog-introspection, psql-describe]
required_capabilities: [catalog-introspection]
provenance:
  source: hand
  ref: "src/bin/psql/describe.c listTables() empty-result path"
sessions: [a]
steps:
  - sql: |
      SELECT n.nspname, c.relname
      FROM pg_catalog.pg_class c
        LEFT JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
      WHERE c.relkind IN ('r', 'p')
        AND n.nspname = 'public'
        AND pg_catalog.pg_table_is_visible(c.oid)
      ORDER BY 1, 2
    expect: rows
    order: ordered
