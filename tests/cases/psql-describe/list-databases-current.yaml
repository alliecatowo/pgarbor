# \l scoped to the case database: the oracle has other databases, so filter to current_database().
id: psql-describe.list-databases
title: \l-style query for the current database shows name and encoding
family: psql-describe
tier: extended
feature_ids: [catalog-introspection, psql-describe]
required_capabilities: [catalog-introspection]
provenance:
  source: pg-source
  ref: "src/bin/psql/describe.c listAllDbs() (pg_database, pg_encoding_to_char)"
sessions: [a]
steps:
  - sql: |
      SELECT d.datname, pg_catalog.pg_encoding_to_char(d.encoding) AS encoding,
        d.datallowconn, d.datistemplate
      FROM pg_catalog.pg_database d
      WHERE d.datname = current_database()
    expect: rows
    comment: other databases on the cluster are excluded because their names are environment-dependent
