# \dt with default filters: table/partitioned-table relkinds, visible, non-toast, ordered by schema and name.
id: psql-describe.list-tables-public
title: \dt-style listing shows only visible user tables, not views or indexes
family: psql-describe
tier: slice
feature_ids: [catalog-introspection, create-table, create-view, create-index, psql-describe]
required_capabilities: [create-table, create-view, create-index, catalog-introspection]
provenance:
  source: pg-source
  ref: "src/bin/psql/describe.c listTables() (PG 18)"
sessions: [a]
setup: |
  CREATE TABLE t_alpha (id int4 PRIMARY KEY, name text);
  CREATE TABLE t_beta (k text, v numeric(6,2));
  CREATE VIEW v_alpha AS SELECT id FROM t_alpha;
  CREATE INDEX t_beta_k_idx ON t_beta (k);
steps:
  - sql: |
      SELECT n.nspname AS "Schema", c.relname AS "Name",
        CASE c.relkind WHEN 'r' THEN 'table' WHEN 'v' THEN 'view' WHEN 'm' THEN 'materialized view'
          WHEN 'i' THEN 'index' WHEN 'S' THEN 'sequence' WHEN 'p' THEN 'partitioned table'
          WHEN 'I' THEN 'partitioned index' END AS "Type",
        pg_catalog.pg_get_userbyid(c.relowner) IS NOT NULL AS has_owner
      FROM pg_catalog.pg_class c
        LEFT JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
      WHERE c.relkind IN ('r', 'v', 'm', 'i', 'S', 'p', 'I')
        AND n.nspname !~ '^pg_toast'
        AND pg_catalog.pg_table_is_visible(c.oid)
        AND n.nspname = 'public'
      ORDER BY 1, 2
    expect: rows
    order: ordered
    comment: psql \dt uses relkind IN (r,p) only; this query widens to show the filter works on kinds
