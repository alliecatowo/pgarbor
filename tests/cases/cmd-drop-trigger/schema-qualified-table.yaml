# The table_name may be schema-qualified; an unqualified name resolves through search_path and does not find a trigger in another schema.
id: cmd-drop-trigger.schema-qualified-table
title: "DROP TRIGGER on a schema-qualified table drops that table's trigger, and an unqualified name does not reach another schema"
family: cmd-drop-trigger
tier: core
feature_ids: [drop-trigger, schemas, search-path, triggers]
required_capabilities: [create-table, insert, select, create-schema, create-function, plpgsql, triggers, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_trigger.sgml#sql-droptrigger (Parameters: table_name, optionally schema-qualified)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
  CREATE FUNCTION s1.noop_tg() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE s1.t2 (id int4);
  CREATE TRIGGER tg_s BEFORE INSERT ON s1.t2 FOR EACH ROW EXECUTE FUNCTION s1.noop_tg();
steps:
  - sql: |
      DROP TRIGGER tg_s ON t2
    expect: error
    sqlstate: "42P01"
    comment: t2 is not visible on the default search_path, so the table lookup fails
  - sql: |
      DROP TRIGGER tg_s ON s1.t2
    expect: ok
    comment: the schema-qualified name finds the trigger
  - sql: |
      DROP TRIGGER tg_s ON s1.t2
    expect: error
    sqlstate: "42704"
    comment: the trigger is gone
  - sql: |
      SELECT count(*) AS n FROM pg_trigger WHERE tgname = 'tg_s' AND NOT tgisinternal
    expect: rows
