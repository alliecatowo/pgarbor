# A trigger on a partitioned table is cloned to each partition; the clone cannot be dropped alone, but dropping the parent trigger removes all clones.
id: cmd-drop-trigger.partition-clone
title: "DROP TRIGGER on a partition clone fails with 2BP01, and dropping the parent trigger removes the clones"
family: cmd-drop-trigger
tier: extended
feature_ids: [drop-trigger, partitioning, triggers, dependencies, errors]
required_capabilities: [create-table, insert, select, create-function, plpgsql, triggers, partitioning, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_trigger.sgml#sql-droptrigger (Description, RESTRICT default); doc/src/sgml/ddl.sgml#ddl-depend"
sessions: [a]
setup: |
  CREATE FUNCTION noop_tg() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE ptab (id int4) PARTITION BY RANGE (id);
  CREATE TABLE ppart PARTITION OF ptab FOR VALUES FROM (0) TO (10);
  CREATE TRIGGER ptr AFTER INSERT ON ptab FOR EACH ROW EXECUTE FUNCTION noop_tg();
steps:
  - sql: |
      SELECT tgrelid::regclass::text AS tbl FROM pg_trigger WHERE tgname = 'ptr' ORDER BY 1
    expect: rows
    order: ordered
    comment: the trigger exists on the parent and on the partition
  - sql: |
      DROP TRIGGER ptr ON ppart
    expect: error
    sqlstate: "2BP01"
    comment: the partition's clone depends on the parent trigger, so RESTRICT refuses
  - sql: |
      DROP TRIGGER ptr ON ptab RESTRICT
    expect: ok
    comment: dropping the parent trigger removes its clones
  - sql: |
      SELECT count(*) AS n FROM pg_trigger WHERE tgname = 'ptr'
    expect: rows
    comment: no trigger remains on the parent or the partition
