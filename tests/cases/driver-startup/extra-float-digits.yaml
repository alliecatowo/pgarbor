# Drivers set extra_float_digits=3 so float8 output is exact round-trip text.
id: driver-startup.extra-float-digits
title: SET extra_float_digits=3 changes float8 text output to shortest exact form
family: driver-startup
tier: core
feature_ids: [guc, float8, extra-float-digits]
required_capabilities: [guc, float8, select]
provenance:
  source: hand
  ref: "PG18 docs runtime-config-client.html#GUC-EXTRA-FLOAT-DIGITS"
sessions: [a]
steps:
  - sql: |
      SET extra_float_digits = 3
    expect: ok
  - sql: |
      SELECT (1.0::float8 / 3)::text AS third, (0.1::float8 + 0.2::float8)::text AS sum
    expect: rows
    order: ordered
  - sql: |
      SELECT NULL::float8::text AS nothing, (-0.0::float8)::text AS negzero
    expect: rows
    order: ordered
