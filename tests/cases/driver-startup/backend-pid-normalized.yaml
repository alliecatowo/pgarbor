# pg_backend_pid is allocation-dependent; the raw value is normalized, the relationship is compared.
id: driver-startup.backend-pid-normalized
title: pg_backend_pid is stable within a session and normalized in output
family: driver-startup
tier: extended
feature_ids: [session-identity, backend-pid]
required_capabilities: [select, session-identity]
provenance:
  source: hand
  ref: "PG18 docs functions-info.html#FUNCTIONS-INFO-SESSION"
sessions: [a]
steps:
  - sql: |
      SELECT pg_backend_pid() AS pid
    expect: rows
    normalize: [pids]
    comment: raw pid is replaced by the pids normalizer before comparison
  - sql: |
      SELECT pg_backend_pid() = pg_backend_pid() AS stable, pg_backend_pid() > 0 AS positive
    expect: rows
    order: ordered
