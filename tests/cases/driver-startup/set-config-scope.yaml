# set_config with is_local=true must revert at COMMIT; is_local=false persists for the session.
id: driver-startup.set-config-scope
title: set_config local vs session scope, reverted at transaction end
family: driver-startup
tier: extended
feature_ids: [guc, set-config, transactions]
required_capabilities: [guc, set-config, transactions, select]
provenance:
  source: hand
  ref: "PG18 docs functions-admin.html#FUNCTIONS-ADMIN-SET"
sessions: [a]
steps:
  - sql: |
      SELECT set_config('pgarbor.probe', 'outer', false) AS v
    expect: rows
    order: ordered
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT set_config('pgarbor.probe', 'inner', true) AS v
    expect: rows
    order: ordered
  - sql: |
      SELECT current_setting('pgarbor.probe') AS v
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('pgarbor.probe') AS v
    expect: rows
    order: ordered
