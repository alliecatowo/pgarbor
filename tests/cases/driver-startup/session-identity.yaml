# Drivers call current_user, session_user and current_database() at startup. Names are
# environment-specific, so only their relationships are compared.
id: driver-startup.session-identity
title: current_user, session_user and current_database are non-null and consistent
family: driver-startup
tier: core
feature_ids: [session-identity, current-user, current-database]
required_capabilities: [select, session-identity]
provenance:
  source: hand
  ref: "PG18 docs functions-info.html#FUNCTIONS-INFO-SESSION"
sessions: [a]
steps:
  - sql: |
      SELECT current_user = session_user AS same_user,
             current_user IS NOT NULL AS has_user,
             current_database() IS NOT NULL AS has_db
    expect: rows
    order: ordered
