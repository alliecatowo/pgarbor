# Drivers read transaction_isolation after BEGIN ISOLATION LEVEL to confirm the level.
id: driver-startup.transaction-isolation-show
title: SHOW transaction_isolation reflects default and BEGIN ISOLATION LEVEL override
family: driver-startup
tier: core
feature_ids: [transactions, isolation-levels, show]
required_capabilities: [show, transactions, guc]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/transaction-iso.html"
sessions: [a]
steps:
  - sql: |
      SHOW transaction_isolation
    expect: rows
  - sql: |
      BEGIN ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - sql: |
      SHOW transaction_isolation
    expect: rows
  - sql: |
      SELECT current_setting('default_transaction_isolation') AS dflt
    expect: rows
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS after_commit
    expect: rows
