# Drivers send SET client_encoding right after connect and then read it back.
id: driver-startup.set-client-encoding
title: SET client_encoding to UTF8 and read it back via SHOW and current_setting
family: driver-startup
tier: core
feature_ids: [guc, client-encoding, show]
required_capabilities: [guc, show, select]
provenance:
  source: hand
  ref: "PG18 docs runtime-config-client.html#GUC-CLIENT-ENCODING"
sessions: [a]
steps:
  - sql: |
      SET client_encoding TO 'UTF8'
    expect: ok
  - sql: |
      SHOW client_encoding
    expect: rows
  - sql: |
      SELECT current_setting('client_encoding') = 'UTF8' AS is_utf8
    expect: rows
    order: ordered
