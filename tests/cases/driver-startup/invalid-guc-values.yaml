# Startup SETs with invalid values must fail with 22023 and leave the previous value in place.
id: driver-startup.invalid-guc-values
title: Invalid DateStyle, extra_float_digits and client_encoding values raise 22023
family: driver-startup
tier: extended
feature_ids: [guc, errors, datestyle, client-encoding]
required_capabilities: [guc, show, error-sqlstate]
provenance:
  source: hand
  ref: "PG18 docs runtime-config-client.html; errcodes 22023"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'BOGUS'
    expect: error
    sqlstate: "22023"
  - sql: |
      SET extra_float_digits = 99
    expect: error
    sqlstate: "22023"
  - sql: |
      SET client_encoding TO 'NOT_AN_ENCODING'
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT current_setting('extra_float_digits') AS efd
    expect: rows
    order: ordered
