# RESET ALL is sent by pools before handing a connection to another client.
id: driver-startup.reset-all-restores-defaults
title: RESET ALL restores session-changed GUCs to their defaults
family: driver-startup
tier: extended
feature_ids: [guc, reset, show]
required_capabilities: [guc, show, select]
provenance:
  source: hand
  ref: "PG18 docs sql-reset.html"
sessions: [a]
steps:
  - sql: |
      SET extra_float_digits = 3
    expect: ok
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      SHOW DateStyle
    expect: rows
  - sql: |
      RESET ALL
    expect: ok
  - sql: |
      SELECT name, setting, setting = boot_val AS at_default
      FROM pg_settings WHERE name IN ('extra_float_digits', 'DateStyle') ORDER BY name
    expect: rows
    order: ordered
