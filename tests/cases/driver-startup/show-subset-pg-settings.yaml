# Drivers query a fixed subset of pg_settings (or SHOW ALL filtered) at connect time.
id: driver-startup.show-subset-pg-settings
title: pg_settings subset for driver-relevant parameters, ordered by name
family: driver-startup
tier: extended
feature_ids: [catalog-introspection, guc, pg-settings]
required_capabilities: [select, catalog-introspection, guc]
provenance:
  source: hand
  ref: "PG18 docs view-pg-settings.html"
sessions: [a]
steps:
  - sql: |
      SELECT name, setting, context FROM pg_settings
      WHERE name IN ('DateStyle', 'standard_conforming_strings', 'integer_datetimes', 'extra_float_digits')
      ORDER BY name
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM pg_settings WHERE name = 'no_such.param'
    expect: rows
    order: ordered
