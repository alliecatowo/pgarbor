# Drivers that bind parameters at startup call current_setting($1) through the extended protocol.
id: driver-startup.exec-params-current-setting
title: Parameterized current_setting over unnamed extended-protocol statement
family: driver-startup
tier: extended
feature_ids: [extended-protocol, guc, bind-parameters]
required_capabilities: [extended-protocol, guc, select]
provenance:
  source: hand
  ref: "PG18 docs protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT current_setting($1) = $2 AS matches
      params: ["client_encoding", "UTF8"]
      param_types: [25, 25]
    expect: rows
  - exec_params:
      sql: |
        SELECT current_setting($1, true) AS v
      params: ["pgarbor.unset_param"]
      param_types: [25]
    expect: rows
  - exec_params:
      sql: |
        SELECT current_setting($1) IS NULL AS v
      params: [null]
      param_types: [25]
    expect: rows
    comment: current_setting is strict, so a NULL name yields NULL rather than an error
