# current_setting with missing_ok=true returns NULL; without it, an unknown name is an error.
id: driver-startup.current-setting-missing
title: current_setting missing_ok returns NULL, unknown parameter raises 42704
family: driver-startup
tier: core
feature_ids: [guc, current-setting, errors]
required_capabilities: [guc, select, error-sqlstate]
provenance:
  source: hand
  ref: "PG18 docs functions-admin.html#FUNCTIONS-ADMIN-SET; errcodes 42704"
sessions: [a]
steps:
  - sql: |
      SELECT current_setting('no_such.param', true) IS NULL AS missing_is_null
    expect: rows
    order: ordered
  - sql: |
      SELECT current_setting('no_such.param')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT current_setting('pgarbor.never_set', true) IS NULL AS still_null
    expect: rows
    order: ordered
