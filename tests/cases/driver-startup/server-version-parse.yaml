# Drivers parse version(), server_version_num or server_version to pick feature paths.
id: driver-startup.server-version-parse
title: Parse major version from version(), server_version_num and server_version
family: driver-startup
tier: core
feature_ids: [version, catalog-introspection, show]
required_capabilities: [select, show, version-string]
provenance:
  source: hand
  ref: "PG18 docs functions-info.html; PG18 docs runtime-config-preset.html#GUC-SERVER-VERSION-NUM"
sessions: [a]
steps:
  - sql: |
      SELECT split_part(version(), ' ', 1) AS product, split_part(version(), ' ', 2) AS ver
    expect: rows
    order: ordered
  - sql: |
      SELECT current_setting('server_version_num')::int / 10000 AS major
    expect: rows
    order: ordered
  - sql: |
      SHOW server_version
    expect: rows
