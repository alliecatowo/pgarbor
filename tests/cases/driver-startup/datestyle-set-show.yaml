# node-postgres and JDBC send SET DateStyle at startup; the value must round-trip.
id: driver-startup.datestyle-set-show
title: SET DateStyle then SHOW and current_setting return the same canonical value
family: driver-startup
tier: core
feature_ids: [guc, datestyle, show]
required_capabilities: [guc, show, select]
provenance:
  source: hand
  ref: "PG18 docs runtime-config-client.html#GUC-DATESTYLE"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'ISO, MDY'
    expect: ok
  - sql: |
      SHOW DateStyle
    expect: rows
  - sql: |
      SELECT current_setting('DateStyle') AS ds, to_char(date '2026-01-02', 'YYYY-MM-DD') AS d
    expect: rows
    order: ordered
