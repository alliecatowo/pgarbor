id: regex.lookbehind-constraints
title: "Positive and negative lookbehind constraints including the no-match cases"
family: regex
tier: core
feature_ids: [regex, lookbehind, set-returning-functions]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT c.subject, c.pat, m.g
      FROM (VALUES
        ('abb', '(?<=a)b*'),
        ('a', 'a(?<=a)b*'),
        ('abc', 'a(?<=a)b*(?<=b)c*'),
        ('ab', 'a(?<=a)b*(?<=b)c*'),
        ('ab', 'a*(?<!a)b*'),
        ('ab', 'a*(?<!a)b+'),
        ('b', 'a*(?<!a)b+'),
        ('a', 'a(?<!a)b*'),
        ('b', '(?<=b)b'),
        ('foobar', '(?<=f)b+'),
        ('foobar', '(?<=foo)b+'),
        ('foobar', '(?<=oo)b+')
      ) AS c(subject, pat)
      LEFT JOIN LATERAL regexp_matches(c.subject, c.pat) AS m(g) ON true
    expect: rows
    order: multiset
