id: regex.match-all-shortcuts
title: "Alternations, star and bounded repeats of dot in regexp_match()"
family: regex
tier: core
feature_ids: [regex, regexp-match, alternation, bounded-quantifiers]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT v.n,
             regexp_match(v.s, v.p) AS m
      FROM (VALUES
        (1, 'xy', '.|...'),
        (2, 'xyz', '.|...'),
        (3, 'xy', '.*'),
        (4, 'fooba', '(?:..)*'),
        (5, 'foo', '(?:.|){99}')
      ) AS v(n, s, p)
      ORDER BY v.n
    expect: rows
    order: ordered
