id: regex.substring-capture-groups
title: "substring() with nested capture groups, including repeated groups"
family: regex
tier: core
feature_ids: [regex, substring, capture-groups]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT substring('asd TO foo' from ' TO (([a-z0-9._]+|"([^"]+|"")+")+)') AS a,
             substring('a' from '((a))+') AS b,
             substring('a' from '((a)+)') AS c
    expect: rows
    order: ordered
    comment: regression for pmatch[] array overrun in 9.2beta1
