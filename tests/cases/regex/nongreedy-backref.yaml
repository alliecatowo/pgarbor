id: regex.nongreedy-backref
title: "Non-greedy quantifiers combined with backreferences and the g flag"
family: regex
tier: core
feature_ids: [regex, non-greedy, backreferences, set-returning-functions]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'Programmer' ~ '(\w).*?\1' AS matched
    expect: rows
    order: ordered
    comment: Tcl bug 6585b21ca8fa6f3678d442b97241fdd43dba2ec0
  - sql: |
      SELECT m.g
      FROM regexp_matches('Programmer', '(\w)(.*?\1)', 'g') AS m(g)
    expect: rows
    order: multiset
  - sql: |
      SELECT m.g
      FROM regexp_matches('foo/bar/baz', '^([^/]+?)(?:/([^/]+?))(?:/([^/]+?))?$', '') AS m(g)
    expect: rows
    order: ordered
    comment: non-greedy iteration, bug 11478
