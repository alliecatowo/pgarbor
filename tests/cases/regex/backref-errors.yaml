id: regex.backref-errors
title: "Backreferences to nonexistent groups and backrefs inside lookahead are rejected"
family: regex
tier: extended
feature_ids: [regex, backreferences, errors]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'a' ~ '(a)\2'
    expect: error
    sqlstate: "2201B"
    comment: invalid backreference number
  - sql: |
      SELECT 'xyz' ~ 'x(\w)(?=\1)'
    expect: error
    comment: no backrefs in LACONs; SQLSTATE left to the recorder
  - sql: |
      SELECT 'xyz' ~ 'x(\w)(?=(\1))'
    expect: error
    comment: no backrefs in LACONs
  - sql: |
      SELECT 1
    expect: rows
