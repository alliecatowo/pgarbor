id: regex.regexp-match-global-error
title: "regexp_match() rejects the global flag"
family: regex
tier: core
feature_ids: [regex, regexp-match, errors]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_match('abc', 'Bd', 'ig')
    expect: error
    sqlstate: "0A000"
    comment: regexp_match does not support the global option; SQLSTATE is a belief to be checked by the recorder
  - sql: |
      SELECT 1
    expect: rows
    comment: session still usable after the error
