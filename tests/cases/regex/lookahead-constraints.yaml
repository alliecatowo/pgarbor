id: regex.lookahead-constraints
title: "Positive and negative lookahead constraints via regexp_matches over a VALUES table"
family: regex
tier: core
feature_ids: [regex, lookahead, set-returning-functions]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT c.subject, c.pat, m.g
      FROM (VALUES
        ('ab', 'a(?=b)b*'),
        ('a', 'a(?=b)b*'),
        ('abc', 'a(?=b)b*(?=c)c*'),
        ('ab', 'a(?=b)b*(?=c)c*'),
        ('ab', 'a(?!b)b*'),
        ('a', 'a(?!b)b*'),
        ('b', '(?=b)b'),
        ('a', '(?=b)b')
      ) AS c(subject, pat)
      LEFT JOIN LATERAL regexp_matches(c.subject, c.pat) AS m(g) ON true
    expect: rows
    order: multiset
    comment: rows with NULL g mean no match
