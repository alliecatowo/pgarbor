id: regex.large-pattern-state-count
title: "A pattern that expands to many arcs compiles and matches"
family: regex
tier: extended
feature_ids: [regex, large-pattern, performance-guard]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'x' ~ repeat('x*y*z*', 500) AS matched
    expect: rows
    order: ordered
    comment: O(N) states but O(N^2) arcs
