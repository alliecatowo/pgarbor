id: regex.empty-loop-termination
title: "Patterns with nested or empty-matching iterations terminate and return a boolean"
family: regex
tier: extended
feature_ids: [regex, regex-empty-iteration, termination]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT p, 'a' ~ p AS matched
      FROM (VALUES
        ('($|^)*'),
        ('(^)+^'),
        ('$($$)+'),
        ('($^)+'),
        ('(^$)*'),
        ('((((((a)*)*)*)*)*)*'),
        ('((((((a+|)+|)+|)+|)+|)+|)')
      ) AS v(p)
      ORDER BY p
    expect: rows
    order: ordered
    comment: regression for CVE-2007-4772 and Tcl bugs 3604074 and 3606683
  - sql: |
      SELECT s, s ~ '(^(?!aa))+' AS matched
      FROM (VALUES ('aa bb cc'), ('aa x'), ('bb x'), ('dd x')) AS v(s)
      ORDER BY s
    expect: rows
    order: ordered
