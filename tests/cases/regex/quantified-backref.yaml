id: regex.quantified-backref
title: "Quantified backreference matches a repeated group capture only when identical"
family: regex
tier: core
feature_ids: [regex, select, backreferences]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT s, s ~ '^([bc])\1*$' AS matched
      FROM (VALUES ('bbbbb'), ('ccc'), ('xxx'), ('bbc'), ('b')) AS v(s)
      ORDER BY s
    expect: rows
    order: ordered
    comment: quantified backref over a single-char group
