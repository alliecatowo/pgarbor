id: regex.invalid-pattern-errors
title: "Malformed regular expressions raise invalid_regular_expression"
family: regex
tier: core
feature_ids: [regex, errors]
required_capabilities: [select, regex]
provenance:
  source: hand
  ref: "PG18 errcodes 2201B invalid_regular_expression"
sessions: [a]
steps:
  - sql: |
      SELECT 'abc' ~ '('
    expect: error
    sqlstate: "2201B"
  - sql: |
      SELECT 'abc' ~ 'a{2,1}'
    expect: error
    sqlstate: "2201B"
  - sql: |
      SELECT 'abc' ~ 'a\'
    expect: error
    sqlstate: "2201B"
  - sql: |
      SELECT 1
    expect: rows
    comment: autocommit session is still usable
