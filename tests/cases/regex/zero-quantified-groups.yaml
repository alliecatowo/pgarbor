id: regex.zero-quantified-groups
title: "Captures inside {0} quantifiers and backrefs to them match or fail as PostgreSQL does"
family: regex
tier: extended
feature_ids: [regex, backreferences, bounded-quantifiers, capture-groups]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT s, p, s ~ p AS matched
      FROM (VALUES
        ('xxx', '(.){0}(\1)'),
        ('xxx', '((.)){0}(\2)'),
        ('xyz', '((.)){0}(\2){0}'),
        ('abcdef', '^(.)\1|\1.'),
        ('abadef', '^((.)\2|..)\2')
      ) AS v(s, p)
      ORDER BY s, p
    expect: rows
    order: ordered
