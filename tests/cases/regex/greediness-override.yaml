id: regex.greediness-override
title: "Outer quantifiers override the greediness of inner quantifiers in capture groups"
family: regex
tier: core
feature_ids: [regex, greedy, non-greedy, capture-groups, set-returning-functions]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT p.n, m.g
      FROM (VALUES
        (1, '^(l*)(.*)(f*)$'),
        (2, '^(l*){1,1}(.*)(f*)$'),
        (3, '^(l*){1,1}?(.*)(f*)$'),
        (4, '^(l*){1,1}?(.*){1,1}?(f*)$'),
        (5, '^(l*?)(.*)(f*)$'),
        (6, '^(l*?){1,1}(.*)(f*)$'),
        (7, '^(l*?){1,1}?(.*)(f*)$'),
        (8, '^(l*?){1,1}?(.*){1,1}?(f*)$')
      ) AS p(n, pat)
      CROSS JOIN LATERAL regexp_matches('llmmmfff', p.pat) AS m(g)
      ORDER BY p.n
    expect: rows
    order: ordered
