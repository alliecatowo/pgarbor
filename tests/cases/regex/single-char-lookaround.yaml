id: regex.single-char-lookaround
title: "Lookaround constraints over single characters and bracket expressions"
family: regex
tier: core
feature_ids: [regex, lookahead, lookbehind, bracket-expressions]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT s, p, s ~ p AS matched
      FROM (VALUES
        ('xz', 'x(?=[xy])'),
        ('xy', 'x(?=[xy])'),
        ('xz', 'x(?![xy])'),
        ('xy', 'x(?![xy])'),
        ('x', 'x(?![xy])'),
        ('xyy', '(?<=[xy])yy+'),
        ('zyy', '(?<=[xy])yy+'),
        ('xyy', '(?<![xy])yy+'),
        ('zyy', '(?<![xy])yy+')
      ) AS v(s, p)
      ORDER BY s, p
    expect: rows
    order: ordered
