id: regex.regexp-match-options
title: "regexp_match() with empty pattern, no-match, and the i flag"
family: regex
tier: core
feature_ids: [regex, regexp-match, case-insensitive]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_match('abc', '') AS empty_pat,
             regexp_match('abc', 'bc') AS plain,
             regexp_match('abc', 'd') IS NULL AS no_match_is_null,
             regexp_match('abc', '(B)(c)', 'i') AS ci_groups
    expect: rows
    order: ordered
