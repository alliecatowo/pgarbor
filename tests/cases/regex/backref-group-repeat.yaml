id: regex.backref-group-repeat
title: "Backreference inside a repeated group of a larger expression"
family: regex
tier: core
feature_ids: [regex, select, backreferences]
required_capabilities: [select, regex]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/regex.sql"
sessions: [a]
steps:
  - sql: |
      SELECT s,
             s ~ '^(\w+)( \1)+$' AS word_repeat,
             s ~ '^(.+)( \1)+$' AS any_repeat
      FROM (VALUES ('abc abc abc'), ('abc abd abc'), ('abc abc abd')) AS v(s)
      ORDER BY s
    expect: rows
    order: ordered
