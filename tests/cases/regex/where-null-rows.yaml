id: regex.where-null-rows
title: "Regex predicates in WHERE exclude NULL rows for both match and negated match"
family: regex
tier: core
feature_ids: [regex, where, nulls, create-table, insert]
required_capabilities: [create-table, insert, select, regex]
provenance:
  source: hand
  ref: "PG18 functions-matching.html; SQL three-valued logic"
sessions: [a]
setup: |
  CREATE TABLE rx (id int4 PRIMARY KEY, name text);
  INSERT INTO rx VALUES (1, 'xray'), (2, NULL), (3, ''), (4, 'yx');
steps:
  - sql: |
      SELECT id FROM rx WHERE name ~ '^x' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM rx WHERE name !~ '^x' ORDER BY id
    expect: rows
    order: ordered
    comment: NULL row 2 must not appear in either result
