id: regex.null-propagation
title: "NULL subject or pattern yields NULL from operators and zero rows from set-returning forms"
family: regex
tier: core
feature_ids: [regex, nulls, select, set-returning-functions]
required_capabilities: [select, regex]
provenance:
  source: hand
  ref: "PG18 functions-matching.html; regexp_matches is strict"
sessions: [a]
steps:
  - sql: |
      SELECT (NULL::text ~ 'a') IS NULL AS null_subject_op,
             ('a' ~ NULL::text) IS NULL AS null_pattern_op,
             (NULL::text !~ 'a') IS NULL AS null_negated_op,
             regexp_match(NULL::text, 'a') IS NULL AS null_match_subject,
             regexp_match('a', NULL::text) IS NULL AS null_match_pattern
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM regexp_matches(NULL::text, 'a') AS m(g)
    expect: rows
    order: ordered
    comment: strict function, so no rows
