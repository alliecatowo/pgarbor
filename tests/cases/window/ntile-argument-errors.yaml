id: window.ntile-argument-errors
title: ntile rejects NULL and zero bucket counts with SQLSTATE 22014
family: window
tier: extended
feature_ids: [window-functions, ntile, errors]
required_capabilities: [create-table, insert, select, window-functions, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE nt (k int4 PRIMARY KEY);
  INSERT INTO nt VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT ntile(NULL) OVER (ORDER BY k) FROM nt
    expect: error
    sqlstate: "22014"
    comment: NULL bucket count
  - sql: |
      SELECT ntile(0) OVER (ORDER BY k) FROM nt
    expect: error
    sqlstate: "22014"
    comment: zero bucket count
  - sql: |
      SELECT k, ntile(2) OVER (ORDER BY k) AS b FROM nt ORDER BY k
    expect: rows
    order: ordered
  - sql: |
      SELECT 1
    expect: ok
    comment: session still usable after the errors (autocommit)
