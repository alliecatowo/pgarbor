id: window.frame-range-groups
title: RANGE and GROUPS frame modes with peer rows and offset bounds
family: window
tier: extended
feature_ids: [window-functions, window-frames, range-frames, groups-frames, frame-exclusion]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE g (id int4 PRIMARY KEY, k int4, v int4);
  INSERT INTO g VALUES (1, 1, 1), (2, 1, 2), (3, 2, 4), (4, 4, 8), (5, 4, 16);
steps:
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY k RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) AS s
      FROM g ORDER BY id
    expect: rows
    order: ordered
    comment: RANGE includes all peers of the current row
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY k RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING EXCLUDE TIES) AS s
      FROM g ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY k RANGE BETWEEN 1 PRECEDING AND 2 FOLLOWING) AS s
      FROM g ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY k GROUPS BETWEEN 1 PRECEDING AND 1 FOLLOWING) AS s
      FROM g ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY k GROUPS BETWEEN 1 PRECEDING AND 1 FOLLOWING EXCLUDE GROUP) AS s
      FROM g ORDER BY id
    expect: rows
    order: ordered
