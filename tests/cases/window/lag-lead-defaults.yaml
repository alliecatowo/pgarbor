id: window.lag-lead-defaults
title: lag and lead with offsets, default values, NULL inputs and NULL offset
family: window
tier: core
feature_ids: [window-functions, lag, lead, nulls]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE s (id int4 PRIMARY KEY, v int4);
  INSERT INTO s VALUES (1, 10), (2, NULL), (3, 30), (4, 40);
steps:
  - sql: |
      SELECT id, lag(v) OVER (ORDER BY id) AS prev, lead(v) OVER (ORDER BY id) AS nxt
      FROM s ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, lag(v, 2, -1) OVER (ORDER BY id) AS p2 FROM s ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, lead(v, 1, 0) OVER (ORDER BY id) AS n FROM s ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, lag(v, 0) OVER (ORDER BY id) AS same FROM s ORDER BY id
    expect: rows
    order: ordered
    comment: offset 0 returns the current row
  - sql: |
      SELECT id, lag(v, NULL::int4) OVER (ORDER BY id) AS nul_off FROM s ORDER BY id
    expect: rows
    order: ordered
    comment: NULL offset yields NULL
