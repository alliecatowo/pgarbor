id: window.first-last-value-peers
title: first_value and last_value with default frame peers and explicit frames
family: window
tier: core
feature_ids: [window-functions, first-value, last-value, window-frames]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE p (id int4 PRIMARY KEY, ten int4);
  INSERT INTO p VALUES (1, 1), (2, 1), (3, 2), (4, 2), (5, 3);
steps:
  - sql: |
      SELECT id, ten, first_value(id) OVER (ORDER BY ten) AS f, last_value(id) OVER (ORDER BY ten) AS l
      FROM p ORDER BY id
    expect: rows
    order: ordered
    comment: default frame with RANGE semantics makes last_value return the last peer
  - sql: |
      SELECT id, last_value(id) OVER (ORDER BY ten ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) AS l
      FROM p ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, first_value(id) OVER (ORDER BY ten DESC, id ROWS BETWEEN 1 FOLLOWING AND 2 FOLLOWING) AS f
      FROM p ORDER BY id
    expect: rows
    order: ordered
