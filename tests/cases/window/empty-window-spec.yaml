id: window.empty-window-spec
title: Empty OVER and empty window definition over rows and over an empty input
family: window
tier: core
feature_ids: [window-functions, aggregates, where-clause]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (1, 'x'), (2, 'y'), (3, 'x');
steps:
  - sql: |
      SELECT count(*) OVER () AS n, a FROM t ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) OVER w AS n, a FROM t WINDOW w AS () ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM t WHERE false WINDOW w AS (PARTITION BY b)
    expect: rows
    order: multiset
    comment: window clause with no input rows yields no rows
  - sql: |
      SELECT count(*) OVER (PARTITION BY a) FROM (SELECT * FROM t WHERE false) s
    expect: rows
    order: multiset
  - sql: |
      SELECT SUM(COUNT(a)) OVER () AS s FROM t WHERE a = 42
    expect: rows
    order: multiset
    comment: window over an ungrouped aggregate on an empty row set still yields one row
