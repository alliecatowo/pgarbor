id: window.view-with-frame-exclusion
title: View defined with a window frame exclusion keeps the frame and reflects new rows
family: window
tier: extended
feature_ids: [window-functions, views, window-frames, frame-exclusion]
required_capabilities: [create-table, insert, select, create-view, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vv (i int4 PRIMARY KEY);
  INSERT INTO vv VALUES (1), (2), (3), (4), (5);
  CREATE VIEW vw AS
    SELECT i, sum(i) OVER (ORDER BY i ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING EXCLUDE CURRENT ROW) AS s
    FROM vv;
steps:
  - sql: |
      SELECT i, s FROM vw ORDER BY i
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO vv VALUES (6)
    expect: ok
  - sql: |
      SELECT i, s FROM vw ORDER BY i
    expect: rows
    order: ordered
    comment: the view recomputes the window over the new row
