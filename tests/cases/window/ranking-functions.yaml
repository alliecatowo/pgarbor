id: window.ranking-functions
title: row_number, rank, dense_rank, percent_rank, cume_dist and ntile with ties
family: window
tier: core
feature_ids: [window-functions, ranking-functions, partition-by, order-by]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE r (grp int4, v int4, id int4 PRIMARY KEY);
  INSERT INTO r VALUES (1, 10, 1), (1, 10, 2), (1, 20, 3), (1, 30, 4),
                       (2, 5, 5), (2, 5, 6), (2, 7, 7);
steps:
  - sql: |
      SELECT id, row_number() OVER (ORDER BY id) AS rn FROM r ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, rank() OVER (PARTITION BY grp ORDER BY v) AS rk,
             dense_rank() OVER (PARTITION BY grp ORDER BY v) AS drk
      FROM r ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, percent_rank() OVER (PARTITION BY grp ORDER BY v) AS pr,
             cume_dist() OVER (PARTITION BY grp ORDER BY v) AS cd
      FROM r ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, ntile(3) OVER (ORDER BY v, id) AS nt FROM r ORDER BY id
    expect: rows
    order: ordered
