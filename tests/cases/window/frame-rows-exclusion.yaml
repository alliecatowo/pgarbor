id: window.frame-rows-exclusion
title: ROWS frames with EXCLUDE CURRENT ROW, GROUP, TIES and NO OTHERS
family: window
tier: extended
feature_ids: [window-functions, window-frames, frame-exclusion]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE f (id int4 PRIMARY KEY, grp int4, v int4);
  INSERT INTO f VALUES (1, 1, 1), (2, 1, 2), (3, 1, 4), (4, 2, 8), (5, 2, 16), (6, 3, 32);
steps:
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) AS s
      FROM f ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING EXCLUDE CURRENT ROW) AS s
      FROM f ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING EXCLUDE NO OTHERS) AS s
      FROM f ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING EXCLUDE GROUP) AS s
      FROM f ORDER BY id
    expect: rows
    order: ordered
    comment: ids are unique so there are no peers and GROUP exclusion removes only the current row
  - sql: |
      SELECT id, sum(v) OVER (ORDER BY id ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING EXCLUDE TIES) AS s
      FROM f ORDER BY id
    expect: rows
    order: ordered
