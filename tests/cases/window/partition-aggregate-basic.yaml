id: window.partition-aggregate-basic
title: Aggregate and ranking window functions over PARTITION BY
family: window
tier: core
feature_ids: [window-functions, partition-by, aggregates, order-by]
required_capabilities: [create-table, insert, select, window-functions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/window.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE emp (depname text, empno int8 PRIMARY KEY, salary int4);
  INSERT INTO emp VALUES
    ('develop', 10, 5200), ('sales', 1, 5000), ('personnel', 5, 3500),
    ('sales', 4, 4800), ('personnel', 2, 3900), ('develop', 7, 4200),
    ('develop', 9, 4500), ('sales', 3, 4800), ('develop', 8, 6000),
    ('develop', 11, 5200);
steps:
  - sql: |
      SELECT depname, empno, salary, sum(salary) OVER (PARTITION BY depname) AS total
      FROM emp ORDER BY depname, salary, empno
    expect: rows
    order: ordered
  - sql: |
      SELECT depname, empno, rank() OVER (PARTITION BY depname ORDER BY salary) AS r
      FROM emp ORDER BY depname, empno
    expect: rows
    order: ordered
  - sql: |
      SELECT depname, count(*) OVER (PARTITION BY depname) AS c
      FROM emp ORDER BY depname, empno
    expect: rows
    order: ordered
