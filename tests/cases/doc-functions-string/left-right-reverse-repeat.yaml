# left, right, reverse and repeat including negative counts.
id: doc-functions-string.left-right-reverse-repeat
title: left and right with negative counts drop the opposite end and repeat handles zero and negative counts
family: doc-functions-string
tier: core
feature_ids: [left, right, reverse, repeat, negative-count]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (left, right, reverse, repeat)"
sessions: [a]
steps:
  - sql: |
      SELECT left('abcde', 2) AS a, right('abcde', 2) AS b, reverse('abcde') AS c, repeat('Pg', 4) AS d
    expect: rows
  - sql: |
      SELECT left('abcde', -2) AS a, right('abcde', -2) AS b, left('abc', 0) AS c, right('abc', 0) AS d
    expect: rows
    comment: a negative count keeps all but the last (or first) |n| characters; zero gives the empty string
  - sql: |
      SELECT repeat('x', 0) = '' AS zero_empty, repeat('ab', -5) = '' AS neg_empty, repeat(NULL::text, 3) IS NULL AS null_in
    expect: rows
