# parse_ident with strict and relaxed modes, unistr escapes, and md5.
id: doc-functions-string.parse-ident-unistr-md5
title: parse_ident splits qualified names with optional strictness, unistr decodes escapes, and md5 hashes text
family: doc-functions-string
tier: core
feature_ids: [parse-ident, unistr, md5, quoted-identifiers]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (parse_ident, unistr, md5)"
sessions: [a]
steps:
  - sql: |
      SELECT parse_ident('"SomeSchema".someTable') AS a
    expect: rows
    comment: quoted parts keep their case and unquoted parts are folded to lower case
  - sql: |
      SELECT parse_ident('a.b c', false) AS a
    expect: rows
    comment: with strict_mode false, trailing characters after the last identifier are ignored
  - sql: |
      SELECT parse_ident('a.b c') AS a
    expect: error
    sqlstate: "22023"
    comment: strict mode rejects the trailing characters
  - sql: |
      SELECT unistr('d\0061t\+000061') AS a, unistr('dat\U00000061') AS b
    expect: rows
    comment: four-digit, six-digit with plus, and eight-digit escapes all decode to a
  - sql: |
      SELECT md5('abc') AS a
    expect: rows
