# format width, the minus flag, negative widths from arguments, and the too-few-arguments error.
id: doc-functions-string.format-width-flags
title: format pads with spaces by width, left-justifies with minus or a negative width, and rejects missing arguments
family: doc-functions-string
tier: core
feature_ids: [format, width, left-justify, star-width, positional-width]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-format (width fields and format examples)"
sessions: [a]
steps:
  - sql: |
      SELECT format('|%10s|', 'foo') AS a, format('|%-10s|', 'foo') AS b
    expect: rows
    comment: width pads on the left by default and on the right with the minus flag
  - sql: |
      SELECT format('|%*s|', 10, 'foo') AS a, format('|%*s|', -10, 'foo') AS b, format('|%-*s|', 10, 'foo') AS c
    expect: rows
    comment: a negative width from an argument means left-aligned
  - sql: |
      SELECT format('|%*2$s|', 'foo', 10, 'bar') AS a, format('|%1$*2$s|', 'foo', 10, 'bar') AS b
    expect: rows
    comment: the width argument is taken from a positional reference
  - sql: |
      SELECT format('|%3s|', 'toolongvalue') AS a
    expect: rows
    comment: a too-small width is ignored and the value is not truncated
  - sql: |
      SELECT format('%s') AS x
    expect: error
    sqlstate: "22023"
    comment: a format with more specifiers than arguments is an error
