# substring, substr and the SQL FROM/FOR, POSIX regex and SIMILAR forms.
id: doc-functions-string.substring-forms
title: substring supports FROM/FOR, a regex pattern, SIMILAR patterns, and substr matches it
family: doc-functions-string
tier: core
feature_ids: [substring, substr, from-for, similar-to, posix-regex]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-sql (substring) and functions-string-other (substr)"
sessions: [a]
steps:
  - sql: |
      SELECT substring('Thomas' from 2 for 3) AS a, substring('Thomas' from 3) AS b, substring('Thomas' for 2) AS c
    expect: rows
  - sql: |
      SELECT substring('Thomas' from '...$') AS posix, substring('Thomas' similar '%#"o_a#"_' escape '#') AS similar
    expect: rows
    comment: the POSIX form returns the first match; the SIMILAR form returns the part inside the escaped quotes
  - sql: |
      SELECT substr('alphabet', 3) AS a, substr('alphabet', 3, 2) AS b
    expect: rows
  - sql: |
      SELECT substring('Thomas' from 'xyz') IS NULL AS no_match_null
    expect: rows
    comment: a POSIX pattern with no match yields NULL
