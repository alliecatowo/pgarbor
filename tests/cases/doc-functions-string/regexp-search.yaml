# regexp_like, regexp_match, regexp_count, regexp_instr and regexp_substr with the documented examples.
id: doc-functions-string.regexp-search
title: regexp search functions report matches, counts, positions, and captured subexpressions
family: doc-functions-string
tier: core
feature_ids: [regexp-like, regexp-match, regexp-count, regexp-instr, regexp-substr, posix-regex, subexpression]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp-table (regexp_count, regexp_instr, regexp_like, regexp_match, regexp_substr)"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_like('Hello World', 'world$', 'i') AS a, regexp_like('Hello World', 'world$') AS b
    expect: rows
    comment: the i flag makes the match case-insensitive, without it the pattern does not match
  - sql: |
      SELECT regexp_match('foobarbequebaz', '(bar)(beque)') AS a
    expect: rows
    comment: the result is the array of captured groups for the first match
  - sql: |
      SELECT regexp_count('123456789012', '\d\d\d', 2) AS a, regexp_count('abcabc', 'b') AS b
    expect: rows
    comment: the start argument skips the earlier characters
  - sql: |
      SELECT regexp_instr('ABCDEF', 'c(.)(..)', 1, 1, 0, 'i') AS a, regexp_instr('ABCDEF', 'c(.)(..)', 1, 1, 0, 'i', 2) AS b, regexp_instr('ABCDEF', 'zz') AS none
    expect: rows
    comment: the seventh argument selects a subexpression position; no match gives zero
  - sql: |
      SELECT regexp_substr('ABCDEF', 'c(.)(..)', 1, 1, 'i') AS a, regexp_substr('ABCDEF', 'c(.)(..)', 1, 1, 'i', 2) AS b, regexp_substr('ABCDEF', 'zz') IS NULL AS none
    expect: rows
    comment: regexp_substr returns NULL when nothing matches
