# format with %s, %I, %L, positional arguments and the %% escape.
id: doc-functions-string.format-basic-identifiers
title: format substitutes %s, %I and %L placeholders, positional references, and literal percent signs
family: doc-functions-string
tier: core
feature_ids: [format, format-s, format-i, format-l, positional-args, percent-escape]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-format (format examples)"
sessions: [a]
steps:
  - sql: |
      SELECT format('Hello %s', 'World') AS a, format('Testing %s, %s, %s, %%', 'one', 'two', 'three') AS b
    expect: rows
  - sql: |
      SELECT format('INSERT INTO %I VALUES(%L)', 'Foo bar', E'O\'Reilly') AS a, format('INSERT INTO %I VALUES(%L)', 'locations', 'C:\Program Files') AS b
    expect: rows
    comment: "%I quotes identifiers only when needed; %L doubles single quotes"
  - sql: |
      SELECT format('Testing %3$s, %2$s, %1$s', 'one', 'two', 'three') AS a, format('Testing %3$s, %2$s, %s', 'one', 'two', 'three') AS b, format('%1$s %1$s', 'x') AS c
    expect: rows
    comment: positional references can repeat and can be mixed with sequential ones, and unused arguments are allowed
  - sql: |
      SELECT format('%s|%s', NULL::text, 1) AS a, format('%L', NULL::text) AS b
    expect: rows
    comment: a NULL %s is an empty string and a NULL %L is the unquoted word NULL
  - sql: |
      SELECT format('%I', NULL::text) AS x
    expect: error
    sqlstate: "22004"
    comment: "%I cannot format NULL"
