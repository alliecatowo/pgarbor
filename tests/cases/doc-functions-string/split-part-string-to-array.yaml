# split_part and string_to_array: field indexing, negative indexes, NULL and empty delimiters, and null_string.
id: doc-functions-string.split-part-string-to-array
title: split_part indexes fields from either end and string_to_array maps the null_string to NULL
family: doc-functions-string
tier: core
feature_ids: [split-part, string-to-array, null-string, null-delimiter, empty-delimiter]
required_capabilities: [select, arrays]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (split_part, string_to_array)"
sessions: [a]
steps:
  - sql: |
      SELECT split_part('abc~@~def~@~ghi', '~@~', 2) AS a, split_part('abc,def,ghi,jkl', ',', -2) AS b, split_part('a~@~b', '~@~', 5) AS past_end
    expect: rows
    comment: an index past the last field yields the empty string
  - sql: |
      SELECT string_to_array('xx~~yy~~zz', '~~', 'yy')::text AS a, string_to_array('abc', NULL)::text AS b, string_to_array('abc', '')::text AS c
    expect: rows
    comment: a NULL delimiter splits into characters, an empty delimiter keeps the whole string as one field
  - sql: |
      SELECT array_length(string_to_array('xx~~yy~~zz', '~~', 'yy'), 1) AS len, string_to_array('xx~~yy~~zz', '~~', 'yy')[2] IS NULL AS second_null
    expect: rows
    comment: the null_string match becomes a real NULL element
