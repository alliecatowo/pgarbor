# lower, upper, initcap and casefold on ASCII input and NULL.
id: doc-functions-string.case-conversion
title: lower, upper and initcap convert case and initcap capitalises alphanumeric words only
family: doc-functions-string
tier: core
feature_ids: [lower, upper, initcap, casefold, null-semantics]
required_capabilities: [select, null-semantics]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-sql (lower, upper) and functions-string-other (initcap, casefold)"
sessions: [a]
steps:
  - sql: |
      SELECT lower('TOM') AS a, upper('tom') AS b, initcap('hi THOMAS') AS c
    expect: rows
  - sql: |
      SELECT initcap('hello world-wide_web 3rd') AS words
    expect: rows
    comment: words are alphanumeric runs separated by any non-alphanumeric character, so the hyphen and underscore start new words
  - sql: |
      SELECT casefold('ABC') AS folded, lower(NULL::text) IS NULL AS lower_null, upper(NULL::text) IS NULL AS upper_null
    expect: rows
    comment: casefold of plain ASCII lowercases; the NULL checks confirm strict behaviour
