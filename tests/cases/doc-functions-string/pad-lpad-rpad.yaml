# lpad and rpad: fill cycling, truncation when the string is longer, and an empty fill string.
id: doc-functions-string.pad-lpad-rpad
title: lpad and rpad fill with a repeated pattern and truncate strings longer than the target length
family: doc-functions-string
tier: core
feature_ids: [lpad, rpad, padding, truncation]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (lpad, rpad)"
sessions: [a]
steps:
  - sql: |
      SELECT lpad('hi', 5, 'xy') AS a, rpad('hi', 5, 'xy') AS b
    expect: rows
    comment: fill characters are repeated and cut to length
  - sql: |
      SELECT lpad('hi', 5) AS a, rpad('hi', 5) AS b, lpad('hi', 5, '') AS empty_fill
    expect: rows
    comment: default fill is a space; an empty fill leaves the string unchanged
  - sql: |
      SELECT lpad('hello', 3) AS a, rpad('hello', 3) AS b
    expect: rows
    comment: a longer string is truncated on the right
  - sql: |
      SELECT lpad(NULL::text, 3) IS NULL AS a, rpad('ab', NULL::int) IS NULL AS b
    expect: rows
    comment: NULL in any argument gives NULL
