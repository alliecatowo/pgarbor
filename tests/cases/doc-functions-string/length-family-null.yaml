# length, char_length, octet_length and bit_length, including the blank-padding difference for character(n).
id: doc-functions-string.length-family-null
title: length functions count characters, bytes and bits, and character(n) keeps padding only for octet_length
family: doc-functions-string
tier: core
feature_ids: [length, char-length, character-length, octet-length, bit-length, blank-padding, null-semantics]
required_capabilities: [select, null-semantics]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-sql (bit_length, char_length, length, octet_length)"
sessions: [a]
steps:
  - sql: |
      SELECT bit_length('jose') AS bits, length('jose') AS len, char_length('jose') AS cl, character_length('jose') AS chl
    expect: rows
    comment: ASCII input, so characters and octets agree; bit_length is eight times octet_length
  - sql: |
      SELECT octet_length('abc '::character(4)) AS oc_char, octet_length(('abc '::character(4))::text) AS oc_text, length('abc '::character(4)) AS len_char
    expect: rows
    comment: octet_length on character keeps the padding, while converting to text strips trailing spaces
  - sql: |
      SELECT length(NULL::text) IS NULL AS a, octet_length(NULL::text) IS NULL AS b, bit_length(NULL::text) IS NULL AS c
    expect: rows
  - sql: |
      SELECT length('') AS empty_len, octet_length('') AS empty_oct
    expect: rows
