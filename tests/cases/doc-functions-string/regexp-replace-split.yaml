# regexp_replace with start, N and g; regexp_split_to_array and regexp_split_to_table; regexp_matches with g.
id: doc-functions-string.regexp-replace-split
title: regexp_replace selects matches by occurrence and flag, and regexp split functions break strings on a pattern
family: doc-functions-string
tier: core
feature_ids: [regexp-replace, regexp-split, regexp-matches, global-flag, named-arguments]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-posix-regexp-table (regexp_replace, regexp_split_to_array, regexp_split_to_table, regexp_matches)"
sessions: [a]
steps:
  - sql: |
      SELECT regexp_replace('Thomas', '.[mN]a.', 'M') AS a, regexp_replace('Thomas', '.', 'X', 3, 2) AS b
    expect: rows
    comment: without g only the first match is replaced; with start 3 and N 2 the second match from position 3 is replaced
  - sql: |
      SELECT regexp_replace(string=>'hello world', pattern=>'l', replacement=>'XX', start=>1, "N"=>2) AS a, regexp_replace('abcabc', 'b', 'X', 'g') AS b
    expect: rows
    comment: named arguments can be used, and the g flag replaces every match
  - sql: |
      SELECT regexp_split_to_array('hello world', '\s+') AS a
    expect: rows
  - sql: |
      SELECT t FROM regexp_split_to_table('hello world', '\s+') AS t
    expect: rows
    order: multiset
  - sql: |
      SELECT m FROM regexp_matches('foobarbequebaz', 'ba.', 'g') AS m
    expect: rows
    order: multiset
    comment: with g every match is returned as its own row of captured groups
