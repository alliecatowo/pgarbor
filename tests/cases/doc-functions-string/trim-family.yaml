# btrim, ltrim, rtrim and the SQL trim syntax, with documented examples.
id: doc-functions-string.trim-family
title: btrim, ltrim, rtrim and SQL trim remove the longest run of listed characters at each end
family: doc-functions-string
tier: core
feature_ids: [btrim, ltrim, rtrim, trim, trim-syntax-variants]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-sql (btrim, ltrim, rtrim, trim)"
sessions: [a]
steps:
  - sql: |
      SELECT btrim('xyxtrimyyx', 'xyz') AS a, ltrim('zzzytest', 'xyz') AS b, rtrim('testxxzx', 'xyz') AS c
    expect: rows
  - sql: |
      SELECT trim(both 'xyz' from 'yxTomxx') AS a, trim(both from 'yxTomxx', 'xyz') AS b
    expect: rows
    comment: both forms of trim with an explicit character set
  - sql: |
      SELECT trim(leading 'xyz' from 'yxTomxx') AS lead, trim(trailing 'xyz' from 'yxTomxx') AS trail
    expect: rows
  - sql: |
      SELECT '[' || trim('   padded   ') || ']' AS default_space, btrim('xxxx', 'x') = '' AS all_trimmed
    expect: rows
    comment: the default character set is a space; trimming a string made only of trimmed characters gives the empty string
  - sql: |
      SELECT trim(both 'xyz' from 'yxTomxx') IS NULL AS null_check, trim(both NULL::text from 'abc') IS NULL AS null_chars
    expect: rows
    comment: a NULL argument makes the result NULL
