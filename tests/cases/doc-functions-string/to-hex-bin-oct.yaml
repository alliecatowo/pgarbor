# to_hex, to_bin and to_oct render two's complement representations, including negative numbers.
id: doc-functions-string.to-hex-bin-oct
title: to_hex, to_bin and to_oct give two's complement digits for integer and bigint arguments
family: doc-functions-string
tier: core
feature_ids: [to-hex, to-bin, to-oct, twos-complement, bigint]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (to_bin, to_hex, to_oct)"
sessions: [a]
steps:
  - sql: |
      SELECT to_hex(2147483647) AS a, to_hex(-1234) AS b, to_oct(2147483647) AS c, to_oct(-1234) AS d
    expect: rows
  - sql: |
      SELECT to_bin(2147483647) AS a, to_bin(-1234) AS b
    expect: rows
  - sql: |
      SELECT to_hex(-1::bigint) AS a, to_bin(0) AS b, to_oct(0::bigint) AS c
    expect: rows
    comment: the bigint overloads produce 64-bit two's complement digits, so -1 is sixteen f characters
