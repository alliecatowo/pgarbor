# String concatenation operator and concat/concat_ws NULL handling, per the string functions table.
id: doc-functions-string.concat-operators-null
title: concat operators accept non-strings and concat functions skip NULL arguments
family: doc-functions-string
tier: core
feature_ids: [concat-operator, concat-function, concat-ws, variadic, null-semantics]
required_capabilities: [select, null-semantics]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string (string concatenation, concat, concat_ws)"
sessions: [a]
steps:
  - sql: |
      SELECT 'Post' || 'greSQL' AS a, 'Value: ' || 42 AS b, 42 || ' items' AS c
    expect: rows
  - sql: |
      SELECT concat('abcde', 2, NULL, 22) AS a, concat_ws(',', 'abcde', 2, NULL, 22) AS b
    expect: rows
    comment: "concat ignores NULL arguments; concat_ws skips NULL separated fields"
  - sql: |
      SELECT ('abc' || NULL::text) IS NULL AS op_null, concat(NULL::text) = '' AS concat_only_null
    expect: rows
    comment: the || operator propagates NULL, while concat of a single NULL yields an empty string
  - sql: |
      SELECT concat(VARIADIC NULL::text[]) IS NULL AS a, concat_ws(',', VARIADIC NULL::text[]) IS NULL AS b
    expect: rows
    comment: a NULL variadic array makes concat and concat_ws return NULL
  - sql: |
      SELECT concat(VARIADIC ARRAY['x', NULL, 'z']::text[]) AS a, concat_ws('-', VARIADIC ARRAY['x', NULL, 'z']::text[]) AS b
    expect: rows
    comment: array elements are treated as ordinary arguments, so NULL elements are skipped
