# ascii and chr, the chr(0) error, and the prefix operator and starts_with.
id: doc-functions-string.ascii-chr-prefix
title: ascii and chr map characters to code points and reject NUL, and starts_with matches prefixes
family: doc-functions-string
tier: core
feature_ids: [ascii, chr, starts-with, prefix-operator, null-character]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (ascii, chr, starts_with, ^@)"
sessions: [a]
steps:
  - sql: |
      SELECT ascii('x') AS a, chr(65) AS b, ascii('') AS c
    expect: rows
    comment: ascii of the empty string is zero
  - sql: |
      SELECT 'alphabet' ^@ 'alph' AS a, starts_with('alphabet', 'alph') AS b, starts_with('alphabet', 'bet') AS c
    expect: rows
  - sql: |
      SELECT starts_with(NULL::text, 'a') IS NULL AS null_s
    expect: rows
  - sql: |
      SELECT chr(0) AS x
    expect: error
    sqlstate: "54000"
    comment: text cannot store the NUL character
