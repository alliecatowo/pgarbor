# replace replaces every occurrence; translate maps characters one-to-one and deletes extra from-characters.
id: doc-functions-string.replace-translate
title: replace swaps all occurrences and translate deletes from-characters that have no counterpart
family: doc-functions-string
tier: core
feature_ids: [replace, translate, character-mapping]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (replace, translate)"
sessions: [a]
steps:
  - sql: |
      SELECT replace('abcdefabcdef', 'cd', 'XX') AS a, translate('12345', '143', 'ax') AS b
    expect: rows
    comment: translate maps 1->a, 4->(none, so deleted), 3->x
  - sql: |
      SELECT replace('aaa', 'a', '') AS removed, translate('abc', 'abc', 'xy') AS short_to
    expect: rows
    comment: translate deletes c because the to set is shorter than the from set
  - sql: |
      SELECT replace(NULL::text, 'a', 'b') IS NULL AS null_s, translate('abc', NULL::text, 'x') IS NULL AS null_from
    expect: rows
