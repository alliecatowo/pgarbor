# overlay defaults and documented examples; position and strpos are the same search in reversed argument order.
id: doc-functions-string.overlay-position-strpos
title: overlay replaces a span with a default count and position/strpos return 1-based indexes or zero
family: doc-functions-string
tier: core
feature_ids: [overlay, position, strpos, placing-from-for]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-sql (overlay, position) and functions-string-other (strpos)"
sessions: [a]
steps:
  - sql: |
      SELECT overlay('Txxxxas' placing 'hom' from 2 for 4) AS a, overlay('abcdef' placing 'XY' from 3) AS b
    expect: rows
    comment: when FOR is omitted the count defaults to the length of the replacement, so b replaces two characters
  - sql: |
      SELECT position('om' in 'Thomas') AS a, strpos('high', 'ig') AS b, position('zz' in 'Thomas') AS missing
    expect: rows
    comment: a missing substring gives zero
  - sql: |
      SELECT strpos('abc', 'a') AS first, strpos('abcabc', 'bc') AS first_bc
    expect: rows
    comment: the index returned is of the first occurrence
