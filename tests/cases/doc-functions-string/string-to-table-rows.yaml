# string_to_table: the set-returning counterpart of string_to_array, with NULL and empty delimiters.
id: doc-functions-string.string-to-table-rows
title: string_to_table returns one row per field and maps the null_string to NULL
family: doc-functions-string
tier: core
feature_ids: [string-to-table, set-returning, null-string, null-delimiter]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (string_to_table)"
sessions: [a]
steps:
  - sql: |
      SELECT t FROM string_to_table('xx~^~yy~^~zz', '~^~', 'yy') AS t
    expect: rows
    order: multiset
    comment: the middle field matches null_string and comes back as NULL
  - sql: |
      SELECT t FROM string_to_table('abc', NULL) AS t
    expect: rows
    order: multiset
    comment: a NULL delimiter yields one row per character
  - sql: |
      SELECT count(*) AS n FROM string_to_table('abc', '') AS t
    expect: rows
    comment: an empty delimiter treats the whole string as a single field
