# quote_ident, quote_literal and quote_nullable, including NULL and non-text input.
id: doc-functions-string.quote-functions
title: quote_ident, quote_literal and quote_nullable quote identifiers and literals and handle NULL differently
family: doc-functions-string
tier: core
feature_ids: [quote-ident, quote-literal, quote-nullable, escaping]
required_capabilities: [select, null-semantics]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-string-other (quote_ident, quote_literal, quote_nullable)"
sessions: [a]
steps:
  - sql: |
      SELECT quote_ident('Foo bar') AS a, quote_ident('abc') AS b, quote_ident('Abc') AS c
    expect: rows
    comment: quotes are added only when needed, which includes mixed case
  - sql: |
      SELECT quote_literal(E'O\'Reilly') AS a, quote_literal(42.5) AS b, quote_literal(NULL::text) IS NULL AS c
    expect: rows
    comment: quote_literal returns NULL for NULL input
  - sql: |
      SELECT quote_nullable(NULL::text) AS a, quote_nullable(42.5) AS b, quote_nullable(E'a\\b') AS c
    expect: rows
    comment: quote_nullable returns the unquoted word NULL for a NULL argument
