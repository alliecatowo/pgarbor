# avg/sum/max over a small float4 and int2 table, plus stddev/var computed on numeric for exact output.
id: aggregates.numeric-avg-stddev-table
title: avg, sum, max over int2 and float4 columns with NULL rows, and exact numeric variance
family: aggregates
tier: core
feature_ids: [aggregates, avg, sum, max, stddev, variance, numeric, float4, nulls]
required_capabilities: [create-table, insert, select, aggregates, numeric, float]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
setup: |
  CREATE TABLE aggtest (a int2, b float4);
  INSERT INTO aggtest VALUES (1, 1.5), (2, 2.5), (3, 4.0), (NULL, NULL);
steps:
  - sql: |
      SELECT avg(a), sum(a), max(a), sum(b), avg(b)::numeric(10,3) FROM aggtest
    expect: rows
  - sql: |
      SELECT stddev_pop(b::numeric), stddev_samp(b::numeric), var_pop(b::numeric), var_samp(b::numeric) FROM aggtest
    expect: rows
    comment: numeric arithmetic keeps the result exact and portable
  - sql: |
      SELECT max(aggtest.b), min(aggtest.a) FROM aggtest WHERE a IS NOT NULL
    expect: rows
