# sum/avg/var over infinite and NaN inputs follow IEEE rules (inf - inf and NaN propagate).
id: aggregates.float-nan-infinity
title: sum, avg and var_pop over infinity and NaN inputs for float8 and numeric
family: aggregates
tier: extended
feature_ids: [aggregates, float8, numeric, nan, infinity]
required_capabilities: [select, aggregates, float, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
steps:
  - sql: |
      SELECT sum(x::float8), avg(x::float8), var_pop(x::float8) FROM (VALUES ('1'), ('infinity')) AS v(x)
    expect: rows
  - sql: |
      SELECT sum(x::float8), avg(x::float8), var_pop(x::float8) FROM (VALUES ('infinity'), ('-infinity')) AS v(x)
    expect: rows
    comment: inf plus -inf is NaN
  - sql: |
      SELECT sum(x::float8), avg(x::float8), var_pop(x::float8) FROM (VALUES ('-infinity'), ('-infinity')) AS v(x)
    expect: rows
  - sql: |
      SELECT sum(x::numeric), avg(x::numeric), var_pop(x::numeric) FROM (VALUES ('1'), ('infinity')) AS v(x)
    expect: rows
    comment: numeric supports Infinity since PG14
  - sql: |
      SELECT sum(x), avg(x) FROM (VALUES ('NaN'::numeric), (1::numeric)) AS v(x)
    expect: rows
    comment: NaN propagates through sum and avg
  - sql: |
      SELECT avg('NaN'::numeric) FROM generate_series(1,3)
    expect: rows
