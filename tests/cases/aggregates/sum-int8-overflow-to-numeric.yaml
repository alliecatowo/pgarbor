# sum(int8) widens to numeric instead of overflowing; sum(int4) widens to int8.
id: aggregates.sum-int8-overflow-to-numeric
title: sum(int8) past bigint range yields numeric, sum(int4) past int4 range yields int8
family: aggregates
tier: core
feature_ids: [aggregates, sum, int8, numeric, boundaries]
required_capabilities: [select, aggregates, types]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
steps:
  - sql: |
      SELECT sum(x), pg_typeof(sum(x))::text FROM (VALUES (9223372036854775807::int8), (1::int8)) AS v(x)
    expect: rows
    comment: result 9223372036854775808 as numeric, no overflow error
  - sql: |
      SELECT sum(x), pg_typeof(sum(x))::text FROM (VALUES (2147483647), (2147483647)) AS v(x)
    expect: rows
    comment: int4 inputs, int8 result 4294967294
  - sql: |
      SELECT sum(x) FROM (VALUES ('-9223372036854775808'::int8), (-1::int8)) AS v(x)
    expect: rows
    comment: negative bigint boundary; the literal is quoted because unquoted -9223372036854775808::int8 overflows before sum runs, result -9223372036854775809 as numeric
