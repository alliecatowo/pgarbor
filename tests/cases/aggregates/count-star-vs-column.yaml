# count(*) counts rows, count(expr) skips NULLs, count(DISTINCT) skips NULLs, FILTER restricts input.
id: aggregates.count-star-vs-column
title: count(*) vs count(column), DISTINCT and FILTER over NULL-bearing rows and empty input
family: aggregates
tier: slice
feature_ids: [aggregates, count, nulls, filter-clause]
required_capabilities: [create-table, insert, select, aggregates, filter-clause]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (1, 10), (2, NULL), (3, 30), (4, NULL), (5, 10);
steps:
  - sql: |
      SELECT count(*), count(v), count(DISTINCT v) FROM t
    expect: rows
  - sql: |
      SELECT count(*), count(v) FROM t WHERE false
    expect: rows
    comment: empty input, count returns 0 not NULL
  - sql: |
      SELECT count(v) FILTER (WHERE id > 2), count(*) FILTER (WHERE v IS NULL) FROM t
    expect: rows
