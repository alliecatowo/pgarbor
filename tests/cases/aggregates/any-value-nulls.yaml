# any_value returns a non-NULL input if one exists, and NULL otherwise. Only one non-NULL input is used so the result is deterministic.
id: aggregates.any-value-nulls
title: any_value skips NULLs and returns NULL when every input is NULL
family: aggregates
tier: core
feature_ids: [aggregates, any-value, nulls, arrays]
required_capabilities: [select, aggregates, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
steps:
  - sql: |
      SELECT any_value(v) FROM (VALUES (NULL::int4), (7), (NULL::int4)) AS t(v)
    expect: rows
    comment: exactly one non-NULL input, so the result is 7
  - sql: |
      SELECT any_value(v) FROM (VALUES (NULL::int4)) AS t(v)
    expect: rows
  - sql: |
      SELECT any_value(v) FROM (VALUES (1), (2), (3)) AS t(v) WHERE false
    expect: rows
    comment: zero rows gives NULL
  - sql: |
      SELECT any_value(v) FROM (VALUES (array['hello', 'world'])) AS t(v)
    expect: rows
