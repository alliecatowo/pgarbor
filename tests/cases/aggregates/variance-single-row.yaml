# Population variance is defined for one row; sample variance needs at least two and is NULL otherwise.
id: aggregates.variance-single-row
title: var_pop and stddev_pop defined for a single row, var_samp and stddev_samp NULL
family: aggregates
tier: core
feature_ids: [aggregates, variance, stddev, float8, float4, numeric, nulls]
required_capabilities: [select, aggregates, float, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
steps:
  - sql: |
      SELECT var_pop(1.0::float8), var_samp(2.0::float8)
    expect: rows
  - sql: |
      SELECT stddev_pop(3.0::float8), stddev_samp(4.0::float8)
    expect: rows
  - sql: |
      SELECT var_pop(1.0::float4), var_samp(2.0::float4)
    expect: rows
  - sql: |
      SELECT stddev_pop(3.0::numeric), stddev_samp(4.0::numeric)
    expect: rows
  - sql: |
      SELECT var_pop(x::float8), var_samp(x::float8), stddev_samp(x::float8) FROM generate_series(1,0) AS g(x)
    expect: rows
    comment: zero rows; all three aggregates return NULL
