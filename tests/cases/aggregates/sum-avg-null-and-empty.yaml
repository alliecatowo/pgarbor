# sum/avg/min/max over all-NULL input and over zero rows return NULL, not zero.
id: aggregates.sum-avg-null-and-empty
title: sum, avg, min, max return NULL for all-NULL and empty inputs
family: aggregates
tier: core
feature_ids: [aggregates, sum, avg, nulls, numeric]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
setup: |
  CREATE TABLE n (x int4);
  INSERT INTO n VALUES (NULL), (NULL);
steps:
  - sql: |
      SELECT sum(x), avg(x), min(x), max(x), count(x) FROM n
    expect: rows
    comment: all-NULL input; count(x) is 0
  - sql: |
      SELECT sum(x) FROM n WHERE false
    expect: rows
  - sql: |
      SELECT sum(null::int4), sum(null::int8), sum(null::numeric), sum(null::float8) FROM generate_series(1,3)
    expect: rows
  - sql: |
      SELECT avg(null::int4), avg(null::int8), avg(null::numeric), avg(null::float8) FROM generate_series(1,3)
    expect: rows
