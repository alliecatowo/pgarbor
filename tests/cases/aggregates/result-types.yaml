# Result data types of sum and avg depend on the input type (int2/int4 -> int8, int8 -> numeric, float4 -> float4/float8).
id: aggregates.result-types
title: sum and avg result types per input type
family: aggregates
tier: core
feature_ids: [aggregates, sum, avg, types, catalog-introspection]
required_capabilities: [select, aggregates, types]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/aggregates.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_typeof(sum(x::int2))::text, pg_typeof(sum(x::int4))::text, pg_typeof(sum(x::int8))::text, pg_typeof(sum(x::float4))::text, pg_typeof(sum(x::numeric))::text FROM generate_series(1,3) AS g(x)
    expect: rows
  - sql: |
      SELECT pg_typeof(avg(x::int2))::text, pg_typeof(avg(x::int4))::text, pg_typeof(avg(x::int8))::text, pg_typeof(avg(x::float4))::text, pg_typeof(avg(x::float8))::text FROM generate_series(1,3) AS g(x)
    expect: rows
  - sql: |
      SELECT sum(x::int2), sum(x::int4), sum(x::int8), avg(x::int2), avg(x::int8) FROM generate_series(1,3) AS g(x)
    expect: rows
    comment: sum(1,2,3)=6, avg=2.0000000000000000 (numeric)
