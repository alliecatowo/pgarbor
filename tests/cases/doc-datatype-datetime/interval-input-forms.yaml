# Documented: interval input accepts the verbose PostgreSQL form with optional ago, SQL standard year-month and day-time forms, and ISO 8601 designator and alternative forms. Each documented example equals its canonical value.
id: doc-datatype-datetime.interval-input-forms
title: Verbose, SQL standard and ISO 8601 interval inputs equal their canonical values
family: doc-datatype-datetime
tier: core
feature_ids: [interval-type, interval-input, iso8601-interval, sql-standard-interval]
required_capabilities: [select, interval]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-input (Interval Input table; ISO 8601 designator and alternative forms; ago negates all fields)"
sessions: [a]
steps:
  - sql: |
      SELECT '1-2'::interval = interval '1 year 2 months' AS sql_year_month,
             '3 4:05:06'::interval = interval '3 days 4 hours 5 minutes 6 seconds' AS sql_day_time,
             '1 year 2 months 3 days 4 hours 5 minutes 6 seconds'::interval = interval '1 year 2 months 3 days 4 hours 5 minutes 6 seconds' AS verbose,
             'P1Y2M3DT4H5M6S'::interval = interval '1 year 2 months 3 days 4 hours 5 minutes 6 seconds' AS iso_designators,
             'P0001-02-03T04:05:06'::interval = interval '1 year 2 months 3 days 4 hours 5 minutes 6 seconds' AS iso_alternative
    expect: rows
    comment: "all five are true"
  - sql: |
      SELECT '@ 1 year 2 mons -3 days 4 hours 5 mins 6 secs ago'::interval = interval '-1 year -2 months 3 days -04:05:06' AS verbose_ago,
             '1 12:59:10'::interval = interval '1 day 12 hours 59 min 10 sec' AS days_without_unit,
             '200-10'::interval = interval '200 years 10 months' AS years_months_dash
    expect: rows
    comment: "ago negates every field; shorthand forms equal their spelled-out values"
