# Documented: IntervalStyle selects one of sql_standard, postgres, postgres_verbose and iso_8601 for output. Mixed-sign intervals show explicit signs in sql_standard output.
id: doc-datatype-datetime.interval-output-styles
title: IntervalStyle output styles for year-month, day-time and mixed intervals
family: doc-datatype-datetime
tier: extended
feature_ids: [interval-type, interval-output, intervalstyle]
required_capabilities: [select, interval, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-output (Interval Output Style Examples table)"
sessions: [a]
steps:
  - sql: |
      SET intervalstyle TO 'sql_standard'
    expect: ok
  - sql: |
      SELECT interval '1 year 2 months' AS year_month,
             interval '3 days 4 hours 5 minutes 6 seconds' AS day_time,
             interval '-1 year -2 months 3 days -04:05:06' AS mixed
    expect: rows
    comment: "sql_standard: year-month, day-time and mixed forms with explicit signs"
  - sql: |
      SET intervalstyle TO 'postgres'
    expect: ok
  - sql: |
      SELECT interval '1 year 2 months' AS year_month,
             interval '3 days 4 hours 5 minutes 6 seconds' AS day_time,
             interval '-1 year -2 months 3 days -04:05:06' AS mixed
    expect: rows
  - sql: |
      SET intervalstyle TO 'postgres_verbose'
    expect: ok
  - sql: |
      SELECT interval '1 year 2 months' AS year_month,
             interval '3 days 4 hours 5 minutes 6 seconds' AS day_time,
             interval '-1 year -2 months 3 days -04:05:06' AS mixed
    expect: rows
  - sql: |
      SET intervalstyle TO 'iso_8601'
    expect: ok
  - sql: |
      SELECT interval '1 year 2 months' AS year_month,
             interval '3 days 4 hours 5 minutes 6 seconds' AS day_time,
             interval '-1 year -2 months 3 days -04:05:06' AS mixed
    expect: rows
    comment: "iso_8601 uses designator form"
