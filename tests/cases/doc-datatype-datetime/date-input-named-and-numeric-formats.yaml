# Documented: the date input table lists ISO, named-month, basic, ordinal, Julian and BC forms. Each unambiguous example reads as the same calendar date.
id: doc-datatype-datetime.date-input-named-and-numeric-formats
title: Documented date input formats all read as the documented calendar date
family: doc-datatype-datetime
tier: core
feature_ids: [date-type, date-input, date-formats, julian-date]
required_capabilities: [select, date-type]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-input (Dates: Date Input table)"
sessions: [a]
steps:
  - sql: |
      SELECT '1999-01-08'::date AS iso,
             'January 8, 1999'::date AS long_name,
             '1999-Jan-08'::date AS year_first_named,
             'Jan-08-1999'::date AS month_first_named,
             '08-Jan-1999'::date AS day_first_named,
             '19990108'::date AS iso_basic,
             '990108'::date AS iso_basic_short,
             '1999.008'::date AS year_and_day_of_year,
             'J2451187'::date AS julian,
             'January 8, 99 BC'::date AS year_99_bc
    expect: rows
    comment: "all forms except the BC one are January 8 1999"
