# Documented: epoch, infinity, -infinity and allballs are input shorthands. infinity and -infinity are stored specially and sort beyond every ordinary value. allballs means 00:00:00 UTC for time.
id: doc-datatype-datetime.special-date-time-values
title: Special inputs epoch, infinity, -infinity and allballs behave as documented
family: doc-datatype-datetime
tier: core
feature_ids: [special-values, epoch, infinity, allballs, date-type, timestamp-type]
required_capabilities: [select, date-type, interval, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-special-values (Special Date/Time Inputs table)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT 'epoch'::date AS epoch_date, 'epoch'::timestamp AS epoch_ts, 'epoch'::timestamptz AS epoch_tz
    expect: rows
    comment: "Unix time zero, 1970-01-01 00:00:00+00"
  - sql: |
      SELECT 'infinity'::date AS inf_date, '-infinity'::timestamp AS ninf_ts, 'infinity'::interval AS inf_iv, '-infinity'::timestamptz AS ninf_tz
    expect: rows
    comment: "infinity values are displayed unchanged"
  - sql: |
      SELECT 'infinity'::timestamp > timestamp '294276-12-31 23:59:59.999999' AS inf_above_max,
             '-infinity'::date < date '4713-11-24 BC' AS ninf_below_min,
             'infinity'::date = 'infinity'::date AS inf_equal_inf
    expect: rows
    comment: "infinity sorts beyond every ordinary value; these comparisons are true"
  - sql: |
      SELECT time 'allballs' AS allballs, time 'allballs' = time '00:00:00' AS same_as_midnight
    expect: rows
    comment: "allballs is 00:00:00 UTC for a time value"
