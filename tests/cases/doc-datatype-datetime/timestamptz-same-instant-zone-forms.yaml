# Documented: a time zone name, an abbreviation and a numeric offset can name the same instant. An abbreviation fixes one offset, while a full name can imply two. Zone names and abbreviations are case-insensitive. The ISO sign convention is positive east of Greenwich.
id: doc-datatype-datetime.timestamptz-same-instant-zone-forms
title: Zone names, abbreviations and numeric offsets resolve to instants as documented
family: doc-datatype-datetime
tier: core
feature_ids: [timestamptz-type, time-zone-input, time-zone-abbreviation, time-zone-name, iso-offset]
required_capabilities: [select, date-type, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-input (Time Zones: names, abbreviations, EDT vs EST example; ISO sign convention)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT '2014-06-04 12:00 America/New_York'::timestamptz = '2014-06-04 12:00 EDT'::timestamptz AS named_is_edt,
             '2014-06-04 12:00 EST'::timestamptz = '2014-06-04 12:00 EDT'::timestamptz AS est_is_not_edt,
             '2014-06-04 12:00+04'::timestamptz = '2014-06-04 08:00 UTC'::timestamptz AS iso_sign_east,
             '2014-06-04 12:00 edt'::timestamptz = '2014-06-04 12:00 EDT'::timestamptz AS abbrev_case_insensitive,
             '2014-06-04 12:00-04'::timestamptz = '2014-06-04 12:00 EDT'::timestamptz AS numeric_offset_same
    expect: rows
    comment: "true, false, true, true, true expected from the documented semantics"
  - sql: |
      SELECT '2014-06-04 12:00 EDT'::timestamptz AS utc_output
    expect: rows
    comment: "stored as UTC, displayed in the session zone"
