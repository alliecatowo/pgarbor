# Documented: the time input table lists ISO forms, AM/PM suffixes, numeric and named UTC offsets. A time without time zone silently ignores any zone given in the input.
id: doc-datatype-datetime.time-input-formats
title: Documented time input forms parse and time without time zone ignores the zone
family: doc-datatype-datetime
tier: core
feature_ids: [time-type, time-input, timetz-type, time-zone-input]
required_capabilities: [select, date-type]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-input (Times: Time Input table; time without time zone ignores a zone)"
sessions: [a]
steps:
  - sql: |
      SELECT '04:05:06.789'::time AS fractional,
             '04:05:06'::time AS full,
             '04:05'::time AS short,
             '040506'::time AS basic,
             '04:05 AM'::time AS am_suffix,
             '04:05 PM'::time AS pm_suffix,
             '12:30 PM'::time AS noon_hour
    expect: rows
    comment: "AM does not change the value, PM adds 12 hours up to hour 12"
  - sql: |
      SELECT '04:05:06 PST'::time AS zone_abbrev_ignored,
             '2003-04-12 04:05:06 America/New_York'::time AS date_and_zone_ignored
    expect: rows
    comment: "a zone on a time without time zone is ignored"
