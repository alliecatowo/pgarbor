# Documented: ambiguous slash-separated date input is read according to the DateStyle field ordering (MDY, DMY or YMD). Inputs that the active ordering cannot accept are rejected.
id: doc-datatype-datetime.date-input-datestyle-ordering
title: DateStyle ordering decides how ambiguous slash dates are read and rejects impossible ones
family: doc-datatype-datetime
tier: core
feature_ids: [date-type, date-input, datestyle, errors]
required_capabilities: [select, date-type, datestyle, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-input (Dates: date input examples; Date Order Conventions)"
sessions: [a]
steps:
  - sql: |
      SET datestyle TO 'ISO, MDY'
    expect: ok
  - sql: |
      SELECT '1/8/1999'::date AS a, '01/02/03'::date AS b
    expect: rows
    comment: "January 8 1999 and January 2 2003 in MDY"
  - sql: |
      SET datestyle TO 'ISO, DMY'
    expect: ok
  - sql: |
      SELECT '1/8/1999'::date AS a, '01/02/03'::date AS b
    expect: rows
    comment: "August 1 1999 and February 1 2003 in DMY"
  - sql: |
      SELECT '1/18/1999'::date
    expect: error
    sqlstate: "22008"
    comment: "month 18 cannot be read in DMY, so the input is rejected"
  - sql: |
      SET datestyle TO 'ISO, YMD'
    expect: ok
  - sql: |
      SELECT '01/02/03'::date AS c, '99-Jan-08'::date AS d
    expect: rows
    comment: "February 3 2001 in YMD, and 99-Jan-08 is January 8 1999 in YMD"
  - sql: |
      SET datestyle TO 'ISO, MDY'
    expect: ok
  - sql: |
      SELECT '99-Jan-08'::date
    expect: error
    sqlstate: "22008"
    comment: "two-digit year first is accepted only in YMD mode"
