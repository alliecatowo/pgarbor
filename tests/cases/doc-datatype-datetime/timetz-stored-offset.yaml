# Documented: time with time zone stores the UTC offset from the input and outputs it unchanged, including fractional-hour offsets. The documented extreme offsets are 00:00:00+1559 and 24:00:00-1559. Comparison semantics are not described in this section and are not asserted here.
id: doc-datatype-datetime.timetz-stored-offset
title: time with time zone keeps the input offset and accepts documented extreme offsets
family: doc-datatype-datetime
tier: extended
feature_ids: [timetz-type, time-zone-input, timetz-offset-output]
required_capabilities: [select, date-type]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime (time with time zone; Time Input examples; Date/Time Types table bounds)"
sessions: [a]
steps:
  - sql: |
      SELECT '04:05:06.789-8'::timetz AS numeric_offset,
             '04:05:06 PST'::timetz AS abbrev_offset,
             '040506+0730'::timetz AS fractional_hour_offset,
             '2003-04-12 04:05:06 America/New_York'::timetz AS named_zone_with_date
    expect: rows
    comment: "each offset is output as stored"
  - sql: |
      SELECT timetz '04:05:06-08' AS stored_offset, timetz '04:05:06-08' = timetz '04:05:06-08' AS identical
    expect: rows
    comment: "identical input values compare equal"
  - sql: |
      SELECT timetz '00:00:00+1559' AS low_bound, timetz '24:00:00-1559' AS high_bound
    expect: rows
    comment: "documented extreme offsets are accepted"
