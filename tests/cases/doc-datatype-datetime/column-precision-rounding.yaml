# Documented: a precision on a column type of time, timestamp or interval retains that many fractional digits of seconds, so stored values are rounded on insert.
id: doc-datatype-datetime.column-precision-rounding
title: Column precision rounds stored time, timestamp and interval values
family: doc-datatype-datetime
tier: core
feature_ids: [datetime-precision, time-type, timestamp-type, interval-type, table-columns]
required_capabilities: [create-table, insert, select, date-type, interval]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime (time, timestamp and interval accept an optional precision p)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE prec (id int PRIMARY KEY, t time(2), ts timestamp(0), iv interval(3))
    expect: ok
  - sql: |
      INSERT INTO prec VALUES
        (1, '12:00:00.126', '2020-02-29 23:59:59.5', '1 day 00:00:01.23456'),
        (2, '01:02:03.4', '2020-02-29 10:00:00.4', '2 hours 3.0004 seconds')
    expect: ok
  - sql: |
      SELECT id, t, ts, iv FROM prec ORDER BY id
    expect: rows
    order: ordered
    comment: "fractional seconds are rounded to the column precision; ts(0) carries into the next day"
