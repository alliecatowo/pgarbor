# Documented: time, timestamp and interval accept a precision p (0 to 6) for the seconds field. A typed literal with explicit precision rounds to it; a literal without precision keeps its own digits, capped at 6.
id: doc-datatype-datetime.literal-precision-rounding
title: Precision on typed literals rounds fractional seconds
family: doc-datatype-datetime
tier: core
feature_ids: [datetime-precision, timestamp-type, time-type, interval-type, literal-rounding]
required_capabilities: [select, date-type, interval]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime (Date/Time Types precision p; Constant Input: precision defaults to the literal value, but not more than 6 digits)"
sessions: [a]
steps:
  - sql: |
      SELECT timestamp(2) '2020-01-01 10:00:00.12345' AS ts2,
             time(0) '23:59:59.9' AS t0,
             time(2) '12:00:00.126' AS t2,
             interval(2) '1.23456 seconds' AS i2
    expect: rows
    comment: "explicit precision rounds; time(0) of 23:59:59.9 rounds up to 24:00:00"
  - sql: |
      SELECT time '01:02:03.45' AS lit_two_digits, time '01:02:03.4567891' AS lit_seven_digits
    expect: rows
    comment: "a literal without precision keeps its own digits, rounded to at most 6"
