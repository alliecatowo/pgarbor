# Documented: AT TIME ZONE converts between timestamp without time zone and timestamp with time zone. A timestamp without zone is read in the session zone unless AT TIME ZONE names another zone.
id: doc-datatype-datetime.timestamptz-at-time-zone
title: AT TIME ZONE converts between zone-less and zoned timestamps
family: doc-datatype-datetime
tier: core
feature_ids: [timestamptz-type, at-time-zone, time-zone-conversion]
required_capabilities: [select, date-type, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-timezones (Conversions between timestamp without and with time zone normally assume the session zone; AT TIME ZONE)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'Asia/Tokyo'
    expect: ok
  - sql: |
      SELECT timestamp '2001-02-16 20:38:40'::timestamptz AS read_in_session_zone
    expect: rows
    comment: "the zone-less value is taken as Tokyo local time"
  - sql: |
      SELECT timestamp '2001-02-16 20:38:40' AT TIME ZONE 'UTC' AS as_utc_instant
    expect: rows
    comment: "AT TIME ZONE on a zone-less value gives the instant in that zone"
  - sql: |
      SELECT timestamptz '2001-02-16 20:38:40-05' AT TIME ZONE 'America/Denver' AS denver_local
    expect: rows
    comment: "converts a zoned value to a zone-less local time in Denver"
  - sql: |
      SELECT timestamp '2001-02-16 20:38:40' AT TIME ZONE 'America/Denver' AS denver_instant
    expect: rows
    comment: "same input, interpreted in Denver, displayed in the session zone"
