# Documented: date ranges from 4713 BC to 5874897 AD, and timestamp ranges from 4713 BC to 294276 AD with microsecond resolution. Values one step past either bound are out of range.
id: doc-datatype-datetime.date-timestamp-range-boundaries
title: Documented date and timestamp range limits, inclusive at the top and bottom
family: doc-datatype-datetime
tier: core
feature_ids: [date-type, timestamp-type, range-limits, errors, boundaries]
required_capabilities: [select, date-type, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime (Date/Time Types table: low and high values, resolution)"
sessions: [a]
steps:
  - sql: |
      SELECT date '4713-11-24 BC' AS lowest_date, date '5874897-12-31' AS highest_date
    expect: rows
    comment: "documented extreme dates are accepted"
  - sql: |
      SELECT date '5874898-01-01'
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT timestamp '4713-11-24 00:00:00 BC' AS lowest_ts, timestamp '294276-12-31 23:59:59.999999' AS highest_ts
    expect: rows
    comment: "documented extreme timestamps with microsecond resolution are accepted"
  - sql: |
      SELECT timestamp '294277-01-01'
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT timestamp '4714-11-23 23:59:59 BC'
    expect: error
    sqlstate: "22008"
    comment: "one second before the lowest timestamp"
