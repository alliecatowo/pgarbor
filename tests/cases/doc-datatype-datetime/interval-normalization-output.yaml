# Documented: interval values are stored as months, days and microseconds. Weeks count as 7 days. Fractional years and months round to whole months, and fractional weeks and days convert with 30 days per month and 24 hours per day. Each signed field is read independently unless IntervalStyle says otherwise.
id: doc-datatype-datetime.interval-normalization-output
title: Interval normalization into months, days and microseconds, with fractional input rules
family: doc-datatype-datetime
tier: core
feature_ids: [interval-type, interval-normalization, interval-fractions, interval-output]
required_capabilities: [select, interval]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-input (Interval Input: internal storage, fractional units; example '2 years 15 months 100 weeks 99 hours 123456789 milliseconds')"
sessions: [a]
steps:
  - sql: |
      SELECT '2 years 15 months 100 weeks 99 hours 123456789 milliseconds'::interval AS normalized
    expect: rows
    comment: "documented output 3 years 3 mons 700 days 133:17:36.789"
  - sql: |
      SELECT '1.5 weeks'::interval AS weeks_fraction,
             '1.5 years'::interval AS years_fraction,
             '1.75 months'::interval AS months_fraction,
             '01:02:03.45'::interval AS seconds_fraction
    expect: rows
    comment: "1.5 years rounds to 1 year 6 mons; 1.75 months becomes 1 mon 22 days 12:00:00"
  - sql: |
      SELECT '-1 2:03:04'::interval AS mixed_sign
    expect: rows
    comment: "traditional reading: the day field is negative, the time part positive"
