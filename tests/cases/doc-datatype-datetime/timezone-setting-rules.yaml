# Documented: the TimeZone parameter accepts full zone names (case-insensitive), POSIX-style specifications and numeric offsets, but not time zone abbreviations. Abbreviations are still accepted in input values.
id: doc-datatype-datetime.timezone-setting-rules
title: TimeZone accepts names and offsets but rejects abbreviations, which still work in input
family: doc-datatype-datetime
tier: core
feature_ids: [time-zone-name, time-zone-abbreviation, guc, time-zone-input]
required_capabilities: [select, date-type, guc, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-timezones (Time Zones: you cannot set TimeZone to an abbreviation; abbreviations usable in input)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'PST8PDT'
    expect: ok
  - sql: |
      SET TIME ZONE 'america/new_york'
    expect: ok
    comment: "zone names are case-insensitive"
  - sql: |
      SET TIME ZONE '-8'
    expect: ok
    comment: "numeric offset form"
  - sql: |
      SET TIME ZONE 'PST'
    expect: error
    sqlstate: "22023"
    comment: "abbreviation cannot be used as the session zone"
  - sql: |
      SET TIME ZONE 'EST'
    expect: error
    sqlstate: "22023"
    comment: "EST also rejected as a session zone"
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT '2014-06-04 12:00 PST'::timestamptz AS abbrev_in_input
    expect: rows
    comment: "the abbreviation is valid in an input value"
