# Documented: a timestamp without time zone silently ignores any zone in its input and keeps the local fields. A timestamp with time zone converts an explicit zone to UTC. Literal type is decided by the explicit TIMESTAMP WITH TIME ZONE keyword, not by the string.
id: doc-datatype-datetime.timestamp-zone-handling
title: Timestamp without zone ignores input zone while timestamptz converts to UTC
family: doc-datatype-datetime
tier: core
feature_ids: [timestamp-type, timestamptz-type, time-zone-input, literal-type]
required_capabilities: [select, date-type, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-input (Time Stamps: timestamp without time zone ignores zone; TIMESTAMP WITH TIME ZONE literal)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT TIMESTAMP '2004-10-19 10:23:54' AS plain,
             TIMESTAMP '2004-10-19 10:23:54+02' AS zone_ignored,
             TIMESTAMP WITH TIME ZONE '2004-10-19 10:23:54+02' AS converted_to_utc
    expect: rows
    comment: "the first two are the same without-zone value; the third is 08:23:54 UTC"
  - sql: |
      SELECT pg_typeof(TIMESTAMP '2004-10-19 10:23:54+02')::text AS literal_type,
             pg_typeof(TIMESTAMP WITH TIME ZONE '2004-10-19 10:23:54+02')::text AS explicit_type
    expect: rows
    comment: "the string alone does not decide the type"
  - sql: |
      SELECT '2004-10-19 10:23:54 America/New_York'::timestamp AS name_ignored,
             timestamp without time zone '2004-10-19 10:23:54 PST' AS abbrev_ignored
    expect: rows
    comment: "zone names and abbreviations are ignored for timestamp without time zone"
