# Documented: time values range from 00:00:00 to 24:00:00 inclusive. Input outside that range, or an hour above 12 with PM, is a date/time field out of range error.
id: doc-datatype-datetime.time-range-and-pm-errors
title: Time range boundaries and out-of-range time inputs
family: doc-datatype-datetime
tier: core
feature_ids: [time-type, time-input, errors, boundaries]
required_capabilities: [select, date-type, errors]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime (Date/Time Types table: time low 00:00:00, high 24:00:00; Time Input: input hour must be <= 12 with PM)"
sessions: [a]
steps:
  - sql: |
      SELECT time '00:00:00' AS low, time '24:00:00' AS high
    expect: rows
    comment: "both documented boundaries are accepted"
  - sql: |
      SELECT time '24:00:01'
    expect: error
    sqlstate: "22008"
    comment: "one second past the high bound"
  - sql: |
      SELECT time '13:00 PM'
    expect: error
    sqlstate: "22008"
    comment: "hour above 12 is invalid with PM"
