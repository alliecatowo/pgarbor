# Documented: date/time output styles ISO, SQL, Postgres and German, with DMY or MDY field ordering, and the abbreviations shown for a named zone. date-only values in Postgres style are still ISO.
id: doc-datatype-datetime.timestamptz-datestyle-output
title: DateStyle output styles and field ordering for timestamptz and date values
family: doc-datatype-datetime
tier: core
feature_ids: [timestamptz-type, datestyle, date-output, time-zone-abbreviation]
required_capabilities: [select, date-type, datestyle, guc]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-datetime-output (Date/Time Output Styles; Date Order Conventions)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'America/Los_Angeles'
    expect: ok
  - sql: |
      SET DATESTYLE TO 'ISO, MDY'
    expect: ok
  - sql: |
      SELECT timestamptz '1997-12-17 07:37:16-08' AS iso_style
    expect: rows
  - sql: |
      SET DATESTYLE TO 'SQL, MDY'
    expect: ok
  - sql: |
      SELECT timestamptz '1997-12-17 07:37:16-08' AS sql_style
    expect: rows
    comment: "month before day, traditional style with abbreviation PST"
  - sql: |
      SET DATESTYLE TO 'Postgres, MDY'
    expect: ok
  - sql: |
      SELECT timestamptz '1997-12-17 07:37:16-08' AS postgres_style, date '1997-12-17' AS date_only
    expect: rows
    comment: "date-only values stay in ISO form in the POSTGRES style"
  - sql: |
      SET DATESTYLE TO 'German'
    expect: ok
  - sql: |
      SELECT timestamptz '1997-12-17 07:37:16-08' AS german_style
    expect: rows
  - sql: |
      SET TIME ZONE 'Europe/Paris'
    expect: ok
  - sql: |
      SET DATESTYLE TO 'SQL, DMY'
    expect: ok
  - sql: |
      SELECT timestamptz '1997-12-17 15:37:16+01' AS sql_dmy, date '1997-12-17' AS date_sql_dmy
    expect: rows
    comment: "day before month in SQL style with DMY ordering, zone shown as CET"
  - sql: |
      SET DATESTYLE TO 'Postgres, DMY'
    expect: ok
  - sql: |
      SELECT timestamptz '1997-12-17 15:37:16+01' AS postgres_dmy
    expect: rows
