# A materialized view created WITH NO DATA can be dropped; querying it before population is an error (55000).
id: cmd-drop-materialized-view.with-no-data-drop
title: DROP works on an unpopulated materialized view; querying it first fails with 55000
family: cmd-drop-materialized-view
tier: core
feature_ids: [drop-materialized-view, create-materialized-view, populate]
required_capabilities: [create-table, select, create-materialized-view, drop-materialized-view, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_materialized_view.sgml#sql-dropmaterializedview (Description)"
sessions: [a]
steps:
  - sql: |
      CREATE MATERIALIZED VIEW nd_mv AS SELECT 1 AS one WITH NO DATA
    expect: ok
  - sql: |
      DROP MATERIALIZED VIEW nd_mv
    expect: ok
    comment: dropping does not require the view to be populated
  - sql: |
      CREATE MATERIALIZED VIEW nd_mv2 AS SELECT 1 AS one WITH NO DATA
    expect: ok
  - sql: |
      SELECT one FROM nd_mv2
    expect: error
    sqlstate: "55000"
    comment: materialized view has not been populated
  - sql: |
      DROP MATERIALIZED VIEW nd_mv2
    expect: ok
