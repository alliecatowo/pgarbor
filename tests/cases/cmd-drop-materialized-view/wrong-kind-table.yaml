# DROP MATERIALIZED VIEW refuses a plain table (42809), even with IF EXISTS; the table is left alone.
id: cmd-drop-materialized-view.wrong-kind-table
title: DROP MATERIALIZED VIEW on a table raises 42809 with or without IF EXISTS
family: cmd-drop-materialized-view
tier: core
feature_ids: [drop-materialized-view, relation-kind-check]
required_capabilities: [create-table, insert, select, create-materialized-view, drop-materialized-view, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_materialized_view.sgml#sql-dropmaterializedview (Description)"
sessions: [a]
setup: |
  CREATE TABLE wk_tbl (id int4);
  INSERT INTO wk_tbl VALUES (1), (2), (3);
steps:
  - sql: |
      DROP MATERIALIZED VIEW wk_tbl
    expect: error
    sqlstate: "42809"
    comment: wrong object type; the hint points to DROP TABLE
  - sql: |
      DROP MATERIALIZED VIEW IF EXISTS wk_tbl
    expect: error
    sqlstate: "42809"
    comment: IF EXISTS only covers a missing name, not a name of the wrong kind
  - sql: |
      SELECT count(*) AS n FROM wk_tbl
    expect: rows
    order: ordered
