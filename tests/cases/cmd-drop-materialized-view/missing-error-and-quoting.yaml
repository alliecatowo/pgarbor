# Without IF EXISTS a missing name is an error (42P01). Identifiers fold to lower case unless quoted.
id: cmd-drop-materialized-view.missing-error-and-quoting
title: Dropping a missing materialized view raises 42P01; quoted names are case-sensitive
family: cmd-drop-materialized-view
tier: core
feature_ids: [drop-materialized-view, identifiers]
required_capabilities: [create-materialized-view, drop-materialized-view, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_materialized_view.sgml#sql-dropmaterializedview (name)"
sessions: [a]
steps:
  - sql: |
      DROP MATERIALIZED VIEW nosuch_mv
    expect: error
    sqlstate: "42P01"
  - sql: |
      CREATE MATERIALIZED VIEW mv_case AS SELECT 1 AS one
    expect: ok
  - sql: |
      DROP MATERIALIZED VIEW "MV_CASE"
    expect: error
    sqlstate: "42P01"
    comment: quoted upper-case name does not match the lower-case object
  - sql: |
      DROP MATERIALIZED VIEW MV_CASE
    expect: ok
    comment: unquoted name folds to mv_case
  - sql: |
      DROP MATERIALIZED VIEW MV_CASE
    expect: error
    sqlstate: "42P01"
    comment: the view is gone, so a second drop is a missing-object error
