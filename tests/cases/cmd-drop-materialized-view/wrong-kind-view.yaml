# DROP MATERIALIZED VIEW refuses a regular view (42809); the view keeps working.
id: cmd-drop-materialized-view.wrong-kind-view
title: DROP MATERIALIZED VIEW on a regular view raises 42809 and leaves the view usable
family: cmd-drop-materialized-view
tier: core
feature_ids: [drop-materialized-view, relation-kind-check, views]
required_capabilities: [create-table, select, create-view, drop-materialized-view, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_materialized_view.sgml#sql-dropmaterializedview (Description)"
sessions: [a]
setup: |
  CREATE VIEW wkv AS SELECT 1 AS one, 'v' AS tag;
steps:
  - sql: |
      DROP MATERIALIZED VIEW wkv
    expect: error
    sqlstate: "42809"
    comment: hint says to use DROP VIEW
  - sql: |
      SELECT one, tag FROM wkv
    expect: rows
    order: ordered
