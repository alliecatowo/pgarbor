# IF EXISTS applies per name in the list: the missing name only produces a notice; the existing one is dropped.
id: cmd-drop-materialized-view.if-exists-mixed-list
title: IF EXISTS with a mixed list drops the existing view and notices the missing one
family: cmd-drop-materialized-view
tier: core
feature_ids: [drop-materialized-view, if-exists, multi-object-drop]
required_capabilities: [create-table, insert, select, create-materialized-view, drop-materialized-view, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_materialized_view.sgml#sql-dropmaterializedview (IF EXISTS)"
sessions: [a]
setup: |
  CREATE TABLE im_base (id int4);
  INSERT INTO im_base VALUES (5), (6);
  CREATE MATERIALIZED VIEW im_x AS SELECT id FROM im_base;
steps:
  - sql: |
      DROP MATERIALIZED VIEW IF EXISTS im_x, im_y
    expect: notice
    comment: NOTICE for im_y only; im_x is dropped
  - sql: |
      SELECT to_regclass('im_x') IS NULL AS x_gone
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM im_base ORDER BY id
    expect: rows
    order: ordered
