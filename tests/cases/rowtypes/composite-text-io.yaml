# Composite I/O and row construction: nested composite literal input and output.
id: rowtypes.composite-text-io
title: Composite type text input and output with nested composites
family: rowtypes
tier: core
feature_ids: [composite-types, row-constructor, record-io]
required_capabilities: [create-type, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
setup: |
  CREATE TYPE complex AS (r float8, i float8);
  CREATE TYPE quad AS (c1 complex, c2 complex);
steps:
  - sql: |
      SELECT (1.1,2.2)::complex AS c, row((3.3,4.4),(5.5,null))::quad AS q
    expect: rows
  - sql: |
      SELECT '(1.5,-2)'::complex AS c
    expect: rows
  - sql: |
      SELECT ((1,2),(3,4))::quad::text AS q_text
    expect: rows
