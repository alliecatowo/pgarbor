# Row comparison semantics: lexicographic ordering, NULL propagation for < and = versus <>.
id: rowtypes.row-comparison-nulls
title: Row comparison ordering and three-valued NULL results
family: rowtypes
tier: core
feature_ids: [row-comparison, nulls, row-constructor]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT ROW(1,2) < ROW(1,3) AS t1,
             ROW(1,2) < ROW(1,1) AS f1,
             ROW(1,2) < ROW(1,NULL) AS n1,
             ROW(1,2,3) < ROW(1,3,NULL) AS t2,
             ROW(11,'ABC') < ROW(11,'DEF') AS t3,
             ROW(11,'ABC') > ROW(11,'DEF') AS f2,
             ROW(12,'ABC') > ROW(11,'DEF') AS t4
    expect: rows
    comment: the NULL in the last column is not examined once an earlier column decides the result
  - sql: |
      SELECT ROW(1,2,3) < ROW(1,NULL,4) AS n2,
             ROW(1,2,3) = ROW(1,NULL,4) AS f3,
             ROW(1,2,3) <> ROW(1,NULL,4) AS t5,
             ROW(1,2) = ROW(1,NULL) AS n3,
             ROW(1,NULL) = ROW(2,NULL) AS f4
    expect: rows
    comment: equality is decided by a definite non-equal column, otherwise NULL
