# Malformed composite literals are rejected with 22P02 invalid_text_representation.
id: rowtypes.composite-input-malformed
title: Malformed composite literals raise invalid text representation
family: rowtypes
tier: core
feature_ids: [composite-types, record-io, errors]
required_capabilities: [create-type, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
setup: |
  CREATE TYPE fullname AS (first text, last text);
steps:
  - sql: |
      SELECT '(Joe)'::fullname
    expect: error
    sqlstate: "22P02"
    comment: too few fields
  - sql: |
      SELECT '(Joe,,)'::fullname
    expect: error
    sqlstate: "22P02"
    comment: too many fields
  - sql: |
      SELECT '[]'::fullname
    expect: error
    sqlstate: "22P02"
    comment: wrong delimiters
  - sql: |
      SELECT '(Joe,Blow) /'::fullname
    expect: error
    sqlstate: "22P02"
    comment: trailing garbage
  - sql: |
      SELECT '(Joe,Blow)'::fullname AS still_works
    expect: rows
    comment: session remains usable after input errors in autocommit mode
