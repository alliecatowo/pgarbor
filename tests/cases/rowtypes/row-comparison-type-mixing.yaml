# Row comparisons and IN lists accept members whose field types differ but are comparable.
id: rowtypes.row-comparison-type-mixing
title: Row equality and IN across mixed integer widths
family: rowtypes
tier: core
feature_ids: [row-comparison, row-constructor, in-operator, type-coercion]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT ROW(1,2) = ROW(1,2::int8) AS eq8,
             ROW(1,2) < ROW(1,2::int8) AS lt8
    expect: rows
  - sql: |
      SELECT ROW(1,2) IN (ROW(3,4), ROW(1,2)) AS in1,
             ROW(1,2) IN (ROW(3,4), ROW(1,2::int8)) AS in2,
             ROW(1,2) IN (ROW(3,4)) AS in3
    expect: rows
