# NULL field versus empty-string field in composite input, and composite IS NULL semantics.
id: rowtypes.composite-null-vs-empty
title: Unquoted empty field is NULL while quoted empty field is empty string
family: rowtypes
tier: core
feature_ids: [composite-types, nulls, record-io]
required_capabilities: [create-type, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
setup: |
  CREATE TYPE fullname AS (first text, last text);
steps:
  - sql: |
      SELECT ('(Joe,)'::fullname).last IS NULL AS unquoted_empty_is_null,
             ('(Joe,"")'::fullname).last = '' AS quoted_empty_is_blank,
             ('(Joe,"")'::fullname).last IS NULL AS quoted_empty_not_null
    expect: rows
    order: multiset
  - sql: |
      SELECT ROW(NULL, NULL)::fullname IS NULL AS all_null_fields,
             ROW(NULL, 'x')::fullname IS NULL AS some_null_field,
             ROW(NULL, 'x')::fullname IS NOT NULL AS not_all_nonnull
    expect: rows
    comment: a row IS NULL only when every field is null, IS NOT NULL requires every field non-null
