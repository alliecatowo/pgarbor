# The zero-column row constructor yields exactly one empty row.
id: rowtypes.empty-row-constructor
title: Zero-column ROW constructor yields one empty row
family: rowtypes
tier: extended
feature_ids: [row-constructor, anonymous-record, edge-cases]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT ROW()
    expect: rows
  - sql: |
      SELECT count(*) AS n FROM (SELECT ROW()) s
    expect: rows
