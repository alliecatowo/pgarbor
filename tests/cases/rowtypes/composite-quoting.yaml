# Quoting rules for composite text input: doubled quotes, embedded commas, apostrophes, backslashes.
id: rowtypes.composite-quoting
title: Composite text input honours double-quote and backslash escaping
family: rowtypes
tier: core
feature_ids: [composite-types, record-io, quoting]
required_capabilities: [create-type, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
setup: |
  CREATE TYPE fullname AS (first text, last text);
steps:
  - sql: |
      SELECT '(Joe,von Blow)'::fullname AS a, '(Joe,d''Blow)'::fullname AS b
    expect: rows
  - sql: |
      SELECT '(Joe,"von""Blow")'::fullname AS a, E'(Joe,d\\\\Blow)'::fullname AS b
    expect: rows
  - sql: |
      SELECT '(Joe,"Blow,Jr")'::fullname AS a
    expect: rows
  - sql: |
      SELECT ' (Joe,Blow)  '::fullname AS a
    expect: rows
    comment: extra whitespace around the literal is accepted
  - sql: |
      SELECT (f).first, (f).last, length((f).last) AS len
      FROM (SELECT '(Joe,"Blow,Jr")'::fullname AS f) s
    expect: rows
