# Field selection from anonymous record values produced by ROW() and subqueries.
id: rowtypes.anonymous-record-fields
title: Field selection from anonymous record values
family: rowtypes
tier: core
feature_ids: [anonymous-record, field-selection, row-constructor, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SELECT (row(1, 2.0)).f1 AS f1, (row(1, 2.0)).f2 AS f2
    expect: rows
  - sql: |
      SELECT (row(1, 2.0)).nosuch
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT (row(1, 2.0)).*
    expect: rows
  - sql: |
      SELECT (r).f1 FROM (SELECT row(1, 2.0) AS r) ss
    expect: rows
  - sql: |
      SELECT (r).f3 FROM (SELECT row(1, 2.0) AS r) ss
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT (r).* FROM (SELECT row(1, 2.0) AS r) ss
    expect: rows
