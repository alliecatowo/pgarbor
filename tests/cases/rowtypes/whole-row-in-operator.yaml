# Whole-row references compared with IN: a bare record operand has no operator, and a typed row works.
id: rowtypes.whole-row-in-operator
title: Whole-row table reference with IN over a row list
family: rowtypes
tier: extended
feature_ids: [whole-row-reference, in-operator, row-constructor, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
setup: |
  CREATE TABLE i8tbl (q1 int8, q2 int8);
  INSERT INTO i8tbl VALUES (123, 456), (4567890123456789, 123), (7, 8);
steps:
  - sql: |
      SELECT * FROM i8tbl i8 WHERE i8 IN (ROW(123,456))
    expect: error
    sqlstate: "42883"
    comment: the anonymous record has no equality operator against the table rowtype
  - sql: |
      SELECT i8 FROM i8tbl i8
      WHERE i8 IN (ROW(123,456)::i8tbl, '(4567890123456789,123)')
      ORDER BY q1
    expect: rows
    order: ordered
  - sql: |
      SELECT i8 FROM i8tbl i8 ORDER BY q1
    expect: rows
    order: ordered
    comment: a bare table alias yields the whole row as a composite
