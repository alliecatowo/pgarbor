# Subfield assignment on composite columns in INSERT and UPDATE target lists.
id: rowtypes.composite-field-update-insert
title: Assign and update individual composite subfields
family: rowtypes
tier: core
feature_ids: [composite-types, insert, update, field-assignment]
required_capabilities: [create-type, create-table, insert, update, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/rowtypes.sql"
  license: PostgreSQL License
setup: |
  CREATE TYPE complex AS (r float8, i float8);
  CREATE TYPE quad AS (c1 complex, c2 complex);
  CREATE TABLE quadtable (f1 int4, q quad);
  INSERT INTO quadtable VALUES (1, ((3.3,4.4),(5.5,6.6))), (2, ((null,4.4),(5.5,6.6)));
steps:
  - sql: |
      INSERT INTO quadtable (f1, q.c1.r, q.c2.i) VALUES (44, 55, 66)
    expect: ok
  - sql: |
      SELECT f1, (q).c1.r AS c1r, (q).c1.i AS c1i, (q).c2.r AS c2r, (q).c2.i AS c2i
      FROM quadtable WHERE f1 = 44
    expect: rows
    comment: untouched subfields of the inserted composite are NULL
  - sql: |
      UPDATE quadtable SET q.c1.r = 12 WHERE f1 = 2
    expect: ok
  - sql: |
      UPDATE quadtable SET q.c2 = ROW(7, 8)::complex WHERE f1 = 1
    expect: ok
  - sql: |
      SELECT f1, (q).c1.r AS c1r, (q).c2.r AS c2r, (q).c2.i AS c2i
      FROM quadtable ORDER BY f1
    expect: rows
    order: ordered
