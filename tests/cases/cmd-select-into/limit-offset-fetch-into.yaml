# OFFSET, LIMIT ALL, and FETCH NEXT ... ROWS ONLY each restrict the rows that SELECT INTO stores.
id: cmd-select-into.limit-offset-fetch-into
title: SELECT INTO honors OFFSET, FETCH FIRST/NEXT and LIMIT ALL row restrictions
family: cmd-select-into
tier: core
feature_ids: [select-into, limit, offset, fetch-first]
required_capabilities: [select, select-into, limit, offset, fetch-first]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis (LIMIT / OFFSET / FETCH)"
sessions: [a]
steps:
  - sql: |
      SELECT n INTO tlim FROM generate_series(1, 6) n ORDER BY n DESC OFFSET 2 ROWS FETCH NEXT 2 ROWS ONLY
    expect: ok
  - sql: |
      SELECT n FROM tlim ORDER BY n
    expect: rows
    order: ordered
    comment: descending 6,5,4,3,2,1 skip two, take 4 and 3
  - sql: |
      SELECT n INTO tlim2 FROM generate_series(1, 3) n ORDER BY n OFFSET 1 ROW LIMIT ALL
    expect: ok
  - sql: |
      SELECT n FROM tlim2 ORDER BY n
    expect: rows
    order: ordered
