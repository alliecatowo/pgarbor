# A named WINDOW clause is evaluated before the rows are stored by SELECT INTO.
id: cmd-select-into.window-clause-into
title: SELECT INTO with a named WINDOW clause stores computed window values
family: cmd-select-into
tier: extended
feature_ids: [select-into, window-functions]
required_capabilities: [select, select-into, window-functions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis (WINDOW window_name AS (window_definition))"
sessions: [a]
setup: |
  CREATE TABLE films (code text, title text, date_prod date, kind text);
  INSERT INTO films VALUES ('a', 'A', '2001-06-01', 'd'), ('b', 'B', '2002-03-04', 'c'), ('c', 'C', '2003-01-01', 'd'), ('d', 'D', '2002-01-01', 'c');
steps:
  - sql: |
      SELECT title, rank() OVER w AS r INTO wx FROM films WINDOW w AS (ORDER BY date_prod)
    expect: ok
  - sql: |
      SELECT title, r FROM wx ORDER BY r
    expect: rows
    order: ordered
