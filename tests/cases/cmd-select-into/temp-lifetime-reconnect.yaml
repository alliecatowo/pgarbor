# Temporary tables last only for the session that created them; a reconnect discards them.
id: cmd-select-into.temp-lifetime-reconnect
title: A temporary table from SELECT INTO disappears when its session reconnects
family: cmd-select-into
tier: core
feature_ids: [select-into, temporary-tables]
required_capabilities: [select, select-into, temp-tables]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#parameters (TEMPORARY or TEMP); sql-createtable.html (temporary tables)"
sessions: [a]
steps:
  - sql: |
      SELECT 7 AS v INTO TEMP life_tmp
    expect: ok
  - sql: |
      SELECT v FROM life_tmp
    expect: rows
    order: ordered
  - reconnect: true
  - sql: |
      SELECT v FROM life_tmp
    expect: error
    sqlstate: "42P01"
