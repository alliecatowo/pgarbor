# new_table may be schema-qualified; naming a schema that does not exist fails with invalid_schema_name.
id: cmd-select-into.unknown-schema-error
title: SELECT INTO into a missing schema fails with invalid_schema_name
family: cmd-select-into
tier: core
feature_ids: [select-into, schemas, errors]
required_capabilities: [select, select-into, create-schema, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#parameters (new_table)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
steps:
  - sql: |
      SELECT 1 AS v INTO nosuch_schema.tt
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT 1 AS v INTO s1.tq
    expect: ok
  - sql: |
      SELECT v FROM s1.tq
    expect: rows
    order: ordered
