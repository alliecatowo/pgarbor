# SELECT INTO does not accept access-method or tablespace clauses (use CREATE TABLE AS for those); the statement fails and creates nothing.
id: cmd-select-into.unsupported-clauses-error
title: SELECT INTO rejects USING access method and TABLESPACE clauses
family: cmd-select-into
tier: core
feature_ids: [select-into, create-table-as, errors]
required_capabilities: [select, select-into, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#notes (SELECT INTO does not allow access method or tablespace)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS v INTO USING heap uc_1
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS v INTO TABLESPACE pg_default uc_2
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT to_regclass('uc_1') IS NULL AND to_regclass('uc_2') IS NULL AS absent
    expect: rows
