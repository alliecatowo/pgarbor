# The documented example: SELECT * INTO films_recent FROM films WHERE date_prod >= '2002-01-01'.
id: cmd-select-into.docs-films-recent
title: Documented SELECT INTO example copies only matching films into a new table
family: cmd-select-into
tier: core
feature_ids: [select-into, select, where, create-table]
required_capabilities: [select, select-into, create-table, insert]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#examples (films_recent)"
sessions: [a]
setup: |
  CREATE TABLE films (code text, title text, date_prod date, kind text);
  INSERT INTO films VALUES ('a', 'A', '2001-06-01', 'd'), ('b', 'B', '2002-03-04', 'c'), ('c', 'C', '2003-01-01', 'd'), ('d', 'D', '2002-01-01', 'c');
steps:
  - sql: |
      SELECT * INTO films_recent FROM films WHERE date_prod >= '2002-01-01'
    expect: ok
  - sql: |
      SELECT code, title, date_prod FROM films_recent ORDER BY code
    expect: rows
    order: ordered
    comment: rows b, c, d only; a (2001-06-01) is excluded
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'films_recent' ORDER BY ordinal_position
    expect: rows
    order: ordered
    comment: columns take the names and types of the SELECT output columns
