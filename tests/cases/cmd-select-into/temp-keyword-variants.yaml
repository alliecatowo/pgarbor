# TEMP, TEMPORARY and TEMPORARY TABLE all create session-local temporary tables.
id: cmd-select-into.temp-keyword-variants
title: INTO TEMP, INTO TEMPORARY and INTO TEMPORARY TABLE create temporary relations
family: cmd-select-into
tier: core
feature_ids: [select-into, temporary-tables]
required_capabilities: [select, select-into, temp-tables]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#parameters (TEMPORARY or TEMP)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS v INTO TEMP tv_a
    expect: ok
  - sql: |
      SELECT 2 AS v INTO TEMPORARY tv_b
    expect: ok
  - sql: |
      SELECT 3 AS v INTO TEMPORARY TABLE tv_c
    expect: ok
  - sql: |
      SELECT relname, relpersistence FROM pg_class WHERE relname IN ('tv_a', 'tv_b', 'tv_c') ORDER BY relname
    expect: rows
    order: ordered
    comment: relpersistence 't' marks a temporary table
  - sql: |
      SELECT v FROM tv_a UNION ALL SELECT v FROM tv_b UNION ALL SELECT v FROM tv_c ORDER BY v
    expect: rows
    order: ordered
