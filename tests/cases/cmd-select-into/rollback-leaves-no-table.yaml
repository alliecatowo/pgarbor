# SELECT INTO is transactional DDL: rolling back removes the new table entirely.
id: cmd-select-into.rollback-leaves-no-table
title: SELECT INTO inside a rolled-back transaction leaves no table behind
family: cmd-select-into
tier: core
feature_ids: [select-into, transactions, rollback]
required_capabilities: [select, select-into, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#description (SELECT INTO creates a new table)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1 AS z INTO rb_t
    expect: ok
  - sql: |
      SELECT z FROM rb_t
    expect: rows
    order: ordered
    comment: visible inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT to_regclass('rb_t') IS NULL AS absent
    expect: rows
    comment: the table creation was rolled back
