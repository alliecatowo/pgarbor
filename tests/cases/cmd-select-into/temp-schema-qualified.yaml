# A temporary table cannot be placed in a regular schema; pg_temp is the only schema allowed for it.
id: cmd-select-into.temp-schema-qualified
title: TEMP target in a regular schema fails; pg_temp-qualified TEMP target succeeds
family: cmd-select-into
tier: core
feature_ids: [select-into, temporary-tables, schemas]
required_capabilities: [select, select-into, temp-tables, create-schema]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#parameters (new_table)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
steps:
  - sql: |
      SELECT 1 AS v INTO TEMP s1.tq_bad
    expect: error
    sqlstate: "42P16"
    comment: cannot create temporary relation in non-temporary schema
  - sql: |
      SELECT to_regclass('s1.tq_bad') IS NULL AS absent
    expect: rows
    comment: nothing was created in s1
  - sql: |
      SELECT 1 AS v INTO pg_temp.tq_ok
    expect: ok
  - sql: |
      SELECT relpersistence FROM pg_class WHERE relname = 'tq_ok'
    expect: rows
