# A WITH clause (here recursive) is allowed before SELECT INTO; the CTE is only the query source.
id: cmd-select-into.with-recursive-into
title: SELECT INTO accepts a WITH RECURSIVE query and stores its generated rows
family: cmd-select-into
tier: core
feature_ids: [select-into, with, recursive-queries]
required_capabilities: [select, select-into, with, recursive-queries]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis (WITH [ RECURSIVE ] with_query)"
sessions: [a]
steps:
  - sql: |
      WITH RECURSIVE r(n) AS (VALUES (1) UNION ALL SELECT n + 1 FROM r WHERE n < 5) SELECT n INTO rec_t FROM r
    expect: ok
  - sql: |
      SELECT n FROM rec_t ORDER BY n
    expect: rows
    order: ordered
