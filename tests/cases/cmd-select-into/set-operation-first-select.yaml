# INTO may appear on the first SELECT of a UNION, INTERSECT or EXCEPT; the new table holds the combined result.
id: cmd-select-into.set-operation-first-select
title: INTO on the first SELECT of UNION, INTERSECT and EXCEPT stores the combined result
family: cmd-select-into
tier: core
feature_ids: [select-into, union, intersect, except]
required_capabilities: [select, select-into, union, intersect, except]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis ({ UNION | INTERSECT | EXCEPT } select)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS x INTO su_union UNION SELECT 2
    expect: ok
  - sql: |
      SELECT x FROM su_union ORDER BY x
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 AS x INTO su_inter INTERSECT SELECT 1
    expect: ok
  - sql: |
      SELECT x FROM su_inter
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 AS x INTO su_except EXCEPT SELECT 2
    expect: ok
  - sql: |
      SELECT x FROM su_except
    expect: rows
    order: ordered
