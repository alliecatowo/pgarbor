# A query returning no rows still creates the table, with the output column names and types.
id: cmd-select-into.empty-result-keeps-types
title: SELECT INTO with zero matching rows creates an empty table with the output columns
family: cmd-select-into
tier: core
feature_ids: [select-into, create-table, no-matching-rows]
required_capabilities: [select, select-into, create-table]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#description"
sessions: [a]
steps:
  - sql: |
      SELECT n AS v, n::numeric AS p INTO empty_t FROM generate_series(1, 3) n WHERE false
    expect: ok
  - sql: |
      SELECT count(*) FROM empty_t
    expect: rows
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'empty_t' ORDER BY ordinal_position
    expect: rows
    order: ordered
