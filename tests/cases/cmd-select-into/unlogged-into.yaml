# UNLOGGED creates a table without WAL logging; it is still a permanent (non-temporary) relation.
id: cmd-select-into.unlogged-into
title: SELECT INTO UNLOGGED TABLE creates an unlogged permanent table
family: cmd-select-into
tier: core
feature_ids: [select-into, unlogged-tables]
required_capabilities: [select, select-into, create-table, unlogged-tables]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#parameters (UNLOGGED)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS v INTO UNLOGGED TABLE ul_t
    expect: ok
  - sql: |
      SELECT relpersistence FROM pg_class WHERE relname = 'ul_t' AND relnamespace = 'public'::regnamespace
    expect: rows
    comment: relpersistence 'u' is unlogged
  - sql: |
      SELECT v FROM ul_t
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 AS v INTO UNLOGGED TEMP ul_bad
    expect: error
    sqlstate: "42601"
    comment: UNLOGGED and TEMP are not combinable in this clause
