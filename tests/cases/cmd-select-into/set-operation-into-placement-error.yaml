# INTO is only accepted immediately after the first SELECT of a set operation; elsewhere it is a syntax error and creates nothing.
id: cmd-select-into.set-operation-into-placement-error
title: INTO on a later SELECT of a set operation, or before UNION, is rejected
family: cmd-select-into
tier: core
feature_ids: [select-into, union, errors]
required_capabilities: [select, select-into, union, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS x UNION SELECT 2 INTO sp_t2
    expect: error
    sqlstate: "42601"
    comment: INTO on the second SELECT is not allowed
  - sql: |
      SELECT 1 AS x INTO UNION SELECT 2
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT to_regclass('sp_t2') IS NULL AS absent
    expect: rows
    comment: neither failed statement created a table
