# DISTINCT ON keeps the first row per group under ORDER BY; SELECT INTO stores only those rows.
id: cmd-select-into.distinct-on-into
title: SELECT DISTINCT ON with ORDER BY stores one first row per group
family: cmd-select-into
tier: core
feature_ids: [select-into, distinct-on, order-by]
required_capabilities: [select, select-into, distinct-on, order-by]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis (SELECT [ ALL | DISTINCT [ ON ( expression ) ] ])"
sessions: [a]
setup: |
  CREATE TABLE films (code text, title text, date_prod date, kind text);
  INSERT INTO films VALUES ('a', 'A', '2001-06-01', 'd'), ('b', 'B', '2002-03-04', 'c'), ('c', 'C', '2003-01-01', 'd'), ('d', 'D', '2002-01-01', 'c');
steps:
  - sql: |
      SELECT DISTINCT ON (kind) kind, title INTO dx FROM films ORDER BY kind, date_prod
    expect: ok
  - sql: |
      SELECT kind, title FROM dx ORDER BY kind
    expect: rows
    order: ordered
    comment: "earliest film per kind: c gives D (2002-01-01), d gives A (2001-06-01)"
