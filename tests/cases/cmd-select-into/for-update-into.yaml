# FOR UPDATE locks the selected source rows; SELECT INTO still stores them in the new table.
id: cmd-select-into.for-update-into
title: SELECT INTO with FOR UPDATE OF ... NOWAIT stores locked source rows
family: cmd-select-into
tier: extended
feature_ids: [select-into, row-locks, for-update]
required_capabilities: [select, select-into, row-locks, create-table]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis (FOR { UPDATE | SHARE } [ OF table_name ] [ NOWAIT ])"
sessions: [a]
setup: |
  CREATE TABLE films (code text, title text, date_prod date, kind text);
  INSERT INTO films VALUES ('a', 'A', '2001-06-01', 'd'), ('b', 'B', '2002-03-04', 'c'), ('c', 'C', '2003-01-01', 'd'), ('d', 'D', '2002-01-01', 'c');
steps:
  - sql: |
      SELECT f.code INTO locked_codes FROM films f WHERE f.kind = 'd' FOR UPDATE OF f NOWAIT
    expect: ok
  - sql: |
      SELECT code FROM locked_codes ORDER BY code
    expect: rows
    order: ordered
