# SELECT INTO is only valid at the top level of a statement; inside a subquery it is rejected.
id: cmd-select-into.into-in-subquery-error
title: SELECT INTO inside a subquery is rejected and creates no table
family: cmd-select-into
tier: core
feature_ids: [select-into, subqueries, errors]
required_capabilities: [select, select-into, subqueries, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/select_into.sgml#synopsis"
sessions: [a]
steps:
  - sql: |
      SELECT * FROM (SELECT 1 AS q INTO inner_t) s
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT to_regclass('inner_t') IS NULL AS absent
    expect: rows
