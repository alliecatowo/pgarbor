# sqlx reads composite fields via pg_attribute on the type's typrelid, skipping system and dropped columns.
id: orm-sqlx.composite-type-introspection
title: Composite type field names and types via pg_attribute
family: orm-sqlx
tier: core
feature_ids: [composite-types, catalog-introspection, create-type]
required_capabilities: [composite-types, catalog-introspection]
provenance:
  source: research
  ref: "sqlx-postgres composite type lookup; PG18 catalog-pg-attribute.html"
sessions: [a]
setup: |
  CREATE TYPE point2 AS (x int4, y int4);
  CREATE TYPE labelled AS (name text, pt point2, tags text[]);
steps:
  - sql: |
      SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS field_type
      FROM pg_type t
      JOIN pg_attribute a ON a.attrelid = t.typrelid
      WHERE t.typname = 'point2' AND a.attnum > 0 AND NOT a.attisdropped
      ORDER BY a.attnum
    expect: rows
    order: ordered
  - sql: |
      SELECT a.attname, format_type(a.atttypid, a.atttypmod) AS field_type
      FROM pg_type t
      JOIN pg_attribute a ON a.attrelid = t.typrelid
      WHERE t.typname = 'labelled' AND a.attnum > 0 AND NOT a.attisdropped
      ORDER BY a.attnum
    expect: rows
    order: ordered
