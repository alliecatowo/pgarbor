# sqlx reads domains via pg_type.typbasetype; typtype 'd' marks a domain and typtypmod carries base modifiers.
id: orm-sqlx.domain-type-introspection
title: Domain type kind, base type and NOT NULL flag via pg_type
family: orm-sqlx
tier: core
feature_ids: [domains, catalog-introspection, create-domain]
required_capabilities: [domains, catalog-introspection]
provenance:
  source: research
  ref: "sqlx-postgres domain resolution; PG18 catalog-pg-type.html (typtype, typbasetype)"
sessions: [a]
setup: |
  CREATE DOMAIN positive_int AS int4 CHECK (VALUE > 0);
  CREATE DOMAIN short_name AS varchar(8) NOT NULL;
steps:
  - sql: |
      SELECT typname, typtype, format_type(typbasetype, typtypmod) AS base_type, typnotnull
      FROM pg_type
      WHERE typname IN ('positive_int', 'short_name')
      ORDER BY typname
    expect: rows
    order: ordered
  - sql: |
      SELECT typname, typtype FROM pg_type WHERE typname = 'int4'
    expect: rows
    comment: base type is not a domain, typtype is b
