# sqlx prepares typed queries by name and describes them before executing; NULL parameter yields NULL output column.
id: orm-sqlx.describe-typed-select-named
title: Named prepared SELECT with typed parameters is described then executed, including NULL bind
family: orm-sqlx
tier: core
feature_ids: [prepared-statements, extended-protocol, describe, select, text]
required_capabilities: [select, extended-protocol, prepared-statements]
provenance:
  source: research
  ref: "sqlx-core query describe then execute; PG18 protocol-message-types.html (Describe, Bind)"
sessions: [a]
steps:
  - parse:
      name: q1
      sql: |
        SELECT $1::int4 + 1 AS n, $2::text AS s
      param_types: [23, 25]
    expect: ok
  - describe:
      statement: q1
    expect: rows
  - execute:
      statement: q1
      params: ["41", "x"]
    expect: rows
  - execute:
      statement: q1
      params: ["41", null]
    expect: rows
  - close:
      statement: q1
