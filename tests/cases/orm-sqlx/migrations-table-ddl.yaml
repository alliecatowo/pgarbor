# DDL shape of the sqlx migrations bookkeeping table, read back through information_schema.
id: orm-sqlx.migrations-table-ddl
title: sqlx _sqlx_migrations table DDL and column catalog
family: orm-sqlx
tier: core
feature_ids: [create-table, catalog-introspection, bytea, timestamptz, bigint]
required_capabilities: [create-table, select, catalog-introspection, bytea]
provenance:
  source: research
  ref: "sqlx-core migrate module DDL for _sqlx_migrations"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE IF NOT EXISTS _sqlx_migrations (
        version BIGINT PRIMARY KEY,
        description TEXT NOT NULL,
        installed_on TIMESTAMPTZ NOT NULL DEFAULT now(),
        success BOOLEAN NOT NULL,
        checksum BYTEA NOT NULL,
        execution_time BIGINT NOT NULL
      )
    expect: ok
  - sql: |
      SELECT column_name, data_type, is_nullable, column_default IS NULL AS no_default
      FROM information_schema.columns
      WHERE table_schema = 'public' AND table_name = '_sqlx_migrations'
      ORDER BY ordinal_position
    expect: rows
    order: ordered
