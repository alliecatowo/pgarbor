# sqlx looks up the array form of a user type through pg_type.typelem to decode T[] columns.
id: orm-sqlx.array-of-enum-pg-type-join
title: Array type of a user enum resolves to its element type via typelem
family: orm-sqlx
tier: core
feature_ids: [enum-types, arrays, catalog-introspection]
required_capabilities: [enum-types, arrays, catalog-introspection]
provenance:
  source: research
  ref: "sqlx-postgres array type resolution; PG18 catalog-pg-type.html (typelem, typcategory)"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('ok', 'bad');
steps:
  - sql: |
      SELECT t.typname AS array_type, t.typcategory, e.typname AS element_type
      FROM pg_type t
      JOIN pg_type e ON e.oid = t.typelem
      WHERE t.typname = '_mood'
    expect: rows
    order: ordered
  - sql: |
      SELECT typname FROM pg_type WHERE oid = (SELECT typarray FROM pg_type WHERE typname = 'mood')
    expect: rows
