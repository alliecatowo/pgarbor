# A domain CHECK constraint rejects 0 with check_violation; NULL is allowed because the domain is nullable.
id: orm-sqlx.domain-check-violation-23514
title: Domain CHECK rejects out-of-range value, accepts NULL on nullable domain column
family: orm-sqlx
tier: core
feature_ids: [domains, constraints, insert, errors]
required_capabilities: [domains, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/sql-createdomain.html; PG18 errcodes 23514"
sessions: [a]
setup: |
  CREATE DOMAIN positive_int AS int4 CHECK (VALUE > 0);
  CREATE TABLE d (id int4 PRIMARY KEY, n positive_int);
steps:
  - sql: |
      INSERT INTO d VALUES (1, 0)
    expect: error
    sqlstate: "23514"
  - sql: |
      INSERT INTO d VALUES (2, 5), (3, NULL)
    expect: ok
  - sql: |
      SELECT id, n, n IS NULL AS n_null FROM d ORDER BY id
    expect: rows
    order: ordered
