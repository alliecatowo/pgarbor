# sqlx reads server_version on connect; the driver parses the major number. Checked via server_version_num so no build string is compared.
id: orm-sqlx.show-server-version-major
title: Driver connect probe reads server_version_num and derives major version 18
family: orm-sqlx
tier: core
feature_ids: [catalog-introspection, show, select]
required_capabilities: [select, catalog-introspection]
provenance:
  source: research
  ref: "sqlx-postgres connection startup; PG18 runtime-config-preset.html (server_version_num)"
sessions: [a]
steps:
  - sql: |
      SHOW server_version_num
    expect: rows
  - sql: |
      SELECT current_setting('server_version_num')::int / 10000 AS major, current_setting('server_version_num')::int >= 180000 AS is_pg18_or_later
    expect: rows
