# Advisory lock functions are STRICT: a NULL key returns NULL and takes no lock. Two-int4 key form is a distinct lock space.
id: orm-sqlx.advisory-lock-null-and-pair-keys
title: NULL advisory lock key returns NULL; two-argument key form locks a separate key space
family: orm-sqlx
tier: core
feature_ids: [advisory-locks, select, boundaries]
required_capabilities: [select, advisory-locks]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/functions-admin.html#FUNCTIONS-ADVISORY-LOCKS"
sessions: [a]
steps:
  - sql: |
      SELECT pg_advisory_lock(NULL::bigint) AS locked_null
    expect: rows
  - sql: |
      SELECT pg_try_advisory_lock(NULL::bigint) AS try_null
    expect: rows
  - sql: |
      SELECT pg_try_advisory_lock(1, 2) AS pair_locked, pg_try_advisory_lock(0, 0) AS other_pair_locked
    expect: rows
  - sql: |
      SELECT pg_advisory_unlock(1, 2) AS pair_unlocked
    expect: rows
  - sql: |
      SELECT pg_advisory_unlock(0, 0) AS other_unlocked
    expect: rows
