# A failed Parse does not register the statement name; the session stays usable and the same name can be reused.
id: orm-sqlx.parse-syntax-error-42601
title: Syntax error on Parse returns 42601 and the session remains usable for a corrected Parse
family: orm-sqlx
tier: core
feature_ids: [prepared-statements, extended-protocol, errors]
required_capabilities: [select, extended-protocol, prepared-statements]
provenance:
  source: pg-docs
  ref: "PG18 errcodes 42601 syntax_error; protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
steps:
  - parse:
      name: bad
      sql: |
        SELEC 1
    expect: error
    sqlstate: "42601"
  - parse:
      name: bad
      sql: |
        SELECT 1 AS one
    expect: ok
  - execute:
      statement: bad
      params: []
    expect: rows
