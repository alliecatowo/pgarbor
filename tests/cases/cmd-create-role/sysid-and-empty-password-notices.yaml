# SYSID is accepted and ignored with a NOTICE; an empty-string PASSWORD clears the password with a NOTICE; PASSWORD NULL is silent.
id: cmd-create-role.sysid-and-empty-password-notices
title: SYSID is ignored with a NOTICE; empty-string PASSWORD clears the password with a NOTICE
family: cmd-create-role
tier: core
feature_ids: [create-role, sysid, password, notices, password-null]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#parameters (SYSID, PASSWORD) and PASSWORD note on empty strings"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE ccr_sysid SYSID 12345
    expect: notice
    comment: PG18 emits NOTICE "SYSID can no longer be specified"
  - sql: |
      CREATE ROLE ccr_empty PASSWORD ''
    expect: notice
    comment: PG emits NOTICE "empty string is not a valid password, clearing password"
  - sql: |
      CREATE ROLE ccr_pnull PASSWORD NULL
    expect: ok
  - sql: |
      SELECT r.rolname, a.rolpassword IS NULL AS no_password
        FROM pg_authid a
        JOIN pg_roles r ON r.oid = a.oid
       WHERE r.rolname IN ('ccr_sysid', 'ccr_empty', 'ccr_pnull')
       ORDER BY r.rolname
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE ccr_sysid, ccr_empty, ccr_pnull
    expect: ok
