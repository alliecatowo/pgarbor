# The SQL-standard form CREATE ROLE name WITH ADMIN role_name makes role_name an admin member of the new (non-login) role.
id: cmd-create-role.with-admin-standard-syntax
title: CREATE ROLE ... WITH ADMIN adds the named role as a member with admin_option and creates a NOLOGIN role
family: cmd-create-role
tier: core
feature_ids: [create-role, with-admin, admin-option, role-membership, sql-standard]
required_capabilities: [roles, catalog-introspection, select, role-membership]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#compatibility (CREATE ROLE name [ WITH ADMIN role_name ])"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE ccr_owner
    expect: ok
  - sql: |
      CREATE ROLE ccr_std WITH ADMIN ccr_owner
    expect: ok
  - sql: |
      SELECT r.rolname AS role, m.rolname AS member, am.admin_option, am.inherit_option, am.set_option,
             r.rolcanlogin AS role_can_login
        FROM pg_auth_members am
        JOIN pg_roles r ON r.oid = am.roleid
        JOIN pg_roles m ON m.oid = am.member
       WHERE r.rolname = 'ccr_std'
       ORDER BY member
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE ccr_std, ccr_owner
    expect: ok
