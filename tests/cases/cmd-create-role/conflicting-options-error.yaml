# Mutually exclusive option pairs in one CREATE ROLE are rejected with SQLSTATE 42601 and no role is created.
id: cmd-create-role.conflicting-options-error
title: Contradictory option pairs (SUPERUSER with NOSUPERUSER, LOGIN with NOLOGIN) fail with 42601 and create nothing
family: cmd-create-role
tier: extended
feature_ids: [create-role, role-attributes, errors, syntax]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#synopsis (each option appears as a NAME | NONAME pair)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE ccr_c1 SUPERUSER NOSUPERUSER
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE ROLE ccr_c2 LOGIN NOLOGIN
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) AS made FROM pg_roles WHERE rolname IN ('ccr_c1', 'ccr_c2')
    expect: rows
    order: ordered
