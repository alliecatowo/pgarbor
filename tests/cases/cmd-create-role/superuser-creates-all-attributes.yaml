# A superuser may set every attribute at creation, including SUPERUSER, REPLICATION and BYPASSRLS, and a connection limit.
id: cmd-create-role.superuser-creates-all-attributes
title: A superuser creates a role with every attribute set explicitly and reads them back from pg_roles
family: cmd-create-role
tier: core
feature_ids: [create-role, superuser, replication, bypassrls, connection-limit, role-attributes]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#parameters (SUPERUSER, CREATEDB, CREATEROLE, INHERIT, LOGIN, REPLICATION, BYPASSRLS, CONNECTION LIMIT, PASSWORD NULL)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE ccr_su SUPERUSER CREATEDB CREATEROLE INHERIT LOGIN REPLICATION BYPASSRLS CONNECTION LIMIT 5 PASSWORD NULL
    expect: ok
  - sql: |
      SELECT r.rolname, r.rolsuper, r.rolcreatedb, r.rolcreaterole, r.rolinherit, r.rolcanlogin,
             r.rolreplication, r.rolbypassrls, r.rolconnlimit, a.rolpassword IS NULL AS no_password
        FROM pg_roles r
        JOIN pg_authid a ON a.oid = r.oid
       WHERE r.rolname = 'ccr_su'
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE ccr_su
    expect: ok
