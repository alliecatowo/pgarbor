# Every clause that names an existing role fails with SQLSTATE 42704 when the role is missing, and the new role is not created.
id: cmd-create-role.missing-referenced-roles
title: IN ROLE, ROLE, ADMIN, USER and WITH ADMIN naming a missing role fail with 42704 and create nothing
family: cmd-create-role
tier: core
feature_ids: [create-role, role-membership, errors, in-role, role-clause, admin-clause]
required_capabilities: [roles, catalog-introspection, select, role-membership]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#parameters (IN ROLE, ROLE, ADMIN, USER, WITH ADMIN)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE ccr_x1 IN ROLE ccr_nope
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE ROLE ccr_x2 ROLE ccr_nope
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE ROLE ccr_x3 ADMIN ccr_nope
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE ROLE ccr_x4 USER ccr_nope
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE ROLE ccr_x5 WITH ADMIN ccr_nope
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) AS partial_roles FROM pg_roles WHERE rolname IN ('ccr_x1', 'ccr_x2', 'ccr_x3', 'ccr_x4', 'ccr_x5')
    expect: rows
    order: ordered
