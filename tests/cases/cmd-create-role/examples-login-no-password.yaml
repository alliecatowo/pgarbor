# Documented example: CREATE ROLE jonathan LOGIN creates a login role with no password and all other attributes at their defaults.
id: cmd-create-role.examples-login-no-password
title: CREATE ROLE with LOGIN and no password gives a login role with default attributes and NULL password
family: cmd-create-role
tier: core
feature_ids: [create-role, login, password, role-attributes, catalog-introspection]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#examples (CREATE ROLE jonathan LOGIN)"
sessions: [a]
notes: Example renamed with a ccr_ prefix because roles are cluster-wide; the role is dropped at the end. pg_roles.rolpassword is always masked, so the NULL check reads pg_authid.
steps:
  - sql: |
      CREATE ROLE ccr_jonathan LOGIN
    expect: ok
  - sql: |
      SELECT r.rolname, r.rolcanlogin, a.rolpassword IS NULL AS no_password, r.rolsuper, r.rolinherit,
             r.rolcreatedb, r.rolcreaterole, r.rolreplication, r.rolbypassrls, r.rolconnlimit
        FROM pg_roles r
        JOIN pg_authid a ON a.oid = r.oid
       WHERE r.rolname = 'ccr_jonathan'
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE ccr_jonathan
    expect: ok
