# CREATE USER implies LOGIN; PASSWORD and ENCRYPTED PASSWORD both store a SCRAM verifier; a password without LOGIN is allowed.
id: cmd-create-role.examples-user-password
title: CREATE USER implies LOGIN; ENCRYPTED PASSWORD and a password on a NOLOGIN role both store a SCRAM verifier
family: cmd-create-role
tier: core
feature_ids: [create-role, create-user, password, login, password-encryption]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#examples (CREATE USER davide WITH PASSWORD); PASSWORD clause"
sessions: [a]
steps:
  - sql: |
      CREATE USER ccr_davide WITH PASSWORD 'jw8s0F4'
    expect: ok
  - sql: |
      CREATE ROLE ccr_enc ENCRYPTED PASSWORD 'jw8s0F4'
    expect: ok
    comment: ENCRYPTED has no effect beyond backward compatibility
  - sql: |
      CREATE ROLE ccr_nologin_pw PASSWORD 'jw8s0F4' NOLOGIN
    expect: ok
    comment: the doc says a password is only useful with LOGIN, but may still be defined without it
  - sql: |
      SELECT r.rolname, r.rolcanlogin, a.rolpassword IS NOT NULL AS has_password,
             left(a.rolpassword, 14) AS scheme
        FROM pg_authid a
        JOIN pg_roles r ON r.oid = a.oid
       WHERE r.rolname IN ('ccr_davide', 'ccr_enc', 'ccr_nologin_pw')
       ORDER BY r.rolname
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE ccr_davide, ccr_enc, ccr_nologin_pw
    expect: ok
