# Documented example: WITH CREATEDB CREATEROLE grants both attributes and, without LOGIN, leaves the role non-login.
id: cmd-create-role.createdb-createrole-example
title: CREATE ROLE WITH CREATEDB CREATEROLE sets both attributes and no login by default
family: cmd-create-role
tier: core
feature_ids: [create-role, createdb, createrole, role-attributes]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#examples (CREATE ROLE admin WITH CREATEDB CREATEROLE)"
sessions: [a]
notes: Documented role name admin is renamed to ccr_admin to avoid cluster-wide collisions.
steps:
  - sql: |
      CREATE ROLE ccr_admin WITH CREATEDB CREATEROLE
    expect: ok
  - sql: |
      SELECT rolname, rolcreatedb, rolcreaterole, rolsuper, rolcanlogin, rolbypassrls, rolreplication
        FROM pg_roles
       WHERE rolname = 'ccr_admin'
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE ccr_admin
    expect: ok
