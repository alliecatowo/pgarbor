# Without CREATEROLE (or superuser) a role cannot run CREATE ROLE at all.
id: cmd-create-role.plain-role-cannot-create-role
title: A role without CREATEROLE gets SQLSTATE 42501 from CREATE ROLE, and no role is created
family: cmd-create-role
tier: core
feature_ids: [create-role, createrole, errors, session-authorization]
required_capabilities: [roles, catalog-introspection, select, session-authorization]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_role.sgml#description (must have CREATEROLE privilege or be a superuser)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE ccr_plain
    expect: ok
  - sql: |
      SET SESSION AUTHORIZATION ccr_plain
    expect: ok
  - sql: |
      CREATE ROLE ccr_plain_made
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET SESSION AUTHORIZATION
    expect: ok
  - sql: |
      SELECT count(*) AS made_exists FROM pg_roles WHERE rolname = 'ccr_plain_made'
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE ccr_plain
    expect: ok
