# Creating an existing relation fails with 42P07; IF NOT EXISTS downgrades it to a NOTICE and keeps the original definition.
id: create-misc.create-table-duplicate-name
title: Duplicate CREATE TABLE fails, IF NOT EXISTS keeps the original definition
family: create-misc
tier: core
feature_ids: [create-table, errors, notices]
required_capabilities: [create-table, select]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html; errcode 42P07 duplicate_table"
steps:
  - sql: |
      CREATE TABLE t (id int4)
    expect: ok
  - sql: |
      CREATE TABLE t (id int4)
    expect: error
    sqlstate: "42P07"
  - sql: |
      CREATE TABLE IF NOT EXISTS t (id text)
    expect: notice
    comment: NOTICE relation t already exists, skipping
  - sql: |
      SELECT column_name, data_type FROM information_schema.columns WHERE table_name = 't'
    expect: rows
    order: multiset
    comment: still integer, the IF NOT EXISTS definition was ignored
