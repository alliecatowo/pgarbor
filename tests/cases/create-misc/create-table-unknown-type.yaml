# Unknown column type fails with 42704 undefined_object and no relation is created.
id: create-misc.create-table-unknown-type
title: Unknown column type fails with undefined object and leaves no table
family: create-misc
tier: extended
feature_ids: [create-table, types, errors]
required_capabilities: [create-table, select]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html; errcode 42704 undefined_object"
steps:
  - sql: |
      CREATE TABLE t (a no_such_type_xyz)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT to_regclass('t') IS NULL AS t_missing
    expect: rows
    order: multiset
