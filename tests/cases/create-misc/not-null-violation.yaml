# NOT NULL rejects an explicit NULL with 23502; the failed row is not stored.
id: create-misc.not-null-violation
title: NOT NULL column rejects NULL with not_null_violation
family: create-misc
tier: core
feature_ids: [constraints, not-null, null-handling, errors]
required_capabilities: [create-table, insert, select, constraints]
provenance:
  source: hand
  ref: "PG18 ddl-constraints.html#DDL-CONSTRAINTS-NOT-NULL; errcode 23502 not_null_violation"
steps:
  - sql: |
      CREATE TABLE t (id int4 NOT NULL, v text)
    expect: ok
  - sql: |
      INSERT INTO t VALUES (NULL, 'x')
    expect: error
    sqlstate: "23502"
  - sql: |
      INSERT INTO t VALUES (1, NULL)
    expect: ok
    comment: NULL is allowed in a nullable column
  - sql: |
      SELECT id, v, v IS NULL AS v_null FROM t ORDER BY id
    expect: rows
    order: ordered
