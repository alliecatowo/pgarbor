# INHERITS naming a missing parent fails with 42P01 undefined_table.
id: create-misc.create-table-inherits-missing
title: INHERITS from a nonexistent parent fails with undefined table
family: create-misc
tier: extended
feature_ids: [inheritance, create-table, errors]
required_capabilities: [create-table, select, inheritance]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html (INHERITS); errcode 42P01 undefined_table"
steps:
  - sql: |
      CREATE TABLE t (a int4) INHERITS (no_such_parent)
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT to_regclass('t') IS NULL AS t_missing
    expect: rows
    order: multiset
