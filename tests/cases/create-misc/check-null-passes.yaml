# A CHECK constraint is satisfied by NULL (unknown result); a definite false violates it with 23514.
id: create-misc.check-null-passes
title: CHECK constraint passes on NULL and fails on a false result
family: create-misc
tier: core
feature_ids: [constraints, check-constraint, null-handling, errors]
required_capabilities: [create-table, insert, select, constraints]
provenance:
  source: hand
  ref: "PG18 ddl-constraints.html#DDL-CONSTRAINTS-CHECK-CONSTRAINTS; errcode 23514 check_violation"
steps:
  - sql: |
      CREATE TABLE t (id int4 PRIMARY KEY, v int4 CHECK (v > 0))
    expect: ok
  - sql: |
      INSERT INTO t VALUES (1, NULL)
    expect: ok
    comment: NULL makes the check unknown, which passes
  - sql: |
      INSERT INTO t VALUES (2, 0)
    expect: error
    sqlstate: "23514"
  - sql: |
      INSERT INTO t VALUES (3, 5)
    expect: ok
  - sql: |
      SELECT id, v, v IS NULL AS v_null FROM t ORDER BY id
    expect: rows
    order: ordered
