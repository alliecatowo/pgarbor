# Two parents with the same column name but different types cannot be merged; the CREATE fails atomically.
id: create-misc.inherit-type-conflict
title: Conflicting inherited column types are rejected and no table is created
family: create-misc
tier: core
feature_ids: [inheritance, create-table, errors]
required_capabilities: [create-table, select, inheritance]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html (INHERITS); errcode 42804 datatype_mismatch"
setup: |
  CREATE TABLE p1 (a int4);
  CREATE TABLE p2 (a text);
steps:
  - sql: |
      CREATE TABLE k (x int4) INHERITS (p1, p2)
    expect: error
    sqlstate: "42804"
    comment: column a has a type conflict
  - sql: |
      SELECT to_regclass('k') IS NULL AS k_missing
    expect: rows
    order: multiset
    comment: failed CREATE leaves nothing behind
