# Repeating a column name in one CREATE TABLE fails with 42701 and creates nothing.
id: create-misc.create-table-duplicate-column
title: Duplicate column name in CREATE TABLE is rejected atomically
family: create-misc
tier: extended
feature_ids: [create-table, errors]
required_capabilities: [create-table, select]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html; errcode 42701 duplicate_column"
steps:
  - sql: |
      CREATE TABLE t (a int4, a text)
    expect: error
    sqlstate: "42701"
  - sql: |
      SELECT to_regclass('t') IS NULL AS t_missing
    expect: rows
    order: multiset
  - sql: |
      CREATE TABLE t (a int4, b text)
    expect: ok
  - sql: |
      SELECT count(*) FROM information_schema.columns WHERE table_name = 't'
    expect: rows
    order: multiset
