# OUT parameters: the function's result is the final value of each OUT variable; calling omits the OUT arguments.
id: doc-plpgsql-declarations.out-params-function
title: OUT parameters form the function's result record, from SELECT * and single-field access
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, out-parameters, function-result]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-parameters (sum_n_product; sales_tax with OUT tax)"
sessions: [a]
setup: |
  CREATE FUNCTION tax_of(subtotal numeric, OUT tax numeric) LANGUAGE plpgsql AS $$
  BEGIN tax := subtotal * 0.06; END $$;
  CREATE FUNCTION sum_n_product(x int, y int, OUT sum int, OUT prod int) LANGUAGE plpgsql AS $$
  BEGIN sum := x + y; prod := x * y; END $$;
steps:
  - sql: |
      SELECT * FROM sum_n_product(2, 4)
    expect: rows
    comment: expect sum 6, prod 8
  - sql: |
      SELECT tax_of(100.00) AS tax
    expect: rows
  - sql: |
      SELECT (sum_n_product(2, 4)).prod AS prod
    expect: rows
  - sql: |
      SELECT sum, prod FROM sum_n_product(0, 0)
    expect: rows
    comment: a zero input still assigns both OUT variables
