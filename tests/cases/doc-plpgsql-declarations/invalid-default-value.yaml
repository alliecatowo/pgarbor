# A DEFAULT that cannot be converted to the variable's type fails with 22P02 when the block is entered, not at CREATE.
id: doc-plpgsql-declarations.invalid-default-value
title: DEFAULT with an invalid literal for the variable type raises 22P02 at block entry
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, variable-declaration, default-initializer, errors]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-variables (DEFAULT evaluated on block entry)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION bad_default() RETURNS int LANGUAGE plpgsql AS $$
      DECLARE q int := 'abc';
      BEGIN RETURN q; END $$
    expect: ok
    comment: the body is not evaluated at CREATE, so the bad literal is only found when called
  - sql: |
      SELECT bad_default()
    expect: error
    sqlstate: "22P02"
