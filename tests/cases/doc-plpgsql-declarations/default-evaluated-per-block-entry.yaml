# A variable default is evaluated each time its block is entered, not once per function call.
id: doc-plpgsql-declarations.default-evaluated-per-block-entry
title: DEFAULT expressions re-run on every block entry, including nested blocks inside a loop
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, variable-declaration, default-initializer, sequences, loops]
required_capabilities: [plpgsql, create-function, create-sequence, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations (default value evaluated each time the block is entered)"
sessions: [a]
setup: |
  CREATE SEQUENCE s_blk;
  CREATE FUNCTION blk_defaults() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE
    i int;
    acc text := '';
  BEGIN
    FOR i IN 1..3 LOOP
      DECLARE
        v int := nextval('s_blk');
      BEGIN
        acc := acc || v::text;
      END;
    END LOOP;
    RETURN acc;
  END $$;
  CREATE FUNCTION fn_default_once() RETURNS bigint LANGUAGE plpgsql AS $$
  DECLARE
    v bigint := nextval('s_blk');
  BEGIN
    RETURN v;
  END $$;
steps:
  - sql: |
      SELECT blk_defaults() AS seen
    expect: rows
    comment: the nested block's DEFAULT runs three times, giving 1, 2, 3
  - sql: |
      SELECT fn_default_once() AS first_call
    expect: rows
  - sql: |
      SELECT fn_default_once() AS second_call
    expect: rows
    comment: each function call enters its block afresh, so the sequence advances to 5
