# A COLLATE clause on a local variable overrides the collation that would otherwise be inherited from the parameters.
id: doc-plpgsql-declarations.collate-option
title: Local variable COLLATE "C" controls string comparison independent of the parameter collation
family: doc-plpgsql-declarations
tier: extended
feature_ids: [plpgsql, collation, variable-declaration]
required_capabilities: [plpgsql, create-function, select, collation-c]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-collation (Collation of PL/pgSQL Variables; COLLATE option)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION col_c() RETURNS boolean LANGUAGE plpgsql AS $$
      DECLARE a text COLLATE "C" := 'B';
      BEGIN RETURN a < 'a'; END $$
    expect: ok
  - sql: |
      SELECT col_c() AS b_before_a_in_c
    expect: rows
    comment: under C collation 'B' (0x42) sorts before 'a' (0x61), so true
