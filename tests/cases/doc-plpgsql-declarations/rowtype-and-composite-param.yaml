# %ROWTYPE holds a full table row for SELECT INTO; a table-typed parameter exposes its fields via $1 and by name.
id: doc-plpgsql-declarations.rowtype-and-composite-param
title: SELECT INTO a %ROWTYPE variable and read fields; a composite parameter exposes its columns
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, rowtype, composite-parameter, select-into]
required_capabilities: [plpgsql, create-function, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-rowtypes (Row Types; merge_fields with table-typed parameter)"
sessions: [a]
setup: |
  CREATE TABLE sales (itemno int, quantity int, price numeric);
  INSERT INTO sales VALUES (1, 2, 3.5), (1, 1, 10), (2, 5, 1);
  CREATE FUNCTION rt_fields() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE s sales%ROWTYPE;
  BEGIN
    SELECT * INTO s FROM sales WHERE itemno = 2;
    RETURN s.quantity || '/' || s.price;
  END $$;
  CREATE FUNCTION rt_param(t sales) RETURNS text LANGUAGE plpgsql AS $$
  BEGIN RETURN t.itemno || ':' || t.quantity; END $$;
steps:
  - sql: |
      SELECT rt_fields() AS fields
    expect: rows
  - sql: |
      SELECT rt_param(s.*) AS composite_arg FROM sales s WHERE quantity = 5
    expect: rows
    order: multiset
