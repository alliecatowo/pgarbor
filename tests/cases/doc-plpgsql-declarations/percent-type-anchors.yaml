# %TYPE copies a column's type, including ARRAY decoration; a %TYPE reference to a missing column is a compile-time error.
id: doc-plpgsql-declarations.percent-type-anchors
title: table.column%TYPE and array %TYPE anchors; a missing column fails at CREATE FUNCTION
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, percent-type, array-types, variable-declaration]
required_capabilities: [plpgsql, create-function, create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-type (Copying Types, %TYPE)"
sessions: [a]
setup: |
  CREATE TABLE sales (itemno int, quantity int, price numeric);
  INSERT INTO sales VALUES (1, 2, 3.5), (1, 1, 10), (2, 5, 1);
  CREATE FUNCTION pt_scalar() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE u sales.itemno%TYPE := 7;
  BEGIN RETURN u::text || ':' || pg_typeof(u)::text; END $$;
  CREATE FUNCTION pt_array() RETURNS text LANGUAGE plpgsql AS $$
  DECLARE a sales.itemno%TYPE ARRAY[4] := ARRAY[1, 2];
  BEGIN RETURN array_to_string(a, ','); END $$;
steps:
  - sql: |
      SELECT pt_scalar() AS scalar_type
    expect: rows
    comment: the variable takes the integer type of sales.itemno
  - sql: |
      SELECT pt_array() AS array_form
    expect: rows
  - sql: |
      CREATE FUNCTION pt_bad() RETURNS int LANGUAGE plpgsql AS $$
      DECLARE u sales.nosuch%TYPE;
      BEGIN RETURN 1; END $$
    expect: error
    sqlstate: "42703"
