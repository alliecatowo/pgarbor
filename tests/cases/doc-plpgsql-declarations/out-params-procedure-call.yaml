# A procedure with OUT parameters returns them from CALL when NULL placeholders are passed; omitting a parameter is an error.
id: doc-plpgsql-declarations.out-params-procedure-call
title: CALL with NULL placeholders for OUT parameters returns their values; a short argument list is rejected
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, out-parameters, procedures, call]
required_capabilities: [plpgsql, create-procedure, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-parameters (CALL sum_n_product(2, 4, NULL, NULL))"
sessions: [a]
setup: |
  CREATE PROCEDURE sum_n_product_p(x int, y int, OUT sum int, OUT prod int) LANGUAGE plpgsql AS $$
  BEGIN sum := x + y; prod := x * y; END $$;
steps:
  - sql: |
      CALL sum_n_product_p(2, 4, NULL, NULL)
    expect: rows
    comment: expect sum 6, prod 8
  - sql: |
      CALL sum_n_product_p(2, 4)
    expect: error
    sqlstate: "42883"
    comment: all parameters, including OUT ones, must be given in a CALL
