# DEFAULT, := and = initializers; a later initializer may read an earlier variable; CONSTANT with a DEFAULT expression.
id: doc-plpgsql-declarations.default-equals-and-dependent-init
title: Variable initializers accept DEFAULT, := and = and may reference earlier variables
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, variable-declaration, default-initializer, constant]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations (Declarations; general syntax; DEFAULT; CONSTANT; initialization expressions)"
sessions: [a]
setup: |
  CREATE FUNCTION decl_init() RETURNS int LANGUAGE plpgsql AS $$
  DECLARE
    x int = 3;
    y int := x * 2;
    z CONSTANT int DEFAULT x + y;
    w int DEFAULT 100;
  BEGIN
    RETURN x + y + z + w;
  END $$;
steps:
  - sql: |
      SELECT decl_init() AS total
    expect: rows
    comment: x=3, y=6, z=9, w=100 so the total is 118
