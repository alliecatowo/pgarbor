# A named parameter can be qualified with the function name and a labelled block's variable with its label; an ALIAS cannot be qualified by the function name.
id: doc-plpgsql-declarations.qualified-names-and-labels
title: Qualify parameters by function name and variables by block label; alias-style parameters are not qualifiable
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, function-parameters, alias, block-labels, qualified-names]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-parameters (sales_tax.subtotal qualification; labelled inner block)"
sessions: [a]
setup: |
  CREATE FUNCTION fq(subtotal int) RETURNS int LANGUAGE plpgsql AS $$
  BEGIN RETURN fq.subtotal * 2; END $$;
  CREATE FUNCTION lbl(x int) RETURNS int LANGUAGE plpgsql AS $$
  <<blk>> DECLARE v int := x + 1;
  BEGIN RETURN blk.v * 10; END $$;
steps:
  - sql: |
      SELECT fq(5) AS qualified_param
    expect: rows
  - sql: |
      SELECT lbl(1) AS labelled_var
    expect: rows
  - sql: |
      CREATE FUNCTION s2(int) RETURNS int LANGUAGE plpgsql AS $$
      DECLARE subtotal ALIAS FOR $1;
      BEGIN RETURN s2.subtotal * 2; END $$
    expect: ok
    comment: the function name does not qualify an ALIAS, so the reference fails at run time
  - sql: |
      SELECT s2(5)
    expect: error
    sqlstate: "42P01"
