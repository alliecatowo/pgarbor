# A RECORD variable has no structure until assigned; reading a field first raises 55000, and SELECT INTO assigns it.
id: doc-plpgsql-declarations.record-unassigned-55000
title: Reading a field of an unassigned RECORD raises 55000; after SELECT INTO it works
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, record-variable, select-into, errors]
required_capabilities: [plpgsql, create-function, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-records (Record Types)"
sessions: [a]
setup: |
  CREATE FUNCTION rec_unassigned() RETURNS int LANGUAGE plpgsql AS $$
  DECLARE r record;
  BEGIN RETURN r.x; END $$;
  CREATE FUNCTION rec_assigned(x int) RETURNS int LANGUAGE plpgsql AS $$
  DECLARE r record;
  BEGIN SELECT x AS a INTO r; RETURN r.a; END $$;
steps:
  - sql: |
      SELECT rec_unassigned()
    expect: error
    sqlstate: "55000"
    comment: the tuple structure of a not-yet-assigned record is indeterminate
  - sql: |
      SELECT rec_assigned(9) AS a
    expect: rows
