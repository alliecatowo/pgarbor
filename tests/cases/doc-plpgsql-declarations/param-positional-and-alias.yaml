# Parameters are reachable as $n, by declared name, or through ALIAS FOR $n; an alias may name any parameter.
id: doc-plpgsql-declarations.param-positional-and-alias
title: Function parameters are usable as $n, declared names, and ALIAS FOR $n
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, function-parameters, alias]
required_capabilities: [plpgsql, create-function, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-parameters (Declaring Function Parameters; ALIAS)"
sessions: [a]
setup: |
  CREATE FUNCTION p_named(subtotal int) RETURNS int LANGUAGE plpgsql AS $$
  BEGIN RETURN subtotal * 2; END $$;
  CREATE FUNCTION p_alias(int) RETURNS int LANGUAGE plpgsql AS $$
  DECLARE subtotal ALIAS FOR $1;
  BEGIN RETURN subtotal * 2; END $$;
  CREATE FUNCTION p_dollar(int, int) RETURNS int LANGUAGE plpgsql AS $$
  BEGIN RETURN $1 * 10 + $2; END $$;
  CREATE FUNCTION p_alias_second(a int, b int) RETURNS int LANGUAGE plpgsql AS $$
  DECLARE s ALIAS FOR $2;
  BEGIN RETURN a * 100 + s; END $$;
steps:
  - sql: |
      SELECT p_named(5) AS named, p_alias(5) AS aliased, p_dollar(3, 4) AS positional, p_alias_second(1, 2) AS second
    expect: rows
    comment: expect 10, 10, 34, 102
