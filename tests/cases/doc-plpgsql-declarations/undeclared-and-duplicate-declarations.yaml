# Variables must be declared before use, and a name may not be declared twice in one block; both are rejected at CREATE FUNCTION.
id: doc-plpgsql-declarations.undeclared-and-duplicate-declarations
title: Assigning an undeclared variable and declaring a name twice are both rejected at CREATE
family: doc-plpgsql-declarations
tier: core
feature_ids: [plpgsql, variable-declaration, errors]
required_capabilities: [plpgsql, create-function, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations (All variables used in a block must be declared)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION undecl_var() RETURNS int LANGUAGE plpgsql AS $$
      BEGIN zzz := 1; RETURN 1; END $$
    expect: error
    sqlstate: "42601"
    comment: zzz is not a known variable
  - sql: |
      CREATE FUNCTION dup_decl() RETURNS int LANGUAGE plpgsql AS $$
      DECLARE x int; x int;
      BEGIN RETURN 1; END $$
    expect: error
    sqlstate: "42601"
    comment: duplicate declaration in the same block
