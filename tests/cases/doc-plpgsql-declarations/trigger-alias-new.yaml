# ALIAS FOR NEW in a trigger function renames the predetermined NEW record and its fields are read and written through the alias.
id: doc-plpgsql-declarations.trigger-alias-new
title: ALIAS FOR NEW in a BEFORE INSERT trigger lets the function modify the inserted row
family: doc-plpgsql-declarations
tier: extended
feature_ids: [plpgsql, alias, trigger, new-record]
required_capabilities: [plpgsql, create-function, create-table, create-trigger, insert, select]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-declarations-alias (newname ALIAS FOR oldname; prior ALIAS FOR old)"
sessions: [a]
setup: |
  CREATE TABLE tr (id int, quantity int);
  CREATE FUNCTION tr_fn() RETURNS trigger LANGUAGE plpgsql AS $$
  DECLARE n ALIAS FOR NEW;
  BEGIN n.quantity := n.quantity * 2; RETURN n; END $$;
  CREATE TRIGGER tr_b BEFORE INSERT ON tr FOR EACH ROW EXECUTE FUNCTION tr_fn();
steps:
  - sql: |
      INSERT INTO tr VALUES (1, 4), (2, 5)
    expect: ok
  - sql: |
      SELECT id, quantity FROM tr ORDER BY id
    expect: rows
    order: ordered
