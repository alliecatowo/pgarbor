# JSON_QUERY RETURNING a composite type, and rejection of pseudo-types as RETURNING targets.
id: sqljson-queryfuncs.json-query-record-returning
title: JSON_QUERY RETURNING a composite type and rejects pseudo-type targets
family: sqljson-queryfuncs
tier: extended
feature_ids: [sql-json, json-query, composite-types, errors]
required_capabilities: [create-type, select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (record type returning section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TYPE comp_abc AS (a text, b int, c timestamp);
steps:
  - sql: |
      SELECT (JSON_QUERY(jsonb '{"rec": "(abc,42,01.02.2003)"}', '$.rec' RETURNING comp_abc OMIT QUOTES)).b AS field_b
    expect: rows
  - sql: |
      SELECT JSON_QUERY(jsonb '[3,4]', '$[*]' RETURNING anyarray EMPTY OBJECT ON ERROR)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT JSON_VALUE(jsonb '["1"]', '$[*]' RETURNING record)
    expect: error
    sqlstate: "0A000"
