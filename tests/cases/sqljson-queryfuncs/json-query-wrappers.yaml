# JSON_QUERY wrapper modes over scalars, arrays and objects stored in a table.
id: sqljson-queryfuncs.json-query-wrappers
title: JSON_QUERY wrapper modes over a table of scalar, array and object documents
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-query, jsonb]
required_capabilities: [create-table, insert, select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (JSON_QUERY WITH/WITHOUT WRAPPER section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE qw (id int4 PRIMARY KEY, js jsonb);
  INSERT INTO qw VALUES (1, 'null'), (2, '12.3'), (3, 'true'), (4, '"aaa"'), (5, '[1, null, "2"]'), (6, '{"a": 1, "b": [2]}');
steps:
  - sql: |
      SELECT id,
             JSON_QUERY(js, '$') AS unspec,
             JSON_QUERY(js, '$' WITHOUT WRAPPER) AS without_w,
             JSON_QUERY(js, '$' WITH CONDITIONAL WRAPPER) AS cond_w,
             JSON_QUERY(js, '$' WITH UNCONDITIONAL ARRAY WRAPPER) AS uncond_w
      FROM qw ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id,
             JSON_QUERY(js, 'strict $[*]') AS unspec,
             JSON_QUERY(js, 'strict $[*]' WITHOUT WRAPPER) AS without_w,
             JSON_QUERY(js, 'strict $[*]' WITH CONDITIONAL WRAPPER) AS cond_w,
             JSON_QUERY(js, 'strict $[*]' WITH UNCONDITIONAL ARRAY WRAPPER) AS uncond_w
      FROM qw ORDER BY id
    expect: rows
    order: ordered
    comment: strict wildcard path over scalars, arrays and objects, with and without wrappers
