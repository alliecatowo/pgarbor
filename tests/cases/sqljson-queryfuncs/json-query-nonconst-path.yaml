# A computed (non-constant) SQL/JSON path is evaluated per row; an invalid computed path raises 42601.
id: sqljson-queryfuncs.json-query-nonconst-path
title: JSON_QUERY and JSON_EXISTS with computed path expressions and invalid path failure
family: sqljson-queryfuncs
tier: extended
feature_ids: [sql-json, json-query, json-exists, jsonpath]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (non-constant JSON path extension)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_EXISTS(jsonb '{"a": 123}', '$' || '.' || 'a') AS exists_computed,
             JSON_QUERY(jsonb '{"a": 123}', '$' || '.' || 'a') AS query_computed,
             JSON_QUERY(jsonb '{"a": 123}', '$' || '.' || 'a' WITH WRAPPER) AS query_wrapped
    expect: rows
  - sql: |
      SELECT JSON_QUERY(jsonb '{"a": 123}', 'error' || ' ' || 'error')
    expect: error
    sqlstate: "42601"
