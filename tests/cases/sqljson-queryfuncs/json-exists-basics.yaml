# JSON_EXISTS presence checks over jsonb rows, including SQL NULL input.
id: sqljson-queryfuncs.json-exists-basics
title: JSON_EXISTS root and member presence over jsonb rows including NULL input
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-exists, jsonb, jsonpath]
required_capabilities: [create-table, insert, select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (JSON_EXISTS section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE jdoc (id int4 PRIMARY KEY, js jsonb);
  INSERT INTO jdoc VALUES (1, '1'), (2, 'null'), (3, '[]'), (4, '{}'), (5, '{"a": 2, "b": 1}'), (6, NULL);
steps:
  - sql: |
      SELECT id, JSON_EXISTS(js, '$') AS root_exists FROM jdoc ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, JSON_EXISTS(js, '$.a') AS a_exists FROM jdoc ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT JSON_EXISTS(NULL::jsonb, '$') AS null_input
    expect: rows
    comment: NULL context item yields NULL, not FALSE
