# ERROR ON ERROR surfaces scalar coercion failures with the input-function SQLSTATE.
id: sqljson-queryfuncs.json-value-coercion-error
title: JSON_VALUE ERROR ON ERROR surfaces invalid integer and overlong char coercions
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-value, errors, text, numeric]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (JSON_VALUE RETURNING int/char ERROR ON ERROR)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_VALUE(jsonb '"aaa"', '$' RETURNING int ERROR ON ERROR)
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT JSON_VALUE(jsonb '"1.23"', '$' RETURNING int ERROR ON ERROR)
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT JSON_VALUE(jsonb '"aaa"', '$' RETURNING char(2) ERROR ON ERROR)
    expect: error
    sqlstate: "22001"
  - sql: |
      SELECT JSON_VALUE(jsonb '"aaa"', '$' RETURNING char(5)) AS padded
    expect: rows
