# PASSING variables feed JSON_EXISTS filter predicates; includes the boolean-predicate extension.
id: sqljson-queryfuncs.json-exists-passing
title: JSON_EXISTS with PASSING variables in filter expressions
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-exists, jsonpath, jsonb]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (JSON_EXISTS PASSING and boolean extension)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_EXISTS(jsonb '{"a": 1, "b": 2}', '$.* ? (@ > $x)' PASSING 1 AS x) AS gt_one,
             JSON_EXISTS(jsonb '{"a": 1, "b": 2}', '$.* ? (@ > $x && @ < $y)' PASSING 0 AS x, 2 AS y) AS in_range,
             JSON_EXISTS(jsonb '{"a": 1, "b": 2}', '$.* ? (@ > $x && @ < $y)' PASSING 0 AS x, 1 AS y) AS empty_range
    expect: rows
  - sql: |
      SELECT JSON_EXISTS(jsonb '{"a": 1, "b": 2}', '$.* ? (@ > $x)' PASSING '1' AS x) AS text_passing
    expect: rows
    comment: text-typed variable compared with numbers in the filter
  - sql: |
      SELECT JSON_EXISTS(jsonb '1', '$ > 2') AS bool_pred, JSON_EXISTS(jsonb '1', '$ < 2') AS bool_pred_true
    expect: rows
    comment: extension - top-level boolean predicate is accepted by JSON_EXISTS
