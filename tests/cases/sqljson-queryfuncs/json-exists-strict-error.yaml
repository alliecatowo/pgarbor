# Strict member access on a non-object raises an error only when ERROR ON ERROR is requested.
id: sqljson-queryfuncs.json-exists-strict-error
title: JSON_EXISTS strict member accessor error surfaces only with ERROR ON ERROR
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-exists, jsonpath, errors]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql; jsonpath_exec.c ERRCODE_SQL_JSON_MEMBER_NOT_FOUND"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_EXISTS(jsonb '1', 'strict $.a' ERROR ON ERROR)
    expect: error
    sqlstate: "2203A"
    comment: member accessor applied to a number in strict mode
  - sql: |
      SELECT JSON_EXISTS(jsonb '1', 'strict $.a') AS default_false
    expect: rows
    comment: default ON ERROR FALSE suppresses the structural error
  - sql: |
      SELECT JSON_EXISTS(jsonb '[1, "aaa", {"a": 1}]', 'strict $.a' ERROR ON ERROR)
    expect: error
    sqlstate: "2203A"
