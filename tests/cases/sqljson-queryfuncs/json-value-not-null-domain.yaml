# RETURNING a NOT NULL domain: a NULL result or NULL ON EMPTY default violates the domain.
id: sqljson-queryfuncs.json-value-not-null-domain
title: JSON_VALUE RETURNING NOT NULL domain rejects NULL results
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-value, domains, not-null, errors]
required_capabilities: [create-domain, select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (sqljsonb_int_not_null domain checks)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE DOMAIN sqljsonb_int_not_null AS int NOT NULL;
steps:
  - sql: |
      SELECT JSON_VALUE(jsonb 'null', '$' RETURNING sqljsonb_int_not_null ERROR ON ERROR)
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT JSON_VALUE(jsonb '1', '$.a' RETURNING sqljsonb_int_not_null DEFAULT 2 ON EMPTY ERROR ON ERROR) AS filled
    expect: rows
  - sql: |
      SELECT JSON_VALUE(jsonb '1', '$.a' RETURNING sqljsonb_int_not_null DEFAULT NULL ON EMPTY ERROR ON ERROR)
    expect: error
    sqlstate: "23502"
