# ON EMPTY alternatives for JSON_QUERY when the path matches nothing, and ERROR ON EMPTY raising 22035.
id: sqljson-queryfuncs.json-query-on-empty
title: JSON_QUERY ON EMPTY alternatives and ERROR ON EMPTY SQLSTATE
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-query, errors, jsonb]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (JSON_QUERY ON EMPTY section)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_QUERY(jsonb '[]', '$[*]') AS default_null,
             JSON_QUERY(jsonb '[]', '$[*]' NULL ON EMPTY) AS explicit_null,
             JSON_QUERY(jsonb '[]', '$[*]' EMPTY ARRAY ON EMPTY) AS empty_arr,
             JSON_QUERY(jsonb '[]', '$[*]' EMPTY OBJECT ON EMPTY) AS empty_obj,
             JSON_QUERY(jsonb '[]', '$[*]' DEFAULT '"empty"' ON EMPTY) AS dflt
    expect: rows
  - sql: |
      SELECT JSON_QUERY(jsonb '[]', '$[*]' ERROR ON EMPTY)
    expect: error
    sqlstate: "22035"
  - sql: |
      SELECT JSON_QUERY(jsonb '[]', '$[*]' ERROR ON EMPTY EMPTY ARRAY ON ERROR)
    expect: error
    sqlstate: "22035"
  - sql: |
      SELECT JSON_QUERY(jsonb '[1,2]', '$[*]' DEFAULT '"empty"' ON ERROR) AS multi_default
    expect: rows
