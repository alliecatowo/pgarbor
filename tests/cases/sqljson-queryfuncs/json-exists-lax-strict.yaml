# Lax mode unwraps arrays for member access; strict structural errors are suppressed to FALSE
# by the default ON ERROR FALSE for JSON_EXISTS.
id: sqljson-queryfuncs.json-exists-lax-strict
title: JSON_EXISTS lax array unwrapping versus strict mode with default ON ERROR
family: sqljson-queryfuncs
tier: core
feature_ids: [sql-json, json-exists, jsonpath, jsonb]
required_capabilities: [select, jsonb]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_queryfuncs.sql (JSON_EXISTS section)"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT JSON_EXISTS(jsonb '[1, "aaa", {"a": 1}]', 'lax $.a') AS lax_unwrap,
             JSON_EXISTS(jsonb '[1, "aaa", {"a": 1}]', 'strict $.a') AS strict_default
    expect: rows
  - sql: |
      SELECT JSON_EXISTS(jsonb '{"b": 1, "a": 2}', '$.a') AS present,
             JSON_EXISTS(jsonb '{}', '$.a') AS empty_object,
             JSON_EXISTS(jsonb 'null', '$.a') AS null_scalar,
             JSON_EXISTS(jsonb '[]', '$.a') AS empty_array
    expect: rows
  - sql: |
      SELECT JSON_EXISTS(jsonb '{"a": {"b": 1}}', '$.a.b') AS nested_present,
             JSON_EXISTS(jsonb '{"a": 1, "b": 2}', '$.a.b') AS nested_missing
    expect: rows
