# format() basics: %s, %%, %I and %L quoting, and NULL handling for %s and %L.
id: text.format-basic
title: format handles %s, literal percent, %I and %L including NULL arguments
family: text
tier: core
feature_ids: [text, format, nulls]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT format(NULL) IS NULL AS null_fmt,
             format('Hello') AS plain,
             format('Hello %s', 'World') AS one_s,
             format('Hello %%') AS pct,
             format('Hello %%%%') AS two_pct,
             format('%s%s%s', 'Hello', NULL, 'World') AS null_s
    expect: rows
  - sql: |
      SELECT format('INSERT INTO %I VALUES(%L,%L)', 'mytab', 10, 'Hello') AS ins_a,
             format('INSERT INTO %I VALUES(%L,%L)', 'mytab', 10, NULL) AS ins_b,
             format('INSERT INTO %I VALUES(%L,%L)', 'mytab', NULL, 'Hello') AS ins_c
    expect: rows
