# format() field widths with left and right alignment, NULL and empty arguments, and
# negative widths from an argument (the '*' form).
id: text.format-width
title: format field width and alignment for %s, %I and %L including NULL and negative widths
family: text
tier: extended
feature_ids: [text, format, nulls]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT format('>>%10s<<', 'Hello') AS right_pad,
             format('>>%10s<<', NULL) AS null_right,
             format('>>%10s<<', '') AS empty_right,
             format('>>%-10s<<', '') AS empty_left,
             format('>>%-10s<<', 'Hello') AS left_pad,
             format('>>%-10s<<', NULL) AS null_left
    expect: rows
  - sql: |
      SELECT format('>>%1$10s<<', 'Hello') AS pos_width,
             format('>>%1$-10I<<', 'Hello') AS pos_ident,
             format('>>%2$*1$L<<', 10, 'Hello') AS star_lit,
             format('>>%2$*1$L<<', 10, NULL) AS star_null,
             format('>>%2$*1$L<<', -10, NULL) AS star_neg,
             format('>>%*s<<', 10, 'Hello') AS star_plain
    expect: rows
