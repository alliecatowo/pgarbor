# VARIADIC array arguments to concat and concat_ws, including NULL and empty arrays.
id: text.concat-variadic
title: concat and concat_ws accept VARIADIC arrays, with NULL and empty array edge cases
family: text
tier: extended
feature_ids: [text, concat, concat-ws, variadic, arrays, nulls]
required_capabilities: [select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT concat(VARIADIC array[1,2,3]) AS c,
             concat_ws(',', VARIADIC array[1,2,3]) AS cws,
             concat(VARIADIC NULL::int[]) IS NULL AS null_array_is_null,
             concat(VARIADIC '{}'::int[]) = '' AS empty_array_is_empty
    expect: rows
  - sql: |
      SELECT concat_ws(',', 10) AS one_arg
    expect: rows
