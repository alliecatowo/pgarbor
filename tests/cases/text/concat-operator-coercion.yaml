# Implicit coercion of non-text operands in || is allowed when the other side is text or unknown;
# int || numeric has no operator. Adapted from pg-regress text.sql.
id: text.concat-operator-coercion
title: Implicit coercion in text concatenation works for text and unknown, fails for int || numeric
family: text
tier: core
feature_ids: [text, concat-operator, implicit-coercion, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 'four: '::text || 2+2 AS explicit_text_lhs
    expect: rows
  - sql: |
      SELECT 'four: ' || 2+2 AS unknown_lhs
    expect: rows
  - sql: |
      SELECT 3 || 4.0
    expect: error
    sqlstate: "42883"
    comment: no operator int4 || numeric
