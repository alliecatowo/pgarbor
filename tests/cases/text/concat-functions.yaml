# concat / concat_ws argument handling: NULLs are skipped, separator-NULL yields NULL.
id: text.concat-functions
title: concat and concat_ws skip NULL arguments and a NULL separator yields NULL
family: text
tier: core
feature_ids: [text, concat, concat-ws, nulls]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT concat('one') AS one,
             concat(1, 2, 3, 'hello', true, false, NULL) AS mixed_skip_nulls,
             concat_ws('#', 'one') AS single,
             concat_ws(',', 10, 20, NULL, 30) AS skip_null_sep,
             concat_ws('', 10, 20, NULL, 30) AS empty_sep,
             concat_ws(NULL, 10, 20, NULL, 30) IS NULL AS null_sep_is_null
    expect: rows
