# format() error paths: NULL identifier, unknown type specifier, and argument index 0.
id: text.format-errors
title: format raises errors for NULL identifiers, unknown specifiers and argument index zero
family: text
tier: core
feature_ids: [text, format, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT format('INSERT INTO %I VALUES(%L,%L)', NULL, 10, 'Hello')
    expect: error
    sqlstate: "22004"
    comment: NULL is not allowed for %I
  - sql: |
      SELECT format('Hello %x', 20)
    expect: error
    sqlstate: "22023"
    comment: unrecognized format() type specifier
  - sql: |
      SELECT format('%0$s', 'Hello')
    expect: error
    comment: argument numbering starts at 1
  - sql: |
      SELECT format('Hello %s %s', 'World')
    expect: error
    comment: too few arguments
  - sql: |
      SELECT format('Hello %s')
    expect: error
    comment: too few arguments with no arguments after the format string
