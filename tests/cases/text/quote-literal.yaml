# quote_literal escapes embedded single quotes and backslashes; the empty string quotes to ''.
id: text.quote-literal
title: quote_literal doubles quotes and handles backslashes and the empty string
family: text
tier: core
feature_ids: [text, quoting, string-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT quote_literal('') AS empty_q,
             quote_literal('abc''') AS quote_q,
             quote_literal(E'\\') AS backslash_q
    expect: rows
  - sql: |
      SELECT quote_literal(NULL) IS NULL AS null_is_null
    expect: rows
