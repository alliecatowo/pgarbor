# Since PostgreSQL 8.3 there is no implicit int -> text cast, so length(integer) does not resolve.
id: text.length-integer-error
title: length of an integer argument fails with undefined function
family: text
tier: core
feature_ids: [text, functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT length(42)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT length('42'::text) AS explicit_cast_ok
    expect: rows
