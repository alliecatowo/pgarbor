# reverse, left and right, including negative counts that drop characters from the other end.
id: text.reverse-left-right
title: reverse, left and right over positive and negative counts
family: text
tier: core
feature_ids: [text, string-functions, generate-series]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT reverse('abcde') AS r, reverse('') = '' AS empty_ok
    expect: rows
  - sql: |
      SELECT i, left('ahoj', i) AS l, right('ahoj', i) AS r
      FROM generate_series(-5, 5) AS t(i)
      ORDER BY i
    expect: rows
    order: ordered
