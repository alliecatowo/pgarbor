# A text column holding NULL, '' and a non-empty value: NULL propagates through || and length,
# while concat and empty-string comparisons treat them differently.
id: text.column-nulls
title: NULL versus empty string in a text column through concatenation, length and comparison
family: text
tier: core
feature_ids: [text, nulls, insert, select, concat]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "src/test/regress/sql/text.sql (text_tbl-style fixture); PG18 docs functions-string.html"
sessions: [a]
setup: |
  CREATE TABLE tt (id int4 PRIMARY KEY, v text);
  INSERT INTO tt VALUES (1, 'x'), (2, ''), (3, NULL);
steps:
  - sql: |
      SELECT id, v IS NULL AS v_null, v = '' AS v_empty, length(v) AS len,
             v || '!' AS bang, concat(v, '!') AS cbang
      FROM tt
      ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n_empty FROM tt WHERE v = ''
    expect: rows
  - sql: |
      SELECT count(*) AS n_null FROM tt WHERE v IS NULL
    expect: rows
