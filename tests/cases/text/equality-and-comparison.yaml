# text equality and ordering on literals; adapted from pg-regress text.sql (first two queries).
id: text.equality-and-comparison
title: text literal equality is true for identical strings and false for a differing string
family: text
tier: core
feature_ids: [text, comparison]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/text.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT text 'this is a text string' = text 'this is a text string' AS same,
             text 'this is a text string' = text 'this is a text strin' AS differs,
             text 'abc' < text 'abcd' AS prefix_sorts_first
    expect: rows
