# Keyword TAG is case-insensitive, command tag values are matched case-insensitively, and repeated values are kept but fire once per command.
id: cmd-create-event-trigger.filter-case-and-duplicate-values
title: Lower-case tag values and repeated values in TAG IN fire once for CREATE TABLE
family: cmd-create-event-trigger
tier: core
feature_ids: [create-event-trigger, event-triggers, event-trigger-tag-filter]
required_capabilities: [event-triggers, plpgsql, create-function, create-table]
provenance:
  source: pg-docs
  ref: "ref/create_event_trigger.sgml#sql-createeventtrigger"
setup: |
  CREATE TABLE evlog (seq int4 GENERATED ALWAYS AS IDENTITY, evt text, tag text);
  CREATE FUNCTION log_start() RETURNS event_trigger LANGUAGE plpgsql AS $$
  BEGIN INSERT INTO evlog (evt, tag) VALUES (tg_event, tg_tag); END; $$;
  CREATE EVENT TRIGGER f_ci ON ddl_command_start
    WHEN tag IN ('create table', 'CREATE TABLE')
    EXECUTE FUNCTION log_start();
steps:
  - sql: |
      CREATE TABLE tc (a int4)
    expect: ok
    comment: the trigger fires once even though the value list names the tag twice
  - sql: |
      SELECT evt, tag FROM evlog ORDER BY seq
    expect: rows
    order: ordered
  - sql: |
      SELECT array_to_string(evttags, ',') AS tags FROM pg_event_trigger WHERE evtname = 'f_ci'
    expect: rows
    order: ordered
    comment: the stored tag list keeps the repeated value and upper-cases it
