# Event trigger names are unique per database; a trigger created inside a rolled-back transaction does not persist.
id: cmd-create-event-trigger.duplicate-name-and-rollback
title: Duplicate event trigger name fails with duplicate_object and a rolled-back CREATE leaves no trigger
family: cmd-create-event-trigger
tier: core
feature_ids: [create-event-trigger, event-triggers, transactions]
required_capabilities: [event-triggers, plpgsql, create-function, transactions]
provenance:
  source: pg-docs
  ref: "ref/create_event_trigger.sgml#sql-createeventtrigger"
setup: |
  CREATE FUNCTION f_noop() RETURNS event_trigger LANGUAGE plpgsql AS $$ BEGIN NULL; END; $$;
steps:
  - sql: |
      CREATE EVENT TRIGGER e_dup ON ddl_command_end EXECUTE FUNCTION f_noop()
    expect: ok
  - sql: |
      CREATE EVENT TRIGGER e_dup ON ddl_command_start EXECUTE FUNCTION f_noop()
    expect: error
    sqlstate: "42710"
    comment: the name is already taken, regardless of the event
  - sql: |
      BEGIN;
      CREATE EVENT TRIGGER e_rb ON ddl_command_start EXECUTE FUNCTION f_noop();
      ROLLBACK
    expect: ok
  - sql: |
      SELECT evtname, evtevent FROM pg_event_trigger ORDER BY evtname
    expect: rows
    order: ordered
    comment: only e_dup remains
