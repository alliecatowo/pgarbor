# Tag filtering is not available for login triggers, and DROP EVENT TRIGGER cannot be filtered or traced by event triggers.
id: cmd-create-event-trigger.unsupported-filter-combinations
title: Tag filters on login events and on the DROP EVENT TRIGGER tag fail with feature_not_supported
family: cmd-create-event-trigger
tier: extended
feature_ids: [create-event-trigger, event-triggers, event-trigger-tag-filter, login-event-trigger]
required_capabilities: [event-triggers, plpgsql, create-function]
provenance:
  source: pg-docs
  ref: "ref/create_event_trigger.sgml#sql-createeventtrigger"
setup: |
  CREATE FUNCTION f_noop() RETURNS event_trigger LANGUAGE plpgsql AS $$ BEGIN NULL; END; $$;
steps:
  - sql: |
      CREATE EVENT TRIGGER e_login_tag ON login WHEN TAG IN ('CREATE TABLE') EXECUTE FUNCTION f_noop()
    expect: error
    sqlstate: "0A000"
    comment: login triggers do not support tag filtering
  - sql: |
      CREATE EVENT TRIGGER e_drop_ev ON ddl_command_start WHEN TAG IN ('DROP EVENT TRIGGER') EXECUTE FUNCTION f_noop()
    expect: error
    sqlstate: "0A000"
    comment: event triggers are not supported for the DROP EVENT TRIGGER command
  - sql: |
      SELECT count(*) AS created FROM pg_event_trigger
    expect: rows
    order: ordered
