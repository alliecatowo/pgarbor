# Two rows with the same key in one multi-row VALUES: the second is skipped by DO NOTHING.
id: insert-conflict.self-conflict-do-nothing
title: Self-conflicting multi-row INSERT with DO NOTHING keeps the first row
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, multi-row-values, transactions]
required_capabilities: [create-table, insert, select, on-conflict, transactions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (self-conflicts at isolation levels, DO NOTHING)"
sessions: [a]
setup: |
  CREATE TABLE selfconflict (f1 int PRIMARY KEY, f2 int);
steps:
  - sql: |
      BEGIN TRANSACTION ISOLATION LEVEL READ COMMITTED;
      INSERT INTO selfconflict VALUES (1, 1), (1, 2) ON CONFLICT DO NOTHING;
      COMMIT
    expect: ok
  - sql: |
      SELECT f1, f2 FROM selfconflict ORDER BY f1
    expect: rows
    order: ordered
