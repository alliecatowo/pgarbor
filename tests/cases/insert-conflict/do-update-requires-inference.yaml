# DO UPDATE needs a conflict target (inference specification or constraint name); a bare ON CONFLICT is a syntax error.
id: insert-conflict.do-update-requires-inference
title: ON CONFLICT DO UPDATE without a conflict target is rejected
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, errors]
required_capabilities: [create-table, insert, on-conflict, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (fails: no unique index inference specification)"
sessions: [a]
setup: |
  CREATE TABLE t (key int4 PRIMARY KEY, fruit text);
  INSERT INTO t VALUES (1, 'Apple');
steps:
  - sql: |
      INSERT INTO t VALUES (1, 'Apple') ON CONFLICT DO UPDATE SET fruit = excluded.fruit
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT key, fruit FROM t ORDER BY key
    expect: rows
    order: ordered
