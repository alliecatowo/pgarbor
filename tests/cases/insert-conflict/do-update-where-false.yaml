# A DO UPDATE WHERE predicate that is false leaves the existing row unchanged and RETURNING yields no rows.
id: insert-conflict.do-update-where-false
title: ON CONFLICT DO UPDATE with a false WHERE leaves the row and returns nothing
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, returning, null-semantics]
required_capabilities: [create-table, insert, select, on-conflict, unique-index, returning]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (DO UPDATE ... WHERE predicate)"
sessions: [a]
setup: |
  CREATE TABLE t (key int4 PRIMARY KEY, fruit text);
  INSERT INTO t VALUES (1, 'Apple');
steps:
  - sql: |
      INSERT INTO t AS i VALUES (1, 'Pear') ON CONFLICT (key) DO UPDATE SET fruit = excluded.fruit WHERE i.fruit = 'Banana' RETURNING key, fruit
    expect: rows
    order: multiset
  - sql: |
      SELECT key, fruit FROM t ORDER BY key
    expect: rows
    order: ordered
