# DO UPDATE cannot affect the same row twice in one statement: the second proposed row for key 4 errors with 21000.
id: insert-conflict.self-conflict-do-update
title: Self-conflicting multi-row INSERT with DO UPDATE raises cardinality violation
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, multi-row-values, errors]
required_capabilities: [create-table, insert, select, on-conflict, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (self-conflicts with ON CONFLICT (f1) DO UPDATE)"
sessions: [a]
setup: |
  CREATE TABLE selfconflict (f1 int PRIMARY KEY, f2 int);
steps:
  - sql: |
      INSERT INTO selfconflict VALUES (4, 1), (4, 2) ON CONFLICT (f1) DO UPDATE SET f2 = 0
    expect: error
    sqlstate: "21000"
  - sql: |
      SELECT f1, f2 FROM selfconflict ORDER BY f1
    expect: rows
    order: ordered
