# Conflict target must match a unique index or constraint; a plain non-unique column has none.
id: insert-conflict.no-matching-unique-index
title: ON CONFLICT target without a matching unique index is an error
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, unique-index, errors]
required_capabilities: [create-table, insert, on-conflict, unique-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (inference fails: fruit has no unique index)"
sessions: [a]
setup: |
  CREATE TABLE t (key int4, fruit text);
  CREATE UNIQUE INDEX t_key ON t (key);
steps:
  - sql: |
      INSERT INTO t VALUES (5, 'Lemon') ON CONFLICT (fruit) DO NOTHING
    expect: error
    sqlstate: "42P10"
  - sql: |
      INSERT INTO t VALUES (5, 'Lemon') ON CONFLICT (key) DO NOTHING
    expect: ok
  - sql: |
      SELECT key, fruit FROM t ORDER BY key
    expect: rows
    order: ordered
