# INSERT through an auto-updatable view supports ON CONFLICT against the base table's unique index.
id: insert-conflict.view-on-conflict
title: INSERT into a simple view with ON CONFLICT DO UPDATE updates the base table row
family: insert-conflict
tier: extended
feature_ids: [insert, on-conflict, views, unique-index]
required_capabilities: [create-table, create-view, insert, select, on-conflict, unique-index]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (test insertion through view)"
sessions: [a]
setup: |
  CREATE TABLE t (key int4 PRIMARY KEY, fruit text);
  CREATE VIEW v AS SELECT * FROM t;
  INSERT INTO t VALUES (1, 'foo');
steps:
  - sql: |
      INSERT INTO v VALUES (1, 'bar') ON CONFLICT (key) DO UPDATE SET fruit = excluded.fruit
    expect: ok
  - sql: |
      SELECT key, fruit FROM t ORDER BY key
    expect: rows
    order: ordered
