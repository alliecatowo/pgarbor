# A misspelled EXCLUDED column in the SET list is an undefined-column error and the row is not touched.
id: insert-conflict.excluded-misspelled-column
title: Misspelled EXCLUDED column reference in DO UPDATE SET raises 42703
family: insert-conflict
tier: extended
feature_ids: [insert, on-conflict, excluded-reference, errors]
required_capabilities: [create-table, insert, select, on-conflict, unique-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (EXCLUDED.* hint for misspelled column)"
sessions: [a]
setup: |
  CREATE TABLE t (key int4 PRIMARY KEY, fruit text);
  INSERT INTO t VALUES (1, 'Apple');
steps:
  - sql: |
      INSERT INTO t VALUES (1, 'Apple') ON CONFLICT (key) DO UPDATE SET fruit = excluded.fruitt
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT key, fruit FROM t ORDER BY key
    expect: rows
    order: ordered
