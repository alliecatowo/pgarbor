# NULL never equals NULL in a unique index, so NULL keys do not conflict and both rows are inserted.
id: insert-conflict.null-keys-do-nothing
title: NULL conflict-target values do not conflict under ON CONFLICT DO NOTHING
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, unique-index, null-semantics]
required_capabilities: [create-table, insert, select, on-conflict, unique-index]
provenance:
  source: hand
  ref: "PG18 docs sql-insert.html#SQL-ON-CONFLICT; NULLs are distinct in unique indexes (indexes-unique)"
sessions: [a]
setup: |
  CREATE TABLE t (key int4, fruit text);
  CREATE UNIQUE INDEX t_key ON t (key);
steps:
  - sql: |
      INSERT INTO t VALUES (NULL, 'a'), (NULL, 'b') ON CONFLICT (key) DO NOTHING
    expect: ok
  - sql: |
      SELECT key IS NULL AS key_null, fruit FROM t ORDER BY fruit
    expect: rows
    order: ordered
