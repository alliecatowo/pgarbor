# ON CONFLICT (key) DO NOTHING skips a conflicting row and keeps the existing one.
id: insert-conflict.do-nothing-basic
title: ON CONFLICT DO NOTHING keeps the existing row on a unique-key conflict
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, unique-index, primary-key]
required_capabilities: [create-table, insert, select, on-conflict, unique-index]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql"
sessions: [a]
setup: |
  CREATE TABLE t (key int4 PRIMARY KEY, fruit text);
  INSERT INTO t VALUES (1, 'Apple');
steps:
  - sql: |
      INSERT INTO t VALUES (1, 'Orange') ON CONFLICT (key) DO NOTHING
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2, 'Kiwi') ON CONFLICT DO NOTHING
    expect: ok
  - sql: |
      SELECT key, fruit FROM t ORDER BY key
    expect: rows
    order: ordered
