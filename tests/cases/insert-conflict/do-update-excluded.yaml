# ON CONFLICT DO UPDATE with EXCLUDED.* refers to the proposed row; RETURNING shows the updated row.
id: insert-conflict.do-update-excluded
title: ON CONFLICT DO UPDATE assigns from EXCLUDED and returns the updated row
family: insert-conflict
tier: core
feature_ids: [insert, on-conflict, excluded-reference, returning]
required_capabilities: [create-table, insert, select, on-conflict, unique-index, returning]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql"
sessions: [a]
setup: |
  CREATE TABLE t (key int4 PRIMARY KEY, fruit text);
  INSERT INTO t VALUES (1, 'Apple');
steps:
  - sql: |
      INSERT INTO t VALUES (1, 'Banana') ON CONFLICT (key) DO UPDATE SET fruit = excluded.fruit RETURNING key, fruit
    expect: rows
  - sql: |
      INSERT INTO t VALUES (3, 'Lemon') ON CONFLICT (key) DO UPDATE SET fruit = excluded.fruit RETURNING key, fruit
    expect: rows
  - sql: |
      SELECT key, fruit FROM t ORDER BY key
    expect: rows
    order: ordered
