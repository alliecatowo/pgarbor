# ON CONFLICT ON CONSTRAINT with an unknown constraint name fails with 42704.
id: insert-conflict.on-constraint-missing
title: ON CONFLICT ON CONSTRAINT with an unknown constraint name raises 42704
family: insert-conflict
tier: extended
feature_ids: [insert, on-conflict, constraints, errors]
required_capabilities: [create-table, insert, select, on-conflict, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/insert_conflict.sql (ON CONFLICT ON CONSTRAINT)"
sessions: [a]
setup: |
  CREATE TABLE t (f1 int UNIQUE, f2 text);
  INSERT INTO t VALUES (1, 'a');
steps:
  - sql: |
      INSERT INTO t VALUES (1, 'b') ON CONFLICT ON CONSTRAINT no_such_constraint DO NOTHING
    expect: error
    sqlstate: "42704"
  - sql: |
      INSERT INTO t VALUES (1, 'b') ON CONFLICT ON CONSTRAINT t_f1_key DO NOTHING
    expect: ok
  - sql: |
      SELECT f1, f2 FROM t ORDER BY f1
    expect: rows
    order: ordered
