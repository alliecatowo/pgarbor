# varchar typmod bounds: zero length and an excessive length are rejected at DDL time.
id: varchar.typmod-length-bounds
title: varchar(0) and varchar above the maximum length are rejected with 22023
family: varchar
tier: extended
feature_ids: [varchar, create-table, errors]
required_capabilities: [create-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
steps:
  - sql: |
      CREATE TABLE vt_zero (f1 varchar(0))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE vt_big (f1 varchar(10485761))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE vt_ok (f1 varchar(1))
    expect: ok
