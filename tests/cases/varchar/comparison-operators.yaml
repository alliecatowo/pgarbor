# Comparison operators on varchar values, with NULL in the set; deterministic via COLLATE "C".
id: varchar.comparison-operators
title: Relational operators on varchar(1) values against a constant
family: varchar
tier: core
feature_ids: [varchar, select, comparison-operators]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (f1 varchar(1) COLLATE "C");
  INSERT INTO vt (f1) VALUES ('a'), ('A'), ('1'), ('2'), ('3'), (''), ('c'), (NULL);
steps:
  - sql: |
      SELECT f1, f1 <> 'a' AS ne, f1 = 'a' AS eq, f1 < 'a' AS lt, f1 <= 'a' AS le, f1 > 'a' AS gt, f1 >= 'a' AS ge
      FROM vt
      ORDER BY f1 COLLATE "C"
    expect: rows
    order: ordered
