# varchar equality is not blank-padded, so values differing only by trailing spaces are distinct groups.
id: varchar.distinct-trailing-space
title: DISTINCT and GROUP BY treat varchar values differing only in trailing spaces as different
family: varchar
tier: core
feature_ids: [varchar, select, aggregates, distinct]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (f1 varchar(5));
  INSERT INTO vt VALUES ('a'), ('a '), ('a'), ('ab');
steps:
  - sql: |
      SELECT count(DISTINCT f1) AS distinct_values, count(*) AS total FROM vt
    expect: rows
    order: multiset
  - sql: |
      SELECT f1, count(*) AS n FROM vt GROUP BY f1 ORDER BY f1 COLLATE "C"
    expect: rows
    order: ordered
