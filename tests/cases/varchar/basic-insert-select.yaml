# varchar(n) basic storage and ordered/multiset reads (from pg-regress varchar.sql, rewritten compactly).
id: varchar.basic-insert-select
title: varchar(1) stores single characters, empty string and numeric-literal input
family: varchar
tier: core
feature_ids: [varchar, insert, select, character-types]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (f1 varchar(1) COLLATE "C");
steps:
  - sql: |
      INSERT INTO vt (f1) VALUES ('a'), ('A'), ('1'), (2), ('3'), (''), ('c')
    expect: ok
  - sql: |
      SELECT f1, length(f1) AS len FROM vt ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM vt
    expect: rows
    order: multiset
