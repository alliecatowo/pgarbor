# An UPDATE that exceeds varchar(n) fails with 22001 and leaves the row unchanged.
id: varchar.update-length-check
title: UPDATE beyond varchar(3) fails with 22001 and the old value survives
family: varchar
tier: core
feature_ids: [varchar, update, errors]
required_capabilities: [create-table, insert, update, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (id int4 PRIMARY KEY, f1 varchar(3));
  INSERT INTO vt VALUES (1, 'abc'), (2, 'a');
steps:
  - sql: |
      UPDATE vt SET f1 = 'abcd' WHERE id = 1
    expect: error
    sqlstate: "22001"
  - sql: |
      UPDATE vt SET f1 = 'xyz' WHERE id = 2
    expect: ok
  - sql: |
      SELECT id, f1 FROM vt ORDER BY id
    expect: rows
    order: ordered
