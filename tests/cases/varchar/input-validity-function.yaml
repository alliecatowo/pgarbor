# pg_input_is_valid applies the same typmod rule as storage: trailing spaces are fine, excess characters are not.
id: varchar.input-validity-function
title: pg_input_is_valid reports varchar(4) typmod acceptance without raising
family: varchar
tier: core
feature_ids: [varchar, input-validation-functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT pg_input_is_valid('abcd  ', 'varchar(4)') AS spaces_ok, pg_input_is_valid('abcde', 'varchar(4)') AS too_long
    expect: rows
    order: multiset
