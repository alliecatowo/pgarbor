# Over-length non-space characters are rejected with 22001 and nothing is stored.
id: varchar.length-limit-error
title: Inserting a two-character value into varchar(1) fails with string_data_right_truncation
family: varchar
tier: core
feature_ids: [varchar, insert, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (f1 varchar(1));
  INSERT INTO vt (f1) VALUES ('a');
steps:
  - sql: |
      INSERT INTO vt (f1) VALUES ('cd')
    expect: error
    sqlstate: "22001"
  - sql: |
      SELECT f1 FROM vt
    expect: rows
    order: multiset
