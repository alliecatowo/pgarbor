# Excess trailing spaces beyond varchar(n) are silently dropped on assignment, not an error.
id: varchar.trailing-spaces-truncated
title: Trailing spaces beyond the varchar limit are truncated silently on insert
family: varchar
tier: core
feature_ids: [varchar, insert, select, character-types]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (f1 varchar(1));
steps:
  - sql: |
      INSERT INTO vt (f1) VALUES ('c     ')
    expect: ok
  - sql: |
      SELECT f1 = 'c' AS is_c, length(f1) AS len, octet_length(f1) AS bytes FROM vt
    expect: rows
    order: multiset
