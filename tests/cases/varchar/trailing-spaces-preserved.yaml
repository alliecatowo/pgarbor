# varchar is not blank-padded: trailing spaces within the limit are kept and significant.
id: varchar.trailing-spaces-preserved
title: varchar keeps trailing spaces within the limit and compares them as significant
family: varchar
tier: core
feature_ids: [varchar, character-types, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT length('ab  '::varchar(10)) AS len_typed, length('ab  '::varchar) AS len_untyped, 'a '::varchar = 'a'::varchar AS spaces_equal
    expect: rows
    order: multiset
