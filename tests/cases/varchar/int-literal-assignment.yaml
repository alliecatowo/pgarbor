# Non-text literals are assigned to varchar columns through the assignment (I/O) cast.
id: varchar.int-literal-assignment
title: Integer literal assigned into a varchar(1) column is stored as its text form
family: varchar
tier: core
feature_ids: [varchar, casts, insert]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (id int4, f1 varchar(1));
steps:
  - sql: |
      INSERT INTO vt (id, f1) VALUES (1, 2), (2, '2'), (3, 12)
    expect: error
    sqlstate: "22001"
    comment: '12 has two characters and must fail; the whole statement is rejected'
  - sql: |
      INSERT INTO vt (id, f1) VALUES (1, 2), (2, '2')
    expect: ok
  - sql: |
      SELECT id, f1 = '2' AS is_two, pg_typeof(f1) AS typ FROM vt ORDER BY id
    expect: rows
    order: ordered
