# pg_input_error_info returns the message and SQLSTATE for a rejected varchar(4) input.
id: varchar.input-error-info
title: pg_input_error_info reports message and SQLSTATE 22001 for an over-length varchar input
family: varchar
tier: extended
feature_ids: [varchar, input-validation-functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('abcde', 'varchar(4)')
    expect: rows
    order: multiset
