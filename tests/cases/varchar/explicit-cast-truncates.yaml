# Explicit casts to varchar(n) truncate silently; only implicit assignment raises 22001.
id: varchar.explicit-cast-truncates
title: Explicit cast to varchar(n) truncates rather than raising an error
family: varchar
tier: core
feature_ids: [varchar, casts, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT 'abcde'::varchar(2) AS two, 'abcd  '::varchar(4) AS four
    expect: rows
    order: multiset
