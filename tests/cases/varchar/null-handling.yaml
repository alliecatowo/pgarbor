# NULL is distinct from the empty string for varchar; NULL propagates through comparisons and length.
id: varchar.null-handling
title: NULL versus empty string in varchar columns, predicates and length
family: varchar
tier: core
feature_ids: [varchar, nulls, select, insert]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (id int4 PRIMARY KEY, f1 varchar(3));
  INSERT INTO vt VALUES (1, NULL), (2, ''), (3, 'abc');
steps:
  - sql: |
      SELECT id, f1 IS NULL AS is_null, f1 = '' AS is_empty, length(f1) AS len, f1 = NULL AS eq_null
      FROM vt ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM vt WHERE f1 IS DISTINCT FROM ''
    expect: rows
    order: multiset
