# Plain varchar with no length accepts long values with no truncation or error.
id: varchar.unbounded-varchar
title: Unbounded varchar stores a 10000-character value without truncation
family: varchar
tier: core
feature_ids: [varchar, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/varchar.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE vt (id int4, f1 varchar);
steps:
  - sql: |
      INSERT INTO vt VALUES (1, repeat('x', 10000))
    expect: ok
  - sql: |
      SELECT id, length(f1) AS len, f1 = repeat('x', 10000) AS same FROM vt
    expect: rows
    order: multiset
