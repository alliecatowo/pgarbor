# to_json and row_to_json: non-finite floats are quoted strings, dates and timestamps are ISO quoted, json input is embedded verbatim.
id: json.nonfinite-and-dates
title: Non-finite floats, dates, and embedded json values in row_to_json and to_json
family: json
tier: extended
feature_ids: [json, json-constructors, json-float, json-datetime]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/json.sql"
sessions: [a]
steps:
  - sql: |
      SELECT row_to_json(q)::text AS nan FROM (SELECT 'NaN'::float8 AS "float8field") q
    expect: rows
  - sql: |
      SELECT row_to_json(q)::text AS inf FROM (SELECT 'Infinity'::float8 AS "float8field") q
    expect: rows
  - sql: |
      SELECT row_to_json(q)::text AS ninf FROM (SELECT '-Infinity'::float8 AS "float8field") q
    expect: rows
  - sql: |
      SELECT to_json(date '2014-05-28')::text AS d, to_json(timestamp '2014-05-28 12:22:35.614298')::text AS ts
    expect: rows
  - sql: |
      SELECT row_to_json(q)::text AS j FROM (SELECT '{"a":1,"b": [2,3,4,"d","e","f"],"c":{"p":1,"q":2}}'::json AS "jsonfield") q
    expect: rows
    comment: json input is embedded as-is, including its original spacing
