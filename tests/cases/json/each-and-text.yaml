# json_each keeps JSON null as a json value; json_each_text turns JSON null into SQL NULL and keeps the string 'null'.
id: json.each-and-text
title: json_each and json_each_text expand objects into key/value rows
family: json
tier: core
feature_ids: [json, json-functions, json-each]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/json.sql"
sessions: [a]
steps:
  - sql: |
      SELECT key, value::text AS v FROM json_each('{"f1":[1,2,3],"f2":{"f3":1},"f4":null,"f5":99,"f6":"stringy"}') q ORDER BY key
    expect: rows
    order: ordered
  - sql: |
      SELECT key, value IS NULL AS sql_null, value FROM json_each_text('{"f1":[1,2,3],"f2":{"f3":1},"f4":null,"f5":"null","f6":"stringy"}') q ORDER BY key
    expect: rows
    order: ordered
    comment: f4 is SQL NULL, f5 is the four-character string null
  - sql: |
      SELECT json_each('[1,2]')
    expect: error
    sqlstate: "22023"
    comment: json_each requires an object
