# JSON array syntax: empty and nested arrays parse; trailing commas and unclosed brackets are 22P02.
id: json.array-syntax
title: "JSON array literals - nesting accepted, trailing commas and unclosed brackets rejected"
family: json
tier: core
feature_ids: [json, json-input, json-array]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/json.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '[]'::json::text AS empty_arr, '[1,2]'::json::text AS two, '[[[[1]]]]'::json::text AS nested
    expect: rows
  - sql: |
      SELECT '[1,2,]'::json
    expect: error
    sqlstate: "22P02"
    comment: trailing comma
  - sql: |
      SELECT '[1,2'::json
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '[1,[2]'::json
    expect: error
    sqlstate: "22P02"
