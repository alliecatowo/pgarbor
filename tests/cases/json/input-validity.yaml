# pg_input_is_valid and pg_input_error_info report json input validity without raising an error.
id: json.input-validity
title: pg_input_is_valid and pg_input_error_info report JSON validity without raising
family: json
tier: extended
feature_ids: [json, json-input, input-validity]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/json.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('{"a":true}', 'json') AS valid, pg_input_is_valid('{"a":true', 'json') AS invalid
    expect: rows
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('{"a":true', 'json')
    expect: rows
    comment: unterminated object reports 22P02
