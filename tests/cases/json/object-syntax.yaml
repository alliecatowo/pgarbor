# JSON object syntax: valid objects parse; missing values, non-string keys and wrong separators are 22P02.
id: json.object-syntax
title: "JSON object literals - valid nesting accepted, malformed objects rejected"
family: json
tier: core
feature_ids: [json, json-input, json-object]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/json.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '{}'::json::text AS empty_obj, '{"abc":1}'::json::text AS one_key
    expect: rows
  - sql: |
      SELECT ('{"abc":1,"def":2,"ghi":[3,4],"hij":{"klm":5,"nop":[6]}}'::json -> 'hij')::text AS nested
    expect: rows
  - sql: |
      SELECT '{"abc"}'::json
    expect: error
    sqlstate: "22P02"
    comment: no value
  - sql: |
      SELECT '{1:"abc"}'::json
    expect: error
    sqlstate: "22P02"
    comment: keys must be strings
  - sql: |
      SELECT '{"abc",1}'::json
    expect: error
    sqlstate: "22P02"
    comment: wrong separator
  - sql: |
      SELECT '{"abc"=1}'::json
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '{"abc":1:2}'::json
    expect: error
    sqlstate: "22P02"
    comment: colon in the wrong place
  - sql: |
      SELECT '{"abc":1,3}'::json
    expect: error
    sqlstate: "22P02"
