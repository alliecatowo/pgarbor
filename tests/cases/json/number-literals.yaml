# JSON number grammar: valid numbers keep their text (no int8 range check); leading zeros and junk are 22P02.
id: json.number-literals
title: JSON number literals accepted by the JSON grammar and rejected otherwise
family: json
tier: core
feature_ids: [json, json-input, json-number]
required_capabilities: [select, json]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/json.sql"
sessions: [a]
steps:
  - sql: |
      SELECT s, s::json::text AS t FROM (VALUES ('0'), ('0.1'), ('-0'), ('9223372036854775808'), ('1e100'), ('1.3e100')) v(s) ORDER BY s
    expect: rows
    order: ordered
    comment: 9223372036854775808 exceeds int8 but is valid JSON
  - sql: |
      SELECT '01'::json
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '1f2'::json
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '0.x1'::json
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '1.3ex100'::json
    expect: error
    sqlstate: "22P02"
