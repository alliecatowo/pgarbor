# numeric(3,1) holds at most 2 digits before the decimal point; 100.0 overflows.
id: numeric-big.typmod-overflow-error
title: Inserting a value beyond numeric(3,1) precision raises SQLSTATE 22003
family: numeric-big
feature_ids: [numeric, typmod, insert, errors]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (v numeric(3,1));
steps:
  - sql: |
      INSERT INTO t VALUES (100.0)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT count(*) FROM t
    expect: rows
