# Logarithm of zero is an invalid argument for logarithm.
id: numeric-big.ln-zero-error
title: ln(0) on numeric raises SQLSTATE 2201E
family: numeric-big
feature_ids: [numeric, math-functions, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT ln(0::numeric)
    expect: error
    sqlstate: "2201E"
