# Zero raised to a negative power is undefined.
id: numeric-big.power-zero-negative-error
title: Zero raised to a negative numeric power raises SQLSTATE 2201F
family: numeric-big
feature_ids: [numeric, math-functions, power, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT power(0::numeric, -1)
    expect: error
    sqlstate: "2201F"
