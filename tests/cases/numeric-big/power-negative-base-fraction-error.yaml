# A negative base raised to a non-integer exponent gives a complex result, which is rejected.
id: numeric-big.power-negative-base-fraction-error
title: Negative numeric base with fractional exponent raises SQLSTATE 2201F
family: numeric-big
tier: extended
feature_ids: [numeric, math-functions, power, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT power((-2)::numeric, 0.5::numeric)
    expect: error
    sqlstate: "2201F"
