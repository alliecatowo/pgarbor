# Values stored into numeric(5,2) are rounded to scale 2 (half away from zero) on insert.
id: numeric-big.typmod-store-rounding
title: Insert into numeric(5,2) rounds to the column scale
family: numeric-big
feature_ids: [numeric, typmod, insert]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (id int4, v numeric(5,2));
steps:
  - sql: |
      INSERT INTO t VALUES (1, 1.005), (2, 2.675), (3, -0.5), (4, 999.994), (5, 0)
    expect: ok
  - sql: |
      SELECT id, v, scale(v) AS sc FROM t ORDER BY id
    expect: rows
    order: ordered
