# Casting a numeric beyond the int4 range raises numeric_value_out_of_range.
id: numeric-big.int4-cast-overflow-error
title: numeric to int4 cast beyond int4 range raises SQLSTATE 22003
family: numeric-big
feature_ids: [numeric, casts, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT 3000000000::numeric::int4
    expect: error
    sqlstate: "22003"
