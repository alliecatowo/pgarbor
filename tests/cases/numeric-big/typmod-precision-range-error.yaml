# Declared numeric precision above 1000 is rejected by the type modifier check.
id: numeric-big.typmod-precision-range-error
title: numeric(1001,0) type modifier raises SQLSTATE 22023
family: numeric-big
tier: extended
feature_ids: [numeric, typmod, create-table, errors]
required_capabilities: [create-table, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      CREATE TABLE t_big (v numeric(1001,0))
    expect: error
    sqlstate: "22023"
