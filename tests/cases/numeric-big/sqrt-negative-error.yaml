# Square root of a negative numeric is invalid_argument_for_power_function.
id: numeric-big.sqrt-negative-error
title: sqrt of a negative numeric raises SQLSTATE 2201F
family: numeric-big
feature_ids: [numeric, math-functions, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT sqrt(-4::numeric)
    expect: error
    sqlstate: "2201F"
