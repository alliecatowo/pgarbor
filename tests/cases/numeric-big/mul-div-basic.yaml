# Derived from numeric_big.sql multiply/divide checks on non-zero operands.
id: numeric-big.mul-div-basic
title: Exact numeric multiplication and division of non-zero operands
family: numeric-big
feature_ids: [numeric, arithmetic, select]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE num_data (id int4 PRIMARY KEY, val numeric(1000,800));
  INSERT INTO num_data VALUES (0, '0'), (1, '0.0'), (2, '-34338492.215397047'), (3, '4.31'), (4, '7799461.4119'), (5, '16397.038491');
steps:
  - sql: |
      SELECT a.id AS id1, b.id AS id2, a.val * b.val AS prod, a.val / b.val AS quot
      FROM num_data a JOIN num_data b ON a.id IN (2, 3, 4, 5) AND b.id IN (3, 4, 5)
      ORDER BY a.id, b.id
    expect: rows
    order: ordered
