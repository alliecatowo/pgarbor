# NULL operands propagate through numeric operators and functions; coalesce supplies a fallback.
id: numeric-big.null-propagation
title: NULL inputs to numeric operators and math functions yield NULL
family: numeric-big
feature_ids: [numeric, nulls, arithmetic]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT NULL::numeric + 1 AS add_null, 1::numeric / NULL::numeric AS div_null,
             power(NULL::numeric, 0) AS pow_null, sqrt(NULL::numeric) AS sqrt_null,
             coalesce(NULL::numeric, 7.5) AS fallback
    expect: rows
