# Derived from numeric_big.sql power() and operator tests: integer, negative, fractional and zero exponents.
id: numeric-big.power-basic
title: power() and ^ on integer, negative, fractional and zero-to-zero exponents
family: numeric-big
tier: extended
feature_ids: [numeric, math-functions, power]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT power(2.5::numeric, 3) AS int_exp, power(2::numeric, -2) AS neg_exp,
             power(0.5::numeric, 0.5) AS frac_exp, 2.0::numeric ^ 10 AS op_exp,
             power(0::numeric, 0) AS zero_zero
    expect: rows
