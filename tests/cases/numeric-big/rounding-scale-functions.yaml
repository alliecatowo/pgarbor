# Derived from numeric_big.sql round/trunc/scale usage: half-away-from-zero rounding and scale introspection.
id: numeric-big.rounding-scale-functions
title: round, trunc, scale and trim_scale on numeric values
family: numeric-big
feature_ids: [numeric, rounding, scale-functions]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT round(2.5::numeric) AS r_pos, round(-2.5::numeric) AS r_neg,
             trunc(-2.7::numeric) AS t_neg, round(1234.5678::numeric, -2) AS r_hundreds,
             round(1.2345::numeric, 2) AS r_two, scale(1.2300::numeric) AS sc,
             trim_scale(1.2300::numeric) AS trimmed
    expect: rows
