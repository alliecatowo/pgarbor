# NaN sorts above all finite values and Infinity, NULL sorts last in ascending order, and aggregates skip NULLs.
id: numeric-big.nan-ordering-aggregates
title: NaN and Infinity ordering, NULL placement and aggregates over numeric
family: numeric-big
feature_ids: [numeric, nan, ordering, aggregates]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v numeric);
  INSERT INTO t VALUES (1, 'NaN'), (2, 2.5), (3, NULL), (4, -1), (5, 'Infinity');
steps:
  - sql: |
      SELECT id, v FROM t ORDER BY v, id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n_all, count(v) AS n_nonnull, max(v) AS max_v FROM t
    expect: rows
