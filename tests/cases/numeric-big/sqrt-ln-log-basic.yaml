# Derived from numeric_big.sql sqrt/ln/log checks on ordinary positive inputs.
id: numeric-big.sqrt-ln-log-basic
title: sqrt, ln, log and two-argument log on positive numeric inputs
family: numeric-big
tier: extended
feature_ids: [numeric, math-functions]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT sqrt(2.0::numeric) AS root2, ln(10::numeric) AS ln10,
             log(100::numeric) AS log10_100, log(2::numeric, 8::numeric) AS log2_8
    expect: rows
