# Non-numeric text is rejected as invalid numeric input.
id: numeric-big.invalid-input-error
title: Casting non-numeric text to numeric raises SQLSTATE 22P02
family: numeric-big
feature_ids: [numeric, input, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT 'abc'::numeric
    expect: error
    sqlstate: "22P02"
