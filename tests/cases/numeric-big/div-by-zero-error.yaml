# numeric division by a zero value raises division_by_zero.
id: numeric-big.div-by-zero-error
title: Dividing numeric by zero raises SQLSTATE 22012
family: numeric-big
feature_ids: [numeric, arithmetic, errors]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT '1.5'::numeric / '0.0'::numeric
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 7::numeric / 2::numeric AS still_fine
    expect: rows
