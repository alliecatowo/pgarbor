# Derived from numeric_big.sql add/subtract checks: exact sum and difference of stored numeric values.
id: numeric-big.add-sub-basic
title: Exact numeric addition and subtraction over a small value table
family: numeric-big
tier: slice
feature_ids: [numeric, arithmetic, select]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE num_data (id int4 PRIMARY KEY, val numeric(1000,800));
  INSERT INTO num_data VALUES (0, '0'), (1, '0.0'), (2, '-34338492.215397047'), (3, '4.31'), (4, '7799461.4119'), (5, '16397.038491');
steps:
  - sql: |
      SELECT a.id AS id1, b.id AS id2, a.val + b.val AS total, a.val - b.val AS diff
      FROM num_data a JOIN num_data b ON a.id IN (0, 2, 3, 4) AND b.id IN (0, 1, 2, 3)
      ORDER BY a.id, b.id
    expect: rows
    order: ordered
