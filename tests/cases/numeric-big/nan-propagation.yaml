# NaN propagates through arithmetic and compares equal to itself and greater than finite values.
id: numeric-big.nan-propagation
title: NaN propagates through arithmetic and sorts above finite values
family: numeric-big
feature_ids: [numeric, nan, comparison]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric_big.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT 'NaN'::numeric + 1 AS add_nan, 'NaN'::numeric * 0 AS mul_nan,
             'NaN'::numeric = 'NaN'::numeric AS nan_eq, 'NaN'::numeric > 1e1000 AS nan_gt,
             'NaN'::numeric < 'Infinity'::numeric AS nan_lt_inf
    expect: rows
