# inet keeps the netmask; the /y suffix is suppressed on output when the netmask names a single host.
id: doc-datatype-net-types.inet-input-netmask-display
title: inet keeps its netmask and suppresses /32 and /128 on output
family: doc-datatype-net-types
tier: core
feature_ids: [inet, netmask, host-address, output-format]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (inet: the /y portion is suppressed if the netmask specifies a single host)"
sessions: [a]
steps:
  - sql: |
      SELECT '192.168.0.1/24'::inet AS v4_net,
             '10.1.2.3/32'::inet AS v4_host,
             '10.1.2.3'::inet AS v4_bare,
             '10.1.2.3/24'::inet AS v4_host_bits,
             '2001:db8::1'::inet AS v6_bare,
             '::1/128'::inet AS v6_loopback,
             '2001:4f8:3:ba:2e0:81ff:fe22:d1f1/128'::inet AS v6_host
    expect: rows
    order: multiset
    comment: host bits are kept for inet; /32 and /128 are suppressed in the output
