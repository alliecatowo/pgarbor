# Equality between inet and cidr compares the network mask as well as the address; NULL yields NULL.
id: doc-datatype-net-types.inet-cidr-equality
title: inet and cidr equality compares address and netmask with NULL propagation
family: doc-datatype-net-types
tier: core
feature_ids: [inet, cidr, equality, netmask]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (inet vs. cidr; netmask semantics)"
sessions: [a]
steps:
  - sql: |
      SELECT inet '10.0.0.1' = cidr '10.0.0.1/32' AS host_inet_eq_cidr_host,
             cidr '10.0.0.0/8' = inet '10.0.0.0/8' AS net_cidr_eq_inet,
             '10.0.0.1/32'::inet = '10.0.0.1'::inet AS host_32_eq_bare,
             '10.0.0.1/32'::inet = '10.0.0.1/8'::inet AS different_mask,
             '10.0.0.1/8'::inet = '10.0.0.1/8'::inet AS same_mask,
             '10.0.0.1/8'::inet = '10.0.0.1/32'::inet AS reversed_mask,
             NULL::inet = '10.0.0.1'::inet AS null_operand
    expect: rows
    order: multiset
