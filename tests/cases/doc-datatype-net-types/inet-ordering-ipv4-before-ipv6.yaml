# inet and cidr sort IPv4 before IPv6, including IPv4-compatible and IPv4-mapped IPv6 addresses.
id: doc-datatype-net-types.inet-ordering-ipv4-before-ipv6
title: inet and cidr sort IPv4 before IPv6 including mapped and compatible forms
family: doc-datatype-net-types
tier: core
feature_ids: [inet, cidr, sorting, ipv4-mapped, ipv6]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (When sorting inet or cidr data types, IPv4 addresses will always sort before IPv6 addresses)"
sessions: [a]
setup: |
  CREATE TABLE ipsort (a inet);
  INSERT INTO ipsort VALUES ('::ffff:10.4.3.2'), ('::10.2.3.4'), ('2001:db8::1'), ('10.2.3.4'), ('9.255.255.255'), ('::1');
  CREATE TABLE cidrsort (c cidr);
  INSERT INTO cidrsort VALUES ('2001:db8::/32'), ('::ffff:10.4.3.0/120'), ('10.0.0.0/16'), ('10.0.0.0/8'), ('0.0.0.0/0');
steps:
  - sql: |
      SELECT a, family(a) AS fam FROM ipsort ORDER BY a
    expect: rows
    order: ordered
    comment: all four IPv4 rows precede every IPv6 row
  - sql: |
      SELECT c, family(c) AS fam FROM cidrsort ORDER BY c
    expect: rows
    order: ordered
