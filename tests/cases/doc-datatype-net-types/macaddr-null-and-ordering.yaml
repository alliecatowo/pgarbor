# macaddr and macaddr8 sort ascending with NULL last; min() and max() are not defined for macaddr.
id: doc-datatype-net-types.macaddr-null-and-ordering
title: macaddr and macaddr8 sort ascending with NULL last and have no min or max
family: doc-datatype-net-types
tier: core
feature_ids: [macaddr, macaddr8, sorting, null-handling, aggregates]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (macaddr and macaddr8 storage; NULL handling is the SQL default)"
sessions: [a]
setup: |
  CREATE TABLE mac (x macaddr, y macaddr8);
  INSERT INTO mac VALUES ('08:00:2b:01:02:03', '08:00:2b:01:02:03:04:05'), (NULL, NULL), ('00:00:00:00:00:01', '00:00:00:00:00:00:00:01'), ('08-00-2b-01-02-04', '08002b0102040506');
steps:
  - sql: |
      SELECT x, y FROM mac ORDER BY x
    expect: rows
    order: ordered
    comment: NULL sorts last in ascending order
  - sql: |
      SELECT x, y FROM mac ORDER BY y DESC NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS total, count(x) AS non_null_x, count(DISTINCT x) AS distinct_x FROM mac
    expect: rows
    order: multiset
  - sql: |
      SELECT min(x) FROM mac
    expect: error
    sqlstate: "42883"
    comment: no min(macaddr) aggregate exists in PostgreSQL 18
