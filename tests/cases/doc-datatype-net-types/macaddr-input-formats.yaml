# All six documented macaddr input layouts, plus upper-case digits, denote one address; output uses colon form.
id: doc-datatype-net-types.macaddr-input-formats
title: macaddr accepts every documented input layout and prints colon form
family: doc-datatype-net-types
tier: core
feature_ids: [macaddr, input-format, output-format, case-insensitive-hex]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (macaddr input formats; output is always in the first of the forms shown)"
sessions: [a]
steps:
  - sql: |
      SELECT '08:00:2b:01:02:03'::macaddr AS colon,
             '08-00-2b-01-02-03'::macaddr AS hyphen,
             '08002b:010203'::macaddr AS mixed_colon,
             '08002b-010203'::macaddr AS mixed_hyphen,
             '0800.2b01.0203'::macaddr AS dotted,
             '0800-2b01-0203'::macaddr AS hyphen_quad,
             '08002b010203'::macaddr AS bare,
             '08002B010203'::macaddr AS upper_case,
             '  08:00:2b:01:02:03  '::macaddr AS padded
    expect: rows
    order: multiset
    comment: all nine literals print as 08:00:2b:01:02:03
  - sql: |
      SELECT '08-00-2b-01-02-03'::macaddr = '08:00:2b:01:02:03'::macaddr AS hyphen_eq,
             '08002b010203'::macaddr = '08:00:2b:01:02:03'::macaddr AS bare_eq,
             'FF:FF:FF:FF:FF:FF'::macaddr::text AS upper_out
    expect: rows
    order: multiset
