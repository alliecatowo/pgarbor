# cidr rejects values with nonzero bits right of the netmask; inet accepts the same text.
id: doc-datatype-net-types.cidr-rejects-host-bits
title: cidr rejects host bits set to the right of the netmask while inet accepts them
family: doc-datatype-net-types
tier: core
feature_ids: [cidr, inet, netmask, input-validation]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (inet vs. cidr: 192.168.0.1/24 is valid for inet but not for cidr)"
sessions: [a]
steps:
  - sql: |
      SELECT '192.168.0.1/24'::inet AS accepted_as_inet
    expect: rows
  - sql: |
      SELECT '192.168.0.1/24'::cidr
    expect: error
    sqlstate: "22P02"
    comment: "documented example: valid for inet but not for cidr"
  - sql: |
      SELECT '2001:4f8:3:ba::1/64'::cidr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '10.0.0.0/8'::cidr AS accepted_as_cidr
    expect: rows
