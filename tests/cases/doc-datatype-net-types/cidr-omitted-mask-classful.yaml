# When the mask is omitted, cidr uses classful defaults, widened to include every octet written; IPv6 without a mask is /128.
id: doc-datatype-net-types.cidr-omitted-mask-classful
title: cidr without a netmask uses classful defaults widened to the octets written
family: doc-datatype-net-types
tier: core
feature_ids: [cidr, classful-netmask, netmask-default]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (cidr: if y is omitted, it is calculated using classful assumptions)"
sessions: [a]
steps:
  - sql: |
      SELECT '10'::cidr AS class_a,
             '128'::cidr AS class_b_one_octet,
             '128.1'::cidr AS class_b_two_octets,
             '192.168.1'::cidr AS class_c_three_octets,
             '10.1.2.3'::cidr AS four_octets,
             '2001:db8::1'::cidr AS v6_no_mask
    expect: rows
    order: multiset
  - sql: |
      SELECT '10'::cidr = '10.0.0.0/8'::cidr AS same_as_slash_8,
             '10.1.2.3'::cidr = '10.1.2.3/32'::cidr AS same_as_slash_32
    expect: rows
    order: multiset
