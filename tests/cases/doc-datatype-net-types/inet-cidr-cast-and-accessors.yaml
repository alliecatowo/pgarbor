# host(), text(), abbrev(), masklen() and family() on inet and cidr, plus casts between them and NULL propagation.
id: doc-datatype-net-types.inet-cidr-cast-and-accessors
title: host, text, abbrev, masklen and family on inet and cidr values with casts
family: doc-datatype-net-types
tier: core
feature_ids: [inet, cidr, host-function, abbrev, masklen, family, casts]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (If you do not like the output format for inet or cidr values, try the functions host, text, and abbrev)"
sessions: [a]
steps:
  - sql: |
      SELECT host('192.168.0.1/24'::inet) AS host_v4,
             text('192.168.0.1/24'::inet) AS text_v4,
             abbrev('192.168.0.1/24'::inet) AS abbrev_v4,
             host('10.1.2.3'::inet) AS host_bare,
             abbrev('10.1.2.3/32'::inet) AS abbrev_host,
             text('10.1.2.3/32'::inet) AS text_host,
             masklen('192.168.0.1/24'::inet) AS masklen_v4,
             masklen('10.1.2.3'::inet) AS masklen_host,
             family('10.1.2.3'::inet) AS fam_v4,
             family('::1'::inet) AS fam_v6
    expect: rows
    order: multiset
  - sql: |
      SELECT host('2001:4f8:3:ba::1/64'::inet) AS host_v6,
             abbrev('2001:4f8:3:ba::1/64'::inet) AS abbrev_v6,
             text('2001:4f8:3:ba::/64'::inet) AS text_v6,
             abbrev('2001:4f8:3:ba::/64'::cidr) AS abbrev_cidr_v6,
             abbrev('2001:4f8:3:ba:2e0:81ff:fe22:d1f1/128'::cidr) AS abbrev_cidr_host
    expect: rows
    order: multiset
  - sql: |
      SELECT '10.1.2.3'::inet::cidr AS inet_to_cidr_host,
             '192.168.0.1/24'::inet::cidr AS inet_to_cidr_masked,
             '10.0.0.0/8'::cidr::inet AS cidr_to_inet
    expect: rows
    order: multiset
    comment: inet to cidr zeroes host bits; cidr to inet keeps the mask
  - sql: |
      SELECT host(NULL::inet) IS NULL AS host_null,
             abbrev(NULL::cidr) IS NULL AS abbrev_null,
             masklen(NULL::inet) IS NULL AS masklen_null
    expect: rows
    order: multiset
