# macaddr8 converts to macaddr only when bytes 4 and 5 are ff and fe; macaddr widens to macaddr8 with ff:fe inserted.
id: doc-datatype-net-types.macaddr8-macaddr-conversion
title: macaddr8 to macaddr needs ff:fe in bytes 4 and 5, otherwise raises 22003
family: doc-datatype-net-types
tier: extended
feature_ids: [macaddr8, macaddr, casts, eui-64, six-byte-expansion]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (macaddr8 expansion of 6-byte MAC addresses; FF and FE in the 4th and 5th bytes)"
sessions: [a]
steps:
  - sql: |
      SELECT '08:00:2b:ff:fe:01:02:03'::macaddr8::macaddr AS narrowed,
             '08:00:2b:01:02:03'::macaddr::macaddr8 AS widened
    expect: rows
    order: multiset
  - sql: |
      SELECT '08:00:2b:01:02:03:04:05'::macaddr8::macaddr
    expect: error
    sqlstate: "22003"
    comment: bytes 4 and 5 are 01 and 02, not ff and fe
