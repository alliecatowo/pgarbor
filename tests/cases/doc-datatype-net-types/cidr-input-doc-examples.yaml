# Every runnable cidr input from the datatype.sgml cidr example table, with its cidr output and abbrev() output.
id: doc-datatype-net-types.cidr-input-doc-examples
title: cidr input examples from the documentation table with output and abbrev
family: doc-datatype-net-types
tier: core
feature_ids: [cidr, network-type, classful-netmask, abbrev]
required_capabilities: [select, values-list]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (cidr Type Input Examples)"
sessions: [a]
steps:
  - sql: |
      SELECT v.input,
             v.input::cidr::text AS cidr_out,
             abbrev(v.input::cidr) AS abbrev_out
      FROM (VALUES
        ('192.168.100.128/25'),
        ('192.168/24'),
        ('192.168/25'),
        ('192.168.1'),
        ('192.168'),
        ('128.1'),
        ('128'),
        ('128.1.2'),
        ('10.1.2'),
        ('10.1'),
        ('10'),
        ('10.1.2.3/32'),
        ('2001:4f8:3:ba::/64'),
        ('2001:4f8:3:ba:2e0:81ff:fe22:d1f1/128'),
        ('::ffff:1.2.3.0/120'),
        ('::ffff:1.2.3/120'),
        ('::ffff:1.2.3')
      ) AS v(input)
    expect: rows
    order: multiset
    comment: omitted masks follow the classful rules and are widened to cover the octets written
