# Malformed macaddr text is rejected with invalid_text_representation.
id: doc-datatype-net-types.macaddr-invalid-input
title: Malformed macaddr input is rejected with 22P02
family: doc-datatype-net-types
tier: core
feature_ids: [macaddr, input-validation]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (macaddr input formats)"
sessions: [a]
steps:
  - sql: |
      SELECT '08:00:2b:01:02:03'::macaddr
    expect: rows
  - sql: |
      SELECT '08:00:2b:01:02'::macaddr
    expect: error
    sqlstate: "22P02"
    comment: five octets is too short
  - sql: |
      SELECT '08:00:2b:01:02:03:04'::macaddr
    expect: error
    sqlstate: "22P02"
    comment: seven octets is too long for macaddr
  - sql: |
      SELECT 'zz:00:2b:01:02:03'::macaddr
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '08-00:2b-01-02-03'::macaddr
    expect: error
    sqlstate: "22P02"
    comment: separators must not be mixed within one address
