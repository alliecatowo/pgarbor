# macaddr8_set7bit flips the 7th bit for the IPv6 modified EUI-64 form; the documented EUI-48 example is included.
id: doc-datatype-net-types.macaddr8-set7bit
title: macaddr8_set7bit converts EUI-48 to modified EUI-64 and sets the 7th bit
family: doc-datatype-net-types
tier: core
feature_ids: [macaddr8, macaddr8_set7bit, eui-64, eui-48]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (macaddr8_set7bit example: SELECT macaddr8_set7bit('08:00:2b:01:02:03'))"
sessions: [a]
steps:
  - sql: |
      SELECT macaddr8_set7bit('08:00:2b:01:02:03') AS documented_example
    expect: rows
    order: multiset
    comment: documented output is 0a:00:2b:ff:fe:01:02:03
  - sql: |
      SELECT macaddr8_set7bit('08:00:2b:01:02:03:04:05') AS eight_byte_input,
             macaddr8_set7bit('08:00:2b:ff:fe:01:02:03') AS already_expanded
    expect: rows
    order: multiset
    comment: the 7th bit is set on any input, and 6-byte input is still expanded
  - sql: |
      SELECT macaddr8_set7bit(NULL::macaddr8) IS NULL AS null_in_null_out
    expect: rows
    order: multiset
