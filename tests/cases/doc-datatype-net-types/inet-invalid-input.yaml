# Malformed inet input is rejected with invalid_text_representation; a valid control row is included.
id: doc-datatype-net-types.inet-invalid-input
title: Malformed inet input is rejected with 22P02
family: doc-datatype-net-types
tier: core
feature_ids: [inet, input-validation, netmask]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (inet input format address/y, y is the number of bits in the netmask)"
sessions: [a]
steps:
  - sql: |
      SELECT '10.1.2.3/24'::inet
    expect: rows
  - sql: |
      SELECT '10.1.2.3/33'::inet
    expect: error
    sqlstate: "22P02"
    comment: an IPv4 netmask cannot exceed 32 bits
  - sql: |
      SELECT '2001:db8::1/129'::inet
    expect: error
    sqlstate: "22P02"
    comment: an IPv6 netmask cannot exceed 128 bits
  - sql: |
      SELECT '256.1.1.1'::inet
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'not-an-address'::inet
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '10.1.2.3/'::inet
    expect: error
    sqlstate: "22P02"
