# All documented macaddr8 layouts for 8-byte input; 6-byte input is stored as xx:xx:xx:ff:fe:xx:xx:xx.
id: doc-datatype-net-types.macaddr8-input-formats
title: macaddr8 accepts 8-byte layouts and expands 6-byte input with ff:fe
family: doc-datatype-net-types
tier: core
feature_ids: [macaddr8, input-format, eui-64, six-byte-expansion]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (macaddr8 accepts 6 and 8 byte input and stores 8 byte format with FF and FE)"
sessions: [a]
steps:
  - sql: |
      SELECT '08:00:2b:01:02:03:04:05'::macaddr8 AS colon8,
             '08-00-2b-01-02-03-04-05'::macaddr8 AS hyphen8,
             '08002b:0102030405'::macaddr8 AS mixed_colon8,
             '08002b-0102030405'::macaddr8 AS mixed_hyphen8,
             '0800.2b01.0203.0405'::macaddr8 AS dotted8,
             '0800-2b01-0203-0405'::macaddr8 AS hyphen_quad8,
             '08002b01:02030405'::macaddr8 AS split8,
             '08002b0102030405'::macaddr8 AS bare8,
             '  08:00:2b:01:02:03:04:05  '::macaddr8 AS padded8
    expect: rows
    order: multiset
    comment: all nine 8-byte literals print as 08:00:2b:01:02:03:04:05
  - sql: |
      SELECT '08:00:2b:01:02:03'::macaddr8 AS six_byte_colon,
             '08002b010203'::macaddr8 AS six_byte_bare,
             '08-00-2b-01-02-03'::macaddr8 AS six_byte_hyphen
    expect: rows
    order: multiset
    comment: 6-byte input gains the 4th and 5th bytes ff and fe
  - sql: |
      SELECT '08:00:2b:01:02:03'::macaddr8 = '08:00:2b:ff:fe:01:02:03'::macaddr8 AS six_eq_expanded,
             '08:00:2b:01:02:03:04:05'::macaddr8 = '08:00:2b:ff:fe:01:02:03'::macaddr8 AS eight_vs_expanded
    expect: rows
    order: multiset
