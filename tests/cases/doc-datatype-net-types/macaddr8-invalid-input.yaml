# Malformed macaddr8 text is rejected: wrong octet counts, mixed separators, and non-hex characters.
id: doc-datatype-net-types.macaddr8-invalid-input
title: Malformed macaddr8 input is rejected with 22P02
family: doc-datatype-net-types
tier: core
feature_ids: [macaddr8, input-validation, eui-64]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-net-types (macaddr8: the number of hex digits must be either 16 (8 bytes) or 12 (6 bytes))"
sessions: [a]
steps:
  - sql: |
      SELECT '08:00:2b:01:02:03:04:05'::macaddr8
    expect: rows
  - sql: |
      SELECT '08:00:2b:01:02:03:04'::macaddr8
    expect: error
    sqlstate: "22P02"
    comment: seven octets is neither 6 nor 8 bytes
  - sql: |
      SELECT '08:00:2b:01:02:03:04:05:06'::macaddr8
    expect: error
    sqlstate: "22P02"
    comment: nine octets is too long
  - sql: |
      SELECT '08-00:2b-01-02-03'::macaddr8
    expect: error
    sqlstate: "22P02"
    comment: separators must be consistent
  - sql: |
      SELECT '08002b:fffe0102'::macaddr8
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'gg:00:2b:01:02:03'::macaddr8
    expect: error
    sqlstate: "22P02"
