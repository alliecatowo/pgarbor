# Naming the same view twice in one DROP VIEW list drops it once and succeeds.
id: cmd-drop-view.duplicate-name-in-list
title: DROP VIEW with the same name listed twice succeeds and drops the view once
family: cmd-drop-view
tier: extended
feature_ids: [drop-view, multiple-names]
required_capabilities: [create-view, drop-view, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (name [, ...])"
sessions: [a]
setup: |
  CREATE VIEW dup_v AS SELECT 1 AS x;
steps:
  - sql: |
      DROP VIEW dup_v, dup_v
    expect: ok
  - sql: |
      SELECT to_regclass('dup_v') IS NULL AS gone
    expect: rows
    order: ordered
