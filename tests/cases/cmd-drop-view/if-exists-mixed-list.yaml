# IF EXISTS applies per name in a list: the existing view is dropped and the missing one only produces a notice.
id: cmd-drop-view.if-exists-mixed-list
title: DROP VIEW IF EXISTS with a mixed list drops the existing view and notices the missing one
family: cmd-drop-view
tier: core
feature_ids: [drop-view, if-exists, multiple-names]
required_capabilities: [create-view, drop-view, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (IF EXISTS)"
sessions: [a]
setup: |
  CREATE VIEW iem_v AS SELECT 1 AS x;
steps:
  - sql: |
      DROP VIEW IF EXISTS iem_v, iem_nope
    expect: notice
    comment: NOTICE view "iem_nope" does not exist, skipping
  - sql: |
      SELECT to_regclass('iem_v') IS NULL AS gone
    expect: rows
    order: ordered
