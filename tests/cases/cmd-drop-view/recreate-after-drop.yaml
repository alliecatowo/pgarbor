# After DROP VIEW the name is free: a new view with the same name, possibly a different definition, can be created.
id: cmd-drop-view.recreate-after-drop
title: A view name can be reused with a different definition after DROP VIEW
family: cmd-drop-view
tier: core
feature_ids: [drop-view, create-view]
required_capabilities: [create-view, drop-view, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (Description)"
sessions: [a]
steps:
  - sql: |
      CREATE VIEW rc AS SELECT 1 AS x
    expect: ok
  - sql: |
      DROP VIEW rc
    expect: ok
  - sql: |
      CREATE VIEW rc AS SELECT 'two' AS x
    expect: ok
  - sql: |
      SELECT x FROM rc
    expect: rows
    order: ordered
