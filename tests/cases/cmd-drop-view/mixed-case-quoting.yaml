# Unquoted names fold to lower case, so a mixed-case view must be dropped with its quoted identifier.
id: cmd-drop-view.mixed-case-quoting
title: DROP VIEW folds unquoted names to lower case, so a quoted mixed-case view needs quotes to drop
family: cmd-drop-view
tier: core
feature_ids: [drop-view, identifiers, quoting]
required_capabilities: [create-view, drop-view, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (name); doc/src/sgml/sql-syntax-lexical.sgml (identifiers)"
sessions: [a]
setup: |
  CREATE VIEW "DvMixed" AS SELECT 1 AS x;
steps:
  - sql: |
      DROP VIEW DvMixed
    expect: error
    sqlstate: "42P01"
    comment: folds to dvmixed, which does not exist
  - sql: |
      SELECT to_regclass('"DvMixed"') IS NULL AS still_there
    expect: rows
    order: ordered
  - sql: |
      DROP VIEW "DvMixed"
    expect: ok
  - sql: |
      SELECT to_regclass('"DvMixed"') IS NULL AS gone
    expect: rows
    order: ordered
