# IF EXISTS on a missing view succeeds with a notice; on an existing view it drops silently.
id: cmd-drop-view.if-exists-missing-notice
title: DROP VIEW IF EXISTS on a missing name issues a notice and succeeds
family: cmd-drop-view
tier: core
feature_ids: [drop-view, if-exists]
required_capabilities: [create-view, drop-view, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (IF EXISTS)"
sessions: [a]
steps:
  - sql: |
      DROP VIEW IF EXISTS ie_missing
    expect: notice
    comment: NOTICE view "ie_missing" does not exist, skipping
  - sql: |
      CREATE VIEW ie_v AS SELECT 1 AS x
    expect: ok
  - sql: |
      DROP VIEW IF EXISTS ie_v
    expect: ok
    comment: existing view dropped with no notice
  - sql: |
      DROP VIEW IF EXISTS ie_v
    expect: notice
    comment: second drop is the missing case again
