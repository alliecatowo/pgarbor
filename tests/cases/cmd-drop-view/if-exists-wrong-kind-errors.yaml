# IF EXISTS only tolerates a missing name; a name that is a table is still an error.
id: cmd-drop-view.if-exists-wrong-kind-errors
title: DROP VIEW IF EXISTS on an existing table still raises wrong_object_type
family: cmd-drop-view
tier: core
feature_ids: [drop-view, if-exists, errors]
required_capabilities: [create-table, insert, drop-view, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (IF EXISTS)"
sessions: [a]
setup: |
  CREATE TABLE iek_t (id int4);
  INSERT INTO iek_t VALUES (1);
steps:
  - sql: |
      DROP VIEW IF EXISTS iek_t
    expect: error
    sqlstate: "42809"
    comment: iek_t is not a view (42809)
  - sql: |
      SELECT count(*) AS n FROM iek_t
    expect: rows
    order: ordered
    comment: the table is untouched
