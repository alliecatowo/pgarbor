# The grammar requires at least one name; a trailing comma or missing name is a syntax error.
id: cmd-drop-view.syntax-errors
title: DROP VIEW without a name, with a trailing comma, or with IF EXISTS but no name is a syntax error
family: cmd-drop-view
tier: core
feature_ids: [drop-view, syntax, errors]
required_capabilities: [drop-view, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (Synopsis)"
sessions: [a]
steps:
  - sql: |
      DROP VIEW
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP VIEW sx_v,
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP VIEW IF EXISTS
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS still_ok
    expect: rows
    order: ordered
