# DROP VIEW on the documentation example view: the view goes away, its base table and rows are kept.
id: cmd-drop-view.docs-example-kinds
title: DROP VIEW kinds (documentation example) removes only the view and keeps the base table
family: cmd-drop-view
tier: core
feature_ids: [drop-view, docs-example]
required_capabilities: [create-table, insert, create-view, drop-view, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (Examples)"
sessions: [a]
setup: |
  CREATE TABLE kinds_base (id int4, kind text);
  INSERT INTO kinds_base VALUES (1, 'a'), (2, 'b');
  CREATE VIEW kinds AS SELECT kind FROM kinds_base;
steps:
  - sql: |
      SELECT kind FROM kinds ORDER BY kind
    expect: rows
    order: ordered
  - sql: |
      DROP VIEW kinds
    expect: ok
  - sql: |
      SELECT to_regclass('kinds') IS NULL AS view_gone, (SELECT count(*) FROM kinds_base) AS base_rows
    expect: rows
    order: ordered
