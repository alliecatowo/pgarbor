# Without IF EXISTS, dropping a view that does not exist is an error and the session stays usable.
id: cmd-drop-view.missing-view-error
title: DROP VIEW on a missing view raises undefined_table and leaves the session usable
family: cmd-drop-view
tier: core
feature_ids: [drop-view, errors]
required_capabilities: [drop-view, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (IF EXISTS)"
sessions: [a]
steps:
  - sql: |
      DROP VIEW never_created_view
    expect: error
    sqlstate: "42P01"
    comment: view "never_created_view" does not exist
  - sql: |
      SELECT 1 AS still_ok
    expect: rows
    order: ordered
