# DROP VIEW refuses a table name and points the user at DROP TABLE; the table is untouched.
id: cmd-drop-view.wrong-kind-table
title: DROP VIEW on a table raises wrong_object_type and leaves the table in place
family: cmd-drop-view
tier: core
feature_ids: [drop-view, errors, relation-kind]
required_capabilities: [create-table, insert, drop-view, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (Description)"
sessions: [a]
setup: |
  CREATE TABLE wk_t (id int4);
  INSERT INTO wk_t VALUES (7);
steps:
  - sql: |
      DROP VIEW wk_t
    expect: error
    sqlstate: "42809"
    comment: wk_t is not a view; HINT says use DROP TABLE
  - sql: |
      SELECT id FROM wk_t
    expect: rows
    order: ordered
