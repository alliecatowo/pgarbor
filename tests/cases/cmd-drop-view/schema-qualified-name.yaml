# A schema-qualified name drops only that schema's view, regardless of search_path.
id: cmd-drop-view.schema-qualified-name
title: DROP VIEW with a schema-qualified name drops only the view in that schema
family: cmd-drop-view
tier: core
feature_ids: [drop-view, schema, qualified-names]
required_capabilities: [create-schema, create-view, drop-view, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (name, schema-qualified)"
sessions: [a]
setup: |
  CREATE SCHEMA dvs_sch;
  CREATE VIEW dvs_sch.sv AS SELECT 1 AS x;
  CREATE VIEW public.dvs_pub AS SELECT 2 AS x;
steps:
  - sql: |
      DROP VIEW dvs_sch.sv
    expect: ok
  - sql: |
      SELECT to_regclass('dvs_sch.sv') IS NULL AS sv_gone, to_regclass('public.dvs_pub') IS NULL AS pub_gone
    expect: rows
    order: ordered
  - sql: |
      DROP VIEW dvs_sch.sv
    expect: error
    sqlstate: "42P01"
