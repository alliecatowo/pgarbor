# DROP VIEW is transactional: rolling back restores the view with its definition intact.
id: cmd-drop-view.rollback-restores-view
title: DROP VIEW inside a rolled-back transaction leaves the view in place
family: cmd-drop-view
tier: core
feature_ids: [drop-view, transactions]
required_capabilities: [create-view, drop-view, select, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (Description)"
sessions: [a]
setup: |
  CREATE VIEW rb_v AS SELECT 1 AS x;
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP VIEW rb_v
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT x FROM rb_v
    expect: rows
    order: ordered
