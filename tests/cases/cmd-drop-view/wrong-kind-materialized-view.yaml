# DROP VIEW does not drop a materialized view; it must be removed with DROP MATERIALIZED VIEW.
id: cmd-drop-view.wrong-kind-materialized-view
title: DROP VIEW on a materialized view raises wrong_object_type and keeps the matview
family: cmd-drop-view
tier: core
feature_ids: [drop-view, errors, relation-kind]
required_capabilities: [create-table, insert, create-materialized-view, drop-view, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_view.sgml#sql-dropview (Description)"
sessions: [a]
setup: |
  CREATE TABLE wm_base (id int4);
  INSERT INTO wm_base VALUES (1), (2);
  CREATE MATERIALIZED VIEW wm_mv AS SELECT id FROM wm_base;
steps:
  - sql: |
      DROP VIEW wm_mv
    expect: error
    sqlstate: "42809"
    comment: wm_mv is not a view; HINT says use DROP MATERIALIZED VIEW
  - sql: |
      SELECT id FROM wm_mv ORDER BY id
    expect: rows
    order: ordered
