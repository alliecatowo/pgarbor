# Declared numeric precision is 1..1000 and scale is -1000..1000; values outside are rejected at CREATE TABLE.
id: doc-datatype-numeric.numeric-typmod-declaration-limits
title: NUMERIC declaration limits accept precision 1000 and scale bounds, rejecting values just outside
family: doc-datatype-numeric
tier: core
feature_ids: [numeric, typmod, errors, limits]
required_capabilities: [create-table, errors, numeric]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-numeric-decimal (note on maximum precision)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE tnp (a numeric(1000), b numeric(1000,0), c numeric(1000,1000))
    expect: ok
  - sql: |
      CREATE TABLE tnp2 (a numeric(1001))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE tnp3 (a numeric(5,1001))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE tnp4 (a numeric(5,-1001))
    expect: error
    sqlstate: "22023"
