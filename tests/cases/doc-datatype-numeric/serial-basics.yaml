# serial, smallserial and bigserial create integer, smallint and bigint columns fed by sequences with NOT NULL.
id: doc-datatype-numeric.serial-basics
title: serial family creates integer, smallint and bigint columns with NOT NULL defaults from sequences
family: doc-datatype-numeric
tier: core
feature_ids: [serial, smallserial, bigserial, sequences, not-null, errors]
required_capabilities: [create-table, insert, select, errors, sequences, int2, int8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-serial"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE ser (id serial PRIMARY KEY, sid smallserial, bid bigserial, note text)
    expect: ok
  - sql: |
      SELECT attname, format_type(atttypid, atttypmod) AS typ, attnotnull
      FROM pg_attribute
      WHERE attrelid = 'ser'::regclass AND attnum > 0
      ORDER BY attnum
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO ser(note) VALUES ('a'), ('b'), ('c')
    expect: ok
  - sql: |
      SELECT id, sid, bid, note FROM ser ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO ser(id, note) VALUES (NULL, 'x')
    expect: error
    sqlstate: "23502"
    comment: serial implies NOT NULL, so an explicit NULL is rejected
