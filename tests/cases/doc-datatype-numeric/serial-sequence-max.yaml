# A smallserial column's sequence stops at 32767; the next nextval past the maximum errors.
id: doc-datatype-numeric.serial-sequence-max
title: smallserial sequence reaches its maximum of 32767 and then refuses to allocate
family: doc-datatype-numeric
tier: extended
feature_ids: [smallserial, sequences, setval, boundaries, errors]
required_capabilities: [create-table, insert, select, errors, sequences, int2]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-numeric-table (smallserial range 1 to 32767)"
sessions: [a]
setup: |
  CREATE TABLE tsm (id smallserial, v int);
steps:
  - sql: |
      SELECT setval(pg_get_serial_sequence('tsm', 'id'), 32766)
    expect: rows
  - sql: |
      INSERT INTO tsm(v) VALUES (1)
    expect: ok
  - sql: |
      SELECT id, v FROM tsm ORDER BY id
    expect: rows
    order: ordered
    comment: last allowed smallserial value is 32767
  - sql: |
      INSERT INTO tsm(v) VALUES (2)
    expect: error
    sqlstate: "2200H"
