# float(p) selects real for p in 1..24 and double precision for 25..53; invalid precisions error.
id: doc-datatype-numeric.float-precision-mapping
title: float(p) maps to real or double precision by binary precision and rejects p outside 1 to 53
family: doc-datatype-numeric
tier: core
feature_ids: [float4, float8, typmod, precision, errors]
required_capabilities: [create-table, select, errors, float4, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-float"
sessions: [a]
setup: |
  CREATE TABLE tfp (a float(1), b float(24), c float(25), d float, e float(53), f real, g double precision);
steps:
  - sql: |
      SELECT attname, format_type(atttypid, atttypmod) AS typ
      FROM pg_attribute
      WHERE attrelid = 'tfp'::regclass AND attnum > 0
      ORDER BY attnum
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE tf0 (a float(0))
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE TABLE tf54 (a float(54))
    expect: error
    sqlstate: "22023"
