# Documented example: numeric rounds ties away from zero, while double precision rounds to even.
id: doc-datatype-numeric.numeric-round-ties
title: Numeric round() breaks ties away from zero while double precision round() breaks them to even
family: doc-datatype-numeric
tier: core
feature_ids: [numeric, round, float8, rounding, generate-series]
required_capabilities: [select, numeric, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-numeric-decimal (round ties example)"
sessions: [a]
steps:
  - sql: |
      SELECT x,
        round(x::numeric) AS num_round,
        round(x::double precision) AS dbl_round
      FROM generate_series(-3.5, 3.5, 1) AS x
      ORDER BY x
    expect: rows
    order: ordered
    comment: the documented example, with ORDER BY added for determinism
  - sql: |
      SELECT round(2.5::numeric) AS a, round(-2.5::numeric) AS b, round(2.5::float8) AS c, round(-2.5::float8) AS d
    expect: rows
