# Documented smallint/integer/bigint ranges: boundary values store; one past the range errors.
id: doc-datatype-numeric.int-bounds-insert
title: Integer type boundary values store exactly; out-of-range inserts raise numeric_value_out_of_range
family: doc-datatype-numeric
tier: core
feature_ids: [int2, int4, int8, integer-types, boundaries, errors]
required_capabilities: [create-table, insert, select, errors, int2, int8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-numeric-table, #datatype-int"
sessions: [a]
setup: |
  CREATE TABLE ti (s int2, i int4, b int8);
steps:
  - sql: |
      INSERT INTO ti VALUES (32767, 2147483647, 9223372036854775807), (-32768, -2147483648, -9223372036854775808)
    expect: ok
  - sql: |
      SELECT s, i, b FROM ti ORDER BY s
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO ti(s) VALUES (32768)
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO ti(i) VALUES (2147483648)
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO ti(b) VALUES (9223372036854775808)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT count(*) FROM ti
    expect: rows
    comment: failed inserts left no rows behind
