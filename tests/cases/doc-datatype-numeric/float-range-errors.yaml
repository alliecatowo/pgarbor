# float8 overflow and underflow raise errors, as do out-of-range literals; the largest finite value still works.
id: doc-datatype-numeric.float-range-errors
title: Double precision overflow, underflow and out-of-range literals raise errors at the documented boundaries
family: doc-datatype-numeric
tier: core
feature_ids: [float8, range, overflow, underflow, errors, boundaries]
required_capabilities: [select, errors, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-float"
sessions: [a]
steps:
  - sql: |
      SELECT '1e308'::float8 * 1 AS largest_ok
    expect: rows
  - sql: |
      SELECT '1e308'::float8 * 10
    expect: error
    sqlstate: "22003"
    comment: overflow
  - sql: |
      SELECT '1e-200'::float8 * '1e-200'::float8
    expect: error
    sqlstate: "22003"
    comment: underflow to a value not distinct from zero
  - sql: |
      SELECT '1e400'::float8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '1e-400'::float8
    expect: error
    sqlstate: "22003"
