# Integer arithmetic and casts overflow with an error; widening to int8 or numeric avoids it.
id: doc-datatype-numeric.int-arithmetic-overflow
title: Integer overflow in arithmetic and casts errors, while widening operands avoids it
family: doc-datatype-numeric
tier: core
feature_ids: [int2, int4, int8, arithmetic, boundaries, errors]
required_capabilities: [select, errors, int2, int8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-int"
sessions: [a]
steps:
  - sql: |
      SELECT 2147483647::int4 + 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 9223372036854775807::int8 + 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT -9223372036854775808::int8 - 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 40000::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 2147483647::int4 + 1::int8 AS widened
    expect: rows
  - sql: |
      SELECT 9223372036854775807::int8 + 1::numeric AS widened_numeric
    expect: rows
