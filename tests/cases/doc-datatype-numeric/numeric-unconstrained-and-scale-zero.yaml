# Unconstrained NUMERIC keeps input scale; NUMERIC(p) selects scale 0 and rounds ties away from zero.
id: doc-datatype-numeric.numeric-unconstrained-and-scale-zero
title: Unconstrained numeric preserves input scale while NUMERIC(p) means scale 0 with rounding
family: doc-datatype-numeric
tier: core
feature_ids: [numeric, typmod, rounding, scale]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-numeric-decimal"
sessions: [a]
setup: |
  CREATE TABLE tu (v numeric);
  CREATE TABLE tz (v numeric(5));
  INSERT INTO tu VALUES (1.50), (2.000), (0.0100), (0);
  INSERT INTO tz VALUES (2.5), (-2.5), (3.5), (1234.4), (0.4);
steps:
  - sql: |
      SELECT v, scale(v) AS sc FROM tu ORDER BY v
    expect: rows
    order: ordered
    comment: unconstrained column does not coerce to a scale
  - sql: |
      SELECT v FROM tz ORDER BY v
    expect: rows
    order: ordered
    comment: NUMERIC(5) coerces to integer precision with ties away from zero
  - sql: |
      SELECT 1.005::numeric(5,2) AS a, 2.5::numeric(3,0) AS b, -2.5::numeric(3,0) AS c
    expect: rows
