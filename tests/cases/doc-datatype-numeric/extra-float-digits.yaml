# extra_float_digits selects shortest-precise output (default and >0) or rounded output (0).
id: doc-datatype-numeric.extra-float-digits
title: extra_float_digits switches float output between rounded and shortest-precise decimal forms
family: doc-datatype-numeric
tier: extended
feature_ids: [float4, float8, output-format, guc, extra-float-digits]
required_capabilities: [select, float8, float4, guc]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-float (extra_float_digits)"
sessions: [a]
steps:
  - sql: |
      SET extra_float_digits = 0
    expect: ok
  - sql: |
      SELECT 1234567::real AS r, 0.1::float8 + 0.2::float8 AS d
    expect: rows
    comment: rounded to 6 digits for real and 15 for double
  - sql: |
      SET extra_float_digits = 3
    expect: ok
  - sql: |
      SELECT 1234567::real AS r, 0.1::float8 + 0.2::float8 AS d
    expect: rows
    comment: shortest-precise output
  - sql: |
      SET extra_float_digits = 1
    expect: ok
  - sql: |
      SELECT 1234567::real AS r
    expect: rows
