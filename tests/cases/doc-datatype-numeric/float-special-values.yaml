# float8/float4 Infinity and NaN: IEEE special values, NaN treated as equal and greater than all non-NaN values.
id: doc-datatype-numeric.float-special-values
title: Floating-point Infinity and NaN inputs with NaN equality and ordering as PostgreSQL defines them
family: doc-datatype-numeric
tier: core
feature_ids: [float8, float4, special-values, nan, infinity, ordering]
required_capabilities: [create-table, insert, select, float8]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-float"
sessions: [a]
setup: |
  CREATE TABLE tfs (id int4, v float8, r float4);
  INSERT INTO tfs VALUES (1, 'Infinity', 'inf'), (2, '-Infinity', '-inf'), (3, 'NaN', 'NaN'), (4, 0, 0), (5, 1.5, -2.25), (6, 'infinity', 'Infinity');
steps:
  - sql: |
      SELECT id, v, r FROM tfs ORDER BY v, id
    expect: rows
    order: ordered
    comment: NaN is greater than every non-NaN value, including Infinity
  - sql: |
      SELECT 'NaN'::float8 = 'NaN'::float8 AS nan_eq,
             'NaN'::float8 > 'Infinity'::float8 AS nan_gt,
             'Infinity'::float8 - 'Infinity'::float8 AS inf_minus_inf,
             'Infinity'::float8 + 1 AS inf_plus,
             'NaN'::float4 = 'NaN'::float4 AS nan4_eq
    expect: rows
  - sql: |
      SELECT count(*) FROM tfs WHERE v = 'NaN'
    expect: rows
    comment: NaN equals NaN under PostgreSQL semantics, so the NaN row matches
