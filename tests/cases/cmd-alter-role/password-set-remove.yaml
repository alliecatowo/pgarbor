# ALTER ROLE sets a password (with and without WITH/ENCRYPTED), PASSWORD NULL removes it; the doc example uses davide.
id: cmd-alter-role.password-set-remove
title: ALTER ROLE PASSWORD sets and PASSWORD NULL removes a role password
family: cmd-alter-role
tier: core
feature_ids: [alter-role, password, password-null, encrypted-password, catalog-introspection]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "ref/alter_role.sgml#sql-alterrole-examples (Change a role's password; Remove a role's password)"
sessions: [a]
notes: "Stored password scheme is checked by prefix only. Roles are cluster-wide and are dropped at the end."
steps:
  - sql: |
      CREATE ROLE davide
    expect: ok
  - sql: |
      ALTER ROLE davide WITH PASSWORD 'hu8jmn3'
    expect: ok
  - sql: |
      SELECT rolpassword IS NOT NULL AS has_password, left(rolpassword, 14) AS scheme FROM pg_authid WHERE rolname = 'davide'
    expect: rows
  - sql: |
      ALTER ROLE davide WITH PASSWORD NULL
    expect: ok
  - sql: |
      SELECT rolpassword IS NULL AS no_password FROM pg_authid WHERE rolname = 'davide'
    expect: rows
  - sql: |
      ALTER ROLE davide ENCRYPTED PASSWORD 'pw_davide_1'
    expect: ok
    comment: WITH is optional and ENCRYPTED is accepted; default encryption is SCRAM-SHA-256
  - sql: |
      SELECT left(rolpassword, 14) AS scheme FROM pg_authid WHERE rolname = 'davide'
    expect: rows
  - sql: |
      ALTER ROLE davide PASSWORD NULL
    expect: ok
  - sql: |
      SELECT rolpassword IS NULL AS no_password FROM pg_authid WHERE rolname = 'davide'
    expect: rows
  - sql: |
      DROP ROLE davide
    expect: ok
