# Doc example: grant CREATEROLE and CREATEDB together, then revoke both with the NO forms.
id: cmd-alter-role.createrole-createdb-example
title: ALTER ROLE grants and revokes CREATEROLE and CREATEDB
family: cmd-alter-role
tier: core
feature_ids: [alter-role, createrole, createdb, catalog-introspection]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "ref/alter_role.sgml#sql-alterrole-examples (Give a role the ability to manage other roles and create new databases)"
sessions: [a]
notes: "Only the creation flags are checked. CREATE ROLE is run without options first so the defaults are visible."
steps:
  - sql: |
      CREATE ROLE miriam
    expect: ok
  - sql: |
      SELECT rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname = 'miriam'
    expect: rows
  - sql: |
      ALTER ROLE miriam CREATEROLE CREATEDB
    expect: ok
  - sql: |
      SELECT rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname = 'miriam'
    expect: rows
  - sql: |
      ALTER ROLE miriam NOCREATEROLE NOCREATEDB
    expect: ok
  - sql: |
      SELECT rolcreaterole, rolcreatedb FROM pg_roles WHERE rolname = 'miriam'
    expect: rows
  - sql: |
      DROP ROLE miriam
    expect: ok
