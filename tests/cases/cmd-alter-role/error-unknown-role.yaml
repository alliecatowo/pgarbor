# Every variant that names a missing role fails with undefined_object.
id: cmd-alter-role.error-unknown-role
title: ALTER ROLE on a missing role fails with undefined_object for each variant
family: cmd-alter-role
tier: core
feature_ids: [alter-role, errors, undefined-object]
required_capabilities: [roles, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_role.sgml#sql-alterrole-params-name (the name of the role whose attributes are to be altered)"
sessions: [a]
steps:
  - sql: |
      ALTER ROLE alr_missing PASSWORD 'x'
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER ROLE alr_missing CREATEDB
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER ROLE alr_missing SET application_name = 'x'
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER ROLE alr_missing RENAME TO alr_x
    expect: error
    sqlstate: "42704"
