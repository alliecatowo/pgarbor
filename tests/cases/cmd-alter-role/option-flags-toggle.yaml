# Every boolean role attribute can be set and cleared, with and without WITH, and CONNECTION LIMIT rides along.
id: cmd-alter-role.option-flags-toggle
title: ALTER ROLE toggles every boolean attribute and the connection limit
family: cmd-alter-role
tier: core
feature_ids: [alter-role, superuser, createdb, createrole, inherit, login, replication, bypassrls, connection-limit]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "ref/alter_role.sgml#sql-alterrole-params-superuser (SUPERUSER through CONNECTION LIMIT)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE alr_flags
    expect: ok
  - sql: |
      SELECT rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolcanlogin, rolreplication, rolbypassrls, rolconnlimit FROM pg_roles WHERE rolname = 'alr_flags'
    expect: rows
    comment: defaults for CREATE ROLE with no options
  - sql: |
      ALTER ROLE alr_flags WITH SUPERUSER CREATEDB CREATEROLE NOINHERIT LOGIN REPLICATION BYPASSRLS CONNECTION LIMIT 7
    expect: ok
  - sql: |
      SELECT rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolcanlogin, rolreplication, rolbypassrls, rolconnlimit FROM pg_roles WHERE rolname = 'alr_flags'
    expect: rows
  - sql: |
      ALTER ROLE alr_flags NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOLOGIN NOREPLICATION NOBYPASSRLS CONNECTION LIMIT -1
    expect: ok
  - sql: |
      SELECT rolsuper, rolcreatedb, rolcreaterole, rolinherit, rolcanlogin, rolreplication, rolbypassrls, rolconnlimit FROM pg_roles WHERE rolname = 'alr_flags'
    expect: rows
  - sql: |
      ALTER ROLE alr_flags NOINHERIT
    expect: ok
    comment: WITH is optional
  - sql: |
      SELECT rolinherit FROM pg_roles WHERE rolname = 'alr_flags'
    expect: rows
  - sql: |
      DROP ROLE alr_flags
    expect: ok
