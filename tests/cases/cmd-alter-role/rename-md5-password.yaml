# Renaming a role clears an MD5 password but keeps a SCRAM password.
id: cmd-alter-role.rename-md5-password
title: ALTER ROLE RENAME clears an MD5-encrypted password and keeps a SCRAM password
family: cmd-alter-role
tier: extended
feature_ids: [alter-role, rename, md5-password, scram-password, password-encryption]
required_capabilities: [roles, catalog-introspection, select, guc, notices]
provenance:
  source: pg-docs
  ref: "ref/alter_role.sgml#sql-alterrole-desc (renaming a role clears an MD5-encrypted password)"
sessions: [a]
notes: "MD5 passwords emit a deprecation warning and the rename emits a notice; those are not compared."
steps:
  - sql: |
      SET password_encryption = 'md5'
    expect: ok
  - sql: |
      CREATE ROLE alr_md5 PASSWORD 'md5pw'
    expect: ok
    compare_message: false
  - sql: |
      SET password_encryption = 'scram-sha-256'
    expect: ok
  - sql: |
      CREATE ROLE alr_scram PASSWORD 'scrampw'
    expect: ok
  - sql: |
      SELECT rolname, left(rolpassword, 3) AS scheme FROM pg_authid WHERE rolname IN ('alr_md5', 'alr_scram') ORDER BY rolname
    expect: rows
    order: ordered
  - sql: |
      ALTER ROLE alr_md5 RENAME TO alr_md5_renamed
    expect: ok
    compare_message: false
  - sql: |
      ALTER ROLE alr_scram RENAME TO alr_scram_renamed
    expect: ok
  - sql: |
      SELECT rolname, rolpassword IS NULL AS cleared FROM pg_authid WHERE rolname IN ('alr_md5_renamed', 'alr_scram_renamed') ORDER BY rolname
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE alr_md5_renamed;
      DROP ROLE alr_scram_renamed
    expect: ok
