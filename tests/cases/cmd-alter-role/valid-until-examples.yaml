# The two VALID UNTIL doc examples: a fixed expiry with a UTC+1 offset, and 'infinity' for a password valid forever.
id: cmd-alter-role.valid-until-examples
title: ALTER ROLE VALID UNTIL accepts a timestamp with offset and infinity
family: cmd-alter-role
tier: core
feature_ids: [alter-role, valid-until, timestamptz, infinity]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "ref/alter_role.sgml#sql-alterrole-examples (Change a password expiration date; Make a password valid forever)"
sessions: [a]
notes: "'May 4 12:00:00 2015 +1' is 12:00 at UTC+1, so the stored instant is 11:00 UTC."
steps:
  - sql: |
      CREATE ROLE chris;
      CREATE ROLE fred
    expect: ok
  - sql: |
      ALTER ROLE chris VALID UNTIL 'May 4 12:00:00 2015 +1'
    expect: ok
  - sql: |
      SELECT rolvaliduntil = '2015-05-04 11:00:00+00'::timestamptz AS expires_1100_utc FROM pg_authid WHERE rolname = 'chris'
    expect: rows
  - sql: |
      ALTER ROLE fred VALID UNTIL 'infinity'
    expect: ok
  - sql: |
      SELECT rolvaliduntil = 'infinity'::timestamptz AS forever FROM pg_authid WHERE rolname = 'fred'
    expect: rows
  - sql: |
      ALTER ROLE chris VALID UNTIL 'infinity'
    expect: ok
    comment: a later VALID UNTIL replaces the earlier expiry
  - sql: |
      SELECT rolvaliduntil = 'infinity'::timestamptz AS forever FROM pg_authid WHERE rolname = 'chris'
    expect: rows
  - sql: |
      DROP ROLE chris;
      DROP ROLE fred
    expect: ok
