# Re-running a migration that creates a table: IF NOT EXISTS gives a NOTICE, plain CREATE gives duplicate_table.
id: orm-drizzle.create-table-if-not-exists-notice
title: CREATE TABLE IF NOT EXISTS is a no-op with NOTICE, plain CREATE raises 42P07
family: orm-drizzle
tier: core
feature_ids: [create-table, errors, notices]
required_capabilities: [create-table, errors]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html IF NOT EXISTS; errcodes 42P07"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE IF NOT EXISTS app_config (key text PRIMARY KEY, value text)
    expect: ok
  - sql: |
      CREATE TABLE IF NOT EXISTS app_config (key text PRIMARY KEY, value text)
    expect: notice
  - sql: |
      CREATE TABLE app_config (key text PRIMARY KEY, value text)
    expect: error
    sqlstate: "42P07"
  - sql: |
      SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'app_config'
    expect: rows
    order: multiset
