# NOT NULL columns without defaults reject inserts that omit them, including via multi-row VALUES.
id: orm-drizzle.not-null-violation-default-missing
title: Insert omitting a NOT NULL column without default raises 23502 and writes nothing
family: orm-drizzle
tier: core
feature_ids: [not-null, insert, errors, select]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: hand
  ref: "PG18 ddl-constraints.html#DDL-CONSTRAINTS-NOT-NULL; errcodes 23502"
sessions: [a]
setup: |
  CREATE TABLE profiles (
    id integer PRIMARY KEY,
    handle text NOT NULL,
    bio text
  );
steps:
  - sql: |
      INSERT INTO profiles (id, handle) VALUES (1, 'alice')
    expect: ok
  - sql: |
      INSERT INTO profiles (id, bio) VALUES (2, 'no handle')
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT id, handle, bio FROM profiles ORDER BY id
    expect: rows
    order: ordered
