# ON DELETE CASCADE removes dependent rows; referential_constraints reports the rule.
id: orm-drizzle.fk-cascade-delete
title: Deleting a parent row cascades to children declared with ON DELETE CASCADE
family: orm-drizzle
tier: core
feature_ids: [foreign-key, cascade, delete, catalog-introspection]
required_capabilities: [create-table, insert, delete, foreign-key, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 ddl-constraints.html#DDL-CONSTRAINTS-FK; infoschema-referential-constraints.html"
sessions: [a]
setup: |
  CREATE TABLE authors (id integer PRIMARY KEY, name text NOT NULL);
  CREATE TABLE posts (
    id integer PRIMARY KEY,
    author_id integer NOT NULL REFERENCES authors (id) ON DELETE CASCADE,
    title text
  );
  INSERT INTO authors VALUES (1, 'ann'), (2, 'bob');
  INSERT INTO posts VALUES (10, 1, 'a1'), (11, 1, NULL), (20, 2, 'b1');
steps:
  - sql: |
      DELETE FROM authors WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, author_id, title FROM posts ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT delete_rule, update_rule FROM information_schema.referential_constraints WHERE constraint_schema = 'public' AND constraint_name = 'posts_author_id_fkey'
    expect: rows
    order: multiset
