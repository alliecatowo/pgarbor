# ORDER BY on a UNION, INTERSECT or EXCEPT may only use output column names or numbers.
id: doc-queries-order.union-order-by-names-only
title: ORDER BY after UNION accepts output names and numbers but rejects expressions
family: doc-queries-order
tier: core
feature_ids: [order-by, set-operations, union, errors]
required_capabilities: [create-table, insert, select, order-by, union, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (ORDER BY can be applied to the result of a UNION, INTERSECT, or EXCEPT combination, but ... only output column names or numbers)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, c int4);
  INSERT INTO t VALUES (1, 3), (2, 4), (3, NULL), (4, 1);
steps:
  - sql: |
      SELECT a FROM t UNION SELECT c FROM t ORDER BY 1 DESC
    expect: rows
    order: ordered
    comment: position 1 of the union result, descending, nulls first by default
  - sql: |
      SELECT a AS v FROM t UNION SELECT c FROM t ORDER BY v NULLS LAST
    expect: rows
    order: ordered
    comment: output label of the first select, explicit null placement
  - sql: |
      SELECT a FROM t UNION SELECT c FROM t ORDER BY a + 1
    expect: error
    sqlstate: "0A000"
    comment: expressions are not allowed after a set operation
