# Without ORDER BY the row order is unspecified, so the result is compared as a multiset only.
id: doc-queries-order.unordered-select-multiset
title: Query without ORDER BY returns the same rows in an unspecified order
family: doc-queries-order
tier: core
feature_ids: [order-by, unspecified-order, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (If sorting is not chosen, the rows will be returned in an unspecified order)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (3, 'c'), (1, 'a'), (2, 'b'), (2, 'bb');
steps:
  - sql: |
      SELECT a, b FROM t
    expect: rows
    order: multiset
    comment: row order must not be relied on
  - sql: |
      SELECT a, b FROM t WHERE a > 1
    expect: rows
    order: multiset
    comment: filtered rows compared as a multiset
  - sql: |
      SELECT a, b FROM t ORDER BY a, b
    expect: rows
    order: ordered
    comment: an explicit sort makes the order guaranteed
