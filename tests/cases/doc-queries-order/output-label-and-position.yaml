# A sort_expression may be an output column label or a 1-based output column number.
id: doc-queries-order.output-label-and-position
title: ORDER BY can reference an output column by label or by position
family: doc-queries-order
tier: core
feature_ids: [order-by, column-labels, column-position, group-by]
required_capabilities: [create-table, insert, select, order-by, group-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (SELECT a + b AS sum, c FROM table1 ORDER BY sum; SELECT a, max(b) FROM table1 GROUP BY a ORDER BY 1)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4, c int4);
  INSERT INTO t VALUES (1, 2, 3), (2, NULL, 4), (3, 5, NULL), (4, 5, 1), (NULL, 1, 1);
steps:
  - sql: |
      SELECT a + b AS sum, c FROM t ORDER BY sum NULLS FIRST, c
    expect: rows
    order: ordered
    comment: sort by output label sum, NULLs first
  - sql: |
      SELECT a + b AS sum, c FROM t ORDER BY 1 DESC, c
    expect: rows
    order: ordered
    comment: sort by output column position 1 descending
  - sql: |
      SELECT a, max(b) FROM t GROUP BY a ORDER BY 1
    expect: rows
    order: ordered
    comment: position 1 refers to the grouped column a
  - sql: |
      SELECT a, max(b) FROM t GROUP BY a ORDER BY 2 DESC NULLS LAST, 1
    expect: rows
    order: ordered
    comment: positions may be mixed with explicit null placement
