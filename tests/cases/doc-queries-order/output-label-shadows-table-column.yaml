# A bare name in ORDER BY resolves to the output column when it matches both an output label and a table column.
id: doc-queries-order.output-label-shadows-table-column
title: Output column name takes precedence over a same-named table column in ORDER BY
family: doc-queries-order
tier: core
feature_ids: [order-by, column-labels, name-resolution]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (The output column is used in such cases)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4);
  INSERT INTO t VALUES (1, 2), (2, NULL), (3, 5), (4, 5), (NULL, 1);
steps:
  - sql: |
      SELECT a AS b, b AS a FROM t ORDER BY a, b
    expect: rows
    order: ordered
    comment: the first key a resolves to the output column labelled a, which carries table column b
  - sql: |
      SELECT a AS b, b AS a FROM t ORDER BY b
    expect: rows
    order: ordered
    comment: ORDER BY b sorts by the output column labelled b, which carries table column a
