# NULLs sort as larger than any non-null value: NULLS LAST for ASC and NULLS FIRST for DESC by default.
id: doc-queries-order.nulls-first-last-defaults
title: Default null placement is NULLS LAST for ASC and NULLS FIRST for DESC
family: doc-queries-order
tier: core
feature_ids: [order-by, nulls-ordering, sort-direction]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (By default, null values sort as if larger than any non-null value)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (1, 30), (2, NULL), (3, 10), (4, NULL), (5, 20);
steps:
  - sql: |
      SELECT id, v FROM t ORDER BY v, id
    expect: rows
    order: ordered
    comment: ASC default puts NULLs last
  - sql: |
      SELECT id, v FROM t ORDER BY v DESC, id
    expect: rows
    order: ordered
    comment: DESC default puts NULLs first
  - sql: |
      SELECT id, v FROM t ORDER BY v ASC NULLS FIRST, id
    expect: rows
    order: ordered
    comment: explicit NULLS FIRST overrides the ASC default
  - sql: |
      SELECT id, v FROM t ORDER BY v DESC NULLS LAST, id
    expect: rows
    order: ordered
    comment: explicit NULLS LAST overrides the DESC default
