# ORDER BY uses the type's default B-tree operator class; for enums that is declaration order, with NULLs last.
id: doc-queries-order.enum-sorts-by-declaration-order
title: ORDER BY on an enum column sorts by declared label order, not alphabetically
family: doc-queries-order
tier: core
feature_ids: [order-by, enum-type, btree-opclass]
required_capabilities: [create-table, insert, select, order-by, create-type]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (PostgreSQL uses the default B-tree operator class for the expression's data type)"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
  CREATE TABLE m (id int4, v mood);
  INSERT INTO m VALUES (1, 'happy'), (2, 'sad'), (3, NULL), (4, 'ok');
steps:
  - sql: |
      SELECT id, v FROM m ORDER BY v, id
    expect: rows
    order: ordered
    comment: declaration order sad, ok, happy; NULL last
  - sql: |
      SELECT id, v FROM m ORDER BY v DESC, id
    expect: rows
    order: ordered
    comment: descending reverses declaration order and puts NULL first
  - sql: |
      SELECT id, v FROM m ORDER BY v DESC NULLS LAST, id
    expect: rows
    order: ordered
    comment: explicit NULLS LAST with descending order
