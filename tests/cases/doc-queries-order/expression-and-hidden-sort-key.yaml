# ORDER BY may use any expression valid in the select list, including one not projected.
id: doc-queries-order.expression-and-hidden-sort-key
title: ORDER BY accepts expressions and keys that are not in the select list
family: doc-queries-order
tier: core
feature_ids: [order-by, sort-expression, null-semantics]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (SELECT a, b FROM table1 ORDER BY a + b, c)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4, c int4);
  INSERT INTO t VALUES (1, 2, 3), (2, NULL, 4), (3, 5, NULL), (4, 5, 1), (NULL, 1, 1);
steps:
  - sql: |
      SELECT a, b FROM t ORDER BY a + b, c
    expect: rows
    order: ordered
    comment: sort by a computed value and a column that is not in the select list
  - sql: |
      SELECT a FROM t ORDER BY b NULLS FIRST, a DESC
    expect: rows
    order: ordered
    comment: sort key b is not projected and nulls come first
  - sql: |
      SELECT a + b FROM t ORDER BY a + b NULLS LAST, c
    expect: rows
    order: ordered
    comment: NULL sums tie and are broken by c
