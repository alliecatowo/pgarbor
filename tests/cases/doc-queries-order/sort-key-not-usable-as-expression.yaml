# An output label must stand alone in ORDER BY; positions outside the select list are rejected.
id: doc-queries-order.sort-key-not-usable-as-expression
title: Output labels cannot be used inside ORDER BY expressions and bad positions are rejected
family: doc-queries-order
tier: core
feature_ids: [order-by, column-labels, errors]
required_capabilities: [create-table, insert, select, order-by, errors]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (an output column name has to stand alone; SELECT a + b AS sum, c FROM table1 ORDER BY sum + c is wrong)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4, c int4);
  INSERT INTO t VALUES (1, 2, 3), (2, NULL, 4), (3, 5, NULL);
steps:
  - sql: |
      SELECT a + b AS sum, c FROM t ORDER BY sum + c
    expect: error
    sqlstate: "42703"
    comment: a label inside an expression is not a column name
  - sql: |
      SELECT a, b FROM t ORDER BY 5
    expect: error
    sqlstate: "42P10"
    comment: position beyond the select list
  - sql: |
      SELECT a, b FROM t ORDER BY 0
    expect: error
    sqlstate: "42P10"
    comment: positions start at 1
  - sql: |
      SELECT a + b AS sum, c FROM t ORDER BY sum, c
    expect: rows
    order: ordered
    comment: a bare label followed by other keys is accepted
