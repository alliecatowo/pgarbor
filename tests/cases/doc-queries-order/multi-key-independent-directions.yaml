# ORDER BY sort keys are considered independently; x, y DESC differs from x DESC, y DESC.
id: doc-queries-order.multi-key-independent-directions
title: Multi-key ORDER BY applies each direction independently per key
family: doc-queries-order
tier: core
feature_ids: [order-by, sort-direction, multi-key-sort]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "queries.sgml#queries-order (ORDER BY ordering options are considered independently for each sort column)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b int4);
  INSERT INTO t VALUES (1, 2), (2, NULL), (3, 5), (4, 5), (NULL, 1);
steps:
  - sql: |
      SELECT a, b FROM t ORDER BY a, b DESC
    expect: rows
    order: ordered
    comment: a ascending then b descending
  - sql: |
      SELECT a, b FROM t ORDER BY a DESC, b DESC
    expect: rows
    order: ordered
    comment: a descending then b descending, a different order from the previous step
  - sql: |
      SELECT a, b FROM t ORDER BY a ASC, b ASC
    expect: rows
    order: ordered
    comment: ASC is the default, so this equals ORDER BY a, b
  - sql: |
      SELECT a, b FROM t ORDER BY a, b
    expect: rows
    order: ordered
    comment: explicit ASC and default direction agree
