# ROLLBACK TO keeps its savepoint alive, so the same savepoint can be rolled back to twice.
id: transactions.savepoint-rollback-to-repeatable
title: A savepoint survives ROLLBACK TO and can be rolled back to again
family: transactions
tier: core
feature_ids: [transactions, savepoints, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/transactions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE sp (a int4);
steps:
  - sql: |
      BEGIN;
      INSERT INTO sp VALUES (18);
      SAVEPOINT one;
      INSERT INTO sp VALUES (19);
      SAVEPOINT two;
      INSERT INTO sp VALUES (20);
      ROLLBACK TO SAVEPOINT one;
      INSERT INTO sp VALUES (21);
      ROLLBACK TO SAVEPOINT one;
      INSERT INTO sp VALUES (22);
      COMMIT
    expect: ok
  - sql: |
      SELECT a FROM sp ORDER BY a
    expect: rows
    order: ordered
