# Multi-statement transaction block: multi-row and default-column inserts, END as COMMIT.
id: transactions.begin-insert-end-commit
title: Multi-row insert inside BEGIN/END is visible after commit, ordered read
family: transactions
tier: core
feature_ids: [transactions, insert, select, commit]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/transactions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE xacttest (a smallint, b real);
steps:
  - sql: |
      BEGIN;
      INSERT INTO xacttest VALUES (56, 7.8), (100, 99.097), (0, 0.09561), (42, 324.78);
      INSERT INTO xacttest (a, b) VALUES (777, 777.777);
      END
    expect: ok
  - sql: |
      SELECT a FROM xacttest WHERE a > 100 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM xacttest ORDER BY a
    expect: rows
    order: ordered
