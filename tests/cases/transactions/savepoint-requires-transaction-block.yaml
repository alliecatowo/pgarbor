# SAVEPOINT, ROLLBACK TO SAVEPOINT and RELEASE SAVEPOINT are rejected outside a transaction block.
id: transactions.savepoint-requires-transaction-block
title: SAVEPOINT commands outside a transaction block fail with 25P01
family: transactions
tier: core
feature_ids: [transactions, savepoints, errors]
required_capabilities: [transactions, savepoints, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/transactions.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SAVEPOINT one
    expect: error
    sqlstate: "25P01"
  - sql: |
      ROLLBACK TO SAVEPOINT one
    expect: error
    sqlstate: "25P01"
  - sql: |
      RELEASE SAVEPOINT one
    expect: error
    sqlstate: "25P01"
  - sql: |
      SELECT 1
    expect: rows
    comment: the session is still usable in autocommit mode
