# SET TRANSACTION READ WRITE is rejected after a query ran, and inside a READ ONLY transaction.
id: transactions.read-write-after-query-rejected
title: SET TRANSACTION READ WRITE fails after the first query or inside a read-only transaction (25001)
family: transactions
tier: core
feature_ids: [transactions, read-only-transactions, errors]
required_capabilities: [create-table, select, transactions, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/transactions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE writetest (a int4);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT a FROM writetest
    expect: rows
  - sql: |
      SET TRANSACTION READ WRITE
    expect: error
    sqlstate: "25001"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION READ ONLY
    expect: ok
  - sql: |
      SET TRANSACTION READ WRITE
    expect: error
    sqlstate: "25001"
  - sql: |
      COMMIT
    expect: ok
