# PG 18.6: SET TRANSACTION READ WRITE is accepted after a query and inside a READ ONLY block (no writes yet);
# SET TRANSACTION ISOLATION LEVEL after the first query is rejected with 25001.
id: transactions.read-write-after-query-rejected
title: SET TRANSACTION READ WRITE is accepted after a query; ISOLATION LEVEL after a query fails with 25001
family: transactions
tier: core
feature_ids: [transactions, read-only-transactions, isolation-level, errors]
required_capabilities: [create-table, select, transactions, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/transactions.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE writetest (a int4);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT a FROM writetest
    expect: rows
  - sql: |
      SET TRANSACTION READ WRITE
    expect: ok
    comment: PG 18.6 accepts READ WRITE after a query because the block has not written anything
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: error
    sqlstate: "25001"
    comment: isolation level must be set before the first query; the failure aborts the block
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION READ ONLY
    expect: ok
  - sql: |
      SET TRANSACTION READ WRITE
    expect: ok
    comment: PG 18.6 allows switching a READ ONLY block back to READ WRITE before any write
  - sql: |
      COMMIT
    expect: ok
