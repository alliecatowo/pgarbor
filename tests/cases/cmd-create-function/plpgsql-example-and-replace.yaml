# PL/pgSQL increment() example from the reference, then CREATE OR REPLACE with the same signature
# replaces the body in place.
id: cmd-create-function.plpgsql-example-and-replace
title: PL/pgSQL increment() doc example and CREATE OR REPLACE swapping the body
family: cmd-create-function
tier: core
feature_ids: [create-function, plpgsql, create-or-replace]
required_capabilities: [create-function, plpgsql, select]
provenance:
  source: pg-docs
  ref: "ref/create_function.sgml#sql-createfunction-examples (increment example)"
sessions: [a]
steps:
  - sql: |
      CREATE OR REPLACE FUNCTION increment(i integer) RETURNS integer AS $$
              BEGIN
                      RETURN i + 1;
              END;
      $$ LANGUAGE plpgsql
    expect: ok
  - sql: |
      SELECT increment(41) AS v
    expect: rows
  - sql: |
      CREATE OR REPLACE FUNCTION increment(i integer) RETURNS integer AS $$
              BEGIN
                      RETURN i + 2;
              END;
      $$ LANGUAGE plpgsql
    expect: ok
    comment: same name and argument types, so this replaces the definition
  - sql: |
      SELECT increment(40) AS v, (SELECT count(*) FROM pg_proc WHERE proname = 'increment') AS overloads
    expect: rows
    comment: the new body gives 42 and there is still a single increment function
