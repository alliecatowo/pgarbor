# sql_body: RETURN expression form and BEGIN ATOMIC block form; LANGUAGE defaults to sql
# when a sql_body is given.
id: cmd-create-function.sql-body-return-and-atomic
title: sql_body forms (RETURN expression, BEGIN ATOMIC block) without an explicit LANGUAGE clause
family: cmd-create-function
tier: core
feature_ids: [create-function, sql-body, begin-atomic, sql-language]
required_capabilities: [create-function, sql-functions, select]
provenance:
  source: pg-docs
  ref: "ref/create_function.sgml#sql-createfunction-description (sql_body parameter)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION sb(a int) RETURNS int BEGIN ATOMIC SELECT a; END
    expect: ok
    comment: no LANGUAGE clause; sql is the default when sql_body is present
  - sql: |
      SELECT sb(3) AS v
    expect: rows
  - sql: |
      CREATE FUNCTION sb2(a int) RETURNS int BEGIN ATOMIC SELECT 1; RETURN a + 1; END
    expect: ok
    comment: multi-statement block; the RETURN statement supplies the result
  - sql: |
      SELECT sb2(3) AS v
    expect: rows
  - sql: |
      CREATE FUNCTION sb3(a int, b int) RETURNS int LANGUAGE sql RETURN a * 10 + b
    expect: ok
  - sql: |
      SELECT sb3(4, 2) AS v, sb3(NULL, 2) IS NULL AS null_result
    expect: rows
    comment: without STRICT the body still runs; NULL a makes the expression NULL
