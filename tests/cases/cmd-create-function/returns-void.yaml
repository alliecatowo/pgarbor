# RETURNS void: a function with no value. Its result is a single void-typed value that is NULL
# in IS NULL tests and reports the type void.
id: cmd-create-function.returns-void
title: RETURNS void functions produce a void-typed NULL result column
family: cmd-create-function
tier: core
feature_ids: [create-function, returns-void]
required_capabilities: [create-function, sql-functions, select]
provenance:
  source: pg-docs
  ref: "ref/create_function.sgml#sql-createfunction-description (rettype: void)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION rv(int) RETURNS void LANGUAGE sql AS 'select 1'
    expect: ok
  - sql: |
      SELECT rv(1) IS NULL AS isnull, pg_typeof(rv(1))::text AS typ
    expect: rows
    comment: isnull true, typ void
