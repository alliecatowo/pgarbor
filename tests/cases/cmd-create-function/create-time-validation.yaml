# CREATE FUNCTION rejects an unknown language, and validates a SQL string body at creation time
# (check_function_bodies), so a missing column is reported immediately and nothing is created.
id: cmd-create-function.create-time-validation
title: Unknown LANGUAGE is rejected; a SQL string body is validated at creation and a failed create leaves no function
family: cmd-create-function
tier: core
feature_ids: [create-function, language, body-validation]
required_capabilities: [create-function, sql-functions, select]
provenance:
  source: pg-docs
  ref: "ref/create_function.sgml#sql-createfunction-description (lang_name, definition)"
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION nolang() RETURNS int LANGUAGE nosuch AS 'select 1'
    expect: error
    sqlstate: "42704"
    comment: no such language
  - sql: |
      CREATE FUNCTION nsqf2(x int) RETURNS int LANGUAGE sql AS 'select nope_col'
    expect: error
    sqlstate: "42703"
    comment: the SQL body is checked when the function is created
  - sql: |
      SELECT nsqf2(1)
    expect: error
    sqlstate: "42883"
    comment: the failed CREATE left no function behind
  - sql: |
      CREATE FUNCTION okf(x int) RETURNS int LANGUAGE sql AS 'select x + 1'
    expect: ok
  - sql: |
      SELECT okf(1) AS v
    expect: rows
    comment: "2"
