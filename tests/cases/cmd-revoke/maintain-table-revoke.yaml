# REVOKE of a single named privilege (MAINTAIN) leaves the other privileges granted on the same table.
id: cmd-revoke.maintain-table-revoke
title: REVOKE MAINTAIN removes only MAINTAIN and keeps SELECT on the table
family: cmd-revoke
tier: core
feature_ids: [revoke, maintain-privilege, select-privilege, privileges]
required_capabilities: [create-table, select, roles, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/revoke.sgml#sql-revoke (privilege list includes MAINTAIN)"
sessions: [a]
setup: |
  DO $$ DECLARE r text; BEGIN FOREACH r IN ARRAY ARRAY['pgarbor_case_role_rvm2_u'] LOOP IF EXISTS (SELECT FROM pg_roles WHERE rolname = r) THEN EXECUTE format('DROP ROLE %I', r); END IF; END LOOP; END $$;
  CREATE ROLE pgarbor_case_role_rvm2_u;
  CREATE TABLE rvm2_t (id int4);
  GRANT SELECT, MAINTAIN ON rvm2_t TO pgarbor_case_role_rvm2_u;
steps:
  - sql: |
      REVOKE MAINTAIN ON rvm2_t FROM pgarbor_case_role_rvm2_u
    expect: ok
  - sql: |
      SELECT has_table_privilege('pgarbor_case_role_rvm2_u', 'rvm2_t', 'SELECT') AS sel, has_table_privilege('pgarbor_case_role_rvm2_u', 'rvm2_t', 'MAINTAIN') AS maint
    expect: rows
