# A non-owner with no privileges on the object cannot REVOKE at all; the command fails outright.
id: cmd-revoke.nonowner-no-privileges-error
title: REVOKE by a non-owner with no privileges on the object fails with permission denied
family: cmd-revoke
tier: core
feature_ids: [revoke, privileges, ownership, errors]
required_capabilities: [create-table, select, roles, errors]
provenance:
  source: pg-docs
  ref: "ref/revoke.sgml#sql-revoke-notes (command will fail outright if the user has no privileges whatsoever on the object)"
sessions: [a]
setup: |
  CREATE ROLE rvn_owner;
  CREATE ROLE rvn_s;
  CREATE ROLE rvn_b;
  CREATE TABLE rvn_t (id int4);
  ALTER TABLE rvn_t OWNER TO rvn_owner;
  GRANT SELECT ON rvn_t TO rvn_b;
steps:
  - sql: |
      SET ROLE rvn_s
    expect: ok
  - sql: |
      REVOKE ALL PRIVILEGES ON rvn_t FROM rvn_b
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT has_table_privilege('rvn_b', 'rvn_t', 'SELECT') AS b_still_has_select
    expect: rows
    comment: the rejected revoke removed nothing
