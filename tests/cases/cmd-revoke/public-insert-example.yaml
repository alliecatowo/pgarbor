# Doc example: REVOKE INSERT ON films FROM PUBLIC removes the PUBLIC insert grant from a non-owner.
id: cmd-revoke.public-insert-example
title: REVOKE INSERT ... FROM PUBLIC removes insert for a role that only had it through PUBLIC
family: cmd-revoke
tier: core
feature_ids: [revoke, grant, public-role, insert, privileges, errors]
required_capabilities: [create-table, insert, select, roles, errors]
provenance:
  source: pg-docs
  ref: "ref/revoke.sgml#sql-revoke-examples (Revoke insert privilege for the public on table films)"
sessions: [a]
setup: |
  DO $$ DECLARE r text; BEGIN FOREACH r IN ARRAY ARRAY['pgarbor_case_role_rvi_u'] LOOP IF EXISTS (SELECT FROM pg_roles WHERE rolname = r) THEN EXECUTE format('DROP ROLE %I', r); END IF; END LOOP; END $$;
  CREATE ROLE pgarbor_case_role_rvi_u;
  CREATE TABLE rvf_films (id int4, title text);
  GRANT INSERT ON rvf_films TO PUBLIC;
steps:
  - sql: |
      SET ROLE pgarbor_case_role_rvi_u
    expect: ok
  - sql: |
      INSERT INTO rvf_films VALUES (1, 'before revoke')
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      REVOKE INSERT ON rvf_films FROM PUBLIC
    expect: ok
  - sql: |
      SET ROLE pgarbor_case_role_rvi_u
    expect: ok
  - sql: |
      INSERT INTO rvf_films VALUES (2, 'after revoke')
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT id, title FROM rvf_films ORDER BY id
    expect: rows
    order: ordered
    comment: only the row inserted before the revoke is present
