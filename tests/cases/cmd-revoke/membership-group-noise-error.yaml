# The GROUP noise word is not allowed in the role-membership form of REVOKE.
id: cmd-revoke.membership-group-noise-error
title: REVOKE role membership rejects the GROUP noise word in role_specification
family: cmd-revoke
tier: core
feature_ids: [revoke, role-membership, syntax, errors]
required_capabilities: [create-table, roles, errors]
provenance:
  source: pg-docs
  ref: "ref/revoke.sgml#sql-revoke-description (this form of the command does not allow the noise word GROUP in role_specification)"
sessions: [a]
setup: |
  CREATE ROLE rvq_admins;
  CREATE ROLE rvq_joe;
  GRANT rvq_admins TO rvq_joe;
steps:
  - sql: |
      REVOKE rvq_admins FROM GROUP rvq_joe
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT pg_has_role('rvq_joe', 'rvq_admins', 'MEMBER') AS still_member
    expect: rows
