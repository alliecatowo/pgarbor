# The FK constraint lives on the referencing table, so dropping that table needs no CASCADE;
# afterwards the referenced table can be dropped with plain RESTRICT.
id: doc-ddl-depend.drop-referencing-table-no-cascade
title: Dropping the referencing table needs no CASCADE and unblocks dropping the referenced table
family: doc-ddl-depend
tier: core
feature_ids: [drop-table, foreign-keys, dependency-tracking, drop-restrict]
required_capabilities: [create-table, insert, select, drop-table, foreign-keys, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-depend (a foreign key constraint is itself a dependent object, not a dependent of orders)"
sessions: [a]
setup: |
  CREATE TABLE products (product_no integer PRIMARY KEY, name text);
  CREATE TABLE orders (order_id integer PRIMARY KEY, product_no integer REFERENCES products (product_no), quantity integer);
steps:
  - sql: |
      DROP TABLE orders
    expect: ok
  - sql: |
      DROP TABLE products
    expect: ok
    comment: the FK went with orders, so products has no dependents left
  - sql: |
      SELECT to_regclass('orders') IS NULL AS orders_gone, to_regclass('products') IS NULL AS products_gone
    expect: rows
