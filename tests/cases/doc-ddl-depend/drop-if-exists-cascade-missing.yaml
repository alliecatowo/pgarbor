# IF EXISTS turns a missing object into a notice with success, for both RESTRICT and CASCADE; without it the drop errors.
id: doc-ddl-depend.drop-if-exists-cascade-missing
title: DROP TABLE IF EXISTS on a missing table succeeds with CASCADE or RESTRICT, plain DROP errors
family: doc-ddl-depend
tier: core
feature_ids: [drop-table, drop-if-exists, drop-cascade, drop-restrict]
required_capabilities: [drop-table, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-depend (DROP command options, CASCADE and RESTRICT)"
sessions: [a]
steps:
  - sql: |
      DROP TABLE IF EXISTS nosuch CASCADE
    expect: ok
    comment: emits NOTICE table "nosuch" does not exist, skipping
  - sql: |
      DROP TABLE IF EXISTS nosuch RESTRICT
    expect: ok
  - sql: |
      DROP TABLE nosuch
    expect: error
    sqlstate: "42P01"
