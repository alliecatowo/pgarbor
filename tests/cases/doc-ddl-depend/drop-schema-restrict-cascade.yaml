# DROP SCHEMA refuses a non-empty schema by default (RESTRICT); CASCADE drops the contained table.
id: doc-ddl-depend.drop-schema-restrict-cascade
title: DROP SCHEMA on a non-empty schema is refused by default and succeeds with CASCADE
family: doc-ddl-depend
tier: core
feature_ids: [drop-schema, drop-cascade, drop-restrict, dependency-tracking]
required_capabilities: [create-schema, create-table, insert, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-depend (DROP ... RESTRICT default; CASCADE removes dependent objects)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
  CREATE TABLE s1.x (i integer);
  INSERT INTO s1.x VALUES (7);
steps:
  - sql: |
      DROP SCHEMA s1
    expect: error
    sqlstate: "2BP01"
  - sql: |
      SELECT i FROM s1.x
    expect: rows
  - sql: |
      DROP SCHEMA s1 CASCADE
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's1'
    expect: rows
