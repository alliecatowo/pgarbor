# PARALLEL option: default is UNSAFE, and SAFE and RESTRICTED are recorded in pg_proc.proparallel.
id: cmd-create-aggregate.parallel-default-and-safe
title: "PARALLEL option defaults to UNSAFE and SAFE or RESTRICTED are recorded in proparallel"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, parallel-safety, catalog-introspection]
required_capabilities: [aggregates, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (PARALLEL)"
setup: |
  CREATE AGGREGATE pa_default (int4) (sfunc = int4pl, stype = int4);
  CREATE AGGREGATE pa_safe (int4) (sfunc = int4pl, stype = int4, parallel = safe);
  CREATE AGGREGATE pa_restricted (int4) (sfunc = int4pl, stype = int4, parallel = restricted);
steps:
  - sql: |
      SELECT proname, proparallel FROM pg_proc WHERE proname IN ('pa_default', 'pa_safe', 'pa_restricted') ORDER BY proname
    expect: rows
    order: ordered
