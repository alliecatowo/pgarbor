# INITCOND must be a string constant in the external representation of the state type.
id: cmd-create-aggregate.initcond-invalid-text
title: "INITCOND that is not valid input for the state type fails with invalid_text_representation"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, initcond, errors]
required_capabilities: [aggregates, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (initial_condition)"
steps:
  - sql: |
      CREATE AGGREGATE badinit (int4) (sfunc = int4pl, stype = int4, initcond = 'abc')
    expect: error
    sqlstate: "22P02"
