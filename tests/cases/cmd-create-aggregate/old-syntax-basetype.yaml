# Old-style CREATE AGGREGATE with BASETYPE in the option list instead of the argument list.
id: cmd-create-aggregate.old-syntax-basetype
title: "Old-syntax CREATE AGGREGATE with BASETYPE behaves like the argument-list form"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, old-syntax]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (old syntax, base_type)"
setup: |
  CREATE TABLE t (g int4, x int4);
  INSERT INTO t VALUES (1,1),(1,NULL),(2,5),(2,7);
  CREATE AGGREGATE oldsum (BASETYPE = int4, SFUNC = int4pl, STYPE = int4, INITCOND = '0');
steps:
  - sql: |
      SELECT oldsum(x) FROM t
    expect: rows
    comment: strict transition function skips the NULL input
  - sql: |
      SELECT oldsum(x) FROM t WHERE false
    expect: rows
    comment: empty input yields the initcond 0
