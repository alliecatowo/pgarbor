# Aggregate options may be written in any order, and an argument may carry an IN mode and a name
# that is recorded in pg_proc.proargnames.
id: cmd-create-aggregate.parameters-any-order-argnames
title: "Aggregate options in any order; IN argument mode and argument name recorded in pg_proc"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, argument-names]
required_capabilities: [create-table, insert, select, aggregates, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (argmode, argname, parameters in any order)"
setup: |
  CREATE TABLE t (g int4, x int4);
  INSERT INTO t VALUES (1,1),(1,NULL),(2,5),(2,7);
  CREATE AGGREGATE reord (int4) (INITCOND = '0', STYPE = int4, SFUNC = int4pl);
  CREATE AGGREGATE named_agg (IN x int4) (sfunc = int4pl, stype = int4, initcond = '0');
steps:
  - sql: |
      SELECT reord(x) FROM t
    expect: rows
  - sql: |
      SELECT proargnames FROM pg_proc WHERE proname = 'named_agg'
    expect: rows
    comment: argument name x is kept
