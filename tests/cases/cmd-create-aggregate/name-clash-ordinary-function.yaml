# An aggregate's name and input types must differ from every ordinary function in the same schema.
id: cmd-create-aggregate.name-clash-ordinary-function
title: "Aggregate whose name and argument types match an existing function fails with duplicate_function"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, errors, overloading]
required_capabilities: [create-table, select, aggregates, sql-functions, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (description: identity of aggregates)"
setup: |
  CREATE FUNCTION clashf (int4) RETURNS int4 LANGUAGE sql AS $$ SELECT $1 $$;
steps:
  - sql: |
      CREATE AGGREGATE clashf (int4) (sfunc = int4pl, stype = int4, initcond = '0')
    expect: error
    sqlstate: "42723"
  - sql: |
      SELECT clashf(7)
    expect: rows
    comment: the ordinary function is untouched
