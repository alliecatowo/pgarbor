# The state transition function must exist with the argument signature (state, inputs...).
id: cmd-create-aggregate.sfunc-undefined
title: "CREATE AGGREGATE with a transition function that has no matching signature fails with undefined_function"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, errors]
required_capabilities: [aggregates, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (sfunc)"
steps:
  - sql: |
      CREATE AGGREGATE badsf (int4) (sfunc = textcat, stype = int4)
    expect: error
    sqlstate: "42883"
    comment: textcat(integer, integer) does not exist
