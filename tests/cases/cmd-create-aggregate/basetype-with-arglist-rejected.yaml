# BASETYPE is redundant when the argument list already gives the input type.
id: cmd-create-aggregate.basetype-with-arglist-rejected
title: "BASETYPE together with an argument list is rejected as redundant"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, old-syntax, errors]
required_capabilities: [aggregates, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (base_type)"
steps:
  - sql: |
      CREATE AGGREGATE bothsyn (int4) (BASETYPE = int4, SFUNC = int4pl, STYPE = int4)
    expect: error
    sqlstate: "42P13"
