# FINALFUNC determines the aggregate's result type; a strict final function returns NULL when the
# ending state is NULL (no input rows).
id: cmd-create-aggregate.finalfunc-numeric-result-type
title: "FINALFUNC sets the result type; strict final function returns NULL for empty input"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, finalfunc]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (ffunc, strict final function)"
setup: |
  CREATE TABLE t (g int4, x int4);
  INSERT INTO t VALUES (1,1),(1,NULL),(2,5),(2,7);
  CREATE AGGREGATE fsum (int4) (sfunc = int4pl, stype = int4, finalfunc = numeric);
steps:
  - sql: |
      SELECT fsum(x), pg_typeof(fsum(x))::text FROM t
    expect: rows
    comment: result type is numeric because the final function returns numeric
  - sql: |
      SELECT fsum(x) FROM t WHERE false
    expect: rows
    comment: the strict final function is not called on a NULL state and returns NULL
