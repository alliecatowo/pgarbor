# Aggregate functions do not support OUT arguments.
id: cmd-create-aggregate.out-argument-rejected
title: "CREATE AGGREGATE rejects OUT argument mode with feature_not_supported"
family: cmd-create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, errors]
required_capabilities: [aggregates, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_aggregate.sgml#sql-createaggregate (argmode: OUT not supported)"
steps:
  - sql: |
      CREATE AGGREGATE outagg (OUT x int4) (sfunc = int4pl, stype = int4)
    expect: error
    sqlstate: "0A000"
