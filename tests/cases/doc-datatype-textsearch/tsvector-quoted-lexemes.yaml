# Lexemes containing whitespace, punctuation or quotes are quoted; embedded quotes and backslashes are doubled.
id: doc-datatype-textsearch.tsvector-quoted-lexemes
title: Quoted tsvector lexemes with spaces, doubled quotes and backslashes
family: doc-datatype-textsearch
tier: core
feature_ids: [tsvector, tsvector-input, quoting, lexeme-spaces]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (lexemes containing whitespace or punctuation; Embedded quotes and backslashes must be doubled)"
sessions: [a]
steps:
  - sql: |
      SELECT $$the lexeme ' ' contains spaces$$::tsvector
    expect: rows
    comment: the quoted single space is a lexeme of its own
  - sql: |
      SELECT $$the lexeme 'Joe''s' contains a quote$$::tsvector
    expect: rows
    comment: the doubled quote inside a quoted lexeme is kept as one quote
  - sql: |
      SELECT $$'a\\b' 'c'$$::tsvector
    expect: rows
    comment: a doubled backslash inside a quoted lexeme denotes one backslash
  - sql: |
      SELECT $$'a\\b' 'c'$$::tsvector = $$'a\\b' 'c'$$::tsvector AS same_value
    expect: rows
    comment: equal tsvector literals compare equal
