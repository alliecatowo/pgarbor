# Positions are kept on lexemes, duplicate positions are dropped, and positions above 16383 clamp to 16383.
id: doc-datatype-textsearch.tsvector-positions-clamp-dedup
title: tsvector positions are sorted, deduplicated and clamped to 16383
family: doc-datatype-textsearch
tier: core
feature_ids: [tsvector, tsvector-positions, position-clamp, position-dedup]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (Optionally, integer positions can be attached to lexemes; Position values can range from 1 to 16383)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a:1 fat:2 cat:3 sat:4 on:5 a:6 mat:7 and:8 ate:9 a:10 fat:11 rat:12'::tsvector
    expect: rows
    comment: repeated lexemes merge their position lists
  - sql: |
      SELECT 'a:1 a:1 a:2'::tsvector
    expect: rows
    comment: a duplicate (lexeme, position) pair is discarded
  - sql: |
      SELECT 'a:1 b:16384 c:99999 d:16383'::tsvector
    expect: rows
    comment: positions above 16383 are silently set to 16383; 16383 itself is unchanged
  - sql: |
      SELECT 'x:1 x:16384 x:16383'::tsvector
    expect: rows
    comment: after clamping, the duplicate 16383 position is removed as well
