# to_tsquery normalizes prefix terms too, so postgres:* is stemmed to postgr:* and matches postgraduate.
id: doc-datatype-textsearch.tsquery-stemmed-prefix
title: to_tsquery stems prefix terms before matching postgraduate
family: doc-datatype-textsearch
tier: core
feature_ids: [tsquery, to-tsquery, prefix-match, english-stemming]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (to_tsquery will process prefixes in the same way as other words, postgres gets stemmed to postgr)"
sessions: [a]
steps:
  - sql: |
      SELECT to_tsvector('postgraduate') @@ to_tsquery('postgres:*') AS matches
    expect: rows
    comment: documented example; returns true
  - sql: |
      SELECT to_tsvector('postgraduate') AS vec, to_tsquery('postgres:*') AS q
    expect: rows
    comment: vector is postgradu with position 1; the query is postgr:*
  - sql: |
      SELECT to_tsquery('Fat:ab & Cats')
    expect: rows
    comment: to_tsquery lowercases and stems Cats to cat, keeping the AB weight
  - sql: |
      SELECT to_tsquery('english', 'fat:*') = 'fat:*'::tsquery AS same_as_literal
    expect: rows
