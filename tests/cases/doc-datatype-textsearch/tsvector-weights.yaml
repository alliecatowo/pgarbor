# Weights A, B, C, D attach to positioned lexemes; D is the default and is not printed.
id: doc-datatype-textsearch.tsvector-weights
title: tsvector weight labels A-D, with D elided on output
family: doc-datatype-textsearch
tier: core
feature_ids: [tsvector, tsvector-weights, weight-labels, weight-default]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (Lexemes that have positions can further be labeled with a weight; D is the default and hence is not shown on output)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a:1A fat:2B,4C cat:5D'::tsvector
    expect: rows
    comment: explicit D weight is not shown on output
  - sql: |
      SELECT 'x:3D y:1A'::tsvector
    expect: rows
    comment: a D-weighted lexeme prints with no weight suffix while an A-weighted one keeps A
  - sql: |
      SELECT setweight('fat:1 cat:2'::tsvector, 'B') = 'fat:1B cat:2B'::tsvector AS same_weight
    expect: rows
    comment: setweight relabels every position of the vector with weight B
