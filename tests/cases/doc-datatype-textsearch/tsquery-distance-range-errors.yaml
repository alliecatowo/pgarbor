# Phrase distances must be integers in 0..16384; malformed phrase syntax is a syntax error.
id: doc-datatype-textsearch.tsquery-distance-range-errors
title: Phrase distance out of range and malformed phrase operators raise errors
family: doc-datatype-textsearch
tier: core
feature_ids: [tsquery, phrase-distance, error-handling, followed-by]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (<N> FOLLOWED BY with integer constant N)"
sessions: [a]
steps:
  - sql: |
      SELECT 'fat <16385> rat'::tsquery
    expect: error
    sqlstate: "22023"
    comment: distance above the 16384 maximum is an invalid parameter value
  - sql: |
      SELECT 'fat <16384> rat'::tsquery
    expect: rows
    comment: 16384 is the inclusive maximum distance
  - sql: |
      SELECT 'fat <-> <-> rat'::tsquery
    expect: error
    sqlstate: "42601"
    comment: two phrase operators in a row are a syntax error
  - sql: |
      SELECT 'fat <0> rat'::tsquery
    expect: rows
    comment: 0 is the inclusive minimum distance
