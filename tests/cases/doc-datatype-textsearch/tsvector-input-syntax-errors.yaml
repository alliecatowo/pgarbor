# Malformed tsvector literals fail with syntax error 42601; weights outside A-D and position 0 are rejected.
id: doc-datatype-textsearch.tsvector-input-syntax-errors
title: Malformed tsvector literals raise syntax errors
family: doc-datatype-textsearch
tier: core
feature_ids: [tsvector, tsvector-input, error-handling, weight-labels]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (weights are A, B, C, or D)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a:1E'::tsvector
    expect: error
    sqlstate: "42601"
    comment: E is not a valid weight
  - sql: |
      SELECT 'a:0'::tsvector
    expect: error
    sqlstate: "42601"
    comment: positions start at 1
  - sql: |
      SELECT 'a:-1'::tsvector
    expect: error
    sqlstate: "42601"
    comment: a negative position is not a valid integer position
  - sql: |
      SELECT 'a:1 b:2'::tsvector
    expect: rows
    comment: control case, the same literal shape with valid tokens succeeds
