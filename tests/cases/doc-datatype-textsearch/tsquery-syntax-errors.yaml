# Malformed tsquery literals (dangling operator, bad weight, unbalanced parentheses) raise syntax error 42601.
id: doc-datatype-textsearch.tsquery-syntax-errors
title: Malformed tsquery literals raise syntax errors
family: doc-datatype-textsearch
tier: core
feature_ids: [tsquery, tsquery-input, error-handling, boolean-operators]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (tsquery operators and weight labels)"
sessions: [a]
steps:
  - sql: |
      SELECT 'fat & | rat'::tsquery
    expect: error
    sqlstate: "42601"
    comment: an operator with no operand on its left
  - sql: |
      SELECT 'fat:x'::tsquery
    expect: error
    sqlstate: "42601"
    comment: x is not a weight letter
  - sql: |
      SELECT 'fat & (rat'::tsquery
    expect: error
    sqlstate: "42601"
    comment: unbalanced parenthesis
  - sql: |
      SELECT 'fat :* '::tsquery
    expect: error
    sqlstate: "42601"
    comment: a prefix marker needs a lexeme before it
  - sql: |
      SELECT 'fat & rat'::tsquery
    expect: rows
    comment: control case with a valid expression
