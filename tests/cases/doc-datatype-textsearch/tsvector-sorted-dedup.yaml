# tsvector input sorts lexemes and removes duplicates; raw text is not normalized, to_tsvector is.
id: doc-datatype-textsearch.tsvector-sorted-dedup
title: tsvector input sorts and deduplicates lexemes; raw words are not normalized
family: doc-datatype-textsearch
tier: core
feature_ids: [tsvector, tsvector-input, lexeme-dedup, tsvector-sort, to-tsvector]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (tsvector: sorted list of distinct lexemes; The Fat Rats)"
sessions: [a]
steps:
  - sql: |
      SELECT 'a fat cat sat on a mat and ate a fat rat'::tsvector
    expect: rows
    comment: duplicates a and fat collapse; output is sorted
  - sql: |
      SELECT 'The Fat Rats'::tsvector
    expect: rows
    comment: tsvector does not case-fold or stem its input
  - sql: |
      SELECT to_tsvector('english', 'The Fat Rats')
    expect: rows
    comment: to_tsvector drops the stopword and stems, giving positions 2 and 3
  - sql: |
      SELECT ''::tsvector AS empty_vec, to_tsvector('english', 'the') AS only_stopword
    expect: rows
    comment: empty input is a valid empty tsvector; a stopword-only document yields an empty tsvector
