# tsquery lexemes follow the same quoting rules as tsvector: quoted text, doubled quotes.
id: doc-datatype-textsearch.tsquery-quoted-lexeme
title: Quoted lexemes in tsquery with a doubled embedded quote
family: doc-datatype-textsearch
tier: extended
feature_ids: [tsquery, quoting, lexeme-quotes]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-textsearch (Quoting rules for lexemes are the same as described previously for lexemes in tsvector)"
sessions: [a]
steps:
  - sql: |
      SELECT $$'Joe''s' & rat$$::tsquery
    expect: rows
    comment: the quoted lexeme keeps its embedded quote
  - sql: |
      SELECT $$'the lexeme '' '' contains spaces'$$::tsquery
    expect: rows
    comment: quoted whitespace inside a tsquery lexeme is accepted
