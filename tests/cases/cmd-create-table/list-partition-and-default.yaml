# List partitioning with an expression key, a child CHECK, and a DEFAULT partition catching unlisted values.
id: cmd-create-table.list-partition-and-default
title: List partitions on an expression key route listed values, DEFAULT partition takes the rest, and child CHECK applies
family: cmd-create-table
tier: core
feature_ids: [create-table, partitioning, list-partitioning, default-partition, check-constraint]
required_capabilities: [create-table, insert, select, partitioning, errors]
provenance:
  source: pg-docs
  ref: "ref/create_table.sgml#sql-createtable-examples (Create a list partitioned table; Create partition of a list partitioned table; Create a default partition)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE cities (
          city_id      bigserial not null,
          name         text not null,
          population   bigint
      ) PARTITION BY LIST (left(lower(name), 1))
    expect: ok
  - sql: |
      CREATE TABLE cities_ab
          PARTITION OF cities (
          CONSTRAINT city_id_nonzero CHECK (city_id != 0)
      ) FOR VALUES IN ('a', 'b')
    expect: ok
  - sql: |
      CREATE TABLE cities_partdef PARTITION OF cities DEFAULT
    expect: ok
  - sql: |
      INSERT INTO cities (name, population) VALUES ('Aalborg', 100000), ('Brno', 380000), ('Zurich', 400000)
    expect: ok
  - sql: |
      SELECT name, tableoid::regclass AS part FROM cities ORDER BY name
    expect: rows
    order: ordered
    comment: the lowercased first letter picks the child; z falls to the default partition
  - sql: |
      INSERT INTO cities (city_id, name) VALUES (0, 'Bern')
    expect: error
    sqlstate: "23514"
    comment: the child CHECK city_id_nonzero rejects 0 for a row routed to cities_ab
