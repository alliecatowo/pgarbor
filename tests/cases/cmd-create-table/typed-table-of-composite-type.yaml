# Typed table: CREATE TABLE OF a composite type with a table-level PRIMARY KEY and a per-column DEFAULT via WITH OPTIONS.
id: cmd-create-table.typed-table-of-composite-type
title: Typed table OF a composite type takes its columns from the type and applies WITH OPTIONS DEFAULT
family: cmd-create-table
tier: extended
feature_ids: [create-table, typed-table, composite-type, primary-key, column-default]
required_capabilities: [create-table, create-type, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ref/create_table.sgml#sql-createtable-examples (Create a composite type and a typed table)"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE employee_type AS (name text, salary numeric)
    expect: ok
  - sql: |
      CREATE TABLE employees OF employee_type (
          PRIMARY KEY (name),
          salary WITH OPTIONS DEFAULT 1000
      )
    expect: ok
  - sql: |
      INSERT INTO employees (name) VALUES ('ann'), ('bo')
    expect: ok
  - sql: |
      INSERT INTO employees (name, salary) VALUES ('cy', 2500)
    expect: ok
  - sql: |
      SELECT name, salary FROM employees ORDER BY name
    expect: rows
    order: ordered
    comment: salary comes from the table default when omitted
  - sql: |
      INSERT INTO employees (name) VALUES ('ann')
    expect: error
    sqlstate: "23505"
    comment: name is the primary key of the typed table
