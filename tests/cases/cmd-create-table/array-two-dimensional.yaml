# Two-dimensional array column: declared dimensions are not enforced, so element and dimension behavior comes from the stored value.
id: cmd-create-table.array-two-dimensional
title: int[][] column stores arrays of varying dimensionality and indexes them by position
family: cmd-create-table
tier: core
feature_ids: [create-table, arrays, array-dimensions]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ref/create_table.sgml#sql-createtable-examples (Create a table with a 2-dimensional array)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE array_int (vector int[][])
    expect: ok
  - sql: |
      INSERT INTO array_int VALUES ('{{1,2},{3,4}}'), ('{5,6,7}'), (NULL)
    expect: ok
    comment: the declared number of dimensions is not enforced
  - sql: |
      SELECT vector[2][1] AS elem, array_ndims(vector) AS ndims, array_dims(vector) AS dims FROM array_int ORDER BY array_ndims(vector) NULLS LAST, dims
    expect: rows
    order: ordered
