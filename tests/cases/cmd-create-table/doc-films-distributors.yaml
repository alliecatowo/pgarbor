# Docs example tables: films with a named PRIMARY KEY, distributors with an identity column and a CHECK on name.
id: cmd-create-table.doc-films-distributors
title: Documented films and distributors examples create tables with identity, named PK and CHECK behavior
family: cmd-create-table
tier: core
feature_ids: [create-table, primary-key, identity-columns, check-constraint, interval-type]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ref/create_table.sgml#sql-createtable-examples (films and distributors examples)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE films (
          code        char(5) CONSTRAINT firstkey PRIMARY KEY,
          title       varchar(40) NOT NULL,
          did         integer NOT NULL,
          date_prod   date,
          kind        varchar(10),
          len         interval hour to minute
      )
    expect: ok
  - sql: |
      CREATE TABLE distributors (
          did     integer PRIMARY KEY GENERATED BY DEFAULT AS IDENTITY,
          name    varchar(40) NOT NULL CHECK (name <> '')
      )
    expect: ok
  - sql: |
      INSERT INTO distributors (name) VALUES ('Luso'), ('Pan Films')
    expect: ok
  - sql: |
      SELECT did, name FROM distributors ORDER BY did
    expect: rows
    order: ordered
    comment: identity values start at 1 and increment by 1
  - sql: |
      INSERT INTO distributors (name) VALUES ('')
    expect: error
    sqlstate: "23514"
    comment: the column CHECK (name <> '') rejects the empty string
  - sql: |
      INSERT INTO films VALUES ('ab', 'Title', 1, '2020-01-02', 'drama', '1 hour 30 minutes')
    expect: ok
  - sql: |
      SELECT trim(code) AS code, title, len FROM films ORDER BY code
    expect: rows
    order: ordered
    comment: interval hour to minute keeps only hours and minutes
  - sql: |
      INSERT INTO films VALUES ('ab', 'Dup', 2, NULL, NULL, NULL)
    expect: error
    sqlstate: "23505"
    comment: duplicate value for the named primary key firstkey
  - sql: |
      INSERT INTO films (code, did) VALUES ('cd', 1)
    expect: error
    sqlstate: "23502"
    comment: title is NOT NULL and has no default
