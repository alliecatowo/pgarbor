# CREATE TABLE on an existing name: an error by default, a NOTICE and no change with IF NOT EXISTS.
id: cmd-create-table.if-not-exists-and-duplicate-name
title: Duplicate CREATE TABLE errors, while IF NOT EXISTS issues a notice and keeps the original table
family: cmd-create-table
tier: core
feature_ids: [create-table, if-not-exists, notices, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ref/create_table.sgml#sql-createtable (Parameters: IF NOT EXISTS)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, rating int4)
steps:
  - sql: |
      CREATE TABLE films (id int4)
    expect: error
    sqlstate: "42P07"
    comment: without IF NOT EXISTS an existing relation name is an error
  - sql: |
      CREATE TABLE IF NOT EXISTS films (x text, y text, z text)
    expect: notice
    comment: skipped with a notice; the original definition is kept
  - sql: |
      SELECT column_name FROM information_schema.columns WHERE table_name = 'films' ORDER BY ordinal_position
    expect: rows
    order: ordered
