# EXCLUDE USING gist with the overlap operator: overlapping circles are rejected and disjoint circles are accepted.
id: cmd-create-table.exclusion-constraint-circle
title: EXCLUDE USING gist on circles rejects overlapping rows and accepts disjoint ones
family: cmd-create-table
tier: extended
feature_ids: [create-table, exclusion-constraint, gist, geometry]
required_capabilities: [create-table, insert, select, gist, errors]
provenance:
  source: pg-docs
  ref: "ref/create_table.sgml#sql-createtable-examples (Create table circles with an exclusion constraint)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE circles (
          c circle,
          EXCLUDE USING gist (c WITH &&)
      )
    expect: ok
  - sql: |
      INSERT INTO circles VALUES ('<(0,0),1>')
    expect: ok
  - sql: |
      INSERT INTO circles VALUES ('<(10,10),1>')
    expect: ok
    comment: disjoint circle is accepted
  - sql: |
      INSERT INTO circles VALUES ('<(1,0),1>')
    expect: error
    sqlstate: "23P01"
    comment: overlapping circle violates the exclusion constraint
  - sql: |
      SELECT c FROM circles ORDER BY c::text
    expect: rows
    order: ordered
