# VALUES and ARRAY[] use the same resolution algorithm across all their elements at once.
id: doc-typeconv-union-case.values-array-result-type
title: VALUES rows and ARRAY constructor element types are resolved together
family: doc-typeconv-union-case
tier: core
feature_ids: [values, arrays, type-resolution, errors]
required_capabilities: [select, values, arrays, numeric]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (ARRAY, VALUES determination of result type)"
sessions: [a]
steps:
  - sql: |
      SELECT x, pg_typeof(x) FROM (VALUES (1), (2.5)) s(x) ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT x, pg_typeof(x) FROM (VALUES ('a'), ('b')) s(x) ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT ARRAY[1, 2.5] AS a, pg_typeof(ARRAY[1, 2.5]) AS t
    expect: rows
    order: multiset
  - sql: |
      SELECT ARRAY[1, '2'] AS a, pg_typeof(ARRAY[1, '2']) AS t
    expect: rows
    order: multiset
    comment: the unknown '2' is coerced to integer, so the array is integer[]
  - sql: |
      SELECT ARRAY['a', 1]
    expect: error
    sqlstate: "22P02"
