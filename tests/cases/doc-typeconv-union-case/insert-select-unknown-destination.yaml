# Unknown literals in INSERT ... SELECT take the destination column type; RETURNING lists are
# typed like SELECT output lists (unknown literal becomes text).
id: doc-typeconv-union-case.insert-select-unknown-destination
title: Unknown literals in INSERT ... SELECT take the destination column type
family: doc-typeconv-union-case
tier: core
feature_ids: [insert, returning, type-resolution, select]
required_capabilities: [create-table, insert, returning, select]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (SELECT Output Columns; RETURNING lists)"
sessions: [a]
setup: |
  CREATE TABLE tt (x int4, t text);
steps:
  - sql: |
      INSERT INTO tt SELECT '42', '7'
    expect: ok
  - sql: |
      SELECT x, pg_typeof(x) AS xt, t, pg_typeof(t) AS tt_t FROM tt
    expect: rows
    order: multiset
  - sql: |
      INSERT INTO tt (x) VALUES (9) RETURNING 'lit'
    expect: rows
    order: multiset
    comment: unknown literal in RETURNING resolves to text
