# GREATEST and LEAST use the same resolution algorithm as UNION.
id: doc-typeconv-union-case.greatest-least-result-type
title: GREATEST and LEAST resolve their arguments to a common type
family: doc-typeconv-union-case
tier: core
feature_ids: [greatest, least, type-resolution, null-semantics, numeric]
required_capabilities: [select, numeric, null-values]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (GREATEST and LEAST determination of result type)"
sessions: [a]
steps:
  - sql: |
      SELECT GREATEST(1, 2.5) AS g, pg_typeof(GREATEST(1, 2.5)) AS t
    expect: rows
    order: multiset
  - sql: |
      SELECT LEAST('1', 2) AS l, pg_typeof(LEAST('1', 2)) AS t
    expect: rows
    order: multiset
    comment: the unknown '1' takes integer from the other argument
  - sql: |
      SELECT GREATEST(NULL, NULL) AS g, pg_typeof(GREATEST(NULL, NULL)) AS t
    expect: rows
    order: multiset
    comment: all-unknown arguments resolve to text, the result is NULL
