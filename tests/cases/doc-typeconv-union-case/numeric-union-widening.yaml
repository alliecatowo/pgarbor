# Doc example: 1 is implicitly castable to numeric, so the UNION resolves to numeric in either order.
id: doc-typeconv-union-case.numeric-union-widening
title: Integer and numeric arms of a UNION resolve to numeric
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, numeric]
required_capabilities: [select, union, order-by, numeric]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (Type Resolution in a Simple Union)"
sessions: [a]
steps:
  - sql: |
      SELECT 1.2 AS "numeric" UNION SELECT 1 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 AS "numeric" UNION SELECT 1.2 ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(x) FROM (SELECT 1 UNION SELECT 1.2) s(x) LIMIT 1
    expect: rows
    order: multiset
