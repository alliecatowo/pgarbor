# Unknown inputs are ignored for resolution, then coerced to the candidate type, which can fail at
# coercion time with invalid_text_representation rather than a category mismatch.
id: doc-typeconv-union-case.unknown-literal-coercion-error
title: Unknown literal that cannot be coerced to the candidate type fails with 22P02
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, unknown-literal, errors]
required_capabilities: [select, union, order-by, numeric]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (unknown inputs are ignored; convert all inputs to the final candidate type)"
sessions: [a]
steps:
  - sql: |
      SELECT '1.5' UNION SELECT 2
    expect: error
    sqlstate: "22P02"
    comment: integer is the candidate, '1.5' cannot be read as integer
  - sql: |
      SELECT 1 UNION SELECT 'a'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 1 UNION SELECT 2 UNION SELECT 'x'
    expect: error
    sqlstate: "22P02"
    comment: pairwise nesting, same coercion failure in the second UNION
  - sql: |
      SELECT 1.5 UNION SELECT '2' ORDER BY 1
    expect: rows
    order: ordered
    comment: numeric is the candidate, so '2' coerces cleanly
