# Doc example: UNION is pairwise, left to right. The inner UNION of two NULLs resolves to text,
# so adding an integer arm fails. Starting the chain with a typed arm avoids it.
id: doc-typeconv-union-case.nested-union-null-error
title: Nested UNION of untyped NULLs fails; typed leftmost arm succeeds
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, errors, null-semantics]
required_capabilities: [select, union, null-values]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (Type Resolution in a Nested Union)"
sessions: [a]
steps:
  - sql: |
      SELECT NULL UNION SELECT NULL UNION SELECT 1
    expect: error
    sqlstate: "42804"
    comment: UNION types text and integer cannot be matched
  - sql: |
      (SELECT NULL UNION SELECT NULL) UNION SELECT 1
    expect: error
    sqlstate: "42804"
    comment: parenthesized form is the same pairwise nesting
  - sql: |
      SELECT 1 UNION SELECT NULL UNION SELECT NULL ORDER BY 1
    expect: rows
    order: ordered
    comment: documented fix, leftmost arm has the desired type
  - sql: |
      SELECT NULL UNION SELECT 1 ORDER BY 1
    expect: rows
    order: ordered
    comment: a single untyped NULL arm is ignored for resolution
