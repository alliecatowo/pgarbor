# Doc example: real is the candidate type when the integer arm comes first, because integer
# converts implicitly to real but real does not convert back to integer.
id: doc-typeconv-union-case.real-transposed-union
title: Integer and real arms of a UNION resolve to real
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, float]
required_capabilities: [select, union, order-by, float4]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (Type Resolution in a Transposed Union)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS "real" UNION SELECT CAST('2.2' AS REAL) ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(x) FROM (SELECT 1 UNION SELECT CAST('2.2' AS REAL)) s(x) LIMIT 1
    expect: rows
    order: multiset
