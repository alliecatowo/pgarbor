# If every input of a UNION is unknown (or NULL), the result type is text.
id: doc-typeconv-union-case.unknown-only-union-text
title: UNION of only unknown literals or NULLs resolves to text
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, null-semantics]
required_capabilities: [select, union, null-values]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (type resolution rule: all inputs unknown resolve as text)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_typeof(x), x FROM (SELECT NULL UNION SELECT NULL) s(x)
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_typeof(x), x FROM (SELECT NULL UNION ALL SELECT NULL) s(x)
    expect: rows
    order: multiset
    comment: UNION ALL keeps both NULL rows
  - sql: |
      SELECT pg_typeof(x), x FROM (SELECT 'a' UNION SELECT 'b') s(x) ORDER BY 2
    expect: rows
    order: ordered
