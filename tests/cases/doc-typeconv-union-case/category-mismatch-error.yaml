# Non-unknown inputs in different type categories cannot be matched.
id: doc-typeconv-union-case.category-mismatch-error
title: UNION arms in different type categories raise datatype mismatch
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, errors]
required_capabilities: [select, union, boolean, text]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (If the non-unknown inputs are not all of the same type category, fail)"
sessions: [a]
steps:
  - sql: |
      SELECT 1 UNION SELECT true
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT true UNION SELECT 1
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT 1 UNION SELECT 'a'::text
    expect: error
    sqlstate: "42804"
    comment: an explicitly typed text literal is not unknown, so it does not get coerced
  - sql: |
      SELECT 1 UNION SELECT 'a'::varchar
    expect: error
    sqlstate: "42804"
