# INTERSECT and EXCEPT resolve dissimilar input types the same way UNION does.
id: doc-typeconv-union-case.intersect-except-result-type
title: INTERSECT and EXCEPT resolve dissimilar arm types like UNION
family: doc-typeconv-union-case
tier: core
feature_ids: [intersect, except, type-resolution, numeric, errors]
required_capabilities: [select, intersect, except, numeric]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (INTERSECT and EXCEPT resolve dissimilar types in the same way as UNION)"
sessions: [a]
steps:
  - sql: |
      SELECT x, pg_typeof(x) AS t FROM (SELECT 1 AS x INTERSECT SELECT 1.0) s(x)
    expect: rows
    order: multiset
  - sql: |
      SELECT x, pg_typeof(x) AS t FROM (SELECT 2 AS x EXCEPT SELECT 1.5) s(x) ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT 1 EXCEPT SELECT 'x'
    expect: error
    sqlstate: "22P02"
