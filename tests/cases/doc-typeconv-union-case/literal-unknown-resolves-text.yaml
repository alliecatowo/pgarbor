# Doc examples: an unknown-type literal in a UNION is resolved to text from the other arm;
# a SELECT output column of an unknown literal falls back to text.
id: doc-typeconv-union-case.literal-unknown-resolves-text
title: Unknown-type literal in UNION takes the other arm's text type
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, unknown-literal]
required_capabilities: [select, union]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (Type Resolution with Underspecified Types in a Union; SELECT Output Columns)"
sessions: [a]
steps:
  - sql: |
      SELECT text 'a' AS "text" UNION SELECT 'b'
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_typeof(x) FROM (SELECT text 'a' UNION SELECT 'b') s(x) LIMIT 1
    expect: rows
    order: multiset
  - sql: |
      SELECT pg_typeof(x), x FROM (SELECT 'Hello World') s(x)
    expect: rows
    order: multiset
    comment: a bare unknown literal in a SELECT output list resolves to text
