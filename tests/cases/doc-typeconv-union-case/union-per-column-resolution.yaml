# Type resolution is applied separately to each output column of a UNION.
id: doc-typeconv-union-case.union-per-column-resolution
title: Each UNION output column is resolved independently
family: doc-typeconv-union-case
tier: core
feature_ids: [union, type-resolution, numeric, text, order-by]
required_capabilities: [select, union, order-by, numeric, text]
provenance:
  source: pg-docs
  ref: "typeconv.sgml#typeconv-union-case (resolution applied separately to each output column)"
sessions: [a]
steps:
  - sql: |
      SELECT 1, 'a' UNION SELECT 2.5, 'b' ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(a) AS at, pg_typeof(b) AS bt FROM (SELECT 1 AS a, 'a' AS b UNION SELECT 2.5, 'b') s(a, b) LIMIT 1
    expect: rows
    order: multiset
