# SHARE UPDATE EXCLUSIVE (taken by ANALYZE and VACUUM) conflicts only with itself and stronger modes, not ROW EXCLUSIVE.
id: doc-explicit-locking.share-update-exclusive-blocks-analyze
title: SHARE UPDATE EXCLUSIVE lets INSERT through but blocks a concurrent ANALYZE
family: doc-explicit-locking
tier: core
feature_ids: [lock-table, lock-modes, analyze, transactions, multi-session, insert]
required_capabilities: [create-table, insert, analyze, lock-table, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#locking-tables (SHARE UPDATE EXCLUSIVE acquired by ANALYZE; conflict list)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO t VALUES (1, 10);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t IN SHARE UPDATE EXCLUSIVE MODE
    expect: ok
  - session: b
    sql: |
      INSERT INTO t VALUES (2, 20)
    expect: ok
    comment: ROW EXCLUSIVE does not conflict with SHARE UPDATE EXCLUSIVE
  - session: b
    sql: |
      ANALYZE t
    async: true
    expect_blocked: true
    comment: ANALYZE acquires SHARE UPDATE EXCLUSIVE, which self-conflicts
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: ok
