# Row-level locks do not affect ordinary reads: a plain SELECT returns the row immediately.
id: doc-explicit-locking.for-update-does-not-block-plain-select
title: Plain SELECT reads a row that another transaction holds FOR UPDATE
family: doc-explicit-locking
tier: core
feature_ids: [select-for-update, row-locks, transactions, multi-session, select]
required_capabilities: [create-table, insert, select, row-locks, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#locking-rows (row-level locks do not affect data querying)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO t VALUES (1, 10);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      SELECT id, v FROM t WHERE id = 1 FOR UPDATE
    expect: rows
  - session: b
    sql: |
      SELECT id, v FROM t WHERE id = 1
    expect: rows
    comment: a plain read does not wait for the row lock
  - session: a
    sql: |
      COMMIT
    expect: ok
