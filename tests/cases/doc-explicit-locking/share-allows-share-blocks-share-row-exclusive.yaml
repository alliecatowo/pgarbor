# SHARE is self-compatible, but SHARE ROW EXCLUSIVE conflicts with SHARE.
id: doc-explicit-locking.share-allows-share-blocks-share-row-exclusive
title: Two SHARE table locks coexist while SHARE ROW EXCLUSIVE waits for them
family: doc-explicit-locking
tier: core
feature_ids: [lock-table, lock-modes, transactions, multi-session]
required_capabilities: [create-table, insert, lock-table, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#locking-tables (SHARE and SHARE ROW EXCLUSIVE lock modes; conflict table)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO t VALUES (1, 10);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t IN SHARE MODE
    expect: ok
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t IN SHARE MODE
    expect: ok
    comment: SHARE is not self-conflicting
  - session: b
    sql: |
      LOCK TABLE t IN SHARE ROW EXCLUSIVE MODE
    async: true
    expect_blocked: true
    comment: a's SHARE lock conflicts with SHARE ROW EXCLUSIVE
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: ok
  - session: b
    sql: |
      COMMIT
    expect: ok
