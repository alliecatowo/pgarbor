# SHARE ROW EXCLUSIVE is self-exclusive: only one session may hold it at a time.
id: doc-explicit-locking.share-row-exclusive-self-exclusive
title: SHARE ROW EXCLUSIVE table lock cannot be held by two sessions at once
family: doc-explicit-locking
tier: core
feature_ids: [lock-table, lock-modes, transactions, multi-session]
required_capabilities: [create-table, insert, lock-table, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#locking-tables (SHARE ROW EXCLUSIVE is self-exclusive)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO t VALUES (1, 10);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t IN SHARE ROW EXCLUSIVE MODE
    expect: ok
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t IN SHARE ROW EXCLUSIVE MODE
    async: true
    expect_blocked: true
    comment: self-exclusive mode
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: ok
  - session: b
    sql: |
      COMMIT
    expect: ok
