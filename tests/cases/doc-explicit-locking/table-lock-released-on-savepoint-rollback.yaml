# A table lock acquired after a savepoint is released when the savepoint is rolled back to.
id: doc-explicit-locking.table-lock-released-on-savepoint-rollback
title: Table lock taken after a savepoint is released by ROLLBACK TO SAVEPOINT
family: doc-explicit-locking
tier: core
feature_ids: [lock-table, savepoints, transactions, multi-session, insert]
required_capabilities: [create-table, insert, lock-table, savepoints, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/mvcc.sgml#locking-tables (locks acquired after a savepoint are released on rollback to it)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4 NOT NULL);
  INSERT INTO t VALUES (1, 10);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      SAVEPOINT s
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t IN EXCLUSIVE MODE
    expect: ok
  - session: a
    sql: |
      ROLLBACK TO SAVEPOINT s
    expect: ok
  - session: b
    sql: |
      INSERT INTO t VALUES (2, 20)
    expect: ok
    comment: EXCLUSIVE was released, so the insert does not wait
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    sql: |
      SELECT id, v FROM t ORDER BY id
    expect: rows
    order: ordered
