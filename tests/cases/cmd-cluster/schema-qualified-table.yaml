# The table name in CLUSTER may be schema-qualified.
id: cmd-cluster.schema-qualified-table
title: CLUSTER accepts a schema-qualified table name and index name
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-using, schemas]
required_capabilities: [create-table, create-index, create-schema, insert, select]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Parameters: table_name, The name (possibly schema-qualified) of a table)"
sessions: [a]
setup: |
  CREATE SCHEMA s1;
  CREATE TABLE s1.t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX s1_t_v ON s1.t (v);
  INSERT INTO s1.t VALUES (1, 3), (2, 1), (3, 2);
steps:
  - sql: |
      CLUSTER s1.t USING s1_t_v
    expect: ok
  - sql: |
      SELECT id FROM s1.t ORDER BY ctid
    expect: rows
    order: ordered
    comment: physical order is by v, so ids 2, 3, 1
