# CLUSTER requires MAINTAIN on the table; the check needs a second role, which is cluster-global state.
id: cmd-cluster.privilege-maintain
title: CLUSTER by a role without MAINTAIN on the table is refused
family: cmd-cluster
tier: extended
feature_ids: [cluster, privileges, maintain]
required_capabilities: [create-table, create-index, create-role, privileges]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Notes: To cluster a table, one must have the MAINTAIN privilege on the table)"
quarantine:
  reason: "needs CREATE ROLE and SET ROLE; roles are cluster-global, so this cannot be isolated to one scratch database"
  since: "2026-10-15"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX t_v ON t (v);
steps:
  - sql: |
      CLUSTER t USING t_v
    expect: ok
