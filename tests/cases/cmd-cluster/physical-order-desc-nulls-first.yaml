# A DESC NULLS FIRST index drives the physical order when CLUSTER uses it.
id: cmd-cluster.physical-order-desc-nulls-first
title: CLUSTER follows a DESC NULLS FIRST index for physical row order
family: cmd-cluster
tier: extended
feature_ids: [cluster, cluster-using, indexes, nulls-ordering, index-ordering]
required_capabilities: [create-table, create-index, insert, select]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Description: physically reordered based on the index information)"
sessions: [a]
setup: |
  CREATE TABLE q (id int4 PRIMARY KEY, v int4);
  CREATE INDEX q_v ON q (v DESC NULLS FIRST);
  INSERT INTO q VALUES (3, 30), (1, NULL), (2, 10), (5, 20);
steps:
  - sql: |
      CLUSTER q USING q_v
    expect: ok
  - sql: |
      SELECT id FROM q ORDER BY ctid
    expect: rows
    order: ordered
    comment: the NULL-keyed row comes first, then 30, 20, 10
