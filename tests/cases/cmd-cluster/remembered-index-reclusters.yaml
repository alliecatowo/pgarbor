# CLUSTER without a table index reuses the previously chosen index; new rows are placed by it on the next run.
id: cmd-cluster.remembered-index-reclusters
title: Plain CLUSTER reclusters using the index remembered from an earlier CLUSTER
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-remembered-index, indexes]
required_capabilities: [create-table, create-index, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Description: The form CLUSTER table_name reclusters the table using the same index as before)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4, name text);
  CREATE INDEX t_v ON t (v);
  INSERT INTO t VALUES (1, 30, 'c'), (2, 10, 'a'), (3, 20, 'b');
steps:
  - sql: |
      CLUSTER t USING t_v
    expect: ok
  - sql: |
      INSERT INTO t VALUES (4, 5, 'd')
    expect: ok
  - sql: |
      CLUSTER t
    expect: ok
    comment: no index named, so t_v is reused
  - sql: |
      SELECT id FROM t ORDER BY ctid
    expect: rows
    order: ordered
    comment: rows are in v order 5, 10, 20, 30
  - sql: |
      SELECT i.indexrelid::regclass::text AS idx, i.indisclustered AS clustered
      FROM pg_index i
      WHERE i.indrelid = 't'::regclass
      ORDER BY 1
    expect: rows
    order: ordered
