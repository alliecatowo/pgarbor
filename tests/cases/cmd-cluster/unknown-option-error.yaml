# An option name that CLUSTER does not recognize is rejected before any work is done.
id: cmd-cluster.unknown-option-error
title: CLUSTER rejects an unrecognized option name
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-options, errors]
required_capabilities: [create-table, select, errors]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Synopsis: option can be one of VERBOSE)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      CLUSTER (BOGUS) t
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
