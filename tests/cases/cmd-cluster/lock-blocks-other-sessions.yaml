# CLUSTER holds ACCESS EXCLUSIVE on the table until the transaction ends, so another session's read waits.
id: cmd-cluster.lock-blocks-other-sessions
title: CLUSTER blocks concurrent reads of the table until its transaction commits
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-using, locking, transactions, multi-session]
required_capabilities: [create-table, create-index, insert, select, transactions, multi-session, lock-table]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Description: an ACCESS EXCLUSIVE lock is acquired on the table, preventing reads and writes until CLUSTER is finished)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX t_v ON t (v);
  INSERT INTO t VALUES (1, 30), (2, 10), (3, 20);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      CLUSTER t USING t_v
    expect: ok
    compare_message: false
  - session: b
    sql: |
      SELECT count(*) AS n FROM t
    async: true
    expect_blocked: true
    comment: the read waits behind the ACCESS EXCLUSIVE lock
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    wait: true
    expect: rows
    comment: after commit the read proceeds and sees all three rows
