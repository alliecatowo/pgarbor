# VERBOSE accepts the documented boolean spellings in the parenthesized option list.
id: cmd-cluster.options-boolean-forms
title: CLUSTER VERBOSE option accepts TRUE, FALSE, ON, OFF, 1 and 0 and no value
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-options, cluster-verbose]
required_capabilities: [create-table, create-index, insert, select]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Parameters: VERBOSE; boolean)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX t_v ON t (v);
  INSERT INTO t VALUES (1, 30), (2, 10);
steps:
  - sql: |
      CLUSTER (VERBOSE) t USING t_v
    expect: ok
    compare_message: false
    comment: VERBOSE with no value means TRUE; INFO progress text contains timings, so messages are not compared
  - sql: |
      CLUSTER (VERBOSE FALSE) t
    expect: ok
    compare_message: false
  - sql: |
      CLUSTER (VERBOSE ON) t
    expect: ok
    compare_message: false
  - sql: |
      CLUSTER (VERBOSE OFF) t
    expect: ok
    compare_message: false
  - sql: |
      CLUSTER (VERBOSE 1) t
    expect: ok
    compare_message: false
  - sql: |
      CLUSTER (VERBOSE 0) t
    expect: ok
    compare_message: false
  - sql: |
      SELECT id FROM t ORDER BY ctid
    expect: rows
    order: ordered
    comment: VERBOSE does not change the result; clustering on t_v gives 2, 1
