# Bare CLUSTER cannot run inside a transaction block, but the transaction can be rolled back cleanly.
id: cmd-cluster.noarg-in-transaction-error
title: Bare CLUSTER inside a transaction block is rejected
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-all, transactions, errors]
required_capabilities: [create-table, create-index, insert, select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Description: This form of CLUSTER cannot be executed inside a transaction block)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX t_v ON t (v);
  INSERT INTO t VALUES (1, 2);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      CLUSTER
    expect: error
    sqlstate: "25001"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
