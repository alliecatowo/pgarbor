# The pre-17 and pre-8.3 CLUSTER spellings are still accepted and have the same effect.
id: cmd-cluster.compat-old-syntax
title: Legacy CLUSTER VERBOSE table USING index and CLUSTER index ON table forms still work
family: cmd-cluster
tier: extended
feature_ids: [cluster, cluster-using, cluster-verbose, compatibility]
required_capabilities: [create-table, create-index, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Compatibility: syntax used before PostgreSQL 17 and before 8.3)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX t_v ON t (v);
  INSERT INTO t VALUES (1, 30), (2, 10), (3, 20);
steps:
  - sql: |
      CLUSTER VERBOSE t USING t_v
    expect: ok
    compare_message: false
  - sql: |
      CLUSTER t_v ON t
    expect: ok
    comment: pre-8.3 form, index name first
  - sql: |
      SELECT i.indexrelid::regclass::text AS idx
      FROM pg_index i
      WHERE i.indrelid = 't'::regclass AND i.indisclustered
    expect: rows
    comment: t_v is the clustered index
  - sql: |
      SELECT id FROM t ORDER BY ctid
    expect: rows
    order: ordered
