# Default ASC index ordering puts NULL keys last, and CLUSTER writes rows in index order.
id: cmd-cluster.physical-order-nulls-last
title: CLUSTER on an ascending index writes rows in key order with NULL keys last
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-using, indexes, nulls-ordering]
required_capabilities: [create-table, create-index, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Description: physically reordered based on the index information)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX t_v ON t (v);
  INSERT INTO t VALUES (3, 30), (1, NULL), (2, 10), (5, 20);
steps:
  - sql: |
      CLUSTER t USING t_v
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY ctid
    expect: rows
    order: ordered
    comment: physical order follows the index; rows with NULL v come last
