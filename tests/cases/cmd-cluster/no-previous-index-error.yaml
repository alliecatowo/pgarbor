# A table that has never been clustered and names no index cannot be clustered.
id: cmd-cluster.no-previous-index-error
title: CLUSTER without an index on a never-clustered table is an error
family: cmd-cluster
tier: core
feature_ids: [cluster, cluster-remembered-index, errors]
required_capabilities: [create-table, create-index, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ref/cluster.sgml#sql-cluster (Description: the form CLUSTER table_name reclusters the table using the same index as before)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE INDEX t_v ON t (v);
  INSERT INTO t VALUES (1, 2);
steps:
  - sql: |
      CLUSTER t
    expect: error
    sqlstate: "42704"
    comment: there is no previously clustered index for table t
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    comment: the table is unchanged and still usable
