# ON DELETE SET NULL and ON UPDATE SET NULL over a two-column MATCH FULL key null all referencing columns.
id: foreign-key.set-null-multicolumn-match-full
title: "SET NULL actions null every referencing column of a multi-column key"
family: foreign-key
tier: core
feature_ids: [foreign-keys, update, delete, select, create-table, constraints, nulls]
required_capabilities: [create-table, insert, select, update, delete, foreign-keys, constraints]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/foreign_key.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE pk (p1 int4, p2 int4, p3 text, PRIMARY KEY (p1, p2));
  CREATE TABLE fk (id int4 PRIMARY KEY, f1 int4, f2 int4, f3 int4,
                   CONSTRAINT fk_set_null FOREIGN KEY (f1, f2) REFERENCES pk MATCH FULL
                   ON DELETE SET NULL ON UPDATE SET NULL);
  INSERT INTO pk VALUES (1, 2, 't1'), (1, 3, 't1-2'), (2, 4, 't2');
  INSERT INTO fk VALUES (1, 1, 2, 4), (2, 1, 3, 5), (3, NULL, NULL, 0), (4, 2, 4, 8);
steps:
  - sql: |
      DELETE FROM pk WHERE p1 = 1 AND p2 = 2
    expect: ok
  - sql: |
      SELECT id, f1, f2, f3 FROM fk ORDER BY id
    expect: rows
    order: ordered
    comment: row 1 keys are nulled, row 2 untouched
  - sql: |
      UPDATE pk SET p1 = 5 WHERE p1 = 2 AND p2 = 4
    expect: ok
  - sql: |
      SELECT id, f1, f2, f3 FROM fk ORDER BY id
    expect: rows
    order: ordered
    comment: both key columns of row 4 are nulled, f3 is not touched
