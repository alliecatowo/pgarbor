# Default NO ACTION: deleting or re-keying a referenced parent row fails; non-key updates pass.
id: foreign-key.restrict-delete-referenced-row
title: "Deleting or re-keying a referenced parent row fails under NO ACTION"
family: foreign-key
tier: core
feature_ids: [foreign-keys, delete, update, select, create-table, constraints]
required_capabilities: [create-table, insert, select, update, delete, foreign-keys, constraints]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/foreign_key.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE pk (id int4 PRIMARY KEY, v text);
  CREATE TABLE fk (id int4 PRIMARY KEY, pid int4 REFERENCES pk (id));
  INSERT INTO pk VALUES (1, 'a'), (2, 'b'), (5, 'e');
  INSERT INTO fk VALUES (1, 1), (2, 2);
steps:
  - sql: |
      DELETE FROM pk WHERE id = 1
    expect: error
    sqlstate: "23503"
  - sql: |
      DELETE FROM pk WHERE id = 5
    expect: ok
    comment: unreferenced row may be deleted
  - sql: |
      UPDATE pk SET id = 10 WHERE id = 2
    expect: error
    sqlstate: "23503"
  - sql: |
      UPDATE pk SET v = 'bb' WHERE id = 2
    expect: ok
    comment: non-key column update does not trigger the check
  - sql: |
      SELECT id, v FROM pk ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, pid FROM fk ORDER BY id
    expect: rows
    order: ordered
