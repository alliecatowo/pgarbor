# MATCH SIMPLE (the default): a multi-column FK with any NULL column is not checked.
id: foreign-key.match-simple-partial-null
title: "MATCH SIMPLE skips the referential check when any FK column is NULL"
family: foreign-key
tier: core
feature_ids: [foreign-keys, insert, select, create-table, constraints]
required_capabilities: [create-table, insert, select, foreign-keys, constraints]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/foreign_key.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE pk (a int4, b int4, c text, PRIMARY KEY (a, b));
  CREATE TABLE fk (id int4, a int4, b int4, CONSTRAINT fk_ab FOREIGN KEY (a, b) REFERENCES pk);
  INSERT INTO pk VALUES (1, 2, 'x');
steps:
  - sql: |
      INSERT INTO fk VALUES (1, 1, NULL), (2, NULL, 9), (3, NULL, NULL), (4, 1, 2)
    expect: ok
  - sql: |
      INSERT INTO fk VALUES (5, 1, 3)
    expect: error
    sqlstate: "23503"
    comment: fully non-NULL key with no matching parent row
  - sql: |
      SELECT id, a, b FROM fk ORDER BY id
    expect: rows
    order: ordered
