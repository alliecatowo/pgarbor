# A foreign key must reference a primary key or unique constraint; otherwise creation fails with 42830.
id: foreign-key.referenced-columns-not-unique-error
title: "CREATE TABLE rejects a foreign key to non-unique or keyless columns"
family: foreign-key
tier: extended
feature_ids: [foreign-keys, create-table, constraints, errors]
required_capabilities: [create-table, foreign-keys, constraints, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/foreign_key.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE pk (id int4, v text);
steps:
  - sql: |
      CREATE TABLE fk1 (id int4 PRIMARY KEY, pid int4 REFERENCES pk (id))
    expect: error
    sqlstate: "42830"
    comment: id in pk has no unique constraint
  - sql: |
      CREATE TABLE fk2 (id int4 PRIMARY KEY, pid int4 REFERENCES pk)
    expect: error
    sqlstate: "42704"
    comment: pk has no primary key
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname IN ('fk1', 'fk2')
    expect: rows
    comment: failed statements leave no table behind
