# Documented workaround: an expression index that also INCLUDEs the underlying column. The results must match the plain expression semantics.
id: doc-indexes-index-only-scans.expression-index-include-workaround
title: Expression index on lower(x) with INCLUDE (x) answers expression predicates with correct results
family: doc-indexes-index-only-scans
tier: extended
feature_ids: [covering-index, expression-index, include-columns]
required_capabilities: [create-table, create-index, expression-index, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-index-only-scans (CREATE INDEX tab_f_x ON tab (f(x)) INCLUDE (x))"
sessions: [a]
setup: |
  CREATE TABLE tab (x text, y int);
  CREATE INDEX tab_f_x ON tab (lower(x)) INCLUDE (x);
  INSERT INTO tab VALUES ('Apple', 1), ('bob', 2), ('CARROT', 3), ('Dog', 4);
steps:
  - sql: |
      SELECT pg_get_indexdef('tab_f_x'::regclass)
    expect: rows
    order: ordered
  - sql: |
      SELECT lower(x) AS f FROM tab WHERE lower(x) < 'c' ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT x FROM tab WHERE lower(x) = 'dog'
    expect: rows
    order: ordered
