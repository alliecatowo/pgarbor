# Documented: only B-tree, GiST and SP-GiST indexes currently support included columns. GIN and hash do not.
id: doc-indexes-index-only-scans.include-rejected-access-methods
title: INCLUDE is rejected for hash and GIN indexes and leaves no index behind
family: doc-indexes-index-only-scans
tier: core
feature_ids: [covering-index, include-columns, hash-index, gin-index]
required_capabilities: [create-table, create-index, hash-index, gin-index, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-index-only-scans (only B-tree, GiST and SP-GiST indexes currently support included columns; GIN indexes cannot support index-only scans)"
sessions: [a]
setup: |
  CREATE TABLE tab (x text, y text);
steps:
  - sql: |
      CREATE INDEX tab_hash ON tab USING hash (x) INCLUDE (y)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE INDEX tab_gin ON tab USING gin (x) INCLUDE (y)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'tab' ORDER BY 1
    expect: rows
    order: ordered
