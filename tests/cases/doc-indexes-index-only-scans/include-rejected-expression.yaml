# Documented: expressions are not currently supported as included columns.
id: doc-indexes-index-only-scans.include-rejected-expression
title: An expression in INCLUDE is rejected and no index is left behind
family: doc-indexes-index-only-scans
tier: core
feature_ids: [covering-index, include-columns, expression-index]
required_capabilities: [create-table, create-index, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-index-only-scans (Other restrictions are that expressions are not currently supported as included columns)"
sessions: [a]
setup: |
  CREATE TABLE tab (x text, y text);
steps:
  - sql: |
      CREATE INDEX tab_bad ON tab (x) INCLUDE (lower(y))
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) AS n FROM pg_class WHERE relname = 'tab_bad'
    expect: rows
    order: ordered
