# A payload column must exist in the table; the error is the usual undefined-column error.
id: doc-indexes-index-only-scans.include-unknown-column
title: INCLUDE naming a missing column fails with undefined_column
family: doc-indexes-index-only-scans
tier: core
feature_ids: [covering-index, include-columns]
required_capabilities: [create-table, create-index, select, errors]
provenance:
  source: pg-docs
  ref: "indices.sgml#indexes-index-only-scans (INCLUDE clause lists the extra columns)"
sessions: [a]
setup: |
  CREATE TABLE tab (x text, y text);
steps:
  - sql: |
      CREATE INDEX tab_bad ON tab (x) INCLUDE (nosuch)
    expect: error
    sqlstate: "42703"
  - sql: |
      CREATE INDEX tab_x_y ON tab (x) INCLUDE (y)
    expect: ok
