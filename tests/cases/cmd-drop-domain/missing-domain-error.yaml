# Without IF EXISTS, dropping a missing domain is an error; the session stays usable.
id: cmd-drop-domain.missing-domain-error
title: DROP DOMAIN of a missing domain raises undefined_object, qualified or not
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, errors]
required_capabilities: [drop-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (IF EXISTS)"
sessions: [a]
steps:
  - sql: |
      DROP DOMAIN no_such_domain
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP DOMAIN public.no_such_domain
    expect: error
    sqlstate: "42704"
    comment: schema-qualified name in an existing schema
  - sql: |
      DROP DOMAIN no_such_domain CASCADE
    expect: error
    sqlstate: "42704"
    comment: CASCADE does not turn a missing name into a no-op
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    order: ordered
