# Unqualified names resolve through search_path; a domain in another schema needs its qualified name.
id: cmd-drop-domain.schema-qualified
title: DROP DOMAIN resolves names through search_path and accepts schema-qualified names
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, schemas, search-path]
required_capabilities: [create-schema, create-domain, drop-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (name: optionally schema-qualified)"
sessions: [a]
setup: |
  CREATE SCHEMA dd_s1;
  CREATE DOMAIN dd_s1.sd AS int4;
steps:
  - sql: |
      DROP DOMAIN sd
    expect: error
    sqlstate: "42704"
    comment: the unqualified name is looked up on search_path, which does not include dd_s1
  - sql: |
      SELECT to_regtype('dd_s1.sd') IS NOT NULL AS present
    expect: rows
    order: ordered
  - sql: |
      DROP DOMAIN dd_s1.sd
    expect: ok
  - sql: |
      SELECT to_regtype('dd_s1.sd') IS NULL AS gone
    expect: rows
    order: ordered
  - sql: |
      DROP DOMAIN IF EXISTS dd_s1.sd
    expect: notice
    comment: schema exists, type does not
  - sql: |
      DROP SCHEMA dd_s1
    expect: ok
