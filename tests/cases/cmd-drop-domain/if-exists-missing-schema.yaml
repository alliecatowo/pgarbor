# IF EXISTS also covers a missing schema qualifier, but a plain missing schema without IF EXISTS is an error.
id: cmd-drop-domain.if-exists-missing-schema
title: DROP DOMAIN IF EXISTS with a missing schema notices; without it, invalid_schema_name
family: cmd-drop-domain
tier: extended
feature_ids: [drop-domain, drop-if-exists, namespaces]
required_capabilities: [drop-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (IF EXISTS, name)"
sessions: [a]
steps:
  - sql: |
      DROP DOMAIN IF EXISTS no_schema.no_domain
    expect: notice
    comment: the schema does not exist, so the notice covers it
  - sql: |
      DROP DOMAIN no_schema.no_domain
    expect: error
    sqlstate: "3F000"
    comment: without IF EXISTS the missing schema is an error
