# IF EXISTS on a missing domain succeeds and issues a notice instead of an error.
id: cmd-drop-domain.if-exists-missing-notice
title: DROP DOMAIN IF EXISTS on a missing domain issues a notice and succeeds
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, drop-if-exists]
required_capabilities: [drop-domain, create-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (IF EXISTS)"
sessions: [a]
steps:
  - sql: |
      DROP DOMAIN IF EXISTS no_such_domain
    expect: notice
    comment: a notice is issued and the command succeeds
  - sql: |
      CREATE DOMAIN no_such_domain AS int4
    expect: ok
    comment: the failed-to-find drop did not block creating the name
  - sql: |
      SELECT to_regtype('no_such_domain') IS NOT NULL AS present
    expect: rows
    order: ordered
