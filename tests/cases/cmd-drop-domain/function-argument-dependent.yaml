# A function whose parameter uses the domain depends on it; CASCADE drops the function.
id: cmd-drop-domain.function-argument-dependent
title: A function taking the domain as a parameter blocks RESTRICT and is dropped by CASCADE
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, functions, cascade, restrict]
required_capabilities: [create-domain, drop-domain, create-function, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (CASCADE, RESTRICT)"
sessions: [a]
setup: |
  CREATE DOMAIN amt AS numeric(10,2);
  CREATE FUNCTION double_amt(a amt) RETURNS numeric LANGUAGE sql AS 'SELECT a * 2';
steps:
  - sql: |
      DROP DOMAIN amt
    expect: error
    sqlstate: "2BP01"
    comment: the function parameter type depends on the domain
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'double_amt'
    expect: rows
    order: ordered
  - sql: |
      DROP DOMAIN amt CASCADE
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname = 'double_amt'
    expect: rows
    order: ordered
