# IF EXISTS applies per name in a list, and a name listed twice is accepted and dropped once.
id: cmd-drop-domain.if-exists-mixed-and-duplicates
title: IF EXISTS in a name list drops the existing names and notices the missing ones
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, drop-if-exists, multiple-names]
required_capabilities: [create-domain, drop-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (IF EXISTS, synopsis)"
sessions: [a]
setup: |
  CREATE DOMAIN d_two AS int4;
  CREATE DOMAIN d_three AS int4;
steps:
  - sql: |
      DROP DOMAIN IF EXISTS d_two, no_such_domain
    expect: notice
    comment: d_two is dropped, the missing name only produces a notice
  - sql: |
      SELECT to_regtype('d_two') IS NULL AS two_gone
    expect: rows
    order: ordered
  - sql: |
      DROP DOMAIN d_three, d_three
    expect: ok
    comment: a duplicated name in one statement is accepted
  - sql: |
      SELECT to_regtype('d_three') IS NULL AS three_gone
    expect: rows
    order: ordered
