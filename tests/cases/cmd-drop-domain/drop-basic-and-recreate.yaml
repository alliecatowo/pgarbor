# DROP DOMAIN removes the domain; the name is then free for a new domain with a different base type.
id: cmd-drop-domain.drop-basic-and-recreate
title: DROP DOMAIN removes the domain and frees its name for reuse
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, create-domain, domain-constraint]
required_capabilities: [create-domain, drop-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (Description)"
sessions: [a]
setup: |
  CREATE DOMAIN pos_int AS int4 CHECK (VALUE > 0);
steps:
  - sql: |
      DROP DOMAIN pos_int
    expect: ok
  - sql: |
      SELECT to_regtype('pos_int') IS NULL AS gone
    expect: rows
    order: ordered
  - sql: |
      CREATE DOMAIN pos_int AS text
    expect: ok
    comment: the name is free again and can be reused with a different base type
  - sql: |
      SELECT typname, typtype FROM pg_type WHERE typname = 'pos_int' ORDER BY typname
    expect: rows
    order: ordered
