# The documented example DROP DOMAIN box targets a built-in base type; DROP DOMAIN refuses non-domain types.
id: cmd-drop-domain.doc-example-box-not-a-domain
title: DROP DOMAIN on a base type or a table name fails with wrong object kind
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, base-types]
required_capabilities: [drop-domain, create-table, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain-examples (To remove the domain box)"
sessions: [a]
setup: |
  CREATE TABLE tt (a int4);
steps:
  - sql: |
      DROP DOMAIN box
    expect: error
    sqlstate: "42809"
    comment: the documented example; box is a built-in base type, not a domain
  - sql: |
      DROP DOMAIN tt
    expect: error
    sqlstate: "42809"
    comment: a table name is not a domain
  - sql: |
      SELECT typname, typtype FROM pg_type WHERE typname = 'box' ORDER BY typname
    expect: rows
    order: ordered
    comment: the built-in type is untouched
  - sql: |
      SELECT relname FROM pg_class WHERE relname = 'tt' AND relkind = 'r'
    expect: rows
    order: ordered
    comment: the table is untouched
