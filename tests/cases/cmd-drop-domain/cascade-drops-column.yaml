# CASCADE drops the dependent table column and keeps the rest of the table and its rows.
id: cmd-drop-domain.cascade-drops-column
title: DROP DOMAIN CASCADE drops the dependent column and keeps the table and other columns
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, cascade, table-columns]
required_capabilities: [create-domain, drop-domain, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (CASCADE)"
sessions: [a]
setup: |
  CREATE DOMAIN tag_t AS text;
  CREATE TABLE item (id int4, tag tag_t, qty int4);
  INSERT INTO item VALUES (1, 'x', 2), (2, NULL, 5);
steps:
  - sql: |
      DROP DOMAIN tag_t CASCADE
    expect: ok
    comment: emits a notice that column item.tag was dropped too
  - sql: |
      SELECT attname FROM pg_attribute WHERE attrelid = 'item'::regclass AND attnum > 0 AND NOT attisdropped ORDER BY attnum
    expect: rows
    order: ordered
  - sql: |
      SELECT id, qty FROM item ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT to_regtype('tag_t') IS NULL AS gone
    expect: rows
    order: ordered
