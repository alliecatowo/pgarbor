# Only the owner of a domain may drop it; a non-owner role gets insufficient_privilege until the owner drops it.
id: cmd-drop-domain.owner-only-drop
title: Non-owner role cannot DROP DOMAIN; owner can
family: cmd-drop-domain
tier: extended
feature_ids: [drop-domain, ownership, privileges, roles]
required_capabilities: [create-domain, drop-domain, create-role, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (Description: only the owner)"
sessions: [a]
setup: |
  CREATE ROLE cmd_drop_domain_nonowner NOLOGIN;
  CREATE DOMAIN owned_dom AS int4;
steps:
  - sql: |
      SET ROLE cmd_drop_domain_nonowner
    expect: ok
  - sql: |
      DROP DOMAIN owned_dom
    expect: error
    sqlstate: "42501"
    comment: must be owner of type owned_dom
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT to_regtype('owned_dom') IS NOT NULL AS still_there
    expect: rows
    order: ordered
  - sql: |
      DROP DOMAIN owned_dom
    expect: ok
    comment: the superuser session owns the domain and may drop it
  - sql: |
      DROP ROLE cmd_drop_domain_nonowner
    expect: ok
    comment: cleanup of the cluster-global role
notes: Roles are cluster-global; the role is dropped at the end of the case.
