# DROP DOMAIN is transactional: a rolled-back CASCADE restores the domain, its constraint and the column.
id: cmd-drop-domain.transaction-rollback
title: DROP DOMAIN CASCADE inside a rolled-back transaction leaves the domain and column in place
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, cascade, transactions, check-constraint]
required_capabilities: [create-domain, drop-domain, create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (CASCADE); transactions"
sessions: [a]
setup: |
  CREATE DOMAIN tx_dom AS int4 CHECK (VALUE <> 0);
  CREATE TABLE tx_t (v tx_dom);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP DOMAIN tx_dom CASCADE
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_type WHERE typname = 'tx_dom'
    expect: rows
    order: ordered
    comment: uncommitted drop is visible inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT to_regtype('tx_dom') IS NOT NULL AS back
    expect: rows
    order: ordered
  - sql: |
      SELECT attname FROM pg_attribute WHERE attrelid = 'tx_t'::regclass AND attnum > 0 AND NOT attisdropped ORDER BY attnum
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO tx_t VALUES (0)
    expect: error
    sqlstate: "23514"
    comment: the domain CHECK is back in force
  - sql: |
      INSERT INTO tx_t VALUES (7)
    expect: ok
