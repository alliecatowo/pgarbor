# The grammar requires a name, and CASCADE and RESTRICT are mutually exclusive.
id: cmd-drop-domain.syntax-errors
title: DROP DOMAIN without a name, or with both CASCADE and RESTRICT, is a syntax error
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, syntax]
required_capabilities: [create-domain, drop-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (synopsis)"
sessions: [a]
setup: |
  CREATE DOMAIN both_opt AS int4;
steps:
  - sql: |
      DROP DOMAIN
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP DOMAIN IF EXISTS
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP DOMAIN both_opt CASCADE RESTRICT
    expect: error
    sqlstate: "42601"
    comment: CASCADE and RESTRICT cannot both appear
  - sql: |
      SELECT to_regtype('both_opt') IS NOT NULL AS still_there
    expect: rows
    order: ordered
