# Dependencies are transitive: a domain built on another domain and used by a column is removed by CASCADE on the base.
id: cmd-drop-domain.cascade-transitive-chain
title: CASCADE on a base domain also drops the domain built on it and the dependent column
family: cmd-drop-domain
tier: core
feature_ids: [drop-domain, cascade, domain-over-domain, restrict]
required_capabilities: [create-domain, drop-domain, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ref/drop_domain.sgml#sql-dropdomain (CASCADE, RESTRICT); ddl-depend"
sessions: [a]
setup: |
  CREATE DOMAIN base_n AS int4;
  CREATE DOMAIN mid_n AS base_n CHECK (VALUE >= 0);
  CREATE TABLE holder (k int4, v mid_n);
  INSERT INTO holder VALUES (1, 10);
steps:
  - sql: |
      DROP DOMAIN base_n
    expect: error
    sqlstate: "2BP01"
    comment: mid_n depends on base_n
  - sql: |
      SELECT to_regtype('mid_n') IS NOT NULL AS mid_there
    expect: rows
    order: ordered
  - sql: |
      DROP DOMAIN base_n CASCADE
    expect: ok
  - sql: |
      SELECT to_regtype('mid_n') IS NULL AS mid_gone, to_regtype('base_n') IS NULL AS base_gone
    expect: rows
    order: ordered
  - sql: |
      SELECT attname FROM pg_attribute WHERE attrelid = 'holder'::regclass AND attnum > 0 AND NOT attisdropped ORDER BY attnum
    expect: rows
    order: ordered
    comment: only the non-domain column k remains
