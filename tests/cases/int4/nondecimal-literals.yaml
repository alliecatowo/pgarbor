# int4 literals in binary, octal and hex notation, including the largest values in each base and
# overflow just past the int4 range.
id: int4.nondecimal-literals
title: Binary, octal and hex int4 literals parse; values past int4 range raise 22003
family: int4
tier: extended
feature_ids: [int4, numeric-literals, input-validation, errors, sqlstate]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT int4 '0b100101' AS bin, int4 '0o273' AS oct, int4 '0x42F' AS hex
    expect: rows
    order: ordered
  - sql: |
      SELECT int4 '0b1111111111111111111111111111111' AS max_bin,
             int4 '0o17777777777' AS max_oct,
             int4 '0x7FFFFFFF' AS max_hex
    expect: rows
    order: ordered
  - sql: |
      SELECT int4 '0b10000000000000000000000000000000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int4 '0o20000000000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int4 '0x80000000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int4 '0b'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int4 '0x'
    expect: error
    sqlstate: "22P02"
