# Basic int4 storage and ordered read-back, including the int4 boundary values and NULL.
id: int4.basic-insert-select
title: Store int4 boundary values and NULL, read back ordered and unordered
family: int4
tier: slice
feature_ids: [int4, create-table, insert, select, order-by, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
setup: |
  CREATE TABLE int4_tbl (f1 int4);
steps:
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('0'), ('123456'), ('-123456'), ('2147483647'), ('-2147483648'), (NULL)
    expect: ok
  - sql: |
      SELECT f1, f1 IS NULL AS is_null FROM int4_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM int4_tbl
    expect: rows
    order: multiset
