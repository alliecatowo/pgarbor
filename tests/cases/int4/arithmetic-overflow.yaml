# int4 overflow in +, -, *, / raises numeric_value_out_of_range; the INT_MIN % -1 case is defined
# to return 0 rather than overflowing.
id: int4.arithmetic-overflow
title: int4 add, subtract, multiply and divide overflow raise 22003; INT_MIN % -1 is 0
family: int4
tier: core
feature_ids: [int4, int2, arithmetic, errors, sqlstate]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT (2147483647)::int4 + 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (2147483647)::int4 + int2 '1'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 - 1
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 * (-1)::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 * (-1)::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 / (-1)::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 / (-1)::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-2147483648)::int4 % (-1)::int4 AS m4, (-2147483648)::int4 % (-1)::int2 AS m2
    expect: rows
    order: ordered
