# Division and modulo by zero on int4 operands raise division_by_zero (22012).
id: int4.division-by-zero
title: int4 division and modulo by zero raise 22012
family: int4
tier: core
feature_ids: [int4, arithmetic, errors, sqlstate]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 1::int4 / 0::int4
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::int4 % 0::int4
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::int4 / int2 '0'
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 0::int4 / 0::int4
    expect: error
    sqlstate: "22012"
