# int4 input values outside [-2147483648, 2147483647] are rejected with numeric_value_out_of_range.
id: int4.input-out-of-range
title: Out-of-range int4 text input raises 22003 and the boundary values are accepted
family: int4
tier: core
feature_ids: [int4, insert, errors, sqlstate]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
setup: |
  CREATE TABLE int4_tbl (f1 int4);
steps:
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('1000000000000')
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('2147483648')
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('-2147483649')
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('-2147483648'), ('2147483647')
    expect: ok
  - sql: |
      SELECT f1 FROM int4_tbl ORDER BY f1
    expect: rows
    order: ordered
