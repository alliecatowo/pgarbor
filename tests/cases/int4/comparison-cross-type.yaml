# int4 columns compared against int2 and int4 constants: equality, ordering, and the modulo parity
# filter, where negative odd values give a negative remainder and therefore do not match.
id: int4.comparison-cross-type
title: int4 column comparisons with int2 and int4 constants, including modulo parity filters
family: int4
tier: core
feature_ids: [int4, int2, select, where, comparison, operators]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
setup: |
  CREATE TABLE int4_tbl (f1 int4);
  INSERT INTO int4_tbl VALUES (-2147483648), (-1), (0), (1), (2147483647);
steps:
  - sql: |
      SELECT f1 FROM int4_tbl WHERE f1 = int2 '0' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM int4_tbl WHERE f1 <> int4 '0' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM int4_tbl WHERE f1 < int2 '0' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM int4_tbl WHERE f1 >= int4 '0' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM int4_tbl WHERE (f1 % int2 '2') = int2 '1' ORDER BY f1
    expect: rows
    order: ordered
    comment: -1 % 2 is -1 in PostgreSQL, so only the positive odd values match
  - sql: |
      SELECT f1 FROM int4_tbl WHERE (f1 % int4 '2') = int2 '0' ORDER BY f1
    expect: rows
    order: ordered
