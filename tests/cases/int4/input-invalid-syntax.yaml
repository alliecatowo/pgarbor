# Malformed int4 text input (blank, embedded spaces, sign with space, decimal point, empty) is
# rejected with invalid_text_representation, and nothing is stored by the failed statements.
id: int4.input-invalid-syntax
title: Malformed int4 text input raises 22P02 and stores no rows
family: int4
tier: core
feature_ids: [int4, insert, errors, sqlstate]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
setup: |
  CREATE TABLE int4_tbl (f1 int4);
steps:
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('34.5')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('asdf')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('     ')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('   asdf   ')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('- 1234')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int4_tbl(f1) VALUES ('123       5')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) AS n FROM int4_tbl
    expect: rows
    order: multiset
