# Casting to int4: float8 rounds half to even (rint), numeric rounds half away from zero, and an
# out-of-range float8 value raises 22003.
id: int4.cast-rounding
title: float8 and numeric to int4 casts round as documented; out-of-range float8 raises 22003
family: int4
tier: core
feature_ids: [int4, casts, float8, numeric, rounding, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT x, x::int4 AS int4_value
      FROM (VALUES (-2.5::float8), (-1.5::float8), (-0.5::float8), (0.0::float8),
                   (0.5::float8), (1.5::float8), (2.5::float8)) t(x)
      ORDER BY x
    expect: rows
    order: ordered
  - sql: |
      SELECT x, x::int4 AS int4_value
      FROM (VALUES (-2.5::numeric), (-1.5::numeric), (-0.5::numeric), (0.0::numeric),
                   (0.5::numeric), (1.5::numeric), (2.5::numeric)) t(x)
      ORDER BY x
    expect: rows
    order: ordered
  - sql: |
      SELECT (2147483648::float8)::int4
    expect: error
    sqlstate: "22003"
