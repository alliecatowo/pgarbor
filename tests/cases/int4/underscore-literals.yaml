# Digit-separating underscores in int4 text input: valid only between two digits, never leading,
# trailing, or doubled.
id: int4.underscore-literals
title: Underscore digit separators are accepted between digits and rejected at edges or doubled
family: int4
tier: extended
feature_ids: [int4, numeric-literals, input-validation, errors, sqlstate]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT int4 '1_000_000' AS dec, int4 '0b_10_0101' AS bin, int4 '0o2_73' AS oct, int4 '0x1EEE_FFFF' AS hex
    expect: rows
    order: ordered
  - sql: |
      SELECT int4 '_100'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int4 '100_'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int4 '100__000'
    expect: error
    sqlstate: "22P02"
