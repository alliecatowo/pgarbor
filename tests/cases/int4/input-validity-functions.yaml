# The non-throwing input-validity API: pg_input_is_valid and pg_input_error_info for int4.
id: int4.input-validity-functions
title: pg_input_is_valid and pg_input_error_info report int4 input errors without raising
family: int4
tier: extended
feature_ids: [int4, input-validation, functions, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('34', 'int4') AS ok_34,
             pg_input_is_valid('asdf', 'int4') AS ok_asdf,
             pg_input_is_valid('1000000000000', 'int4') AS ok_big
    expect: rows
    order: ordered
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('1000000000000', 'int4')
    expect: rows
    order: ordered
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('asdf', 'int4')
    expect: rows
    order: ordered
