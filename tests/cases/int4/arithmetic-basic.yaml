# int4 arithmetic with int2 and int4 operands, unary and binary minus parsing, and integer division
# that truncates toward zero with the remainder taking the sign of the dividend.
id: int4.arithmetic-basic
title: int4 arithmetic, unary minus parsing, and truncating division with signed remainder
family: int4
tier: core
feature_ids: [int4, int2, arithmetic, operators, numeric-literals]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int4.sql"
sessions: [a]
setup: |
  CREATE TABLE int4_tbl (f1 int4);
  INSERT INTO int4_tbl VALUES (0), (123456), (-123456);
steps:
  - sql: |
      SELECT f1, f1 * int2 '2' AS x FROM int4_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, f1 + int4 '2' AS x FROM int4_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, f1 - int2 '2' AS x FROM int4_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, f1 / int4 '2' AS x FROM int4_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT -2+3 AS one, 4-2 AS two, 2- -1 AS three, 2 - -2 AS four
    expect: rows
    order: ordered
  - sql: |
      SELECT 2 + 2 / 2 AS three, (2 + 2) / 2 AS two
    expect: rows
    order: ordered
  - sql: |
      SELECT 7 / 2 AS a, -7 / 2 AS b, 7 % -2 AS c, -7 % 2 AS d
    expect: rows
    order: ordered
    comment: division truncates toward zero; the remainder takes the sign of the dividend
