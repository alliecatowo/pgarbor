id: cmd-move.move-name-case-folding
title: Unquoted cursor names in MOVE fold to lower case like DECLARE, and a quoted mixed-case name does not match
family: cmd-move
tier: core
feature_ids: [move, declare-cursor, identifiers, case-folding, errors]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move (cursor_name); sql-syntax-lexical identifiers (case folding)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2), (3), (4);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE C CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      move next from c
    expect: ok
    comment: MOVE NEXT FROM with lower-case keywords; c folds to c
  - sql: |
      MOVE ALL IN C
    expect: ok
    comment: MOVE ALL IN with the upper-case spelling also folds to c, so MOVE 3
  - sql: |
      MOVE 1 FROM "C"
    expect: error
    sqlstate: "34000"
    comment: the quoted name "C" is distinct from c
  - sql: |
      ROLLBACK
    expect: ok
