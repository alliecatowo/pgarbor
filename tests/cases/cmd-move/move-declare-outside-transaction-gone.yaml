id: cmd-move.move-declare-outside-transaction-gone
title: DECLARE outside a transaction block fails, and MOVE on the never-created cursor reports it does not exist
family: cmd-move
tier: core
feature_ids: [move, declare-cursor, transactions, errors]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move; ref/declare.sgml#sql-declare (Notes: DECLARE outside a transaction block requires WITH HOLD)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      DECLARE nh CURSOR FOR SELECT id FROM t ORDER BY id
    expect: error
    sqlstate: "25P01"
    comment: a non-holdable cursor needs a transaction block
  - sql: |
      MOVE 1 FROM nh
    expect: error
    sqlstate: "34000"
    comment: the cursor was never created
