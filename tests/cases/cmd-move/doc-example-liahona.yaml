id: cmd-move.doc-example-liahona
title: Documented MOVE FORWARD 5 IN liahona skips five rows so the next FETCH returns the sixth
family: cmd-move
tier: core
feature_ids: [move, fetch, declare-cursor, close, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move (Examples)"
sessions: [a]
setup: |
  CREATE TABLE films (code char(5) PRIMARY KEY, title varchar(40) NOT NULL, kind varchar(10));
  INSERT INTO films VALUES ('P_301', 'Bananas', 'Comedy'), ('P_302', 'Dark Night', 'Action'), ('P_303', 'Dr. Strangelove', 'Comedy'), ('P_304', 'Heat', 'Action'), ('P_305', 'Casablanca', 'Drama'), ('P_306', '48 Hrs', 'Action'), ('P_307', 'Notting Hill', 'Comedy');
steps:
  - sql: |
      BEGIN WORK
    expect: ok
  - sql: |
      DECLARE liahona CURSOR FOR SELECT * FROM films ORDER BY code
    expect: ok
  - sql: |
      MOVE FORWARD 5 IN liahona
    expect: ok
    comment: command tag is MOVE 5, no rows returned
  - sql: |
      FETCH 1 FROM liahona
    expect: rows
    order: ordered
    comment: the sixth row in code order
  - sql: |
      CLOSE liahona
    expect: ok
  - sql: |
      COMMIT WORK
    expect: ok
