id: cmd-move.move-syntax-errors
title: MOVE rejects a fractional count and ABSOLUTE without a count with syntax errors
family: cmd-move
tier: core
feature_ids: [move, errors, syntax]
required_capabilities: [create-table, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move (synopsis: count is an integer; ABSOLUTE and RELATIVE take a count)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE s SCROLL CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      MOVE 1.5 FROM s
    expect: error
    sqlstate: "42601"
    comment: count must be an integer
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE s SCROLL CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      MOVE ABSOLUTE FROM s
    expect: error
    sqlstate: "42601"
    comment: ABSOLUTE requires a count
  - sql: |
      ROLLBACK
    expect: ok
