id: cmd-move.move-unknown-cursor-errors
title: MOVE on an unknown cursor name raises an undefined-cursor error inside and outside a transaction
family: cmd-move
tier: core
feature_ids: [move, errors, cursor-name]
required_capabilities: [create-table, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move (cursor_name must name an open cursor)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      MOVE 1 FROM nosuch
    expect: error
    sqlstate: "34000"
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      MOVE FORWARD ALL IN nosuch
    expect: error
    sqlstate: "34000"
  - sql: |
      ROLLBACK
    expect: ok
