id: cmd-move.move-empty-table-scroll-positions
title: MOVE over an empty result returns zero for every direction, including LAST, FIRST and ABSOLUTE
family: cmd-move
tier: core
feature_ids: [move, scroll, declare-cursor, transactions, boundary]
required_capabilities: [create-table, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move (command tag is the number of rows a FETCH would have returned, possibly zero)"
sessions: [a]
setup: |
  CREATE TABLE e (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE es SCROLL CURSOR FOR SELECT id FROM e ORDER BY id
    expect: ok
  - sql: |
      MOVE LAST FROM es
    expect: ok
    comment: MOVE 0
  - sql: |
      MOVE FIRST FROM es
    expect: ok
    comment: MOVE 0
  - sql: |
      MOVE ABSOLUTE 1 FROM es
    expect: ok
    comment: MOVE 0
  - sql: |
      MOVE ALL FROM es
    expect: ok
    comment: MOVE 0
  - sql: |
      COMMIT
    expect: ok
