id: cmd-move.move-aborted-transaction-rejected
title: After an error in the transaction, MOVE is rejected until ROLLBACK, and the cursor is then gone
family: cmd-move
tier: core
feature_ids: [move, transactions, errors, cursor-lifetime]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move; ref/declare.sgml#sql-declare (cursors are closed when the transaction ends)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, 'two'), (3, 'three');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c2 CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      MOVE FORWARD 2 FROM c2
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      MOVE 1 FROM c2
    expect: error
    sqlstate: "25P02"
    comment: the transaction is aborted, so MOVE is ignored
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      MOVE 1 FROM c2
    expect: error
    sqlstate: "34000"
    comment: the rollback removed the cursor
