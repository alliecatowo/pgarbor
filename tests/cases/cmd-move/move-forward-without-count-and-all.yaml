id: cmd-move.move-forward-without-count-and-all
title: MOVE FORWARD without a count moves one row, and ALL with and without FORWARD moves to the end
family: cmd-move
tier: core
feature_ids: [move, fetch, declare-cursor, transactions]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/move.sgml#sql-move (synopsis: FORWARD, FORWARD ALL, ALL forms); ref/fetch.sgml#sql-fetch (default count is 1)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text, score numeric(6,2));
  INSERT INTO t VALUES (1, NULL, 1.5), (2, 'two', NULL), (3, '', 3);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE fw CURSOR FOR SELECT id FROM t ORDER BY id
    expect: ok
  - sql: |
      MOVE FORWARD FROM fw
    expect: ok
    comment: no count means one row, MOVE 1
  - sql: |
      MOVE FORWARD FROM fw
    expect: ok
    comment: MOVE 1
  - sql: |
      FETCH ALL FROM fw
    expect: rows
    order: ordered
    comment: only row 3 remains
  - sql: |
      MOVE ALL FROM fw
    expect: ok
    comment: already at the end, MOVE 0
  - sql: |
      COMMIT
    expect: ok
