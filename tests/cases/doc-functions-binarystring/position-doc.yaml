# position(substring IN bytes) returns the 1-based index of the first occurrence, or 0 when absent.
id: doc-functions-binarystring.position-doc
title: position on bytea returns first 1-based match index or zero
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, position]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-sql (position row)"
sessions: [a]
steps:
  - sql: |
      SELECT position('\x5678'::bytea IN '\x1234567890'::bytea)
    expect: rows
    comment: doc example, 3
  - sql: |
      SELECT position('\xff'::bytea IN '\x1234567890'::bytea)
    expect: rows
    comment: absent substring returns 0
  - sql: |
      SELECT position('\x1234'::bytea IN '\x0012341234'::bytea)
    expect: rows
    comment: first occurrence wins, returns 3
  - sql: |
      SELECT position(''::bytea IN '\x12'::bytea), position('\x12'::bytea IN ''::bytea), position(''::bytea IN ''::bytea)
    expect: rows
    comment: empty needle matches at position 1; a non-empty needle in an empty haystack gives 0
  - sql: |
      SELECT position(NULL::bytea IN '\x12'::bytea)
    expect: rows
    comment: NULL substring gives NULL
