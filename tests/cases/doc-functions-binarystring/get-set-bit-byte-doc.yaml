# get_bit/set_bit/get_byte/set_byte with the documented examples and the documented bit numbering (LSB first within each byte).
id: doc-functions-binarystring.get-set-bit-byte-doc
title: get_bit, set_bit, get_byte and set_byte match documented examples and bit numbering
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, get-bit, set-bit, get-byte, set-byte]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-other (get_bit, get_byte, set_bit, set_byte) and the paragraph on byte/bit numbering"
sessions: [a]
steps:
  - sql: |
      SELECT get_bit('\x1234567890'::bytea, 30), get_byte('\x1234567890'::bytea, 4)
    expect: rows
    comment: doc examples, 1 and 144
  - sql: |
      SELECT set_bit('\x1234567890'::bytea, 30, 0), set_byte('\x1234567890'::bytea, 4, 64)
    expect: rows
    comment: doc examples, \x1234563890 and \x1234567840
  - sql: |
      SELECT get_bit('\x01'::bytea, 0), get_bit('\x01'::bytea, 7), get_bit('\x0080'::bytea, 15), get_bit('\x0080'::bytea, 8)
    expect: rows
    comment: bit 0 is the LSB of the first byte; bit 15 is the MSB of the second byte
  - sql: |
      SELECT set_bit('\x00'::bytea, 7, 1), set_bit('\x80'::bytea, 7, 0)
    expect: rows
    comment: setting the high bit of the first byte gives \x80; clearing it gives \x00
  - sql: |
      SELECT set_byte('\x1234'::bytea, 0, 0), get_byte('\x1234'::bytea, 1)
    expect: rows
    comment: byte numbering is zero based
