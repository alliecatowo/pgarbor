# reverse() with the documented example, plus the empty binary string across the section's functions.
id: doc-functions-binarystring.reverse-and-empty
title: reverse reverses bytes and empty binary strings behave as zero-length values
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, reverse, empty-input]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-other (reverse)"
sessions: [a]
steps:
  - sql: |
      SELECT reverse('\xabcd'::bytea)
    expect: rows
    comment: doc example, \xcdab
  - sql: |
      SELECT reverse('\x1234'::bytea), reverse('\x12'::bytea), reverse(''::bytea)
    expect: rows
    comment: byte order reversal; single and empty values are unchanged
  - sql: |
      SELECT encode(''::bytea, 'hex'), encode(''::bytea, 'base64'), encode(''::bytea, 'escape')
    expect: rows
    comment: empty input encodes to empty text in every format
  - sql: |
      SELECT substring(''::bytea FROM 1 FOR 1), overlay(''::bytea PLACING '\x12'::bytea FROM 1), trim(''::bytea FROM ''::bytea)
    expect: rows
    comment: string operations on empty input
