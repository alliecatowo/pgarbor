# bit_count (popcount) and the crc32/crc32c checksums, with the documented examples and the empty-input values.
id: doc-functions-binarystring.bit-count-crc-doc
title: bit_count, crc32 and crc32c return documented values including empty input
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, bit-count, crc32, crc32c]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-other (bit_count, crc32, crc32c)"
sessions: [a]
steps:
  - sql: |
      SELECT bit_count('\x1234567890'::bytea)
    expect: rows
    comment: doc example, 15
  - sql: |
      SELECT bit_count('\xff'::bytea), bit_count(''::bytea)
    expect: rows
    comment: all eight bits set gives 8; empty gives 0
  - sql: |
      SELECT crc32('abc'::bytea)
    expect: rows
    comment: doc example, 891568578
  - sql: |
      SELECT crc32c('abc'::bytea)
    expect: rows
    comment: doc example, 910901175
  - sql: |
      SELECT crc32(''::bytea), crc32c(''::bytea)
    expect: rows
    comment: both checksums of the empty string are 0
  - sql: |
      SELECT bit_count(NULL::bytea), crc32(NULL::bytea)
    expect: rows
    comment: NULL input gives NULL
