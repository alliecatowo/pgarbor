# NULL inputs to the binary string functions produce NULL, and empty strings are not NULL.
id: doc-functions-binarystring.null-propagation
title: binary string functions return NULL for NULL inputs and treat empty strings as non-NULL
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, null-semantics, encode, decode, overlay, get-byte, set-bit]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring (general behavior of the functions in this section)"
sessions: [a]
steps:
  - sql: |
      SELECT encode(NULL::bytea, 'hex'), decode(NULL::text, 'hex'), decode(NULL::text, 'base64')
    expect: rows
    comment: NULL in any argument gives NULL
  - sql: |
      SELECT get_byte(NULL::bytea, 0), set_bit(NULL::bytea, 0, 1), set_byte(NULL::bytea, 0, 1)
    expect: rows
    comment: NULL bytes gives NULL from get/set functions
  - sql: |
      SELECT overlay(NULL::bytea PLACING '\x01'::bytea FROM 1), overlay('\x12'::bytea PLACING NULL::bytea FROM 1)
    expect: rows
    comment: NULL in either overlay operand gives NULL
  - sql: |
      SELECT reverse(NULL::bytea), btrim(NULL::bytea, '\x12'::bytea), bit_count(NULL::bytea)
    expect: rows
    comment: unary and trim functions propagate NULL
  - sql: |
      SELECT encode(''::bytea, 'hex') IS NULL AS is_null, '' = '' AS empty_equal, octet_length(''::bytea) AS len
    expect: rows
    comment: empty text and empty bytea are not NULL
