# hex encode/decode per the docs: lowercase output, case-insensitive decode, errors on odd length and bad digits.
id: doc-functions-binarystring.encode-hex-doc
title: hex encode and decode use lowercase output, accept either case, and reject odd or invalid input
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, encode, decode, hex]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-encodings (hex format)"
sessions: [a]
steps:
  - sql: |
      SELECT encode('\xABcd'::bytea, 'hex'), encode('\x00'::bytea, 'hex')
    expect: rows
    comment: encode writes lowercase hex digits, always an even count
  - sql: |
      SELECT decode('ABcd', 'hex'), decode('ABCDEF0a', 'hex')
    expect: rows
    comment: decode accepts upper and lower case, mixed in one string
  - sql: |
      SELECT decode('', 'hex')
    expect: rows
    comment: empty text decodes to empty bytea
  - sql: |
      SELECT decode('ABC', 'hex')
    expect: error
    sqlstate: "22023"
    comment: an odd number of hex digits is invalid
  - sql: |
      SELECT decode('mtiz', 'hex')
    expect: error
    sqlstate: "22023"
    comment: non-hex characters are invalid
