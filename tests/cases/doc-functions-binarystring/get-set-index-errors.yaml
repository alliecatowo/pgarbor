# Out-of-range byte/bit indexes and invalid new-bit values raise documented-style errors.
id: doc-functions-binarystring.get-set-index-errors
title: get_byte, set_byte, get_bit and set_bit reject out-of-range indexes and non-bit values
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, get-byte, set-byte, get-bit, set-bit, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-other (get_bit, get_byte, set_bit, set_byte: n'th byte/bit)"
sessions: [a]
steps:
  - sql: |
      SELECT get_byte('\x1234'::bytea, 2)
    expect: error
    sqlstate: "2202E"
    comment: index equal to length is out of range (valid 0..1)
  - sql: |
      SELECT get_byte('\x1234'::bytea, -1)
    expect: error
    sqlstate: "2202E"
    comment: negative byte index
  - sql: |
      SELECT set_byte('\x1234'::bytea, 2, 1)
    expect: error
    sqlstate: "2202E"
    comment: set_byte index out of range
  - sql: |
      SELECT set_bit('\x1234'::bytea, 16, 1)
    expect: error
    sqlstate: "2202E"
    comment: a two-byte string has bits 0..15 only
  - sql: |
      SELECT set_bit('\x1234'::bytea, 0, 2)
    expect: error
    sqlstate: "22023"
    comment: new bit value must be 0 or 1
  - sql: |
      SELECT get_bit(''::bytea, 8)
    expect: error
    sqlstate: "2202E"
    comment: no bits exist in an empty binary string
