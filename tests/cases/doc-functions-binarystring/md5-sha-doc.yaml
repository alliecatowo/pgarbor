# md5 returns hex text while the SHA-2 functions return bytea; the documented examples and encode/decode round trips.
id: doc-functions-binarystring.md5-sha-doc
title: md5 and sha224/256/384/512 match documented digests with their documented return types
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, md5, sha2, encode]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-other (md5, sha224, sha256, sha384, sha512) and the note on md5 return type"
sessions: [a]
steps:
  - sql: |
      SELECT md5('Th\000omas'::bytea)
    expect: rows
    comment: doc example, 8ab2d3c9689aaf18b4958c334c82d8b1 (text, hex encoded)
  - sql: |
      SELECT md5('abc'::bytea), length(md5('abc'::bytea))
    expect: rows
    comment: hex-encoded text is 32 characters
  - sql: |
      SELECT sha224('abc'::bytea), sha256('abc'::bytea)
    expect: rows
    comment: doc examples, bytea digests
  - sql: |
      SELECT sha384('abc'::bytea), sha512('abc'::bytea)
    expect: rows
    comment: doc examples, bytea digests of 48 and 64 bytes
  - sql: |
      SELECT encode(sha256('abc'::bytea), 'hex') = 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad' AS matches_doc, octet_length(sha256('abc'::bytea))
    expect: rows
    comment: hex encoding of the bytea digest matches the doc value; SHA-256 is 32 bytes
  - sql: |
      SELECT decode(md5('abc'), 'hex') = '\x900150983cd24fb0d6963f7d28e17f72'::bytea AS roundtrip
    expect: rows
    comment: md5 text decodes to bytea, as the docs suggest
  - sql: |
      SELECT sha256(''::bytea), md5(''::bytea)
    expect: rows
    comment: digests of the empty string
