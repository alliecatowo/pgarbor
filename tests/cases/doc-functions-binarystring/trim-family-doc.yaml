# btrim/ltrim/rtrim and trim(...) in both SQL-standard and non-standard syntax, with the documented examples.
id: doc-functions-binarystring.trim-family-doc
title: btrim, ltrim, rtrim and trim variants strip bytes from a bytea per the docs
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, bytea-trim, btrim, ltrim, rtrim, trim]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-sql (btrim, ltrim, rtrim, trim rows)"
sessions: [a]
steps:
  - sql: |
      SELECT btrim('\x1234567890'::bytea, '\x9012'::bytea)
    expect: rows
    comment: doc example, \x345678
  - sql: |
      SELECT ltrim('\x1234567890'::bytea, '\x9012'::bytea), rtrim('\x1234567890'::bytea, '\x9012'::bytea)
    expect: rows
    comment: doc examples, \x34567890 and \x12345678
  - sql: |
      SELECT trim('\x9012'::bytea FROM '\x1234567890'::bytea)
    expect: rows
    comment: standard syntax, BOTH is the default, \x345678
  - sql: |
      SELECT trim(leading '\x9012'::bytea FROM '\x1234567890'::bytea), trim(trailing '\x9012'::bytea FROM '\x1234567890'::bytea), trim(both FROM '\x1234567890'::bytea, '\x9012'::bytea)
    expect: rows
    comment: LEADING, TRAILING and the non-standard comma form with BOTH
  - sql: |
      SELECT trim(leading FROM '\x1234567890'::bytea, '\x9012'::bytea)
    expect: rows
    comment: non-standard comma form with the FROM keyword omitted or present
  - sql: |
      SELECT btrim('\x1234'::bytea, '\xff'::bytea), btrim('\x1212'::bytea, '\x12'::bytea), trim(''::bytea FROM '\x12'::bytea)
    expect: rows
    comment: no matching bytes leaves the input unchanged; stripping every byte gives an empty result; empty bytesremoved removes nothing
  - sql: |
      SELECT btrim(NULL::bytea, '\x12'::bytea)
    expect: rows
    comment: NULL input gives NULL
