# length(bytes, encoding) counts characters of the bytes interpreted in the named encoding.
id: doc-functions-binarystring.length-with-encoding
title: length with an encoding argument counts characters for the named encoding
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, length, encodings]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-other (length(bytes, encoding))"
sessions: [a]
steps:
  - sql: |
      SELECT length('jose'::bytea, 'UTF8')
    expect: rows
    comment: doc example, 4
  - sql: |
      SELECT length('\xc3a9'::bytea, 'UTF8'), octet_length('\xc3a9'::bytea)
    expect: rows
    comment: two bytes are one UTF-8 character but still two octets
  - sql: |
      SELECT length('\xe9'::bytea, 'LATIN1')
    expect: rows
    comment: a single LATIN1 byte is one character
  - sql: |
      SELECT length(NULL::bytea, 'UTF8')
    expect: rows
    comment: NULL input gives NULL
  - sql: |
      SELECT length('\xc3a9'::bytea, 'nosuchenc')
    expect: error
    sqlstate: "22023"
    comment: unknown encoding name
  - sql: |
      SELECT length('\xff'::bytea, 'UTF8')
    expect: error
    sqlstate: "22021"
    comment: invalid byte sequence for the encoding
