# convert, convert_from and convert_to between bytea and text in named encodings, with documented examples and error cases.
id: doc-functions-binarystring.convert-family-doc
title: convert, convert_from and convert_to transcode between named encodings per the docs
family: doc-functions-binarystring
tier: extended
feature_ids: [bytea, convert, convert-from, convert-to, encodings]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring-encodings (Text/Binary String Conversion Functions)"
sessions: [a]
steps:
  - sql: |
      SELECT convert('text_in_utf8'::bytea, 'UTF8', 'LATIN1')
    expect: rows
    comment: doc example, \x746578745f696e5f75746638
  - sql: |
      SELECT convert_from('text_in_utf8'::bytea, 'UTF8')
    expect: rows
    comment: doc example, decodes to text
  - sql: |
      SELECT convert_to('some_text', 'UTF8')
    expect: rows
    comment: doc example, \x736f6d655f74657874
  - sql: |
      SELECT convert_to(U&'\00e9', 'LATIN1'), convert_from('\xe9'::bytea, 'LATIN1')
    expect: rows
    comment: a single LATIN1 byte 0xE9 is e-acute, and back again
  - sql: |
      SELECT convert('abc'::bytea, 'UTF8', 'NOSUCH')
    expect: error
    sqlstate: "22023"
    comment: unknown destination encoding name
  - sql: |
      SELECT convert_from('\xff'::bytea, 'UTF8')
    expect: error
    sqlstate: "22021"
    comment: byte sequence invalid in the source encoding
  - sql: |
      SELECT convert_to('abc', 'NOSUCH')
    expect: error
    sqlstate: "22023"
    comment: unknown encoding name in convert_to
