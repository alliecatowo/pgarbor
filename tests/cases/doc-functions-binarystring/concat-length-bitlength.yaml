# Documented bytea || concatenation and the length family (bit_length, octet_length, length) including the docs' examples.
id: doc-functions-binarystring.concat-length-bitlength
title: bytea concatenation and bit/octet/byte length functions match documented examples
family: doc-functions-binarystring
tier: core
feature_ids: [bytea, bytea-concat, bit-length, octet-length, length]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-binarystring (SQL Binary String Functions and Operators, Other Binary String Functions)"
sessions: [a]
steps:
  - sql: |
      SELECT '\x123456'::bytea || '\x789a00bcde'::bytea
    expect: rows
    comment: doc example, result \x123456789a00bcde
  - sql: |
      SELECT bit_length('\x123456'::bytea)
    expect: rows
    comment: doc example, 8 * octet_length = 24
  - sql: |
      SELECT octet_length('\x123456'::bytea), length('\x1234567890'::bytea)
    expect: rows
    comment: octet_length 3 (doc example) and length 5 (doc example)
  - sql: |
      SELECT '\x'::bytea || ''::bytea, octet_length(''::bytea), bit_length(''::bytea), length(''::bytea)
    expect: rows
    comment: empty binary strings are valid operands and have zero length
  - sql: |
      SELECT '\x12'::bytea || NULL::bytea, length(NULL::bytea), bit_length(NULL::bytea), octet_length(NULL::bytea)
    expect: rows
    comment: concatenation with NULL yields NULL; length functions are strict
