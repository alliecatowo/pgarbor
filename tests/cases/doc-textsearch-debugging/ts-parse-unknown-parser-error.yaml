# Unknown parser names raise undefined_object for both ts_parse and ts_token_type; empty and NULL documents give no tokens.
id: doc-textsearch-debugging.ts-parse-unknown-parser-error
title: ts_parse and ts_token_type with an unknown parser raise undefined_object; empty input yields no tokens
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-parse, ts-token-type, errors, empty-input, null-semantics]
required_capabilities: [select, text-search, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/textsearch.sgml#textsearch-parser-testing"
steps:
  - sql: |
      SELECT * FROM ts_parse('no_such_parser', 'x')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT * FROM ts_token_type('no_such_parser')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) AS n FROM ts_parse('default', '')
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM ts_parse('default', NULL::text)
    expect: rows
    order: ordered
    comment: strict function, so a NULL document yields zero rows
