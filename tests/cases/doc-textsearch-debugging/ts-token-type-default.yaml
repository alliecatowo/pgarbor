# ts_token_type describes the 23 token ids of the default parser; the table is the same by name and by OID.
id: doc-textsearch-debugging.ts-token-type-default
title: ts_token_type lists the 23 token types of the default parser by name and by OID
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-token-type, token-ids, parser-oid]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-parser-testing"
steps:
  - sql: |
      SELECT tokid, alias, description
      FROM ts_token_type('default')
      ORDER BY tokid
    expect: rows
    order: ordered
    comment: documented example, complete list
  - sql: |
      SELECT tokid, alias
      FROM ts_token_type((SELECT oid FROM pg_ts_parser WHERE prsname = 'default'))
      ORDER BY tokid
    expect: rows
    order: ordered
  - sql: |
      SELECT tokid, alias
      FROM ts_token_type('default')
      WHERE alias IN ('uint', 'int', 'blank')
      ORDER BY tokid
    expect: rows
    order: ordered
