# ts_lexize treats its input as one token, so a phrase is not split; to_tsvector and plainto_tsquery do split it.
id: doc-textsearch-debugging.ts-lexize-phrase-single-token
title: ts_lexize treats a phrase as a single token while to_tsvector and plainto_tsquery parse it
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-lexize, to-tsvector, plainto-tsquery, parsing-vs-lexing]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-dictionary-testing"
steps:
  - sql: |
      SELECT ts_lexize('english_stem', 'supernovae stars') AS whole_phrase
    expect: rows
    order: ordered
    comment: the documented thesaurus variant needs a thesaurus file the oracle does not carry; english_stem shows the same single-token behavior
  - sql: |
      SELECT plainto_tsquery('english', 'supernovae stars') AS q,
             to_tsvector('english', 'supernovae stars') AS v
    expect: rows
    order: ordered
    comment: the parser splits the phrase into two words before the dictionary sees them
