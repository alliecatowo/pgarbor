# ts_parse by parser name and by parser OID returns the same token stream from the documented example.
id: doc-textsearch-debugging.ts-parse-default-parser
title: ts_parse returns tokid and token for each parsed token, by name and by OID
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-parse, parser-oid, token-ids]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-parser-testing"
steps:
  - sql: |
      SELECT tokid, token, n
      FROM ts_parse('default', '123 - a number') WITH ORDINALITY AS t(tokid, token, n)
      ORDER BY n
    expect: rows
    order: ordered
    comment: documented example
  - sql: |
      SELECT tokid, token, n
      FROM ts_parse((SELECT oid FROM pg_ts_parser WHERE prsname = 'default'), '123 - a number') WITH ORDINALITY AS t(tokid, token, n)
      ORDER BY n
    expect: rows
    order: ordered
    comment: the parser OID overload must match the name overload
