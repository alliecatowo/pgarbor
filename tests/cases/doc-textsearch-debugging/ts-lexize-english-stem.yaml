# ts_lexize on a single token: the documented stars example, case folding, a stop word and a stemmed word.
id: doc-textsearch-debugging.ts-lexize-english-stem
title: ts_lexize returns lexemes for known tokens and an empty array for stop words
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-lexize, snowball-stemmer, stop-words, case-folding]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-dictionary-testing"
steps:
  - sql: |
      SELECT ts_lexize('english_stem', 'stars') AS stars, ts_lexize('english_stem', 'a') AS stop_word
    expect: rows
    order: ordered
    comment: documented examples {star} and {}
  - sql: |
      SELECT ts_lexize('english_stem', 'Stars') AS folded, ts_lexize('english_stem', 'running') AS stemmed, ts_lexize('english_stem', '') AS empty_token
    expect: rows
    order: ordered
