# ts_debug on the documented english example: one row per token, blanks included, stop words give {}.
id: doc-textsearch-debugging.ts-debug-english-document
title: ts_debug lists every token of the documented english example with dictionaries and lexemes
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-debug, stop-words, dictionary-lexemes, blank-tokens]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-configuration-testing"
steps:
  - sql: |
      SELECT alias, description, token, dictionaries, dictionary, lexemes
      FROM ts_debug('english', 'a fat  cat sat on a mat - it ate a fat rats') WITH ORDINALITY AS t(alias, description, token, dictionaries, dictionary, lexemes, n)
      ORDER BY n
    expect: rows
    order: ordered
    comment: documented example; the parser emits blank tokens between words and the hyphen
  - sql: |
      SELECT alias, token, lexemes
      FROM ts_debug('english', 'a fat  cat sat on a mat - it ate a fat rats') WITH ORDINALITY AS t(alias, description, token, dictionaries, dictionary, lexemes, n)
      WHERE alias = 'blank'
      ORDER BY n
    expect: rows
    order: ordered
    comment: blank tokens have empty dictionary lists and no lexemes
