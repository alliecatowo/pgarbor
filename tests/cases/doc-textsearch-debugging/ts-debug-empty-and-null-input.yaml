# Empty and NULL documents, and a NULL configuration, produce zero rows (strict function).
id: doc-textsearch-debugging.ts-debug-empty-and-null-input
title: ts_debug returns no rows for empty documents and for NULL document or configuration
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-debug, null-semantics, empty-input]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-configuration-testing"
steps:
  - sql: |
      SELECT count(*) AS n FROM ts_debug('english', '')
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM ts_debug('english', NULL::text)
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM ts_debug(NULL::regconfig, 'fat cat')
    expect: rows
    order: ordered
    comment: a NULL config does not fall back to the default configuration in this call form
