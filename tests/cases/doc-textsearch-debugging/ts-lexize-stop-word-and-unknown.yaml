# A dictionary with ACCEPT = false returns NULL for words it does not know and {} for its stop words.
id: doc-textsearch-debugging.ts-lexize-stop-word-and-unknown
title: ts_lexize returns NULL for an unknown word and an empty array for a stop word
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-lexize, stop-words, simple-template, accept-option, null-semantics]
required_capabilities: [create-table, select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-dictionary-testing"
setup: |
  CREATE TEXT SEARCH DICTIONARY my_stop (TEMPLATE = simple, STOPWORDS = english, ACCEPT = false);
steps:
  - sql: |
      SELECT ts_lexize('my_stop', 'the') AS stop_word,
             ts_lexize('my_stop', 'a') AS stop_word_2,
             ts_lexize('my_stop', 'Stars') IS NULL AS unknown_is_null
    expect: rows
    order: ordered
    comment: stop words give an empty array; non-stop words are unknown, so NULL
  - sql: |
      SELECT ts_lexize('simple', 'Stars') AS simple_keeps_word
    expect: rows
    order: ordered
    comment: the simple dictionary accepts every word, lowercased
