# The one-argument form of ts_debug uses default_text_search_config.
id: doc-textsearch-debugging.ts-debug-default-config
title: ts_debug without a config argument uses default_text_search_config
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-debug, default-config, stemming]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-configuration-testing"
steps:
  - sql: |
      SET default_text_search_config = 'pg_catalog.english'
    expect: ok
  - sql: |
      SELECT alias, token, lexemes
      FROM ts_debug('running jumps') WITH ORDINALITY AS t(alias, description, token, dictionaries, dictionary, lexemes, n)
      ORDER BY n
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS differences
      FROM (SELECT * FROM ts_debug('running jumps')
            EXCEPT
            SELECT * FROM ts_debug('english', 'running jumps')) d
    expect: rows
    order: ordered
    comment: the implicit-config call must equal the explicit english call, so the count is 0
