# ts_lexize is strict: a NULL dictionary or a NULL token gives NULL.
id: doc-textsearch-debugging.ts-lexize-null-inputs
title: ts_lexize returns NULL for a NULL dictionary or a NULL token
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-lexize, null-semantics]
required_capabilities: [select, text-search]
provenance:
  source: hand
  ref: "doc/src/sgml/textsearch.sgml#textsearch-dictionary-testing"
steps:
  - sql: |
      SELECT ts_lexize(NULL::regdictionary, 'x') IS NULL AS null_dict,
             ts_lexize('simple', NULL::text) IS NULL AS null_token
    expect: rows
    order: ordered
