# Naming a configuration that does not exist fails with undefined_object.
id: doc-textsearch-debugging.ts-debug-unknown-config-error
title: ts_debug with an unknown configuration name raises undefined_object
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-debug, errors, configuration-lookup]
required_capabilities: [select, text-search, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/textsearch.sgml#textsearch-configuration-testing"
steps:
  - sql: |
      SELECT * FROM ts_debug('no_such_config', 'fat cat')
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) AS n FROM ts_debug('english', 'fat cat')
    expect: rows
    order: ordered
    comment: the session is still usable after the error (autocommit)
