# The default parser classifies emails, URLs, hosts, versions, decimals and hyphenated words; names come from ts_token_type.
id: doc-textsearch-debugging.ts-parse-token-classes
title: ts_parse classifies email, URL, host, version, decimal and hyphenated tokens
family: doc-textsearch-debugging
tier: core
feature_ids: [ts-parse, token-types, hyphenated-words, url-parsing, email-parsing]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/textsearch.sgml#textsearch-parser-testing"
steps:
  - sql: |
      SELECT p.n, p.tokid, t.alias, p.token
      FROM ts_parse('default', 'user@example.com http://example.com/a/b 3.14 1.2.3 foo-bar') WITH ORDINALITY AS p(tokid, token, n)
      JOIN ts_token_type('default') AS t ON t.tokid = p.tokid
      ORDER BY p.n
    expect: rows
    order: ordered
    comment: token aliases joined from ts_token_type so the classes are readable
  - sql: |
      SELECT alias, token
      FROM ts_debug('english', 'user@example.com http://example.com/a/b 3.14 1.2.3 foo-bar') WITH ORDINALITY AS t(alias, description, token, dictionaries, dictionary, lexemes, n)
      ORDER BY n
    expect: rows
    order: ordered
    comment: the same document seen through ts_debug, which also shows the hyphenated parts
