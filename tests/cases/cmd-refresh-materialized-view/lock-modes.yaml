id: cmd-refresh-materialized-view.lock-modes
title: Plain REFRESH takes AccessExclusiveLock on the view; CONCURRENTLY takes only ExclusiveLock
family: cmd-refresh-materialized-view
tier: extended
feature_ids: [refresh-materialized-view, refresh-concurrently, locks]
required_capabilities: [create-table, insert, select, create-index, create-materialized-view, refresh-materialized-view, transactions, lock-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/refresh_materialized_view.sgml#sql-refreshmaterializedview (CONCURRENTLY)"
sessions: [a]
setup: |
  CREATE TABLE src (id int4 PRIMARY KEY);
  INSERT INTO src VALUES (1), (2);
  CREATE MATERIALIZED VIEW mv_lock AS SELECT id FROM src;
  CREATE UNIQUE INDEX mv_lock_id ON mv_lock (id);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      REFRESH MATERIALIZED VIEW CONCURRENTLY mv_lock
    expect: ok
  - sql: |
      SELECT l.mode, l.granted FROM pg_locks l
      WHERE l.relation = 'mv_lock'::regclass AND l.pid = pg_backend_pid()
      ORDER BY l.mode
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      REFRESH MATERIALIZED VIEW mv_lock
    expect: ok
  - sql: |
      SELECT l.mode, l.granted FROM pg_locks l
      WHERE l.relation = 'mv_lock'::regclass AND l.pid = pg_backend_pid()
      ORDER BY l.mode
    expect: rows
    order: ordered
  - sql: |
      ROLLBACK
    expect: ok
