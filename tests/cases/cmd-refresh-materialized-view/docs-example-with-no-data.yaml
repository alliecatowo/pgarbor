id: cmd-refresh-materialized-view.docs-example-with-no-data
title: WITH NO DATA empties a materialized view which then refuses scans until refreshed WITH DATA
family: cmd-refresh-materialized-view
tier: core
feature_ids: [refresh-materialized-view, materialized-views, with-no-data]
required_capabilities: [create-table, insert, select, create-materialized-view, refresh-materialized-view]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/refresh_materialized_view.sgml#sql-refreshmaterializedview (Examples: annual_statistics_basis WITH NO DATA)"
sessions: [a]
setup: |
  CREATE TABLE events (id int4 PRIMARY KEY, year int4 NOT NULL, kind text NOT NULL);
  INSERT INTO events VALUES (1, 2025, 'a'), (2, 2025, 'b'), (3, 2026, 'a');
  CREATE MATERIALIZED VIEW annual_statistics_basis AS
    SELECT year, kind, count(*) AS n FROM events GROUP BY year, kind;
steps:
  - sql: |
      SELECT year, kind, n FROM annual_statistics_basis ORDER BY year, kind
    expect: rows
    order: ordered
  - sql: |
      REFRESH MATERIALIZED VIEW annual_statistics_basis WITH NO DATA
    expect: ok
  - sql: |
      SELECT matviewname, ispopulated FROM pg_matviews WHERE matviewname = 'annual_statistics_basis'
    expect: rows
    order: ordered
    comment: ispopulated is false after WITH NO DATA
  - sql: |
      SELECT count(*) FROM annual_statistics_basis
    expect: error
    sqlstate: "55000"
    comment: not scannable; PG reports 'has not been populated' with a HINT
  - sql: |
      REFRESH MATERIALIZED VIEW annual_statistics_basis
    expect: ok
    comment: default is WITH DATA, which makes it scannable again
  - sql: |
      SELECT year, kind, n FROM annual_statistics_basis ORDER BY year, kind
    expect: rows
    order: ordered
  - sql: |
      SELECT matviewname, ispopulated FROM pg_matviews WHERE matviewname = 'annual_statistics_basis'
    expect: rows
    order: ordered
