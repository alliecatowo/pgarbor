id: cmd-refresh-materialized-view.refresh-rollback-and-failure
title: REFRESH is transactional; rolled back or failed refreshes leave the previous contents in place
family: cmd-refresh-materialized-view
tier: core
feature_ids: [refresh-materialized-view, transactions, rollback, error-handling]
required_capabilities: [create-table, insert, delete, select, create-materialized-view, refresh-materialized-view, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/refresh_materialized_view.sgml#sql-refreshmaterializedview (Description: old contents discarded)"
sessions: [a]
setup: |
  CREATE TABLE d (k int4, v int4);
  INSERT INTO d VALUES (1, 10), (2, 5);
  CREATE MATERIALIZED VIEW mv_div AS SELECT k, 100 / v AS q FROM d;
  CREATE MATERIALIZED VIEW mv_rb AS SELECT count(*) AS n FROM d;
steps:
  - sql: |
      INSERT INTO d VALUES (3, 0)
    expect: ok
  - sql: |
      REFRESH MATERIALIZED VIEW mv_div
    expect: error
    sqlstate: "22012"
    comment: division by zero while the new data is computed
  - sql: |
      SELECT k, q FROM mv_div ORDER BY k
    expect: rows
    order: ordered
    comment: old contents still scannable after the failed refresh
  - sql: |
      SELECT n FROM mv_rb
    expect: rows
    order: ordered
    comment: still the CREATE-time snapshot (2)
  - sql: |
      REFRESH MATERIALIZED VIEW mv_rb
    expect: ok
    comment: now sees three rows
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DELETE FROM d WHERE k = 3
    expect: ok
  - sql: |
      REFRESH MATERIALIZED VIEW mv_rb
    expect: ok
  - sql: |
      SELECT n FROM mv_rb
    expect: rows
    order: ordered
    comment: visible inside the transaction (2)
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT n FROM mv_rb
    expect: rows
    order: ordered
    comment: rolled back to the pre-transaction refresh contents (3)
