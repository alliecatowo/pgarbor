# A schema-qualified domain lives in that schema; the same name may exist in another schema.
id: cmd-create-domain.schema-qualified-name
title: Schema-qualified CREATE DOMAIN places the type in the named schema and names are unique per schema
family: cmd-create-domain
tier: core
feature_ids: [create-domain, schemas, varchar]
required_capabilities: [create-domain, create-schema, create-table, insert, select, constraints]
provenance:
  source: pg-docs
  ref: "ref/create_domain.sgml#sql-createdomain (name, schema)"
sessions: [a]
setup: |
  CREATE SCHEMA cd_s1;
steps:
  - sql: |
      CREATE DOMAIN cd_s1.sdom AS varchar(3) CHECK (VALUE <> 'no')
    expect: ok
  - sql: |
      SELECT n.nspname, t.typname, t.typtype, format_type(t.oid, NULL) AS shown
      FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
      WHERE t.typname = 'sdom'
    expect: rows
    order: ordered
  - sql: |
      CREATE DOMAIN sdom AS int
    expect: ok
    comment: unqualified name goes to public, where no sdom exists yet, so it is allowed
  - sql: |
      CREATE TABLE tsd (v cd_s1.sdom)
    expect: ok
  - sql: |
      INSERT INTO tsd VALUES ('ab')
    expect: ok
  - sql: |
      INSERT INTO tsd VALUES ('abcd')
    expect: error
    sqlstate: "22001"
    comment: the varchar(3) base type length still applies
  - sql: |
      INSERT INTO tsd VALUES ('no')
    expect: error
    sqlstate: "23514"
  - sql: |
      SELECT v FROM tsd
    expect: rows
    order: ordered
