# A CHECK that evaluates to UNKNOWN passes; FALSE raises 23514 and the value is not converted.
id: cmd-create-domain.check-unknown-and-false
title: CHECK results of TRUE or UNKNOWN succeed while FALSE is rejected with check_violation
family: cmd-create-domain
tier: core
feature_ids: [create-domain, check-constraint, three-valued-logic]
required_capabilities: [create-domain, select, constraints]
provenance:
  source: pg-docs
  ref: "ref/create_domain.sgml#sql-createdomain (CHECK)"
sessions: [a]
setup: |
  CREATE DOMAIN dchk_unknown AS int CHECK (NULLIF(VALUE, 3) > 0);
steps:
  - sql: |
      SELECT 3::dchk_unknown AS v
    expect: rows
    comment: NULLIF yields NULL, so the check is UNKNOWN and passes
  - sql: |
      SELECT 1::dchk_unknown AS v
    expect: rows
  - sql: |
      SELECT 0::dchk_unknown AS v
    expect: error
    sqlstate: "23514"
    comment: the check is FALSE
  - sql: |
      SELECT NULL::dchk_unknown IS NULL AS is_null
    expect: rows
    comment: NULL is not checked at all
