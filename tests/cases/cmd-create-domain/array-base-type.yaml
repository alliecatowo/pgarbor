# The underlying data type may include array specifiers; CHECK then sees the whole array as VALUE.
id: cmd-create-domain.array-base-type
title: Domain over an array type applies CHECK to the whole array value
family: cmd-create-domain
tier: core
feature_ids: [create-domain, arrays, check-constraint]
required_capabilities: [create-domain, create-table, insert, select, arrays, constraints]
provenance:
  source: pg-docs
  ref: "ref/create_domain.sgml#sql-createdomain (data_type array specifiers)"
sessions: [a]
steps:
  - sql: |
      CREATE DOMAIN darr AS int[] CHECK (array_length(VALUE, 1) = 2)
    expect: ok
  - sql: |
      CREATE TABLE tarr (v darr)
    expect: ok
  - sql: |
      INSERT INTO tarr VALUES ('{1,2}'), ('{3,4}')
    expect: ok
  - sql: |
      INSERT INTO tarr VALUES ('{1,2,3}')
    expect: error
    sqlstate: "23514"
  - sql: |
      SELECT v FROM tarr ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v[2] AS second FROM tarr ORDER BY v[2]
    expect: rows
    order: ordered
