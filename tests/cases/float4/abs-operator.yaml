# The unary @ operator returns the absolute value of a float4, including on table rows.
id: float4.abs-operator
title: Unary @ returns float4 absolute values for literals and table rows
family: float4
tier: core
feature_ids: [float4, select, operators]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
setup: |
  CREATE TABLE float4_tbl (f1 float4);
  INSERT INTO float4_tbl (f1) VALUES ('0.0'), ('-34.84'), ('1004.3');
steps:
  - sql: |
      SELECT f.f1, @f.f1 AS abs_f1 FROM float4_tbl f ORDER BY f.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT @ '-1004.3'::float4 AS v
    expect: rows
