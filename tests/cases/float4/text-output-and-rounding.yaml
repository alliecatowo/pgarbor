# Text output of float4 values and rounding when an integer exceeds the 24-bit significand.
id: float4.text-output-and-rounding
title: float4 text output is shortest-form and integers beyond 2^24 round to even
family: float4
tier: core
feature_ids: [float4, numeric, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '1004.30'::float4::text AS t1, '-34.84'::float4::text AS t2, '0'::float4::text AS t3
    expect: rows
  - sql: |
      SELECT 16777217::float4 AS rounded, 16777216::float4 AS exact
    expect: rows
