# Dividing a finite float4 by zero raises division_by_zero (22012); NaN divided by zero yields NaN.
id: float4.divide-by-zero-22012
title: Finite float4 divided by zero errors while NaN divided by zero returns NaN
family: float4
tier: core
feature_ids: [float4, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
setup: |
  CREATE TABLE float4_tbl (f1 float4);
  INSERT INTO float4_tbl (f1) VALUES ('1004.3');
steps:
  - sql: |
      SELECT f.f1 / '0.0' FROM float4_tbl f
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 'nan'::float4 / '0'::float4 AS v
    expect: rows
