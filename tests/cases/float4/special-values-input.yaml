# NaN and Infinity literals are accepted case-insensitively with surrounding whitespace.
id: float4.special-values-input
title: NaN and infinity literals parse case-insensitively and ignore surrounding spaces
family: float4
tier: core
feature_ids: [float4, select]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'NaN'::float4 AS a, 'nan'::float4 AS b, '   NAN  '::float4 AS c
    expect: rows
  - sql: |
      SELECT 'infinity'::float4 AS a, '          -INFINiTY   '::float4 AS b
    expect: rows
  - sql: |
      SELECT 'NaN'::float4 = 'nan'::float4 AS same_nan, 'NaN'::float4 IS NOT NULL AS not_null
    expect: rows
