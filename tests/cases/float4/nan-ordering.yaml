# NaN compares equal to itself and sorts above Infinity and every finite value.
id: float4.nan-ordering
title: NaN sorts above Infinity and equals itself in float4 comparisons
family: float4
tier: extended
feature_ids: [float4, select, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/datatype-numeric.html#DATATYPE-FLOAT"
sessions: [a]
setup: |
  CREATE TABLE f (v float4);
  INSERT INTO f (v) VALUES ('NaN'), ('Infinity'), ('-Infinity'), (0), (1004.3);
steps:
  - sql: |
      SELECT v FROM f ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v FROM f WHERE v > '1000000'::float4 ORDER BY v
    expect: rows
    order: ordered
  - sql: |
      SELECT v FROM f WHERE v = 'NaN'::float4
    expect: rows
    order: multiset
