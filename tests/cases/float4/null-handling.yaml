# NULL float4 values propagate through arithmetic, are skipped by aggregates, and never match equality.
id: float4.null-handling
title: NULL float4 values propagate through arithmetic and are excluded by equality
family: float4
tier: core
feature_ids: [float4, null-semantics, select, aggregates]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 docs functions-comparison.html (NULL comparison) and functions-aggregate.html"
sessions: [a]
setup: |
  CREATE TABLE f (id int4 PRIMARY KEY, v float4);
  INSERT INTO f VALUES (1, 2.5), (2, NULL), (3, -1.0);
steps:
  - sql: |
      SELECT id, v * 2 AS doubled FROM f ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM f WHERE v = NULL
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) AS all_rows, count(v) AS non_null, sum(v) AS total FROM f
    expect: rows
  - sql: |
      SELECT id FROM f WHERE v IS NULL
    expect: rows
    order: multiset
