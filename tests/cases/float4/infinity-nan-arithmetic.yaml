# IEEE special values propagate through float4 arithmetic as in the regression file.
id: float4.infinity-nan-arithmetic
title: Infinity and NaN operands follow IEEE rules in float4 arithmetic
family: float4
tier: core
feature_ids: [float4, numeric]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 'Infinity'::float4 + 100.0 AS a
    expect: rows
  - sql: |
      SELECT 'Infinity'::float4 / 'Infinity'::float4 AS a
    expect: rows
  - sql: |
      SELECT '42'::float4 / 'Infinity'::float4 AS a
    expect: rows
  - sql: |
      SELECT 'nan'::float4 / 'nan'::float4 AS a
    expect: rows
  - sql: |
      SELECT 'nan'::numeric::float4 AS a
    expect: rows
