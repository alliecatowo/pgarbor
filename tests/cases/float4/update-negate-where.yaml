# UPDATE with a float4 expression in SET and a float4 predicate in WHERE.
id: float4.update-negate-where
title: UPDATE negates positive float4 rows selected by a float4 predicate
family: float4
tier: core
feature_ids: [float4, update, select]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
setup: |
  CREATE TABLE float4_tbl (f1 float4);
  INSERT INTO float4_tbl (f1) VALUES ('0.0'), ('1004.3'), ('-34.84'), ('1.5');
steps:
  - sql: |
      UPDATE float4_tbl SET f1 = float4_tbl.f1 * '-1' WHERE float4_tbl.f1 > '0.0'
    expect: ok
  - sql: |
      SELECT f1 FROM float4_tbl ORDER BY f1
    expect: rows
    order: ordered
