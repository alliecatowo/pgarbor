# Basic float4 arithmetic on a table of non-null values, filtered by a float4 predicate.
id: float4.arithmetic-operators
title: Multiply, add, divide and subtract float4 columns with a literal operand
family: float4
tier: core
feature_ids: [float4, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
setup: |
  CREATE TABLE float4_tbl (f1 float4);
  INSERT INTO float4_tbl (f1) VALUES ('0.0'), ('1004.3'), ('-34.84');
steps:
  - sql: |
      SELECT f.f1, f.f1 * '-10' AS x FROM float4_tbl f WHERE f.f1 > '0.0' ORDER BY f.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f.f1, f.f1 + '-10' AS x FROM float4_tbl f WHERE f.f1 > '0.0' ORDER BY f.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f.f1, f.f1 / '-10' AS x FROM float4_tbl f WHERE f.f1 > '0.0' ORDER BY f.f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f.f1, f.f1 - '-10' AS x FROM float4_tbl f WHERE f.f1 > '0.0' ORDER BY f.f1
    expect: rows
    order: ordered
