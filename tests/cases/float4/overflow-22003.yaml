# Out-of-range real literals and float8 casts raise numeric_value_out_of_range (22003).
id: float4.overflow-22003
title: Overflow and underflow on float4 input raise SQLSTATE 22003
family: float4
tier: core
feature_ids: [float4, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '10e70'::float4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-10e400'::float4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '10e-70'::float4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '10e70'::float8::float4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-10e-70'::float8::float4
    expect: error
    sqlstate: "22003"
