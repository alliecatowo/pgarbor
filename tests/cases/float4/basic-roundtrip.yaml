# Basic float4 storage: insert literals, read back ordered, compare and filter.
id: float4.basic-roundtrip
title: Store and read back real values with ordered and unordered selects
family: float4
tier: slice
feature_ids: [float4, create-table, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
setup: |
  CREATE TABLE float4_tbl (f1 float4);
  INSERT INTO float4_tbl (f1) VALUES ('    0.0'), ('1004.30   '), ('     -34.84    ');
steps:
  - sql: |
      SELECT f1 FROM float4_tbl ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM float4_tbl WHERE f1 = '1004.3'
    expect: rows
    order: multiset
  - sql: |
      SELECT f1 FROM float4_tbl WHERE f1 < '1004.3'
    expect: rows
    order: multiset
