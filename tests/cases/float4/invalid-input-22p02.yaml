# Malformed real literals raise invalid_text_representation (22P02).
id: float4.invalid-input-22p02
title: Malformed float4 literals are rejected with SQLSTATE 22P02
family: float4
tier: core
feature_ids: [float4, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT ''::float4
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'xyz'::float4
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '5.0.0'::float4
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '5 . 0'::float4
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '123            5'::float4
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'NaN x'::float4
    expect: error
    sqlstate: "22P02"
