# pg_input_is_valid and pg_input_error_info report float4 input problems without raising.
id: float4.input-validity-functions
title: pg_input_is_valid and pg_input_error_info classify float4 literals
family: float4
tier: extended
feature_ids: [float4, catalog-introspection]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('34.5', 'float4') AS good, pg_input_is_valid('xyz', 'float4') AS bad
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('1e400', 'float4') AS overflow_valid
    expect: rows
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('1e400', 'float4')
    expect: rows
