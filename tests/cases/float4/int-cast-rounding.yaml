# float4 to integer casts round to nearest and fail when the rounded value leaves the target range.
id: float4.int-cast-rounding
title: float4 to int2 and int4 casts round to nearest and reject out-of-range results
family: float4
tier: core
feature_ids: [float4, numeric, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/float4.sql"
sessions: [a]
steps:
  - sql: |
      SELECT '32767.4'::float4::int2 AS v
    expect: rows
  - sql: |
      SELECT '-32768.4'::float4::int2 AS v
    expect: rows
  - sql: |
      SELECT '32767.6'::float4::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '-32768.6'::float4::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '2147483647'::float4::int4
    expect: error
    sqlstate: "22003"
