# After a rename the old name is free and the new name is the only one that DROP RULE can address.
id: cmd-alter-rule.old-name-gone-after-rename
title: After ALTER RULE, DROP RULE works only with the new name
family: cmd-alter-rule
tier: core
feature_ids: [alter-rule, drop-rule, rename, rules, errors]
required_capabilities: [create-table, create-rule, select, errors, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 alter_rule.sgml#sql-alterrule; sql-droprule.html"
sessions: [a]
setup: |
  CREATE TABLE emp (id int4);
  CREATE RULE old_rule AS ON DELETE TO emp DO INSTEAD NOTHING;
steps:
  - sql: |
      ALTER RULE old_rule ON emp RENAME TO new_rule
    expect: ok
  - sql: |
      DROP RULE old_rule ON emp
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP RULE new_rule ON emp
    expect: ok
  - sql: |
      SELECT count(*) AS remaining FROM pg_rules WHERE tablename = 'emp'
    expect: rows
    order: ordered
