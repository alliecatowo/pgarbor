# pg-regress inet.sql: subnet containment and overlap operators, including a cross-family pair that must be false, not an error.
id: inet.containment-operators
title: inet << <<= >> >>= && operators against cidr, including cross-family pairs
family: inet
tier: core
feature_ids: [inet, cidr, operators]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
setup: |
  CREATE TABLE inet_tbl (id int4 PRIMARY KEY, c cidr, i inet);
  INSERT INTO inet_tbl (id, c, i) VALUES
    (1, '192.168.1.0/24', '192.168.1.226'),
    (2, '192.168.1.0/25', '192.168.1.226/24'),
    (3, '10.0.0.0/8', '10.1.2.3/8'),
    (4, '10.1.2.3/32', '10.1.2.3/32'),
    (5, '::/0', '10.0.0.1'),
    (6, '10:23::8000/113', '10:23::ffff');
steps:
  - sql: |
      SELECT id, i << c AS sb, i <<= c AS sbe, i >> c AS sup, i >>= c AS spe,
        i && c AS ovr, i < c AS lt, i = c AS eq, i <> c AS ne
      FROM inet_tbl ORDER BY id
    expect: rows
    order: ordered
