# pg-regress inet.sql: inet offset arithmetic that leaves the representable range fails with 22003, but IPv6 with the same offset does not.
id: inet.add-overflow-errors
title: inet arithmetic overflow raises out-of-range errors, IPv6 headroom does not
family: inet
tier: core
feature_ids: [inet, operators, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
steps:
  - sql: |
      SELECT '127.0.0.1'::inet + 10000000000
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '127.0.0.1'::inet - 10000000000
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '126::1'::inet - '127::2'::inet
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT '127::1'::inet + 10000000000
    expect: rows
  - sql: |
      SELECT '127::1'::inet - '127::2'::inet
    expect: rows
