# pg-regress inet.sql: cidr/inet input and output over a mixed IPv4/IPv6 table.
id: inet.input-output
title: cidr and inet columns accept IPv4 and IPv6 literals and print them back
family: inet
tier: core
feature_ids: [inet, cidr, input-output]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
setup: |
  CREATE TABLE inet_tbl (id int4 PRIMARY KEY, c cidr, i inet);
  INSERT INTO inet_tbl (id, c, i) VALUES
    (1, '192.168.1', '192.168.1.226/24'),
    (2, '192.168.1.0/26', '192.168.1.226'),
    (3, '10', '10.1.2.3/8'),
    (4, '10.1.2.3', '10.1.2.3/32'),
    (5, '10:23::f1', '10:23::f1/64'),
    (6, '::ffff:1.2.3.4', '::4.3.2.1/24');
steps:
  - sql: |
      SELECT id, c AS cidr, i AS inet FROM inet_tbl ORDER BY id
    expect: rows
    order: ordered
