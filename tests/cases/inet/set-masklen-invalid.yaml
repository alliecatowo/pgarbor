# pg-regress inet.sql: a mask length above the family maximum is rejected with 22023.
id: inet.set-masklen-invalid
title: set_masklen rejects a mask length of 33 on IPv4 for both inet and cidr
family: inet
tier: core
feature_ids: [inet, cidr, functions, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
steps:
  - sql: |
      SELECT set_masklen(inet '192.168.1.226/24', 33)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT set_masklen(cidr '192.168.1.0/24', 33)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT set_masklen(inet '192.168.1.226/24', -1)
    expect: rows
    comment: -1 is accepted and selects the maximum mask length
