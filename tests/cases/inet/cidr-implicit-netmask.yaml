# pg-regress inet.sql: cidr input with implied netmasks, and abbrev() on both types.
id: inet.cidr-implicit-netmask
title: cidr literals with omitted octets get classful netmasks
family: inet
tier: core
feature_ids: [inet, cidr, input-output, functions]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
steps:
  - sql: |
      SELECT '10'::cidr AS a, '10.1'::cidr AS b, '192.168.1'::cidr AS c,
        '10.1.2'::cidr AS d, '10:23::8000/113'::cidr AS e, '10:23::ffff'::inet AS f,
        abbrev('10.0.0.0/8'::cidr) AS g, abbrev('10.1.2.3/8'::inet) AS h
    expect: rows
