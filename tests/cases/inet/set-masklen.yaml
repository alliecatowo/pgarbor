# pg-regress inet.sql: set_masklen on text round-trips; -1 means the maximum mask length for the family.
id: inet.set-masklen
title: set_masklen changes the netmask, and -1 selects the family maximum
family: inet
tier: core
feature_ids: [inet, cidr, functions]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
setup: |
  CREATE TABLE inet_tbl (id int4 PRIMARY KEY, c cidr, i inet);
  INSERT INTO inet_tbl (id, c, i) VALUES
    (1, '192.168.1', '192.168.1.226/24'),
    (2, '10', '10.1.2.3/8'),
    (3, '10.1.2.3', '10.1.2.3/32');
steps:
  - sql: |
      SELECT id,
        set_masklen(cidr(text(c)), 24) AS cidr24,
        set_masklen(inet(text(i)), 24) AS inet24,
        set_masklen(cidr(text(c)), -1) AS cidrmax,
        set_masklen(inet(text(i)), -1) AS inetmax
      FROM inet_tbl ORDER BY id
    expect: any
    order: ordered
    comment: result values not asserted; the recorder captures them
