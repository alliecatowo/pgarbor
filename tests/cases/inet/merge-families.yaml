# pg-regress inet.sql: inet_merge across address families fails with 22023; inet_same_family() filters the bad row out.
id: inet.merge-families
title: inet_merge rejects mixed IPv4 and IPv6 rows until inet_same_family filters them
family: inet
tier: core
feature_ids: [inet, cidr, functions, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
setup: |
  CREATE TABLE inet_tbl (id int4 PRIMARY KEY, c cidr, i inet);
  INSERT INTO inet_tbl (id, c, i) VALUES
    (1, '10', '10.1.2.3/8'),
    (2, '192.168.1', '192.168.1.226/24'),
    (3, '10', '10::/8');
steps:
  - sql: |
      SELECT inet_merge(c, i) FROM inet_tbl
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT id, inet_merge(c, i) AS merged FROM inet_tbl WHERE inet_same_family(c, i) ORDER BY id
    expect: rows
    order: ordered
