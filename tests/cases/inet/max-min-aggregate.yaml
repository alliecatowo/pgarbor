# pg-regress inet.sql: max/min over inet and cidr columns with mixed families.
id: inet.max-min-aggregate
title: max and min over inet and cidr columns with mixed IPv4 and IPv6 values
family: inet
tier: core
feature_ids: [inet, cidr, aggregates]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
setup: |
  CREATE TABLE inet_tbl (id int4 PRIMARY KEY, c cidr, i inet);
  INSERT INTO inet_tbl (id, c, i) VALUES
    (1, '10', '10.1.2.3/8'),
    (2, '192.168.1', '192.168.1.226/24'),
    (3, '10:23::f1', '10:23::f1/64'),
    (4, '::ffff:1.2.3.4', '::4.3.2.1/24');
steps:
  - sql: |
      SELECT max(i) AS max_i, min(i) AS min_i, max(c) AS max_c, min(c) AS min_c FROM inet_tbl
    expect: rows
    order: multiset
