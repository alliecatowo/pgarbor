# pg-regress inet.sql: host/text/family/abbrev/broadcast/network/masklen/netmask/hostmask over one table.
id: inet.support-functions
title: Address inspection functions on inet and cidr columns
family: inet
tier: core
feature_ids: [inet, cidr, functions]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
setup: |
  CREATE TABLE inet_tbl (id int4 PRIMARY KEY, c cidr, i inet);
  INSERT INTO inet_tbl (id, c, i) VALUES
    (1, '192.168.1', '192.168.1.226/24'),
    (2, '10', '10.1.2.3/8'),
    (3, '10:23::f1', '10:23::f1/64'),
    (4, '10.1.2.3', '10.1.2.3/32'),
    (5, '10.1.2', '10.1.2.3/24');
steps:
  - sql: |
      SELECT id, host(i), text(i), family(i), abbrev(c), abbrev(i),
        broadcast(c), broadcast(i), network(c), network(i),
        masklen(c), masklen(i), netmask(i), hostmask(i)
      FROM inet_tbl ORDER BY id
    expect: rows
    order: ordered
