# pg-regress inet.sql: malformed inet and cidr literals fail with 22P02; a valid literal right after still works.
id: inet.invalid-inet-input
title: Malformed inet and cidr literals raise invalid text representation errors
family: inet
tier: core
feature_ids: [inet, cidr, input-output, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
steps:
  - sql: |
      SELECT inet '192.168.1.0/33'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT inet '1234::1234::1234'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT cidr '192.168.1.2/30'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT inet '192.168.1.226/24' AS still_ok
    expect: rows
