# pg-regress inet.sql: pg_input_is_valid and pg_input_error_info report cidr/inet input errors without raising.
id: inet.pg-input-functions
title: pg_input_is_valid and pg_input_error_info report cidr and inet input failures
family: inet
tier: core
feature_ids: [inet, cidr, errors, functions]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
steps:
  - sql: |
      SELECT pg_input_is_valid('1234', 'cidr') AS v1, pg_input_is_valid('192.168.198.200/24', 'cidr') AS v2, pg_input_is_valid('1234', 'inet') AS v3
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('1234', 'cidr')
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('192.168.198.200/24', 'cidr')
    expect: rows
  - sql: |
      SELECT * FROM pg_input_error_info('1234', 'inet')
    expect: rows
