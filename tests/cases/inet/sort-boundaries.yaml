# pg-regress inet.sql: ORDER BY over boundary inet values (mask 0, mask 32/128, IPv4 and IPv6 mixed), with no ties.
id: inet.sort-boundaries
title: ORDER BY over inet boundary values orders by address then netmask
family: inet
tier: extended
feature_ids: [inet, sorting, order-by]
required_capabilities: [select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
steps:
  - sql: |
      SELECT a FROM (VALUES
        ('0.0.0.0/0'::inet), ('0.0.0.0/1'::inet), ('0.0.0.0/32'::inet), ('0.0.0.1/0'::inet),
        ('127.126.127.127/0'::inet), ('127.128.127.127/0'::inet),
        ('192.168.1.0/24'::inet), ('192.168.1.0/25'::inet), ('192.168.1.1/23'::inet),
        ('192.168.1.255/5'::inet), ('255.255.255.254/32'::inet), ('255.255.255.255/0'::inet),
        ('255.255.255.255/32'::inet),
        ('10:23::f1/64'::inet), ('10:23::ffff'::inet), ('127::1'::inet),
        ('ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff/0'::inet),
        ('ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff/128'::inet)
      ) AS i(a) ORDER BY a
    expect: rows
    order: ordered
