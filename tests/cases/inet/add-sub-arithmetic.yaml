# pg-regress inet.sql: inet +/- integer and inet - inet, valid in-range cases on IPv4 and IPv6.
id: inet.add-sub-arithmetic
title: inet plus and minus integers and inet minus inet within range
family: inet
tier: core
feature_ids: [inet, operators, numeric]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
steps:
  - sql: |
      SELECT '127.0.0.1'::inet + 257 AS a,
        ('127.0.0.1'::inet + 257) - 257 AS b,
        '127::1'::inet + 257 AS c,
        ('127::1'::inet + 257) - 257 AS d,
        '127.0.0.2'::inet - ('127.0.0.2'::inet + 500) AS e,
        '127.0.0.2'::inet - ('127.0.0.2'::inet - 500) AS f,
        '127::2'::inet - ('127::2'::inet + 500) AS g,
        '127::2'::inet - ('127::2'::inet - 500) AS h
    expect: rows
