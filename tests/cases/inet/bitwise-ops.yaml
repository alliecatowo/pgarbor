# pg-regress inet.sql: bitwise NOT/AND/OR and integer add/subtract on same-family IPv4 addresses.
id: inet.bitwise-ops
title: inet bitwise NOT, AND, OR and integer offset arithmetic on IPv4 values
family: inet
tier: core
feature_ids: [inet, cidr, operators, numeric]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/inet.sql"
setup: |
  CREATE TABLE inet_tbl (id int4 PRIMARY KEY, c cidr, i inet);
  INSERT INTO inet_tbl (id, c, i) VALUES
    (1, '192.168.1', '192.168.1.226/24'),
    (2, '10', '10.1.2.3/8'),
    (3, '10.1.2.3', '10.1.2.3/32'),
    (4, '192.168.1.0/26', '192.168.1.226');
steps:
  - sql: |
      SELECT id, ~i AS notv4, i & c AS andv4, i | c AS orv4,
        i + 500 AS plus500, i - 500 AS minus500, i - c AS minus
      FROM inet_tbl ORDER BY id
    expect: rows
    order: ordered
