# GiST index storage options that PostgreSQL accepts: buffering on/off/auto and fillfactor.
id: gist.index-options-valid
title: GiST buffering and fillfactor options are accepted at CREATE and DROP INDEX
family: gist
tier: core
feature_ids: [gist, create-index, drop-index, index-options]
required_capabilities: [create-table, create-index, gist-index, point-type, drop-index]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/gist.sql"
sessions: [a]
setup: |
  CREATE TABLE opt_pts (id int4, p point);
steps:
  - sql: |
      CREATE INDEX opt_p1 ON opt_pts USING gist (p) WITH (buffering = on, fillfactor = 50)
    expect: ok
  - sql: |
      CREATE INDEX opt_p2 ON opt_pts USING gist (p) WITH (buffering = off)
    expect: ok
  - sql: |
      CREATE INDEX opt_p3 ON opt_pts USING gist (p) WITH (buffering = auto)
    expect: ok
  - sql: |
      DROP INDEX opt_p1, opt_p2, opt_p3
    expect: ok
  - sql: |
      SELECT count(*) FROM opt_pts
    expect: rows
    order: multiset
    comment: table is untouched by index DDL and still empty
