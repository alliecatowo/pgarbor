# GiST fillfactor is an integer reloption bounded to 10..100; values outside are refused.
id: gist.fillfactor-bounds
title: GiST fillfactor accepts 10 and 100 and rejects 9 and 101
family: gist
tier: core
feature_ids: [gist, create-index, index-options, errors]
required_capabilities: [create-table, create-index, gist-index, point-type, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/gist.sql"
sessions: [a]
setup: |
  CREATE TABLE ff_pts (id int4, p point);
steps:
  - sql: |
      CREATE INDEX ff_p ON ff_pts USING gist (p) WITH (fillfactor = 9)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE INDEX ff_p ON ff_pts USING gist (p) WITH (fillfactor = 101)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE INDEX ff_lo ON ff_pts USING gist (p) WITH (fillfactor = 10)
    expect: ok
    comment: lower boundary is inclusive
  - sql: |
      CREATE INDEX ff_hi ON ff_pts USING gist (p) WITH (fillfactor = 100)
    expect: ok
    comment: upper boundary is inclusive
