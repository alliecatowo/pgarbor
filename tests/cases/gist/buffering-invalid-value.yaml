# An unknown enum value for the GiST buffering option is refused; a missing index is refused on DROP.
id: gist.buffering-invalid-value
title: Invalid GiST buffering value is rejected with invalid_parameter_value
family: gist
tier: core
feature_ids: [gist, create-index, index-options, errors]
required_capabilities: [create-table, create-index, gist-index, point-type, drop-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/gist.sql"
sessions: [a]
setup: |
  CREATE TABLE bad_opt (id int4, p point);
steps:
  - sql: |
      CREATE INDEX bad_opt_p ON bad_opt USING gist (p) WITH (buffering = invalid_value)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE INDEX bad_opt_p ON bad_opt USING gist (p)
    expect: ok
    comment: the failed statement must not leave the index name behind
  - sql: |
      DROP INDEX bad_opt_p_missing
    expect: error
    sqlstate: "42704"
