# GiST index on a point column; containment search with the <@ operator against a box.
id: gist.point-search-basic
title: GiST point index answers box containment searches
family: gist
tier: core
feature_ids: [gist, create-index, point, geometric-operators, select]
required_capabilities: [create-table, insert, select, create-index, gist-index, point-type, box-type, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/gist.sql"
sessions: [a]
setup: |
  CREATE TABLE pts (id int4 PRIMARY KEY, p point);
  INSERT INTO pts VALUES (1, point(0,0)), (2, point(1,1)), (3, point(5,5)), (4, point(10,10)), (5, point(0.5,0.5)), (6, point(-3,2));
  CREATE INDEX pts_p_gist ON pts USING gist (p);
steps:
  - sql: |
      SELECT id FROM pts WHERE p <@ box(point(0,0), point(1,1)) ORDER BY id
    expect: rows
    order: ordered
    comment: boundary points (0,0) and (1,1) are contained
  - sql: |
      SELECT id FROM pts WHERE p <@ box(point(4,4), point(11,11)) ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id, p FROM pts WHERE p <@ box(point(100,100), point(200,200))
    expect: rows
    order: multiset
    comment: empty result set
  - sql: |
      SELECT id FROM pts WHERE p <@ box(point(-10,-10), point(0,3)) ORDER BY id
    expect: rows
    order: ordered
