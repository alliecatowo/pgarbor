# A column type with no GiST default operator class is refused with undefined_object.
id: gist.error-no-default-opclass
title: GiST index on json column fails with no default operator class
family: gist
tier: core
feature_ids: [gist, create-index, errors, json]
required_capabilities: [create-table, create-index, gist-index, point-type, json-type, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/gist.sql"
sessions: [a]
setup: |
  CREATE TABLE jt (j json, p point);
steps:
  - sql: |
      CREATE INDEX jt_j ON jt USING gist (j)
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE INDEX jt_p ON jt USING gist (p)
    expect: ok
    comment: the same table still accepts a GiST index on the point column
