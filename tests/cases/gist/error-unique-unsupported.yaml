# GiST does not support unique indexes; a missing table is refused with undefined_table.
id: gist.error-unique-unsupported
title: CREATE UNIQUE INDEX USING gist is refused and missing tables are reported
family: gist
tier: core
feature_ids: [gist, create-index, unique-index, errors]
required_capabilities: [create-table, create-index, gist-index, point-type, errors]
provenance:
  source: hand
  ref: "PG18 docs indexes-types; errcodes 0A000, 42P01"
sessions: [a]
setup: |
  CREATE TABLE uq (p point);
steps:
  - sql: |
      CREATE UNIQUE INDEX uq_p ON uq USING gist (p)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE INDEX uq_p ON uq USING gist (p)
    expect: ok
    comment: the failed unique attempt must not leave the index behind
  - sql: |
      CREATE INDEX uq_missing ON no_such_table USING gist (p)
    expect: error
    sqlstate: "42P01"
