# Only the owner, the schema owner, or a superuser may drop a statistics object.
id: cmd-drop-statistics.owner-required-quarantined
title: Non-owner DROP STATISTICS is denied with insufficient_privilege
family: cmd-drop-statistics
tier: extended
feature_ids: [drop-statistics, privileges, extended-statistics]
required_capabilities: [create-table, extended-statistics, drop-statistics, roles, set-role]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_statistics.sgml#sql-dropstatistics (Description)"
quarantine:
  reason: "needs a non-superuser role; CREATE ROLE is cluster-wide and the oracle runs single isolated databases, so the role would leak across cases"
  since: "2026-10-15"
sessions: [a]
setup: |
  CREATE TABLE ds_own (a int, b int);
  CREATE STATISTICS ds_own_s ON a, b FROM ds_own;
steps:
  - sql: |
      SET ROLE ds_nonowner
    expect: error
  - sql: |
      DROP STATISTICS ds_own_s
    expect: error
    sqlstate: "42501"
