# Naming the same statistics object twice in one command is accepted; the object is dropped once.
id: cmd-drop-statistics.duplicate-name-in-list
title: Same statistics name listed twice in one DROP STATISTICS succeeds
family: cmd-drop-statistics
tier: extended
feature_ids: [drop-statistics, extended-statistics]
required_capabilities: [create-table, extended-statistics, drop-statistics]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_statistics.sgml#sql-dropstatistics (Synopsis: name [, ...])"
sessions: [a]
setup: |
  CREATE TABLE ds_dup (a int, b int);
  CREATE STATISTICS ds_dup_s ON a, b FROM ds_dup;
steps:
  - sql: |
      DROP STATISTICS ds_dup_s, ds_dup_s
    expect: ok
    comment: "observed behavior: the duplicate entry is collapsed, not reported as missing"
  - sql: |
      SELECT count(*) FROM pg_statistic_ext WHERE stxname = 'ds_dup_s'
    expect: rows
