# The name list is required, and CASCADE/RESTRICT must follow the list.
id: cmd-drop-statistics.syntax-errors
title: DROP STATISTICS without a name, and a keyword placed before more names, are syntax errors
family: cmd-drop-statistics
tier: core
feature_ids: [drop-statistics, syntax]
required_capabilities: [create-table, extended-statistics, drop-statistics]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_statistics.sgml#sql-dropstatistics (Synopsis)"
sessions: [a]
setup: |
  CREATE TABLE ds_syn (a int, b int);
  CREATE STATISTICS ds_syn_s ON a, b FROM ds_syn;
steps:
  - sql: |
      DROP STATISTICS
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP STATISTICS IF EXISTS
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP STATISTICS IF EXISTS ds_syn_s CASCADE, ds_nope RESTRICT
    expect: error
    sqlstate: "42601"
    comment: CASCADE/RESTRICT must come after the whole list
  - sql: |
      SELECT count(*) FROM pg_statistic_ext WHERE stxname = 'ds_syn_s'
    expect: rows
    comment: nothing was dropped by the rejected statements
