# Statistics on expressions are dropped by name like any other statistics object.
id: cmd-drop-statistics.expression-statistics-drop
title: DROP STATISTICS removes an expression-based statistics object
family: cmd-drop-statistics
tier: extended
feature_ids: [drop-statistics, extended-statistics, expression-statistics]
required_capabilities: [create-table, extended-statistics, drop-statistics, catalog-introspection]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_statistics.sgml#sql-dropstatistics; create_statistics.sgml (expressions)"
sessions: [a]
setup: |
  CREATE TABLE ds_expr (a int, name text);
  CREATE STATISTICS ds_expr_s ON (a * 2), (length(name)) FROM ds_expr;
steps:
  - sql: |
      SELECT count(*) FROM pg_statistic_ext WHERE stxname = 'ds_expr_s'
    expect: rows
  - sql: |
      DROP STATISTICS ds_expr_s
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_statistic_ext WHERE stxname = 'ds_expr_s'
    expect: rows
  - sql: |
      DROP STATISTICS ds_expr_s
    expect: error
    sqlstate: "42704"
