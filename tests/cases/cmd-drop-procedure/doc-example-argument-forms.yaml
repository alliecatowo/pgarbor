# Each documented argument-list spelling of do_db_maintenance drops the procedure; the (text, text)
# form is only ambiguous when a second overload exists.
id: cmd-drop-procedure.doc-example-argument-forms
title: The five documented DROP PROCEDURE argument-list spellings for one procedure
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, inout-arguments, argmode-lookup]
required_capabilities: [create-procedure, drop-procedure, plpgsql, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure-examples (any one of these commands would work)"
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE do_db_maintenance(IN target_schema text, OUT results text) LANGUAGE plpgsql AS $$
      BEGIN results := target_schema; END $$
    expect: ok
  - sql: |
      DROP PROCEDURE do_db_maintenance(IN target_schema text, OUT results text)
    expect: ok
  - sql: |
      CREATE PROCEDURE do_db_maintenance(IN target_schema text, OUT results text) LANGUAGE plpgsql AS $$
      BEGIN results := target_schema; END $$
    expect: ok
  - sql: |
      DROP PROCEDURE do_db_maintenance(IN text, OUT text)
    expect: ok
  - sql: |
      CREATE PROCEDURE do_db_maintenance(IN target_schema text, OUT results text) LANGUAGE plpgsql AS $$
      BEGIN results := target_schema; END $$
    expect: ok
  - sql: |
      DROP PROCEDURE do_db_maintenance(IN text)
    expect: ok
    comment: OUT parameters are not part of the input-argument list
  - sql: |
      CREATE PROCEDURE do_db_maintenance(IN target_schema text, OUT results text) LANGUAGE plpgsql AS $$
      BEGIN results := target_schema; END $$
    expect: ok
  - sql: |
      DROP PROCEDURE do_db_maintenance(text)
    expect: ok
  - sql: |
      CREATE PROCEDURE do_db_maintenance(IN target_schema text, OUT results text) LANGUAGE plpgsql AS $$
      BEGIN results := target_schema; END $$
    expect: ok
  - sql: |
      DROP PROCEDURE do_db_maintenance(text, text)
    expect: ok
    comment: no second overload exists, so the all-arguments reading matches uniquely
  - sql: |
      SELECT count(*) AS procs FROM pg_proc WHERE proname = 'do_db_maintenance'
    expect: rows
    order: multiset
