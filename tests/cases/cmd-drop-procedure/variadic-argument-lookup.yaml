# A VARIADIC parameter is found by its element-array type even without the VARIADIC keyword, and
# the VARIADIC spelling also matches.
id: cmd-drop-procedure.variadic-argument-lookup
title: DROP PROCEDURE matches a VARIADIC parameter by array type with or without the keyword
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, variadic-arguments, errors]
required_capabilities: [create-procedure, drop-procedure, plpgsql, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (argmode VARIADIC)"
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE pvar(VARIADIC xs int[]) LANGUAGE plpgsql AS $$ BEGIN NULL; END $$
    expect: ok
  - sql: |
      DROP PROCEDURE pvar(int[])
    expect: ok
  - sql: |
      CREATE PROCEDURE pvar(VARIADIC xs int[]) LANGUAGE plpgsql AS $$ BEGIN NULL; END $$
    expect: ok
  - sql: |
      DROP PROCEDURE pvar(VARIADIC int[])
    expect: ok
  - sql: |
      DROP PROCEDURE pvar(int[])
    expect: error
    sqlstate: "42883"
    comment: nothing is left to drop
