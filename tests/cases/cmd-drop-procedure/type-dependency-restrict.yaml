# A procedure depends on its argument types: the type cannot be dropped until the procedure is,
# and dropping the procedure does not drop the type.
id: cmd-drop-procedure.type-dependency-restrict
title: Procedure argument type dependency blocks DROP TYPE until DROP PROCEDURE
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, create-type, ddl-depend, errors]
required_capabilities: [create-type, create-procedure, drop-procedure, drop-type, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (RESTRICT); doc/src/sgml/ddl.sgml#ddl-depend"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE tyy AS (a int)
    expect: ok
  - sql: |
      CREATE PROCEDURE pt(x tyy) LANGUAGE plpgsql AS $$ BEGIN NULL; END $$
    expect: ok
  - sql: |
      DROP TYPE tyy
    expect: error
    sqlstate: "2BP01"
    comment: the procedure depends on the type
  - sql: |
      DROP PROCEDURE pt
    expect: ok
  - sql: |
      DROP TYPE tyy
    expect: ok
