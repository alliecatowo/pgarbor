# Naming the same procedure twice in one DROP PROCEDURE command is accepted and drops it once.
id: cmd-drop-procedure.duplicate-name-in-one-command
title: DROP PROCEDURE listing the same signature twice in one command
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, call]
required_capabilities: [create-procedure, drop-procedure, call, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (name [, ...]); behaviour observed on PG 18.6 oracle"
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE pdup(int) LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      DROP PROCEDURE pdup(int), pdup(int)
    expect: ok
  - sql: |
      CALL pdup(1)
    expect: error
    sqlstate: "42883"
