# Malformed DROP PROCEDURE statements are syntax errors and change nothing.
id: cmd-drop-procedure.syntax-errors
title: DROP PROCEDURE syntax errors for missing names, trailing commas and conflicting clauses
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, errors]
required_capabilities: [create-procedure, drop-procedure, call, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (synopsis)"
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE psyn(int) LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      DROP PROCEDURE
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP PROCEDURE psyn(int,)
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP PROCEDURE psyn(int) CASCADE RESTRICT
    expect: error
    sqlstate: "42601"
  - sql: |
      CALL psyn(1)
    expect: ok
    comment: no syntax error dropped the procedure
