# After DROP PROCEDURE the same signature can be created again with a new body, and calls use the new body.
id: cmd-drop-procedure.recreate-after-drop
title: Recreate a dropped procedure with the same signature and a different body
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, call, plpgsql]
required_capabilities: [create-table, insert, select, create-procedure, drop-procedure, call, plpgsql]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (drop then recreate)"
sessions: [a]
setup: |
  CREATE TABLE log (v int)
steps:
  - sql: |
      CREATE PROCEDURE prc(x int) LANGUAGE plpgsql AS $$ BEGIN INSERT INTO log VALUES (x); END $$
    expect: ok
  - sql: |
      CALL prc(1)
    expect: ok
  - sql: |
      DROP PROCEDURE prc(int)
    expect: ok
  - sql: |
      CREATE PROCEDURE prc(x int) LANGUAGE plpgsql AS $$ BEGIN INSERT INTO log VALUES (x * 10); END $$
    expect: ok
  - sql: |
      CALL prc(2)
    expect: ok
  - sql: |
      SELECT v FROM log ORDER BY v
    expect: rows
    order: ordered
