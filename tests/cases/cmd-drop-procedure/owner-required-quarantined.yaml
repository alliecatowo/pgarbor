# Only the owner may drop a procedure; this needs a non-superuser role and cluster-level CREATE ROLE.
id: cmd-drop-procedure.owner-required-quarantined
title: DROP PROCEDURE requires ownership, quarantined until a second role can be used
family: cmd-drop-procedure
tier: extended
feature_ids: [drop-procedure, create-procedure, privileges, roles]
required_capabilities: [create-procedure, drop-procedure, roles, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (To execute this command the user must be the owner)"
sessions: [a]
quarantine:
  reason: needs a second non-superuser role (CREATE ROLE is cluster-wide, not isolated to one database)
steps:
  - sql: |
      SELECT 1
    expect: ok
