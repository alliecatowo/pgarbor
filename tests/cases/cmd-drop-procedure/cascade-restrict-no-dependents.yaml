# CASCADE and RESTRICT are both accepted; with no dependent objects both succeed, and listing both is a syntax error.
id: cmd-drop-procedure.cascade-restrict-no-dependents
title: CASCADE and RESTRICT on procedures with no dependents, and invalid combination
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, cascade, restrict]
required_capabilities: [create-procedure, drop-procedure, call, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (CASCADE, RESTRICT)"
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE pc1() LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      CREATE PROCEDURE pc2() LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      CREATE PROCEDURE pc3() LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      DROP PROCEDURE pc1 CASCADE
    expect: ok
  - sql: |
      DROP PROCEDURE pc2 RESTRICT
    expect: ok
    comment: RESTRICT is the default; it only refuses when something depends on the procedure
  - sql: |
      DROP PROCEDURE pc3
    expect: ok
  - sql: |
      CREATE PROCEDURE pc4() LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      DROP PROCEDURE pc4 CASCADE RESTRICT
    expect: error
    sqlstate: "42601"
  - sql: |
      CALL pc4()
    expect: ok
    comment: the rejected statement dropped nothing
