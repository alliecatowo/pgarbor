# A schema-qualified name finds only that schema's procedure; an unqualified name uses the search path.
id: cmd-drop-procedure.schema-qualified-name
title: DROP PROCEDURE with schema-qualified and search-path-dependent names
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, schema, search-path]
required_capabilities: [create-schema, create-procedure, drop-procedure, call, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (name, optionally schema-qualified)"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s1
    expect: ok
  - sql: |
      CREATE PROCEDURE s1.psch(int) LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      DROP PROCEDURE psch(int)
    expect: error
    sqlstate: "42883"
    comment: s1 is not on the search path
  - sql: |
      DROP PROCEDURE nosch.nosuch()
    expect: error
    sqlstate: "3F000"
    comment: a missing schema is reported as invalid schema name
  - sql: |
      DROP PROCEDURE s1.psch(int)
    expect: ok
  - sql: |
      CALL s1.psch(1)
    expect: error
    sqlstate: "42883"
