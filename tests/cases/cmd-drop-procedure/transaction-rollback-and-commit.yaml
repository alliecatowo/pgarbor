# DROP PROCEDURE is transactional: ROLLBACK restores the procedure, COMMIT removes it.
id: cmd-drop-procedure.transaction-rollback-and-commit
title: DROP PROCEDURE inside explicit transactions, rolled back and committed
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, create-procedure, call, transactions]
required_capabilities: [create-procedure, drop-procedure, call, transactions, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure; transactional DDL (PG 18 catalog semantics)"
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE ptx() LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP PROCEDURE ptx()
    expect: ok
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      CALL ptx()
    expect: ok
    comment: rollback restored the procedure
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP PROCEDURE ptx()
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      CALL ptx()
    expect: error
    sqlstate: "42883"
