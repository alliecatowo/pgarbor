# IF EXISTS turns a missing procedure into a notice rather than an error, including on argument mismatch.
id: cmd-drop-procedure.if-exists-notice
title: DROP PROCEDURE IF EXISTS on missing names, mismatched arguments and present procedures
family: cmd-drop-procedure
tier: core
feature_ids: [drop-procedure, drop-if-exists, create-procedure]
required_capabilities: [create-procedure, drop-procedure, plpgsql, notice]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_procedure.sgml#sql-dropprocedure (IF EXISTS parameter)"
sessions: [a]
steps:
  - sql: |
      CREATE PROCEDURE p_ifx(a int) LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      DROP PROCEDURE IF EXISTS nosuch
    expect: notice
  - sql: |
      DROP PROCEDURE IF EXISTS nosuch(int, text)
    expect: notice
  - sql: |
      DROP PROCEDURE IF EXISTS public.nosuch()
    expect: notice
  - sql: |
      DROP PROCEDURE IF EXISTS p_ifx(text)
    expect: notice
    comment: the name exists but the argument types do not match
  - sql: |
      DROP PROCEDURE IF EXISTS p_ifx(int)
    expect: ok
  - sql: |
      DROP PROCEDURE IF EXISTS p_ifx(int)
    expect: notice
    comment: already dropped, so the second attempt only notices
