# A RESET on a customized placeholder variable leaves it defined with an empty value; a never-set one stays undefined.
id: cmd-reset.custom-placeholder-cleared
title: RESET of a custom placeholder parameter yields an empty string, not NULL
family: cmd-reset
tier: core
feature_ids: [reset, custom-parameters, current-setting]
required_capabilities: [select, guc, custom-guc]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Parameters: configuration_parameter); runtime-config-custom"
sessions: [a]
steps:
  - sql: |
      SET cmdreset.placeholder = 'bar'
    expect: ok
  - sql: |
      RESET cmdreset.placeholder
    expect: ok
  - sql: |
      SELECT current_setting('cmdreset.placeholder', true) IS NOT NULL AS defined,
             length(current_setting('cmdreset.placeholder', true)) AS len
    expect: rows
    comment: defined is true and len is 0
  - sql: |
      SELECT current_setting('cmdreset.never_set', true) IS NULL AS never_defined
    expect: rows
    comment: never set, so missing_ok returns NULL
