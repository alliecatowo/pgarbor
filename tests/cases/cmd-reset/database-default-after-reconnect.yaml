# The default that RESET restores can come from a per-database setting, not only the compiled-in or config-file value.
id: cmd-reset.database-default-after-reconnect
title: RESET restores a per-database default set with ALTER DATABASE
family: cmd-reset
tier: extended
feature_ids: [reset, alter-database, set, guc]
required_capabilities: [select, guc, alter-database]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description: per-database or per-user default settings)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN
        EXECUTE format('ALTER DATABASE %I SET extra_float_digits = 2', current_database());
      END $$
    expect: ok
  - reconnect: true
  - sql: |
      SELECT current_setting('extra_float_digits') AS new_session_default
    expect: rows
    comment: a new session gets the database default 2
  - sql: |
      SET extra_float_digits = 3
    expect: ok
  - sql: |
      RESET extra_float_digits
    expect: ok
  - sql: |
      SELECT current_setting('extra_float_digits') AS after_reset
    expect: rows
    comment: RESET goes to the database default 2, not the built-in 1
  - sql: |
      DO $$ BEGIN
        EXECUTE format('ALTER DATABASE %I RESET extra_float_digits', current_database());
      END $$
    expect: ok
    comment: cleanup of the per-database setting
