# RESET returns a parameter to the value it would have had if SET had never been issued in the session.
id: cmd-reset.restores-default-after-set
title: RESET restores IntervalStyle to its default after SET
family: cmd-reset
tier: core
feature_ids: [reset, set, guc, intervalstyle]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description; Parameters: configuration_parameter)"
sessions: [a]
steps:
  - sql: |
      SELECT current_setting('IntervalStyle') AS initial
    expect: rows
  - sql: |
      SET IntervalStyle = 'sql_standard'
    expect: ok
  - sql: |
      SELECT current_setting('IntervalStyle') AS after_set
    expect: rows
    comment: must show sql_standard
  - sql: |
      RESET IntervalStyle
    expect: ok
  - sql: |
      SELECT current_setting('IntervalStyle') AS after_reset
    expect: rows
    comment: must equal initial
