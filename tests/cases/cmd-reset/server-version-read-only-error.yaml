# server_version is internal and cannot be changed, not even by RESET: error 55P02.
id: cmd-reset.server-version-read-only-error
title: RESET of an internal read-only parameter fails with 55P02
family: cmd-reset
tier: core
feature_ids: [reset, errors, guc]
required_capabilities: [select, guc, errors, error-sqlstate]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Parameters: configuration_parameter; settable run-time parameters)"
sessions: [a]
steps:
  - sql: |
      RESET server_version
    expect: error
    sqlstate: "55P02"
  - sql: |
      SELECT current_setting('server_version') IS NOT NULL AS still_readable
    expect: rows
