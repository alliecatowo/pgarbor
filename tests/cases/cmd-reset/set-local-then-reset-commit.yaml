# RESET inside a transaction that commits replaces the session value; SET LOCAL is discarded either way.
id: cmd-reset.set-local-then-reset-commit
title: RESET after SET LOCAL inside a committed transaction clears the earlier session SET
family: cmd-reset
tier: core
feature_ids: [reset, set-local, set, transactions]
required_capabilities: [select, guc, transactions]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description: default value; transactional behavior)"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      BEGIN;
      SET LOCAL DateStyle = 'German';
      RESET DateStyle;
      SELECT current_setting('DateStyle') AS in_tx;
      COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('DateStyle') AS after_commit
    expect: rows
    comment: committed RESET takes effect as a session change, so the default ISO, MDY is back
