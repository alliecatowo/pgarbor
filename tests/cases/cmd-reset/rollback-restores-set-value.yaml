# RESET is transactional like SET: a rollback undoes it, so the value set earlier in the session comes back.
id: cmd-reset.rollback-restores-set-value
title: ROLLBACK after RESET restores the session value set before BEGIN
family: cmd-reset
tier: core
feature_ids: [reset, set, transactions, rollback]
required_capabilities: [select, guc, transactions]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description: transactional behavior)"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      BEGIN;
      RESET DateStyle;
      SELECT current_setting('DateStyle') AS in_tx;
      ROLLBACK
    expect: ok
  - sql: |
      SELECT current_setting('DateStyle') AS after_rollback
    expect: rows
    comment: must still be SQL, DMY
