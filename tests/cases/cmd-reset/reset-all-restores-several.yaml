# RESET ALL resets every settable run-time parameter touched in the session to its default.
id: cmd-reset.all-restores-several
title: RESET ALL restores several parameters to their defaults in one statement
family: cmd-reset
tier: core
feature_ids: [reset, reset-all, set, guc]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Parameters: ALL)"
sessions: [a]
steps:
  - sql: |
      SET extra_float_digits = 3;
      SET statement_timeout = '5s';
      SET IntervalStyle = 'sql_standard';
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      RESET ALL
    expect: ok
  - sql: |
      SELECT current_setting('extra_float_digits') AS efd,
             current_setting('statement_timeout') AS st,
             current_setting('IntervalStyle') AS istyle,
             current_setting('DateStyle') AS dstyle
    expect: rows
    comment: efd 1, st 0, postgres, ISO, MDY
