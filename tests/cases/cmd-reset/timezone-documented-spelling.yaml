# Documented usage: RESET timezone sets the time zone back to its default value.
id: cmd-reset.timezone-documented-spelling
title: RESET timezone restores the session time zone after SET TimeZone
family: cmd-reset
tier: core
feature_ids: [reset, timezone, set, show]
required_capabilities: [select, guc, timezone-setting]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Examples: RESET timezone)"
sessions: [a]
steps:
  - sql: |
      SELECT current_setting('TimeZone') AS initial
    expect: rows
  - sql: |
      SET TimeZone = 'Asia/Tokyo'
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') AS after_set
    expect: rows
    comment: must show Asia/Tokyo
  - sql: |
      RESET timezone
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') AS after_reset
    expect: rows
    comment: must equal initial
