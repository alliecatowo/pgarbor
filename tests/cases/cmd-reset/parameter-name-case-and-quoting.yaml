# Unquoted identifiers fold to lower case, and GUC names match case-insensitively, so quoted and mixed-case spellings work.
id: cmd-reset.parameter-name-case-and-quoting
title: RESET accepts mixed-case and quoted parameter names
family: cmd-reset
tier: core
feature_ids: [reset, identifiers, guc]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Parameters: configuration_parameter); doc-sql-syntax-lexical"
sessions: [a]
steps:
  - sql: |
      SET extra_float_digits = 3
    expect: ok
  - sql: |
      RESET EXTRA_FLOAT_DIGITS
    expect: ok
  - sql: |
      SELECT current_setting('extra_float_digits') AS after_upper_reset
    expect: rows
  - sql: |
      SET extra_float_digits = 3
    expect: ok
  - sql: |
      RESET "Extra_Float_Digits"
    expect: ok
  - sql: |
      SELECT current_setting('extra_float_digits') AS after_quoted_reset
    expect: rows
    comment: quoted mixed-case name is still the same GUC, so the value is 1
  - sql: |
      SET TimeZone = 'Asia/Tokyo'
    expect: ok
  - sql: |
      RESET "TimeZone"
    expect: ok
  - sql: |
      SELECT current_setting('TimeZone') AS after_quoted_tz_reset
    expect: rows
    comment: the time zone is back to the session default, not Asia/Tokyo
