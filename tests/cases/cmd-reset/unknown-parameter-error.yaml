# RESET of a name that is not a run-time parameter fails with 42704 and leaves the session usable.
id: cmd-reset.unknown-parameter-error
title: RESET of an unrecognized parameter is an undefined-object error 42704
family: cmd-reset
tier: core
feature_ids: [reset, errors, guc]
required_capabilities: [select, guc, errors, error-sqlstate]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Parameters: configuration_parameter)"
sessions: [a]
steps:
  - sql: |
      RESET no_such_parameter_for_reset
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
