# RESET takes exactly one parameter name or ALL; anything else is a syntax error (42601).
id: cmd-reset.syntax-errors
title: RESET with no argument, several names, or a TO DEFAULT clause is a syntax error
family: cmd-reset
tier: core
feature_ids: [reset, syntax-errors]
required_capabilities: [select, errors, error-sqlstate]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Synopsis: RESET configuration_parameter | RESET ALL)"
sessions: [a]
steps:
  - sql: |
      RESET
    expect: error
    sqlstate: "42601"
  - sql: |
      RESET ALL TIMEZONE
    expect: error
    sqlstate: "42601"
    comment: ALL takes no parameter name
  - sql: |
      RESET timezone TO DEFAULT
    expect: error
    sqlstate: "42601"
    comment: TO DEFAULT is SET syntax, not RESET
  - sql: |
      RESET extra_float_digits, statement_timeout
    expect: error
    sqlstate: "42601"
  - sql: |
      RESET 'timezone'
    expect: error
    sqlstate: "42601"
    comment: a string literal is not a parameter name
