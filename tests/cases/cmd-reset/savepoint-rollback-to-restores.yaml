# A RESET inside a savepoint is undone by ROLLBACK TO SAVEPOINT, and it survives the later COMMIT.
id: cmd-reset.savepoint-rollback-to-restores
title: RESET undone by ROLLBACK TO SAVEPOINT keeps the earlier SET value
family: cmd-reset
tier: core
feature_ids: [reset, set, savepoints, transactions]
required_capabilities: [select, guc, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description: transactional behavior)"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      BEGIN;
      SAVEPOINT sp;
      RESET DateStyle;
      ROLLBACK TO SAVEPOINT sp;
      SELECT current_setting('DateStyle') AS after_rollback_to;
      COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('DateStyle') AS after_commit
    expect: rows
    comment: still SQL, DMY
