# In an aborted transaction block every command is rejected with 25P02, RESET included, until ROLLBACK.
id: cmd-reset.aborted-transaction-error
title: RESET inside an aborted transaction block fails with 25P02
family: cmd-reset
tier: core
feature_ids: [reset, transactions, errors, aborted-transaction]
required_capabilities: [select, guc, transactions, errors, error-sqlstate]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description: transactional behavior); doc-transaction-iso"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      RESET DateStyle
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT current_setting('DateStyle') AS after_rollback
    expect: rows
    comment: the failed RESET did not run, so SQL, DMY is still in effect
