# RESET name and SET name TO DEFAULT have the same effect on the session value.
id: cmd-reset.equivalent-to-set-default
title: RESET and SET ... TO DEFAULT leave the same value
family: cmd-reset
tier: core
feature_ids: [reset, set, set-default, guc]
required_capabilities: [select, guc]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description: RESET is an alternative spelling for SET ... TO DEFAULT)"
sessions: [a]
steps:
  - sql: |
      SET DateStyle = 'SQL, DMY';
      RESET DateStyle;
      SELECT current_setting('DateStyle') AS via_reset
    expect: rows
  - sql: |
      SET DateStyle = 'SQL, DMY';
      SET DateStyle TO DEFAULT;
      SELECT current_setting('DateStyle') AS via_set_default
    expect: rows
    comment: must match via_reset
