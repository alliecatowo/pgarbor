# RESET changes only the issuing session; another session keeps its own value.
id: cmd-reset.session-scoped-reset
title: RESET in one session does not change another session's setting
family: cmd-reset
tier: core
feature_ids: [reset, set, sessions, guc]
required_capabilities: [select, guc, multi-session]
provenance:
  source: pg-docs
  ref: "ref/reset.sgml#sql-reset (Description)"
sessions: [a, b]
steps:
  - session: a
    sql: |
      SET DateStyle = 'SQL, DMY'
    expect: ok
  - session: b
    sql: |
      SET DateStyle = 'German'
    expect: ok
  - session: a
    sql: |
      RESET DateStyle
    expect: ok
  - session: a
    sql: |
      SELECT current_setting('DateStyle') AS a_value
    expect: rows
    comment: ISO, MDY
  - session: b
    sql: |
      SELECT current_setting('DateStyle') AS b_value
    expect: rows
    comment: still German
