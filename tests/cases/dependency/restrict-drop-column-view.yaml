# DROP COLUMN referenced by a view is refused under RESTRICT, and the table is left unchanged.
id: dependency.restrict-drop-column-view
title: ALTER TABLE DROP COLUMN refused when a view uses the column
family: dependency
tier: core
feature_ids: [alter-table, views, dependencies]
required_capabilities: [create-table, insert, select, views, alter-table]
provenance:
  source: hand
  ref: "PG18 docs sql-altertable.html (DROP COLUMN RESTRICT); errcode 2BP01 dependent_objects_still_exist"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (1, 'x');
  CREATE VIEW vb AS SELECT b FROM t;
steps:
  - sql: |
      ALTER TABLE t DROP COLUMN b
    expect: error
    sqlstate: "2BP01"
  - sql: |
      SELECT b FROM vb
    expect: rows
  - sql: |
      SELECT count(*) AS n FROM information_schema.columns WHERE table_name = 't' AND column_name = 'b'
    expect: rows
