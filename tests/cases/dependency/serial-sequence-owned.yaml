# A serial column's sequence is OWNED BY its table column, so DROP TABLE drops the sequence too.
id: dependency.serial-sequence-owned
title: Serial sequence is dropped with its owning table
family: dependency
tier: core
feature_ids: [serial, sequences, drop-table, dependencies]
required_capabilities: [create-table, insert, select, sequences, drop-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/dependency.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE deptest (f1 serial PRIMARY KEY, f2 text);
      INSERT INTO deptest (f2) VALUES ('a'), ('b');
      SELECT f1, f2 FROM deptest ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT to_regclass('deptest_f1_seq') IS NOT NULL AS seq_exists
    expect: rows
  - sql: |
      DROP TABLE deptest
    expect: ok
  - sql: |
      SELECT to_regclass('deptest_f1_seq') IS NULL AS seq_gone
    expect: rows
