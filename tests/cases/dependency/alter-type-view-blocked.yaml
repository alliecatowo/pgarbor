# Changing the type of a column used by a view is not supported and leaves the view intact.
id: dependency.alter-type-view-blocked
title: ALTER COLUMN TYPE refused when a view depends on the column
family: dependency
tier: extended
feature_ids: [alter-table, views, dependencies, numeric]
required_capabilities: [create-table, insert, select, views, alter-table, numeric]
provenance:
  source: hand
  ref: "PG18 errcode 0A000 feature_not_supported; cannot alter type of a column used by a view or rule"
sessions: [a]
setup: |
  CREATE TABLE t (n int4);
  INSERT INTO t VALUES (7), (NULL);
  CREATE VIEW vn AS SELECT n FROM t;
steps:
  - sql: |
      ALTER TABLE t ALTER COLUMN n TYPE int8
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT n FROM vn ORDER BY n NULLS LAST
    expect: rows
    order: ordered
