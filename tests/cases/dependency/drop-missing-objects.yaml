# IF EXISTS turns a missing-object drop into a notice; without it the drop errors.
id: dependency.drop-missing-objects
title: DROP of missing objects with and without IF EXISTS
family: dependency
tier: core
feature_ids: [drop-table, drop-function, errors]
required_capabilities: [create-table, drop-table, functions, drop-function, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/dependency.sql (DROP USER/GROUP IF EXISTS pattern); errcodes 42P01, 42883"
sessions: [a]
steps:
  - sql: |
      DROP TABLE IF EXISTS dep_no_such_table
    expect: notice
  - sql: |
      DROP TABLE dep_no_such_table
    expect: error
    sqlstate: "42P01"
  - sql: |
      DROP FUNCTION IF EXISTS dep_no_such_fn(int4)
    expect: notice
  - sql: |
      DROP FUNCTION dep_no_such_fn(int4)
    expect: error
    sqlstate: "42883"
