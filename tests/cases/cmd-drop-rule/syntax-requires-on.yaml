# The grammar requires ON table_name; a rule name alone, or a table name in place of ON, is a syntax error.
id: cmd-drop-rule.syntax-requires-on
title: DROP RULE without ON table_name is a syntax error and the rule is untouched
family: cmd-drop-rule
tier: core
feature_ids: [drop-rule, create-rule, syntax]
required_capabilities: [create-table, create-rule, drop-rule, errors, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_rule.sgml#sql-droprule (Synopsis: DROP RULE name ON table_name)"
sessions: [a]
setup: |
  CREATE TABLE sx (a int4);
  CREATE RULE sx_r AS ON INSERT TO sx DO INSTEAD NOTHING;
steps:
  - sql: |
      DROP RULE sx_r
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP RULE sx_r sx
    expect: error
    sqlstate: "42601"
    comment: table name without the ON keyword
  - sql: |
      SELECT rulename FROM pg_rules WHERE tablename = 'sx'
    expect: rows
    comment: the rule still exists
