# A rule is identified by name plus table: dropping one table's rule leaves a same-named rule on another table in effect.
id: cmd-drop-rule.per-table-scope
title: Dropping a same-named rule on one table leaves the other table's rule firing
family: cmd-drop-rule
tier: core
feature_ids: [drop-rule, create-rule, rules, insert]
required_capabilities: [create-table, create-rule, drop-rule, insert, select]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_rule.sgml#sql-droprule (name ON table_name)"
sessions: [a]
setup: |
  CREATE TABLE pa (a int4);
  CREATE TABLE pb (a int4);
  CREATE RULE shared AS ON INSERT TO pa DO INSTEAD NOTHING;
  CREATE RULE shared AS ON INSERT TO pb DO INSTEAD NOTHING;
steps:
  - sql: |
      DROP RULE shared ON pa
    expect: ok
  - sql: |
      INSERT INTO pa VALUES (1), (2)
    expect: ok
  - sql: |
      INSERT INTO pb VALUES (10)
    expect: ok
  - sql: |
      SELECT 'pa' AS t, a FROM pa UNION ALL SELECT 'pb', a FROM pb ORDER BY 1, 2
    expect: rows
    order: ordered
    comment: pa receives rows again, pb is still swallowed by its rule
  - sql: |
      SELECT tablename FROM pg_rules WHERE rulename = 'shared' ORDER BY tablename
    expect: rows
    order: ordered
    comment: exactly one shared rule remains, on pb
