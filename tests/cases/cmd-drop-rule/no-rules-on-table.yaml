# DROP RULE on a table that has no rules at all reports undefined_object, and a plain table is never affected.
id: cmd-drop-rule.no-rules-on-table
title: DROP RULE on a table with no rules fails with undefined_object and leaves the table usable
family: cmd-drop-rule
tier: extended
feature_ids: [drop-rule, errors, insert]
required_capabilities: [create-table, drop-rule, insert, select, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/drop_rule.sgml#sql-droprule (missing rule error)"
sessions: [a]
setup: |
  CREATE TABLE nr_plain (a int4);
steps:
  - sql: |
      DROP RULE anything ON nr_plain
    expect: error
    sqlstate: "42704"
  - sql: |
      INSERT INTO nr_plain VALUES (3)
    expect: ok
  - sql: |
      SELECT a FROM nr_plain
    expect: rows
    order: ordered
