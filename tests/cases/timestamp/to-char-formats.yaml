# to_char on timestamp: numeric, name, fractional-second, meridiem, ISO week, and quoted-literal patterns.
id: timestamp.to-char-formats
title: to_char renders timestamp fields across numeric, name, meridiem and ISO week patterns
family: timestamp
tier: extended
feature_ids: [timestamp, to-char, formatting]
required_capabilities: [create-table, insert, select, timestamp]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE ts_fmt (d1 timestamp(6) without time zone);
  INSERT INTO ts_fmt VALUES ('2018-11-02 12:34:56.78901'), ('1997-02-10 17:32:01')
steps:
  - sql: |
      SELECT to_char(d1, 'YYYY-MM-DD HH24:MI:SS') AS s FROM ts_fmt ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT to_char(d1, 'FMDay FMMonth FMDD FMMM') AS s FROM ts_fmt ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT to_char(d1, 'HH12:MI P.M. / HH12:MI p.m.') AS s FROM ts_fmt ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT to_char(d1, 'FF1 FF3 FF6 MS US') AS s FROM ts_fmt ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT to_char(d1, 'IYYY-"W"IW-ID') AS s FROM ts_fmt ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT to_char(d1, 'HH24--text--MI') AS s FROM ts_fmt ORDER BY d1
    expect: rows
    order: ordered
