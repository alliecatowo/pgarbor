# Postgres v6.x style, slash, dash, compact, and DateStyle-dependent textual inputs.
id: timestamp.textual-input-formats
title: Textual timestamp input formats including DateStyle switch and zone decoration
family: timestamp
tier: core
feature_ids: [timestamp, insert, select, datestyle]
required_capabilities: [create-table, insert, select, timestamp, datestyle]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE ts_txt (d1 timestamp(0) without time zone)
steps:
  - sql: |
      INSERT INTO ts_txt VALUES ('Feb 10 17:32:01 1997 -0800'), ('Feb 10 17:32:01 1997'), ('Feb 10 5:32PM 1997'), ('Feb-10-1997 17:32:01 PST'), ('02-10-1997 17:32:01 PST'), ('1997/02/10 17:32:01-0800'), ('19970210 173201 PST')
    expect: ok
  - sql: |
      SET datestyle TO ymd
    expect: ok
  - sql: |
      INSERT INTO ts_txt VALUES ('97FEB10 5:32:01PM UTC'), ('97/02/10 17:32:01 UTC')
    expect: ok
  - sql: |
      RESET datestyle
    expect: ok
  - sql: |
      INSERT INTO ts_txt VALUES ('1997.041 17:32:01 UTC')
    expect: ok
  - sql: |
      SELECT d1 FROM ts_txt ORDER BY d1
    expect: rows
    order: multiset
    comment: ties are expected, so compare as a multiset
