# Infinite timestamps order at the extremes; infinity arithmetic is defined in some cases and raises 22008 in others.
id: timestamp.infinity-values
title: Infinite timestamp ordering, comparison and arithmetic with 22008 overflow errors
family: timestamp
tier: core
feature_ids: [timestamp, infinity, select, interval, arithmetic]
required_capabilities: [create-table, insert, select, timestamp, interval]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE ts_inf (d1 timestamp without time zone);
  INSERT INTO ts_inf VALUES ('-infinity'), ('infinity'), ('epoch'), ('1997-01-02')
steps:
  - sql: |
      SELECT d1 FROM ts_inf ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT timestamp 'infinity' = timestamp '+infinity' AS t
    expect: rows
  - sql: |
      SELECT d1 FROM ts_inf WHERE d1 < timestamp 'infinity' ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT timestamp 'infinity' - timestamp '1995-08-06 12:12:12' AS diff
    expect: rows
  - sql: |
      SELECT timestamp 'infinity' - timestamp 'infinity'
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT age(timestamp 'infinity', timestamp 'infinity')
    expect: error
    sqlstate: "22008"
