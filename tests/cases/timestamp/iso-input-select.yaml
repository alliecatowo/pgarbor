# Basic ISO and common literal inputs for timestamp(2), read back ordered.
id: timestamp.iso-input-select
title: ISO and common timestamp literals inserted and read back in order
family: timestamp
tier: slice
feature_ids: [timestamp, create-table, insert, select]
required_capabilities: [create-table, insert, select, timestamp]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE ts_tbl (d1 timestamp(2) without time zone)
steps:
  - sql: |
      INSERT INTO ts_tbl VALUES ('1997-01-02'), ('1997-01-02 03:04:05'), ('2001-09-22T18:19:20'), ('1997-02-10 17:32:01-08'), ('19970210 173201 -0800')
    expect: ok
  - sql: |
      SELECT d1 FROM ts_tbl ORDER BY d1
    expect: rows
    order: ordered
