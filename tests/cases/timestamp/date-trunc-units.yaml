# date_trunc on timestamp: supported units, infinity passthrough, NULL, and unit errors (0A000 unsupported, 22023 unknown).
id: timestamp.date-trunc-units
title: date_trunc supported units, infinity passthrough, and unit-specific errors
family: timestamp
tier: core
feature_ids: [timestamp, date-trunc, errors]
required_capabilities: [select, timestamp]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT date_trunc('week', timestamp '2004-02-29 15:44:17.71393') AS week_trunc
    expect: rows
  - sql: |
      SELECT date_trunc('day', timestamp '2004-02-29 15:44:17.71393') AS day_trunc, date_trunc('hour', timestamp '2004-02-29 15:44:17.71393') AS hour_trunc
    expect: rows
  - sql: |
      SELECT date_trunc('week', timestamp 'infinity') AS inf_trunc
    expect: rows
  - sql: |
      SELECT date_trunc('week', NULL::timestamp) AS n
    expect: rows
  - sql: |
      SELECT date_trunc('timezone', timestamp '2004-02-29 15:44:17.71393')
    expect: error
    sqlstate: "0A000"
    comment: a known unit that is not supported for timestamp without time zone
  - sql: |
      SELECT date_trunc('ago', timestamp 'infinity')
    expect: error
    sqlstate: "22023"
    comment: an unrecognized unit name
