# Fractional seconds are rounded to the declared precision on input.
id: timestamp.fractional-seconds-rounding
title: Fractional seconds round to timestamp(2) precision, including carry into the next second
family: timestamp
tier: core
feature_ids: [timestamp, insert, select, precision]
required_capabilities: [create-table, insert, select, timestamp]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE ts_frac (d1 timestamp(2) without time zone)
steps:
  - sql: |
      INSERT INTO ts_frac VALUES ('1997-02-10 17:32:01.123456'), ('1997-02-10 17:32:01.4'), ('1997-02-10 17:32:01.6'), ('1997-02-10 17:32:01.999999'), ('1997-02-10 17:32:01.000001')
    expect: ok
  - sql: |
      SELECT d1 FROM ts_frac ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM ts_frac WHERE d1 = timestamp '1997-02-10 17:32:02'
    expect: rows
    comment: the .999999 input rounds up into the next second
