# Malformed input raises 22007; out-of-field input raises 22008; the non-throwing API reports the same codes.
id: timestamp.invalid-input-errors
title: Invalid timestamp input errors and the non-throwing pg_input_is_valid API
family: timestamp
tier: core
feature_ids: [timestamp, errors, input-validation]
required_capabilities: [select, timestamp]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 'garbage'::timestamp
    expect: error
    sqlstate: "22007"
  - sql: |
      SELECT '2001-02-30 00:00:00'::timestamp
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT pg_input_is_valid('garbage', 'timestamp') AS ok
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('2001-01-01', 'timestamp') AS ok
    expect: rows
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('garbage', 'timestamp')
    expect: rows
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('2001-02-30 00:00', 'timestamp')
    expect: rows
