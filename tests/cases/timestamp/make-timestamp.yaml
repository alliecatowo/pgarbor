# make_timestamp constructor: BC years, 24:00:00 end-of-day, fractional seconds, and field-range errors.
id: timestamp.make-timestamp
title: make_timestamp constructs valid values and rejects out-of-range fields with 22008
family: timestamp
tier: core
feature_ids: [timestamp, constructors, errors]
required_capabilities: [select, timestamp]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT make_timestamp(2014, 12, 28, 6, 30, 45.887) AS t
    expect: rows
  - sql: |
      SELECT make_timestamp(-44, 3, 15, 12, 30, 15) AS t
    expect: rows
  - sql: |
      SELECT make_timestamp(1999, 12, 31, 24, 0, 0) AS t
    expect: rows
    comment: hour 24 with zero minutes is the end of the day
  - sql: |
      SELECT make_timestamp(2024, 2, 29, 12, 0, 0) AS t
    expect: rows
  - sql: |
      SELECT make_timestamp(0, 7, 15, 12, 30, 15)
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT make_timestamp(2023, 2, 29, 0, 0, 0)
    expect: error
    sqlstate: "22008"
