# Comparison operators and BETWEEN over timestamp values, including string-literal coercion.
id: timestamp.comparison-operators
title: Relational operators, BETWEEN and literal coercion on timestamp columns
family: timestamp
tier: core
feature_ids: [timestamp, select, where, comparison]
required_capabilities: [create-table, insert, select, timestamp]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE ts_cmp (d1 timestamp without time zone);
  INSERT INTO ts_cmp VALUES ('1902-01-01'), ('1996-02-28 00:00:00'), ('1997-01-02'), ('1997-01-02 03:04:05'), ('2038-01-19 03:14:07')
steps:
  - sql: |
      SELECT d1 FROM ts_cmp WHERE d1 > timestamp without time zone '1997-01-02' ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT d1 FROM ts_cmp WHERE d1 < timestamp without time zone '1997-01-02' ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT d1 FROM ts_cmp WHERE d1 = timestamp without time zone '1997-01-02' ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT d1 FROM ts_cmp WHERE d1 <> timestamp without time zone '1997-01-02' ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT d1 FROM ts_cmp WHERE d1 >= '1997-01-02' AND d1 <= '1997-01-02 03:04:05' ORDER BY d1
    expect: rows
    order: ordered
  - sql: |
      SELECT d1 FROM ts_cmp WHERE d1 BETWEEN timestamp without time zone '1902-01-01' AND timestamp without time zone '2038-01-01' ORDER BY d1
    expect: rows
    order: ordered
