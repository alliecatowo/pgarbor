# date_bin: origin-shifted bins, roundoff when source precedes origin, and stride validation.
id: timestamp.date-bin-stride
title: date_bin bins by origin and rejects month/year, zero, and negative strides
family: timestamp
tier: core
feature_ids: [timestamp, date-bin, errors]
required_capabilities: [select, timestamp, interval]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT date_bin('5 min'::interval, timestamp '2020-02-01 01:01:01', timestamp '2020-02-01 00:02:30') AS b
    expect: rows
  - sql: |
      SELECT date_bin('30 minutes'::interval, timestamp '2024-02-01 15:00:00', timestamp '2024-02-01 17:00:00') AS b
    expect: rows
    comment: source precedes origin; checks roundoff direction
  - sql: |
      SELECT date_bin('15 minutes'::interval, timestamp '2020-02-11 15:44:17.71393', timestamp '2001-01-01') AS b
    expect: rows
  - sql: |
      SELECT date_bin('5 months'::interval, timestamp '2020-02-01 01:01:01', timestamp '2001-01-01')
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT date_bin('0 days'::interval, timestamp '1970-01-01 01:00:00', timestamp '1970-01-01 00:00:00')
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT date_bin('-2 days'::interval, timestamp '1970-01-01 01:00:00', timestamp '1970-01-01 00:00:00')
    expect: error
    sqlstate: "22008"
