# Timestamp range boundaries: values at the limits succeed, one step beyond fails with 22008.
id: timestamp.range-boundaries-errors
title: Timestamp range boundaries accepted at the limit and rejected one unit beyond
family: timestamp
tier: core
feature_ids: [timestamp, select, errors, range]
required_capabilities: [select, timestamp, interval]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT '294276-12-31 23:59:59'::timestamp
    expect: rows
  - sql: |
      SELECT '4714-11-24 00:00:00 BC'::timestamp
    expect: rows
  - sql: |
      SELECT '4714-11-23 23:59:59 BC'::timestamp
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT '294277-01-01 00:00:00'::timestamp
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT timestamp '294276-12-31 23:59:59' - timestamp '1999-12-23 19:59:04.224193' AS ok
    expect: rows
  - sql: |
      SELECT timestamp '294276-12-31 23:59:59' - timestamp '1999-12-23 19:59:04.224192' AS overflows
    expect: error
    sqlstate: "22008"
  - sql: |
      SELECT 'Feb 29 17:32:01 1997'::timestamp
    expect: error
    sqlstate: "22008"
    comment: 1997 is not a leap year, so this is a field overflow rather than a syntax error
