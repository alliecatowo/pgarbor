# A time zone in a timestamp without time zone literal is accepted and ignored.
id: timestamp.timezone-ignored-input
title: Zone suffixes in timestamp-without-zone input are parsed and discarded
family: timestamp
tier: core
feature_ids: [timestamp, insert, select, aggregates]
required_capabilities: [create-table, insert, select, timestamp, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/timestamp.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE ts_tz (d1 timestamp(0) without time zone);
  INSERT INTO ts_tz VALUES ('1997-02-10 17:32:01 PST'), ('1997-02-10 17:32:01-08'), ('1997-02-10 17:32:01 -08:00'), ('1997-02-10 17:32:01 UTC'), ('1997-02-10 17:32:01 America/New_York')
steps:
  - sql: |
      SELECT count(*) AS n, count(DISTINCT d1) AS distinct_n FROM ts_tz
    expect: rows
    order: multiset
    comment: all five inputs denote the same wall-clock value
  - sql: |
      SELECT d1 FROM ts_tz WHERE d1 = timestamp without time zone '1997-02-10 17:32:01' ORDER BY d1
    expect: rows
    order: ordered
