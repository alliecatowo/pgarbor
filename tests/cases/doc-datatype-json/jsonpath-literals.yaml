# jsonpath literal syntax follows JavaScript numeric and string rules; underscores and radix prefixes have limits.
id: doc-datatype-json.jsonpath-literals
title: jsonpath numeric literals (underscores, radix prefixes, .1, 1.) and escaped string literals
family: doc-datatype-json
tier: core
feature_ids: [jsonpath, jsonpath-literals, jsonpath-numeric-syntax]
required_capabilities: [select, jsonpath, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/json.sgml#datatype-jsonpath (jsonpath Type: numeric literals and string literal escapes)"
sessions: [a]
steps:
  - sql: |
      SELECT '1_000_000'::jsonpath AS underscores, '0x1EEE_FFFF'::jsonpath AS hex,
             '0o273'::jsonpath AS octal, '0b100101'::jsonpath AS binary
    expect: rows
    comment: doc examples of JavaScript-style numeric literals
  - sql: |
      SELECT '.1'::jsonpath AS leading_dot, '1.'::jsonpath AS trailing_dot
    expect: rows
    comment: allowed in jsonpath although invalid in JSON text
  - sql: |
      SELECT '"\u{1F600}"'::jsonpath AS code_point, '$."a\"b"'::jsonpath AS escaped_quote
    expect: rows
    comment: JavaScript escapes inside embedded string literals
  - sql: |
      SELECT '$."a b"'::jsonpath AS quoted_member, '$x'::jsonpath AS named_variable
    expect: rows
  - sql: |
      SELECT '0x_1'::jsonpath
    expect: error
    sqlstate: "42601"
    comment: no underscore directly after the radix prefix
  - sql: |
      SELECT '1__0'::jsonpath
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT '$.a['::jsonpath
    expect: error
    sqlstate: "42601"
