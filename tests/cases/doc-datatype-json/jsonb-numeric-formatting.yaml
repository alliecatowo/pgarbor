# jsonb prints numbers through numeric (E notation expanded, trailing zeros kept); json echoes text.
id: doc-datatype-json.jsonb-numeric-formatting
title: jsonb numeric output expands E notation and keeps trailing zeros while json echoes the literal
family: doc-datatype-json
tier: core
feature_ids: [jsonb, json-numbers, numeric-formatting]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/json.sgml#datatype-json (JSON Input and Output Syntax; numeric formatting example)"
sessions: [a]
steps:
  - sql: |
      SELECT '{"reading": 1.230e-5}'::json AS j, '{"reading": 1.230e-5}'::jsonb AS b
    expect: rows
    comment: doc example, E notation printed without E by jsonb
  - sql: |
      SELECT '[1.0, 2.50, 3]'::jsonb AS trailing_zeros
    expect: rows
    comment: jsonb preserves trailing fractional zeroes
  - sql: |
      SELECT '[1.0]'::jsonb = '[1]'::jsonb AS equal_despite_scale,
             '{"x": 1}'::jsonb = '{"x": 1.0}'::jsonb AS equal_object
    expect: rows
    comment: trailing zeroes are semantically insignificant for equality
  - sql: |
      SELECT ('{"n": 12.5}'::jsonb -> 'n')::numeric AS n_numeric, jsonb_typeof('{"n": 12.5}'::jsonb -> 'n') AS t
    expect: rows
