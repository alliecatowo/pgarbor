# Documented jsonb containment (@>) examples: structure must match, array order is insignificant, nesting matters.
id: doc-datatype-json.jsonb-containment
title: jsonb containment operator examples for scalars, arrays, nested arrays and objects
family: doc-datatype-json
tier: core
feature_ids: [jsonb, jsonb-containment]
required_capabilities: [select, jsonb]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/json.sgml#datatype-json (jsonb Containment and Existence)"
sessions: [a]
steps:
  - sql: |
      SELECT
        '"foo"'::jsonb @> '"foo"'::jsonb AS scalar_same,
        '[1, 2, 3]'::jsonb @> '[1, 3]'::jsonb AS subset,
        '[1, 2, 3]'::jsonb @> '[3, 1]'::jsonb AS order_free,
        '[1, 2, 3]'::jsonb @> '[1, 2, 2]'::jsonb AS duplicates_free,
        '{"product": "PostgreSQL", "version": 9.4, "jsonb": true}'::jsonb @> '{"version": 9.4}'::jsonb AS obj_subset,
        '[1, 2, [1, 3]]'::jsonb @> '[[1, 3]]'::jsonb AS nested_array,
        '{"foo": {"bar": "baz"}}'::jsonb @> '{"foo": {}}'::jsonb AS empty_object_nested,
        '["foo", "bar"]'::jsonb @> '"bar"'::jsonb AS array_holds_primitive
    expect: rows
    comment: doc examples documented as true
  - sql: |
      SELECT
        '[1, 2, [1, 3]]'::jsonb @> '[1, 3]'::jsonb AS nested_not_top,
        '{"foo": {"bar": "baz"}}'::jsonb @> '{"bar": "baz"}'::jsonb AS key_not_top,
        '"bar"'::jsonb @> '["bar"]'::jsonb AS primitive_not_reciprocal
    expect: rows
    comment: doc examples documented as false (exception is one-way)
