# jsonpath accessors: member, quoted member, wildcards, recursive wildcard levels, array subscripts, last and slices.
id: doc-datatype-json.jsonpath-accessors
title: jsonpath member, wildcard, recursive wildcard, array subscript, last and slice accessors
family: doc-datatype-json
tier: core
feature_ids: [jsonpath, jsonpath-accessors, jsonpath-array-accessor, jsonpath-wildcards]
required_capabilities: [select, jsonb, jsonpath]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/json.sgml#datatype-jsonpath (jsonpath Accessors table)"
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('{"a b": 1, "$v": 2}', '$."a b"') AS quoted_member
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a b": 1, "$v": 2}', '$."$v"') AS dollar_member
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a": 1, "b": 2}', '$.*') AS all_members
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a": [10, 20, 30]}', '$.a[*]') AS all_elements
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a": [10, 20, 30]}', '$.a[0, 2]') AS picked
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a": [10, 20, 30]}', '$.a[1 to last]') AS slice_tail,
             jsonb_path_query('{"a": [10, 20, 30]}', '$.a[last]') AS last_elem,
             jsonb_path_query('{"a": [10, 20, 30]}', '$.a[last - 1]') AS second_last
    expect: rows
    order: multiset
    comment: last keyword denotes the last element; slices include both ends
  - sql: |
      SELECT jsonb_path_query('{"a": {"b": {"c": 1}}}', '$.**{1 to 2}') AS levels_1_to_2
    expect: rows
    order: multiset
    comment: recursive wildcard restricted to nesting levels (PostgreSQL extension)
  - sql: |
      SELECT jsonb_path_query('{"a": {"b": 1}, "c": [1, {"d": 2}]}', '$.**{last}') AS deepest
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a": [1, 2, 3]}', 'lax $.a[*] ? (@ > 1)') AS filtered
    expect: rows
    order: multiset
    comment: filter expressions use @ for the current item
