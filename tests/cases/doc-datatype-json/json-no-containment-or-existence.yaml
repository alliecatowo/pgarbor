# containment (@>) and existence (?, ?|, ?&) exist only for jsonb; json has no such operators.
id: doc-datatype-json.json-no-containment-or-existence
title: json lacks @>, ? and ?| operators, which fail with undefined-operator errors
family: doc-datatype-json
tier: core
feature_ids: [json, jsonb-containment, jsonb-existence]
required_capabilities: [select, json, jsonb, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/json.sgml#datatype-json (jsonb Containment and Existence: 'There is no parallel set of facilities for the json type')"
sessions: [a]
steps:
  - sql: |
      SELECT '{"a": 1}'::json @> '{"a": 1}'::json
    expect: error
    sqlstate: "42883"
    comment: no containment operator for json
  - sql: |
      SELECT '[1, 2]'::json @> '[1]'::json
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT '{"a": 1}'::json ? 'a'
    expect: error
    sqlstate: "42883"
    comment: no existence operator for json
  - sql: |
      SELECT '["a"]'::json ?| array['a']
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT '{"a": 1}'::json::jsonb @> '{"a": 1}'::jsonb AS via_cast
    expect: rows
    comment: casting to jsonb is the documented workaround
