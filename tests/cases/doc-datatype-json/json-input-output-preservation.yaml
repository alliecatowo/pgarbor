# json stores the exact input text (whitespace, key order, duplicate keys); jsonb normalizes all three.
id: doc-datatype-json.json-input-output-preservation
title: json preserves input text while jsonb drops whitespace, reorders keys and keeps the last duplicate
family: doc-datatype-json
tier: core
feature_ids: [json, jsonb, json-io, json-duplicate-keys]
required_capabilities: [select, json, jsonb]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/json.sgml#datatype-json (JSON Input and Output Syntax; paragraph on json vs jsonb storage)"
sessions: [a]
steps:
  - sql: |
      SELECT '{"bar": "baz", "balance": 7.77, "active":false}'::json AS j,
             '{"bar": "baz", "balance": 7.77, "active":false}'::jsonb AS b
    expect: rows
    comment: doc example; json echoes input text, jsonb is normalized
  - sql: |
      SELECT '{"a": 1, "a": 2, "b": 3}'::json::text AS j_text,
             '{"a": 1, "a": 2, "b": 3}'::jsonb::text AS b_text
    expect: rows
    comment: json keeps both duplicate pairs in its text; jsonb keeps only the last value
  - sql: |
      SELECT '{"a": 1, "a": 2}'::json -> 'a' AS json_last_dup,
             '{"a": 1, "a": 2}'::jsonb -> 'a' AS jsonb_last_dup
    expect: rows
    comment: processing functions treat the last duplicate as the operative value
  - sql: |
      SELECT '{"z": 1,   "a" :  [1,2]}'::json::text AS j_text,
             '{"z": 1,   "a" :  [1,2]}'::jsonb::text AS b_text
    expect: rows
    comment: whitespace and key order preserved by json, normalized by jsonb
