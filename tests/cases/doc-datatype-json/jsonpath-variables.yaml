# jsonpath named variables ($name) are bound through the vars argument; unbound or malformed ones fail.
id: doc-datatype-json.jsonpath-variables
title: jsonpath named variables bound via vars, missing variable error and invalid $ forms
family: doc-datatype-json
tier: extended
feature_ids: [jsonpath, jsonpath-variables, jsonpath-filters]
required_capabilities: [select, jsonb, jsonpath, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/json.sgml#datatype-jsonpath (jsonpath Variables: $varname and the vars parameter)"
sessions: [a]
steps:
  - sql: |
      SELECT jsonb_path_query('{"a": 5}', '$.a ? (@ == $x)', '{"x": 5}') AS bound
    expect: rows
    comment: vars argument supplies $x
  - sql: |
      SELECT jsonb_path_exists('{"a": 5}', '$.a ? (@ == $x)', '{"x": 6}') AS not_equal
    expect: rows
  - sql: |
      SELECT jsonb_path_query('{"a": [1, 2, 3]}', '$.a[*] ? (@ > $min)', '{"min": 1}') AS above_min
    expect: rows
    order: multiset
  - sql: |
      SELECT jsonb_path_query('{"a": 5}', '$.a ? (@ == $x)')
    expect: error
    sqlstate: "42704"
    comment: variable referenced but not supplied
  - sql: |
      SELECT jsonb_path_query('{"a": 5}', '$.$x')
    expect: error
    sqlstate: "42601"
    comment: a variable is not a valid member accessor target
