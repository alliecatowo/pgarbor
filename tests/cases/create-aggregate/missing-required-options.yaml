# CREATE AGGREGATE without stype or without sfunc is rejected with invalid_function_definition.
id: create-aggregate.missing-required-options
title: "CREATE AGGREGATE without stype or without sfunc fails with invalid_function_definition"
family: create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, errors]
required_capabilities: [aggregates, errors]
provenance:
  source: hand
  ref: "PG18 sql-createaggregate.html; errcode 42P13 invalid_function_definition"
sessions: [a]
steps:
  - sql: |
      CREATE AGGREGATE no_stype (int4) (sfunc = int4pl)
    expect: error
    sqlstate: "42P13"
    comment: aggregate stype must be specified
  - sql: |
      CREATE AGGREGATE no_sfunc (int4) (stype = int4)
    expect: error
    sqlstate: "42P13"
    comment: aggregate sfunc must be specified
  - sql: |
      SELECT 1
    expect: rows
    comment: the session is still usable after the errors
