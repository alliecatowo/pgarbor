# DROP AGGREGATE on a missing signature fails with undefined_function; IF EXISTS only notices.
id: create-aggregate.drop-missing-aggregate
title: "DROP AGGREGATE of a missing signature errors; IF EXISTS only emits a notice"
family: create-aggregate
tier: core
feature_ids: [aggregates, create-aggregate, drop-aggregate, errors]
required_capabilities: [aggregates, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_aggregate.sql (DROP AGGREGATE myavg)"
  license: PostgreSQL
setup: |
  CREATE AGGREGATE dropme (int4) (sfunc = int4pl, stype = int4, initcond = '0');
steps:
  - sql: |
      DROP AGGREGATE dropme (int4)
    expect: ok
  - sql: |
      DROP AGGREGATE dropme (int4)
    expect: error
    sqlstate: "42883"
  - sql: |
      DROP AGGREGATE IF EXISTS dropme (int4)
    expect: notice
    comment: IF EXISTS on a missing aggregate emits a NOTICE, not an error
