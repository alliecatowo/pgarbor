# Obsolete CREATE AGGREGATE spellings (sfunc1/stype1/initcond1 and basetype = 'ANY' for a
# zero-argument aggregate) are still accepted and behave like the modern spelling.
id: create-aggregate.obsolete-spellings
title: "Obsolete CREATE AGGREGATE spellings sfunc1, stype1, initcond1 and basetype ANY still work"
family: create-aggregate
tier: extended
feature_ids: [aggregates, create-aggregate, backward-compatibility, nulls]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_aggregate.sql (newsum, oldcnt)"
  license: PostgreSQL
setup: |
  CREATE TABLE o (x int4);
  INSERT INTO o VALUES (1), (2), (NULL), (4);
steps:
  - sql: |
      CREATE AGGREGATE oldsum (sfunc1 = int4pl, basetype = int4, stype1 = int4, initcond1 = '0')
    expect: ok
  - sql: |
      SELECT oldsum(x) FROM o
    expect: rows
    comment: 1+2+4, NULL skipped
  - sql: |
      CREATE AGGREGATE oldcnt (sfunc = int8inc, basetype = 'ANY', stype = int8, initcond = '0')
    expect: ok
  - sql: |
      SELECT oldcnt(*) FROM o
    expect: rows
    comment: zero-argument aggregate spelled with basetype ANY counts all 4 rows
