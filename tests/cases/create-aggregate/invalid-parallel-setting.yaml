# The parallel option accepts only SAFE, RESTRICTED or UNSAFE; a valid value is stored in proparallel.
id: create-aggregate.invalid-parallel-setting
title: "CREATE AGGREGATE rejects unknown parallel value and records UNSAFE parallel safety"
family: create-aggregate
tier: extended
feature_ids: [aggregates, create-aggregate, parallel-safety, errors, catalog-introspection]
required_capabilities: [aggregates, errors, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_aggregate.sql (parallel = pear)"
  license: PostgreSQL
steps:
  - sql: |
      CREATE AGGREGATE mysum (int4) (stype = int4, sfunc = int4pl, parallel = pear)
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE AGGREGATE mysum2 (int4) (stype = int4, sfunc = int4pl, parallel = unsafe)
    expect: ok
  - sql: |
      SELECT proname, proparallel FROM pg_proc WHERE proname IN ('mysum', 'mysum2') ORDER BY proname
    expect: rows
    order: ordered
    comment: only the valid aggregate exists; proparallel reflects UNSAFE
