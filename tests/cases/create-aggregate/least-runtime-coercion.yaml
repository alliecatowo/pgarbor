# A transition function whose state type must be coerced at run time is rejected; the same
# aggregate with a matching input type is accepted.
id: create-aggregate.least-runtime-coercion
title: "Aggregate transition needing run-time coercion is rejected; matching input type is accepted"
family: create-aggregate
tier: extended
feature_ids: [aggregates, create-aggregate, type-coercion, errors]
required_capabilities: [aggregates, create-function, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_aggregate.sql (least_agg run-time type coercion checks)"
  license: PostgreSQL
setup: |
  CREATE FUNCTION least_accum(int8, int8) RETURNS int8 LANGUAGE sql AS 'select least($1, $2)';
steps:
  - sql: |
      CREATE AGGREGATE least_agg (int4) (stype = int8, sfunc = least_accum)
    expect: error
    comment: sfunc would need run-time coercion of its input from int4; no sqlstate asserted
  - sql: |
      CREATE AGGREGATE least_agg (int8) (stype = int8, sfunc = least_accum)
    expect: ok
