# Enum to text and text to enum casts, enum arrays with subscripting, and ANY / ALL over enum arrays.
id: enum.text-cast-and-arrays
title: Enum text casts, enum arrays, and ANY and ALL comparisons
family: enum
tier: core
feature_ids: [enum, casts, arrays, operators]
required_capabilities: [enum-type, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/enum.sql
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple');
steps:
  - sql: |
      SELECT 'red'::rainbow::text || 'hithere'
    expect: rows
  - sql: |
      SELECT 'red'::text::rainbow = 'red'::rainbow
    expect: rows
  - sql: |
      SELECT '{red,green,blue}'::rainbow[]
    expect: rows
  - sql: |
      SELECT ('{red,green,blue}'::rainbow[])[2]
    expect: rows
  - sql: |
      SELECT 'red' = ANY ('{red,green,blue}'::rainbow[]), 'yellow' = ANY ('{red,green,blue}'::rainbow[])
    expect: rows
  - sql: |
      SELECT 'red' = ALL ('{red,green,blue}'::rainbow[]), 'red' = ALL ('{red,red}'::rainbow[])
    expect: rows
  - sql: |
      SELECT 'purple'::rainbow::text
    expect: rows
