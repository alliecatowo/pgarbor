# enum_last and enum_range with bounded, half-open and unbounded arguments, including typed NULL arguments.
id: enum.range-functions
title: enum_last and enum_range with NULL bounds and explicit endpoints
family: enum
tier: core
feature_ids: [enum, enum-functions, arrays]
required_capabilities: [enum-type, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/enum.sql
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple');
steps:
  - sql: |
      SELECT enum_first(NULL::rainbow), enum_last('green'::rainbow)
    expect: rows
  - sql: |
      SELECT enum_range(NULL::rainbow)
    expect: rows
  - sql: |
      SELECT enum_range('orange'::rainbow, 'green'::rainbow)
    expect: rows
  - sql: |
      SELECT enum_range(NULL, 'green'::rainbow)
    expect: rows
  - sql: |
      SELECT enum_range('orange'::rainbow, NULL)
    expect: rows
  - sql: |
      SELECT enum_range(NULL::rainbow, NULL)
    expect: rows
