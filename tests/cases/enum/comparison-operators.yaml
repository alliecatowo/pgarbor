# Enum comparison operators on a table column without an index, ordered by enum sort order.
id: enum.comparison-operators
title: Equality and ordering operators on an enum column without an index
family: enum
tier: core
feature_ids: [enum, select, where, order-by, operators]
required_capabilities: [enum-type, create-table, insert, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/enum.sql
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple');
  CREATE TABLE enumtest (col rainbow);
  INSERT INTO enumtest VALUES ('red'), ('orange'), ('yellow'), ('green'), ('blue'), ('purple');
steps:
  - sql: |
      SELECT * FROM enumtest WHERE col = 'orange'
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM enumtest WHERE col <> 'orange' ORDER BY col
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM enumtest WHERE col > 'yellow' ORDER BY col
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM enumtest WHERE col >= 'yellow' ORDER BY col
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM enumtest WHERE col < 'green' ORDER BY col
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM enumtest WHERE col <= 'green' ORDER BY col
    expect: rows
    order: ordered
