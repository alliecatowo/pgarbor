# Basic enum type: create, count catalog rows, store values and NULL, read back in enum order.
id: enum.create-and-select
title: Create an enum type, store values and NULL, read back in enum sort order
family: enum
tier: slice
feature_ids: [enum, create-type, create-table, insert, select, catalog-introspection]
required_capabilities: [enum-type, create-table, insert, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/enum.sql
sessions: [a]
steps:
  - sql: |
      CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple')
    expect: ok
  - sql: |
      SELECT COUNT(*) FROM pg_enum WHERE enumtypid = 'rainbow'::regtype
    expect: rows
  - sql: |
      CREATE TABLE enumtest (col rainbow)
    expect: ok
  - sql: |
      INSERT INTO enumtest VALUES ('red'), ('orange'), ('yellow'), ('green'), ('blue'), ('purple'), (NULL)
    expect: ok
  - sql: |
      SELECT col FROM enumtest ORDER BY col NULLS LAST
    expect: rows
    order: ordered
