# A domain over an enum with a CHECK on a subset of labels: accepted members pass, others raise a check violation.
id: enum.domain-check
title: Domain over an enum type with a CHECK restricting labels
family: enum
tier: core
feature_ids: [enum, domains, constraints, errors]
required_capabilities: [enum-type, domains, select, errors]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/enum.sql
sessions: [a]
setup: |
  CREATE TYPE rainbow AS ENUM ('red', 'orange', 'yellow', 'green', 'blue', 'purple');
  CREATE DOMAIN rgb AS rainbow CHECK (VALUE IN ('red', 'green', 'blue'));
steps:
  - sql: |
      SELECT 'red'::rgb
    expect: rows
  - sql: |
      SELECT 'purple'::rgb
    expect: error
    sqlstate: "23514"
  - sql: |
      SELECT 'purple'::rainbow::rgb
    expect: error
    sqlstate: "23514"
  - sql: |
      DROP DOMAIN rgb
    expect: ok
