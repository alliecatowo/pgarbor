# ADD VALUE of an existing label fails with duplicate_object; IF NOT EXISTS skips it; enum_last shows the appended label.
id: enum.add-value-if-not-exists
title: Duplicate ADD VALUE fails, IF NOT EXISTS is a no-op, enum_last reflects appended value
family: enum
tier: core
feature_ids: [enum, alter-type, errors, enum-functions]
required_capabilities: [enum-type, alter-type, select, errors]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/enum.sql
sessions: [a]
setup: |
  CREATE TYPE planets AS ENUM ('venus', 'earth', 'mars');
  ALTER TYPE planets ADD VALUE 'neptune';
steps:
  - sql: |
      ALTER TYPE planets ADD VALUE 'earth'
    expect: error
    sqlstate: "42710"
  - sql: |
      ALTER TYPE planets ADD VALUE IF NOT EXISTS 'earth'
    expect: ok
  - sql: |
      SELECT enum_last(NULL::planets)
    expect: rows
  - sql: |
      ALTER TYPE planets ADD VALUE IF NOT EXISTS 'pluto'
    expect: ok
  - sql: |
      SELECT enum_last(NULL::planets)
    expect: rows
  - sql: |
      SELECT COUNT(*) FROM pg_enum WHERE enumtypid = 'planets'::regtype
    expect: rows
