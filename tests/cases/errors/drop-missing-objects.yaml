# DROP of a missing object: 42704 for index and type, 42883 for function; IF EXISTS downgrades to a notice.
id: errors.drop-missing-objects
title: DROP of missing index, type and function errors; IF EXISTS gives a notice instead
family: errors
tier: core
feature_ids: [errors, drop-index, drop-type, drop-function]
required_capabilities: [create-table, select, drop-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (7);
steps:
  - sql: |
      DROP INDEX nonesuch
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP TYPE nonesuch
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP FUNCTION nonesuch()
    expect: error
    sqlstate: "42883"
  - sql: |
      DROP INDEX IF EXISTS nonesuch
    expect: notice
  - sql: |
      DROP TABLE IF EXISTS nonesuch
    expect: notice
  - sql: |
      DROP FUNCTION IF EXISTS nonesuch()
    expect: notice
  - sql: |
      SELECT a FROM t
    expect: rows
    order: ordered
