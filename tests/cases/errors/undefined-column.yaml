# Unknown column references in target list, WHERE (both operand sides) and DISTINCT ON: SQLSTATE 42703.
id: errors.undefined-column
title: Undefined column errors (42703) in target list, operands and DISTINCT ON
family: errors
tier: core
feature_ids: [errors, select, where, distinct]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (1, 'x'), (2, NULL);
steps:
  - sql: |
      SELECT nonesuch FROM t
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT a FROM t WHERE nonesuch = t.b
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT a FROM t WHERE t.b = nonesuch
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT DISTINCT ON (foobar) * FROM t
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT a FROM t WHERE b IS NULL ORDER BY a
    expect: rows
    order: ordered
    comment: NULL test on the valid column returns a = 2
