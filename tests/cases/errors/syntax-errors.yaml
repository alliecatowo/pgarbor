# Bare-keyword and malformed statements that fail in the parser: SQLSTATE 42601 before any catalog lookup.
id: errors.syntax-errors
title: Syntax errors (42601) for malformed statements, including references to missing objects
family: errors
tier: core
feature_ids: [errors, select, create-table, insert, delete, drop-table]
required_capabilities: [create-table, select, insert, delete, drop-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
steps:
  - sql: |
      xxx;
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE foo;
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TABLE ;
    expect: error
    sqlstate: "42601"
  - sql: |
      INSERT INTO foo VALUES(123) foo;
    expect: error
    sqlstate: "42601"
    comment: parse failure wins over the missing relation foo
  - sql: |
      SELECT DISTINCT FROM t;
    expect: error
    sqlstate: "42601"
  - sql: |
      DELETE FROM;
    expect: error
    sqlstate: "42601"
  - sql: |
      DROP TABLE;
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
