# Missing relation names in DML, DDL and ALTER: SQLSTATE 42P01, session remains usable afterwards.
id: errors.undefined-relation
title: Undefined relation errors (42P01) for SELECT, DELETE, DROP and ALTER
family: errors
tier: core
feature_ids: [errors, select, delete, drop-table, alter-table]
required_capabilities: [create-table, insert, select, delete, drop-table, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      SELECT * FROM nonesuch
    expect: error
    sqlstate: "42P01"
  - sql: |
      DELETE FROM nonesuch
    expect: error
    sqlstate: "42P01"
  - sql: |
      DROP TABLE nonesuch
    expect: error
    sqlstate: "42P01"
  - sql: |
      ALTER TABLE nonesuch RENAME TO newnonesuch
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT a FROM t ORDER BY a
    expect: rows
    order: ordered
    comment: the session is still usable after each error in autocommit mode
