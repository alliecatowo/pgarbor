# Strict operators return NULL without evaluating the divisor check when an operand is NULL;
# non-NULL zero divisors still fail with 22012.
id: errors.division-null-propagation
title: Division with NULL operands yields NULL; non-NULL zero divisor raises 22012
family: errors
tier: core
feature_ids: [errors, arithmetic, numeric, nulls]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
steps:
  - sql: |
      SELECT NULL::int4 / 0 AS r
    expect: rows
    order: ordered
    comment: strict operator with NULL left operand returns NULL
  - sql: |
      SELECT 1 / NULL::int8 AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT NULL::numeric / 0::numeric AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT 0 / 1 AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT 0::int4 / 0 AS r
    expect: error
    sqlstate: "22012"
