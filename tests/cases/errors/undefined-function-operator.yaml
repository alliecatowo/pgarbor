# Unknown functions and operators with no matching signature: SQLSTATE 42883.
id: errors.undefined-function-operator
title: Unknown function and operator with no matching signature raise 42883
family: errors
tier: core
feature_ids: [errors, functions, operators, text]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
steps:
  - sql: |
      SELECT nonesuch_fn(1)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT 'a'::text + 1
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
