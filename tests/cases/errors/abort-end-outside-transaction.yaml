# ABORT and END outside a transaction block are warnings, not errors (25P01 as a WARNING notice).
id: errors.abort-end-outside-transaction
title: ABORT and END with no transaction in progress issue a warning, not an error
family: errors
tier: core
feature_ids: [errors, transactions]
required_capabilities: [transactions, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
steps:
  - sql: |
      ABORT
    expect: notice
    comment: WARNING 25P01 "there is no transaction in progress"
  - sql: |
      END
    expect: notice
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
