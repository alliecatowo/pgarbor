# Division by zero raises 22012 for every integer, numeric and float type.
id: errors.division-by-zero
title: Division by zero (22012) for int2, int4, int8, numeric, float4 and float8
family: errors
tier: core
feature_ids: [errors, arithmetic, numeric, float, integer]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/errors.sql"
sessions: [a]
steps:
  - sql: |
      SELECT 1::int4/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::int8/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1/0::int8
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::int2/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::numeric/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1/0::numeric
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::float4/0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1/0::float8
    expect: error
    sqlstate: "22012"
