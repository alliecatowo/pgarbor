# GENERATED ALWAYS rejects non-DEFAULT values unless OVERRIDING SYSTEM VALUE is given.
id: identity.always-rejects-explicit
title: GENERATED ALWAYS rejects explicit values; OVERRIDING clauses select the source
family: identity
tier: core
feature_ids: [identity-columns, sequences, create-table, insert, select, errors]
required_capabilities: [create-table, insert, select, identity, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest2 (a bigint GENERATED ALWAYS AS IDENTITY, b text);
steps:
  - sql: |
      INSERT INTO itest2 VALUES (10, 'xyz')
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO itest2 OVERRIDING SYSTEM VALUE VALUES (20, 'xyz')
    expect: ok
  - sql: |
      INSERT INTO itest2 OVERRIDING USER VALUE VALUES (30, 'xyz')
    expect: ok
    comment: the user-supplied 30 is ignored and the sequence value 1 is used
  - sql: |
      SELECT a, b FROM itest2 ORDER BY a
    expect: rows
    order: ordered
