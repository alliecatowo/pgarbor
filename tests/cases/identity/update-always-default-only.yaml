# UPDATE on GENERATED ALWAYS: only SET col = DEFAULT is allowed; BY DEFAULT columns can be set freely.
id: identity.update-always-default-only
title: UPDATE of a GENERATED ALWAYS identity column accepts only DEFAULT
family: identity
tier: core
feature_ids: [identity-columns, update, errors]
required_capabilities: [create-table, insert, update, select, identity]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest2 (a bigint GENERATED ALWAYS AS IDENTITY, b text);
  INSERT INTO itest2 (b) VALUES ('one');
  INSERT INTO itest2 (b) VALUES ('two');
steps:
  - sql: |
      UPDATE itest2 SET a = 101 WHERE a = 1
    expect: error
    sqlstate: "428C9"
  - sql: |
      UPDATE itest2 SET a = DEFAULT WHERE a = 2
    expect: ok
    comment: takes the next sequence value, 3
  - sql: |
      SELECT a, b FROM itest2 ORDER BY a
    expect: rows
    order: ordered
