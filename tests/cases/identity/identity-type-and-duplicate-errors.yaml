# CREATE TABLE errors: identity needs an integer type; only one identity spec; no default with identity; no serial with identity.
id: identity.type-and-duplicate-errors
title: CREATE TABLE rejects text identity, duplicate identity, default plus identity, serial plus identity
family: identity
tier: core
feature_ids: [identity-columns, create-table, errors]
required_capabilities: [create-table, identity, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE itest_err_1 (a text GENERATED BY DEFAULT AS IDENTITY)
    expect: error
    sqlstate: "42804"
    comment: identity column type must be smallint, integer or bigint
  - sql: |
      CREATE TABLE itest_err_2 (a int GENERATED ALWAYS AS IDENTITY GENERATED BY DEFAULT AS IDENTITY)
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TABLE itest_err_3 (a int DEFAULT 5 GENERATED BY DEFAULT AS IDENTITY)
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TABLE itest_err_4 (a serial GENERATED BY DEFAULT AS IDENTITY)
    expect: error
    comment: serial already sets a default; the exact sqlstate is not asserted
  - sql: |
      SELECT to_regclass('itest_err_1') IS NULL AS e1, to_regclass('itest_err_4') IS NULL AS e4
    expect: rows
    comment: failed CREATE TABLE statements leave no table behind
