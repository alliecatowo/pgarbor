# GENERATED BY DEFAULT basics: sequence values, explicit values, sequence not advanced by explicit values.
id: identity.by-default-sequence
title: GENERATED BY DEFAULT identity assigns sequence values and accepts explicit values
family: identity
tier: slice
feature_ids: [identity-columns, sequences, create-table, insert, select]
required_capabilities: [create-table, insert, select, identity, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE itest1 (a int GENERATED BY DEFAULT AS IDENTITY, b text)
    expect: ok
  - sql: |
      INSERT INTO itest1 DEFAULT VALUES
    expect: ok
  - sql: |
      INSERT INTO itest1 DEFAULT VALUES
    expect: ok
  - sql: |
      INSERT INTO itest1 VALUES (10, 'xyz')
    expect: ok
    comment: explicit value is accepted
  - sql: |
      INSERT INTO itest1 DEFAULT VALUES
    expect: ok
    comment: the explicit value above did not advance the sequence
  - sql: |
      SELECT a, b FROM itest1 ORDER BY a
    expect: rows
    order: ordered
