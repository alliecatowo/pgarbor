# Adding an identity column to a populated table fills existing rows from the new sequence.
id: identity.add-column-populated
title: ADD COLUMN ... GENERATED BY DEFAULT AS IDENTITY numbers existing rows
family: identity
tier: core
feature_ids: [identity-columns, alter-table, sequences, insert]
required_capabilities: [create-table, insert, select, alter-table, identity, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest13 (a int);
  INSERT INTO itest13 VALUES (1), (2), (3);
steps:
  - sql: |
      ALTER TABLE itest13 ADD COLUMN b int GENERATED BY DEFAULT AS IDENTITY
    expect: ok
  - sql: |
      INSERT INTO itest13 (a) VALUES (4)
    expect: ok
  - sql: |
      SELECT count(*) AS n, count(DISTINCT b) AS distinct_b, min(b) AS min_b, max(b) AS max_b FROM itest13
    expect: rows
    order: ordered
    comment: existing rows get 1..3 in some physical order, so only order-independent aggregates are compared
