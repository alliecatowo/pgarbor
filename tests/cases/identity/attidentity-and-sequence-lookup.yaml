# pg_attribute.attidentity marks identity columns ('a' ALWAYS, 'd' BY DEFAULT); pg_get_serial_sequence finds the sequence.
id: identity.attidentity-and-sequence-lookup
title: pg_attribute attidentity values and pg_get_serial_sequence for identity columns
family: identity
tier: extended
feature_ids: [identity-columns, catalog-introspection, sequences]
required_capabilities: [create-table, select, identity, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest1 (a int GENERATED BY DEFAULT AS IDENTITY, b text);
  CREATE TABLE itest2 (a bigint GENERATED ALWAYS AS IDENTITY, b text);
  CREATE TABLE plain (a int, b text);
steps:
  - sql: |
      SELECT count(*) AS bad_attidentity FROM pg_attribute WHERE attidentity NOT IN ('', 'a', 'd')
    expect: rows
  - sql: |
      SELECT c.relname, a.attname, a.attidentity FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid WHERE c.relname IN ('itest1', 'itest2', 'plain') AND a.attnum > 0 ORDER BY 1, 2
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_get_serial_sequence('itest1', 'a')
    expect: rows
  - sql: |
      SELECT pg_get_serial_sequence('plain', 'a') IS NULL AS no_seq
    expect: rows
