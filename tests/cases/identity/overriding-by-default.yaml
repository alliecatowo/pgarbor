# GENERATED BY DEFAULT: explicit values accepted; OVERRIDING SYSTEM VALUE is a no-op; OVERRIDING USER VALUE forces the sequence.
id: identity.overriding-by-default
title: OVERRIDING clauses on a GENERATED BY DEFAULT identity column
family: identity
tier: core
feature_ids: [identity-columns, insert, sequences]
required_capabilities: [create-table, insert, select, identity, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest1 (a int GENERATED BY DEFAULT AS IDENTITY, b text);
steps:
  - sql: |
      INSERT INTO itest1 VALUES (10, 'xyz')
    expect: ok
  - sql: |
      INSERT INTO itest1 OVERRIDING SYSTEM VALUE VALUES (20, 'xyz')
    expect: ok
    comment: allowed as a no-op for BY DEFAULT
  - sql: |
      INSERT INTO itest1 OVERRIDING USER VALUE VALUES (30, 'xyz')
    expect: ok
    comment: 30 is ignored; the sequence supplies 1
  - sql: |
      SELECT a, b FROM itest1 ORDER BY a
    expect: rows
    order: ordered
