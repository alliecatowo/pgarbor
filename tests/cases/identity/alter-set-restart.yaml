# ALTER COLUMN ... SET GENERATED / SET INCREMENT / SET START WITH ... RESTART change the sequence; non-identity columns are rejected.
id: identity.alter-set-restart
title: ALTER COLUMN SET GENERATED BY DEFAULT with RESTART changes later values
family: identity
tier: core
feature_ids: [identity-columns, alter-table, sequences, errors]
required_capabilities: [create-table, insert, select, alter-table, identity, sequences]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest6 (a int GENERATED ALWAYS AS IDENTITY, b text);
  INSERT INTO itest6 (b) VALUES ('before');
steps:
  - sql: |
      ALTER TABLE itest6 ALTER COLUMN a SET GENERATED BY DEFAULT SET INCREMENT BY 2 SET START WITH 100 RESTART
    expect: ok
  - sql: |
      INSERT INTO itest6 (b) VALUES ('p')
    expect: ok
  - sql: |
      INSERT INTO itest6 (b) VALUES ('q')
    expect: ok
  - sql: |
      SELECT a, b FROM itest6 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE itest6 ALTER COLUMN b SET INCREMENT BY 2
    expect: error
    comment: b is not an identity column
