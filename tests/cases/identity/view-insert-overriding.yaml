# Auto-updatable views pass identity semantics through: DEFAULT VALUES, OVERRIDING, and the ALWAYS rejection.
id: identity.view-insert-overriding
title: Inserts through views follow the underlying identity column's generation rule
family: identity
tier: core
feature_ids: [identity-columns, views, insert, errors]
required_capabilities: [create-table, create-view, insert, select, identity]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest10 (a int GENERATED BY DEFAULT AS IDENTITY, b text);
  CREATE TABLE itest11 (a int GENERATED ALWAYS AS IDENTITY, b text);
  CREATE VIEW itestv10 AS SELECT * FROM itest10;
  CREATE VIEW itestv11 AS SELECT * FROM itest11;
steps:
  - sql: |
      INSERT INTO itestv10 DEFAULT VALUES
    expect: ok
  - sql: |
      INSERT INTO itestv10 DEFAULT VALUES
    expect: ok
  - sql: |
      INSERT INTO itestv11 DEFAULT VALUES
    expect: ok
  - sql: |
      INSERT INTO itestv10 VALUES (10, 'xyz')
    expect: ok
  - sql: |
      INSERT INTO itestv10 OVERRIDING USER VALUE VALUES (11, 'xyz')
    expect: ok
  - sql: |
      INSERT INTO itestv11 VALUES (10, 'xyz')
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO itestv11 OVERRIDING SYSTEM VALUE VALUES (11, 'xyz')
    expect: ok
  - sql: |
      SELECT a, b FROM itestv10 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM itestv11 ORDER BY a
    expect: rows
    order: ordered
