# Identity columns must be NOT NULL; the NULL keyword in either position is rejected.
id: identity.requires-not-null-declaration
title: Identity column with explicit NULL is rejected; NOT NULL in either position is accepted
family: identity
tier: core
feature_ids: [identity-columns, create-table, constraints, errors]
required_capabilities: [create-table, insert, select, identity, constraints]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql (bug #16913 regression)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE itest15 (id integer GENERATED ALWAYS AS IDENTITY NULL)
    expect: error
  - sql: |
      CREATE TABLE itest15 (id integer NULL GENERATED ALWAYS AS IDENTITY)
    expect: error
  - sql: |
      CREATE TABLE itest15 (id integer NOT NULL GENERATED ALWAYS AS IDENTITY)
    expect: ok
  - sql: |
      INSERT INTO itest15 DEFAULT VALUES
    expect: ok
  - sql: |
      SELECT id FROM itest15 ORDER BY id
    expect: rows
    order: ordered
