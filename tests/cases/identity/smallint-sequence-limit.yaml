# Boundary: a smallint identity stops at its maximum (32767) with a sequence limit error; the failed statement inserts nothing.
id: identity.smallint-sequence-limit
title: Smallint identity raises sequence limit error at 32767 and leaves no partial row
family: identity
tier: extended
feature_ids: [identity-columns, sequences, insert, errors, numeric]
required_capabilities: [create-table, insert, select, identity, sequences, errors]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html (identity options); errcodes 2200H sequence_generator_limit_exceeded"
sessions: [a]
setup: |
  CREATE TABLE itest_small (a smallint GENERATED BY DEFAULT AS IDENTITY (START WITH 32766), b text);
steps:
  - sql: |
      INSERT INTO itest_small (b) VALUES ('first')
    expect: ok
  - sql: |
      INSERT INTO itest_small (b) VALUES ('second')
    expect: ok
  - sql: |
      INSERT INTO itest_small (b) VALUES ('third')
    expect: error
    sqlstate: "2200H"
  - sql: |
      SELECT a, b FROM itest_small ORDER BY a
    expect: rows
    order: ordered
