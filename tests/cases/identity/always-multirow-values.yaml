# GENERATED ALWAYS with multi-row VALUES: every row must use DEFAULT, mixing is rejected.
id: identity.always-multirow-values
title: GENERATED ALWAYS multi-row VALUES accept all-DEFAULT rows only
family: identity
tier: core
feature_ids: [identity-columns, insert, create-table, errors]
required_capabilities: [create-table, insert, select, identity]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest5 (a int GENERATED ALWAYS AS IDENTITY, b text);
steps:
  - sql: |
      INSERT INTO itest5 VALUES (1, 'a')
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO itest5 VALUES (DEFAULT, 'a')
    expect: ok
  - sql: |
      INSERT INTO itest5 VALUES (2, 'b'), (3, 'c')
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO itest5 VALUES (DEFAULT, 'b'), (3, 'c')
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO itest5 VALUES (2, 'b'), (DEFAULT, 'c')
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO itest5 VALUES (DEFAULT, 'b'), (DEFAULT, 'c')
    expect: ok
  - sql: |
      SELECT a, b FROM itest5 ORDER BY a
    expect: rows
    order: ordered
