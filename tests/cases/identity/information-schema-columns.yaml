# information_schema.columns exposes identity metadata; internal identity sequences are hidden from information_schema.sequences.
id: identity.information-schema-columns
title: information_schema reports identity generation, start, increment and bounds
family: identity
tier: core
feature_ids: [identity-columns, catalog-introspection, information-schema]
required_capabilities: [create-table, select, identity, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/identity.sql"
sessions: [a]
setup: |
  CREATE TABLE itest1 (a int GENERATED BY DEFAULT AS IDENTITY (START WITH 7 INCREMENT BY 5), b text);
  CREATE TABLE itest2 (a bigint GENERATED ALWAYS AS IDENTITY, b text);
  CREATE TABLE itest_plain (a int, b text);
steps:
  - sql: |
      SELECT table_name, column_name, column_default, is_nullable, is_identity, identity_generation, identity_start, identity_increment, identity_maximum, identity_minimum, identity_cycle FROM information_schema.columns WHERE table_schema = 'public' AND table_name LIKE 'itest%' ORDER BY 1, 2
    expect: rows
    order: ordered
  - sql: |
      SELECT sequence_name FROM information_schema.sequences WHERE sequence_name LIKE 'itest%'
    expect: rows
    comment: internal identity sequences are not listed
