# Boundary: CYCLE wraps to MINVALUE after MAXVALUE; without CYCLE the same sequence would error.
id: identity.cycle-wraparound
title: GENERATED ALWAYS identity with MAXVALUE 3 CYCLE wraps back to 1
family: identity
tier: core
feature_ids: [identity-columns, sequences, insert]
required_capabilities: [create-table, insert, select, identity, sequences]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html (identity sequence options, CYCLE)"
sessions: [a]
setup: |
  CREATE TABLE itest_cyc (a int GENERATED ALWAYS AS IDENTITY (MINVALUE 1 MAXVALUE 3 CYCLE), b text);
steps:
  - sql: |
      INSERT INTO itest_cyc (b) VALUES ('w')
    expect: ok
  - sql: |
      INSERT INTO itest_cyc (b) VALUES ('x')
    expect: ok
  - sql: |
      INSERT INTO itest_cyc (b) VALUES ('y')
    expect: ok
  - sql: |
      INSERT INTO itest_cyc (b) VALUES ('z')
    expect: ok
  - sql: |
      SELECT a, b FROM itest_cyc ORDER BY b
    expect: rows
    order: ordered
