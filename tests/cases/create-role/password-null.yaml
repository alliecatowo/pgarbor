# PASSWORD NULL and never-set passwords both leave rolpassword NULL; ENCRYPTED PASSWORD stores a non-null value.
id: create-role.password-null
title: PASSWORD NULL clears the stored password, ENCRYPTED PASSWORD stores one, no clause leaves it NULL
family: create-role
tier: core
feature_ids: [roles, create-role, alter-role, nulls, catalog-introspection]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_role.sql (ENCRYPTED PASSWORD, PASSWORD NULL)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE rp_null PASSWORD NULL
    expect: ok
  - sql: |
      CREATE ROLE rp_enc ENCRYPTED PASSWORD 'foo'
    expect: ok
  - sql: |
      CREATE ROLE rp_plain
    expect: ok
  - sql: |
      SELECT rolname, rolpassword IS NULL AS pw_is_null
        FROM pg_roles
       WHERE rolname IN ('rp_null', 'rp_enc', 'rp_plain')
       ORDER BY rolname
    expect: rows
    order: ordered
  - sql: |
      ALTER ROLE rp_enc PASSWORD NULL
    expect: ok
  - sql: |
      SELECT rolpassword IS NULL AS pw_is_null FROM pg_roles WHERE rolname = 'rp_enc'
    expect: rows
  - sql: |
      DROP ROLE rp_null, rp_enc, rp_plain
    expect: ok
