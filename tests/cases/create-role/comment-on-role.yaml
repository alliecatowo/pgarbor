# COMMENT ON ROLE sets, replaces and removes the shared description; NULL and empty string both remove it.
id: create-role.comment-on-role
title: COMMENT ON ROLE sets and removes the role description; NULL and empty string both remove it
family: create-role
tier: extended
feature_ids: [roles, comment-on, catalog-introspection, errors]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_role.sql (COMMENT ON ROLE section)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE rcm_role
    expect: ok
  - sql: |
      COMMENT ON ROLE rcm_role IS 'some comment'
    expect: ok
  - sql: |
      SELECT shobj_description('rcm_role'::regrole, 'pg_authid') AS description
    expect: rows
  - sql: |
      COMMENT ON ROLE rcm_role IS NULL
    expect: ok
  - sql: |
      SELECT shobj_description('rcm_role'::regrole, 'pg_authid') IS NULL AS no_comment
    expect: rows
  - sql: |
      COMMENT ON ROLE rcm_role IS 'add back'
    expect: ok
  - sql: |
      COMMENT ON ROLE rcm_role IS ''
    expect: ok
  - sql: |
      SELECT shobj_description('rcm_role'::regrole, 'pg_authid') IS NULL AS no_comment
    expect: rows
  - sql: |
      COMMENT ON ROLE rcm_nosuch IS 'x'
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP ROLE rcm_role
    expect: ok
