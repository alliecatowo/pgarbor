# A second CREATE ROLE with the same name fails even with different attributes; the first role is unchanged.
id: create-role.duplicate-name-error
title: Creating an existing role name fails with duplicate_object and leaves the original role intact
family: create-role
tier: core
feature_ids: [roles, create-role, errors]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: hand
  ref: "PG18 errcodes 42710 duplicate_object; sql-createrole.html"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE rd_dup LOGIN
    expect: ok
  - sql: |
      CREATE ROLE rd_dup
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE ROLE rd_dup NOLOGIN CREATEDB
    expect: error
    sqlstate: "42710"
  - sql: |
      SELECT rolname, rolcanlogin, rolcreatedb FROM pg_roles WHERE rolname = 'rd_dup'
    expect: rows
  - sql: |
      DROP ROLE rd_dup
    expect: ok
