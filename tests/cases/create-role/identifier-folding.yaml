# Unquoted role identifiers fold to lower case; quoted identifiers keep case; duplicates detected after folding.
id: create-role.identifier-folding
title: Unquoted role names fold to lower case and collide with the quoted lower-case spelling
family: create-role
tier: core
feature_ids: [roles, create-role, identifiers, errors]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: hand
  ref: "PG18 docs sql-createrole.html (name); identifiers folding rules in sql-syntax-lexical.html"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE Cr_Fold
    expect: ok
  - sql: |
      CREATE ROLE "Cr_Quoted"
    expect: ok
  - sql: |
      SELECT rolname, length(rolname) AS len
        FROM pg_roles
       WHERE rolname IN ('cr_fold', 'Cr_Quoted')
       ORDER BY rolname
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS upper_hits FROM pg_roles WHERE rolname = 'Cr_Fold'
    expect: rows
  - sql: |
      CREATE ROLE cr_fold
    expect: error
    sqlstate: "42710"
  - sql: |
      CREATE ROLE "cr_fold"
    expect: error
    sqlstate: "42710"
  - sql: |
      DROP ROLE cr_fold, "Cr_Quoted"
    expect: ok
