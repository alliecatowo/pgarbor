# pg_database_owner is a fixed role and cannot take explicit members via CREATE ROLE ... IN ROLE.
id: create-role.database-owner-membership
title: CREATE ROLE IN ROLE pg_database_owner fails with feature_not_supported and creates nothing
family: create-role
tier: extended
feature_ids: [roles, create-role, role-membership, errors]
required_capabilities: [roles, catalog-introspection, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_role.sql; expected 'role \"pg_database_owner\" cannot have explicit members'"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE rdo_x IN ROLE pg_database_owner
    expect: error
    sqlstate: "0A000"
    comment: PG18 raises feature_not_supported (check_role_membership_authorization), not invalid_grant_operation
  - sql: |
      SELECT count(*) AS rdo_x_exists FROM pg_roles WHERE rolname = 'rdo_x'
    expect: rows
  - sql: |
      CREATE ROLE rdo_ok
    expect: ok
  - sql: |
      SELECT rolname FROM pg_roles WHERE rolname = 'rdo_ok'
    expect: rows
  - sql: |
      DROP ROLE rdo_ok
    expect: ok
