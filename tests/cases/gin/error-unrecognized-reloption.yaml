# An unknown storage parameter on a GIN index is rejected and no index is left behind.
id: gin.error-unrecognized-reloption
title: CREATE INDEX with an unrecognized GIN storage parameter fails with 22023
family: gin
tier: core
feature_ids: [gin-index, reloptions, errors]
required_capabilities: [create-table, create-index, gin-index, reloptions, errors, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/gin.sql
sessions: [a]
setup: |
  CREATE TABLE gin_bad (i int4[]);
steps:
  - sql: |
      CREATE INDEX gin_bad_idx ON gin_bad USING gin (i) WITH (no_such_gin_option = 1)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'gin_bad_idx'
    expect: rows
