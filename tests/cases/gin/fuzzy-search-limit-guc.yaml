# gin_fuzzy_search_limit GUC: default, SET, RESET, and a containment query that runs under it.
id: gin.fuzzy-search-limit-guc
title: gin_fuzzy_search_limit SET, SHOW and RESET around a containment query
family: gin
tier: core
feature_ids: [gin-index, guc, arrays]
required_capabilities: [create-table, create-index, gin-index, insert, select, guc, arrays]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/gin.sql
sessions: [a]
setup: |
  CREATE TABLE gin_fz (id int4 PRIMARY KEY, i int4[]);
  CREATE INDEX gin_fz_idx ON gin_fz USING gin (i);
  INSERT INTO gin_fz SELECT g, array[1, g] FROM generate_series(1, 100) g;
steps:
  - sql: |
      SHOW gin_fuzzy_search_limit
    expect: rows
  - sql: |
      SET gin_fuzzy_search_limit = 1000
    expect: ok
  - sql: |
      SHOW gin_fuzzy_search_limit
    expect: rows
  - sql: |
      SELECT count(*) > 0 AS ok FROM gin_fz WHERE i @> '{1}'
    expect: rows
  - sql: |
      RESET gin_fuzzy_search_limit
    expect: ok
  - sql: |
      SHOW gin_fuzzy_search_limit
    expect: rows
