# gin_pending_list_limit below its minimum is rejected; the boundary value is accepted.
id: gin.error-reloption-out-of-range
title: GIN gin_pending_list_limit below minimum is rejected with 22023
family: gin
tier: core
feature_ids: [gin-index, reloptions, errors]
required_capabilities: [create-table, create-index, gin-index, reloptions, errors, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/gin.sql
sessions: [a]
setup: |
  CREATE TABLE gin_opt (i int4[]);
steps:
  - sql: |
      CREATE INDEX gin_opt_idx ON gin_opt USING gin (i) WITH (gin_pending_list_limit = 63)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'gin_opt_idx'
    expect: rows
  - sql: |
      CREATE INDEX gin_opt_idx ON gin_opt USING gin (i) WITH (gin_pending_list_limit = 64)
    expect: ok
