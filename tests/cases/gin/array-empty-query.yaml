# Empty-array query operands: @> '{}' matches every non-NULL array, <@ '{}' matches only empty arrays, && '{}' matches nothing.
id: gin.array-empty-query
title: Empty-array query operands with @>, <@ and && on a GIN index
family: gin
tier: core
feature_ids: [gin-index, arrays, array-containment, array-overlap]
required_capabilities: [create-table, create-index, gin-index, insert, select, arrays]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/gin.sql
sessions: [a]
setup: |
  CREATE TABLE gin_e (id int4 PRIMARY KEY, i int4[]);
  CREATE INDEX gin_e_idx ON gin_e USING gin (i);
  INSERT INTO gin_e VALUES (1, '{1}'), (2, '{}'), (3, NULL), (4, '{2,3}');
steps:
  - sql: |
      SELECT id FROM gin_e WHERE i @> '{}' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM gin_e WHERE i <@ '{}' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM gin_e WHERE i && '{}' ORDER BY id
    expect: rows
    order: ordered
