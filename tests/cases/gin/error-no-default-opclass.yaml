# A GIN index on a scalar int4 column has no default operator class for the gin access method.
id: gin.error-no-default-opclass
title: CREATE INDEX USING gin on int4 fails with no default operator class
family: gin
tier: core
feature_ids: [gin-index, create-index, errors]
required_capabilities: [create-table, create-index, gin-index, select, errors]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/gin.sql
sessions: [a]
setup: |
  CREATE TABLE gin_noop (i int4);
  INSERT INTO gin_noop VALUES (1), (2);
steps:
  - sql: |
      CREATE INDEX gin_noop_idx ON gin_noop USING gin (i)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'gin_noop_idx'
    expect: rows
  - sql: |
      SELECT count(*) FROM gin_noop
    expect: rows
