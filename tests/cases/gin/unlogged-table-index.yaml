# Unlogged table with a multicolumn GIN index: NULL, empty and populated arrays, plus relpersistence check.
id: gin.unlogged-table-index
title: GIN index on an unlogged table with NULL and empty arrays
family: gin
tier: extended
feature_ids: [gin-index, unlogged-tables, arrays, catalog-introspection]
required_capabilities: [create-table, create-index, gin-index, insert, select, drop-table, arrays, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/gin.sql
sessions: [a]
steps:
  - sql: |
      CREATE UNLOGGED TABLE gin_unlog (i int4[], j int4[])
    expect: ok
  - sql: |
      CREATE INDEX ON gin_unlog USING gin (i, j)
    expect: ok
  - sql: |
      INSERT INTO gin_unlog VALUES (NULL, NULL), ('{}', NULL), ('{1}', '{2,3}')
    expect: ok
  - sql: |
      SELECT count(*) FROM gin_unlog WHERE i @> '{}'
    expect: rows
  - sql: |
      SELECT relpersistence FROM pg_class WHERE relname = 'gin_unlog'
    expect: rows
  - sql: |
      DROP TABLE gin_unlog
    expect: ok
