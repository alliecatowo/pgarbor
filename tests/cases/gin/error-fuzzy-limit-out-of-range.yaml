# A negative gin_fuzzy_search_limit is rejected with 22023 and the previous value stays in effect.
id: gin.error-fuzzy-limit-out-of-range
title: SET gin_fuzzy_search_limit to a negative value fails with 22023
family: gin
tier: core
feature_ids: [guc, errors]
required_capabilities: [guc, errors, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/gin.sql
sessions: [a]
steps:
  - sql: |
      SET gin_fuzzy_search_limit = -1
    expect: error
    sqlstate: "22023"
  - sql: |
      SHOW gin_fuzzy_search_limit
    expect: rows
