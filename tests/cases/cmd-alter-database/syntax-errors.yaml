# Incomplete or malformed ALTER DATABASE forms are syntax errors, whatever the database name.
id: cmd-alter-database.syntax-errors
title: Malformed ALTER DATABASE forms fail with 42601
family: cmd-alter-database
tier: core
feature_ids: [alter-database, grammar, errors]
required_capabilities: [errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Synopsis)"
sessions: [a]
steps:
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch SET
    expect: error
    sqlstate: "42601"
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch SET enable_indexscan
    expect: error
    sqlstate: "42601"
    comment: SET needs TO or = and a value
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch RENAME
    expect: error
    sqlstate: "42601"
    comment: RENAME needs TO and a name
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch SET TABLESPACE
    expect: error
    sqlstate: "42601"
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch ALLOW_CONNECTIONS maybe
    expect: error
    sqlstate: "42601"
    comment: ALLOW_CONNECTIONS takes a boolean
