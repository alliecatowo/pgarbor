# RESET ALL clears every database-specific setting; RESET ALL with nothing stored is accepted.
id: cmd-alter-database.reset-all-clears-settings
title: ALTER DATABASE RESET ALL clears all database-level settings
family: cmd-alter-database
tier: core
feature_ids: [alter-database, reset-all, guc-database-default]
required_capabilities: [guc, plpgsql, select]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Parameters: RESET ALL)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET enable_indexscan TO off', current_database()); END $$;
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET work_mem = ''8MB''', current_database()); END $$;
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I RESET ALL', current_database()); END $$;
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase WHERE d.datname = current_database()
    expect: rows
    comment: no database-specific settings remain
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I RESET ALL', current_database()); END $$;
    expect: ok
    comment: nothing to clear is not an error
