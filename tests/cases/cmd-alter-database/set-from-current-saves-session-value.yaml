# SET ... FROM CURRENT stores the session's current value as the database default.
id: cmd-alter-database.set-from-current-saves-session-value
title: ALTER DATABASE SET FROM CURRENT saves the session value as the database default
family: cmd-alter-database
tier: core
feature_ids: [alter-database, from-current, guc-database-default]
required_capabilities: [guc, plpgsql, select]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Parameters: SET FROM CURRENT)"
sessions: [a]
steps:
  - sql: |
      SET statement_timeout = '7s'
    expect: ok
    comment: session-level value, not yet a database default
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET statement_timeout FROM CURRENT', current_database()); END $$;
    expect: ok
  - reconnect: true
  - sql: |
      SELECT current_setting('statement_timeout') AS st
    expect: rows
    comment: the value saved from the earlier session is the new session default
