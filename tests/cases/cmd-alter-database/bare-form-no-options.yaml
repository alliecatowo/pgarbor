# The options list is optional: ALTER DATABASE name with nothing after it is accepted.
id: cmd-alter-database.bare-form-no-options
title: ALTER DATABASE with a name and no options is accepted
family: cmd-alter-database
tier: core
feature_ids: [alter-database, grammar, optional-options]
required_capabilities: [plpgsql, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Synopsis: [ [ WITH ] option [ ... ] ])"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I', current_database()); END $$;
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I WITH CONNECTION LIMIT -1', current_database()); END $$;
    expect: ok
    comment: WITH followed by a single option is accepted
