# A value that the parameter rejects fails the statement and stores nothing.
id: cmd-alter-database.error-invalid-parameter-value
title: ALTER DATABASE SET rejects invalid parameter values
family: cmd-alter-database
tier: core
feature_ids: [alter-database, guc-database-default, errors, boundary-values]
required_capabilities: [guc, plpgsql, errors, select]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (value)"
sessions: [a]
quarantine:
  reason: "NONDETERMINISTIC recording: the error/notice CONTEXT names the per-case database (pgarbor_case_<pid>_<10 random hex>, oracle/pool.py), which differs between recording runs. Needs a context-masking normalizer (oracle amendment) or a non-EXECUTE formulation."
  since: "2026-10-15"
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET work_mem = ''bogus''', current_database()); END $$;
    expect: error
    sqlstate: "22023"
    compare_message: false
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET enable_indexscan TO ''maybe''', current_database()); END $$;
    expect: error
    sqlstate: "22023"
    compare_message: false
    comment: boolean parameter accepts only boolean spellings
  - sql: |
      SELECT count(*) AS n FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase WHERE d.datname = current_database()
    expect: rows
    comment: nothing stored after the two rejections
