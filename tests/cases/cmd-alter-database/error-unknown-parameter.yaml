# An unrecognized configuration parameter is rejected and nothing is stored.
id: cmd-alter-database.error-unknown-parameter
title: ALTER DATABASE SET rejects an unrecognized configuration parameter
family: cmd-alter-database
tier: core
feature_ids: [alter-database, guc-database-default, errors]
required_capabilities: [guc, plpgsql, errors, select]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (configuration_parameter)"
sessions: [a]
quarantine:
  reason: "NONDETERMINISTIC recording: the error/notice CONTEXT names the per-case database (pgarbor_case_<pid>_<10 random hex>, oracle/pool.py), which differs between recording runs. Needs a context-masking normalizer (oracle amendment) or a non-EXECUTE formulation."
  since: "2026-10-15"
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET no_such_guc_x = 1', current_database()); END $$;
    expect: error
    sqlstate: "42704"
    compare_message: false
    comment: undefined parameter name without a dotted prefix
  - sql: |
      SELECT count(*) AS n FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase WHERE d.datname = current_database()
    expect: rows
    comment: the failed statement stored nothing
