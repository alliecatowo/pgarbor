# The current database cannot be renamed; the documentation says to connect elsewhere first.
id: cmd-alter-database.rename-current-database-rejected
title: ALTER DATABASE RENAME rejects the database the session is connected to
family: cmd-alter-database
tier: core
feature_ids: [alter-database, rename, errors]
required_capabilities: [plpgsql, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Description, RENAME TO)"
sessions: [a]
quarantine:
  reason: "NONDETERMINISTIC recording: the error/notice CONTEXT names the per-case database (pgarbor_case_<pid>_<10 random hex>, oracle/pool.py), which differs between recording runs. Needs a context-masking normalizer (oracle amendment) or a non-EXECUTE formulation."
  since: "2026-10-15"
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I RENAME TO cmd_alter_database_renamed', current_database()); END $$;
    expect: error
    sqlstate: "0A000"
    compare_message: false
    comment: the current database cannot be renamed
