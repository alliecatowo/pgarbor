# TO DEFAULT and RESET remove the database-specific setting; the other settings stay.
id: cmd-alter-database.set-default-and-reset-remove-settings
title: SET TO DEFAULT and RESET remove individual database-level settings
family: cmd-alter-database
tier: core
feature_ids: [alter-database, guc-database-default, reset, set-default]
required_capabilities: [guc, plpgsql, select]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Parameters: value DEFAULT, RESET)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET enable_indexscan TO off', current_database()); END $$;
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET work_mem = ''8MB''', current_database()); END $$;
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET statement_timeout TO DEFAULT', current_database()); END $$;
    expect: ok
    comment: DEFAULT on a setting never stored is a no-op
  - sql: |
      SELECT s.setconfig AS cfg FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase WHERE d.datname = current_database()
    expect: rows
    comment: two entries stored
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I RESET enable_indexscan', current_database()); END $$;
    expect: ok
  - sql: |
      SELECT s.setconfig AS cfg FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase WHERE d.datname = current_database()
    expect: rows
    comment: only work_mem remains
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET work_mem TO DEFAULT', current_database()); END $$;
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase WHERE d.datname = current_database()
    expect: rows
    comment: the row is removed once no settings remain
