# OWNER TO a role that does not exist fails and leaves the owner unchanged.
id: cmd-alter-database.owner-to-unknown-role
title: ALTER DATABASE OWNER TO an undefined role fails and keeps the owner
family: cmd-alter-database
tier: core
feature_ids: [alter-database, owner, errors]
required_capabilities: [plpgsql, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Synopsis: OWNER TO new_owner)"
sessions: [a]
quarantine:
  reason: "NONDETERMINISTIC recording: the error/notice CONTEXT names the per-case database (pgarbor_case_<pid>_<10 random hex>, oracle/pool.py), which differs between recording runs. Needs a context-masking normalizer (oracle amendment) or a non-EXECUTE formulation."
  since: "2026-10-15"
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I OWNER TO cmd_alter_database_no_role', current_database()); END $$;
    expect: error
    sqlstate: "42704"
    compare_message: false
  - sql: |
      SELECT pg_get_userbyid(datdba) = current_user AS owner_unchanged FROM pg_database WHERE datname = current_database()
    expect: rows
