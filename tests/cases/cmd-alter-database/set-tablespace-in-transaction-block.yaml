# ALTER DATABASE SET TABLESPACE cannot run inside a transaction block, and it needs an existing database.
id: cmd-alter-database.set-tablespace-in-transaction-block
title: ALTER DATABASE SET TABLESPACE is refused inside a transaction block
family: cmd-alter-database
tier: core
feature_ids: [alter-database, set-tablespace, transactions, errors]
required_capabilities: [transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Parameters: new_tablespace)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch SET TABLESPACE pg_default
    expect: error
    sqlstate: "25001"
    comment: the transaction block check comes before the database lookup
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch SET TABLESPACE pg_default
    expect: error
    sqlstate: "3D000"
    comment: outside a transaction block the missing database fails
