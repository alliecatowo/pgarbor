# CONNECTION LIMIT accepts 0 and -1 (no limit) and rejects values below -1; the WITH keyword is optional.
id: cmd-alter-database.connection-limit-boundaries
title: ALTER DATABASE CONNECTION LIMIT boundary values
family: cmd-alter-database
tier: core
feature_ids: [alter-database, connection-limit, boundary-values, errors]
required_capabilities: [plpgsql, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Parameters: connlimit)"
sessions: [a]
notes: "Limit 0 would block new connections, so the case never reconnects while it is set. It ends at -1."
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I WITH CONNECTION LIMIT 0', current_database()); END $$;
    expect: ok
    comment: WITH is optional; 0 is a valid limit
  - sql: |
      SELECT datconnlimit FROM pg_database WHERE datname = current_database()
    expect: rows
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I CONNECTION LIMIT -1', current_database()); END $$;
    expect: ok
    comment: -1 means no limit
  - sql: |
      SELECT datconnlimit FROM pg_database WHERE datname = current_database()
    expect: rows
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I CONNECTION LIMIT -2', current_database()); END $$;
    expect: error
    sqlstate: "22023"
    compare_message: false
    comment: values below -1 are invalid
  - sql: |
      SELECT datconnlimit FROM pg_database WHERE datname = current_database()
    expect: rows
    comment: the rejected value leaves the previous limit (-1) in place
