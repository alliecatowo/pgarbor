# Successful rename of a database other than the session's needs a second database (CREATE DATABASE side effects).
id: cmd-alter-database.quarantined-rename-to-free-name
title: ALTER DATABASE RENAME TO a free name succeeds for another database
family: cmd-alter-database
tier: extended
feature_ids: [alter-database, rename]
required_capabilities: [plpgsql]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Description, RENAME TO)"
sessions: [a]
steps:
  - sql: |
      ALTER DATABASE cmd_alter_database_other RENAME TO cmd_alter_database_renamed
    expect: ok
quarantine:
  reason: "needs a second database; isolated case databases cannot create one (CREATE DATABASE side effects)"
