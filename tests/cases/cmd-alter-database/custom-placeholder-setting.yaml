# Dotted custom placeholder names can be stored per database and read back with current_setting.
id: cmd-alter-database.custom-placeholder-setting
title: ALTER DATABASE can store a custom dotted placeholder setting
family: cmd-alter-database
tier: extended
feature_ids: [alter-database, custom-placeholder, guc-database-default, current-setting]
required_capabilities: [guc, plpgsql, select]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (configuration_parameter; runtime-config placeholders)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I SET myapp.tenant = ''acme''', current_database()); END $$;
    expect: ok
  - sql: |
      SELECT current_setting('myapp.tenant', true) IS NULL AS unset_in_this_session
    expect: rows
    comment: the setting only reaches sessions started afterwards
  - reconnect: true
  - sql: |
      SELECT current_setting('myapp.tenant') AS tenant, current_setting('myapp.missing', true) IS NULL AS missing_is_null
    expect: rows
