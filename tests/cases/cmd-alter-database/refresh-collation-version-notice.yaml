# REFRESH COLLATION VERSION on a database whose recorded version is current reports a notice and changes nothing.
id: cmd-alter-database.refresh-collation-version-notice
title: ALTER DATABASE REFRESH COLLATION VERSION reports no change when the version is current
family: cmd-alter-database
tier: extended
feature_ids: [alter-database, collation-version, notices]
required_capabilities: [plpgsql, collation-version, notices]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alter-database (Parameters: REFRESH COLLATION VERSION); sql-altercollation notes"
sessions: [a]
quarantine:
  reason: "NONDETERMINISTIC recording: the error/notice CONTEXT names the per-case database (pgarbor_case_<pid>_<10 random hex>, oracle/pool.py), which differs between recording runs. Needs a context-masking normalizer (oracle amendment) or a non-EXECUTE formulation."
  since: "2026-10-15"
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I REFRESH COLLATION VERSION', current_database()); END $$;
    expect: notice
    comment: the stored version matches the installed library, so PostgreSQL reports that it did not change
