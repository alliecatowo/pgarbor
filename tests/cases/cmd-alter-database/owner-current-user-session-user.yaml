# OWNER TO CURRENT_USER, CURRENT_ROLE and SESSION_USER are accepted; the owner is the session role.
id: cmd-alter-database.owner-current-user-session-user
title: ALTER DATABASE OWNER TO accepts CURRENT_USER, CURRENT_ROLE and SESSION_USER
family: cmd-alter-database
tier: core
feature_ids: [alter-database, owner, owner-keywords]
required_capabilities: [plpgsql, select, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Synopsis: OWNER TO)"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I OWNER TO CURRENT_USER', current_database()); END $$;
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I OWNER TO CURRENT_ROLE', current_database()); END $$;
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE format('ALTER DATABASE %I OWNER TO SESSION_USER', current_database()); END $$;
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(datdba) = current_user AS owner_is_session_role FROM pg_database WHERE datname = current_database()
    expect: rows
