# Each form of ALTER DATABASE on a database name that does not exist fails with invalid_catalog_name.
id: cmd-alter-database.error-nonexistent-database
title: ALTER DATABASE forms on a missing database fail with 3D000
family: cmd-alter-database
tier: core
feature_ids: [alter-database, errors, missing-database]
required_capabilities: [guc, errors]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Synopsis)"
sessions: [a]
steps:
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch SET enable_indexscan TO off
    expect: error
    sqlstate: "3D000"
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch RESET enable_indexscan
    expect: error
    sqlstate: "3D000"
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch RESET ALL
    expect: error
    sqlstate: "3D000"
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch CONNECTION LIMIT 2
    expect: error
    sqlstate: "3D000"
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch RENAME TO cmd_alter_database_other
    expect: error
    sqlstate: "3D000"
  - sql: |
      ALTER DATABASE cmd_alter_database_nosuch SET TABLESPACE pg_default
    expect: error
    sqlstate: "3D000"
    comment: outside a transaction block, the missing database is what fails
