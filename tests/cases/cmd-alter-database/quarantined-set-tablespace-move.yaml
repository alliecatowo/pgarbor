# Moving the default tablespace physically copies files to a real tablespace directory and needs no connections.
id: cmd-alter-database.quarantined-set-tablespace-move
title: ALTER DATABASE SET TABLESPACE moves the database to a new default tablespace
family: cmd-alter-database
tier: extended
feature_ids: [alter-database, set-tablespace, tablespaces]
required_capabilities: [plpgsql]
provenance:
  source: pg-docs
  ref: "ref/alter_database.sgml#sql-alterdatabase (Description, SET TABLESPACE)"
sessions: [a]
steps:
  - sql: |
      ALTER DATABASE cmd_alter_database_other SET TABLESPACE cmd_alter_database_ts
    expect: ok
quarantine:
  reason: "needs a server-side tablespace directory and an empty database with no other connections; not isolatable in one case"
