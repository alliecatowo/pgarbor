# Division, modulo and div() by zero raise division_by_zero, including for a zero dividend.
id: numeric.div-by-zero
title: Division, modulo and div by zero raise SQLSTATE 22012
family: numeric
tier: core
feature_ids: [numeric, errors, arithmetic]
required_capabilities: [select, numeric, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1::numeric / 0
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT '0'::numeric / '0'
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT '4.2'::numeric % '0'
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT div('1'::numeric, '0')
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1::numeric / 2 AS still_fine
    expect: rows
    comment: a later statement in the same session still works after errors
