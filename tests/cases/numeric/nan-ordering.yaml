# NaN equals NaN, sorts above every other numeric value including Infinity, and is distinct from NULL.
id: numeric.nan-ordering
title: NaN equality and sort order against Infinity and NULL
family: numeric
tier: core
feature_ids: [numeric, select, order-by, nan-inf, nulls]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE nn (id int4, v numeric);
  INSERT INTO nn VALUES (1, 'NaN'), (2, '1'), (3, 'Infinity'), (4, NULL), (5, 'NaN'), (6, '-Infinity'), (7, '0');
steps:
  - sql: |
      SELECT id, v FROM nn ORDER BY v, id
    expect: rows
    order: ordered
    comment: ascending order puts -Infinity first, NaN before NULL
  - sql: |
      SELECT id FROM nn WHERE v = 'NaN'::numeric ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(DISTINCT v) AS d, count(v) AS c FROM nn
    expect: rows
