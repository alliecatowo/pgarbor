# Domain errors for sqrt and ln: negative and zero inputs raise specific SQLSTATEs; sqrt(0) and sqrt(NaN) are fine.
id: numeric.math-domain-errors
title: sqrt and ln domain errors for negative and zero inputs
family: numeric
tier: core
feature_ids: [numeric, errors, math-functions]
required_capabilities: [select, numeric, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT sqrt('-1'::numeric)
    expect: error
    sqlstate: "2201F"
  - sql: |
      SELECT sqrt('-inf'::numeric)
    expect: error
    sqlstate: "2201F"
  - sql: |
      SELECT ln('0'::numeric)
    expect: error
    sqlstate: "2201E"
  - sql: |
      SELECT ln('-1'::numeric)
    expect: error
    sqlstate: "2201E"
  - sql: |
      SELECT sqrt(x) AS r FROM (VALUES ('0'::numeric), ('nan'::numeric), ('inf'::numeric)) AS v(x) ORDER BY x
    expect: rows
    order: ordered
