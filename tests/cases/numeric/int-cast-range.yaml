# numeric to int8/int4 casts round half away from zero, then range-check; out-of-range raises 22003.
id: numeric.int-cast-range
title: numeric to int8 and int4 casts at the range boundaries
family: numeric
tier: core
feature_ids: [numeric, casts, errors]
required_capabilities: [select, numeric, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT (-9223372036854775808.5)::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-9223372036854775808.4)::int8 AS lo_ok
    expect: rows
  - sql: |
      SELECT 9223372036854775807.4::int8 AS hi_ok
    expect: rows
  - sql: |
      SELECT 9223372036854775807.5::int8
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 2147483648::numeric::int4
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 'NaN'::numeric::int8
    expect: error
    sqlstate: "0A000"
    comment: NaN has no integer representation; PG reports cannot convert NaN to bigint (feature_not_supported)
