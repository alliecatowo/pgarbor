# Infinity and NaN arithmetic over all pairs of special and ordinary operands (non-error combinations).
id: numeric.nan-inf-arith
title: Addition, subtraction and multiplication with Infinity and NaN operands
family: numeric
tier: core
feature_ids: [numeric, select, nan-inf]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      WITH v(x) AS (VALUES ('0'::numeric), ('1'), ('-1'), ('4.2'), ('inf'), ('-inf'), ('nan'))
      SELECT x1, x2, x1 + x2 AS sum, x1 - x2 AS diff, x1 * x2 AS prod
      FROM v AS v1(x1), v AS v2(x2)
      ORDER BY x1, x2
    expect: rows
    order: ordered
