# NULL propagates through numeric operators and functions; NULL comparisons yield NULL, not false.
id: numeric.null-propagation
title: NULL propagation through numeric operators, functions and comparisons
family: numeric
tier: core
feature_ids: [numeric, nulls, select]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT NULL::numeric + 1 AS a1, 1 - NULL::numeric AS a2, NULL::numeric * 0 AS a3, NULL::numeric / 2 AS a4,
             abs(NULL::numeric) AS a5, round(NULL::numeric, 2) AS a6, sign(NULL::numeric) AS a7,
             NULL::numeric = NULL::numeric AS a8, (NULL::numeric < 1) IS NULL AS a9
    expect: rows
  - sql: |
      SELECT coalesce(NULL::numeric, 3.5) AS c1, nullif(4.0::numeric, 4) AS c2, nullif(4.0::numeric, 5) AS c3
    expect: rows
    comment: nullif compares numerically, so 4.0 and 4 are equal
