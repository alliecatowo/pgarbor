# Numeric division result scale, and truncating div() versus mod() sign rules.
id: numeric.div-scale
title: Numeric division result scale, div truncation and mod sign
family: numeric
tier: core
feature_ids: [numeric, select, arithmetic]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE dv (id int4, a numeric, b numeric);
  INSERT INTO dv VALUES (1, 0, 1), (2, 2, -3), (3, -34338492.215397047, 7799461.4119), (4, 4.31, 0.5), (5, 9, 9);
steps:
  - sql: |
      SELECT id, a / b AS q FROM dv ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT 2::numeric / 3 AS q1, 1::numeric / 7 AS q2, '-7'::numeric / 2 AS q3
    expect: rows
  - sql: |
      SELECT div('-7'::numeric, '2') AS d, mod('-7'::numeric, '2') AS m, div('7'::numeric, '-2') AS d2, mod('7'::numeric, '-2') AS m2
    expect: rows
    comment: div truncates toward zero; mod takes the sign of the dividend
