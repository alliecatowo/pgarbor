# round, trunc, floor, ceil, sign, abs and numeric_inc over ordinary, half-way, negative and special values.
id: numeric.round-trunc-sign
title: round, trunc, floor, ceil, sign and abs on negative, half-way and special numeric values
family: numeric
tier: core
feature_ids: [numeric, select, math-functions, nan-inf]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      WITH v(x) AS (VALUES ('0'::numeric), ('1'), ('-1'), ('4.2'), ('-7.777'), ('2.5'), ('-2.5'), ('inf'), ('-inf'), ('nan'))
      SELECT x, -x AS minusx, abs(x) AS absx, floor(x) AS fl, ceil(x) AS ce, sign(x) AS sg, numeric_inc(x) AS inc
      FROM v ORDER BY x
    expect: rows
    order: ordered
  - sql: |
      WITH v(x) AS (VALUES ('0'::numeric), ('1'), ('-1'), ('4.2'), ('-7.777'), ('2.5'), ('-2.5'), ('inf'), ('-inf'), ('nan'))
      SELECT x, round(x) AS r0, round(x, 1) AS r1, trunc(x) AS t0, trunc(x, 1) AS t1
      FROM v ORDER BY x
    expect: rows
    order: ordered
    comment: round is half away from zero, so 2.5 and -2.5 round to 3 and -3
