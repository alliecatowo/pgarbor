# Basic numeric addition, subtraction and multiplication over a small table, ordered output.
id: numeric.add-sub-mul
title: Numeric add, subtract and multiply over a small table with zero, negative and large operands
family: numeric
tier: core
feature_ids: [numeric, select, arithmetic]
required_capabilities: [create-table, insert, select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE num_pairs (id int4, a numeric, b numeric);
  INSERT INTO num_pairs VALUES (1, 0, 0), (2, 4.31, -7799461.4119), (3, -34338492.215397047, 74881), (4, 1, 0.0000000001), (5, 16397.038491, 16397.038491);
steps:
  - sql: |
      SELECT id, a + b AS sum, a - b AS diff, a * b AS prod FROM num_pairs ORDER BY id
    expect: rows
    order: ordered
    comment: scale of results follows the operand scales as in numeric.sql expected rows
  - sql: |
      SELECT id, round(a + b, 10) AS sum10, round(a - b, 40) AS diff40 FROM num_pairs ORDER BY id
    expect: rows
    order: ordered
