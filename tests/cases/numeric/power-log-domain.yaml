# power() and log() valid integer-exponent cases, and the 2201F error for a negative base with a non-integer exponent.
id: numeric.power-log-domain
title: power with negative integer exponents and the complex-result error for non-integer exponents
family: numeric
tier: extended
feature_ids: [numeric, errors, math-functions]
required_capabilities: [select, numeric, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT power('2'::numeric, '10') AS p, power('-2'::numeric, '3') AS neg_odd, power('-2'::numeric, '-1') AS neg_recip
    expect: rows
  - sql: |
      SELECT power('0'::numeric, '-1')
    expect: error
    sqlstate: "2201F"
  - sql: |
      SELECT power('-2'::numeric, '3.3')
    expect: error
    sqlstate: "2201F"
  - sql: |
      SELECT log('0'::numeric, '10')
    expect: error
    sqlstate: "2201E"
  - sql: |
      SELECT log('10'::numeric, '0')
    expect: error
    sqlstate: "2201E"
