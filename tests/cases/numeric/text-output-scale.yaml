# Numeric values keep their display scale in text output while comparing equal; scale of products adds up.
id: numeric.text-output-scale
title: Display scale of numeric values in text output, equality across scales, and product scale
family: numeric
tier: core
feature_ids: [numeric, select, casts]
required_capabilities: [select, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/numeric.sql"
  license: PostgreSQL
sessions: [a]
steps:
  - sql: |
      SELECT 1.50::numeric::text AS t1, 1.0::numeric * 1.00 AS t2, '3.1400'::numeric + 0 AS t3, '0.00'::numeric::text AS t4
    expect: rows
  - sql: |
      SELECT (1.50::numeric = 1.5) AS eq, (1.0::numeric = 1.00) AS eq2, (0.5::numeric * 0.5) AS half_sq
    expect: rows
  - sql: |
      SELECT numeric '1e3' AS sci, '1.23e-5'::numeric AS small, '-0'::numeric AS negzero
    expect: rows
