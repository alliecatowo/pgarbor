# Documented example ALTER EXTENSION hstore SET SCHEMA utils: the extension record, its type and its functions all move to utils.
id: cmd-alter-extension.set-schema-doc-example
title: ALTER EXTENSION SET SCHEMA moves the extension and its member objects into the new schema
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, set-schema, relocatable-extensions]
required_capabilities: [create-extension, create-schema, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (Examples: change schema of hstore to utils)"
sessions: [a]
setup: |
  CREATE SCHEMA utils;
  CREATE EXTENSION hstore;
steps:
  - sql: |
      SELECT e.extname, n.nspname AS extschema FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'hstore'
    expect: rows
    order: ordered
    comment: before the move hstore lives in public
  - sql: |
      ALTER EXTENSION hstore SET SCHEMA utils
    expect: ok
  - sql: |
      SELECT e.extname, n.nspname AS extschema FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'hstore'
    expect: rows
    order: ordered
  - sql: |
      SELECT n.nspname AS type_schema FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace WHERE t.typname = 'hstore'
    expect: rows
    order: ordered
  - sql: |
      SELECT n.nspname AS function_schema FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.proname = 'populate_record'
    expect: rows
    order: ordered
