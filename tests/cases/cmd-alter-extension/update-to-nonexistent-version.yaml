# Documented example ALTER EXTENSION hstore UPDATE TO '2.0': with no update script from 1.8 to 2.0 the update fails and the installed version is unchanged.
id: cmd-alter-extension.update-to-nonexistent-version
title: ALTER EXTENSION UPDATE TO a version with no update path fails and leaves the version unchanged
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, update, extension-versions, errors]
required_capabilities: [create-extension, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (Examples: update hstore to 2.0)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
steps:
  - sql: |
      ALTER EXTENSION hstore UPDATE TO '2.0'
    expect: error
    sqlstate: "22023"
    comment: no update script from 1.8 to 2.0 is shipped, so the statement is rejected
  - sql: |
      SELECT extname, extversion FROM pg_extension WHERE extname = 'hstore'
    expect: rows
    order: ordered
    comment: the failed update changed nothing
