# Table names are looked up through search_path unless schema-qualified; a schema-qualified member blocks DROP TABLE of that table.
id: cmd-alter-extension.add-schema-qualified-table
title: ADD TABLE resolves names through search_path and accepts schema-qualified names
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, add-member, search-path, schemas, errors]
required_capabilities: [create-extension, create-schema, create-table, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (object_name may be schema-qualified)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
  CREATE SCHEMA s2;
  CREATE TABLE s2.t2 (id int4);
steps:
  - sql: |
      ALTER EXTENSION hstore ADD TABLE t2
    expect: error
    sqlstate: "42P01"
    comment: s2 is not on search_path, so unqualified t2 does not exist
  - sql: |
      ALTER EXTENSION hstore ADD TABLE s2.t2
    expect: ok
  - sql: |
      DROP TABLE s2.t2
    expect: error
    sqlstate: "2BP01"
