# Unquoted extension names fold to lower case, so HSTORE names hstore; a quoted "HSTORE" names a different, nonexistent extension.
id: cmd-alter-extension.identifier-case-folding
title: Unquoted extension name folds to lower case while a quoted upper-case name does not exist
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, identifiers, quoting, errors]
required_capabilities: [create-extension, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (name) and sql-syntax-lexical identifiers"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
steps:
  - sql: |
      ALTER EXTENSION HSTORE UPDATE
    expect: notice
    comment: HSTORE folds to hstore, which is installed
  - sql: |
      ALTER EXTENSION "HSTORE" UPDATE
    expect: error
    sqlstate: "42704"
    comment: the quoted identifier keeps its case and no extension named HSTORE exists
  - sql: |
      ALTER EXTENSION nosuch UPDATE
    expect: error
    sqlstate: "42704"
    comment: unknown extension name
