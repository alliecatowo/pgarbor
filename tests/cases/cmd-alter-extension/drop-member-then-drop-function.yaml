# DROP FUNCTION is blocked while a function is a member; removing the membership with ALTER EXTENSION DROP lets the function be dropped, and removing a non-member is an error.
id: cmd-alter-extension.drop-member-then-drop-function
title: ALTER EXTENSION DROP FUNCTION releases the membership so the function can be dropped
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, drop-member, add-member, dependencies, errors]
required_capabilities: [create-extension, create-function, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (DROP member_object)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
  CREATE FUNCTION myfn(a int) RETURNS int LANGUAGE sql AS 'SELECT $1';
steps:
  - sql: |
      ALTER EXTENSION hstore DROP FUNCTION myfn(int)
    expect: error
    sqlstate: "55000"
    comment: myfn is not yet a member, so it cannot be removed from the extension
  - sql: |
      ALTER EXTENSION hstore ADD FUNCTION myfn(int)
    expect: ok
  - sql: |
      DROP FUNCTION myfn(int)
    expect: error
    sqlstate: "2BP01"
  - sql: |
      ALTER EXTENSION hstore DROP FUNCTION myfn(int)
    expect: ok
    comment: the function is disassociated, not dropped
  - sql: |
      SELECT count(*) AS members FROM pg_depend d JOIN pg_extension e ON e.oid = d.refobjid WHERE e.extname = 'hstore' AND d.classid = 'pg_proc'::regclass AND d.deptype = 'e' AND d.objid = 'myfn(int)'::regprocedure
    expect: rows
    order: ordered
  - sql: |
      DROP FUNCTION myfn(int)
    expect: ok
