# An object that already belongs to one extension cannot be added to another extension.
id: cmd-alter-extension.add-member-owned-by-other-extension
title: ADD of a function or type already owned by another extension fails
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, add-member, extension-dependencies, errors]
required_capabilities: [create-extension, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (ADD member_object)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
  CREATE EXTENSION citext;
steps:
  - sql: |
      ALTER EXTENSION hstore ADD FUNCTION citext(boolean)
    expect: error
    sqlstate: "55000"
    comment: citext(boolean) is already a member of citext
  - sql: |
      ALTER EXTENSION hstore ADD TYPE citext
    expect: error
    sqlstate: "55000"
    comment: the citext type is already a member of citext
