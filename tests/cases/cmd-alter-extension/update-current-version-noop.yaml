# Updating to the already-installed version is accepted with a NOTICE and changes nothing; the version may be a string literal or a quoted identifier.
id: cmd-alter-extension.update-current-version-noop
title: ALTER EXTENSION UPDATE to the installed version is a notice-only no-op
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, update, extension-versions]
required_capabilities: [create-extension, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (UPDATE, new_version)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
steps:
  - sql: |
      ALTER EXTENSION hstore UPDATE
    expect: notice
    comment: without TO the target is the default_version from the control file, which is the installed 1.8
  - sql: |
      ALTER EXTENSION hstore UPDATE TO '1.8'
    expect: notice
    comment: version as a string literal
  - sql: |
      ALTER EXTENSION hstore UPDATE TO "1.8"
    expect: notice
    comment: version as a quoted identifier
  - sql: |
      SELECT extversion FROM pg_extension WHERE extname = 'hstore'
    expect: rows
    order: ordered
