# Documented example ADD FUNCTION populate_record(anyelement, hstore) on an extension that already contains it is rejected; the member stays a member and is protected from DROP.
id: cmd-alter-extension.add-doc-example-already-member
title: Documented ADD FUNCTION on a function already owned by the extension fails and the membership still protects it
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, add-member, function-identity, dependencies, errors]
required_capabilities: [create-extension, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (Examples: add populate_record to hstore)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
steps:
  - sql: |
      ALTER EXTENSION hstore ADD FUNCTION populate_record(anyelement, hstore)
    expect: error
    sqlstate: "55000"
    comment: populate_record(anyelement,hstore) is already a member of hstore
  - sql: |
      SELECT count(*) AS members FROM pg_depend d JOIN pg_extension e ON e.oid = d.refobjid WHERE e.extname = 'hstore' AND d.classid = 'pg_proc'::regclass AND d.deptype = 'e' AND d.objid = 'populate_record(anyelement,hstore)'::regprocedure
    expect: rows
    order: ordered
    comment: exactly one extension-membership dependency row
  - sql: |
      DROP FUNCTION populate_record(anyelement, hstore)
    expect: error
    sqlstate: "2BP01"
    comment: a member can only be dropped by dropping the extension
