# ADD FUNCTION needs an existing function with exactly matching input argument types; a missing name or a different argument type is an undefined function.
id: cmd-alter-extension.add-function-undefined-signature
title: ADD FUNCTION with a missing name or a non-matching argument type fails with undefined_function
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, add-member, function-identity, errors]
required_capabilities: [create-extension, create-function, alter-extension]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (function_name, argtype)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
  CREATE FUNCTION f2(int) RETURNS int LANGUAGE sql AS 'SELECT 1';
steps:
  - sql: |
      ALTER EXTENSION hstore ADD FUNCTION nosuchfn(int)
    expect: error
    sqlstate: "42883"
  - sql: |
      ALTER EXTENSION hstore ADD FUNCTION f2(text)
    expect: error
    sqlstate: "42883"
    comment: f2 exists only for integer, and signature lookup does not coerce arguments
  - sql: |
      ALTER EXTENSION hstore ADD FUNCTION f2(int)
    expect: ok
