# Moving an extension into the schema it already occupies is accepted and leaves it where it is.
id: cmd-alter-extension.set-schema-same-schema-noop
title: ALTER EXTENSION SET SCHEMA to the current schema succeeds without change
family: cmd-alter-extension
tier: core
feature_ids: [alter-extension, set-schema, relocatable-extensions]
required_capabilities: [create-extension, alter-extension, select]
provenance:
  source: pg-docs
  ref: "ref/alter_extension.sgml#sql-alterextension (SET SCHEMA)"
sessions: [a]
setup: |
  CREATE EXTENSION hstore;
steps:
  - sql: |
      ALTER EXTENSION hstore SET SCHEMA public
    expect: ok
    comment: hstore already lives in public, so this is a no-op
  - sql: |
      SELECT e.extname, n.nspname AS extschema FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'hstore'
    expect: rows
    order: ordered
