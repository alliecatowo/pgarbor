# CURRENT_USER, SESSION_USER and PUBLIC are special role specifiers and cannot be named in DROP ROLE (22023); no role is dropped.
id: cmd-drop-role.special-role-specifiers-rejected
title: "DROP ROLE rejects special role specifiers current_user, session_user and public with 22023"
family: cmd-drop-role
tier: core
feature_ids: [drop-role, special-role-specifiers, errors]
required_capabilities: [roles, errors, select]
provenance:
  source: hand
  ref: "PG18 ref/drop_role.sgml#synopsis; behavior probed on pgarbor-oracle (PG18.6)"
sessions: [a]
steps:
  - sql: |
      DROP ROLE current_user
    expect: error
    sqlstate: "22023"
  - sql: |
      DROP ROLE session_user
    expect: error
    sqlstate: "22023"
  - sql: |
      DROP ROLE public
    expect: error
    sqlstate: "22023"
  - sql: |
      DROP ROLE IF EXISTS public
    expect: error
    sqlstate: "22023"
    comment: IF EXISTS does not change the rejection of a special specifier
  - sql: |
      SELECT rolname FROM pg_roles WHERE rolname = current_user
    expect: rows
    comment: the session role still exists
