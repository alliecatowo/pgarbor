# The synopsis allows a comma-separated list of roles in one statement; repeated names in the list are accepted.
id: cmd-drop-role.multi-role-list
title: "DROP ROLE accepts a comma-separated list, including a repeated name"
family: cmd-drop-role
tier: core
feature_ids: [drop-role, multiple-roles]
required_capabilities: [roles, create-role, select]
provenance:
  source: pg-docs
  ref: "ref/drop_role.sgml#synopsis (name [, ...])"
sessions: [a]
setup: |
  CREATE ROLE drr_ml_1;
  CREATE ROLE drr_ml_2;
  CREATE ROLE drr_ml_3;
steps:
  - sql: |
      SELECT rolname FROM pg_roles WHERE rolname LIKE 'drr\_ml\_%' ORDER BY rolname
    expect: rows
    order: ordered
  - sql: |
      DROP ROLE drr_ml_1, drr_ml_2, drr_ml_3
    expect: ok
  - sql: |
      SELECT count(*) AS remaining FROM pg_roles WHERE rolname LIKE 'drr\_ml\_%'
    expect: rows
  - sql: |
      CREATE ROLE drr_ml_4;
      DROP ROLE drr_ml_4, drr_ml_4
    expect: ok
    comment: the same name twice in one list is dropped without error
  - sql: |
      SELECT count(*) AS remaining FROM pg_roles WHERE rolname = 'drr_ml_4'
    expect: rows
