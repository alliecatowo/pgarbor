# The documented example DROP ROLE jonathan; the role name is prefixed to avoid clashing with other families sharing the cluster.
id: cmd-drop-role.docs-example-drop-role
title: "Documented example: DROP ROLE removes a role, a second drop of the same role fails"
family: cmd-drop-role
tier: core
feature_ids: [drop-role, roles]
required_capabilities: [roles, create-role, select, errors]
provenance:
  source: pg-docs
  ref: "ref/drop_role.sgml#sql-droprole-examples"
sessions: [a]
setup: |
  CREATE ROLE drr_jonathan LOGIN
steps:
  - sql: |
      SELECT count(*) AS before_drop FROM pg_roles WHERE rolname = 'drr_jonathan'
    expect: rows
  - sql: |
      DROP ROLE drr_jonathan;
    expect: ok
  - sql: |
      SELECT count(*) AS after_drop FROM pg_roles WHERE rolname = 'drr_jonathan'
    expect: rows
  - sql: |
      DROP ROLE drr_jonathan
    expect: error
    sqlstate: "42704"
