# Unquoted role names fold to lower case, so DROP ROLE needs the quoted identifier to match a mixed-case role.
id: cmd-drop-role.case-folding-quoted-name
title: "DROP ROLE folds unquoted names to lower case; quoted mixed-case names must match exactly"
family: cmd-drop-role
tier: core
feature_ids: [drop-role, identifiers, quoting, errors]
required_capabilities: [roles, errors, select]
provenance:
  source: hand
  ref: "PG18 ref/drop_role.sgml#synopsis; identifier folding per doc/src/sgml/sql.sgml"
sessions: [a]
setup: |
  CREATE ROLE "Drr_Mixed";
steps:
  - sql: |
      DROP ROLE Drr_Mixed
    expect: error
    sqlstate: "42704"
    comment: folds to drr_mixed, which does not exist
  - sql: |
      SELECT count(*) AS present FROM pg_roles WHERE rolname = 'Drr_Mixed'
    expect: rows
  - sql: |
      DROP ROLE "Drr_Mixed"
    expect: ok
