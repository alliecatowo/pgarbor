# The current user cannot be dropped (55006), but after RESET ROLE a superuser role can be dropped normally.
id: cmd-drop-role.current-superuser-cannot-drop-self
title: "A superuser cannot drop the role it is currently acting as; after RESET ROLE the drop succeeds"
family: cmd-drop-role
tier: core
feature_ids: [drop-role, set-role, superuser, errors]
required_capabilities: [roles, set-role, errors, select]
provenance:
  source: hand
  ref: "PG18 ref/drop_role.sgml#sql-droprole-description; behavior probed on pgarbor-oracle (PG18.6)"
sessions: [a]
setup: |
  CREATE ROLE drr_self SUPERUSER LOGIN;
steps:
  - sql: |
      SET ROLE drr_self
    expect: ok
  - sql: |
      DROP ROLE drr_self
    expect: error
    sqlstate: "55006"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP ROLE drr_self
    expect: ok
  - sql: |
      SELECT count(*) AS present FROM pg_roles WHERE rolname = 'drr_self'
    expect: rows
