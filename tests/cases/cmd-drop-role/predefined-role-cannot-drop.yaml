# Built-in predefined roles required by the database system cannot be dropped (2BP01).
id: cmd-drop-role.predefined-role-cannot-drop
title: "DROP ROLE on a system predefined role fails with 2BP01"
family: cmd-drop-role
tier: extended
feature_ids: [drop-role, predefined-roles, errors]
required_capabilities: [roles, errors, select]
provenance:
  source: hand
  ref: "PG18 ref/drop_role.sgml#synopsis; behavior probed on pgarbor-oracle (PG18.6)"
sessions: [a]
steps:
  - sql: |
      DROP ROLE pg_read_all_data
    expect: error
    sqlstate: "2BP01"
  - sql: |
      SELECT count(*) AS present FROM pg_roles WHERE rolname = 'pg_read_all_data'
    expect: rows
    comment: the predefined role is still present
