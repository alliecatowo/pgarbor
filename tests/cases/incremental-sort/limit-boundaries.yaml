# Incremental sort with LIMIT around group-size boundaries (10 tuples per group).
id: incremental-sort.limit-boundaries
title: LIMIT 0, 1, group edges and beyond return the correct prefix of the fully sorted output
family: incremental-sort
tier: core
feature_ids: [incremental-sort, order-by, limit]
required_capabilities: [create-table, insert, select, order-by, limit]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer);
  INSERT INTO t SELECT g / 10, g FROM generate_series(0, 99) AS g(g);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 0
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 1
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 10
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 11
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 33
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 1000
    expect: rows
    order: ordered
