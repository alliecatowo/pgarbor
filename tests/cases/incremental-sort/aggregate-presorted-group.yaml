# GROUP BY on presorted prefix keys, ordered by the group keys plus an aggregate.
id: incremental-sort.aggregate-presorted-group
title: GROUP BY keys with ORDER BY keys plus aggregate returns exact sums in order
family: incremental-sort
tier: extended
feature_ids: [incremental-sort, order-by, group-by, aggregates]
required_capabilities: [create-table, insert, select, order-by, group-by, aggregates]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer, c integer);
  INSERT INTO t SELECT g % 10, g % 10, g FROM generate_series(1, 1000) AS g(g);
steps:
  - sql: |
      SELECT a, b, sum(c) FROM t GROUP BY a, b ORDER BY a, b, sum(c) LIMIT 3
    expect: rows
    order: ordered
