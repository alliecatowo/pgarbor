# Presorted ascending prefix with a descending incremental suffix.
id: incremental-sort.descending-suffix
title: Ascending presorted prefix with DESC incremental suffix, with and without LIMIT
family: incremental-sort
tier: core
feature_ids: [incremental-sort, order-by, descending]
required_capabilities: [create-table, insert, select, order-by, limit]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer);
  INSERT INTO t SELECT g / 5, g % 3 FROM generate_series(0, 29) AS g(g);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b DESC
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b DESC LIMIT 7
    expect: rows
    order: ordered
