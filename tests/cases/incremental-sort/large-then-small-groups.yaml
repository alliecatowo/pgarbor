# An initial large prefix group followed by small groups, with LIMIT in the middle of the small groups.
id: incremental-sort.large-then-small-groups
title: Large first prefix group followed by small groups, LIMIT cuts inside a later group
family: incremental-sort
tier: extended
feature_ids: [incremental-sort, order-by, limit]
required_capabilities: [create-table, insert, select, order-by, limit]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer);
  INSERT INTO t SELECT CASE WHEN g < 50 THEN 1 ELSE g - 47 END, g FROM generate_series(1, 100) AS g(g);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 55
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 5
    expect: rows
    order: ordered
