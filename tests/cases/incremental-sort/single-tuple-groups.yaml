# Every presorted group holds exactly one tuple, so every row crosses a group boundary.
id: incremental-sort.single-tuple-groups
title: Incremental sort where each prefix group has one tuple, around LIMIT boundaries
family: incremental-sort
tier: extended
feature_ids: [incremental-sort, order-by, limit]
required_capabilities: [create-table, insert, select, order-by, limit]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer);
  INSERT INTO t SELECT g, g FROM generate_series(1, 100) AS g(g);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 31
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 33
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT 66
    expect: rows
    order: ordered
