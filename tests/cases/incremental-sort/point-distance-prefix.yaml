# Ordering by a distance expression (incremental suffix after a computed prefix) on geometric values.
id: incremental-sort.point-distance-prefix
title: ORDER BY distance then b over point values, ASC and DESC suffix
family: incremental-sort
tier: extended
feature_ids: [incremental-sort, order-by, geometric-types]
required_capabilities: [create-table, insert, select, order-by, geometric-types]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE point_table (a point, b int);
  INSERT INTO point_table VALUES (point(5, 5), 1), (point(0, 0), 2), (point(5, 6), 3), (point(4, 5), 4), (point(5, 5), 0);
steps:
  - sql: |
      SELECT a, b, a <-> point(5, 5) AS dist FROM point_table ORDER BY dist, b LIMIT 3
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b, a <-> point(5, 5) AS dist FROM point_table ORDER BY dist, b DESC
    expect: rows
    order: ordered
