# Presorted DESC prefix with an ascending suffix, mixing directions across keys.
id: incremental-sort.descending-prefix-mixed
title: DESC presorted prefix with ASC incremental suffix over duplicate keys
family: incremental-sort
tier: extended
feature_ids: [incremental-sort, order-by, descending]
required_capabilities: [create-table, insert, select, order-by, limit]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer);
  INSERT INTO t SELECT g % 4, (g * 7) % 5 FROM generate_series(1, 40) AS g(g);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a DESC) s ORDER BY a DESC, b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM (SELECT a, b FROM t ORDER BY a DESC) s ORDER BY a DESC, b LIMIT 12
    expect: rows
    order: ordered
