# Incremental sort: input already sorted on a prefix (a), outer ORDER BY adds a suffix (b).
id: incremental-sort.presorted-prefix-basic
title: ORDER BY (a, b) over a subquery presorted on a returns fully sorted rows
family: incremental-sort
tier: core
feature_ids: [incremental-sort, order-by, subquery]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/incremental_sort.sql
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer, c text);
  INSERT INTO t VALUES (2, 9, 'x'), (1, 3, 'y'), (2, 1, 'z'), (1, 7, NULL), (3, 4, 'w'), (2, 5, 'v');
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM (SELECT a, b FROM t ORDER BY a) s ORDER BY a, b DESC
    expect: rows
    order: ordered
