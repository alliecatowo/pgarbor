# NULL handling in both the presorted prefix and the incremental suffix.
id: incremental-sort.nulls-in-sort-keys
title: NULLs in presorted and incremental keys follow NULLS FIRST and NULLS LAST placement
family: incremental-sort
tier: core
feature_ids: [incremental-sort, order-by, nulls]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/queries-order.html"
sessions: [a]
setup: |
  CREATE TABLE n (a integer, b integer);
  INSERT INTO n VALUES (NULL, 2), (1, NULL), (1, 1), (NULL, NULL), (2, 0), (2, 5), (NULL, 2);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM n ORDER BY a NULLS FIRST) s ORDER BY a NULLS FIRST, b NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM (SELECT * FROM n ORDER BY a NULLS LAST) s ORDER BY a NULLS LAST, b NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM (SELECT a, b FROM n ORDER BY a) s ORDER BY a, b NULLS LAST LIMIT 4
    expect: rows
    order: ordered
