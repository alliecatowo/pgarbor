# Error path: negative LIMIT over an incremental sort.
id: incremental-sort.error-negative-limit
title: Negative LIMIT over a presorted subquery raises 2201W
family: incremental-sort
tier: core
feature_ids: [incremental-sort, order-by, limit, errors]
required_capabilities: [create-table, insert, select, order-by, limit, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 2201W invalid_row_count_in_limit_clause"
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer);
  INSERT INTO t VALUES (1, 2), (2, 1);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, b LIMIT -1
    expect: error
    sqlstate: "2201W"
