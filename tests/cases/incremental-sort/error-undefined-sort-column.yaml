# Error path: an outer ORDER BY naming a column that does not exist.
id: incremental-sort.error-undefined-sort-column
title: Outer ORDER BY over a presorted subquery with an unknown column raises 42703
family: incremental-sort
tier: core
feature_ids: [incremental-sort, order-by, errors]
required_capabilities: [create-table, insert, select, order-by, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42703 undefined_column"
sessions: [a]
setup: |
  CREATE TABLE t (a integer, b integer);
  INSERT INTO t VALUES (1, 2), (2, 1);
steps:
  - sql: |
      SELECT * FROM (SELECT * FROM t ORDER BY a) s ORDER BY a, no_such_column
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT count(*) FROM t
    expect: rows
    comment: the failed statement must not leave the session in an aborted state
