# Error path: setting the incremental sort GUC to a non-boolean value.
id: incremental-sort.error-invalid-guc-value
title: SET enable_incremental_sort to a non-boolean value raises 22023
family: incremental-sort
tier: core
feature_ids: [incremental-sort, planner-settings, errors]
required_capabilities: [guc, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 22023 invalid_parameter_value"
sessions: [a]
steps:
  - sql: |
      SET enable_incremental_sort = 'bogus'
    expect: error
    sqlstate: "22023"
  - sql: |
      SHOW enable_incremental_sort
    expect: rows
    comment: the value must remain at its default after the rejected SET
