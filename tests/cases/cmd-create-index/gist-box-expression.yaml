# The documented GiST example: an index on box(location, location) supports the box overlap operator.
id: cmd-create-index.gist-box-expression
title: GiST index on a box expression of a point column serves box overlap queries
family: cmd-create-index
tier: extended
feature_ids: [create-index, gist, expression-index, geometry]
required_capabilities: [create-table, create-index, insert, select, catalog-introspection, geometry]
provenance:
  source: pg-docs
  ref: "ref/create_index.sgml#sql-createindex (Examples: CREATE INDEX pointloc ON points USING gist (box(location,location)))"
sessions: [a]
setup: |
  CREATE TABLE points (id int4 PRIMARY KEY, location point);
  INSERT INTO points VALUES (1, '(0.5,0.5)'), (2, '(5,5)'), (3, '(0.1,0.9)');
steps:
  - sql: |
      CREATE INDEX pointloc ON points USING gist (box(location, location))
    expect: ok
  - sql: |
      SELECT id FROM points WHERE box(location, location) && '(0,0),(1,1)'::box ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT am.amname FROM pg_class c JOIN pg_am am ON am.oid = c.relam WHERE c.oid = 'pointloc'::regclass
    expect: rows
    order: ordered
