# NULLS NOT DISTINCT makes a unique index treat NULL keys as equal, so a second NULL is rejected.
id: cmd-create-index.nulls-not-distinct
title: NULLS NOT DISTINCT unique index rejects a second NULL key
family: cmd-create-index
tier: core
feature_ids: [create-index, unique-index, null-semantics]
required_capabilities: [create-table, create-index, insert, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_index.sgml#sql-createindex (Parameters: NULLS DISTINCT / NULLS NOT DISTINCT)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, director text);
  INSERT INTO films VALUES (1, 'A'), (2, 'B');
steps:
  - sql: |
      CREATE UNIQUE INDEX f_nd ON films (director) NULLS NOT DISTINCT
    expect: ok
  - sql: |
      SELECT indnullsnotdistinct FROM pg_index WHERE indexrelid = 'f_nd'::regclass
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO films VALUES (3, NULL)
    expect: ok
  - sql: |
      INSERT INTO films VALUES (4, NULL)
    expect: error
    sqlstate: "23505"
    comment: NULL is treated as a value equal to the existing NULL
  - sql: |
      SELECT id, director FROM films ORDER BY id
    expect: rows
    order: ordered
