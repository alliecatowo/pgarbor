# An expression index without a name gets a system-chosen name and supports lookups on the expression.
id: cmd-create-index.expression-lower-default-name
title: Expression index on lower(title) gets a generated name and serves case-insensitive lookups
family: cmd-create-index
tier: core
feature_ids: [create-index, expression-index, text-functions]
required_capabilities: [create-table, create-index, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_index.sgml#sql-createindex (Parameters: expression; Examples: CREATE INDEX ON films ((lower(title))), default name films_lower_idx)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, title text);
  INSERT INTO films VALUES (1, 'Jim Story'), (2, 'JIM STORY'), (3, 'Other');
steps:
  - sql: |
      CREATE INDEX ON films ((lower(title)))
    expect: ok
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'films' ORDER BY indexname
    expect: rows
    order: ordered
    comment: the omitted name becomes films_lower_idx
  - sql: |
      SELECT id FROM films WHERE lower(title) = 'jim story' ORDER BY id
    expect: rows
    order: ordered
