# IF NOT EXISTS turns a duplicate index name into a NOTICE and leaves the existing index in place.
id: cmd-create-index.if-not-exists-notice
title: IF NOT EXISTS skips an existing index name with a notice, while a plain duplicate name errors
family: cmd-create-index
tier: core
feature_ids: [create-index, if-not-exists, notices, errors]
required_capabilities: [create-table, create-index, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/create_index.sgml#sql-createindex (Parameters: IF NOT EXISTS: a notice is issued in this case)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, rating int4);
  CREATE INDEX f_exists ON films (rating);
steps:
  - sql: |
      CREATE INDEX f_exists ON films (id)
    expect: error
    sqlstate: "42P07"
    comment: without IF NOT EXISTS an existing relation name is an error
  - sql: |
      CREATE INDEX IF NOT EXISTS f_exists ON films (id)
    expect: notice
    comment: skipped with a notice; the original index definition is kept
  - sql: |
      SELECT indexdef FROM pg_indexes WHERE indexname = 'f_exists'
    expect: rows
    order: ordered
