# Subqueries are not allowed in DEFAULT expressions.
id: create-table.default-expr-subquery-forbidden
title: Subquery in DEFAULT expression is rejected with 0A000
family: create-table
tier: extended
feature_ids: [create-table, defaults, subqueries, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE default_expr_sub (a int DEFAULT (select 1))
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'default_expr_sub'
    expect: rows
    order: multiset
