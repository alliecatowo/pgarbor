# A partitioned table cannot be used as a regular INHERITS parent; INHERITS + PARTITION BY is rejected.
id: create-table.partition-of-partitioned-inherit-error
title: Inheriting from a partitioned table fails with 42809; INHERITS with PARTITION BY fails
family: create-table
tier: extended
feature_ids: [create-table, partitioning, inheritance, errors]
required_capabilities: [create-table, partitioning, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table.sql (partitioned table cannot participate in regular inheritance)"
sessions: [a]
setup: |
  CREATE TABLE partitioned2 (a int, b text) PARTITION BY RANGE ((a + 1), substr(b, 1, 5));
steps:
  - sql: |
      CREATE TABLE fail () INHERITS (partitioned2)
    expect: error
    sqlstate: "42809"
  - sql: |
      CREATE TABLE fail2 (a int) INHERITS (partitioned2) PARTITION BY LIST (a)
    expect: error
    comment: grammar accepts INHERITS with PARTITION BY but the server rejects it; SQLSTATE not asserted
  - sql: |
      CREATE TABLE tas_case WITH (oids) AS SELECT 1 AS a
    expect: error
    comment: OIDs are no longer supported; SQLSTATE not asserted
