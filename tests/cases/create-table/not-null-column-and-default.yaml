# NOT NULL columns reject explicit NULL with 23502; defaults apply when the column is omitted.
id: create-table.not-null-column-and-default
title: NOT NULL rejects NULL with 23502 while DEFAULT fills omitted columns
family: create-table
tier: core
feature_ids: [create-table, not-null, defaults, insert, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: hand
  ref: "PG18 docs ddl-constraints.html#DDL-CONSTRAINTS-NOT-NULL; sql-createtable.html"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE nn (id int4 NOT NULL, label text DEFAULT 'none' NOT NULL, note text DEFAULT NULL)
    expect: ok
  - sql: |
      INSERT INTO nn (id) VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO nn (id, label) VALUES (2, NULL)
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT id, label, note, note IS NULL AS note_null FROM nn ORDER BY id
    expect: rows
    order: ordered
