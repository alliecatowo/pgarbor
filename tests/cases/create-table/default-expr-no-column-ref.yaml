# DEFAULT expressions may not reference columns of the table being created.
id: create-table.default-expr-no-column-ref
title: DEFAULT expression referencing a column fails with 0A000
family: create-table
tier: core
feature_ids: [create-table, defaults, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE default_expr_column (id int DEFAULT (id))
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'default_expr_column'
    expect: rows
    order: multiset
