# Set-returning functions are not allowed in DEFAULT expressions.
id: create-table.default-expr-srf-forbidden
title: Set-returning function in DEFAULT expression is rejected with 0A000
family: create-table
tier: extended
feature_ids: [create-table, defaults, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE default_expr_srf (a int DEFAULT (generate_series(1,3)))
    expect: error
    sqlstate: "0A000"
