# Partition key validation: strategy, column count, and missing column errors.
id: create-table.partition-list-key-errors
title: Invalid PARTITION BY keys fail with 0A000, 42601 and 42703
family: create-table
tier: extended
feature_ids: [create-table, partitioning, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table.sql (partition key error cases)"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE partitioned (a1 int, a2 int) PARTITION BY LIST (a1, a2)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE TABLE partitioned (a int) PARTITION BY MAGIC (a)
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE TABLE partitioned (a int) PARTITION BY RANGE (b)
    expect: error
    sqlstate: "42703"
  - sql: |
      CREATE TABLE partitioned (a int) PARTITION BY RANGE (xmin)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM pg_class WHERE relname = 'partitioned'
    expect: rows
    order: multiset
