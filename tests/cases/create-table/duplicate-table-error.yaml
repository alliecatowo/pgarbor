# Creating an existing relation fails with 42P07; IF NOT EXISTS only emits a notice.
id: create-table.duplicate-table-error
title: Duplicate CREATE TABLE fails with 42P07, IF NOT EXISTS skips with notice
family: create-table
tier: core
feature_ids: [create-table, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table.sql (CREATE TABLE AS duplicate and IF NOT EXISTS cases)"
sessions: [a]
setup: |
  CREATE TABLE as_select1 AS SELECT 1 AS a;
steps:
  - sql: |
      CREATE TABLE as_select1 AS SELECT 2 AS a
    expect: error
    sqlstate: "42P07"
  - sql: |
      CREATE TABLE IF NOT EXISTS as_select1 AS SELECT 3 AS a
    expect: notice
    comment: skipped with NOTICE, no rows inserted
  - sql: |
      SELECT a FROM as_select1
    expect: rows
    order: multiset
