# Aggregates are not allowed in DEFAULT expressions.
id: create-table.default-expr-aggregate-forbidden
title: Aggregate in DEFAULT expression is rejected with 42803
family: create-table
tier: extended
feature_ids: [create-table, defaults, errors]
required_capabilities: [create-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/create_table.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE default_expr_agg (a int DEFAULT (avg(1)))
    expect: error
    sqlstate: "42803"
  - sql: |
      CREATE TABLE default_expr_ok (a int DEFAULT (1 + 2)); INSERT INTO default_expr_ok DEFAULT VALUES; SELECT a FROM default_expr_ok
    expect: rows
    order: multiset
