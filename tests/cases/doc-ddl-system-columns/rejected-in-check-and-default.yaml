# System columns cannot appear in CHECK constraints or DEFAULT expressions.
id: doc-ddl-system-columns.rejected-in-check-and-default
title: System columns are rejected in CHECK and DEFAULT expressions
family: doc-ddl-system-columns
tier: extended
feature_ids: [system-columns, constraints, column-defaults, errors]
required_capabilities: [create-table, constraints, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (system columns are implicit; checked against PG18.6 oracle)"
steps:
  - sql: |
      CREATE TABLE ck (a int4 CHECK (xmin <> '0'))
    expect: error
    sqlstate: "42P10"
  - sql: |
      CREATE TABLE d (a int4 DEFAULT ctid)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE TABLE d2 (a int4, b int4 DEFAULT tableoid)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT to_regclass('ck') IS NULL AS ck_missing, to_regclass('d') IS NULL AS d_missing
    expect: rows
    order: ordered
