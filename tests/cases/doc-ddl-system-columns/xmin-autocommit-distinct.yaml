# Each autocommit statement is its own transaction, so its rows carry a distinct xmin.
id: doc-ddl-system-columns.xmin-autocommit-distinct
title: Separate autocommit statements produce distinct xmin values
family: doc-ddl-system-columns
tier: core
feature_ids: [system-columns, xmin, transactions]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (xmin is the identity of the inserting transaction)"
setup: |
  CREATE TABLE t (id int4, v text);
steps:
  - sql: |
      INSERT INTO t VALUES (1, 'a')
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2, 'b'), (3, 'c')
    expect: ok
  - sql: |
      SELECT count(DISTINCT xmin::text) AS xids, count(*) AS n, bool_and(xmin <> '0'::xid) AS nonzero FROM t
    expect: rows
    order: ordered
  - sql: |
      BEGIN;
      INSERT INTO t VALUES (4, 'd');
      INSERT INTO t VALUES (5, 'e');
      COMMIT
    expect: ok
  - sql: |
      SELECT count(DISTINCT xmin::text) AS xids, count(*) AS n FROM t
    expect: rows
    order: ordered
    comment: the two statements inside one explicit transaction share an xmin, giving 3 distinct xids in total
