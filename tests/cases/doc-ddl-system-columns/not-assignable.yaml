# System columns are read-only: they cannot be targeted by INSERT, assigned by UPDATE, or dropped.
id: doc-ddl-system-columns.not-assignable
title: System columns cannot be written, assigned, or dropped
family: doc-ddl-system-columns
tier: core
feature_ids: [system-columns, insert, update, alter-table, errors]
required_capabilities: [create-table, insert, update, alter-table, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (system columns are maintained by the system; checked against PG18.6 oracle)"
setup: |
  CREATE TABLE w (id int4);
  INSERT INTO w VALUES (1);
steps:
  - sql: |
      INSERT INTO w (ctid) VALUES ('(0,1)')
    expect: error
    sqlstate: "42703"
  - sql: |
      UPDATE w SET xmin = 1
    expect: error
    sqlstate: "0A000"
  - sql: |
      ALTER TABLE w DROP COLUMN xmin
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT id FROM w
    expect: rows
    order: ordered
