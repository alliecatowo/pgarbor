# System columns cannot be indexed or used in a generated column expression.
id: doc-ddl-system-columns.rejected-in-index-and-generated
title: System columns are rejected in index keys and generated column expressions
family: doc-ddl-system-columns
tier: extended
feature_ids: [system-columns, create-index, generated-columns, errors]
required_capabilities: [create-table, create-index, alter-table, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (system columns are implicit; checked against PG18.6 oracle)"
setup: |
  CREATE TABLE w (id int4, v int4);
steps:
  - sql: |
      CREATE INDEX ON w (ctid)
    expect: error
    sqlstate: "0A000"
  - sql: |
      ALTER TABLE w ADD COLUMN g int4 GENERATED ALWAYS AS (cmin) STORED
    expect: error
    sqlstate: "42P10"
  - sql: |
      SELECT count(*) FROM w
    expect: rows
    order: ordered
