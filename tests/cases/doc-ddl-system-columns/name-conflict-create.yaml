# System column names cannot be used for user columns, even when quoted.
id: doc-ddl-system-columns.name-conflict-create
title: Creating or adding a column named like a system column is rejected
family: doc-ddl-system-columns
tier: core
feature_ids: [system-columns, create-table, alter-table, errors]
required_capabilities: [create-table, alter-table, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (system column names cannot be used as user column names; quoting does not help)"
setup: |
  CREATE TABLE t (id int4);
steps:
  - sql: |
      CREATE TABLE u (xmin int4)
    expect: error
    sqlstate: "42701"
  - sql: |
      CREATE TABLE u ("ctid" int4)
    expect: error
    sqlstate: "42701"
    comment: quoting does not escape the restriction
  - sql: |
      CREATE TABLE u (id int4, "tableoid" int4)
    expect: error
    sqlstate: "42701"
  - sql: |
      ALTER TABLE t ADD COLUMN cmax int4
    expect: error
    sqlstate: "42701"
  - sql: |
      SELECT to_regclass('u') IS NULL AS no_table
    expect: rows
    order: ordered
