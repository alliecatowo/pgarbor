# ctid locates a row version; an UPDATE writes a new version with a different ctid.
id: doc-ddl-system-columns.ctid-update-moves-row
title: ctid locates a row version and changes when the row is updated
family: doc-ddl-system-columns
tier: core
feature_ids: [system-columns, ctid, update]
required_capabilities: [create-table, insert, select, update]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (ctid: physical location; changes on update; not a row identifier)"
setup: |
  CREATE TABLE t (id int4, v text);
  INSERT INTO t VALUES (1, 'a'), (2, 'b'), (3, 'c');
steps:
  - sql: |
      SELECT id, ctid FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM t WHERE ctid = '(0,2)'
    expect: rows
    order: ordered
  - sql: |
      UPDATE t SET v = 'x' WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, ctid FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the updated row moved to a new tuple slot; ctid is not a stable row identifier
