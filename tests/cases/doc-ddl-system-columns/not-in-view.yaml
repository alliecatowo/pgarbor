# Views do not expose system columns; they are only available on base tables.
id: doc-ddl-system-columns.not-in-view
title: System columns are not visible through a view
family: doc-ddl-system-columns
tier: core
feature_ids: [system-columns, create-view, errors]
required_capabilities: [create-table, create-view, select, errors]
provenance:
  source: hand
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (system columns belong to the table; checked against PG18.6 oracle)"
setup: |
  CREATE TABLE base (id int4);
  INSERT INTO base VALUES (1);
  CREATE VIEW vbase AS SELECT id FROM base;
steps:
  - sql: |
      SELECT tableoid FROM vbase
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT ctid FROM vbase
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT tableoid::regclass::text AS src, id FROM base
    expect: rows
    order: ordered
