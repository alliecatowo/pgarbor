# In an inheritance hierarchy tableoid tells which child a row came from; ONLY excludes children.
id: doc-ddl-system-columns.tableoid-inheritance
title: tableoid distinguishes parent and child rows in an inheritance tree
family: doc-ddl-system-columns
tier: extended
feature_ids: [system-columns, tableoid, inheritance]
required_capabilities: [create-table, insert, select, inheritance]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (tableoid handy for inheritance hierarchies)"
setup: |
  CREATE TABLE parent_t (a int4);
  CREATE TABLE child_t () INHERITS (parent_t);
  INSERT INTO parent_t VALUES (1);
  INSERT INTO child_t VALUES (2);
steps:
  - sql: |
      SELECT tableoid::regclass::text AS src, a FROM parent_t ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT tableoid::regclass::text AS src, a FROM ONLY parent_t ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM parent_t
    expect: rows
    order: ordered
