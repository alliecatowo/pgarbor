# An uncommitted DELETE leaves xmax nonzero in a row version other sessions still see; a rolled-back DELETE leaves it set too.
id: doc-ddl-system-columns.xmax-set-by-uncommitted-delete
title: Uncommitted and rolled-back deletes leave xmax set on visible row versions
family: doc-ddl-system-columns
tier: core
feature_ids: [system-columns, xmax, transactions, read-committed, multi-session]
required_capabilities: [create-table, insert, select, delete, transactions, multi-session]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (xmax nonzero in a visible row version when deletion is uncommitted or rolled back)"
sessions: [a, b]
setup: |
  CREATE TABLE t (id int4, v int4 NOT NULL);
  INSERT INTO t VALUES (1, 10), (2, 20);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      DELETE FROM t WHERE id = 1
    expect: ok
  - session: b
    sql: |
      SELECT id, v, xmax <> '0'::xid AS xmax_set FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: b still sees row 1 because a has not committed; its xmax is set
  - session: a
    sql: |
      ROLLBACK
    expect: ok
  - session: b
    sql: |
      SELECT id, v, xmax <> '0'::xid AS xmax_set FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: after rollback row 1 is visible again but its xmax stays set
