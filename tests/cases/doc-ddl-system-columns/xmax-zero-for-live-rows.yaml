# xmax is zero for an undeleted row version, including the new version written by an UPDATE.
id: doc-ddl-system-columns.xmax-zero-for-live-rows
title: xmax is zero for live row versions
family: doc-ddl-system-columns
tier: core
feature_ids: [system-columns, xmax, update]
required_capabilities: [create-table, insert, update, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ddl.sgml#ddl-system-columns (xmax: zero for an undeleted row version)"
setup: |
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (1, 10), (2, 20), (3, 30);
steps:
  - sql: |
      SELECT id, xmax = '0'::xid AS undeleted FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      UPDATE t SET v = v + 1 WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, v, xmax = '0'::xid AS undeleted FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the new row version written by the UPDATE is undeleted
