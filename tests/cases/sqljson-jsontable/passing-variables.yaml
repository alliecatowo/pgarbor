# PASSING variables are visible in the row path and in column paths.
id: sqljson-jsontable.passing-variables
title: PASSING variables used in row path filter and in column path filter
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, passing, jsonpath]
required_capabilities: [select, jsonb, json-table, jsonpath]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT y FROM JSON_TABLE(jsonb '[1, 2, 3]', '$[*] ? (@ < $x)' PASSING 3 AS x COLUMNS (y text FORMAT JSON PATH '$')) jt ORDER BY y
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM JSON_TABLE(jsonb '[1, 2, 3]', '$[*] ? (@ < $x)' PASSING 10 AS x, 3 AS y COLUMNS (a text FORMAT JSON PATH '$ ? (@ < $y)')) jt ORDER BY a
    expect: rows
    order: ordered
