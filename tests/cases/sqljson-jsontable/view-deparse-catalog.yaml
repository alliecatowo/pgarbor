# Views over JSON_TABLE: default ON ERROR / ON EMPTY behavior is not deparsed; explicit EMPTY ON ERROR is.
id: sqljson-jsontable.view-deparse-catalog
title: pg_get_viewdef output for JSON_TABLE views omits default behaviors
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, views, catalog-introspection, deparse]
required_capabilities: [select, jsonb, json-table, views, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql (\\sv deparse checks)"
steps:
  - sql: |
      CREATE VIEW json_table_view8 AS SELECT * FROM JSON_TABLE('"a"', '$' COLUMNS (a text PATH '$')); CREATE VIEW json_table_view9 AS SELECT * FROM JSON_TABLE('"a"', '$' COLUMNS (a text PATH '$') EMPTY ON ERROR)
    expect: ok
  - sql: |
      SELECT pg_get_viewdef('json_table_view8'::regclass, true) AS def
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_get_viewdef('json_table_view9'::regclass, true) AS def
    expect: rows
    order: ordered
  - sql: |
      DROP VIEW json_table_view8; DROP VIEW json_table_view9
    expect: ok
