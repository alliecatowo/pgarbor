# Domain-typed JSON_TABLE column: DEFAULT of the domain type on EMPTY and on ERROR.
id: sqljson-jsontable.domain-default
title: Domain-typed column accepts DEFAULT ON EMPTY and DEFAULT ON ERROR values
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, domains, default-behavior]
required_capabilities: [select, jsonb, json-table, domains]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
setup: |
  CREATE DOMAIN jsonb_test_domain AS text CHECK (value <> 'foo');
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '{"d1": "H"}', '$' COLUMNS (js1 jsonb_test_domain PATH '$.a2' DEFAULT 'foo1'::jsonb_test_domain ON EMPTY))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '{"d1": "foo"}', '$' COLUMNS (js1 jsonb_test_domain PATH '$.d1' DEFAULT 'foo2'::jsonb_test_domain ON ERROR))
    expect: rows
    order: multiset
