# OMIT QUOTES may not be combined with WITH WRAPPER; KEEP QUOTES with WITH WRAPPER is accepted.
id: sqljson-jsontable.wrapper-omit-quotes-error
title: OMIT QUOTES rejected together with WITH WRAPPER, KEEP QUOTES accepted
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, wrapper, quotes, errors]
required_capabilities: [select, jsonb, json-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"world"', '$' COLUMNS (item text PATH '$' WITH WRAPPER OMIT QUOTES))
    expect: error
    comment: SQLSTATE not asserted; regress file expects an error here
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"world"', '$' COLUMNS (item text FORMAT JSON PATH '$' WITH WRAPPER KEEP QUOTES))
    expect: rows
    order: multiset
