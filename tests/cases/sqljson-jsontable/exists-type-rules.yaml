# Type rules for EXISTS PATH columns: int4 and char(5) accepted; int2/int8/float4 and char(3) rejected under default FALSE ON ERROR (42804), verified on PG 18.6.
id: sqljson-jsontable.exists-type-rules
title: EXISTS PATH column type rules for int4, int2, int8, float4 and char
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, exists-path, numeric, char]
required_capabilities: [select, jsonb, json-table, numeric, char]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int4 EXISTS PATH '$.a' ERROR ON ERROR))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int2 EXISTS PATH '$.a'))
    expect: error
    sqlstate: "42804"
    comment: default FALSE ON ERROR cannot be coerced to int2 (no boolean-to-int2 cast); PG 18.6 raises 42804
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int8 EXISTS PATH '$.a'))
    expect: error
    sqlstate: "42804"
    comment: default FALSE ON ERROR cannot be coerced to int8; PG 18.6 raises 42804
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a float4 EXISTS PATH '$.a'))
    expect: error
    sqlstate: "42804"
    comment: default FALSE ON ERROR cannot be coerced to float4; PG 18.6 raises 42804
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a char(5) EXISTS PATH '$.a' ERROR ON ERROR))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a char(3) EXISTS PATH '$.a'))
    expect: error
    sqlstate: "42804"
    comment: default FALSE ON ERROR does not fit char(3); PG 18.6 raises 42804
