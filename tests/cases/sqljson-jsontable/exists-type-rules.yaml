# Type rules for EXISTS PATH columns: integer-like types accepted, char(n) default FALSE may not fit.
id: sqljson-jsontable.exists-type-rules
title: EXISTS PATH column type acceptance for integer, float, char and json types
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, exists-path, numeric, char]
required_capabilities: [select, jsonb, json-table, numeric, char]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int4 EXISTS PATH '$.a' ERROR ON ERROR))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int2 EXISTS PATH '$.a'))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int8 EXISTS PATH '$.a'))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a float4 EXISTS PATH '$.a'))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a char(5) EXISTS PATH '$.a' ERROR ON ERROR))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a char(3) EXISTS PATH '$.a'))
    expect: error
    comment: default FALSE ON ERROR does not fit char(3); SQLSTATE not asserted
