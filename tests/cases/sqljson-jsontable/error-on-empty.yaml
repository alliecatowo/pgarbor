# ERROR ON EMPTY on a lax path that matches nothing raises no_sql_json_item.
id: sqljson-jsontable.error-on-empty
title: ERROR ON EMPTY raises no_sql_json_item for a missing member
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, errors, on-empty]
required_capabilities: [select, jsonb, json-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql; errcode 22035"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '1', '$' COLUMNS (a int PATH '$.a' ERROR ON EMPTY)) jt
    expect: error
    sqlstate: "22035"
