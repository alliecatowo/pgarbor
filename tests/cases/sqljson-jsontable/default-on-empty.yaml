# DEFAULT ... ON EMPTY supplies a value for a missing lax member; without it the column is NULL.
id: sqljson-jsontable.default-on-empty
title: DEFAULT clause on EMPTY replaces missing member, plain column gives NULL
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, default-behavior, null-semantics]
required_capabilities: [select, jsonb, json-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '{"d1": "H"}', '$' COLUMNS (js1 text PATH '$.a2' DEFAULT 'foo1' ON EMPTY, js2 int PATH '$.a2' DEFAULT 7 ON EMPTY, js3 text PATH '$.a2'))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '{"d1": "foo"}', '$' COLUMNS (js1 text PATH '$.d1' DEFAULT 'foo2' ON ERROR, js2 oid[] PATH '$.d2' DEFAULT '{1}'::int[]::oid[] ON EMPTY))
    expect: rows
    order: multiset
