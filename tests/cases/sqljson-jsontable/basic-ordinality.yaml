# JSON_TABLE over a JSON array with FOR ORDINALITY, text and int columns, and a scalar root.
id: sqljson-jsontable.basic-ordinality
title: JSON_TABLE row generation with FOR ORDINALITY and path columns
family: sqljson-jsontable
tier: slice
feature_ids: [json-table, jsonb, ordinality, select]
required_capabilities: [select, jsonb, json-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT id, val FROM JSON_TABLE(jsonb '[{"v": "x"}, {"v": 3}, {"v": "z"}]', '$[*]' COLUMNS (id FOR ORDINALITY, val text PATH '$.v')) jt ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '{"a": 1}', '$' COLUMNS (a int PATH '$.a', b text PATH '$.b'))
    expect: rows
    order: multiset
