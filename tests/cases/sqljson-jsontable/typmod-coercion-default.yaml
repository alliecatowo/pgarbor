# A DEFAULT expression of the column's base type is still coerced to the column typmod, so overflow fails.
id: sqljson-jsontable.typmod-coercion-default
title: DEFAULT value is coerced to numeric(4,1) typmod and overflow raises an error
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, numeric, typmod, default-behavior]
required_capabilities: [select, jsonb, json-table, numeric]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '{}', '$' COLUMNS (c numeric(4,1) PATH '$.x' DEFAULT 99999.999 ON EMPTY))
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '{}', '$' COLUMNS (c numeric(4,1) PATH '$.x' DEFAULT 12.34 ON EMPTY))
    expect: rows
    order: multiset
