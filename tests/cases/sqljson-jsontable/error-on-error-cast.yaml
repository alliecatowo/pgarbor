# ERROR ON ERROR turns a failed text-to-int conversion of a JSON string into a SQLSTATE error.
id: sqljson-jsontable.error-on-error-cast
title: ERROR ON ERROR raises invalid_text_representation for non-integer string
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, errors, on-error]
required_capabilities: [select, jsonb, json-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql; errcode 22P02"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int PATH '$' ERROR ON ERROR)) jt
    expect: error
    sqlstate: "22P02"
