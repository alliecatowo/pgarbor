# FORMAT JSON with KEEP QUOTES versus OMIT QUOTES on a scalar string, plus ON SCALAR STRING.
id: sqljson-jsontable.format-quotes
title: KEEP QUOTES and OMIT QUOTES on string scalars for text columns
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, format-json, quotes]
required_capabilities: [select, jsonb, json-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"world"', '$' COLUMNS (item text PATH '$' KEEP QUOTES ON SCALAR STRING))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"world"', '$' COLUMNS (item text PATH '$' OMIT QUOTES ON SCALAR STRING))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"world"', '$' COLUMNS (item text FORMAT JSON PATH '$' KEEP QUOTES))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"world"', '$' COLUMNS (item text FORMAT JSON PATH '$' OMIT QUOTES))
    expect: rows
    order: multiset
