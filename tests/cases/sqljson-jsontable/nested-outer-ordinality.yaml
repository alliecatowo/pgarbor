# NESTED PATH is an outer join: parents without children survive with NULLs, and FOR ORDINALITY restarts per parent.
id: sqljson-jsontable.nested-outer-ordinality
title: NESTED PATH keeps childless parent rows and restarts ordinality per parent
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, nested-path, ordinality]
required_capabilities: [select, jsonb, json-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT name, pos, item
      FROM JSON_TABLE(jsonb '[{"n": "a", "items": [1, 2]}, {"n": "b", "items": []}, {"n": "c"}]', '$[*]'
        COLUMNS (
          name text PATH '$.n',
          NESTED PATH '$.items[*]' COLUMNS (pos FOR ORDINALITY, item int PATH '$')
        )) jt
      ORDER BY name, pos
    expect: rows
    order: ordered
