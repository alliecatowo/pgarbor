# Sibling NESTED PATH clauses are combined by UNION (not cross product): each row fills only one branch's columns.
id: sqljson-jsontable.sibling-nested-union
title: Sibling nested paths produce a union of rows, not a cross product
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, nested-path, union-plan]
required_capabilities: [select, jsonb, json-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT b, c
      FROM JSON_TABLE(jsonb '{"b": [1, 2], "c": [10, 20, 30]}', '$'
        COLUMNS (
          NESTED PATH '$.b[*]' COLUMNS (b int PATH '$'),
          NESTED PATH '$.c[*]' COLUMNS (c int PATH '$')
        )) jt
    expect: rows
    order: multiset
