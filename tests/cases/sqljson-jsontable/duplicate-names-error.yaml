# Column names and path names within one JSON_TABLE must be distinct (duplicate_alias).
id: sqljson-jsontable.duplicate-names-error
title: Duplicate column names and column-versus-path name collisions are rejected
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, errors, naming]
required_capabilities: [select, jsonb, json-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql; parser/parse_jsontable.c duplicate JSON_TABLE column or path name"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"1.23"', '$' COLUMNS (js2 int path '$', js2 int path '$')) jt
    expect: error
    sqlstate: "42712"
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"1.23"', '$.a' AS js2 COLUMNS (js2 int path '$')) jt
    expect: error
    sqlstate: "42712"
