# Without ERROR ON ERROR a failed conversion yields NULL; a column DEFAULT ... ON ERROR yields the default instead.
id: sqljson-jsontable.on-error-null-default
title: Default ON ERROR behavior is NULL, and explicit DEFAULT ON ERROR overrides it
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, on-error, default-behavior]
required_capabilities: [select, jsonb, json-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int PATH '$'))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int PATH '$' DEFAULT 1 ON EMPTY DEFAULT 2 ON ERROR))
    expect: rows
    order: multiset
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '"a"', '$' COLUMNS (a int PATH 'lax $.a' DEFAULT 1 ON EMPTY DEFAULT 2 ON ERROR))
    expect: rows
    order: multiset
