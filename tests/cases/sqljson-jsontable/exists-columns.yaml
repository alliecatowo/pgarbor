# EXISTS PATH columns return booleans; lax vs strict mode and UNKNOWN/FALSE ON ERROR on scalar and empty inputs.
id: sqljson-jsontable.exists-columns
title: EXISTS PATH columns across scalar, array, object inputs with lax and strict modes
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, exists-path, on-error, join]
required_capabilities: [select, jsonb, json-table, join]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT v.js, jt.e1, jt.e2, jt.e3, jt.e4
      FROM (VALUES ('1'), ('[]'), ('{}'), ('{"aaa": 123}')) AS v(js)
        LEFT OUTER JOIN JSON_TABLE(v.js::jsonb, 'lax $' COLUMNS (
          e1 bool EXISTS PATH '$.aaa',
          e2 int EXISTS PATH '$.aaa',
          e3 int EXISTS PATH 'strict $.aaa' UNKNOWN ON ERROR,
          e4 text EXISTS PATH 'strict $.aaa' FALSE ON ERROR)) jt ON true
      ORDER BY v.js
    expect: rows
    order: ordered
