# Top-level ON ERROR may only be EMPTY or ERROR; a second FOR ORDINALITY column is a syntax error.
id: sqljson-jsontable.syntax-errors
title: Invalid top-level ON ERROR and double FOR ORDINALITY are syntax errors
family: sqljson-jsontable
tier: extended
feature_ids: [json-table, jsonb, errors, ordinality, syntax]
required_capabilities: [select, jsonb, json-table, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql; parser/parse_jsontable.c"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE('[]', 'strict $.a' COLUMNS (js2 int PATH '$') NULL ON ERROR) jt
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT * FROM JSON_TABLE(jsonb '1', '$' COLUMNS (id FOR ORDINALITY, id2 FOR ORDINALITY, a int PATH '$.a' ERROR ON EMPTY)) jt
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT * FROM JSON_TABLE('[]', 'strict $.a' COLUMNS (js2 int PATH '$') EMPTY ON ERROR) jt
    expect: rows
    order: multiset
