# NULL context item produces an empty table; LEFT JOIN ON true keeps the outer row with NULL columns.
id: sqljson-jsontable.null-input-empty
title: NULL context item yields zero rows and LEFT JOIN keeps outer row
family: sqljson-jsontable
tier: core
feature_ids: [json-table, jsonb, null-semantics, join]
required_capabilities: [select, jsonb, json-table, join]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/sqljson_jsontable.sql"
steps:
  - sql: |
      SELECT * FROM JSON_TABLE(NULL::jsonb, '$' COLUMNS (foo int)) bar
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) FROM JSON_TABLE(NULL::jsonb, '$' COLUMNS (foo int)) bar
    expect: rows
    order: ordered
  - sql: |
      SELECT o.k, jt.foo FROM (VALUES (1), (2)) AS o(k) LEFT OUTER JOIN JSON_TABLE(NULL::jsonb, '$' COLUMNS (foo int)) jt ON true ORDER BY o.k
    expect: rows
    order: ordered
