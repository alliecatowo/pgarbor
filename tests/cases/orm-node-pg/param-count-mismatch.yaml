# Referencing $2 when only one parameter is bound is an error; the session stays usable afterwards.
id: orm-node-pg.param-count-mismatch
title: "Referencing an unbound parameter index fails, session recovers"
family: orm-node-pg
tier: core
feature_ids: [parameterized-queries, errors]
required_capabilities: [select, extended-protocol, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 42P02 undefined_parameter; node-postgres values array length mismatch"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT $1::int4 + $2::int4
      params: ["1"]
    expect: error
    sqlstate: "42P02"
  - sql: |
      SELECT 1 AS still_ok
    expect: rows
