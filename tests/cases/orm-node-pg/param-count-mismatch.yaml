# Binding fewer parameters than the statement requires is a protocol violation (08P01); the session stays usable afterwards.
id: orm-node-pg.param-count-mismatch
title: "Bind with fewer parameters than referenced fails, session recovers"
family: orm-node-pg
tier: core
feature_ids: [parameterized-queries, errors]
required_capabilities: [select, extended-protocol, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 08P01 protocol_violation (bind message supplies 1 parameters, but prepared statement requires 2); node-postgres values array length mismatch"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT $1::int4 + $2::int4
      params: ["1"]
    expect: error
    sqlstate: "08P01"
  - sql: |
      SELECT 1 AS still_ok
    expect: rows
