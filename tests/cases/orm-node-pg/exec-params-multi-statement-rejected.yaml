# Extended-protocol Parse accepts exactly one statement; node-postgres parameterized queries
# cannot carry several ';'-separated commands.
id: orm-node-pg.exec-params-multi-statement-rejected
title: "Parameterized query containing two statements is rejected with 42601"
family: orm-node-pg
tier: extended
feature_ids: [parameterized-queries, multiple-statements, errors]
required_capabilities: [select, extended-protocol, errors]
provenance:
  source: hand
  ref: "PG18 protocol-flow extended query: Parse holds one statement; errcodes 42601 syntax_error"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT $1::int4; SELECT $1::int4
      params: ["1"]
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 2 AS still_ok
    expect: rows
