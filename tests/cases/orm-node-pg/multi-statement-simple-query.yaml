# Simple Query protocol (client.query(text) with no values): several ';'-separated statements in one message.
id: orm-node-pg.multi-statement-simple-query
title: "Multiple statements in one simple Query, one result per statement"
family: orm-node-pg
tier: core
feature_ids: [simple-query, multiple-statements, insert, select, identity]
required_capabilities: [create-table, insert, select, identity]
provenance:
  source: hand
  ref: "PG18 protocol-flow simple query; node-postgres client.query(text) without values"
sessions: [a]
setup: |
  CREATE TABLE ev (id int4 GENERATED ALWAYS AS IDENTITY PRIMARY KEY, kind text NOT NULL);
steps:
  - sql: |
      INSERT INTO ev (kind) VALUES ('start');
      INSERT INTO ev (kind) VALUES ('stop');
      SELECT id, kind FROM ev ORDER BY id
    expect: any
    order: ordered
    comment: the final statement returns rows; the earlier ones are commands
  - sql: |
      SELECT 1 AS a; SELECT 'two' AS b, NULL::text AS c
    expect: any
    comment: two result sets from one Query message
  - sql: |
      SELECT id, kind FROM ev ORDER BY id
    expect: rows
    order: ordered
