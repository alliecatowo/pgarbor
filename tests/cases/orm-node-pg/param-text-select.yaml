# node-postgres client.query(text, values) sends an unnamed Parse/Bind with text-format params.
id: orm-node-pg.param-text-select
title: "Text-format bind parameters decode to int8, text and numeric in exec_params"
family: orm-node-pg
tier: core
feature_ids: [parameterized-queries, select, int8, numeric]
required_capabilities: [create-table, insert, select, extended-protocol, numeric]
provenance:
  source: hand
  ref: "node-postgres: pg Client.query(text, values) -> unnamed extended query with text params"
sessions: [a]
setup: |
  CREATE TABLE item (id int8 PRIMARY KEY, label text, price numeric(10,2));
  INSERT INTO item VALUES (1, 'alpha', 9.50), (9007199254740993, 'big', 100.00);
steps:
  - exec_params:
      sql: |
        SELECT id, label, price FROM item WHERE id = $1 OR label = $2 ORDER BY id
      params: ["9007199254740993", "alpha"]
    expect: rows
    order: ordered
    comment: id above 2^53 must round-trip as exact text, not a float
  - exec_params:
      sql: |
        SELECT $1::numeric + $2::numeric AS s, $3::text AS t, $3::text IS NULL AS t_null
      params: ["1.10", "2.200", ""]
    expect: rows
