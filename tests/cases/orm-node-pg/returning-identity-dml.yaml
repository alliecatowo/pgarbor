# INSERT/UPDATE/DELETE ... RETURNING through bind parameters, the way ORMs read back generated ids.
id: orm-node-pg.returning-identity-dml
title: "RETURNING values from parameterized INSERT, UPDATE and DELETE"
family: orm-node-pg
tier: core
feature_ids: [returning, parameterized-queries, identity, insert, update, delete]
required_capabilities: [create-table, insert, select, update, delete, identity, extended-protocol]
provenance:
  source: hand
  ref: "PG18 sql-insert.html RETURNING; node-postgres insert ... returning id pattern"
sessions: [a]
setup: |
  CREATE TABLE person (id int4 GENERATED ALWAYS AS IDENTITY PRIMARY KEY, name text NOT NULL);
steps:
  - exec_params:
      sql: |
        INSERT INTO person (name) VALUES ($1), ($2) RETURNING id, name
      params: ["ann", "bo"]
    expect: rows
    order: multiset
  - exec_params:
      sql: |
        UPDATE person SET name = $2 WHERE id = $1 RETURNING id, name
      params: ["1", "anne"]
    expect: rows
  - exec_params:
      sql: |
        DELETE FROM person WHERE id = $1 RETURNING id, name
      params: ["9"]
    expect: rows
    comment: no matching row, so RETURNING yields zero rows
  - sql: |
      SELECT id, name FROM person ORDER BY id
    expect: rows
    order: ordered
