# Array text output and input as node-postgres sees it: braces, quoting, NULL elements, empty arrays.
id: orm-node-pg.arrays-text-output
title: "Array literals in text output and as bind parameters, including NULL elements and bad input"
family: orm-node-pg
tier: extended
feature_ids: [arrays, parameterized-queries, errors]
required_capabilities: [select, extended-protocol, errors]
provenance:
  source: hand
  ref: "PG18 arrays.html array input/output syntax; errcodes 22P02"
sessions: [a]
steps:
  - sql: |
      SELECT ARRAY[1,2,NULL]::int4[] AS a, '{}'::text[] AS e, ARRAY['a b','c,d','NULL','']::text[] AS q
    expect: rows
  - exec_params:
      sql: |
        SELECT $1::int8[] AS a, cardinality($1::int8[]) AS n
      params: ["{1,NULL,9223372036854775807}"]
    expect: rows
  - exec_params:
      sql: |
        SELECT $1::int4[] AS a
      params: ["{1,x}"]
    expect: error
    sqlstate: "22P02"
