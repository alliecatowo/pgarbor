# int4 input accepts surrounding whitespace and rejects malformed or empty text with 22P02.
id: orm-node-pg.int4-text-param-parsing
title: "int4 text parameters: whitespace is trimmed, malformed and empty input rejected"
family: orm-node-pg
tier: core
feature_ids: [parameterized-queries, int4, errors]
required_capabilities: [select, extended-protocol, errors]
provenance:
  source: hand
  ref: "PG18 int4in; errcodes 22P02 invalid_text_representation"
sessions: [a]
steps:
  - exec_params:
      sql: |
        SELECT $1::int4 AS v
      params: [" 42 "]
    expect: rows
  - exec_params:
      sql: |
        SELECT $1::int4 AS v
      params: ["12abc"]
    expect: error
    sqlstate: "22P02"
  - exec_params:
      sql: |
        SELECT $1::int4 AS v
      params: [""]
    expect: error
    sqlstate: "22P02"
  - exec_params:
      sql: |
        SELECT $1::int4 AS v
      params: [null]
    expect: rows
    comment: SQL NULL casts to NULL without error
