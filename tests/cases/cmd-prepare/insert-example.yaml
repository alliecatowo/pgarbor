# Documented example: PREPARE an INSERT with typed parameters, then EXECUTE it.
id: cmd-prepare.insert-example
title: PREPARE a typed INSERT and EXECUTE it with literal arguments
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, insert, prepared-statements]
required_capabilities: [create-table, insert, select, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare-examples (first example)"
sessions: [a]
setup: |
  CREATE TABLE foo (a int, b text, c bool, d numeric)
steps:
  - sql: |
      PREPARE fooplan (int, text, bool, numeric) AS
          INSERT INTO foo VALUES($1, $2, $3, $4)
    expect: ok
  - sql: |
      EXECUTE fooplan(1, 'Hunter Valley', 't', 200.00)
    expect: ok
    comment: command tag INSERT 0 1
  - sql: |
      SELECT a, b, c, d FROM foo ORDER BY a
    expect: rows
    order: ordered
