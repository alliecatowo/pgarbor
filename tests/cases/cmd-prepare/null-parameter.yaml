# NULL bound to a parameter is SQL NULL; IS NULL distinguishes it from zero.
id: cmd-prepare.null-parameter
title: NULL passed to EXECUTE is SQL NULL and differs from the value zero
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, nulls, prepared-statements]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Parameters: data_type)"
sessions: [a]
steps:
  - sql: |
      PREPARE isnul (int) AS SELECT $1 IS NULL AS isnul, $1 IS NOT DISTINCT FROM 0 AS is_zero
    expect: ok
  - sql: |
      EXECUTE isnul(NULL)
    expect: rows
    order: ordered
  - sql: |
      EXECUTE isnul(0)
    expect: rows
    order: ordered
