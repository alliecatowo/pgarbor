# Parameter types are inferred from context when omitted, and kept as declared when given.
id: cmd-prepare.param-types-from-context
title: Omitted parameter types are inferred from context and reported in pg_prepared_statements
family: cmd-prepare
tier: core
feature_ids: [prepare, type-inference, prepared-statements, catalog-introspection]
required_capabilities: [create-table, select, insert, prepared-statements, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Parameters: data_type)"
sessions: [a]
setup: |
  CREATE TABLE q (a int, b text)
steps:
  - sql: |
      PREPARE ins AS INSERT INTO q (a, b) VALUES ($1, $2)
    expect: ok
  - sql: |
      PREPARE sel AS SELECT b FROM q WHERE a = $1 AND b <> $2
    expect: ok
  - sql: |
      PREPARE typed (unknown, int) AS SELECT $1 || 'x' AS s, $2 + 1 AS n
    expect: ok
    comment: explicit unknown is inferred from context (text here), int is kept
  - sql: |
      SELECT name, parameter_types::text FROM pg_prepared_statements ORDER BY name
    expect: rows
    order: ordered
