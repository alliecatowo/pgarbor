# A VALUES statement is a permitted prepared statement and takes parameters.
id: cmd-prepare.values-statement
title: PREPARE a VALUES statement with a parameter and EXECUTE it
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, values, prepared-statements]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Parameters: statement)"
sessions: [a]
steps:
  - sql: |
      PREPARE v (int) AS VALUES ($1, $1 * 2)
    expect: ok
  - sql: |
      EXECUTE v(5)
    expect: rows
    order: ordered
