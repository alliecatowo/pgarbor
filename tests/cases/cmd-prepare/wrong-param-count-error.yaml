# EXECUTE must supply exactly as many parameters as the prepared statement declares.
id: cmd-prepare.wrong-param-count-error
title: EXECUTE with too few or too many parameters is rejected
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, errors, prepared-statements]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-execute"
sessions: [a]
steps:
  - sql: |
      PREPARE y (int) AS SELECT $1
    expect: ok
  - sql: |
      EXECUTE y
    expect: error
    sqlstate: "42601"
    comment: zero parameters supplied for one declared
  - sql: |
      EXECUTE y(1, 2)
    expect: error
    sqlstate: "42601"
    comment: two parameters supplied for one declared
  - sql: |
      EXECUTE y(7)
    expect: rows
    order: ordered
    comment: the prepared statement is still usable after the failed EXECUTEs
