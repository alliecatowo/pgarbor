# A parameter with no declared type and no usable context in a bare SELECT resolves to text.
id: cmd-prepare.untyped-select-param-text
title: A bare SELECT of an untyped parameter resolves it to text
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, type-inference, nulls]
required_capabilities: [select, prepared-statements, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Parameters: data_type, unknown)"
sessions: [a]
steps:
  - sql: |
      PREPARE echo AS SELECT $1 AS v
    expect: ok
  - sql: |
      EXECUTE echo('42')
    expect: rows
    order: ordered
    comment: the literal stays text, so no integer coercion happens
  - sql: |
      EXECUTE echo(NULL)
    expect: rows
    order: ordered
  - sql: |
      SELECT parameter_types::text FROM pg_prepared_statements WHERE name = 'echo'
    expect: rows
    order: ordered
