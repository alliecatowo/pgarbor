# When a parameter's type cannot be inferred from context, PREPARE fails rather than guessing.
id: cmd-prepare.ambiguous-type-error-at-prepare
title: PREPARE fails when two untyped parameters have no context to resolve an operator
family: cmd-prepare
tier: core
feature_ids: [prepare, type-inference, operators, errors]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Parameters: data_type, inferred if possible)"
sessions: [a]
steps:
  - sql: |
      PREPARE ff AS SELECT $1 + $2
    expect: error
    sqlstate: "42725"
    comment: inference is only done "if possible"; unknown + unknown is ambiguous
  - sql: |
      PREPARE ff AS SELECT $1::int + $2
    expect: ok
    comment: a single typed operand resolves the operator, and the name was not taken
