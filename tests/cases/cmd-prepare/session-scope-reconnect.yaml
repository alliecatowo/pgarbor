# A prepared statement is forgotten when its session ends; it must be prepared again after a reconnect.
id: cmd-prepare.session-scope-reconnect
title: Prepared statements are lost when the connection ends and must be re-prepared
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, sessions, prepared-statements]
required_capabilities: [select, prepared-statements, reconnect, errors]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Description: session lifetime)"
sessions: [a]
steps:
  - sql: |
      PREPARE s AS SELECT 'x' AS v
    expect: ok
  - sql: |
      EXECUTE s
    expect: rows
    order: ordered
  - reconnect: true
  - sql: |
      EXECUTE s
    expect: error
    sqlstate: "26000"
    comment: the new connection has no statement s
  - sql: |
      PREPARE s AS SELECT 'y' AS v
    expect: ok
  - sql: |
      EXECUTE s
    expect: rows
    order: ordered
