# Analysis errors surface at PREPARE time, so no prepared statement is created.
id: cmd-prepare.analysis-error-at-prepare
title: A WHERE clause that is not boolean fails PREPARE and leaves no statement behind
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, errors, type-checking, prepared-statements]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare-notes (statement is parsed, analyzed and rewritten by PREPARE)"
sessions: [a]
steps:
  - sql: |
      PREPARE ff4 (int, int) AS SELECT $1 WHERE $2
    expect: error
    sqlstate: "42804"
    comment: $2 declared integer, WHERE needs boolean
  - sql: |
      EXECUTE ff4(1, NULL)
    expect: error
    sqlstate: "26000"
