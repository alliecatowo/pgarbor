# Only SELECT, INSERT, UPDATE, DELETE, MERGE and VALUES can be prepared; DDL is a syntax error and nothing is created.
id: cmd-prepare.unsupported-statement-error
title: PREPARE of a DDL statement is a syntax error and creates no prepared statement
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, errors, prepared-statements]
required_capabilities: [select, prepared-statements, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Parameters: statement)"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS CREATE TABLE zz (x int)
    expect: error
    sqlstate: "42601"
  - sql: |
      EXECUTE p
    expect: error
    sqlstate: "26000"
    comment: no statement named p exists
  - sql: |
      SELECT count(*) AS n FROM pg_prepared_statements
    expect: rows
    order: ordered
