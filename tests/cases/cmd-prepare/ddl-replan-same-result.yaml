# DDL on a table forces re-analysis of a prepared statement; an unaffected result shape still works.
id: cmd-prepare.ddl-replan-same-result
title: A prepared SELECT keeps working after ALTER TABLE adds a column it does not reference
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, alter-table, replan, prepared-statements]
required_capabilities: [create-table, insert, select, alter-table, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare-notes (re-analysis after DDL)"
sessions: [a]
setup: |
  CREATE TABLE foo (a int, b text);
  INSERT INTO foo VALUES (1, 'one'), (2, 'two')
steps:
  - sql: |
      PREPARE a1 AS SELECT a FROM foo ORDER BY a
    expect: ok
  - sql: |
      ALTER TABLE foo ADD COLUMN c int DEFAULT 7
    expect: ok
  - sql: |
      EXECUTE a1
    expect: rows
    order: ordered
    comment: re-analyzed against the altered table, same result shape
