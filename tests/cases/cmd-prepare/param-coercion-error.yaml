# A declared integer parameter accepts a numeric string but rejects a non-numeric one at EXECUTE time.
id: cmd-prepare.param-coercion-error
title: EXECUTE coerces a text literal to the declared parameter type and rejects bad input
family: cmd-prepare
tier: core
feature_ids: [prepare, execute, type-coercion, errors, prepared-statements]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare (Parameters: data_type)"
sessions: [a]
steps:
  - sql: |
      PREPARE y (int) AS SELECT $1 + 1 AS n
    expect: ok
  - sql: |
      EXECUTE y('42')
    expect: rows
    order: ordered
  - sql: |
      EXECUTE y('abc')
    expect: error
    sqlstate: "22P02"
