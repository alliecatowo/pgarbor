# An expression is evaluated as SELECT <expression>, so IF count(*) > 0 FROM my_table THEN works.
id: doc-plpgsql-expressions.if-count-select-from
title: IF condition with an aggregate and FROM clause evaluates as a SELECT
family: doc-plpgsql-expressions
tier: core
feature_ids: [plpgsql, expressions, aggregates, if-statement]
required_capabilities: [plpgsql, create-function, create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-expressions (IF count(*) > 0 FROM my_table THEN)"
sessions: [a]
setup: |
  CREATE TABLE my_table (id int4 PRIMARY KEY);
  CREATE FUNCTION my_table_nonempty() RETURNS boolean LANGUAGE plpgsql AS $$
  BEGIN
    IF count(*) > 0 FROM my_table THEN
      RETURN true;
    END IF;
    RETURN false;
  END $$;
steps:
  - sql: |
      SELECT my_table_nonempty() AS nonempty
    expect: rows
    comment: empty table, count(*) is a single row with 0
  - sql: |
      INSERT INTO my_table VALUES (10), (20)
    expect: ok
  - sql: |
      SELECT my_table_nonempty() AS nonempty
    expect: rows
