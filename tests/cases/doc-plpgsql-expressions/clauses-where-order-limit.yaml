# The expression is an ordinary SELECT, so WHERE, ORDER BY, LIMIT and aggregates are allowed.
id: doc-plpgsql-expressions.clauses-where-order-limit
title: Expression SELECT accepts WHERE, ORDER BY, LIMIT and aggregate clauses
family: doc-plpgsql-expressions
tier: core
feature_ids: [plpgsql, expressions, order-by, limit, aggregates]
required_capabilities: [plpgsql, create-function, create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-expressions (it can contain the same clauses that an ordinary SELECT would)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'a'), (2, 'b'), (3, NULL);
  CREATE FUNCTION last_id() RETURNS int LANGUAGE plpgsql AS $$
  DECLARE v int;
  BEGIN
    v := id FROM t ORDER BY id DESC LIMIT 1;
    RETURN v;
  END $$;
  CREATE FUNCTION max_id_where(lim int) RETURNS int LANGUAGE plpgsql AS $$
  DECLARE v int;
  BEGIN
    v := max(id) FROM t WHERE id <= lim;
    RETURN v;
  END $$;
steps:
  - sql: |
      SELECT last_id() AS last_id
    expect: rows
  - sql: |
      SELECT max_id_where(2) AS m2, max_id_where(0) AS m0
    expect: rows
    comment: max over zero matching rows is NULL, which the INTO target receives
