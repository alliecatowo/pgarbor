# A top-level UNION, INTERSECT or EXCEPT cannot appear in a PL/pgSQL expression; the function fails to compile.
id: doc-plpgsql-expressions.union-not-allowed
title: Top-level UNION in an assignment or IF expression is a syntax error at CREATE FUNCTION
family: doc-plpgsql-expressions
tier: core
feature_ids: [plpgsql, expressions, union, errors]
required_capabilities: [plpgsql, create-function, create-table, insert, select, union, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-expressions (cannot include a top-level UNION, INTERSECT, or EXCEPT clause)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'a'), (2, 'b');
steps:
  - sql: |
      CREATE FUNCTION union_assign() RETURNS int LANGUAGE plpgsql AS $$
      DECLARE v int;
      BEGIN
        v := 1 UNION SELECT 2;
        RETURN v;
      END $$
    expect: error
    sqlstate: "42601"
  - sql: |
      CREATE FUNCTION union_if() RETURNS text LANGUAGE plpgsql AS $$
      BEGIN
        IF id > 0 FROM t WHERE id = 1 UNION SELECT id FROM t WHERE id = 2 THEN
          RETURN 'yes';
        END IF;
        RETURN 'no';
      END $$
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM pg_proc WHERE proname IN ('union_assign', 'union_if')
    expect: rows
    comment: neither function was created
