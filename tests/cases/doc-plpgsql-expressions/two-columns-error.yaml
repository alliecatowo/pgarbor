# The expression SELECT must produce a single column; more than one column is an error.
id: doc-plpgsql-expressions.two-columns-error
title: Expression producing two columns is rejected at run time
family: doc-plpgsql-expressions
tier: core
feature_ids: [plpgsql, expressions, errors]
required_capabilities: [plpgsql, create-function, create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "plpgsql.sgml#plpgsql-expressions (The SELECT must produce a single column)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'a'), (2, 'b');
  CREATE FUNCTION assign_two_cols() RETURNS int LANGUAGE plpgsql AS $$
  DECLARE v int;
  BEGIN
    v := id, name FROM t WHERE id = 1;
    RETURN v;
  END $$;
steps:
  - sql: |
      SELECT assign_two_cols()
    expect: error
    sqlstate: "42601"
    comment: rejected even though the query returns exactly one row
