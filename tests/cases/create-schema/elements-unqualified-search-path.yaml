# Elements of a new schema are not on the search path: unqualified names fail until search_path
# includes the schema. current_schema() reports the first existing schema on the path.
id: create-schema.elements-unqualified-search-path
title: Unqualified names in a new schema fail until search_path includes it
family: create-schema
tier: core
feature_ids: [create-schema, search-path, create-table, select]
required_capabilities: [create-schema, create-table, select, search-path]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/create_schema.sql
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s9 CREATE TABLE t9 (v int4)
    expect: ok
  - sql: |
      SELECT count(*) FROM t9
    expect: error
    sqlstate: "42P01"
    comment: t9 lives in s9, which is not on the default search_path
  - sql: |
      SELECT count(*) FROM s9.t9
    expect: rows
  - sql: |
      SET search_path = s9, public
    expect: ok
  - sql: |
      SELECT current_schema(), count(*) FROM t9
    expect: rows
