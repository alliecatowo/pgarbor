# Schema elements run in the order written, so a view cannot reference a table listed after it.
# The failed CREATE SCHEMA is atomic: no schema is left behind.
id: create-schema.element-order-view-before-table
title: View element referencing a later table element fails and leaves no schema behind
family: create-schema
tier: core
feature_ids: [create-schema, create-view, errors]
required_capabilities: [create-schema, create-table, create-view, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/create_schema.sql
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s2
        CREATE VIEW v2 AS SELECT id FROM s2.t2
        CREATE TABLE t2 (id int4)
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's2'
    expect: rows
  - sql: |
      CREATE SCHEMA s2
        CREATE TABLE t2 (id int4)
        CREATE VIEW v2 AS SELECT id FROM s2.t2
    expect: ok
  - sql: |
      SELECT count(*) FROM s2.v2
    expect: rows
