# PostgreSQL reorders CREATE SCHEMA elements (sequences, then tables, then views, ...), so a view
# written before the table it reads from is still created. A view on a relation that exists nowhere
# fails the whole CREATE SCHEMA atomically: no schema is left behind.
id: create-schema.element-order-view-before-table
title: CREATE SCHEMA creates tables before views regardless of element order; a failing view leaves no schema
family: create-schema
tier: core
feature_ids: [create-schema, create-view, errors]
required_capabilities: [create-schema, create-table, create-view, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/create_schema.sql
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s2
        CREATE VIEW v2 AS SELECT id FROM s2.t2
        CREATE TABLE t2 (id int4)
    expect: ok
  - sql: |
      SELECT count(*) FROM s2.v2
    expect: rows
  - sql: |
      CREATE SCHEMA s3
        CREATE VIEW v3 AS SELECT id FROM s3.nosuch
        CREATE TABLE t3 (id int4)
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's3'
    expect: rows
