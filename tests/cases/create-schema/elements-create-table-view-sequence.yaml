# CREATE SCHEMA with several schema elements: they are created in order inside the new schema.
id: create-schema.elements-create-table-view-sequence
title: CREATE SCHEMA with table, view and sequence elements, all placed in the new schema
family: create-schema
tier: core
feature_ids: [create-schema, create-table, create-view, create-sequence, insert, select]
required_capabilities: [create-schema, create-table, insert, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/create_schema.sql
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s1
        CREATE TABLE t1 (id int4 PRIMARY KEY, label text)
        CREATE VIEW v1 AS SELECT id, label FROM s1.t1
        CREATE SEQUENCE sq1
    expect: ok
  - sql: |
      INSERT INTO s1.t1 VALUES (2, 'b'), (1, NULL)
    expect: ok
  - sql: |
      SELECT id, label, label IS NULL AS label_null FROM s1.v1 ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT nextval('s1.sq1'), nextval('s1.sq1')
    expect: rows
    order: ordered
  - sql: |
      SELECT table_schema, table_name, table_type FROM information_schema.tables WHERE table_schema = 's1' ORDER BY table_name
    expect: rows
    order: ordered
