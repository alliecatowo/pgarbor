# Column defaults and NOT NULL inside a CREATE SCHEMA table element; NULL vs DEFAULT on insert.
id: create-schema.elements-defaults-and-not-null
title: Table element defaults apply on DEFAULT, explicit NULL is kept, NOT NULL violation is 23502
family: create-schema
tier: core
feature_ids: [create-schema, create-table, insert, constraints, null-handling]
required_capabilities: [create-schema, create-table, insert, select, constraints]
provenance:
  source: hand
  ref: "PG18 sql-createtable.html (DEFAULT, NOT NULL); errcodes 23502"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s8
        CREATE TABLE t8 (id int4 PRIMARY KEY, note text DEFAULT 'x', n int8 NOT NULL DEFAULT 0)
    expect: ok
  - sql: |
      INSERT INTO s8.t8 (id, note, n) VALUES (1, NULL, DEFAULT), (2, DEFAULT, 5)
    expect: ok
  - sql: |
      INSERT INTO s8.t8 (id, n) VALUES (3, NULL)
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT id, note, note IS NULL AS note_null, n FROM s8.t8 ORDER BY id
    expect: rows
    order: ordered
