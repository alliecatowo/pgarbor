# AUTHORIZATION CURRENT_USER without a schema name: the schema takes the role's name and
# unqualified elements land in it. Role names are not hard-coded; comparisons use current_user.
id: create-schema.authorization-current-user-default-name
title: CREATE SCHEMA AUTHORIZATION CURRENT_USER names the schema after the role and owns it
family: create-schema
tier: extended
feature_ids: [create-schema, authorization, create-table, catalog-introspection]
required_capabilities: [create-schema, create-table, catalog-introspection]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/create_schema.sql
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA AUTHORIZATION CURRENT_USER
        CREATE TABLE tab (id int)
    expect: ok
  - sql: |
      SELECT n.nspname = current_user AS named_after_role, pg_get_userbyid(n.nspowner) = current_user AS owned_by_role
      FROM pg_namespace n WHERE n.nspname = current_user
    expect: rows
    order: ordered
  - sql: |
      SELECT table_schema = current_user AS in_role_schema, table_name FROM information_schema.tables
      WHERE table_name = 'tab' AND table_schema = current_user
    expect: rows
    order: ordered
