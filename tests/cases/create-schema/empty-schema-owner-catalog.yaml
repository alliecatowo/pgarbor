# A schema created without elements is empty, owned by the current role, and holds objects
# created later through qualified names.
id: create-schema.empty-schema-owner-catalog
title: Empty schema has no objects, is owned by the current role, and later holds new tables
family: create-schema
tier: extended
feature_ids: [create-schema, catalog-introspection, create-table]
required_capabilities: [create-schema, create-table, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 sql-createschema.html; catalog pg_namespace, pg_class"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s10
    expect: ok
  - sql: |
      SELECT n.nspname, pg_get_userbyid(n.nspowner) = current_user AS owned_by_me
      FROM pg_namespace n WHERE n.nspname = 's10'
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 's10'
    expect: rows
    comment: empty schema contains no relations
  - sql: |
      CREATE TABLE s10.t (id int4)
    expect: ok
  - sql: |
      SELECT c.relname, c.relkind FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE n.nspname = 's10' ORDER BY c.relname
    expect: rows
    order: ordered
