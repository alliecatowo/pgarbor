# Names beginning with pg_ are reserved for the system and rejected (reserved_name, 42939).
id: create-schema.reserved-pg-prefix-name
title: CREATE SCHEMA with a pg_ prefix is rejected with reserved_name 42939
family: create-schema
tier: core
feature_ids: [create-schema, errors]
required_capabilities: [create-schema]
provenance:
  source: hand
  ref: "PG18 sql-createschema.html; errcodes 42939"
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA pg_s6
    expect: error
    sqlstate: "42939"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 'pg_s6'
    expect: rows
