# DROP SCHEMA without CASCADE refuses a non-empty schema (2BP01); CASCADE drops its contents.
id: create-schema.drop-schema-restrict-then-cascade
title: DROP SCHEMA refuses a non-empty schema until CASCADE is given
family: create-schema
tier: core
feature_ids: [create-schema, drop-schema, errors, create-view]
required_capabilities: [create-schema, create-table, create-view]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/create_schema.sql
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s7
        CREATE TABLE t7 (id int4)
        CREATE VIEW v7 AS SELECT id FROM s7.t7
    expect: ok
  - sql: |
      DROP SCHEMA s7
    expect: error
    sqlstate: "2BP01"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's7'
    expect: rows
    comment: schema still exists after the refused drop
  - sql: |
      DROP SCHEMA s7 CASCADE
    expect: notice
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's7'
    expect: rows
