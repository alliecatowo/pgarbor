# Schema elements may only be qualified with the schema being created (or unqualified).
# Each object kind is rejected with invalid_schema_definition (42P15), as in the regress file.
id: create-schema.element-qualified-other-schema
title: Schema element qualified with a different schema is rejected with 42P15
family: create-schema
tier: core
feature_ids: [create-schema, create-table, create-view, create-index, create-trigger, errors]
required_capabilities: [create-schema, create-table, create-view, create-index, create-trigger]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/create_schema.sql
  license: PostgreSQL License
sessions: [a]
steps:
  - sql: |
      CREATE SCHEMA s3 CREATE TABLE other3.tab (id int)
    expect: error
    sqlstate: "42P15"
  - sql: |
      CREATE SCHEMA s3 CREATE VIEW other3.view3 AS SELECT 1
    expect: error
    sqlstate: "42P15"
  - sql: |
      CREATE SCHEMA s3 CREATE INDEX ON other3.tab (id)
    expect: error
    sqlstate: "42P15"
  - sql: |
      CREATE SCHEMA s3 CREATE TRIGGER trg BEFORE INSERT ON other3.tab EXECUTE FUNCTION other3.no_func()
    expect: error
    sqlstate: "42P15"
  - sql: |
      SELECT count(*) FROM pg_namespace WHERE nspname = 's3'
    expect: rows
    comment: none of the failed statements leaves a schema behind
