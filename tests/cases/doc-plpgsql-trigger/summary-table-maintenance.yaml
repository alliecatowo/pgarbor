# AFTER row trigger maintaining a summary table from the manual: insert-or-update loop with UNIQUE_VIOLATION handling, and a RAISE forbidding key changes.
id: doc-plpgsql-trigger.summary-table-maintenance
title: AFTER row trigger keeps a summary table in step through insert, delete and update, and forbids time_key changes
family: doc-plpgsql-trigger
tier: core
feature_ids: [triggers, after-triggers, plpgsql, summary-table, exception-blocks, unique-violation, loop, raise-exception]
required_capabilities: [create-table, create-index, create-function, triggers, plpgsql, insert, update, delete, select, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-trigger (A PL/pgSQL Trigger Function for Maintaining a Summary Table)"
sessions: [a]
setup: |
  CREATE TABLE time_dimension (
      time_key                    integer NOT NULL,
      day_of_week                 integer NOT NULL,
      day_of_month                integer NOT NULL,
      month                       integer NOT NULL,
      quarter                     integer NOT NULL,
      year                        integer NOT NULL
  );
  CREATE UNIQUE INDEX time_dimension_key ON time_dimension(time_key);
  CREATE TABLE sales_fact (
      time_key                    integer NOT NULL,
      product_key                 integer NOT NULL,
      store_key                   integer NOT NULL,
      amount_sold                 numeric(12,2) NOT NULL,
      units_sold                  integer NOT NULL,
      amount_cost                 numeric(12,2) NOT NULL
  );
  CREATE INDEX sales_fact_time ON sales_fact(time_key);
  CREATE TABLE sales_summary_bytime (
      time_key                    integer NOT NULL,
      amount_sold                 numeric(15,2) NOT NULL,
      units_sold                  numeric(12) NOT NULL,
      amount_cost                 numeric(15,2) NOT NULL
  );
  CREATE UNIQUE INDEX sales_summary_bytime_key ON sales_summary_bytime(time_key);
  CREATE OR REPLACE FUNCTION maint_sales_summary_bytime() RETURNS TRIGGER
  AS $maint_sales_summary_bytime$
      DECLARE
          delta_time_key          integer;
          delta_amount_sold       numeric(15,2);
          delta_units_sold        numeric(12);
          delta_amount_cost       numeric(15,2);
      BEGIN
          IF (TG_OP = 'DELETE') THEN
              delta_time_key = OLD.time_key;
              delta_amount_sold = -1 * OLD.amount_sold;
              delta_units_sold = -1 * OLD.units_sold;
              delta_amount_cost = -1 * OLD.amount_cost;
          ELSIF (TG_OP = 'UPDATE') THEN
              IF ( OLD.time_key != NEW.time_key) THEN
                  RAISE EXCEPTION 'Update of time_key : % -> % not allowed',
                                                        OLD.time_key, NEW.time_key;
              END IF;
              delta_time_key = OLD.time_key;
              delta_amount_sold = NEW.amount_sold - OLD.amount_sold;
              delta_units_sold = NEW.units_sold - OLD.units_sold;
              delta_amount_cost = NEW.amount_cost - OLD.amount_cost;
          ELSIF (TG_OP = 'INSERT') THEN
              delta_time_key = NEW.time_key;
              delta_amount_sold = NEW.amount_sold;
              delta_units_sold = NEW.units_sold;
              delta_amount_cost = NEW.amount_cost;
          END IF;
          <<insert_update>>
          LOOP
              UPDATE sales_summary_bytime
                  SET amount_sold = amount_sold + delta_amount_sold,
                      units_sold = units_sold + delta_units_sold,
                      amount_cost = amount_cost + delta_amount_cost
                  WHERE time_key = delta_time_key;
              EXIT insert_update WHEN found;
              BEGIN
                  INSERT INTO sales_summary_bytime (
                              time_key,
                              amount_sold,
                              units_sold,
                              amount_cost)
                      VALUES (
                              delta_time_key,
                              delta_amount_sold,
                              delta_units_sold,
                              delta_amount_cost
                             );
                  EXIT insert_update;
              EXCEPTION
                  WHEN UNIQUE_VIOLATION THEN
                      -- do nothing
              END;
          END LOOP insert_update;
          RETURN NULL;
      END;
  $maint_sales_summary_bytime$ LANGUAGE plpgsql;
  CREATE TRIGGER maint_sales_summary_bytime
  AFTER INSERT OR UPDATE OR DELETE ON sales_fact
      FOR EACH ROW EXECUTE FUNCTION maint_sales_summary_bytime();
steps:
  - sql: |
      INSERT INTO sales_fact VALUES (1, 1, 1, 10, 3, 15);
      INSERT INTO sales_fact VALUES (1, 2, 1, 20, 5, 35);
      INSERT INTO sales_fact VALUES (2, 2, 1, 40, 15, 135);
      INSERT INTO sales_fact VALUES (2, 3, 1, 10, 1, 13)
    expect: ok
    comment: the first row for each time_key inserts the summary row, later rows update it
  - sql: |
      SELECT time_key, amount_sold, units_sold, amount_cost FROM sales_summary_bytime ORDER BY time_key
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM sales_fact WHERE product_key = 1
    expect: ok
  - sql: |
      SELECT time_key, amount_sold, units_sold, amount_cost FROM sales_summary_bytime ORDER BY time_key
    expect: rows
    order: ordered
  - sql: |
      UPDATE sales_fact SET units_sold = units_sold * 2
    expect: ok
  - sql: |
      SELECT time_key, amount_sold, units_sold, amount_cost FROM sales_summary_bytime ORDER BY time_key
    expect: rows
    order: ordered
  - sql: |
      UPDATE sales_fact SET time_key = 2 WHERE time_key = 1
    expect: error
    sqlstate: "P0001"
    comment: the RAISE in the UPDATE branch forbids changing time_key
