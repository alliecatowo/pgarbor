# In a DELETE, the new side of RETURNING is NULL; OLD.<col> exposes the deleted row's values (dml-returning).
id: doc-dml-delete.returning-old-and-new-values
title: DELETE RETURNING old.* yields the deleted values and new.* is NULL
family: doc-dml-delete
tier: core
feature_ids: [delete, returning, old-new-alias]
required_capabilities: [create-table, insert, delete, returning, old-new-alias]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (explicit old and new content; typically new values NULL for DELETE)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, name text, price int4);
  INSERT INTO products VALUES (1, 'widget', 10), (2, 'gadget', 25);
steps:
  - sql: |
      DELETE FROM products WHERE id = 1 RETURNING id, old.price AS old_price, new.price AS new_price, old.name AS old_name
    expect: rows
    comment: new_price is NULL
  - sql: |
      SELECT id FROM products ORDER BY id
    expect: rows
    order: ordered
