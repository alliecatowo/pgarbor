# Deleting a referenced parent row with ON DELETE CASCADE also deletes the dependent child rows.
id: doc-dml-delete.cascade-deletes-child-rows
title: DELETE on a parent with ON DELETE CASCADE removes referencing child rows
family: doc-dml-delete
tier: core
feature_ids: [delete, foreign-keys, cascade]
required_capabilities: [create-table, insert, select, delete, foreign-key, cascade]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-constraints-fk (ON DELETE CASCADE)"
sessions: [a]
setup: |
  CREATE TABLE parent (id int4 PRIMARY KEY);
  CREATE TABLE child (id int4 PRIMARY KEY, pid int4 REFERENCES parent(id) ON DELETE CASCADE);
  INSERT INTO parent VALUES (1), (2);
  INSERT INTO child VALUES (10, 1), (11, 1), (12, 2);
steps:
  - sql: |
      DELETE FROM parent WHERE id = 1
    expect: ok
  - sql: |
      SELECT id, pid FROM child ORDER BY id
    expect: rows
    order: ordered
    comment: children 10 and 11 are gone, child 12 remains
