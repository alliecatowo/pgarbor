# A WHERE clause naming a column that does not exist fails with undefined_column and deletes nothing.
id: doc-dml-delete.error-undefined-column
title: DELETE with an unknown column in WHERE raises 42703
family: doc-dml-delete
tier: core
feature_ids: [delete, errors]
required_capabilities: [create-table, insert, select, delete, errors]
provenance:
  source: hand
  ref: "errcodes 42703 undefined_column"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, price int4);
  INSERT INTO products VALUES (1, 10);
steps:
  - sql: |
      DELETE FROM products WHERE nosuch = 1
    expect: error
    sqlstate: "42703"
  - sql: |
      SELECT count(*) AS n FROM products
    expect: rows
