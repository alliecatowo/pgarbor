# DELETE ... RETURNING * returns the content of each deleted row, in table column order (dml-returning example).
id: doc-dml-delete.returning-star-deleted-rows
title: DELETE RETURNING * returns the deleted rows
family: doc-dml-delete
tier: core
feature_ids: [delete, returning]
required_capabilities: [create-table, insert, delete, returning]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (In a DELETE ... RETURNING *)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4, name text, price int4, obsoletion_date text);
  INSERT INTO products VALUES (1, 'widget', 10, 'today'), (2, 'gadget', 25, 'later'), (3, 'gizmo', 7, 'today');
steps:
  - sql: |
      DELETE FROM products WHERE obsoletion_date = 'today' RETURNING *
    expect: rows
    order: ordered
    comment: rows 1 and 3, columns id, name, price, obsoletion_date
  - sql: |
      SELECT id FROM products ORDER BY id
    expect: rows
    order: ordered
