# Deleting a row by its primary key frees the key so the same value can be inserted again.
id: doc-dml-delete.primary-key-delete-then-reinsert
title: Delete by primary key, then reinsert the same key
family: doc-dml-delete
tier: core
feature_ids: [delete, primary-key, insert]
required_capabilities: [create-table, insert, select, delete, constraints]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-delete (specify the exact row by primary key)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, name text);
  INSERT INTO products VALUES (1, 'widget'), (2, 'gadget');
steps:
  - sql: |
      DELETE FROM products WHERE id = 1
    expect: ok
  - sql: |
      INSERT INTO products VALUES (1, 'replacement')
    expect: ok
  - sql: |
      INSERT INTO products VALUES (2, 'duplicate')
    expect: error
    sqlstate: "23505"
    comment: key 2 still exists, so the unique index rejects it
  - sql: |
      SELECT id, name FROM products ORDER BY id
    expect: rows
    order: ordered
