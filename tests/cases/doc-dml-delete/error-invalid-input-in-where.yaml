# A WHERE comparison whose literal cannot be converted to the column type fails with invalid_text_representation.
id: doc-dml-delete.error-invalid-input-in-where
title: DELETE comparing an int column to a non-numeric literal raises 22P02
family: doc-dml-delete
tier: core
feature_ids: [delete, errors, type-coercion]
required_capabilities: [create-table, insert, select, delete, errors]
provenance:
  source: hand
  ref: "errcodes 22P02 invalid_text_representation"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, price int4);
  INSERT INTO products VALUES (1, 10);
steps:
  - sql: |
      DELETE FROM products WHERE price = 'abc'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) AS n FROM products
    expect: rows
