# A DELETE whose WHERE matches nothing succeeds with a row count of zero and changes nothing.
id: doc-dml-delete.no-matching-rows-is-not-an-error
title: DELETE that matches no rows succeeds with DELETE 0
family: doc-dml-delete
tier: core
feature_ids: [delete, where-clause]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: hand
  ref: "PG18 sql-delete.html (Outputs: DELETE count; zero rows is not an error)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, price int4);
  INSERT INTO products VALUES (1, 10), (2, 20);
steps:
  - sql: |
      DELETE FROM products WHERE price = 999
    expect: ok
    comment: command tag DELETE 0, no error
  - sql: |
      SELECT id, price FROM products ORDER BY id
    expect: rows
    order: ordered
