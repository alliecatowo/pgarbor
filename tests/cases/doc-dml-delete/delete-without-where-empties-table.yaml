# DELETE FROM products with no WHERE clause deletes every row in the table (the documented "caveat programmer" case).
id: doc-dml-delete.delete-without-where-empties-table
title: DELETE without WHERE removes all rows but keeps the table
family: doc-dml-delete
tier: core
feature_ids: [delete, truncate-vs-delete]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-delete (DELETE FROM products without WHERE)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, name text, price int4);
  INSERT INTO products VALUES (1, 'widget', 10), (2, 'gadget', 25), (3, 'gizmo', NULL);
steps:
  - sql: |
      DELETE FROM products
    expect: ok
    comment: command tag DELETE 3
  - sql: |
      SELECT count(*) AS n FROM products
    expect: rows
  - sql: |
      INSERT INTO products VALUES (1, 'again', 1)
    expect: ok
    comment: the table still exists and its primary key is free again
  - sql: |
      SELECT id, name, price FROM products ORDER BY id
    expect: rows
    order: ordered
