# A DELETE condition may use a subquery; rows are chosen from the snapshot taken before the statement starts.
id: doc-dml-delete.where-subquery-deletes-matching-set
title: DELETE with a WHERE IN subquery removes the rows the subquery selects
family: doc-dml-delete
tier: core
feature_ids: [delete, where-clause, subqueries]
required_capabilities: [create-table, insert, select, delete, subqueries]
provenance:
  source: hand
  ref: "PG18 sql-delete.html (condition may be any boolean expression, including subqueries)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, name text);
  CREATE TABLE discontinued (product_id int4);
  INSERT INTO products VALUES (1, 'widget'), (2, 'gadget'), (3, 'gizmo');
  INSERT INTO discontinued VALUES (2), (3), (99);
steps:
  - sql: |
      DELETE FROM products WHERE id IN (SELECT product_id FROM discontinued)
    expect: ok
    comment: deletes products 2 and 3
  - sql: |
      SELECT id, name FROM products ORDER BY id
    expect: rows
    order: ordered
