# DELETE inside a transaction is undone by ROLLBACK, and the deleted rows reappear unchanged.
id: doc-dml-delete.rollback-restores-deleted-rows
title: ROLLBACK after DELETE restores the removed rows
family: doc-dml-delete
tier: core
feature_ids: [delete, transactions, rollback]
required_capabilities: [create-table, insert, select, delete, transactions]
provenance:
  source: hand
  ref: "PG18 sql-rollback.html; dml-delete"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, name text, price int4);
  INSERT INTO products VALUES (1, 'widget', 10), (2, 'gadget', 25);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DELETE FROM products
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM products
    expect: rows
    comment: zero rows visible inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT id, name, price FROM products ORDER BY id
    expect: rows
    order: ordered
