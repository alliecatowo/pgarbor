# WHERE price = NULL is never true, so it deletes nothing; only WHERE price IS NULL matches NULL values.
id: doc-dml-delete.null-comparison-deletes-nothing
title: Equality with NULL matches no rows; IS NULL matches NULL rows
family: doc-dml-delete
tier: core
feature_ids: [delete, where-clause, null-semantics]
required_capabilities: [create-table, insert, select, delete, null-semantics]
provenance:
  source: hand
  ref: "PG18 functions-comparison.html (NULL comparisons yield null); dml-delete WHERE semantics"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, price int4);
  INSERT INTO products VALUES (1, 10), (2, NULL), (3, NULL), (4, 0);
steps:
  - sql: |
      DELETE FROM products WHERE price = NULL
    expect: ok
    comment: deletes zero rows because the predicate is null for every row
  - sql: |
      SELECT count(*) AS n FROM products
    expect: rows
  - sql: |
      DELETE FROM products WHERE price IS NULL
    expect: ok
    comment: deletes rows 2 and 3
  - sql: |
      SELECT id, price FROM products ORDER BY id
    expect: rows
    order: ordered
