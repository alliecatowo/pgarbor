# Without a referential action, deleting a parent row that is still referenced fails with foreign_key_violation and removes nothing.
id: doc-dml-delete.restrict-blocks-referenced-delete
title: DELETE of a referenced parent row fails with 23503 and leaves the row
family: doc-dml-delete
tier: core
feature_ids: [delete, foreign-keys, errors]
required_capabilities: [create-table, insert, select, delete, foreign-key, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-constraints-fk (default NO ACTION); errcodes 23503"
sessions: [a]
setup: |
  CREATE TABLE parent (id int4 PRIMARY KEY);
  CREATE TABLE child (pid int4 REFERENCES parent(id));
  INSERT INTO parent VALUES (1);
  INSERT INTO child VALUES (1);
steps:
  - sql: |
      DELETE FROM parent WHERE id = 1
    expect: error
    sqlstate: "23503"
  - sql: |
      SELECT count(*) AS n FROM parent
    expect: rows
  - sql: |
      SELECT count(*) AS n FROM child
    expect: rows
