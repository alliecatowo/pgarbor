# DELETE with a WHERE condition removes only the rows that match (dml-delete: DELETE FROM products WHERE price = 10).
id: doc-dml-delete.where-equals-deletes-matching-rows
title: DELETE FROM products WHERE price = 10 removes only the matching rows
family: doc-dml-delete
tier: core
feature_ids: [delete, where-clause]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-delete (Deleting Data)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, name text, price int4);
  INSERT INTO products VALUES (1, 'widget', 10), (2, 'gadget', 25), (3, 'gizmo', 10), (4, 'doohickey', 5);
steps:
  - sql: |
      DELETE FROM products WHERE price = 10
    expect: ok
    comment: removes two rows; command tag is DELETE 2
  - sql: |
      SELECT id, name, price FROM products ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM products WHERE price = 10
    expect: rows
