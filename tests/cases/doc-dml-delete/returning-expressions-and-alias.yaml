# RETURNING accepts the same output list as SELECT: column names, value expressions and aliases.
id: doc-dml-delete.returning-expressions-and-alias
title: DELETE RETURNING with computed expressions and aliases
family: doc-dml-delete
tier: core
feature_ids: [delete, returning, expressions]
required_capabilities: [create-table, insert, delete, returning, expressions]
provenance:
  source: pg-docs
  ref: "dml.sgml#dml-returning (allowed contents are the same as a SELECT output list)"
sessions: [a]
setup: |
  CREATE TABLE products (id int4 PRIMARY KEY, name text, price int4);
  INSERT INTO products VALUES (1, 'widget', 10), (2, 'gadget', 25), (3, 'gizmo', 40);
steps:
  - sql: |
      DELETE FROM products WHERE price <= 25 RETURNING name, price * 2 AS doubled, upper(name) AS shout
    expect: rows
    order: multiset
  - sql: |
      SELECT name FROM products ORDER BY name
    expect: rows
    order: ordered
