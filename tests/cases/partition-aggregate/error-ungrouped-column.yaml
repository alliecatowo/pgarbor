# A non-aggregated, non-grouped column in the target list is rejected with grouping_error.
id: partition-aggregate.error-ungrouped-column
title: Ungrouped column in target list is rejected with SQLSTATE 42803
family: partition-aggregate
tier: core
feature_ids: [partitioning, group-by, aggregates, errors]
required_capabilities: [create-table, insert, select, partitioning, aggregates, group-by]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/partition_aggregate.sql
  license: PostgreSQL License
setup: |
  CREATE TABLE pagg_ug (a int, c text) PARTITION BY LIST (c);
  CREATE TABLE pagg_ug_p1 PARTITION OF pagg_ug FOR VALUES IN ('0000');
  INSERT INTO pagg_ug VALUES (1, '0000'), (2, '0000');
steps:
  - sql: |
      SELECT c, a FROM pagg_ug GROUP BY c
    expect: error
    sqlstate: "42803"
  - sql: |
      SELECT c, max(a) FROM pagg_ug GROUP BY c
    expect: rows
    order: ordered
