# DELETE FROM ONLY removes matching rows from the named table only; rows in inheriting children are untouched.
id: cmd-delete.only-excludes-children
title: DELETE FROM ONLY leaves inheriting child rows in place
family: cmd-delete
tier: core
feature_ids: [delete, only, inheritance, create-table, insert, select]
required_capabilities: [create-table, insert, select, delete, inheritance]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#parameters (table_name: ONLY)"
sessions: [a]
setup: |
  CREATE TABLE parent (id int4, v text);
  CREATE TABLE child (extra int4) INHERITS (parent);
  INSERT INTO parent VALUES (1, 'p1');
  INSERT INTO child VALUES (1, 'c1', 100), (2, 'c2', 200);
steps:
  - sql: |
      DELETE FROM ONLY parent WHERE id = 1
    expect: ok
    comment: only the parent-level row with id 1 is deleted; child (1, c1) survives
  - sql: |
      SELECT tableoid::regclass::text AS src, id, v FROM parent ORDER BY src, id
    expect: rows
    order: ordered
