# DELETE against a relation that does not exist fails with undefined_table, and a failed DELETE leaves other tables alone.
id: cmd-delete.undefined-table-error
title: DELETE from a missing table raises undefined_table
family: cmd-delete
tier: core
feature_ids: [delete, errors, create-table, insert, select]
required_capabilities: [create-table, insert, select, delete, errors]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#synopsis (table_name is required)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY);
  INSERT INTO films VALUES (1), (2);
steps:
  - sql: |
      DELETE FROM no_such_table WHERE id = 1
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT id FROM films ORDER BY id
    expect: rows
    order: ordered
