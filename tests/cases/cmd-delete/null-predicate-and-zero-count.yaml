# A WHERE condition that evaluates to NULL is not true, so NULL-valued rows survive; a condition that matches nothing is not an error.
id: cmd-delete.null-predicate-and-zero-count
title: NULL predicate results keep rows; zero matches succeed
family: cmd-delete
tier: core
feature_ids: [delete, where, null-semantics, select, create-table, insert]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#description; ref/delete.sgml#outputs (count may be 0)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, kind text);
  INSERT INTO films VALUES (1, 'Musical'), (2, NULL), (3, 'Drama');
steps:
  - sql: |
      DELETE FROM films WHERE kind = 'Western'
    expect: ok
    comment: no rows match; command tag DELETE 0, not an error
  - sql: |
      DELETE FROM films WHERE kind <> 'Musical'
    expect: ok
    comment: NULL <> 'Musical' is NULL, so row 2 is kept; only Drama is deleted
  - sql: |
      SELECT id, kind FROM films ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM films WHERE NOT (kind IS NULL)
    expect: ok
  - sql: |
      SELECT id, kind FROM films ORDER BY id
    expect: rows
    order: ordered
