# RETURNING WITH (OLD AS o, NEW AS n) renames the old/new row aliases; for a plain DELETE every NEW value is NULL.
id: cmd-delete.returning-old-new-alias
title: RETURNING WITH OLD/NEW aliases; NEW values are NULL for a plain delete
family: cmd-delete
tier: extended
feature_ids: [delete, returning, returning-old-new, null-semantics, create-table, insert]
required_capabilities: [create-table, insert, select, delete, returning]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#parameters (output_alias); ref/delete.sgml#parameters (output_expression)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, kind text, title text);
  INSERT INTO films VALUES (1, 'Drama', 'Heat'), (2, 'Comedy', 'Airplane');
steps:
  - sql: |
      DELETE FROM films WHERE id = 1 RETURNING WITH (OLD AS o, NEW AS n) o.id, o.title, n.id AS new_id, n.title AS new_title
    expect: rows
    order: ordered
    comment: old columns carry values; every NEW column is NULL for a simple DELETE
  - sql: |
      DELETE FROM films WHERE id = 2 RETURNING WITH (OLD AS o, NEW AS n) n.*, o.kind AS old_kind
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM films
    expect: rows
