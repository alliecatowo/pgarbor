# DELETE ... USING joins another table; the deleted rows are those that join successfully.
id: cmd-delete.using-join
title: DELETE USING joins producers to choose which films to delete
family: cmd-delete
tier: core
feature_ids: [delete, using, join, returning, select, create-table, insert]
required_capabilities: [create-table, insert, select, delete, joins, returning]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#notes (USING example: DELETE FROM films USING producers ...)"
sessions: [a]
setup: |
  CREATE TABLE producers (id int4 PRIMARY KEY, name text);
  CREATE TABLE films (id int4 PRIMARY KEY, producer_id int4, title text);
  INSERT INTO producers VALUES (1, 'foo'), (2, 'bar');
  INSERT INTO films VALUES (10, 1, 'A'), (11, 2, 'B'), (12, 1, 'C'), (13, NULL, 'D'), (14, 3, 'E');
steps:
  - sql: |
      DELETE FROM films USING producers WHERE producer_id = producers.id AND producers.name = 'foo' RETURNING films.title, producers.name
    expect: rows
    order: multiset
    comment: documented USING example; films with NULL or unmatched producer_id are not joined and survive
  - sql: |
      SELECT id, title FROM films ORDER BY id
    expect: rows
    order: ordered
