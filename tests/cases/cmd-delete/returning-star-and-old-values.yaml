# RETURNING yields the deleted rows; unqualified and table-qualified column names return the old values.
id: cmd-delete.returning-star-and-old-values
title: DELETE RETURNING * and RETURNING of unqualified columns return deleted rows
family: cmd-delete
tier: core
feature_ids: [delete, returning, select, create-table, insert]
required_capabilities: [create-table, insert, select, delete, returning]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#examples (Delete completed tasks, returning full details); ref/delete.sgml#outputs"
sessions: [a]
setup: |
  CREATE TABLE tasks (id int4 PRIMARY KEY, status text, title text);
  INSERT INTO tasks VALUES (1, 'DONE', 'write docs'), (2, 'OPEN', 'review'), (3, 'DONE', 'ship');
steps:
  - sql: |
      DELETE FROM tasks WHERE status = 'DONE' RETURNING *
    expect: rows
    order: multiset
    comment: documented example; RETURNING order is not specified, so compare as a multiset
  - sql: |
      DELETE FROM tasks AS t WHERE t.id = 2 RETURNING t.id, status AS was, title
    expect: rows
    order: ordered
    comment: a single row; unqualified and alias-qualified names both return the old values
  - sql: |
      SELECT id, status FROM tasks ORDER BY id
    expect: rows
    order: ordered
