# Without WHERE every row is deleted; the table stays valid and empty, and a second DELETE affects zero rows without error.
id: cmd-delete.no-where-clears-table
title: DELETE without WHERE empties the table and keeps it usable
family: cmd-delete
tier: core
feature_ids: [delete, select, insert, create-table]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#description; ref/delete.sgml#examples (Clear the table films)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, kind text);
  INSERT INTO films VALUES (1, 'Musical'), (2, 'Drama'), (3, NULL);
steps:
  - sql: |
      DELETE FROM films
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM films
    expect: rows
  - sql: |
      INSERT INTO films VALUES (9, 'Western') RETURNING id
    expect: rows
  - sql: |
      SELECT id, kind FROM films ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM films
    expect: ok
    comment: rows deleted; table reusable
  - sql: |
      DELETE FROM films
    expect: ok
    comment: second delete on an empty table is not an error; command tag DELETE 0
