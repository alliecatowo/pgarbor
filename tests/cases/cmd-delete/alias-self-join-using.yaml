# The target table may appear in USING only with an alias, which makes a self-join; the alias hides the bare table name.
id: cmd-delete.alias-self-join-using
title: DELETE self-join through USING with aliases
family: cmd-delete
tier: core
feature_ids: [delete, using, self-join, table-alias, create-table, insert, select]
required_capabilities: [create-table, insert, select, delete, joins, table-alias]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#parameters (from_item: self-join must use an alias)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, producer_id int4);
  INSERT INTO films VALUES (1, 7), (2, 7), (3, 8), (4, 7), (5, 9);
steps:
  - sql: |
      DELETE FROM films AS f USING films AS g WHERE f.producer_id = g.producer_id AND g.id = 1 AND f.id > g.id
    expect: ok
    comment: deletes films 2 and 4 (same producer as film 1 and a higher id)
  - sql: |
      SELECT id, producer_id FROM films ORDER BY id
    expect: rows
    order: ordered
