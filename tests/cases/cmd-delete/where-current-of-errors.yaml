# WHERE CURRENT OF is exclusive with a Boolean condition, needs an existing and positioned cursor, and the cursor must be a plain scan of the target table.
id: cmd-delete.where-current-of-errors
title: WHERE CURRENT OF error conditions
family: cmd-delete
tier: core
feature_ids: [delete, cursors, where-current-of, errors, create-table, insert]
required_capabilities: [create-table, insert, delete, cursors, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/delete.sgml#parameters (cursor_name: cannot combine with a Boolean condition; must be non-grouping)"
sessions: [a]
setup: |
  CREATE TABLE tasks (id int4 PRIMARY KEY, status text);
  INSERT INTO tasks VALUES (1, 'OPEN'), (2, 'DONE');
steps:
  - sql: |
      DELETE FROM tasks WHERE status = 'DONE' WHERE CURRENT OF nope
    expect: error
    sqlstate: "42601"
    comment: WHERE CURRENT OF cannot be combined with a Boolean condition
  - sql: |
      DELETE FROM tasks WHERE CURRENT OF nope
    expect: error
    sqlstate: "34000"
    comment: no cursor named nope
  - sql: |
      BEGIN;
      DECLARE c_tasks CURSOR FOR SELECT id, status FROM tasks ORDER BY id
    expect: ok
  - sql: |
      DELETE FROM tasks WHERE CURRENT OF c_tasks
    expect: error
    sqlstate: "24000"
    comment: cursor exists but has not been fetched from; not positioned on a row
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN;
      DECLARE c_count CURSOR FOR SELECT count(*) FROM tasks;
      FETCH 1 FROM c_count
    expect: any
  - sql: |
      DELETE FROM tasks WHERE CURRENT OF c_count
    expect: error
    sqlstate: "24000"
    comment: a grouping query is not a simply updatable scan of the target table
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT id, status FROM tasks ORDER BY id
    expect: rows
    order: ordered
    comment: all failed statements removed nothing
