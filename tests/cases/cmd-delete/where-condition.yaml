# DELETE with a WHERE clause removes only the rows whose condition is true.
id: cmd-delete.where-condition
title: DELETE with WHERE removes only matching films
family: cmd-delete
tier: core
feature_ids: [delete, where, select, create-table, insert]
required_capabilities: [create-table, insert, select, delete]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/sql-delete.html#Examples; ref/delete.sgml#examples"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, kind text, title text);
  INSERT INTO films VALUES (1, 'Musical', 'Hair'), (2, 'Drama', 'Heat'), (3, 'Comedy', 'Airplane'), (4, 'Drama', 'Alien');
steps:
  - sql: |
      DELETE FROM films WHERE kind <> 'Musical'
    expect: ok
    comment: documented example 'Delete all films but musicals'; matches 3 rows
  - sql: |
      SELECT id, kind, title FROM films ORDER BY id
    expect: rows
    order: ordered
