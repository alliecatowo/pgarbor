# At most one operator class can be the DEFAULT for a data type and index method; the same type with another index method may have its own default.
id: cmd-create-opclass.default-one-per-type-and-method
title: "DEFAULT is unique per data type and index method, and a second default fails with 42710"
family: cmd-create-opclass
tier: core
feature_ids: [create-operator-class, default-operator-class, btree, hash, catalog-introspection, errors]
required_capabilities: [create-operator-class, create-type, create-function, create-operator, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_opclass.sgml#sql-createopclass (Parameters: DEFAULT)"
sessions: [a]
setup: |
  CREATE TYPE cr_pt AS (a int4);
  CREATE FUNCTION cr_pt_lt(cr_pt, cr_pt) RETURNS bool LANGUAGE sql IMMUTABLE AS 'SELECT ($1).a < ($2).a';
  CREATE FUNCTION cr_pt_eq(cr_pt, cr_pt) RETURNS bool LANGUAGE sql IMMUTABLE AS 'SELECT ($1).a = ($2).a';
  CREATE FUNCTION cr_pt_gt(cr_pt, cr_pt) RETURNS bool LANGUAGE sql IMMUTABLE AS 'SELECT ($1).a > ($2).a';
  CREATE FUNCTION cr_pt_cmp(cr_pt, cr_pt) RETURNS int4 LANGUAGE sql IMMUTABLE AS 'SELECT CASE WHEN ($1).a < ($2).a THEN -1 WHEN ($1).a > ($2).a THEN 1 ELSE 0 END';
  CREATE OPERATOR < (leftarg = cr_pt, rightarg = cr_pt, procedure = cr_pt_lt);
  CREATE OPERATOR = (leftarg = cr_pt, rightarg = cr_pt, procedure = cr_pt_eq);
  CREATE OPERATOR > (leftarg = cr_pt, rightarg = cr_pt, procedure = cr_pt_gt);
steps:
  - sql: |
      CREATE OPERATOR CLASS cr_def_a DEFAULT FOR TYPE cr_pt USING btree AS OPERATOR 1 <, OPERATOR 3 =, OPERATOR 5 >, FUNCTION 1 cr_pt_cmp(cr_pt, cr_pt)
    expect: ok
  - sql: |
      CREATE OPERATOR CLASS cr_def_b DEFAULT FOR TYPE cr_pt USING btree AS OPERATOR 1 <, FUNCTION 1 cr_pt_cmp(cr_pt, cr_pt)
    expect: error
    sqlstate: "42710"
    comment: cr_def_a already is the btree default for cr_pt
  - sql: |
      CREATE OPERATOR CLASS cr_def_c DEFAULT FOR TYPE cr_pt USING hash AS OPERATOR 1 =
    expect: ok
    comment: a different index method may have its own default for the same type
  - sql: |
      CREATE OPERATOR CLASS cr_def_d FOR TYPE cr_pt USING btree AS OPERATOR 1 <, OPERATOR 3 =, OPERATOR 5 >, FUNCTION 1 cr_pt_cmp(cr_pt, cr_pt)
    expect: ok
    comment: a non-default class for the same type and method is fine
  - sql: |
      SELECT o.opcname, o.opcdefault, am.amname FROM pg_opclass o JOIN pg_am am ON am.oid = o.opcmethod WHERE o.opcname LIKE 'cr_def_%' ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT o.opcname FROM pg_opclass o WHERE o.opcdefault AND o.opcintype = 'cr_pt'::regtype ORDER BY 1
    expect: rows
    order: ordered
    comment: one btree default and one hash default; the failed cr_def_b was not created
