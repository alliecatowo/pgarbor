# Documented example: gist__int_ops for _int4 (the intarray module). Quarantined because it needs the intarray contrib extension and its C support functions (g_int_*), which PGArbor does not load.
id: cmd-create-opclass.gist-intarray-example
title: "Documented GiST example for _int4 (intarray) with its contrib support functions"
family: cmd-create-opclass
tier: extended
feature_ids: [create-operator-class, gist, arrays, contrib-intarray, example]
required_capabilities: [create-operator-class, gist, contrib-extension, arrays]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_opclass.sgml#sql-createopclass (Examples)"
sessions: [a]
quarantine:
  reason: "Needs the intarray contrib extension: its support functions g_int_consistent/g_int_union/etc. are C functions in the module, and PGArbor has no extension loading"
  since: "2026-10-15"
steps:
  - sql: |
      CREATE OPERATOR CLASS gist__int_ops
          DEFAULT FOR TYPE _int4 USING gist AS
              OPERATOR        3       &&,
              OPERATOR        6       = (anyarray, anyarray),
              OPERATOR        7       @>,
              OPERATOR        8       <@,
              OPERATOR        20      @@ (_int4, query_int),
              FUNCTION        1       g_int_consistent (internal, _int4, smallint, oid, internal),
              FUNCTION        2       g_int_union (internal, internal),
              FUNCTION        3       g_int_compress (internal),
              FUNCTION        4       g_int_decompress (internal),
              FUNCTION        5       g_int_penalty (internal, internal, internal),
              FUNCTION        6       g_int_picksplit (internal, internal),
              FUNCTION        7       g_int_same (_int4, _int4, internal)
    expect: ok
