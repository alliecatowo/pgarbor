# A child row can be cast to its parent's rowtype; a NULL of the child type casts to a NULL of the parent type.
id: inherit.rowtype-cast-to-parent
title: Whole-row cast from child to parent rowtype keeps parent columns; NULL casts to NULL
family: inherit
tier: extended
feature_ids: [inheritance, composite-types, casts, select, null-semantics]
required_capabilities: [create-table, insert, select, inheritance, composite-types]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/inherit.sql
  license: PostgreSQL License
sessions: [a]
setup: |
  CREATE TABLE base (i INTEGER);
  CREATE TABLE derived () INHERITS (base);
  INSERT INTO derived (i) VALUES (0);
steps:
  - sql: |
      SELECT derived::base AS row_as_parent FROM derived
    expect: rows
    order: multiset
  - sql: |
      SELECT NULL::derived::base IS NULL AS is_null
    expect: rows
    order: ordered
