# UPDATE with an inherited target table and a subquery over another inherited table; children are updated too.
id: inherit.update-with-inherited-source
title: UPDATE with inherited target and inherited subquery source updates child rows
family: inherit
tier: extended
feature_ids: [inheritance, update, subqueries, select]
required_capabilities: [create-table, insert, update, select, inheritance, subqueries]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/inherit.sql
  license: PostgreSQL License
sessions: [a]
setup: |
  CREATE TABLE foo (f1 INT, f2 INT);
  CREATE TABLE foo2 (f3 INT) INHERITS (foo);
  CREATE TABLE bar (f1 INT, f2 INT);
  CREATE TABLE bar2 (f3 INT) INHERITS (bar);
  INSERT INTO foo VALUES (1, 1), (3, 3);
  INSERT INTO foo2 VALUES (2, 2, 2), (3, 3, 3);
  INSERT INTO bar VALUES (1, 1), (2, 2), (3, 3), (4, 4);
  INSERT INTO bar2 VALUES (1, 1, 1), (2, 2, 2), (3, 3, 3), (4, 4, 4);
steps:
  - sql: |
      UPDATE bar SET f2 = f2 + 100 WHERE f1 IN (SELECT f1 FROM foo)
    expect: ok
  - sql: |
      SELECT tableoid::regclass::text AS relname, f1, f2 FROM bar ORDER BY 1, 2, 3
    expect: rows
    order: ordered
  - sql: |
      UPDATE bar SET f2 = f2 + 100
      FROM (SELECT f1 FROM foo UNION ALL SELECT f1 + 3 FROM foo) ss
      WHERE bar.f1 = ss.f1
    expect: ok
  - sql: |
      SELECT tableoid::regclass::text AS relname, f1, f2 FROM bar ORDER BY 1, 2, 3
    expect: rows
    order: ordered
