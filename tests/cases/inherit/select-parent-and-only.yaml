# Inheritance: a plain SELECT on the parent includes child rows; SELECT ... FROM ONLY excludes them.
id: inherit.select-parent-and-only
title: SELECT from parent includes child rows, FROM ONLY excludes them, tableoid identifies source
family: inherit
tier: core
feature_ids: [inheritance, select, create-table, insert]
required_capabilities: [create-table, insert, select, inheritance]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/inherit.sql
  license: PostgreSQL License
sessions: [a]
setup: |
  CREATE TABLE a (aa TEXT);
  CREATE TABLE b (bb TEXT) INHERITS (a);
  INSERT INTO a(aa) VALUES ('aaa'), ('aaaa');
  INSERT INTO b(aa, bb) VALUES ('bbb', 'x'), ('bbbb', 'y');
steps:
  - sql: |
      SELECT tableoid::regclass::text AS relname, aa FROM a ORDER BY aa
    expect: rows
    order: ordered
  - sql: |
      SELECT tableoid::regclass::text AS relname, aa FROM ONLY a ORDER BY aa
    expect: rows
    order: ordered
  - sql: |
      SELECT tableoid::regclass::text AS relname, aa, bb FROM b ORDER BY aa
    expect: rows
    order: ordered
