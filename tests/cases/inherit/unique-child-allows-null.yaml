# A UNIQUE constraint on an inheriting child does not add NOT NULL; NULLs in the key are allowed and distinct.
id: inherit.unique-child-allows-null
title: UNIQUE on an inheriting child accepts NULL key values, repeated NULLs are distinct
family: inherit
tier: extended
feature_ids: [inheritance, unique-constraints, insert, null-semantics]
required_capabilities: [create-table, insert, select, inheritance, constraints]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/inherit.sql
  license: PostgreSQL License
sessions: [a]
setup: |
  CREATE TABLE a (aa TEXT);
  CREATE TABLE z2 (b TEXT, UNIQUE (aa, b)) INHERITS (a);
steps:
  - sql: |
      INSERT INTO z2 VALUES (NULL, 'text')
    expect: ok
  - sql: |
      INSERT INTO z2 VALUES (NULL, 'text')
    expect: ok
    comment: NULL is not equal to NULL, so the UNIQUE index does not reject it
  - sql: |
      SELECT aa IS NULL AS aa_null, b FROM z2 ORDER BY b
    expect: rows
    order: multiset
