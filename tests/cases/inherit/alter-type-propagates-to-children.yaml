# ALTER COLUMN TYPE on a parent recurses into children and applies the USING expression to child rows.
id: inherit.alter-type-propagates-to-children
title: ALTER COLUMN TYPE on the parent converts inherited child rows with USING
family: inherit
tier: core
feature_ids: [inheritance, alter-table, column-types, text]
required_capabilities: [create-table, insert, select, alter-table, inheritance]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/inherit.sql
  license: PostgreSQL License
sessions: [a]
setup: |
  CREATE TABLE a (aa TEXT);
  CREATE TABLE b (bb TEXT) INHERITS (a);
  INSERT INTO b (aa, bb) VALUES ('test', 'one'), ('', 'two');
steps:
  - sql: |
      ALTER TABLE a ALTER COLUMN aa TYPE INTEGER USING bit_length(aa)
    expect: ok
  - sql: |
      SELECT aa, bb FROM b ORDER BY bb
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(aa)::text AS t FROM b LIMIT 1
    expect: rows
    order: ordered
