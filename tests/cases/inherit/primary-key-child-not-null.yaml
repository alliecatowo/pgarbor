# A PRIMARY KEY declared on an inheriting child marks its inherited key columns NOT NULL in that child.
id: inherit.primary-key-child-not-null
title: PRIMARY KEY on an inheriting child rejects NULL in the key column
family: inherit
tier: extended
feature_ids: [inheritance, primary-key, constraints, insert, errors]
required_capabilities: [create-table, insert, select, inheritance, constraints]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/inherit.sql
  license: PostgreSQL License
sessions: [a]
setup: |
  CREATE TABLE a (aa TEXT);
  CREATE TABLE z (b TEXT, PRIMARY KEY (aa, b)) INHERITS (a);
steps:
  - sql: |
      INSERT INTO z VALUES (NULL, 'text')
    expect: error
    sqlstate: "23502"
    comment: aa is NOT NULL in z because the primary key covers it
  - sql: |
      INSERT INTO z VALUES ('k', 'text')
    expect: ok
  - sql: |
      SELECT aa, b FROM z ORDER BY aa
    expect: rows
    order: ordered
