# A NO INHERIT check constraint is enforced on the parent only; children do not receive it.
id: inherit.no-inherit-check-constraint
title: NO INHERIT CHECK constraint applies to the parent but is not inherited by children
family: inherit
tier: core
feature_ids: [inheritance, check-constraints, insert, errors]
required_capabilities: [create-table, insert, select, inheritance, constraints]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/inherit.sql
  license: PostgreSQL License
sessions: [a]
setup: |
  CREATE TABLE p1 (ff1 int);
  ALTER TABLE p1 ADD CONSTRAINT p1chk CHECK (ff1 > 0) NO INHERIT;
  CREATE TABLE c1 () INHERITS (p1);
steps:
  - sql: |
      INSERT INTO c1 VALUES (-5)
    expect: ok
    comment: the child does not inherit p1chk
  - sql: |
      INSERT INTO p1 VALUES (-5)
    expect: error
    sqlstate: "23514"
  - sql: |
      SELECT ff1 FROM p1 ORDER BY ff1
    expect: rows
    order: ordered
