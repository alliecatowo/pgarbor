# Documented example: ALTER AGGREGATE myavg(integer) RENAME TO my_average. The aggregate keeps its
# behavior under the new name; the old name no longer resolves (undefined_function).
id: cmd-alter-aggregate.rename-doc-example
title: "ALTER AGGREGATE ... RENAME TO renames the aggregate and the old name stops resolving"
family: cmd-alter-aggregate
tier: core
feature_ids: [alter-aggregate, rename, aggregates]
required_capabilities: [aggregates, create-aggregate, create-function, alter-aggregate, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_aggregate.sgml#examples (rename myavg(integer) to my_average)"
setup: |
  CREATE FUNCTION myavg_sf(int8, int4) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT COALESCE($1, 0) + $2 $$;
  CREATE AGGREGATE myavg(integer) (sfunc = myavg_sf, stype = int8, initcond = '0');
steps:
  - sql: |
      ALTER AGGREGATE myavg(integer) RENAME TO my_average
    expect: ok
  - sql: |
      SELECT my_average(x) FROM generate_series(1, 3) AS g(x)
    expect: rows
    comment: sum 1+2+3 through the renamed aggregate
  - sql: |
      ALTER AGGREGATE myavg(integer) RENAME TO my_average2
    expect: error
    sqlstate: "42883"
    comment: the old name no longer exists
  - sql: |
      SELECT proname, pg_get_function_identity_arguments(oid) AS args FROM pg_proc WHERE proname IN ('myavg', 'my_average') ORDER BY 1, 2
    expect: rows
    order: ordered
