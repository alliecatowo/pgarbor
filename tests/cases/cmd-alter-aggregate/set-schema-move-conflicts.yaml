# SET SCHEMA moves the aggregate; a same-schema move is a no-op, a missing schema is invalid_schema_name,
# and a destination already holding the same signature is duplicate_function.
id: cmd-alter-aggregate.set-schema-move-conflicts
title: "ALTER AGGREGATE SET SCHEMA: conflicts, missing schema, no-op, then a successful move"
family: cmd-alter-aggregate
tier: core
feature_ids: [alter-aggregate, set-schema, schemas, errors]
required_capabilities: [aggregates, create-aggregate, create-function, create-schema, alter-aggregate, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_aggregate.sgml#synopsis (SET SCHEMA)"
setup: |
  DROP SCHEMA IF EXISTS ss_a CASCADE;
  DROP SCHEMA IF EXISTS ss_b CASCADE;
  CREATE SCHEMA ss_a;
  CREATE SCHEMA ss_b;
  CREATE FUNCTION ss_a.sf(int8, int4) RETURNS int8 LANGUAGE sql IMMUTABLE AS $$ SELECT COALESCE($1, 0) + $2 $$;
  CREATE AGGREGATE ss_a.sagg(integer) (sfunc = ss_a.sf, stype = int8, initcond = '0');
  CREATE AGGREGATE ss_b.sagg(integer) (sfunc = ss_a.sf, stype = int8, initcond = '0');
steps:
  - sql: |
      ALTER AGGREGATE ss_a.sagg(integer) SET SCHEMA ss_b
    expect: error
    sqlstate: "42723"
    comment: ss_b already has sagg(integer)
  - sql: |
      ALTER AGGREGATE ss_a.sagg(integer) SET SCHEMA no_such_schema
    expect: error
    sqlstate: "3F000"
  - sql: |
      ALTER AGGREGATE ss_a.sagg(integer) SET SCHEMA ss_a
    expect: ok
    comment: moving into the current schema succeeds and changes nothing
  - sql: |
      ALTER AGGREGATE ss_b.sagg(integer) RENAME TO sagg_b
    expect: ok
    comment: frees the signature in ss_b
  - sql: |
      ALTER AGGREGATE ss_a.sagg(integer) SET SCHEMA ss_b
    expect: ok
  - sql: |
      SELECT n.nspname, p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname IN ('ss_a', 'ss_b') AND p.proname LIKE 's%agg%' ORDER BY 1, 2
    expect: rows
    order: ordered
  - sql: |
      SELECT ss_b.sagg(x) FROM generate_series(1, 3) AS g(x)
    expect: rows
    comment: the moved aggregate still computes sum 6
