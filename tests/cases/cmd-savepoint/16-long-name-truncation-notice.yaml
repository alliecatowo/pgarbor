# Savepoint names longer than NAMEDATALEN-1 are truncated with a NOTICE; ROLLBACK TO with the same over-long name also truncates.
id: cmd-savepoint.long-name-truncation-notice
title: Over-long savepoint name is truncated with a notice on both SAVEPOINT and ROLLBACK TO
family: cmd-savepoint
tier: extended
feature_ids: [savepoint, rollback-to-savepoint, identifier-length, notices, begin, commit]
required_capabilities: [transactions, savepoints]
provenance:
  source: hand
  ref: "PG18 docs sql-savepoint.html (savepoint_name); identifier truncation per ref/syntax.sgml identifiers"
sessions: [a]
steps:
  - sql: |
      BEGIN;
      SAVEPOINT a_very_long_savepoint_name_that_exceeds_the_sixty_three_byte_identifier_limit
    expect: notice
    comment: NOTICE that the identifier will be truncated to its 63-byte prefix
  - sql: |
      ROLLBACK TO a_very_long_savepoint_name_that_exceeds_the_sixty_three_byte_identifier_limit;
      COMMIT
    expect: notice
    comment: the same over-long identifier is truncated the same way on ROLLBACK TO
