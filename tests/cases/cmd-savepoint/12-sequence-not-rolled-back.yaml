# Sequence advancement is not transactional, so nextval inside a rolled-back savepoint is not undone.
# Each statement is its own step so that each expect: states the kind of its own result
# (the last result of a multi-statement step is COMMIT, which is kind=command).
id: cmd-savepoint.sequence-not-rolled-back
title: nextval consumed after a savepoint is not returned by ROLLBACK TO SAVEPOINT
family: cmd-savepoint
tier: core
feature_ids: [savepoint, rollback-to-savepoint, sequence, nextval, begin, commit, select]
required_capabilities: [sequence, select, transactions, savepoints]
provenance:
  source: hand
  ref: "PG18 docs sql-savepoint.html; sequences are non-transactional (ref/create_sequence.sgml Notes)"
sessions: [a]
setup: |
  CREATE SEQUENCE s;
steps:
  - sql: "BEGIN;"
    expect: ok
  - sql: "SAVEPOINT sp;"
    expect: ok
  - sql: "SELECT nextval('s') AS first;"
    expect: rows
    order: ordered
    comment: first=1 is consumed inside the savepoint
  - sql: "ROLLBACK TO SAVEPOINT sp;"
    expect: ok
  - sql: "SELECT nextval('s') AS second;"
    expect: rows
    order: ordered
    comment: second=2; the value 1 is not reused after ROLLBACK TO SAVEPOINT
  - sql: "COMMIT;"
    expect: ok
