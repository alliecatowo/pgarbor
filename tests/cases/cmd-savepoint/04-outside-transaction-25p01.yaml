# SAVEPOINT is only valid inside a transaction block; in autocommit it is rejected.
id: cmd-savepoint.outside-transaction-25p01
title: SAVEPOINT outside a transaction block fails with no_active_sql_transaction
family: cmd-savepoint
tier: core
feature_ids: [savepoint, errors, transactions]
required_capabilities: [create-table, select, transactions, savepoints, errors]
provenance:
  source: pg-docs
  ref: "ref/savepoint.sgml#sql-savepoint (Notes: Savepoints can only be established when inside a transaction block)"
sessions: [a]
steps:
  - sql: |
      SAVEPOINT my_savepoint
    expect: error
    sqlstate: "25P01"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    order: ordered
    comment: the session is not left in an aborted state by the failed statement
