# The savepoint_name parameter is required; omitting it is a syntax error that aborts the block.
id: cmd-savepoint.missing-name-syntax-42601
title: SAVEPOINT without a name is a syntax error and aborts the enclosing transaction block
family: cmd-savepoint
tier: core
feature_ids: [savepoint, errors, begin]
required_capabilities: [transactions, savepoints, errors]
provenance:
  source: pg-docs
  ref: "ref/savepoint.sgml#sql-savepoint (Synopsis: SAVEPOINT savepoint_name)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT;
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
    comment: block is now in the aborted state
  - sql: |
      ROLLBACK
    expect: ok
