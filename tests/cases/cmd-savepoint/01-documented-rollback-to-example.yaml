# Documented example: work after SAVEPOINT is undone by ROLLBACK TO SAVEPOINT; rows 1 and 3 survive.
id: cmd-savepoint.documented-rollback-to-example
title: SAVEPOINT then ROLLBACK TO SAVEPOINT undoes only the insert made after the savepoint
family: cmd-savepoint
tier: core
feature_ids: [savepoint, rollback-to-savepoint, begin, commit, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/savepoint.sgml#sql-savepoint (Examples: To establish a savepoint and later undo the effects)"
sessions: [a]
setup: |
  CREATE TABLE table1 (v int4);
steps:
  - sql: |
      BEGIN;
      INSERT INTO table1 VALUES (1);
      SAVEPOINT my_savepoint;
      INSERT INTO table1 VALUES (2);
      ROLLBACK TO SAVEPOINT my_savepoint;
      INSERT INTO table1 VALUES (3);
      COMMIT
    expect: ok
  - sql: |
      SELECT v FROM table1 ORDER BY v
    expect: rows
    order: ordered
    comment: documented result - the transaction inserts 1 and 3, not 2
