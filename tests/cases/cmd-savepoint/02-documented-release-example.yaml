# Documented example: RELEASE SAVEPOINT destroys the savepoint and keeps later work.
id: cmd-savepoint.documented-release-example
title: SAVEPOINT followed by RELEASE SAVEPOINT keeps all work and the block commits both rows
family: cmd-savepoint
tier: core
feature_ids: [savepoint, release-savepoint, begin, commit, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/savepoint.sgml#sql-savepoint (Examples: To establish and later destroy a savepoint)"
sessions: [a]
setup: |
  CREATE TABLE table1 (v int4);
steps:
  - sql: |
      BEGIN;
      INSERT INTO table1 VALUES (3);
      SAVEPOINT my_savepoint;
      INSERT INTO table1 VALUES (4);
      RELEASE SAVEPOINT my_savepoint;
      COMMIT
    expect: ok
  - sql: |
      SELECT v FROM table1 ORDER BY v
    expect: rows
    order: ordered
    comment: documented result - both 3 and 4 are committed
