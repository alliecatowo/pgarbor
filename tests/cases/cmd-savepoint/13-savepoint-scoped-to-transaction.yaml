# Savepoints end with the transaction block: after COMMIT the name no longer exists in a new block.
id: cmd-savepoint.scoped-to-transaction-3b001
title: A savepoint from a committed transaction does not exist in a later transaction block
family: cmd-savepoint
tier: core
feature_ids: [savepoint, rollback-to-savepoint, begin, commit, errors]
required_capabilities: [transactions, savepoints, errors]
provenance:
  source: hand
  ref: "PG18 docs sql-savepoint.html (Description: savepoint established within the current transaction)"
sessions: [a]
steps:
  - sql: |
      BEGIN;
      SAVEPOINT keep_me;
      COMMIT
    expect: ok
  - sql: |
      BEGIN;
      ROLLBACK TO SAVEPOINT keep_me
    expect: error
    sqlstate: "3B001"
  - sql: |
      ROLLBACK
    expect: ok
