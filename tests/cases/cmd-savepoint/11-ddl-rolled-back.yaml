# Savepoints are transactional: DDL after the savepoint is undone by ROLLBACK TO.
id: cmd-savepoint.ddl-rolled-back
title: CREATE TABLE after a savepoint disappears after ROLLBACK TO SAVEPOINT
family: cmd-savepoint
tier: core
feature_ids: [savepoint, rollback-to-savepoint, create-table, begin, commit, select]
required_capabilities: [create-table, select, transactions, savepoints]
provenance:
  source: hand
  ref: "PG18 docs sql-savepoint.html (Description: all commands executed after it are rolled back)"
sessions: [a]
steps:
  - sql: |
      BEGIN;
      SAVEPOINT s1;
      CREATE TABLE t_after (v int4);
      ROLLBACK TO SAVEPOINT s1;
      SELECT to_regclass('t_after') IS NULL AS gone
    expect: rows
    order: ordered
    comment: expected gone = true
  - sql: |
      COMMIT
    expect: ok
