# Documented input rules applied to a column: a multi-row INSERT with one invalid boolean string fails as a whole; accepted strings are coerced on insert.
id: doc-datatype-boolean.insert-invalid-atomic
title: Invalid boolean string in a multi-row INSERT fails the whole statement; valid strings coerce on insert
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-input, insert, error-handling, atomicity]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (input function; string literals usable without cast)"
sessions: [a]
setup: |
  CREATE TABLE tb (a boolean)
steps:
  - sql: |
      INSERT INTO tb VALUES ('yes'), ('maybe')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) AS n FROM tb
    expect: rows
  - sql: |
      INSERT INTO tb VALUES ('yes'), ('OFF'), (NULL), (' t '), ('0')
    expect: ok
  - sql: |
      SELECT a, a IS NULL AS a_null FROM tb
    expect: rows
    order: multiset
