# Documented: strings that are not one of the accepted representations (or unique prefixes) are invalid input.
id: doc-datatype-boolean.invalid-input-errors
title: Strings outside the accepted boolean representations raise invalid_text_representation
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-input, error-handling]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (accepted representations; unique prefixes)"
steps:
  - sql: |
      SELECT 'maybe'::boolean
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT '2'::boolean
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT ''::boolean
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'truee'::boolean
    expect: error
    sqlstate: "22P02"
