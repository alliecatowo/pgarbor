# Documented: only unique prefixes are accepted. 'o' prefixes both 'on' and 'off', so it is rejected as invalid input.
id: doc-datatype-boolean.ambiguous-prefix-o
title: Ambiguous prefix o is rejected as invalid boolean input
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-input, unique-prefix, error-handling]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (Unique prefixes of these strings are also accepted)"
steps:
  - sql: |
      SELECT 'o'::boolean
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT 'on'::boolean AS on_is_unique_true, 'off'::boolean AS off_is_unique_false
    expect: rows
