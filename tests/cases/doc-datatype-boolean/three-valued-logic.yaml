# Boolean NULL (unknown) semantics: AND/OR/NOT truth tables with NULL operands and IS [NOT] TRUE/FALSE/UNKNOWN tests.
id: doc-datatype-boolean.three-valued-logic
title: Boolean operators follow SQL three-valued logic with NULL as unknown
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, null-semantics, boolean-operators, is-tests]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (the third state, unknown, represented by SQL null)"
steps:
  - sql: |
      SELECT (TRUE AND NULL::boolean) AS t_and_n, (FALSE AND NULL::boolean) AS f_and_n, (TRUE OR NULL::boolean) AS t_or_n, (FALSE OR NULL::boolean) AS f_or_n, (NOT NULL::boolean) AS not_n, (NULL::boolean AND NULL::boolean) AS n_and_n
    expect: rows
  - sql: |
      SELECT (NULL::boolean IS UNKNOWN) AS n_is_unknown, (NULL::boolean IS NOT TRUE) AS n_is_not_true, (NULL::boolean IS NOT FALSE) AS n_is_not_false, (FALSE IS NOT UNKNOWN) AS f_is_not_unknown, (NULL::boolean = NULL::boolean) AS n_eq_n
    expect: rows
