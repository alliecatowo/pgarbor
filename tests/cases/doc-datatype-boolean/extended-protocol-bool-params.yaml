# Documented input strings used as bind parameters over the extended protocol, typed boolean by param_types and by comparison with a boolean column.
id: doc-datatype-boolean.extended-protocol-bool-params
title: Documented boolean input strings as text-format bind parameters, including NULL
family: doc-datatype-boolean
tier: extended
feature_ids: [boolean-type, boolean-input, extended-protocol, bind-parameters]
required_capabilities: [create-table, insert, select, extended-protocol]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (input function accepted strings); protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY"
sessions: [a]
setup: |
  CREATE TABLE flag_p (id int4, b boolean)
steps:
  - exec_params:
      sql: |
        INSERT INTO flag_p (id, b) VALUES ($1, $2)
      params: ["1", "yes"]
      param_types: [23, 16]
    expect: ok
  - exec_params:
      sql: |
        INSERT INTO flag_p (id, b) VALUES ($1, $2)
      params: ["2", "OFF"]
      param_types: [23, 16]
    expect: ok
  - exec_params:
      sql: |
        INSERT INTO flag_p (id, b) VALUES ($1, $2)
      params: ["3", null]
      param_types: [23, 16]
    expect: ok
  - exec_params:
      sql: |
        SELECT id FROM flag_p WHERE b = $1 ORDER BY id
      params: ["on"]
    expect: rows
    order: ordered
  - exec_params:
      sql: |
        SELECT id FROM flag_p WHERE b = $1 ORDER BY id
      params: ["0"]
    expect: rows
    order: ordered
