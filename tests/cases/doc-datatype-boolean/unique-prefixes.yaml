# Documented: unique prefixes of the accepted strings are accepted, for example t or n.
id: doc-datatype-boolean.unique-prefixes
title: Unique prefixes of boolean input strings are accepted; ambiguous prefixes are covered separately
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-input, unique-prefix]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (Unique prefixes of these strings are also accepted, for example t or n)"
steps:
  - sql: |
      SELECT s.v, s.v::boolean AS b FROM (VALUES ('t'), ('tr'), ('tru'), ('y'), ('ye'), ('n'), ('no'), ('f'), ('fa'), ('fal'), ('of'), ('  n  ')) AS s(v)
    expect: rows
    order: multiset
