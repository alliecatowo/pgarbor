# Documented: the input function accepts true, yes, on and 1 (any case, surrounding whitespace ignored) as true.
id: doc-datatype-boolean.input-true-spellings
title: Boolean input accepts true, yes, on and 1 in any case with surrounding whitespace
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-input, string-literal-cast]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (input function accepted true strings; leading/trailing whitespace ignored; case does not matter)"
steps:
  - sql: |
      SELECT s.v, s.v::boolean AS b FROM (VALUES ('true'), ('TRUE'), ('True'), ('yes'), ('YeS'), ('on'), ('ON'), ('1'), (' true '), ('  On  '), ('	yes	')) AS s(v)
    expect: rows
    order: multiset
