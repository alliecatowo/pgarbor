# Documented: the input function accepts false, no, off and 0 (any case, surrounding whitespace ignored) as false.
id: doc-datatype-boolean.input-false-spellings
title: Boolean input accepts false, no, off and 0 in any case with surrounding whitespace
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-input, string-literal-cast]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (input function accepted false strings; leading/trailing whitespace ignored; case does not matter)"
steps:
  - sql: |
      SELECT s.v, s.v::boolean AS b FROM (VALUES ('false'), ('FALSE'), ('False'), ('no'), ('No'), ('off'), ('OFF'), ('0'), (' false '), ('  Off  '), ('	no	')) AS s(v)
    expect: rows
    order: multiset
