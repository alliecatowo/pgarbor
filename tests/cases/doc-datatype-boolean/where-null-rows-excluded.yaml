# Documented: a row is selected only when the boolean predicate is TRUE; NULL (unknown) rows are excluded from WHERE a and WHERE NOT a alike.
id: doc-datatype-boolean.where-null-rows-excluded
title: WHERE on a boolean column excludes NULL rows for both the column and its negation
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, null-semantics, where-clause, is-tests]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (unknown state represented by SQL null)"
sessions: [a]
setup: |
  CREATE TABLE tri (id int4 PRIMARY KEY, a boolean);
  INSERT INTO tri VALUES (1, TRUE), (2, FALSE), (3, NULL)
steps:
  - sql: |
      SELECT id FROM tri WHERE a ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM tri WHERE NOT a ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM tri WHERE a IS NOT TRUE ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM tri WHERE a = NULL
    expect: rows
    order: multiset
