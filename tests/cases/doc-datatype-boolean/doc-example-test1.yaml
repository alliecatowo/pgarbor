# The documented Boolean usage example: TRUE/FALSE literals, and WHERE on a boolean column used directly as a predicate.
id: doc-datatype-boolean.doc-example-test1
title: Documented boolean example with TRUE/FALSE literals and a bare boolean column as WHERE predicate
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-constants, where-clause]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (Using the boolean Type)"
sessions: [a]
setup: |
  CREATE TABLE test1 (a boolean, b text);
  INSERT INTO test1 VALUES (TRUE, 'sic est');
  INSERT INTO test1 VALUES (FALSE, 'non est');
steps:
  - sql: |
      SELECT a, b FROM test1 ORDER BY a DESC, b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM test1 WHERE a
    expect: rows
    order: multiset
  - sql: |
      SELECT a, b FROM test1 WHERE NOT a
    expect: rows
    order: multiset
