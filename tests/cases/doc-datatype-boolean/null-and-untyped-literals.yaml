# Documented: TRUE and FALSE are typed boolean by the parser; NULL is untyped unless cast; string literals resolve to boolean where the context requires it.
id: doc-datatype-boolean.null-and-untyped-literals
title: TRUE/FALSE are boolean, NULL needs an explicit cast to be boolean, string literals adopt boolean from context
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-constants, null-semantics, typed-literals]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (TRUE/FALSE/NULL constants; NULL::boolean; cast omitted from string literal)"
steps:
  - sql: |
      SELECT pg_typeof(TRUE)::text AS true_type, pg_typeof(FALSE)::text AS false_type, pg_typeof(NULL::boolean)::text AS null_cast_type, pg_typeof(NULL)::text AS bare_null_type
    expect: rows
  - sql: |
      SELECT TRUE = 'yes' AS true_eq_yes, 'off' = FALSE AS off_eq_false, 'yes'::boolean AS explicit_yes
    expect: rows
