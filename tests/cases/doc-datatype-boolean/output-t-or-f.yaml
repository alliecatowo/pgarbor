# Documented: the output function always emits t or f; a boolean is one byte; casts to text and integer.
id: doc-datatype-boolean.output-t-or-f
title: Boolean output is always t or f; boolean casts to text and integer; stored size is one byte
family: doc-datatype-boolean
tier: core
feature_ids: [boolean-type, boolean-output, casts, storage]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-boolean (output function emits t or f; Storage Size 1 byte)"
steps:
  - sql: |
      SELECT true::text AS t_text, false::text AS f_text, 'yes'::boolean::text AS yes_text, 'off'::boolean::text AS off_text, (NULL::boolean)::text IS NULL AS null_text_is_null
    expect: rows
  - sql: |
      SELECT true::int AS t_int, false::int AS f_int, pg_column_size(true) AS true_bytes, pg_column_size(false) AS false_bytes
    expect: rows
