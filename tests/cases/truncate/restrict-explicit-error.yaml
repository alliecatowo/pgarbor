# RESTRICT is the default behavior and must refuse when a referencing table exists.
id: truncate.restrict-explicit-error
title: "TRUNCATE ... RESTRICT refuses a referenced table, leaving its rows in place"
family: truncate
tier: core
feature_ids: [truncate, foreign-key, constraints, errors, insert, select]
required_capabilities: [create-table, insert, select, foreign-key, transactions, truncate]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/truncate.sql
sessions: [a]
setup: |
  CREATE TABLE p (id int4 PRIMARY KEY);
  CREATE TABLE c (pid int4 REFERENCES p);
  INSERT INTO p VALUES (1), (2);
  INSERT INTO c VALUES (2);
steps:
  - sql: |
      TRUNCATE TABLE p RESTRICT
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT id FROM p ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      TRUNCATE TABLE p CASCADE
    expect: ok
  - sql: |
      SELECT id FROM p ORDER BY id
    expect: rows
    order: ordered
