# TRUNCATE issued through the extended protocol: unnamed exec_params and a named prepared statement.
id: truncate.extended-protocol-truncate
title: "TRUNCATE works through unnamed and named extended-protocol statements"
family: truncate
tier: core
feature_ids: [truncate, extended-protocol, prepared-statements, insert, select]
required_capabilities: [create-table, insert, select, truncate, extended-protocol]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/truncate.sql
sessions: [a]
setup: |
  CREATE TABLE tx (v text);
  INSERT INTO tx VALUES ('a'), (NULL);
steps:
  - exec_params:
      sql: |
        TRUNCATE TABLE tx
    expect: ok
    comment: "unnamed statement, no parameters"
  - sql: |
      SELECT count(*) FROM tx
    expect: rows
  - sql: |
      INSERT INTO tx VALUES ('b'), ('c')
    expect: ok
  - parse:
      name: tr
      sql: |
        TRUNCATE TABLE tx
    expect: ok
  - execute:
      statement: tr
    expect: ok
  - sql: |
      SELECT count(*) FROM tx
    expect: rows
  - close:
      statement: tr
