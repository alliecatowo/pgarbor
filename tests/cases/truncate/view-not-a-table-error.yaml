# TRUNCATE accepts only tables; a view is rejected with wrong_object_type and the base table keeps its rows.
id: truncate.view-not-a-table-error
title: "TRUNCATE on a view fails with 42809 and the base table is unchanged"
family: truncate
tier: core
feature_ids: [truncate, views, errors, insert, select]
required_capabilities: [create-table, create-view, insert, select, truncate]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/truncate.sql
sessions: [a]
setup: |
  CREATE TABLE base (x int4);
  CREATE VIEW vbase AS SELECT x FROM base;
  INSERT INTO base VALUES (7);
steps:
  - sql: |
      TRUNCATE vbase
    expect: error
    sqlstate: "42809"
    comment: "relation is not a table"
  - sql: |
      SELECT x FROM base
    expect: rows
    order: ordered
