# TRUNCATE of an unknown relation fails with undefined_table, and the whole statement has no effect.
id: truncate.missing-table-error
title: "TRUNCATE of a missing table fails with 42P01 and leaves other listed tables untouched"
family: truncate
tier: core
feature_ids: [truncate, errors, insert, select]
required_capabilities: [create-table, insert, select, truncate]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/truncate.sql
sessions: [a]
setup: |
  CREATE TABLE tbl_exists (x int4);
  INSERT INTO tbl_exists VALUES (1), (2);
steps:
  - sql: |
      TRUNCATE TABLE no_such_table
    expect: error
    sqlstate: "42P01"
  - sql: |
      TRUNCATE TABLE tbl_exists, no_such_table
    expect: error
    sqlstate: "42P01"
    comment: "the name lookup fails before any table is truncated"
  - sql: |
      SELECT x FROM tbl_exists ORDER BY x
    expect: rows
    order: ordered
