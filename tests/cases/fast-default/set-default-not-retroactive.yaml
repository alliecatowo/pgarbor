# ALTER COLUMN SET DEFAULT changes only rows inserted afterwards; rows that got a missing value keep it.
id: fast-default.set-default-not-retroactive
title: SET DEFAULT does not rewrite rows that already have an added-column default
family: fast-default
tier: core
feature_ids: [alter-table, defaults, insert, select]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN c int4 DEFAULT 1
    expect: ok
  - sql: |
      ALTER TABLE t ALTER COLUMN c SET DEFAULT 2
    expect: ok
  - sql: |
      INSERT INTO t (pk) VALUES (3), (4)
    expect: ok
  - sql: |
      SELECT pk, c FROM t ORDER BY pk
    expect: rows
    order: ordered
