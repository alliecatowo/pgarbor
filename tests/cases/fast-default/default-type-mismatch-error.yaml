# A DEFAULT that cannot be cast to the column type fails at ALTER time with 22P02; the column is not added.
id: fast-default.default-type-mismatch-error
title: ADD COLUMN with a DEFAULT that is not valid input for the type fails with 22P02
family: fast-default
tier: core
feature_ids: [alter-table, defaults, errors, types]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: hand
  ref: "PG18 errcodes 22P02 invalid_text_representation; fast_default.sql column defaults"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN c int4 DEFAULT 'abc'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT pk FROM t ORDER BY pk
    expect: rows
    order: ordered
