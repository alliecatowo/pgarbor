# ADD COLUMN without DEFAULT, with DEFAULT NULL, and NOT NULL DEFAULT, on a table with existing rows.
id: fast-default.add-column-null-default-existing
title: Missing-value semantics for ADD COLUMN without default, DEFAULT NULL, and NOT NULL DEFAULT
family: fast-default
tier: core
feature_ids: [alter-table, defaults, nulls, select]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY, a int4);
  INSERT INTO t VALUES (1, 10), (2, NULL);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN b int4, ADD COLUMN c text NOT NULL DEFAULT 'x', ADD COLUMN d int4 DEFAULT NULL
    expect: ok
  - sql: |
      SELECT pk, a, b, c, d, b IS NULL AS b_null, d IS NULL AS d_null FROM t ORDER BY pk
    expect: rows
    order: ordered
