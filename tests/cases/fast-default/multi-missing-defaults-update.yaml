# Two NOT NULL added columns with defaults on a row with a NULL original column; an UPDATE of one default-filled column leaves the other unchanged.
id: fast-default.multi-missing-defaults-update
title: Several added NOT NULL defaults read correctly on a row with a NULL, and UPDATE touches only the named column
family: fast-default
tier: core
feature_ids: [alter-table, defaults, update, nulls]
required_capabilities: [create-table, insert, select, update, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, a int4, b int4, c int4);
  INSERT INTO t (id, a, b, c) VALUES (1, 2, 3, NULL);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN x int4 NOT NULL DEFAULT 4, ADD COLUMN y int4 NOT NULL DEFAULT 5
    expect: ok
  - sql: |
      SELECT id, a, b, c, x, y FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      UPDATE t SET y = 2
    expect: ok
  - sql: |
      SELECT id, a, b, c, x, y FROM t ORDER BY id
    expect: rows
    order: ordered
