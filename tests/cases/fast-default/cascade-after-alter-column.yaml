# After ADD then DROP of a column on the referenced table, ON DELETE CASCADE still removes referencing rows.
id: fast-default.cascade-after-alter-column
title: ON DELETE CASCADE still works after adding and dropping a column on the referenced table
family: fast-default
tier: extended
feature_ids: [alter-table, foreign-keys, constraints, delete]
required_capabilities: [create-table, insert, select, delete, alter-table, foreign-keys]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE leader (a int4 PRIMARY KEY, b int4);
  CREATE TABLE follower (a int4 REFERENCES leader ON DELETE CASCADE, b int4);
  INSERT INTO leader VALUES (1, 1), (2, 2);
  INSERT INTO follower VALUES (1, 10), (2, 20);
steps:
  - sql: |
      ALTER TABLE leader ADD c int4
    expect: ok
  - sql: |
      ALTER TABLE leader DROP c
    expect: ok
  - sql: |
      DELETE FROM leader
    expect: ok
  - sql: |
      SELECT count(*) AS remaining FROM follower
    expect: rows
