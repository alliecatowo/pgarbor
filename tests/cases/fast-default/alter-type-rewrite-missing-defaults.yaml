# ALTER COLUMN TYPE to text with USING on columns that have added-column defaults of float8 and boolean.
id: fast-default.alter-type-rewrite-missing-defaults
title: ALTER COLUMN TYPE to text converts float8 and boolean added-column defaults
family: fast-default
tier: core
feature_ids: [alter-table, defaults, types, float, boolean]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE vtype (a int4);
  INSERT INTO vtype VALUES (1);
  ALTER TABLE vtype ADD COLUMN b float8 DEFAULT 0.2;
  ALTER TABLE vtype ADD COLUMN c boolean DEFAULT true;
steps:
  - sql: |
      SELECT a, b, c FROM vtype ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE vtype ALTER b TYPE text USING b::text, ALTER c TYPE text USING c::text
    expect: ok
  - sql: |
      SELECT a, b, c, b = '0.2' AS b_is_text_02, c = 'true' AS c_is_text_true FROM vtype ORDER BY a
    expect: rows
    order: ordered
