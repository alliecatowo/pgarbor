# DROP DEFAULT leaves the stored missing value on existing rows; new rows without the column get NULL.
id: fast-default.drop-default-keeps-missing-value
title: DROP DEFAULT keeps the missing value for existing rows and does not apply to new inserts
family: fast-default
tier: core
feature_ids: [alter-table, defaults, nulls, insert, select]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN c int4 DEFAULT 42
    expect: ok
  - sql: |
      ALTER TABLE t ALTER COLUMN c DROP DEFAULT
    expect: ok
  - sql: |
      INSERT INTO t (pk) VALUES (3)
    expect: ok
  - sql: |
      SELECT pk, c, c IS NULL AS c_null FROM t ORDER BY pk
    expect: rows
    order: ordered
