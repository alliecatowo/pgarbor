# ADD COLUMN with a constant DEFAULT: existing rows read the default, new rows get it on INSERT.
id: fast-default.add-column-default-existing-rows
title: ADD COLUMN with constant DEFAULT is visible on existing rows and on new rows
family: fast-default
tier: core
feature_ids: [alter-table, defaults, select, insert]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 NOT NULL PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN c_int int4 DEFAULT 1, ADD COLUMN c_text text DEFAULT 'hello'
    expect: ok
  - sql: |
      SELECT pk, c_int, c_text FROM t ORDER BY pk
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO t (pk) VALUES (3)
    expect: ok
  - sql: |
      SELECT pk, c_int, c_text FROM t ORDER BY pk
    expect: rows
    order: ordered
