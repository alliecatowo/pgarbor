# ADD COLUMN with a name that already exists fails with 42701 and leaves the existing column untouched.
id: fast-default.duplicate-column-error
title: ADD COLUMN with a duplicate name fails with 42701 and does not alter the existing column
family: fast-default
tier: core
feature_ids: [alter-table, defaults, errors]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: hand
  ref: "src/test/regress/sql/fast_default.sql (duplicate column with DEFAULT); PG18 errcodes 42701"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY, a int4);
  INSERT INTO t VALUES (1, 5);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN a int4 DEFAULT 1
    expect: error
    sqlstate: "42701"
  - sql: |
      SELECT pk, a FROM t ORDER BY pk
    expect: rows
    order: ordered
