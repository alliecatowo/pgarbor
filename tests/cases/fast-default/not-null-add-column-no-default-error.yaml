# ADD COLUMN NOT NULL without a DEFAULT on a non-empty table is rejected and leaves the table unchanged.
id: fast-default.not-null-add-column-no-default-error
title: ADD COLUMN NOT NULL with no default on a non-empty table fails with 23502 and changes nothing
family: fast-default
tier: core
feature_ids: [alter-table, constraints, not-null, errors]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN x int4 NOT NULL
    expect: error
    sqlstate: "23502"
  - sql: |
      SELECT pk FROM t ORDER BY pk
    expect: rows
    order: ordered
