# A 7000-byte text default (TOAST-sized) on existing rows, then a changed default applied to new rows only.
id: fast-default.long-text-default-boundary
title: Large text added-column default reads back intact and SET DEFAULT applies to new rows only
family: fast-default
tier: core
feature_ids: [alter-table, defaults, text, toast]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN c_hugetext text DEFAULT repeat('abcdefg', 1000)
    expect: ok
  - sql: |
      SELECT pk, length(c_hugetext) AS len, c_hugetext = repeat('abcdefg', 1000) AS is_orig FROM t ORDER BY pk
    expect: rows
    order: ordered
  - sql: |
      ALTER TABLE t ALTER COLUMN c_hugetext SET DEFAULT repeat('poiuyt', 1000)
    expect: ok
  - sql: |
      INSERT INTO t (pk) VALUES (3)
    expect: ok
  - sql: |
      SELECT pk, length(c_hugetext) AS len, c_hugetext = repeat('abcdefg', 1000) AS is_orig, c_hugetext = repeat('poiuyt', 1000) AS is_new FROM t ORDER BY pk
    expect: rows
    order: ordered
