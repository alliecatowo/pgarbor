# A column of a domain with a DEFAULT inherits that default; ADD COLUMN with a domain type and an explicit default.
id: fast-default.domain-default-on-add-column
title: Domain DEFAULT is inherited by table columns, including columns added later
family: fast-default
tier: core
feature_ids: [domains, alter-table, defaults, insert, select]
required_capabilities: [create-table, insert, select, alter-table, domain]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/fast_default.sql"
sessions: [a]
setup: |
  CREATE DOMAIN d1 AS int4 DEFAULT 11;
  CREATE TABLE t2 (a d1);
  INSERT INTO t2 VALUES (1);
steps:
  - sql: |
      ALTER TABLE t2 ADD COLUMN b d1 DEFAULT 3
    expect: ok
  - sql: |
      ALTER TABLE t2 ADD COLUMN c d1
    expect: ok
  - sql: |
      INSERT INTO t2 DEFAULT VALUES
    expect: ok
  - sql: |
      SELECT a, b, c FROM t2 ORDER BY a
    expect: rows
    order: ordered
