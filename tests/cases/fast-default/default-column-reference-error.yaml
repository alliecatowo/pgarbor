# A DEFAULT expression cannot reference a column of the table; the ALTER fails with 0A000 (feature_not_supported).
id: fast-default.default-column-reference-error
title: DEFAULT expression that references a table column fails with 0A000
family: fast-default
tier: core
feature_ids: [alter-table, defaults, errors]
required_capabilities: [create-table, insert, select, alter-table]
provenance:
  source: hand
  ref: "PG18 src/backend/parser/parse_expr.c transformColumnRef (0A000 feature_not_supported); verified against PG 18.6 oracle"
sessions: [a]
setup: |
  CREATE TABLE t (pk int4 PRIMARY KEY);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN c int4 DEFAULT pk
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT pk FROM t ORDER BY pk
    expect: rows
    order: ordered
