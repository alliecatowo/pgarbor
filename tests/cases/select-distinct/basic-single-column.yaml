# DISTINCT over one column: duplicates collapse, NULL is one distinct value, ORDER BY places it last.
id: select-distinct.basic-single-column
title: SELECT DISTINCT on one column collapses duplicates and keeps one NULL
family: select-distinct
tier: slice
feature_ids: [select, distinct, order-by, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE t (a int4, b text);
  INSERT INTO t VALUES (3,'x'), (1,'y'), (3,'x'), (2,NULL), (NULL,'z'), (1,'y');
steps:
  - sql: |
      SELECT DISTINCT a FROM t ORDER BY a
    expect: rows
    order: ordered
    comment: ASC puts NULL last, so the result is 1, 2, 3, NULL
  - sql: |
      SELECT DISTINCT b FROM t
    expect: rows
    order: multiset
    comment: NULL is a single distinct value
