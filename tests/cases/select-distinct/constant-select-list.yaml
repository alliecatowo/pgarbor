# Constants in the select list do not multiply rows: DISTINCT collapses to one row, or zero rows when the filter is empty.
id: select-distinct.constant-select-list
title: DISTINCT with constant select-list items returns one row or none
family: select-distinct
tier: core
feature_ids: [distinct, where, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE tq (four int4, two int4);
  INSERT INTO tq SELECT i % 4, i % 2 FROM generate_series(1, 40) AS i;
steps:
  - sql: |
      SELECT DISTINCT four, 1, 2, 3 FROM tq WHERE four = 0
    expect: rows
    order: multiset
    comment: exactly one row (0, 1, 2, 3)
  - sql: |
      SELECT DISTINCT four, 1, 2, 3 FROM tq WHERE four = 9
    expect: rows
    order: multiset
    comment: no rows match, so zero rows
