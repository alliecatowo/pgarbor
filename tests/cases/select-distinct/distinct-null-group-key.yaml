# DISTINCT ON groups NULL keys together, one group for all NULL grp rows.
id: select-distinct.distinct-null-group-key
title: DISTINCT ON treats NULL group keys as one group
family: select-distinct
tier: extended
feature_ids: [distinct-on, nulls, order-by]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: hand
  ref: "PG18 docs sql-select.html#SQL-DISTINCT (DISTINCT ON); src/test/regress/sql/select_distinct.sql"
sessions: [a]
setup: |
  CREATE TABLE ns (id int4 PRIMARY KEY, grp text);
  INSERT INTO ns VALUES (1, NULL), (2, NULL), (3, 'k'), (4, NULL), (5, 'k');
steps:
  - sql: |
      SELECT DISTINCT ON (grp) id, grp FROM ns ORDER BY grp NULLS FIRST, id
    expect: rows
    order: ordered
    comment: one NULL-group row (id 1) and one 'k' row (id 3)
