# With DISTINCT, ORDER BY expressions must appear in the select list.
id: select-distinct.order-by-not-in-select-list
title: DISTINCT with an ORDER BY expression missing from the select list is rejected
family: select-distinct
tier: core
feature_ids: [distinct, order-by, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE p (x int4, y text);
  INSERT INTO p VALUES (1,'a'), (2,'b');
steps:
  - sql: |
      SELECT DISTINCT x FROM p ORDER BY y
    expect: error
    sqlstate: "42P10"
    comment: "for SELECT DISTINCT, ORDER BY expressions must appear in select list"
  - sql: |
      SELECT DISTINCT x FROM p ORDER BY x
    expect: rows
    order: ordered
