# The same column listed twice in DISTINCT does not change the set of distinct rows.
id: select-distinct.duplicate-column-count
title: DISTINCT with a repeated column counts the same distinct tuples
family: select-distinct
tier: core
feature_ids: [distinct, select, aggregates]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE tk (two int4, four int4);
  INSERT INTO tk VALUES (0,0), (0,2), (1,1), (1,3), (0,0), (1,1), (0,2);
steps:
  - sql: |
      SELECT count(*) FROM (SELECT DISTINCT two, four, two FROM tk) ss
    expect: rows
    order: multiset
  - sql: |
      SELECT DISTINCT two, four, two FROM tk ORDER BY two, four
    expect: rows
    order: ordered
