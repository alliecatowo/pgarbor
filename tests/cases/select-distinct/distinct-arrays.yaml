# DISTINCT on array values: element NULLs compare as equal for grouping, and an empty array differs from NULL.
id: select-distinct.distinct-arrays
title: DISTINCT over int4[] with NULL elements, empty arrays and NULL values
family: select-distinct
tier: extended
feature_ids: [distinct, arrays, nulls]
required_capabilities: [create-table, insert, select, arrays]
provenance:
  source: hand
  ref: "PG18 docs arrays.html; src/test/regress/sql/select_distinct.sql"
sessions: [a]
setup: |
  CREATE TABLE ta (arr int4[]);
  INSERT INTO ta VALUES ('{1,NULL}'), ('{1,NULL}'), ('{}'), (NULL), ('{}'), ('{1}');
steps:
  - sql: |
      SELECT DISTINCT arr FROM ta
    expect: rows
    order: multiset
    comment: "expect 4 rows: {1,NULL}, {}, NULL, {1}"
