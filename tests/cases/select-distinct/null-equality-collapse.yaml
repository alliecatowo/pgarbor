# NULLs are not equal to each other, but DISTINCT and count(DISTINCT) treat them as one group / ignore them.
id: select-distinct.null-equality-collapse
title: Multiple NULLs collapse to one DISTINCT row, count(DISTINCT) ignores them
family: select-distinct
tier: core
feature_ids: [distinct, nulls, aggregates]
required_capabilities: [create-table, insert, select, aggregates]
provenance:
  source: hand
  ref: "PG18 docs queries-union.html (DISTINCT treats NULLs as not distinct); src/test/regress/sql/select_distinct.sql"
sessions: [a]
setup: |
  CREATE TABLE n (v int4);
  INSERT INTO n VALUES (NULL), (5), (NULL), (NULL), (5);
steps:
  - sql: |
      SELECT DISTINCT v FROM n
    expect: rows
    order: multiset
  - sql: |
      SELECT count(DISTINCT v) AS c_distinct, count(*) AS c_all, count(v) AS c_nonnull FROM n
    expect: rows
    order: multiset
  - sql: |
      SELECT DISTINCT v, v IS NULL AS is_null FROM n ORDER BY v NULLS FIRST
    expect: rows
    order: ordered
