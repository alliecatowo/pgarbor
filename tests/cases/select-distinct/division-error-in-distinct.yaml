# An error raised while evaluating the DISTINCT input aborts the statement with 22012; a later statement still works.
id: select-distinct.division-error-in-distinct
title: Division by zero inside a DISTINCT select list raises 22012
family: select-distinct
tier: core
feature_ids: [distinct, errors, expressions]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 22012 division_by_zero; src/test/regress/sql/select_distinct.sql"
sessions: [a]
setup: |
  CREATE TABLE dz (a int4);
  INSERT INTO dz VALUES (1), (2), (2);
steps:
  - sql: |
      SELECT DISTINCT a / (a - 2) FROM dz
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT DISTINCT a FROM dz ORDER BY a
    expect: rows
    order: ordered
