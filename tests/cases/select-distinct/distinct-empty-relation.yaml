# DISTINCT and DISTINCT ON over an empty table return zero rows and no error.
id: select-distinct.distinct-empty-relation
title: DISTINCT and DISTINCT ON over an empty relation return no rows
family: select-distinct
tier: extended
feature_ids: [distinct, distinct-on, select]
required_capabilities: [create-table, select]
provenance:
  source: hand
  ref: "PG18 docs sql-select.html#SQL-DISTINCT"
sessions: [a]
setup: |
  CREATE TABLE empty_t (a int4, b int4);
steps:
  - sql: |
      SELECT DISTINCT a FROM empty_t
    expect: rows
    order: multiset
  - sql: |
      SELECT DISTINCT ON (a) a, b FROM empty_t ORDER BY a, b
    expect: rows
    order: ordered
