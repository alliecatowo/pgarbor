# DISTINCT ON expressions must match the leading ORDER BY expressions (PG reports 42P10 invalid_column_reference).
id: select-distinct.distinct-on-order-mismatch
title: DISTINCT ON whose expression does not lead the ORDER BY is rejected with 42P10
family: select-distinct
tier: core
feature_ids: [distinct-on, distinct, order-by, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE s (id int4 PRIMARY KEY, grp text, score int4);
  INSERT INTO s VALUES (1,'a',10), (2,'b',20);
steps:
  - sql: |
      SELECT DISTINCT ON (grp) id FROM s ORDER BY score
    expect: error
    sqlstate: "42P10"
    comment: "SELECT DISTINCT ON expressions must match initial ORDER BY expressions"
  - sql: |
      SELECT DISTINCT ON (grp) id FROM s ORDER BY grp, id
    expect: rows
    order: ordered
