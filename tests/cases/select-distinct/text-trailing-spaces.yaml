# text is not blank-padded: 'a' and 'a ' are distinct, 'A' differs by case, '' is not NULL.
id: select-distinct.text-trailing-spaces
title: DISTINCT on text keeps trailing-space, case and empty-string variants separate from NULL
family: select-distinct
tier: core
feature_ids: [distinct, text, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: hand
  ref: "PG18 docs datatype-character.html (text vs char(n) blank padding); src/test/regress/sql/select_distinct.sql"
sessions: [a]
setup: |
  CREATE TABLE tx (v text);
  INSERT INTO tx VALUES ('a'), ('a '), ('A'), (''), (NULL), (''), ('a');
steps:
  - sql: |
      SELECT DISTINCT v FROM tx
    expect: rows
    order: multiset
    comment: "expect 5 rows: a, a-with-space, A, empty string, NULL"
  - sql: |
      SELECT count(*) AS n FROM (SELECT DISTINCT v FROM tx) s
    expect: rows
    order: multiset
