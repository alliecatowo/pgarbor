# Constant-folded IS [NOT] DISTINCT FROM over literal NULL and integer operands.
id: select-distinct.is-distinct-from-constants
title: IS DISTINCT FROM constant forms including NULL operands
family: select-distinct
tier: core
feature_ids: [is-distinct-from, nulls, expressions]
required_capabilities: [select, expressions]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
steps:
  - sql: |
      SELECT 1 IS DISTINCT FROM 2 AS a, 2 IS DISTINCT FROM 2 AS b, 2 IS DISTINCT FROM null AS c, null IS DISTINCT FROM null AS d, 1 IS NOT DISTINCT FROM 2 AS e, 2 IS NOT DISTINCT FROM 2 AS f, 2 IS NOT DISTINCT FROM null AS g, null IS NOT DISTINCT FROM null AS h
    expect: rows
    order: multiset
    comment: expect yes, no, yes, no, no, yes, no, yes
