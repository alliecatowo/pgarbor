# DISTINCT ON keeps the first row of each group under the ORDER BY; ties resolved by a later key.
id: select-distinct.distinct-on-first-row
title: DISTINCT ON picks the first row per group under ORDER BY with NULLS LAST and tie-break
family: select-distinct
tier: core
feature_ids: [distinct-on, distinct, order-by, nulls]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-docs
  ref: "https://www.postgresql.org/docs/18/sql-select.html#SQL-DISTINCT"
sessions: [a]
setup: |
  CREATE TABLE s (id int4 PRIMARY KEY, grp text, score int4);
  INSERT INTO s VALUES (1,'a',10), (2,'a',30), (3,'b',20), (4,'b',20), (5,'c',NULL), (6,'c',5);
steps:
  - sql: |
      SELECT DISTINCT ON (grp) grp, id, score FROM s ORDER BY grp, score DESC NULLS LAST, id
    expect: rows
    order: ordered
    comment: group a -> id 2; group b tie on 20 -> id 3; group c -> score 5 (id 6) before NULL
