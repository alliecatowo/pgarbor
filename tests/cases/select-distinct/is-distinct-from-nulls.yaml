# IS [NOT] DISTINCT FROM treats NULL as a comparable value; compare table values to a constant and to a column.
id: select-distinct.is-distinct-from-nulls
title: IS DISTINCT FROM and IS NOT DISTINCT FROM over a column with NULLs
family: select-distinct
tier: core
feature_ids: [is-distinct-from, nulls, expressions]
required_capabilities: [create-table, insert, select, expressions]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE disttable (f1 integer);
  INSERT INTO disttable VALUES (1), (2), (3), (NULL);
steps:
  - sql: |
      SELECT f1, f1 IS DISTINCT FROM 2 AS not_2, f1 IS NOT DISTINCT FROM NULL AS is_null FROM disttable ORDER BY f1 NULLS LAST
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, f1 IS DISTINCT FROM f1 AS self_false, f1 IS DISTINCT FROM f1 + 1 AS plus_one FROM disttable ORDER BY f1 NULLS LAST
    expect: rows
    order: ordered
    comment: a NULL row compared with itself is not distinct
