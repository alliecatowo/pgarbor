# DISTINCT applies to the whole row: (x, y) pairs are distinct as tuples, NULL y collapses within a tuple.
id: select-distinct.multi-column-pairs
title: DISTINCT over a column pair keeps distinct tuples, NULL component collapses
family: select-distinct
tier: core
feature_ids: [distinct, order-by, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE p (x int4, y text);
  INSERT INTO p VALUES (1,'a'), (1,'a'), (1,'b'), (2,NULL), (2,NULL), (2,'a');
steps:
  - sql: |
      SELECT DISTINCT x, y FROM p ORDER BY x, y
    expect: rows
    order: ordered
    comment: NULL sorts after non-null within x = 2
  - sql: |
      SELECT count(*) FROM (SELECT DISTINCT x, y FROM p) s
    expect: rows
    order: multiset
