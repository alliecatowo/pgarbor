# ORDER BY ... USING with a non-default operator combined with DISTINCT and LIMIT.
id: select-distinct.distinct-order-by-using
title: DISTINCT with ORDER BY USING > and DESC LIMIT
family: select-distinct
tier: extended
feature_ids: [distinct, order-by, limit, operators]
required_capabilities: [create-table, insert, select, order-by, limit]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/select_distinct.sql
sessions: [a]
setup: |
  CREATE TABLE ob (x int4, y int4);
  INSERT INTO ob VALUES (1,1), (2,2), (3,3), (1,1), (2,2), (5,1), (4,4);
steps:
  - sql: |
      SELECT DISTINCT y, x FROM ob ORDER BY y USING >, x USING <
    expect: rows
    order: ordered
    comment: descending on y, ascending on x
  - sql: |
      SELECT DISTINCT y FROM ob ORDER BY y DESC LIMIT 2
    expect: rows
    order: ordered
