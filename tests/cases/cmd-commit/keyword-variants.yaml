# WORK and TRANSACTION are optional noise words; AND [ NO ] CHAIN is the only part that changes what follows COMMIT.
id: cmd-commit.keyword-variants
title: COMMIT accepts WORK and TRANSACTION with and without AND CHAIN or AND NO CHAIN
family: cmd-commit
tier: core
feature_ids: [commit, begin, and-chain, transactions]
required_capabilities: [select, transactions]
provenance:
  source: pg-docs
  ref: "ref/commit.sgml#sql-commit (synopsis: COMMIT [ WORK | TRANSACTION ] [ AND [ NO ] CHAIN ]; Parameters: WORK, TRANSACTION)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      COMMIT
    expect: ok
    comment: bare COMMIT
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      COMMIT WORK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      COMMIT TRANSACTION
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      commit work and no chain
    expect: ok
    comment: keywords are case-insensitive and AND NO CHAIN starts no new block
  - sql: |
      SELECT 1 AS one
    expect: rows
    order: ordered
    comment: autocommit again after AND NO CHAIN
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      COMMIT TRANSACTION AND CHAIN
    expect: ok
    comment: a new block is started with the same characteristics
  - sql: |
      SELECT 2 AS two
    expect: rows
    order: ordered
    comment: this statement runs inside the chained block
  - sql: |
      ROLLBACK
    expect: ok
    comment: ends the chained block
