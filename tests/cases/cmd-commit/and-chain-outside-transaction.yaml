# AND CHAIN has no transaction to chain from when none is open, so it is an error rather than a warning.
id: cmd-commit.and-chain-outside-transaction
title: COMMIT AND CHAIN outside a transaction block is an error and starts no block
family: cmd-commit
tier: core
feature_ids: [commit, and-chain, transactions]
required_capabilities: [select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/commit.sgml#sql-commit (Notes: COMMIT AND CHAIN when not inside a transaction is an error)"
sessions: [a]
steps:
  - sql: |
      COMMIT AND CHAIN
    expect: error
    sqlstate: "25P01"
    comment: message is COMMIT AND CHAIN can only be used in transaction blocks
  - sql: |
      SELECT current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
    comment: no block was started, so the session is still in autocommit
  - sql: |
      COMMIT AND NO CHAIN
    expect: notice
    comment: without CHAIN the same statement only warns
