# WORK and TRANSACTION are alternatives, not a sequence; combining them is a syntax error that starts no block.
id: cmd-commit.syntax-error-keywords
title: COMMIT WORK TRANSACTION is a syntax error and leaves the session in autocommit
family: cmd-commit
tier: core
feature_ids: [commit, errors, transactions]
required_capabilities: [select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/commit.sgml#sql-commit (synopsis: COMMIT [ WORK | TRANSACTION ] [ AND [ NO ] CHAIN ])"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      COMMIT WORK TRANSACTION
    expect: error
    sqlstate: "42601"
    comment: the statement fails to parse and the open block is marked aborted
  - sql: |
      ROLLBACK
    expect: ok
    comment: ends the aborted block
  - sql: |
      SELECT 3 AS three
    expect: rows
    order: ordered
