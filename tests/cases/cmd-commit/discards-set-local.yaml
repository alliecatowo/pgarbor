# A SET LOCAL value lasts only until the transaction ends, so COMMIT restores the session's prior value.
id: cmd-commit.discards-set-local
title: COMMIT ends SET LOCAL scope, so the custom setting reverts to its prior empty value
family: cmd-commit
tier: extended
feature_ids: [commit, set-local, guc, transactions]
required_capabilities: [select, transactions, guc]
provenance:
  source: pg-docs
  ref: "ref/commit.sgml#sql-commit (Description: commits the current transaction); ref/set.sgml (SET LOCAL lasts until transaction end)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET LOCAL commitprobe.flag = 'x'
    expect: ok
  - sql: |
      SELECT current_setting('commitprobe.flag') AS inside
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('commitprobe.flag') AS after
    expect: rows
    order: ordered
    comment: SET LOCAL scope ended with the transaction
