# COMMIT on an aborted block succeeds as a rollback: it reports ROLLBACK, not an error, and discards the block's writes.
id: cmd-commit.failed-block-commit-rolls-back
title: COMMIT in an aborted block reports ROLLBACK and discards the writes made before the error
family: cmd-commit
tier: core
feature_ids: [commit, begin, errors, transactions, insert]
required_capabilities: [create-table, insert, select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/commit.sgml#sql-commit (Description: commits the current transaction; Notes: use ROLLBACK to abort)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2)
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      COMMIT
    expect: ok
    comment: no error is raised; the tag is ROLLBACK
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: only the row that existed before BEGIN remains
