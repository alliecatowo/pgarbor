# AND CHAIN starts a new block with the isolation level and read-only mode of the block just committed.
id: cmd-commit.and-chain-keeps-characteristics
title: COMMIT AND CHAIN carries isolation level and read-only mode into the next block
family: cmd-commit
tier: core
feature_ids: [commit, and-chain, isolation-level, read-only, transactions, guc, errors]
required_capabilities: [create-table, insert, select, transactions, guc, errors]
provenance:
  source: pg-docs
  ref: "ref/commit.sgml#sql-commit (Parameters: AND CHAIN, same transaction characteristics as the just finished one)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY
    expect: ok
  - sql: |
      COMMIT AND CHAIN
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso, current_setting('transaction_read_only') AS ro
    expect: rows
    order: ordered
    comment: the chained block reports the characteristics of the previous block
  - sql: |
      INSERT INTO t VALUES (1)
    expect: error
    sqlstate: "25006"
    comment: read-only mode is still enforced in the chained block
  - sql: |
      COMMIT
    expect: ok
    comment: reports ROLLBACK because the chained block was aborted by the error
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    order: ordered
