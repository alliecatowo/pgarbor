# SET TRANSACTION inside a block sets the characteristics that AND CHAIN carries forward.
id: cmd-commit.and-chain-set-transaction
title: COMMIT AND CHAIN carries a level set with SET TRANSACTION into the next block
family: cmd-commit
tier: core
feature_ids: [commit, and-chain, set-transaction, isolation-level, guc, transactions]
required_capabilities: [select, transactions, guc]
provenance:
  source: pg-docs
  ref: "ref/commit.sgml#sql-commit (AND CHAIN refers to SET TRANSACTION characteristics)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SET TRANSACTION ISOLATION LEVEL SERIALIZABLE
    expect: ok
  - sql: |
      COMMIT AND CHAIN
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT current_setting('transaction_isolation') AS iso
    expect: rows
    order: ordered
    comment: after the chained block ends with a plain COMMIT, the session default applies again
