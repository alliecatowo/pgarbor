# brin_summarize_new_values given a table name (not an index) must raise an error.
id: brin.summarize-new-values-not-index
title: brin_summarize_new_values rejects a table name
family: brin
tier: core
feature_ids: [brin, brin-maintenance-functions, errors]
required_capabilities: [create-table, brin-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/brin.sql (brin_summarize_new_values('brintest') error, not an index)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
steps:
  - sql: |
      SELECT brin_summarize_new_values('t')
    expect: error
    sqlstate: "42809"
    comment: '"t" is not an index'
