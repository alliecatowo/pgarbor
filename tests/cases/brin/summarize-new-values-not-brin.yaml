# brin_summarize_new_values given a btree index must raise an error (not a BRIN index).
id: brin.summarize-new-values-not-brin
title: brin_summarize_new_values rejects a btree index
family: brin
tier: core
feature_ids: [brin, brin-maintenance-functions, btree-index, errors]
required_capabilities: [create-table, create-index, btree-index, brin-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/brin.sql (brin_summarize_new_values('tenk1_unique1') error, not a BRIN index)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4 PRIMARY KEY);
steps:
  - sql: |
      SELECT brin_summarize_new_values('t_pkey')
    expect: error
    sqlstate: "0A000"
    comment: '"t_pkey" is not a BRIN index; sqlstate believed to be feature_not_supported, recorder verifies'
