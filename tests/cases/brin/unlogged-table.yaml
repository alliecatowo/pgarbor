# BRIN index on an UNLOGGED table: builds, accepts inserts and answers queries.
id: brin.unlogged-table
title: BRIN index on an unlogged table builds, accepts inserts and answers queries
family: brin
tier: extended
feature_ids: [brin, create-index, unlogged-tables, insert, select]
required_capabilities: [create-table, insert, select, create-index, brin-index]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/brin.sql (brinidx_unlogged on brintest_unlogged)"
sessions: [a]
setup: |
  CREATE UNLOGGED TABLE t (n int4);
  CREATE INDEX t_unlogged_brin ON t USING brin (n);
  INSERT INTO t VALUES (1), (2), (NULL);
steps:
  - sql: |
      INSERT INTO t SELECT g FROM generate_series(3, 40) g
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t WHERE n <= 10
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*) AS n FROM t WHERE n IS NULL
    expect: rows
    order: multiset
