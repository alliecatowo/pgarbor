# brin_summarize_new_values on a BRIN index with nothing new to summarize returns 0.
id: brin.summarize-new-values-noop
title: brin_summarize_new_values on a fully summarized BRIN index reports zero new ranges
family: brin
tier: core
feature_ids: [brin, brin-maintenance-functions, select]
required_capabilities: [create-table, insert, select, create-index, brin-index]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/brin.sql (brin_summarize_new_values('brinidx') ok, no change expected)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4) WITH (fillfactor = 10, autovacuum_enabled = off);
  INSERT INTO t SELECT g FROM generate_series(1, 100) g;
  CREATE INDEX t_brin ON t USING brin (a) WITH (pages_per_range = 1);
  VACUUM t;
steps:
  - sql: |
      SELECT brin_summarize_new_values('t_brin')
    expect: rows
    order: multiset
    comment: value is the number of ranges summarized; expected 0 here
