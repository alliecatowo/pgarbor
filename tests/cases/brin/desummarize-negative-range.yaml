# brin_desummarize_range with a negative block number is an out-of-range error.
id: brin.desummarize-negative-range
title: brin_desummarize_range rejects a negative range block number
family: brin
tier: core
feature_ids: [brin, brin-maintenance-functions, errors]
required_capabilities: [create-table, insert, create-index, brin-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/brin.sql (brin_desummarize_range('brinidx', -1) error, invalid range)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
  INSERT INTO t SELECT g FROM generate_series(1, 50) g;
  CREATE INDEX t_brin ON t USING brin (a) WITH (pages_per_range = 1);
steps:
  - sql: |
      SELECT brin_desummarize_range('t_brin', -1)
    expect: error
    sqlstate: "22003"
    comment: 'block number out of range: -1'
