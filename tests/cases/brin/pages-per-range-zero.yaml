# pages_per_range must be at least 1; zero is rejected at CREATE INDEX time.
id: brin.pages-per-range-zero
title: CREATE INDEX rejects pages_per_range = 0
family: brin
tier: extended
feature_ids: [brin, create-index, errors, reloptions, catalog-introspection]
required_capabilities: [create-table, create-index, brin-index, errors, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/brin.sql (brin index with pages_per_range option)"
sessions: [a]
setup: |
  CREATE TABLE t (a int4);
steps:
  - sql: |
      CREATE INDEX t_brin_bad ON t USING brin (a) WITH (pages_per_range = 0)
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT count(*) AS n FROM pg_class WHERE relname = 't_brin_bad'
    expect: rows
    order: multiset
    comment: the failed CREATE INDEX leaves no relation behind
