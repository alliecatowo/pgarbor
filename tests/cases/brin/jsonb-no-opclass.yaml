# brin has no default operator class for jsonb; CREATE INDEX must fail without a usable opclass.
id: brin.jsonb-no-opclass
title: CREATE INDEX USING brin on jsonb column fails with undefined_object
family: brin
tier: extended
feature_ids: [brin, create-index, jsonb, errors]
required_capabilities: [create-table, create-index, brin-index, jsonb, errors]
provenance:
  source: hand
  ref: "PG18 docs brin-builtin-opclasses; errcode 42704 undefined_object"
sessions: [a]
setup: |
  CREATE TABLE t (j jsonb);
steps:
  - sql: |
      CREATE INDEX t_j_brin ON t USING brin (j)
    expect: error
    sqlstate: "42704"
    comment: 'data type jsonb has no default operator class for access method "brin"'
