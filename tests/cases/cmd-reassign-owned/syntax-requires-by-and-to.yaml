# The grammar needs BY before the old-role list and TO before the new role; both omissions are syntax errors.
id: cmd-reassign-owned.syntax-requires-by-and-to
title: "REASSIGN OWNED without BY or without TO is a syntax error"
family: cmd-reassign-owned
tier: core
feature_ids: [reassign-owned, syntax, errors]
required_capabilities: [roles, errors]
provenance:
  source: pg-docs
  ref: "ref/reassign_owned.sgml#sql-reassign-owned-synopsis"
sessions: [a]
setup: |
  CREATE ROLE ro17_old;
  CREATE ROLE ro17_new;
steps:
  - sql: |
      REASSIGN OWNED ro17_old TO ro17_new
    expect: error
    sqlstate: "42601"
    comment: BY is required
  - sql: |
      REASSIGN OWNED BY ro17_old
    expect: error
    sqlstate: "42601"
    comment: TO is required
  - sql: |
      DROP ROLE ro17_old; DROP ROLE ro17_new
    expect: ok
    comment: cleanup
