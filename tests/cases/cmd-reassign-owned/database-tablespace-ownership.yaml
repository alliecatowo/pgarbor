# REASSIGN OWNED also changes owners of shared objects (databases and tablespaces) and of objects in other databases.
# Not runnable against the per-case isolated oracle database: the effect is cluster-wide and would alter shared catalogs
# used by other cases. Kept as a record of the documented behavior until a dedicated disposable cluster target exists.
id: cmd-reassign-owned.database-tablespace-ownership
title: "REASSIGN OWNED reassigns databases and tablespaces owned by the old role and not other databases"
family: cmd-reassign-owned
tier: extended
feature_ids: [reassign-owned, databases, tablespaces, shared-objects]
required_capabilities: [roles, create-database, create-tablespace]
provenance:
  source: pg-docs
  ref: "ref/reassign_owned.sgml#sql-reassign-owned-parameters (shared objects: databases, tablespaces)"
sessions: [a]
quarantine:
  reason: "cluster-shared effect (databases and tablespaces owned by the role) cannot be isolated to a per-case database; needs a dedicated disposable cluster target"
steps:
  - sql: |
      SELECT 1
    expect: ok
