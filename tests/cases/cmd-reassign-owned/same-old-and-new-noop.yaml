# Reassigning a role's objects to that same role is accepted and changes nothing.
id: cmd-reassign-owned.same-old-and-new-noop
title: "REASSIGN OWNED BY a role to itself succeeds and leaves ownership unchanged"
family: cmd-reassign-owned
tier: core
feature_ids: [reassign-owned, ownership]
required_capabilities: [roles, create-table, select, errors, catalog-introspection]
provenance:
  source: hand
  ref: "ref/reassign_owned.sgml#sql-reassign-owned-parameters (old_role and new_role may be the same)"
sessions: [a]
setup: |
  CREATE ROLE ro13_r;
  CREATE TABLE ro13_t (a int4);
  ALTER TABLE ro13_t OWNER TO ro13_r;
steps:
  - sql: |
      REASSIGN OWNED BY ro13_r TO ro13_r
    expect: ok
  - sql: |
      SELECT pg_get_userbyid(relowner) AS owner FROM pg_class WHERE relname = 'ro13_t'
    expect: rows
    order: ordered
  - sql: |
      DROP OWNED BY ro13_r; DROP ROLE ro13_r
    expect: ok
    comment: cleanup
