# Enum types are distinct: comparing two different enum types has no operator (datatype.sgml#datatype-enum-type-safety).
id: doc-datatype-enum.cross-type-operator-error
title: Comparing values of two different enum types is rejected with no operator
family: doc-datatype-enum
tier: core
feature_ids: [enum-type, enum-type-safety, join, error-undefined-function]
required_capabilities: [create-type, create-table, insert, select, join]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-type-safety"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
  CREATE TYPE happiness AS ENUM ('happy', 'very happy', 'ecstatic');
  CREATE TABLE person (name text, current_mood mood);
  CREATE TABLE holidays (num_weeks integer, happiness happiness);
  INSERT INTO person VALUES ('Moe', 'happy');
  INSERT INTO holidays VALUES (4, 'happy')
steps:
  - sql: |
      SELECT person.name, holidays.num_weeks FROM person, holidays
      WHERE person.current_mood = holidays.happiness
    expect: error
    sqlstate: "42883"
    comment: "documented ERROR: operator does not exist: mood = happiness"
  - sql: |
      SELECT person.name FROM person WHERE person.current_mood = 'happy'
    expect: rows
    order: multiset
    comment: same-type comparison against a literal still works afterwards
