# CREATE TYPE ... AS ENUM, use as a column type, equality against a literal (datatype.sgml#datatype-enum-declaration).
id: doc-datatype-enum.declaration-and-equality
title: CREATE TYPE AS ENUM, insert labels into a column, filter with equality
family: doc-datatype-enum
tier: core
feature_ids: [enum-type, create-type, enum-column, enum-equality]
required_capabilities: [create-type, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-declaration"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
      CREATE TABLE person (name text, current_mood mood);
      INSERT INTO person VALUES ('Moe', 'happy')
    expect: ok
  - sql: |
      SELECT * FROM person WHERE current_mood = 'happy'
    expect: rows
    order: multiset
    comment: documented example; result is Moe / happy
  - sql: |
      SELECT name, current_mood::text AS label FROM person WHERE current_mood = 'sad'
    expect: rows
    order: multiset
    comment: no row matches; the empty result is recorded as-is
