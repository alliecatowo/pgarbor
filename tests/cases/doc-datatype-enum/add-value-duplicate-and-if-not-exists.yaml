# ADD VALUE of an existing label fails unless IF NOT EXISTS is given (datatype.sgml#datatype-enum-implementation-details).
id: doc-datatype-enum.add-value-duplicate-and-if-not-exists
title: ADD VALUE on an existing label errors (42710) or is skipped with IF NOT EXISTS
family: doc-datatype-enum
tier: core
feature_ids: [enum-alter-add-value, alter-type, if-not-exists, error-duplicate-object]
required_capabilities: [create-type, alter-type, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-implementation-details"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy')
steps:
  - sql: |
      ALTER TYPE mood ADD VALUE 'ok'
    expect: error
    sqlstate: "42710"
    comment: label already exists
  - sql: |
      ALTER TYPE mood ADD VALUE IF NOT EXISTS 'ok'
    expect: ok
    comment: emits a NOTICE that the label is skipped; the enum is unchanged
  - sql: |
      SELECT enumlabel FROM pg_enum WHERE enumtypid = 'mood'::regtype ORDER BY enumsortorder
    expect: rows
    order: ordered
    comment: still exactly sad, ok, happy
