# A label not declared for the enum type is rejected on input (datatype.sgml#datatype-enum-type-safety).
id: doc-datatype-enum.invalid-label-rejected
title: Inserting a label not in the enum type fails with invalid input (22P02)
family: doc-datatype-enum
tier: core
feature_ids: [enum-type, enum-input-validation, error-invalid-text-representation]
required_capabilities: [create-type, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-type-safety"
sessions: [a]
setup: |
  CREATE TYPE happiness AS ENUM ('happy', 'very happy', 'ecstatic');
  CREATE TABLE holidays (num_weeks integer, happiness happiness)
steps:
  - sql: |
      INSERT INTO holidays(num_weeks,happiness) VALUES (4, 'happy');
      INSERT INTO holidays(num_weeks,happiness) VALUES (6, 'very happy');
      INSERT INTO holidays(num_weeks,happiness) VALUES (8, 'ecstatic')
    expect: ok
  - sql: |
      INSERT INTO holidays(num_weeks,happiness) VALUES (2, 'sad')
    expect: error
    sqlstate: "22P02"
    comment: "documented ERROR: invalid input value for enum happiness: sad"
  - sql: |
      SELECT count(*) AS n FROM holidays
    expect: rows
    order: multiset
    comment: the rejected insert left no row behind
