# Existing enum values cannot be removed, short of dropping and re-creating the type (datatype.sgml#datatype-enum-implementation-details).
id: doc-datatype-enum.drop-value-not-supported
title: Removing an existing enum label is not supported and leaves the type unchanged
family: doc-datatype-enum
tier: core
feature_ids: [enum-drop-value, alter-type, error-feature-not-supported]
required_capabilities: [create-type, alter-type, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-implementation-details"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy')
steps:
  - sql: |
      ALTER TYPE mood DROP VALUE 'sad'
    expect: error
    sqlstate: "0A000"
    comment: dropping an enum value is not implemented
  - sql: |
      SELECT enumlabel FROM pg_enum WHERE enumtypid = 'mood'::regtype ORDER BY enumsortorder
    expect: rows
    order: ordered
    comment: label sad is still present
