# The label limit is in bytes, not characters: 31 two-byte characters (62 bytes) fit, 32 (64 bytes) do not.
id: doc-datatype-enum.label-length-multibyte
title: Enum label length limit counts bytes, so multibyte labels hit it sooner
family: doc-datatype-enum
tier: extended
feature_ids: [enum-label-length, multibyte-encoding, create-type, error-invalid-name]
required_capabilities: [create-type, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-implementation-details"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE lbl_mb AS ENUM ('ééééééééééééééééééééééééééééééé')
    expect: ok
    comment: 31 characters of 2 bytes each is 62 bytes
  - sql: |
      SELECT char_length(enumlabel) AS chars, octet_length(enumlabel) AS bytes
      FROM pg_enum WHERE enumtypid = 'lbl_mb'::regtype
    expect: rows
    order: multiset
  - sql: |
      CREATE TYPE lbl_mb2 AS ENUM ('éééééééééééééééééééééééééééééééé')
    expect: error
    sqlstate: "42602"
    comment: 32 characters of 2 bytes each is 64 bytes, over the 63-byte limit
