# Labels are limited to 63 bytes (NAMEDATALEN-1) in standard builds; 63 is accepted, 64 is rejected (datatype.sgml#datatype-enum-implementation-details).
id: doc-datatype-enum.label-length-63-bytes
title: Enum label of exactly 63 bytes is accepted and 64 bytes is rejected
family: doc-datatype-enum
tier: core
feature_ids: [enum-label-length, name-length-limit, create-type, error-invalid-name]
required_capabilities: [create-type, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-implementation-details"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE lbl63 AS ENUM ('aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
    expect: ok
  - sql: |
      SELECT length(enumlabel) AS chars, octet_length(enumlabel) AS bytes
      FROM pg_enum WHERE enumtypid = 'lbl63'::regtype
    expect: rows
    order: multiset
  - sql: |
      CREATE TYPE lbl64 AS ENUM ('aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')
    expect: error
    sqlstate: "42602"
    comment: documented limit is 63 bytes; the rejected type must not exist
  - sql: |
      SELECT count(*) AS n FROM pg_type WHERE typname = 'lbl64'
    expect: rows
    order: multiset
