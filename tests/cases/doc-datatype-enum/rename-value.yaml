# Enum labels can be renamed in place; the stored values follow the rename (datatype.sgml#datatype-enum-implementation-details).
id: doc-datatype-enum.rename-value
title: ALTER TYPE RENAME VALUE changes the label while keeping stored rows and order
family: doc-datatype-enum
tier: core
feature_ids: [enum-rename-value, alter-type, enum-ordering]
required_capabilities: [create-type, alter-type, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-implementation-details"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
  CREATE TABLE person (name text, current_mood mood);
  INSERT INTO person VALUES ('Moe', 'happy'), ('Larry', 'sad'), ('Curly', 'ok')
steps:
  - sql: |
      ALTER TYPE mood RENAME VALUE 'ok' TO 'fine'
    expect: ok
  - sql: |
      SELECT name, current_mood::text AS label FROM person ORDER BY current_mood
    expect: rows
    order: ordered
    comment: Curly keeps his row and now shows fine, still between sad and happy
  - sql: |
      ALTER TYPE mood RENAME VALUE 'nonesuch' TO 'x'
    expect: error
    sqlstate: "22023"
    comment: renaming a label that does not exist
  - sql: |
      ALTER TYPE mood RENAME VALUE 'fine' TO 'happy'
    expect: error
    sqlstate: "42710"
    comment: renaming onto an existing label
