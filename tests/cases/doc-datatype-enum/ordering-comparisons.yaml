# Enum ordering follows declaration order, not alphabetical order (datatype.sgml#datatype-enum-ordering).
id: doc-datatype-enum.ordering-comparisons
title: Enum comparison operators, ORDER BY and MIN follow declaration order
family: doc-datatype-enum
tier: core
feature_ids: [enum-ordering, enum-comparison, aggregate-min, order-by]
required_capabilities: [create-type, create-table, insert, select, aggregates, subselect]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-ordering"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
  CREATE TABLE person (name text, current_mood mood);
  INSERT INTO person VALUES ('Moe', 'happy')
steps:
  - sql: |
      INSERT INTO person VALUES ('Larry', 'sad');
      INSERT INTO person VALUES ('Curly', 'ok')
    expect: ok
  - sql: |
      SELECT * FROM person WHERE current_mood > 'sad'
    expect: rows
    order: multiset
    comment: Moe (happy) and Curly (ok) are greater than sad
  - sql: |
      SELECT * FROM person WHERE current_mood > 'sad' ORDER BY current_mood
    expect: rows
    order: ordered
    comment: ok sorts before happy
  - sql: |
      SELECT name FROM person WHERE current_mood = (SELECT MIN(current_mood) FROM person)
    expect: rows
    order: multiset
    comment: MIN of the enum is sad, the first declared label
  - sql: |
      SELECT min(current_mood)::text AS lo, max(current_mood)::text AS hi FROM person
    expect: rows
    order: multiset
