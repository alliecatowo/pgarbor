# Labels and their sort positions live in pg_enum (datatype.sgml#datatype-enum-implementation-details); querying it directly is supported.
id: doc-datatype-enum.pg-enum-catalog-introspection
title: pg_enum lists each label of an enum type with a sort position
family: doc-datatype-enum
tier: extended
feature_ids: [enum-catalog, pg-enum, alter-type, catalog-introspection]
required_capabilities: [create-type, alter-type, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-implementation-details"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy')
steps:
  - sql: |
      SELECT e.enumlabel AS label FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid
      WHERE t.typname = 'mood' ORDER BY e.enumsortorder
    expect: rows
    order: ordered
    comment: labels in declaration order
  - sql: |
      ALTER TYPE mood ADD VALUE 'meh' BEFORE 'ok'
    expect: ok
  - sql: |
      SELECT e.enumlabel AS label FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid
      WHERE t.typname = 'mood' ORDER BY e.enumsortorder
    expect: rows
    order: ordered
    comment: the catalog reflects the inserted position
  - sql: |
      SELECT count(*) AS n FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid WHERE t.typname = 'mood'
    expect: rows
    order: multiset
