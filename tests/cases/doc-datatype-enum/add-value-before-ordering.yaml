# ALTER TYPE ... ADD VALUE inserts a label at a chosen position; sort order follows it (datatype.sgml#datatype-enum-implementation-details).
id: doc-datatype-enum.add-value-before-ordering
title: ALTER TYPE ADD VALUE BEFORE places the new label in sort order
family: doc-datatype-enum
tier: core
feature_ids: [enum-alter-add-value, enum-ordering, alter-type]
required_capabilities: [create-type, alter-type, create-table, insert, select]
provenance:
  source: pg-docs
  ref: "datatype.sgml#datatype-enum-implementation-details"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('sad', 'ok', 'happy');
  CREATE TABLE person (name text, current_mood mood);
  INSERT INTO person VALUES ('Moe', 'happy'), ('Larry', 'sad'), ('Curly', 'ok')
steps:
  - sql: |
      ALTER TYPE mood ADD VALUE 'meh' BEFORE 'ok'
    expect: ok
  - sql: |
      SELECT DISTINCT current_mood AS m, current_mood::text AS label FROM person ORDER BY m
    expect: rows
    order: ordered
    comment: present labels in sort order; meh is not used yet
  - sql: |
      SELECT unnest(enum_range(NULL::mood))::text AS lbl
    expect: rows
    order: ordered
    comment: enum_range is ordered by declaration order; meh sits between sad and ok
  - sql: |
      UPDATE person SET current_mood = 'meh' WHERE name = 'Curly'
    expect: ok
  - sql: |
      SELECT name, current_mood::text AS label FROM person WHERE current_mood < 'happy' ORDER BY current_mood
    expect: rows
    order: ordered
    comment: Larry (sad) sorts before Curly (meh), which sorts before Moe (happy)
