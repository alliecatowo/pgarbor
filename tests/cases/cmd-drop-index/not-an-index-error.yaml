# DROP INDEX only accepts index names: naming a table or the primary key constraint index is refused.
id: cmd-drop-index.not-an-index-error
title: DROP INDEX on a table name fails with 42809 and on a missing name with 42704
family: cmd-drop-index
tier: core
feature_ids: [drop-index, errors, object-kinds]
required_capabilities: [create-table, create-index, select, errors]
provenance:
  source: pg-docs
  ref: "ref/drop_index.sgml#sql-dropindex (Description: drops an existing index)"
sessions: [a]
setup: |
  CREATE TABLE widgets (id int4 PRIMARY KEY, label text);
steps:
  - sql: |
      DROP INDEX widgets
    expect: error
    sqlstate: "42809"
    comment: a table is not an index; the hint points to DROP TABLE
  - sql: |
      DROP INDEX no_such_index
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT relname FROM pg_class WHERE relname = 'widgets'
    expect: rows
    order: ordered
    comment: the failed drop left the table in place
