# Documented example: DROP INDEX title_idx removes the index and leaves the table and its rows intact.
id: cmd-drop-index.basic-title-idx
title: DROP INDEX removes the documented title_idx example index and keeps table data
family: cmd-drop-index
tier: core
feature_ids: [drop-index, index-catalog]
required_capabilities: [create-table, create-index, insert, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_index.sgml#sql-dropindex (Examples: DROP INDEX title_idx)"
sessions: [a]
setup: |
  CREATE TABLE films (id int4 PRIMARY KEY, title text);
  CREATE INDEX title_idx ON films (title);
  INSERT INTO films VALUES (1, 'Alien'), (2, 'Brazil'), (3, 'Casablanca');
steps:
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'films' ORDER BY indexname
    expect: rows
    order: ordered
    comment: before the drop, title_idx and films_pkey exist
  - sql: |
      DROP INDEX title_idx
    expect: ok
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'films' ORDER BY indexname
    expect: rows
    order: ordered
    comment: only the primary key index remains
  - sql: |
      SELECT id, title FROM films ORDER BY id
    expect: rows
    order: ordered
    comment: table contents are unaffected by dropping an index
