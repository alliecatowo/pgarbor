# DROP INDEX CONCURRENTLY IF EXISTS on a missing single name is a notice; the existing index is untouched.
id: cmd-drop-index.concurrently-if-exists
title: DROP INDEX CONCURRENTLY IF EXISTS skips a missing index with a notice
family: cmd-drop-index
tier: core
feature_ids: [drop-index, concurrently, if-exists, notices]
required_capabilities: [create-table, create-index, select, errors, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/drop_index.sgml#sql-dropindex (Parameters: IF EXISTS; CONCURRENTLY)"
sessions: [a]
setup: |
  CREATE TABLE logs (id int4 PRIMARY KEY, level text);
  CREATE INDEX logs_level_idx ON logs (level);
steps:
  - sql: |
      DROP INDEX CONCURRENTLY IF EXISTS no_such_idx
    expect: notice
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'logs' ORDER BY indexname
    expect: rows
    order: ordered
  - sql: |
      DROP INDEX CONCURRENTLY IF EXISTS logs_level_idx
    expect: ok
  - sql: |
      SELECT indexname FROM pg_indexes WHERE tablename = 'logs' ORDER BY indexname
    expect: rows
    order: ordered
