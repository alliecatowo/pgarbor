# The documented example: DROP POLICY p1 ON my_table removes the policy from the table.
id: cmd-drop-policy.documented-example
title: "DROP POLICY removes the named policy from its table, including the pg_policy row"
family: cmd-drop-policy
tier: core
feature_ids: [drop-policy, policies, ddl]
required_capabilities: [create-table, select, rls, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_policy.sgml#sql-droppolicy (Examples)"
sessions: [a]
setup: |
  CREATE TABLE my_table (id int4, v int4);
  CREATE POLICY p1 ON my_table USING (v > 0);
steps:
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 'my_table' ORDER BY 1
    expect: rows
    order: ordered
    comment: p1 is present before the drop
  - sql: |
      DROP POLICY p1 ON my_table;
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM pg_policies WHERE tablename = 'my_table'
    expect: rows
  - sql: |
      SELECT count(*) AS n FROM pg_policy WHERE polrelid = 'my_table'::regclass
    expect: rows
    comment: the catalog row is gone as well
  - sql: |
      SELECT relrowsecurity FROM pg_class WHERE relname = 'my_table'
    expect: rows
    comment: dropping the policy does not turn RLS on or off; RLS was never enabled here
