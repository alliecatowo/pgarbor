# DROP POLICY is transactional: a rollback restores the policy, a commit removes it, and an error aborts the block.
id: cmd-drop-policy.transaction-rollback
title: "DROP POLICY inside transaction blocks: rollback restores, commit removes, error aborts"
family: cmd-drop-policy
tier: core
feature_ids: [drop-policy, policies, transactions, errors]
required_capabilities: [create-table, select, rls, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_policy.sgml#sql-droppolicy (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v int4);
  CREATE POLICY p1 ON t USING (v > 0);
  CREATE POLICY p2 ON t USING (v > 1);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP POLICY p1 ON t
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 't' ORDER BY 1
    expect: rows
    order: ordered
    comment: p1 is gone inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 't' ORDER BY 1
    expect: rows
    order: ordered
    comment: the rollback restored p1
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP POLICY p2 ON t
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 't' ORDER BY 1
    expect: rows
    order: ordered
    comment: the committed drop removed p2
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP POLICY nothere ON t
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
    comment: the block is aborted and rejects further commands
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 't' ORDER BY 1
    expect: rows
    order: ordered
    comment: p1 is still the only policy
