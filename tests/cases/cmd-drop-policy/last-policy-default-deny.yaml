# With RLS enabled, dropping the last policy leaves the default-deny behavior: a non-owner role sees no rows.
id: cmd-drop-policy.last-policy-default-deny
title: "Dropping the last policy on an RLS table makes it default-deny for non-owner roles"
family: cmd-drop-policy
tier: core
feature_ids: [drop-policy, policies, rls, default-deny]
required_capabilities: [create-table, insert, select, rls, roles, privileges, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/drop_policy.sgml#sql-droppolicy (Description: default-deny policy)"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_dp_reader;
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (1, 1), (2, -1), (3, 5);
  GRANT SELECT ON t TO pgarbor_case_dp_reader;
  ALTER TABLE t ENABLE ROW LEVEL SECURITY;
  CREATE POLICY p1 ON t FOR SELECT USING (v > 0);
  CREATE POLICY p2 ON t FOR SELECT USING (v > 4);
steps:
  - sql: |
      SET ROLE pgarbor_case_dp_reader
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the permissive policies OR together, so rows 1 and 3 are visible
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP POLICY p2 ON t
    expect: ok
  - sql: |
      SET ROLE pgarbor_case_dp_reader
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: p1 alone still admits rows 1 and 3
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP POLICY p1 ON t
    expect: ok
  - sql: |
      SET ROLE pgarbor_case_dp_reader
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: no policies left while RLS is enabled, so default deny returns zero rows
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT count(*) AS n FROM t
    expect: rows
    comment: the table owner bypasses RLS, so the owner still sees all rows
