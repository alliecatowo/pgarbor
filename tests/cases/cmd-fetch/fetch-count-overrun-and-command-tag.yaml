id: cmd-fetch.fetch-count-overrun-and-command-tag
title: FETCH counts larger than the remaining rows return what remains; the command tag reports the row count
family: cmd-fetch
tier: core
feature_ids: [fetch, fetch-count, command-tag, fetch-forward]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/fetch.sgml#sql-fetch (Outputs; Parameters: count)"
sessions: [a]
setup: |
  CREATE TABLE nums (n int4 PRIMARY KEY);
  INSERT INTO nums VALUES (1), (2), (3), (4), (5);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH 3 FROM c
    expect: rows
    order: ordered
    comment: tag FETCH 3
  - sql: |
      FETCH 3 FROM c
    expect: rows
    order: ordered
    comment: only two rows remain, tag FETCH 2
  - sql: |
      FETCH 3 FROM c
    expect: rows
    order: ordered
    comment: nothing remains, tag FETCH 0
  - sql: |
      FETCH FORWARD 10 FROM c
    expect: rows
    order: ordered
    comment: still nothing, tag FETCH 0
  - sql: |
      COMMIT
    expect: ok
