id: cmd-fetch.fetch-no-scroll-rejects-backward-moves
title: NO SCROLL cursor allows forward moves only; zero-count and ABSOLUTE re-fetch of an earlier row fail
family: cmd-fetch
tier: core
feature_ids: [fetch, no-scroll-cursor, fetch-prior, fetch-last, fetch-relative, fetch-zero-count, fetch-absolute]
required_capabilities: [create-table, insert, select, transactions, cursors, errors]
provenance:
  source: pg-docs
  ref: "ref/fetch.sgml#sql-fetch (Notes: NO SCROLL; RELATIVE 0 / FORWARD 0 / BACKWARD 0)"
sessions: [a]
setup: |
  CREATE TABLE nums (n int4 PRIMARY KEY);
  INSERT INTO nums VALUES (1), (2), (3), (4), (5);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c NO SCROLL CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH 2 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH FORWARD 0 FROM c
    expect: error
    sqlstate: "55000"
    comment: the zero-count form is treated as a backward-capable fetch and rejected
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c NO SCROLL CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH 2 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH RELATIVE 0 FROM c
    expect: error
    sqlstate: "55000"
    comment: RELATIVE 0 is rejected on a NO SCROLL cursor after a row was fetched
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c NO SCROLL CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH 2 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH ABSOLUTE 1 FROM c
    expect: error
    sqlstate: "55000"
    comment: ABSOLUTE to an already-passed row needs a backward scan
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c NO SCROLL CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH ABSOLUTE 4 FROM c
    expect: rows
    order: ordered
    comment: a forward ABSOLUTE jump is allowed on NO SCROLL, row 4
  - sql: |
      FETCH PRIOR FROM c
    expect: error
    sqlstate: "55000"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c NO SCROLL CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH LAST FROM c
    expect: error
    sqlstate: "55000"
    comment: LAST scans backward, so it is rejected before any row is read
  - sql: |
      ROLLBACK
    expect: ok
