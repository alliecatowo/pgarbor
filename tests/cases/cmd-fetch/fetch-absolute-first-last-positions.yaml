id: cmd-fetch.fetch-absolute-first-last-positions
title: FETCH FIRST, LAST, ABSOLUTE with positive and negative counts, and out-of-range positions
family: cmd-fetch
tier: core
feature_ids: [fetch, fetch-first, fetch-last, fetch-absolute, scroll-cursor]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/fetch.sgml#sql-fetch (Parameters: FIRST, LAST, ABSOLUTE count)"
sessions: [a]
setup: |
  CREATE TABLE nums (n int4 PRIMARY KEY);
  INSERT INTO nums VALUES (1), (2), (3), (4), (5);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c SCROLL CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH LAST FROM c
    expect: rows
    order: ordered
    comment: LAST is ABSOLUTE -1, row 5
  - sql: |
      FETCH FIRST FROM c
    expect: rows
    order: ordered
    comment: FIRST is ABSOLUTE 1, row 1
  - sql: |
      FETCH ABSOLUTE 3 FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH ABSOLUTE -2 FROM c
    expect: rows
    order: ordered
    comment: the 2nd row from the end, row 4
  - sql: |
      FETCH ABSOLUTE 0 FROM c
    expect: rows
    order: ordered
    comment: positions before the first row, no row returned
  - sql: |
      FETCH ABSOLUTE 6 FROM c
    expect: rows
    order: ordered
    comment: out of range after the last row, no row returned
  - sql: |
      FETCH ABSOLUTE -6 FROM c
    expect: rows
    order: ordered
    comment: out of range before the first row, no row returned
  - sql: |
      FETCH ABSOLUTE 2 FROM c
    expect: rows
    order: ordered
    comment: recovers from the before-first position with a forward move
  - sql: |
      COMMIT
    expect: ok
