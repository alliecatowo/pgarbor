id: cmd-fetch.fetch-doc-liahona-example
title: "Documented liahona cursor example - FETCH FORWARD 5 then FETCH PRIOR"
family: cmd-fetch
tier: core
feature_ids: [fetch, fetch-forward, fetch-prior, declare-cursor, scroll-cursor, close]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/fetch.sgml#sql-fetch (Examples)"
sessions: [a]
setup: |
  CREATE TABLE films (code text, title text, did int, date_prod date, kind text, len interval);
  INSERT INTO films VALUES
    ('BL101', 'The Third Man', 101, '1949-12-23', 'Drama', '01:44'),
    ('BL102', 'The African Queen', 101, '1951-08-11', 'Romantic', '01:43'),
    ('JL201', 'Une Femme est une Femme', 102, '1961-03-12', 'Romantic', '01:25'),
    ('P_301', 'Vertigo', 103, '1958-11-14', 'Action', '02:08'),
    ('P_302', 'Becket', 103, '1964-02-03', 'Drama', '02:28'),
    ('P_303', 'Psycho', 103, '1960-06-16', 'Horror', '01:49');
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE liahona SCROLL CURSOR FOR SELECT * FROM films ORDER BY code
    expect: ok
  - sql: |
      FETCH FORWARD 5 FROM liahona
    expect: rows
    order: ordered
    comment: the first five rows in code order
  - sql: |
      FETCH PRIOR FROM liahona
    expect: rows
    order: ordered
    comment: cursor was on the fifth row, so PRIOR returns the fourth row P_301
  - sql: |
      CLOSE liahona
    expect: ok
  - sql: |
      COMMIT
    expect: ok
