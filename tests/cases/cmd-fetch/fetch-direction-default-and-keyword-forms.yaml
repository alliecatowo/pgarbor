id: cmd-fetch.fetch-direction-default-and-keyword-forms
title: FETCH with omitted direction, NEXT, FORWARD, FROM/IN/none, and FORWARD ALL without FROM
family: cmd-fetch
tier: core
feature_ids: [fetch, fetch-next, fetch-forward, fetch-default-direction, fetch-all, from-in-keyword]
required_capabilities: [create-table, insert, select, transactions, cursors]
provenance:
  source: pg-docs
  ref: "ref/fetch.sgml#sql-fetch (Parameters: direction, FROM | IN)"
sessions: [a]
setup: |
  CREATE TABLE nums (n int4 PRIMARY KEY);
  INSERT INTO nums VALUES (1), (2), (3), (4), (5);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DECLARE c CURSOR FOR SELECT n FROM nums ORDER BY n
    expect: ok
  - sql: |
      FETCH c
    expect: rows
    order: ordered
    comment: direction omitted defaults to NEXT, no FROM keyword
  - sql: |
      FETCH NEXT FROM c
    expect: rows
    order: ordered
  - sql: |
      FETCH IN c
    expect: rows
    order: ordered
    comment: IN is a PostgreSQL extension for FROM
  - sql: |
      FETCH FORWARD FROM c
    expect: rows
    order: ordered
    comment: FORWARD is the same as NEXT
  - sql: |
      FETCH FORWARD ALL c
    expect: rows
    order: ordered
    comment: remaining rows, no FROM keyword
  - sql: |
      FETCH NEXT FROM c
    expect: rows
    order: ordered
    comment: cursor is past the last row, so no row is returned
  - sql: |
      COMMIT
    expect: ok
