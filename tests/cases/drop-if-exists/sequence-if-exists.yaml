# DROP SEQUENCE IF EXISTS tolerates a missing sequence; plain DROP SEQUENCE does not.
id: drop-if-exists.sequence-if-exists
title: DROP SEQUENCE IF EXISTS on a missing sequence versus plain DROP SEQUENCE
family: drop-if-exists
tier: extended
feature_ids: [drop-if-exists, drop-sequence, sequences]
required_capabilities: [create-sequence, drop-sequence]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP SEQUENCE IF EXISTS test_sequence_exists
    expect: notice
  - sql: |
      CREATE SEQUENCE test_sequence_exists
    expect: ok
  - sql: |
      DROP SEQUENCE IF EXISTS test_sequence_exists
    expect: ok
  - sql: |
      DROP SEQUENCE test_sequence_exists
    expect: error
    sqlstate: "42P01"
