# DROP INDEX IF EXISTS on a missing index is a notice; without IF EXISTS it is an error.
id: drop-if-exists.index-if-exists-missing
title: DROP INDEX IF EXISTS on a missing index versus a plain DROP INDEX
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-index, btree-index]
required_capabilities: [create-table, create-index, drop-index]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
setup: |
  CREATE TABLE test_exists (a int, b text);
steps:
  - sql: |
      DROP INDEX test_index_exists
    expect: error
  - sql: |
      DROP INDEX IF EXISTS test_index_exists
    expect: notice
  - sql: |
      CREATE INDEX test_index_exists ON test_exists (a)
    expect: ok
  - sql: |
      DROP INDEX IF EXISTS test_index_exists
    expect: ok
  - sql: |
      DROP INDEX test_index_exists
    expect: error
