# DROP ROLE IF EXISTS with one missing role: the missing one is a notice; plain DROP ROLE errors with undefined_object.
id: drop-if-exists.role-if-exists-missing
title: DROP ROLE IF EXISTS with a missing role name
family: drop-if-exists
tier: extended
feature_ids: [drop-if-exists, drop-role, roles]
required_capabilities: [drop-role]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP ROLE pgarbor_die_missing_role
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP ROLE IF EXISTS pgarbor_die_missing_role
    expect: notice
  - sql: |
      DROP ROLE IF EXISTS pgarbor_die_missing_role_2
    expect: notice
