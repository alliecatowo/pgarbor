# DROP TRIGGER on a missing table or a missing trigger: IF EXISTS handles only the trigger, the table must exist or be tolerated.
id: drop-if-exists.trigger-if-exists-missing-table
title: DROP TRIGGER IF EXISTS on a missing relation and on a missing trigger
family: drop-if-exists
tier: extended
feature_ids: [drop-if-exists, drop-trigger, triggers]
required_capabilities: [create-table, drop-trigger]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
setup: |
  CREATE TABLE test_exists (a int, b text);
steps:
  - sql: |
      DROP TRIGGER test_trigger_exists ON no_such_table
    expect: error
    sqlstate: "42P01"
  - sql: |
      DROP TRIGGER IF EXISTS test_trigger_exists ON no_such_table
    expect: notice
  - sql: |
      DROP TRIGGER IF EXISTS test_trigger_exists ON test_exists
    expect: notice
  - sql: |
      DROP TRIGGER test_trigger_exists ON test_exists
    expect: error
    sqlstate: "42704"
