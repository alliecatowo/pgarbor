# DROP DOMAIN on a missing domain is undefined_object (42704); IF EXISTS makes it a notice.
id: drop-if-exists.domain-if-exists
title: DROP DOMAIN IF EXISTS on a missing domain and a present domain
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-domain, domains]
required_capabilities: [create-domain, drop-domain]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP DOMAIN test_domain_exists
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP DOMAIN IF EXISTS test_domain_exists
    expect: notice
  - sql: |
      CREATE DOMAIN test_domain_exists AS int NOT NULL CHECK (VALUE > 0)
    expect: ok
  - sql: |
      DROP DOMAIN IF EXISTS test_domain_exists
    expect: ok
