# DROP TABLE IF EXISTS on a missing table succeeds and only emits a notice.
id: drop-if-exists.table-if-exists-missing-notice
title: DROP TABLE IF EXISTS on a missing table is a notice, and the session continues
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-table, notices]
required_capabilities: [drop-table]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP TABLE IF EXISTS test_exists
    expect: notice
  - sql: |
      SELECT 1 AS still_running
    expect: rows
