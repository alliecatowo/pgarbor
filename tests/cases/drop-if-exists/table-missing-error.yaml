# DROP TABLE without IF EXISTS on a missing table is an error, not a no-op.
id: drop-if-exists.table-missing-error
title: DROP TABLE on a missing table raises undefined_table
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-table]
required_capabilities: [drop-table]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP TABLE test_exists
    expect: error
    sqlstate: "42P01"
