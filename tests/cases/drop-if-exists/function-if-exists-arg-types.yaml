# DROP FUNCTION IF EXISTS with a signature that does not exist is a notice; the exact signature drops cleanly.
id: drop-if-exists.function-if-exists-arg-types
title: DROP FUNCTION IF EXISTS with a non-matching argument list
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-function, functions, numeric]
required_capabilities: [create-function, drop-function]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP FUNCTION test_function_exists(int, text, int[])
    expect: error
    sqlstate: "42883"
  - sql: |
      DROP FUNCTION IF EXISTS test_function_exists(int, text, int[])
    expect: notice
  - sql: |
      CREATE FUNCTION die_fn(x int) RETURNS int AS $$ SELECT x + 1 $$ LANGUAGE sql
    expect: ok
  - sql: |
      DROP FUNCTION IF EXISTS die_fn(text)
    expect: notice
  - sql: |
      DROP FUNCTION IF EXISTS die_fn(int)
    expect: ok
