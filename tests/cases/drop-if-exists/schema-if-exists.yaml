# DROP SCHEMA on a missing schema is invalid_schema_name; IF EXISTS makes it a notice.
id: drop-if-exists.schema-if-exists
title: DROP SCHEMA IF EXISTS versus DROP SCHEMA on a missing schema
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-schema, schemas]
required_capabilities: [create-schema, drop-schema]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP SCHEMA test_schema_exists
    expect: error
    sqlstate: "3F000"
  - sql: |
      DROP SCHEMA IF EXISTS test_schema_exists
    expect: notice
  - sql: |
      CREATE SCHEMA test_schema_exists
    expect: ok
  - sql: |
      DROP SCHEMA IF EXISTS test_schema_exists
    expect: ok
  - sql: |
      DROP SCHEMA test_schema_exists
    expect: error
    sqlstate: "3F000"
