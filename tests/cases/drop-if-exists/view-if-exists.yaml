# DROP VIEW IF EXISTS: silent drop when present, notice when missing, error without IF EXISTS.
id: drop-if-exists.view-if-exists
title: DROP VIEW IF EXISTS drops a view, then the second drop is missing
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-view, views]
required_capabilities: [create-table, create-view, drop-view]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
setup: |
  CREATE TABLE test_exists (a int, b text);
steps:
  - sql: |
      DROP VIEW IF EXISTS test_view_exists
    expect: notice
  - sql: |
      CREATE VIEW test_view_exists AS SELECT * FROM test_exists
    expect: ok
  - sql: |
      DROP VIEW IF EXISTS test_view_exists
    expect: ok
  - sql: |
      DROP VIEW test_view_exists
    expect: error
    sqlstate: "42P01"
