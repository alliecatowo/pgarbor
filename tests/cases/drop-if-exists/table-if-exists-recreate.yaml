# DROP TABLE IF EXISTS then CREATE with the same name: data written before the drop is gone, and the recreated table starts empty.
id: drop-if-exists.table-if-exists-recreate
title: DROP TABLE IF EXISTS followed by recreate yields an empty table
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-table, create-table, insert, select]
required_capabilities: [create-table, insert, select, drop-table]
provenance:
  source: hand
  ref: "PG18 sql-droptable.html; derived from pg-regress drop_if_exists.sql"
sessions: [a]
setup: |
  CREATE TABLE test_exists (a int, b text);
  INSERT INTO test_exists VALUES (1, 'old'), (NULL, NULL);
steps:
  - sql: |
      DROP TABLE IF EXISTS test_exists
    expect: ok
  - sql: |
      CREATE TABLE test_exists (a int, b text)
    expect: ok
  - sql: |
      SELECT a, b FROM test_exists ORDER BY a NULLS LAST
    expect: rows
    order: ordered
