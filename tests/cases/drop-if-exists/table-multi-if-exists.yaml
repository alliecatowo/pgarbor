# One DROP TABLE IF EXISTS naming an existing and a missing table drops the existing one and notices the other.
id: drop-if-exists.table-multi-if-exists
title: DROP TABLE IF EXISTS with a mix of existing and missing tables
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-table]
required_capabilities: [create-table, drop-table, catalog-introspection]
provenance:
  source: hand
  ref: "PG18 sql-droptable.html; derived from pg-regress drop_if_exists.sql"
sessions: [a]
setup: |
  CREATE TABLE die_a (x int);
steps:
  - sql: |
      DROP TABLE IF EXISTS die_a, die_b
    expect: notice
  - sql: |
      SELECT to_regclass('die_a') IS NULL AS a_gone, to_regclass('die_b') IS NULL AS b_absent
    expect: rows
