# A schema-qualified DROP TABLE IF EXISTS tolerates a missing schema with a notice.
id: drop-if-exists.table-if-exists-missing-schema
title: DROP TABLE IF EXISTS tolerates a missing schema qualifier
family: drop-if-exists
tier: extended
feature_ids: [drop-if-exists, drop-table, schemas]
required_capabilities: [drop-table, schemas]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      DROP TABLE IF EXISTS no_such_schema.foo
    expect: notice
  - sql: |
      DROP TABLE no_such_schema.foo
    expect: error
    sqlstate: "3F000"
