# DROP TABLE IF EXISTS on an existing table drops it silently; the table is then gone.
id: drop-if-exists.table-if-exists-existing
title: DROP TABLE IF EXISTS removes an existing table without notice
family: drop-if-exists
tier: core
feature_ids: [drop-if-exists, drop-table, create-table]
required_capabilities: [create-table, drop-table]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
setup: |
  CREATE TABLE test_exists (a int, b text);
steps:
  - sql: |
      DROP TABLE IF EXISTS test_exists
    expect: ok
  - sql: |
      SELECT 1 FROM test_exists
    expect: error
    sqlstate: "42P01"
