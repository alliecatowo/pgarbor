# Inside a transaction block, a notice does not abort it, but a later undefined_table error does, so further statements fail with 25P02 until ROLLBACK.
id: drop-if-exists.table-if-exists-in-aborted-txn
title: DROP TABLE IF EXISTS inside a transaction block and the aborted state after a plain DROP
family: drop-if-exists
tier: extended
feature_ids: [drop-if-exists, drop-table, transactions, errors]
required_capabilities: [drop-table, transactions]
provenance:
  source: hand
  ref: "PG18 sql-droptable.html; PG18 errcodes 25P02; derived from pg-regress drop_if_exists.sql"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      DROP TABLE IF EXISTS test_exists
    expect: notice
  - sql: |
      DROP TABLE test_exists
    expect: error
    sqlstate: "42P01"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT 1 AS usable_again
    expect: rows
