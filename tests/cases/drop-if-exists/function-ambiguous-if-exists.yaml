# DROP FUNCTION without an argument list is ambiguous when overloads exist, and IF EXISTS does not suppress that.
id: drop-if-exists.function-ambiguous-if-exists
title: DROP FUNCTION IF EXISTS still errors when the name is ambiguous
family: drop-if-exists
tier: extended
feature_ids: [drop-if-exists, drop-function, functions]
required_capabilities: [create-function, drop-function]
provenance:
  source: pg-regress
  ref: src/test/regress/sql/drop_if_exists.sql
sessions: [a]
steps:
  - sql: |
      CREATE FUNCTION die_ambig(int) RETURNS int AS $$ SELECT $1 $$ LANGUAGE sql;
      CREATE FUNCTION die_ambig(text) RETURNS text AS $$ SELECT $1 $$ LANGUAGE sql
    expect: ok
  - sql: |
      DROP FUNCTION die_ambig
    expect: error
    sqlstate: "42725"
  - sql: |
      DROP FUNCTION IF EXISTS die_ambig
    expect: error
    sqlstate: "42725"
  - sql: |
      DROP FUNCTION die_ambig(int);
      DROP FUNCTION die_ambig(text)
    expect: ok
