# Nesting makes the comment unterminated: one open /* is closed by one */, leaving depth 1.
id: comments.unterminated-nested-block-comment
title: Nested block comment left open at end of input is a syntax error
family: comments
tier: extended
feature_ids: [sql-comments, errors]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/comments.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT 2 AS y /* outer /* inner */
    expect: error
    sqlstate: "42601"
