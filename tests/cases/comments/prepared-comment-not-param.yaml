# Placeholders inside comments are not parameters; only $1 counts.
id: comments.prepared-comment-not-param
title: Parameter placeholders inside comments are not counted as parameters
family: comments
tier: extended
feature_ids: [sql-comments, extended-protocol, prepared-statements]
required_capabilities: [select, extended-protocol]
provenance:
  source: hand
  ref: "PG18 protocol-flow.html#PROTOCOL-FLOW-EXT-QUERY; sql-syntax-lexical.html#SQL-SYNTAX-COMMENTS"
sessions: [a]
steps:
  - parse:
      name: q
      sql: |
        SELECT $1::int4 AS v /* $2 is not a parameter */ -- $3 neither
      param_types: [23]
    expect: ok
  - execute:
      statement: q
      params: ["7"]
    expect: rows
    order: ordered
  - close:
      statement: q
