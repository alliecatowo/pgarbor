# Comment delimiters inside a string literal are data, not comments.
id: comments.comment-markers-in-string
title: Comment markers inside string literals are literal text
family: comments
tier: core
feature_ids: [select, sql-comments, string-literals]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 docs sql-syntax-lexical.html#SQL-SYNTAX-COMMENTS"
sessions: [a]
steps:
  - sql: |
      SELECT '/* not a comment */' AS s, '-- also not a comment' AS t, length('/*x*/') AS n
    expect: rows
    order: ordered
