# A multi-line block comment containing a statement must not execute it.
id: comments.block-comment-hides-statement
title: Multi-line block comment hides a statement from execution
family: comments
tier: core
feature_ids: [select, sql-comments]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/comments.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT 'before multi-line' AS fourth;
      /* This is an example of SQL which should not execute:
       * select 'multi-line';
       */
      SELECT 'after multi-line' AS fifth;
    expect: rows
    order: ordered
