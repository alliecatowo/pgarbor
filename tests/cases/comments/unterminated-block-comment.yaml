# An unterminated block comment is a syntax error and the statement is rejected.
id: comments.unterminated-block-comment
title: Unterminated block comment raises a syntax error
family: comments
tier: core
feature_ids: [sql-comments, errors]
required_capabilities: [select]
provenance:
  source: hand
  ref: "PG18 errcodes 42601 (syntax_error); src/backend/parser/scan.l unterminated /* comment"
sessions: [a]
steps:
  - sql: |
      SELECT 1 AS x /* never closed
    expect: error
    sqlstate: "42601"
