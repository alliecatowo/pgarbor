# Three levels of nesting, with a line comment inside. Only the statement after the
# outermost close is executed.
id: comments.block-comment-nested-deep
title: Three-level nested block comments with inner line comment
family: comments
tier: extended
feature_ids: [select, sql-comments]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/comments.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT -- continued after the following block comments...
      /* level one
      /* level two
      SELECT 'deeper nest' AS n2; -- inside nested comment
      /* level three
      SELECT 'deepest nest' AS n3;
      */
      still two deep
      */
      still one deep
      */
      'deeply nested example' AS sixth;
    expect: rows
    order: ordered
