# A /* */ comment embedded between SELECT and the target list is whitespace.
id: comments.block-comment-embedded
title: Embedded block comment between keyword and target list
family: comments
tier: core
feature_ids: [select, sql-comments]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/comments.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT /* embedded single line */ 'embedded' AS second;
      SELECT /* both embedded and trailing single line */ 'both' AS third; -- trailing single line
    expect: rows
    order: ordered
    comment: two statements, one StatementResult each
