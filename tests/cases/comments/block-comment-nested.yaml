# PostgreSQL block comments nest: an inner /* */ does not close the outer comment.
id: comments.block-comment-nested
title: Nested block comments keep the outer comment open
family: comments
tier: core
feature_ids: [select, sql-comments]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/comments.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      /* outer /* inner */ SELECT 'hidden' AS h; */
      SELECT 'visible' AS v;
    expect: rows
    order: ordered
