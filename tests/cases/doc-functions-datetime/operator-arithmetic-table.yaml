# Date/Time Operators table (func.sgml#operators-datetime-table): every documented example, one row.
id: doc-functions-datetime.operator-arithmetic-table
title: Documented date/time operator examples produce the documented values
family: doc-functions-datetime
tier: core
feature_ids: [datetime-operators, date-arithmetic, interval-arithmetic, timestamp-arithmetic, time-arithmetic]
required_capabilities: [select, date-type, timestamp, interval]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#operators-datetime-table (Date/Time Operators)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT
        date '2001-09-28' + 7 AS d_plus_int,
        date '2001-09-28' + interval '1 hour' AS d_plus_iv,
        date '2001-09-28' + time '03:00' AS d_plus_time,
        interval '1 day' + interval '1 hour' AS iv_plus_iv,
        timestamp '2001-09-28 01:00' + interval '23 hours' AS ts_plus_iv,
        time '01:00' + interval '3 hours' AS t_plus_iv,
        - interval '23 hours' AS neg_iv,
        date '2001-10-01' - date '2001-09-28' AS d_minus_d,
        date '2001-10-01' - 7 AS d_minus_int,
        date '2001-09-28' - interval '1 hour' AS d_minus_iv,
        time '05:00' - time '03:00' AS t_minus_t,
        time '05:00' - interval '2 hours' AS t_minus_iv,
        timestamp '2001-09-28 23:00' - interval '23 hours' AS ts_minus_iv,
        interval '1 day' - interval '1 hour' AS iv_minus_iv,
        timestamp '2001-09-29 03:00' - timestamp '2001-07-27 12:00' AS ts_minus_ts,
        interval '1 second' * 900 AS iv_times_900,
        interval '1 day' * 21 AS iv_times_21,
        interval '1 hour' * 3.5 AS iv_times_3_5,
        interval '1 hour' / 1.5 AS iv_div_1_5
    expect: rows
    order: multiset
    comment: documented results 2001-10-05, 2001-09-28 01:00:00, 2001-09-28 03:00:00, 1 day 01:00:00, 2001-09-29 00:00:00, 04:00:00, -23:00:00, 3, 2001-09-24, 2001-09-27 23:00:00, 02:00:00, 03:00:00, 2001-09-28 00:00:00, 1 day -01:00:00, 63 days 15:00:00, 00:15:00, 21 days, 03:30:00, 00:40:00
  - sql: |
      SELECT interval '1 hour' / 0 AS div_zero
    expect: error
    sqlstate: "22012"
    comment: interval division by zero is rejected, not Infinity
  - sql: |
      SELECT pg_typeof(date '2001-09-28' + time '03:00') AS t_dt, pg_typeof(date '2001-10-01' - date '2001-09-28') AS t_dd, pg_typeof(time '05:00' - time '03:00') AS t_tt
    expect: rows
    order: multiset
    comment: date+time yields timestamp; date-date yields integer; time-time yields interval
