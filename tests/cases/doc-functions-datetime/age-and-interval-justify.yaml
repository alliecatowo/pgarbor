# age(timestamp, timestamp) and the justify_* functions, with documented examples and sign behavior.
id: doc-functions-datetime.age-and-interval-justify
title: age() two-argument form and justify_days, justify_hours, justify_interval
family: doc-functions-datetime
tier: core
feature_ids: [age, justify-days, justify-hours, justify-interval, interval-normalization]
required_capabilities: [select, timestamp, interval]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-datetime-table (age, justify_days, justify_hours, justify_interval); functions-datetime-mod"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT
        age(timestamp '2001-04-10', timestamp '1957-06-13') AS doc_age,
        age('2004-06-01', '2004-04-30') AS may_vs_april,
        age('2004-04-30', '2004-06-01') AS reversed,
        age(timestamp '2001-03-01', timestamp '2001-03-01') AS zero
    expect: rows
    order: multiset
    comment: doc example is 43 years 9 mons 27 days; 1 mon 1 day from the note on month ambiguity; reversed arguments negate the fields
  - sql: |
      SELECT
        justify_days(interval '1 year 65 days') AS jd,
        justify_hours(interval '50 hours 10 minutes') AS jh,
        justify_interval(interval '1 mon -1 hour') AS ji,
        justify_days(interval '-35 days') AS jd_neg,
        justify_hours(interval '-50 hours -10 minutes') AS jh_neg
    expect: rows
    order: multiset
    comment: documented values 1 year 2 mons 5 days, 2 days 02:10:00, 29 days 23:00:00
  - sql: |
      SELECT isfinite(date '2001-02-16') AS d_fin, isfinite(timestamp 'infinity') AS ts_inf, isfinite(interval '4 hours') AS iv_fin, isfinite(timestamp '-infinity') AS ts_ninf
    expect: rows
    order: multiset
    comment: documented isfinite results are true, false, true; -infinity is also not finite
