# date_trunc on timestamp, timestamptz with zone, and interval, including the documented examples and the field list.
id: doc-functions-datetime.date-trunc-variants
title: date_trunc truncates timestamp, timestamptz (with zone) and interval to each documented field
family: doc-functions-datetime
tier: core
feature_ids: [date-trunc, truncation-fields, timestamptz-zone-argument, interval-truncation]
required_capabilities: [select, timestamp, interval]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-datetime-trunc (date_trunc; field list; examples)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT date_trunc('hour', timestamp '2001-02-16 20:38:40') AS doc_hour,
             date_trunc('hour', interval '2 days 3 hours 40 minutes') AS doc_iv_hour,
             date_trunc('day', timestamptz '2001-02-16 20:38:40+00', 'Australia/Sydney') AS doc_tz_day
    expect: rows
    order: multiset
    comment: documented 2001-02-16 20:00:00, 2 days 03:00:00, and 2001-02-16 13:00:00+00 (Sydney local midnight 2001-02-17 is 2001-02-16 13:00 UTC)
  - sql: |
      SELECT date_trunc('week', timestamp '2001-02-16 20:38:40') AS week_start,
             date_trunc('quarter', timestamp '2001-08-16 20:38:40') AS quarter_start,
             date_trunc('decade', timestamp '2001-08-16 20:38:40') AS decade_start,
             date_trunc('century', timestamp '2001-08-16 20:38:40') AS century_start,
             date_trunc('millennium', timestamp '2001-08-16 20:38:40') AS millennium_start
    expect: rows
    order: multiset
    comment: week starts on Monday (2001-02-12); decade 2000 and century 2001 start at their first year
  - sql: |
      SELECT date_trunc('millisecond', timestamp '2001-02-16 20:38:40.123456') AS ms_trunc,
             date_trunc('microseconds', timestamp '2001-02-16 20:38:40.123456') AS us_trunc,
             date_trunc('minute', interval '1 hour 2 minutes 59 seconds') AS iv_minute,
             date_trunc('month', interval '3 years 5 months 20 days') AS iv_month
    expect: rows
    order: multiset
    comment: fine-grained fields truncate the fractional part; for intervals, truncating to month drops the day and smaller fields, so 3 years 5 months 20 days becomes 3 years 5 mons
  - sql: |
      SELECT date_trunc('day', timestamptz '2001-02-16 20:38:40+00', 'America/New_York') AS ny_day,
             date_trunc('month', timestamptz '2001-02-16 20:38:40+00', 'Asia/Kolkata') AS kolkata_month
    expect: rows
    order: multiset
    comment: the zone argument decides where the truncation boundary falls
