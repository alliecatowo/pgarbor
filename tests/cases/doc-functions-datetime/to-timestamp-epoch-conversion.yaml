# to_timestamp(double precision) converts seconds since the Unix epoch to timestamptz, and round-trips through EXTRACT(EPOCH).
id: doc-functions-datetime.to-timestamp-epoch-conversion
title: to_timestamp converts Unix seconds to timestamptz and EXTRACT(EPOCH) reverses it
family: doc-functions-datetime
tier: core
feature_ids: [to-timestamp, unix-epoch, fractional-seconds, epoch-round-trip]
required_capabilities: [select, timestamp, guc]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-datetime-table (to_timestamp(double precision)); functions-datetime-epoch"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT to_timestamp(1284352323) AS doc_example,
             to_timestamp(0) AS epoch_zero,
             to_timestamp(-1) AS before_epoch,
             to_timestamp(1284352323.5) AS half_second
    expect: rows
    order: multiset
    comment: documented 2010-09-13 04:32:03+00; zero is the Unix epoch; -1 is one second before it
  - sql: |
      SELECT extract(epoch from to_timestamp(1284352323)) AS round_trip,
             pg_typeof(to_timestamp(1284352323)) AS result_type
    expect: rows
    order: multiset
    comment: EXTRACT(EPOCH) of the result returns the input seconds as numeric; to_timestamp returns timestamp with time zone
