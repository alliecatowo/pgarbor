# Interval addition applies months, then days, then time, and clamps the day to the end of a shorter month.
id: doc-functions-datetime.month-clamp-and-field-order
title: Adding a month interval clamps to month end, and months are applied before days
family: doc-functions-datetime
tier: core
feature_ids: [interval-addition, month-end-clamping, field-application-order, date-plus-interval]
required_capabilities: [select, date-type, timestamp, interval]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-datetime-mod (adding an interval: months, days and microseconds handled in turn)"
sessions: [a]
steps:
  - sql: |
      SET TIME ZONE 'UTC'
    expect: ok
  - sql: |
      SELECT timestamp '2001-01-31 10:00' + interval '1 month' AS jan31_plus_month,
             timestamp '2001-02-28 10:00' + interval '1 month' AS feb28_plus_month,
             timestamp '2001-03-31 00:00' - interval '1 month' AS mar31_minus_month,
             date '2001-01-31' + interval '1 month' AS date_plus_month
    expect: rows
    order: multiset
    comment: 2001 is not a leap year, so each shorter month ends on 2001-02-28 or 2001-03-28; results are clamped, not rolled over
  - sql: |
      SELECT timestamp '2001-01-31 10:00' + interval '1 month 1 day' AS months_then_days,
             timestamp '2001-02-16 20:38:40' + interval '1 day 2 hours 30 minutes' AS days_and_time
    expect: rows
    order: multiset
    comment: 2001-01-31 plus one month is 2001-02-28, then the day is added to give 2001-03-01; the time part is kept
