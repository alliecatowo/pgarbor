# The synopsis has no IF EXISTS, and RENAME TO takes a bare name, not a schema-qualified one.
id: cmd-alter-conversion.rename-syntax-errors
title: IF EXISTS and a schema-qualified new name are syntax errors; the conversion is untouched
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, rename, syntax, errors]
required_capabilities: [alter-conversion, create-conversion, catalog-introspection, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_conversion.sgml#sql-alterconversion (Synopsis)"
sessions: [a]
setup: |
  CREATE CONVERSION syn_conv FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      ALTER CONVERSION IF EXISTS syn_conv RENAME TO syn_conv2
    expect: error
    sqlstate: "42601"
    comment: IF EXISTS is not in the synopsis
  - sql: |
      ALTER CONVERSION syn_conv RENAME TO public.syn_conv2
    expect: error
    sqlstate: "42601"
    comment: new_name is a bare name
  - sql: |
      SELECT conname FROM pg_conversion WHERE conname LIKE 'syn_conv%' ORDER BY conname
    expect: rows
    order: ordered
