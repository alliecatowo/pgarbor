# Unquoted names fold to lower case; a mixed-case conversion must be referenced with quotes.
id: cmd-alter-conversion.quoted-name-case-sensitive
title: Conversion names fold to lower case unless quoted, so ALTER needs the quoted form for mixed case
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, identifiers, rename, errors]
required_capabilities: [alter-conversion, create-conversion, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 sql-syntax-lexical identifiers, applied to alter_conversion.sgml name"
sessions: [a]
setup: |
  CREATE CONVERSION "MixedCase_Conv" FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      ALTER CONVERSION MixedCase_Conv RENAME TO folded_new
    expect: error
    sqlstate: "42704"
    comment: unquoted name folds to mixedcase_conv, which does not exist
  - sql: |
      ALTER CONVERSION "MixedCase_Conv" RENAME TO quoted_new
    expect: ok
  - sql: |
      SELECT conname FROM pg_conversion WHERE conname IN ('MixedCase_Conv', 'quoted_new', 'mixedcase_conv') ORDER BY conname
    expect: rows
    order: ordered
