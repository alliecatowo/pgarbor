# ALTER CONVERSION on a name that does not exist fails with undefined_object (42704).
id: cmd-alter-conversion.missing-conversion-error
title: ALTER CONVERSION on a nonexistent conversion fails for RENAME and OWNER TO
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, errors]
required_capabilities: [alter-conversion, errors]
provenance:
  source: hand
  ref: "PG18 alter_conversion.sgml name parameter: an existing conversion"
sessions: [a]
steps:
  - sql: |
      ALTER CONVERSION cmd_ac_no_such_conv RENAME TO cmd_ac_other
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER CONVERSION cmd_ac_no_such_conv OWNER TO CURRENT_USER
    expect: error
    sqlstate: "42704"
  - sql: |
      ALTER CONVERSION pg_catalog.cmd_ac_no_such_conv SET SCHEMA public
    expect: error
    sqlstate: "42704"
