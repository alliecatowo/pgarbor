# OWNER TO a role that does not exist fails with undefined_object (42704) and the owner is unchanged.
id: cmd-alter-conversion.owner-missing-role-error
title: OWNER TO a nonexistent role fails and leaves the owner unchanged
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, owner, roles, errors]
required_capabilities: [alter-conversion, create-conversion, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 alter_conversion.sgml OWNER TO new_owner"
sessions: [a]
setup: |
  CREATE CONVERSION own_conv FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      ALTER CONVERSION own_conv OWNER TO cmd_ac_no_such_role
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT pg_get_userbyid(conowner) = session_user AS still_session_user_owned FROM pg_conversion WHERE conname = 'own_conv'
    expect: rows
