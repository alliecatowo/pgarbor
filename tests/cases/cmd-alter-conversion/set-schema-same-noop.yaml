# SET SCHEMA to the schema the conversion is already in succeeds and changes nothing.
id: cmd-alter-conversion.set-schema-same-noop
title: SET SCHEMA to the current schema is a successful no-op
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, set-schema, schemas]
required_capabilities: [alter-conversion, create-conversion, catalog-introspection, select]
provenance:
  source: hand
  ref: "PG18 alter_conversion.sgml SET SCHEMA; AlterObjectNamespace same-namespace case"
sessions: [a]
setup: |
  CREATE CONVERSION noop_conv FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      ALTER CONVERSION noop_conv SET SCHEMA public
    expect: ok
  - sql: |
      ALTER CONVERSION public.noop_conv SET SCHEMA public
    expect: ok
  - sql: |
      SELECT n.nspname, c.conname FROM pg_conversion c JOIN pg_namespace n ON n.oid = c.connamespace WHERE c.conname = 'noop_conv'
    expect: rows
