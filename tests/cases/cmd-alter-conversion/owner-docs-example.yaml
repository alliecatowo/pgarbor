# Documented example: change the owner of iso_8859_1_to_utf8 to a role (joe in the docs).
# Qualified as public.* because an unqualified name resolves to the built-in pg_catalog conversion first.
id: cmd-alter-conversion.owner-docs-example
title: ALTER CONVERSION OWNER TO changes the owner to a named role
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, owner, create-conversion, roles]
required_capabilities: [alter-conversion, create-conversion, create-role, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_conversion.sgml#sql-alterconversion (Examples: owner)"
sessions: [a]
setup: |
  CREATE ROLE alter_conv_joe;
  CREATE CONVERSION iso_8859_1_to_utf8 FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      SELECT pg_get_userbyid(conowner) FROM pg_conversion WHERE conname = 'iso_8859_1_to_utf8' AND connamespace = 'public'::regnamespace
    expect: rows
    comment: the creating (session) user owns it before the change
  - sql: |
      ALTER CONVERSION public.iso_8859_1_to_utf8 OWNER TO alter_conv_joe
    expect: ok
  - sql: |
      SELECT conname, pg_get_userbyid(conowner) AS owner FROM pg_conversion WHERE conname = 'iso_8859_1_to_utf8' AND connamespace = 'public'::regnamespace
    expect: rows
    order: ordered
  - sql: |
      DROP CONVERSION public.iso_8859_1_to_utf8
    expect: ok
  - sql: |
      DROP ROLE alter_conv_joe
    expect: ok
    comment: cluster-level cleanup; the role owned nothing after the conversion was dropped
