# SET SCHEMA to a schema that does not exist fails with invalid_schema_name (3F000); the conversion stays put.
id: cmd-alter-conversion.set-schema-missing-schema-error
title: SET SCHEMA to a nonexistent schema fails and leaves the conversion in place
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, set-schema, schemas, errors]
required_capabilities: [alter-conversion, create-conversion, catalog-introspection, errors]
provenance:
  source: hand
  ref: "PG18 alter_conversion.sgml SET SCHEMA new_schema"
sessions: [a]
setup: |
  CREATE CONVERSION ms_conv FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      ALTER CONVERSION ms_conv SET SCHEMA cmd_ac_no_such_schema
    expect: error
    sqlstate: "3F000"
  - sql: |
      SELECT n.nspname, c.conname FROM pg_conversion c JOIN pg_namespace n ON n.oid = c.connamespace WHERE c.conname = 'ms_conv'
    expect: rows
