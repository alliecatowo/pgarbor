# Documented example: rename iso_8859_1_to_utf8 to latin1_to_unicode; the definition (encodings, function) is unchanged.
# Qualified as public.iso_8859_1_to_utf8 so the user conversion is renamed, not the built-in pg_catalog one.
id: cmd-alter-conversion.rename-docs-example
title: ALTER CONVERSION RENAME TO renames the conversion and keeps its definition
family: cmd-alter-conversion
tier: core
feature_ids: [alter-conversion, rename, create-conversion, catalog-introspection]
required_capabilities: [alter-conversion, create-conversion, catalog-introspection, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_conversion.sgml#sql-alterconversion (Examples: rename)"
sessions: [a]
setup: |
  CREATE CONVERSION iso_8859_1_to_utf8 FOR 'LATIN1' TO 'UTF8' FROM iso8859_1_to_utf8;
steps:
  - sql: |
      ALTER CONVERSION public.iso_8859_1_to_utf8 RENAME TO latin1_to_unicode
    expect: ok
  - sql: |
      SELECT conname, pg_encoding_to_char(conforencoding) AS from_enc, pg_encoding_to_char(contoencoding) AS to_enc, condefault, conproc::regproc::text AS func
      FROM pg_conversion WHERE connamespace = 'public'::regnamespace AND conname IN ('iso_8859_1_to_utf8', 'latin1_to_unicode')
      ORDER BY conname
    expect: rows
    order: ordered
    comment: only the new name exists in public; same encodings, default flag and function
  - sql: |
      SELECT count(*) FROM pg_conversion WHERE conname = 'iso_8859_1_to_utf8' AND connamespace = 'public'::regnamespace
    expect: rows
    comment: the old name is gone
