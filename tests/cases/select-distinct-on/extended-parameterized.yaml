# DISTINCT ON through a prepared statement with a bound parameter in WHERE.
id: select-distinct-on.extended-parameterized
title: Prepared DISTINCT ON query re-executed with different bound parameters
family: select-distinct-on
tier: extended
feature_ids: [select, distinct-on, order-by, extended-protocol, prepared-statements]
required_capabilities: [create-table, insert, select, extended-protocol]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE p (k int4, v text);
  INSERT INTO p VALUES (1, 'a'), (1, 'b'), (2, 'c');
steps:
  - parse:
      name: dq
      sql: |
        SELECT DISTINCT ON (k) k, v FROM p WHERE k >= $1 ORDER BY k, v DESC
      param_types: [23]
    expect: ok
  - execute:
      statement: dq
      params: ["1"]
    expect: rows
    order: ordered
  - execute:
      statement: dq
      params: ["2"]
    expect: rows
    order: ordered
  - close:
      statement: dq
