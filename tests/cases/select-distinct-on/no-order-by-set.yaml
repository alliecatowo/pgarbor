# Without ORDER BY the chosen row is unspecified, so only the set of distinct keys is asserted.
id: select-distinct-on.no-order-by-set
title: DISTINCT ON without ORDER BY returns the set of distinct keys
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE d (k int4, v int4);
  INSERT INTO d VALUES (1, 1), (1, 2), (2, 3);
steps:
  - sql: |
      SELECT DISTINCT ON (k) k FROM d
    expect: rows
    order: multiset
    comment: only key values are selected, so which duplicate row is kept cannot be observed
