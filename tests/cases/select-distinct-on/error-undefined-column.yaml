# DISTINCT ON referencing a missing column fails during parse analysis.
id: select-distinct-on.error-undefined-column
title: DISTINCT ON on an unknown column raises undefined_column
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE e2 (a int4, b int4);
steps:
  - sql: |
      SELECT DISTINCT ON (nosuch) a FROM e2 ORDER BY nosuch
    expect: error
    sqlstate: "42703"
