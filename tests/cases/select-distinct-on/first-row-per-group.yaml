# DISTINCT ON keeps the first row of each key group under the ORDER BY.
id: select-distinct-on.first-row-per-group
title: DISTINCT ON keeps the highest-salary row per department
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE emp (dept text, name text, salary int4);
  INSERT INTO emp VALUES ('eng', 'ann', 120), ('eng', 'bob', 150), ('eng', 'cy', 90), ('ops', 'dee', 70), ('ops', 'eve', 80), ('hr', 'fay', 60);
steps:
  - sql: |
      SELECT DISTINCT ON (dept) dept, name, salary FROM emp ORDER BY dept, salary DESC
    expect: rows
    order: ordered
    comment: one row per dept, the highest salary within each
