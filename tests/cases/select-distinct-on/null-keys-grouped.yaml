# NULL values in the DISTINCT ON key are treated as equal and form a single group.
id: select-distinct-on.null-keys-grouped
title: NULL distinct keys form one group
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE n (k int4, v int4);
  INSERT INTO n VALUES (NULL, 1), (NULL, 2), (1, 5), (1, 3);
steps:
  - sql: |
      SELECT DISTINCT ON (k) k, v FROM n ORDER BY k, v
    expect: rows
    order: ordered
    comment: expect (1,3) and a single NULL-key row (NULL,1); default ASC puts NULLs last
