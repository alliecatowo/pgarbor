# ORDER BY ordinal positions with DISTINCT ON and LIMIT applied after deduplication.
id: select-distinct-on.ordinal-order-limit
title: DISTINCT ON with positional ORDER BY and LIMIT
family: select-distinct-on
tier: extended
feature_ids: [select, distinct-on, order-by, limit]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE q (four int4, two int4);
  INSERT INTO q VALUES (0, 2), (0, 0), (1, 1), (1, 3), (2, 0), (3, 2);
steps:
  - sql: |
      SELECT DISTINCT ON (four) four, two FROM q ORDER BY 1, 2 LIMIT 2
    expect: rows
    order: ordered
    comment: expect (0,0), (1,1)
