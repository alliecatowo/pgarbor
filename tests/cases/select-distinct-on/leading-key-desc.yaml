# DISTINCT ON key sorted descending while the second key sorts ascending picks the lowest value.
id: select-distinct-on.leading-key-desc
title: DISTINCT ON with a descending leading key and ascending tie-breaker
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE emp (dept text, name text, salary int4);
  INSERT INTO emp VALUES ('eng', 'ann', 120), ('eng', 'bob', 150), ('eng', 'cy', 90), ('ops', 'dee', 70), ('ops', 'eve', 80), ('hr', 'fay', 60);
steps:
  - sql: |
      SELECT DISTINCT ON (dept) dept, name FROM emp ORDER BY dept DESC, salary ASC
    expect: rows
    order: ordered
