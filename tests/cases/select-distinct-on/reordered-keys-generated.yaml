# The DISTINCT ON key list (y, x) is matched to an ORDER BY with the same leading columns.
id: select-distinct-on.reordered-keys-generated
title: DISTINCT ON (y, x) with a matching ORDER BY over generated data
family: select-distinct-on
tier: extended
feature_ids: [select, distinct-on, order-by, generate-series]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE dot (x int4, y int4, z int4);
  INSERT INTO dot SELECT i % 10, i % 10, i % 10 FROM generate_series(1, 1000) AS i;
steps:
  - sql: |
      SELECT DISTINCT ON (y, x) x, y FROM dot ORDER BY y, x
    expect: rows
    order: ordered
    comment: ten rows (0,0) through (9,9)
  - sql: |
      SELECT DISTINCT ON (y, x) x, y FROM (SELECT * FROM dot ORDER BY x) s ORDER BY y, x
    expect: rows
    order: ordered
