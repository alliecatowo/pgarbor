# DISTINCT ON over an empty input returns zero rows without error.
id: select-distinct-on.empty-table
title: DISTINCT ON over an empty table returns no rows
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, order-by]
required_capabilities: [create-table, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE empty_t (k int4, v int4);
steps:
  - sql: |
      SELECT DISTINCT ON (k) k, v FROM empty_t ORDER BY k, v
    expect: rows
    order: ordered
