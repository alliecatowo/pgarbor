# DISTINCT ON expressions must match the leading ORDER BY expressions.
id: select-distinct-on.error-leading-order-mismatch
title: DISTINCT ON key absent from the leading ORDER BY is rejected
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, order-by, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE e (a int4, b int4);
  INSERT INTO e VALUES (1, 2), (1, 1), (2, 3);
steps:
  - sql: |
      SELECT DISTINCT ON (a) a, b FROM e ORDER BY b
    expect: error
    sqlstate: "42P10"
    comment: DISTINCT ON expression a is not the leading ORDER BY expression
