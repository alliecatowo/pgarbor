# NULLS FIRST in the ORDER BY decides which row survives within each group.
id: select-distinct-on.nulls-first-order
title: NULLS FIRST and NULLS LAST choose different representative rows
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, order-by, nulls]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE t2 (k int4, v int4);
  INSERT INTO t2 VALUES (1, NULL), (1, 3), (2, 4), (2, NULL);
steps:
  - sql: |
      SELECT DISTINCT ON (k) k, v FROM t2 ORDER BY k, v NULLS FIRST
    expect: rows
    order: ordered
  - sql: |
      SELECT DISTINCT ON (k) k, v FROM t2 ORDER BY k, v NULLS LAST
    expect: rows
    order: ordered
