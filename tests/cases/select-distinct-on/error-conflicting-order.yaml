# Regression shape: DISTINCT ON (string4, ten) conflicts with ORDER BY string4, two, ten.
id: select-distinct-on.error-conflicting-order
title: DISTINCT ON keys must prefix the ORDER BY list in order
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, order-by, errors]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE s (string4 text, two int4, ten int4);
  INSERT INTO s VALUES ('AAAA', 0, 0), ('AAAA', 1, 0), ('BBBB', 0, 1);
steps:
  - sql: |
      SELECT DISTINCT ON (string4, ten) string4, two, ten FROM s ORDER BY string4, two, ten
    expect: error
    sqlstate: "42P10"
    comment: ten is the second DISTINCT ON key but the second ORDER BY key is two
