# Multi-column DISTINCT ON: uniqueness is on the pair, first row per pair by the ORDER BY tail.
id: select-distinct-on.multi-column-keys
title: DISTINCT ON over two columns keeps one row per pair
family: select-distinct-on
tier: core
feature_ids: [select, distinct-on, order-by]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE m (a int4, b text, c int4);
  INSERT INTO m VALUES (1, 'x', 10), (1, 'x', 5), (1, 'y', 7), (2, 'x', 3);
steps:
  - sql: |
      SELECT DISTINCT ON (a, b) a, b, c FROM m ORDER BY a, b, c
    expect: rows
    order: ordered
    comment: expect (1,x,5), (1,y,7), (2,x,3)
