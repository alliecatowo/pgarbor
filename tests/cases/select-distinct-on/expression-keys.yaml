# DISTINCT ON and ORDER BY may use the same expression, not only bare columns.
id: select-distinct-on.expression-keys
title: DISTINCT ON an expression keyed on abs(n)
family: select-distinct-on
tier: extended
feature_ids: [select, distinct-on, order-by, expressions]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/select_distinct_on.sql"
  license: "PostgreSQL License"
sessions: [a]
setup: |
  CREATE TABLE w (n int4);
  INSERT INTO w VALUES (-3), (3), (-2), (2), (5);
steps:
  - sql: |
      SELECT DISTINCT ON (abs(n)) n FROM w ORDER BY abs(n), n
    expect: rows
    order: ordered
    comment: keeps -2, -3, 5 (ordered by abs(n))
