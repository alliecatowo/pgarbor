# Error paths for schema-qualified CREATE TABLE: missing schema, reserved catalog schema,
# and duplicate table in the same schema.
id: namespace.create-table-schema-errors
title: Schema-qualified CREATE TABLE errors for missing schema, pg_catalog, and duplicate name
family: namespace
tier: core
feature_ids: [create-table, create-schema, errors]
required_capabilities: [create-table, create-schema, errors]
provenance:
  source: hand
  ref: "PG18 docs errcodes-appendix.html (3F000, 42501, 42P07)"
  license: PostgreSQL License
setup: |
  CREATE SCHEMA cte_ok;
steps:
  - sql: |
      CREATE TABLE cte_missing.t (a int4)
    expect: error
    sqlstate: "3F000"
  - sql: |
      CREATE TABLE pg_catalog.cte_forbidden (a int4)
    expect: error
    sqlstate: "42501"
  - sql: |
      CREATE TABLE cte_ok.t (a int4)
    expect: ok
  - sql: |
      CREATE TABLE cte_ok.t (a int4)
    expect: error
    sqlstate: "42P07"
  - sql: |
      CREATE TABLE IF NOT EXISTS cte_ok.t (a int4)
    expect: notice
    comment: IF NOT EXISTS on an existing relation is a notice, not an error
