# pg_catalog is searched implicitly even when search_path omits it, so built-in functions
# still resolve. A whitespace-only search_path is kept verbatim by set_config.
id: namespace.pg-catalog-always-searched
title: pg_catalog is implicitly searched and built-in functions resolve with an empty user path
family: namespace
tier: core
feature_ids: [search-path, catalog-introspection, functions, select]
required_capabilities: [search-path, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/namespace.sql"
  license: PostgreSQL License
steps:
  - sql: |
      SET search_path TO pg_catalog
    expect: ok
  - sql: |
      SELECT pg_catalog.set_config('search_path', ' ', false) AS sp
    expect: rows
    comment: whitespace-only search_path is kept as-is (GUC list syntax)
  - sql: |
      SELECT length(current_setting('search_path')) AS len
    expect: rows
  - sql: |
      SELECT upper('abc') AS u, pg_catalog.lower('ABC') AS l
    expect: rows
    comment: built-ins resolve without any user schema on the path
