# Setting search_path to a schema that does not exist is accepted; only name resolution fails.
id: namespace.search-path-missing-schema
title: search_path may name a nonexistent schema; resolution then fails with 42P01
family: namespace
tier: extended
feature_ids: [search-path, errors, select]
required_capabilities: [search-path, select, errors]
provenance:
  source: hand
  ref: "PG18 docs runtime-config-client.html#GUC-SEARCH-PATH"
  license: PostgreSQL License
setup: |
  CREATE TABLE public.sp_probe (x int4);
  INSERT INTO public.sp_probe VALUES (7);
steps:
  - sql: |
      SET search_path TO sp_no_such_schema, public
    expect: ok
    comment: no error for a missing schema in search_path
  - sql: |
      SELECT x FROM sp_probe
    expect: rows
    comment: the later public entry is still searched
  - sql: |
      SET search_path TO sp_no_such_schema
    expect: ok
  - sql: |
      SELECT x FROM sp_probe
    expect: error
    sqlstate: "42P01"
