# Extreme bigint and int4 keys are valid and independent of each other.
id: advisory-lock.key-boundaries
title: "Advisory locks accept bigint and int4 boundary keys"
family: advisory-lock
tier: core
feature_ids: [advisory-locks, numeric, select]
required_capabilities: [advisory-locks, select, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/advisory_lock.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT pg_try_advisory_lock(9223372036854775807), pg_try_advisory_lock(-9223372036854775808), pg_try_advisory_lock(2147483647, -2147483648)
    expect: rows
  - sql: |
      SELECT locktype, classid, objid, objsubid, mode, granted FROM pg_locks WHERE locktype = 'advisory' AND database = (SELECT oid FROM pg_database WHERE datname = current_database()) ORDER BY classid, objid, objsubid
    expect: rows
  - sql: |
      SELECT pg_advisory_unlock_all()
    expect: rows
