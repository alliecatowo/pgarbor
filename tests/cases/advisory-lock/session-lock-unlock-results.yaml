# pg_advisory_unlock returns true when the session owns the lock, false (with a warning) otherwise.
id: advisory-lock.session-lock-unlock-results
title: "pg_advisory_unlock returns true once for a held session lock, then false"
family: advisory-lock
tier: core
feature_ids: [advisory-locks, select]
required_capabilities: [advisory-locks, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/advisory_lock.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT pg_advisory_lock(1), pg_advisory_lock_shared(2)
    expect: rows
  - sql: |
      SELECT pg_advisory_unlock(1), pg_advisory_unlock_shared(2)
    expect: rows
    comment: both held, so both unlocks should succeed
  - sql: |
      SELECT pg_advisory_unlock(1), pg_advisory_unlock_shared(2)
    expect: rows
    comment: not held anymore, so false with a warning
  - sql: |
      SELECT count(*) FROM pg_locks WHERE locktype = 'advisory' AND database = (SELECT oid FROM pg_database WHERE datname = current_database())
    expect: rows
