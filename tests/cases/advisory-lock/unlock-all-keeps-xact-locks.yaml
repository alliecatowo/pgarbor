# pg_advisory_unlock_all releases session locks only; transaction locks survive until COMMIT.
id: advisory-lock.unlock-all-keeps-xact-locks
title: "pg_advisory_unlock_all does not release transaction-level advisory locks"
family: advisory-lock
tier: core
feature_ids: [advisory-locks, transactions, catalog-introspection]
required_capabilities: [advisory-locks, transactions, catalog-introspection, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/advisory_lock.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT pg_advisory_xact_lock(1), pg_advisory_lock(2)
    expect: rows
  - sql: |
      SELECT pg_advisory_unlock_all()
    expect: rows
  - sql: |
      SELECT count(*) FROM pg_locks WHERE locktype = 'advisory' AND database = (SELECT oid FROM pg_database WHERE datname = current_database())
    expect: rows
    comment: only the transaction lock should remain
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_locks WHERE locktype = 'advisory' AND database = (SELECT oid FROM pg_database WHERE datname = current_database())
    expect: rows
