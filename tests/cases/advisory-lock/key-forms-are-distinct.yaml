# A bigint key and a pair of int4 keys name different lock spaces, so another session can take both.
id: advisory-lock.key-forms-are-distinct
title: "bigint advisory key 1 and int4 pair (0,1) are distinct locks"
family: advisory-lock
tier: extended
feature_ids: [advisory-locks, multi-session]
required_capabilities: [advisory-locks, multi-session, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/advisory_lock.sql"
  license: "PostgreSQL License"
sessions: [a, b]
steps:
  - session: a
    sql: |
      SELECT pg_advisory_lock(1)
    expect: rows
  - session: b
    sql: |
      SELECT pg_try_advisory_lock(0, 1)
    expect: rows
    comment: different key form, so expected to be granted
  - session: b
    sql: |
      SELECT pg_try_advisory_lock(1)
    expect: rows
    comment: same key as session a, so expected to be refused
  - session: a
    sql: |
      SELECT pg_advisory_unlock_all()
    expect: rows
  - session: b
    sql: |
      SELECT pg_advisory_unlock_all()
    expect: rows
