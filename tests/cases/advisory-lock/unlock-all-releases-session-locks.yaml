# pg_advisory_unlock_all releases every session-level advisory lock, of both kinds and key forms.
id: advisory-lock.unlock-all-releases-session-locks
title: "pg_advisory_unlock_all releases all session advisory locks across key forms"
family: advisory-lock
tier: core
feature_ids: [advisory-locks, catalog-introspection]
required_capabilities: [advisory-locks, catalog-introspection, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/advisory_lock.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT pg_advisory_lock(1), pg_advisory_lock_shared(2), pg_advisory_lock(1, 1), pg_advisory_lock_shared(2, 2)
    expect: rows
  - sql: |
      SELECT locktype, classid, objid, objsubid, mode, granted FROM pg_locks WHERE locktype = 'advisory' AND database = (SELECT oid FROM pg_database WHERE datname = current_database()) ORDER BY classid, objid, objsubid
    expect: rows
  - sql: |
      SELECT pg_advisory_unlock_all()
    expect: rows
  - sql: |
      SELECT count(*) FROM pg_locks WHERE locktype = 'advisory' AND database = (SELECT oid FROM pg_database WHERE datname = current_database())
    expect: rows
