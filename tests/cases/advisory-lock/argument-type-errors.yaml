# Wrong argument types fail during function resolution or input conversion.
id: advisory-lock.argument-type-errors
title: "Advisory lock functions reject numeric keys and non-integer text keys"
family: advisory-lock
tier: core
feature_ids: [advisory-locks, errors, numeric]
required_capabilities: [advisory-locks, errors, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/advisory_lock.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT pg_advisory_lock(1.5)
    expect: error
    sqlstate: "42883"
    comment: no implicit numeric to bigint conversion for function resolution
  - sql: |
      SELECT pg_advisory_lock(1, 'x')
    expect: error
    sqlstate: "22P02"
    comment: the unknown literal is coerced to int4 and fails input
