# NULL advisory keys: the outcome is whatever PostgreSQL does, recorded from the oracle.
id: advisory-lock.null-key-arguments
title: "NULL keys passed to advisory lock functions"
family: advisory-lock
tier: core
feature_ids: [advisory-locks, null-handling]
required_capabilities: [advisory-locks, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/advisory_lock.sql"
  license: "PostgreSQL License"
sessions: [a]
steps:
  - sql: |
      SELECT pg_try_advisory_lock(NULL::bigint)
    expect: any
    comment: author does not assert the NULL result, the recorder does
  - sql: |
      SELECT pg_try_advisory_lock(NULL::int4, 1)
    expect: any
  - sql: |
      SELECT pg_advisory_unlock(NULL::bigint)
    expect: any
  - sql: |
      SELECT pg_advisory_unlock_all()
    expect: rows
