# pg_get_function_arguments / identity_arguments / result / functiondef, including defaults and procedures.
id: doc-functions-info.function-arguments-decompile
title: Function and procedure argument, identity and result reconstruction
family: doc-functions-info
tier: core
feature_ids: [pg-get-function-arguments, pg-get-functiondef, procedures, default-arguments]
required_capabilities: [create-function-sql, create-procedure, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-info (Object Information: pg_get_function_arguments, pg_get_function_identity_arguments, pg_get_function_result, pg_get_functiondef)"
sessions: [a]
setup: |
  CREATE FUNCTION fx_args(a int, b int DEFAULT 5) RETURNS int LANGUAGE sql AS 'SELECT a + b';
  CREATE PROCEDURE px_args(x int DEFAULT 1) LANGUAGE sql AS 'SELECT 1';
steps:
  - sql: |
      SELECT pg_get_function_arguments('fx_args'::regproc) AS args,
             pg_get_function_identity_arguments('fx_args'::regproc) AS identity_args,
             pg_get_function_result('fx_args'::regproc) AS result
    expect: rows
    comment: documented, the identity form omits default values
  - sql: |
      SELECT pg_get_function_result('px_args'::regproc) IS NULL AS proc_result_null,
             pg_get_function_identity_arguments('px_args'::regproc) AS proc_identity,
             pg_get_function_arguments('px_args'::regproc) AS proc_args
    expect: rows
    comment: documented, pg_get_function_result returns NULL for a procedure
  - sql: |
      SELECT pg_get_functiondef('fx_args'::regproc) AS def
    expect: rows
