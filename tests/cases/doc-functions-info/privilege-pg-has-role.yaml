# pg_has_role: MEMBER, USAGE and SET privilege types, the documented WITH ... OPTION spelling, and rejection of PUBLIC as a user.
id: doc-functions-info.privilege-pg-has-role
title: pg_has_role membership, usage and set checks, and PUBLIC rejection
family: doc-functions-info
tier: core
feature_ids: [privilege-inquiry, roles, role-membership]
required_capabilities: [select, roles]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-info (Access Privilege Inquiry Functions: pg_has_role)"
sessions: [a]
steps:
  - sql: |
      SELECT pg_has_role(current_user, current_user, 'MEMBER') AS member,
             pg_has_role(current_user, current_user, 'USAGE') AS usage,
             pg_has_role(current_user, current_user, 'SET WITH ADMIN OPTION') AS set_admin
    expect: rows
    comment: WITH ADMIN OPTION and WITH GRANT OPTION test the same ADMIN privilege
  - sql: |
      SELECT pg_has_role(current_user, current_user, 'bogus')
    expect: error
    sqlstate: "22023"
  - sql: |
      SELECT pg_has_role('public', current_user, 'MEMBER')
    expect: error
    sqlstate: "42704"
    comment: documented, the special case of user = public is not allowed
