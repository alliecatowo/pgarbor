# pg_describe_object and pg_identify_object for table, column and type objects, and NULL for undefined objects.
id: doc-functions-info.describe-identify-object
title: Describe and identify tables, columns and types by catalog OID and sub-object ID
family: doc-functions-info
tier: core
feature_ids: [pg-describe-object, pg-identify-object, object-addressing]
required_capabilities: [create-table, create-domain, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-info (Object Information and Addressing Functions)"
sessions: [a]
setup: |
  CREATE TABLE desc_t (a int, b text);
  CREATE DOMAIN desc_dom AS text;
steps:
  - sql: |
      SELECT pg_describe_object('pg_class'::regclass, 'desc_t'::regclass::oid, 0) AS tbl_desc,
             pg_describe_object('pg_class'::regclass, 'desc_t'::regclass::oid, 1) AS col_desc,
             pg_describe_object('pg_class'::regclass, 0, 0) IS NULL AS undefined_null
    expect: rows
    comment: documented, the sub-object ID is zero for a whole object; undefined objects yield NULL
  - sql: |
      SELECT (pg_identify_object('pg_class'::regclass, 'desc_t'::regclass::oid, 0)).*
    expect: rows
  - sql: |
      SELECT (pg_identify_object('pg_class'::regclass, 'desc_t'::regclass::oid, 2)).*
    expect: rows
  - sql: |
      SELECT (pg_identify_object('pg_type'::regclass, 'desc_dom'::regtype::oid, 0)).*
    expect: rows
