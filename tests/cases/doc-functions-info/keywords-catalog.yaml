# pg_get_keywords: category codes and bare-label flags for selected keywords, and the closed set of category codes.
id: doc-functions-info.keywords-catalog
title: pg_get_keywords reports SQL keyword categories and bare-label status
family: doc-functions-info
tier: core
feature_ids: [pg-get-keywords, keywords]
required_capabilities: [select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-info (System Catalog Information Functions: pg_get_keywords)"
sessions: [a]
steps:
  - sql: |
      SELECT word, catcode, barelabel
      FROM pg_get_keywords()
      WHERE word IN ('abort', 'between', 'integer', 'select', 'user')
      ORDER BY word
    expect: rows
    order: ordered
    comment: documented codes U unreserved, C column name, T type or function name, R reserved
  - sql: |
      SELECT count(*) > 400 AS many_keywords,
             count(*) FILTER (WHERE catcode NOT IN ('U', 'C', 'T', 'R')) AS bad_codes
      FROM pg_get_keywords()
    expect: rows
