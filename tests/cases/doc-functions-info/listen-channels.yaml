# pg_listening_channels reflects LISTEN and UNLISTEN for the current session.
id: doc-functions-info.listen-channels
title: pg_listening_channels lists this session's LISTEN channels and empties on UNLISTEN
family: doc-functions-info
tier: extended
feature_ids: [listen-notify, pg-listening-channels]
required_capabilities: [select, listen-notify]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-info (Session Information Functions: pg_listening_channels)"
sessions: [a]
steps:
  - sql: |
      SELECT count(*) AS before_listen FROM pg_listening_channels()
    expect: rows
  - sql: |
      LISTEN chan_fi_b
    expect: ok
  - sql: |
      LISTEN chan_fi_a
    expect: ok
  - sql: |
      SELECT pg_listening_channels() AS channel ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      UNLISTEN *
    expect: ok
  - sql: |
      SELECT count(*) AS after_unlisten FROM pg_listening_channels()
    expect: rows
