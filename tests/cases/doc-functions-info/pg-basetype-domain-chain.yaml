# pg_basetype follows a domain chain to its base type, returns non-domain types as-is, and returns NULL for NULL input.
id: doc-functions-info.pg-basetype-domain-chain
title: pg_basetype resolves a chain of domains to the base type
family: doc-functions-info
tier: core
feature_ids: [pg-basetype, domains, regtype]
required_capabilities: [create-domain, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-info (System Catalog Information Functions: pg_basetype)"
sessions: [a]
setup: |
  CREATE DOMAIN dom_text AS text;
  CREATE DOMAIN dom_text2 AS dom_text;
steps:
  - sql: |
      SELECT pg_basetype('dom_text2'::regtype)::text AS base_chain,
             pg_basetype('dom_text'::regtype)::text AS one_level,
             pg_basetype('int4'::regtype)::text AS non_domain,
             pg_basetype(NULL::regtype) IS NULL AS null_in
    expect: rows
    comment: documented, recurses through domain dependencies until the base type; non-domain input is returned unchanged
