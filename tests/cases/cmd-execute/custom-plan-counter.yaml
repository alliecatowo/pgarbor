# With plan_cache_mode forced to custom, each EXECUTE plans afresh; pg_prepared_statements counts the custom plans.
id: cmd-execute.custom-plan-counter
title: Each EXECUTE under force_custom_plan increments custom_plans
family: cmd-execute
tier: extended
feature_ids: [execute, prepare, prepared-statements, plan-cache, catalog-introspection]
required_capabilities: [select, prepared-statements, catalog-introspection, guc]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute; ref/prepare.sgml#sql-prepare (Description); pg_prepared_statements view"
sessions: [a]
steps:
  - sql: |
      SET plan_cache_mode = force_custom_plan
    expect: ok
  - sql: |
      PREPARE pc(int) AS SELECT $1 AS v
    expect: ok
  - sql: |
      EXECUTE pc(1)
    expect: rows
  - sql: |
      EXECUTE pc(2)
    expect: rows
  - sql: |
      SELECT name, generic_plans, custom_plans FROM pg_prepared_statements WHERE name = 'pc'
    expect: rows
    comment: two custom plans, no generic plan
