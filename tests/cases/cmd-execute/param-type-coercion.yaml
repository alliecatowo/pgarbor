# Parameters must be compatible with the declared type: quoted literals and numerics are coerced by assignment rules; bad text is an input error.
id: cmd-execute.param-type-coercion
title: EXECUTE coerces arguments to the declared parameter type
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, type-coercion]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Parameters: parameter)"
sessions: [a]
steps:
  - sql: |
      PREPARE q3(int) AS SELECT $1 + 1 AS r
    expect: ok
  - sql: |
      EXECUTE q3('2')
    expect: rows
    comment: quoted literal coerced to int4, result 3
  - sql: |
      EXECUTE q3(2.7)
    expect: rows
    comment: numeric assigned to int4 rounds to 3, result 4
  - sql: |
      EXECUTE q3('abc')
    expect: error
    sqlstate: "22P02"
    comment: not a valid integer literal
  - sql: |
      EXECUTE q3(2147483647)
    expect: error
    sqlstate: "22003"
    comment: int4 + 1 overflows
