# The PREPARE/EXECUTE example from the reference page: EXECUTE supplies typed arguments to an INSERT.
id: cmd-execute.doc-example-fooplan
title: Documented fooplan example inserts a row via EXECUTE
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, insert, boolean, numeric]
required_capabilities: [create-table, insert, select, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml#sql-prepare-examples (referenced from ref/execute.sgml#sql-execute Examples)"
sessions: [a]
setup: |
  CREATE TABLE foo (fooid int, fooname text, fooboolean boolean, foocost numeric)
steps:
  - sql: |
      PREPARE fooplan (int, text, bool, numeric) AS INSERT INTO foo VALUES($1, $2, $3, $4)
    expect: ok
  - sql: |
      EXECUTE fooplan(1, 'Hunter Valley', 't', 200.00)
    expect: ok
    comment: command tag INSERT 0 1
  - sql: |
      SELECT fooid, fooname, fooboolean, foocost FROM foo
    expect: rows
    order: multiset
