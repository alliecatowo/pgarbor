# EXECUTE runs a zero-parameter statement, and parameter expressions are evaluated before binding.
id: cmd-execute.no-args-and-expression-params
title: EXECUTE of a parameterless statement and of expression arguments
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, expressions]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Description, Parameters)"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS SELECT 1 + 1 AS two
    expect: ok
  - sql: |
      EXECUTE p
    expect: rows
    comment: no parameter list needed when the statement takes none
  - sql: |
      PREPARE q(int, text) AS SELECT $1 * 2 AS doubled, upper($2) AS up
    expect: ok
  - sql: |
      EXECUTE q(1 + 2, 'ab' || 'c')
    expect: rows
    comment: arguments are arbitrary expressions yielding compatible values
  - sql: |
      EXECUTE q(-4, NULL)
    expect: rows
