# Unquoted EXECUTE names fold to lower case, so they match only lower-case PREPARE names; quoted names match exactly.
id: cmd-execute.name-case-folding
title: EXECUTE name folding matches the PREPARE name spelling
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, identifiers]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Parameters: name)"
sessions: [a]
steps:
  - sql: |
      PREPARE "Mixed" AS SELECT 'm' AS m
    expect: ok
  - sql: |
      EXECUTE mixed
    expect: error
    sqlstate: "26000"
    comment: unquoted name folds to mixed, which does not exist
  - sql: |
      EXECUTE "Mixed"
    expect: rows
    comment: quoted name matches exactly
