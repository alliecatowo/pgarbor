# Prepared statements exist only in the session that created them; another session cannot EXECUTE them.
id: cmd-execute.session-scope
title: A prepared statement is invisible to other sessions
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, sessions]
required_capabilities: [select, prepared-statements, multi-session, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Description)"
sessions: [a, b]
steps:
  - session: a
    sql: |
      PREPARE shared AS SELECT 42 AS answer
    expect: ok
  - session: b
    sql: |
      EXECUTE shared
    expect: error
    sqlstate: "26000"
    comment: prepared statements only exist for the duration of the session that made them
  - session: a
    sql: |
      EXECUTE shared
    expect: rows
