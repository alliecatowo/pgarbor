# EXECUTE of a name that was never prepared in this session raises 26000.
id: cmd-execute.unknown-name-errors
title: EXECUTE of an unknown prepared statement name raises 26000
family: cmd-execute
tier: core
feature_ids: [execute, prepared-statements, errors]
required_capabilities: [prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Description)"
sessions: [a]
steps:
  - sql: |
      EXECUTE nosuch
    expect: error
    sqlstate: "26000"
    comment: no PREPARE has run in this session
  - sql: |
      PREPARE real AS SELECT 'x' AS v
    expect: ok
  - sql: |
      EXECUTE real
    expect: rows
  - sql: |
      EXECUTE nosuch(1)
    expect: error
    sqlstate: "26000"
    comment: parameters do not change the lookup
