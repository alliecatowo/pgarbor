# EXECUTE must pass exactly as many parameters as PREPARE declared; otherwise an error is raised.
id: cmd-execute.wrong-parameter-count
title: EXECUTE with too few or too many parameters raises 42601
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, errors]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Description)"
sessions: [a]
steps:
  - sql: |
      PREPARE q2(int, text) AS SELECT $1, $2
    expect: ok
  - sql: |
      EXECUTE q2(1)
    expect: error
    sqlstate: "42601"
    comment: too few parameters
  - sql: |
      EXECUTE q2(1, 'a', 'b')
    expect: error
    sqlstate: "42601"
    comment: too many parameters
  - sql: |
      EXECUTE q2(1, 'a')
    expect: rows
    comment: the statement is still usable after the failed calls
