# The parenthesised parameter list must contain at least one expression; empty parentheses are a syntax error.
id: cmd-execute.empty-parens-syntax-error
title: EXECUTE with empty parentheses is a syntax error
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, errors]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Synopsis)"
sessions: [a]
steps:
  - sql: |
      PREPARE p AS SELECT 1 AS one
    expect: ok
  - sql: |
      EXECUTE p()
    expect: error
    sqlstate: "42601"
    comment: synopsis allows ( parameter [, ...] ) only with at least one parameter
  - sql: |
      EXECUTE p
    expect: rows
