# A NULL argument binds as SQL NULL; null-propagating and IS NULL semantics apply inside the statement.
id: cmd-execute.null-parameters
title: NULL arguments propagate through EXECUTE
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, nulls]
required_capabilities: [select, prepared-statements]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Parameters: parameter)"
sessions: [a]
steps:
  - sql: |
      PREPARE nullp(int) AS SELECT $1 IS NULL AS isnull, $1 + 1 AS plus1
    expect: ok
  - sql: |
      EXECUTE nullp(NULL)
    expect: rows
    comment: IS NULL is true; arithmetic on NULL yields NULL
  - sql: |
      EXECUTE nullp(NULL::int)
    expect: rows
  - sql: |
      PREPARE cmp(int) AS SELECT $1 = 1 AS eq
    expect: ok
  - sql: |
      EXECUTE cmp(NULL)
    expect: rows
    comment: comparison with NULL is NULL, not false
