# An error raised by EXECUTE inside a transaction block aborts the block; later commands fail until ROLLBACK.
id: cmd-execute.error-aborts-transaction
title: EXECUTE error inside BEGIN aborts the transaction block
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, transactions, errors]
required_capabilities: [select, prepared-statements, transactions, errors]
provenance:
  source: hand
  ref: "PG18 ref/execute.sgml#sql-execute; transaction block error semantics"
sessions: [a]
steps:
  - sql: |
      PREPARE dz(int) AS SELECT 1 / $1 AS q
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      EXECUTE dz(0)
    expect: error
    sqlstate: "22012"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
    comment: block is aborted; commands ignored
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      EXECUTE dz(5)
    expect: rows
