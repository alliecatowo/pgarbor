# A second PREPARE with a name already in use fails with 42P05 and leaves the original statement intact.
id: cmd-execute.duplicate-prepare-name
title: Re-PREPARE of an existing name raises 42P05; EXECUTE still runs the original
family: cmd-execute
tier: core
feature_ids: [execute, prepare, prepared-statements, errors]
required_capabilities: [select, prepared-statements, errors]
provenance:
  source: pg-docs
  ref: "ref/execute.sgml#sql-execute (Description: name must be unique within a session)"
sessions: [a]
steps:
  - sql: |
      PREPARE dup AS SELECT 1 AS v
    expect: ok
  - sql: |
      PREPARE dup AS SELECT 2 AS v
    expect: error
    sqlstate: "42P05"
  - sql: |
      EXECUTE dup
    expect: rows
    comment: still returns 1
