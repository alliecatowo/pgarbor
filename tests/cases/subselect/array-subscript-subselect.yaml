# Scalar subqueries used as array subscripts and slice bounds, including NULL subscripts.
id: subselect.array-subscript
title: Scalar subqueries as array subscripts and slice bounds
family: subselect
tier: extended
feature_ids: [select, subqueries, arrays, scalar-subquery, generate-series]
required_capabilities: [select, arrays, generate-series]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT (array[1, 2])[(SELECT 2)] AS elem
    expect: rows
  - sql: |
      SELECT (array[1, 2, 3])[(SELECT 1):(SELECT 2)] AS slice
    expect: rows
  - sql: |
      SELECT ((SELECT ARRAY[1, 2, 3]))[2] AS elem
    expect: rows
  - sql: |
      SELECT (SELECT ARRAY[1, 2, 3])[(SELECT 3 WHERE false)] AS elem
    expect: rows
    comment: a NULL subscript yields NULL
  - sql: |
      SELECT (array[1, 2])[(SELECT g.i)] FROM generate_series(1, 2) g(i) ORDER BY g.i
    expect: rows
    order: ordered
