# EXISTS and NOT EXISTS with LIMIT clauses inside the subquery.
id: subselect.exists-limit
title: EXISTS with LIMIT NULL, LIMIT 1 and LIMIT 0 inside a correlated subquery
family: subselect
tier: extended
feature_ids: [select, subqueries, exists, limit, null-semantics]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE ex (f1 int4);
  INSERT INTO ex VALUES (0), (1), (NULL);
steps:
  - sql: |
      SELECT f1 FROM ex o WHERE EXISTS (SELECT 1 FROM ex i WHERE i.f1 = o.f1 LIMIT NULL) ORDER BY f1
    expect: rows
    order: ordered
    comment: LIMIT NULL means no limit
  - sql: |
      SELECT f1 FROM ex o WHERE NOT EXISTS (SELECT 1 FROM ex i WHERE i.f1 = o.f1 LIMIT 1) ORDER BY f1
    expect: rows
    order: ordered
    comment: the NULL row matches nothing, so only it survives
  - sql: |
      SELECT f1 FROM ex o WHERE EXISTS (SELECT 1 FROM ex i WHERE i.f1 = o.f1 LIMIT 0) ORDER BY f1
    expect: rows
    order: ordered
    comment: LIMIT 0 yields no rows, so EXISTS is false for every outer row
  - sql: |
      SELECT count(*) FROM ex WHERE EXISTS (SELECT 1 LIMIT 0)
    expect: rows
    order: multiset
