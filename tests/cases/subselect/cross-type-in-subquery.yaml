# IN with subqueries comparing numeric and float8 columns in both directions.
id: subselect.cross-type-in
title: IN subquery across numeric and float8 columns keeps exact matches in both directions
family: subselect
tier: extended
feature_ids: [select, subqueries, in-subquery, numeric, float8, cross-type-comparison]
required_capabilities: [create-table, insert, select, numeric, float8]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE numeric_table (num_col numeric);
  INSERT INTO numeric_table VALUES (1), (1.000000000000000000001), (2), (3);
  CREATE TABLE float_table (float_col float8);
  INSERT INTO float_table VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT * FROM float_table WHERE float_col IN (SELECT num_col FROM numeric_table) ORDER BY 1
    expect: rows
    order: ordered
  - sql: |
      SELECT * FROM numeric_table WHERE num_col IN (SELECT float_col FROM float_table) ORDER BY 1
    expect: rows
    order: ordered
