# Uncorrelated IN / NOT IN over subqueries, including NULL results and empty subqueries.
id: subselect.in-null-semantics
title: IN and NOT IN over subqueries with NULL and empty results
family: subselect
tier: core
feature_ids: [select, subqueries, in-subquery, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT 1 AS one WHERE 1 IN (SELECT 1)
    expect: rows
  - sql: |
      SELECT 1 AS zero WHERE 1 NOT IN (SELECT 1)
    expect: rows
  - sql: |
      SELECT 1 AS zero WHERE 1 IN (SELECT 2)
    expect: rows
  - sql: |
      SELECT 1 AS r WHERE 1 IN (SELECT 2 UNION ALL SELECT NULL::int4)
    expect: rows
    comment: no match and a NULL in the list gives NULL, so no row
  - sql: |
      SELECT 1 AS r WHERE 1 NOT IN (SELECT 2 UNION ALL SELECT NULL::int4)
    expect: rows
    comment: NOT IN with a NULL in the list is NULL, so no row
  - sql: |
      SELECT 1 AS r WHERE NULL::int4 IN (SELECT 1)
    expect: rows
  - sql: |
      SELECT 1 AS r WHERE NULL::int4 IN (SELECT 1 WHERE false)
    expect: rows
    comment: IN over an empty subquery is false, even for a NULL left operand
  - sql: |
      SELECT 1 AS r WHERE NULL::int4 NOT IN (SELECT 1 WHERE false)
    expect: rows
    comment: NOT IN over an empty subquery is true, so one row
