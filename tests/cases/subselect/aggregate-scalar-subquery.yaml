# A scalar subquery over a whole table combined with per-group aggregates.
id: subselect.aggregate-scalar
title: Uncorrelated scalar count subquery divided into per-group counts
family: subselect
tier: core
feature_ids: [select, subqueries, scalar-subquery, aggregates, group-by, float8]
required_capabilities: [create-table, insert, select, group-by, float8]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE i8 (q1 int8, q2 int8);
  INSERT INTO i8 VALUES (1, 10), (1, 20), (2, 30), (3, 40), (3, 50), (3, 60);
steps:
  - sql: |
      SELECT q1, float8(count(*)) / (SELECT count(*) FROM i8) AS share FROM i8 GROUP BY q1 ORDER BY q1
    expect: rows
    order: ordered
