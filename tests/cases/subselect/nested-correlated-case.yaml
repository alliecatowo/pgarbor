# Multiply nested correlated scalar subqueries with CASE must re-evaluate per outer row.
id: subselect.nested-correlated-case
title: Doubly nested correlated scalar subqueries re-evaluate per outer row
family: subselect
tier: extended
feature_ids: [select, subqueries, correlated-subquery, case-expression, views]
required_capabilities: [create-table, insert, select, create-view]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
setup: |
  CREATE TABLE orderstest (approver_ref int4, po_ref int4, ordercanceled boolean, id int4 PRIMARY KEY);
  INSERT INTO orderstest VALUES (1, 1, false, 1), (66, 5, false, 2), (66, 6, false, 3), (66, 1, true, 4), (66, 8, false, 5), (66, 1, false, 6), (77, 1, false, 7), (1, 1, false, 8);
steps:
  - sql: |
      SELECT ord.id,
        (SELECT CASE WHEN ord.approver_ref = 1 THEN '---' ELSE 'Approved' END) AS approved,
        (SELECT CASE WHEN ord.ordercanceled THEN 'Canceled'
                ELSE (SELECT CASE WHEN ord.po_ref = 1
                                  THEN (SELECT CASE WHEN ord.approver_ref = 1 THEN '---' ELSE 'Approved' END)
                                  ELSE 'PO' END)
              END) AS status,
        (CASE WHEN ord.ordercanceled THEN 'Canceled'
              ELSE (CASE WHEN ord.po_ref = 1
                         THEN (CASE WHEN ord.approver_ref = 1 THEN '---' ELSE 'Approved' END)
                         ELSE 'PO' END)
         END) AS status_ok
      FROM orderstest ord
      ORDER BY ord.id
    expect: rows
    order: ordered
    comment: status and status_ok should agree for every row
  - sql: |
      CREATE VIEW orders_view AS
      SELECT ord.id,
        (SELECT CASE WHEN ord.ordercanceled THEN 'Canceled'
                ELSE (SELECT CASE WHEN ord.po_ref = 1
                                  THEN (SELECT CASE WHEN ord.approver_ref = 1 THEN '---' ELSE 'Approved' END)
                                  ELSE 'PO' END)
              END) AS status
      FROM orderstest ord
    expect: ok
  - sql: |
      SELECT id, status FROM orders_view ORDER BY id
    expect: rows
    order: ordered
