# Extra parentheses around subqueries and set operations are accepted in each context.
id: subselect.grammar-parens
title: Redundant parentheses around subqueries and UNION in FROM, select list and set operations
family: subselect
tier: core
feature_ids: [select, subqueries, union, derived-tables, grammar]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT * FROM (SELECT 1 AS x) ss
    expect: rows
  - sql: |
      SELECT * FROM ((SELECT 1 AS x)) ss
    expect: rows
  - sql: |
      SELECT * FROM ((SELECT 1 AS x)), ((SELECT * FROM ((SELECT 2 AS y))))
    expect: rows
    order: multiset
  - sql: |
      (SELECT 2) UNION SELECT 2
    expect: rows
    order: multiset
  - sql: |
      ((SELECT 2)) UNION SELECT 2
    expect: rows
    order: multiset
  - sql: |
      SELECT ((SELECT 2) UNION SELECT 2) AS u
    expect: rows
  - sql: |
      SELECT (((SELECT 2)) UNION SELECT 2) AS u
    expect: rows
