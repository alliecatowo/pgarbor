# ALL and ANY quantifiers over subqueries with NULL and empty inputs.
id: subselect.quantified-any-all
title: ALL and ANY over subqueries with NULL and empty inputs
family: subselect
tier: core
feature_ids: [select, subqueries, quantified-comparison, null-semantics]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/subselect.sql"
  license: PostgreSQL
steps:
  - sql: |
      SELECT 1 = ALL (SELECT (SELECT 1)) AS r
    expect: rows
    comment: nested scalar subquery inside ALL
  - sql: |
      SELECT 2 = ALL (SELECT 2 UNION ALL SELECT NULL::int4) AS r
    expect: rows
    comment: true for 2 and NULL gives NULL overall
  - sql: |
      SELECT 2 = ANY (SELECT 1 UNION ALL SELECT 2) AS r
    expect: rows
  - sql: |
      SELECT 1 = ANY (SELECT NULL::int4 UNION ALL SELECT 2) AS r
    expect: rows
    comment: no true match and a NULL present gives NULL
  - sql: |
      SELECT 3 = ANY (SELECT 1 WHERE false) AS r
    expect: rows
    comment: ANY over an empty set is false
  - sql: |
      SELECT 3 = ALL (SELECT 1 WHERE false) AS r
    expect: rows
    comment: ALL over an empty set is true
