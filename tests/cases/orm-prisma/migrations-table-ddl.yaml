# Prisma-style _prisma_migrations table: DDL, explicit-value inserts, ordered read-back.
id: orm-prisma.migrations-table-ddl
title: Prisma _prisma_migrations DDL with explicit-value inserts and ordered read-back
family: orm-prisma
tier: core
feature_ids: [create-table, insert, select, timestamptz, varchar, primary-key]
required_capabilities: [create-table, insert, select, primary-key, varchar, timestamptz]
provenance:
  source: research
  ref: "Prisma migrate SQL for PostgreSQL (_prisma_migrations column shape); PG18 docs sql-createtable.html"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE "_prisma_migrations" (
        "id" VARCHAR(36) NOT NULL,
        "checksum" VARCHAR(64) NOT NULL,
        "finished_at" TIMESTAMPTZ,
        "migration_name" VARCHAR(255) NOT NULL,
        "logs" TEXT,
        "rolled_back_at" TIMESTAMPTZ,
        "started_at" TIMESTAMPTZ NOT NULL DEFAULT now(),
        "applied_steps_count" INTEGER NOT NULL DEFAULT 0,
        CONSTRAINT "_prisma_migrations_pkey" PRIMARY KEY ("id")
      )
    expect: ok
  - sql: |
      INSERT INTO "_prisma_migrations"
        ("id", "checksum", "finished_at", "migration_name", "logs", "rolled_back_at", "started_at", "applied_steps_count")
      VALUES
        ('0b1f', 'c1', '2024-01-02 03:04:05+00', '20240101000000_init', NULL, NULL, '2024-01-02 03:04:00+00', 3),
        ('9a7e', 'c2', NULL, '20240201000000_add_users', 'boom', NULL, '2024-02-01 00:00:00+00', 0)
    expect: ok
  - sql: |
      SELECT "migration_name", "applied_steps_count", "finished_at" IS NOT NULL AS finished
      FROM "_prisma_migrations"
      ORDER BY "migration_name"
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS not_rolled_back FROM "_prisma_migrations" WHERE "rolled_back_at" IS NULL
    expect: rows
