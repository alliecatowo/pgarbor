# The documented GRANT UPDATE example: UPDATE alone is not enough when the WHERE clause reads a column.
id: doc-ddl-priv.grant-update-needs-select
title: GRANT UPDATE on a table does not allow an UPDATE that reads columns without SELECT
family: doc-ddl-priv
tier: core
feature_ids: [grant, revoke, update, select, privileges, errors]
required_capabilities: [create-table, insert, select, update, roles, errors]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-priv (GRANT UPDATE ON accounts TO joe; UPDATE needs SELECT as well)"
sessions: [a]
setup: |
  DROP ROLE IF EXISTS ddp_gu_joe;
  CREATE ROLE ddp_gu_joe;
  CREATE TABLE accounts (id int4, bal int4);
  INSERT INTO accounts VALUES (1, 10);
  GRANT UPDATE ON accounts TO ddp_gu_joe;
steps:
  - sql: |
      SET ROLE ddp_gu_joe
    expect: ok
  - sql: |
      UPDATE accounts SET bal = bal + 1 WHERE id = 1
    expect: error
    sqlstate: "42501"
    comment: the WHERE clause references id, which needs SELECT
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      GRANT SELECT ON accounts TO ddp_gu_joe
    expect: ok
  - sql: |
      SET ROLE ddp_gu_joe
    expect: ok
  - sql: |
      UPDATE accounts SET bal = bal + 1 WHERE id = 1
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT id, bal FROM accounts ORDER BY id
    expect: rows
    order: ordered
    comment: with SELECT and UPDATE both granted the update lands
  - sql: |
      REVOKE ALL ON accounts FROM PUBLIC
    expect: ok
    comment: the documented REVOKE ALL FROM PUBLIC form is accepted even with no PUBLIC grant
