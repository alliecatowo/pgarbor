# TRIGGER privilege: only a role holding it may create a trigger on the table.
id: doc-ddl-priv.trigger-privilege
title: TRIGGER privilege is required to create a trigger on a table
family: doc-ddl-priv
tier: extended
feature_ids: [trigger, grant, privileges, plpgsql, errors]
required_capabilities: [create-table, create-schema, plpgsql, roles, errors, select]
provenance:
  source: pg-docs
  ref: "ddl.sgml#ddl-priv (TRIGGER: allows creation of a trigger on a table)"
sessions: [a]
setup: |
  CREATE ROLE ddp_tg_rw;
  CREATE SCHEMA tg_s;
  GRANT USAGE ON SCHEMA tg_s TO ddp_tg_rw;
  CREATE FUNCTION tg_s.tg_fn() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
  CREATE TABLE tg_s.t_on (a int4);
  CREATE TABLE tg_s.t_off (a int4);
  GRANT TRIGGER ON tg_s.t_on TO ddp_tg_rw;
steps:
  - sql: |
      SET ROLE ddp_tg_rw
    expect: ok
  - sql: |
      CREATE TRIGGER t_on_b BEFORE INSERT ON tg_s.t_on FOR EACH ROW EXECUTE FUNCTION tg_s.tg_fn()
    expect: ok
  - sql: |
      CREATE TRIGGER t_off_b BEFORE INSERT ON tg_s.t_off FOR EACH ROW EXECUTE FUNCTION tg_s.tg_fn()
    expect: error
    sqlstate: "42501"
    comment: no TRIGGER privilege on t_off
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT c.relname, t.tgname FROM pg_trigger t JOIN pg_class c ON c.oid = t.tgrelid WHERE NOT t.tgisinternal ORDER BY c.relname, t.tgname
    expect: rows
    order: ordered
