# tsquery operators: AND, OR, NOT, FOLLOWED BY, containment, and their documented examples.
id: doc-functions-textsearch.tsquery-boolean-operators
title: tsquery &&, ||, !!, <->, @> and <@ combine and compare query trees as documented
family: doc-functions-textsearch
tier: core
feature_ids: [tsquery-and, tsquery-or, tsquery-not, tsquery-phrase-operator, tsquery-containment]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-textsearch (Text Search Operators table, tsquery rows)"
sessions: [a]
steps:
  - sql: |
      SELECT 'fat | rat'::tsquery && 'cat'::tsquery AS and_of_or,
             'fat | rat'::tsquery || 'cat'::tsquery AS or_of_or
    expect: rows
    comment: documented examples; && and || parenthesize the OR operand as needed
  - sql: |
      SELECT !! 'cat'::tsquery AS negated
    expect: rows
  - sql: |
      SELECT to_tsquery('fat') <-> to_tsquery('rat') AS followed_by
    expect: rows
  - sql: |
      SELECT 'cat'::tsquery @> 'cat & rat'::tsquery AS contains,
             'cat'::tsquery <@ 'cat & rat'::tsquery AS contained,
             'cat'::tsquery <@ '!cat & rat'::tsquery AS contained_negated
    expect: rows
    comment: the documented containment examples return false, true, false
  - sql: |
      SELECT 'fat & rat'::tsquery = 'rat & fat'::tsquery AS same_tree_different_order
    expect: rows
    comment: AND is commutative after normalization, so these compare equal
  - sql: |
      SELECT to_tsvector('fat rat') @@ (!! 'cat'::tsquery) AS not_cat_present
    expect: rows
    comment: NOT matches documents that lack the lexeme
