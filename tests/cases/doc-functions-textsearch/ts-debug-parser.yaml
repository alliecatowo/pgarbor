# The parser and dictionary inspection functions: ts_debug, ts_parse, ts_token_type and ts_lexize.
id: doc-functions-textsearch.ts-debug-parser
title: ts_debug, ts_parse, ts_token_type and ts_lexize expose the default parser and english dictionaries
family: doc-functions-textsearch
tier: core
feature_ids: [ts-debug, ts-parse, ts-token-type, ts-lexize, default-parser]
required_capabilities: [select, text-search]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-textsearch (ts_debug, ts_lexize, ts_parse, ts_token_type)"
sessions: [a]
steps:
  - sql: |
      SELECT alias, token, dictionaries, lexemes FROM ts_debug('english', 'The Brightest supernovaes') WHERE alias <> 'blank'
    expect: rows
    order: multiset
    comment: whitespace tokens are filtered out so the output is the word tokens only
  - sql: |
      SELECT tokid, token FROM ts_parse('default', 'foo - bar') ORDER BY tokid
    expect: rows
    order: ordered
    comment: documented example; word tokens have id 1 and blank tokens have id 12
  - sql: |
      SELECT tokid, alias FROM ts_token_type('default') WHERE tokid IN (1, 2, 12) ORDER BY tokid
    expect: rows
    order: ordered
  - sql: |
      SELECT ts_token_type('default') IS NOT NULL AS has_types
    expect: rows
  - sql: |
      SELECT ts_lexize('english_stem', 'stars') AS stemmed
    expect: rows
    comment: documented example returns {star}
  - sql: |
      SELECT ts_lexize('english_stem', 'the') AS stop_word
    expect: rows
    comment: a stop word yields an empty array
  - sql: |
      SELECT ts_lexize('nodict', 'x') AS unknown
    expect: error
    sqlstate: "42704"
