# ts_stat aggregates word document and occurrence counts over a tsvector column.
id: doc-functions-textsearch.ts-stat-table
title: ts_stat counts documents and occurrences per lexeme across a tsvector column
family: doc-functions-textsearch
tier: core
feature_ids: [ts-stat, tsvector-column, to-tsvector]
required_capabilities: [select, create-table, insert, text-search, multi-statement]
provenance:
  source: pg-docs
  ref: "func.sgml#functions-textsearch (ts_stat)"
sessions: [a]
setup: |
  CREATE TABLE apod (id int4 PRIMARY KEY, vector tsvector);
  INSERT INTO apod VALUES
    (1, to_tsvector('english', 'cat sat on the mat')),
    (2, to_tsvector('english', 'cat and dog')),
    (3, to_tsvector('english', 'dog dog dog'));
steps:
  - sql: |
      SELECT word, ndoc, nentry FROM ts_stat('SELECT vector FROM apod') ORDER BY word
    expect: rows
    order: ordered
    comment: ndoc counts documents containing the word; nentry counts all occurrences
  - sql: |
      SELECT word, ndoc, nentry FROM ts_stat('SELECT vector FROM apod WHERE id > 1', 'A') ORDER BY word
    expect: rows
    order: ordered
    comment: the weights argument limits counting to positions with the given weight, so this returns no rows for unweighted vectors
  - sql: |
      SELECT word, ndoc, nentry FROM ts_stat('SELECT vector FROM apod') WHERE word = 'dog'
    expect: rows
    order: multiset
