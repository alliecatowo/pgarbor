# Naming a savepoint that was never defined is an error (3B001) and aborts the block.
id: cmd-release-savepoint.unknown-name-3b001
title: RELEASE of a savepoint not yet defined fails with 3B001 and aborts the block
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, errors, begin]
required_capabilities: [transactions, savepoints, errors]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Notes: Specifying a savepoint name that was not previously defined is an error)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      RELEASE SAVEPOINT s1
    expect: error
    sqlstate: "3B001"
  - sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
    comment: the failed RELEASE aborted the block
  - sql: |
      ROLLBACK
    expect: ok
