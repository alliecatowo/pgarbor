# The savepoint name is an identifier: unquoted names fold to lower case, quoted names keep their case.
id: cmd-release-savepoint.identifier-case-folding
title: RELEASE matches savepoint names as identifiers, so quoted mixed case differs from unquoted lower case
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, identifiers, errors, begin, commit]
required_capabilities: [transactions, savepoints, errors]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Parameters: savepoint_name)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT "MixedCase"
    expect: ok
  - sql: |
      RELEASE SAVEPOINT mixedcase
    expect: error
    sqlstate: "3B001"
    comment: unquoted mixedcase folds to mixedcase, which is a different savepoint
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT MixedCase
    expect: ok
  - sql: |
      RELEASE SAVEPOINT "mixedcase"
    expect: ok
    comment: unquoted MixedCase was stored as mixedcase, so the quoted lower-case name matches
  - sql: |
      COMMIT
    expect: ok
