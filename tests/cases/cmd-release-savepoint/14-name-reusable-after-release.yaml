# Once released, a savepoint name is free: defining it again works, and ROLLBACK TO targets the new definition.
id: cmd-release-savepoint.name-reusable-after-release
title: A released savepoint name can be defined again, and ROLLBACK TO targets the new savepoint
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, rollback-to, begin, commit, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Description: releases the savepoint and frees its resources)"
sessions: [a]
setup: |
  CREATE TABLE t (v int4);
steps:
  - sql: |
      BEGIN;
      SAVEPOINT a;
      INSERT INTO t VALUES (1);
      RELEASE SAVEPOINT a;
      SAVEPOINT a;
      INSERT INTO t VALUES (2);
      ROLLBACK TO SAVEPOINT a;
      COMMIT
    expect: ok
  - sql: |
      SELECT v FROM t ORDER BY v
    expect: rows
    order: ordered
    comment: row 1 was merged into the transaction by the release; row 2 was rolled back
