# In an aborted block RELEASE is refused (25P02); ROLLBACK TO the savepoint recovers it, and the savepoint still exists afterwards.
id: cmd-release-savepoint.aborted-block-25p02
title: RELEASE in an aborted block fails with 25P02, and the savepoint can still be released after ROLLBACK TO
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, rollback-to, errors, begin, commit]
required_capabilities: [transactions, savepoints, select, errors]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Notes: not possible to release a savepoint when the transaction is in an aborted state)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SAVEPOINT s
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      RELEASE SAVEPOINT s
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK TO SAVEPOINT s
    expect: ok
  - sql: |
      RELEASE SAVEPOINT s
    expect: ok
  - sql: |
      COMMIT
    expect: ok
