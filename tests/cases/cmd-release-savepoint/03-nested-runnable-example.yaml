# The documented nested example, with its deliberate syntax error removed so the block can commit.
id: cmd-release-savepoint.nested-runnable-example
title: Releasing an inner savepoint merges its work into the enclosing savepoint and the block commits all rows
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, nested-savepoints, begin, commit, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Examples: A more complex example with multiple nested subtransactions)"
sessions: [a]
setup: |
  CREATE TABLE t (v int4);
steps:
  - sql: |
      BEGIN;
      INSERT INTO t VALUES (1);
      SAVEPOINT sp1;
      INSERT INTO t VALUES (2);
      SAVEPOINT sp2;
      INSERT INTO t VALUES (3);
      RELEASE SAVEPOINT sp2;
      INSERT INTO t VALUES (4);
      COMMIT
    expect: ok
  - sql: |
      SELECT v FROM t ORDER BY v
    expect: rows
    order: ordered
    comment: no savepoint was rolled back, so 1, 2, 3 and 4 are all present
