# Documented example: establish a savepoint, insert after it, release it, commit. Both rows survive.
id: cmd-release-savepoint.basic-documented-example
title: RELEASE SAVEPOINT keeps work done after the savepoint and COMMIT persists both rows
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, begin, commit, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Examples: To establish and later release a savepoint)"
sessions: [a]
setup: |
  CREATE TABLE t (v int4);
steps:
  - sql: |
      BEGIN;
      INSERT INTO t VALUES (3);
      SAVEPOINT my_savepoint;
      INSERT INTO t VALUES (4);
      RELEASE SAVEPOINT my_savepoint;
      COMMIT
    expect: ok
  - sql: |
      SELECT v FROM t ORDER BY v
    expect: rows
    order: ordered
    comment: documented result - the transaction inserts both 3 and 4
