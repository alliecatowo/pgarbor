# Releasing a savepoint does not commit anything: a later ROLLBACK of the enclosing transaction discards the released work.
id: cmd-release-savepoint.rollback-discards-released-work
title: ROLLBACK after RELEASE SAVEPOINT discards all work, including the released work
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, rollback, begin, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Description: released changes merge into the enclosing transaction)"
sessions: [a]
setup: |
  CREATE TABLE t (v int4);
steps:
  - sql: |
      BEGIN;
      INSERT INTO t VALUES (1);
      SAVEPOINT s;
      INSERT INTO t VALUES (2);
      RELEASE SAVEPOINT s;
      ROLLBACK
    expect: ok
  - sql: |
      SELECT v FROM t ORDER BY v
    expect: rows
    order: ordered
    comment: expect no rows
