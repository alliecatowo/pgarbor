# SAVEPOINT is optional in RELEASE, and keywords are case-insensitive.
id: cmd-release-savepoint.without-keyword-and-case
title: RELEASE without the SAVEPOINT keyword, in lower case, releases the named savepoint
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, begin, commit, insert, select]
required_capabilities: [create-table, insert, select, transactions, savepoints]
provenance:
  source: pg-docs
  ref: "ref/release_savepoint.sgml#sql-release-savepoint (Compatibility: SAVEPOINT keyword may be omitted)"
sessions: [a]
setup: |
  CREATE TABLE t (v int4);
steps:
  - sql: |
      begin;
      insert into t values (1);
      savepoint sp;
      insert into t values (2);
      release sp;
      commit
    expect: ok
  - sql: |
      SELECT v FROM t ORDER BY v
    expect: rows
    order: ordered
    comment: both rows committed; RELEASE sp without the keyword released the savepoint
