# RELEASE SAVEPOINT only makes sense inside a transaction block; in autocommit it fails with 25P01.
id: cmd-release-savepoint.outside-transaction-25p01
title: RELEASE SAVEPOINT outside a transaction block fails with 25P01
family: cmd-release-savepoint
tier: core
feature_ids: [release-savepoint, savepoints, errors]
required_capabilities: [transactions, savepoints, errors]
provenance:
  source: hand
  ref: "PG18 errcodes 25P01 (no_active_sql_transaction); RELEASE SAVEPOINT requires a transaction block"
sessions: [a]
steps:
  - sql: |
      RELEASE SAVEPOINT s
    expect: error
    sqlstate: "25P01"
    comment: no transaction block is active in autocommit mode
