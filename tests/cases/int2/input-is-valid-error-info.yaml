# pg_input_is_valid and pg_input_error_info report int2 input failures without raising an error.
id: int2.input-is-valid-error-info
title: "pg_input_is_valid and pg_input_error_info classify int2 inputs without raising"
family: int2
tier: extended
feature_ids: [int2, errors, input-validation-functions]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT pg_input_is_valid('34', 'int2') AS ok34, pg_input_is_valid('asdf', 'int2') AS bad_text, pg_input_is_valid('50000', 'int2') AS out_of_range
    expect: rows
    order: multiset
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('50000', 'int2')
    expect: rows
    order: multiset
  - sql: |
      SELECT message, sql_error_code FROM pg_input_error_info('asdf', 'int2')
    expect: rows
    order: multiset
