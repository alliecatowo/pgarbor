# int2 literals in binary, octal and hex notation, including the exact bounds written in each radix.
id: int2.radix-literals-valid
title: "int2 accepts 0b, 0o and 0x literals up to the int2 bounds, with sign"
family: int2
tier: extended
feature_ids: [int2, literals, radix-literals]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT int2 '0b100101' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0o273' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0x42F' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0b111111111111111' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0o77777' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0x7FFF' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '-0b1000000000000000' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '-0o100000' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '-0x8000' AS v
    expect: rows
    order: multiset
