# numeric to int2 cast rounds half away from zero, unlike the float8 path.
id: int2.cast-numeric-rounding
title: "numeric to int2 cast rounds .5 values away from zero"
family: int2
tier: core
feature_ids: [int2, casts, numeric, rounding]
required_capabilities: [select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT x, x::int2 AS int2_value
      FROM (VALUES (-2.5::numeric), (-1.5::numeric), (-0.5::numeric), (0.0::numeric), (0.5::numeric), (1.5::numeric), (2.5::numeric)) t(x)
      ORDER BY x
    expect: rows
    order: ordered
