# int2vector input is whitespace-separated int2 values; element errors surface through pg_input_error_info.
id: int2.int2vector-input
title: "int2vector accepts space-separated int2 elements and reports element errors by SQLSTATE"
family: int2
tier: extended
feature_ids: [int2, int2vector, input-validation-functions, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT pg_input_is_valid(' 1 3  5 ', 'int2vector') AS valid_vector
    expect: rows
    order: multiset
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('1 asdf', 'int2vector')
    expect: rows
    order: multiset
  - sql: |
      SELECT sql_error_code FROM pg_input_error_info('50000', 'int2vector')
    expect: rows
    order: multiset
