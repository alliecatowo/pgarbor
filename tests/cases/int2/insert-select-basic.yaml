# Basic int2 storage and read-back: boundary values, zero, sign, NULL, aggregates over int2.
id: int2.insert-select-basic
title: "int2 column stores -32768..32767 and NULL, reads back ordered and aggregated"
family: int2
tier: slice
feature_ids: [int2, create-table, insert, select, aggregates]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
setup: |
  CREATE TABLE int2_t (id int4 PRIMARY KEY, f1 int2);
  INSERT INTO int2_t VALUES (1, 0), (2, 1), (3, -1), (4, 32767), (5, -32768), (6, NULL);
steps:
  - sql: |
      SELECT id, f1 FROM int2_t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, pg_typeof(f1)::text AS typ FROM int2_t WHERE id = 4
    expect: rows
    order: multiset
  - sql: |
      SELECT count(*), count(f1), sum(f1), min(f1), max(f1) FROM int2_t
    expect: rows
    order: multiset
  - sql: |
      SELECT id FROM int2_t WHERE f1 < 0 ORDER BY id
    expect: rows
    order: ordered
