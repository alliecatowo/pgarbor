# Radix literals with no digits raise 22P02; radix literals one past the int2 range raise 22003.
id: int2.radix-literals-bounds-errors
title: "radix int2 literals: empty digits give 22P02, values past the int2 range give 22003"
family: int2
tier: extended
feature_ids: [int2, literals, radix-literals, errors, overflow]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT int2 '0b'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int2 '0o'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int2 '0x'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int2 '0b1000000000000000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int2 '0o100000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int2 '0x8000'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int2 '-0b1000000000000001'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int2 '-0o100001'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT int2 '-0x8001'
    expect: error
    sqlstate: "22003"
