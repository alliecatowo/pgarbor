# int2 operators: int2 op int2 yields smallint, int2 op int4 yields integer, and division truncates toward zero.
id: int2.arithmetic-result-types
title: "int2 arithmetic results and result types for int2 and int4 operands"
family: int2
tier: core
feature_ids: [int2, arithmetic, operators, cross-type-operators]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
setup: |
  CREATE TABLE int2_a (f1 int2);
  INSERT INTO int2_a VALUES (0), (1), (-1), (100), (16383), (-16383);
steps:
  - sql: |
      SELECT f1, f1 * int2 '2' AS mul2, f1 + int2 '2' AS add2, f1 - int2 '2' AS sub2, f1 / int2 '2' AS div2 FROM int2_a ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, f1 * int4 '2' AS mul4, f1 + int4 '2' AS add4, f1 - int4 '2' AS sub4, f1 / int4 '2' AS div4 FROM int2_a ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT pg_typeof(int2 '1' * int2 '2')::text AS int2_op_int2, pg_typeof(int2 '1' * int4 '2')::text AS int2_op_int4
    expect: rows
    order: multiset
