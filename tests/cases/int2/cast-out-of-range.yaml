# Casts to int2 check the range after rounding: 32767.4 fits, 32767.5 rounds to 32768 and overflows.
id: int2.cast-out-of-range
title: "float8 and numeric casts to int2 raise 22003 when the rounded value leaves the int2 range"
family: int2
tier: core
feature_ids: [int2, casts, errors, rounding, overflow]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT 50000::float8::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 32767.4::numeric::int2 AS fits
    expect: rows
    order: multiset
  - sql: |
      SELECT 32767.5::numeric::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT -32768.5::numeric::int2
    expect: error
    sqlstate: "22003"
