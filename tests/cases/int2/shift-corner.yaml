# int2 left shift wraps within 16 bits without raising an error.
id: int2.shift-corner
title: "int2 left shift by 15 wraps to -32768 and adding 1 gives -32767"
family: int2
tier: extended
feature_ids: [int2, bitwise, operators]
required_capabilities: [select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT (-1::int2<<15)::text AS shifted
    expect: rows
    order: multiset
  - sql: |
      SELECT ((-1::int2<<15)+1::int2)::text AS shifted_plus_one
    expect: rows
    order: multiset
