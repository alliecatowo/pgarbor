# int2 input conversion rejects values outside -32768..32767 with 22003; the bounds themselves are accepted.
id: int2.input-out-of-range
title: "int2 input rejects 100000, 50000 and -32769 with numeric_value_out_of_range; bounds accepted"
family: int2
tier: core
feature_ids: [int2, insert, errors, numeric-range]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
setup: |
  CREATE TABLE int2_tbl (f1 int2);
steps:
  - sql: |
      INSERT INTO int2_tbl(f1) VALUES ('100000')
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO int2_tbl(f1) VALUES ('50000')
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO int2_tbl(f1) VALUES ('-32769')
    expect: error
    sqlstate: "22003"
  - sql: |
      INSERT INTO int2_tbl(f1) VALUES ('-32768'), ('32767')
    expect: ok
  - sql: |
      SELECT f1 FROM int2_tbl ORDER BY f1
    expect: rows
    order: ordered
