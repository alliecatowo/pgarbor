# float8 to int2 cast rounds half to even (rint), so .5 values go to the nearest even integer.
id: int2.cast-float-rounding
title: "float8 to int2 cast uses round-half-to-even at .5 boundaries"
family: int2
tier: core
feature_ids: [int2, casts, float8, rounding]
required_capabilities: [select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT x, x::int2 AS int2_value
      FROM (VALUES (-2.5::float8), (-1.5::float8), (-0.5::float8), (0.0::float8), (0.5::float8), (1.5::float8), (2.5::float8)) t(x)
      ORDER BY x
    expect: rows
    order: ordered
