# Digit separators in int2 literals: allowed between digits and after a radix prefix, rejected at the edges or doubled.
id: int2.underscore-separators
title: "int2 digit separators accepted between digits and after radix prefixes; edge and doubled underscores rejected"
family: int2
tier: extended
feature_ids: [int2, literals, digit-separators, errors]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT int2 '1_000' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '1_2_3' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0xE_FF' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0o2_73' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '0b_10_0101' AS v
    expect: rows
    order: multiset
  - sql: |
      SELECT int2 '_100'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int2 '100_'
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int2 '10__000'
    expect: error
    sqlstate: "22P02"
