# int2 columns compare against int2 and int4 operands; modulo keeps the sign of the dividend.
id: int2.comparison-mixed-width
title: "int2 column compared with int2 and int4 literals, including modulo on negative values"
family: int2
tier: core
feature_ids: [int2, comparison, operators, cross-type-operators]
required_capabilities: [create-table, insert, select, order-by]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
setup: |
  CREATE TABLE int2_c (f1 int2);
  INSERT INTO int2_c VALUES (0), (1), (-1), (32767), (-32768);
steps:
  - sql: |
      SELECT f1, f1 = int4 '0' AS eq4, f1 <> int2 '0' AS ne2, f1 < int4 '0' AS lt4, f1 <= int2 '0' AS le2, f1 > int4 '0' AS gt4, f1 >= int2 '0' AS ge2 FROM int2_c ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1 FROM int2_c WHERE (f1 % int2 '2') = int2 '1' ORDER BY f1
    expect: rows
    order: ordered
  - sql: |
      SELECT f1, f1 % int2 '2' AS rem FROM int2_c ORDER BY f1
    expect: rows
    order: ordered
