# int2 arithmetic overflow raises 22003; INT16_MIN % -1 is defined as 0; int4 operands widen instead of failing.
id: int2.arithmetic-overflow-error
title: "int2 multiply, add, subtract and divide overflow raise 22003; modulo of INT16_MIN by -1 is 0"
family: int2
tier: core
feature_ids: [int2, arithmetic, errors, overflow]
required_capabilities: [select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
steps:
  - sql: |
      SELECT (-32768)::int2 * (-1)::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT 32767::int2 + int2 '1'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-32768)::int2 - int2 '1'
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-32768)::int2 / (-1)::int2
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT (-32768)::int2 % (-1)::int2 AS rem
    expect: rows
    order: multiset
  - sql: |
      SELECT 32767::int2 + int4 '1' AS widened
    expect: rows
    order: multiset
