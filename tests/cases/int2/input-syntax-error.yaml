# int2 input rejects non-integers, embedded spaces, signs separated from digits and empty strings with 22P02.
id: int2.input-syntax-error
title: "int2 input rejects 34.5, blanks, '- 1234', '4 444', '123 dt' and empty string with 22P02"
family: int2
tier: core
feature_ids: [int2, insert, errors]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/int2.sql"
setup: |
  CREATE TABLE int2_bad (f1 int2);
steps:
  - sql: |
      INSERT INTO int2_bad(f1) VALUES ('34.5')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int2_bad(f1) VALUES ('asdf')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int2_bad(f1) VALUES ('    ')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int2_bad(f1) VALUES ('- 1234')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int2_bad(f1) VALUES ('4 444')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int2_bad(f1) VALUES ('123 dt')
    expect: error
    sqlstate: "22P02"
  - sql: |
      INSERT INTO int2_bad(f1) VALUES ('')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT count(*) FROM int2_bad
    expect: rows
    order: multiset
