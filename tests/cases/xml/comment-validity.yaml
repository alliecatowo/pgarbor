id: xml.comment-validity
title: xmlcomment accepts ordinary text and rejects hyphen edge cases
family: xml
tier: core
feature_ids: [xml, xmlcomment, errors]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xmlcomment('test')::text
    expect: rows
  - sql: |
      SELECT xmlcomment('te st')::text
    expect: rows
  - sql: |
      SELECT xmlcomment(NULL) IS NULL AS is_null
    expect: rows
    comment: xmlcomment is strict so NULL in gives NULL out
  - sql: |
      SELECT xmlcomment('test-')
    expect: error
    sqlstate: "2200S"
  - sql: |
      SELECT xmlcomment('--test')
    expect: error
    sqlstate: "2200S"
