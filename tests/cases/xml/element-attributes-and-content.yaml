id: xml.element-attributes-and-content
title: xmlelement attributes, NULL handling, and content escaping
family: xml
tier: core
feature_ids: [xml, xmlelement, xmlattributes, escaping, nulls]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xmlelement(name element, xmlattributes(1 AS one, 'deuce' AS two), 'content')::text
    expect: rows
  - sql: |
      SELECT xmlelement(name foo, xmlattributes(NULL::int AS a, 2 AS b))::text
    expect: rows
    comment: NULL attribute values are omitted
  - sql: |
      SELECT xmlelement(name foo, NULL::text)::text
    expect: rows
  - sql: |
      SELECT xmlelement(name foo, text 'b<a/>r')::text
    expect: rows
    comment: text content is escaped
  - sql: |
      SELECT xmlelement(name foo, xml 'b<a/>r')::text
    expect: rows
    comment: xml content is inserted unescaped
  - sql: |
      SELECT xmlelement(name foo, xmlattributes('<>&"''' AS funny))::text
    expect: rows
    comment: attribute values are escaped
  - sql: |
      SELECT xmlelement(name duplicate, xmlattributes(1 AS a, 2 AS b, 3 AS a))
    expect: error
    comment: duplicate attribute name is rejected
