id: xml.input-validity
title: XML input validity through pg_input_is_valid and strict xml input errors
family: xml
tier: core
feature_ids: [xml, xml-input, pg-input-validation]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT pg_input_is_valid('<value>one</value>', 'xml')
    expect: rows
  - sql: |
      SELECT pg_input_is_valid('<value>one</', 'xml')
    expect: rows
    comment: malformed input reports false instead of raising
  - sql: |
      SELECT pg_input_is_valid('<?xml version="1.0" standalone="y"?><foo/>', 'xml')
    expect: rows
  - sql: |
      SELECT xml '<value>one</'
    expect: error
    sqlstate: "2200N"
    comment: default xmloption is CONTENT so an unclosed tag is invalid XML content
