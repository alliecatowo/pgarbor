id: xml.concat-and-null
title: xmlconcat joins fragments, skips NULLs, and rejects non-xml arguments
family: xml
tier: core
feature_ids: [xml, xmlconcat, nulls, errors]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xmlconcat(xmlcomment('hello'), xmlelement(name qux, 'foo'), xmlcomment('world'))::text
    expect: rows
  - sql: |
      SELECT xmlconcat('<foo/>', NULL, '<bar/>')::text
    expect: rows
    comment: NULL arguments contribute nothing
  - sql: |
      SELECT xmlconcat(NULL, NULL) IS NULL AS all_null
    expect: rows
  - sql: |
      SELECT xmlconcat(1, 2)
    expect: error
    sqlstate: "42804"
    comment: integer arguments are not xml
