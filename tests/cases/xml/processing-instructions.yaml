id: xml.processing-instructions
title: xmlpi builds processing instructions and rejects reserved targets and bad data
family: xml
tier: core
feature_ids: [xml, xmlpi, errors, nulls]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xmlpi(name foo)::text
    expect: rows
  - sql: |
      SELECT xmlpi(name foo, 'bar')::text
    expect: rows
  - sql: |
      SELECT xmlpi(name foo, NULL)::text
    expect: rows
    comment: NULL data gives a PI with no data
  - sql: |
      SELECT xmlpi(name "xml-stylesheet", 'href="mystyle.css" type="text/css"')::text
    expect: rows
  - sql: |
      SELECT xmlpi(name xml)
    expect: error
    sqlstate: "2200T"
    comment: the target xml is reserved
  - sql: |
      SELECT xmlpi(name foo, 'in?>valid')
    expect: error
    sqlstate: "2200T"
    comment: the data may not contain the end marker
