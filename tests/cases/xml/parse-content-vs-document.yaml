id: xml.parse-content-vs-document
title: xmlparse CONTENT accepts fragments while DOCUMENT requires a single rooted document
family: xml
tier: core
feature_ids: [xml, xmlparse, xml-option, errors]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xmlparse(content 'abc')::text
    expect: rows
    comment: plain text is valid content
  - sql: |
      SELECT xmlparse(content '<abc>x</abc>')::text
    expect: rows
  - sql: |
      SELECT xmlparse(content '<nosuchprefix:tag/>')::text
    expect: rows
    comment: namespace prefixes are not checked by the parser
  - sql: |
      SELECT xmlparse(content '<value>one</')
    expect: error
    sqlstate: "2200N"
  - sql: |
      SELECT xmlparse(document 'abc')
    expect: error
    sqlstate: "2200M"
    comment: a document must have a root element
  - sql: |
      SELECT xmlparse(document '<invalidentity>&</abc>  ')
    expect: error
    sqlstate: "2200M"
