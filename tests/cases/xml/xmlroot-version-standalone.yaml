id: xml.xmlroot-version-standalone
title: xmlroot sets or keeps the XML declaration version and standalone flag
family: xml
tier: core
feature_ids: [xml, xmlroot, nulls]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xmlroot(xml '<foo/>', version no value, standalone yes)::text
    expect: rows
  - sql: |
      SELECT xmlroot(xml '<foo/>', version '1.0', standalone no)::text
    expect: rows
  - sql: |
      SELECT xmlroot(xmlroot(xml '<foo/>', version '1.0'), version '1.1', standalone no)::text
    expect: rows
    comment: a second xmlroot replaces the declaration
  - sql: |
      SELECT xmlroot(NULL::xml, version '1.0', standalone yes) IS NULL AS is_null
    expect: rows
