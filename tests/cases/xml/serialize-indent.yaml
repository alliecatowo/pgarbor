id: xml.serialize-indent
title: xmlserialize with INDENT, NO INDENT, mixed content and NULL input
family: xml
tier: core
feature_ids: [xml, xmlserialize, nulls]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xmlserialize(DOCUMENT '<foo><bar><val x="y">42</val></bar></foo>' AS text INDENT)
    expect: rows
  - sql: |
      SELECT xmlserialize(CONTENT '<foo><bar><val x="y">42</val></bar></foo>' AS text NO INDENT)
    expect: rows
  - sql: |
      SELECT xmlserialize(DOCUMENT '<foo><bar><val x="y">42</val></bar></foo>' AS text)
        = xmlserialize(DOCUMENT '<foo><bar><val x="y">42</val></bar></foo>' AS text NO INDENT) AS same
    expect: rows
    comment: omitting INDENT means NO INDENT
  - sql: |
      SELECT xmlserialize(CONTENT 'text node<foo>73</foo>text node<bar><val x="y">42</val></bar>' AS text INDENT)
    expect: rows
    comment: mixed content that is not singly rooted
  - sql: |
      SELECT xmlserialize(DOCUMENT NULL AS text INDENT) IS NULL AS is_null
    expect: rows
