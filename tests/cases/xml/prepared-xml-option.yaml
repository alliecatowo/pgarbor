id: xml.prepared-xml-option
title: Prepared xml parameter follows the xmloption setting at execute time
family: xml
tier: extended
feature_ids: [xml, extended-protocol, prepared-statements, xml-option, errors]
required_capabilities: [xml, extended-protocol, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SET XML OPTION DOCUMENT
    expect: ok
  - parse:
      name: px
      sql: |
        SELECT xmlconcat('<foo/>', $1)::text
      param_types: [142]
    expect: ok
  - execute:
      statement: px
      params: ["<bar/>"]
    expect: rows
  - execute:
      statement: px
      params: ["bad"]
    expect: error
    comment: a non-document parameter is rejected under DOCUMENT
  - sql: |
      SET XML OPTION CONTENT
    expect: ok
  - execute:
      statement: px
      params: ["good"]
    expect: rows
    comment: the same statement accepts content under CONTENT
