id: xml.external-entity-not-expanded
title: External entity references are not expanded when parsing xml documents
family: xml
tier: extended
feature_ids: [xml, xmlparse, security, entities]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT XMLPARSE(DOCUMENT '<!DOCTYPE foo [<!ENTITY c SYSTEM "/etc/passwd">]><foo>&c;</foo>')::text
    expect: rows
    comment: the entity stays unexpanded so no file content leaks
  - sql: |
      SELECT XMLPARSE(DOCUMENT '<!DOCTYPE foo [<!ENTITY c SYSTEM "/etc/no.such.file">]><foo>&c;</foo>')::text
    expect: rows
    comment: a missing external file does not raise an error
