id: xml.xpath-namespaces
title: xpath namespace maps, namespace axis, and namespace error handling
family: xml
tier: extended
feature_ids: [xml, xpath, namespaces, errors]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xpath('//loc:piece/@id', '<local:data xmlns:local="http://127.0.0.1"><local:piece id="1">number one</local:piece><local:piece id="2" /></local:data>'::xml, ARRAY[ARRAY['loc', 'http://127.0.0.1']])
    expect: rows
  - sql: |
      SELECT xpath('//loc:piece', '<local:data xmlns:local="http://127.0.0.1"><local:piece id="1">number one</local:piece><local:piece id="2" /></local:data>'::xml, ARRAY[ARRAY['loc', 'http://127.0.0.1']])
    expect: rows
  - sql: |
      SELECT xpath('//namespace::foo', '<root xmlns:foo="http://127.0.0.1"/>'::xml)
    expect: rows
  - sql: |
      SELECT xpath('/*', '<nosuchprefix:tag/>'::xml)
    expect: error
    comment: an undeclared prefix is not well formed for xpath
  - sql: |
      SELECT xpath('/*', '<relativens xmlns=''relative''/>'::xml)
    expect: rows
    comment: a relative namespace URI is a warning not an error
