id: xml.document-classification
title: IS DOCUMENT and IS NOT DOCUMENT classify single-rooted xml values
family: xml
tier: core
feature_ids: [xml, xml-predicates, xml-option]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xml '<foo>bar</foo>' IS DOCUMENT AS r
    expect: rows
  - sql: |
      SELECT xml '<foo>bar</foo><bar>foo</bar>' IS DOCUMENT AS r
    expect: rows
    comment: two top-level elements is not a document
  - sql: |
      SELECT xml 'abc' IS NOT DOCUMENT AS r
    expect: rows
  - sql: |
      SELECT xml '<abc/>' IS NOT DOCUMENT AS r
    expect: rows
  - sql: |
      SET XML OPTION DOCUMENT
    expect: ok
  - sql: |
      SELECT xml '<!DOCTYPE a><a/><b/>'
    expect: error
    comment: under DOCUMENT option two roots are rejected at input
