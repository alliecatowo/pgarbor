id: xml.well-formed-checks
title: xml_is_well_formed family under DOCUMENT and CONTENT xmloption settings
family: xml
tier: core
feature_ids: [xml, xml-option, well-formed]
required_capabilities: [xml, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/xml.sql"
sessions: [a]
steps:
  - sql: |
      SELECT xml_is_well_formed_document('<foo>bar</foo>') AS r
    expect: rows
  - sql: |
      SELECT xml_is_well_formed_document('abc') AS r
    expect: rows
  - sql: |
      SELECT xml_is_well_formed_content('abc') AS r
    expect: rows
  - sql: |
      SET xmloption TO DOCUMENT
    expect: ok
  - sql: |
      SELECT xml_is_well_formed('abc') AS r
    expect: rows
  - sql: |
      SELECT xml_is_well_formed('<foo><bar>baz</foo>') AS r
    expect: rows
  - sql: |
      SELECT xml_is_well_formed('<pg:foo xmlns:pg="http://postgresql.org/stuff">bar</pg:foo>') AS r
    expect: rows
  - sql: |
      SELECT xml_is_well_formed('<pg:foo xmlns:pg="http://postgresql.org/stuff">bar</my:foo>') AS r
    expect: rows
    comment: a mismatched prefix is not well formed
  - sql: |
      SET xmloption TO CONTENT
    expect: ok
  - sql: |
      SELECT xml_is_well_formed('abc') AS r
    expect: rows
