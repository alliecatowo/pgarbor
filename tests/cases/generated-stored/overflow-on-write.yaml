# The generation expression is evaluated on write, so an overflowing result fails the statement.
id: generated-stored.overflow-on-write
title: Generation expression overflow raises 22003 on insert and stores nothing
family: generated-stored
tier: core
feature_ids: [generated-columns, insert, numeric, errors]
required_capabilities: [create-table, insert, select, generated-columns]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_stored.sql"
sessions: [a]
setup: |
  CREATE TABLE g5 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) STORED);
  INSERT INTO g5 (a) VALUES (1);
steps:
  - sql: |
      INSERT INTO g5 VALUES (2000000000)
    expect: error
    sqlstate: "22003"
  - sql: |
      SELECT a, b FROM g5 ORDER BY a
    expect: rows
    order: ordered
