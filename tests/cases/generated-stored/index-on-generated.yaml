# A plain B-tree index on a generated column is usable for equality lookups on the computed value.
id: generated-stored.index-on-generated
title: Index on a generated column supports equality lookup on computed values
family: generated-stored
tier: core
feature_ids: [generated-columns, create-index, select]
required_capabilities: [create-table, create-index, insert, select, generated-columns]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_stored.sql"
sessions: [a]
setup: |
  CREATE TABLE g13 (a int, b int GENERATED ALWAYS AS (a * 2) STORED);
  CREATE INDEX g13_b_idx ON g13 (b);
  INSERT INTO g13 (a) VALUES (1), (2), (3);
steps:
  - sql: |
      SELECT a, b FROM g13 WHERE b = 4 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM g13 WHERE b * 3 = 6 ORDER BY a
    expect: rows
    order: ordered
    comment: expression over the generated column still returns the same rows as a plain scan
