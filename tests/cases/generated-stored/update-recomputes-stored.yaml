# Changing source columns recomputes stored values, including NULL inputs and text concatenation.
id: generated-stored.update-recomputes-stored
title: UPDATE of source columns recomputes stored generated values including NULL inputs
family: generated-stored
tier: core
feature_ids: [generated-columns, update, text, nulls]
required_capabilities: [create-table, insert, update, select, generated-columns]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_stored.sql"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE g11 (a int, b int GENERATED ALWAYS AS (a * 3) STORED)
    expect: ok
  - sql: |
      INSERT INTO g11 (a) VALUES (1), (2), (3), (NULL)
    expect: ok
  - sql: |
      UPDATE g11 SET a = 22 WHERE a = 2
    expect: ok
  - sql: |
      SELECT a, b FROM g11 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      CREATE TABLE g11t (a text, b text GENERATED ALWAYS AS (a || '+' || a) STORED)
    expect: ok
  - sql: |
      INSERT INTO g11t (a) VALUES ('a'), ('b'), ('c'), (NULL)
    expect: ok
  - sql: |
      UPDATE g11t SET a = 'bb' WHERE a = 'b'
    expect: ok
  - sql: |
      SELECT a, b FROM g11t ORDER BY a
    expect: rows
    order: ordered
