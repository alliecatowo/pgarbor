# Generated columns whose expression is a constant or NULL, and a varlena pass-through column.
id: generated-stored.null-and-constant
title: Generated columns with constant, NULL and varchar pass-through expressions
family: generated-stored
tier: core
feature_ids: [generated-columns, insert, select, update, nulls]
required_capabilities: [create-table, insert, update, select, generated-columns]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_stored.sql"
sessions: [a]
setup: |
  CREATE TABLE g2 (a int PRIMARY KEY, c int GENERATED ALWAYS AS (55) STORED, n int GENERATED ALWAYS AS (NULL) STORED, v varchar, vb varchar GENERATED ALWAYS AS (v) STORED);
steps:
  - sql: |
      INSERT INTO g2 (a, v) VALUES (1, '01234567890123456789'), (2, NULL)
    expect: ok
  - sql: |
      SELECT a, c, n, n IS NULL AS n_null, vb, vb IS NULL AS vb_null FROM g2 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      UPDATE g2 SET v = 'x' WHERE a = 2
    expect: ok
  - sql: |
      SELECT a, vb FROM g2 ORDER BY a
    expect: rows
    order: ordered
