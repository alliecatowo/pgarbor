# Generated STORED column: computed on insert, readable, usable in expressions and filters.
id: generated-stored.basic-stored-select
title: STORED generated column is computed on insert and readable in queries
family: generated-stored
tier: core
feature_ids: [generated-columns, insert, select, create-table]
required_capabilities: [create-table, insert, select, generated-columns]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_stored.sql"
sessions: [a]
setup: |
  CREATE TABLE g1 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) STORED);
  INSERT INTO g1 (a) VALUES (1), (2);
steps:
  - sql: |
      SELECT a, b FROM g1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO g1 (a) VALUES (3), (4)
    expect: ok
  - sql: |
      SELECT a, b, b * 2 AS b2 FROM g1 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM g1 WHERE b = 4 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT g1 FROM g1 ORDER BY a
    expect: rows
    order: ordered
    comment: whole-row reference to a table with a generated column
