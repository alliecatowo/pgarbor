# UPDATE may only assign DEFAULT to a generated column; other updates recompute the stored value.
id: generated-stored.update-generated-column
title: UPDATE of a generated column needs DEFAULT and other updates recompute it
family: generated-stored
tier: core
feature_ids: [generated-columns, update, delete, errors]
required_capabilities: [create-table, insert, update, delete, select, generated-columns]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_stored.sql"
sessions: [a]
setup: |
  CREATE TABLE g4 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) STORED);
  INSERT INTO g4 (a) VALUES (1), (2);
steps:
  - sql: |
      UPDATE g4 SET b = DEFAULT WHERE a = 1
    expect: ok
  - sql: |
      UPDATE g4 SET b = 11 WHERE a = 1
    expect: error
    sqlstate: "428C9"
  - sql: |
      UPDATE g4 SET a = 5 WHERE a = 2
    expect: ok
  - sql: |
      SELECT a, b FROM g4 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      DELETE FROM g4 WHERE b = 2
    expect: ok
  - sql: |
      SELECT a, b FROM g4 ORDER BY a
    expect: rows
    order: ordered
