# Auto-updatable view over a table with a generated column: explicit values still fail with 428C9.
id: generated-stored.view-insert-through-view
title: INSERT through an auto-updatable view respects generated column rules
family: generated-stored
tier: extended
feature_ids: [generated-columns, create-view, insert, errors]
required_capabilities: [create-table, create-view, insert, select, generated-columns]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/generated_stored.sql"
sessions: [a]
setup: |
  CREATE TABLE g14 (a int PRIMARY KEY, b int GENERATED ALWAYS AS (a * 2) STORED);
  CREATE VIEW g14v AS SELECT * FROM g14;
steps:
  - sql: |
      INSERT INTO g14v VALUES (4, 8)
    expect: error
    sqlstate: "428C9"
  - sql: |
      INSERT INTO g14v VALUES (5, DEFAULT)
    expect: ok
  - sql: |
      SELECT a, b FROM g14v ORDER BY a
    expect: rows
    order: ordered
