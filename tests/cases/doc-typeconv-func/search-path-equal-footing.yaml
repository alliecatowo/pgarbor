# Functions of different argument types are considered on equal footing regardless of search_path position: the exact match wins.
id: doc-typeconv-func.search-path-equal-footing
title: Exact-type overload in a later schema beats a coercible overload in an earlier schema
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, search-path, exact-match, schemas]
required_capabilities: [create-function-sql, create-schema, select, search-path]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 1.1: different argument types on equal footing)"
steps:
  - sql: |
      CREATE SCHEMA s1
    expect: ok
  - sql: |
      CREATE SCHEMA s2
    expect: ok
  - sql: |
      CREATE FUNCTION s1.h(bigint) RETURNS text LANGUAGE sql AS $$ SELECT 's1' $$
    expect: ok
  - sql: |
      CREATE FUNCTION s2.h(int) RETURNS text LANGUAGE sql AS $$ SELECT 's2' $$
    expect: ok
  - sql: |
      SET search_path = s1, s2
    expect: ok
  - sql: |
      SELECT h(1) AS resolved
    expect: rows
