# Documented special case: a one-argument call named after a type, with an unknown literal, is treated as a cast when no function matches.
id: doc-typeconv-func.function-style-cast-special-conversion
title: Function-style type-name call with a literal is treated as a cast
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, function-style-cast, type-io-conversion]
required_capabilities: [select, int4, date]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 3: special type conversion request)"
steps:
  - sql: |
      SELECT int4('42') AS int_from_text, date('2020-01-02') AS date_from_text
    expect: rows
