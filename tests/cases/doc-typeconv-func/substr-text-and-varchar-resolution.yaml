# Documented substr examples: an unknown literal and a varchar both resolve to substr(text, int); varchar to text is binary-compatible.
id: doc-typeconv-func.substr-text-and-varchar-resolution
title: substr with unknown literal, varchar and explicit text argument all select the text overload
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, preferred-types, binary-coercible-cast, string-functions]
required_capabilities: [select, varchar, text]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (Substring Function Type Resolution)"
steps:
  - sql: |
      SELECT substr('1234', 3) AS unknown_literal
    expect: rows
  - sql: |
      SELECT substr(varchar '1234', 3) AS varchar_arg
    expect: rows
  - sql: |
      SELECT substr(CAST (1234 AS text), 3) AS explicit_cast
    expect: rows
