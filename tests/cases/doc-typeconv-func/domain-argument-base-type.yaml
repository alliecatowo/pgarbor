# Documented rule: a domain-typed argument is treated as its base type during resolution, so the int overload is chosen.
id: doc-typeconv-func.domain-argument-base-type
title: Domain-typed argument resolves as its base type during function selection
family: doc-typeconv-func
tier: extended
feature_ids: [function-resolution, domains, exact-match]
required_capabilities: [create-function-sql, domain, select]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 4.1: domain arguments treated as base type)"
steps:
  - sql: |
      CREATE DOMAIN d_int AS int
    expect: ok
  - sql: |
      CREATE FUNCTION dom(int) RETURNS text LANGUAGE sql AS $$ SELECT 'int' $$
    expect: ok
  - sql: |
      CREATE FUNCTION dom(text) RETURNS text LANGUAGE sql AS $$ SELECT 'text' $$
    expect: ok
  - sql: |
      SELECT dom(CAST (1 AS d_int)) AS domain_arg
    expect: rows
