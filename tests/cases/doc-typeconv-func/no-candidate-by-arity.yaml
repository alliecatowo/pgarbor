# A function name with no candidate of the given argument count is an undefined-function error (42883).
id: doc-typeconv-func.no-candidate-by-arity
title: round with zero arguments has no candidate function
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, error-sqlstate]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 1: candidates with matching name and argument count)"
steps:
  - sql: |
      SELECT round()
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT round(1.5) AS still_works
    expect: rows
