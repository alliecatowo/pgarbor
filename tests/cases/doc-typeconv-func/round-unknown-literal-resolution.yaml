# An unknown-type literal with no exact match is resolved by preferred types in the numeric category (float8 for round).
id: doc-typeconv-func.round-unknown-literal-resolution
title: round of an unknown-type literal resolves to the preferred float8 candidate
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, unknown-literal, preferred-types, numeric-round]
required_capabilities: [select, numeric, float8]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (best match: preferred types, unknown arguments)"
steps:
  - sql: |
      SELECT round('4.5') AS r, pg_typeof(round('4.5'))::text AS t
    expect: rows
