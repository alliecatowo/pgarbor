# The special-conversion path applies the target type's input function, so malformed text fails with 22P02.
id: doc-typeconv-func.function-style-cast-invalid-input
title: Function-style cast of malformed text raises invalid input syntax
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, function-style-cast, error-sqlstate]
required_capabilities: [select, errors, int4]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 3: I/O conversion for special type conversion request)"
steps:
  - sql: |
      SELECT int4('abc')
    expect: error
    sqlstate: "22P02"
  - sql: |
      SELECT int4(3.7) AS numeric_arg_rounds
    expect: rows
