# Documented error: integer has no implicit cast to text, so substr(integer, integer) does not exist (42883).
id: doc-typeconv-func.substr-integer-no-implicit-cast
title: substr with an integer first argument is an undefined function until cast explicitly
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, implicit-cast, error-sqlstate]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (Substring Function Type Resolution)"
steps:
  - sql: |
      SELECT substr(1234, 3)
    expect: error
    sqlstate: "42883"
  - sql: |
      SELECT substr(CAST (1234 AS text), 3) AS explicit_cast_works
    expect: rows
