# Documented example: round(4, 4) takes numeric first argument via implicit cast; numeric literal 4.0 needs no conversion.
id: doc-typeconv-func.round-argument-resolution
title: round(int, int) resolves to round(numeric, int) and returns numeric
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, implicit-cast, numeric-round]
required_capabilities: [select, numeric]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (Rounding Function Argument Type Resolution)"
steps:
  - sql: |
      SELECT round(4, 4) AS r, pg_typeof(round(4, 4))::text AS t
    expect: rows
  - sql: |
      SELECT round(4.0, 4) AS r, pg_typeof(round(4.0, 4))::text AS t
    expect: rows
  - sql: |
      SELECT round(CAST (4 AS numeric), 4) = round(4, 4) AS same_as_explicit_cast
    expect: rows
