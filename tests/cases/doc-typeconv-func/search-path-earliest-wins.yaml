# Functions with identical argument types in two schemas: the one earliest in search_path is used; qualified names bypass the path.
id: doc-typeconv-func.search-path-earliest-wins
title: Identical-signature functions in two schemas resolve by search_path order
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, search-path, schemas, create-function-sql]
required_capabilities: [create-function-sql, create-schema, select, search-path]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 1.1: earliest in search path)"
steps:
  - sql: |
      CREATE SCHEMA s1
    expect: ok
  - sql: |
      CREATE SCHEMA s2
    expect: ok
  - sql: |
      CREATE FUNCTION s1.g(int) RETURNS text LANGUAGE sql AS $$ SELECT 's1' $$
    expect: ok
  - sql: |
      CREATE FUNCTION s2.g(int) RETURNS text LANGUAGE sql AS $$ SELECT 's2' $$
    expect: ok
  - sql: |
      SET search_path = s1, s2
    expect: ok
  - sql: |
      SELECT g(1) AS resolved, s2.g(1) AS qualified
    expect: rows
  - sql: |
      SET search_path = s2, s1
    expect: ok
  - sql: |
      SELECT g(1) AS resolved, s1.g(1) AS qualified
    expect: rows
