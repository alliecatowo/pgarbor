# An exact argument-type match is used in preference to a function needing an implicit conversion.
id: doc-typeconv-func.exact-match-int-vs-numeric
title: Integer literal picks the int overload and numeric literal picks the numeric overload
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, exact-match, numeric-literal-type]
required_capabilities: [create-function-sql, select]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 3: check for exact input argument match)"
steps:
  - sql: |
      CREATE FUNCTION ex(a int) RETURNS text LANGUAGE sql AS $$ SELECT 'int' $$
    expect: ok
  - sql: |
      CREATE FUNCTION ex(a numeric) RETURNS text LANGUAGE sql AS $$ SELECT 'numeric' $$
    expect: ok
  - sql: |
      SELECT ex(1) AS int_literal, ex(1.0) AS numeric_literal, ex(CAST (1 AS numeric)) AS cast_numeric
    expect: rows
