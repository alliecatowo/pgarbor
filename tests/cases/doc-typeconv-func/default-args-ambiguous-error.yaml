# Documented failure: two same-schema functions whose non-defaulted parameter types match make a call that omits defaults ambiguous (42725).
id: doc-typeconv-func.default-args-ambiguous-error
title: Two same-schema functions with defaults that match one call are not unique
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, default-arguments, error-sqlstate]
required_capabilities: [create-function-sql, select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 1.3: ambiguous function call error)"
steps:
  - sql: |
      CREATE FUNCTION amb(a int, b int DEFAULT 1) RETURNS text LANGUAGE sql AS $$ SELECT 'x' $$
    expect: ok
  - sql: |
      CREATE FUNCTION amb(a int, c text DEFAULT 'x') RETURNS text LANGUAGE sql AS $$ SELECT 'y' $$
    expect: ok
  - sql: |
      SELECT amb(1)
    expect: error
    sqlstate: "42725"
  - sql: |
      SELECT amb(1, 2) AS unambiguous_with_int
    expect: rows
