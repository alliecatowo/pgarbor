# Functions with defaulted parameters match calls omitting them; the one earliest in search_path is chosen when several match.
id: doc-typeconv-func.default-args-search-path
title: Defaulted-argument functions in two schemas resolve by search_path order
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, default-arguments, search-path, schemas]
required_capabilities: [create-function-sql, create-schema, select, search-path]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 1.3: functions with default values)"
steps:
  - sql: |
      CREATE SCHEMA s1
    expect: ok
  - sql: |
      CREATE SCHEMA s2
    expect: ok
  - sql: |
      CREATE FUNCTION s1.dflt(a int, b int DEFAULT 1) RETURNS int LANGUAGE sql AS $$ SELECT 10 $$
    expect: ok
  - sql: |
      CREATE FUNCTION s2.dflt(a int, b int DEFAULT 2) RETURNS int LANGUAGE sql AS $$ SELECT 20 $$
    expect: ok
  - sql: |
      SET search_path = s2, s1
    expect: ok
  - sql: |
      SELECT dflt(5) AS omitted_default, dflt(5, 7) AS explicit_second
    expect: rows
