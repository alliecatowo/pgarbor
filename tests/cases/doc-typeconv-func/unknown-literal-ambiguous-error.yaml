# Documented failure: an unknown literal whose remaining candidates span different type categories cannot be resolved (42725).
id: doc-typeconv-func.unknown-literal-ambiguous-error
title: Unknown literal with candidates from different type categories is not unique
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, unknown-literal, type-categories, error-sqlstate]
required_capabilities: [create-function-sql, select, errors]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (best match: fail because the correct choice cannot be deduced)"
steps:
  - sql: |
      CREATE FUNCTION fa(int) RETURNS text LANGUAGE sql AS $$ SELECT 'int' $$
    expect: ok
  - sql: |
      CREATE FUNCTION fa(date) RETURNS text LANGUAGE sql AS $$ SELECT 'date' $$
    expect: ok
  - sql: |
      SELECT fa('x')
    expect: error
    sqlstate: "42725"
  - sql: |
      SELECT fa('2020-01-02'::date) AS typed_arg
    expect: rows
