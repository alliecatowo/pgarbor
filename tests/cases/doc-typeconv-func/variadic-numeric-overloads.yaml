# Documented variadic example: a VARIADIC numeric[] function is tolerant of int and numeric arguments until more specific overloads exist.
id: doc-typeconv-func.variadic-numeric-overloads
title: VARIADIC numeric array function is superseded by numeric and int overloads for plain arguments
family: doc-typeconv-func
tier: extended
feature_ids: [variadic-functions, function-resolution, create-function-sql]
required_capabilities: [create-function-sql, select, variadic]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (Variadic Function Resolution)"
steps:
  - sql: |
      CREATE FUNCTION public.variadic_example(VARIADIC numeric[]) RETURNS int
        LANGUAGE sql AS 'SELECT 1'
    expect: ok
  - sql: |
      SELECT public.variadic_example(0) AS int_arg,
             public.variadic_example(0.0) AS numeric_arg,
             public.variadic_example(VARIADIC array[0.0]) AS keyword_arg
    expect: rows
  - sql: |
      CREATE FUNCTION public.variadic_example(numeric) RETURNS int
        LANGUAGE sql AS 'SELECT 2'
    expect: ok
  - sql: |
      CREATE FUNCTION public.variadic_example(int) RETURNS int
        LANGUAGE sql AS 'SELECT 3'
    expect: ok
  - sql: |
      SELECT public.variadic_example(0) AS int_arg,
             public.variadic_example(0.0) AS numeric_arg,
             public.variadic_example(VARIADIC array[0.0]) AS keyword_arg
    expect: rows
