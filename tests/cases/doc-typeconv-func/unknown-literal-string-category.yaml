# An unknown-type literal selects the string category when a candidate accepts it, so the text overload wins over the int overload.
id: doc-typeconv-func.unknown-literal-string-category
title: Unknown-type literal argument is resolved to the string category candidate
family: doc-typeconv-func
tier: core
feature_ids: [function-resolution, unknown-literal, type-categories]
required_capabilities: [create-function-sql, select]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (best match: unknown arguments, string category bias)"
steps:
  - sql: |
      CREATE FUNCTION kat(text) RETURNS text LANGUAGE sql AS $$ SELECT 'text' $$
    expect: ok
  - sql: |
      CREATE FUNCTION kat(int) RETURNS text LANGUAGE sql AS $$ SELECT 'int' $$
    expect: ok
  - sql: |
      SELECT kat('5') AS unknown_literal, kat(CAST ('5' AS text)) AS text_arg, kat(5) AS int_arg
    expect: rows
