# Within one schema, when variadic expansion yields the same effective types as a fixed-arity function, the non-variadic one is preferred; the VARIADIC keyword forces the variadic one.
id: doc-typeconv-func.variadic-keyword-and-fixed-preference
title: Same-schema non-variadic overload beats variadic expansion unless VARIADIC keyword is used
family: doc-typeconv-func
tier: extended
feature_ids: [variadic-functions, function-resolution, create-function-sql]
required_capabilities: [create-function-sql, select, variadic]
provenance:
  source: pg-docs
  ref: "src/sgml/typeconv.sgml#typeconv-func (step 2: VARIADIC array parameter expansion)"
steps:
  - sql: |
      CREATE FUNCTION vnv(VARIADIC int[]) RETURNS text LANGUAGE sql AS $$ SELECT 'variadic' $$
    expect: ok
  - sql: |
      CREATE FUNCTION vnv(int, int) RETURNS text LANGUAGE sql AS $$ SELECT 'fixed' $$
    expect: ok
  - sql: |
      SELECT vnv(1, 2) AS fixed_preferred,
             vnv(VARIADIC array[1, 2]) AS keyword_forces_variadic,
             vnv(1, 2, 3) AS only_variadic_matches
    expect: rows
