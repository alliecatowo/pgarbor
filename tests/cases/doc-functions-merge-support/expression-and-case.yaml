# merge_action() is an ordinary text value: it can be concatenated, compared and used in CASE inside RETURNING.
id: doc-functions-merge-support.expression-and-case
title: merge_action() works as a text value in RETURNING expressions, comparisons and CASE
family: doc-functions-merge-support
tier: core
feature_ids: [merge, merge-action, returning, case-expression]
required_capabilities: [create-table, insert, update, select, merge, returning]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action())"
setup: |
  CREATE TABLE products (product_id int PRIMARY KEY, in_stock bool, quantity int);
  CREATE TABLE stock (product_id int, quantity int);
  INSERT INTO products VALUES (1001, false, 0), (1002, true, 5), (1004, true, 9);
  INSERT INTO stock VALUES (1001, 50), (1002, 0), (1003, 10);
steps:
  - sql: |
      MERGE INTO products p
        USING stock s ON p.product_id = s.product_id
        WHEN MATCHED THEN UPDATE SET quantity = 2
        RETURNING merge_action() || '!' AS x,
                  (merge_action() = 'UPDATE') AS is_update,
                  CASE merge_action() WHEN 'UPDATE' THEN 'u' ELSE 'o' END AS code
    expect: rows
    order: multiset
