# merge_action() outside a MERGE RETURNING list is an error.
id: doc-functions-merge-support.error-select-outside-returning
title: merge_action() in a plain SELECT raises a syntax-level error
family: doc-functions-merge-support
tier: core
feature_ids: [merge, merge-action, errors]
required_capabilities: [select, merge]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action())"
steps:
  - sql: |
      SELECT merge_action()
    expect: error
    sqlstate: "42601"
    comment: documented as an error in any part of a query other than MERGE RETURNING
