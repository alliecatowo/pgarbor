# merge_action() takes no arguments; passing one is a syntax error.
id: doc-functions-merge-support.error-with-argument
title: merge_action() with an argument is rejected as a syntax error
family: doc-functions-merge-support
tier: extended
feature_ids: [merge, merge-action, errors]
required_capabilities: [create-table, insert, delete, select, merge, returning]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action ( ))"
setup: |
  CREATE TABLE products (product_id int PRIMARY KEY, in_stock bool, quantity int);
  CREATE TABLE stock (product_id int, quantity int);
  INSERT INTO products VALUES (1001, false, 0), (1002, true, 5), (1004, true, 9);
  INSERT INTO stock VALUES (1001, 50), (1002, 0), (1003, 10);
steps:
  - sql: |
      MERGE INTO products p
        USING stock s ON p.product_id = s.product_id
        WHEN MATCHED THEN DELETE
        RETURNING merge_action(merge_action())
    expect: error
    sqlstate: "42601"
    comment: the documented signature is merge_action ( ) with no arguments
