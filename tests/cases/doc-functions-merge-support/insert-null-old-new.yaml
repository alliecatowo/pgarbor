# For an INSERT action, old.* is NULL and new.* holds the inserted values, including NULL columns.
id: doc-functions-merge-support.insert-null-old-new
title: merge_action() INSERT rows show NULL old values and the inserted NULL column
family: doc-functions-merge-support
tier: core
feature_ids: [merge, merge-action, returning, old-new-alias, null-semantics]
required_capabilities: [create-table, insert, select, merge, returning]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action())"
setup: |
  CREATE TABLE products (product_id int PRIMARY KEY, in_stock bool, quantity int);
  CREATE TABLE stock (product_id int, quantity int);
  INSERT INTO products VALUES (1001, false, 0), (1002, true, 5), (1004, true, 9);
  INSERT INTO stock VALUES (1001, 50), (1002, 0), (1003, 10);
steps:
  - sql: |
      MERGE INTO products p
        USING stock s ON p.product_id = s.product_id
        WHEN MATCHED THEN UPDATE SET quantity = s.quantity
        WHEN NOT MATCHED THEN INSERT (product_id, in_stock, quantity) VALUES (s.product_id, NULL, s.quantity)
        RETURNING merge_action() AS a, old.quantity IS NULL AS old_null, p.in_stock IS NULL AS in_stock_null, new.quantity AS nq
    expect: rows
    order: multiset
    comment: the INSERT row for 1003 has old_null true and in_stock_null true
