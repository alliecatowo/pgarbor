# RETURNING may contain a scalar subquery; merge_action() inside it still refers to the MERGE's current row.
id: doc-functions-merge-support.scalar-subquery-in-returning
title: merge_action() inside a scalar subquery in MERGE RETURNING is accepted and reports the row action
family: doc-functions-merge-support
tier: extended
feature_ids: [merge, merge-action, returning, subquery]
required_capabilities: [create-table, insert, update, select, merge, returning, subquery]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action())"
setup: |
  CREATE TABLE products (product_id int PRIMARY KEY, in_stock bool, quantity int);
  CREATE TABLE stock (product_id int, quantity int);
  INSERT INTO products VALUES (1001, false, 0), (1002, true, 5), (1004, true, 9);
  INSERT INTO stock VALUES (1001, 50), (1002, 0), (1003, 10);
steps:
  - sql: |
      MERGE INTO products p
        USING stock s ON p.product_id = s.product_id
        WHEN MATCHED THEN UPDATE SET quantity = 7
        RETURNING merge_action() AS direct, (SELECT merge_action()) AS via_subquery
    expect: rows
    order: multiset
    comment: the documentation restricts use to the RETURNING list; a scalar subquery there is part of that list
