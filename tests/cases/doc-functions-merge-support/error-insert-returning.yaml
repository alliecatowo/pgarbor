# merge_action() in the RETURNING list of a plain INSERT is an error.
id: doc-functions-merge-support.error-insert-returning
title: merge_action() in INSERT RETURNING raises an error
family: doc-functions-merge-support
tier: core
feature_ids: [merge, merge-action, errors, insert, returning]
required_capabilities: [create-table, insert, returning, merge]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action())"
setup: |
  CREATE TABLE products (product_id int PRIMARY KEY, in_stock bool, quantity int);
steps:
  - sql: |
      INSERT INTO products VALUES (1, true, 1) RETURNING merge_action()
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT count(*) FROM products
    expect: rows
    comment: the failed INSERT left no row
