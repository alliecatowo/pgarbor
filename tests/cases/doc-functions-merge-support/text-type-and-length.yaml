# The documented return type is text; the action names are the upper-case words INSERT, UPDATE and DELETE.
id: doc-functions-merge-support.text-type-and-length
title: merge_action() returns text with upper-case action names
family: doc-functions-merge-support
tier: core
feature_ids: [merge, merge-action, returning, types]
required_capabilities: [create-table, insert, update, select, merge, returning]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action())"
setup: |
  CREATE TABLE products (product_id int PRIMARY KEY, in_stock bool, quantity int);
  CREATE TABLE stock (product_id int, quantity int);
  INSERT INTO products VALUES (1001, false, 0), (1002, true, 5), (1004, true, 9);
  INSERT INTO stock VALUES (1001, 50), (1002, 0), (1003, 10);
steps:
  - sql: |
      MERGE INTO products p
        USING stock s ON p.product_id = s.product_id
        WHEN MATCHED THEN UPDATE SET quantity = 3
        RETURNING pg_typeof(merge_action())::text AS typ, merge_action() AS a, length(merge_action()) AS len
    expect: rows
    order: multiset
    comment: typ text; a UPDATE; len 6
