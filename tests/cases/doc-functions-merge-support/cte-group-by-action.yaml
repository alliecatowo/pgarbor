# merge_action() used inside a data-modifying WITH and grouped by the outer query.
id: doc-functions-merge-support.cte-group-by-action
title: merge_action() inside a MERGE in a WITH clause is aggregated by the outer query
family: doc-functions-merge-support
tier: extended
feature_ids: [merge, merge-action, returning, with, group-by]
required_capabilities: [create-table, insert, update, delete, select, merge, returning, cte]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-merge-support (merge_action())"
setup: |
  CREATE TABLE products (product_id int PRIMARY KEY, in_stock bool, quantity int);
  CREATE TABLE stock (product_id int, quantity int);
  INSERT INTO products VALUES (1001, false, 0), (1002, true, 5), (1004, true, 9);
  INSERT INTO stock VALUES (1001, 50), (1002, 0), (1003, 10);
steps:
  - sql: |
      WITH m AS (
        MERGE INTO products p
          USING stock s ON p.product_id = s.product_id
          WHEN MATCHED THEN UPDATE SET quantity = s.quantity
          WHEN NOT MATCHED THEN INSERT (product_id, in_stock, quantity) VALUES (s.product_id, true, s.quantity)
          WHEN NOT MATCHED BY SOURCE THEN DELETE
          RETURNING merge_action() AS a, p.product_id
      )
      SELECT a, count(*) AS n FROM m GROUP BY a ORDER BY a
    expect: rows
    order: ordered
    comment: expect DELETE 1, INSERT 1, UPDATE 2
