# Documented example ALTER TYPE email OWNER TO joe. Quarantined: it needs a cluster-global role, and roles are shared across databases so the case cannot be isolated.
id: cmd-alter-type.owner-to-named-role-doc-example
title: "Documented example: change a type's owner to a named role"
family: cmd-alter-type
tier: extended
feature_ids: [alter-type, owner, roles]
required_capabilities: [create-domain, alter-type, create-role]
provenance:
  source: pg-docs
  ref: "ref/alter_type.sgml#sql-altertype (example: ALTER TYPE email OWNER TO joe)"
quarantine:
  reason: "requires creating a cluster-global role 'joe', which cannot be isolated to one case database"
  since: "2026-10-15"
sessions: [a]
setup: |
  CREATE DOMAIN email AS text;
steps:
  - sql: |
      ALTER TYPE email OWNER TO joe
    expect: ok
