# SET (property = value) applies only to base types: enums and composites are rejected, and a shell type cannot be altered.
id: cmd-alter-type.set-properties-non-base-rejected
title: "ALTER TYPE SET fails for enum, composite and shell types"
family: cmd-alter-type
tier: core
feature_ids: [alter-type, base-type-properties, storage-option]
required_capabilities: [create-type, alter-type, enum-type, composite-type, shell-type]
provenance:
  source: pg-docs
  ref: "ref/alter_type.sgml#sql-altertype (SET ( property = value ): only applicable to base types)"
sessions: [a]
setup: |
  CREATE TYPE colors AS ENUM ('red');
  CREATE TYPE compfoo AS (f1 int);
  CREATE TYPE shelltype;
steps:
  - sql: |
      ALTER TYPE colors SET (STORAGE = plain)
    expect: error
    sqlstate: "42809"
    comment: an enum is not a base type
  - sql: |
      ALTER TYPE compfoo SET (STORAGE = plain)
    expect: error
    sqlstate: "42P17"
    comment: a composite is not a base type; PLAIN storage is refused for any type that is not already plain
  - sql: |
      ALTER TYPE shelltype SET (STORAGE = external)
    expect: error
    sqlstate: "42704"
    comment: a shell type has no definition to alter
