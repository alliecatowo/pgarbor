# OWNER TO accepts CURRENT_ROLE, CURRENT_USER and SESSION_USER as aliases for the current role; an unknown role is rejected.
id: cmd-alter-type.owner-current-role-variants
title: "OWNER TO CURRENT_ROLE, CURRENT_USER and SESSION_USER keep the owner; unknown roles fail"
family: cmd-alter-type
tier: core
feature_ids: [alter-type, owner, current-role, session-user]
required_capabilities: [create-domain, alter-type, select, privileges]
provenance:
  source: pg-docs
  ref: "ref/alter_type.sgml#sql-altertype (ALTER TYPE name OWNER TO { new_owner | CURRENT_ROLE | CURRENT_USER | SESSION_USER })"
sessions: [a]
setup: |
  CREATE DOMAIN email AS text;
steps:
  - sql: |
      ALTER TYPE email OWNER TO CURRENT_ROLE
    expect: ok
  - sql: |
      ALTER TYPE email OWNER TO CURRENT_USER
    expect: ok
  - sql: |
      ALTER TYPE email OWNER TO SESSION_USER
    expect: ok
  - sql: |
      SELECT typowner = (SELECT oid FROM pg_roles WHERE rolname = current_user) AS owned_by_current_user FROM pg_type WHERE oid = 'email'::regtype
    expect: rows
    comment: the owner is the session role after each alias
  - sql: |
      ALTER TYPE email OWNER TO no_such_role_xyz
    expect: error
    sqlstate: "42704"
    comment: the target role must exist
  - sql: |
      ALTER TYPE nosuchtype OWNER TO CURRENT_USER
    expect: error
    sqlstate: "42704"
