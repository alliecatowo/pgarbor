# In text mode, encoding declarations inside xml input are ignored; the content is taken as the server encoding.
id: doc-datatype-xml.xml-encoding-declaration-ignored
title: Encoding declarations in text-mode xml input are ignored and do not reject the value
family: doc-datatype-xml
tier: extended
feature_ids: [xml, encoding, xmlparse]
required_capabilities: [select, xml]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-xml-encoding-handling (encoding declarations in character strings are ignored)"
sessions: [a]
steps:
  - sql: |
      SELECT
        XMLPARSE (DOCUMENT '<?xml version="1.0" encoding="ISO-8859-1"?><a>x</a>') IS DOCUMENT AS latin1_declared,
        XMLPARSE (CONTENT '<?xml version="1.0" encoding="SJIS"?><a>x</a>') IS DOCUMENT AS sjis_declared,
        '<?xml version="1.0" encoding="ISO-8859-1"?><a>x</a>'::xml IS DOCUMENT AS cast_declared
    expect: rows
    order: multiset
    comment: a declared encoding that differs from the server encoding does not cause an error in text mode
