# The xml type does not validate against a DTD even when the document declares one; well-formedness still applies.
id: doc-datatype-xml.xml-dtd-not-validated
title: An internal DTD subset that the content violates is accepted, since xml does not validate DTDs
family: doc-datatype-xml
tier: extended
feature_ids: [xml, dtd, xmlparse, is-document]
required_capabilities: [select, xml]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-xml-creating (the xml type does not validate input values against a DTD, even when the input specifies a DTD)"
sessions: [a]
steps:
  - sql: |
      SELECT XMLPARSE (DOCUMENT '<!DOCTYPE note [<!ELEMENT note (to)>]><note>hi</note>') IS DOCUMENT AS accepted_despite_dtd
    expect: rows
    comment: the element declared as (to) holds only text; no validation happens
  - sql: |
      SELECT '<!DOCTYPE note [<!ELEMENT note (to)>]><note>hi</note>'::xml IS DOCUMENT AS cast_accepted
    expect: rows
