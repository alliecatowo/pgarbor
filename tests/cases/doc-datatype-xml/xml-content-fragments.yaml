# CONTENT (the default xmloption) accepts multiple top-level nodes, text-only input and the empty string.
id: doc-datatype-xml.xml-content-fragments
title: Content fragments with several roots, text-only and empty values are valid xml under CONTENT
family: doc-datatype-xml
tier: core
feature_ids: [xml, content-fragment, is-document, xmloption]
required_capabilities: [select, xml]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-xml (content fragments can have more than one top-level element or character node; xml IS DOCUMENT)"
sessions: [a]
steps:
  - sql: |
      SELECT
        XMLPARSE (CONTENT '<a/><b/>') IS DOCUMENT AS two_roots_doc,
        XMLPARSE (CONTENT 'text only') IS DOCUMENT AS text_only_doc,
        '<a/>'::xml IS DOCUMENT AS single_root_doc,
        '<a/><b/>'::xml IS NOT DOCUMENT AS two_roots_fragment,
        ''::xml IS NULL AS empty_is_null,
        ''::xml::text = '' AS empty_text_roundtrip
    expect: rows
    order: multiset
    comment: content fragments are never documents; the empty string is an empty value, not NULL
