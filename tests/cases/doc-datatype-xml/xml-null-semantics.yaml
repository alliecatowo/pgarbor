# NULL xml values flow through XMLPARSE, XMLSERIALIZE and IS DOCUMENT without errors.
id: doc-datatype-xml.xml-null-semantics
title: NULL inputs to XMLPARSE, XMLSERIALIZE and IS DOCUMENT yield NULL rather than errors
family: doc-datatype-xml
tier: core
feature_ids: [xml, null-semantics, xmlserialize, xmlparse, is-document]
required_capabilities: [select, xml]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-xml-creating (XMLPARSE, XMLSERIALIZE, IS DOCUMENT)"
sessions: [a]
steps:
  - sql: |
      SELECT
        XMLPARSE (CONTENT NULL::text) IS NULL AS parse_null,
        xmlserialize(CONTENT NULL::xml AS text) IS NULL AS serialize_null,
        xmlserialize(DOCUMENT NULL::xml AS text INDENT) IS NULL AS serialize_indent_null,
        (NULL::xml IS DOCUMENT) IS NULL AS is_document_null,
        NULL::xml IS NULL AS xml_is_null
    expect: rows
    order: multiset
    comment: each NULL input stays NULL; none of these raise an error
