# XMLSERIALIZE: NO INDENT (default) returns the original string; INDENT pretty-prints; text, varchar and char targets.
id: doc-datatype-xml.xmlserialize-indent-variants
title: XMLSERIALIZE NO INDENT preserves the input string, INDENT pretty-prints, and character targets work
family: doc-datatype-xml
tier: core
feature_ids: [xml, xmlserialize, indent, casts]
required_capabilities: [select, xml]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-xml-creating (XMLSERIALIZE, [NO] INDENT, casting to a character type)"
sessions: [a]
steps:
  - sql: |
      SELECT
        xmlserialize(CONTENT '<a>  <b/>  </a>'::xml AS text) = '<a>  <b/>  </a>' AS content_keeps_whitespace,
        xmlserialize(DOCUMENT '<a><b>x</b></a>'::xml AS text) = '<a><b>x</b></a>' AS default_is_no_indent,
        xmlserialize(DOCUMENT '<a><b>x</b></a>'::xml AS text NO INDENT) = '<a><b>x</b></a>' AS explicit_no_indent,
        position(E'\n' in xmlserialize(DOCUMENT '<a><b>x</b></a>'::xml AS text INDENT)) > 0 AS indent_adds_newlines,
        xmlserialize(DOCUMENT '<a><b>x</b></a>'::xml AS character varying) = '<a><b>x</b></a>' AS varchar_target,
        xmlserialize(DOCUMENT '<a><b>x</b></a>'::xml AS character(30)) = '<a><b>x</b></a>' AS char_target,
        '<foo>bar</foo>'::xml::text = '<foo>bar</foo>' AS cast_to_text_keeps_original
    expect: rows
    order: multiset
    comment: NO INDENT and plain casts emit the original string; INDENT only adds layout
