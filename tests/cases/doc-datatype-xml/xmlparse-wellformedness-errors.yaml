# XMLPARSE checks well-formedness: a document must have one root element, content must be balanced.
id: doc-datatype-xml.xmlparse-wellformedness-errors
title: XMLPARSE and casts reject malformed input with invalid XML document or content errors
family: doc-datatype-xml
tier: core
feature_ids: [xml, xmlparse, wellformedness, errors]
required_capabilities: [select, xml, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-xml-creating (type checks input values for well-formedness)"
sessions: [a]
steps:
  - sql: |
      SELECT XMLPARSE (DOCUMENT 'abc<foo/>')
    expect: error
    sqlstate: "2200M"
    comment: a document must start with an element, not text
  - sql: |
      SELECT XMLPARSE (DOCUMENT '<a/><b/>')
    expect: error
    sqlstate: "2200M"
    comment: a document may have only one top-level element
  - sql: |
      SELECT XMLPARSE (CONTENT '<a>')
    expect: error
    sqlstate: "2200N"
    comment: unclosed element in content
  - sql: |
      SELECT '<a>'::xml
    expect: error
    sqlstate: "2200N"
    comment: the cast form applies the same well-formedness check
  - sql: |
      SELECT XMLPARSE (CONTENT 'abc<foo>bar</foo>') IS DOCUMENT AS still_fine
    expect: rows
    comment: a well-formed fragment after the failures still parses
