# XMLPARSE (DOCUMENT|CONTENT) and the xml literal / cast forms; IS DOCUMENT distinguishes documents from fragments.
id: doc-datatype-xml.xmlparse-document-content
title: XMLPARSE DOCUMENT and CONTENT, the xml literal and cast forms, and IS DOCUMENT classification
family: doc-datatype-xml
tier: core
feature_ids: [xml, xmlparse, xml-literal, is-document]
required_capabilities: [select, xml]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/datatype.sgml#datatype-xml-creating (XMLPARSE examples; xml '<foo>bar</foo>' and '<foo>bar</foo>'::xml)"
sessions: [a]
steps:
  - sql: |
      SELECT
        XMLPARSE (DOCUMENT '<?xml version="1.0"?><book><title>Manual</title><chapter>...</chapter></book>') IS DOCUMENT AS doc_example,
        XMLPARSE (CONTENT 'abc<foo>bar</foo><bar>foo</bar>') IS DOCUMENT AS content_example,
        xml '<foo>bar</foo>' IS DOCUMENT AS literal_form,
        '<foo>bar</foo>'::xml IS DOCUMENT AS cast_form
    expect: rows
    order: multiset
    comment: documented examples; the content fragment is not a document
