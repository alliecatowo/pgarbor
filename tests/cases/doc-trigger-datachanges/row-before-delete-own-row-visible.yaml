# Row-level BEFORE DELETE still sees its own row, and sees the rows that earlier firings of the same DELETE removed as gone.
id: doc-trigger-datachanges.row-before-delete-own-row-visible
title: Row-level BEFORE DELETE sees its own row and earlier row deletions of the same command
family: doc-trigger-datachanges
tier: core
feature_ids: [triggers, row-level-triggers, plpgsql, delete, visibility]
required_capabilities: [create-table, insert, select, delete, triggers, plpgsql, create-function]
provenance:
  source: pg-docs
  ref: "trigger.sgml#trigger-datachanges (row-level BEFORE trigger visibility for the change that fires it)"
sessions: [a]
setup: |
  CREATE TABLE t (id int PRIMARY KEY, v int NOT NULL);
  CREATE TABLE lg (seq serial, tag text, n int);
  INSERT INTO t VALUES (1, 10), (2, 20), (3, 30), (4, 40), (5, 50);
  CREATE FUNCTION rd_bef() RETURNS trigger LANGUAGE plpgsql AS $$
  BEGIN
    INSERT INTO lg(tag, n) VALUES ('rd_bef_own', (SELECT count(*) FROM t WHERE id = OLD.id));
    INSERT INTO lg(tag, n) VALUES ('rd_bef_total', (SELECT count(*) FROM t));
    RETURN OLD;
  END $$;
  CREATE TRIGGER trg_rd_bef BEFORE DELETE ON t FOR EACH ROW EXECUTE FUNCTION rd_bef();
steps:
  - sql: |
      DELETE FROM t WHERE id IN (1, 2, 3)
    expect: ok
  - sql: |
      SELECT tag, n FROM lg WHERE tag = 'rd_bef_own'
    expect: rows
    order: multiset
    comment: the row being deleted is still visible to each BEFORE firing
  - sql: |
      SELECT n FROM lg WHERE tag = 'rd_bef_total'
    expect: rows
    order: multiset
    comment: the total shrinks by one per earlier firing; the visit order is not predictable, so compare as a multiset
