# With IF EXISTS, a multi-name DROP TYPE skips missing names with a notice and drops the rest, including a repeated name.
id: cmd-drop-type.multi-name-if-exists-mixed
title: Multi-name DROP TYPE IF EXISTS drops the existing names and skips missing ones
family: cmd-drop-type
tier: core
feature_ids: [drop-type, drop-if-exists, create-type]
required_capabilities: [drop-type, create-type, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (IF EXISTS)"
sessions: [a]
setup: |
  CREATE TYPE m1 AS (a int4);
  CREATE TYPE m2 AS (a int4);
steps:
  - sql: |
      DROP TYPE IF EXISTS m1, no_such_type_here, m2
    expect: notice
    comment: notice for the missing name, both existing types are dropped
  - sql: |
      SELECT to_regtype('m1') IS NULL AND to_regtype('m2') IS NULL AS both_gone
    expect: rows
    order: ordered
  - sql: |
      CREATE TYPE dd AS (a int4)
    expect: ok
  - sql: |
      DROP TYPE dd, dd
    expect: ok
    comment: naming the same type twice is accepted
  - sql: |
      SELECT to_regtype('dd') IS NULL AS dd_gone
    expect: rows
    order: ordered
