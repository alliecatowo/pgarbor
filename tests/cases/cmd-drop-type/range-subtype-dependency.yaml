# A range type that uses a composite type as its subtype depends on it; RESTRICT refuses and CASCADE drops the range.
id: cmd-drop-type.range-subtype-dependency
title: DROP TYPE on a range subtype is refused until CASCADE drops the dependent range type
family: cmd-drop-type
tier: extended
feature_ids: [drop-type, cascade, range-types, create-type]
required_capabilities: [drop-type, create-type, range-types, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (CASCADE)"
sessions: [a]
setup: |
  CREATE TYPE rb AS (a int4);
  CREATE TYPE rr AS RANGE (subtype = rb);
steps:
  - sql: |
      DROP TYPE rb
    expect: error
    sqlstate: "2BP01"
    comment: the range type rr depends on rb
  - sql: |
      DROP TYPE rb CASCADE
    expect: ok
  - sql: |
      SELECT to_regtype('rr') IS NULL AS range_gone
    expect: rows
    order: ordered
