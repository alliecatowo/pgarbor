# DROP TYPE accepts a schema-qualified name and does not touch a same-named type in another schema.
id: cmd-drop-type.schema-qualified-name
title: DROP TYPE with a schema-qualified name drops only that schema's type
family: cmd-drop-type
tier: core
feature_ids: [drop-type, schemas, create-type, namespace]
required_capabilities: [drop-type, create-type, create-schema, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (name, optionally schema-qualified)"
sessions: [a]
setup: |
  CREATE SCHEMA dts;
  CREATE TYPE dts.st AS (a int4);
  CREATE TYPE st AS (a int4);
steps:
  - sql: |
      DROP TYPE dts.st
    expect: ok
  - sql: |
      SELECT to_regtype('dts.st') IS NULL AS schema_copy_gone, to_regtype('st') IS NOT NULL AS public_copy_kept
    expect: rows
    order: ordered
  - sql: |
      DROP TYPE st
    expect: ok
  - sql: |
      DROP SCHEMA dts
    expect: ok
