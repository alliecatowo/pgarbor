# IF EXISTS on a missing type, including a missing schema qualifier, succeeds and only issues a notice.
id: cmd-drop-type.if-exists-missing-notice
title: DROP TYPE IF EXISTS on a missing type or missing schema issues a notice and succeeds
family: cmd-drop-type
tier: core
feature_ids: [drop-type, drop-if-exists]
required_capabilities: [drop-type, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (IF EXISTS)"
sessions: [a]
steps:
  - sql: |
      DROP TYPE IF EXISTS no_such_type_here
    expect: notice
    comment: a notice is issued and the command succeeds
  - sql: |
      DROP TYPE IF EXISTS no_such_schema_here.no_such_type_here
    expect: notice
    comment: a missing schema qualifier is also skipped with a notice
  - sql: |
      SELECT to_regtype('no_such_type_here') IS NULL AS still_absent
    expect: rows
    order: ordered
