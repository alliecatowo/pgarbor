# A shell type (declared but not yet defined) is an ordinary user type to DROP TYPE, and repeated IF EXISTS is harmless.
id: cmd-drop-type.shell-type-drop
title: DROP TYPE removes a shell type, and IF EXISTS handles repeated names
family: cmd-drop-type
tier: extended
feature_ids: [drop-type, create-type, shell-types]
required_capabilities: [drop-type, create-type, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (Description)"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE shl
    expect: ok
  - sql: |
      DROP TYPE shl
    expect: ok
  - sql: |
      DROP TYPE IF EXISTS shl, shl
    expect: notice
    comment: the second drop of the same name is skipped with a notice
  - sql: |
      SELECT to_regtype('shl') IS NULL AS gone
    expect: rows
    order: ordered
