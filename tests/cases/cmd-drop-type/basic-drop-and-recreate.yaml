# DROP TYPE removes a user-defined type; the name is free afterwards and can be reused.
id: cmd-drop-type.basic-drop-and-recreate
title: DROP TYPE removes a user-defined enum and the name can be reused
family: cmd-drop-type
tier: core
feature_ids: [drop-type, create-type, enum]
required_capabilities: [drop-type, create-type, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (Description)"
sessions: [a]
steps:
  - sql: |
      CREATE TYPE mood AS ENUM ('sad', 'ok')
    expect: ok
  - sql: |
      SELECT to_regtype('mood') IS NOT NULL AS present
    expect: rows
    order: ordered
  - sql: |
      DROP TYPE mood
    expect: ok
  - sql: |
      SELECT to_regtype('mood') IS NULL AS gone
    expect: rows
    order: ordered
  - sql: |
      CREATE TYPE mood AS ENUM ('fresh')
    expect: ok
    comment: the name is free again
  - sql: |
      SELECT enumlabel FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid WHERE t.typname = 'mood' ORDER BY enumsortorder
    expect: rows
    order: ordered
