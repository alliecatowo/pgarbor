# The documented example DROP TYPE box fails on a fresh database: box is a built-in type required by the system.
id: cmd-drop-type.doc-example-box-system-type
title: Documented example DROP TYPE box is refused for a built-in type required by the system
family: cmd-drop-type
tier: core
feature_ids: [drop-type, builtin-types]
required_capabilities: [drop-type, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype-examples"
sessions: [a]
steps:
  - sql: |
      DROP TYPE box
    expect: error
    sqlstate: "2BP01"
    comment: box is a pinned system type; the doc example only makes sense for a user type named box
  - sql: |
      SELECT to_regtype('box') IS NOT NULL AS box_still_there
    expect: rows
    order: ordered
