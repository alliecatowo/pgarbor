# The implicit array type cannot be dropped alone; dropping the base type removes its array type too.
id: cmd-drop-type.array-type-requires-base
title: DROP TYPE on an implicit array type is refused and the base type drop removes it
family: cmd-drop-type
tier: core
feature_ids: [drop-type, arrays, enum]
required_capabilities: [drop-type, create-type, arrays, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (Description)"
sessions: [a]
setup: |
  CREATE TYPE mood AS ENUM ('a', 'b');
steps:
  - sql: |
      DROP TYPE _mood
    expect: error
    sqlstate: "2BP01"
    comment: the array type mood[] requires the base type mood
  - sql: |
      SELECT to_regtype('_mood') IS NOT NULL AS array_present
    expect: rows
    order: ordered
  - sql: |
      DROP TYPE mood
    expect: ok
  - sql: |
      SELECT to_regtype('_mood') IS NULL AS array_gone
    expect: rows
    order: ordered
