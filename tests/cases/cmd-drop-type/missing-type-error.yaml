# Without IF EXISTS a missing type is an error (42704); type names are folded to lower case unless quoted.
id: cmd-drop-type.missing-type-error
title: DROP TYPE on a missing type raises undefined_object, and unquoted names fold to lower case
family: cmd-drop-type
tier: core
feature_ids: [drop-type, identifiers, create-type]
required_capabilities: [drop-type, create-type, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (name)"
sessions: [a]
setup: |
  CREATE TYPE "MixedT" AS (a int4);
steps:
  - sql: |
      DROP TYPE no_such_type_here
    expect: error
    sqlstate: "42704"
  - sql: |
      DROP TYPE mixedt
    expect: error
    sqlstate: "42704"
    comment: the unquoted name folds to mixedt, which does not exist
  - sql: |
      DROP TYPE "MixedT"
    expect: ok
    comment: the quoted name matches exactly
  - sql: |
      SELECT to_regtype('"MixedT"') IS NULL AS gone
    expect: rows
    order: ordered
