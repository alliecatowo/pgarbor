# A domain is a type, so DROP TYPE removes it; built-in base types such as integer are protected.
id: cmd-drop-type.domain-is-a-type
title: DROP TYPE drops a domain, but a built-in type such as integer is refused
family: cmd-drop-type
tier: core
feature_ids: [drop-type, create-domain, builtin-types]
required_capabilities: [drop-type, create-domain, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (Description)"
sessions: [a]
steps:
  - sql: |
      CREATE DOMAIN dm AS int4
    expect: ok
  - sql: |
      DROP TYPE dm
    expect: ok
  - sql: |
      SELECT to_regtype('dm') IS NULL AS domain_gone
    expect: rows
    order: ordered
  - sql: |
      DROP TYPE int4
    expect: error
    sqlstate: "2BP01"
    comment: integer is required by the database system
