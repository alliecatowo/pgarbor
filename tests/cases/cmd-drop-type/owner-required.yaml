# Only the owner of a type can drop it; a non-owner role gets insufficient_privilege (42501) and the type survives.
id: cmd-drop-type.owner-required
title: DROP TYPE by a role that does not own the type is refused with insufficient privilege
family: cmd-drop-type
tier: core
feature_ids: [drop-type, roles, privileges, create-type]
required_capabilities: [drop-type, create-type, create-role, roles, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (Description)"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_dt_nonowner_case;
  CREATE TYPE ot AS (a int4);
steps:
  - sql: |
      SET ROLE pgarbor_dt_nonowner_case
    expect: ok
  - sql: |
      DROP TYPE ot
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      SELECT to_regtype('ot') IS NOT NULL AS still_there
    expect: rows
    order: ordered
  - sql: |
      DROP TYPE ot
    expect: ok
  - sql: |
      DROP ROLE pgarbor_dt_nonowner_case
    expect: ok
