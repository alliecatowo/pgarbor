# A table's row type cannot be dropped with DROP TYPE, even with CASCADE; the table must be dropped instead.
id: cmd-drop-type.table-rowtype-not-droppable
title: DROP TYPE on a table's row type is refused, including with CASCADE
family: cmd-drop-type
tier: core
feature_ids: [drop-type, create-table, cascade]
required_capabilities: [drop-type, create-table, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (Description)"
sessions: [a]
setup: |
  CREATE TABLE tr (a int4);
steps:
  - sql: |
      DROP TYPE tr
    expect: error
    sqlstate: "2BP01"
    comment: hint says to drop the table instead
  - sql: |
      DROP TYPE tr CASCADE
    expect: error
    sqlstate: "2BP01"
    comment: CASCADE does not override the table-requires-type rule
  - sql: |
      DROP TABLE tr
    expect: ok
  - sql: |
      SELECT to_regtype('tr') IS NULL AS gone
    expect: rows
    order: ordered
