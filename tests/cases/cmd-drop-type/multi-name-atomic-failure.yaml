# DROP TYPE with several names: one missing name without IF EXISTS fails the whole command, so no type is dropped.
id: cmd-drop-type.multi-name-atomic-failure
title: Multi-name DROP TYPE with one missing name drops nothing
family: cmd-drop-type
tier: core
feature_ids: [drop-type, create-type]
required_capabilities: [drop-type, create-type, select]
provenance:
  source: pg-docs
  ref: "ref/drop_type.sgml#sql-droptype (name [, ...])"
sessions: [a]
setup: |
  CREATE TYPE m1 AS (a int4);
  CREATE TYPE m2 AS (a int4);
steps:
  - sql: |
      DROP TYPE m1, no_such_type_here, m2
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT name, present FROM (VALUES ('m1', to_regtype('m1') IS NOT NULL), ('m2', to_regtype('m2') IS NOT NULL)) AS v(name, present) ORDER BY name
    expect: rows
    order: ordered
    comment: both m1 and m2 survive the failed command
