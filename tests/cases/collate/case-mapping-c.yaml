# lower/upper/initcap under explicit and column collations, plus constant folding of COLLATE comparisons.
id: collate.case-mapping-c
title: "lower, upper and initcap under C and POSIX collations, with constant comparisons"
family: collate
tier: core
feature_ids: [collation, string-functions, order-by, comparison]
required_capabilities: [create-table, insert, select, collation]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/collate.sql"
setup: |
  CREATE TABLE collate_test10 (a int, x text COLLATE "C", y text COLLATE "POSIX");
  INSERT INTO collate_test10 VALUES (1, 'hij', 'hij'), (2, 'HIJ', 'HIJ');
steps:
  - sql: |
      SELECT a, lower(x), lower(y), upper(x), upper(y), initcap(x), initcap(y) FROM collate_test10 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, lower(x COLLATE "C"), lower(y COLLATE "C") FROM collate_test10 ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, x, y FROM collate_test10 ORDER BY lower(y), a
    expect: rows
    order: ordered
  - sql: |
      SELECT 'bbc' COLLATE "C" > 'Abc' COLLATE "C" AS c_true, 'bbc' COLLATE "POSIX" < 'Abc' COLLATE "POSIX" AS c_false
    expect: rows
