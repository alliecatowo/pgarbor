# Aggregates take the collation of their arguments; ORDER BY inside an aggregate sorts by its own collation.
id: collate.aggregates-collation
title: "min, max, array_agg ordering and string_agg collation conflict"
family: collate
tier: core
feature_ids: [collation, aggregates, errors, order-by]
required_capabilities: [create-table, insert, select, collation, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/collate.sql"
setup: |
  CREATE TABLE collate_test1 (a int, b text COLLATE "C" NOT NULL);
  INSERT INTO collate_test1 VALUES (1, 'abc'), (2, 'Abc'), (3, 'bbc'), (4, 'ABD');
  CREATE TABLE collate_test10 (a int, x text COLLATE "C", y text COLLATE "POSIX");
  INSERT INTO collate_test10 VALUES (1, 'hij', 'hij'), (2, 'HIJ', 'HIJ');
steps:
  - sql: |
      SELECT min(b), max(b) FROM collate_test1
    expect: rows
    order: multiset
  - sql: |
      SELECT array_agg(b ORDER BY b) FROM collate_test1
    expect: rows
    order: multiset
  - sql: |
      SELECT array_agg(x COLLATE "C" ORDER BY y COLLATE "POSIX") FROM collate_test10
    expect: rows
    order: multiset
  - sql: |
      SELECT string_agg(x COLLATE "C", y COLLATE "POSIX") FROM collate_test10
    expect: error
    sqlstate: "42P21"
