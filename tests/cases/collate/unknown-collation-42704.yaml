# Naming a collation that does not exist is undefined_object, both in an expression and in DDL.
id: collate.unknown-collation-42704
title: "Unknown collation name raises undefined_object in expressions and DDL"
family: collate
tier: extended
feature_ids: [collation, errors, create-table]
required_capabilities: [create-table, select, collation]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/collate.sql"
steps:
  - sql: |
      SELECT 'a' COLLATE "no_such_collation_pgarbor"
    expect: error
    sqlstate: "42704"
  - sql: |
      CREATE TABLE uc (b text COLLATE "no_such_collation_pgarbor")
    expect: error
    sqlstate: "42704"
