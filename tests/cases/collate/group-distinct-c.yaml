# GROUP BY, DISTINCT and count(DISTINCT) under the C collation: case and empty string are distinct, NULL is its own group.
id: collate.group-distinct-c
title: "GROUP BY and DISTINCT under C collation keep case and NULL distinct"
family: collate
tier: core
feature_ids: [collation, group-by, aggregates, nulls, create-table, insert]
required_capabilities: [create-table, insert, select, collation, aggregates]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/collate.sql"
setup: |
  CREATE TABLE gd (b text COLLATE "C");
  INSERT INTO gd VALUES ('abc'), ('Abc'), ('abc'), (NULL), ('ABC'), ('');
steps:
  - sql: |
      SELECT b, count(*) FROM gd GROUP BY b ORDER BY b
    expect: rows
    order: ordered
  - sql: |
      SELECT count(DISTINCT b), count(b), count(*) FROM gd
    expect: rows
    order: multiset
  - sql: |
      SELECT DISTINCT b COLLATE "C" FROM gd WHERE b IS NOT NULL ORDER BY 1
    expect: rows
    order: ordered
