# COLLATE is only valid on collatable types; integer rejects it in an expression, a column and a domain.
id: collate.non-collatable-type-42804
title: "COLLATE on a non-collatable type raises datatype_mismatch"
family: collate
tier: core
feature_ids: [collation, errors, create-table, types]
required_capabilities: [create-table, select, collation]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/collate.sql"
steps:
  - sql: |
      SELECT 1 COLLATE "C"
    expect: error
    sqlstate: "42804"
  - sql: |
      CREATE TABLE collate_test_fail (a int COLLATE "C", b text)
    expect: error
    sqlstate: "42804"
  - sql: |
      SELECT 'x'::text COLLATE "C" AS still_works
    expect: rows
