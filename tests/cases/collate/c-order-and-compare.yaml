# Explicit and column-level "C" collation: comparisons, ORDER BY, and COLLATE overrides.
id: collate.c-order-and-compare
title: "C collation ordering and explicit COLLATE comparisons on a text column"
family: collate
tier: core
feature_ids: [collation, select, order-by, comparison, create-table, insert]
required_capabilities: [create-table, insert, select, collation]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/collate.sql"
setup: |
  CREATE TABLE collate_test1 (a int, b text COLLATE "C" NOT NULL);
  INSERT INTO collate_test1 VALUES (1, 'abc'), (2, 'Abc'), (3, 'bbc'), (4, 'ABD');
steps:
  - sql: |
      SELECT a FROM collate_test1 WHERE b COLLATE "C" >= 'abc' ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a FROM collate_test1 WHERE b >= 'abc' COLLATE "C" ORDER BY a
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM collate_test1 ORDER BY b
    expect: rows
    order: ordered
  - sql: |
      SELECT a, b FROM collate_test1 ORDER BY b COLLATE "C" DESC
    expect: rows
    order: ordered
  - sql: |
      SELECT 'bbc' COLLATE "C" > 'Abc' COLLATE "C" AS c_true
    expect: rows
