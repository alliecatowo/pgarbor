# Two different explicit collations on one comparison are a hard parse-time error.
id: collate.explicit-conflict-42p21
title: "Conflicting explicit collations in a comparison raise collation_mismatch"
family: collate
tier: core
feature_ids: [collation, errors, comparison]
required_capabilities: [create-table, insert, select, collation]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/collate.sql"
setup: |
  CREATE TABLE collate_test1 (a int, b text COLLATE "C" NOT NULL);
  INSERT INTO collate_test1 VALUES (1, 'abc'), (3, 'bbc');
steps:
  - sql: |
      SELECT a FROM collate_test1 WHERE b COLLATE "C" >= 'bbc' COLLATE "POSIX"
    expect: error
    sqlstate: "42p21"
  - sql: |
      SELECT 'a' COLLATE "C" < 'b' COLLATE "POSIX"
    expect: error
    sqlstate: "42p21"
  - sql: |
      SELECT a FROM collate_test1 WHERE b COLLATE "C" >= 'abc' COLLATE "C" ORDER BY a
    expect: rows
    order: ordered
