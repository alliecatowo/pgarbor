# ALTER FUNCTION ... SET SCHEMA moves the function; same-schema is a no-op; missing target schema
# and a clash with an existing function in the target schema are errors.
id: cmd-alter-function.set-schema-move
title: SET SCHEMA moves a function, no-op to same schema, errors for missing schema and clash
family: cmd-alter-function
tier: core
feature_ids: [alter-function, set-schema, schemas]
required_capabilities: [create-function, create-schema, alter-function, sql-functions, select]
provenance:
  source: pg-docs
  ref: "ref/alter_function.sgml#sql-alterfunction (Examples: SET SCHEMA maths; Parameters: new_schema)"
sessions: [a]
setup: |
  CREATE SCHEMA maths;
  CREATE FUNCTION sq(int) RETURNS int LANGUAGE sql AS 'SELECT $1 * $1';
  CREATE FUNCTION sq2(int) RETURNS int LANGUAGE sql AS 'SELECT $1 + 1000';
  CREATE FUNCTION maths.sq2(int) RETURNS int LANGUAGE sql AS 'SELECT $1 + 2000';
steps:
  - sql: |
      ALTER FUNCTION sq(integer) SET SCHEMA maths
    expect: ok
  - sql: |
      SELECT maths.sq(3) AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT sq(3) AS r
    expect: error
    sqlstate: "42883"
    comment: the function is no longer in the search path
  - sql: |
      ALTER FUNCTION maths.sq(integer) SET SCHEMA maths
    expect: ok
    comment: moving to the schema it already lives in succeeds without change
  - sql: |
      ALTER FUNCTION maths.sq(integer) SET SCHEMA nosuch_schema
    expect: error
    sqlstate: "3F000"
  - sql: |
      ALTER FUNCTION sq2(integer) SET SCHEMA maths
    expect: error
    sqlstate: "42723"
    comment: maths.sq2(integer) already exists
  - sql: |
      SELECT sq2(1) AS r
    expect: rows
    order: ordered
    comment: the failed move leaves public.sq2 in place
