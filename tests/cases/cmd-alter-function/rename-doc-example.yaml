# PG18 docs example: ALTER FUNCTION sqrt(integer) RENAME TO square_root. The function is created
# in setup because no sqrt(integer) exists in pg_catalog; the old name is then gone from public.
id: cmd-alter-function.rename-doc-example
title: RENAME TO with argument-list identity renames the function, old signature is gone
family: cmd-alter-function
tier: core
feature_ids: [alter-function, rename, function-identity]
required_capabilities: [create-function, alter-function, sql-functions, select, catalog-introspection]
provenance:
  source: pg-docs
  ref: "ref/alter_function.sgml#sql-alterfunction (Examples: rename sqrt to square_root)"
sessions: [a]
setup: |
  CREATE FUNCTION sqrt(integer) RETURNS integer LANGUAGE sql AS 'SELECT $1 * 2';
steps:
  - sql: |
      ALTER FUNCTION sqrt(integer) RENAME TO square_root
    expect: ok
  - sql: |
      SELECT square_root(4) AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT count(*) AS n FROM pg_proc WHERE proname = 'sqrt' AND pronamespace = 'public'::regnamespace
    expect: rows
    comment: the public.sqrt(integer) entry no longer exists under the old name
  - sql: |
      ALTER FUNCTION sqrt(integer) RENAME TO x
    expect: error
    sqlstate: "42883"
    comment: the old name no longer resolves for the argument list
