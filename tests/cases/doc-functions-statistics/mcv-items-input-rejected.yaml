# pg_mcv_list values cannot be typed in as literals; they only come from pg_statistic_ext_data.stxdmcv.
id: doc-functions-statistics.mcv-items-input-rejected
title: A literal cast to pg_mcv_list is rejected, so MCV values come only from stored statistics
family: doc-functions-statistics
tier: core
feature_ids: [pg-mcv-list-items, pg-mcv-list-type, error-handling]
required_capabilities: [select, extended-statistics, error-sqlstate]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-statistics-mcv"
sessions: [a]
steps:
  - sql: |
      SELECT index FROM pg_mcv_list_items('\x00'::pg_mcv_list)
    expect: error
    sqlstate: "0A000"
    comment: pg_mcv_list_in raises feature_not_supported; verified against PG18.6 mcv.c
