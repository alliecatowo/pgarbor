# pg_mcv_list_items is strict: a NULL pg_mcv_list argument produces no rows.
id: doc-functions-statistics.mcv-items-null-argument
title: pg_mcv_list_items with a NULL argument returns no rows
family: doc-functions-statistics
tier: core
feature_ids: [pg-mcv-list-items, null-semantics]
required_capabilities: [select, extended-statistics]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/func.sgml#functions-statistics-mcv"
sessions: [a]
steps:
  - sql: |
      SELECT count(*) FROM pg_mcv_list_items(NULL::pg_mcv_list)
    expect: rows
    order: ordered
  - sql: |
      SELECT index, values FROM pg_mcv_list_items(NULL::pg_mcv_list)
    expect: rows
    order: multiset
    comment: zero rows, the column list is still valid
