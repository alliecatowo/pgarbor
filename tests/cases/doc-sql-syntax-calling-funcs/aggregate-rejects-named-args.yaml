# Named and mixed notation cannot be used for aggregate calls (0A000); positional calls still work.
id: doc-sql-syntax-calling-funcs.aggregate-rejects-named-args
title: Aggregate calls reject named arguments with feature_not_supported
family: doc-sql-syntax-calling-funcs
tier: core
feature_ids: [create-aggregate, function-calls, named-notation, errors]
required_capabilities: [create-aggregate, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-mixed"
sessions: [a]
setup: |
  CREATE AGGREGATE agg_sum2(val int4) (sfunc = int4pl, stype = int4, initcond = '0');
steps:
  - sql: |
      SELECT agg_sum2(val => x) AS s FROM (VALUES (1), (2)) t(x)
    expect: error
    sqlstate: "0A000"
    comment: named notation on an aggregate
  - sql: |
      SELECT agg_sum2(x) AS s FROM (VALUES (1), (2)) t(x)
    expect: rows
    order: ordered
    comment: positional aggregate call
