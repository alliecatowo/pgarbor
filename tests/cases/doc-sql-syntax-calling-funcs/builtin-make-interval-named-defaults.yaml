# make_interval has every parameter defaulted to zero, so any subset may be named in any order.
id: doc-sql-syntax-calling-funcs.builtin-make-interval-named-defaults
title: Built-in make_interval with any subset of named parameters
family: doc-sql-syntax-calling-funcs
tier: extended
feature_ids: [function-calls, named-notation, default-arguments, interval]
required_capabilities: [select, interval]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-named"
sessions: [a]
steps:
  - sql: |
      SELECT make_interval(days => 3)::text AS i
    expect: rows
    order: ordered
  - sql: |
      SELECT make_interval(hours => 1, mins => 30)::text AS i
    expect: rows
    order: ordered
    comment: named subset in non-declaration order
  - sql: |
      SELECT make_interval()::text AS i
    expect: rows
    order: ordered
    comment: all defaults
