# Named arguments are coerced to the declared parameter type; an invalid literal fails with 22P02.
id: doc-sql-syntax-calling-funcs.named-coercion-boolean
title: Named argument literals coerce to the declared parameter type
family: doc-sql-syntax-calling-funcs
tier: extended
feature_ids: [create-function, function-calls, named-notation, type-coercion, errors]
required_capabilities: [create-function, select, default-arguments]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-named"
sessions: [a]
setup: |
  CREATE FUNCTION concat_lower_or_upper(a text, b text, uppercase boolean DEFAULT false)
  RETURNS text AS $$
    SELECT CASE WHEN $3 THEN UPPER($1 || ' ' || $2) ELSE LOWER($1 || ' ' || $2) END;
  $$ LANGUAGE SQL IMMUTABLE STRICT;
steps:
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World', uppercase => 'yes') AS r
    expect: rows
    order: ordered
    comment: unknown-type literal coerced to boolean
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World', uppercase => 'maybe') AS r
    expect: error
    sqlstate: "22P02"
