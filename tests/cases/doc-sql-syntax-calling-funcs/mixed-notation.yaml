# Mixed notation: positional arguments first, named arguments after them.
id: doc-sql-syntax-calling-funcs.mixed-notation
title: Mixed notation accepts positional arguments followed by named ones
family: doc-sql-syntax-calling-funcs
tier: core
feature_ids: [create-function, function-calls, mixed-notation, default-arguments]
required_capabilities: [create-function, select, default-arguments]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-mixed"
sessions: [a]
setup: |
  CREATE FUNCTION concat_lower_or_upper(a text, b text, uppercase boolean DEFAULT false)
  RETURNS text AS $$
    SELECT CASE WHEN $3 THEN UPPER($1 || ' ' || $2) ELSE LOWER($1 || ' ' || $2) END;
  $$ LANGUAGE SQL IMMUTABLE STRICT;
steps:
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World', uppercase => true) AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World', uppercase => false) AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT concat_lower_or_upper('Hello', b => 'World') AS r
    expect: rows
    order: ordered
    comment: second positional-style parameter supplied by name
