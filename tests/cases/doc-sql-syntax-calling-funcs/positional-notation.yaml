# Positional notation: arguments in declaration order; trailing parameters with defaults may be omitted.
id: doc-sql-syntax-calling-funcs.positional-notation
title: Positional calls honor argument order and omitted trailing defaults
family: doc-sql-syntax-calling-funcs
tier: core
feature_ids: [create-function, function-calls, default-arguments, positional-notation]
required_capabilities: [create-function, select, default-arguments]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-positional"
sessions: [a]
setup: |
  CREATE FUNCTION concat_lower_or_upper(a text, b text, uppercase boolean DEFAULT false)
  RETURNS text AS $$
    SELECT CASE WHEN $3 THEN UPPER($1 || ' ' || $2) ELSE LOWER($1 || ' ' || $2) END;
  $$ LANGUAGE SQL IMMUTABLE STRICT;
steps:
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World', true) AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World') AS r
    expect: rows
    order: ordered
    comment: omitted trailing parameter takes its default (false)
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World', false) AS r
    expect: rows
    order: ordered
