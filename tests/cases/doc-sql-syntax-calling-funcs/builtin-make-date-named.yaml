# make_date is a built-in with named parameters; named notation works in any order, mixed notation
# works, and a mandatory parameter omitted by name is an undefined-function error.
id: doc-sql-syntax-calling-funcs.builtin-make-date-named
title: Built-in make_date accepts named, reordered and mixed arguments
family: doc-sql-syntax-calling-funcs
tier: core
feature_ids: [function-calls, named-notation, mixed-notation, date, errors]
required_capabilities: [select, date]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-named"
sessions: [a]
steps:
  - sql: |
      SELECT make_date(year => 2024, month => 2, day => 29)::text AS d
    expect: rows
    order: ordered
  - sql: |
      SELECT make_date(day => 29, month => 2, year => 2024)::text AS d
    expect: rows
    order: ordered
  - sql: |
      SELECT make_date(2024, month => 2, day => 29)::text AS d
    expect: rows
    order: ordered
    comment: mixed notation on a built-in
  - sql: |
      SELECT make_date(year => 2024, month => 2)::text AS d
    expect: error
    sqlstate: "42883"
    comment: mandatory day missing
  - sql: |
      SELECT make_date(year => 2024, month => 2, day => 30) AS d
    expect: error
    sqlstate: "22008"
    comment: value out of range after named binding
