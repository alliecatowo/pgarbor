# Named notation: arguments matched by name, in any order; omitted defaulted parameters are implicit.
id: doc-sql-syntax-calling-funcs.named-notation-any-order
title: Named arguments bind by name in any order and may omit defaulted parameters
family: doc-sql-syntax-calling-funcs
tier: core
feature_ids: [create-function, function-calls, named-notation, default-arguments]
required_capabilities: [create-function, select, default-arguments]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-named"
sessions: [a]
setup: |
  CREATE FUNCTION concat_lower_or_upper(a text, b text, uppercase boolean DEFAULT false)
  RETURNS text AS $$
    SELECT CASE WHEN $3 THEN UPPER($1 || ' ' || $2) ELSE LOWER($1 || ' ' || $2) END;
  $$ LANGUAGE SQL IMMUTABLE STRICT;
steps:
  - sql: |
      SELECT concat_lower_or_upper(a => 'Hello', b => 'World') AS r
    expect: rows
    order: ordered
    comment: uppercase omitted, so false
  - sql: |
      SELECT concat_lower_or_upper(a => 'Hello', b => 'World', uppercase => true) AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT concat_lower_or_upper(a => 'Hello', uppercase => true, b => 'World') AS r
    expect: rows
    order: ordered
    comment: named arguments in a non-declaration order
  - sql: |
      SELECT concat_lower_or_upper(b => 'World', uppercase => false, a => 'Hello') AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT concat_lower_or_upper(uppercase => true, b => 'World', a => 'Hello') AS r
    expect: rows
    order: ordered
