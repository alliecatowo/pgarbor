# A STRICT function returns NULL when any argument is NULL, including a parameter that has a default.
id: doc-sql-syntax-calling-funcs.strict-null-semantics
title: STRICT function yields NULL for NULL arguments in both notations
family: doc-sql-syntax-calling-funcs
tier: core
feature_ids: [create-function, function-calls, named-notation, null-semantics, default-arguments]
required_capabilities: [create-function, select, default-arguments]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/syntax.sgml#sql-syntax-calling-funcs-named"
sessions: [a]
setup: |
  CREATE FUNCTION concat_lower_or_upper(a text, b text, uppercase boolean DEFAULT false)
  RETURNS text AS $$
    SELECT CASE WHEN $3 THEN UPPER($1 || ' ' || $2) ELSE LOWER($1 || ' ' || $2) END;
  $$ LANGUAGE SQL IMMUTABLE STRICT;
steps:
  - sql: |
      SELECT concat_lower_or_upper(NULL, 'World') IS NULL AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT concat_lower_or_upper('Hello', 'World', NULL) IS NULL AS r
    expect: rows
    order: ordered
    comment: explicit NULL overrides the default and is still strict
  - sql: |
      SELECT concat_lower_or_upper(a => NULL, b => 'World') IS NULL AS r
    expect: rows
    order: ordered
  - sql: |
      SELECT concat_lower_or_upper(a => 'x', b => 'y', uppercase => NULL) IS NULL AS r
    expect: rows
    order: ordered
    comment: NULL passed by name for a defaulted parameter
