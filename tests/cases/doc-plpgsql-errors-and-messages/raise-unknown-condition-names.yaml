# A condition name or SQLSTATE that is not in the documented list is rejected; five-digit codes not in the list are also rejected.
id: doc-plpgsql-errors-and-messages.raise-unknown-condition-names
title: RAISE rejects unknown condition names and malformed SQLSTATE codes with SQLSTATE 42704
family: doc-plpgsql-errors-and-messages
tier: core
feature_ids: [plpgsql, raise, sqlstate, condition-names, errors]
required_capabilities: [plpgsql, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-errors-and-messages"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN RAISE foo 'x'; END $$
    expect: error
    sqlstate: "42704"
    comment: a bare word that is not a known condition name is unrecognized
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'x' USING ERRCODE = 'bogus_name'; END $$
    expect: error
    sqlstate: "42704"
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'x' USING ERRCODE = 'ab000'; END $$
    expect: error
    sqlstate: "42704"
    comment: SQLSTATE codes must use upper-case letters, so lower-case ab000 is not recognized
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'x' USING ERRCODE = '2201'; END $$
    expect: error
    sqlstate: "42704"
    comment: SQLSTATE codes must be exactly five characters
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'x' USING ERRCODE = 'P0001'; END $$
    expect: error
    sqlstate: "P0001"
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'x' USING ERRCODE = '22012'; END $$
    expect: error
    sqlstate: "22012"
