# The format string replaces each % with the next argument; %% is a literal percent sign; NULL renders as <NULL>.
id: doc-plpgsql-errors-and-messages.raise-format-placeholders
title: RAISE format string substitutes % placeholders, %% emits a literal percent, and NULL arguments render as <NULL>
family: doc-plpgsql-errors-and-messages
tier: core
feature_ids: [plpgsql, raise, format-string, null-handling]
required_capabilities: [plpgsql, errors, select]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-errors-and-messages"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'Calling cs_create_job(%)', 42; END $$
    expect: notice
    comment: the documented example; % is replaced by the argument
  - sql: |
      DO $$ BEGIN RAISE NOTICE '100%% done, % left', 5; END $$
    expect: notice
    comment: "%% emits one literal percent sign"
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'pct %% and %', 'v'; END $$
    expect: notice
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'no args %%'; END $$
    expect: notice
    comment: with no arguments, %% still reduces to a single %
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'val: %', NULL; END $$
    expect: notice
    comment: a NULL argument is shown as <NULL>
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'concat: %', 'a' || NULL; END $$
    expect: notice
    comment: concatenating NULL yields NULL, which also renders as <NULL>
  - sql: |
      DO $$ BEGIN RAISE NOTICE '%', ARRAY[1,2]; END $$
    expect: notice
    comment: a non-text argument is converted to its text representation
