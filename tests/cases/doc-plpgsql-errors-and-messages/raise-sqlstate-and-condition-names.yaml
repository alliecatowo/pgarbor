# RAISE can name a SQLSTATE directly, use a condition name, or use ERRCODE; all forms set the same error code.
id: doc-plpgsql-errors-and-messages.raise-sqlstate-and-condition-names
title: RAISE condition names, SQLSTATE literals and ERRCODE options map to the documented error codes
family: doc-plpgsql-errors-and-messages
tier: core
feature_ids: [plpgsql, raise, sqlstate, condition-names, errors]
required_capabilities: [plpgsql, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-errors-and-messages"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN RAISE WARNING SQLSTATE '22012'; END $$
    expect: notice
    comment: with SQLSTATE and no message, the SQLSTATE text itself is the message
  - sql: |
      DO $$ BEGIN RAISE division_by_zero; END $$
    expect: error
    sqlstate: "22012"
    comment: a condition name without a message uses the condition name as the message
  - sql: |
      DO $$ BEGIN RAISE unique_violation; END $$
    expect: error
    sqlstate: "23505"
  - sql: |
      DO $$ BEGIN RAISE unique_violation USING MESSAGE = 'Duplicate user ID: ' || 9; END $$
    expect: error
    sqlstate: "23505"
    comment: the documented alternative to the ERRCODE form
  - sql: |
      DO $$ BEGIN RAISE 'Duplicate user ID: %', 9 USING ERRCODE = 'unique_violation'; END $$
    expect: error
    sqlstate: "23505"
  - sql: |
      DO $$ BEGIN RAISE 'Duplicate user ID: %', 9 USING ERRCODE = '23505'; END $$
    expect: error
    sqlstate: "23505"
    comment: a literal five-character SQLSTATE is equivalent to the condition name
  - sql: |
      DO $$ BEGIN RAISE SQLSTATE '22012' USING MESSAGE = 'via sqlstate'; END $$
    expect: error
    sqlstate: "22012"
