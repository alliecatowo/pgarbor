# RAISE levels: INFO/WARNING/NOTICE reach the client; DEBUG and LOG are suppressed at the default client_min_messages.
id: doc-plpgsql-errors-and-messages.raise-levels-client-visibility
title: RAISE INFO, WARNING and NOTICE reach the client while DEBUG and LOG stay hidden until client_min_messages is lowered
family: doc-plpgsql-errors-and-messages
tier: core
feature_ids: [plpgsql, raise, notices, guc]
required_capabilities: [plpgsql, errors, guc]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-errors-and-messages"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN RAISE INFO 'info-level'; RAISE WARNING 'warning-level'; RAISE NOTICE 'notice-level'; END $$
    expect: notice
    comment: INFO, WARNING and NOTICE are all reported to the client by default
  - sql: |
      DO $$ BEGIN RAISE DEBUG 'debug-level'; RAISE LOG 'log-level'; END $$
    expect: ok
    comment: DEBUG and LOG are written to the server log only, so the client sees no message
  - sql: |
      SET client_min_messages = debug1
    expect: ok
  - sql: |
      DO $$ BEGIN RAISE DEBUG 'debug %', 1; RAISE LOG 'log-now-visible'; END $$
    expect: notice
    comment: lowering client_min_messages to debug1 forwards DEBUG and LOG messages
  - sql: |
      RESET client_min_messages
    expect: ok
