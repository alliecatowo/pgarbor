# RAISE EXCEPTION accepts MESSAGE, HINT, DETAIL and related USING options and defaults to SQLSTATE P0001.
id: doc-plpgsql-errors-and-messages.raise-exception-using-options
title: RAISE EXCEPTION with USING MESSAGE, HINT, DETAIL and related-object options keeps the documented default SQLSTATE
family: doc-plpgsql-errors-and-messages
tier: core
feature_ids: [plpgsql, raise, exception, hint, detail]
required_capabilities: [plpgsql, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-errors-and-messages"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'Nonexistent ID --> %', 7 USING HINT = 'Please check your user ID'; END $$
    expect: error
    sqlstate: "P0001"
    comment: the documented HINT example; default SQLSTATE is raise_exception P0001
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'bad value' USING DETAIL = 'detail text', HINT = 'hint text'; END $$
    expect: error
    sqlstate: "P0001"
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION USING MESSAGE = 'message only'; END $$
    expect: error
    sqlstate: "P0001"
    comment: the USING-only form takes the message from MESSAGE
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION USING ERRCODE = 'invalid_parameter_value'; END $$
    expect: error
    sqlstate: "22023"
    comment: with no message, the condition name becomes the message text
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'x' USING COLUMN = 'c', TABLE = 't', SCHEMA = 's', CONSTRAINT = 'k', DATATYPE = 'd'; END $$
    expect: error
    sqlstate: "P0001"
    comment: related-object options are accepted; the message stays x
  - sql: |
      DO $$ BEGIN RAISE EXCEPTION 'x' USING ERRCODE = '22012', DETAIL = 'd1'; END $$
    expect: error
    sqlstate: "22012"
  - sql: |
      DO $$ BEGIN RAISE NOTICE 'with hint' USING HINT = 'h', DETAIL = 'd'; END $$
    expect: notice
    comment: the same options work with a non-error level
