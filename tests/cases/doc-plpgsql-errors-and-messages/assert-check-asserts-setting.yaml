# plpgsql.check_asserts (default on) turns ASSERT into a no-op when disabled.
id: doc-plpgsql-errors-and-messages.assert-check-asserts-setting
title: Setting plpgsql.check_asserts to off makes ASSERT a no-op, and turning it back on restores the failure
family: doc-plpgsql-errors-and-messages
tier: core
feature_ids: [plpgsql, assert, guc, error-messages]
required_capabilities: [plpgsql, errors, guc]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/plpgsql.sgml#plpgsql-errors-and-messages"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN ASSERT false, 'checked'; END $$
    expect: error
    sqlstate: "P0004"
    comment: the default is on
  - sql: |
      SET plpgsql.check_asserts = off
    expect: ok
  - sql: |
      DO $$ BEGIN ASSERT false, 'ignored'; RAISE NOTICE 'after assert'; END $$
    expect: notice
    comment: the failing assertion does nothing when checking is off
  - sql: |
      DO $$ BEGIN ASSERT NULL::boolean; END $$
    expect: ok
    comment: a NULL condition is also ignored when checking is off
  - sql: |
      RESET plpgsql.check_asserts
    expect: ok
  - sql: |
      DO $$ BEGIN ASSERT false, 'checked again'; END $$
    expect: error
    sqlstate: "P0004"
