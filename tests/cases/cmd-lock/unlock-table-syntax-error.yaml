# The docs state there is no UNLOCK TABLE. The statement is a syntax error (42601) that aborts the
# surrounding transaction; on PostgreSQL 18.6 the error itself releases the transaction's table
# locks, so another session can take the table before ROLLBACK.
id: cmd-lock.unlock-table-syntax-error
title: UNLOCK TABLE is not a command; its syntax error aborts the block and releases the lock
family: cmd-lock
tier: core
feature_ids: [lock-table, transactions, errors]
required_capabilities: [create-table, lock-table, transactions, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/lock.sgml#sql-lock (Description: no UNLOCK TABLE command)"
  license: PostgreSQL
sessions: [a, b]
setup: |
  CREATE TABLE t_unlock (a int4);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t_unlock IN ACCESS EXCLUSIVE MODE
    expect: ok
  - session: a
    sql: |
      UNLOCK TABLE t_unlock
    expect: error
    sqlstate: "42601"
  - session: b
    sql: |
      BEGIN
    expect: ok
    comment: LOCK TABLE outside a transaction block fails with 25P01, so session b opens one first
  - session: b
    sql: |
      LOCK TABLE t_unlock IN ACCESS SHARE MODE NOWAIT
    expect: ok
    comment: the syntax error already released a's ACCESS EXCLUSIVE lock; the aborted block still holds nothing
  - session: b
    sql: |
      ROLLBACK
    expect: ok
  - session: a
    sql: |
      ROLLBACK
    expect: ok
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t_unlock IN ACCESS SHARE MODE NOWAIT
    expect: ok
  - session: b
    sql: |
      ROLLBACK
    expect: ok
