# LOCK TABLE a, b is processed one table at a time in the order written. With NOWAIT, a failure on
# the second table aborts the transaction, and the error itself releases the first table's lock
# (verified on PostgreSQL 18.6): another session can take that table before the aborted block ends.
id: cmd-lock.list-nowait-failure-keeps-earlier-lock
title: "Multi-table LOCK with NOWAIT: failure on the second table releases the first table lock at the error"
family: cmd-lock
tier: core
feature_ids: [lock-table, lock-modes, nowait, transactions, multi-session, errors]
required_capabilities: [create-table, lock-table, transactions, multi-session, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/lock.sgml#sql-lock (Parameters: name, NOWAIT)"
  license: PostgreSQL
sessions: [a, b]
setup: |
  CREATE TABLE t_list1 (a int4);
  CREATE TABLE t_list2 (a int4);
steps:
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t_list2 IN EXCLUSIVE MODE
    expect: ok
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t_list1, t_list2 IN ACCESS EXCLUSIVE MODE NOWAIT
    expect: error
    sqlstate: "55P03"
    comment: t_list1 is locked first, then t_list2 fails
  - session: a
    sql: |
      SELECT 1
    expect: error
    sqlstate: "25P02"
  - session: b
    sql: |
      LOCK TABLE t_list1 IN ACCESS SHARE MODE NOWAIT
    expect: ok
    comment: the error released a's ACCESS EXCLUSIVE lock on t_list1 before ROLLBACK, so b is granted
  - session: a
    sql: |
      ROLLBACK
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t_list1 IN ACCESS SHARE MODE NOWAIT
    expect: ok
  - session: b
    sql: |
      ROLLBACK
    expect: ok
