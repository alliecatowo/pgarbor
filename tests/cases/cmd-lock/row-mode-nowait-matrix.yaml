# ROW SHARE conflicts only with EXCLUSIVE and ACCESS EXCLUSIVE. Probes with NOWAIT against an
# open ROW SHARE holder show which requested modes are refused. Each refusal aborts that
# transaction, so session b rolls back and begins again before each probe.
id: cmd-lock.row-mode-nowait-matrix
title: ROW SHARE holder refuses EXCLUSIVE but admits ROW EXCLUSIVE under NOWAIT
family: cmd-lock
tier: core
feature_ids: [lock-table, lock-modes, nowait, transactions, multi-session]
required_capabilities: [create-table, lock-table, transactions, multi-session, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/lock.sgml#sql-lock (lockmode, NOWAIT); explicit-locking table-level conflicts"
  license: PostgreSQL
sessions: [a, b]
setup: |
  CREATE TABLE t_matrix (a int4);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t_matrix IN ROW SHARE MODE
    expect: ok
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t_matrix IN EXCLUSIVE MODE NOWAIT
    expect: error
    sqlstate: "55P03"
  - session: b
    sql: |
      ROLLBACK
    expect: ok
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t_matrix IN ROW EXCLUSIVE MODE NOWAIT
    expect: ok
  - session: b
    sql: |
      ROLLBACK
    expect: ok
  - session: a
    sql: |
      COMMIT
    expect: ok
