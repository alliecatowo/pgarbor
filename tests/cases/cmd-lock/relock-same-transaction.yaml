# A transaction never conflicts with its own table locks. After ACCESS EXCLUSIVE, weaker modes
# are granted to the same transaction, while another session is refused until COMMIT.
id: cmd-lock.relock-same-transaction
title: A transaction's own locks never conflict; other sessions are refused until commit
family: cmd-lock
tier: core
feature_ids: [lock-table, lock-modes, nowait, transactions, multi-session]
required_capabilities: [create-table, lock-table, transactions, multi-session, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/lock.sgml#sql-lock (Description: own locks never conflict)"
  license: PostgreSQL
sessions: [a, b]
setup: |
  CREATE TABLE t_self (a int4);
steps:
  - session: a
    sql: |
      BEGIN
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t_self IN ACCESS EXCLUSIVE MODE
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t_self IN ACCESS SHARE MODE NOWAIT
    expect: ok
  - session: a
    sql: |
      LOCK TABLE t_self IN ROW EXCLUSIVE MODE NOWAIT
    expect: ok
  - session: b
    sql: |
      BEGIN
    expect: ok
    comment: LOCK TABLE outside a transaction block fails with 25P01, so session b opens one first
  - session: b
    sql: |
      LOCK TABLE t_self IN ROW SHARE MODE NOWAIT
    expect: error
    sqlstate: "55P03"
  - session: b
    sql: |
      ROLLBACK
    expect: ok
  - session: a
    sql: |
      COMMIT
    expect: ok
  - session: b
    sql: |
      BEGIN
    expect: ok
  - session: b
    sql: |
      LOCK TABLE t_self IN ROW SHARE MODE NOWAIT
    expect: ok
  - session: b
    sql: |
      ROLLBACK
    expect: ok
