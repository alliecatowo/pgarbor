# Every lockmode in the synopsis is accepted, with and without the optional TABLE keyword, and
# keyword case does not matter. The default mode (no IN ... MODE clause) is ACCESS EXCLUSIVE.
id: cmd-lock.all-lock-mode-spellings
title: All eight lock modes parse; TABLE keyword optional; default mode is ACCESS EXCLUSIVE
family: cmd-lock
tier: core
feature_ids: [lock-table, lock-modes, transactions]
required_capabilities: [create-table, lock-table, transactions]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/lock.sgml#sql-lock (Synopsis; Parameters: lockmode)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t_modes (a int4);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      LOCK t_modes IN ACCESS SHARE MODE
    expect: ok
  - sql: |
      LOCK TABLE t_modes IN ROW SHARE MODE
    expect: ok
  - sql: |
      lock table t_modes in row exclusive mode
    expect: ok
  - sql: |
      LOCK TABLE t_modes IN SHARE UPDATE EXCLUSIVE MODE
    expect: ok
  - sql: |
      LOCK TABLE t_modes IN SHARE MODE
    expect: ok
  - sql: |
      LOCK TABLE t_modes IN SHARE ROW EXCLUSIVE MODE
    expect: ok
  - sql: |
      LOCK TABLE t_modes IN EXCLUSIVE MODE
    expect: ok
  - sql: |
      LOCK TABLE t_modes IN ACCESS EXCLUSIVE MODE
    expect: ok
  - sql: |
      LOCK TABLE t_modes
    expect: ok
    comment: default mode is ACCESS EXCLUSIVE; a re-lock in the same transaction does not conflict
  - sql: |
      SELECT count(*) FROM t_modes
    expect: rows
  - sql: |
      ROLLBACK
    expect: ok
