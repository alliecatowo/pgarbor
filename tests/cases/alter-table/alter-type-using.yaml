# ALTER COLUMN TYPE with USING converts each row; NULL stays NULL and the new type is usable in expressions.
id: alter-table.alter-type-using
title: ALTER COLUMN TYPE with USING converts text to int4 row by row, preserving NULL
family: alter-table
tier: core
feature_ids: [alter-table, alter-column-type, using-clause, numeric, text]
required_capabilities: [create-table, alter-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_table.sql (ALTER COLUMN TYPE ... USING)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v text);
  INSERT INTO t VALUES (1, '12'), (2, NULL), (3, '7');
steps:
  - sql: |
      ALTER TABLE t ALTER COLUMN v TYPE int4 USING v::int4
    expect: ok
  - sql: |
      SELECT id, v, v + 1 AS v_plus_one, v IS NULL AS v_null FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT sum(v) AS total, count(v) AS non_null FROM t
    expect: rows
    order: multiset
    comment: sum ignores NULL; count(v) counts only non-NULL values
