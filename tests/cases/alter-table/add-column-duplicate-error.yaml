# Adding a column whose name already exists, or collides with a system column, fails with 42701 and changes nothing.
id: alter-table.add-column-duplicate-error
title: ADD COLUMN duplicate and system-column name collisions raise 42701
family: alter-table
tier: core
feature_ids: [alter-table, add-column, errors]
required_capabilities: [create-table, alter-table, insert, select, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_table.sql (ADD COLUMN xmin fails)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE attmp (initial int4);
  INSERT INTO attmp VALUES (7);
steps:
  - sql: |
      ALTER TABLE attmp ADD COLUMN initial int4
    expect: error
    sqlstate: "42701"
  - sql: |
      ALTER TABLE attmp ADD COLUMN xmin integer
    expect: error
    sqlstate: "42701"
    comment: xmin is a system column name
  - sql: |
      SELECT initial FROM attmp
    expect: rows
    order: multiset
    comment: table is unchanged by the failed statements
