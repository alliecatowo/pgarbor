# SET DEFAULT affects only later INSERTs; the DEFAULT keyword picks it up; DROP DEFAULT restores NULL.
id: alter-table.set-default-insert
title: ALTER COLUMN SET DEFAULT applies to later inserts and DEFAULT keyword; DROP DEFAULT yields NULL
family: alter-table
tier: extended
feature_ids: [alter-table, column-default, insert, null-semantics]
required_capabilities: [create-table, alter-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_table.sql (SET DEFAULT / DROP DEFAULT section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE t (id int4, v int4);
  INSERT INTO t VALUES (0, 100);
steps:
  - sql: |
      ALTER TABLE t ALTER COLUMN v SET DEFAULT 7
    expect: ok
  - sql: |
      INSERT INTO t (id) VALUES (1)
    expect: ok
  - sql: |
      INSERT INTO t VALUES (2, DEFAULT)
    expect: ok
  - sql: |
      INSERT INTO t VALUES (3, NULL)
    expect: ok
    comment: explicit NULL overrides the default
  - sql: |
      ALTER TABLE t ALTER COLUMN v DROP DEFAULT
    expect: ok
  - sql: |
      INSERT INTO t (id) VALUES (4)
    expect: ok
  - sql: |
      SELECT id, v, v IS NULL AS v_null FROM t ORDER BY id
    expect: rows
    order: ordered
