# ADD COLUMN with a constant default: existing rows read the default; new rows without the column get NULL.
id: alter-table.add-column-default
title: ADD COLUMN with DEFAULT backfills existing rows; untyped ADD COLUMN gives NULL
family: alter-table
tier: slice
feature_ids: [alter-table, add-column, column-default, insert, select]
required_capabilities: [create-table, alter-table, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/alter_table.sql (add attribute section)"
  license: PostgreSQL
sessions: [a]
setup: |
  CREATE TABLE attmp (initial int4);
  INSERT INTO attmp VALUES (1), (2);
steps:
  - sql: |
      ALTER TABLE attmp ADD COLUMN a int4 DEFAULT 3
    expect: ok
  - sql: |
      ALTER TABLE attmp ADD COLUMN c text
    expect: ok
  - sql: |
      INSERT INTO attmp (initial, c) VALUES (3, NULL), (4, 'x')
    expect: ok
  - sql: |
      INSERT INTO attmp (initial) VALUES (5)
    expect: ok
  - sql: |
      SELECT initial, a, c FROM attmp ORDER BY initial
    expect: rows
    order: ordered
    comment: a is 3 for every pre-existing row and for the row inserted without a; c is NULL where unset
