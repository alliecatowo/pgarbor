# ADD COLUMN NOT NULL without a default fails on a non-empty table; with a default it succeeds and backfills.
id: alter-table.add-column-not-null-nonempty
title: ADD COLUMN NOT NULL without default fails on non-empty table (23502); with default succeeds
family: alter-table
tier: core
feature_ids: [alter-table, add-column, not-null, column-default]
required_capabilities: [create-table, alter-table, insert, select, errors]
provenance:
  source: hand
  ref: "PG18 sql-altertable.html ADD COLUMN; errcode 23502 not_null_violation"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
  INSERT INTO t VALUES (1), (2);
steps:
  - sql: |
      ALTER TABLE t ADD COLUMN b int4 NOT NULL
    expect: error
    sqlstate: "23502"
  - sql: |
      ALTER TABLE t ADD COLUMN b int4 NOT NULL DEFAULT 0
    expect: ok
  - sql: |
      SELECT id, b FROM t ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      INSERT INTO t (id) VALUES (3)
    expect: ok
  - sql: |
      SELECT id, b FROM t ORDER BY id
    expect: rows
    order: ordered
