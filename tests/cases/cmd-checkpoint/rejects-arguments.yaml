# CHECKPOINT takes no parameters; the documented synopsis is just CHECKPOINT.
id: cmd-checkpoint.rejects-arguments
title: CHECKPOINT with trailing words is a syntax error
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, syntax-errors]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Synopsis: CHECKPOINT)"
sessions: [a]
steps:
  - sql: |
      CHECKPOINT FULL
    expect: error
    sqlstate: "42601"
  - sql: |
      CHECKPOINT ALL
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
    order: ordered
