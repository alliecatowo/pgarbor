# In one simple-query message each CHECKPOINT yields its own command result alongside other statements.
id: cmd-checkpoint.multi-statement-results
title: Several CHECKPOINT statements in one simple query each produce a result
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, simple-query]
required_capabilities: [select]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description)"
sessions: [a]
steps:
  - sql: |
      CHECKPOINT; SELECT 1 AS one; CHECKPOINT; SELECT 2 AS two
    expect: ok
    comment: four StatementResults, in order
