# CHECKPOINT forces a checkpoint and returns the CHECKPOINT command tag without changing data.
id: cmd-checkpoint.basic-command-tag
title: CHECKPOINT returns the CHECKPOINT tag, is case-insensitive, and leaves data intact
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, insert, select]
required_capabilities: [create-table, insert, select]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, name text);
  INSERT INTO t VALUES (1, 'one'), (2, NULL);
steps:
  - sql: |
      CHECKPOINT
    expect: ok
    comment: command tag CHECKPOINT, no result rows
  - sql: |
      checkpoint;
      checkpoint
    expect: ok
    comment: keyword is case-insensitive; repeated checkpoints are allowed
  - sql: |
      SELECT id, name FROM t ORDER BY id
    expect: rows
    order: ordered
