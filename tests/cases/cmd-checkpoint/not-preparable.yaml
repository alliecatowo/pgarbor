# PREPARE accepts only SELECT, VALUES, INSERT, UPDATE, DELETE and MERGE; CHECKPOINT is rejected.
id: cmd-checkpoint.not-preparable
title: CHECKPOINT cannot be wrapped in PREPARE
family: cmd-checkpoint
tier: extended
feature_ids: [checkpoint, prepare]
required_capabilities: [select, errors]
provenance:
  source: pg-docs
  ref: "ref/prepare.sgml (Description: allowed statement types); ref/checkpoint.sgml"
sessions: [a]
steps:
  - sql: |
      PREPARE cmdchk_p AS CHECKPOINT
    expect: error
    sqlstate: "42601"
  - sql: |
      SELECT 1 AS still_usable
    expect: rows
