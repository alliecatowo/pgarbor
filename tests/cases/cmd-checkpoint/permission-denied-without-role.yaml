# Only superusers or members with the privileges of pg_checkpoint may run CHECKPOINT.
id: cmd-checkpoint.permission-denied-without-role
title: A plain role without pg_checkpoint cannot run CHECKPOINT
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, roles, privileges]
required_capabilities: [roles, errors]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description: pg_checkpoint)"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE pgarbor_cmdchk_nobody NOLOGIN
    expect: ok
  - sql: |
      SET ROLE pgarbor_cmdchk_nobody
    expect: ok
  - sql: |
      CHECKPOINT
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP ROLE pgarbor_cmdchk_nobody
    expect: ok
