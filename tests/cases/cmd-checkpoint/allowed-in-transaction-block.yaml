# CHECKPOINT is a utility command that is not barred inside a transaction block; its effects
# follow the transaction (here the insert commits, the rolled-back insert does not).
id: cmd-checkpoint.allowed-in-transaction-block
title: CHECKPOINT runs inside an explicit transaction block and does not end it
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, transactions, insert, select]
required_capabilities: [create-table, insert, select, transactions]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY);
steps:
  - sql: |
      BEGIN;
      INSERT INTO t VALUES (1);
      CHECKPOINT;
      INSERT INTO t VALUES (2);
      COMMIT
    expect: ok
    comment: multi-statement simple query; transaction state persists across CHECKPOINT
  - sql: |
      BEGIN;
      INSERT INTO t VALUES (3);
      CHECKPOINT;
      ROLLBACK
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: rows 1 and 2 only
