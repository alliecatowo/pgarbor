# Membership in the pg_checkpoint predefined role is what authorizes CHECKPOINT for a non-superuser.
id: cmd-checkpoint.granted-via-pg-checkpoint
title: A role granted pg_checkpoint can run CHECKPOINT; revoking it removes the right
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, roles, privileges, predefined-roles]
required_capabilities: [roles, errors]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description: pg_checkpoint); ref/predefined-roles"
sessions: [a]
steps:
  - sql: |
      CREATE ROLE pgarbor_cmdchk_ckpt NOLOGIN
    expect: ok
  - sql: |
      GRANT pg_checkpoint TO pgarbor_cmdchk_ckpt
    expect: ok
  - sql: |
      SET ROLE pgarbor_cmdchk_ckpt
    expect: ok
  - sql: |
      CHECKPOINT
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      REVOKE pg_checkpoint FROM pgarbor_cmdchk_ckpt
    expect: ok
  - sql: |
      SET ROLE pgarbor_cmdchk_ckpt
    expect: ok
  - sql: |
      CHECKPOINT
    expect: error
    sqlstate: "42501"
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP ROLE pgarbor_cmdchk_ckpt
    expect: ok
