# CHECKPOINT through the unnamed extended-query path (as drivers send it) completes with no rows.
id: cmd-checkpoint.extended-protocol-exec
title: CHECKPOINT via an unnamed extended-protocol statement with no parameters
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, extended-protocol]
required_capabilities: [select, extended-protocol]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description)"
sessions: [a]
steps:
  - exec_params:
      sql: CHECKPOINT
      params: []
    expect: ok
  - exec_params:
      sql: SELECT 1 AS one
      params: []
    expect: rows
    order: ordered
