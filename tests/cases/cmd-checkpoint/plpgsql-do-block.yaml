# CHECKPOINT is an ordinary SQL statement that PL/pgSQL executes inside a DO block, including via EXECUTE.
id: cmd-checkpoint.plpgsql-do-block
title: CHECKPOINT runs inside a DO block directly and through EXECUTE
family: cmd-checkpoint
tier: extended
feature_ids: [checkpoint, plpgsql, do-block]
required_capabilities: [select, plpgsql]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint; ref/do.sgml"
sessions: [a]
steps:
  - sql: |
      DO $$ BEGIN CHECKPOINT; END $$
    expect: ok
  - sql: |
      DO $$ BEGIN EXECUTE 'CHECKPOINT'; END $$
    expect: ok
  - sql: |
      SELECT 'after' AS marker
    expect: rows
    order: ordered
