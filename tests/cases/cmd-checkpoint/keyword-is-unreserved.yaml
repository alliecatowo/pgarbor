# CHECKPOINT is an unreserved keyword: it is a valid identifier, and bare in an expression it is a
# column reference, not a command.
id: cmd-checkpoint.keyword-is-unreserved
title: CHECKPOINT can be used as a table and column name; bare in SELECT it is a column reference
family: cmd-checkpoint
tier: extended
feature_ids: [checkpoint, keywords, create-table, insert, select]
required_capabilities: [create-table, insert, select, errors]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Synopsis); Appendix SQL Key Words"
sessions: [a]
steps:
  - sql: |
      CREATE TABLE checkpoint (checkpoint int4);
      INSERT INTO checkpoint VALUES (7)
    expect: ok
  - sql: |
      SELECT checkpoint FROM checkpoint
    expect: rows
    order: ordered
  - sql: |
      SELECT CHECKPOINT
    expect: error
    sqlstate: "42703"
    comment: no column named checkpoint exists in the FROM-less select
