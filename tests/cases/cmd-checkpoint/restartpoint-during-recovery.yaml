# Documented behavior: CHECKPOINT run during recovery (e.g. on a hot standby) forces a restartpoint
# rather than writing a checkpoint record. Needs a standby topology; cannot run in one database.
id: cmd-checkpoint.restartpoint-during-recovery
title: CHECKPOINT during recovery forces a restartpoint instead of a checkpoint
family: cmd-checkpoint
tier: extended
feature_ids: [checkpoint, recovery, restartpoint]
required_capabilities: [select, replication]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description: recovery)"
sessions: [a]
steps:
  - sql: |
      CHECKPOINT
    expect: ok
quarantine:
  reason: "requires a hot standby in recovery mode; not expressible in a single isolated database"
  since: "2026-10-15"
