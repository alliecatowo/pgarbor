# In an aborted transaction block every command except transaction control is rejected, CHECKPOINT
# included; ROLLBACK then restores normal operation.
id: cmd-checkpoint.failed-transaction-rejects
title: CHECKPOINT inside a failed transaction block is rejected with 25P02
family: cmd-checkpoint
tier: core
feature_ids: [checkpoint, transactions, errors]
required_capabilities: [select, transactions, errors]
provenance:
  source: pg-docs
  ref: "ref/checkpoint.sgml#sql-checkpoint (Description)"
sessions: [a]
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      SELECT 1/0
    expect: error
    sqlstate: "22012"
  - sql: |
      CHECKPOINT
    expect: error
    sqlstate: "25P02"
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      CHECKPOINT
    expect: ok
