# Omitting WITH CHECK keeps the existing check: after replacing USING, inserts are still checked
# against the original WITH CHECK expression.
id: cmd-alter-policy.using-only-keeps-check
title: "ALTER POLICY USING alone replaces visibility but keeps WITH CHECK"
family: cmd-alter-policy
tier: core
feature_ids: [alter-policy, rls, policies, insert, errors]
required_capabilities: [create-table, insert, select, rls, roles]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_policy.sgml#sql-alterpolicy (clauses are replaced independently)"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_ap_uo;
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  INSERT INTO t VALUES (1, 1), (2, 5), (3, 10), (4, NULL);
  GRANT SELECT, INSERT ON t TO pgarbor_case_ap_uo;
  CREATE POLICY p ON t TO pgarbor_case_ap_uo USING (v > 3) WITH CHECK (v < 8);
  ALTER TABLE t ENABLE ROW LEVEL SECURITY;
steps:
  - sql: |
      SET ROLE pgarbor_case_ap_uo
    expect: ok
    comment: superusers bypass RLS, so the policy is enforced for a plain role
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: only rows with v > 3 are visible
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      ALTER POLICY p ON t USING (v > 0)
    expect: ok
  - sql: |
      SET ROLE pgarbor_case_ap_uo
    expect: ok
  - sql: |
      SELECT id FROM t ORDER BY id
    expect: rows
    order: ordered
    comment: the new USING makes rows 1 to 3 visible; the NULL row is still hidden
  - sql: |
      INSERT INTO t VALUES (5, 9)
    expect: error
    sqlstate: "42501"
    comment: the original WITH CHECK (v < 8) still applies
  - sql: |
      INSERT INTO t VALUES (6, 7)
    expect: ok
  - sql: |
      RESET ROLE
    expect: ok
  - sql: |
      DROP OWNED BY pgarbor_case_ap_uo; DROP ROLE pgarbor_case_ap_uo
    expect: ok
    comment: drop the cluster-global case role so a retry can recreate it
