# A role named in a policy's TO list is a dependency: DROP ROLE fails with 2BP01 until the policy no longer names it.
id: cmd-alter-policy.role-dependency-blocks-drop
title: "A role named by ALTER POLICY TO blocks DROP ROLE until the policy changes"
family: cmd-alter-policy
tier: extended
feature_ids: [alter-policy, policies, roles, dependency, errors]
required_capabilities: [create-table, rls, roles]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_policy.sgml#sql-alterpolicy (role_name)"
sessions: [a]
setup: |
  CREATE ROLE pgarbor_case_ap_dep;
  CREATE TABLE t (id int4, v int4);
  CREATE POLICY p ON t USING (true);
steps:
  - sql: |
      ALTER POLICY p ON t TO pgarbor_case_ap_dep
    expect: ok
  - sql: |
      DROP ROLE pgarbor_case_ap_dep
    expect: error
    sqlstate: "2BP01"
    comment: the policy depends on the role
  - sql: |
      ALTER POLICY p ON t TO PUBLIC
    expect: ok
  - sql: |
      DROP ROLE pgarbor_case_ap_dep
    expect: ok
    comment: no dependency remains
