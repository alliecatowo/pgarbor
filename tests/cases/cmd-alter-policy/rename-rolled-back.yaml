# ALTER POLICY is transactional: a RENAME inside a transaction is visible to that transaction,
# disappears on ROLLBACK, and persists on COMMIT.
id: cmd-alter-policy.rename-rolled-back
title: "ALTER POLICY RENAME inside a transaction is undone by ROLLBACK and kept by COMMIT"
family: cmd-alter-policy
tier: core
feature_ids: [alter-policy, rename, transactions, catalog-introspection]
required_capabilities: [create-table, select, rls, transactions, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_policy.sgml#sql-alterpolicy; doc/src/sgml/ref/rollback.sgml"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE POLICY pa ON t USING (v > 0);
steps:
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      ALTER POLICY pa ON t RENAME TO pz
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 't' ORDER BY policyname
    expect: rows
    order: ordered
    comment: the renamed policy is visible inside the transaction
  - sql: |
      ROLLBACK
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 't' ORDER BY policyname
    expect: rows
    order: ordered
    comment: the rename was rolled back
  - sql: |
      BEGIN
    expect: ok
  - sql: |
      ALTER POLICY pa ON t RENAME TO pz
    expect: ok
  - sql: |
      COMMIT
    expect: ok
  - sql: |
      SELECT policyname FROM pg_policies WHERE tablename = 't' ORDER BY policyname
    expect: rows
    order: ordered
    comment: the committed rename persists
