# ALTER POLICY ... RENAME TO changes only the name; the other policy properties are kept.
id: cmd-alter-policy.rename-keeps-definition
title: "ALTER POLICY RENAME TO keeps USING and WITH CHECK and frees the old name"
family: cmd-alter-policy
tier: core
feature_ids: [alter-policy, rename, policies, catalog-introspection]
required_capabilities: [create-table, select, rls, catalog-introspection]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/alter_policy.sgml#sql-alterpolicy (RENAME TO synopsis form)"
sessions: [a]
setup: |
  CREATE TABLE t (id int4 PRIMARY KEY, v int4);
  CREATE POLICY p1 ON t USING (v > 0) WITH CHECK (v < 100);
steps:
  - sql: |
      ALTER POLICY p1 ON t RENAME TO p1x
    expect: ok
  - sql: |
      SELECT policyname, permissive, cmd, qual, with_check FROM pg_policies WHERE tablename = 't' ORDER BY policyname
    expect: rows
    order: ordered
    comment: the name changed while the expressions and the permissive/ALL attributes did not
  - sql: |
      ALTER POLICY p1 ON t RENAME TO p2
    expect: error
    sqlstate: "42704"
    comment: the old name no longer exists
  - sql: |
      ALTER POLICY p1x ON t USING (v > 5)
    expect: ok
    comment: the new name is used for further changes
  - sql: |
      SELECT policyname, qual, with_check FROM pg_policies WHERE tablename = 't' ORDER BY policyname
    expect: rows
    order: ordered
    comment: USING was replaced, WITH CHECK was left alone
  - sql: |
      DROP POLICY p1x ON t
    expect: ok
  - sql: |
      SELECT count(*) FROM pg_policies WHERE tablename = 't'
    expect: rows
