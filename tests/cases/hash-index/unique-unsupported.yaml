# Hash indexes do not support uniqueness: CREATE UNIQUE INDEX ... USING hash fails with 0A000 and creates nothing.
id: hash-index.unique-unsupported
title: CREATE UNIQUE INDEX USING hash is rejected with feature_not_supported
family: hash-index
tier: core
feature_ids: [hash-index, unique-index, errors, catalog-introspection]
required_capabilities: [create-table, create-index, errors, catalog-introspection]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE uq (k int4);
steps:
  - sql: |
      CREATE UNIQUE INDEX uq_k ON uq USING hash (k)
    expect: error
    sqlstate: "0A000"
  - sql: |
      SELECT count(*) FROM pg_indexes WHERE tablename = 'uq'
    expect: rows
    order: multiset
    comment: no index was created
