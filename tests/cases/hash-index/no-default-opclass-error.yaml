# xml has no hash operator class, so a hash index on an xml column fails with 42704.
id: hash-index.no-default-opclass-error
title: Hash index on an xml column fails with undefined_object for missing operator class
family: hash-index
tier: core
feature_ids: [hash-index, create-index, xml, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE xt (doc xml);
steps:
  - sql: |
      CREATE INDEX xt_doc ON xt USING hash (doc)
    expect: error
    sqlstate: "42704"
  - sql: |
      SELECT count(*) FROM xt
    expect: rows
    order: multiset
