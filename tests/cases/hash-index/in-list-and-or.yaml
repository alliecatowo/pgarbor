# IN lists, OR chains and = ANY over a hash-indexed column return the same rows as the equivalent predicates.
id: hash-index.in-list-and-or
title: IN, OR and ANY predicates over a hash-indexed column return matching rows
family: hash-index
tier: core
feature_ids: [hash-index, select, arrays]
required_capabilities: [create-table, create-index, insert, select, arrays]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE hi (k int4, v text);
  CREATE INDEX hi_k ON hi USING hash (k);
  INSERT INTO hi SELECT g, 'v' || g FROM generate_series(1, 10) g;
steps:
  - sql: |
      SELECT k, v FROM hi WHERE k IN (2, 5, 99) ORDER BY k
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM hi WHERE k = 3 OR k = 7 ORDER BY k
    expect: rows
    order: ordered
  - sql: |
      SELECT k FROM hi WHERE k = ANY (ARRAY[1, 10]) ORDER BY k
    expect: rows
    order: ordered
