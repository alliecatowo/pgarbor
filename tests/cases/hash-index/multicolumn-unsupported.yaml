# Hash indexes are single-column only: a two-column hash index fails with 0A000.
id: hash-index.multicolumn-unsupported
title: Multicolumn hash index is rejected with feature_not_supported
family: hash-index
tier: core
feature_ids: [hash-index, create-index, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE mc (a int4, b int4);
steps:
  - sql: |
      CREATE INDEX mc_ab ON mc USING hash (a, b)
    expect: error
    sqlstate: "0A000"
  - sql: |
      CREATE INDEX mc_a ON mc USING hash (a)
    expect: ok
    comment: a single-column index with the same column still works after the failure
