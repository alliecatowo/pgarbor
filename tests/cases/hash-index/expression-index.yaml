# Hash index on an expression, lower(name): equality on the same expression finds case-folded matches.
id: hash-index.expression-index
title: Hash index on lower(name) serves equality on the same expression
family: hash-index
tier: core
feature_ids: [hash-index, expression-index, text, select]
required_capabilities: [create-table, create-index, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE ex (id int4, name text);
  CREATE INDEX ex_lower ON ex USING hash (lower(name));
  INSERT INTO ex VALUES (1, 'Alpha'), (2, 'ALPHA'), (3, 'beta'), (4, NULL);
steps:
  - sql: |
      SELECT id FROM ex WHERE lower(name) = 'alpha' ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM ex WHERE lower(name) = 'gamma' ORDER BY id
    expect: rows
    order: ordered
    comment: no match
