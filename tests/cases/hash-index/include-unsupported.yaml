# INCLUDE columns are not supported on hash indexes: 0A000.
id: hash-index.include-unsupported
title: CREATE INDEX with INCLUDE on a hash index is rejected with feature_not_supported
family: hash-index
tier: core
feature_ids: [hash-index, create-index, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE inc (a int4, b int4);
steps:
  - sql: |
      CREATE INDEX inc_a ON inc USING hash (a) INCLUDE (b)
    expect: error
    sqlstate: "0A000"
