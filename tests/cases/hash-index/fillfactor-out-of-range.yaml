# Hash index fillfactor must be within 10..100; values outside fail with 22023 and the index is not created.
id: hash-index.fillfactor-out-of-range
title: Out-of-range fillfactor on a hash index fails with invalid_parameter_value
family: hash-index
tier: core
feature_ids: [hash-index, create-index, reloptions, errors]
required_capabilities: [create-table, create-index, errors]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE f8 (random float8);
steps:
  - sql: |
      CREATE INDEX f8_low ON f8 USING hash (random float8_ops) WITH (fillfactor = 9)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE INDEX f8_high ON f8 USING hash (random float8_ops) WITH (fillfactor = 101)
    expect: error
    sqlstate: "22023"
  - sql: |
      CREATE INDEX f8_ok ON f8 USING hash (random float8_ops) WITH (fillfactor = 60)
    expect: ok
