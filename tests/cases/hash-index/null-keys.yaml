# NULL keys are never equal to anything through a hash index; IS NULL still finds them.
id: hash-index.null-keys
title: NULL hash keys never match equality and are found only by IS NULL
family: hash-index
tier: core
feature_ids: [hash-index, nulls, select]
required_capabilities: [create-table, create-index, insert, select]
provenance:
  source: pg-regress
  ref: "src/test/regress/sql/hash_index.sql"
setup: |
  CREATE TABLE hn (id int4, k int4);
  CREATE INDEX hn_k ON hn USING hash (k);
  INSERT INTO hn VALUES (1, NULL), (2, 5), (3, NULL), (4, 5);
steps:
  - sql: |
      SELECT id FROM hn WHERE k = NULL
    expect: rows
    order: multiset
    comment: comparison with NULL is never true
  - sql: |
      SELECT id FROM hn WHERE k IS NULL ORDER BY id
    expect: rows
    order: ordered
  - sql: |
      SELECT id FROM hn WHERE k = 5 ORDER BY id
    expect: rows
    order: ordered
