# default_table_access_method selects a custom TABLE access method for CREATE TABLE without a USING clause.
id: cmd-create-access-method.default-table-access-method
title: default_table_access_method routes CREATE TABLE without USING to a custom table access method
family: cmd-create-access-method
tier: extended
feature_ids: [create-access-method, table-access-method, guc, create-table]
required_capabilities: [create-access-method, table-access-method, create-table, guc, select]
provenance:
  source: hand
  ref: "doc/src/sgml/ref/create_access_method.sgml#sql-create-access-method (access methods of TYPE TABLE are used by CREATE TABLE); GUC default_table_access_method, verified against PG18.6 oracle"
sessions: [a]
setup: |
  CREATE ACCESS METHOD dflt_am TYPE TABLE HANDLER heap_tableam_handler;
steps:
  - sql: |
      SET default_table_access_method = dflt_am
    expect: ok
  - sql: |
      CREATE TABLE t_dflt (id int4)
    expect: ok
  - sql: |
      RESET default_table_access_method
    expect: ok
  - sql: |
      CREATE TABLE t_heap (id int4)
    expect: ok
  - sql: |
      SELECT c.relname, am.amname FROM pg_class c JOIN pg_am am ON am.oid = c.relam WHERE c.relname IN ('t_dflt', 't_heap') ORDER BY c.relname
    expect: rows
    order: ordered
