# The documented example: CREATE ACCESS METHOD heptree TYPE INDEX HANDLER heptree_handler. The handler is
# registered as an internal-language alias of an existing index handler so the example runs without C code.
id: cmd-create-access-method.index-am-doc-heptree
title: Documented heptree example defines an index access method with an index_am_handler
family: cmd-create-access-method
tier: core
feature_ids: [create-access-method, index-access-method, index-am-handler]
required_capabilities: [create-access-method, index-access-method, create-function-internal]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_access_method.sgml#sql-create-access-method (Examples: create index access method heptree with handler heptree_handler)"
sessions: [a]
setup: |
  CREATE FUNCTION heptree_handler(internal) RETURNS index_am_handler LANGUAGE internal AS 'hashhandler';
steps:
  - sql: |
      CREATE ACCESS METHOD heptree TYPE INDEX HANDLER heptree_handler
    expect: ok
  - sql: |
      SELECT amname, amtype, amhandler::regproc AS handler FROM pg_am WHERE amname = 'heptree'
    expect: rows
    order: ordered
    comment: amtype 'i' marks an index access method; the handler is recorded by name
  - reconnect: true
  - sql: |
      SELECT amname, amtype FROM pg_am WHERE amname = 'heptree'
    expect: rows
    order: ordered
