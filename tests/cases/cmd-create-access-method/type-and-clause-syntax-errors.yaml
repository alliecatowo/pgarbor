# The grammar requires exactly one TYPE clause (TABLE or INDEX) and exactly one HANDLER clause, in that shape.
id: cmd-create-access-method.type-and-clause-syntax-errors
title: TYPE must be TABLE or INDEX and both TYPE and HANDLER are required once each
family: cmd-create-access-method
tier: core
feature_ids: [create-access-method, syntax, errors]
required_capabilities: [create-access-method, errors]
provenance:
  source: pg-docs
  ref: "doc/src/sgml/ref/create_access_method.sgml#sql-create-access-method (Synopsis; Parameters: access_method_type TABLE and INDEX are the only supported types)"
sessions: [a]
steps:
  - sql: |
      CREATE ACCESS METHOD x_seq TYPE SEQUENCE HANDLER heap_tableam_handler
    expect: error
    sqlstate: "42601"
    comment: SEQUENCE is not a supported access method type
  - sql: |
      CREATE ACCESS METHOD x_notype HANDLER heap_tableam_handler
    expect: error
    sqlstate: "42601"
    comment: TYPE clause is required
  - sql: |
      CREATE ACCESS METHOD x_nohandler TYPE TABLE
    expect: error
    sqlstate: "42601"
    comment: HANDLER clause is required
  - sql: |
      CREATE ACCESS METHOD x_twice TYPE TABLE HANDLER heap_tableam_handler HANDLER heap_tableam_handler
    expect: error
    sqlstate: "42601"
    comment: HANDLER may appear only once
  - sql: |
      SELECT count(*) FROM pg_am WHERE amname LIKE 'x\_%'
    expect: rows
    order: ordered
