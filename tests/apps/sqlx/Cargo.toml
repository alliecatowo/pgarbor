[package]
name = "sqlx-fixture"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "sqlx-fixture"
path = "src/main.rs"

[dependencies]
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json", "rust_decimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rust_decimal = "1"
