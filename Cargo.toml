[workspace]
resolver = "3"
members = [
  "crates/pgarbor-common",
  "crates/pgarbor-storage",
  "crates/pgarbor-fault",
  "crates/pgarbor-branches",
  "crates/pgarbor-types",
  "crates/pgarbor-catalog",
  "crates/pgarbor-core",
  "crates/pgarbor-sql",
  "crates/pgarbor-plan",
  "crates/pgarbor-exec",
  "crates/pgarbor",
  "crates/pgarbor-wire",
  "crates/pgarbor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/alliecatowo/pgarbor"
rust-version = "1.97"

[workspace.dependencies]
pgarbor-common = { path = "crates/pgarbor-common" }
pgarbor-storage = { path = "crates/pgarbor-storage" }
pgarbor-fault = { path = "crates/pgarbor-fault" }
pgarbor-branches = { path = "crates/pgarbor-branches" }
pgarbor-types = { path = "crates/pgarbor-types" }
pgarbor-catalog = { path = "crates/pgarbor-catalog" }
pgarbor-core = { path = "crates/pgarbor-core" }
pgarbor-sql = { path = "crates/pgarbor-sql" }
pgarbor-plan = { path = "crates/pgarbor-plan" }
pgarbor-exec = { path = "crates/pgarbor-exec" }
pgarbor = { path = "crates/pgarbor" }
pgarbor-wire = { path = "crates/pgarbor-wire" }
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
bigdecimal = "=0.4.11"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision"] }
crc32c = "=0.6.8"
uuid = { version = "=1.28.0", features = ["v4"] }
fs2 = "=0.4.3"
clap = { version = "=4.6.7", features = ["derive"] }
proptest = "=1.12.0"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
md-5 = "0.10"
pbkdf2 = "0.12"
libc = "0.2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
